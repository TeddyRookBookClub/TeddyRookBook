# PaperMod settings
[params]
  menugroups = ["Education", "Business", "Games", "Miscellaneous"]
  author = "Teddy Rook"
  description = "Infographics on great books and big ideas, Koine Greek and Latin lessons, and history games. A free resource for readers and book clubs."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ["img/share.jpg"]   # default link-preview image (X, iMessage, etc.)

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004225"      # British Racing Green
# The home page also writes /index.json, the site-search index.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Infographic images are also mounted as assets so Hugo can crop link-preview pictures from them.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img/infographics"
    target = "assets/infographics"
