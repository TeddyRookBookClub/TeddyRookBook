[params]
  menugroups = ["Education", "Games", "Miscellaneous", "Business"]
  author = "Teddy Rook"
  description = "Free learning for every age: infographics on great books and big ideas, homeschool lessons from classic schoolbooks, Koine Greek and Latin, science simulations, life skills and the trades, and games."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ["img/share.jpg"]   # default link-preview image (X, iMessage, etc.)

  # each group's own page of tiles (clicking the group name in the menu goes here)
  [params.menugroupurls]
    Education = "/education/"
    Business = "/business/"
    Games = "/games/"
    Miscellaneous = "/miscellaneous/"

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004225"      # British Racing Green
# The home page also writes /index.json, the site-search index.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Infographic images are also mounted as assets so Hugo can crop link-preview pictures from them.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img/infographics"
    target = "assets/infographics"

# Build segments: `hugo --renderSegments math` renders only the Math Ladder pages (for fast test builds).
[segments]
  [segments.math]
    [[segments.math.includes]]
      path = '{/math,/math/**}'
  [segments.lab]
    [[segments.lab.includes]]
      path = '{/science-lab,/science-lab/**}'
  [segments.garden]
    [[segments.garden.includes]]
      path = '{/garden,/garden/**}'
  [segments.ladders]
    [[segments.ladders.includes]]
      path = '{/math,/math/**,/physics,/physics/**,/chemistry,/chemistry/**,/economics,/economics/**,/earth-and-space,/earth-and-space/**}'
  [segments.physics]
    [[segments.physics.includes]]
      path = '{/physics,/physics/**}'
  [segments.chemistry]
    [[segments.chemistry.includes]]
      path = '{/chemistry,/chemistry/**}'
  [segments.economics]
    [[segments.economics.includes]]
      path = '{/economics,/economics/**}'
  [segments.earth]
    [[segments.earth.includes]]
      path = '{/earth-and-space,/earth-and-space/**}'
  [segments.music]
    [[segments.music.includes]]
      path = '{/music,/music/**}'
