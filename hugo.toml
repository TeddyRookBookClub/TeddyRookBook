baseURL = "https://teddyrookbook.com/"
title = "Teddy Rook Book"
theme = "PaperMod"
languageCode = "en"
enableRobotsTXT = true
defaultContentLanguage = "en"

# Appearance
summaryLength = 30

[pagination]
  pagerSize = 10

# Menu: the first five show in the bar; entries with params.more go under "More".
[[menu.main]]
name = "Infographics"
url = "/infographics/"
weight = 1

[[menu.main]]
name = "Languages"
url = "/languages/"
weight = 2

[[menu.main]]
name = "Games"
url = "/games/"
weight = 3

[[menu.main]]
name = "Library"
url = "/books/"
weight = 4

[[menu.main]]
name = "Free Books"
url = "/free-books/"
weight = 5

[[menu.main]]
name = "Timeline"
url = "/timeline/"
weight = 6
[menu.main.params]
more = true
note = "The ancient world, era by era"

[[menu.main]]
name = "Reading Paths"
url = "/books/paths/"
weight = 7
[menu.main.params]
more = true
note = "Guided routes through the Library"

[[menu.main]]
name = "My Progress"
url = "/progress/"
weight = 8
[menu.main.params]
more = true
note = "Words met in games, save or load progress"

[[menu.main]]
name = "What's New"
url = "/new/"
weight = 9
[menu.main.params]
more = true
note = "Latest infographics, games and tools"

[[menu.main]]
name = "Markets"
url = "/markets/"
weight = 10
[menu.main.params]
more = true
note = "Charts, indicators and calculators"

[[menu.main]]
name = "Resources"
url = "/resources/"
weight = 11
[menu.main.params]
more = true
note = "Free resources elsewhere"

[[menu.main]]
name = "PhotoCraft"
url = "/photocraft/"
weight = 12
[menu.main.params]
more = true
note = "Free image editor in your browser"

# PaperMod settings
[params]
  author = "Teddy Rook"
  description = "Infographics on great books and big ideas, Koine Greek and Latin lessons, and history games. A free resource for readers and book clubs."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ["img/share.jpg"]   # default link-preview image (X, iMessage, etc.)

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004225"      # British Racing Green
# The home page also writes /index.json, the site-search index.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Infographic images are also mounted as assets so Hugo can crop link-preview pictures from them.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img/infographics"
    target = "assets/infographics"
