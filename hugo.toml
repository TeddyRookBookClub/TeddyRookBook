baseURL = "https://teddyrookbookclub.com/"
title = "Teddy Rook Book"
theme = "PaperMod"
languageCode = "en"
defaultContentLanguage = "en"

# Appearance
summaryLength = 30

[pagination]
  pagerSize = 10

# Menu
[[menu.main]]
name = "Library"
url = "/books/"
weight = 1

[[menu.main]]
name = "Infographics"
url = "/infographics/"
weight = 2

# PaperMod settings
[params]
  author = "Teddy Rook"
  description = "A personal library catalog, reading notes on the Great Books, and infographics about books and ideas."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004C2A"      # British Racing Green