baseURL = "https://teddyrookbook.com/"
title = "Teddy Rook Book"
theme = "PaperMod"
languageCode = "en"
enableRobotsTXT = true
defaultContentLanguage = "en"

# Appearance
summaryLength = 30

[pagination]
  pagerSize = 10

# Menu
[[menu.main]]
name = "Library"
url = "/books/"
weight = 4

[[menu.main]]
name = "Infographics"
url = "/infographics/"
weight = 1

[[menu.main]]
name = "Languages"
url = "/languages/"
weight = 2

[[menu.main]]
name = "Games"
url = "/games/"
weight = 3

[[menu.main]]
name = "Resources"
url = "/resources/"
weight = 6

[[menu.main]]
name = "Markets"
url = "/markets/"
weight = 5

# PaperMod settings
[params]
  author = "Teddy Rook"
  description = "Infographics on great books and big ideas, Koine Greek and Latin lessons, and history games. A free resource for readers and book clubs."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ["img/share.jpg"]   # default link-preview image (X, iMessage, etc.)

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004C2A"      # British Racing Green