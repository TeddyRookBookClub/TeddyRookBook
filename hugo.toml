baseURL = "https://teddyrookbookclub.com/"
title = "Teddy Rook Book"
theme = "PaperMod"
languageCode = "en"
enableRobotsTXT = true
defaultContentLanguage = "en"

# Appearance
summaryLength = 30

[pagination]
  pagerSize = 10

# Menu
[[menu.main]]
name = "Library"
url = "/books/"
weight = 1

[[menu.main]]
name = "Infographics"
url = "/infographics/"
weight = 2

[[menu.main]]
name = "Languages"
url = "/languages/"
weight = 3

[[menu.main]]
name = "Games"
url = "/games/"
weight = 4

[[menu.main]]
name = "Markets"
url = "/markets/"
weight = 5

# PaperMod settings
[params]
  author = "Teddy Rook"
  description = "Infographics on great books and big ideas, Koine Greek and Latin lessons, and history games. A free resource for readers and book clubs."
  defaultTheme = "auto"        # light/dark/auto
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # Branding colors — British Racing Green
  [params.style]
    mainColor = "#004C2A"      # British Racing Green