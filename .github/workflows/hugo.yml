name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild on weekdays so the Markets pages get fresh economic data from FRED
  schedule:
    - cron: "17 13 * * 1-5"
    - cron: "47 21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Download economic data (FRED)
        run: python3 scripts/fetch_market_data.py
        continue-on-error: true

      - name: Build
        run: hugo --minify

      # Other sites frame /embed/… (data/embed.json); fail the deploy if a documented embed address or example breaks.
      - name: Check embeds
        run: node scripts/embed/check-embeds.js public

      # Lists every file of each section with a fingerprint, for /offline/ and the download kit's updater.
      - name: Offline manifests
        run: node scripts/offline/build-manifests.js public

      - name: Add CNAME for custom domain
        run: echo "teddyrookbook.com" > public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
