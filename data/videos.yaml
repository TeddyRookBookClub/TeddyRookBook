IAxxfABk6Fc:
  slug: greek-and-latin-with-jerome
  title: "Greek and Latin with Jerome: Reading the New Testament"
  about: "Read the Greek New Testament and the Latin Vulgate side by side, word by word, with Saint Jerome: 124 passages in Bible order, each read in Greek, then Latin, then English, then taken apart word by word. Along the way you meet the 345 most common words of each New Testament, which make up more than three of every four words in it."
  date: 2026-10-13
  length: "3 hr 47 min"
  topics: [Languages, Bible]
  chapters:
    - ["0:00", "Introduction"]
    - ["1:34", "Matthew"]
    - ["16:58", "Mark"]
    - ["1:05:05", "Luke"]
    - ["2:09:43", "John"]
    - ["2:50:52", "Acts"]
    - ["2:58:49", "Romans"]
    - ["3:02:28", "1 Corinthians"]
    - ["3:04:21", "2 Corinthians"]
    - ["3:05:35", "Galatians"]
    - ["3:12:11", "Ephesians"]
    - ["3:13:57", "Philippians"]
    - ["3:16:34", "2 Thessalonians"]
    - ["3:18:36", "1 Timothy"]
    - ["3:23:41", "Hebrews"]
    - ["3:31:03", "James"]
    - ["3:33:35", "1 Peter"]
    - ["3:35:38", "1 John"]
    - ["3:42:47", "Revelation"]
    - ["3:46:59", "Closing and credits"]
  notes:
    - "Pronunciation is shown under every word: Erasmian for the Greek, and classical for the Latin (v sounds like w). Every passage was checked so that its Latin follows the same Greek text; where Latin simply says a thing its own way, Jerome points it out."
    - "Two counters in the corner track the core words as you meet them. Names are not counted."
  credits:
    - "Greek text: The Greek New Testament: SBL Edition (SBLGNT), edited by Michael W. Holmes, © 2010 Society of Biblical Literature and Logos Bible Software, CC BY 4.0. Text-critical signs were removed for display. The publishers do not endorse this video."
    - "Greek word analysis: MorphGNT: SBLGNT Edition, edited by James K. Tauber, CC BY-SA 3.0."
    - "Latin text: the Clementine Vulgate (1592), electronic edition of the Clementine Text Project. Public domain."
    - "Latin dictionary forms and vowel lengths: Collatinus, by Yves Ouvrard and Philippe Verkerk (Biblissima), GNU GPL v3, corrected by hand where needed."
    - "English: an original literal translation made for the video. Voices: Kokoro-82M text-to-speech."
  companion:
    title: "Free study companion"
    about: "Everything the video teaches, to read at your own pace: the 124 passages with pronunciation, English and a note on every word; the 345 most common Greek and 345 most common Latin words with every form; and a practice set after each part, with answers. Read it on this site page by page, or download the whole book."
    url: "/languages/jerome/"
    pdf: "/pdfs/Greek-and-Latin-with-Jerome-Study-Companion.pdf"
    pdf_size: "439 pages, 2 MB"
