# American History & Civics Ladder courses, bottom rung to top rung (the order of this list is the ladder).
# Contract: /tmp/briefs/ladders_spec.md and /tmp/briefs/mathladder_spec.md section 3; brief /tmp/briefs/civics_design.md.
# Skill maps: data/civics/topics/<key>.json. Design notes and conventions for course builders: /tmp/work_civics/overview.md.
- key: usyoung
  slug: young-learners
  title: "American History for Young Learners"
  short: "Young Learners"
  band: "Elementary"
  grade: "K–3"
  icon: "🦅"
  color: "#b23a48"
  blurb: "For ages 5 to 9, read aloud with a grown-up: the flag and other symbols, holidays and why we keep them, the first Americans, the Pilgrims and the colonies, Washington, Lincoln, pioneers, inventors, and the rules and helpers in our own town."
  after: []
- key: ush1
  slug: us-history-1
  title: "U.S. History I: Beginnings to 1877"
  short: "U.S. History I"
  band: "High school"
  grade: "8–11"
  icon: "🪶"
  color: "#1f4e79"
  blurb: "Native America and the first contacts, the thirteen colonies, the Revolution, the Constitution, the early republic, expansion, slavery and the coming of the Civil War, the war itself and Reconstruction. Covers AP U.S. History Periods 1 to 5."
  after: [usyoung]
- key: ush2
  slug: us-history-2
  title: "U.S. History II: 1865 to 2000"
  short: "U.S. History II"
  band: "High school"
  grade: "8–12"
  icon: "🚂"
  color: "#14213d"
  blurb: "The Gilded Age and the West, empire and the Progressive Era, two world wars, the Depression and the New Deal, the Cold War, the civil rights movement and the last decades of the century. Covers AP U.S. History Periods 6 to 9."
  after: [ush1]
- key: gov
  slug: civics-and-government
  title: "Civics and Government"
  short: "Civics"
  band: "High school"
  grade: "9–12"
  icon: "🗳️"
  color: "#8a5a00"
  blurb: "How American government works: the founding ideas, the Constitution article by article, federalism, Congress, the presidency and the courts, rights and liberties, citizenship, elections and parties, and state, local and tribal government. Foundations for AP U.S. Government and Politics and practice for the citizenship test."
  after: [ush1]
- key: law
  slug: intro-to-law
  title: "Introduction to Law and Legal Reasoning"
  short: "Intro to Law"
  band: "College"
  grade: "College"
  icon: "⚖️"
  color: "#5b4636"
  blurb: "Where law comes from, common law and precedent, the court system, how to read and brief a case, statutory interpretation and its schools, and standing and other limits on courts. A college and first-year law course; educational, not legal advice."
  after: [gov]
- key: conlaw1
  slug: constitutional-law-1
  title: "Constitutional Law I: Structure"
  short: "Con Law I"
  band: "College"
  grade: "College"
  icon: "🏛️"
  color: "#4a3f73"
  blurb: "Judicial review, the powers of Congress (commerce, taxing and spending, necessary and proper), federalism and state sovereignty, the dormant commerce clause, separation of powers and executive power, taught through the leading cases. Law school level; educational, not legal advice."
  after: [law]
- key: conlaw2
  slug: constitutional-law-2
  title: "Constitutional Law II: Rights"
  short: "Con Law II"
  band: "College"
  grade: "College"
  icon: "📜"
  color: "#6b2d3a"
  blurb: "Incorporation and state action, due process, equal protection and the tiers of scrutiny, freedom of speech, press and religion, the Second Amendment, and criminal procedure, taught through the leading cases and the methods that divide judges. Law school level; educational, not legal advice."
  after: [conlaw1]
