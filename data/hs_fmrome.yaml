  tip: The story of Curtius is one the book calls an old Roman story. A sentence like "This is a legend the Romans loved" is enough.
  answers: 'Brennus meant that the losers have no rights and must accept whatever the winner says. Camillus meant that Romans would fight for their city
    rather than buy their safety. Second Romulus: Romulus founded the city, and Camillus saved it and brought it back to life, like a second founder.'
- num: 16
