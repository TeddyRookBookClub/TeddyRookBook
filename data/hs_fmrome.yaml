    need.
  answers: Streets were narrow and crooked but paved and clean; there were temples, baths and marble houses with pillars. Rich men got wealth by plundering
    conquered countries. Enslaved people were cooks, builders, tailors, farmers, doctors and scholars. Children learned to read and write Latin, arithmetic
    and history, mostly from educated slaves.
