  - A kitchen scale or balance, if you have one
  book: 'The rest of Chapter XI: Pontius Cominius climbs the rock to the Capitol at night; the Gauls follow his footprints, but Juno''s geese wake Marcus
    Manlius. Brennus agrees to leave for a thousand pounds of gold, throws his sword on the scale, and Camillus arrives to drive the Gauls out. Last, Curtius
    rides into the chasm in the Forum.'
  steps:
  - - Set the scene
    - 'Recall: the Gauls hold Rome, the brave men hold the Capitol on its high rock, and the people who fled are gathering at Veii.'
  - - Read the chapter
    - 'Read from where Brennus tries to storm the hill to the end of the chapter. It begins:

      ~ Brennus led his soldiers up the hill

      The chapter ends with the story of Curtius.'
  - - Tell it back
    - 'Prompts:

      - How did the Gauls find the way up the rock?

      - Who woke Marcus Manlius?

      - How did the Gauls cheat when the gold was weighed?

      - What did Curtius say was the most valuable thing the Romans had?'
  - - Two famous sayings
    - 'Read what Brennus said when he threw his sword on the scale:

      ~ What should it mean but woe to the conquered?

      And what Camillus answered:

      ~ We Romans defend our country, not with gold, but with steel.

      Ask: What did Brennus mean? What did Camillus mean?'
  - - Talk it over
    - 'Ask: The Romans called Camillus the second Romulus. Why does that name fit?

      Say: Marcus Manlius was called Capitolinus after he saved the Capitol.'
  - - Extra (optional)
