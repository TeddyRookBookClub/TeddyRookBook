  answers: He was a great orator; his speeches were preserved and are still studied. A young woman named Fulvia, whose lover was one of the plotters, told
    him. The senators shouted and hissed, and those near Catiline moved away, leaving him sitting alone. Catiline raised an army in the Apennines and was
    killed in battle.
