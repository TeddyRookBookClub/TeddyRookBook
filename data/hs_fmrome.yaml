  title: Trajan
  mins: 25
  goal: Your child can tell how Trajan conquered Dacia, what Trajan's Column shows, and why the Romans wished every emperor would be "as good as Trajan."
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - A long strip of paper and a paper-towel tube (optional)
  book: 'Chapter XXVI: cruel Domitian (who stuck flies with pins) is killed; old Nerva rules two years; Trajan becomes emperor in 98 A.D. and reigns nineteen
    years. He twice defeats King Decebalus of Dacia, bridges the Danube with stone piers, holds a long triumph and raises Trajan''s Column. He wins Armenia
    and Mesopotamia, builds roads and the Trajan Forum, and great writers like Plutarch and Tacitus live in his time.'
  steps:
  - - Set the scene
    - 'Find the River Danube on the map, and the land north of it.

      Say: The book says most of Dacia was then called Hungary. In 1904 much of that land did belong to Hungary; today most of it is in Romania.'
  - - Read the chapter
    - 'Read Chapter XXVI aloud. It begins:

      ~ On the death of Titus his brother Domitian became emperor.'
  - - Tell it back
    - 'Prompts:

      - What was Domitian''s strange amusement?

      - Why did Trajan go to war with Decebalus?

      - What was special about Trajan''s bridge over the Danube?

      - What is carved on Trajan''s Column?'
  - - Think it through
    - 'The book says Trajan became emperor in 98 A.D. and reigned nineteen years. Ask: In what year did he die? (98 + 19 = 117 A.D.)'
  - - Talk it over
    - 'Read:

      ~ For a long time after Trajan''s death the people of Rome, whenever they got a new emperor, used to wish that he would be "as great as Augustus and
      as good as Trajan."

      Ask: What is the difference between being great and being good?'
  - - Make a column (optional)
    - Draw the story of the Dacian war as a comic strip on a long paper strip, then wind it around a paper-towel tube like the carvings on Trajan's Column.
  answers: Domitian caught flies and stuck them with pins. Decebalus kept raiding Roman lands and robbing and killing people. The bridge had huge stone
    piers and twenty-two arches, where earlier bridges were wooden. The column shows battles and other scenes from the Dacian war, from the base to the
    top. Great is about power and deeds; good is about how one treats people.
- num: 39
  roman: Ch. XXVII, part 1
  idx: 251
  unit: 6
  title: 'Marcus Aurelius, part 1: The philosopher emperor'
  mins: 25
  goal: Your child can tell about Hadrian's Wall and the catacombs, and describe Marcus Aurelius, the Stoic emperor who shared his throne.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  book: 'Section I of Chapter XXVII: Hadrian travels the empire and builds a wall across Britain; Antoninus Pius protects the Christians, who had met in
    the catacombs. Marcus Aurelius becomes emperor in 161 A.D. and shares the throne with Verus. A Stoic since the age of twelve, he lives simply, helps
    the poor and walks the streets in plain clothes.'
  steps:
  - - Set the scene
    - 'Find the north of Britain on the map, near Scotland. Say: The emperor Hadrian built a wall from sea to sea there. Some of it still stands.'
  - - Read the chapter
    - 'Read section I of Chapter XXVII, stopping at section II. It begins:

      ~ The next emperor was Trajan''s cousin Hadrian.'
  - - Tell it back
    - 'Prompts:

      - Why did Hadrian build his wall?

      - What were the catacombs, and why did Christians meet there?

      - What surprising thing did Marcus Aurelius do when he became emperor?

      - How did he live?'
  - - The Stoics
    - 'Read:

      ~ This man taught that the people should act according to reason and virtue, and should keep an even temper and a brave heart under all circumstances.

      Say: The word stoic comes from stoa, a porch, because Zeno taught in a porch in Athens. Today we call someone stoic when they stay calm and brave
      in hard times.'
  - - Talk it over
    - 'Read what Aurelius said about Verus:

      ~ I think my adopted brother has a right to be emperor with me.

      Ask: After Nero, why would this surprise the Romans?'
  - - Remember it
    - 'Say: Marcus Aurelius began to reign in 161 A.D. His own book of thoughts, usually called the Meditations, is still read today.'
  answers: Hadrian built the wall to keep the fierce northern tribes from raiding the Roman settlements. The catacombs were underground burial passages;
    Christians met there because they were not allowed churches and were often killed. Aurelius gave half his power to Verus. He lived simply, kept few
    servants, gave no costly dinners, spent his salary on the poor and schools, and let anyone talk to him. After emperors who killed rivals to keep power,
    sharing it was astonishing.
- num: 40
  roman: Ch. XXVII, part 2
  idx: 256
  unit: 6
  title: 'Marcus Aurelius, part 2: Troubles, wars and the Thundering Legion'
  mins: 25
  goal: Your child can tell about the Parthian horsemen, the storm that saved the Roman army, and why Aurelius said wasting time was a crime.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Section II to the end of Chapter XXVII: floods, earthquakes and fires; wars with the Parthians and with tribes in what are now Austria and Hungary.
    A sudden storm saves the thirsty army fighting the Quadi, and Aurelius names his Christian soldiers the "Thundering Legion." He forgives the friends
    of the rebel Cassius, works through the games, and dies in 180 A.D.'
  steps:
  - - Set the scene
    - 'Find Austria and Hungary on the map, and Vienna on the Danube. Say: Rome''s borders were long, and there were enemies along all of them.'
  - - Read the chapter
    - 'Read from section II to the end of Chapter XXVII. It begins:

      ~ But the reign of Aurelius was full of troubles.'
  - - Tell it back
    - 'Prompts:

      - How did the Parthian horsemen fight?

      - What happened to the army in the rocky valley?

      - Why did Aurelius forgive the friends of Cassius?

      - What did he do at the games?'
  - - Talk it over
    - 'Read:

      ~ To waste time is one of the greatest of crimes.

      Ask: Do you agree? Is resting the same as wasting time?

      Ask: Some soldiers said a wizard brought the rain; the Christians said it came from their prayers. What does each side''s story tell you about what
      they believed?'
  - - Remember it
    - 'Read his words about the rebels:

      ~ I can afford to forgive traitors.

      Add to the timeline: "180 A.D. Marcus Aurelius dies."'
  - - Extra (optional)
    - Draw the Roman soldiers catching rain in their helmets.
  answers: They rode swift horses, attacked the rear, rode away when attacked, and turned in the saddle to shoot arrows and throw javelins at full speed.
    The thirsty army was saved by a sudden rainstorm, then a hailstorm stopped the enemy's attack. He said he had governed too faithfully to fear plots,
    and that the rebels were to be pitied. At the games he studied, made notes, and dictated letters and orders. Resting to do better work is not the same
    as wasting time; most children will see the difference.
- num: 41
  roman: Ch. XXVIII
