  - - Talk it over
    - 'Read the Greek saying:

      ~ The tongue of Cineas wins more cities than the sword of Pyrrhus.

      Ask: What does it mean? Can words be stronger than swords?

      Say: Caecus is Latin for blind. Appius Claudius Caecus was old and blind, but his words still won.'
  - - Extra (optional)
    - Draw a war elephant from the book's picture, or think of a time something was a "Pyrrhic victory" (winning a game but hurting your ankle).
  answers: 'Pyrrhus closed the theaters and made the people drill as soldiers all day. A Roman soldier cut off part of an elephant''s trunk; it turned and
    ran back through the Greek lines. Appius said it would be cowardly to give in after losing one battle: "Let us fight on." The saying means clever speech
    can win people over better than force.'
