  - - Talk it over
    - 'Ask: Can you think of a "Rubicon" in your own life, a choice that could not be undone once made?'
  answers: Caesar said, "If you will disband your army, I will disband mine." By law it was treason, punished with death, for a general to bring an army
    into that territory without the Senate's permission. The shepherd seized a trumpet, sounded the advance and marched across the bridge. Pompey fled to
    Egypt and was murdered there by order of the king, Ptolemy.
