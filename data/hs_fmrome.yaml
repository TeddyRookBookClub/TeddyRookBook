  tip: The book says Carthage put Regulus to death "in a very cruel way" and gives no details. You don't need to add any.
  answers: They fought over the island of Sicily. The Romans had to build warships and train rowers. The boarding bridge swung onto an enemy deck and its
    iron spike held the ship so Roman soldiers could cross. Carthage hoped Regulus would urge peace to win his freedom; instead he said the terms were bad
    for Rome. He kept his word because he believed a Roman's honor mattered more than his life.
