  unit: 6
  title: Constantine the Great
  mins: 25
  goal: Your child can tell the story of Constantine's vision, how he favored the Christians, and why he founded Constantinople.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XXVIII: after a hundred years of poor emperors, six men claim the title. Constantine marches from Gaul and defeats Maxentius near Rome.
    He tells of seeing a cross of fire with the words "By this, conquer," becomes a Christian, favors the Church, disbands the Praetorian Guards, defeats
    Licinius to rule alone, and moves the capital to Byzantium, renamed Constantinople.'
  steps:
  - - Set the scene
    - 'Find Rome, then the narrow water between Europe and Asia at the entrance to the Black Sea. Say: The city of Byzantium stood there. Today it is Istanbul,
      in Turkey.'
  - - Read the chapter
    - 'Read Chapter XXVIII aloud. It begins:

      ~ For more than a hundred years after the time of Marcus Aurelius none of the Roman emperors did anything great or remarkable.'
  - - Tell it back
    - 'Prompts:

      - Why were there six emperors at once?

      - What did Constantine say he saw in the sky, and what did he dream?

      - What changes did he make for the Christians?

      - Why did he move the capital?'
  - - Remember it
    - 'Read the words of the vision:

      ~ The words are sometimes given in the Latin form, In hoc signo vinces, the translation of which is, "Through this sign thou shalt conquer."

      Say it in Latin together. Then read the words the people put on his arch:

      ~ to the founder of our peace.

      Say: The Arch of Constantine still stands in Rome, near the Colosseum.'
  - - What historians say now
    - 'The book says Constantine made Christianity the religion of the empire. Say: Historians today say he made it allowed and favored. It became the empire''s
      official religion a few emperors later.'
  - - Talk it over
    - 'Ask: For hundreds of years Christians were hunted in Rome. Now the emperor is one of them. How do you think Roman Christians felt?'
  - - Extra (optional)
    - Add "Constantinople, the new capital" to the timeline and draw the Labarum, the cross-shaped standard with a banner.
  answers: Generals and armies kept declaring their commanders emperors. He saw a great cross of fire with words in Greek meaning "By this, conquer," and
    dreamed that Christ promised him victory if he made the cross his standard. He made Christians officers, built churches and put the cross on shields
    and banners. He wanted a capital more central than Rome.
- num: 42
  roman: Ch. XXIX
  idx: 271
  unit: 6
  title: The end of the Western Empire
  mins: 30
  goal: Your child can tell how the Western Empire came to an end in 476 A.D., and how the Eastern Empire lasted until 1453.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XXIX: Julian the Apostate tries to bring back the old gods and dies in Persia. The empire is split between an Emperor of the East and an
    Emperor of the West. Theodosius rules both, but is rebuked by Bishop Ambrose for the massacre at Thessalonica. Goths and Vandals sack Rome, Britain
    is given up, and in 476 A.D. Odoacer takes the crown from the last Western emperor, Romulus Augustulus. The Eastern Empire lasts until the Turks take
    Constantinople in 1453.'
  steps:
  - - Set the scene
    - 'On the map, draw an imaginary line down through the middle of the empire: the West, with Rome, and the East, with Constantinople. Say: This last
      chapter tells how the western half fell apart.'
  - - Read the chapter
    - 'Read Chapter XXIX aloud. It begins:

      ~ Most of the Roman emperors after Constantine were either cruel tyrants or very worthless persons, who spent their time in idle pleasure and neglected
      their duties to the people.'
  - - Tell it back
    - 'Prompts:

      - What did Julian try to do, and what did he cry out when he was dying?

      - Why did Bishop Ambrose keep Theodosius out of the church?

      - Who captured and plundered Rome?

      - What happened to Romulus Augustulus?'
  - - Talk it over
    - 'Read the book''s summing-up:

      ~ And so at last the great Roman Empire had crumbled to pieces, and Rome, so long the Mistress of the World, as she was called, had fallen from her
      proud position of grandeur and power into that of a second or third rate city.

      Ask: The first king of Rome was Romulus. The last emperor of the West was called Romulus Augustulus, which means "little Augustus." What do you notice?'
  - - What has changed since 1904
    - 'Say: The book ends by saying Constantinople became the capital of the Turkish, or Ottoman, Empire. Today that city is called Istanbul, and Rome is
      the capital of Italy and a great city again.'
  - - Remember it
    - 'Add to the timeline: "476 A.D. Odoacer becomes king of Italy. End of the Western Empire." and "1453 The Turks take Constantinople."

      Then look at the whole timeline, from 753 B.C. to 476 A.D. Say: That is more than twelve hundred years of Roman history.'
  - - Look back over the book
    - 'Ask your child: Which famous Roman did you admire most, and why? Which one would you least like to have met? Let them tell the story of their favorite
      one more time.

      The book says the story goes on in its companion volume, Famous Men of the Middle Ages.'
  tip: The massacre at Thessalonica is told in a few sentences. The point the book makes is that even an emperor could be told he was wrong; you can keep
    the focus there.
  answers: Julian tried to bring back the worship of the old gods and to rebuild the Temple of Jerusalem; dying, he cried, "Thou hast conquered, O Galilean."
    Ambrose kept Theodosius out until he did penance for having thousands of innocent people killed at Thessalonica. Rome was plundered by the Goths under
    Alaric and the Vandals under Genseric. Odoacer took Romulus Augustulus prisoner and made him give up the title of emperor. The names show how Rome began
    and ended with a Romulus, and how small the last emperor's power was.
