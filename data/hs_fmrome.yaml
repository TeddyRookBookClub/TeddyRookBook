      them in English: "You, too, Brutus!"'
  - - Words from Rome
    - 'Say: Caesar defended himself with his stylus, a pointed iron tool for writing on wax. Our word style comes from it. Later emperors took the name
      Caesar as part of their title.'
  practice: Ask your child to explain to someone else why we have a leap year.
  answers: The triumph lasted four days, with chariots, banners showing his battles, elephants and camels, prisoners carrying treasure, plays, games and
    feasts. Caesar was made dictator for life, called imperator and Father of his Country, given statues and a throne-like chair. Nobles feared he meant
    to make himself king. The book says the Republic had already ceased to exist in all but name, and Rome became an empire.
