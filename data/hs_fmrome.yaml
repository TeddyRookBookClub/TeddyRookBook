    - 'Say: Caesar has beaten all his enemies. Now he is master of Rome. Remember how the Romans felt about kings?'
  - - Read the chapter
    - 'Read from Caesar''s triumph to the end of Chapter XXI. It begins:

      ~ He had equal success in Africa and Spain.'
  - - Tell it back
    - 'Prompts:

      - What was in Caesar''s great triumph?

      - What titles and honors did Caesar receive?

      - Why did some nobles plot against him?

      - What warning did Caesar laugh at?'
  - - The calendar
    - 'The book says the true year is 365 days, 5 hours, 48 minutes and 50 seconds. Work it out together: four years of those extra hours and minutes add
