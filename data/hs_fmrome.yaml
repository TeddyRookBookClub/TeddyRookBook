  - Paper and colored pencils
  book: 'Sections II and III of Chapter XIII: King Pyrrhus of Epirus comes to help Tarentum and wins at Heraclea with seventy elephants, but loses thousands
    of men. His minister Cineas almost talks the Senate into peace, until old blind Appius Claudius is carried in to speak against it. Rome later wins at
    Beneventum and Pyrrhus goes home.'
  steps:
  - - Set the scene
    - 'Find Greece across the sea from the heel of Italy. Epirus was a land in Greece. Say: The Romans had never seen an elephant.'
  - - Read the chapter
    - 'Read from section II to the end of Chapter XIII. It begins:

      ~ At this time the Tarentines had no general they thought would be able to fight the Romans.'
  - - Tell it back
    - 'Prompts:

      - What did Pyrrhus make the people of Tarentum do?

      - What did the elephants do in battle, and how was the Roman army saved?

      - What did Appius Claudius say in the Senate?'
  - - A Pyrrhic victory
    - 'Read what Pyrrhus said after the battle:

