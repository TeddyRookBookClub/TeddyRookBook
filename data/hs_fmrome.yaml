    - Make a list of Cato's rules for living, as your child imagines them from the chapter ("Eat plain food," "Walk, don't ride").
  answers: 'Cato ate plain food, drank cheap wine, took no pleasures and saved his money. As censor he put out senators who lived badly and taxed carriages,
    jewels, fine dresses, carpets and furniture. He saw crowds of young men, stacks of arms and a harbor full of ships. The women cut off their hair for
    bowstrings. Fairness: most children will see that Rome broke its promise; that is a fair reading of the book.'
