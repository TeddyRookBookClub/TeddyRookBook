  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Sections I and II of Chapter XXIV: Augustus dies in 14 A.D. and the tyrants Tiberius, Caligula and Claudius follow. Nero becomes emperor in 54
    A.D. through his mother Agrippina. At first he seems gentle, then he quarrels with his mother, poisons his stepbrother Britannicus and has his mother
    killed.'
  steps:
  - - Before you read
    - 'This is one of the darkest chapters in the book: a boy poisoned at dinner and a mother killed by her son. Read it ahead. For a younger or sensitive
      child, you can tell the outline yourself and read only the first pages aloud.'
  - - Set the scene
    - 'Say: Not every emperor was good. This chapter shows what can happen when one person has all the power and no one can stop him.'
  - - Read the chapter
    - 'Read the first two sections of Chapter XXIV, stopping at section III. It begins:

      ~ On the death of Augustus in the year 14 A.D. his stepson Tiberius became emperor.'
  - - Tell it back
    - 'Prompts:

      - Who were the three emperors between Augustus and Nero?

      - What was young Nero like at first?

      - What did his mother Agrippina expect?

      - What did Nero do to keep his power?'
  - - Talk it over
    - 'Read what Nero once said:

      ~ I wish I had never learned to write, for then I shouldn''t have to sign away men''s lives!

      Then:

      ~ But in a very short time it was found that Nero was not at all kind or merciful, but that he was a cruel and wicked man.

      Ask: How can you tell whether someone is truly kind, or just saying kind things?'
  - - Remember it
    - 'Add to the timeline: "54 A.D. Nero becomes emperor."

      Say: A.D. years count up, the way we count years now.'
  tip: If your child is upset, it helps to say that the Romans hated Nero too, and that the book tells his story as a warning.
  answers: Tiberius, Caligula and Claudius. Nero was good-looking, fond of games and music, and seemed kind-hearted. Agrippina expected to rule the empire
    herself through her son. He poisoned his stepbrother Britannicus and had his mother killed. True kindness shows in what a person does over time, not
    only in what they say.
- num: 36
  roman: Ch. XXIV, part 2
