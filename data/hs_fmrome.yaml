book:
  id: famousmenofrome00haarrich
  title: Famous Men of Rome
  year: '1904'
  key: fm-rome
  short: Famous Men of Rome
  eyebrow: History · Rome · 1904
  hero: John H. Haaren and A. B. Poland's 29 short life stories of famous Romans, from Romulus to the fall of the Western Empire, for children about 8 to
    11. 42 guides cover every chapter, with the right page of the book beside each one.
  how:
  - <b>One story at a time.</b> About 20 to 30 minutes, two or three times a week. A few long chapters are split into two or three guides.
  - <b>Read it, then tell it back.</b> After each reading, your child tells the story in their own words. Telling it back is how it sticks; the prompts
    in each guide help when they get stuck.
  - <b>Keep a timeline.</b> Tape sheets of paper into one long strip and add a date and a little drawing each lesson. B.C. years count down toward year
    1; A.D. years count up.
  - <b>Find it on a map.</b> Keep a map of Italy and the Mediterranean (a free online map or a globe) nearby. Most guides start by finding the places in
    the story.
  - <b>Legends and hard parts.</b> The first chapters are legends the Romans told about themselves. Many chapters have battles and cruel deeds; the guides
    flag the hardest ones so you can read ahead and soften them for a younger child.
  - <b>Words from Rome.</b> The book often shows where an English word comes from (Senate, census, veto, colossal). Keep a list on the back of the timeline.
  lessonword: ''
  numnote: Each guide covers one chapter of the book, shown beside the title; a few long chapters are split into two or three parts.
units:
- id: 1
  name: The kings of Rome
  from: 1
  to: 6
  text: Romulus founds Rome, and six more kings follow until Tarquin the Proud (Chapters I to IV).
- id: 2
  name: The early Republic
  from: 7
  to: 16
  text: Consuls replace kings, and heroes like Horatius, Cincinnatus and Camillus defend the young republic (Chapters V to XII).
- id: 3
  name: Pyrrhus and the wars with Carthage
  from: 17
  to: 22
  text: Rome fights Greek Pyrrhus and his elephants, then Carthage and Hannibal, until Carthage is destroyed (Chapters XIII to XVI).
- id: 4
  name: The end of the Republic
  from: 23
  to: 32
  text: The Gracchi, Marius and Sulla, Pompey, Caesar and Cicero, as rich and poor quarrel and generals fight for power (Chapters XVII to XXII).
- id: 5
  name: The first emperors
  from: 33
  to: 38
  text: Augustus becomes the first emperor; then cruel Nero, good Titus and great Trajan (Chapters XXIII to XXVI).
- id: 6
  name: The later Empire and its fall
  from: 39
  to: 42
  text: Marcus Aurelius, Constantine and the end of the Western Empire in 476 A.D. (Chapters XXVII to XXIX).
lessons:
- num: 1
  roman: Ch. I, part 1
  idx: 18
  unit: 1
  title: 'Romulus, part 1: The twins and the wolf'
  mins: 25
  goal: Your child can tell the Roman story of Romulus and Remus, from the basket on the Tiber to the founding of Rome.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - A long strip of paper for a timeline (taped-together sheets work well)
  book: 'The first three sections of Chapter I: King Amulius takes the throne of Alba from his brother Numitor, the twins are set adrift on the Tiber and
    saved by a she-wolf, they grow up with the herdsman Faustulus, and Romulus founds Rome after the contest of the vultures.'
  steps:
  - - Set the scene
    - 'Find Italy on the map. Point to the River Tiber and the city of Rome, near the west coast and not far from the Mediterranean Sea.

      Say: This book is about the people of Rome, a city that grew until it ruled most of the lands around this sea. We start at the very beginning, with
      the story the Romans told about how their city was born.'
  - - A word about legends
    - 'Say: Some of these first stories are legends. The Romans believed them, but nobody today knows how much really happened. We read them because they
      tell us what the Romans thought about themselves.

      The book says the god Mars was the twins'' father. That is part of the legend.'
  - - Read the chapter
    - 'Read the first three sections aloud together, up to the death of Remus. It begins:

      ~ Many, many years ago, in the pleasant land of Italy, there was a little city called Alba.

      Stop now and then to ask, "What do you think will happen next?"'
  - - Tell it back
    - 'Close the book and ask your child to tell the story in their own words. Prompts if they get stuck:

      - Why did Amulius want to get rid of Numitor''s children and grandchildren?

      - How were the babies saved, and who found them?

      - How did the twins find out who their grandfather was?

      - How did the brothers decide who would name the city?'
  - - Talk it over
    - 'Ask:

      - Remus saw six vultures first; Romulus saw twelve. Who do you think had the better claim?

      - Romulus killed his brother in a rage. What does it tell us that the Romans kept this sad part in their story?'
  - - Remember it
    - 'Read the words Romulus cried out:

      ~ So perish any one who shall hereafter attempt to leap over my wall.

      Say: Rome was named after Romulus. Roma, or Rome.'
  - - Start a timeline (optional)
    - Lay out a long paper strip. Mark a point near the left end "Rome founded." You will add the date in the next lesson. Your child can draw the she-wolf
      and the twins beside it.
  practice: Over the next day or two, ask your child to tell the story of Romulus and Remus to another family member.
  tip: Children love the she-wolf and the woodpecker. Let them enjoy the story; the "legend" talk only needs a sentence or two.
  answers: 'Who had the better claim: either answer is fine if it is explained; Remus saw birds first, Romulus saw more. Why keep the sad part: the Romans
    thought the walls of their city were sacred and that anyone who mocked them should be punished; it also shows Romulus as fierce and quick to anger.'
- num: 2
  roman: Ch. I, part 2
  idx: 26
  unit: 1
  title: 'Romulus, part 2: The Sabines, Tarpeia and the Senate'
  mins: 25
  goal: Your child can tell how Rome got its first people, the story of Tarpeia, and what the Senate, patricians and plebeians were.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'The rest of Chapter I: Rome is founded in 753 B.C. and becomes a refuge, the Romans carry off the Sabine women, Tarpeia opens the gate, the Sabine
    women stop the battle, Romulus sets up the Senate, and the story of how he disappeared in a storm.'
  steps:
  - - Set the scene
    - 'Recall the last lesson: who were Romulus and Remus, and how did Rome get its name?

      Find Rome again on the map. The Sabines lived on a mountain near Rome.'
  - - Read the chapter
    - 'Read from the fourth section to the end of the chapter. It begins:

      ~ Romulus founded Rome in the year 753 B.C.

      The book says the Romans seized the Sabine girls at a festival. You may want to say plainly that this was wrong and cruel, and that it caused a long
      war.'
  - - Tell it back
    - 'Ask your child to tell the chapter back. Prompts:

      - Who came to live in Rome at first, and why?

      - What did Tarpeia ask for, and what did she get?

      - How did the Sabine women stop the battle?

      - What happened to Romulus at the end?'
  - - Talk it over
    - 'Read what the Sabine women said to their fathers and brothers:

      ~ Do not fight any more for us

      Ask:

      - Why was Tarpeia punished, even by the Sabines she helped?

      - Why do you think the women''s words worked when the soldiers'' swords did not?'
  - - Words from Rome
    - 'The book explains three Latin words. Write them down:

      - Senate, from senex, an old man

      - patricians, from pater, a father (the nobles)

      - plebeians, from plebs, the common people

      Say: We still have a Senate in the United States today.'
  - - Remember it
    - 'Write "753 B.C. Rome founded" on the timeline.

      Say: B.C. means "before Christ." These years count down toward year 1, so a bigger B.C. number is longer ago.'
  - - Extra (optional)
    - Draw the Sabine women running between the two armies, or Tarpeia at the gate with the shields piling up.
  practice: 'Ask: "When was Rome founded?" until "753 B.C." comes easily.'
  tip: The idea that B.C. years count backward is new for most children. A number line from 800 B.C. to year 1 drawn on paper makes it clear.
  answers: 'Tarpeia was a traitor who opened the gate for gold; even the enemy despised a traitor. The women''s words worked because both sides loved them:
    the Sabines were their fathers and brothers, the Romans were their husbands.'
- num: 3
  roman: Ch. II
  idx: 34
  unit: 1
  title: Numa Pompilius
  mins: 25
  goal: Your child can say how Numa, the second king, made Rome peaceful, and can name several Roman gods and what each one ruled.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter II: the Senate chooses Numa, a wise Sabine, as king. He gives small farms to the poor, makes good laws, keeps peace with every neighbor,
    marries the mysterious Egeria, and leads the Romans in worship. The chapter describes the Roman gods: Jupiter, Juno, Neptune, Pluto, Mars, Mercury,
    Vulcan, Apollo, Diana, Janus and others.'
  steps:
  - - Set the scene
    - 'Say: Romulus was a warrior king. The next king was very different. Listen for how.'
  - - Read the chapter
    - 'Read Chapter II aloud together. It begins:

      ~ For a year after the disappearance of Romulus there was no king of Rome.

      Note for you: the book says the augurs laughed at the people they fooled. That is the authors'' own opinion. Most Romans trusted the augurs.'
  - - Tell it back
    - 'Prompts:

      - How was Numa chosen?

      - What did Numa give to every poor Roman?

      - How long did Rome go without wars under Numa?

      - Who was Egeria?'
  - - Meet the gods
    - 'Make a quick chart with your child: the god''s name and what the book says he or she ruled. Jupiter (sky and earth), Juno (his wife), Neptune (the
      sea), Pluto (the land of the dead), Mars (war), Mercury (messenger), Vulcan (metalwork), Apollo (day and the sun), Diana (the moon and hunting), Janus
      (beginnings, gates and doors).

      Say: Some of our planets are named after these gods. Can you think of any? (Jupiter, Neptune, Mars, Mercury.)'
  - - Talk it over
    - 'Read this:

      ~ The door of this temple was always open in time of war, as a sign that the god had gone out to help the Romans. In time of peace the door was shut.

      Ask: Was the door of the temple of Janus open or shut while Numa was king? Why?'
  - - Remember it
    - 'Say: January is named after Janus, the god of beginnings. He had two faces, one looking back at the old year and one looking forward to the new.'
  - - Extra (optional)
    - Draw Janus with two faces, or draw a god with the things the book says he carried (Mercury with wings on his head and feet and a golden staff with
      serpents).
  practice: Ask your child to name three Roman gods and what each ruled, then to tell why January has its name.
  tip: The Romans' gods are a big part of later stories (the geese of Juno, the temple of Jupiter). The chart is worth keeping.
  answers: The door was shut, because Rome had no wars while Numa was king.
- num: 4
  roman: Ch. III
  idx: 42
  unit: 1
  title: The Horatii and the Curiatii
  mins: 20
  goal: Your child can tell how three Roman brothers fought three Alban brothers to decide a war, and how the last Horatius won.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  book: 'Chapter III: under King Tullus Hostilius, Rome and Alba agree to let three champions from each side fight instead of their armies. Two Horatii
    fall, but the last one pretends to run, separates the wounded Curiatii and defeats them one by one. Then, in anger, he kills his own sister for weeping
    over her Alban sweetheart.'
  steps:
  - - Set the scene
    - Remind your child that Alba was the little city where Romulus and Remus were born. Now Rome and Alba are quarreling.
  - - Read the chapter
    - 'Read Chapter III aloud. It begins:

      ~ The third king of Rome was Tullus Hostilius.

      Heads-up: the chapter ends with Horatius killing his sister. Read ahead and decide how much to read aloud to a younger child.'
  - - Tell it back
    - 'Prompts:

      - Why did the two kings choose champions instead of fighting a full battle?

      - What happened to the first two Roman brothers?

      - How did the last Horatius win against three?'
  - - Talk it over
    - 'Read what King Tullus said when he agreed:

      ~ May the best men win!

      Ask:

      - Was Horatius running away because he was afraid, or was it a plan?

      - The book says the people would not let him be put to death for killing his sister, but he had to do a penance. What do you think of that?'
  - - Remember it
    - 'Say: Horatii is the plural of Horatius. Three Horatii, one Horatius.'
  - - Extra (optional)
    - Draw the field with three Romans and three Albans, then draw arrows to show how Horatius separated the Curiatii as they chased him.
  tip: Children often cheer for the clever trick. It is fine to admire the cleverness and still say plainly that killing his sister was a terrible wrong.
  answers: 'Choosing champions meant only a few men would die instead of many. Horatius ran on purpose: the wounded Curiatii chased him at different speeds,
    so he could fight them one at a time. About the sister: the Romans themselves were torn; they honored him as a hero but still made him do penance for
    the crime.'
- num: 5
  roman: Ch. IV, part 1
  idx: 48
  unit: 1
  title: 'The Tarquins, part 1: Ancus Marcius and Tarquin the Elder'
  mins: 25
  goal: 'Your child can name the seven hills of Rome and tell what King Tarquin built: the Capitol, the Circus, the Forum walks and the great sewer.'
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  book: 'The first three sections of Chapter IV: King Ancus Marcius founds the port of Ostia, Tarquin comes from Etruria with his wife Tanaquil, an eagle
    lifts his cap, and he becomes king. He begins the Capitol, sets up the lictors with their fasces, builds the Circus, improves the Forum and builds a
    great sewer. The augur Navius cuts a stone with a razor.'
  steps:
  - - Set the scene
    - 'On the map, find where the Tiber meets the sea. That is where King Ancus founded the port of Ostia.

      Say: Ostia is a Latin word meaning mouths. The city was at the mouths of the river.'
  - - Read the chapter
    - 'Read the first three sections of Chapter IV, stopping before section IV (the death of Tarquin). It begins:

      ~ The next king of Rome was Ancus Marcius.'
  - - Tell it back
    - 'Prompts:

      - What did the eagle do to Tarquin''s cap, and what did Tanaquil say it meant?

      - Why was the new building called the Capitol?

      - What did the lictors carry, and what did the ax and the rods mean?

      - Why was the great sewer so useful?'
  - - The seven hills
    - 'Read this list slowly together:

      ~ The seven hills were the Palatine, the Capitoline, the Cælian, the Quirinal, the Esquiline, the Viminal, and the Aventine.

      Say it like a chant three times. Which two hills have we already met? (The Palatine, where Romulus built his wall, and the Quirinal, named for Romulus
      as a god.)'
  - - Words from Rome
    - 'The book points out words we still use:

      - Capitol, from caput, head

      - arena, Latin for sand

      - circus

      Say: The building where Congress meets is called the Capitol, after this one in Rome.'
  - - Talk it over
    - 'Ask: The book says Tarquin''s sewer is still in use. Why do you think a sewer mattered more than a fine temple to people''s health?'
  - - Extra (optional)
    - 'Draw a lictor carrying the fasces: an ax in a bundle of rods tied with a red strap.'
  practice: Say the seven hills together each day this week.
  answers: The low ground between the hills was swampy and wet, which made the city unhealthy. Draining it helped everyone, every day.
- num: 6
  roman: Ch. IV, part 2
  idx: 55
  unit: 1
  title: 'The Tarquins, part 2: Servius Tullius and Tarquin the Proud'
  mins: 25
  goal: Your child can tell what King Servius did (the wall and the first census) and the story of the Sibyl's books, and can describe a Roman book.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  - Tape and two pencils, to make a scroll
  book: 'Section IV of Chapter IV: good King Servius Tullius finishes the city wall and takes the first census. He is killed by Tarquin the Proud, and his
    daughter Tullia drives over his body. The Sibyl of Cumae sells Tarquin her books, burning three each time he refuses. The chapter explains Roman books,
    papyrus and the volume.'
  steps:
  - - Set the scene
    - 'Say: Today we meet the last two kings of Rome, one good and one so cruel that the Romans never wanted a king again.'
  - - Read the chapter
    - 'Read from section IV to the end of the chapter. It begins:

      ~ On the death of Tarquin his son-in-law Servius Tullius was made king.

      The killing of Servius and Tullia''s chariot are told in two sentences. You can read them plainly and move on.'
  - - Tell it back
    - 'Prompts:

      - What two big things did Servius do for Rome?

      - Why was the new king called "the Proud"?

      - What did the old woman do each time Tarquin refused her books?'
  - - Think it through
    - 'Ask: The Sibyl asked the same price for 3 books as for 9. How many times as much did each book cost at the end? (Three times as much.)

      Ask: What lesson might the story teach about waiting too long to decide?'
  - - Words from Rome
    - 'The book says:

      ~ King Servius was the first to have a census taken in Rome.

      Say: Census is Latin for a counting. Our country still counts its people every ten years. Two more words: paper comes from papyrus, and volume comes
      from volumen, a roll.'
  - - Make a volume (optional)
    - Tape three or four sheets of paper side by side into a long strip. Write a few lines of today's story on it. Tape a pencil to each end and roll it
      up, the way a Roman reader unrolled with one hand and rolled with the other.
  practice: Ask your child to explain to someone else what a Roman book looked like.
  answers: Servius finished the great wall around the city and took the first census. Tarquin was called Superbus, the Proud, because he was haughty and
    cruel. Each time, she burned three of the books and came back asking the same price.
- num: 7
  roman: Ch. V
  idx: 60
  unit: 2
  title: Junius Brutus
  mins: 25
  goal: Your child can tell how Brutus drove out the last king, and what consuls were.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter V: Brutus pretends to be simple to stay safe from his uncle, King Tarquin. After a terrible wrong done by the king''s son to Lucretia,
    Brutus leads the people to banish the Tarquins in 510 B.C. Rome chooses two consuls each year instead of a king. Brutus sentences his own sons for plotting
    to bring the king back, and later dies in battle against Tarquin''s son.'
  steps:
  - - Set the scene
    - 'Say: Rome has had seven kings. Today the kings come to an end, and Rome becomes a republic, ruled by leaders the people choose.'
  - - Read the chapter
    - 'Read Chapter V aloud. It begins:

      ~ Tarquin the Proud had a nephew named Junius Brutus.

      Heads-up: the book says Sextus "deeply injured" Lucretia and that she then took her own life. For a young child you can say, "The king''s son did
      a terrible wrong to a good woman named Lucretia, and she died." Brutus''s sons are also put to death in this chapter.'
  - - Tell it back
    - 'Prompts:

      - Why did Brutus pretend to be foolish?

      - What did the fortune-teller say, and what did Brutus do?

      - What did the people shout in the Forum?

      - What happened to Brutus''s own sons?'
  - - Talk it over
    - 'Read Brutus''s clever answer:

      ~ The earth is the true mother of us all.

      Ask:

      - Why did Rome choose two consuls instead of one?

      - The Romans admired Brutus for judging his own sons like any other traitors. What would make that so hard?'
  - - Remember it
    - 'Add to the timeline: "510 B.C. The last king is driven out. The Republic begins."

      Say: Consuls were two leaders chosen each year to rule instead of a king.'
  - - Extra (optional)
    - Draw Brutus pretending to stumble and kissing the ground while the king's sons run home.
  tip: Children may notice that the Romans never wanted a king again. That idea comes back again and again, right up to Julius Caesar.
  answers: Two consuls meant no one man had all the power, and they changed each year. Judging his sons was hard because he loved them, but he believed
    his duty to Rome came first.
- num: 8
  roman: Ch. VI
  idx: 67
  unit: 2
  title: Horatius
  mins: 20
  goal: Your child can tell how Horatius held the bridge while the Romans cut it down.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - A few craft sticks or blocks, if you want to build the bridge
  book: 'Chapter VI: Publius Valerius, called Publicola, rules Rome. Lars Porsena of Clusium marches to bring back Tarquin. Horatius Cocles and two friends
    hold the far end of the wooden Sublician Bridge while it is cut down, and Horatius swims the Tiber to safety.'
  steps:
  - - Set the scene
    - 'Find the Tiber on the map. Say: The only way into Rome from Porsena''s side was one wooden bridge.'
  - - Read the chapter
    - 'Read Chapter VI aloud. It is short and exciting; let your voice show it. It begins:

      ~ For a time Rome was ruled by Publius Valerius.'
  - - Tell it back
    - 'Prompts:

      - Why did the Romans decide to cut down their own bridge?

      - What did Horatius ask for?

      - What happened as the bridge fell?

      - How did Rome reward him?'
  - - Talk it over
    - 'Read the words of Horatius:

      ~ Give me two good men to help me, and I will hold the bridge and stop the enemy from coming over.

      Ask: The book says even the Etruscans cheered him. Why would an enemy cheer?'
  - - Remember it
    - 'Say: Publicola means the people''s friend. Horatius held the bridge.'
  - - Extra (optional)
    - Build a little bridge with blocks or sticks and act it out with toy figures. Or find the poem "Horatius" by Thomas Babington Macaulay and read a few
      verses aloud; it tells this same story.
  answers: Cutting the bridge was the only way to stop the huge army. The Etruscans cheered because brave deeds were admired even by enemies.
- num: 9
  roman: Ch. VII
  idx: 70
  unit: 2
  title: Mucius the Left-Handed
  mins: 20
  goal: Your child can tell how Mucius frightened King Porsena into making peace, and how he got the name Scaevola.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  book: 'Chapter VII: Porsena tries to starve Rome. Caius Mucius slips into the Etruscan camp to kill the king but strikes the secretary by mistake. To
    show he is not afraid, he holds his right hand in the fire. Porsena frees him, hears that three hundred young Romans have sworn the same oath, and makes
    peace.'
  steps:
  - - Set the scene
    - 'Say: Horatius saved the bridge, but Porsena''s army is still camped across the river. Now he tries to starve the city.'
  - - Read the chapter
    - 'Read Chapter VII aloud. It begins:

      ~ But Porsena still remained with his army on the other side of the river.'
  - - Tell it back
    - 'Prompts:

      - Why did Mucius kill the wrong man?

      - What did he do when Porsena threatened him with fire?

      - What secret did he tell the king afterward?'
  - - Talk it over
    - 'Read what Mucius said:

      ~ Behold how little we Romans care for pain when it is to defend our country.

      Ask: Was it his courage or his secret that made Porsena want peace? Maybe both?'
  - - Remember it
    - 'Say: Scaevola is the Latin word the book gives for left-handed. Mucius burned his right hand, so he had to use his left.

      Safety note: this is a story to admire, not to copy. No one should ever put a hand near a fire.'
  - - Extra (optional)
    - Try writing your name with your left hand (or your right hand, if you are left-handed). Talk about how hard it would be to learn everything over again.
  answers: 'Probably both: Mucius showed that Romans would bear any pain, and the news of three hundred more young men made Porsena fear for his life.'
- num: 10
  roman: Ch. VIII
  idx: 73
  unit: 2
  title: Coriolanus
  mins: 25
  goal: Your child can tell how Coriolanus got his name, why he left Rome, and how his mother saved the city.
  materials:
  - The book, open to this chapter
  - A map of Italy and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  book: 'Chapter VIII: Caius Marcius wins the Volscian city of Corioli and is called Coriolanus. The plebeians, crushed by debt, win the right to elect
    tribunes with the power of veto. Coriolanus, who scorns the common people, is put on trial and flees to the Volscians, then leads their army against
    Rome. His mother Veturia and the Roman women turn him back.'
  steps:
  - - Set the scene
    - 'Say: Rome has no king now, but rich and poor do not get along. The patricians, or nobles, have the power, and the plebeians, or common people, are
      often in debt.'
  - - Read the chapter
    - 'Read Chapter VIII aloud. It begins:

      ~ One of the great men of Rome not long after the banishment of the Tarquins was Caius Marcius.'
  - - Tell it back
    - 'Prompts:

      - How did Caius Marcius get the name Coriolanus?

      - Why did the plebeians almost leave Rome?

      - What did Coriolanus say about the corn from Sicily?

      - Who finally turned him back from Rome?'
  - - Words from Rome
    - 'The book explains that tribunes could veto laws.

      Say: Veto is Latin for "I forbid." Our President can veto a law too.'
  - - Talk it over
    - 'Read what Coriolanus said to his mother:

      ~ Oh, mother, what have you done to me? You have saved Rome, but you have ruined your son.

      Ask:

      - Why did his mother''s words work when the nobles'' did not?

      - Coriolanus was very brave. What was his weakness?'
  - - Extra (optional)
    - Draw the long line of Roman ladies in mourning walking to the Volscian camp.
  answers: He loved his mother deeply; the book says Valeria remembered that and hoped he would listen to her. His weakness was pride and scorn for the
    common people.
- num: 11
  roman: Ch. IX
  idx: 81
  unit: 2
  title: The Fabii
  mins: 20
  goal: Your child can tell how the Fabius family changed from unpopular nobles to friends of the people, and what happened to them on the Cremera.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  book: 'Chapter IX: the powerful Fabius family at first treats the plebeians harshly, then wins their love by caring for wounded soldiers and asking for
    land for the poor. Angry nobles push them out, so the Fabii move to the River Cremera and fight the Veientians at their own cost. The Veientians ambush
    them on their way to worship, unarmed.'
  steps:
  - - Set the scene
    - 'Say: Last time we heard about the quarrel between patricians and plebeians. Today a whole noble family changes sides.'
  - - Read the chapter
    - 'Read Chapter IX aloud. It begins:

      ~ At about the time in which Coriolanus lived the family of the Fabii were very powerful in Rome.'
  - - Tell it back
    - 'Prompts:

