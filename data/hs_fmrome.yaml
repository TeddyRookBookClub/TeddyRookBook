  answers: 'Censor: in charge of the census, collecting taxes, public buildings, and making roads and streets. Aqueduct: to bring water to the city, from
    a lake eight miles away. The Appian Way was one hundred and twenty miles long. Good roads let armies, messengers and traders move quickly.'
