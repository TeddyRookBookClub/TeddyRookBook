      Say: Good historians ask, "Could that really be true?" The authors are doing that here.'
  - - Talk it over
    - 'Ask: Sulla, like Cincinnatus, gave up being dictator. How was he different from Cincinnatus?'
  - - Remember it
    - 'Add to the timeline: "78 B.C. Sulla dies." Felix is Latin for happy or fortunate.'
  - - Extra (optional)
    - 'Draw a battering ram from the book''s picture: a heavy beam with an iron head shaped like a ram''s.'
  answers: '"The Lion," for bravery, and Felix, meaning fortunate. Battering rams were heavy beams with iron ends for knocking down walls; Athenians came
    out at night and burned the first ones. A proscription list named people to be killed, hung up in the Forum. He gave up his power and lived by the Bay
    of Naples, feasting and studying. Cincinnatus held power for a few days to save Rome and went home poor; Sulla killed thousands and ruled by his own
    will for about a year first.'
