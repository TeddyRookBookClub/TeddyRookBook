  book: 'Chapter XIX: Lucius Cornelius Sulla, scholar and soldier, called "the Lion" and Felix, takes Athens with battering rams and beats the armies of
    Mithridates at Chaeronea. He returns to win a civil war against the Marians, becomes dictator, hangs up lists of people to be killed, holds a magnificent
    triumph, then gives up power and retires to the Bay of Naples. He died in 78 B.C.'
  steps:
  - - Set the scene
    - Find Greece and Athens on the map, and Pontus on the south shore of the Black Sea, where King Mithridates ruled.
  - - Read the chapter
    - 'Read Chapter XIX aloud. It begins:

      ~ We have said something of Sulla, but there is much more to be told about him

      You may want to read it in two sittings, stopping after the peace with Mithridates.'
  - - Tell it back
    - 'Prompts:

      - What two nicknames did Sulla have?

      - What were battering rams, and what happened to the first ones?

      - What was a proscription list?

      - What did Sulla do at the end of his life?'
  - - Thinking about the sources
    - 'The book says that, as the story was told, only twelve Romans failed to answer the roll-call after the battle of Chaeronea. Read what the book says
      next:

