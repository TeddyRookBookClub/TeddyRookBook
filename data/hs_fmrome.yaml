    - 'Read section I of Chapter XXI, stopping at section II. It begins:

      ~ Of all the Roman heroes the greatest was Caius Julius Caesar.'
  - - Tell it back
    - 'Prompts:

      - What book did Caesar write?

      - What did Sulla say about young Caesar?

      - Why did his soldiers trust him?

      - How did Caesar win at Alesia?'
  - - The Roman army
