  unit: 5
  title: 'Augustus, part 2: The first emperor'
  mins: 25
  goal: Your child can explain how Rome changed from a republic to an empire under Augustus, and name some of the poets of his time.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  - A calendar
  book: 'Section III of Chapter XXIII: Octavius defeats every rival, takes the name Augustus and rules as emperor for about twenty-seven years. He forms
    the Praetorian Guards, improves the plebeians'' lives with the help of Agrippa and Maecenas, builds and founds cities, and encourages writers: Horace,
    Vergil (author of the Aeneid), Varius, Ovid and the historian Livy. Jesus Christ is born in Bethlehem during his reign.'
  steps:
  - - Set the scene
    - 'Say: For about five hundred years Rome was a republic. Today it becomes an empire, ruled by one man.'
  - - Read the chapter
    - 'Read from section III to the end of Chapter XXIII. It begins:

      ~ Octavius continued to fight in different parts of the Empire until he defeated every one who dared to oppose him.'
  - - Tell it back
    - 'Prompts:

      - What does the name Augustus mean, according to the book?

      - Who were the Praetorian Guards?

      - How did Agrippa and Maecenas help Augustus keep the people happy?

      - Which poets and historians lived in his time?'
  - - Talk it over
    - 'Read:

      ~ And when Augustus became emperor the Republic of Rome was no longer in existence.

      Ask: What is the difference between a republic and an empire? Which do you think the Romans who drove out the kings would have wanted?'
  - - A circle closes
    - 'Say: Vergil wrote the Aeneid about Aeneas, the Trojan hero from the very first page of this book. Turn back to Chapter I and find his name.'
  - - Remember it
    - 'Look at a calendar. Say: July is named for Julius Caesar and August for Augustus.

      Add to the timeline: "Augustus, the first emperor." The book says Jesus was born in his reign; Christians count A.D. years from that birth.'
  - - Review the Republic (optional)
    - Run your finger along the timeline from 510 B.C. to Augustus. Ask your child to name one famous Roman from the Republic and tell one thing about him.
  answers: The book says augustus means worthy of respect, or sacred. The Praetorian Guards were about ten thousand trusted soldiers who protected the emperor.
    Agrippa and Maecenas advised him to give out corn or money and put on great shows when people grumbled. The poets were Horace, Vergil, Varius and Ovid,
    and the historian was Livy. In a republic the people choose their leaders; in an empire one ruler holds the power for life.
- num: 35
  roman: Ch. XXIV, part 1
