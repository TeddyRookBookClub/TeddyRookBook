  title: The Fountain, by James Russell Lowell
  mins: 20
  goal: Your child reads a short, quick-moving poem aloud and explains what the poet wishes his heart could be like.
  materials: *id002
  book: A poem of very short lines describing a fountain leaping into sunshine, moonlight and starlight, always changing yet always the same. A note about Lowell and Definitions are included.
  steps:
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Blithesome, gay.

      ~ Aspiring, ambitious.

      ~ Constant, fixed, not to be changed.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - About the author
    - The book's note calls James Russell Lowell one of the most noted of American poets, also well known as an essayist and lecturer. He was born at Cambridge, Mass., in 1819.
  - - Read it aloud
    - 'Read the poem aloud to your child first, then let your child read it. The lines are very short, so it runs and splashes like water. Keep it light and quick. Here are some lines describing the fountain:

