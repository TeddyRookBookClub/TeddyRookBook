  - - Read it aloud
    - 'Read the poem aloud to your child first; it has a strong, rocking rhythm. Then let your child read it. It begins in a calm:

      ~ No stir in the air, no stir in the sea,

      Then have your child read it a second time, more smoothly: the first reading is for the meaning, the second for the sound and rhythm.'
  - - Talk about it
    - 'Say: Why did the Abbot put a bell on the rock? What did the sailors do when they heard it?

      Say: Why did Sir Ralph cut off the bell?

      Say: What happened when Sir Ralph came back, rich from his plundering?

      Say: What sound did he hear as the ship sank? Why is that fitting?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - Your child tells the story of the ballad in prose, from the Abbot's bell to Sir Ralph's end.
  - - Copywork
    - 'Your child copies these lines as verse:

      ~ The mariners heard the warning bell;

      ~ And then they knew the perilous Rock,

      ~ And blest the Abbot of Aberbrothok.'
  - - Words to learn
    - 'Learn: keel, buoy, surge, joyance, scoured, methinks, knell. Spell each aloud, then write it with its meaning.'
  practice: Find the Firth of Tay on a map of Scotland.
- num: 93
  roman: LXXXIX
  idx: 258
  unit: 9
  title: My Mother's Grave
  mins: 20
  goal: Your child reads a short, serious remembrance and talks about kindness to parents.
  materials: *id002
  book: 'A short prose piece: a grown person stands at their mother''s grave and remembers one evening of unkindness as a child, a glass of water given crossly to a sick mother, and the apology that came too late. Definitions follow. No author is named.'
  steps:
  - - Read it aloud
    - 'Read it aloud to your child, or let your child read it slowly. It begins at the grave:

      ~ But the varied events of thirteen years had not effaced the remembrance of that mother''s smile.'
  - - Talk about it
    - 'Say: What happened on the evening the writer remembers?

      Say: Why couldn''t the child sleep?

      Say: Why didn''t the apology happen?

      Say: What does the writer want children who still have their parents to remember?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - Your child says, in a few sentences, what the writer learned and what we can learn from it.
  - - Copywork
    - 'Your child copies this from the book, slowly and neatly, minding every capital letter and mark of punctuation:

      ~ I went and brought her the water, but I did not do it kindly.'
  - - Words to learn
    - 'Learn: mournful, realize, varied, effaced, petulantly, resolved, ingratitude, manifold. Spell each aloud, then write it with its meaning.'
  tip: This is a sad piece. Keep the talk gentle; the point is simply to be kind at home today.
- num: 94
  roman: XC
  idx: 260
  unit: 9
  title: A Mother's Gift—The Bible, by W. Fergusson
  mins: 20
  goal: Your child reads the book's last poem aloud and says what the mother's gift is and why she gave it.
  materials: *id002
  book: 'The last lesson: a short poem in which a mother gives her child a Bible as a pledge of her love and asks the child to keep it and its faith. Definitions follow. The contents name W. Fergusson as the author.'
  steps:
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Pledge, proof, evidence.

      ~ Incense, something offered in honor of any one.

      ~ Scoffer, one who laughs at what is good.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - Read it aloud
    - 'Read the poem aloud to your child first, gently, then let your child read it. It begins:

      ~ Remember, love, who gave thee this,

      Then have your child read it a second time, more smoothly: the first reading is for the meaning, the second for the sound and rhythm.'
  - - Talk about it
    - 'Say: What is the mother''s gift?

      Say: Why does she give it? What does she hope for?

      Say: What does she say a scoffer might do? How should her child answer?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - Your child says, in their own words, what the mother is asking of her child.
  - - Copywork
    - Your child copies one verse of the poem from the book, keeping the line breaks, capitals and punctuation exactly.
  - - Words to learn
    - 'Learn: pledge, incense, faith, scoffer. Spell each aloud, then write it with its meaning.'
  practice: You've finished the Fourth Reader! Let your child choose a favorite lesson from the whole book to read aloud to the family.
