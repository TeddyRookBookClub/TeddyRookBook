book:
  id: mcguffeyseclecti04mcgu_0
  title: McGuffey's Fourth Eclectic Reader, Revised Edition
  year: 1879 (revised edition)
  key: mcg-fourth
  short: Fourth Reader
  eyebrow: McGuffey's Readers · Fourth Reader · revised edition
  hero: Ninety stories, poems and short essays, from "Perseverance" to "A Mother's Gift," with optional lessons on reading aloud, for children about 9 to 11. Every lesson has a guide you can follow step by step, with the right page of the book beside it.
  how:
  - <b>One lesson a day.</b> Most lessons take 25 to 30 minutes. A few long stories and poems are easier over two days; the guides say so.
  - <b>Words at the end.</b> In this reader the new words and their meanings come after each lesson, under Definitions. Look at them before reading, then learn a few to spell.
  - <b>Read aloud, every day.</b> These lessons were written to be read aloud with expression. Read poems to your child first, then have your child read them, usually twice.
  - <b>Talk, then tell back.</b> Ask a few questions (many come from the book's own Exercises), then close the book and let your child tell the lesson in their own words. Older or more confident children can write it as a paragraph.
  - <b>Copy and learn.</b> A short passage to copy neatly and a handful of words to spell give each day a quiet, written finish. Keep everything in one notebook.
  - <b>About the authors.</b> The book prints short notes about many authors. The guides repeat only what those notes say; some dates reflect when the book was printed.
  unitword: Part
units:
- id: 1
  name: Reading aloud well
  from: 1
  to: 4
  text: 'Optional lessons from the front of the book: punctuation marks, clear sounds, accent and inflection.'
- id: 2
  name: Perseverance, fairy tales and kindness
  from: 5
  to: 16
  text: Trying again, the magic mill, popping corn, Jennie's smiles, a monkey, meddlesome Matty, a good son, Eddie's to-morrow and Henry Bond's will.
- id: 3
  name: Courage, the sea and the frost
  from: 17
  to: 28
  text: Piccola's Christmas, Fred's true manliness, the brown thrush, ships and sailors, two sides of a story, the frost's pranks, the saved whip-cord, the lion and the talking strawberries.
- id: 4
  name: Riches, eagles and good neighbors
  from: 29
  to: 39
  text: Harry's riches, Frisk the dog, the grass and the eagle, an Alpine song, Scrapewell's excuses, the noblest revenge, and Margery's wondering walk.
- id: 5
  name: Work, wonder and the world
  from: 40
  to: 52
  text: The child's world, Susie's composition, idle George and busy Charles, coffee, the nettle, a tempest, the horse and a story of true emulation.
- id: 6
  name: Honesty, Crusoe and good-will
  from: 53
  to: 64
  text: The sandpiper, Andrew's right way, Susan and the Golden Rule, Robinson Crusoe, knowledge and good-will, a Chinese story, friendship and the giraffe.
- id: 7
  name: Lost and found
  from: 65
  to: 76
  text: A lost child, the seven children, the pet fawn, Annie's dream, Tom Brown at Rugby, the Hesperus, birds, the rainbow and the old oaken bucket.
- id: 8
  name: Truth, wisdom and work
  from: 77
  to: 85
  text: The Sermon on the Mount, the young witness, Solomon and the ants, a boys' theater, Alfred the Great, farm life, Hugh Idle and Mr. Toil, and burning the fallow.
- id: 9
  name: History, seasons and home
  from: 86
  to: 94
  text: Soldiers and a siege, the four seasons, Brandywine Ford, the best capital, the Inchcape Rock, and two last poems about mothers.
lessons:
- num: 1
  roman: Intro 1
  idx: 12
  unit: 1
  title: Punctuation marks
  mins: 20
  goal: Your child can name the common punctuation marks and says what each one tells a reader to do.
  materials:
  - The book, open to this lesson
  - Paper and a pencil
  - Any storybook with dialogue in it
  book: Two pages that list the punctuation marks, from the hyphen, comma and period to marks of ellipsis, the section mark and the caret, each with a short example.
  steps:
  - - Why marks matter
    - 'Say: Punctuation marks are signals. They tell you where a sentence ends, when someone is asking or shouting, and whose words you are reading.

      This part of the book is for reference. You don''t need to learn every mark today; the first seven are the ones your child will meet on every page.'
  - - Read the first seven
    - 'Read numbers 1 to 7 together: the hyphen, the comma, semicolon and colon, the period, the interrogation point (question mark), the exclamation point, quotation marks and the apostrophe. The book gives an example for each:

      ~ 4. The Interrogation point (?) denotes a question; as, Has he come? Who are you?

      ~ 7. The Apostrophe ( '' ) denotes that a letter or letters are left out; as, O''er, for over;

      Have your child read each example aloud, letting the voice show the mark.'
  - - A note on pauses
    - 'The book says something useful about commas and semicolons:

      ~ Note.— These marks do not indicate the comparative length of the pauses to be made where they occur.

      Say: So we don''t count a comma as one beat and a semicolon as two. We pause where the sense needs it.'
  - - The rarer marks
    - 'Look quickly over the rest: the curves (parentheses), brackets, the dash, marks of ellipsis, the brace, the diaeresis, the section mark, the index, the paragraph mark and the caret. The book says words in curves should be read in a lower voice and a little faster. Try it with one made-up sentence.'
  - - Hunt for marks
    - Open any storybook. Give your child one minute to find a question mark, an exclamation point, quotation marks and an apostrophe. For each one, your child reads that sentence aloud and says what the mark tells the reader.
  - - Write them
    - 'Your child writes one short sentence of their own for each of these: a question, an exclamation, someone''s words in quotation marks, and a word with an apostrophe (like John''s or it''s).'
  practice: Come back to these pages whenever a lesson has a mark your child doesn't know. Many lessons in the book ask about a mark in their Exercises.
  optional: true
- num: 2
  roman: Intro 2
  idx: 14
  unit: 1
  title: 'Articulation: the elementary sounds'
  mins: 20
  goal: Your child says the vowel sounds and consonant sounds of English clearly, one at a time and in words.
  materials: &id001
  - The book, open to these pages
  - A mirror is handy, so your child can watch lips and tongue
  book: 'The section on articulation: what vocals, subvocals and aspirates are, tables of the long and short vocal (vowel) sounds, then lists of words for practicing each sound and each consonant pair.'
  steps:
  - - What articulation means
    - 'The book begins:

      ~ Articulation is the utterance of the elementary sounds of a language, and of their combinations.

      Say: That means saying each sound clearly, so every word can be understood. Good readers don''t swallow sounds or run words together.'
  - - Three kinds of sounds
    - 'The book sorts the sounds into vocals (vowel sounds, pure voice), subvocals (voiced consonants, like b, d, g, v, z) and aspirates (breath only, like p, t, k, f, s).

      Have your child put fingers on their throat and say "zzz" then "sss." The throat buzzes on the subvocal and not on the aspirate.'
  - - The vowel table
    - 'Read the table of long and short vocals together. The book''s advice:

      ~ As a rule, the long vocals should be prolonged with a full, clear utterance; but the short vocals should be uttered sharply and almost explosively.

      The book shows the method: the teacher says the word, then its vowel sound alone (mate, then the long a; man, then the short a), and the pupil copies closely. Work down a few lines of the word lists that way, your child copying you.'
  - - Consonant sounds
    - 'Turn to the lists for the subvocals and aspirates. Read a line or two of each, slowly and forcefully. For example:

      ~ v. — Van, vine, vale, vivid, stove, of, Stephen.

      ~ f. — Fib, fob, buff, beef, if, off, life, phrase, laugh.

      Point out that f and v are made the same way; only the voice is added for v. The book calls such pairs cognates.'
  - - Combined sounds
    - 'The book next gives clusters like br, bl, dr and dl to practice, "very distinctly." Try a line:

      ~ br. — Bred, brag, brow, brim, brush, breed, brown,

      Then try the hard endings, such as fibs, robbed, fables, fabled. Make it a game, not a drill.'
  - - Keep it short
    - Five to ten minutes of sound practice is plenty. Stop while it is still fun, and come back to a different table another day.
  practice: Over the next weeks, spend two minutes before a reading lesson on one line of these tables, especially any sound your child tends to slur.
  tip: Don't worry about the book's special marks over the vowels. Listen to the sound you make and copy it; that is what the tables are for.
  optional: true
- num: 3
  roman: Intro 3
  idx: 23
  unit: 1
  title: Exercises in articulation and sentences for practice
  mins: 20
  goal: Your child notices and fixes common sloppy pronunciations and reads tongue-twisting sentences clearly.
  materials: *id001
  book: Lists of words often mispronounced, set as INCORRECT and CORRECT side by side (fa-t'l for fa-tal, sep-er-ate for sep-a-rate, eas for east, wen for when), then Sentences for Practice.
  steps:
  - - Read the note to teachers
    - 'The book explains that the letters in italics in these lists mark sounds that are "apt to be defectively articulated" or left out. In other words: these are the sounds people get lazy with.'
  - - Correct and incorrect
    - 'Read across a few rows: first the wrong way, then the right way. Some from the book:

      ~ Sep-er-ate for sep-a-rate.

      ~ Eas for east.

      Another table is all about wh: wen for when, wip for whip, wale for whale. Have your child say each correct word slowly, then at normal speed, keeping every sound.'
  - - Final sounds
    - 'Many rows are about endings: t at the end (east, most, lost, nest) and ts (hosts, tests, acts). Your child says each one and you listen for the last sound. Then swap: your child listens to you.'
  - - Sentences for practice
    - 'The book says these sentences "may be read with great advantage, for the purpose of acquiring distinctness and precision in articulation." Read a few, slowly first, then faster:

      ~ This act, more than all other acts, laid the ax at the root of the evil.

      ~ That last still night. That lasts till night.

      ~ Among the rugged rocks the restless ranger ran.

      Say: Can you hear the difference between "that last still night" and "that lasts till night"?'
  - - Your own twister
    - Your child makes up one sentence that is hard to say clearly, writes it down, and reads it to you three times.
  practice: Use one practice sentence as a warm-up before reading lessons this week.
  optional: true
- num: 4
  roman: Intro 4
  idx: 28
  unit: 1
  title: Accent and inflection
  mins: 20
  goal: Your child hears and uses the rising and falling inflections when reading questions and statements.
  materials:
  - The book, open to this lesson
  - Paper and a pencil
  book: 'Accent (stress on one syllable) with examples, then inflection: the rising and falling slides of the voice, with question-and-answer pairs to practice.'
  steps:
  - - Accent
    - 'The book defines it:

      ~ Accent, marked thus (''), is an increased force of voice upon some one syllable of a word.

      Say a few words and have your child clap on the strong syllable: col-o-ny, re-mem-ber, rec-ol-lect. This is the same mark your child will see in the word lists at the end of each lesson.'
  - - Inflection
    - Inflection is the slide of the voice up or down. Ask a yes-or-no question (Has he come?) and notice how the voice rises at the end. Make a plain statement (He has gone.) and notice how it falls.
  - - Practice the pairs
    - 'The book gives pairs where the voice rises on one word and falls on the other. Read them as question and answer, you asking and your child answering:

      ~ Is the dog white'', or black\?

      ~ The dog is black\ not white''.

      Then swap parts. The rising mark ('') and the falling mark (\) show which way the voice goes.'
  - - Make your own
    - Your child makes up three "Is it this, or that?" questions with answers, and reads them aloud with the voice rising on the first choice and falling on the second.
  - - Keep listening
    - The book says the pupil should practice these examples until perfectly familiar with the rising and falling inflections. Over the next lessons, when your child reads a question in a story, listen for the voice to go up.
  optional: true
- num: 5
  roman: I
  idx: 30
  unit: 2
  title: Perseverance, by Charlotte Elizabeth
  mins: 30
  goal: Your child reads a story aloud with expression, explains what perseverance means, and tells the story back in order.
  materials: &id002
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A story about an aunt helping her nephew John and niece Lucy fly a kite, with a picture. The Definitions and Exercises are at the end. The contents name Charlotte Elizabeth as the author.
  steps:
  - - Warm up
    - 'This is the first lesson of a new book, and the book does things a little differently. Show your child the parts of a lesson: the title, the numbered paragraphs, and the Definitions and Exercises at the end.'
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Entangled, twisted in, disordered.

      ~ Disengaged, cleared, set free.

      ~ Perseverance, continuance in any thing once begun.

      ~ Motto, a short sentence or a word full of meaning.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - Read it aloud
    - 'Look at the picture first. Then your child reads the story aloud, a paragraph at a time. There is a lot of talking, so help your child make the voices sound like real people: cross, then sulky, then delighted. It begins:

      ~ "Will you give my kite a lift?" said my little nephew to his sister,'
  - - Talk about it
    - 'Say: What went wrong the first time? The second time? The third time?

      Say: Whose fault was it, really? Did blaming each other help?

      Say: Why did John want to give up? What did his aunt say?

      Say: Can you think of something you nearly gave up on, and then did?

      Let your child look back at the page to find answers.'
  - - The book's questions
    - 'The book has its own Exercises at the end. Ask them too:

      ~ What may we learn from this?

      ~ What should be our motto if we expect to be successful?'
  - - Tell it back
    - 'Close the book.

      Say: Tell me the story of the kite, every try, in order.

      Then your child tells it again from Lucy''s side.'
  - - Copywork
    - 'Your child copies this from the book, slowly and neatly, minding every capital letter and mark of punctuation:

      ~ Whenever you fail in your attempts to do any good thing, let your motto be, try again.'
  - - Words to learn
    - 'Learn to spell and give the meaning of: entangled, assistance, dignity, disappointments, discourage, perseverance. Say each word, have your child spell it aloud, then write it and its meaning.'
  practice: Reread the story the next day. Then have your child write the word motto at the top of a page, with "Try again" under it.
- num: 6
  roman: II
  idx: 33
  unit: 2
  title: Try, Try Again, by T. H. Palmer
  mins: 20
  goal: Your child reads a short poem with good rhythm, learns its refrain by heart and explains its lesson.
  materials: *id002
  book: A short poem in three verses, each ending "Try, try again." Definitions and two Exercises about punctuation follow. The contents name T. H. Palmer as the author.
  steps:
  - - Warm up
    - 'Say: Yesterday''s story ended with a motto. Do you remember it? Today''s poem is built around the same two words.'
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Courage, resolution.

      ~ Conquer, gain the victory.

      ~ Prevail, overcome.

      ~ Patience, constancy in labor.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - Read it aloud
    - 'Read the poem aloud to your child first. Then your child reads it. Each verse ends with the same line, so let your voice come down firmly on it. The last verse closes:

      ~ Time will bring you your reward,

      ~ Try, try again.

      ~ All that other folks can do,

      ~ Why, with patience, should not you?

      ~ Only keep this rule in view:

      ~ Try, try again.

      Then have your child read it a second time, more smoothly: the first reading is for the meaning, the second for the sound and rhythm.'
  - - Talk about it
    - 'Say: What should you do if you fail once or twice?

      Say: What does the poem say time will bring?

      Say: Is there something you''re learning now where this poem fits?

      Let your child look back at the page to find answers.'
  - - The book's punctuation questions
    - 'The Exercises ask about marks. Find the answers together:

      ~ What does the mark before " ''T is " mean? What is it called?

      It is an apostrophe, and it shows that a letter is left out: ''T is means It is. Look back at the punctuation pages at the front of the book if you like.'
  - - Tell it back
    - Have your child say the poem's lesson in one or two sentences of their own, then try to say the last verse from memory.
  - - Copywork
    - 'Your child copies these lines as verse, starting each line with a capital letter, as the book does:

      ~ All that other folks can do,

      ~ Why, with patience, should not you?'
  - - Words to learn
    - 'Learn: courage, conquer, prevail, disgrace, reward, patience. Spell each aloud, then write it with its meaning.'
  practice: Learn the whole poem by heart over the week, one verse a day.
- num: 7
  roman: III
  idx: 34
  unit: 2
  title: Why the Sea is Salt, part 1, by Mary Howitt
  mins: 30
  goal: Your child reads the first half of a fairy tale aloud and retells how the poor brother got the magic mill.
  materials: *id002
  book: 'A fairy tale, begun here and finished in the next lesson: a poor man trades a ham to the dwarfs for an old hand-mill. A note about Mary Howitt comes first; Definitions follow the story.'
  steps:
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Trifling, of small value.

      ~ Hand-mill, a mill turned by hand.

      ~ Attracted, drawn to, allured.

      ~ Perplexed, puzzled.

      ~ Fragrance, sweetness of smell.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - About the author
    - The book's note says Mary Howitt was born in 1804, at Coleford, England, and wrote many charming stories for children in prose and verse. She also translated many from Swedish, Danish, and German authors. This story is arranged from one in a collection called "Peter Drake's Dream, and Other Stories."
  - - Read it aloud
    - 'Tell your child this is a fairy tale, and fairy tales usually have a kind person and a greedy one. Your child reads it aloud. It begins:

      ~ There were, in very ancient times, two brothers, one of whom was rich, and the other poor.'
  - - Talk about it
    - 'Say: How did the rich brother give the ham? Was it a kind gift?

      Say: What did the old man in the forest tell the poor man to ask for?

      Say: Why did the dwarfs finally agree to give up the mill?

      Say: What came out of the mill first? Why those things?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what happened from Christmas Eve morning until midnight.

      Then ask your child to guess what the rich brother will do when he hears about the mill.'
  - - Copywork
    - 'Your child copies this from the book, slowly and neatly, minding every capital letter and mark of punctuation:

      ~ The poor man thanked his brother for the ham, put it under his arm, and went his way.'
  - - Words to learn
    - 'Learn: trifling, attracted, perplexed, fragrance, approaching, astonishment. Spell each aloud, then write it with its meaning.'
- num: 8
  roman: IV
  idx: 37
  unit: 2
  title: Why the Sea is Salt, part 2, by Mary Howitt
  mins: 30
  goal: Your child finishes the fairy tale, explains how greed was punished, and retells the whole story.
  materials: *id002
  book: 'The end of the tale: the poor brother grows rich and generous, a greedy merchant steals the mill, and it grinds salt until his ship sinks. Definitions and eight Exercises follow.'
  steps:
  - - Warm up
    - Have your child tell you, in a few sentences, what happened in the first part of the story.
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Devoutly, in a reverent manner.

      ~ Landmark, an object on land serving as a guide to seamen.

      ~ Whirlpool, a gulf in which the water moves round in a circle.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - Read it aloud
    - 'Your child reads the end of the tale aloud. Let the merchant''s order to the mill sound greedy and bossy:

      ~ "Now, mill, grind salt," said he; "grind salt with all your might! Salt, salt, and nothing but salt!"'
  - - Talk about it
    - 'Say: What did the poor brother do with the things he ground out of the mill?

      Say: Why wouldn''t he lend the mill to his rich brother?

      Say: How was the greed of the dishonest merchant punished?

      Say: What is the story''s reason that the sea is salt? Is it the real reason?

      Let your child look back at the page to find answers.'
  - - Find it on a map
    - 'The book asks: "Where are Denmark and Norway?" Find them on a map or globe together. The story says it is told by the peasants there.'
  - - Tell it back
    - Your child tells the whole fairy tale, from the ham to the bottom of the sea, as if telling it to a younger child at bedtime.
  - - Copywork
    - 'Your child copies this from the book, slowly and neatly, minding every capital letter and mark of punctuation:

      ~ The dishonest merchant was now very much frightened.'
  - - Words to learn
    - 'Learn: devoutly, reflecting, landmark, extraordinary, whirlpool, peasants. Spell each aloud, then write it with its meaning.'
  practice: For a written narration, your child writes five or six sentences telling the whole story.
- num: 9
  roman: V
  idx: 39
  unit: 2
  title: Popping Corn
  mins: 20
  goal: Your child reads a short, lively poem with expression and pictures the scene it describes.
  materials: *id002
  book: A short poem in three verses about a little boy popping corn in the fire on a stormy autumn night while his small sister watches. There are no Definitions or Exercises.
  steps:
  - - Read it aloud
    - 'Read the poem aloud to your child first, then let your child read it. Let the "Pop! pop!" really pop. It begins:

      ~ One autumn night, when the wind was high,

      ~ And the rain fell in heavy plashes,

      Then have your child read it a second time, more smoothly: the first reading is for the meaning, the second for the sound and rhythm.'
  - - Talk about it
    - 'Say: What was the weather like outside? What was it like inside by the fire?

      Say: Where did the kernels go when they popped?

      Say: What did the little sister call the heap of popped corn? Why is that a good name?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Your child describes the picture the poem makes, as if painting it in words: the room, the fire, the two children, the corn.'
  - - Copywork
    - 'Your child copies these two lines as verse, with the capitals and punctuation as printed:

      ~ Pop! pop! and the kernels, one by one,

      ~ Came out of the embers flying;'
  - - Words to learn
    - Find the rhyming pairs at the ends of the lines and list them. Learn to spell three of them.
  practice: If you can, pop some corn together and reread the poem while it pops.
- num: 10
  roman: VI
  idx: 40
  unit: 2
  title: Smiles
  mins: 30
  goal: Your child reads a longer story aloud, tells it back, and talks about how small kindnesses help.
  materials: *id002
  book: A story about lame Jennie, alone at her window in a narrow city street, and George West, a schoolboy who smiles at her and brings her flowers. Definitions and Exercises follow.
  steps:
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Dismal, gloomy, cheerless.

      ~ Wishfully, with desire.

      ~ Rickety, imperfect, worn out.

      ~ Contrive, to plan.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - Read it aloud
    - 'Your child reads the story aloud, a few paragraphs at a time. It is a long lesson; you can split it over two days. It begins:

      ~ Poor lame Jennie sat at her window, looking out upon the dismal, narrow street,'
  - - Talk about it
    - 'Say: Why was Jennie lonely?

      Say: How did George West make the day pleasant for Jennie?

      Say: What did Jennie tell George about her life before the city?

      Say: What did George''s mother say about kind words?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me the story from Jennie''s side. What did she see and feel?

      For a written narration, your child writes a short paragraph about what George did.'
  - - Copywork
    - 'Your child copies Jennie''s wish exactly as printed. (Notice that the book writes every body as two words.)

      ~ I wish every body who goes by would look up and smile.'
  - - Words to learn
    - 'Learn: dismal, wishfully, rickety, dingy, glancing, dreary, contrive. Spell each aloud, then write it with its meaning.'
  practice: Ask your child to think of one person who could use a smile or a kind word this week, and plan how to give it.
- num: 11
  roman: VII
  idx: 43
  unit: 2
  title: Lazy Ned
  mins: 20
  goal: Your child reads a short poem with a moral and explains the lesson in it.
  materials: *id002
  book: A short poem about Ned, who loved coasting downhill on his sled but was too lazy to pull it back up. Definitions and Exercises follow.
  steps:
  - - Words and meanings
    - 'The new words are at the end of the lesson, under Definitions. The small number in front of each word is the paragraph or verse where it is used. Read them together before the lesson. A few of them:

      ~ Coast, to slide.

      ~ Indolent, lazy.

      ~ Bugbear, something frightful.

      ~ Dunce, a silly fellow.

      Ask your child to find two of these words in the lesson and read the sentence each one is in.'
  - - Read it aloud
    - 'Read the poem aloud to your child first, then let your child read it. It begins with Ned at his happiest:

      ~ "''Tis royal fun," cried lazy Ned,

      ~ "To coast upon my fine, new sled,

      Then have your child read it a second time, more smoothly: the first reading is for the meaning, the second for the sound and rhythm.'
  - - Talk about it
    - 'Say: What did Ned like? What did he not like?

      Say: What did the other boys do that Ned wouldn''t?

      Say: The poem goes from sledding to school. What was Ned''s "uphill" at school?

      Say: What happened to Ned in the end?

      Let your child look back at the page to find answers.'
  - - The last line
    - 'The poem ends with Ned''s fate:

      ~ And died a dunce at last.

      Say: Coasting down is the fun part of sledding. What is the "uphill" part of learning? Is it worth it?'
  - - Tell it back
    - 'Your child explains the poem''s lesson in two or three sentences, starting: "Ned liked ... but ..."'
