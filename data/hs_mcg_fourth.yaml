  goal: Your child reads a short poem about the wide world aloud and explains how a child can be "more than the Earth."
  materials: *id002
  book: A short poem in which a child speaks to the great, wide world, with its water, air, wind and hills, and then hears the world's answer. No author is named.
  steps:
  - - Read it aloud
    - 'Read the poem aloud to your child first, then let your child read it. Read it with wonder in your voice. It begins:

      ~ Great, wide, beautiful, wonderful world,

      Then have your child read it a second time, more smoothly: the first reading is for the meaning, the second for the sound and rhythm.'
  - - Talk about it
    - 'Say: What things in the world does the child name?

      Say: How does the child feel about being so small?

      Say: What answer comes at the end? What can a child do that the Earth cannot?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - Your child says, in their own words, what the poem means.
  - - Copywork
    - 'Your child copies the poem''s closing lines as verse:

      ~ You are more than the Earth, though you are such a dot:

      ~ You can love and think, and the Earth cannot!'
  - - Words to learn
    - No Definitions are printed for this poem. Choose four words from it to learn, for example beautiful, wonderful, world and Earth.
  practice: Learn the first verse by heart.
