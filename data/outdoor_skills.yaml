- key: hiking
  name: Hiking
  icon: 🥾
  ages: 6 and up
  blurb: Plan and pack for a walk, follow trail markers, and work up to a five-mile hike.
  intro: 'Walking is the oldest way to explore, and it''s free. Lina and Adelia Beard described a girls'' Walking Club in 1898, and the 1911 Handbook for Boys gave this advice on hikes: “First, avoid long
    distances.” So start short and build up step by step.'
  steps:
  - t: Walk a mile
    how: 'Walk one mile around your neighborhood with a grown-up and time it. A good goal: you know about how long a mile takes you.'
  - t: Dress for the weather
    how: 'Learn to dress in layers: a base layer, a warm layer, and a rain or wind layer, plus sturdy shoes and a hat. Choose an outfit for a hot day, a cool day, and a rainy day. A good goal: a grown-up
      approves all three.'
  - t: Pack a day pack
    how: 'Pack water, a snack, a rain jacket, a map, a whistle, a flashlight, and sun protection. Carry it on a practice walk. A good goal: you can pack it without a list.'
  - t: Plan a route
    how: 'Choose a park trail on a map, figure out its length, and estimate how long it will take. Leave your plan, with when you''ll be back, with someone at home. A good goal: you''ve followed your plan
      on a real walk.'
  - t: Follow the trail signs
    how: 'On a marked trail, find the paint blazes, posts, or signs and figure out what they mean. Learn trail manners too: stay on the path, step aside for others, and greet people you pass. A good goal:
      you''ve led part of a hike by the markers.'
  - t: Leave no trace
    how: 'On a hike, practice the leave-no-trace ideas on the Caring for Nature page. Pack out every wrapper and leave flowers, rocks, and sticks where they are. A good goal: you come home with all your
      trash and nothing taken from the trail.'
  - t: Build up your distance
    how: 'Over a few weeks, take hikes of 2, 3, and then 5 miles (younger hikers can stop at 3). Keep a hike log with the date, distance, time, and one thing you saw. A good goal: your log shows your longest
      hike.'
  - t: Lead a family hike
    how: 'Plan, pack for, and lead a family hike, choosing the route and setting the pace. A good goal: everyone gets back happy and on time.'
  learn:
