- key: campfires
  name: Campfires
  icon: 🔥
  ages: 9 and up
  blurb: Learn to lay, light, tend, and fully put out a small fire, with a grown-up and only where fires are allowed.
  intro: Knowing how to handle fire means knowing how to keep it small, useful, and completely out when you're finished. The 1911 Handbook for Boys said “There are ways and ways of building a camp fire,”
    and Kephart's 1906 book gives a whole chapter to the campfire. Every step with a flame happens with a grown-up beside you.
  steps:
  - t: Check the rules first
    how: 'With a grown-up, find out whether fires are allowed where you''ll be. Check for burn bans and use only a fire pit, a grill, or an existing fire ring. A good goal: you can explain where and when
      your family is allowed to have a fire.'
  - t: Learn what fire needs
    how: 'Fire needs three things: heat, fuel, and air. Talk through how taking away any one of them puts a fire out. A good goal: you can name the three and give an example of removing each one.'
  - t: Gather tinder, kindling, and fuel
    how: 'Collect dry tinder (dry grass, wood shavings), kindling (pencil-thin sticks), and fuel (sticks up to wrist-thick). Use only dead wood that''s already on the ground, never branches from living
      trees. A good goal: you have three neat piles sorted by size.'
  - t: Prepare the fire site
    how: 'Clear leaves and twigs from around the fire pit, and set a bucket of water and a shovel or stick for stirring within reach. A good goal: a grown-up says the site is ready.'
  - t: Practice two fire lays (unlit)
    how: 'Build a teepee lay and a log-cabin lay around a tinder bundle without lighting them. Leave gaps so air can get in. A good goal: a grown-up agrees both lays would burn well.'
  - t: Light and tend a small fire
    how: 'With a grown-up, light your fire lay with a match. The old handbooks challenged readers to do it with just two matches. Add fuel a little at a time and keep the fire small. A good goal: you''ve
      kept a small, steady fire going for 20 minutes.'
  - t: Put it out cold
    how: Let the fire burn down, then drown it with water, stir the ashes, and drown it again, until there is no smoke, steam or hissing. A grown-up checks it before anyone leaves.
  - t: Leave no trace
    how: 'Pack out all trash, don''t burn plastic or food scraps, and leave the fire ring cleaner than you found it. A good goal: no one could tell you''d been there except by the clean ring.'
  - t: Show a grown-up the whole routine
    how: From checking the rules to putting the fire out, walk a grown-up through each step and explain why it matters.
  grownup: A grown-up is present for every lit fire, holds onto the matches, and decides whether conditions are right. Fires happen only where local rules allow them.
  learn:
