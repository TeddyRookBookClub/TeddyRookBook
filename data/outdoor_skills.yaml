about:
  title: Outdoor Skills
  paragraphs:
  - 'Ideas for things to learn and do outdoors and around home: knots, maps, tracks, birds, trees, stars, weather, camp cooking, whittling, hiking, gardening and more. They take their spirit from the old
    handbooks of camping, woodcraft and nature study that families read more than a hundred years ago. Those books are now in the public domain, and each page links to the parts that inspired it, so you
    can read the originals together.'
  - Pick whatever sounds fun and try the ideas in any order, at your own pace. There's nothing to earn, pass or send in; the point is the doing. Tick off what you've tried if you like keeping track (the
    ticks stay on your own device).
  disclaimer: Teddy Rook Book is not affiliated with or connected to any scouting or youth organization. These pages are free ideas to use however you like.
