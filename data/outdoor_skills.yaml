- key: whittling
  name: Whittling
  icon: 🪵
  ages: 8 and up
  blurb: Learn to handle, care for, and carve with a pocketknife the careful way.
  intro: 'A pocketknife is one of the oldest and handiest tools there is, and using one well starts with respect for the blade. The 1914 printing of the Handbook for Boys put the first rule plainly: “Whittle
    away from you, not toward you.” You''ll begin with soap, and move on to wood only when a grown-up says you''re ready.'
  steps:
  - t: Meet the knife
    how: 'With a grown-up, learn the parts of a folding knife: blade, edge, point, back, handle, and any lock. Practice opening and closing it slowly, keeping your fingers away from the edge. A good goal:
      you can open and close it smoothly five times.'
  - t: Learn the knife rules
    how: 'Learn the rules. Sit down to carve, keep a clear space around you, whittle away from your body, close the knife before you walk, and pass it closed or handle first. A good goal: you can say every
      rule and show how to pass a knife.'
  - t: Carve soap first
    how: 'Carve a simple shape, like a fish, a turtle, or a heart, from a bar of soap using a plastic knife or a vegetable peeler. Practice taking off thin shavings. A good goal: you''ve finished one soap
      carving.'
  - t: Take care of the knife
    how: 'Keep the knife clean and dry, wipe it after each use, and put a drop of oil on the hinge now and then. A dull blade needs more force, so it slips more easily. A good goal: you''ve cleaned and
      oiled it with a grown-up watching.'
  - t: Sharpen with a grown-up
    how: 'With a grown-up, use a sharpening stone to hone the blade at a steady, shallow angle. A good goal: the blade slices paper cleanly and you can explain how you sharpened it.'
  - t: Whittle a simple stick project
    how: 'Using soft wood such as basswood or pine, whittle a tent stake, a point on a roasting stick, or a simple marker peg. Take small cuts, always away from you. A good goal: the project is finished
      and useful.'
  - t: Carve a shape
    how: 'Whittle a simple shape such as a fish, a spoon blank, a butter spreader, or a little bird. Sand it smooth and rub it with a food-safe oil. A good goal: you have a finished piece you''re proud
      of.'
  - t: Show a grown-up your routine
    how: 'Show a grown-up your whole routine: checking your space, opening, carving, closing, cleaning, and putting the knife away.'
  grownup: A grown-up decides when a child is ready for a real knife, supervises every carving session, and keeps the knife between sessions.
  learn:
  - id: officialhandbook00newy
    leaf: 202
    label: '1914 Handbook for Boys: Use of Knife and Ax'
    year: 1914
  group: know-how
- key: camping
  name: Camping Out
  icon: ⛺
  ages: 8 and up
  blurb: Choose a good campsite, pitch a tent and a tarp, build a simple shelter, and sleep out under the sky.
  intro: A good camp is dry, snug, and leaves no mark once you've gone. Dan Beard's 1914 book Shelters, Shacks and Shanties shows dozens of shelters, from a lean-to against a fallen tree to a tree-top house.
    Kephart wrote, “In the school of the woods there is no graduation day.” Your backyard is a fine place to start.
  steps:
  - t: Pack for a night out
    how: 'Make a packing list for a backyard campout, including a sleeping bag and pad, warm layers, a flashlight, water, and a snack. Pack it all yourself. A good goal: a grown-up checks the bag and nothing''s
      missing.'
  - t: Choose a good site
    how: 'Walk your yard or a campground and choose a tent spot. Look for flat, slightly raised ground where rain will drain away, with no dead branches overhead. In the wild, campers stay at least 200
      feet from lakes and streams. A good goal: you can explain why you chose your spot.'
  - t: Pitch a tent
    how: 'Set up a tent, driving the stakes in at a slant and tightening the guy lines with a taut-line hitch. A good goal: you can pitch it with only a little help and it stays tight overnight.'
  - t: Rig a tarp shelter
    how: 'Tie a rope between two trees or posts and drape a tarp over it to make an A-frame, then stake out the corners. Next, try a lean-to with one side high and the other low. A good goal: your tarp
      would shed rain.'
  - t: Build a debris shelter
    how: 'Build a small debris hut from fallen sticks and leaves, starting with a model for a toy and then, with a grown-up, a sit-in version. Use only fallen material, and take it apart and scatter it
      when you''re finished. A good goal: you''ve built it, tested it, and taken it down.'
  - t: Keep a tidy camp
    how: 'During your campout, keep gear in the tent or in bags, put food away so animals can''t reach it, and keep trash bagged. A good goal: your camp passes a grown-up''s inspection.'
  - t: Sleep out
    how: 'Spend a whole night outdoors in your tent or under your tarp in the backyard. A good goal: you wake up outside and can tell what you''d change next time.'
  - t: Strike camp
    how: 'Take everything down. Shake out and dry the tent, fold it, coil your ropes, and look over the ground for anything left behind. A good goal: the spot looks just as it did before.'
  - t: Lead the setup
    how: 'Lead your family in pitching the tent or tarp, giving the directions yourself. A good goal: the shelter is up and you didn''t touch a stake.'
  grownup: Camp out with a grown-up nearby. If your site is near water, a grown-up chooses a spot well back from the edge.
