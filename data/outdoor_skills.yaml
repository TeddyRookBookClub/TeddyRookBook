- key: signaling
  name: 'Signaling: Morse Code and Semaphore'
  icon: 🚩
  ages: 7 and up
  blurb: Send secret messages with Morse code, flags, flashlights, and hand signals.
  intro: Before phones, people sent messages with clicks, flashes, and flags. The 1911 Handbook for Boys taught the American Morse telegraph code, the Myer wig-wag code, and semaphore. By 1914 the handbook
    had switched to International Morse, “the code used in wireless,” which is the code we learn here.
  steps:
  - t: Spell your name in Morse
    how: 'Use the table to write your name in dots and dashes. Then learn SOS (· · · – – – · · ·), the best-known Morse signal. A good goal: you can tap your name from memory.'
  - t: Learn the timing
    how: 'In Morse code, a dash lasts as long as three dots. Leave a gap of one dot between parts of a letter, three dots between letters, and seven between words. Practice by saying “dit” and “dah” out
      loud. A good goal: a grown-up can tell where your letters break.'
  - t: Send by sound and light
    how: 'Send short words by tapping on a table, blowing a whistle, or blinking a flashlight. A partner writes down what they receive. A good goal: you''ve sent five words correctly by two different methods.'
  - t: Learn the whole alphabet
    how: 'Learn all 26 letters. Try learning them in groups, such as the all-dot letters (E, I, S, H) and the all-dash letters (T, M, O). A good goal: you can send and receive a five-word message.'
  - t: Try semaphore
    how: 'Make two flags from dish towels and sticks. Using the old chart, learn the arm positions for the letters in your name. A good goal: someone across the yard can read your name from your flags.'
  - t: Use hand signals on a walk
    how: 'Agree on simple silent hand signals with your family, such as stop, come here, look, and go that way, and use them on a walk. A good goal: the group follows your signals without any talking.'
  - t: Signal at night
    how: 'After dark, flash Morse messages across the yard or between windows with a flashlight. A good goal: you''ve exchanged a message and an answer.'
  - t: Teach a code
    how: 'Teach a family member at least ten Morse letters, then trade secret messages with them. A good goal: they decode one of yours.'
