- key: wildflowers
  name: Wildflowers and Weeds
  icon: 🌼
  ages: 5 and up
  blurb: Discover the wildflowers and everyday “weeds” around you, and learn when to pick and when to leave them be.
  intro: Even a sidewalk crack can hold a wildflower, and the plants we call weeds are some of the toughest, cleverest plants around. In their 1898 book, Lina and Adelia Beard wrote about gathering and
    pressing wild flowers. Today we take photos of most wild plants and leave them growing, and we only pick common weeds.
  steps:
  - t: Take a flower apart
    how: 'Look closely at a garden flower or a dandelion with a magnifying glass. Find the petals, the green sepals underneath, the dusty stamens, and the pistil in the middle. A good goal: you can draw
      a flower and label its parts.'
  - t: Learn the picking rules
    how: 'Talk with a grown-up about when picking is OK. Pick only common weeds such as dandelions and clover, only from your own yard or with the owner''s permission, and never in parks or nature preserves.
      Some wild plants are protected by law. A good goal: you can explain the rules in your own words.'
  - t: Photograph and name ten
    how: 'Find ten wildflowers or weeds and take a photo or make a sketch of each instead of picking it. Name them with a field guide or plant app. A good goal: you''ve made a ten-plant photo page or sketch
      page.'
  - t: Know the plants to steer around
    how: 'Learn to recognize poison ivy (“leaves of three”) and any other plants a grown-up says to avoid where you live. Look, but don''t touch or taste wild plants. A good goal: you can point out the
      plant to avoid in a picture.'
  - t: Press some weeds
    how: 'Pick a few common weed flowers from your own yard and press them between sheets of paper inside a heavy book for one to two weeks. Glue them onto a card with their names. A good goal: you''ve
      made one pressed-flower card.'
  - t: Watch a dandelion's life
    how: 'Mark one dandelion and check it every day. Watch it open in the morning, close at night, and later turn into a puffball of seeds. A good goal: you''ve drawn at least four stages.'
  - t: Go on a sock walk
    how: 'Pull an old fuzzy sock over your shoe and walk through a weedy patch. Count the seeds that hitchhiked on it, then plant the sock in a pot of soil and keep it watered. A good goal: you see what
      sprouts.'
  - t: Count pollinators
    how: 'Watch one patch of flowers for 10 minutes and count the bees, butterflies, and other insects that visit. Try it again on another day. A good goal: you can say which flowers got the most visitors.'
  - t: Teach the picking rules
    how: 'Teach a younger child or a friend which plants it''s OK to pick and why the rest stay put. A good goal: they can tell the rules back to you.'
