- key: helping-neighbors
  name: Helping Neighbors
  icon: 🤝
  ages: 5 and up
  blurb: Help out at home and around your neighborhood, and plan a service project of your own.
  intro: The outdoors includes the street you live on and the people who live there. The 1913 book How Girls Can Help Their Country suggested tying a knot in your handkerchief each morning and untying it
    only after you'd helped someone. It's still a good trick for remembering to be kind.
  steps:
  - t: Take on a new job at home
    how: 'Choose a new household job, such as setting the table, folding laundry, or feeding a pet, and do it every day for two weeks without being reminded. A good goal: the two weeks are up.'
  - t: Try the helping knot
    how: 'For one week, tie a loose knot in a bandana or string bracelet each morning and untie it only after you''ve done something kind for someone. Write down what you did. A good goal: you have seven
      kind deeds on your list.'
  - t: Map your community helpers
    how: 'Draw a map of your neighborhood that shows where the library, fire station, post office, and other places that help people are. A good goal: you can tell what each place does.'
  - t: Say thank you
    how: 'Make thank-you cards or drawings for people who help your community, such as a mail carrier, librarian, sanitation worker, or firefighter, and deliver them with a grown-up. A good goal: you''ve
      given at least three.'
  - t: Lend a neighbor a hand
    how: 'With a parent''s OK, help a neighbor by raking leaves, shoveling a walk, watering plants, or carrying groceries. A good goal: you''ve helped at least twice.'
  - t: Collect for a good cause
    how: 'Find out what a local food pantry or animal shelter needs most, then collect those items from your family and friends and deliver them. A good goal: the donation is dropped off.'
  - t: Plan a service project
    how: 'Plan and lead a small project with your family, such as a park cleanup, a little free library or pantry box, or cards for a nursing home. Write down your plan, do it, and talk about how it went.
      A good goal: the project is finished.'
  - t: Invite someone to help
    how: 'Teach a friend or sibling one way to help in your neighborhood and do it together. A good goal: you''ve helped side by side.'
  learn:
