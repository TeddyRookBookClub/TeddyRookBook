- key: gardening
  name: Gardening
  icon: 🌱
  ages: 5 and up
  blurb: Sprout seeds, grow something you can eat, and feed the soil that feeds you.
  intro: 'Watching a seed you planted turn into food is one of the best kinds of magic. The 1913 book How Girls Can Help Their Country put it simply: “Why not let every one plant at least one tree?” A sunny
    windowsill or a few pots on a porch is all you need to begin.'
  steps:
  - t: Sprout a bean in a jar
    how: 'Line a clear jar with a damp paper towel and tuck a dry bean between the towel and the glass. Keep the towel damp and watch every day. A good goal: you''ve drawn the root and the shoot as they
      appear.'
  - t: Test what plants need
    how: 'Plant a few seeds in two or three cups and change one thing for each, such as putting one in the dark or giving one no water. Compare them after two weeks. A good goal: you can explain what plants
      need to grow.'
  - t: Know your growing season
    how: 'With a grown-up, look up your USDA Plant Hardiness Zone and your area''s average last spring frost date. A good goal: you can say when it''s safe to plant outdoors where you live.'
  - t: Grow something to eat
    how: 'Grow lettuce, radishes, herbs, or cherry tomatoes in a pot or garden bed. Water, weed, and check on it regularly. A good goal: you harvest something you grew.'
  - t: Keep a garden journal
    how: 'Write down what you planted, when, and what happened each week, with drawings or photos. A good goal: your journal covers the whole time from seed to harvest.'
  - t: Start a compost pile
    how: 'Start a compost bin or pile with “greens” (fruit and vegetable scraps, grass clippings) and “browns” (dry leaves, shredded paper). Keep it damp and turn it now and then. A good goal: you can explain
      how scraps turn into soil.'
  - t: Plant for pollinators
    how: 'Plant at least one flower that bees and butterflies like, if you can one that''s native to your area. A good goal: you''ve seen a pollinator visit it.'
  - t: Share your harvest
    how: 'Cook or serve something you grew to your family, and teach someone how you grew it. A good goal: the dish is eaten and your helper knows the steps.'
