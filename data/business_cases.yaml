    url: https://www.annarbor.com/business-review/patrick-doyle-pizza-relaunch-could-have-been-the-end-of-dominos/
- slug: patagonia-dont-buy-this-jacket-2011
  title: Patagonia Says 'Don't Buy This Jacket'
  company: Patagonia
  year: '2011'
  industry: Outdoor clothing
  tags:
  - Marketing
  - Ethics & trust
  - Customers
  summary: On Black Friday 2011, the busiest shopping day of the year, outdoor clothing maker Patagonia ran a full-page New York Times ad telling people not to buy its jacket unless they really needed it. The ad was part of a larger promise to make gear that lasts and to help customers repair, reuse and recycle it.
  moral: Sell things that last, and customers will trust what you sell.
  story: 'Black Friday, the day after Thanksgiving, is famous for crowds, big sales and shopping carts piled high. On that day in 2011, November 25, readers of The New York Times turned to a full-page ad from Patagonia, a California company that makes outdoor clothing and gear. Above a photo of one of its best-selling fleece jackets, the R2, the headline said: "Don''t Buy This Jacket."


    The ad explained why. Making that one jacket, it said, used 135 liters of water, enough to meet the daily needs of 45 people. Shipping it from where it was made to Patagonia''s warehouse in Reno, Nevada, created nearly 20 pounds of carbon dioxide, a gas that warms the planet. Along the way, the jacket left behind waste equal to about two-thirds of its own weight. And this was a jacket made with 60 percent recycled polyester. The message was not that the jacket was bad. It was that everything we buy has a cost to the earth, so we should "buy less and reflect before" spending money.


    The ad pointed readers to Patagonia''s Common Threads Initiative, a pledge with five R''s. Patagonia promised to make long-lasting products, help people repair them, help them find new owners, and take back worn-out gear for recycling. Customers were asked to reduce what they buy, repair what breaks, reuse or pass on what they don''t need, and keep old gear out of landfills. The fifth R was to "reimagine a world where we take only what nature can replace."


    According to a later account by journalist David Gelles, the idea came from longtime Patagonia executive Rick Ridgeway, and the ad cost about $57,000 to run. Not everyone inside the company was sure it was wise. Some worried it would look like a clever trick, or that it would cut sales during the most important shopping season. Then-CEO Casey Sheahan later said the ad brought "$40 million to $50 million of free publicity." Patagonia''s sales went on to reach new highs in the following years, which led some critics to point out the irony of an ad against buying that may have helped the company sell more.


    The repair part of the promise was real, not just words. Patagonia runs a repair center in Reno that the company calls the largest clothing repair operation in North America. By 2017 it employed about 45 full-time repair technicians and fixed about 40,000 items a year. The company later renamed its repair, resale and used-gear efforts "Worn Wear," sent a repair truck on tours to fix clothing from any brand, and worked with the repair website iFixit to publish free guides so people could mend their own gear.


    Patagonia''s founder, Yvon Chouinard, took the idea further in September 2022, when his family gave away its ownership of the company. Most of the company''s stock went to a nonprofit called the Holdfast Collective, which was set to receive about $100 million a year in profits to fight the environmental crisis.


    The "Don''t Buy This Jacket" ad worked because it matched what the company actually did. Plenty of companies talk about values. Patagonia backed its words with products built to last and a repair shop to keep them going.'
  timeline:
  - - Nov 25, 2011
    - The 'Don't Buy This Jacket' ad runs in The New York Times on Black Friday.
  - - Later years
    - Patagonia renames its repair and used-gear efforts 'Worn Wear' and takes repair trucks on tour.
  - - '2015'
    - Patagonia and iFixit publish free do-it-yourself repair guides for Patagonia clothing.
  - - '2017'
    - Patagonia's Reno repair center employs about 45 technicians and fixes about 40,000 items a year.
  - - Sept 14, 2022
    - The Chouinard family transfers ownership of Patagonia to a trust and a nonprofit.
  numbers:
  - - Water used to make one R2 jacket (per the 2011 ad)
    - 135 liters
  - - Cost of the full-page ad (2011)
    - about $57,000
  - - Free publicity estimated by Patagonia's CEO
    - $40 million to $50 million
  - - Repairs per year at Reno center (2017)
    - about 40,000
  - - Profits pledged to environmental work (2022)
    - about $100 million a year
  lessons:
  - 'Match words with actions: Patagonia''s message was believable because it also repaired and took back gear.'
  - 'Quality is a promise: products that last build trust that outlives any single sale.'
  - 'Bold honesty gets noticed: telling customers the truth about costs can make a brand stand out.'
  - 'Watch for contradictions: even a sincere message can be seen as a sales trick, so stay humble about it.'
  questions:
  - Was 'Don't Buy This Jacket' honest advice, smart marketing, or both? Can it be both?
  - What is something you own that you've repaired instead of replacing? How did that feel?
  - If your family ran a business, how could you help customers use what they buy for longer?
  note: Because Patagonia's sales grew after the ad, some critics argued the campaign still encouraged buying; Patagonia said the point was to buy less but better. The 135-liter and 20-pound figures are Patagonia's own estimates from the ad, not independent measurements. In the 2022 ownership change, the Holdfast Collective received about 98 percent of the company's stock and the Patagonia Purpose Trust holds the rest.
  sources:
  - name: Patagonia, 'Don't Buy This Jacket' New York Times ad (Nov 25, 2011, PDF)
    url: https://www.patagonia.com/blog/wp-content/uploads/2016/07/nyt_11-25-11.pdf
  - name: GreenBiz/Trellis, 'Patagonia's conscientious response to Black Friday consumer madness' (2011)
    url: https://trellis.net/article/patagonias-conscientious-response-black-friday-consumer-madness
  - name: David Gelles, 'The Secret History of Don't Buy This Jacket'
    url: https://davidgelles.substack.com/p/the-secret-history-of-dont-buy-this
  - name: UC Berkeley Haas, 'Patagonia's Worn Wear' (2017)
    url: https://haas.berkeley.edu/responsible-business/blog/posts/patagonias-worn-wear-2017/
  - name: ABC7 News, 'Patagonia founder Yvon Chouinard gives away company' (2022)
    url: https://abc7news.com/patagonia-founder-yvon-chouinard-news/12230633/
- slug: costco-wages-membership
  title: Costco Pays Well and Charges a Membership
  company: Costco
  year: 1983–2025
  industry: Retail
  tags:
  - Strategy
  - Culture & people
  - Customers
  summary: Costco sells a limited selection of goods at very low markups, earns much of its profit from yearly membership fees, and pays its workers well above most retailers. Wall Street analysts once called it too generous, but the model has kept members renewing and employees staying for decades.
  moral: Treat workers and customers fairly, and both will keep coming back.
  story: 'Costco opened its first warehouse store in Seattle on September 15, 1983. Its founders, Jim Sinegal and Jeffrey Brotman, built on an idea from retail pioneer Sol Price: a giant, plain store with concrete floors, items stacked on pallets, and prices so low that shoppers would happily pay a yearly fee just to get in.


    The heart of the model is a simple trade. Costco limits how much it adds to the price of what it sells. According to widely reported company policy, it marks up most brand-name goods no more than 14 percent over its cost, and its own Kirkland Signature products no more than 15 percent. A typical supermarket marks up many items far more. Costco also keeps its selection small, fewer than 4,000 different products in a warehouse, according to its 2024 annual report. Carrying fewer items lets Costco buy each one in huge amounts and push suppliers for better prices. Costco even treats a few prices as promises: its food-court hot dog and soda combo has cost $1.50 since 1985.


    With such thin markups, how does Costco make money? A big part of the answer is membership fees. In fiscal 2024, Costco collected about $4.8 billion in membership fees, and those fees made up roughly two-thirds of its operating income. Because members have already paid to shop there, they tend to come back often, and most renew: at the end of 2024, about 93 percent of members in the United States and Canada renewed. That September, Costco raised its basic fee from $60 to $65 a year, its first increase since 2017.


    The other unusual part of Costco''s model is how it treats workers. In 2005, The New York Times reported that Sam''s Club, Costco''s main competitor, paid its workers about 42 percent less on average, and that Wall Street analysts had warned Sinegal he was being too generous to employees. That same year, about 85 percent of Costco''s U.S. workers had company health insurance, compared with less than half at Walmart and Target. Sinegal largely ignored the critics. He argued that well-paid, well-treated workers stay longer and serve customers better, which saves the cost of constantly hiring and training new people.


    Costco kept that approach after Sinegal retired in 2012. By the end of fiscal 2024, it said its starting wage in the U.S. and Canada was at least $19.50 an hour and its average U.S. hourly pay was about $31. In early 2025, during contract talks with its union workers, Costco announced raises that would bring top-of-scale hourly pay to $30.20 that March, with $1 increases planned for each of the next two years.


    Costco''s way of doing business is not the only path to success, and it doesn''t fit every company. But it shows that paying people more and charging customers less are not always the enemies of profit. In fiscal 2024 Costco earned about $7.4 billion in net income, with about 76 million paid members, 890 warehouses and 333,000 employees around the world. For a small business owner, the lesson is not to copy Costco exactly, but to know clearly where your profit comes from.'
  timeline:
  - - Sept 15, 1983
    - Costco opens its first warehouse in Seattle.
  - - '1993'
    - Costco merges with Price Club, the warehouse club started by Sol Price.
  - - '2005'
    - The New York Times reports that analysts call Costco too generous to workers.
  - - Jan 2012
    - Co-founder Jim Sinegal retires as CEO.
  - - Sept 1, 2024
    - Basic membership rises from $60 to $65, the first increase since 2017.
  - - Jan 2025
    - Costco announces raises taking top hourly pay to $30.20 in March 2025.
  numbers:
  - - Maximum markup (company policy)
    - 14 percent on brand names, 15 percent on Kirkland Signature
  - - Membership fees (fiscal 2024)
    - about $4.8 billion
  - - Renewal rate, U.S. and Canada (end of 2024)
    - about 93 percent
  - - Average U.S. hourly pay (end of 2024)
    - about $31
  - - Net income (fiscal 2024)
    - about $7.4 billion
  lessons:
  - 'Know where you really make money: Costco earns a large share of its profit from fees, so it can keep prices low.'
  - 'Less can be more: a small selection makes buying cheaper and shopping simpler.'
  - 'Good pay can pay off: workers who stay longer cost less to hire and train and often serve customers better.'
  - 'Loyalty is earned every year: high renewal rates show members feel they get their money''s worth.'
  questions:
  - Would you pay a yearly fee to shop at a store? What would the store have to offer to make it worth it?
  - Why might paying workers more save a company money in the long run? Can you think of a case where it wouldn't?
  - Costco carries fewer than 4,000 products. What are the pros and cons of offering fewer choices?
  note: The 14 and 15 percent markup limits are widely reported, but they are not spelled out in the company's annual reports. Comparisons with other retailers' pay depend on which jobs and years are compared. Some Costco workers are union members represented by the Teamsters, and pay raises in 2025 came during contract talks.
  sources:
  - name: Costco Wholesale, Form 10-K for fiscal 2024 (SEC)
    url: https://www.sec.gov/Archives/edgar/data/909832/000090983224000049/cost-20240901.htm
  - name: Kiplinger, 'Costco Raises Membership Fees For First Time Since 2017' (2024)
    url: https://www.kiplinger.com/personal-finance/shopping/costco-raises-membership-fees
  - name: Bloomberg Law, 'Costco Raises Pay to Over $30 an Hour for Most Store Workers' (2025)
    url: https://news.bloomberglaw.com/esg/costco-increases-pay-to-over-30-an-hour-for-most-store-workers
