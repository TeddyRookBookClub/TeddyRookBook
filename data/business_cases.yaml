    url: https://www.jacksonprogress-argus.com/news/business/southwest-airlines-reports-first-loss-in-48-years/article_8ab9915b-311d-53b2-8d2b-04948c969f79.html
  - name: NPR via WAMC, 'Southwest will pay a $140 million fine for its meltdown during the 2022 holidays' (2023)
    url: https://www.wamc.org/2023-12-18/southwest-will-pay-a-140-million-fine-for-its-meltdown-during-the-2022-holidays
- slug: enron-andersen-2001
  title: Enron and the Fall of Arthur Andersen
  company: Enron and Arthur Andersen
  year: 2001–2002
  industry: Energy trading and accounting
  tags:
  - Ethics & trust
  - Finance & risk
  - Leadership
  summary: Enron, a Houston energy-trading giant, used off-the-books deals to hide debt and make its profits look bigger, and it collapsed into bankruptcy in December 2001. Its auditor, Arthur Andersen,
    was convicted in 2002 of obstructing justice for destroying Enron documents, and the firm fell apart even though the Supreme Court later overturned the verdict.
  moral: When reported results depend on structures few can explain, auditor independence and board oversight are decisive controls; once trust in the numbers breaks, value can vanish in weeks.
  story: 'In 2000, Enron looked like one of the most successful companies in America. Based in Houston, Texas, it had grown from a natural gas pipeline business into a huge trader of energy and other contracts.
    That year it reported about $111 billion in revenue and had about 21,000 employees. Its stock traded around $90 a share in August 2000, and business magazines praised it as a model of the new economy.


    Behind the shine, something was badly wrong. A jury later found that Enron''s top leaders had misled investors with off-the-books deals. Those were side companies and arrangements that kept debt off
    Enron''s own financial reports and made profits look larger and steadier than they really were. To an outsider, Enron looked strong. In truth, it was carrying risks and losses that ordinary investors
    could not see.


    The cracks showed in 2001. Chief executive Jeffrey Skilling suddenly resigned in August after only about six months in the job, and founder Kenneth Lay took the top job again. Days later, an Enron finance
    executive named Sherron Watkins met privately with Lay to warn him about the company''s accounting. In October, Enron announced a third-quarter loss of more than $600 million and a $1.2 billion cut
    in shareholder equity, which is the value that belongs to the owners. The Securities and Exchange Commission (SEC), the government agency that polices the stock market, opened an inquiry. In November,
    Enron admitted that its earnings for the previous five years had to be corrected to show $586 million in losses. A planned rescue by a rival, Dynegy, fell through, and on December 2, 2001, Enron filed
    for bankruptcy. Its stock had dropped to under a dollar.


    Thousands of people were hurt. Many employees lost their jobs and also their retirement savings, because those savings were heavily invested in Enron stock. Investors lost billions of dollars.


    The courts later sorted out who was responsible. Former finance chief Andrew Fastow pleaded guilty to conspiracy in 2004, testified against his old bosses, and served a six-year prison sentence. In
    May 2006 a jury found Skilling guilty on 19 counts, including fraud, conspiracy and insider trading, and found Lay guilty of fraud and conspiracy. Lay died that July before he could be sentenced, so
    under the law his conviction was wiped away. Skilling was sentenced to 24 years in prison, later reduced to 14 years in a 2013 agreement that also sent more than $40 million of his money to victims.


    Enron''s fall also brought down one of the most famous names in accounting. Arthur Andersen was Enron''s auditor, the outside firm whose job was to check that the company''s numbers were honest. As
    the SEC began looking at Enron, Andersen staff destroyed large amounts of Enron-related documents, which the firm said was routine housekeeping under its records policy. Prosecutors disagreed. In June
    2002 a Houston jury convicted Andersen of obstruction of justice, and its lead Enron partner, David Duncan, pleaded guilty and testified for the government. By August 31, 2002, Andersen had given up
    its right to audit public companies. In 2005, the U.S. Supreme Court unanimously overturned the conviction because the jury instructions had been too vague about what the government had to prove. But
    it was too late. A firm that once employed about 28,000 people had already shrunk to a few hundred.


    Enron''s collapse led Congress to pass tougher accounting and corporate-responsibility rules in 2002, known as the Sarbanes-Oxley Act.

    '
  timeline:
  - - Aug 14, 2001
    - CEO Jeffrey Skilling resigns; Kenneth Lay becomes CEO again.
  - - Aug 22, 2001
    - Executive Sherron Watkins meets privately with Lay about accounting concerns.
  - - Oct 16, 2001
    - Enron reports a big third-quarter loss and a $1.2 billion cut in shareholder equity; the SEC opens an inquiry days later.
  - - Dec 2, 2001
    - Enron files for bankruptcy.
  - - June 15, 2002
    - A jury convicts Arthur Andersen of obstruction of justice for destroying Enron documents.
  - - Aug 31, 2002
    - Andersen gives up its license to audit public companies, effectively ending its U.S. business.
  - - May 31, 2005
    - The Supreme Court unanimously overturns Andersen's conviction over faulty jury instructions.
  - - May 2006
    - A jury convicts Skilling and Lay; Lay dies in July and his conviction is vacated.
  numbers:
  - - Enron revenue in 2000
    - about $111 billion
  - - Enron employees in 2000
    - about 21,000
  - - Losses added by Nov 2001 restatement
    - $586 million over five years
  - - Andersen U.S. workforce before and after
    - about 28,000 shrinking to about 200 by 2006
  - - Skilling's prison sentence
    - 24 years in 2006, cut to 14 years in 2013
  lessons:
  - 'Opacity is itself a risk signal: Enron used off-the-books entities to keep debt off its statements and make profits look larger and steadier. In October 2001 it reported a loss of more than $600 million
    and a $1.2 billion cut in shareholder equity, then restated five years of results to show $586 million in losses. When earnings depend on arrangements few can explain, treat the complexity as a warning,
    and judge substance over form.'
  - 'Auditor independence: Andersen was supposed to verify Enron''s numbers, yet it also earned large consulting fees from Enron, a conflict that weakens a gatekeeper''s willingness to say no. Sarbanes-Oxley
    (2002) responded by restricting non-audit services for audit clients, creating the PCAOB to oversee auditors, and requiring CEOs and CFOs to certify financial reports. Audit committees should test independence,
    not assume it.'
  - 'For trust-based firms, an indictment can be fatal: Andersen''s staff destroyed Enron documents. A jury convicted the firm of obstruction in June 2002, and it surrendered its public-audit practice that
    August. The Supreme Court overturned the verdict in 2005 on flawed jury instructions, but by then about 28,000 U.S. staff had shrunk to a few hundred. For professional-services firms, reputation is
    the business, so legal risk must be managed at the firm level.'
  - 'Confidence can disappear faster than any plan: Enron''s stock traded around $90 in August 2000 and fell below a dollar. It filed for bankruptcy on December 2, 2001, about seven weeks after the October
    loss announcement, after a rescue by Dynegy failed. A firm that depends on counterparties'' trust and on credit faces run dynamics, and hidden leverage makes them worse.'
  - 'Oversight channels and concentration risk: Skilling quit after about six months, and Sherron Watkins warned Lay days later. Employees lost jobs and retirement savings heavily invested in Enron stock.
    Boards need reporting channels that bypass management, which Sarbanes-Oxley now requires audit committees to set up for employee complaints. Companies should also limit how much of employees'' retirement
    wealth sits in the employer''s own stock.'
  questions:
  - It is August 22, 2001. You are Kenneth Lay, the CEO resigned eight days ago, and Sherron Watkins has just warned you about the accounting. What do you do in the next 30 days, and whom do you bring in?
  - As an audit committee chair, what limits would you set on the non-audit work your auditor may perform, and what signs would tell you the audit partner had grown too close to management?
  - Andersen's conviction was overturned, but the firm had already collapsed. What does this imply about how auditors, law firms and consultancies should manage legal and reputational risk across their
    client base?
  - Sarbanes-Oxley added executive certification, internal-control reporting and audit committee complaint procedures. Which of these would most likely have changed the Enron outcome, and which add cost
    without much protection?
  note: Sources give slightly different figures for Enron's October 2001 quarterly loss (about $618 million in Enron's own announcement; some timelines say $638 million), so the story says "more than $600
    million." Kenneth Lay was found guilty, but because he died before sentencing and appeal, the court vacated his conviction, so legally he stands unconvicted. The Supreme Court's 2005 ruling did not
    declare Andersen innocent; it found the jury had been given improper instructions, and prosecutors chose not to retry the case.
  sources:
  - name: HISTORY.com, 'Enron files for bankruptcy' (December 2)
    url: https://www.history.com/this-day-in-history/december-2/enron-files-for-bankruptcy
  - name: 'Seattle Times, ''Timeline: Enron''s collapse and the fallout'' (2006)'
    url: https://archive.seattletimes.com/archive/20060129/enronchron29/timeline--enrons-collapse-and-the-fallout
  - name: CNN Money, 'Andersen guilty' (2002)
    url: https://money.cnn.com/2002/06/13/news/andersen_verdict/
  - name: Wikipedia, 'Arthur Andersen LLP v. United States' (2005 Supreme Court case)
    url: https://en.wikipedia.org/wiki/Arthur_Andersen_LLP_v._United_States
  - name: NBC News, 'Disgraced Enron chief Jeffrey Skilling released from federal custody' (2019)
    url: https://www.nbcnews.com/news/us-news/disgraced-enron-chief-jeffrey-skilling-released-federal-custody-n974361
- slug: volkswagen-dieselgate-2015
  title: Volkswagen and the Diesel Emissions Cheat
  company: Volkswagen
  year: '2015'
  industry: Automobiles
  tags:
  - Ethics & trust
  - Culture & people
  - Leadership
  summary: For years Volkswagen sold "clean diesel" cars fitted with software that switched on full pollution controls only during government tests. After university researchers caught the gap in 2015,
    VW admitted the cheating, pleaded guilty to federal crimes, and paid tens of billions of dollars in penalties and settlements worldwide.
  moral: When a strategic promise cannot be met legitimately at the target cost, pressure migrates into concealment, and the eventual liability can exceed the cost of changing the promise.
  story: 'In the late 2000s, Volkswagen wanted to sell many more cars in the United States. One big part of its plan was "clean diesel." Diesel engines can get great gas mileage, and VW advertised its diesel
    Jettas, Golfs, Passats and Audi A3s as both fuel-efficient and kind to the environment. Many buyers paid extra for them for exactly that reason.


    There was a problem. Diesel engines give off nitrogen oxides, often shortened to NOx, gases that help create smog and can harm people''s lungs. U.S. rules for NOx are strict, and meeting them while
    also keeping good mileage and performance is hard and expensive. According to regulators, VW''s answer was to cheat. It installed software, called a "defeat device," that could tell when a car was being
    tested in a lab. During the test, the pollution controls worked fully. On the open road, they were turned down, and the cars could give off up to 40 times the allowed amount of NOx.


    The cheat was uncovered by outsiders. A nonprofit group, the International Council on Clean Transportation, hired researchers at West Virginia University to test diesel cars on real roads instead of
    in a lab. The VW cars polluted far more than they should have. The researchers shared their findings, and the U.S. Environmental Protection Agency (EPA) and the California Air Resources Board began
    investigating. In September 2015, after regulators demanded an explanation, the company admitted the cars had defeat devices. On September 18, 2015, the EPA publicly accused VW of breaking the Clean
    Air Act in about 482,000 diesel cars sold in the U.S. from model years 2009 to 2015. Worldwide, the number of affected cars was about 11 million. On September 23, chief executive Martin Winterkorn resigned.


    The consequences were enormous. In June 2016, VW agreed to a U.S. civil settlement worth up to $14.7 billion. Just over $10 billion was set aside to buy back or fix about 475,000 cars with 2-liter diesel
    engines and to pay owners between $5,100 and $10,000 each. Another $2.7 billion went to clean up the extra pollution, and $2 billion went to zero-emission vehicle projects. In January 2017, VW agreed
    to plead guilty to three federal felonies, including conspiracy and obstruction of justice, and to pay $2.8 billion in criminal penalties plus $1.5 billion in other civil penalties. By late 2017, VW
    had paid more than $20 billion in fines and settlements.


    Individual people faced justice too. Oliver Schmidt, who had led VW''s environmental and engineering office in Michigan, pleaded guilty and was sentenced in December 2017 to seven years in prison and
    a $400,000 fine. He told the judge he had made bad decisions and was sorry. U.S. prosecutors charged several other current and former VW executives, but most live in Germany, which generally does not
    send its own citizens to other countries for trial.


    The deepest damage was to trust. VW had sold customers a promise, cleaner air with great mileage, and the promise was false. Owners who thought they were helping the environment learned they had been
    driving some of the dirtiest cars on the road.

    '
  timeline:
  - - '2008'
    - VW begins selling 2-liter 'clean diesel' cars (model year 2009 onward) that regulators later found had defeat devices.
  - - Before Sept 2015
    - West Virginia University researchers, working with the ICCT, find VW diesels polluting far more on real roads than in lab tests.
  - - Sept 18, 2015
    - The EPA and California regulators publicly accuse VW of violating the Clean Air Act.
  - - Sept 23, 2015
    - CEO Martin Winterkorn resigns.
  - - June 2016
    - VW agrees to a U.S. settlement worth up to $14.7 billion, including car buybacks.
  - - Jan 11, 2017
    - VW agrees to plead guilty to three felonies and pay $4.3 billion in criminal and civil penalties.
  - - Dec 2017
    - VW executive Oliver Schmidt is sentenced to seven years in prison.
  numbers:
  - - U.S. cars with 2-liter defeat devices
    - about 482,000 (model years 2009–2015)
  - - Affected cars worldwide
    - about 11 million
  - - NOx on the road
    - up to 40 times the U.S. standard
  - - 2016 U.S. civil settlement
    - up to $14.7 billion
  - - 2017 criminal and civil penalties
    - about $4.3 billion
  lessons:
  - 'Goodhart''s law in compliance: When a measure becomes a target, it stops being a good measure. Emissions were certified in a lab, and VW admitted installing software that recognized the test and ran
    full controls only then, while on-road NOx reached up to 40 times the U.S. standard. Any metric verified under known conditions invites gaming, so firms should test their own products in real use before
    outsiders do.'
  - 'A strategy that assumes away a trade-off: VW''s U.S. growth plan relied on clean diesel that combined strong mileage, performance and strict NOx limits, a combination that is hard and expensive to
    achieve. Porter''s point that strategy requires trade-offs applies to engineering, too. When a plan depends on a technical result that does not exist at the target cost, the issue belongs with senior
    leadership, not with engineers told to find a way.'
  - 'Concealed violations compound with sales: The breach covered about 482,000 U.S. two-liter cars from model years 2009 to 2015 and about 11 million worldwide. The U.S. civil settlement alone was up to
    $14.7 billion, equivalent to roughly $31,000 for each of the about 475,000 two-liter cars it covered, and total payments passed $20 billion by late 2017. Hidden regulatory exposure grows with every
    unit sold, so success magnifies the eventual bill.'
  - 'Cover-ups escalate liability: In 2017 VW pleaded guilty to three felonies, including obstruction of justice, and executive Oliver Schmidt was sentenced to seven years. Who knew what inside VW was debated
    for years. Still, the pattern is clear: once a problem is found, obstruction turns a regulatory violation into a criminal case for both the firm and individuals.'
  - 'Brand promises become liabilities when false: Customers paid extra for clean diesel because they believed it was cleaner. The settlement included buybacks, payments of $5,100 to $10,000 per owner,
    $2.7 billion for pollution mitigation and $2 billion for zero-emission projects. When the attribute that justifies a price premium proves false, the premium turns into damages, and the brand equity
    built on it reverses.'
  questions:
  - You are a senior engineering manager in 2007. The U.S. launch depends on a diesel that meets strict NOx limits without hurting mileage, and the current hardware cannot do it at the target cost. What
    are your options, and how and to whom would you escalate?
  - The U.S. civil settlement was up to $14.7 billion for about 475,000 two-liter cars. Calculate the cost per vehicle and compare it with what you think a compliant emissions system might have cost. What
    does this suggest about how firms should price compliance risk?
  - The cheat was found by a nonprofit and university researchers testing cars on real roads. Should companies fund adversarial testing of their own products? Who should own that function and to whom should
    it report?
  - Where else are products certified under scripted conditions, such as fuel economy, software benchmarks or bank stress tests? Where is the risk of gaming highest, and how would you detect it?
  note: The roughly 482,000 figure covers 2-liter cars in the original 2015 notice; later findings added about 80,000 3-liter diesels, bringing the U.S. total to about 590,000 vehicles cited in the 2017
    plea. Exactly who inside VW knew what, and when, was debated for years and was the subject of separate trials in Germany; this case sticks to what VW admitted and what U.S. courts and regulators found.
  sources:
  - name: U.S. EPA, 'Volkswagen to plead guilty and pay $4.3 billion in criminal and civil penalties' (2017)
    url: https://www.epa.gov/archive/epa/newsreleases/volkswagen-agrees-plead-guilty-pay-43-billion-criminal-and-civil-penalties.html
  - name: California Air Resources Board, 'EPA, California notify Volkswagen of Clean Air Act violations' (2015)
    url: https://ww2.arb.ca.gov/news/epa-california-notify-volkswagen-clean-air-act-violations
  - name: Associated Press via Manufacturing.net, 'Volkswagen settles emissions-cheating cases for $14.7 billion' (2016)
    url: https://www.manufacturing.net/automotive/news/13109308/volkswagen-settles-emissionscheating-cases-for-147-billion
  - name: GBH News, 'Senior Volkswagen executive sentenced in diesel emissions scandal' (2017)
    url: https://www.wgbh.org/news/2017-12-07/senior-volkswagen-executive-sentenced-in-diesel-emissions-scandal
  - name: CNBC, 'Martin Winterkorn resigns as Volkswagen CEO' (2015)
    url: https://www.cnbc.com/2015/09/23/martin-winterkorn-resigns-as-volkswagen-ceo.html
- slug: wells-fargo-fake-accounts-2016
  title: Wells Fargo and the Fake Accounts
  company: Wells Fargo
  year: '2016'
  industry: Banking
  tags:
  - Ethics & trust
  - Culture & people
  - Customers
  summary: Under intense pressure to sell more products, Wells Fargo employees opened millions of bank and credit card accounts that customers never asked for. Regulators fined the bank in 2016, and in
    2020 it paid $3 billion and admitted wrongdoing, showing how a sales culture can turn against the very customers it is supposed to serve.
  moral: Aggressive sales targets without controls on how they are met reward gaming; when misconduct is widespread, the fault lies in the incentive system and those who designed it.
  story: 'For years, Wells Fargo was admired as one of the best-run banks in America. A big part of its strategy was "cross-selling," which means selling more products to the customers you already have.
    If you had a checking account, the bank wanted you to have a savings account, a credit card, a debit card and online bill pay too. Each extra product meant more fees and a closer relationship.


    The bank set tough sales goals for branch employees, and many workers felt they could not meet them honestly. Regulators later said that, starting at least in 2011, employees opened accounts customers
    had not authorized in order to hit sales targets and earn bonuses. Some moved customers'' money into new accounts without asking. Others signed customers up for credit cards they never applied for.
    Customers sometimes discovered the problem only when they were charged overdraft fees, annual fees or interest on accounts they did not know existed. Some saw their credit scores harmed.


    Warnings had been building. In May 2015, the Los Angeles City Attorney sued Wells Fargo over these practices, and the bank began a deeper review. On September 8, 2016, the Consumer Financial Protection
    Bureau (CFPB), a federal agency that protects consumers in money matters, announced the results. A consulting firm''s analysis found about 1.5 million deposit accounts that may not have been authorized,
    and employees had applied for 565,443 credit cards without customers'' consent. Wells Fargo agreed to pay $185 million in penalties to the CFPB, another bank regulator, and the City and County of Los
    Angeles, plus refunds to customers. The bank said it had fired about 5,300 employees over several years for this behavior.


    Many people were angry that low-paid branch workers were fired while the leaders who set the targets kept their jobs and pay. Chief executive John Stumpf faced harsh questions in Congress and stepped
    down in October 2016. A wider review in 2017 raised the count of potentially fake accounts to about 3.5 million. In February 2018, the Federal Reserve took the unusual step of capping how large Wells
    Fargo could grow, at about $1.95 trillion in assets, until it fixed its problems. No big bank had faced a limit like that before.


    In February 2020, Wells Fargo agreed to pay $3 billion to settle criminal and civil investigations by the Justice Department and the SEC. As part of the deal, the bank admitted that it had collected
    fees and interest it should not have, harmed customers'' credit ratings and misused their personal information. The top federal prosecutor in Los Angeles said Wells Fargo had "traded its hard-earned
    reputation for short-term profits." Stumpf was barred from banking and paid $17.5 million to a regulator. Carrie Tolstedt, who had led the branch banking division, pleaded guilty to obstructing a bank
    examination, for helping prepare a 2015 memo to regulators that left out how many employees had been fired or had quit amid sales-misconduct reviews. In 2023 she was sentenced to probation and home
    confinement and a $100,000 fine.


    The asset cap stayed in place for more than seven years. The Federal Reserve finally lifted it in June 2025.

    '
  timeline:
  - - '2011'
    - Regulators later say unauthorized accounts were being opened at least from this year.
  - - May 2015
    - The Los Angeles City Attorney sues Wells Fargo over its sales practices.
  - - Sept 8, 2016
    - Regulators announce $185 million in penalties; the bank says it fired about 5,300 employees.
  - - Oct 2016
    - CEO John Stumpf steps down.
  - - Feb 2018
    - The Federal Reserve caps Wells Fargo's size, a first for a U.S. bank.
  - - Feb 21, 2020
    - Wells Fargo agrees to pay $3 billion and admits wrongdoing in a deal with the Justice Department and SEC.
  - - Sept 2023
    - Former retail banking head Carrie Tolstedt is sentenced to probation after pleading guilty to obstruction.
  - - June 3, 2025
    - The Federal Reserve lifts the asset cap.
  numbers:
  - - Possibly unauthorized accounts (2017 estimate)
    - about 3.5 million
  - - Credit card applications without consent
    - 565,443 (2016 finding)
  - - Employees fired over several years
    - about 5,300
  - - 2016 penalties
    - $185 million
  - - 2020 settlement
    - $3 billion
  lessons:
  - 'Rewarding A while hoping for B: Kerr''s 1975 article "On the folly of rewarding A, while hoping for B" describes this pattern. Wells Fargo hoped for deeper customer relationships but rewarded product
    counts through tough goals and bonuses. Employees opened up to about 3.5 million possibly unauthorized accounts and applied for 565,443 credit cards without consent. Incentives should reward the outcome
    the firm wants, and be paired with checks on how results are produced.'
  - 'Thousands of firings signal a system failure: The bank fired about 5,300 employees over several years for the same behavior. When misconduct repeats at that scale, the cause is the design of goals
    and pay, not individual bad actors, a principal-agent problem in which agents respond rationally to the targets set for them. Leaders should treat repeated terminations for one type of misconduct as
    a root-cause alarm.'
  - 'Boards need unfiltered risk data: Carrie Tolstedt pleaded guilty to obstructing a bank examination over a 2015 memo to regulators that left out how many employees had been fired or had quit amid sales-misconduct
    reviews. Curated summaries can hide conduct risk from boards and regulators alike. Directors should require raw indicators, such as terminations, complaints and unused accounts, rather than relying
    on management''s narrative.'
  - 'The license to grow is the largest asset at risk: The 2016 penalty was $185 million and the 2020 settlement $3 billion. But the Federal Reserve''s 2018 cap at about $1.95 trillion in assets lasted
    more than seven years, until June 2025. For regulated firms, constraints on growth can cost shareholders far more than fines, so conduct risk belongs in strategic planning, not only in compliance.'
  - 'Accountability shapes stakeholder response: Public anger focused on low-paid workers being fired while the leaders who set the targets kept their jobs and pay. CEO John Stumpf stepped down in October
    2016 and was later barred from banking. A crisis response that places blame only at the front line damages trust with employees, customers and regulators, and usually delays the reckoning rather than
    avoiding it.'
  questions:
  - You become head of community banking in 2013. Results are strong, but terminations for sales misconduct are rising. What data would you request, and what changes to goals and pay would you make even
    if revenue falls?
  - About 5,300 employees were fired over several years. At what point should repeated individual misconduct be treated as a design failure, and whose job should it be to make that call?
  - Compare the $185 million 2016 penalty, the $3 billion 2020 settlement and an asset cap lasting more than seven years. Which most likely cost shareholders the most, and how would you estimate it?
  - Design a cross-selling incentive plan for a retail bank that rewards real customer value without inviting gaming. Which metrics, controls and clawbacks would you include?
  note: 'Account counts changed as investigations went on: about 2 million accounts in 2016, rising to about 3.5 million in a 2017 review. Tolstedt was the only Wells Fargo executive criminally charged;
    the judge noted that at sentencing. The bank''s 2020 admissions were part of a deferred prosecution agreement, meaning it avoided criminal charges by meeting its terms.'
  sources:
