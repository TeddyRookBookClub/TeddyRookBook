    url: https://en.wikipedia.org/wiki/Tata_Nano_Singur_controversy
- slug: hershey-town-school-trust
  title: 'Milton Hershey: Chocolate, a Town and a School'
  company: Hershey Chocolate Company (The Hershey Company)
  year: 1903–present
  industry: Food and candy
  tags:
  - Leadership
  - Ethics & trust
  - Culture & people
  summary: Milton Hershey built a chocolate factory and a whole town around it, then gave his fortune to a school for children in need. The trust he created still controls the Hershey Company, which has
    shaped every major decision about the company's future.
  moral: Controlling ownership by a charitable trust can protect a company's mission and community ties, but it creates conflicts between diversification, beneficiary interests and local stakeholders.
  story: 'Milton Hershey was born in 1857 in central Pennsylvania. He was fired from his first job as a teenager, and by age 25 his first candy businesses had failed. He kept going. His Lancaster Caramel
    Company became a big success, and in 1893, at the World''s Fair in Chicago, he bought German chocolate-making machines. In 1900 he sold the caramel business for $1 million and bet everything on milk
    chocolate.


    In 1903 Hershey broke ground on a chocolate factory near the village of Derry Church. Instead of just building a factory, he built a town around it. He oversaw the building of comfortable homes for
    workers, good public schools, public transportation, parks, and in 1907 the park that later became Hersheypark. The town took the name Hershey. The factory was profitable almost from the start, and
    its earnings kept growing.


    Milton and his wife, Catherine, were never able to have children. In 1909 they signed a deed of trust creating the Hershey Industrial School, a home and school for orphaned boys who would learn a trade.
    Hershey later explained, "I have no heirs," so he decided the orphan boys of the country would be his heirs. Then, in November 1918, he quietly placed all of his shares in the Hershey Chocolate Company
    into a trust for the school. The shares were worth roughly $60 million at the time. The public did not learn about the gift until 1923.


    During the Great Depression of the 1930s, when millions of Americans were out of work, Hershey started a building program in his town. More than 600 men were hired to build a hotel, a community building,
    a sports arena, a theater and a high school. In 1935 he also set up the M. S. Hershey Foundation to support education and culture in the town. He died in 1945. Years later, in 1963, $50 million from
    the school trust was used to help create the Milton S. Hershey Medical Center.


    The school, now called Milton Hershey School, grew far beyond its beginnings. Today it serves more than 2,100 students from pre-kindergarten through 12th grade, girls and boys from families with limited
    means, and it covers all their costs, including housing, meals, clothing and health care. The trust that funds it is worth many billions of dollars.


    Because the trust holds controlling voting power over The Hershey Company, Milton Hershey''s gift still shapes the company. In 2002 the trust''s board explored selling its controlling stake, and the
    chewing-gum maker Wrigley reportedly offered about $12.5 billion. Townspeople and employees protested, fearing job losses. Pennsylvania''s attorney general went to court and won an order blocking the
    sale while its effects were studied, and the board called off the sale. In 2016 Hershey also turned down a roughly $23 billion offer from snack company Mondelez.


    Tying a charity''s fortune so closely to one company brings both strengths and risks. But Hershey''s choice remains a remarkable example of a business owner deciding that his company''s purpose was
    bigger than making him rich. His factory, his town and his school are still connected more than a hundred years later.

    '
  timeline:
  - - '1857'
    - Milton Hershey is born in Pennsylvania.
  - - '1900'
    - He sells his caramel company for $1 million.
  - - '1903'
    - He breaks ground on a chocolate factory near Derry Church, Pennsylvania.
  - - '1909'
    - Milton and Catherine Hershey create the Hershey Industrial School for orphan boys.
  - - Nov 1918
    - Hershey gives all his company shares, worth about $60 million, to a trust for the school.
  - - 1930s
    - Depression-era building program employs more than 600 men in Hershey.
  - - '1945'
    - Milton Hershey dies.
  - - '2002'
    - Planned sale of the trust's controlling stake is blocked in court and called off.
  numbers:
  - - Sale price of caramel company (1900)
    - $1 million
  - - Value of shares given to the school trust (1918)
    - about $60 million
  - - Wrigley's reported offer (2002)
    - about $12.5 billion
  - - Students at Milton Hershey School (2020s)
    - more than 2,100
  lessons:
  - 'Ownership as long-term governance: In 1918 Milton Hershey put all his company shares, worth about $60 million, into a trust for his school. The trust''s controlling vote still shapes The Hershey Company.
    Ownership structure can set a firm''s purpose for generations, more durably than mission statements or management.'
  - 'Concentration and fiduciary conflict: A trust whose wealth sits mostly in one company faces concentration risk. In 2002 the trust board explored selling its stake, and Wrigley reportedly offered about
    $12.5 billion. Diversification served the school, but local employees and residents feared job losses. Governance must say whose interests come first when they conflict.'
  - 'Stakeholders and the state: Pennsylvania''s attorney general obtained a court order blocking the 2002 sale, and the board called it off. In 2016 Hershey also rejected a roughly $23 billion offer from
    Mondelez. Charitable control can work as a strong takeover defense, and public officials may intervene where community interests are at stake.'
  - 'Counter-cyclical investment: During the Great Depression Hershey hired more than 600 men for a building program in his town. Investing when costs and labor are cheap can build lasting assets and goodwill.
    It requires financial strength and an owner willing to accept short-term returns below what investors might demand.'
  - 'Company towns and paternalism: Hershey built housing, schools, transport and parks around the factory. Provision of community goods can attract and retain workers, but it also deepens dependence on
    one employer and gives the firm influence over local life. Managers should weigh these benefits against the risks of dependence.'
  questions:
  - You are a trustee in 2002 with most of the trust's assets in one company. What is your fiduciary duty to the school, and how would you balance it against the town's interests?
  - Should a state attorney general be able to block the sale of a charity's controlling stake? What precedent does that set for other trust-owned companies?
  - Compare the Hershey trust with Patagonia's 2022 ownership change. What are the governance strengths and weaknesses of each?
  - If you ran The Hershey Company, how would trust control affect your decisions on acquisitions, dividends and plant closures?
  note: The trust holds a controlling share of the votes in The Hershey Company, though it owns a smaller share of the total stock; news reports describe its stake differently. The $12.5 billion Wrigley
    figure was reported by the press; the deal was never completed. The school, once only for orphan boys, now serves girls and boys from low-income families.
  sources:
  - name: Philanthropy Roundtable, 'Milton Hershey' (Philanthropy Hall of Fame)
    url: https://www.philanthropyroundtable.org/hall-of-fame/milton-hershey/
  - name: Milton Hershey School, 'MHS Fast Facts'
    url: https://mhskids.org/about/mhs-fast-facts
