    url: https://en.wikipedia.org/wiki/Firestone_and_Ford_tire_controversy
- slug: perrier-benzene-1990
  title: Perrier and the Benzene Recall
  company: Source Perrier
  year: '1990'
  industry: Beverages
  tags:
  - Crisis
  - Marketing
  - Customers
  summary: In 1990, a county lab in North Carolina found traces of benzene, a cancer-causing chemical, in Perrier, a brand built on purity. Perrier pulled about 160 million bottles worldwide, but shifting
    explanations hurt its credibility, and the brand struggled to win back customers.
  moral: In a contamination crisis, speed of action is not enough; inconsistent explanations destroy credibility, and the damage is greatest for brands whose premium rests on a single attribute.
  story: 'By the late 1980s, Perrier was more than a bottle of fizzy water. Bottled at a natural spring in Vergèze, in southern France, its green bottle had become a symbol of good taste and healthy living.
    In the United States, Perrier sold about $102 million worth of water in 1989, and its whole brand rested on one idea: purity.


    In early 1990, that idea was tested in an unlikely place. Lab workers at the Environmental Health Department in Mecklenburg County, North Carolina, used Perrier as a clean standard when testing local
    water. Suddenly their tests started showing problems. They cleaned their equipment, recalibrated it and tried again. Finally, they tested the Perrier itself and found benzene, a chemical known to cause
    cancer, at levels above federal limits. They alerted the U.S. Food and Drug Administration.


    Perrier''s U.S. company quickly removed its water from American stores on February 9 and 10, 1990. At first, the company described the problem as small and limited. It suggested the issue affected only
    North America, and one early explanation blamed an employee who had supposedly used a benzene cleaner on equipment by mistake. But more contaminated bottles turned up in other countries, including West
    Germany.


    On February 14, 1990, Perrier''s president, Gustave Leven, held a news conference and announced that the company would pull every bottle of Perrier from sale worldwide, about 160 million bottles in
    some 120 countries. "No half measures are possible," he said. He also gave a new explanation: a filter on the line carrying the spring''s natural gas was supposed to be changed every six weeks but had
    been left in for months, letting traces of naturally occurring benzene into the water. The company said it had no insurance to cover the loss. Its stock fell sharply, and France''s stock-market regulator
    opened an inquiry into unusual trading just before the announcement.


    Pulling every bottle worldwide was a bold and costly decision. But the changing story hurt. Customers and reporters had heard one explanation, then another. For a brand that sold purity and trust, looking
    confused or less than open was especially damaging. The company later estimated the recall cost $78 million.


    Perrier returned to U.S. shelves in late April 1990, but winning customers back was hard. By that June, restaurants and hotels, where Perrier had been a favorite, were slow to bring it back. One San
    Francisco restaurant manager said the recall had "really frightened people." Competitors had moved into the space Perrier left empty. Perrier had held about 4.4 percent of the U.S. bottled water market
    in 1989, and it had to fight to win that share back. The company did better in supermarkets, partly because its American business also owned other water brands, such as Poland Spring, Calistoga and
    Arrowhead, that shoppers could choose instead. Having more than one brand had helped the company survive a blow to its most famous one. In 1992, the Swiss food company Nestlé bought Perrier.

    '
  timeline:
  - - Early Feb 1990
    - A Mecklenburg County, North Carolina, lab finds benzene in Perrier and alerts the FDA.
  - - Feb 9–10, 1990
    - Perrier pulls its water from U.S. stores.
  - - Feb 14, 1990
    - Perrier announces a worldwide withdrawal of about 160 million bottles and blames a filter that was not changed.
  - - Late Apr 1990
    - Perrier returns to U.S. stores.
  - - June 1990
    - Reports say restaurants and hotels are slow to bring Perrier back.
  - - '1992'
    - Nestlé acquires Perrier.
  numbers:
  - - Bottles withdrawn worldwide
    - about 160 million (1990)
  - - Countries affected
    - about 120
  - - Perrier U.S. sales in 1989
    - about $102 million
  - - Company's estimated recall cost
    - about $78 million (1990 estimate)
  lessons:
  - 'Know the attribute your premium depends on: Perrier''s brand, and its roughly $102 million in 1989 U.S. sales, rested on one idea: purity. Benzene contamination attacked that idea directly. When a
    crisis hits the attribute that justifies a price premium, the response must be stronger than the technical risk alone would suggest, because the brand''s core claim is at stake.'
  - 'Establish facts before explaining causes: Perrier first suggested the problem was limited to North America and blamed an employee''s cleaning fluid, then announced a worldwide withdrawal and blamed
    a filter left in place for months. Shifting explanations made the company look confused or less than open. Good crisis communication states what is known, what is not, and when the next update will
    come, without guessing at root causes.'
  - 'Single-source operations concentrate risk: All Perrier came from one spring in Vergèze. That made a withdrawal limited to the U.S. hard to defend once contaminated bottles turned up in West Germany.
    Days later, Perrier pulled about 160 million bottles from about 120 countries. When production has a single source, assume a defect is global until proven otherwise, and scope the first action accordingly.'
  - 'A brand portfolio diversifies reputational risk: Perrier''s U.S. business also owned Poland Spring, Calistoga and Arrowhead, which kept supermarket shoppers within the company while Perrier was gone.
    Restaurants and hotels were slower to return, and competitors filled the gap. Multiple brands can hedge a blow to the flagship, and channels driven by image may recover more slowly than retail channels.'
  - 'Crisis readiness includes finance and governance: The company said it had no insurance for the loss, later estimated at about $78 million. Its stock fell sharply, and France''s market regulator opened
    an inquiry into unusual trading just before the announcement. Recall insurance or reserves, and tight controls on who knows and trades before disclosure, are part of crisis preparation, not afterthoughts.'
  questions:
  - It is February 10, 1990. Benzene has been found in U.S. bottles, the cause is unknown, and all Perrier comes from one spring. Do you withdraw worldwide now or wait for tests from other markets? What
    does each kind of error cost?
  - Draft the first public statement you would have issued, separating confirmed facts, open questions and next steps. How would it differ from what Perrier actually said?
  - Restaurants and hotels were slower to bring Perrier back than supermarket shoppers. Why might these channels react differently, and how would you sequence a relaunch across them?
  - The recall cost about $78 million and was uninsured. How should a firm decide which catastrophic product risks to insure, cover with reserves, or diversify through its brand portfolio?
  note: 'Sources differ on dates: some say the U.S. recall began February 9 or 10, while others date the worldwide withdrawal to February 9 instead of the February 14 announcement. Cost estimates also vary
    (about $35 million for the bottles alone at the time of the recall; about $78 million estimated later in 1990). Perrier''s explanations changed during the crisis; the filter explanation was the company''s
    own account. Exact benzene levels are reported differently across sources, so we say only that they exceeded U.S. limits.'
  sources:
  - name: Deseret News / Associated Press, 'Perrier says failure to replace filter caused benzene contamination' (1990)
    url: https://www.deseret.com/1990/2/15/18846581/perrier-says-failure-to-replace-filter-caused-benzene-contamination/
  - name: 'Seattle Times, ''Bubble Trouble: Perrier struggles to regain place in U.S. market'' (1990)'
    url: https://archive.seattletimes.com/archive/19900626/1079093/bubble-trouble----perrier-struggles-to-regain-place-in-us-market
  - name: UNC Libraries, North Carolina Miscellany blog on Mecklenburg County's Perrier discovery
    url: https://blogs.lib.unc.edu/ncm/?p=10724
  - name: Wikipedia, 'Perrier'
    url: https://en.wikipedia.org/wiki/Perrier
- slug: lego-turnaround-2004
  title: LEGO Goes Back to the Brick
  company: The LEGO Group
  year: 2003–2008
  industry: Toys
  tags:
  - Strategy
  - Finance & risk
  - Leadership
  summary: In the early 2000s, LEGO tried so many new things at once that it began losing huge sums of money and came close to collapse. A young new leader, Jørgen Vig Knudstorp, cut costs, sold what didn't
    fit, and refocused the company on its famous plastic brick, and within a few years LEGO was growing fast and making strong profits again.
  moral: Diversification beyond core capabilities can destroy value through complexity costs; a turnaround starts by securing cash, then refocusing on the core and measuring profitability by product.
  story: 'For decades, the LEGO Group, a family-owned toy company in the small Danish town of Billund, seemed unbeatable. Its interlocking plastic bricks were in homes all over the world. But by the late
    1990s, children had video games and computers to play with, and LEGO began to worry that the brick was old-fashioned. The company had its first-ever loss in 1998.


    LEGO''s answer was to try almost everything. It opened theme parks, made video games, launched clothing and TV shows, and designed many new kinds of special pieces. Some ideas were hits, like sets tied
    to the Star Wars and Harry Potter movies. But movie sets sold well only in years when a new movie came out. Meanwhile, every new special piece had to be designed, molded, stored and shipped, which made
    the factories more and more complicated and expensive. In 2003 sales dropped sharply and LEGO began losing money fast.


    The numbers became frightening. In 2004 LEGO lost about 1.9 billion Danish kroner, more than $300 million. Kjeld Kirk Kristiansen, the founder''s grandson who owned the company, put about 800 million
    kroner of his own money into it, and in October 2004 he stepped down as head of the company. He handed the job to Jørgen Vig Knudstorp, a young former McKinsey consultant who had joined LEGO only in
    2001. Many people inside the company wondered whether it would survive.


    Knudstorp''s first goal was simple: stop the bleeding and make sure the company didn''t run out of cash. LEGO cut jobs, from about 7,300 workers worldwide in 2004 to about 5,300 two years later. In
    2005 it sold its Legoland theme parks to Merlin Entertainments, a company owned by the investment firm Blackstone, for about 375 million euros, keeping a 30 percent share. It also moved some manufacturing
    to lower-cost countries in Eastern Europe. Most importantly, it cut back the huge number of different pieces and colors. Designers were asked to build great sets from a smaller, shared "palette" of
    parts, which made each piece cheaper to produce in large amounts.


    The second goal was to remember what LEGO was for. Knudstorp told Fortune magazine in 2006, "Our vision is to be based on the Lego brick, that''s our heritage and our future." LEGO went back to classic
    themes like police stations and fire trucks, built around the basic brick. The company also learned to measure whether new products actually made money, not only whether they were creative.


    The turnaround came faster than many expected. LEGO earned a profit of about 702 million kroner in 2005. By 2008, while much of the world was sliding into a deep recession, LEGO''s sales grew almost
    19 percent to about 9.5 billion kroner, and its profit before tax reached about 1.85 billion kroner. Knudstorp called the year''s results "extraordinarily good." In the years after that, LEGO grew into
    one of the largest toy companies in the world.

    '
  timeline:
  - - '1998'
    - LEGO reports the first loss in its history and begins a long period of trying new businesses.
  - - '2003'
    - Sales fall sharply and the company starts losing money quickly.
  - - Oct 2004
    - Owner Kjeld Kirk Kristiansen invests his own money and hands leadership to Jørgen Vig Knudstorp.
  - - '2004'
    - LEGO loses about 1.9 billion Danish kroner (more than $300 million) and cuts about 1,000 jobs.
  - - July 2005
    - LEGO agrees to sell its Legoland parks to Merlin Entertainments for about 375 million euros, keeping 30 percent.
  - - '2005'
    - LEGO returns to profit, earning about 702 million kroner.
  - - '2008'
    - Sales rise almost 19 percent to about 9.5 billion kroner; profit before tax reaches about 1.85 billion kroner.
  numbers:
  - - Net loss in 2004
    - about 1.9 billion kroner (more than $300 million)
  - - Owner's personal investment (2004)
    - about 800 million kroner
  - - Workers worldwide
    - about 7,300 in 2004, about 5,300 by 2006
  - - Legoland sale price (2005)
    - about 375 million euros
  - - Profit before tax in 2008
    - about 1.85 billion kroner (about $317 million)
  lessons:
  - 'Diversify from core competence: After its first loss in 1998, LEGO moved into theme parks, video games, clothing and TV, businesses that drew little on its capabilities. Prahalad and Hamel''s core
    competence idea (1990) argues that growth should build on what a firm does distinctively well. Knudstorp''s statement that LEGO''s vision is "based on the Lego brick" made that the test for new ventures.'
  - 'Complexity costs are real but hidden: Each new special piece had to be designed, molded, stored and shipped, which made factories more complex and expensive. LEGO moved designers to a smaller shared
    palette of parts, so each piece could be made in larger, cheaper runs. Activity-based costing, developed by Kaplan and Cooper, helps reveal these costs by product. Managers should price variety, not
    just count revenue from it.'
  - 'Secure liquidity first: LEGO lost about 1.9 billion kroner in 2004, and the owner put in about 800 million kroner of his own money. Knudstorp cut staff from about 7,300 to about 5,300, moved some production
    to lower-cost countries and sold Legoland for about 375 million euros while keeping 30 percent. In a turnaround, cash comes before strategy, and selling non-core assets with retained upside preserves
    an option.'
  - 'Balance volatile and evergreen revenue: Star Wars and Harry Potter sets sold well only in movie-release years, tying revenue to other companies'' calendars. LEGO returned to classic themes like police
    stations and fire trucks built around the basic brick. Licensed or hit-driven lines can add growth, but a portfolio needs a stable core so results do not swing with outside events.'
  - 'Discipline innovation with profitability metrics: LEGO kept inventing but learned to measure whether each new product made money, not only whether it was creative. Profit reached about 702 million
    kroner in 2005, and in recession-hit 2008 sales grew almost 19 percent with pre-tax profit of about 1.85 billion kroner. Innovation and financial discipline are complements, not opposites, when every
    project must show a path to return.'
  questions:
  - It is October 2004. You are Knudstorp, facing a loss of about 1.9 billion kroner and an owner who has just put in 800 million of his own. List your first five decisions in order and the cash each one
    frees up or uses.
  - LEGO sold Legoland for about 375 million euros but kept 30 percent. Why keep a minority stake? Evaluate it as a real option against a clean exit.
  - Licensed sets sold well in movie years and poorly otherwise. How would you set the mix between licensed and evergreen product lines, and which metrics would you track?
  - Identify a company today whose diversification has outrun its core capabilities. Which of LEGO's moves would apply, and which depended on LEGO's private family ownership?
  note: A popular retelling says LEGO was "losing $1 million a day" in 2004; that is a rough rounding of the reported loss of about 1.9 billion kroner (more than $300 million) that year, not an official
    figure. Reports also differ on exactly how many different pieces LEGO cut, so this case does not give a number. Knudstorp stepped down as CEO at the end of 2016 and became chairman.
  sources:
  - name: Fortune, 'One brick at a time' (2006)
    url: https://money.cnn.com/magazines/fortune/fortune_archive/2006/06/12/8379252/
  - name: Wikipedia, 'The Lego Group'
    url: https://en.wikipedia.org/wiki/The_Lego_Group
  - name: License Global, 'LEGO shows strong international growth' (2008 results)
    url: https://www.licenseglobal.com/licensing-resources/lego-shows-strong-international-growth-2008
  - name: Knowledge at Wharton, 'How LEGO Stopped Thinking Outside the Box' (interview with David Robertson)
    url: https://knowledge.wharton.upenn.edu/article/how-lego-stopped-thinking-outside-the-box-and-innovated-inside-the-brick/
- slug: nokia-smartphones-2007-2013
  title: Nokia and the Burning Platform
  company: Nokia
  year: 2007–2013
  industry: Mobile phones
  tags:
  - Strategy
  - Innovation
  - Leadership
  summary: Nokia was the world's biggest maker of mobile phones when Apple's iPhone and Google's Android arrived. Within about six years Nokia lost its lead, bet its future on Microsoft's Windows Phone
    software, and finally sold its phone business to Microsoft in 2013. It is one of the fastest falls of a market leader in modern business.
  moral: When competition shifts from devices to ecosystems, hardware scale offers little protection; the decisive choice is which platform to control or join, and the window is short.
  story: 'In 2007 Nokia, a company from Finland, was the king of mobile phones. It sold more phones than anyone else in the world, and its own smartphone software, called Symbian, ran on about 62 percent
    of the world''s smartphones that year, according to the research firm Gartner. Nokia phones were known for being tough, with batteries that lasted for days.


    That same year Apple released the first iPhone, a phone that was mostly a touch screen and worked more like a small computer. In 2008 the first phones running Google''s free Android software appeared,
    and many phone makers began to use it. The contest was changing. People started choosing phones less for the hardware and more for the apps, the web browser and how easy the screen was to use. In this
    new game, a phone maker needed a strong "ecosystem": software, app stores and outside developers all working together.


    Nokia still sold huge numbers of phones, but its smartphone software struggled to keep up. Symbian''s share of smartphones fell to about 47 percent by the end of 2008. In the last three months of 2010,
    according to the research firm Canalys, Android passed Symbian to become the best-selling smartphone software in the world, with about 33 million phones shipped against Symbian''s 31 million.


    In September 2010 Nokia hired a new chief executive, Stephen Elop, who came from Microsoft. In February 2011 he sent employees a memo that soon leaked to the press. He compared Nokia to a man standing
    on a burning oil platform who must decide whether to jump into icy water. "We too, are standing on a ''burning platform,''" he wrote, "and we must decide how we are going to change our behaviour." Three
    days later Nokia announced a major partnership: it would stop betting on Symbian and use Microsoft''s Windows Phone software instead.


    The plan was risky. Nokia''s first Windows phones, the Lumia 800 and Lumia 710, came out in October 2011, months after the announcement, and many buyers stopped buying the older Symbian phones while
    they waited. Windows Phone also had far fewer apps than the iPhone or Android. In the first part of 2012, Samsung passed Nokia as the world''s largest phone maker, ending Nokia''s 14-year run at the
    top. By 2013 Nokia''s share of all mobile phones sold had fallen to about 14 percent, down from about 20 percent a year earlier, according to Gartner.


    On September 3, 2013, Nokia agreed to sell its phone business to Microsoft for 5.44 billion euros, about $7.2 billion, including a license to Nokia''s patents. Nokia itself did not disappear. It kept
    its business making equipment for phone networks and its patents, and it still exists as a large company today. But the Nokia that once led the world in phones was gone.


    People still argue about what went wrong. Some say Nokia was slow to see that software and apps mattered more than hardware. Others say the switch to Windows Phone was the wrong bet, or that it came
    too late to matter. What almost everyone agrees on is how quickly a leader can lose its place when the rules of a market change.

    '
  timeline:
  - - '2007'
    - Apple releases the iPhone; Nokia's Symbian runs on about 62 percent of smartphones, per Gartner.
  - - '2008'
    - The first Android phones appear; Symbian's share falls to about 47 percent by year's end.
  - - Sept 2010
    - Nokia hires Stephen Elop from Microsoft as chief executive.
  - - Q4 2010
    - Android passes Symbian as the world's best-selling smartphone software, per Canalys.
  - - Feb 2011
    - Elop's 'burning platform' memo leaks; Nokia announces it will switch to Microsoft's Windows Phone.
  - - Oct 2011
    - Nokia launches its first Windows phones, the Lumia 800 and Lumia 710.
  - - Early 2012
    - Samsung passes Nokia as the world's largest phone maker, ending a 14-year run.
  - - Sept 3, 2013
    - Nokia agrees to sell its phone business to Microsoft for 5.44 billion euros (about $7.2 billion).
  numbers:
  - - Symbian share of smartphones
    - about 62 percent in 2007, about 47 percent by late 2008
  - - Smartphones shipped, Q4 2010
    - Android about 33 million, Symbian about 31 million
  - - Nokia share of all phones sold (2013)
    - about 14 percent, down from about 20 percent a year earlier
  - - Microsoft purchase price (2013)
    - 5.44 billion euros, about $7.2 billion
  lessons:
  - 'Platforms and network effects change the game: As phones became small computers, value moved to apps, browsers and developers, the two-sided market dynamics Rochet and Tirole described in 2003. More
    users attract more developers, and more apps attract more users. Symbian fell from about 62 percent of smartphones in 2007 to about 47 percent by late 2008, and Android passed it in late 2010. Device
    leadership did not protect platform share.'
  - 'Old strengths can lose relevance: Nokia''s phones were known for toughness and long battery life, strengths measured on the old basis of competition. The iPhone in 2007 and Android in 2008 shifted
    buyers toward software and ease of use. Grove''s strategic inflection point applies: when the basis of competition changes, a firm should reassess which capabilities still create advantage.'
  - 'The Osborne effect: Nokia announced the switch to Windows Phone in February 2011, but the first Lumia phones arrived only in October. Many buyers stopped buying Symbian phones while they waited. Announcing
    a replacement before it is ready can collapse current sales. Platform transitions need bridging products, careful timing and a plan for the installed base.'
  - 'Platform choice involves hard trade-offs: Nokia could improve its own software, adopt Android and compete with many hardware makers, or partner with Microsoft for differentiation but a smaller app
    catalog. It chose Windows Phone, and whether that helped or hurt is still debated. Each option traded control, differentiation, ecosystem size and speed. Leaders should make that trade-off explicit
    rather than assume one path is safe.'
  - 'Urgency messages must survive leaking: Elop''s "burning platform" memo created the sense of urgency Kotter describes as the first step in leading change. But it leaked, and customers and partners heard
    the same message as employees. Samsung passed Nokia in early 2012, and Nokia sold its phone business to Microsoft in 2013 for 5.44 billion euros. Write internal crisis messages assuming they will become
    public.'
  questions:
  - It is early 2008. Symbian still leads, but Android phones are appearing and the iPhone is gaining. As Nokia's CEO, how much R&D would you move to a new software platform, and how would you organize
    it relative to the Symbian business?
  - In February 2011 Nokia's main options were its own platform, Android or Microsoft. Score each on control, differentiation, ecosystem size and time to market. Which would you have chosen?
  - About eight months passed between the Windows Phone announcement and the first Lumia shipments. How would you have managed the transition to limit the fall in Symbian sales?
  - Elop's memo leaked within days. When is a stark internal message about crisis worth the cost it may impose with customers, partners and investors?
  note: Whether the Windows Phone decision helped or hurt Nokia is still debated by former employees, analysts and writers; this case does not take a side. Market-share figures come from research firms
    (Gartner, Canalys) and differ slightly from firm to firm. Nokia continues today as a major maker of network equipment, and the Nokia phone brand was later licensed to another company.
