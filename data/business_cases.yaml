- slug: wells-fargo-fake-accounts-2016
  title: Wells Fargo and the Fake Accounts
  company: Wells Fargo
  year: '2016'
  industry: Banking
  tags:
  - Ethics & trust
  - Culture & people
  - Customers
  summary: Under intense pressure to sell more products, Wells Fargo employees opened millions of bank and credit card accounts that customers never asked for. Regulators fined the bank in 2016, and in 2020 it paid $3 billion and admitted wrongdoing, showing how a sales culture can turn against the very customers it is supposed to serve.
  moral: When the goal matters more than the customer, the goal will eat the customer.
  story: 'For years, Wells Fargo was admired as one of the best-run banks in America. A big part of its strategy was "cross-selling," which means selling more products to the customers you already have. If you had a checking account, the bank wanted you to have a savings account, a credit card, a debit card and online bill pay too. Each extra product meant more fees and a closer relationship.


    The bank set tough sales goals for branch employees, and many workers felt they could not meet them honestly. Regulators later said that, starting at least in 2011, employees opened accounts customers had not authorized in order to hit sales targets and earn bonuses. Some moved customers'' money into new accounts without asking. Others signed customers up for credit cards they never applied for. Customers sometimes discovered the problem only when they were charged overdraft fees, annual fees or interest on accounts they did not know existed. Some saw their credit scores harmed.


    Warnings had been building. In May 2015, the Los Angeles City Attorney sued Wells Fargo over these practices, and the bank began a deeper review. On September 8, 2016, the Consumer Financial Protection Bureau (CFPB), a federal agency that protects consumers in money matters, announced the results. A consulting firm''s analysis found about 1.5 million deposit accounts that may not have been authorized, and employees had applied for 565,443 credit cards without customers'' consent. Wells Fargo agreed to pay $185 million in penalties to the CFPB, another bank regulator, and the City and County of Los Angeles, plus refunds to customers. The bank said it had fired about 5,300 employees over several years for this behavior.


    Many people were angry that low-paid branch workers were fired while the leaders who set the targets kept their jobs and pay. Chief executive John Stumpf faced harsh questions in Congress and stepped down in October 2016. A wider review in 2017 raised the count of potentially fake accounts to about 3.5 million. In February 2018, the Federal Reserve took the unusual step of capping how large Wells Fargo could grow, at about $1.95 trillion in assets, until it fixed its problems. No big bank had faced a limit like that before.


    In February 2020, Wells Fargo agreed to pay $3 billion to settle criminal and civil investigations by the Justice Department and the SEC. As part of the deal, the bank admitted that it had collected fees and interest it should not have, harmed customers'' credit ratings and misused their personal information. The top federal prosecutor in Los Angeles said Wells Fargo had "traded its hard-earned reputation for short-term profits." Stumpf was barred from banking and paid $17.5 million to a regulator. Carrie Tolstedt, who had led the branch banking division, pleaded guilty to obstructing a bank examination, for helping prepare a 2015 memo to regulators that left out how many employees had been fired or had quit amid sales-misconduct reviews. In 2023 she was sentenced to probation and home confinement and a $100,000 fine.


    The asset cap stayed in place for more than seven years. The Federal Reserve finally lifted it in June 2025. For families who run businesses, the story is a sharp warning. Goals are useful, but if the only thing you measure is how much you sell, people will find ways to make the number look good even when the customer loses.'
  timeline:
  - - '2011'
    - Regulators later say unauthorized accounts were being opened at least from this year.
  - - May 2015
    - The Los Angeles City Attorney sues Wells Fargo over its sales practices.
  - - Sept 8, 2016
    - Regulators announce $185 million in penalties; the bank says it fired about 5,300 employees.
  - - Oct 2016
    - CEO John Stumpf steps down.
  - - Feb 2018
    - The Federal Reserve caps Wells Fargo's size, a first for a U.S. bank.
  - - Feb 21, 2020
    - Wells Fargo agrees to pay $3 billion and admits wrongdoing in a deal with the Justice Department and SEC.
  - - Sept 2023
    - Former retail banking head Carrie Tolstedt is sentenced to probation after pleading guilty to obstruction.
  - - June 3, 2025
    - The Federal Reserve lifts the asset cap.
  numbers:
  - - Possibly unauthorized accounts (2017 estimate)
    - about 3.5 million
  - - Credit card applications without consent
    - 565,443 (2016 finding)
  - - Employees fired over several years
    - about 5,300
  - - 2016 penalties
    - $185 million
  - - 2020 settlement
    - $3 billion
  lessons:
  - 'Watch how goals get met: a target that can only be hit by cutting corners will produce cut corners.'
  - 'Measure what customers value: count happy, returning customers, not just products sold.'
  - 'Leaders own the culture: blaming front-line workers for a system the leaders built rarely satisfies anyone.'
  - 'Tell regulators the whole truth: Tolstedt''s crime was hiding information, not just the sales practices themselves.'
  questions:
  - Why might an honest employee open a fake account? What would you do if your job depended on meeting an impossible goal?
  - Was it fair that thousands of branch workers were fired? Who else should have been held responsible?
  - If you ran a small business, what goals would you set for your workers, and how would you check that they were met honestly?
  note: 'Account counts changed as investigations went on: about 2 million accounts in 2016, rising to about 3.5 million in a 2017 review. Tolstedt was the only Wells Fargo executive criminally charged; the judge noted that at sentencing. The bank''s 2020 admissions were part of a deferred prosecution agreement, meaning it avoided criminal charges by meeting its terms.'
  sources:
  - name: KSL / Associated Press, '5,300 Wells Fargo employees fired over 2M phony accounts' (2016)
    url: https://www.ksl.com/article/41398160/5300-wells-fargo-employees-fired-over-2-million-phony-accounts
  - name: CNBC, 'Wells Fargo to pay $3 billion to settle criminal and civil investigations' (2020)
    url: https://www.cnbc.com/2020/02/21/wells-fargo-to-pay-3-billion-in-setting-criminal-and-civil-investigations-into-its-fraudulent-sales-practices.html
  - name: Banking Dive, 'Ex-Wells Fargo executive Tolstedt avoids prison' (2023)
    url: https://www.bankingdive.com/news/wells-fargo-carrie-tolstedt-sentence-probation-avoid-prison-fake-accounts-scandal-judge/693859/
  - name: Associated Press via KSAT, 'Fed lifts restrictions placed on Wells Fargo in 2018' (2025)
    url: https://www.ksat.com/business/2025/06/03/fed-lifts-restrictions-placed-on-wells-fargo-in-2018-because-of-its-fake-accounts-scandal/
- slug: boeing-737-max-2018
  title: Boeing and the 737 MAX
  company: Boeing
  year: 2018–2020
  industry: Aerospace
  tags:
  - Ethics & trust
  - Crisis
  - Culture & people
  summary: Two new Boeing 737 MAX jets crashed within five months, killing 346 people, after a flight-control system called MCAS repeatedly pushed the planes' noses down. Investigators found Boeing had kept key information from regulators and pilots, the plane was grounded for 20 months, and Boeing admitted that two former employees deceived the FAA.
  moral: Saving time on safety is the most expensive shortcut there is.
  story: 'In the early 2010s, Boeing faced a challenge. Its rival Airbus had launched a new, more fuel-efficient version of its popular A320 jet, and airlines were ordering it. Instead of designing a whole new plane, Boeing updated its trusty 737 with bigger, more efficient engines. The result was the 737 MAX. A big selling point was that pilots who already flew the 737 would need only limited extra training to fly the MAX, which would save airlines money.


    The bigger engines changed how the plane handled, making the nose more likely to pitch up in some situations. To make the MAX feel like older 737s, Boeing added software called the Maneuvering Characteristics Augmentation System, or MCAS. It could automatically push the nose down. A congressional investigation later found that MCAS could be triggered by data from just one sensor, so if that sensor failed, MCAS could push the nose down when it shouldn''t. Pilots were not told the system existed.


    On October 29, 2018, Lion Air Flight 610 crashed into the sea off Indonesia minutes after takeoff, killing all 189 people aboard. On March 10, 2019, Ethiopian Airlines Flight 302 crashed shortly after leaving Addis Ababa, killing all 157 aboard. Both crashes were linked to MCAS. Within days of the second crash, regulators around the world, and then the U.S. Federal Aviation Administration (FAA), grounded the 737 MAX. In December 2019, Boeing''s board removed chief executive Dennis Muilenburg.


    Investigations painted a troubling picture. In September 2020, after an 18-month probe, the Democratic majority of the House Transportation Committee issued a report calling the crashes "the horrific culmination" of faulty engineering assumptions, a lack of openness by Boeing''s management and weak oversight by the FAA. The report said Boeing had withheld crucial information from the FAA, its airline customers and pilots. The FAA required fixes, including having MCAS use data from two sensors instead of one, before it let the MAX fly again on November 18, 2020, after the longest grounding of a U.S. airliner.


    In January 2021, Boeing reached a deferred prosecution agreement with the Justice Department, meaning charges would be dropped if Boeing followed the rules for three years. The agreement was based on two former Boeing employees intentionally failing to tell an FAA group about changes to MCAS, so that group did not fully understand MCAS when deciding how much training pilots needed. Boeing agreed to pay over $2.5 billion: a $243.6 million criminal penalty, $1.77 billion to airline customers and $500 million for the families of those who died.


    The story did not end there. In January 2024, a door panel blew off an Alaska Airlines 737 MAX 9 in flight, raising new questions about Boeing''s quality. That May, the Justice Department said Boeing had broken the 2021 agreement. Boeing agreed in July 2024 to plead guilty to a fraud conspiracy charge, but a judge rejected that deal in December. In May 2025, Boeing and the government instead reached a roughly $1.1 billion non-prosecution agreement. In November 2025, Judge Reed O''Connor dismissed the criminal case, saying he disagreed that the deal served the public interest but lacked the power to stop it. Some victims'' families supported the deal; others opposed it and said they would appeal.


    For any company, Boeing''s story is a reminder that people''s lives depend on honest communication. Every shortcut on telling the truth about safety risks real people.'
  timeline:
  - - Oct 29, 2018
    - Lion Air Flight 610 crashes off Indonesia, killing 189.
  - - Mar 10, 2019
    - Ethiopian Airlines Flight 302 crashes, killing 157; the MAX is grounded worldwide within days.
  - - Dec 23, 2019
    - Boeing removes CEO Dennis Muilenburg.
  - - Sept 2020
    - House committee report blames Boeing design failures, lack of transparency and weak FAA oversight.
  - - Nov 18, 2020
    - The FAA clears the redesigned MAX to fly again.
  - - Jan 7, 2021
    - Boeing agrees to pay over $2.5 billion under a deferred prosecution agreement.
  - - Nov 6, 2025
    - A federal judge dismisses the criminal case after a new non-prosecution agreement.
  numbers:
  - - People killed in the two crashes
    - '346'
  - - Length of U.S. grounding
    - about 20 months (March 2019 to November 2020)
  - - 2021 settlement total
    - over $2.5 billion
  - - Fund for victims' families (2021)
    - $500 million
  - - 2025 non-prosecution agreement
    - about $1.1 billion
  lessons:
  - 'Never hide what matters for safety: pilots and regulators can only protect people if they know how a system really works.'
  - 'Watch out for single points of failure: a design that depends on one sensor, one person or one supplier can fail all at once.'
  - 'Competitive pressure is real, but it is no excuse: rushing to match a rival must never outrun honesty about risk.'
  - 'Trust takes years to rebuild: Boeing was still dealing with the fallout more than five years after the crashes.'
  questions:
  - Why do you think Boeing wanted to avoid extra pilot training? Who would have benefited, and who bore the risk?
  - The FAA relied partly on Boeing's own employees to help check Boeing's work. What are the pros and cons of that arrangement?
  - Some families wanted a criminal trial and others wanted the deal. Why might people who suffered the same loss want different outcomes?
  note: The House report quoted here came from the committee's Democratic majority. Boeing's 2021 admissions centered on two former employees misleading one FAA group; the agreement also noted that other Boeing employees did tell other FAA officials about MCAS's expanded range. As of the November 2025 dismissal, victims' families said they planned to appeal; check for later developments.
  sources:
  - name: Boeing Form 8-K exhibit (SEC filing), 'Boeing Reaches Agreement with U.S. Department of Justice' (2021)
    url: https://www.sec.gov/Archives/edgar/data/12927/000001292721000003/a202001jan078kexhibit991.htm
  - name: Reuters via Insurance Journal, 'House report slams FAA, Boeing for horrific culmination of failures' (2020)
    url: https://www.insurancejournal.com/news/national/2020/09/17/582821.htm
  - name: Al Jazeera, 'US judge approves DOJ decision to drop Boeing criminal case' (2025)
    url: https://www.aljazeera.com/economy/2025/11/6/us-judge-approves-doj-decision-to-drop-boeing-criminal-case
  - name: Manufacturing Dive, 'Judge dismisses Boeing 737 MAX criminal charges' (2025)
    url: https://www.manufacturingdive.com/news/judge-boeing-737-max-plane-crashes-criminal-charges-dismissed-trial-chicago/804912/
  - name: Reuters via Yahoo News, 'Boeing seeks to withdraw guilty plea deal' (2025)
    url: https://www.yahoo.com/news/boeing-seeks-withdraw-guilty-plea-205458771.html
- slug: theranos-2015
  title: Theranos and the Blood Test That Wasn't
  company: Theranos
  year: 2015–2022
  industry: Health technology
  tags:
  - Ethics & trust
  - Leadership
  - Innovation
  summary: Theranos promised that a few drops of blood from a finger prick could run hundreds of medical tests, and investors valued the startup at about $9 billion. Reporting in 2015 showed the technology did not work as claimed; the company shut down, and founder Elizabeth Holmes and former president Sunny Balwani were convicted of fraud.
  moral: A big dream sold before it works is just a big promise someone else pays for.
  story: 'In 2003, a 19-year-old Stanford student named Elizabeth Holmes left college to start a company called Theranos. Her idea was exciting. Instead of drawing tubes of blood from your arm, a tiny finger-prick sample could be run through a small machine to check for hundreds of diseases, quickly and cheaply. If it worked, it could change health care.


    Over the next decade, Theranos became one of the most celebrated startups in Silicon Valley. It raised more than $700 million from investors, according to the SEC, and private investors valued it at about $9 billion at its peak. Famous business leaders and former government officials joined its board. Theranos partnered with the Walgreens drugstore chain to offer its tests in stores in Arizona and California. Holmes appeared on magazine covers.


    But the technology did not do what Theranos said it did. In October 2015, Wall Street Journal reporter John Carreyrou published an investigation, based partly on former employees, showing that Theranos ran most of its tests on altered machines made by other companies rather than on its own device, and that its results were often unreliable. Regulators began investigating. In 2016 Theranos lost its Walgreens partnership, cut about 40 percent of its staff, and saw Holmes barred by regulators from owning or running a lab for two years. Real patients had received inaccurate results from its tests.


    In March 2018, the SEC charged Theranos, Holmes and former company president Ramesh "Sunny" Balwani with an "elaborate, years-long fraud" against investors. The SEC said they had exaggerated the technology, falsely suggested it had been used by the U.S. military in battlefield conditions, and projected more than $100 million in revenue for 2014 when the company actually brought in about $100,000. Holmes settled without admitting or denying the charges; she paid a $500,000 penalty, gave up control of the company, and was barred from leading a public company for 10 years. Theranos shut down later in 2018.


    Federal prosecutors then brought criminal charges. In January 2022, a jury found Holmes guilty of four counts of defrauding investors. The same jury found her not guilty on four counts of defrauding patients, and could not agree on three other counts. At trial, Holmes testified for days, blamed lab directors for problems, and accused Balwani, her former boyfriend, of abuse. He denied it. In July 2022, a separate jury convicted Balwani on all 12 counts against him, including fraud against patients. Holmes was sentenced in November 2022 to 11 years and 3 months in prison, and Balwani to nearly 13 years. The judge ordered them to pay $452 million to victims. Holmes reported to prison in May 2023, and an appeals court upheld her conviction and sentence. In 2025, she asked President Trump to commute her sentence, and the request was still pending in 2026.


    Theranos is a powerful warning for anyone who starts a business. It is normal for founders to be hopeful and to talk about what their product will become. But there is a bright line between describing a dream and telling investors and customers that the dream is already real. In health care, where people make decisions about their bodies based on test results, crossing that line can hurt far more than a bank account.'
  timeline:
  - - '2003'
    - Elizabeth Holmes, 19, leaves Stanford and founds Theranos.
  - - 2013–2014
    - Theranos launches tests in Walgreens stores; investors value it at about $9 billion.
  - - Oct 2015
    - The Wall Street Journal reports Theranos's technology does not work as claimed.
  - - '2016'
    - Theranos loses its Walgreens partnership; regulators bar Holmes from running a lab for two years.
  - - Mar 2018
    - The SEC charges Theranos, Holmes and Balwani with fraud; the company shuts down later that year.
  - - Jan 3, 2022
    - A jury convicts Holmes on four counts of defrauding investors and acquits her on patient counts.
  - - July 2022
    - A jury convicts Balwani on all 12 counts.
  - - Nov 18, 2022
    - Holmes is sentenced to 11 years and 3 months in prison.
  numbers:
  - - Peak private valuation
    - about $9 billion (around 2014)
  - - Money raised from investors
    - more than $700 million (SEC, 2018)
  - - Projected vs. actual 2014 revenue (SEC)
    - more than $100 million projected; about $100,000 actual
  - - Holmes's prison sentence
    - 135 months (11 years, 3 months)
  - - Restitution ordered (2023)
    - $452 million
  lessons:
  - 'Don''t sell what doesn''t exist yet: be clear about the difference between your goal and your product today.'
  - 'Check before you trust: famous board members and big valuations are not proof that a product works.'
  - 'Protect the people who speak up: former employees and a reporter, not insiders in charge, brought the truth out.'
  - 'Stakes rise with the product: a false claim about a medical test can harm people''s health, not just their wallets.'
  questions:
  - Where is the line between being an optimistic founder and lying? Can you think of examples on each side?
  - Why do you think so many smart, experienced investors and board members believed Theranos?
  - The jury convicted Holmes of fraud against investors but not against patients. Why might a jury see those charges differently?
  note: 'Figures for money raised differ: the SEC cited more than $700 million, while some news reports say nearly $1 billion. Holmes''s abuse allegations against Balwani were made in her testimony and denied by him; no court ruled on them. Her 2025 commutation request had not been decided as of September 2026.'
  sources:
  - name: NPR, 'SEC charges Theranos founder Elizabeth Holmes with elaborate, years-long fraud' (2018)
    url: https://www.npr.org/sections/thetwo-way/2018/03/15/593809254/sec-charges-theranos-founder-elizabeth-holmes-with-elaborate-years-long-fraud
  - name: 'NPR, ''Elizabeth Holmes verdict: Former Theranos CEO is found guilty on 4 counts'' (2022)'
    url: https://www.npr.org/2022/01/03/1063973490/elizabeth-holmes-trial-verdict-guilty-theranos
  - name: CNBC via NBC Bay Area, 'Elizabeth Holmes sentenced to more than 11 years in prison' (2022)
    url: https://www.nbcbayarea.com/news/business/money-report/former-theranos-ceo-elizabeth-holmes-sentenced-to-more-than-11-years-in-prison/3082761/?amp=1
  - name: CNBC, 'Elizabeth Holmes will report to jail on May 30' (2023)
    url: https://www.cnbc.com/2023/05/17/disgraced-theranos-ceo-elizabeth-holmes-will-report-to-jail-on-may-30.html/
  - name: ABC7 News, 'Elizabeth Holmes asks Trump administration to commute her prison sentence' (2026)
    url: https://abc7news.com/post/theranos-founder-elizabeth-holmes-requests-president-donald-trump-commute-prison-sentence-us-department-justice/18444913/
- slug: ford-pinto-1970s
  title: The Ford Pinto and the Cost-Benefit Memo
  company: Ford Motor Company
  year: 1971–1980
  industry: Automobiles
  tags:
  - Ethics & trust
  - Finance & risk
  - Operations
  summary: Ford's small, cheap Pinto had a fuel tank that could leak and catch fire in rear-end crashes, leading to a huge jury verdict in 1978 and a recall of 1.5 million cars. A famous 1973 Ford memo that put a dollar value on human life is often told as the "Pinto memo," but the real document was about something else, and the full story is more complicated than the legend.
  moral: When you weigh lives against dollars, the scale itself will be judged.
  story: 'In the late 1960s, small, inexpensive imported cars from Japan and Germany were winning American buyers. Ford answered with the Pinto, a low-priced small car launched for the 1971 model year. But the Pinto''s fuel tank sat behind the rear axle, and in some rear-end crashes the tank or its filler pipe could be punctured, spilling gasoline that could catch fire.


    The most famous court case began in 1972. A Pinto stalled on a California freeway and was hit from behind. It burst into flames. The driver, Lilly Gray, died, and her 13-year-old passenger, Richard Grimshaw, suffered terrible burns that required many surgeries. His family and Gray''s family sued Ford. In February 1978, after a six-month trial that included evidence about Ford''s own crash tests, a jury awarded about $2.5 million to Grimshaw and about $560,000 to the Gray family, plus $125 million in punitive damages, which are meant to punish a company rather than just repay a victim. The judge cut the punitive award to $3.5 million, and a California appeals court upheld the verdict in May 1981.


    Regulators acted too. The Center for Auto Safety had asked the National Highway Traffic Safety Administration (NHTSA), the federal car-safety agency, for a recall in 1974. In 1977, Mother Jones magazine published a sharp article called "Pinto Madness." NHTSA opened a defect investigation that September, ran its own crash tests, and found the fuel system a safety defect. On June 9, 1978, Ford agreed to recall about 1.5 million 1971–1976 Pintos and some Mercury Bobcats to add shields and a better filler pipe. In 1980, Ford was put on trial in Indiana for reckless homicide after three young women died in a 1978 Pinto fire. The jury found Ford not guilty.


    Then there is the memo. Mother Jones and many later textbooks described a Ford document that seemed to show the company deciding it was cheaper to let people die than fix the Pinto. A real Ford document does exist. Written in 1973 by two Ford employees, Grush and Saunby, it was sent to federal regulators to argue against a proposed rule. It estimated that a fix costing about $11 per vehicle, for about 12.5 million cars and light trucks, would cost $137 million. It weighed that against about $49.5 million in "benefits," based on preventing an estimated 180 burn deaths and 180 serious injuries. For each death it used a value of about $200,000, a figure taken from a government estimate of the cost to society of a traffic death.


    What is disputed is what the memo meant. Law professor Gary Schwartz, in a well-known 1991 study, pointed out that the memo was about fuel leaks in rollover crashes for all cars and light trucks, not rear-end crashes in the Pinto, and that the Grimshaw judge did not allow it into evidence. He also estimated that Pinto rear-end fires caused about 27 deaths, far fewer than the 500 that Mother Jones had claimed without a clear source. Other writers still see the memo as a troubling example of turning human lives into numbers.


    So what lessons hold up? The courts and regulators established that the Pinto''s fuel system was defective and that Ford was liable for harm in the Grimshaw case. Ford did not admit fault in the criminal case and was acquitted. And the memo, whatever its exact purpose, became a lasting symbol. Companies must make trade-offs about cost and safety every day, but how they make those choices, and how they would look to a jury or a grieving family, matters enormously.'
  timeline:
  - - '1971'
    - Ford introduces the Pinto, a low-priced small car.
  - - '1972'
    - Pinto crash in California kills Lilly Gray and badly burns 13-year-old Richard Grimshaw.
  - - Sept 1973
    - Ford's Grush-Saunby cost-benefit analysis on rollover fuel leaks is sent to regulators.
  - - '1977'
    - Mother Jones publishes 'Pinto Madness'; NHTSA opens a defect investigation in September.
  - - Feb 1978
    - A California jury awards $125 million in punitive damages in Grimshaw v. Ford; the judge cuts it to $3.5 million.
  - - June 9, 1978
    - Ford agrees to recall about 1.5 million Pintos.
  - - Mar 13, 1980
    - An Indiana jury finds Ford not guilty of reckless homicide.
  - - May 1981
    - A California appeals court upholds the Grimshaw verdict.
  numbers:
  - - Pintos recalled (1978)
    - about 1.5 million (1971–1976 models)
  - - Grimshaw punitive damages (1978)
    - $125 million by the jury, reduced to $3.5 million
  - - Memo's estimated fix cost
    - about $11 per vehicle, $137 million total (1973 estimate)
  - - Memo's estimated 'benefits'
    - about $49.5 million (1973 estimate)
  - - Rear-end fire deaths (Schwartz estimate)
    - about 27, versus 500 claimed in 1977
  lessons:
  - 'Fix known hazards early: the Pinto''s problems grew far more costly in courtrooms and recalls than any early fix would have been.'
  - 'Remember the person behind the number: cost-benefit math is a tool, but people will judge you by how it treats human lives.'
  - 'Check the famous story: even well-known business legends can mix real facts with myths.'
  - 'Courts and regulators speak loudly: a defect finding and a big jury verdict can shape a brand for decades.'
  questions:
  - Every product has some risk. How should a company decide how much safety is 'enough'?
  - Why do you think the memo story spread so widely even though it wasn't about the Pinto? What makes a story stick?
  - Is it wrong to put a dollar value on a human life? If governments and companies don't, how else could they decide which safety rules to adopt?
  note: 'Much of the popular Pinto story is contested. Documented: the Grimshaw verdict and its 1981 affirmation; NHTSA''s defect finding and the June 1978 recall; Ford''s 1980 acquittal in Indiana; and the 1973 Grush-Saunby analysis with its $11-per-vehicle and $200,000-per-death figures. Disputed: whether that analysis had anything to do with the Pinto''s design (Schwartz and others say it concerned rollovers for all vehicles and was excluded from the Grimshaw trial), and how many people died in Pinto fires (estimates range from about 27 to the unsourced 500). Schwartz''s analysis also found the Pinto''s overall fatality rate roughly average for small cars of its time. Some summaries still describe the memo as a Pinto-specific decision; we treat that as unproven.'
  sources:
  - name: Center for Auto Safety, 'Ford Pinto Fuel Tank'
    url: https://www.autosafety.org/ford-pinto-fuel-tank/
  - name: Tort Museum, 'Grimshaw v. Ford Motor Company, 1981'
    url: https://www.tortmuseum.org/?p=57
  - name: 'Mark P. Rossow, ''Ethics: An Alternative Account of the Ford Pinto Case'' (PDHonline course summarizing Schwartz, 2015)'
    url: https://pdhonline.com/courses/r152/Ethics-Alternative Account of Pinto .pdf
  - name: EBSCO Research Starters, 'Court Finds Ford Ignored Pinto's Safety Problems'
    url: https://www.ebsco.com/research-starters/law/court-finds-ford-ignored-pintos-safety-problems
- slug: firestone-ford-explorer-2000
  title: Firestone, Ford and the Explorer Tire Recall
  company: Bridgestone/Firestone and Ford
  year: 2000–2001
  industry: Automobiles and tires
  tags:
  - Crisis
  - Customers
  - Leadership
  summary: In 2000, Firestone recalled about 6.5 million tires after tread separations, many on Ford Explorer SUVs, were linked to deadly rollover crashes. Instead of working together, the two companies blamed each other, ended their long business relationship, and taught a lasting lesson about how not to handle a shared crisis.
  moral: When partners point fingers in a crisis, both hands end up empty.
  story: 'Ford and Firestone had worked together for many decades, and Firestone was a major supplier of tires for Ford vehicles. In the 1990s, one of Ford''s best-selling products was the Explorer, a popular sport utility vehicle (SUV), and many Explorers came with Firestone tires.


    Trouble showed up first in other countries. In hot places like Saudi Arabia and Venezuela, the tread on some Firestone tires was peeling away from the tire at highway speed, a failure called tread separation. When that happened on an SUV, the vehicle could swerve and roll over. In 1999, Ford began replacing tires on Explorers in Saudi Arabia, and in May 2000 it did the same for about 150,000 tires in Venezuela. In the U.S., a researcher at State Farm insurance noticed a pattern of tread-separation claims in 1998 and 1999 and forwarded them to the federal car-safety agency, NHTSA.


    On August 9, 2000, Bridgestone/Firestone, the U.S. arm of Japan''s Bridgestone, announced a recall of about 6.5 million tires: certain sizes of its ATX, ATX II and Wilderness AT models. Many of the worst-performing tires had been made at a Firestone plant in Decatur, Illinois. Congress held hearings in September, and by November 2000 it had passed the TREAD Act, a law requiring car and tire makers to report safety problems, including problems found overseas, to U.S. regulators sooner.


    As the crisis grew, the two companies turned on each other. Firestone argued that the Explorer itself was part of the problem, pointing out that Ford had recommended a fairly low tire pressure of 26 pounds per square inch, which can make tires run hotter. Ford said the tires were the problem. In October 2000, Firestone''s top executive, Masatoshi Ono, resigned. On May 21, 2001, Firestone''s new chief, John Lampe, wrote to Ford''s chief executive saying Firestone would no longer sign new contracts to supply Ford. The next day, Ford announced it would replace all of its remaining Wilderness AT tires, about 13 million of them, at a cost of about $3 billion.


    The government had the final word on the technical question. In October 2001, NHTSA reported that many Wilderness AT tires made before May 1998 had a safety defect, and Firestone agreed to recall another 3.5 million tires. NHTSA linked 271 U.S. deaths to rollovers and other crashes involving the tire failures. It also said Explorers with tread separations were no more likely to crash than other SUVs and that it "found no basis" for Firestone''s claims against the Explorer. Firestone disputed the report, and Ford said it was vindicated. Firestone closed the Decatur plant at the end of 2001 and agreed that November to pay $41.5 million to settle lawsuits brought by states.


    Both brands were badly damaged, and families were left grieving. The case is often taught because so much went wrong at once. Warning signs overseas were not shared quickly with U.S. regulators. Two longtime partners argued in public instead of solving the problem together. And customers, who simply wanted to know whether their family car was safe, were caught in the middle. Any business that depends on suppliers or partners can learn from it: agree on how you will handle a crisis before one comes.'
  timeline:
  - - 1998–1999
    - A State Farm researcher spots a pattern of Firestone tread-separation crashes and alerts NHTSA.
  - - Aug 1999
    - Ford begins replacing Firestone tires on Explorers in Saudi Arabia.
  - - May 2000
    - Ford replaces about 150,000 Firestone tires in Venezuela.
  - - Aug 9, 2000
    - Firestone recalls about 6.5 million ATX, ATX II and Wilderness AT tires.
  - - Nov 1, 2000
    - The TREAD Act becomes law, requiring faster defect reporting.
  - - May 21–22, 2001
    - Firestone ends new contracts with Ford; Ford announces it will replace about 13 million more tires.
  - - Oct 4, 2001
    - After NHTSA finds a defect, Firestone agrees to recall another 3.5 million tires.
  numbers:
  - - Tires in the August 2000 recall
    - about 6.5 million
  - - Tires Ford replaced in 2001
    - about 13 million, at about $3 billion
  - - Additional Firestone recall (Oct 2001)
    - 3.5 million tires
  - - U.S. deaths linked by NHTSA
    - 271 (as of 2001)
  - - Ford's recommended Explorer tire pressure
    - 26 psi
  lessons:
  - 'Share bad news fast: warnings from overseas could have helped U.S. customers sooner.'
  - 'Solve the problem before assigning blame: public finger-pointing made both companies look like they cared more about themselves than customers.'
  - 'Plan crises with your partners: agree ahead of time how you and key suppliers will respond if something goes wrong.'
  - 'Small details matter: something as simple as tire pressure became part of a billion-dollar argument.'
  questions:
  - Why do you think Ford and Firestone ended up blaming each other instead of working together?
  - If you depend on one key supplier for your business, what would you want to agree on before any trouble starts?
  - The TREAD Act made companies report overseas problems to U.S. regulators. Why might a company be slow to share that kind of information on its own?
  note: 'Death counts vary by date and source: about 203 U.S. deaths had been linked by mid-2001, and NHTSA cited 271 by its October 2001 decision, with dozens more reported in Venezuela. Firestone continued to dispute NHTSA''s finding that the Explorer was not a factor, and the question of the Explorer''s role was argued in many private lawsuits. This case sticks to NHTSA''s official conclusions.'
  sources:
  - name: CNN Money, 'Firestone may face bigger recall' (2001)
    url: https://money.cnn.com/2001/07/19/companies/firestone/index.htm
  - name: CNN Money, 'Firestone recalls 3.5 million more tires' (2001)
    url: https://money.cnn.com/2001/10/04/recalls/firestone/index.htm
  - name: Ward's Auto, 'Good news for Ford, bad news for Firestone' (2001)
    url: https://www.wardsauto.com/news/archive-wards-good-news-for-ford-bad-news-for-firestone/765019/
  - name: Wikipedia, 'Firestone and Ford tire controversy'
    url: https://en.wikipedia.org/wiki/Firestone_and_Ford_tire_controversy
- slug: perrier-benzene-1990
  title: Perrier and the Benzene Recall
  company: Source Perrier
  year: '1990'
  industry: Beverages
  tags:
  - Crisis
  - Marketing
  - Customers
  summary: In 1990, a county lab in North Carolina found traces of benzene, a cancer-causing chemical, in Perrier, a brand built on purity. Perrier pulled about 160 million bottles worldwide, but shifting explanations hurt its credibility, and the brand struggled to win back customers.
  moral: In a crisis, a clear truth told once beats a convenient story told twice.
  story: 'By the late 1980s, Perrier was more than a bottle of fizzy water. Bottled at a natural spring in Vergèze, in southern France, its green bottle had become a symbol of good taste and healthy living. In the United States, Perrier sold about $102 million worth of water in 1989, and its whole brand rested on one idea: purity.


    In early 1990, that idea was tested in an unlikely place. Lab workers at the Environmental Health Department in Mecklenburg County, North Carolina, used Perrier as a clean standard when testing local water. Suddenly their tests started showing problems. They cleaned their equipment, recalibrated it and tried again. Finally, they tested the Perrier itself and found benzene, a chemical known to cause cancer, at levels above federal limits. They alerted the U.S. Food and Drug Administration.


    Perrier''s U.S. company quickly removed its water from American stores on February 9 and 10, 1990. At first, the company described the problem as small and limited. It suggested the issue affected only North America, and one early explanation blamed an employee who had supposedly used a benzene cleaner on equipment by mistake. But more contaminated bottles turned up in other countries, including West Germany.


    On February 14, 1990, Perrier''s president, Gustave Leven, held a news conference and announced that the company would pull every bottle of Perrier from sale worldwide, about 160 million bottles in some 120 countries. "No half measures are possible," he said. He also gave a new explanation: a filter on the line carrying the spring''s natural gas was supposed to be changed every six weeks but had been left in for months, letting traces of naturally occurring benzene into the water. The company said it had no insurance to cover the loss. Its stock fell sharply, and France''s stock-market regulator opened an inquiry into unusual trading just before the announcement.


    Pulling every bottle worldwide was a bold and costly decision. But the changing story hurt. Customers and reporters had heard one explanation, then another. For a brand that sold purity and trust, looking confused or less than open was especially damaging. The company later estimated the recall cost $78 million.


    Perrier returned to U.S. shelves in late April 1990, but winning customers back was hard. By that June, restaurants and hotels, where Perrier had been a favorite, were slow to bring it back. One San Francisco restaurant manager said the recall had "really frightened people." Competitors had moved into the space Perrier left empty. Perrier had held about 4.4 percent of the U.S. bottled water market in 1989, and it had to fight to win that share back. The company did better in supermarkets, partly because its American business also owned other water brands, such as Poland Spring, Calistoga and Arrowhead, that shoppers could choose instead. Having more than one brand had helped the company survive a blow to its most famous one. In 1992, the Swiss food company Nestlé bought Perrier.


    For any business, especially a small one built on a reputation, the lesson is clear. When something goes wrong, act fast, find out the facts before you explain, and then tell the whole story plainly. Customers can forgive an honest mistake far more easily than an explanation that keeps changing.'
  timeline:
  - - Early Feb 1990
    - A Mecklenburg County, North Carolina, lab finds benzene in Perrier and alerts the FDA.
  - - Feb 9–10, 1990
    - Perrier pulls its water from U.S. stores.
  - - Feb 14, 1990
    - Perrier announces a worldwide withdrawal of about 160 million bottles and blames a filter that was not changed.
  - - Late Apr 1990
    - Perrier returns to U.S. stores.
  - - June 1990
    - Reports say restaurants and hotels are slow to bring Perrier back.
  - - '1992'
    - Nestlé acquires Perrier.
  numbers:
  - - Bottles withdrawn worldwide
    - about 160 million (1990)
  - - Countries affected
    - about 120
  - - Perrier U.S. sales in 1989
    - about $102 million
  - - Company's estimated recall cost
    - about $78 million (1990 estimate)
  lessons:
  - 'Get the facts before you explain: early guesses that later change can damage trust more than the problem itself.'
  - 'Protect your core promise: when your brand stands for purity or safety, even a small slip feels huge to customers.'
  - 'Bold action helps but isn''t enough: a full recall shows you care, but customers also need a clear, consistent story.'
  - 'Empty shelves invite rivals: when you leave the market, competitors will happily take your place.'
  questions:
  - Why do you think a small amount of benzene hurt Perrier so much more than it might have hurt another kind of company?
  - Perrier pulled every bottle worldwide. Was that the right call, even though it was so expensive? Why?
  - If your family business made a mistake that customers noticed, what would you say to them first, and how would you make sure it was true?
  note: 'Sources differ on dates: some say the U.S. recall began February 9 or 10, while others date the worldwide withdrawal to February 9 instead of the February 14 announcement. Cost estimates also vary (about $35 million for the bottles alone at the time of the recall; about $78 million estimated later in 1990). Perrier''s explanations changed during the crisis; the filter explanation was the company''s own account. Exact benzene levels are reported differently across sources, so we say only that they exceeded U.S. limits.'
  sources:
  - name: Deseret News / Associated Press, 'Perrier says failure to replace filter caused benzene contamination' (1990)
    url: https://www.deseret.com/1990/2/15/18846581/perrier-says-failure-to-replace-filter-caused-benzene-contamination/
  - name: 'Seattle Times, ''Bubble Trouble: Perrier struggles to regain place in U.S. market'' (1990)'
    url: https://archive.seattletimes.com/archive/19900626/1079093/bubble-trouble----perrier-struggles-to-regain-place-in-us-market
  - name: UNC Libraries, North Carolina Miscellany blog on Mecklenburg County's Perrier discovery
    url: https://blogs.lib.unc.edu/ncm/?p=10724
  - name: Wikipedia, 'Perrier'
    url: https://en.wikipedia.org/wiki/Perrier
- slug: lego-turnaround-2004
  title: LEGO Goes Back to the Brick
  company: The LEGO Group
  year: 2003–2008
  industry: Toys
  tags:
  - Strategy
  - Finance & risk
  - Leadership
  summary: In the early 2000s, LEGO tried so many new things at once that it began losing huge sums of money and came close to collapse. A young new leader, Jørgen Vig Knudstorp, cut costs, sold what didn't fit, and refocused the company on its famous plastic brick, and within a few years LEGO was growing fast and making strong profits again.
  moral: When you are lost, go back to the thing you do best.
  story: 'For decades, the LEGO Group, a family-owned toy company in the small Danish town of Billund, seemed unbeatable. Its interlocking plastic bricks were in homes all over the world. But by the late 1990s, children had video games and computers to play with, and LEGO began to worry that the brick was old-fashioned. The company had its first-ever loss in 1998.


    LEGO''s answer was to try almost everything. It opened theme parks, made video games, launched clothing and TV shows, and designed many new kinds of special pieces. Some ideas were hits, like sets tied to the Star Wars and Harry Potter movies. But movie sets sold well only in years when a new movie came out. Meanwhile, every new special piece had to be designed, molded, stored and shipped, which made the factories more and more complicated and expensive. In 2003 sales dropped sharply and LEGO began losing money fast.


    The numbers became frightening. In 2004 LEGO lost about 1.9 billion Danish kroner, more than $300 million. Kjeld Kirk Kristiansen, the founder''s grandson who owned the company, put about 800 million kroner of his own money into it, and in October 2004 he stepped down as head of the company. He handed the job to Jørgen Vig Knudstorp, a young former McKinsey consultant who had joined LEGO only in 2001. Many people inside the company wondered whether it would survive.


    Knudstorp''s first goal was simple: stop the bleeding and make sure the company didn''t run out of cash. LEGO cut jobs, from about 7,300 workers worldwide in 2004 to about 5,300 two years later. In 2005 it sold its Legoland theme parks to Merlin Entertainments, a company owned by the investment firm Blackstone, for about 375 million euros, keeping a 30 percent share. It also moved some manufacturing to lower-cost countries in Eastern Europe. Most importantly, it cut back the huge number of different pieces and colors. Designers were asked to build great sets from a smaller, shared "palette" of parts, which made each piece cheaper to produce in large amounts.


    The second goal was to remember what LEGO was for. Knudstorp told Fortune magazine in 2006, "Our vision is to be based on the Lego brick, that''s our heritage and our future." LEGO went back to classic themes like police stations and fire trucks, built around the basic brick. The company also learned to measure whether new products actually made money, not only whether they were creative.


    The turnaround came faster than many expected. LEGO earned a profit of about 702 million kroner in 2005. By 2008, while much of the world was sliding into a deep recession, LEGO''s sales grew almost 19 percent to about 9.5 billion kroner, and its profit before tax reached about 1.85 billion kroner. Knudstorp called the year''s results "extraordinarily good." In the years after that, LEGO grew into one of the largest toy companies in the world.


    The LEGO story is not a story against new ideas. LEGO kept inventing new sets and later made hit movies. The lesson is about focus: new ideas work best when they are connected to what a company already does well, and when someone checks whether they pay for themselves.'
  timeline:
  - - '1998'
    - LEGO reports the first loss in its history and begins a long period of trying new businesses.
  - - '2003'
    - Sales fall sharply and the company starts losing money quickly.
  - - Oct 2004
    - Owner Kjeld Kirk Kristiansen invests his own money and hands leadership to Jørgen Vig Knudstorp.
  - - '2004'
    - LEGO loses about 1.9 billion Danish kroner (more than $300 million) and cuts about 1,000 jobs.
  - - July 2005
    - LEGO agrees to sell its Legoland parks to Merlin Entertainments for about 375 million euros, keeping 30 percent.
  - - '2005'
    - LEGO returns to profit, earning about 702 million kroner.
  - - '2008'
    - Sales rise almost 19 percent to about 9.5 billion kroner; profit before tax reaches about 1.85 billion kroner.
  numbers:
  - - Net loss in 2004
    - about 1.9 billion kroner (more than $300 million)
  - - Owner's personal investment (2004)
    - about 800 million kroner
  - - Workers worldwide
    - about 7,300 in 2004, about 5,300 by 2006
  - - Legoland sale price (2005)
    - about 375 million euros
  - - Profit before tax in 2008
    - about 1.85 billion kroner (about $317 million)
  lessons:
  - 'Know your core: LEGO recovered by building on the brick, the thing customers loved most.'
  - 'Complexity costs money: every extra product or part adds hidden expenses in making, storing and shipping.'
  - 'Survive first, then grow: protecting cash in a crisis buys time to fix the deeper problems.'
  - 'Creativity needs a scoreboard: good ideas should also be checked to see whether they make money.'
  questions:
  - LEGO tried many new things at once. How can a business tell the difference between healthy experimenting and losing focus?
  - Why might having many different kinds of pieces make LEGO's factories more expensive to run?
  - If you ran a small business, what is the one 'brick' your customers come back for, and how would you protect it?
  note: A popular retelling says LEGO was "losing $1 million a day" in 2004; that is a rough rounding of the reported loss of about 1.9 billion kroner (more than $300 million) that year, not an official figure. Reports also differ on exactly how many different pieces LEGO cut, so this case does not give a number. Knudstorp stepped down as CEO at the end of 2016 and became chairman.
  sources:
  - name: Fortune, 'One brick at a time' (2006)
    url: https://money.cnn.com/magazines/fortune/fortune_archive/2006/06/12/8379252/
  - name: Wikipedia, 'The Lego Group'
    url: https://en.wikipedia.org/wiki/The_Lego_Group
  - name: License Global, 'LEGO shows strong international growth' (2008 results)
    url: https://www.licenseglobal.com/licensing-resources/lego-shows-strong-international-growth-2008
  - name: Knowledge at Wharton, 'How LEGO Stopped Thinking Outside the Box' (interview with David Robertson)
    url: https://knowledge.wharton.upenn.edu/article/how-lego-stopped-thinking-outside-the-box-and-innovated-inside-the-brick/
- slug: nokia-smartphones-2007-2013
  title: Nokia and the Burning Platform
  company: Nokia
  year: 2007–2013
  industry: Mobile phones
  tags:
  - Strategy
  - Innovation
  - Leadership
  summary: Nokia was the world's biggest maker of mobile phones when Apple's iPhone and Google's Android arrived. Within about six years Nokia lost its lead, bet its future on Microsoft's Windows Phone software, and finally sold its phone business to Microsoft in 2013. It is one of the fastest falls of a market leader in modern business.
  moral: Being on top today is no promise for tomorrow; the race keeps running.
  story: 'In 2007 Nokia, a company from Finland, was the king of mobile phones. It sold more phones than anyone else in the world, and its own smartphone software, called Symbian, ran on about 62 percent of the world''s smartphones that year, according to the research firm Gartner. Nokia phones were known for being tough, with batteries that lasted for days.


    That same year Apple released the first iPhone, a phone that was mostly a touch screen and worked more like a small computer. In 2008 the first phones running Google''s free Android software appeared, and many phone makers began to use it. The contest was changing. People started choosing phones less for the hardware and more for the apps, the web browser and how easy the screen was to use. In this new game, a phone maker needed a strong "ecosystem": software, app stores and outside developers all working together.


    Nokia still sold huge numbers of phones, but its smartphone software struggled to keep up. Symbian''s share of smartphones fell to about 47 percent by the end of 2008. In the last three months of 2010, according to the research firm Canalys, Android passed Symbian to become the best-selling smartphone software in the world, with about 33 million phones shipped against Symbian''s 31 million.


    In September 2010 Nokia hired a new chief executive, Stephen Elop, who came from Microsoft. In February 2011 he sent employees a memo that soon leaked to the press. He compared Nokia to a man standing on a burning oil platform who must decide whether to jump into icy water. "We too, are standing on a ''burning platform,''" he wrote, "and we must decide how we are going to change our behaviour." Three days later Nokia announced a major partnership: it would stop betting on Symbian and use Microsoft''s Windows Phone software instead.


    The plan was risky. Nokia''s first Windows phones, the Lumia 800 and Lumia 710, came out in October 2011, months after the announcement, and many buyers stopped buying the older Symbian phones while they waited. Windows Phone also had far fewer apps than the iPhone or Android. In the first part of 2012, Samsung passed Nokia as the world''s largest phone maker, ending Nokia''s 14-year run at the top. By 2013 Nokia''s share of all mobile phones sold had fallen to about 14 percent, down from about 20 percent a year earlier, according to Gartner.


    On September 3, 2013, Nokia agreed to sell its phone business to Microsoft for 5.44 billion euros, about $7.2 billion, including a license to Nokia''s patents. Nokia itself did not disappear. It kept its business making equipment for phone networks and its patents, and it still exists as a large company today. But the Nokia that once led the world in phones was gone.


    People still argue about what went wrong. Some say Nokia was slow to see that software and apps mattered more than hardware. Others say the switch to Windows Phone was the wrong bet, or that it came too late to matter. What almost everyone agrees on is how quickly a leader can lose its place when the rules of a market change.'
  timeline:
  - - '2007'
    - Apple releases the iPhone; Nokia's Symbian runs on about 62 percent of smartphones, per Gartner.
  - - '2008'
    - The first Android phones appear; Symbian's share falls to about 47 percent by year's end.
  - - Sept 2010
    - Nokia hires Stephen Elop from Microsoft as chief executive.
  - - Q4 2010
    - Android passes Symbian as the world's best-selling smartphone software, per Canalys.
  - - Feb 2011
    - Elop's 'burning platform' memo leaks; Nokia announces it will switch to Microsoft's Windows Phone.
  - - Oct 2011
    - Nokia launches its first Windows phones, the Lumia 800 and Lumia 710.
  - - Early 2012
    - Samsung passes Nokia as the world's largest phone maker, ending a 14-year run.
  - - Sept 3, 2013
    - Nokia agrees to sell its phone business to Microsoft for 5.44 billion euros (about $7.2 billion).
  numbers:
  - - Symbian share of smartphones
    - about 62 percent in 2007, about 47 percent by late 2008
  - - Smartphones shipped, Q4 2010
    - Android about 33 million, Symbian about 31 million
  - - Nokia share of all phones sold (2013)
    - about 14 percent, down from about 20 percent a year earlier
  - - Microsoft purchase price (2013)
    - 5.44 billion euros, about $7.2 billion
  lessons:
  - 'Watch for rule changes: when customers start valuing something new, past strengths can stop mattering.'
  - 'Leaders can fall fast: Nokia went from number one to selling its phone business in about six years.'
  - 'Big bets have timing costs: announcing a switch before the new product is ready can scare away today''s customers.'
  - 'Partners matter: in some markets, the strength of your app makers and allies counts as much as your own product.'
  questions:
  - Nokia was the biggest phone maker in the world. Why can being big make it harder to change quickly?
  - Was Elop wise to tell employees so bluntly that the company was in trouble? What are the risks and benefits of that kind of honesty?
  - Think of a product you use that has changed a lot in your lifetime. Which companies kept up, and which fell behind?
  note: Whether the Windows Phone decision helped or hurt Nokia is still debated by former employees, analysts and writers; this case does not take a side. Market-share figures come from research firms (Gartner, Canalys) and differ slightly from firm to firm. Nokia continues today as a major maker of network equipment, and the Nokia phone brand was later licensed to another company.
  sources:
  - name: Christian Science Monitor, 'Microsoft buys Nokia in cash deal worth more than $7 billion' (2013)
    url: https://www.csmonitor.com/Technology/2013/0903/Microsoft-buys-Nokia-in-cash-deal-worth-more-than-7-billion
  - name: 'MediaNama, ''Key Events At Nokia Under Stephen Elop''s Leadership: A Timeline'' (2013)'
    url: https://www.medianama.com/2013/09/223-key-events-at-nokia-under-stephen-elops-leadership-a-timeline/
  - name: 'TechRadar, ''Nokia: We poured gasoline on our own burning platform'' (2011)'
    url: https://www.techradar.com/news/mobile-phones/phone-and-communications/nokia-we-poured-gasoline-on-our-own-burning-platform-927150
  - name: InfoWorld, 'Android becomes best-selling smartphone OS' (Canalys data, 2011)
    url: https://www.infoworld.com/article/2286626/android-becomes-best-selling-smartphone-os.html
  - name: Fierce Network, 'Nokia struggles to retain smartphone crown' (Gartner data, 2009)
    url: https://www.fierce-network.com/europe/nokia-struggles-to-retain-smartphone-crown
- slug: starbucks-schultz-returns-2008
  title: Starbucks Closes Its Doors to Learn to Make Coffee
  company: Starbucks
  year: '2008'
  industry: Restaurants & coffee
  tags:
  - Leadership
  - Customers
  - Culture & people
  summary: After years of racing to open stores, Starbucks found that its coffee and its shop experience were slipping and customers were coming less often. Founder-leader Howard Schultz returned as CEO in 2008, closed about 7,100 U.S. stores for an evening to retrain baristas, and later shut hundreds of stores that should never have opened.
  moral: Grow too fast and you may forget why people came to you in the first place.
  story: 'Howard Schultz built Starbucks from a small Seattle coffee seller with four stores in 1982 into one of the best-known brands in the world. He was chief executive until 2000 and then stayed on as chairman. Through the mid-2000s, Starbucks opened new stores at an amazing pace, aiming for 40,000 locations someday. By early 2008 it had more than 15,000.


    But Schultz worried that something important was being lost along the way. In a memo dated February 14, 2007, he warned the company''s leaders about a "watering down of the Starbucks experience." He pointed to choices that had made sense one at a time, like faster automatic espresso machines and bagged coffee, but that together made stores feel less like a special coffeehouse and more like a chain. The memo leaked to the press, and Starbucks confirmed it was real.


    By the end of 2007, fewer customers were visiting, and rivals such as McDonald''s and Dunkin'' Donuts were selling cheaper coffee drinks. Starbucks'' stock had fallen by about half in a year. On January 7, 2008, the board announced that Schultz would return as chief executive, replacing Jim Donald. The company said it would slow its U.S. store openings and close some stores that weren''t doing well.


    Schultz''s most famous move came a few weeks later. On the evening of February 26, 2008, about 7,100 company-run Starbucks stores across the United States locked their doors at 5:30 p.m. for about three hours. Roughly 135,000 workers stayed inside for training on how to pull a proper espresso shot and steam milk the right way. Closing every store at once cost the company sales, and some critics called it a publicity stunt. But it sent a clear message to customers and employees alike. "Tonight is about making sure our baristas have what they need," Schultz said.


    The hardest decisions came next. In July 2008, Starbucks said it would close 600 U.S. stores, far more than the 100 it had planned earlier, affecting about 12,000 workers. About seven in ten of those stores had opened since the start of 2006. The company expected charges of more than $300 million. Admitting that so many recent stores had been mistakes was painful, and it happened just as the U.S. economy fell into a deep recession.


    Schultz kept working on the basics: better coffee, a calmer store experience, and fewer, better new stores. Starbucks cut its plan for new company-run stores in fiscal 2009 in half, to fewer than 200, a huge change for a company that had recently been opening thousands a year. The results took time but did come. In November 2010, Starbucks reported record earnings for its fourth quarter, with profits up 86 percent from a year earlier. Schultz called the year "a defining year" for the company.


    The Starbucks story shows that growth itself can become a problem when it is chased for its own sake. It also shows that a leader can admit mistakes in public, even ones the company made very recently, and that customers often respect that honesty.'
  timeline:
  - - Feb 14, 2007
    - Schultz writes a memo warning about a 'watering down of the Starbucks experience'; it later leaks.
  - - Jan 7, 2008
    - Schultz returns as CEO, replacing Jim Donald; Starbucks plans to slow U.S. openings.
  - - Feb 26, 2008
    - About 7,100 U.S. stores close for about three hours so roughly 135,000 workers can retrain.
  - - July 1, 2008
    - Starbucks says it will close 600 U.S. stores, affecting about 12,000 workers.
  - - Fiscal 2009
    - Company-run store openings are cut in half, to fewer than 200.
  - - Nov 2010
    - Starbucks reports record fourth-quarter earnings, with profits up 86 percent.
  numbers:
  - - U.S. stores closed for retraining (Feb 2008)
    - about 7,100
  - - Workers retrained that evening
    - about 135,000
  - - U.S. stores closed for good (announced July 2008)
    - '600'
  - - Expected charges for closures (2008)
    - about $328 million to $348 million
  - - Fourth-quarter profit growth (2010)
    - up 86 percent from a year earlier
  lessons:
  - 'Protect the experience: small shortcuts can add up to a product customers no longer love.'
  - 'Growth is not the goal by itself: opening more stores only helps if each one serves customers well.'
  - 'Invest in your people: training workers is one of the clearest ways to show what you stand for.'
  - 'Admit mistakes early: closing weak stores hurt, but waiting would likely have hurt more.'
  questions:
  - Starbucks gave up three hours of sales to train workers. Was that worth it? How would you decide?
  - Schultz said faster machines and bagged coffee each made sense alone but hurt the experience together. Can you think of another example of this?
  - What would you do if you realized that many of the newest branches of your business were mistakes?
  note: Some observers at the time called the 2008 training closure a public-relations stunt; it was both a real training session and a highly visible message. The turnaround also overlapped with the 2008–2009 recession, so not every change in results can be traced to Schultz's decisions. Schultz stepped down as CEO again in 2017, returned on an interim basis in 2022, and left again in 2023.
