    url: https://www.pbs.org/newshour/economy/chipotle-agrees-to-record-25-million-fine-over-tainted-food
  - name: Courthouse News, 'Feds slap Chipotle with $25 million fine over norovirus outbreaks' (2020)
    url: https://www.courthousenews.com/feds-slap-chipotle-with-25-million-fine-over-norovirus-outbreaks/
  - name: Chipotle, 'Chipotle Mexican Grill, Inc. Announces First Quarter 2016 Results'
    url: https://newsroom.chipotle.com/2016-04-26-chipotle-mexican-grill-inc-announces-first-quarter-2016-results
  - name: CBS Boston, 'Chipotle closing restaurants nationwide to address food safety' (2016)
    url: https://www.cbsnews.com/amp/boston/news/chipotle-closing-restaurants-nationwide-to-address-food-safety
- slug: southwest-no-layoffs-2001
  title: Southwest Airlines Keeps Its People After 9/11
  company: Southwest Airlines
  year: '2001'
  industry: Airlines
  tags:
  - Culture & people
  - Crisis
  - Finance & risk
  summary: After the September 11, 2001 attacks emptied the skies, most big U.S. airlines cut thousands of jobs. Southwest Airlines promised its employees no layoffs, no furloughs and no pay cuts, and kept that promise while still ending the year with a profit. It shows how money saved in good years can protect people in bad ones.
  moral: Save in the sunshine so you can keep your promises in the storm.
  story: 'On the morning of September 11, 2001, terrorists hijacked four passenger jets. Within hours the U.S. government ordered every civilian airplane in the country to land, and for several days nothing flew. For airlines, this was a nightmare. Planes sat parked, money stopped coming in, and many people were afraid to fly once the skies reopened.


    Southwest Airlines, based in Dallas, was in a strange position. Its longtime leader, Herb Kelleher, had handed the chief executive job to Jim Parker, the company''s lawyer, only three months earlier, in June 2001. Southwest had a reputation as a fun, low-fare airline, but it also had a quieter habit that mattered more that week: it was careful with money. According to the company''s own report to shareholders, it had about $1 billion in cash on September 11, and much less debt than most of its rivals.


    Southwest''s leaders say they decided on the very first morning that they would do everything in their power to avoid layoffs. Kelleher''s advice to the finance team was short: get cash. On September 12 the company drew on its bank credit line, eventually borrowing about $1.1 billion, so it could keep paying its bills while planes were grounded. Parker then told every employee that their jobs were safe and their paychecks would keep coming.


    Other airlines went the opposite way. Within about a week of the attacks, rival carriers announced job cuts in the thousands. Southwest''s 2002 report to shareholders states that it gave its people "100 percent job security," with no layoffs, furloughs, unpaid leaves, or cuts to pay or benefits. The top leaders went further: Kelleher, Parker and company president Colleen Barrett gave up their own salaries for the last three months of 2001. Southwest also went ahead and paid about $197.5 million into employee profit-sharing and savings plans, even though the money would have been handy to keep.


    Southwest returned to the air on September 14 and kept a planned new service to Norfolk, Virginia, that fall. Employees worked very long days to rebuild schedules and set up new security rules. For 2001 as a whole, the airline reported a profit of about $511 million, its 29th profitable year in a row. To be fair and complete, part of that profit came from a federal emergency grant that all airlines received after the attacks; without the grant and some special charges, Southwest''s profit would have been about $413 million. Still, it was the only major U.S. airline that stayed profitable.


    Why could Southwest do this when others could not? The main reason was choices made long before the crisis. For years it had kept a strong balance sheet, meaning more savings and less borrowing than its competitors. That cushion gave leaders room to choose loyalty over quick cost-cutting. They also believed that employees who feel safe give better service, and that the trust built in a hard moment lasts for years.


    The story is not a fairy tale with no problems afterward. Parker''s time as CEO also saw tense negotiations with the flight attendants'' union, and he stepped down in 2004. But the decision after 9/11 is still one of the most cited examples of a company protecting its people in a crisis.'
  timeline:
  - - June 18, 1971
    - Southwest begins flying with three Boeing 737s in Texas.
  - - June 2001
    - Jim Parker succeeds Herb Kelleher as CEO.
  - - Sept 11, 2001
    - Attacks ground all U.S. flights; leaders vow to avoid layoffs.
  - - Sept 12, 2001
    - Southwest draws on its credit line to raise cash.
  - - Sept 14, 2001
    - Southwest resumes flying.
  - - Oct–Dec 2001
    - Top three leaders give up their salaries for the quarter.
  - - Early 2002
    - Southwest reports a 2001 profit of about $511 million, its 29th straight profitable year.
  - - July 2004
    - Parker steps down as CEO; Gary Kelly succeeds him.
  numbers:
  - - Cash on hand, Sept 11, 2001
    - about $1.0 billion
  - - Money borrowed after the attacks (2001)
    - about $1.1 billion
  - - 2001 net profit
    - about $511 million (about $413 million without the federal grant and special charges)
  - - Paid into employee profit-sharing and savings plans (2001)
    - about $197.5 million
  - - Employees (2001)
    - about 31,850
  lessons:
  - 'Build a cushion: savings and low debt in good times give you choices in bad times.'
  - 'Keep promises to your people: loyalty shown in a crisis builds trust that lasts for years.'
  - 'Leaders share the pain: giving up their own pay made the no-layoff promise believable.'
  - 'Tell the whole story: a fair account mentions the government grant that helped the profit.'
  questions:
  - If you ran a small business and sales suddenly stopped for a week, how long could you keep paying everyone?
  - Why might employees work harder for a company that refused to lay them off?
  - Was it fair for Southwest to count the federal grant in its profit? How would you explain the numbers honestly?
  note: The no-layoff promise and the financial figures come from Southwest's own shareholder report and company history, and are confirmed by news coverage. The 2001 profit included a $235 million (before tax) federal grant under the Air Transportation Safety and System Stabilization Act, which other airlines also received.
  sources:
  - name: Southwest Airlines proxy statement filed with the SEC (2002)
    url: https://www.sec.gov/Archives/edgar/data/0000092380/000095013402003643/d95363ddef14a.txt
