- slug: apple-1997
  title: Steve Jobs Returns and Apple Learns to Say No
  company: Apple
  year: '1997'
  industry: Computers
  tags:
  - Strategy
  - Leadership
  - Finance & risk
  summary: In 1997, Apple lost more than $1 billion and was close to running out of cash. Steve Jobs returned, made peace with rival Microsoft, which invested $150 million, and cut Apple's crowded product line to four computers. A year later Apple was profitable again, showing the power of focus.
  moral: The surest way to do a few things well is to stop doing many things poorly.
  story: 'Steve Jobs co-founded Apple in 1976, but in 1985 he was pushed out after a power struggle. He went on to start a new computer company called NeXT. Meanwhile, Apple struggled. By the mid-1990s, it was losing customers to cheaper computers running Microsoft Windows. Its sales fell from about $9.8 billion in fiscal 1996 to about $7.1 billion in fiscal 1997. It lost about $816 million in 1996 and about $1.04 billion in 1997.


    Part of the trouble was that Apple made too many products. It sold many versions of the Macintosh computer, plus printers, a digital camera and the Newton handheld. Even people inside the company had a hard time explaining the differences. Apple also had 16 separate advertising budgets, which Jobs later combined into a single, stronger one. In February 1997, Apple bought NeXT for about $427 million, and Jobs came back as an adviser. In July, CEO Gil Amelio left after another large loss. On September 16, 1997, Apple named Jobs interim CEO. People started calling him the "iCEO."


    Jobs moved fast. One famous story is that he asked managers a simple question about all those products: which ones should I tell my friends to buy? They couldn''t give him a simple answer. So he drew a grid with four boxes. One side said consumers and professionals. The other said desktops and laptops. Apple would make one great computer for each box, and that was it. Most other products were dropped, including the Newton and the printers. Apple cut thousands of jobs as well. Jobs later summed up his thinking this way: "Deciding what not to do is as important as deciding what to do."


    Jobs also made a surprising deal with Microsoft, Apple''s longtime rival. At the Macworld show in Boston in August 1997, he announced that Microsoft would invest $150 million in Apple by buying shares that carried no voting power. Microsoft promised to keep making Microsoft Office and its Internet Explorer browser for the Mac for five years. In return, Apple made Internet Explorer the default browser on Macs, and the two companies settled long-running legal disputes and agreed to share patents. When Jobs announced it, some Apple fans in the audience booed. But the money mattered less than the message: customers and software makers could trust that the Mac would survive.


    Focus started to pay off quickly. In 1998, Apple introduced the colorful iMac for the consumer desktop box of the grid, and it became a hit. Apple returned to profit in early 1998 and earned about $309 million for its 1998 fiscal year. Jobs later said that when he came back, Apple had been about 90 days from running out of money.


    The rescue of 1997 was the start of one of the greatest turnarounds in business history. Apple later went on to create the iPod, the iPhone and the iPad. But those famous products came after a less glamorous first step: cutting back, choosing what matters most, and doing that one thing really well.'
  timeline:
  - - '1985'
    - Steve Jobs leaves Apple after a power struggle and founds NeXT.
  - - Feb 1997
    - Apple completes its purchase of NeXT for about $427 million; Jobs returns as an adviser.
  - - July 1997
    - CEO Gil Amelio leaves Apple after a large quarterly loss.
  - - Aug 1997
    - At Macworld Boston, Jobs announces Microsoft's $150 million investment and partnership.
  - - Sept 16, 1997
    - Apple names Jobs interim CEO.
  - - 1997–1998
    - Apple cuts its product line down to four core computers.
  - - '1998'
    - Apple launches the iMac and returns to profitability.
  numbers:
  - - Apple net loss (fiscal 1997)
    - about $1.04 billion
  - - Apple sales (fiscal 1997)
    - about $7.1 billion, down 28% from 1996
  - - Microsoft investment (1997)
    - $150 million in non-voting stock
  - - Apple profit (fiscal 1998)
    - about $309 million
  lessons:
  - 'Focus wins: four great products beat dozens of confusing ones.'
  - 'Make it easy to choose: if your own team can''t explain what to buy, customers can''t either.'
  - 'Rivals can be partners: working with Microsoft helped Apple survive.'
  - 'Cut first, then build: the iMac and later hits came after Apple cleared away distractions.'
  questions:
  - Why do you think having too many products can hurt a company, even if each one makes some money?
  - If you had to cut your family's activities or your business's products down to four, which would you keep?
  - Why do you think some Apple fans booed the Microsoft deal, and were they right to?
  note: Apple's fiscal year ends in late September, so 'fiscal 1997' losses mostly happened before Jobs became interim CEO. The '90 days from insolvency' line is Jobs's own later description, not a figure from Apple's financial filings. Accounts differ on exactly how many products Apple had before the cuts (often described as a dozen or more Macintosh versions, with about 70 percent of products eliminated). The four-box grid was presented publicly in 1998.
  sources:
  - name: Apple Computer, Form 10-K for fiscal 1997 (SEC)
    url: https://www.sec.gov/Archives/edgar/data/0000320193/000104746997006960/0001047469-97-006960.txt
  - name: 'InformationWeek, ''August, 1997: Microsoft Rescues Apple?'' (2009)'
    url: https://www.informationweek.com/it-leadership/august-1997-microsoft-rescues-apple-
  - name: Cult of Mac, 'Steve Jobs becomes Apple's interim CEO' (Today in Apple history)
    url: https://www.cultofmac.com/apple-history/steve-jobs-apple-ceo
  - name: Entrepreneur, 'How Steve Jobs Saved Apple' (2011)
    url: https://www.entrepreneur.com/blog/220604
  - name: Stanford eCorner, 'When Steve Jobs Returned to Apple' (Adam Lashinsky, transcript)
    url: https://stvp.stanford.edu/wp-content/uploads/sites/3/2024/09/when-steve-jobs-returned-to-apple-transcript.pdf
- slug: toyota-andon-cord
  title: Toyota and the Cord That Stops the Line
  company: Toyota
  year: 1950s–today
  industry: Automobiles
  tags:
  - Operations
  - Culture & people
  summary: In Toyota's factories, any worker who spots a problem can pull a cord, called the andon, to call for help and, if needed, stop the whole assembly line. It sounds expensive, but it is a core part of the Toyota Production System, which aims to fix problems at their source instead of passing them on.
  moral: Stop to fix a small problem today, or pay for a big one tomorrow.
  story: 'Imagine working on a car assembly line where each car moves past you every minute or so. You notice a part doesn''t fit right. Most factories in the past told workers to keep the line moving no matter what and let inspectors catch problems at the end. Toyota did something that sounded crazy: it let every worker stop the line.


    The idea goes back to Sakichi Toyoda, who founded the group of companies that became Toyota. He invented automatic weaving looms. In 1896 he created a power loom that stopped by itself when a thread broke. That way, the machine didn''t keep weaving bad cloth, and one person could watch many machines. Toyota calls this idea jidoka, often translated as "automation with a human touch." It means machines and people should stop as soon as something is wrong, so defects are not passed down the line.


    Toyota''s car business added a second big idea, called just-in-time. Kiichiro Toyoda, who founded Toyota Motor Corporation, pushed to make only what was needed, when it was needed, in the amount needed, so the factory would not pile up costly extra parts. After World War II, a production chief named Taiichi Ohno led the effort to build these ideas into a full system through the 1950s and 1960s. It became known as the Toyota Production System.


    The andon cord is one of its best-known tools. Andon is a Japanese word for a paper lantern. In a Toyota factory, it is a signal board that lights up to show where help is needed. Toyota began using the andon system in 1950. On many lines, a cord runs along the length of the line. When a worker pulls it, a light and sound go off, and the board shows which workstation has a problem. A team leader rushes over. If the problem can be fixed within the time that the car would normally spend at that station, the line keeps moving. If not, the whole line stops until it is solved. Then the cord is pulled again to restart.


    Why would a company let anyone stop a factory that costs a lot of money every minute? Because a defect that is fixed right away is cheap. A defect that is hidden inside a finished car, or found by a customer, is expensive and damages trust. Each pull also gives Toyota information. Teams study how often problems happen and what causes them, then improve the process so the problem doesn''t come back. Toyota calls this steady, daily improvement kaizen.


    The cord also sends a message about people. Toyota treats each worker as an expert on his or her own job and trusts them to protect quality. Pulling the cord is not seen as getting in trouble. It is seen as doing your job well.


    Toyota''s methods spread around the world, beginning in earnest with NUMMI, a factory in California that Toyota ran jointly with General Motors starting in 1984. Today, ideas from the Toyota Production System are used in hospitals, software companies and offices. Many of them have their own version of an andon cord: a clear, safe way for anyone to say, "Stop. Something''s wrong here."'
  timeline:
  - - '1896'
    - Sakichi Toyoda builds a power loom that stops automatically when a thread breaks, the root of jidoka.
  - - 1930s
    - Kiichiro Toyoda develops the just-in-time idea for Toyota's car business.
  - - '1950'
    - Toyota begins using the andon system.
  - - 1950s–1960s
    - Taiichi Ohno leads the development of the Toyota Production System.
  - - '1984'
    - NUMMI, Toyota's joint factory with General Motors in California, begins spreading the system abroad.
  numbers:
  - - Year of Toyoda's self-stopping loom
    - '1896'
  - - Year Toyota began using andon
    - '1950'
  - - Start of NUMMI joint venture with GM
    - '1984'
  lessons:
  - 'Fix problems at the source: catching a mistake early is far cheaper than catching it at the end.'
  - 'Trust the people closest to the work: the worker on the line often sees a problem first.'
  - 'Make it safe to speak up: a stop cord only works if pulling it is praised, not punished.'
  - 'Learn from every problem: each stop is a chance to improve the process so it doesn''t happen again.'
  questions:
  - What is the 'andon cord' in your home, classroom or business? Is it easy and safe for anyone to say something's wrong?
  - Why might stopping work for a few minutes save time in the long run?
  - Can you think of a time when a small problem you ignored turned into a big one?
  note: Popular retellings often say that pulling the cord instantly stops the line. In practice at many Toyota plants, the pull first calls a team leader, and the line stops only if the problem can't be fixed within that workstation's cycle time; Toyota UK confirms both descriptions.
  sources:
  - name: Toyota Motor Corporation, 'Toyota Production System'
    url: https://global.toyota/en/company/vision-and-philosophy/production-system/
  - name: 'Toyota UK Magazine, ''Toyota manufacturing in 25 objects: Andon cord'''
    url: https://mag.toyota.co.uk/toyota-manufacturing-25-objects-andon-cord/
  - name: Toyota UK Magazine, 'Andon – Toyota Production System guide' (2016)
    url: https://mag.toyota.co.uk/andon-toyota-production-system/
  - name: Lean Enterprise Institute, 'Toyota Production System' (Lean Lexicon)
    url: https://www.lean.org/lexicon-terms/toyota-production-system/
- slug: southwest-10-minute-turn
  title: Southwest Airlines and the 10-Minute Turn
  company: Southwest Airlines
  year: 1971–2020
  industry: Airlines
  tags:
  - Operations
  - Strategy
  - Culture & people
  summary: In 1972, cash-strapped Southwest Airlines had to sell one of its four planes but wanted to keep its full schedule. The answer was to unload, clean and reload a plane in about 10 minutes. Fast turnarounds, one type of airplane and a team spirit became the heart of a low-cost model that kept Southwest profitable for 47 straight years.
  moral: When you can't have more, learn to do more with what you have.
  story: 'Southwest Airlines began flying on June 18, 1971, with three Boeing 737 jets connecting three Texas cities: Dallas, Houston and San Antonio. Its plan was simple: short flights, low fares and friendly service. In September 1971 it bought a fourth 737.


    Money ran short fast. By the spring of 1972, the young airline had only $143 in the bank and was facing about $1.6 million in losses. Southwest''s president, Lamar Muse, made a hard decision: sell the fourth plane. The sale brought in a profit of about $500,000 and kept the company alive. But it created a new puzzle. How could Southwest keep flying its full schedule, with 14 daily round trips between Dallas and Houston and more to San Antonio, with only three planes?


    The answer came from the ground crew. A plane only earns money when it is in the air. If Southwest could get each plane back in the air faster after it landed, three planes could do the work of four. Bill Franklin, the head of ground operations, declared that the team would turn each plane around in 10 minutes. At the time, most airlines took close to an hour. More than 100 tasks had to happen in that window: passengers off, bags out, cabin cleaned, snacks restocked, new bags and passengers on. Teams studied race-car pit crews for ideas. Everyone pitched in, including pilots, and even co-founder Herb Kelleher was known to take out trash and restock peanuts. Passengers chose their own seats instead of having assigned ones, which helped boarding go faster. The crews did not always hit 10 minutes, but they hit it often enough that it became Southwest''s signature.


    Fast turns became the center of a whole low-cost way of doing business. Southwest flew only one type of plane, the Boeing 737, so every pilot, mechanic and crew member could work on any plane and spare parts were simpler. It flew mostly point-to-point, meaning direct trips between cities rather than sending everyone through a few giant hubs. All of this kept costs low, so fares could stay low, which brought in more customers who might otherwise have driven or stayed home.


    The results were remarkable. After its loss in 1972, Southwest made a profit every single year for 47 years in a row, a record almost unheard of in the up-and-down airline business. It grew from three planes into a giant with more than 700 Boeing 737s and tens of thousands of employees. Its turns got longer as planes and rules changed; by 2011 the average was about 25 minutes, which was still among the fastest in the industry.


    The streak finally ended in 2020, when the COVID-19 pandemic emptied airports and Southwest lost about $3.5 billion, not counting special items. Then, in December 2022, a winter storm set off a collapse in Southwest''s operations that canceled about 16,900 flights and stranded more than 2 million passengers. In a 2023 settlement with the U.S. Department of Transportation, Southwest agreed to a record $140 million civil penalty. Even great systems need to keep improving.


    Still, the 10-minute turn remains one of the best stories in business about turning a crisis into a strength. Southwest did not have more money or more planes. It had a team that found a smarter way to use what it had.'
  timeline:
  - - June 18, 1971
    - Southwest begins service with three Boeing 737s in Texas.
  - - Sept 1971
    - Southwest buys a fourth Boeing 737.
  - - '1972'
    - With $143 in the bank, Southwest sells its fourth plane and launches the 10-minute turn.
  - - 1973–2019
    - Southwest is profitable for 47 consecutive years.
  - - '1986'
    - Federal rules end the practice of pushing back before every passenger is seated.
  - - '2020'
    - The COVID-19 pandemic brings Southwest's first annual loss since 1972.
  - - Dec 2023
    - Southwest agrees to a $140 million DOT penalty over its December 2022 holiday meltdown.
  numbers:
  - - Cash in the bank (spring 1972)
    - $143
  - - Target turnaround time (1972)
    - 10 minutes
  - - Consecutive profitable years (1973–2019)
    - '47'
  - - Boeing 737s in the fleet (end of 2020)
    - '718'
  lessons:
  - 'Constraints spark creativity: losing a plane forced Southwest to invent a faster way to work.'
  - 'Keep it simple: one airplane type made training, scheduling and repairs easier and cheaper.'
  - 'Everyone owns the result: when leaders pick up trash too, teams pull together.'
  - 'Keep improving your systems: even a great operation can break down if its tools fall behind.'
  questions:
  - Southwest made money by keeping planes in the air more. What is the 'plane' in your business or household that sits idle too often?
  - Why might flying only one type of airplane save money? Can you think of a similar idea for a small business?
  - What do you think made Southwest's employees willing to work so hard on the 10-minute turn?
  note: Southwest itself says crews did not always make the 10-minute target. The 47-year profit streak counts annual profits from 1973 through 2019. The 2020 loss of about $3.5 billion excludes special items; the $140 million DOT penalty came through a consent order Southwest agreed to, which it called a consumer-friendly settlement.
  sources:
  - name: 'Southwest Airlines (Southwest 50), ''A Turning Point: The Birth of the 10-Minute Turn'''
    url: https://southwest50.com/our-stories/a-turning-point-the-birth-of-the-10-minute-turn
  - name: CNBC, '10 Minutes That Changed Southwest Airlines' Future' (2011)
    url: https://www.cnbc.com/id/43768488
  - name: Southwest Airlines, Form 10-K for 2020 (SEC)
    url: https://www.sec.gov/Archives/edgar/data/92380/000009238021000033/luv-20201231.htm
  - name: AP via Jackson Progress-Argus, 'Southwest Airlines reports first loss in 48 years' (2021)
    url: https://www.jacksonprogress-argus.com/news/business/southwest-airlines-reports-first-loss-in-48-years/article_8ab9915b-311d-53b2-8d2b-04948c969f79.html
  - name: NPR via WAMC, 'Southwest will pay a $140 million fine for its meltdown during the 2022 holidays' (2023)
    url: https://www.wamc.org/2023-12-18/southwest-will-pay-a-140-million-fine-for-its-meltdown-during-the-2022-holidays
- slug: enron-andersen-2001
  title: Enron and the Fall of Arthur Andersen
  company: Enron and Arthur Andersen
  year: 2001–2002
  industry: Energy trading and accounting
  tags:
  - Ethics & trust
  - Finance & risk
  - Leadership
  summary: Enron, a Houston energy-trading giant, used off-the-books deals to hide debt and make its profits look bigger, and it collapsed into bankruptcy in December 2001. Its auditor, Arthur Andersen, was convicted in 2002 of obstructing justice for destroying Enron documents, and the firm fell apart even though the Supreme Court later overturned the verdict.
  moral: Numbers can be dressed up for a while, but the truth always sends the bill.
  story: 'In 2000, Enron looked like one of the most successful companies in America. Based in Houston, Texas, it had grown from a natural gas pipeline business into a huge trader of energy and other contracts. That year it reported about $111 billion in revenue and had about 21,000 employees. Its stock traded around $90 a share in August 2000, and business magazines praised it as a model of the new economy.


    Behind the shine, something was badly wrong. A jury later found that Enron''s top leaders had misled investors with off-the-books deals. Those were side companies and arrangements that kept debt off Enron''s own financial reports and made profits look larger and steadier than they really were. To an outsider, Enron looked strong. In truth, it was carrying risks and losses that ordinary investors could not see.


    The cracks showed in 2001. Chief executive Jeffrey Skilling suddenly resigned in August after only about six months in the job, and founder Kenneth Lay took the top job again. Days later, an Enron finance executive named Sherron Watkins met privately with Lay to warn him about the company''s accounting. In October, Enron announced a third-quarter loss of more than $600 million and a $1.2 billion cut in shareholder equity, which is the value that belongs to the owners. The Securities and Exchange Commission (SEC), the government agency that polices the stock market, opened an inquiry. In November, Enron admitted that its earnings for the previous five years had to be corrected to show $586 million in losses. A planned rescue by a rival, Dynegy, fell through, and on December 2, 2001, Enron filed for bankruptcy. Its stock had dropped to under a dollar.


    Thousands of people were hurt. Many employees lost their jobs and also their retirement savings, because those savings were heavily invested in Enron stock. Investors lost billions of dollars.


    The courts later sorted out who was responsible. Former finance chief Andrew Fastow pleaded guilty to conspiracy in 2004, testified against his old bosses, and served a six-year prison sentence. In May 2006 a jury found Skilling guilty on 19 counts, including fraud, conspiracy and insider trading, and found Lay guilty of fraud and conspiracy. Lay died that July before he could be sentenced, so under the law his conviction was wiped away. Skilling was sentenced to 24 years in prison, later reduced to 14 years in a 2013 agreement that also sent more than $40 million of his money to victims.


    Enron''s fall also brought down one of the most famous names in accounting. Arthur Andersen was Enron''s auditor, the outside firm whose job was to check that the company''s numbers were honest. As the SEC began looking at Enron, Andersen staff destroyed large amounts of Enron-related documents, which the firm said was routine housekeeping under its records policy. Prosecutors disagreed. In June 2002 a Houston jury convicted Andersen of obstruction of justice, and its lead Enron partner, David Duncan, pleaded guilty and testified for the government. By August 31, 2002, Andersen had given up its right to audit public companies. In 2005, the U.S. Supreme Court unanimously overturned the conviction because the jury instructions had been too vague about what the government had to prove. But it was too late. A firm that once employed about 28,000 people had already shrunk to a few hundred.


    Enron''s collapse led Congress to pass tougher accounting and corporate-responsibility rules in 2002, known as the Sarbanes-Oxley Act. For business owners large and small, the story is a reminder that a company''s reputation rests on whether people can believe its numbers, and that the people checking those numbers must be willing to say no.'
  timeline:
  - - Aug 14, 2001
    - CEO Jeffrey Skilling resigns; Kenneth Lay becomes CEO again.
  - - Aug 22, 2001
    - Executive Sherron Watkins meets privately with Lay about accounting concerns.
  - - Oct 16, 2001
    - Enron reports a big third-quarter loss and a $1.2 billion cut in shareholder equity; the SEC opens an inquiry days later.
  - - Dec 2, 2001
    - Enron files for bankruptcy.
  - - June 15, 2002
    - A jury convicts Arthur Andersen of obstruction of justice for destroying Enron documents.
  - - Aug 31, 2002
    - Andersen gives up its license to audit public companies, effectively ending its U.S. business.
  - - May 31, 2005
    - The Supreme Court unanimously overturns Andersen's conviction over faulty jury instructions.
  - - May 2006
    - A jury convicts Skilling and Lay; Lay dies in July and his conviction is vacated.
  numbers:
  - - Enron revenue in 2000
    - about $111 billion
  - - Enron employees in 2000
    - about 21,000
  - - Losses added by Nov 2001 restatement
    - $586 million over five years
  - - Andersen U.S. workforce before and after
    - about 28,000 shrinking to about 200 by 2006
  - - Skilling's prison sentence
    - 24 years in 2006, cut to 14 years in 2013
  lessons:
  - 'Honest books are the foundation: if customers, lenders and investors can''t trust your numbers, nothing else you do matters.'
  - 'Watchdogs must stay independent: an auditor or advisor who gets too close to a client can stop protecting anyone.'
  - 'Listen to the warning: when an employee raises a concern about money, investigate it instead of hoping it goes away.'
  - 'Don''t put all your eggs in one basket: workers whose savings were all in Enron stock lost their jobs and their nest eggs at once.'
  questions:
  - Why might smart, successful people go along with accounting tricks instead of speaking up?
  - Arthur Andersen's conviction was overturned, yet the firm still collapsed. What does that tell you about how trust works in business?
  - If you ran a small business, who would you want checking your books, and why would it matter that they feel free to disagree with you?
  note: Sources give slightly different figures for Enron's October 2001 quarterly loss (about $618 million in Enron's own announcement; some timelines say $638 million), so the story says "more than $600 million." Kenneth Lay was found guilty, but because he died before sentencing and appeal, the court vacated his conviction, so legally he stands unconvicted. The Supreme Court's 2005 ruling did not declare Andersen innocent; it found the jury had been given improper instructions, and prosecutors chose not to retry the case.
  sources:
  - name: HISTORY.com, 'Enron files for bankruptcy' (December 2)
    url: https://www.history.com/this-day-in-history/december-2/enron-files-for-bankruptcy
  - name: 'Seattle Times, ''Timeline: Enron''s collapse and the fallout'' (2006)'
    url: https://archive.seattletimes.com/archive/20060129/enronchron29/timeline--enrons-collapse-and-the-fallout
  - name: CNN Money, 'Andersen guilty' (2002)
    url: https://money.cnn.com/2002/06/13/news/andersen_verdict/
  - name: Wikipedia, 'Arthur Andersen LLP v. United States' (2005 Supreme Court case)
    url: https://en.wikipedia.org/wiki/Arthur_Andersen_LLP_v._United_States
  - name: NBC News, 'Disgraced Enron chief Jeffrey Skilling released from federal custody' (2019)
    url: https://www.nbcnews.com/news/us-news/disgraced-enron-chief-jeffrey-skilling-released-federal-custody-n974361
- slug: volkswagen-dieselgate-2015
  title: Volkswagen and the Diesel Emissions Cheat
  company: Volkswagen
  year: '2015'
  industry: Automobiles
  tags:
  - Ethics & trust
  - Culture & people
  - Leadership
  summary: For years Volkswagen sold "clean diesel" cars fitted with software that switched on full pollution controls only during government tests. After university researchers caught the gap in 2015, VW admitted the cheating, pleaded guilty to federal crimes, and paid tens of billions of dollars in penalties and settlements worldwide.
  moral: A trick that fools the test still fails the world.
  story: 'In the late 2000s, Volkswagen wanted to sell many more cars in the United States. One big part of its plan was "clean diesel." Diesel engines can get great gas mileage, and VW advertised its diesel Jettas, Golfs, Passats and Audi A3s as both fuel-efficient and kind to the environment. Many buyers paid extra for them for exactly that reason.


    There was a problem. Diesel engines give off nitrogen oxides, often shortened to NOx, gases that help create smog and can harm people''s lungs. U.S. rules for NOx are strict, and meeting them while also keeping good mileage and performance is hard and expensive. According to regulators, VW''s answer was to cheat. It installed software, called a "defeat device," that could tell when a car was being tested in a lab. During the test, the pollution controls worked fully. On the open road, they were turned down, and the cars could give off up to 40 times the allowed amount of NOx.


    The cheat was uncovered by outsiders. A nonprofit group, the International Council on Clean Transportation, hired researchers at West Virginia University to test diesel cars on real roads instead of in a lab. The VW cars polluted far more than they should have. The researchers shared their findings, and the U.S. Environmental Protection Agency (EPA) and the California Air Resources Board began investigating. In September 2015, after regulators demanded an explanation, the company admitted the cars had defeat devices. On September 18, 2015, the EPA publicly accused VW of breaking the Clean Air Act in about 482,000 diesel cars sold in the U.S. from model years 2009 to 2015. Worldwide, the number of affected cars was about 11 million. On September 23, chief executive Martin Winterkorn resigned.


    The consequences were enormous. In June 2016, VW agreed to a U.S. civil settlement worth up to $14.7 billion. Just over $10 billion was set aside to buy back or fix about 475,000 cars with 2-liter diesel engines and to pay owners between $5,100 and $10,000 each. Another $2.7 billion went to clean up the extra pollution, and $2 billion went to zero-emission vehicle projects. In January 2017, VW agreed to plead guilty to three federal felonies, including conspiracy and obstruction of justice, and to pay $2.8 billion in criminal penalties plus $1.5 billion in other civil penalties. By late 2017, VW had paid more than $20 billion in fines and settlements.


    Individual people faced justice too. Oliver Schmidt, who had led VW''s environmental and engineering office in Michigan, pleaded guilty and was sentenced in December 2017 to seven years in prison and a $400,000 fine. He told the judge he had made bad decisions and was sorry. U.S. prosecutors charged several other current and former VW executives, but most live in Germany, which generally does not send its own citizens to other countries for trial.


    The deepest damage was to trust. VW had sold customers a promise, cleaner air with great mileage, and the promise was false. Owners who thought they were helping the environment learned they had been driving some of the dirtiest cars on the road. For any business, the lesson is that rules and tests exist to protect real people. Finding a clever way around them does not make the harm go away. It only hides it until someone looks closely.'
  timeline:
  - - '2008'
    - VW begins selling 2-liter 'clean diesel' cars (model year 2009 onward) that regulators later found had defeat devices.
  - - Before Sept 2015
    - West Virginia University researchers, working with the ICCT, find VW diesels polluting far more on real roads than in lab tests.
  - - Sept 18, 2015
    - The EPA and California regulators publicly accuse VW of violating the Clean Air Act.
  - - Sept 23, 2015
    - CEO Martin Winterkorn resigns.
  - - June 2016
    - VW agrees to a U.S. settlement worth up to $14.7 billion, including car buybacks.
  - - Jan 11, 2017
    - VW agrees to plead guilty to three felonies and pay $4.3 billion in criminal and civil penalties.
  - - Dec 2017
    - VW executive Oliver Schmidt is sentenced to seven years in prison.
  numbers:
  - - U.S. cars with 2-liter defeat devices
    - about 482,000 (model years 2009–2015)
  - - Affected cars worldwide
    - about 11 million
  - - NOx on the road
    - up to 40 times the U.S. standard
  - - 2016 U.S. civil settlement
    - up to $14.7 billion
  - - 2017 criminal and civil penalties
    - about $4.3 billion
  lessons:
  - 'Pass the real test: the goal of a rule is to protect people, not just to get a passing grade.'
  - 'Promises are part of the product: if you sell something as ''clean'' or ''safe,'' that claim must be true every day, not just on test day.'
  - 'Pressure can bend people: impossible targets can push employees toward cheating, so leaders must watch how goals get met.'
  - 'Cover-ups make it worse: VW''s obstruction became part of its crimes, adding to the original wrongdoing.'
  questions:
  - Why do you think the cheating was discovered by outside researchers rather than by someone inside VW?
  - Have you ever been tempted to 'study for the test' instead of really learning? How is that like what VW did, and how is it different?
  - If an employee at VW had discovered the defeat device in 2010, what could they have done, and what might it have cost them?
  note: The roughly 482,000 figure covers 2-liter cars in the original 2015 notice; later findings added about 80,000 3-liter diesels, bringing the U.S. total to about 590,000 vehicles cited in the 2017 plea. Exactly who inside VW knew what, and when, was debated for years and was the subject of separate trials in Germany; this case sticks to what VW admitted and what U.S. courts and regulators found.
