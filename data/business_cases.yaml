- slug: ford-five-dollar-day-1914
  title: Henry Ford's Five-Dollar Day
  company: Ford Motor Company
  year: '1914'
  industry: Automobiles
  tags:
  - Culture & people
  - Operations
  - Strategy
  summary: In January 1914, Ford Motor Company announced it would roughly double pay for many factory workers to $5 a day while cutting the workday to eight hours. The main business problem was that workers
    kept quitting the hard, fast assembly line; the higher pay brought stability, but it also came with strict rules about workers' private lives.
  moral: When a process innovation makes labor stability the binding constraint, paying above market can lower total cost, but conditioning pay on private behavior creates lasting ethical and reputational
    risk.
  story: 'In the early 1910s, Ford''s Highland Park factory near Detroit, with about 14,000 workers, was changing how things were made. Workers stood along a moving assembly line, each doing one small task
    over and over as cars rolled past. Experiments with the line cut the time to build a Model T from about 12 and a half hours to about 93 minutes. Cars became cheaper, and Ford sold more and more of them.


    But the work was tiring and dull, and workers kept leaving. In 1913 Ford hired about 50,000 people just to keep an average workforce of about 13,600. That is a turnover rate of about 370 percent, meaning
    the company had to replace its whole workforce several times in a single year. Every new hire had to be found and trained, and a line full of beginners ran slowly and made mistakes. All that hiring
    and training was a hidden cost that never showed up on the price tag of a car.


    On January 5, 1914, Henry Ford and his business partner James Couzens announced a surprise. Starting January 12, many workers would earn $5 a day, roughly double the old pay of a little over $2, and
    the workday would be cut from nine hours to eight. Ford estimated the change would add about $10 million a year to its payroll. Newspapers around the country covered the story, and within days thousands
    of job seekers crowded outside the factory. Some crowds grew rowdy and were sprayed with fire hoses in icy January weather.


    The $5 day came with strings attached. Workers kept their basic pay of about $2.30 a day no matter what, but the rest was a "profit-sharing" bonus that had to be earned by more than doing the job well.
    At first it went only to men over 22 who had worked at Ford for at least six months. Ford set up a Sociological Department, and its investigators visited workers'' homes to check on things like drinking,
    gambling, saving money, keeping a clean house, and taking in boarders. Many people today see those home visits as an invasion of privacy. In practice, the department let many violations slide, and close
    to 90 percent of workers who applied eventually received the bonus.


    Did it pay off for the company? Workers began staying much longer, the line ran more smoothly, and some workers suggested ways to cut costs. Ford''s profits kept rising, from about $27 million in 1913
    to about $32 million in 1914. Other carmakers and parts suppliers soon raised their own wages to keep up. Ford also liked to point out that well-paid workers could afford to buy the cars they built,
    creating new customers for the Model T.


    The five-dollar day is often told as a story of a generous boss. The fuller truth is more interesting. It was a practical answer to a costly business problem, it really did make many workers'' lives
    better, and it also gave the company unusual control over their private lives. The Sociological Department was largely shut down by 1921.

    '
  timeline:
  - - '1913'
    - Ford hires about 50,000 workers to keep an average workforce of about 13,600.
  - - Jan 5, 1914
    - Henry Ford and James Couzens announce the $5, eight-hour workday.
  - - Jan 12, 1914
    - The new pay plan takes effect; crowds of job seekers gather at Highland Park.
  - - '1914'
    - Ford's Sociological Department begins home visits to decide who qualifies for the bonus.
  - - '1914'
    - Ford's profits rise to about $32 million, up from about $27 million in 1913.
  - - By 1921
    - The Sociological Department is largely shut down.
  numbers:
  - - Worker turnover (1913)
    - about 370 percent
  - - Daily pay before and after (1914)
    - a little over $2 for 9 hours, then up to $5 for 8 hours
  - - Estimated added payroll cost (1914)
    - about $10 million a year
  - - Ford profits
    - about $27 million in 1913, about $32 million in 1914
  lessons:
  - 'Efficiency wages: Ford hired about 50,000 people in 1913 to keep about 13,600 on the payroll, a turnover rate near 370 percent. Doubling pay to $5 made jobs worth keeping. Economists Daniel Raff and
    Lawrence Summers later used the case to test efficiency wage theory. The general point: the cheapest wage is the one that minimizes total labor cost, including hiring, training and errors, not the lowest
    hourly rate.'
  - 'Shifting constraints: The moving assembly line cut assembly time from about 12.5 hours to about 93 minutes. Once the process was fast, the binding constraint moved to the people running it, because
    a line of beginners ran slowly. Process innovation often relocates the bottleneck rather than removing it, so managers should ask what becomes scarce after each efficiency gain.'
  - 'Cost-benefit framing: Ford estimated the plan would add about $10 million a year to payroll, while profits rose from about $27 million in 1913 to about $32 million in 1914. Profits rising despite a
    large wage increase suggests the hidden costs of turnover were substantial. Always quantify the hidden cost of the status quo before judging an expensive fix.'
  - 'Conditional pay and ethical risk: Most of the $5 was a bonus that required passing home inspections by the Sociological Department. This gave Ford control over workers'' private lives and excluded
    women at first. Monitoring tied to pay can push into areas where an employer has no legitimate interest, creating legal, ethical and reputational exposure that outlasts the program itself.'
  - 'Labor market positioning: Other carmakers and suppliers soon raised wages to keep up. A first mover on wages gets its pick of applicants, as the crowds at Highland Park showed, but the advantage fades
    as rivals match. The popular claim that Ford mainly wanted workers to buy Model Ts is debated; the documented driver was turnover.'
  questions:
  - Using the 1913 turnover figures, estimate the minimum hiring and training cost per worker that would justify a $10 million annual payroll increase. What assumptions drive your answer?
  - You are Ford's head of personnel in 1914. How would you design an incentive that rewards tenure and reliability without monitoring workers' homes?
  - Rivals matched Ford's wage within a few years. Was the five-dollar day a sustainable advantage or a one-time gain, and what would make a wage strategy hard to copy?
  - Where in today's economy (warehouses, call centers, nursing) might the same turnover economics apply, and what would differ?
  note: The popular claim that Ford doubled wages mainly so workers could afford Model Ts is debated by historians; the documented business problem was very high turnover, and the customer idea is usually
    seen as a side benefit Ford talked about later. Sources give the old daily wage as about $2.30 to $2.34. At first women did not qualify for the bonus. Some retellings say a later Ford security chief
    turned the hoses on the crowds, but the details of that incident are not well documented.
  sources:
  - name: The Henry Ford museum, 'Ford's Five-Dollar Day'
    url: https://www.thehenryford.org/collections/explore/articles/fords-five-dollar-day
  - name: EBSCO Research Starters, 'Ford Announces Five-Dollar, Eight-Hour Workday'
    url: https://ebsco.com/research-starters/history/ford-announces-five-dollar-eight-hour-workday
- slug: ibm-gerstner-turnaround-1993
  title: Lou Gerstner Teaches IBM to Dance
  company: IBM
  year: 1993–2002
  industry: Computers & technology services
  tags:
  - Leadership
  - Strategy
  - Culture & people
  summary: In the early 1990s, IBM, once the most powerful computer company in the world, was losing billions of dollars and many expected it to be broken into pieces. Outsider Lou Gerstner took over in
    1993, kept the company whole, cut costs, and rebuilt IBM around solving customers' problems, leading one of the most famous turnarounds in business history.
  moral: In a turnaround, stabilize cash and costs before articulating vision, and test structural options like a breakup against what customers value, since integration can be the scarce asset.
  story: 'For most of the 20th century, IBM was the giant of the computer world. Its big mainframe computers ran banks, airlines and governments. Employees were famous for their white shirts, and the company
    had a long tradition of avoiding layoffs. But by the early 1990s, cheaper personal computers and smaller machines from many competitors were eating into IBM''s business. The company lost about $5 billion
    in 1992 alone, and nearly $8 billion over two years.


    IBM''s leaders were preparing to split the company into separate pieces, each competing on its own. In April 1993, IBM''s board did something it had never done before: it hired a chief executive from
    outside the company. Lou Gerstner had spent years at American Express and was running the food and tobacco company RJR Nabisco. He was not a computer engineer, and many people doubted he could save
    IBM.


    Gerstner''s first months were about survival. In July 1993, IBM reported a record quarterly loss of about $8 billion, mostly the cost of cutting tens of thousands of jobs and restructuring. IBM cut
    about 35,000 more jobs, ending its old tradition of avoiding layoffs. When reporters asked about his vision for the company, Gerstner gave a famous answer: "The last thing IBM needs right now is a vision."
    He meant that IBM needed to fix its costs, its products and its relationships with customers first.


    His most important decision was to stop the breakup. Gerstner listened to big customers, and many told him they wanted one company that could bring all the pieces of their computer systems together.
    He decided that IBM''s size, which everyone saw as a weakness, could be a strength if the company worked as one team. He later called keeping IBM together "the most important decision I ever made."
    He also cut prices on mainframe computers to keep customers loyal.


    Gerstner found that IBM''s biggest problem was its culture, the habits and attitudes of its people. Divisions competed with each other and kept information to themselves. Gerstner pushed employees to
    focus on customers and to work across divisions. He said culture wasn''t just one part of the game at IBM; "It is the game." As he put it in 1996, "If the problems at IBM had been technical, I wouldn''t
    be here today." He also steered IBM toward services: helping companies plan, build and run their technology, even if that meant using products from other companies.


    The changes worked. Services became IBM''s second-biggest business by the mid-1990s, and by 1996 the stock price had nearly tripled. During Gerstner''s time as CEO, IBM''s stock market value rose nearly
    six-fold. He retired as chief executive in 2002 and wrote a book about the experience called Who Says Elephants Can''t Dance? He died in December 2025 at age 83.

    '
  timeline:
  - - '1992'
    - IBM loses about $5 billion as its mainframe business shrinks.
  - - April 1993
    - Lou Gerstner becomes IBM's first chief executive hired from outside the company.
  - - July 1993
    - IBM reports a record quarterly loss of about $8 billion and deep job cuts.
  - - '1993'
    - Gerstner decides to keep IBM together instead of breaking it up.
  - - Mid-1990s
    - IBM grows its services business into its second-largest operation.
  - - '1996'
    - IBM's stock has nearly tripled since Gerstner arrived.
  - - '2002'
    - Gerstner retires as CEO and publishes 'Who Says Elephants Can't Dance?'
  numbers:
  - - IBM losses before Gerstner (1991–1992)
    - nearly $8 billion
  - - Quarterly loss reported July 1993
    - about $8 billion
  - - Additional job cuts (1993)
    - about 35,000
  - - Rise in IBM stock market value (1993–2002)
    - nearly six-fold
  lessons:
  - 'Sequencing the turnaround: IBM lost nearly $8 billion over 1991 and 1992 and reported a record quarterly loss of about $8 billion in July 1993. Gerstner said the last thing IBM needed was a vision.
    He cut about 35,000 more jobs and fixed costs and pricing first. A distressed firm buys the right to pursue strategy by restoring liquidity and credibility.'
  - 'Integration as a strategic asset: The board was preparing to split IBM into separate units. Customers told Gerstner they wanted one supplier to integrate their systems, so he kept the company whole
    and called it the most important decision of his career. Before a breakup, ask whether customers value the combination, because economies of scope can be worth more than the clarity of separate businesses.'
  - 'Shift to services: Gerstner moved IBM toward planning, building and running customers'' technology, even with other vendors'' products. Services became IBM''s second-largest business by the mid-1990s.
    Selling solutions rather than boxes changes the revenue model toward recurring, relationship-based income that is less exposed to hardware commoditization.'
  - 'Culture as execution: Divisions competed and hoarded information, and Gerstner concluded that culture "is the game." Structure and strategy fail if internal incentives reward silo behavior. A turnaround
    leader must change how units are measured and how they cooperate, not only what they sell.'
  - 'Outsider leadership and its limits: IBM''s first outside CEO brought a customer and finance lens, not engineering expertise. Market value rose nearly six-fold during his tenure. Some critics credit
    part of the improvement to pension changes and buybacks, and his book is a first-person account. Judge turnarounds on operating results as well as share price.'
  questions:
  - You are on IBM's board in April 1993 with a breakup plan already prepared. What analysis would you require before deciding between separation and integration?
  - Gerstner cut mainframe prices to keep customers. When does cutting price on a core product protect long-run value, and when does it simply destroy margin?
  - How would you measure whether a culture change is working within the first 18 months, before financial results catch up?
  - Critics point to buybacks and pension accounting. How would you separate operating improvement from financial engineering in evaluating a CEO's record?
  note: Some critics have argued that IBM's turnaround numbers were helped by accounting and financial moves, such as pension changes and large stock buybacks, and that Gerstner's book tells the story mostly
    from his own point of view. Exact loss figures vary slightly depending on whether restructuring charges are counted.
  sources:
  - name: Boston Globe, 'Louis V. Gerstner, who revived faltering IBM in the 90s, dies at 83' (2025)
    url: https://bostonglobe.com/2025/12/29/metro/louis-v-gerstner-who-revived-faltering-ibm-90s-dies-83/
  - name: Encyclopaedia Britannica, 'Lou Gerstner'
    url: https://www.Britannica.com/money/Lou-Gerstner
  - name: Tampa Bay Times, 'IBM reports record loss' (1993)
    url: https://www.tampabay.com/archive/1993/07/28/ibm-reports-record-loss/
  - name: Seattle Times, 'IBM's Rebirth' (1996)
    url: https://archive.seattletimes.com/archive/19960907/2347789/ibms-rebirth----big-blues-chairman-reprograms-the-company-with-customer-service
  - name: Knowledge at Wharton review of 'Who Says Elephants Can't Dance?'
    url: https://knowledge.wharton.upenn.edu/?p=3398
- slug: xerox-parc-1979
  title: 'Xerox PARC: Inventing the Future and Letting It Walk Out the Door'
  company: Xerox
  year: 1970–1984
  industry: Computers and office equipment
  tags:
  - Innovation
  - Strategy
  - Leadership
  summary: In the 1970s, scientists at Xerox's Palo Alto Research Center built a computer with windows, icons, a mouse and a network, years before anyone else. Xerox never turned it into a hit product,
    while a young Apple took the ideas it saw in a 1979 demonstration and built the Macintosh.
  moral: Invention creates value, but capturing it requires a business model, cost targets and complementary assets aligned with the new market; research cut off from them tends to enrich others.
  story: 'In 1970, the Xerox Corporation was rich and confident. It made most of the photocopiers in American offices, and it wanted to be ready for whatever came next. So it opened a research lab in Palo
    Alto, California, called PARC, and gave its scientists a big assignment: invent the office of the future.


    They did. In 1973, PARC introduced a computer called the Alto. Today it would look familiar. It had a screen showing pages the way they would look when printed, little pictures you could point at, overlapping
    windows, and a mouse to move around. Altos could talk to each other over a network PARC invented called Ethernet, and send documents to another PARC invention, the laser printer. At a time when most
    computers filled rooms and were run by specialists, this was astonishing.


    But the Alto was also expensive. Its introductory price was about $32,000 in 1973, and only around 2,000 were ever made, mostly for use inside Xerox and at universities. Xerox''s leaders in Connecticut
    were focused on copiers, and they never figured out how to turn the Alto into a product ordinary people could afford. When Xerox finally sold a version, the Star, in 1981, a full office setup could
    cost up to about $100,000. It sold poorly. Laser printing did become a big business for Xerox, so PARC was not a total loss, but the personal computer slipped away.


    Meanwhile, a small company called Apple was growing fast. In 1979, Xerox''s investment arm made a deal to invest $1 million in Apple for 100,000 shares before Apple went public. As part of the arrangement,
    Apple''s people were allowed to see what PARC was working on. In December 1979, Steve Jobs and a group of Apple engineers visited PARC and watched demonstrations of the Alto. One PARC researcher, Adele
    Goldberg, objected to showing them so much, but Xerox managers overruled her.


    Jobs was thrilled by the graphical screen and the mouse. But he did not simply copy them. PARC''s mouse had three buttons, cost about $300 to make, and was fragile. Apple wanted a one-button mouse that
    cost around $15. Apple''s designers spent years working out their own ideas, like the menu bar across the top of the screen and the trash can for deleting files. Apple''s Lisa computer came out in 1983
    and was too expensive to succeed, but the Macintosh in 1984 brought the windows-and-mouse style to a mass audience. Microsoft''s Windows followed, and the rest is history.


    Xerox later sued Apple, in 1989, over the look of the Mac screen, but a court threw out its main claims. By then the real lesson was clear. Xerox had the inventors, the money and a head start of several
    years. What it lacked was the will to bet on something that did not fit its existing business. PARC built a personal computer for experts. Apple set out to build a popular computer for everyone.

    '
  timeline:
  - - '1970'
    - Xerox opens PARC in Palo Alto with the goal of inventing the office of the future.
  - - Mar 1973
    - PARC introduces the Alto, a computer with a graphical screen and a mouse.
  - - '1979'
    - Xerox invests $1 million in Apple for 100,000 pre-IPO shares, with a look at PARC as part of the deal.
  - - Dec 1979
    - Steve Jobs and Apple engineers see Alto demonstrations at PARC.
  - - '1981'
    - Xerox launches the Star office system; it is costly and sells poorly.
  - - '1983'
    - Apple releases the Lisa, its first computer with a graphical interface.
  - - Jan 1984
    - Apple launches the Macintosh, bringing windows and a mouse to a mass audience.
  - - 1989–1990
    - Xerox sues Apple over the Mac's interface; its main claims are dismissed.
  numbers:
  - - Alto introductory price (1973)
    - about $32,000
  - - Altos built
    - about 2,000
  - - Xerox investment in Apple (1979)
    - $1 million for 100,000 shares
  - - PARC mouse vs Apple's target cost
    - about $300 vs about $15
  - - Full Xerox Star office system (1981)
    - up to about $100,000
  lessons:
  - 'Exploration without exploitation: PARC produced the Alto, Ethernet and laser printing, but leadership was focused on copiers. March (1991) argued firms must balance exploring new possibilities with
    exploiting existing ones. Xerox funded exploration well but lacked a path to commercialize results outside its core. Research labs need explicit routes to market, or their output will leak to others.'
  - 'Business model fit: Laser printing succeeded because it fit Xerox''s office equipment sales and service model. The personal computer did not. Chesbrough and Rosenbloom''s 2002 study of Xerox spin-offs
    found that technologies were valued through the business model a firm applied to them. When a technology does not fit the current model, consider a separate unit, a spin-off or licensing.'
  - 'Target costing: PARC''s mouse cost about $300 to make; Apple wanted one for about $15. The Alto cost about $32,000 and the Star system up to about $100,000. Apple designed backward from a price a mass
    market would pay. Christensen''s work shows that incumbents tend to build for existing high-end customers; entrants win by making a technology cheap and simple enough for many.'
  - 'Appropriability: Xerox''s 1989 suit against Apple over the Mac interface lost its main claims. Teece (1986) argued that when innovations are hard to protect legally, profits go to whoever controls
    the complementary assets needed to commercialize them. Interface ideas proved easy to imitate, so manufacturing, design and distribution decided who profited.'
  - 'Corporate venturing as a hedge: Xerox''s $1 million investment for 100,000 pre-IPO Apple shares gave it a stake in the company that later commercialized similar ideas. Equity in outside innovators
    can function as a real option on technologies the parent cannot commercialize itself. The cost here was sharing a view of PARC''s work, a trade-off a manager should price explicitly.'
  questions:
  - You run Xerox's strategy group in 1975 and the Alto works. Would you build a PC division, spin out a startup, or license the technology? Defend your choice with the Alto's cost figures.
  - Researcher Adele Goldberg objected to showing Apple so much. How should a firm decide what knowledge to share with an investee or partner?
  - Apple redesigned the mouse from about $300 to about $15. What organizational conditions allow a firm to design to a target cost rather than to the best possible performance?
  - Identify a current corporate research lab that faces Xerox's dilemma. What structure would you recommend to avoid the same outcome?
  note: The popular story that Steve Jobs 'stole' the graphical interface from Xerox is too simple. The visit was arranged as part of an investment deal Xerox agreed to, and Apple did years of its own design
    work afterward. Accounts differ on how many visits there were and exactly what was shown. Xerox's 1989 lawsuit against Apple did not succeed. Some PARC ideas, like laser printing and Ethernet, did go
    on to earn a great deal of money.
  sources:
  - name: Computer History Museum, 'Xerox PARC'
    url: https://www.computerhistory.org/revolution/input-output/14/348
  - name: Wikipedia, 'Xerox Alto'
    url: https://en.wikipedia.org/wiki/Xerox_Alto
  - name: 'Raskin Center, ''The Xerox PARC Visit: What Apple Actually Saw'''
    url: https://www.raskincenter.org/mac/xerox-parc/
  - name: Fortune, 'How Apple made the mouse' (2011)
    url: https://fortune.com/2011/05/09/how-apple-made-the-mouse
  - name: NPR, interview with Malcolm Gladwell on Apple and Xerox (2011)
    url: https://www.npr.org/transcripts/136368716
- slug: amazon-web-services-2006
  title: 'Amazon Web Services: Selling the Tools You Built for Yourself'
  company: Amazon
  year: 2003–2006
  industry: Cloud computing
  tags:
  - Strategy
  - Innovation
  - Operations
  summary: Amazon got so good at running its own computers that, in 2006, it began renting that computing power to anyone with a credit card. Amazon Web Services grew into one of the most profitable businesses
    in the world, earning more than half of Amazon's operating profit in 2024.
  moral: An internal capability built at scale can become a standalone business if it is modular, externally usable and priced on usage; the cost center may become the profit center.
  story: 'Around the year 2000, Amazon was mostly known as an online bookstore that was growing into a store for everything. Behind the website was a huge amount of computer work: storing product pages,
    handling orders, keeping track of warehouses. And it was a mess. The software was tangled together, so changing one part could break another.


    Amazon''s engineers started untangling it, splitting the system into separate pieces that talked to each other through clear, documented connections called APIs. An API is like a menu at a restaurant:
    it tells you what you can order and how to ask, without making you go into the kitchen. Amazon''s leaders noticed something else too. Every time a team started a new project, it spent months building
    its own storage, databases and computing setup from scratch. Projects that were supposed to take three months spent three months just on that plumbing.


    In 2003, Amazon''s top executives met at Jeff Bezos''s house to talk about what the company was truly good at. They expected a short discussion. Instead, they realized that, almost by accident, Amazon
    had become very skilled at running reliable, low-cost computer infrastructure at huge scale. If Amazon''s own teams needed simple building blocks for storage and computing, so did thousands of other
    companies and programmers. Andy Jassy, who led the effort, later said the conclusion seemed obvious looking back.


    Amazon Web Services, or AWS, launched its first big service, called S3, on March 14, 2006. S3 let anyone store files on Amazon''s computers for 15 cents per gigabyte per month, with no minimum fee and
    no contract. A few months later, in August 2006, Amazon launched EC2, which let people rent computing power by the hour, starting at 10 cents an hour. Instead of buying expensive servers and hiring
    people to run them, a two-person startup could rent the same kind of setup Amazon used and pay only for what it needed.


    At the time, many people thought it was strange for a retailer to sell computing. But the idea caught on. Startups loved it because they could begin small and grow fast. Later, big companies and governments
    moved their work onto AWS too. Competitors such as Microsoft and Google built their own cloud businesses to catch up. Jassy said in 2016 that none of the team had predicted how big or how fast it would
    grow. That year AWS was already running at about $10 billion a year in sales.


    By 2024, AWS had net sales of about $107.6 billion and operating income of about $39.8 billion. Amazon''s total operating income that year was about $68.6 billion, so the computing business, which began
    as a fix for Amazon''s own headaches, earned more than half of the whole company''s operating profit.

    '
  timeline:
  - - About 2000
    - Amazon begins splitting its tangled software into separate services with clear APIs.
  - - '2003'
    - At an executive meeting at Jeff Bezos's house, leaders see infrastructure as a core skill they could sell.
  - - Mar 14, 2006
    - AWS launches S3 storage at 15 cents per gigabyte per month.
  - - Jul 2006
    - AWS releases its message service, SQS, for general use.
  - - Aug 25, 2006
    - AWS launches EC2, renting computing power from 10 cents an hour.
  - - '2016'
    - AWS reaches a run rate of about $10 billion a year in sales.
  - - '2024'
    - AWS reports about $107.6 billion in net sales and $39.8 billion in operating income.
  numbers:
  - - S3 launch price (2006)
    - 15 cents per gigabyte per month
  - - EC2 launch price (2006)
    - 10 cents per hour
  - - AWS net sales (2024)
    - about $107.6 billion
  - - AWS operating income (2024)
    - about $39.8 billion, of Amazon's $68.6 billion total
  lessons:
  - 'Productizing a core capability: Amazon''s executives concluded in 2003 that running reliable, low-cost infrastructure at scale had become a core skill. AWS launched S3 in 2006 at 15 cents per gigabyte
    per month. Ask which internal functions you perform better than outside vendors, because those may be products. This account comes mainly from Andy Jassy''s own recollections.'
  - 'Modularity as a precondition: Before AWS, Amazon split its tangled software into services with documented APIs. External customers can only use a capability that is packaged with clear interfaces and
    requires no internal knowledge. Architecture choices made for internal efficiency can create later strategic options.'
  - 'Usage-based pricing: EC2 rented computing at 10 cents an hour with no contract. This turned customers'' capital spending on servers into variable operating cost, letting a two-person startup buy capacity
    in small increments. Pricing that lowers the cost of trial expands the market and draws in customers too small for traditional enterprise sales.'
  - 'Scale economies and early entry: Amazon''s existing scale gave it a cost base and operational learning that new entrants lacked. Microsoft and Google later built competing clouds. Being early in a
    market with large fixed costs and learning effects can produce a lasting lead, but it does not eliminate competition.'
  - 'Portfolio economics: In 2024 AWS earned about $39.8 billion in operating income on about $107.6 billion in sales, about 37 percent margins. That was about 58 percent of Amazon''s $68.6 billion total
    operating income. A high-margin adjacent business can fund thin-margin core operations, which changes how investors should value the whole company.'
  questions:
  - You are an Amazon board member in 2005. What are the strongest arguments against a retailer selling computing services, and how would you weigh them?
  - Some potential AWS customers compete with Amazon's retail business. How should a firm manage selling a capability to its own competitors?
  - Using the 2024 figures, calculate AWS's operating margin and its share of Amazon's operating income. How should these numbers affect capital allocation between retail and AWS?
  - Identify an internal capability at a company you know that could be sold externally. What would need to change before an outside customer could use it?
  note: Early on, 'Amazon Web Services' was also the name for tools that let developers use Amazon's product catalog, which started around 2002–2004; the cloud computing business most people mean today
    began with S3 in 2006. The story of the 2003 meeting comes mainly from Andy Jassy's own later recollections.
  sources:
