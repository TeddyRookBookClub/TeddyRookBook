    url: https://ir.aboutamazon.com/news-release/news-release-details/2025/Amazon-com-Announces-Fourth-Quarter-Results/default.aspx
- slug: zappos-customer-service
  title: 'Zappos: Selling Shoes by Selling Happiness'
  company: Zappos
  year: 1999–2009
  industry: Online retail
  tags:
  - Customers
  - Culture & people
  - Marketing
  summary: Zappos convinced people to buy shoes online, sight unseen, by making shipping free, giving customers a full year to return items, and letting phone staff take as long as needed to help. Its service-first
    culture built fierce loyalty and led Amazon to buy the company in 2009.
  moral: When products are easily compared, service can be the differentiator, but only if hiring, metrics and policies are designed around customer lifetime value rather than cost per transaction.
  story: 'In 1999, a young man named Nick Swinmurn started an online shoe store in San Francisco. It became Zappos. A year later, an entrepreneur named Tony Hsieh invested in the company and soon became
    its leader. Their first year''s sales were tiny, about $1.6 million in 2000.


    Selling shoes online had a big problem: people want to try shoes on. What if they do not fit? Zappos decided to remove that worry. It offered free shipping and a return policy that eventually stretched
    to 365 days. Customers often ordered several sizes, kept the pair that fit, and sent the rest back. That was costly. But Zappos saw it as the price of earning trust, and it found that happy customers
    kept coming back. By the late 2000s, about three out of four daily sales came from repeat customers.


    The heart of Zappos was its phone line. Many companies treat customer service as a cost to keep as small as possible, with scripts and time limits. Zappos went the other way. Its call center workers
    were encouraged to make a real personal connection, even if a call ran long. Hsieh put it simply: "We''re not trying to maximize efficiency. We''re trying to maximize the customer experience." In 2012,
    a call that ended in the sale of a pair of boots lasted more than 10 hours. Zappos later reported a record call of 10 hours and 43 minutes. Most calls were short, of course, but these stories showed
    staff that they really were trusted to put people first.


    Zappos also cared intensely about hiring the right people. Every new employee, even those hired for office jobs, spent time working in the call center. And during training, new hires got an unusual
    offer: if they decided Zappos was not right for them, the company would pay them to quit. By around 2010 the offer was $2,000 to $3,000. Only about 2 to 3 percent took it. The idea was that it was far
    cheaper to part ways early than to keep someone who did not believe in the mission.


    The approach worked. Zappos''s gross sales passed $1 billion in 2008. In July 2009, Amazon announced it would buy Zappos for about 10 million shares of Amazon stock, worth about $807 million at the
    time, plus $40 million in cash and stock for Zappos employees. As Amazon''s share price rose, the deal was widely reported as worth about $1.2 billion when it closed. Amazon promised to let Zappos keep
    running independently from its home in Las Vegas, and Jeff Bezos praised it as a customer-focused company.


    Zappos was not perfect. Its generous policies cost money, and later experiments, like doing away with traditional managers, drew mixed reviews. But the core lesson has lasted. In a world where it is
    easy to compare prices, the way you make people feel can be the thing that sets you apart.


    For a small business, that might mean answering every email warmly, making returns painless, or giving employees permission to do the right thing without asking a manager first.

    '
  timeline:
  - - '1999'
    - Nick Swinmurn founds the online shoe store that becomes Zappos.
  - - '2000'
    - Tony Hsieh invests and joins as co-leader; sales are about $1.6 million.
  - - '2008'
    - Zappos's gross sales pass $1 billion.
  - - Jul 22, 2009
    - Amazon announces it will buy Zappos for about 10 million Amazon shares.
  - - '2009'
    - Fortune names Zappos one of its 100 Best Companies to Work For.
  - - '2012'
    - A Zappos customer service call lasts more than 10 hours.
  numbers:
  - - Gross sales (2000 vs 2008)
    - about $1.6 million vs over $1 billion
  - - Return window
    - 365 days
  - - Pay-to-quit offer (around 2010)
    - $2,000 to $3,000; about 2–3% accepted
  - - Amazon deal (2009)
    - about $807 million in stock at announcement, often reported as $1.2 billion
  - - Record call length
    - 10 hours 43 minutes
  lessons:
  - 'Removing purchase risk: Free shipping and a 365-day return window addressed the main barrier to buying shoes online: fit. Return costs functioned as customer acquisition spending. By the late 2000s
    about three of four daily sales came from repeat customers. Evaluate generous policies by their effect on lifetime value, not by the cost of each return.'
  - 'Choosing the right metrics: Most call centers manage to average handle time. Zappos let calls run long, including a record of 10 hours 43 minutes, and Hsieh said the goal was customer experience, not
    efficiency. Metrics shape behavior. If you measure speed, employees optimize speed; if you want loyalty, measure outcomes linked to repeat purchases.'
  - 'Self-selection in hiring: New hires were offered $2,000 to $3,000 around 2010 to quit after training, and only about 2 to 3 percent accepted. The offer screens out people with weak commitment at a
    known, small cost. Paying to separate early is cheaper than the long-run cost of a poor cultural fit in a customer-facing role.'
  - 'Service-profit chain: Requiring every employee to work in the call center tied internal culture to customer outcomes. The service-profit chain (Heskett et al., 1994) links employee engagement to customer
    loyalty and growth. Zappos grew from about $1.6 million in sales in 2000 to over $1 billion in gross sales in 2008.'
  - 'Culture in acquisitions: Amazon bought Zappos in 2009 for about $807 million in stock at announcement, often reported as $1.2 billion at closing, and agreed to let it run independently. When culture
    is the asset being bought, the integration plan should protect it. Later experiments such as removing traditional managers drew mixed results, a reminder that culture is not self-sustaining.'
  questions:
  - You are Zappos's CFO in 2005. Return shipping costs are rising quickly. What analysis would you run to decide whether the 365-day policy still pays off?
  - Design a customer service scorecard that encourages Zappos-style behavior without letting costs grow unchecked. What would you measure and how would you weigh it?
  - Amazon is known for efficiency; Zappos rejected it in its call center. What should an acquirer do to keep a target's culture intact, and when should it intervene?
  - Would the pay-to-quit offer work in a high-skill professional firm? What would need to change?
  note: 'The price of the Amazon deal is reported two ways: about $807 million based on Amazon''s stock price when it was announced, and about $1.2 billion based on the value when it closed. Reports of
    the longest call vary (more than 10 hours in 2012; 10 hours 43 minutes in a later report). The pay-to-quit amount changed over the years, starting lower, around $1,000 in 2008. Tony Hsieh stepped down
    as CEO in 2020 and died later that year.'
  sources:
  - name: Amazon Form 8-K exhibit, 'Amazon.com to Acquire Zappos.com' (2009)
    url: https://www.sec.gov/Archives/edgar/data/0001018724/000119312509153130/dex991.htm
