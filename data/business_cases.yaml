    url: https://knowledge.wharton.upenn.edu/?p=3398
- slug: xerox-parc-1979
  title: 'Xerox PARC: Inventing the Future and Letting It Walk Out the Door'
  company: Xerox
  year: 1970–1984
  industry: Computers and office equipment
  tags:
  - Innovation
  - Strategy
  - Leadership
  summary: In the 1970s, scientists at Xerox's Palo Alto Research Center built a computer with windows, icons, a mouse and a network, years before anyone else. Xerox never turned it into a hit product, while a young Apple took the ideas it saw in a 1979 demonstration and built the Macintosh.
  moral: An invention is only a seed; it takes someone willing to plant it to grow a harvest.
  story: 'In 1970, the Xerox Corporation was rich and confident. It made most of the photocopiers in American offices, and it wanted to be ready for whatever came next. So it opened a research lab in Palo Alto, California, called PARC, and gave its scientists a big assignment: invent the office of the future.


    They did. In 1973, PARC introduced a computer called the Alto. Today it would look familiar. It had a screen showing pages the way they would look when printed, little pictures you could point at, overlapping windows, and a mouse to move around. Altos could talk to each other over a network PARC invented called Ethernet, and send documents to another PARC invention, the laser printer. At a time when most computers filled rooms and were run by specialists, this was astonishing.


    But the Alto was also expensive. Its introductory price was about $32,000 in 1973, and only around 2,000 were ever made, mostly for use inside Xerox and at universities. Xerox''s leaders in Connecticut were focused on copiers, and they never figured out how to turn the Alto into a product ordinary people could afford. When Xerox finally sold a version, the Star, in 1981, a full office setup could cost up to about $100,000. It sold poorly. Laser printing did become a big business for Xerox, so PARC was not a total loss, but the personal computer slipped away.


    Meanwhile, a small company called Apple was growing fast. In 1979, Xerox''s investment arm made a deal to invest $1 million in Apple for 100,000 shares before Apple went public. As part of the arrangement, Apple''s people were allowed to see what PARC was working on. In December 1979, Steve Jobs and a group of Apple engineers visited PARC and watched demonstrations of the Alto. One PARC researcher, Adele Goldberg, objected to showing them so much, but Xerox managers overruled her.


    Jobs was thrilled by the graphical screen and the mouse. But he did not simply copy them. PARC''s mouse had three buttons, cost about $300 to make, and was fragile. Apple wanted a one-button mouse that cost around $15. Apple''s designers spent years working out their own ideas, like the menu bar across the top of the screen and the trash can for deleting files. Apple''s Lisa computer came out in 1983 and was too expensive to succeed, but the Macintosh in 1984 brought the windows-and-mouse style to a mass audience. Microsoft''s Windows followed, and the rest is history.


    Xerox later sued Apple, in 1989, over the look of the Mac screen, but a court threw out its main claims. By then the real lesson was clear. Xerox had the inventors, the money and a head start of several years. What it lacked was the will to bet on something that did not fit its existing business. PARC built a personal computer for experts. Apple set out to build a popular computer for everyone.


    For a small business, the lesson is close to home. Good ideas are not enough by themselves. Someone has to ask, who is this for, what will it cost them, and how will we get it into their hands?'
  timeline:
  - - '1970'
    - Xerox opens PARC in Palo Alto with the goal of inventing the office of the future.
  - - Mar 1973
    - PARC introduces the Alto, a computer with a graphical screen and a mouse.
  - - '1979'
    - Xerox invests $1 million in Apple for 100,000 pre-IPO shares, with a look at PARC as part of the deal.
  - - Dec 1979
    - Steve Jobs and Apple engineers see Alto demonstrations at PARC.
  - - '1981'
    - Xerox launches the Star office system; it is costly and sells poorly.
  - - '1983'
    - Apple releases the Lisa, its first computer with a graphical interface.
  - - Jan 1984
    - Apple launches the Macintosh, bringing windows and a mouse to a mass audience.
  - - 1989–1990
    - Xerox sues Apple over the Mac's interface; its main claims are dismissed.
  numbers:
  - - Alto introductory price (1973)
    - about $32,000
  - - Altos built
    - about 2,000
  - - Xerox investment in Apple (1979)
    - $1 million for 100,000 shares
  - - PARC mouse vs Apple's target cost
    - about $300 vs about $15
  - - Full Xerox Star office system (1981)
    - up to about $100,000
  lessons:
  - 'Invention is not innovation: a breakthrough only matters once customers can buy and use it.'
  - 'Watch your blind spots: success in one product can make leaders ignore a new one that does not fit.'
  - 'Price is a design choice: Apple''s $15 mouse mattered as much as PARC''s brilliant idea.'
  - 'Know what you are showing: sharing ideas can help a partner, so decide carefully what is worth trading.'
  questions:
  - Why do you think Xerox's leaders, who paid for PARC, did not push harder to sell the Alto?
  - Was it fair for Apple to build on what it saw at PARC, given that the visit was part of a business deal?
  - Is there an idea in your family, school or business that is great but has not reached the people who need it? What is in the way?
  note: The popular story that Steve Jobs 'stole' the graphical interface from Xerox is too simple. The visit was arranged as part of an investment deal Xerox agreed to, and Apple did years of its own design work afterward. Accounts differ on how many visits there were and exactly what was shown. Xerox's 1989 lawsuit against Apple did not succeed. Some PARC ideas, like laser printing and Ethernet, did go on to earn a great deal of money.
  sources:
  - name: Computer History Museum, 'Xerox PARC'
    url: https://www.computerhistory.org/revolution/input-output/14/348
  - name: Wikipedia, 'Xerox Alto'
    url: https://en.wikipedia.org/wiki/Xerox_Alto
  - name: 'Raskin Center, ''The Xerox PARC Visit: What Apple Actually Saw'''
    url: https://www.raskincenter.org/mac/xerox-parc/
  - name: Fortune, 'How Apple made the mouse' (2011)
    url: https://fortune.com/2011/05/09/how-apple-made-the-mouse
  - name: NPR, interview with Malcolm Gladwell on Apple and Xerox (2011)
    url: https://www.npr.org/transcripts/136368716
- slug: amazon-web-services-2006
  title: 'Amazon Web Services: Selling the Tools You Built for Yourself'
  company: Amazon
  year: 2003–2006
  industry: Cloud computing
  tags:
  - Strategy
  - Innovation
  - Operations
  summary: Amazon got so good at running its own computers that, in 2006, it began renting that computing power to anyone with a credit card. Amazon Web Services grew into one of the most profitable businesses in the world, earning more than half of Amazon's operating profit in 2024.
  moral: The skill you sharpen to solve your own problem may be exactly what your neighbors will pay for.
  story: 'Around the year 2000, Amazon was mostly known as an online bookstore that was growing into a store for everything. Behind the website was a huge amount of computer work: storing product pages, handling orders, keeping track of warehouses. And it was a mess. The software was tangled together, so changing one part could break another.


    Amazon''s engineers started untangling it, splitting the system into separate pieces that talked to each other through clear, documented connections called APIs. An API is like a menu at a restaurant: it tells you what you can order and how to ask, without making you go into the kitchen. Amazon''s leaders noticed something else too. Every time a team started a new project, it spent months building its own storage, databases and computing setup from scratch. Projects that were supposed to take three months spent three months just on that plumbing.


    In 2003, Amazon''s top executives met at Jeff Bezos''s house to talk about what the company was truly good at. They expected a short discussion. Instead, they realized that, almost by accident, Amazon had become very skilled at running reliable, low-cost computer infrastructure at huge scale. If Amazon''s own teams needed simple building blocks for storage and computing, so did thousands of other companies and programmers. Andy Jassy, who led the effort, later said the conclusion seemed obvious looking back.


    Amazon Web Services, or AWS, launched its first big service, called S3, on March 14, 2006. S3 let anyone store files on Amazon''s computers for 15 cents per gigabyte per month, with no minimum fee and no contract. A few months later, in August 2006, Amazon launched EC2, which let people rent computing power by the hour, starting at 10 cents an hour. Instead of buying expensive servers and hiring people to run them, a two-person startup could rent the same kind of setup Amazon used and pay only for what it needed.


    At the time, many people thought it was strange for a retailer to sell computing. But the idea caught on. Startups loved it because they could begin small and grow fast. Later, big companies and governments moved their work onto AWS too. Competitors such as Microsoft and Google built their own cloud businesses to catch up. Jassy said in 2016 that none of the team had predicted how big or how fast it would grow. That year AWS was already running at about $10 billion a year in sales.


    By 2024, AWS had net sales of about $107.6 billion and operating income of about $39.8 billion. Amazon''s total operating income that year was about $68.6 billion, so the computing business, which began as a fix for Amazon''s own headaches, earned more than half of the whole company''s operating profit.


    The lesson works at any size. A bakery that perfects its delivery routes, or a homeschool family that builds a great system for organizing lessons, may have created something others would gladly pay for. The trick is to notice it, and to build it well enough that strangers can use it without you standing beside them.'
  timeline:
  - - About 2000
    - Amazon begins splitting its tangled software into separate services with clear APIs.
  - - '2003'
    - At an executive meeting at Jeff Bezos's house, leaders see infrastructure as a core skill they could sell.
  - - Mar 14, 2006
    - AWS launches S3 storage at 15 cents per gigabyte per month.
  - - Jul 2006
    - AWS releases its message service, SQS, for general use.
  - - Aug 25, 2006
    - AWS launches EC2, renting computing power from 10 cents an hour.
  - - '2016'
    - AWS reaches a run rate of about $10 billion a year in sales.
  - - '2024'
    - AWS reports about $107.6 billion in net sales and $39.8 billion in operating income.
  numbers:
  - - S3 launch price (2006)
    - 15 cents per gigabyte per month
  - - EC2 launch price (2006)
    - 10 cents per hour
  - - AWS net sales (2024)
    - about $107.6 billion
  - - AWS operating income (2024)
    - about $39.8 billion, of Amazon's $68.6 billion total
  lessons:
  - 'Look inside for hidden products: tools you built for your own needs may solve others'' problems.'
  - 'Make it easy to start: low prices and no contracts let tiny customers try something new.'
  - 'Build for strangers: a tool others can use without help must be clear, documented and reliable.'
  - 'Ignore the label: a bookstore became a computing giant because it followed its real strengths.'
  questions:
  - What problem was Amazon trying to fix for itself, and how did that turn into a product?
  - Why might renting computers by the hour be better for a small startup than buying them?
  - What is something your family or business does really well that someone else might pay for?
  note: Early on, 'Amazon Web Services' was also the name for tools that let developers use Amazon's product catalog, which started around 2002–2004; the cloud computing business most people mean today began with S3 in 2006. The story of the 2003 meeting comes mainly from Andy Jassy's own later recollections.
  sources:
  - name: TechCrunch, 'How AWS came to be' (2016)
    url: https://techcrunch.com/2016/07/02/andy-jassys-brief-history-of-the-genesis-of-aws
  - name: ADTmag, 'Storage infrastructure service for developers' (2006)
    url: https://adtmag.com/articles/2006/03/14/storage-infrastructure-service-for-developers.aspx
  - name: Wikipedia, 'Timeline of Amazon Web Services'
    url: https://en.wikipedia.org/wiki/Timeline_of_Amazon_Web_Services
  - name: Amazon, 'Amazon.com Announces Fourth Quarter Results' (2025)
    url: https://ir.aboutamazon.com/news-release/news-release-details/2025/Amazon-com-Announces-Fourth-Quarter-Results/default.aspx
- slug: zappos-customer-service
  title: 'Zappos: Selling Shoes by Selling Happiness'
  company: Zappos
  year: 1999–2009
  industry: Online retail
  tags:
  - Customers
  - Culture & people
  - Marketing
  summary: Zappos convinced people to buy shoes online, sight unseen, by making shipping free, giving customers a full year to return items, and letting phone staff take as long as needed to help. Its service-first culture built fierce loyalty and led Amazon to buy the company in 2009.
  moral: Treat every customer like a friend, and many will come back like friends do.
  story: 'In 1999, a young man named Nick Swinmurn started an online shoe store in San Francisco. It became Zappos. A year later, an entrepreneur named Tony Hsieh invested in the company and soon became its leader. Their first year''s sales were tiny, about $1.6 million in 2000.


    Selling shoes online had a big problem: people want to try shoes on. What if they do not fit? Zappos decided to remove that worry. It offered free shipping and a return policy that eventually stretched to 365 days. Customers often ordered several sizes, kept the pair that fit, and sent the rest back. That was costly. But Zappos saw it as the price of earning trust, and it found that happy customers kept coming back. By the late 2000s, about three out of four daily sales came from repeat customers.


    The heart of Zappos was its phone line. Many companies treat customer service as a cost to keep as small as possible, with scripts and time limits. Zappos went the other way. Its call center workers were encouraged to make a real personal connection, even if a call ran long. Hsieh put it simply: "We''re not trying to maximize efficiency. We''re trying to maximize the customer experience." In 2012, a call that ended in the sale of a pair of boots lasted more than 10 hours. Zappos later reported a record call of 10 hours and 43 minutes. Most calls were short, of course, but these stories showed staff that they really were trusted to put people first.


    Zappos also cared intensely about hiring the right people. Every new employee, even those hired for office jobs, spent time working in the call center. And during training, new hires got an unusual offer: if they decided Zappos was not right for them, the company would pay them to quit. By around 2010 the offer was $2,000 to $3,000. Only about 2 to 3 percent took it. The idea was that it was far cheaper to part ways early than to keep someone who did not believe in the mission.


    The approach worked. Zappos''s gross sales passed $1 billion in 2008. In July 2009, Amazon announced it would buy Zappos for about 10 million shares of Amazon stock, worth about $807 million at the time, plus $40 million in cash and stock for Zappos employees. As Amazon''s share price rose, the deal was widely reported as worth about $1.2 billion when it closed. Amazon promised to let Zappos keep running independently from its home in Las Vegas, and Jeff Bezos praised it as a customer-focused company.


    Zappos was not perfect. Its generous policies cost money, and later experiments, like doing away with traditional managers, drew mixed reviews. But the core lesson has lasted. In a world where it is easy to compare prices, the way you make people feel can be the thing that sets you apart.


    For a small business, that might mean answering every email warmly, making returns painless, or giving employees permission to do the right thing without asking a manager first.'
  timeline:
  - - '1999'
    - Nick Swinmurn founds the online shoe store that becomes Zappos.
  - - '2000'
    - Tony Hsieh invests and joins as co-leader; sales are about $1.6 million.
  - - '2008'
    - Zappos's gross sales pass $1 billion.
  - - Jul 22, 2009
    - Amazon announces it will buy Zappos for about 10 million Amazon shares.
  - - '2009'
    - Fortune names Zappos one of its 100 Best Companies to Work For.
  - - '2012'
    - A Zappos customer service call lasts more than 10 hours.
  numbers:
  - - Gross sales (2000 vs 2008)
    - about $1.6 million vs over $1 billion
  - - Return window
    - 365 days
  - - Pay-to-quit offer (around 2010)
    - $2,000 to $3,000; about 2–3% accepted
  - - Amazon deal (2009)
    - about $807 million in stock at announcement, often reported as $1.2 billion
  - - Record call length
    - 10 hours 43 minutes
  lessons:
  - 'Remove the risk: free shipping and easy returns made a scary purchase feel safe.'
  - 'Service is marketing: loyal, happy customers bring themselves back and tell their friends.'
  - 'Hire for fit: it is cheaper to pay a poor fit to leave early than to keep them for years.'
  - 'Trust your people: staff who are free to help without scripts can create memorable moments.'
  questions:
  - Why would a company pay new employees to quit? Do you think it is a good idea?
  - Zappos's free returns cost a lot of money. Why might they still have been worth it?
  - Think of a business that made you feel cared for. What exactly did they do?
  note: 'The price of the Amazon deal is reported two ways: about $807 million based on Amazon''s stock price when it was announced, and about $1.2 billion based on the value when it closed. Reports of the longest call vary (more than 10 hours in 2012; 10 hours 43 minutes in a later report). The pay-to-quit amount changed over the years, starting lower, around $1,000 in 2008. Tony Hsieh stepped down as CEO in 2020 and died later that year.'
  sources:
