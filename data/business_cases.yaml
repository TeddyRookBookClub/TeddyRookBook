- slug: boeing-737-max-2018
  title: Boeing and the 737 MAX
  company: Boeing
  year: 2018–2020
  industry: Aerospace
  tags:
  - Ethics & trust
  - Crisis
  - Culture & people
  summary: Two new Boeing 737 MAX jets crashed within five months, killing 346 people, after a flight-control system called MCAS repeatedly pushed the planes' noses down. Investigators found Boeing had
    kept key information from regulators and pilots, the plane was grounded for 20 months, and Boeing admitted that two former employees deceived the FAA.
  moral: When a product's business case depends on regulators and customers seeing little change, design and disclosure decisions drift toward managing perception rather than managing risk.
  story: 'In the early 2010s, Boeing faced a challenge. Its rival Airbus had launched a new, more fuel-efficient version of its popular A320 jet, and airlines were ordering it. Instead of designing a whole
    new plane, Boeing updated its trusty 737 with bigger, more efficient engines. The result was the 737 MAX. A big selling point was that pilots who already flew the 737 would need only limited extra training
    to fly the MAX, which would save airlines money.


    The bigger engines changed how the plane handled, making the nose more likely to pitch up in some situations. To make the MAX feel like older 737s, Boeing added software called the Maneuvering Characteristics
    Augmentation System, or MCAS. It could automatically push the nose down. A congressional investigation later found that MCAS could be triggered by data from just one sensor, so if that sensor failed,
    MCAS could push the nose down when it shouldn''t. Pilots were not told the system existed.


    On October 29, 2018, Lion Air Flight 610 crashed into the sea off Indonesia minutes after takeoff, killing all 189 people aboard. On March 10, 2019, Ethiopian Airlines Flight 302 crashed shortly after
    leaving Addis Ababa, killing all 157 aboard. Both crashes were linked to MCAS. Within days of the second crash, regulators around the world, and then the U.S. Federal Aviation Administration (FAA),
    grounded the 737 MAX. In December 2019, Boeing''s board removed chief executive Dennis Muilenburg.


    Investigations painted a troubling picture. In September 2020, after an 18-month probe, the Democratic majority of the House Transportation Committee issued a report calling the crashes "the horrific
    culmination" of faulty engineering assumptions, a lack of openness by Boeing''s management and weak oversight by the FAA. The report said Boeing had withheld crucial information from the FAA, its airline
    customers and pilots. The FAA required fixes, including having MCAS use data from two sensors instead of one, before it let the MAX fly again on November 18, 2020, after the longest grounding of a U.S.
    airliner.


    In January 2021, Boeing reached a deferred prosecution agreement with the Justice Department, meaning charges would be dropped if Boeing followed the rules for three years. The agreement was based on
    two former Boeing employees intentionally failing to tell an FAA group about changes to MCAS, so that group did not fully understand MCAS when deciding how much training pilots needed. Boeing agreed
    to pay over $2.5 billion: a $243.6 million criminal penalty, $1.77 billion to airline customers and $500 million for the families of those who died.


    The story did not end there. In January 2024, a door panel blew off an Alaska Airlines 737 MAX 9 in flight, raising new questions about Boeing''s quality. That May, the Justice Department said Boeing
    had broken the 2021 agreement. Boeing agreed in July 2024 to plead guilty to a fraud conspiracy charge, but a judge rejected that deal in December. In May 2025, Boeing and the government instead reached
    a roughly $1.1 billion non-prosecution agreement. In November 2025, Judge Reed O''Connor dismissed the criminal case, saying he disagreed that the deal served the public interest but lacked the power
    to stop it. Some victims'' families supported the deal; others opposed it and said they would appeal.

    '
  timeline:
  - - Oct 29, 2018
    - Lion Air Flight 610 crashes off Indonesia, killing 189.
  - - Mar 10, 2019
    - Ethiopian Airlines Flight 302 crashes, killing 157; the MAX is grounded worldwide within days.
  - - Dec 23, 2019
    - Boeing removes CEO Dennis Muilenburg.
  - - Sept 2020
    - House committee report blames Boeing design failures, lack of transparency and weak FAA oversight.
  - - Nov 18, 2020
    - The FAA clears the redesigned MAX to fly again.
  - - Jan 7, 2021
    - Boeing agrees to pay over $2.5 billion under a deferred prosecution agreement.
  - - Nov 6, 2025
    - A federal judge dismisses the criminal case after a new non-prosecution agreement.
  numbers:
  - - People killed in the two crashes
    - '346'
  - - Length of U.S. grounding
    - about 20 months (March 2019 to November 2020)
  - - 2021 settlement total
    - over $2.5 billion
  - - Fund for victims' families (2021)
    - $500 million
  - - 2025 non-prosecution agreement
    - about $1.1 billion
  lessons:
  - 'Commercial promises can constrain engineering: Boeing answered Airbus''s more efficient A320 by upgrading the 737 instead of designing a new plane, and a key selling point was limited extra pilot training.
    Bigger engines changed handling, so MCAS was added to make the MAX feel like older 737s, and pilots were not told it existed. When a commercial promise limits design or disclosure choices, it should
    go through explicit safety review.'
  - 'Eliminate single points of failure: A congressional investigation found that MCAS could be triggered by one sensor, so a single failure could push the nose down. The FAA''s required fixes included
    using two sensors. Systematic failure-mode analysis asks what happens when each input fails. In safety-critical systems, one faulty input should not be able to drive an uncommanded action without a
    cross-check.'
  - 'Delegated oversight depends on disclosure culture: The House committee''s Democratic majority found that Boeing withheld key information from the FAA, airlines and pilots, and that FAA oversight was
    weak. The 2021 agreement centered on two former employees misleading one FAA group, though others did inform other FAA officials. When regulators rely on the regulated firm''s disclosures, the firm''s
    internal reporting culture effectively becomes part of the safety system.'
  - 'Precaution after the first warning: Lion Air crashed in October 2018, and the MAX kept flying until Ethiopian Airlines crashed in March 2019, killing 157 more. Other regulators grounded the plane before
    the FAA did. Compare J&J''s nationwide Tylenol recall: when a first event suggests an unbounded risk, the cost of pausing is usually far smaller than the cost of being wrong.'
  - 'Settlements do not fix culture: The 2021 deal cost over $2.5 billion: $243.6 million in criminal penalties, $1.77 billion to airlines and $500 million for victims'' families. The January 2024 door-panel
    blowout and the government''s finding that Boeing had breached the agreement showed that the underlying problems persisted. Boards should treat legal settlements as the start of cultural repair, with
    independent safety oversight, not as closure.'
  questions:
  - Early in the MAX program, you are a senior engineer who learns MCAS's authority has been expanded. The business case rests on minimal extra training. What do you disclose, to whom, and what happens
    to the training promise?
  - After the Lion Air crash in October 2018, the MAX kept flying until March 2019. Compare that choice with J&J's 1982 Tylenol recall. What differed in information, cost, incentives and regulatory structure?
  - Of the 2021 settlement, $1.77 billion went to airlines, $500 million to families and $243.6 million to criminal penalties. What does that allocation suggest about how harm is valued and how well the
    penalty deters?
  - The FAA relied heavily on Boeing's own disclosures. How should any regulated company design internal reporting so that safety concerns reach regulators intact despite commercial pressure?
  note: The House report quoted here came from the committee's Democratic majority. Boeing's 2021 admissions centered on two former employees misleading one FAA group; the agreement also noted that other
    Boeing employees did tell other FAA officials about MCAS's expanded range. As of the November 2025 dismissal, victims' families said they planned to appeal; check for later developments.
  sources:
  - name: Boeing Form 8-K exhibit (SEC filing), 'Boeing Reaches Agreement with U.S. Department of Justice' (2021)
    url: https://www.sec.gov/Archives/edgar/data/12927/000001292721000003/a202001jan078kexhibit991.htm
