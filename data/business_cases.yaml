    url: https://ebsco.com/research-starters/business-and-management/zappos-company
- slug: ritz-carlton-2000-rule
  title: The Ritz-Carlton's $2,000 Rule
  company: The Ritz-Carlton Hotel Company
  year: 1990s
  industry: Hotels and hospitality
  tags:
  - Customers
  - Culture & people
  - Leadership
  summary: The Ritz-Carlton hotel chain famously allowed any employee, from housekeeper to front desk clerk, to spend up to $2,000 to fix a guest's problem on the spot. Paired with heavy training and a culture of respect, the policy helped the company win America's top quality award twice.
  moral: Give people trust along with responsibility, and they will usually rise to meet it.
  story: 'Imagine you are a guest at a fancy hotel and something goes wrong. Your room is not ready, or the laundry ruined your shirt before a big meeting. In many businesses, the employee you talk to says, I''ll have to ask my manager. You wait, you get more frustrated, and the problem grows.


    The Ritz-Carlton Hotel Company decided that was the wrong way to run a luxury hotel. Under Horst Schulze, a co-founder who led the company''s operations for years, the chain gave every employee the power to solve a guest''s problem right away. Each employee could spend up to $2,000 to fix a problem or settle a complaint, without getting a manager''s permission first. Schulze said the point was to let employees make decisions to keep a customer, and to train them to handle complaints themselves instead of passing them along.


    That number got a lot of attention, and it still does. But the money was never really the main idea. Few problems actually cost anywhere near $2,000 to fix. The rule was a signal. It told every worker, we trust your judgment, and the guest''s happiness is your job, not just your boss''s. It also told guests that whoever they asked for help could actually help. A housekeeper who heard a guest complain did not have to shrug and point toward the front desk. She could own the problem from start to finish, and then share what happened so the hotel could keep it from happening again.


    Trust like that only works if people are well prepared. The Ritz-Carlton invested heavily in training. According to the U.S. government''s quality award program, first-year front-line employees got about 250 hours of training. Every day, staff discussed one of the company''s service standards. The company also kept a shared database with nearly a million guest files, so that a hotel in one city could remember a guest''s preferences from a stay in another.


    Schulze also wanted employees to feel respected, not like servants. Since he was a teenager working in hotels, he had believed in a simple motto, which became the company''s: "We are ladies and gentlemen serving ladies and gentlemen." Workers were treated as professionals, and they were expected to act that way.


    The results were remarkable. The Ritz-Carlton won the Malcolm Baldrige National Quality Award, given by the U.S. Department of Commerce, in 1992 and again in 1999. It was the only company in the service category to win twice. In 1999 the company ran 36 hotels with about 17,000 employees, and an independent survey found 99 percent of guests satisfied with their stay.


    There is an important catch for anyone who wants to copy this. A spending limit without training, clear standards and good hiring could lead to waste or confusion. The $2,000 worked because it sat on top of a whole system built to help ordinary people make good decisions. A small business does not need a $2,000 limit. It might be $20 or $200. What matters is that the person closest to the customer is trained, trusted and allowed to make things right.'
  timeline:
  - - '1992'
    - The company wins its first Malcolm Baldrige National Quality Award.
  - - 1990s
    - Every employee is empowered to spend up to $2,000 to fix a guest's problem on the spot.
  - - '1999'
    - The company wins a second Baldrige Award, the only two-time winner in the service category.
  - - '1999'
    - Horst Schulze, president and chief operating officer, credits the award to the company's 17,000 'ladies and gentlemen.'
  numbers:
  - - Employee spending authority
    - up to $2,000 to resolve a guest problem
  - - Training for first-year front-line staff (1999)
    - about 250 hours
  - - Company size (1999)
    - 36 hotels, about 17,000 employees
  - - Guest satisfaction (1999 survey)
    - 99 percent satisfied
  lessons:
  - 'Push decisions to the front line: the person facing the customer should be able to help.'
  - 'Trust needs training: empowerment works only when people know the standards.'
  - 'Respect builds pride: treating staff as professionals helps them act like professionals.'
  - 'The signal matters more than the sum: a clear limit tells people they are trusted.'
  questions:
  - Why do you think the Ritz-Carlton picked such a large number as $2,000?
  - What could go wrong if a company gave employees spending power without training them?
  - In your home or business, what small decision could you trust someone else to make on their own?
  note: The $2,000 figure is confirmed by the U.S. government's Baldrige Award profile and by Horst Schulze. Many popular retellings exaggerate it as a daily allowance or say employees routinely spend it; in practice it was a ceiling meant to signal trust. The Ritz name in luxury hotels is much older than the modern company described here, and its policies today may differ from those of the 1990s.
  sources:
