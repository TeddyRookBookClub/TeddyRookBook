- slug: ibm-gerstner-turnaround-1993
  title: Lou Gerstner Teaches IBM to Dance
  company: IBM
  year: 1993–2002
  industry: Computers & technology services
  tags:
  - Leadership
  - Strategy
  - Culture & people
  summary: In the early 1990s, IBM, once the most powerful computer company in the world, was losing billions of dollars and many expected it to be broken into pieces. Outsider Lou Gerstner took over in 1993, kept the company whole, cut costs, and rebuilt IBM around solving customers' problems, leading one of the most famous turnarounds in business history.
  moral: Fix what is broken today before you dream about tomorrow.
  story: 'For most of the 20th century, IBM was the giant of the computer world. Its big mainframe computers ran banks, airlines and governments. Employees were famous for their white shirts, and the company had a long tradition of avoiding layoffs. But by the early 1990s, cheaper personal computers and smaller machines from many competitors were eating into IBM''s business. The company lost about $5 billion in 1992 alone, and nearly $8 billion over two years.


    IBM''s leaders were preparing to split the company into separate pieces, each competing on its own. In April 1993, IBM''s board did something it had never done before: it hired a chief executive from outside the company. Lou Gerstner had spent years at American Express and was running the food and tobacco company RJR Nabisco. He was not a computer engineer, and many people doubted he could save IBM.


    Gerstner''s first months were about survival. In July 1993, IBM reported a record quarterly loss of about $8 billion, mostly the cost of cutting tens of thousands of jobs and restructuring. IBM cut about 35,000 more jobs, ending its old tradition of avoiding layoffs. When reporters asked about his vision for the company, Gerstner gave a famous answer: "The last thing IBM needs right now is a vision." He meant that IBM needed to fix its costs, its products and its relationships with customers first.


    His most important decision was to stop the breakup. Gerstner listened to big customers, and many told him they wanted one company that could bring all the pieces of their computer systems together. He decided that IBM''s size, which everyone saw as a weakness, could be a strength if the company worked as one team. He later called keeping IBM together "the most important decision I ever made." He also cut prices on mainframe computers to keep customers loyal.


    Gerstner found that IBM''s biggest problem was its culture, the habits and attitudes of its people. Divisions competed with each other and kept information to themselves. Gerstner pushed employees to focus on customers and to work across divisions. He said culture wasn''t just one part of the game at IBM; "It is the game." As he put it in 1996, "If the problems at IBM had been technical, I wouldn''t be here today." He also steered IBM toward services: helping companies plan, build and run their technology, even if that meant using products from other companies.


    The changes worked. Services became IBM''s second-biggest business by the mid-1990s, and by 1996 the stock price had nearly tripled. During Gerstner''s time as CEO, IBM''s stock market value rose nearly six-fold. He retired as chief executive in 2002 and wrote a book about the experience called Who Says Elephants Can''t Dance? He died in December 2025 at age 83.


    The IBM story shows that a fresh pair of eyes can help a struggling organization, that a company''s biggest problems are sometimes about people rather than products, and that a turnaround usually starts with hard, practical work rather than grand speeches.'
  timeline:
  - - '1992'
    - IBM loses about $5 billion as its mainframe business shrinks.
  - - April 1993
    - Lou Gerstner becomes IBM's first chief executive hired from outside the company.
  - - July 1993
    - IBM reports a record quarterly loss of about $8 billion and deep job cuts.
  - - '1993'
    - Gerstner decides to keep IBM together instead of breaking it up.
  - - Mid-1990s
    - IBM grows its services business into its second-largest operation.
  - - '1996'
    - IBM's stock has nearly tripled since Gerstner arrived.
  - - '2002'
    - Gerstner retires as CEO and publishes 'Who Says Elephants Can't Dance?'
  numbers:
  - - IBM losses before Gerstner (1991–1992)
    - nearly $8 billion
  - - Quarterly loss reported July 1993
    - about $8 billion
  - - Additional job cuts (1993)
    - about 35,000
  - - Rise in IBM stock market value (1993–2002)
    - nearly six-fold
  lessons:
  - 'Handle the emergency first: Gerstner focused on costs and customers before talking about big dreams.'
  - 'Listen to customers: their need for one trusted partner convinced Gerstner not to break IBM apart.'
  - 'Culture is the game: rules and plans fail if people keep working against each other.'
  - 'Turn weakness into strength: IBM''s size became an advantage once the company worked together.'
  questions:
  - Gerstner said IBM did not need a vision right away. When is a big vision helpful, and when can it get in the way?
  - Why might an outsider see a company's problems more clearly than people who have worked there for years?
  - What does 'culture' mean in a family, team or business you know? How could you change it?
  note: Some critics have argued that IBM's turnaround numbers were helped by accounting and financial moves, such as pension changes and large stock buybacks, and that Gerstner's book tells the story mostly from his own point of view. Exact loss figures vary slightly depending on whether restructuring charges are counted.
