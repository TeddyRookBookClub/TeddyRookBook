- slug: mattel-recalls-2007
  title: Mattel and the Summer of Toy Recalls
  company: Mattel (including Fisher-Price)
  year: '2007'
  industry: Toys
  tags:
  - Ethics & trust
  - Operations
  - Crisis
  summary: In the summer of 2007, Mattel recalled more than 21 million Chinese-made toys, some because of lead paint and many more because of tiny magnets that could come loose. The crisis showed that a company is responsible for everything that goes into its products, even work done by suppliers of its suppliers.
  moral: You can hand off the work, but never the responsibility.
  story: 'Mattel, the company behind Barbie, Hot Wheels and Fisher-Price, is one of the biggest toy makers in the world. Like most toy companies, it had many of its toys built by contract factories in China. That arrangement keeps costs low, but it also means the company does not control every step, every worker and every can of paint.


    On August 2, 2007, the U.S. Consumer Product Safety Commission (CPSC), the government agency that watches over product safety, announced that Fisher-Price was recalling about 967,000 toys, including Sesame Street and Dora the Explorer figures. A recall means the company asks customers to stop using a product and return it. The problem was that surface paint on the toys could contain too much lead. Lead is poisonous, especially for young children who put toys in their mouths, and lead paint on toys had been banned in the United States since 1978. No injuries were reported. The toys had been made by a Chinese factory called Lee Der Industrial.


    Two weeks later, on August 14, Mattel announced two more recalls. One was about 436,000 die-cast "Sarge" cars from the Cars movie line, again for lead paint. Mattel explained that a subcontractor that painted parts of the toy had used paint from an unapproved supplier instead of the paint it was supposed to use. The second recall was much larger: about 18.2 million toys worldwide, such as some Polly Pocket sets, that contained small, powerful magnets that could fall out. If a child swallows more than one magnet, they can stick together inside the body and cause serious harm. On September 4 came yet another lead-paint recall, about 675,000 Barbie accessory sets in the United States.


    Mattel''s chief executive, Robert Eckert, apologized publicly, saying the company was "deeply apologetic to everyone affected." Mattel announced tighter rules: only paint from certified suppliers, testing of every batch of paint, more surprise inspections at factories, and testing of every production run of finished toys before shipment.


    Then the story took a turn. On September 21, 2007, a Mattel executive, Thomas Debrowski, met China''s product safety chief and apologized to China. He acknowledged that the "vast majority" of the recalled toys were recalled because of a design flaw by Mattel itself, the magnet problem, not because of mistakes by Chinese factories. In other words, the lead paint came from the supply chain, but most recalled toys traced back to Mattel''s own design.


    The government also had the final word on the lead paint. In June 2009, Mattel and Fisher-Price agreed to pay a $2.3 million civil penalty, the largest the CPSC had ever imposed for that kind of violation. The agency said the two companies had brought in up to about 2 million toys that broke the lead-paint ban between 2006 and 2007. As is common in such settlements, the companies did not admit wrongdoing and denied knowingly breaking the law.


    For families, the lesson is simple: a famous name on the box is only as good as the checking behind it. For business owners, it is a reminder that when you sell something with your name on it, customers hold you responsible for every part of it, no matter who actually made it.'
  timeline:
  - - '1978'
    - U.S. bans lead paint on toys above a very small limit.
  - - Aug 2, 2007
    - Fisher-Price recall of about 967,000 toys for lead paint is announced.
  - - Aug 14, 2007
    - Mattel recalls about 436,000 'Sarge' cars for lead paint and about 18.2 million magnet toys worldwide.
  - - Sept 4, 2007
    - Mattel recalls about 675,000 Barbie accessory sets in the U.S. for lead paint.
  - - Sept 21, 2007
    - Mattel executive apologizes to China, saying most recalls came from Mattel's own design flaw.
  - - June 5, 2009
    - Mattel and Fisher-Price agree to a $2.3 million civil penalty, without admitting wrongdoing.
  numbers:
  - - Toys in the first Fisher-Price lead recall (2007)
    - about 967,000
  - - Magnet toys recalled worldwide (Aug 2007)
    - about 18.2 million
  - - Total toys in Mattel's three big 2007 recalls
    - more than 21 million
  - - CPSC civil penalty (2009)
    - $2.3 million
  lessons:
  - 'Own your whole supply chain: customers blame the name on the box, not the hidden subcontractor.'
  - 'Trust, but test: checking every batch costs less than a recall.'
  - 'Look in the mirror first: most of Mattel''s recalled toys came from its own design problem.'
  - 'Act quickly and say sorry: fast recalls and clear apologies limit the harm.'
  questions:
  - Why do you think the paint subcontractor used paint from an unapproved supplier?
  - If you sold handmade goods using parts from other people, how would you check their quality?
  - Why might a company apologize to another country's government? Who was that apology for?
  note: Mattel first announced the Fisher-Price recall on August 1, 2007; the CPSC notice is dated August 2. In the 2009 settlement, Mattel and Fisher-Price did not admit wrongdoing; the penalty resolved the CPSC staff's allegations.
  sources:
  - name: CPSC, 'Fisher-Price Recalls Licensed Character Toys Due to Lead Poisoning Hazard' (2007)
    url: https://www.cpsc.gov/Recalls/2007/fisher-price-recalls-licensed-character-toys-due-to-lead-poisoning-hazard
  - name: Reliable Plant, 'Production issues force expanded recall of Mattel toys' (2007)
    url: https://reliableplant.com/Articles/Print/7822?id=7822
  - name: CPSC, 'Mattel Recalls Various Barbie Accessory Toys' (2007)
    url: https://www.cpsc.gov/Recalls/2007/mattel-recalls-various-barbie-accessory-toys-due-to-violation-of-lead-paint-standard
  - name: NBC News / NYT, 'Mattel apologizes to China over recalls' (2007)
    url: https://www.nbcnews.com/id/wbna20903731
  - name: CPSC, 'Mattel, Fisher-Price to Pay $2.3 Million Civil Penalty' (2009)
    url: https://www.cpsc.gov/Newsroom/News-Releases/2009/Mattel-Fisher-Price-to-Pay-23-Million-Civil-Penalty-for-Violating-Federal-Lead-Paint-Ban-Penalty-is-highest-ever-for-CPSC-regulated-product-violations
- slug: polaroid-rise-and-fall
  title: 'Polaroid: The Instant Camera That Didn''t Change Fast Enough'
  company: Polaroid Corporation
  year: 1937–2001
  industry: Photography
  tags:
  - Innovation
  - Strategy
  summary: Polaroid invented instant photography and for decades owned it completely. It even did early digital camera research, but its business depended on selling high-profit film, and it filed for bankruptcy in October 2001. It is a classic story of a company that saw the future but could not let go of the past.
  moral: The thing that made you rich can become the thing that holds you back.
  story: 'Edwin Land was a brilliant inventor who left Harvard as a teenager to work on a new material that could polarize light, the same idea used in many sunglasses today. In 1937 he founded the Polaroid Corporation in Cambridge, Massachusetts. During World War II, Polaroid made goggles and optical equipment for the U.S. military.


    Land''s most famous idea came next. According to company lore, his young daughter asked why she couldn''t see a photo right after it was taken. In 1947 Land showed the world a camera that produced a finished print right out of the camera, and the first model went on sale in 1948 for $89.75. In 1972 Polaroid launched the SX-70, a camera that pushed out a picture that developed before your eyes. Polaroid had a monopoly, meaning it was the only seller of instant photography. At its peak, around 1978, it employed about 21,000 people.


    Polaroid made most of its money the way a razor company does: the camera got you started, but the real profit was in the film you kept buying. A later CEO said instant film earned gross margins well above 65 percent, meaning most of each film sale was profit after the cost of making it. When Kodak started selling instant cameras in 1976, Polaroid sued for patent infringement and won. In 1990 a court awarded Polaroid about $909 million, and the court had already ordered Kodak out of the instant camera business.


    Polaroid did not ignore computers and electronics. It took out early patents on electronic camera parts in the 1960s, formed an electronic imaging group in 1981, and by 1989 was spending 42 percent of its research budget on digital imaging. In the late 1990s it was even a top seller of digital cameras. But leaders kept believing that people would always want a printed picture in their hands. A digital camera needs no film, and film was where Polaroid''s profits lived.


    Other problems piled up. To fight off a hostile takeover attempt in 1989, Polaroid took on heavy debt. One-hour photo labs and then digital cameras cut into demand for instant pictures. Business customers who used Polaroids for ID cards, insurance claims and real estate switched to digital. Revenue peaked at about $3 billion in 1991 and then slid.


    In October 2001, with more than $900 million in debt and its stock trading at about 28 cents a share, Polaroid filed for Chapter 11 bankruptcy, a legal process that protects a struggling company from creditors while it reorganizes or sells itself. Most of the business was sold. The new owners later went through their own bankruptcy in 2008.


    The name did not disappear. In 2008 a group of fans called the Impossible Project took over a former Polaroid film factory in the Netherlands and figured out how to make instant film again. Years later that business took the Polaroid name, and instant cameras became popular with a new generation. The lesson is not that Polaroid''s idea was bad. It is that a company built around one profitable product can find it very hard to replace that product, even when it can see the change coming.'
  timeline:
  - - '1937'
    - Edwin Land and George Wheelwright found Polaroid in Cambridge, Massachusetts.
  - - 1947–1948
    - Land demonstrates instant photography; the first camera goes on sale for $89.75.
  - - '1972'
    - Polaroid launches the SX-70 instant camera.
  - - '1976'
    - Kodak enters instant photography; Polaroid sues for patent infringement.
  - - '1981'
    - Polaroid forms an electronic imaging group.
  - - '1990'
    - Court awards Polaroid about $909 million against Kodak.
  - - Oct 2001
    - Polaroid files for Chapter 11 bankruptcy.
  - - '2008'
    - Post-bankruptcy Polaroid files again; the Impossible Project begins reviving instant film.
  numbers:
  - - First instant camera price (1948)
    - $89.75
  - - Peak employment (1978)
    - about 21,000
  - - Peak revenue (1991)
    - about $3 billion
  - - Research budget spent on digital imaging (1989)
    - 42 percent
  - - Debt at bankruptcy (2001)
    - more than $900 million
  lessons:
  - 'Beware your cash cow: a hugely profitable product can make it painful to embrace what replaces it.'
  - 'Seeing is not enough: Polaroid researched digital early but did not change its business model.'
  - 'Watch your debt: borrowing heavily leaves little room when the market shifts.'
  - 'Customers decide: people wanted pictures, not necessarily prints.'
  questions:
  - What product do you use today that might be replaced in ten years? What should its makers do now?
  - Why is it hard for a company to sell a new product that competes with its own best-seller?
  - Why do you think instant cameras became popular again?
  note: Sources give October 11, 12 or 13, 2001 for the bankruptcy filing; CNN reported it was filed Friday, October 12. The story about Land's daughter inspiring the instant camera comes from Land and Polaroid themselves and is widely repeated, but it is a personal anecdote rather than a documented record.
  sources:
  - name: CNN Money, 'Polaroid files for bankruptcy' (2001)
    url: https://money.cnn.com/2001/10/12/companies/polaroid/
  - name: Yale Insights, 'What Was Polaroid Thinking?'
    url: https://insights.som.yale.edu/insights/what-was-polaroid-thinking
  - name: Fortune, 'Polaroid's instant karma' (2012)
    url: https://fortune.com/2012/10/05/polaroids-instant-karma
  - name: Wikipedia, 'Polaroid Corporation'
    url: https://en.wikipedia.org/wiki/Polaroid_Corporation
- slug: walmart-logistics
  title: 'Walmart: Low Prices Start in the Warehouse'
  company: Walmart
  year: 1962–2000s
  industry: Retail
  tags:
  - Operations
  - Strategy
  - Customers
  summary: 'Walmart grew from one store in Arkansas to the world''s largest retailer by keeping prices low every day. The secret was not just bargaining hard: it built one of the most efficient systems ever for moving goods from suppliers to shelves, using distribution centers, cross-docking, satellites and shared sales data.'
  moral: The customer sees a low price; behind it stands a thousand small savings.
  story: 'Sam Walton opened the first Walmart store in Rogers, Arkansas, on July 2, 1962. His idea was simple: sell for less than anyone else, and make up for thin profits on each item by selling many more items. Many of his early stores were in small towns.


    Low prices are easy to promise and hard to keep. If a store pays too much to get goods onto its shelves, it cannot cut prices for long. So Walmart treated logistics, the business of moving and storing goods, as a weapon. Around 1970 to 1971 it opened its first distribution center in Bentonville, Arkansas. A distribution center is a giant building where trucks from suppliers unload and other trucks carry goods out to stores. Walmart built new stores within driving distance of these centers, like spokes around the hub of a wheel, so its own trucks could restock them quickly.


    Walmart became famous for a method called cross-docking. In a normal warehouse, goods arrive, sit on shelves for weeks, and then get shipped out. In cross-docking, goods from a supplier''s truck move across the building and onto a truck headed to a store, often within hours, without being stored at all. That saves rent, labor and the cost of money tied up in inventory. A widely cited figure says Walmart moved about 85 percent of its merchandise this way.


    Technology made the system faster. Walmart began scanning bar codes at its registers in 1983, so it knew exactly what sold. In 1987 it finished the largest private satellite network in the United States, at a cost of about $24 million, linking every store to headquarters for voice, data and video. Around 1991 to 1992 it created Retail Link, a system that let suppliers see how their products were selling in each store, so they could plan production and restock shelves before they went empty.


    All of this supported a pricing idea often called "everyday low prices." Many stores use a high-low approach: regular prices are higher, and then big sales pull shoppers in. Walmart aimed instead for steady low prices on most items, every day, so customers did not have to wait for a sale. From 1988 to 2007 its slogan was "Always Low Prices. Always." Steady prices also made demand easier to predict, which helped the supply chain run smoothly.


    The results were striking. Walmart reached $1 billion in yearly sales in 1980 and its first $100 billion year in 1997. By 2009, it sold through its entire inventory about 8.5 times a year, compared with about 6.4 times for Target and fewer than 2 times for the average U.S. retailer.


    Walmart''s rise also brought real criticism, which is part of a fair story. Critics have argued that its low prices hurt small-town shops, that it pushed suppliers hard, and that it paid workers too little; employees have held strikes over wages, and Walmart has since raised its starting pay. Families can admire the cleverness of the system while still asking who pays for low prices.'
  timeline:
  - - July 2, 1962
    - Sam Walton opens the first Walmart in Rogers, Arkansas.
  - - 1970–1971
    - Walmart goes public and opens its first distribution center in Bentonville.
  - - '1980'
    - Annual sales reach $1 billion across 276 stores.
  - - '1983'
    - Stores begin scanning bar codes at checkout.
  - - '1987'
    - Walmart completes the largest private satellite network in the U.S.
  - - 1991–1992
    - Retail Link begins sharing sales data with suppliers.
  - - '1997'
    - Walmart has its first $100 billion sales year.
  numbers:
  - - Satellite network cost (1987)
    - about $24 million
  - - Merchandise moved by cross-docking (widely cited)
    - about 85 percent
  - - Inventory turnover per year (2009)
    - about 8.5 times (Target about 6.4)
  - - Annual sales (1997)
    - over $100 billion
  lessons:
  - 'Low prices are built, not wished for: efficient operations make steady low prices possible.'
  - 'Move, don''t store: goods sitting in a warehouse cost money every day.'
  - 'Share information: when suppliers see real sales, everyone wastes less.'
  - 'Count all the costs: a fair business asks who carries the burden of low prices.'
  questions:
  - Where in your home or family business does stuff sit around unused? What does that cost?
  - Would you rather shop at a store with steady low prices or one with big sales? Why?
  - Who benefits and who might lose when a giant store comes to a small town?
  note: 'Sources differ slightly on dates: Walmart''s own history puts the first distribution center in 1971, while other sources say 1970; Retail Link is dated 1991 by some and 1992 by others. The 85 percent cross-docking figure is widely repeated from the 1990s and may not describe Walmart''s system today.'
  sources:
  - name: Walmart, 'Our History'
    url: https://corporate.walmart.com/about/history
  - name: 'CIO, ''45 Years of Wal-Mart History: A Technology Time Line'''
    url: https://www.cio.com/article/274537/infrastructure-45-years-of-wal-mart-history-a-technology-time-line.html
  - name: The Geography of Transport Systems, 'Cross-Docking Distribution Center'
    url: https://transportgeography.org/contents/chapter7/logistics-freight-distribution/cross-docking-distribution-center/
  - name: 'Gallaugher, ''Data Asset in Action: Technology and the Rise of Wal-Mart'' (open textbook)'
    url: https://saylordotorg.github.io/text_information-systems-a-managers-guide-to-harnessing-technology-v2.0/s15-07-data-asset-in-action-technolog.html
  - name: Wikipedia, 'Walmart'
    url: https://en.wikipedia.org/wiki/Walmart
- slug: in-n-out-slow-growth
  title: 'In-N-Out Burger: Growing Slowly on Purpose'
  company: In-N-Out Burger
  year: 1948–present
  industry: Restaurants
  tags:
  - Strategy
  - Operations
  - Culture & people
  summary: In-N-Out Burger has kept a tiny menu, never franchised and never sold stock to the public, growing only as far as its fresh-food supply lines can reach. While other chains raced across the country, this family-owned company chose control and consistency over speed.
  moral: Grow only as fast as you can stay good.
  story: 'On October 22, 1948, Harry and Esther Snyder opened a tiny hamburger stand in Baldwin Park, California. It was California''s first drive-thru burger stand: customers ordered through a two-way speaker box without leaving their cars. The menu was short, the food was cooked to order, and the second location did not open until 1951.


    While other burger chains grew huge by franchising, In-N-Out did something unusual. Franchising means letting other business owners pay to open restaurants under your name and follow your rules. It is a fast way to grow because other people put up the money. In-N-Out never did it. Every restaurant is owned and run by the company. It also never sold shares on the stock market, so no outside investors can push it to grow faster.


    The menu shows the same discipline. For decades the main items have been a hamburger, a cheeseburger, the Double-Double, French fries, sodas and three flavors of milkshake. When the company added hot chocolate in 2018, it was the first new menu item in about 15 years. Fans know about a "not-so-secret" menu, with orders such as "Protein Style" and "Animal Style," but these are mostly new ways of combining the same ingredients. A short menu means fewer ingredients to buy, fewer things to go wrong, and faster service. The company also guards its name closely; for example, in 2007 it sued a Utah restaurant it said had copied its look and menu.


    Most importantly, In-N-Out only grows as far as its supply chain can reach. It uses fresh beef that is never frozen, and it makes its own patties at company facilities. That is why, as of 2017, all of its then 319 restaurants sat within about 500 miles of its distribution centers. When the company wants to enter a new region, it first builds the supply line, then the restaurants. It took until 1992 to open outside Southern California, in Las Vegas. Texas came in 2011, with a patty-making plant built there around the same time. Colorado followed in 2020, and in 2023 the company announced an eastern hub near Nashville, Tennessee, with its first restaurants there starting in late 2025.


    The family has faced hard times. Harry Snyder died in 1976, and his son Rich, just 24, took over. Rich died in a plane crash in 1993, and his brother Guy died in 1999. Esther led the company again until her death in 2006. In 2010 the founders'' granddaughter, Lynsi Snyder, became president. In a 2015 CBS interview, asked about going public or franchising, she answered, "I wouldn''t do it," explaining she wanted to keep the company the way her family would have wanted.


    Slow growth has costs. Millions of Americans live nowhere near an In-N-Out, and the company has surely left money on the table. But it has more than 400 restaurants in about ten states, a loyal following, and a reputation for consistent food. Its story shows that bigger and faster is not the only way to win. Sometimes the best strategy is to know what you are great at and refuse to stretch it thin.'
  timeline:
  - - Oct 22, 1948
    - Harry and Esther Snyder open the first In-N-Out in Baldwin Park, California.
  - - '1976'
    - Harry dies; son Rich Snyder becomes president at 24.
  - - '1992'
    - First restaurant outside Southern California opens in Las Vegas.
  - - '2010'
    - Granddaughter Lynsi Snyder becomes president.
  - - '2011'
    - In-N-Out enters Texas after building a patty plant there.
  - - '2018'
    - Hot chocolate becomes the first new menu item in about 15 years.
  - - 2023–2025
    - Company announces a Tennessee hub; first Nashville-area restaurants open in late 2025.
  numbers:
  - - Restaurants (2017)
    - 319, all within about 500 miles of a distribution center
  - - Restaurants (2026)
    - more than 400 in about 10 states
  - - Franchised restaurants
    - zero
  - - Years between 1st and 2nd location
    - about 3 (1948 to 1951)
  lessons:
  - 'Grow at the speed of quality: expansion that breaks your standards is not success.'
  - 'Keep it simple: a short menu makes it easier to do every item well.'
  - 'Build the supply line first: fresh food depends on how far your trucks can go.'
  - 'Ownership is control: staying private let the family set its own pace.'
  questions:
  - What are the pros and cons of franchising for a business owner?
  - If your family business doubled in size next year, what would be hardest to keep the same?
  - Why might a short menu attract more customers, not fewer?
  note: Store counts change often; figures here are from 2017 (Nation's Restaurant News) and mid-2026 (Newsweek). The company says it has no plans to franchise or go public, but these are statements of intent, not legal promises.
  sources:
  - name: Wikipedia, 'In-N-Out Burger'
    url: https://en.wikipedia.org/wiki/In-N-Out_Burger
  - name: 'Nation''s Restaurant News, ''The Power List 2017: Lynsi Snyder'''
    url: https://www.nrn.com/quick-service/the-power-list-2017-lynsi-snyder
  - name: Newsweek, 'Map shows In-N-Out to open new restaurants in 5 states' (2026)
    url: https://www.newsweek.com/map-shows-in-n-out-open-new-restaurants-5-states-12151937
- slug: dell-direct-model
  title: 'Dell: Cutting Out the Middleman'
  company: Dell
  year: 1984–2013
  industry: Computers
  tags:
  - Strategy
  - Operations
  - Customers
  summary: Michael Dell started selling computers from his college dorm with $1,000, building each machine only after a customer ordered it. Selling directly, first by phone and then online, made Dell the world's top PC seller by 2001, but rivals copied the model and Dell later had to change course.
  moral: A great idea is a head start, not a finish line.
  story: 'In 1984 Michael Dell was a freshman at the University of Texas at Austin. He had been upgrading IBM-compatible personal computers and selling them to people he knew. With $1,000, he started a company called PC''s Limited. Business grew so fast that he left college after his first year to run it full time. One early model, the Turbo PC, sold for $795, and within months the young company was selling tens of thousands of dollars'' worth of computers a month.


    At the time, most people bought computers in stores. A computer maker built machines, shipped them to a store, and the store marked up the price. Computers could sit on store shelves for weeks, and because technology changed quickly, an unsold computer lost value every day. Dell''s idea was to skip the store. Customers ordered directly from Dell, first by phone and mail, and Dell built each computer to the customer''s choices and shipped it straight to them.


    This direct model had several advantages. Dell did not have to share profit with a store. Because it built computers only after they were ordered, it kept very little inventory, the stock of parts and products a company holds, and so it was less likely to get stuck with outdated parts. And because Dell talked directly to its customers, it learned quickly what they wanted.


    The company grew fast. It changed its name to Dell Computer Corporation and sold shares to the public in 1988, raising $30 million. In 1992 it joined the Fortune 500, and Michael Dell, then 27, was the youngest chief executive on the list. When the internet arrived, it fit the direct model perfectly. Dell started taking orders online in 1996, and that year its website was soon selling more than $1 million worth of computers a day. Dell passed IBM in PC sales in 1999 and Compaq in 2001 to become the world''s top PC seller.


    But a strong idea can be copied. Rivals adopted their own low-cost, build-to-order methods while still selling through stores, and some moved into services and software while Dell stayed focused on PCs and servers. Dell began losing sales to a revitalized Hewlett-Packard. Michael Dell stepped down as CEO in 2004 and came back in 2007. That same year, in a big break from its history, Dell announced it would sell two desktop models in about 3,000 Walmart stores.


    In 2013, Michael Dell and an investment firm, Silver Lake, bought the company from public shareholders for about $24 billion, taking it private. He said the company''s turnaround needed "more time, investment and patience" than public investors would give it. Dell later bought the data-storage company EMC for $67 billion in 2016 and returned to the stock market in 2018.


    Dell''s story has two lessons. First, a simple change in how you reach customers can beat much bigger rivals. Second, no advantage lasts forever. When others copy your best idea and customers change how they shop, you must be willing to change too, even if it means doing something you once said you never would.'
  timeline:
  - - '1984'
    - Michael Dell founds PC's Limited with $1,000 as a University of Texas freshman.
  - - '1988'
    - Company becomes Dell Computer Corporation and goes public, raising $30 million.
  - - '1992'
    - Dell joins the Fortune 500; Michael Dell, 27, is its youngest CEO.
  - - '1996'
    - Dell begins selling online; web sales soon top $1 million a day.
  - - '2001'
    - Dell becomes the world's top PC seller.
  - - '2007'
    - Michael Dell returns as CEO; Dell announces sales through Walmart stores.
  - - '2013'
    - Michael Dell and Silver Lake take the company private.
  - - '2018'
    - Dell Technologies returns to the stock market.
  numbers:
  - - Starting money (1984)
    - $1,000
  - - Raised in stock offering (1988)
    - $30 million
  - - Online sales (1996)
    - more than $1 million a day
  - - Walmart stores carrying Dell desktops (2007)
    - about 3,000
  - - Going-private deal (2013)
    - about $24 billion
  lessons:
  - 'Rethink the path to the customer: how you sell can matter as much as what you sell.'
  - 'Build to order: making things after they are sold cuts waste and risk.'
  - 'Advantages fade: competitors copy good ideas, so keep improving.'
  - 'Be willing to change: when customers change how they shop, follow them.'
  questions:
  - What products do you buy directly from the maker? Why might that be cheaper?
  - Why would a computer sitting in a store lose value every week?
  - Was Dell's move into Walmart a smart change or a sign of trouble? Explain.
