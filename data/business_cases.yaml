cases:
- slug: tylenol-1982
  title: Johnson & Johnson and the Tylenol Recall
  company: Johnson & Johnson
  year: '1982'
  industry: Health products
  tags:
  - Crisis
  - Ethics & trust
  - Leadership
  summary: In the fall of 1982, seven people in the Chicago area died after taking Extra-Strength Tylenol capsules that someone had laced with cyanide. Johnson & Johnson pulled about 31 million bottles
    off shelves nationwide, at a cost of about $100 million, and brought Tylenol back in safer packaging. It is still the classic example of a company putting customer safety ahead of short-term profit
    and winning back trust.
  moral: In a crisis you did not cause, own the remedy completely; precommitted stakeholder priorities let leaders accept a large, certain cost to cap an unbounded reputational risk.
  story: 'In 1982, Tylenol was one of the most trusted products in America. It was the best-selling pain reliever in the country, with roughly 35 percent of a market worth about $1.2 billion a year. It
    was made by McNeil Consumer Products, a part of Johnson & Johnson, often called J&J.


    Then, starting on September 29, 1982, people in the Chicago area began dying suddenly. The first was a 12-year-old girl named Mary Kellerman. Within three days, seven people were dead, including three
    members of one family. Investigators found that all of them had taken Extra-Strength Tylenol capsules that had been filled with cyanide, a deadly poison. Someone had tampered with bottles sold in Chicago-area
    stores. J&J had not put the poison there, but its name was on every bottle.


    J&J''s chief executive, James Burke, had to decide what to do fast, with very little information. The poisonings seemed to be limited to the Chicago area. Some advisers worried that a giant recall would
    make the problem look bigger and might destroy the brand forever. J&J first had its sales force pull about 264,000 bottles from Chicago-area stores. Then, on October 5, 1982, it went much further and
    recalled Tylenol capsules across the whole country: about 31 million bottles, worth roughly $100 million at the time. It told people to stop using the capsules and offered to exchange them for a safe
    product. Burke also worked openly with the FBI, the Food and Drug Administration, and the news media instead of hiding.


    Burke later said the company''s Credo helped him decide. The Credo is a one-page statement of values written in 1943 by Robert Wood Johnson, the company''s longtime leader. It lists the people J&J is
    responsible to, starting with the doctors, nurses, patients, and families who use its products, then employees, then communities, and only last the stockholders. Burke said the Credo gave him "the ammunition
    I needed" to persuade shareholders and others to spend the money on the recall. In other words, the hard choice had been made years earlier, when the company wrote down what it cared about most.


    The damage was real. Tylenol''s share of the pain-reliever market crashed to about 7 percent. Many people, even inside the company, thought the brand was finished. But J&J used the pause to make the
    product safer. On November 11, 1982, it showed off new tamper-resistant packaging with three layers of protection: glued box flaps, a plastic seal around the cap, and a foil seal over the mouth of the
    bottle. Tylenol came back to stores within weeks. By about a year later, its share had climbed back to around 30 percent.


    The crisis changed the whole industry. Sealed caps and foil liners became normal on medicines and many foods. In 1983, Congress passed a law that made tampering with consumer products a federal crime.
    Sadly, the person who poisoned the capsules has never been caught. A man named James Lewis was convicted of sending J&J a letter demanding $1 million to "stop the killing," but he was never charged
    with the murders.

    '
  timeline:
  - - Sept 29, 1982
    - The first victims die in the Chicago area after taking poisoned Extra-Strength Tylenol capsules.
  - - Oct 1, 1982
    - The seventh and last victim is found; the deaths are linked to Tylenol.
  - - Early Oct 1982
    - J&J's sales force pulls about 264,000 bottles from Chicago-area stores and warns the public.
  - - Oct 5, 1982
    - J&J recalls Tylenol capsules nationwide, about 31 million bottles.
  - - Nov 11, 1982
    - J&J unveils new triple-sealed, tamper-resistant packaging.
  - - '1983'
    - Congress makes tampering with consumer products a federal crime; Tylenol's market share climbs back toward 30 percent.
  numbers:
  - - People killed (1982)
    - '7'
  - - Bottles recalled nationwide (1982)
    - about 31 million
  - - Value of recalled product (1982)
    - about $100 million
  - - Tylenol market share
    - about 35% before, about 7% after the deaths, about 30% roughly a year later
  lessons:
  - 'Asymmetric loss under uncertainty: With deaths apparently confined to Chicago, a local pull of about 264,000 bottles looked proportionate. Burke went nationwide on October 5 and recalled about 31 million
    bottles. The downside of under-reacting (more deaths, a dead brand) was open-ended, while the recall cost was capped at about $100 million. When one error is bounded and the other is not, size the response
    to the unbounded one.'
  - 'Precommitted values as a decision rule: The 1943 Credo ranked patients and customers first and stockholders last, and Burke said it gave him "the ammunition I needed" to spend the money. This reflects
    stakeholder theory in practice: priorities set before a crisis speed decisions and give a CEO cover with investors. A values statement only works this way if the company has honored it when it was costly.'
  - 'Crisis communication beyond attributed blame: In Coombs''s situational crisis communication theory, product tampering is a victim crisis, where the public assigns the company little responsibility.
    J&J still acted as if it owned the problem: it told consumers to stop using the capsules, offered exchanges and worked openly with the FBI, FDA and media. Responding above the level of blame you are
    assigned is often what protects reputation.'
  - 'Fix the product, then set the standard: J&J showed triple-sealed packaging on November 11, about six weeks after the first deaths. Share fell from about 35 percent to about 7 percent, then recovered
    to about 30 percent within roughly a year. Its packaging became the industry norm and a 1983 law made tampering a federal crime. A recovery plan should change the product, not only the message.'
  - 'Brand equity as an economic asset: Tylenol held roughly 35 percent of a $1.2 billion market, or about $420 million a year in sales. The recall cost about a quarter of one year''s revenue. Measured
    against the multi-year value of a trusted brand, the write-off was an investment, not a loss. Finance teams should price reputational assets explicitly before a crisis forces the comparison.'
  questions:
  - It is October 2, 1982. The deaths appear confined to Chicago and the sales force is pulling local stock. As Burke, what information would justify a nationwide recall, and what would you risk by waiting
    a week for it?
  - Using the case's figures (about $100 million recall cost, a $1.2 billion market, share falling from 35 to 7 percent and recovering to about 30), build a rough payback analysis for the nationwide recall.
    What assumptions drive the result?
  - Burke credited the Credo for his decision. Do written values statements actually constrain executives, or mainly justify choices already made? What would make one credible at a company you know?
  - Under what conditions would an aggressive nationwide recall be the wrong response, for example a contained manufacturing defect, a low-margin commodity product or a firm with thin cash reserves?
  note: Sources differ slightly on Tylenol's pre-crisis market share (about 35% in Wharton's account, 37% in others). The Credo was written in 1943 by Robert Wood Johnson, according to J&J; it was not written
    at the company's founding. The murders remain officially unsolved. James Lewis served prison time for the extortion letter only and always denied any role in the poisonings. Exactly how calm and fast
    J&J's early decisions were has been polished over decades of retelling, but the recall, its size and its cost are well documented.
  sources:
  - name: Knowledge at Wharton, 'Tylenol and the Legacy of J&J's James Burke' (2012)
    url: https://knowledge.wharton.upenn.edu/article/tylenol-and-the-legacy-of-jjs-james-burke/
  - name: Johnson & Johnson, '8 Fun Facts About Our Credo'
    url: https://www.jnj.com/our-heritage/8-fun-facts-about-the-johnson-johnson-credo
  - name: 'Retail Brew, ''Total recall: How the Tylenol murders of 1982 ushered in tamper-resistant packaging'' (2022)'
    url: https://retailbrew.com/stories/2022/10/13/total-recall-how-the-tylenol-murders-of-1982-ushered-in-tamper-resistant-packaging
  - name: NPR, 'FBI Searches Home in Review of '82 Tylenol Deaths' (2009)
    url: https://www.npr.org/2009/02/04/100268518/fbi-searches-home-in-review-of-82-tylenol-deaths
  - name: Interesting Engineering, 'Tamper-resistant packaging began in 1982 with 7 still-unsolved murders'
    url: https://interestingengineering.com/innovation/tamper-resistant-packaging-began-in-1982-with-7-still-unsolved-murders
- slug: new-coke-1985
  title: Coca-Cola and New Coke
  company: The Coca-Cola Company
  year: '1985'
  industry: Food & beverages
  tags:
  - Customers
  - Marketing
  - Strategy
  summary: In April 1985, Coca-Cola replaced its 99-year-old recipe with a sweeter "New Coke" after nearly 200,000 taste tests said people liked it better. Loyal fans were furious, and just 79 days later
    the company brought back the original as "Coca-Cola Classic." The story shows that customers buy feelings and memories, not just flavors, and that admitting a mistake quickly can save a brand.
  moral: Market research answers only the question it asks; before altering a core product, test what drives loyalty and brand equity, not just what is easiest to measure.
  story: 'For most of the 1900s, Coca-Cola was the best-selling soft drink in the world. But by the early 1980s, its lead over Pepsi had been slipping for about 15 years in a row. Pepsi ran a famous advertising
    campaign called the Pepsi Challenge, where people took a sip of two unlabeled colas and picked the one they liked. Many picked Pepsi, which is sweeter. Coca-Cola''s own private tests found the same
    thing. Its leaders, including chairman Roberto Goizueta and president Donald Keough, decided the problem might be the taste itself.


    So the company''s scientists worked on a new, sweeter formula. Coca-Cola tested it on nearly 200,000 people. In blind tests, where people did not know which brand they were drinking, the new recipe
    beat both Pepsi and the old Coke. On paper, the decision looked safe. On April 23, 1985, the company announced the first change to its recipe in 99 years. Goizueta called it "the surest move ever made."
    Pepsi gave its employees a day off to celebrate and ran ads saying the other guy had "blinked."


    What the taste tests had not measured was how people felt about Coke. To millions of Americans, Coca-Cola was part of childhood, holidays, baseball games and family memories. Changing it felt like someone
    had changed a piece of their history without asking. Angry phone calls poured in. Coca-Cola''s own records say its hotline went from about 400 calls a day to about 1,500 a day by June; other accounts
    put the number of angry calls much higher. The company received tens of thousands of letters. One was addressed to "Chief Dodo, The Coca-Cola Company." People stocked up on old Coke, some buying hundreds
    of bottles, and a protest group called Old Cola Drinkers of America formed. The consumer-service team grew from about a dozen people to 180 almost overnight to keep up.


    Coca-Cola''s leaders had a choice. They could insist they were right, because the data said so, or they could listen. They listened. On July 11, 1985, just 79 days after New Coke launched, the company
    held a press conference to apologize and announce that the original formula was coming back as "Coca-Cola Classic." Keough told reporters that the company''s boss was the consumer. News programs interrupted
    regular shows to report it, and in the two days after the announcement the hotline took more than 31,600 calls.


    Coca-Cola Classic quickly outsold New Coke and, within months, was again the top-selling sugar cola, ahead of Pepsi. New Coke stayed on shelves for years, was renamed Coke II in 1990, and was finally
    discontinued in 2002.


    Some people later suggested the whole thing was a clever plan to make people fall in love with Coke again, but there is no evidence for that. Ten years later, Goizueta described it as a case of "taking
    intelligent risks." Whatever the intent, the result was a powerful lesson: Coca-Cola had studied what customers tasted, but it had not studied what they valued. And when it found out, it had the humility
    to change course fast.

    '
  timeline:
  - - Early 1980s
    - Coca-Cola's lead over Pepsi has been slipping for about 15 years; the Pepsi Challenge favors Pepsi's sweeter taste.
  - - 1984–1985
    - Coca-Cola tests a new, sweeter formula with nearly 200,000 consumers.
  - - Apr 23, 1985
    - Coca-Cola announces New Coke, the first recipe change in 99 years.
  - - May–June 1985
    - Angry calls and letters pour in; the consumer-service team grows from about 12 to 180 people.
  - - July 11, 1985
    - The company apologizes and brings back the original formula as Coca-Cola Classic.
  - - '1990'
    - New Coke is renamed Coke II.
  - - '2002'
    - Coke II is discontinued.
  numbers:
  - - Consumers in taste tests (1984–85)
    - nearly 200,000
  - - Age of the original recipe (1985)
    - 99 years
  - - Days New Coke was the only Coke (1985)
    - '79'
  - - Hotline calls in two days after Classic's return (July 1985)
    - more than 31,600
  lessons:
  - 'Measurement validity: Nearly 200,000 blind taste tests showed the sweeter formula beat both Pepsi and the original. But blind sip tests remove the brand, the very asset at stake, and measure a single
    sip rather than repeated, branded consumption. The data were accurate and still answered the wrong question. Research conditions should match the real purchase and use situation before they guide an
    irreversible decision.'
  - 'Brand equity lives in customers'' minds: In Keller''s customer-based brand equity model, value comes from the associations customers hold, not only from product attributes. For many Americans, a 99-year-old
    formula was tied to memory and identity, so replacing it felt like breaking an implied contract. Before changing a flagship, map the emotional and symbolic associations, and test how customers react
    to losing the old version, not just to tasting the new one.'
  - 'Competing on the rival''s terms: Coca-Cola''s lead had slipped for about 15 years, and the Pepsi Challenge framed the contest around sweetness. Reformulating accepted Pepsi''s chosen dimension and
    gave up Coke''s distinct position, which Pepsi celebrated by saying Coke had "blinked." When share erodes, diagnose whether the problem is the product or the positioning before rebuilding the product
    around a competitor''s strength.'
  - 'Avoiding escalation of commitment: Goizueta had called the change "the surest move ever made," the kind of public stake that, in Staw''s research, makes leaders more likely to keep investing in a failing
    course. Yet as hotline calls rose from about 400 to about 1,500 a day, the company reversed in 79 days. Setting reversal triggers in advance makes a fast, face-saving retreat more likely.'
  - 'Preserve reversibility: Coca-Cola replaced the original rather than launching the new formula alongside it, which turned a product test into an all-or-nothing bet. The eventual outcome, Classic plus
    New Coke (renamed Coke II in 1990 and dropped in 2002), was effectively the line extension it could have started with. For changes to a flagship, staged rollouts or parallel offerings keep options open
    at modest cost.'
  questions:
  - It is late 1984. You hold blind-test data from nearly 200,000 consumers favoring the new formula. What additional research would you demand before replacing the original, and how much delay would you
    accept while Pepsi keeps gaining?
  - Should Coca-Cola have launched the new formula as a line extension instead of a replacement? Weigh shelf space, bottler economics and brand confusion against the clarity of a single product.
  - Hotline volume rose from about 400 to about 1,500 calls a day by June. How would you tell a vocal minority from a real signal about the core customer base, and what other data would you check before
    reversing?
  - Where else might feature or sensory testing mislead because it strips out brand, ritual or identity, for example a software redesign, a reformulated food or a corporate rebrand?
  note: 'Call-volume figures differ by source: Coca-Cola''s archives cite about 1,500 hotline calls a day by June 1985, while History.com reports 5,000 to 8,000 a day; the story uses the company''s own
    lower figure. The theory that New Coke was a deliberate marketing trick is popular, but there is no evidence for it. The often-quoted Keough line "we''re not that dumb, and we''re not that smart" could
    not be verified in the sources used here and is left out.'
  sources:
  - name: 'The Coca-Cola Company, ''New Coke: The Most Memorable Marketing Blunder Ever?'''
    url: https://www.coca-colacompany.com/about-us/history/new-coke-the-most-memorable-marketing-blunder-ever
  - name: The Coca-Cola Company, 'Veteran Employees Remember Infamous 1985 Launch of New Coke' (2015)
    url: https://www.coca-colacompany.com/about-us/history/the-infamous-1985-launch-of-new-coke
  - name: History.com, 'Why Coca-Cola's "New Coke" Flopped'
    url: https://www.history.com/articles/why-coca-cola-new-coke-flopped
  - name: History.com, 'New Coke debuts in one of the biggest product flops in history'
    url: https://www.history.com/this-day-in-history/new-coke-debuts-one-of-the-biggest-product-flops-in-history
- slug: netflix-blockbuster
  title: Netflix, Blockbuster and the Offer That Was Turned Down
  company: Netflix and Blockbuster
  year: 2000–2010
  industry: Entertainment & retail
  tags:
  - Strategy
  - Innovation
  - Customers
  summary: In 2000, the founders of a small, money-losing DVD-by-mail company called Netflix offered to sell it to Blockbuster, the giant of video rental, for $50 million. Blockbuster said no. Ten years
    later, Blockbuster filed for bankruptcy while Netflix had about 20 million subscribers, a reminder that today's leader can miss the change that matters most.
  moral: Incumbents rarely fail from not seeing disruption; they fail when debt, profits built on customer pain and leadership turnover keep them from funding the response long enough.
  story: 'In the 1990s, renting a movie usually meant driving to a Blockbuster store. At its peak, Blockbuster had about 9,000 locations and around $6 billion a year in revenue. It also made a lot of money
    from late fees, the charges you paid for bringing a movie back late. In 2000 alone, those fees brought in about $800 million.


    Netflix started much smaller. It launched in 1998, renting DVDs by mail from a website. Co-founder Reed Hastings has said one spark for the idea was a $40 late fee he got from Blockbuster, though co-founder
    Marc Randolph later wrote that the real origin was less tidy. Netflix soon switched to a monthly subscription: you paid one price, kept movies as long as you liked, and never paid a late fee.


    In 2000, Netflix was losing money, and the dot-com bubble was bursting. Hastings and co-founder Marc Randolph met with Blockbuster''s leaders, including CEO John Antioco. Their pitch: Blockbuster could
    buy Netflix for $50 million, and Netflix would run Blockbuster''s online business. Blockbuster turned them down. Netflix''s former finance chief, Barry McCarthy, later said Blockbuster "laughed us out
    of their office." From Blockbuster''s point of view at the time, this was understandable. Netflix was tiny and unprofitable, and most customers still went to stores. Few people in 2000 could picture
    renting movies without ever leaving home, and Blockbuster''s leaders had a huge, successful business to run.


    Netflix kept growing anyway. It passed 1 million subscribers within about three years of that meeting and reached 6 million by the end of 2006. Blockbuster did eventually respond, and it fought harder
    than many people remember. In 2004 it launched Blockbuster Online, which gained more than a million subscribers in under a year. In 2006 it added "Total Access," which let online customers return DVDs
    at stores and get a free movie. It worked so well that in one 2007 quarter Netflix actually lost 55,000 subscribers. But each in-store swap cost Blockbuster about $2, and the company was carrying about
    $1 billion of debt from when it separated from its former owner, Viacom, in 2004.


    Then the leadership changed. In 2007, after a dispute with investor Carl Icahn over his pay, Antioco left. The new CEO, James Keyes, pulled back from the costly online push and focused on the stores
    again. Meanwhile, Netflix began streaming movies over the internet in 2007, a change that would make both DVDs and video stores far less important.


    On September 23, 2010, Blockbuster filed for bankruptcy protection. It had about 3,000 U.S. stores left and listed about $1.46 billion in debts. That same year, Netflix reached about 20 million subscribers
    and began expanding to other countries. Years later, only one Blockbuster store remained, in Bend, Oregon.


    It is tempting to say that Netflix simply "killed" Blockbuster, but the true story is more interesting. Blockbuster saw the threat, built a strong answer, and for a while was winning. What sank it was
    a mix of heavy debt, a business that depended on fees customers hated, and a change of leaders who stepped back from the future just as it was arriving.

    '
  timeline:
  - - '1998'
    - Netflix launches as a DVD-rental website.
  - - '2000'
    - Hastings and Randolph offer to sell Netflix to Blockbuster for $50 million; Blockbuster declines.
  - - '2004'
    - Blockbuster launches Blockbuster Online after its spin-off from Viacom leaves it with about $1 billion in debt.
  - - '2006'
    - Blockbuster's 'Total Access' lets online customers return DVDs to stores; Netflix reaches 6 million subscribers.
  - - '2007'
    - Antioco leaves Blockbuster after a pay dispute with investor Carl Icahn; Netflix starts streaming.
  - - Sept 23, 2010
    - Blockbuster files for bankruptcy protection.
  numbers:
  - - Price Netflix asked from Blockbuster (2000)
    - $50 million
  - - Blockbuster late-fee revenue (2000)
    - about $800 million
  - - Blockbuster debts in bankruptcy filing (2010)
    - about $1.46 billion
  - - Netflix subscribers (2010)
    - about 20 million
  lessons:
  - 'Disruption starts small and rational to ignore: In 2000 Netflix was tiny, unprofitable and served customers willing to wait for mail, the profile Christensen''s disruptive innovation theory predicts
    an incumbent will dismiss. The $50 million price was under 1 percent of Blockbuster''s peak annual revenue of about $6 billion. Judge entrants by their trajectory, and treat small acquisitions or partnerships
    as inexpensive options on a future you cannot yet size.'
  - 'Profits built on customer pain are an attack surface: Late fees brought Blockbuster about $800 million in 2000, and Netflix''s founding pitch was the absence of them. An incumbent cannot easily match
    a rival that removes a hated fee without cutting its own profit pool. Managers should audit which revenue customers resent, because that is where an entrant will aim.'
  - 'Leverage shortens the strategic runway: Blockbuster''s online response worked. Blockbuster Online passed a million subscribers in under a year, and Total Access made Netflix lose 55,000 subscribers
    in one 2007 quarter. But each in-store swap cost about $2, and the firm carried about $1 billion of debt from its 2004 separation from Viacom. Capital structure is strategy: a leveraged incumbent can
    rarely sustain a loss-making defense for long.'
  - 'Strategy depends on leadership continuity: After a pay dispute with investor Carl Icahn, Antioco left in 2007, and his successor pulled back from online to focus on stores, the same year Netflix began
    streaming. Boards should treat a transformation strategy as an asset and ask, before a CEO change, whether the successor will fund it or quietly reverse it.'
  - 'Ambidexterity and self-cannibalization: Blockbuster ran stores and online under one balance sheet, so the new business competed with the old for cash. Netflix began streaming in 2007 while its DVD
    business was still growing, cannibalizing itself before others could. O''Reilly and Tushman''s organizational ambidexterity argues for protecting exploratory units from the core''s short-term needs
    while leaders integrate them at the top.'
  questions:
  - It is 2000 and you are John Antioco. Netflix is losing money and the dot-com bubble is bursting. Make the strongest case for and against paying $50 million, treating the deal as an option rather than
    an acquisition.
  - Total Access cost Blockbuster about $2 per in-store swap while it carried about $1 billion of debt. What information would you need to estimate how long it could afford that strategy, and what would
    you have cut to fund it?
  - In 2007 the new CEO refocused on stores. What evidence was available then that should have changed that choice, and what should a board require before a new CEO reverses a predecessor's strategy?
  - Name a current business that earns a large share of its profit from fees customers dislike. How exposed is it to an entrant that removes the fee, and what should it do now?
  note: The $50 million offer and the 2000 meeting are reported by Netflix insiders; Blockbuster's side has been told differently in some accounts, and nobody disputes that Blockbuster declined. Popular
    retellings often say Blockbuster ignored the internet, but it built a real online service that briefly hurt Netflix. Exact store and revenue peaks vary by source.
  sources:
  - name: CNBC, 'How Netflix almost lost the movie rental wars to Blockbuster' (2020)
    url: https://www.cnbc.com/2020/09/22/how-netflix-almost-lost-the-movie-rental-wars-to-blockbuster.html
  - name: Christian Science Monitor / AP, 'Bankruptcy protection filed by Blockbuster' (2010)
    url: https://csmonitor.com/Business/Latest-News-Wires/2010/0923/Bankruptcy-protection-filed-by-Blockbuster
  - name: Quartz, 'Netflix launched streaming video 10 years ago' (2017)
    url: https://qz.com/887010/netflix-nflx-launched-streaming-video-10-years-ago-and-changed-the-way-we-watch-everything
- slug: kodak-digital-camera
  title: Kodak and the Digital Camera It Invented
  company: Eastman Kodak
  year: 1975–2012
  industry: Photography
  tags:
  - Innovation
  - Strategy
  summary: In 1975, a young Kodak engineer named Steven Sasson built the first known self-contained digital camera. Kodak patented it but did not turn it into a product, because film was its money-maker.
    In January 2012, with digital photography everywhere, Kodak filed for bankruptcy, a famous lesson about protecting an old business instead of embracing the new one.
  moral: Owning the invention is not enough; when a new technology threatens the core profit model, incumbents must fund it on its trajectory, not its first crude version.
  story: 'For most of the 20th century, Kodak was photography. George Eastman founded the company in 1888 with a simple promise: you press the button, we do the rest. Kodak sold cameras cheaply and made
    most of its money on what came after: film, chemicals, paper and printing. Every family vacation and birthday party meant more rolls of Kodak film.


    In 1974, Kodak gave a 24-year-old electrical engineer named Steven Sasson a small project: see whether a new kind of electronic light sensor could capture a picture. Sasson built a camera out of spare
    parts. It was about the size of a toaster, weighed about 8 pounds, and ran on 16 AA batteries. Its sensor was just 100 by 100 pixels, or 0.01 megapixels, and it took black-and-white pictures. Capturing
    an image took a split second, but recording it onto a cassette tape took 23 seconds. To see the photo, you played the tape into a special device connected to a TV.


    In December 1975, Sasson took his first picture, of a lab technician down the hall. In 1976 he showed his invention around the company in a presentation called "Film-less Photography." People asked
    good questions: When could customers buy one? How would people look at their photos? But Kodak''s leaders did not see a market. Sasson later told the New York Times that they thought "no one would ever
    want to look at their pictures on a television set." Prints had been around for more than 100 years. They were cheap, familiar and loved, and nobody was complaining about them. And a camera that needed
    no film threatened the business that paid everyone''s salary. Kodak received a patent on Sasson''s camera in 1978, but it was never put into production, and Sasson was told not to show it to outsiders.


    It would be unfair to say Kodak ignored digital forever. It kept doing research and later sold digital cameras. In 1991 Kodak began selling one of the first commercial digital cameras, the DCS 100,
    built on a Nikon camera body. But Kodak moved slowly and cautiously, always trying to protect film. One account says it took Kodak roughly 18 years after the prototype to truly make the switch.


    By then, the world had changed. Digital cameras got cheaper and better, and then smartphones put a camera in almost every pocket. People stopped buying film and stopped printing most of their photos.
    The business that Kodak had protected for so long shrank fast, and its new businesses were not big enough to replace it.


    On January 19, 2012, Eastman Kodak filed for bankruptcy protection. It listed about $6.75 billion in debts against about $5.1 billion in assets and borrowed $950 million from Citibank to keep operating.
    Kodak came out of bankruptcy in 2013 as a much smaller company.


    The most painful part of the story is that Kodak did not lose because it lacked ideas or smart people. It had invented the future in its own lab. What it lacked was the willingness to let that future
    replace the past while there was still time.

    '
  timeline:
  - - '1888'
    - George Eastman founds the company that becomes Eastman Kodak.
  - - '1974'
    - Kodak assigns engineer Steven Sasson to explore electronic image sensors.
  - - Dec 1975
    - Sasson takes the first picture with his digital camera prototype.
  - - '1976'
    - Sasson presents 'Film-less Photography' inside Kodak; leaders see no market.
  - - '1978'
    - Sasson receives a U.S. patent for the camera; it is never produced.
  - - '1991'
    - Kodak begins selling the DCS 100, a digital camera built on a Nikon body.
  - - Jan 19, 2012
    - Eastman Kodak files for bankruptcy protection.
  - - '2013'
    - Kodak emerges from bankruptcy as a smaller company.
  numbers:
  - - Prototype resolution (1975)
    - 100 x 100 pixels (0.01 megapixels)
  - - Time to record one photo (1975)
    - 23 seconds
  - - Prototype weight (1975)
    - about 8 pounds
  - - Debts listed in bankruptcy (2012)
    - about $6.75 billion
  lessons:
  - 'Disruptive technologies start out worse: Sasson''s 1975 prototype captured 0.01 megapixels, took 23 seconds to record one image, weighed about 8 pounds and needed a TV to view. Against cheap, familiar
    prints it lost on every dimension customers then valued, the pattern Christensen''s disruptive innovation theory describes. Evaluate a new technology by its rate of improvement, not by how it compares
    with the mature product today.'
  - 'The threat is to the business model, not the product: Kodak sold cameras cheaply and earned most of its money on film, chemicals, paper and printing. Digital capture removed those consumables, so even
    a successful Kodak digital camera would have replaced high-margin recurring revenue with lower-margin hardware. Ask which profit pools a new technology eliminates, because that, more than the technology,
    explains why incumbents hesitate.'
  - 'Exploitation crowds out exploration: Kodak kept researching digital imaging and later sold digital cameras, so it did not ignore the shift. But it moved slowly to protect film, and one account says
    the real switch took about 18 years. March (1991) showed that organizations favor exploitation because its returns are nearer and surer. Fixing that bias takes protected budgets and separate units with
    their own targets.'
  - 'A patent is not a strategy: Kodak patented the camera in 1978, never produced it, and told Sasson not to show it outside. Holding an invention defensively did not stop others from building digital
    cameras, and smartphones later made standalone cameras less relevant. If a technology will cannibalize your core anyway, it is usually better to own the cannibal than to defend the old product.'
  - 'Delay turns strategy into a financing problem: By January 2012 Kodak listed about $6.75 billion of debts against about $5.1 billion of assets and needed $950 million from Citibank to keep operating.
    A shrinking core could no longer support a company sized for film. The longer a transition waits, the fewer financing options remain to pay for it.'
  questions:
  - It is 1976 and you head Kodak's consumer business after Sasson's "Film-less Photography" presentation. What investment, organizational home and milestones would you set for digital, and how would you
    justify them to a board focused on film margins?
  - Kodak patented the camera in 1978 but kept it internal. Was that a reasonable decision for the time, viewed as a real option? What signals should have told Kodak it was time to exercise that option?
  - Digital photography eliminated the consumables that funded Kodak. Identify another industry where new technology threatens an incumbent's recurring revenue. What should that incumbent do in the next
    three years?
  - Which of Kodak's problems by 2012 were caused by its own choices, and which by forces no film company could have avoided? How would your answer change what you would have done differently?
  note: The popular version, "Kodak invented digital and then buried it," is partly true but simplified. Kodak did keep researching digital imaging and sold digital cameras for years; the bigger problem
    was moving too slowly and leaning on film profits. Sources give the prototype's weight as about 8 to 8.5 pounds (3.6 kg).
  sources:
  - name: IEEE Spectrum, 'The First Digital Camera' (history article)
    url: https://spectrum.ieee.org/first-digital-camera-history
  - name: PetaPixel, 'What Kodak Said About Digital Photography in 1975' (2017)
    url: https://petapixel.com/2017/09/21/kodak-said-digital-photography-1975/
  - name: Engadget, 'Time Machines' on Sasson's camera (2013)
    url: https://www.engadget.com/2013-11-24-time-machines.html
  - name: CNN Money, 'Kodak files for bankruptcy' (2012)
    url: https://money.cnn.com/2012/01/19/news/companies/kodak_bankruptcy/
- slug: intel-exits-memory-1985
  title: Intel Walks Out the Door and Comes Back In
  company: Intel
  year: '1985'
  industry: Semiconductors
  tags:
  - Strategy
  - Leadership
  summary: Intel was founded on memory chips, but by 1985 Japanese competitors were selling them for less, and Intel's profits had nearly vanished. Andy Grove asked Gordon Moore what a brand-new CEO would
    do; Moore said, "Get us out of memories." They did it themselves, bet the company on microprocessors, and Intel became the world's leading chipmaker.
  moral: When a core business commoditizes, exit early and redeploy capital to where you hold a defensible advantage; the biggest obstacle is the company's own identity, not the market.
  story: 'Intel was started in 1968, and its first big success was memory chips, the tiny parts that let computers store information. For years, memory was what Intel was known for. Its leaders liked to
    say, in effect, that memories were who they were.


    By the early 1980s, that was becoming a problem. Japanese manufacturers had learned to make memory chips very well and very cheaply. Memory chips were turning into a commodity, a product where buyers
    mostly care about price because one company''s version is nearly the same as another''s. Prices fell and fell. According to Fortune magazine, Intel''s profits dropped from about $198 million in 1984
    to less than $2 million in 1985. Intel''s own annual report called 1985 "a miserable year" for the company and the industry, with losses in three of its four quarters.


    Intel''s managers argued for months about what to do. There was no easy answer, and every month of delay meant more money lost while competitors kept cutting prices. Many had spent their careers on
    memory, and walking away felt like giving up the company''s identity. Andy Grove, Intel''s president, later described a conversation in his office with Gordon Moore, the chairman and CEO, in 1985. Grove
    asked Moore: "If we got kicked out and the board brought in a new CEO, what do you think he would do?" Moore answered right away: "He would get us out of memories." Grove then asked, "Why shouldn''t
    you and I walk out the door, come back and do it ourselves?"


    That question changed everything. It let two leaders who loved the memory business look at it the way an outsider would, without pride or habit getting in the way. Intel phased out of the main kind
    of memory chip, called DRAM, in 1985. Instead, it bet its future on microprocessors, the "brains" of personal computers. IBM had already chosen an Intel processor for its PC, and in October 1985 Intel
    launched the powerful 386 chip.


    The change was painful. Intel''s 1986 annual report called that year "without question, the toughest year in Intel''s history, filled with plant closings, layoffs and deep losses." Over two years, Intel
    cut about 7,200 jobs and closed eight older factories. In 1986 it lost more than $180 million, its only yearly loss since its earliest days.


    But the bet paid off. As personal computers spread into offices, schools and homes in the late 1980s and 1990s, nearly all of them needed a processor, and Intel''s chips were inside most of them. Intel
    grew into one of the most important technology companies in the world. Grove later wrote about this period in his book Only the Paranoid Survive, where he called such moments "strategic inflection points,"
    times when the basic rules of a business change.

    '
  timeline:
  - - '1968'
    - Intel is founded; memory chips become its first big business.
  - - Early 1980s
    - Japanese makers drive memory-chip prices down.
  - - '1985'
    - Intel's profit falls to nearly zero; Grove and Moore have their 'new CEO' conversation.
  - - '1985'
    - Intel phases out of the DRAM memory business.
  - - Oct 1985
    - Intel launches the 386 microprocessor.
  - - '1986'
    - Intel posts a loss of more than $180 million amid layoffs and plant closings.
  numbers:
  - - Intel profit (1984)
    - about $198 million
  - - Intel profit (1985)
    - less than $2 million
  - - Intel loss (1986)
    - more than $180 million on about $1.3 billion in sales
  - - Jobs cut (1985–86)
    - about 7,200
  lessons:
  - 'Recognize the strategic inflection point: Grove later described this moment in Only the Paranoid Survive (1996) as a strategic inflection point, when the fundamentals of a business change. Japanese
    makers turned memory chips into a commodity, and Intel''s profit fell from about $198 million in 1984 to under $2 million in 1985. Leaders should track price erosion and share loss in the core long
    before the income statement forces the issue.'
  - 'Borrow an outsider''s view: Intel''s managers debated for months while losses mounted, partly because memory was the company''s identity. Grove''s question, what would a new CEO do, stripped out pride
    and sunk investment and produced an immediate answer: exit memories. Structured devices such as outside-view questions, pre-mortems and independent board reviews help leaders counter escalation of commitment
    to a failing business.'
  - 'Compete where you can differentiate: In a commodity, the lowest-cost producer sets the price, and Intel could not win that race. Microprocessors offered differentiation and customer switching costs:
    IBM had already chosen an Intel processor for its PC, and the 386 launched in October 1985. When a market commoditizes, move resources to the product where your position is hardest to copy.'
  - 'Strategy is revealed in resource allocation: Robert Burgelman''s research on Intel found that middle managers had been shifting factory capacity toward microprocessors, guided by margin-based allocation
    rules, before top management formally exited memory. The case notes the same gradual shift. Leaders should watch where their own organization is already moving resources, because it often signals the
    future strategy earlier than the official plan.'
  - 'Budget for the cost of the pivot: Exiting meant about 7,200 job cuts, eight plant closures and a 1986 loss of more than $180 million on about $1.3 billion in sales. A strategic exit creates a visible
    near-term loss even when it is right. Firms need the balance sheet, board support and clear communication to absorb that dip, or they will delay until the choice is made for them.'
  questions:
  - 'It is mid-1985 and Intel''s profit has fallen from about $198 million to under $2 million. Lay out three options: match Japanese prices, retreat to niche memory products, or exit DRAM. What would each
    require in capital, time and people?'
  - Grove's "new CEO" question worked only because both leaders acted on the answer. Design a governance process that forces this question on a regular schedule, before a business reaches near-zero profit.
  - The exit cost about 7,200 jobs, eight plants and a 1986 loss of more than $180 million. How would you have sequenced the cuts, and what would you have told employees, customers and investors at each
    stage?
  - Which businesses today face the commoditization Intel faced in memory chips? For one of them, what is the equivalent of the microprocessor, and what is stopping the move?
  note: 'The Grove–Moore conversation comes from Grove''s own later account in Only the Paranoid Survive (1996), so it is one person''s memory of a private talk. Intel''s pivot was also not instant: it
    had been shifting toward microprocessors for years, and the decision to leave DRAM was debated inside the company for months. The 1984, 1985 and 1986 figures come from Fortune as quoted secondhand,
    and from Intel''s annual reports.'
  sources:
  - name: Intel, 1985 Annual Report
    url: https://intel.com/content/www/us/en/history/history-1985-annual-report.html
  - name: A Letter a Day, 'Andy Grove and Gordon Moore (1986)' (reprint of Intel's 1986 shareholder letter)
    url: https://aletteraday.substack.com/p/letter-15-intel-1986?open=false
  - name: Big Think, 'The best question a leader can ask' (excerpt from Distancing, 2025)
    url: https://bigthink.com/business/the-best-question-a-leader-can-ask-what-would-my-replacement-do/
  - name: GranneBlog, 'Intel's ups and downs' (quoting Fortune)
    url: https://blog.granneman.com/?p=279
  - name: Computer History Museum, Intel 386 Microprocessor Marketing oral history panel (2008)
    url: https://www.computerhistory.org/collections/catalog/102702022
- slug: apple-1997
  title: Steve Jobs Returns and Apple Learns to Say No
  company: Apple
  year: '1997'
  industry: Computers
  tags:
  - Strategy
  - Leadership
  - Finance & risk
  summary: In 1997, Apple lost more than $1 billion and was close to running out of cash. Steve Jobs returned, made peace with rival Microsoft, which invested $150 million, and cut Apple's crowded product
    line to four computers. A year later Apple was profitable again, showing the power of focus.
  moral: 'In a turnaround, focus is a survival decision: cut the portfolio to what the firm can make excellent, secure the confidence of partners and customers, then rebuild growth.'
  story: 'Steve Jobs co-founded Apple in 1976, but in 1985 he was pushed out after a power struggle. He went on to start a new computer company called NeXT. Meanwhile, Apple struggled. By the mid-1990s,
    it was losing customers to cheaper computers running Microsoft Windows. Its sales fell from about $9.8 billion in fiscal 1996 to about $7.1 billion in fiscal 1997. It lost about $816 million in 1996
    and about $1.04 billion in 1997.


    Part of the trouble was that Apple made too many products. It sold many versions of the Macintosh computer, plus printers, a digital camera and the Newton handheld. Even people inside the company had
    a hard time explaining the differences. Apple also had 16 separate advertising budgets, which Jobs later combined into a single, stronger one. In February 1997, Apple bought NeXT for about $427 million,
    and Jobs came back as an adviser. In July, CEO Gil Amelio left after another large loss. On September 16, 1997, Apple named Jobs interim CEO. People started calling him the "iCEO."


    Jobs moved fast. One famous story is that he asked managers a simple question about all those products: which ones should I tell my friends to buy? They couldn''t give him a simple answer. So he drew
    a grid with four boxes. One side said consumers and professionals. The other said desktops and laptops. Apple would make one great computer for each box, and that was it. Most other products were dropped,
    including the Newton and the printers. Apple cut thousands of jobs as well. Jobs later summed up his thinking this way: "Deciding what not to do is as important as deciding what to do."


    Jobs also made a surprising deal with Microsoft, Apple''s longtime rival. At the Macworld show in Boston in August 1997, he announced that Microsoft would invest $150 million in Apple by buying shares
    that carried no voting power. Microsoft promised to keep making Microsoft Office and its Internet Explorer browser for the Mac for five years. In return, Apple made Internet Explorer the default browser
    on Macs, and the two companies settled long-running legal disputes and agreed to share patents. When Jobs announced it, some Apple fans in the audience booed. But the money mattered less than the message:
    customers and software makers could trust that the Mac would survive.


    Focus started to pay off quickly. In 1998, Apple introduced the colorful iMac for the consumer desktop box of the grid, and it became a hit. Apple returned to profit in early 1998 and earned about $309
    million for its 1998 fiscal year. Jobs later said that when he came back, Apple had been about 90 days from running out of money.


    The rescue of 1997 was the start of one of the greatest turnarounds in business history. Apple later went on to create the iPod, the iPhone and the iPad. But those famous products came after a less
    glamorous first step: cutting back, choosing what matters most, and doing that one thing really well.

    '
  timeline:
  - - '1985'
    - Steve Jobs leaves Apple after a power struggle and founds NeXT.
  - - Feb 1997
    - Apple completes its purchase of NeXT for about $427 million; Jobs returns as an adviser.
  - - July 1997
    - CEO Gil Amelio leaves Apple after a large quarterly loss.
  - - Aug 1997
    - At Macworld Boston, Jobs announces Microsoft's $150 million investment and partnership.
  - - Sept 16, 1997
    - Apple names Jobs interim CEO.
  - - 1997–1998
    - Apple cuts its product line down to four core computers.
  - - '1998'
    - Apple launches the iMac and returns to profitability.
  numbers:
  - - Apple net loss (fiscal 1997)
    - about $1.04 billion
  - - Apple sales (fiscal 1997)
    - about $7.1 billion, down 28% from 1996
  - - Microsoft investment (1997)
    - $150 million in non-voting stock
  - - Apple profit (fiscal 1998)
    - about $309 million
  lessons:
  - 'Strategy requires trade-offs: Porter argued in "What Is Strategy?" (1996) that strategy means choosing what not to do. Apple sold many Mac versions plus printers, a camera and the Newton, and even
    insiders could not explain the differences. Jobs''s four-box grid (consumer and pro, desktop and laptop) cut most products. If managers cannot say which product a customer should buy, the portfolio
    is too broad.'
  - 'Complexity has hidden costs: Apple ran 16 separate advertising budgets, which Jobs merged into one. A crowded lineup splits engineering, marketing spend and sales attention, and it confuses customers
    and retailers. Sales fell about 28 percent to about $7.1 billion in fiscal 1997. Simplifying the portfolio frees people and money to make fewer products clearly better, and gives customers and retailers
    a simple reason to buy.'
  - 'Complementors and co-opetition: Microsoft''s $150 million in non-voting stock was small against Apple''s loss of about $1.04 billion. Its real value was the five-year commitment to Office and Internet
    Explorer for the Mac, which told customers and developers the platform would survive. Brandenburger and Nalebuff''s co-opetition describes this: a rival can also be a complementor. In platform businesses,
    credibility with complementors is itself a survival asset.'
  - 'Sequence the turnaround: Apple first stabilized (Microsoft deal, cuts), then focused (four products), then launched growth (the iMac in 1998). It earned about $309 million in fiscal 1998. Note that
    most fiscal 1997 losses occurred before Jobs became interim CEO, so the base was very low. Stabilize cash, narrow the focus, then invest in a growth product, in that order.'
  - 'Leadership and acquired talent: Apple''s roughly $427 million purchase of NeXT brought back Jobs and NeXT''s software, and the board named him interim CEO in September 1997. An acquisition can be a
    way to buy leadership and capabilities, not just products. Boards should assess what a deal adds in people and decision-making, which may matter more than the assets on its balance sheet.'
  questions:
  - 'It is September 1997 and you are the interim CEO. Rank these by urgency: cutting products, securing Microsoft''s commitment, reorganizing marketing, and launching a new product. Defend your order using
    the case''s numbers.'
  - Microsoft's $150 million was small relative to Apple's losses. Estimate what the deal was really worth to Apple, considering Office for the Mac, developer confidence and the legal settlement, and what
    Apple gave up in return.
  - Some accounts say about 70 percent of products were eliminated. What would you lose by cutting that deep, and how would you decide which borderline products to keep?
  - When does radical portfolio simplification fail? Name a company or industry where breadth of offering is the strategy, and explain why Jobs's approach would not fit there.
  note: Apple's fiscal year ends in late September, so 'fiscal 1997' losses mostly happened before Jobs became interim CEO. The '90 days from insolvency' line is Jobs's own later description, not a figure
    from Apple's financial filings. Accounts differ on exactly how many products Apple had before the cuts (often described as a dozen or more Macintosh versions, with about 70 percent of products eliminated).
    The four-box grid was presented publicly in 1998.
  sources:
  - name: Apple Computer, Form 10-K for fiscal 1997 (SEC)
    url: https://www.sec.gov/Archives/edgar/data/0000320193/000104746997006960/0001047469-97-006960.txt
  - name: 'InformationWeek, ''August, 1997: Microsoft Rescues Apple?'' (2009)'
    url: https://www.informationweek.com/it-leadership/august-1997-microsoft-rescues-apple-
  - name: Cult of Mac, 'Steve Jobs becomes Apple's interim CEO' (Today in Apple history)
    url: https://www.cultofmac.com/apple-history/steve-jobs-apple-ceo
  - name: Entrepreneur, 'How Steve Jobs Saved Apple' (2011)
    url: https://www.entrepreneur.com/blog/220604
  - name: Stanford eCorner, 'When Steve Jobs Returned to Apple' (Adam Lashinsky, transcript)
    url: https://stvp.stanford.edu/wp-content/uploads/sites/3/2024/09/when-steve-jobs-returned-to-apple-transcript.pdf
- slug: toyota-andon-cord
  title: Toyota and the Cord That Stops the Line
  company: Toyota
  year: 1950s–today
  industry: Automobiles
  tags:
  - Operations
  - Culture & people
  summary: In Toyota's factories, any worker who spots a problem can pull a cord, called the andon, to call for help and, if needed, stop the whole assembly line. It sounds expensive, but it is a core part
    of the Toyota Production System, which aims to fix problems at their source instead of passing them on.
  moral: Build quality into the process by giving frontline workers authority to stop it; stopping early costs less than a defect found downstream or by a customer.
  story: 'Imagine working on a car assembly line where each car moves past you every minute or so. You notice a part doesn''t fit right. Most factories in the past told workers to keep the line moving no
    matter what and let inspectors catch problems at the end. Toyota did something that sounded crazy: it let every worker stop the line.


    The idea goes back to Sakichi Toyoda, who founded the group of companies that became Toyota. He invented automatic weaving looms. In 1896 he created a power loom that stopped by itself when a thread
    broke. That way, the machine didn''t keep weaving bad cloth, and one person could watch many machines. Toyota calls this idea jidoka, often translated as "automation with a human touch." It means machines
    and people should stop as soon as something is wrong, so defects are not passed down the line.


    Toyota''s car business added a second big idea, called just-in-time. Kiichiro Toyoda, who founded Toyota Motor Corporation, pushed to make only what was needed, when it was needed, in the amount needed,
    so the factory would not pile up costly extra parts. After World War II, a production chief named Taiichi Ohno led the effort to build these ideas into a full system through the 1950s and 1960s. It
    became known as the Toyota Production System.


    The andon cord is one of its best-known tools. Andon is a Japanese word for a paper lantern. In a Toyota factory, it is a signal board that lights up to show where help is needed. Toyota began using
    the andon system in 1950. On many lines, a cord runs along the length of the line. When a worker pulls it, a light and sound go off, and the board shows which workstation has a problem. A team leader
    rushes over. If the problem can be fixed within the time that the car would normally spend at that station, the line keeps moving. If not, the whole line stops until it is solved. Then the cord is pulled
    again to restart.


    Why would a company let anyone stop a factory that costs a lot of money every minute? Because a defect that is fixed right away is cheap. A defect that is hidden inside a finished car, or found by a
    customer, is expensive and damages trust. Each pull also gives Toyota information. Teams study how often problems happen and what causes them, then improve the process so the problem doesn''t come back.
    Toyota calls this steady, daily improvement kaizen.


    The cord also sends a message about people. Toyota treats each worker as an expert on his or her own job and trusts them to protect quality. Pulling the cord is not seen as getting in trouble. It is
    seen as doing your job well.


    Toyota''s methods spread around the world, beginning in earnest with NUMMI, a factory in California that Toyota ran jointly with General Motors starting in 1984. Today, ideas from the Toyota Production
    System are used in hospitals, software companies and offices. Many of them have their own version of an andon cord: a clear, safe way for anyone to say, "Stop. Something''s wrong here."

    '
  timeline:
  - - '1896'
    - Sakichi Toyoda builds a power loom that stops automatically when a thread breaks, the root of jidoka.
  - - 1930s
    - Kiichiro Toyoda develops the just-in-time idea for Toyota's car business.
  - - '1950'
    - Toyota begins using the andon system.
  - - 1950s–1960s
    - Taiichi Ohno leads the development of the Toyota Production System.
  - - '1984'
    - NUMMI, Toyota's joint factory with General Motors in California, begins spreading the system abroad.
  numbers:
  - - Year of Toyoda's self-stopping loom
    - '1896'
  - - Year Toyota began using andon
    - '1950'
  - - Start of NUMMI joint venture with GM
    - '1984'
  lessons:
  - 'Jidoka and the cost of late detection: Sakichi Toyoda''s 1896 loom stopped itself when a thread broke, so it did not keep weaving bad cloth. The andon cord applies the same jidoka principle to people.
    A defect fixed at the station is cheap; one buried in a finished car or found by a customer costs far more and damages trust. Design processes to detect and stop at the source rather than inspect at
    the end.'
  - 'The andon is an information system: Each pull records where and how often problems occur, and teams use that data to find root causes and improve the process through kaizen. The stop is the price of
    the learning. A falling number of pulls is not automatically good news: it may mean better quality or workers who no longer feel safe to signal. Managers should read the data with that ambiguity in
    mind.'
  - 'Authority needs psychological safety: Toyota treats a pull as doing the job well, not as getting in trouble. Edmondson''s research on psychological safety (1999) shows that teams report and learn from
    problems only when speaking up is safe. Granting stop authority without that norm produces a cord nobody pulls. How supervisors react to the first few pulls sets the norm for everyone.'
  - 'Tools work only inside the system: Andon is paired with just-in-time production, which keeps little spare inventory. With few buffers, problems surface quickly and must be solved at the root, so the
    two practices reinforce each other. NUMMI, Toyota''s 1984 venture with GM, began spreading the system abroad. Copying a single tool without the surrounding practices and culture rarely delivers the
    results.'
  - 'Design the escalation, not just the signal: In practice the pull first calls a team leader, and the line stops only if the problem cannot be fixed within the station''s cycle time. Tiered escalation
    balances throughput and quality and keeps the signal cheap to use. Any organization adopting a stop mechanism should define who responds, how fast and when a full stop is triggered.'
  questions:
  - You run a plant where every minute of line stoppage is expensive, and supervisors oppose giving every worker stop authority. What escalation rules, metrics and supervisor incentives would you put in
    place before introducing an andon system?
  - After a year, andon pulls at your plant drop by half. What data would you need to tell whether quality improved or workers stopped pulling the cord, and what would you do in each case?
  - Why might an andon system fail in a plant that holds large inventory buffers, or one where supervisors are paid on daily output? What would you change first?
  - Translate the andon cord to a hospital, a software deployment pipeline or a financial close process. Who holds the cord, what does stopping cost, and who must respond?
  note: Popular retellings often say that pulling the cord instantly stops the line. In practice at many Toyota plants, the pull first calls a team leader, and the line stops only if the problem can't be
    fixed within that workstation's cycle time; Toyota UK confirms both descriptions.
  sources:
  - name: Toyota Motor Corporation, 'Toyota Production System'
    url: https://global.toyota/en/company/vision-and-philosophy/production-system/
  - name: 'Toyota UK Magazine, ''Toyota manufacturing in 25 objects: Andon cord'''
    url: https://mag.toyota.co.uk/toyota-manufacturing-25-objects-andon-cord/
  - name: Toyota UK Magazine, 'Andon – Toyota Production System guide' (2016)
    url: https://mag.toyota.co.uk/andon-toyota-production-system/
  - name: Lean Enterprise Institute, 'Toyota Production System' (Lean Lexicon)
    url: https://www.lean.org/lexicon-terms/toyota-production-system/
- slug: southwest-10-minute-turn
  title: Southwest Airlines and the 10-Minute Turn
  company: Southwest Airlines
  year: 1971–2020
  industry: Airlines
  tags:
  - Operations
  - Strategy
  - Culture & people
  summary: In 1972, cash-strapped Southwest Airlines had to sell one of its four planes but wanted to keep its full schedule. The answer was to unload, clean and reload a plane in about 10 minutes. Fast
    turnarounds, one type of airplane and a team spirit became the heart of a low-cost model that kept Southwest profitable for 47 straight years.
  moral: A constraint-driven process improvement becomes durable strategy when the whole operating model is built to reinforce it, so rivals cannot win by copying one piece.
  story: 'Southwest Airlines began flying on June 18, 1971, with three Boeing 737 jets connecting three Texas cities: Dallas, Houston and San Antonio. Its plan was simple: short flights, low fares and friendly
    service. In September 1971 it bought a fourth 737.


    Money ran short fast. By the spring of 1972, the young airline had only $143 in the bank and was facing about $1.6 million in losses. Southwest''s president, Lamar Muse, made a hard decision: sell the
    fourth plane. The sale brought in a profit of about $500,000 and kept the company alive. But it created a new puzzle. How could Southwest keep flying its full schedule, with 14 daily round trips between
    Dallas and Houston and more to San Antonio, with only three planes?


    The answer came from the ground crew. A plane only earns money when it is in the air. If Southwest could get each plane back in the air faster after it landed, three planes could do the work of four.
    Bill Franklin, the head of ground operations, declared that the team would turn each plane around in 10 minutes. At the time, most airlines took close to an hour. More than 100 tasks had to happen in
    that window: passengers off, bags out, cabin cleaned, snacks restocked, new bags and passengers on. Teams studied race-car pit crews for ideas. Everyone pitched in, including pilots, and even co-founder
    Herb Kelleher was known to take out trash and restock peanuts. Passengers chose their own seats instead of having assigned ones, which helped boarding go faster. The crews did not always hit 10 minutes,
    but they hit it often enough that it became Southwest''s signature.


    Fast turns became the center of a whole low-cost way of doing business. Southwest flew only one type of plane, the Boeing 737, so every pilot, mechanic and crew member could work on any plane and spare
    parts were simpler. It flew mostly point-to-point, meaning direct trips between cities rather than sending everyone through a few giant hubs. All of this kept costs low, so fares could stay low, which
    brought in more customers who might otherwise have driven or stayed home.


    The results were remarkable. After its loss in 1972, Southwest made a profit every single year for 47 years in a row, a record almost unheard of in the up-and-down airline business. It grew from three
    planes into a giant with more than 700 Boeing 737s and tens of thousands of employees. Its turns got longer as planes and rules changed; by 2011 the average was about 25 minutes, which was still among
    the fastest in the industry.


    The streak finally ended in 2020, when the COVID-19 pandemic emptied airports and Southwest lost about $3.5 billion, not counting special items. Then, in December 2022, a winter storm set off a collapse
    in Southwest''s operations that canceled about 16,900 flights and stranded more than 2 million passengers. In a 2023 settlement with the U.S. Department of Transportation, Southwest agreed to a record
    $140 million civil penalty. Even great systems need to keep improving.


    Still, the 10-minute turn remains one of the best stories in business about turning a crisis into a strength. Southwest did not have more money or more planes. It had a team that found a smarter way
    to use what it had.

    '
  timeline:
  - - June 18, 1971
    - Southwest begins service with three Boeing 737s in Texas.
  - - Sept 1971
    - Southwest buys a fourth Boeing 737.
  - - '1972'
    - With $143 in the bank, Southwest sells its fourth plane and launches the 10-minute turn.
  - - 1973–2019
    - Southwest is profitable for 47 consecutive years.
  - - '2020'
    - The COVID-19 pandemic brings Southwest's first annual loss since 1972.
  - - Dec 2023
    - Southwest agrees to a $140 million DOT penalty over its December 2022 holiday meltdown.
  numbers:
  - - Cash in the bank (spring 1972)
    - $143
  - - Target turnaround time (1972)
    - 10 minutes
  - - Consecutive profitable years (1973–2019)
    - '47'
  - - Boeing 737s in the fleet (end of 2020)
    - '718'
  lessons:
  - 'Asset utilization drives unit cost: A plane earns money only in the air. With $143 in the bank in 1972, Southwest sold its fourth 737 for a profit of about $500,000 and kept its schedule by turning
    planes in about 10 minutes when most airlines took close to an hour. In capital-intensive businesses, the cycle time of the most expensive asset largely sets cost per unit.'
  - 'Focus on the bottleneck: Goldratt''s theory of constraints, popularized in The Goal (1984), holds that system output is limited by its tightest constraint. For Southwest, that was time on the ground.
    Ground crews studied pit crews and redesigned more than 100 tasks, and open seating sped boarding. Improvement effort pays most when aimed at the step that limits the whole system.'
  - 'Activity fit makes strategy hard to copy: Porter used Southwest in "What Is Strategy?" (1996) to show how activities reinforce each other. One aircraft type, point-to-point routes, quick turns, open
    seating and low fares each support the others. A rival can copy any single practice but struggles to copy the system. The result was 47 straight profitable years, from 1973 through 2019.'
  - 'Culture as an operating capability: The 10-minute turn depended on people crossing job lines: pilots helped, and Kelleher himself took out trash. Southwest says crews did not always hit the target,
    but they hit it often enough to make it a signature. Cross-functional flexibility can be a cost advantage, but it rests on trust and shared purpose that take years to build.'
  - 'Efficiency trades off against resilience: A lean, tightly scheduled network has little slack. The streak ended in 2020 with a loss of about $3.5 billion before special items, and in December 2022 a
    storm-driven collapse cancelled about 16,900 flights, leading to a record $140 million penalty. High-utilization models need deliberate investment in recovery capacity and systems, treated as insurance
    rather than waste.'
  questions:
  - It is spring 1972 and Southwest has $143 in the bank. Compare selling the fourth plane and compressing turns with alternatives such as cutting routes or raising fares. What could go wrong with each?
  - Assume a one-hour flight and a 14-hour operating day. How many round trips can one plane fly with a 10-minute turn versus a 50-minute turn? What does the difference imply for cost per seat and fleet
    size?
  - Using Porter's idea of activity fit, which elements of Southwest's model would a hub-and-spoke carrier find hardest to copy, and why?
  - The December 2022 meltdown cancelled about 16,900 flights. How should a company built on lean, high-utilization operations decide how much slack and recovery capacity to pay for?
  note: Southwest itself says crews did not always make the 10-minute target. The 47-year profit streak counts annual profits from 1973 through 2019. The 2020 loss of about $3.5 billion excludes special
    items; the $140 million DOT penalty came through a consent order Southwest agreed to, which it called a consumer-friendly settlement.
  sources:
  - name: 'Southwest Airlines (Southwest 50), ''A Turning Point: The Birth of the 10-Minute Turn'''
    url: https://southwest50.com/our-stories/a-turning-point-the-birth-of-the-10-minute-turn
