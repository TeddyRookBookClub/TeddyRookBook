- slug: nordstrom-tire-story
  title: Nordstrom and the Tires It Never Sold
  company: Nordstrom
  year: 1975–1979
  industry: Department stores
  tags:
  - Customers
  - Culture & people
  - Marketing
  summary: For decades, people have told the story of a Nordstrom clerk in Alaska who gave a man a refund for tires, even though Nordstrom never sold tires. Long treated as a likely legend, the story was later confirmed by Nordstrom, and it became a symbol of a company that trusts employees to use good judgment.
  moral: A small act of trust, told again and again, can become a company's most valuable story.
  story: 'Nordstrom began in 1901 as a shoe store in Seattle. John W. Nordstrom, a Swedish immigrant, had come back from the Klondike gold rush with about $13,000 and opened the store, called Wallin and Nordstrom, with a partner named Carl Wallin. Their founding idea was simple: give customers the best possible service, selection, quality and value. The shoe store grew into one of the best-known department stores in America.


    Over the years, Nordstrom became famous for how its salespeople treated customers. Rather than a thick rulebook, employees were reportedly handed a single card with one rule: "Use good judgment in all situations." The company''s message was that the people on the sales floor knew best how to help the person in front of them.


    The most famous example is the tire story. In 1975, Nordstrom bought three stores in Alaska from a local company called Northern Commercial. Northern Commercial had sold all kinds of things, including auto supplies. Nordstrom changed the stores to sell clothing and shoes. Nordstrom has never sold tires, not in Alaska and not anywhere else.


    As the story goes, a man walked into the Fairbanks store one winter day rolling two tires. He said he had bought them in that very building and had been promised he could return them anytime. A young employee named Craig Trounce had no way to look up the price, so he called a tire shop to ask what the tires were worth, then gave the man that amount in cash, reportedly about $25. Trounce later joked that he mostly wanted to get the dirty tires away from the shirts.


    For years, many people assumed the story was made up. It spread through business magazines and books in the 1980s and 1990s, and some versions changed the details. A 1988 Washington Post article even reported that Nordstrom officials called it apocryphal, meaning probably not true. The fact-checking website Snopes concluded it was most likely a legend. But later, members of the Nordstrom family said it really happened. In a company podcast, Pete Nordstrom said, "The tire story did happen," and named Trounce as the employee. A Fairbanks newspaper interviewed people involved and placed the event in the winter of 1979.


    Was it smart business to refund money for something the store never sold? On its own, it cost a little money. But the story has been told so many times, in so many books and classrooms, that it has probably been worth far more than $25 in goodwill. More importantly, it showed employees what the company valued: treating customers with respect, even when they are confused, and not hiding behind rules.


    There is a balance here. Stores also need return policies that protect them from people who take advantage. Over the years, Nordstrom, like other retailers, has had to set limits. But the lesson for a small business stands. When an honest customer is in a strange situation, the kind and generous choice is often cheaper in the long run than winning a small argument.'
  timeline:
  - - '1901'
    - John W. Nordstrom and Carl Wallin open a shoe store in Seattle.
  - - 1960s
    - Nordstrom begins adding clothing and grows into a department store.
  - - '1975'
    - Nordstrom buys three Alaska stores from Northern Commercial, which had sold auto supplies.
  - - Mid-to-late 1970s
    - A Fairbanks clerk refunds a customer for tires the store never sold.
  - - 1980s
    - The tire story spreads in business magazines; Nordstrom officials reportedly call it apocryphal in 1988.
  - - 2010s–2022
    - Nordstrom family members and a Fairbanks newspaper say the story is true.
  numbers:
  - - Nordstrom founded
    - 1901, in Seattle
  - - John W. Nordstrom's Klondike stake
    - about $13,000
  - - Alaska stores bought (1975)
    - '3'
  - - Reported tire refund
    - about $25
  lessons:
  - 'Stories teach culture: one vivid example can explain your values better than a manual.'
  - 'Trust your team: a one-rule handbook only works if you hire and train people well.'
  - 'Kindness can be cheap: a small refund can buy a lifetime of goodwill.'
  - 'Check the legend: famous business stories often change in the retelling, so look for the facts.'
  questions:
  - Was the clerk right to give a refund for tires the store never sold? Why or why not?
  - Why might a company want employees to use 'good judgment' instead of following detailed rules?
  - Can you think of a family or business story that gets told over and over? What lesson does it teach?
  note: This story was long considered partly or wholly legend, and details still differ. Snopes concluded it was most likely apocryphal, and a 1988 Washington Post report said Nordstrom officials called it apocryphal. Later, John Nordstrom described witnessing it in the mid-1970s, the company's podcast named clerk Craig Trounce, and a 2022 Fairbanks Daily News-Miner report dated it to 1979. The exact amount (often given as $25) and date are not certain. The one-rule handbook is described by Nordstrom spokespeople, though the company also has other policies.
  sources:
  - name: 'Nordstrom press release, ''Nordy Pod: The Truth About Nordstrom''s Legendary Tire Story'''
    url: https://press.nordstrom.com/news-releases/news-release-details/nordy-pod-truth-about-nordstroms-legendary-tire-story
