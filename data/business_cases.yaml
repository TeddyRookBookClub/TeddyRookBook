    url: https://choosewashingtonstate.com/success-stories/nordstrom/
- slug: ltcm-1998
  title: 'Long-Term Capital Management: When Geniuses Borrow Too Much'
  company: Long-Term Capital Management
  year: 1994–1998
  industry: Investment fund (hedge fund)
  tags:
  - Finance & risk
  - Crisis
  - Leadership
  summary: A hedge fund run by star traders and two Nobel Prize winners earned huge returns, then lost about $4.6 billion in a few months in 1998 because it had borrowed so heavily. Its collapse threatened Wall Street, and the Federal Reserve gathered major banks to take it over.
  moral: Even the smartest plan can sink if it is built on too much borrowed money.
  story: 'In 1994, a former Salomon Brothers bond trader named John Meriwether started an investment fund called Long-Term Capital Management, or LTCM. A fund like this, called a hedge fund, collects money from wealthy investors and big institutions and tries to earn high returns. LTCM''s team was dazzling. It included top Wall Street traders and two famous economists, Myron Scholes and Robert Merton, who shared the Nobel Prize in economics in 1997.


    LTCM''s strategy used complex math to find tiny price differences between investments that were very similar, like two government bonds with slightly different dates. The bet was that the prices would move back together over time. Each bet earned only a small amount, so to make big profits LTCM borrowed huge sums of money to make the bets much larger. This is called leverage. It is like using a long lever to lift something heavy: a small push becomes a big movement, in either direction.


    At first, it worked beautifully. The fund returned about 20 percent in 1994, 43 percent in 1995, 41 percent in 1996 and 17 percent in 1997. At the end of 1997, LTCM gave about $2.75 billion back to its investors but kept its bets just as large, which meant borrowing even more. By then it had roughly $30 of debt for every $1 of its own money. It also had derivatives contracts, which are financial agreements whose value depends on other investments, with a face value of more than a trillion dollars.


    Then, on August 17, 1998, Russia stopped paying some of its debts. Investors around the world panicked and rushed to the safest investments they could find. Prices that LTCM had bet would move together instead moved apart, almost everywhere at once. Because LTCM had borrowed so much, even small price moves caused enormous losses. The fund lost 44 percent of its value in August alone. By the end of that month, it had lost about half its capital.


    The danger was not just to LTCM''s investors. Many of the world''s biggest banks had lent to LTCM or traded with it. If the fund were forced to sell everything at once, prices could crash and spread the damage. In September 1998, the Federal Reserve Bank of New York called together the heads of major banks. On September 23, fourteen financial firms agreed to put in about $3.6 billion in exchange for 90 percent of the fund. Fed Chairman Alan Greenspan stressed that no government money was used. "This agreement was not a government bailout," he told Congress, adding that Federal Reserve funds were never provided.


    LTCM''s partners, who had invested much of their own wealth, lost most of it. The banks slowly sold off the fund''s positions and got their money back by the end of 1999, and the fund was closed in early 2000. In total, LTCM lost about $4.6 billion in under four months.


    The lesson is old but easy to forget. Borrowing can make good times better, but it makes bad times far worse, and it can turn a bad month into a disaster. Smart models are built on the past, and the future does not always cooperate. For a family or a small business, it is wise to ask not just how much you could earn, but how much you could survive losing.'
  timeline:
  - - Feb 1994
    - John Meriwether launches LTCM with just over $1 billion.
  - - 1995–1996
    - The fund earns returns of more than 40 percent a year.
  - - Dec 1997
    - LTCM returns about $2.75 billion to investors but keeps its bets large.
  - - Aug 17, 1998
    - Russia stops paying some debts; markets panic.
  - - Aug 1998
    - LTCM loses 44 percent of its value in a single month.
  - - Sept 23, 1998
    - Fourteen firms agree to put about $3.6 billion into LTCM, with the New York Fed's help.
  - - Early 2000
    - After repaying the rescuers, the fund is closed.
  numbers:
  - - Starting capital (1994)
    - just over $1 billion
  - - Leverage (end of 1997)
    - about $30 of debt per $1 of capital
  - - Loss in August 1998
    - 44 percent of the fund's value
  - - Private rescue (Sept 1998)
    - about $3.6 billion from 14 firms
  - - Total losses (1998)
    - about $4.6 billion in under four months
  lessons:
  - 'Borrowing cuts both ways: leverage multiplies losses just as fast as gains.'
  - 'Models are not the future: rare events happen more often than the math may suggest.'
  - 'Leave a cushion: returning cash while keeping big bets left no room for bad luck.'
  - 'Your risk can become others'' risk: when you are deeply connected, failure spreads.'
  questions:
  - Explain leverage in your own words. Why did it make LTCM's losses so large?
  - Was it right for the Federal Reserve to help organize a rescue, even without using public money?
  - Where do people in everyday life take on too much debt, and how can they protect themselves?
  note: Sources give slightly different figures for the rescue ($3.5 billion to $3.65 billion) and for yearly returns, depending on rounding and whether fees are counted. Greenspan's testimony gave about $3.5 billion; the Federal Reserve's history essay gives $3.625 billion. Bear Stearns and one other invited firm declined to join the rescue. Some critics argued that even a privately funded rescue arranged by the Fed could encourage risky behavior.
  sources:
  - name: Federal Reserve History, 'Near Failure of Long-Term Capital Management'
    url: https://www.federalreservehistory.org/essays/ltcm-near-failure
  - name: Federal Reserve Board, Testimony of Chairman Alan Greenspan (Oct 1, 1998)
    url: https://www.federalreserve.gov/boarddocs/Testimony/1998/19981001.htm
  - name: Wikipedia, 'Long-Term Capital Management'
    url: https://en.wikipedia.org/wiki/Long-Term_Capital_Management
- slug: lehman-brothers-2008
  title: The Fall of Lehman Brothers
  company: Lehman Brothers
  year: '2008'
  industry: Investment banking
  tags:
  - Finance & risk
  - Crisis
  - Ethics & trust
  summary: On September 15, 2008, the 158-year-old investment bank Lehman Brothers filed for the largest bankruptcy in U.S. history after betting heavily on real estate and running out of lenders. Its collapse turned a housing slump into a worldwide financial panic.
  moral: A house built on borrowed money can fall in a weekend, no matter how old it is.
  story: 'Lehman Brothers had a long history. In 1844, a German immigrant named Henry Lehman opened a dry goods store in Montgomery, Alabama. His brothers joined him, and by 1850 the business was called Lehman Brothers. Over the next century and a half it grew into a Wall Street investment bank that survived railroad failures, the Great Depression and many market crashes. By 2008, it was the fourth-largest investment bank in the United States, with about 25,000 employees.


    In the early 2000s, home prices in America were rising fast, and lenders were making loans to many borrowers who could not really afford them, called subprime mortgages. Lehman jumped in. In 2003 and 2004, it bought five mortgage lenders, including some that specialized in subprime loans. It bundled loans into investments to sell, and it also kept many of them. Even as home prices started falling, Lehman kept increasing its real estate bets. By the end of 2007, it held about $111 billion in real estate assets, more than twice as much as a year before.


    Like other investment banks, Lehman paid for its investments mostly with borrowed money, much of it short-term loans that had to be renewed constantly. That worked only as long as lenders trusted Lehman. In March 2008, a rival bank, Bear Stearns, ran into trouble and was sold to JPMorgan Chase with backing from the government. Many people wondered who would be next.


    Lehman tried to calm the worry. In June 2008, after its first quarterly loss as a public company, it raised $6 billion from investors. But on September 10, it announced a loss of about $3.9 billion for the quarter and $5.6 billion in write-downs, meaning it admitted some of its assets were worth much less than it had said. Lenders and trading partners began pulling away.


    That weekend, government officials, including Treasury Secretary Henry Paulson, met with bank leaders at the Federal Reserve Bank of New York to look for a rescue. Bank of America chose to buy Merrill Lynch instead. A deal with the British bank Barclays fell apart when British regulators would not approve it in time. The government decided not to put its own money in. Early on Monday, September 15, 2008, Lehman filed for bankruptcy, listing about $639 billion in assets and $613 billion in debts. That day the Dow Jones stock index fell more than 500 points. Within weeks, credit markets froze, and Congress passed a huge rescue plan for the banking system.


    Later, a court-appointed examiner, Anton Valukas, studied what went wrong. His 2010 report described an accounting move called Repo 105 that let Lehman temporarily shift about $50 billion off its books at the end of a quarter, making it look less indebted. He found enough evidence for possible legal claims against some former executives and Lehman''s auditor, though that was not a court ruling. CEO Richard Fuld said he did not know about the transactions. Federal prosecutors and the SEC ultimately brought no charges against Lehman''s leaders.


    The lesson reaches far beyond Wall Street. Being old and famous is not protection. When a business depends on borrowed money and on everyone''s confidence, it must be honest about its risks, because trust can vanish almost overnight.'
  timeline:
  - - '1844'
    - Henry Lehman opens a dry goods store in Montgomery, Alabama.
  - - 2003–2004
    - Lehman buys five mortgage lenders, including subprime specialists.
  - - Mar 2008
    - Rival Bear Stearns is sold to JPMorgan Chase with government backing.
  - - Jun 2008
    - After its first loss as a public company, Lehman raises $6 billion.
  - - Sept 10, 2008
    - Lehman reports a quarterly loss of about $3.9 billion.
  - - Sept 12–14, 2008
    - Weekend rescue talks fail; Bank of America buys Merrill Lynch instead.
  - - Sept 15, 2008
    - Lehman files for bankruptcy; the Dow falls more than 500 points.
  - - Mar 2010
    - Bankruptcy examiner's report describes Repo 105 accounting.
  numbers:
  - - Assets at bankruptcy (2008)
    - about $639 billion
  - - Debts at bankruptcy (2008)
    - about $613 billion
  - - Employees (2008)
    - about 25,000
  - - Real estate assets (end of 2007)
    - about $111 billion
  - - Repo 105 at end of Q2 2008
    - about $50 billion moved off the balance sheet
  lessons:
  - 'History is no shield: a 158-year track record could not save a firm that took too much risk.'
  - 'Short-term borrowing is fragile: if lenders lose faith, the money can disappear in days.'
  - 'Do not chase a falling market: Lehman added real estate bets after prices began to drop.'
  - 'Honest books build trust: accounting that makes things look better than they are hides danger.'
  questions:
  - Why did Lehman depend so much on other people's confidence?
  - Should the government have rescued Lehman, as it helped with Bear Stearns? What are the arguments on each side?
  - What is the difference between a business making a bad bet and a business hiding its risks?
  note: The examiner's report found 'colorable claims', meaning enough evidence that a court case could be brought, against some former executives and auditor Ernst & Young; it was not a court finding of wrongdoing. Richard Fuld denied knowing about Repo 105, and neither the SEC nor the Justice Department charged Lehman executives. Some sources date the firm's founding to 1844 (Henry Lehman's store) and others to 1850 (when it became Lehman Brothers). Barclays later bought Lehman's North American business, saving about 10,000 jobs.
  sources:
  - name: HISTORY.com, 'Lehman Brothers collapses' (This Day in History)
    url: https://www.history.com/this-day-in-history/september-15/lehman-brothers-collapses
  - name: Bloomberg, 'Lehman Files for Biggest Bankruptcy in U.S. After Suitors Balk' (2008)
    url: https://www.bloomberg.com/news/articles/2008-09-15/lehman-files-for-biggest-bankruptcy-in-u-s-after-suitors-balk
  - name: NBC News, 'Report details how Lehman hid its woes' (2010)
    url: https://www.nbcnews.com/id/wbna35828326
  - name: Newser, 'Why Lehman Brothers Wasn't Prosecuted' (2013)
    url: https://www.newser.com/story/173950/why-lehman-brothers-wasnt-prosecuted.html
- slug: chipotle-food-safety-2015
  title: Chipotle's Food-Safety Crisis
  company: Chipotle Mexican Grill
  year: 2015–2020
  industry: Restaurants
  tags:
  - Crisis
  - Operations
  - Ethics & trust
  summary: In 2015, outbreaks of E. coli and norovirus linked to Chipotle restaurants sickened hundreds of people and sent sales plunging. The company later admitted that workers had not followed its safety rules and paid a record $25 million federal fine in 2020.
  moral: A promise of fresh food is only as good as the hands that prepare it.
  story: 'Chipotle Mexican Grill built its reputation on a simple idea: fast food made with fresh, high-quality ingredients. Founded by chef Steve Ells, the chain grew quickly by promising customers better food than typical fast food. By 2015, it had become one of the most admired restaurant companies in America. Then customers started getting sick.


    In August 2015, at a Chipotle in Simi Valley, California, 234 customers and employees became ill with norovirus, a very contagious stomach virus. Federal prosecutors later said an employee who had vomited was sent home, but the illness was not reported inside the company as required, and safety steps were not taken until two days later.


    That fall, the problem grew much bigger. From October to December 2015, the Centers for Disease Control and Prevention, or CDC, tracked an outbreak of a type of E. coli bacteria among people who had eaten at Chipotle. In the end, 55 people in 11 states got sick, and 21 went to the hospital. A second, smaller E. coli outbreak sickened five more people in three states. Investigators never identified which ingredient was to blame. In December 2015, about 140 people, many of them Boston College students, got norovirus after eating food from a Chipotle near campus. Prosecutors said a sick employee had been told to keep working.


    The news coverage was enormous, and customers stayed away. Chipotle temporarily closed dozens of restaurants and announced new food-safety procedures, including more food testing. On February 8, 2016, it closed every restaurant for several hours to hold a national meeting with employees about food safety. The CDC said the E. coli outbreaks appeared to be over on February 1, 2016. But the damage was done. In the first three months of 2016, Chipotle''s revenue fell 23.4 percent to about $834.5 million, sales at restaurants open at least a year dropped 29.7 percent, and the company lost $26.4 million.


    The trouble did not end there. In July 2018, nearly 650 people got sick after eating at a Chipotle in Powell, Ohio, from bacteria that grow when food is not kept at the right temperature. In 2018, the company hired a new chief executive, Brian Niccol, and Steve Ells stepped back to become chairman.


    In April 2020, Chipotle settled federal criminal charges with the U.S. Justice Department. It was charged with two counts of serving adulterated, or contaminated, food. Under a deferred prosecution agreement, Chipotle agreed to pay a $25 million fine, the largest ever in a food-safety case, and to improve its safety program; the charges would be dropped if it complied. Prosecutors said more than 1,100 people were sickened in outbreaks from 2015 to 2018. The U.S. attorney said Chipotle "failed to ensure that its employees both understood and complied with its food safety protocols." The company admitted its sick-leave rules had not been properly enforced.


    The lesson is that rules on paper are not enough. Chipotle had safety policies, but sick workers still came in, and food was not always kept at safe temperatures. For any business that serves the public, safety has to be practiced every day, and workers need to feel able to stay home when they are sick.'
  timeline:
  - - Aug 2015
    - Norovirus at a Simi Valley, California, Chipotle sickens 234 people.
  - - Oct–Dec 2015
    - An E. coli outbreak linked to Chipotle sickens 55 people in 11 states.
  - - Dec 2015
    - About 140 people, many Boston College students, get norovirus near campus.
  - - Feb 1, 2016
    - The CDC says the E. coli outbreaks appear to be over.
  - - Feb 8, 2016
    - Chipotle closes all restaurants for several hours for a food-safety meeting.
  - - Apr 2016
    - Chipotle reports first-quarter sales down 29.7 percent at established restaurants.
  - - Jul 2018
    - Nearly 650 people are sickened at a Chipotle in Powell, Ohio.
  - - Apr 2020
    - Chipotle agrees to a record $25 million fine in a deferred prosecution agreement.
  numbers:
  - - E. coli outbreak (2015)
    - 55 sick in 11 states, 21 hospitalized
  - - Drop in sales at established restaurants (Q1 2016)
    - 29.7 percent
  - - Net loss (Q1 2016)
    - $26.4 million
  - - People sickened in outbreaks (2015–2018)
    - more than 1,100
  - - Federal fine (2020)
    - $25 million, the largest in a food-safety case
  lessons:
  - 'Policies must be practiced: a rule nobody follows protects no one.'
  - 'Make it safe to stay home: sick workers who feel they must come in can spread illness.'
  - 'Your brand is your promise: a company known for fresh food is hit hardest when food makes people sick.'
  - 'Trust takes years to win and days to lose: sales fell far faster than they recovered.'
  questions:
  - Why do you think sick employees kept working even though Chipotle had rules against it?
  - How should a company talk to customers during a crisis like this?
  - What everyday habits keep your family's kitchen, or a small food business, safe?
  note: The CDC never identified the specific food that caused the 2015 E. coli outbreaks. Counts for the Boston outbreak vary between reports (about 136 to 141 people). In the 2020 deferred prosecution agreement, Chipotle accepted the government's description of failures, including not enforcing sick-leave rules; the charges were to be dismissed if it complied.
  sources:
  - name: CDC, '2015 E. coli Outbreak Linked to Chipotle Mexican Grill Restaurants' (final update, 2016)
    url: https://archive.cdc.gov/www_cdc_gov/ecoli/2015/o26-11-15/index.html
