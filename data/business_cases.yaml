    url: https://www.dell.com:443/en-us/dt/corporate/about-us/who-we-are/timeline.htm
  - name: The Silicon Underground, 'History of Dell Computers'
    url: https://dfarq.homeip.net/history-of-dell-computers/
  - name: NBC News / AP, 'Dell to sell computers at Wal-Mart' (2007)
    url: https://www.nbcnews.com/news/amp/wbna18846045
  - name: PCWorld, 'Dell goes private, bought by Michael Dell and $2 billion from Microsoft' (2013)
    url: https://www.pcworld.com/article/2027157/dell-goes-private-bought-by-michael-dell-and-2-billion-from-microsoft.html
- slug: tata-nano
  title: 'Tata Nano: The Car Nobody Wanted to Be Seen In'
  company: Tata Motors
  year: 2008–2018
  industry: Automobiles
  tags:
  - Marketing
  - Innovation
  - Customers
  summary: Tata Motors set out to build a safe, affordable car for Indian families who were riding four to a motorbike, and in 2008 it unveiled the Nano at about 100,000 rupees (about $2,500). Factory troubles,
    early fires and a "cheapest car" image kept buyers away, and production stopped in 2018.
  moral: Low price opens a market only if the product also meets customers' social and emotional needs; positioning, distribution and operational risks can sink even a technically successful product.
  story: 'Ratan Tata, chairman of India''s giant Tata Group, said he was moved by a common sight on Indian roads: whole families, sometimes four people, squeezed onto one motorbike, even in pouring monsoon
    rain. He wanted to build a "people''s car" that those families could afford, and he publicly promised it would cost about 100,000 rupees, also called one lakh.


    On January 10, 2008, at the auto show in New Delhi, Tata Motors unveiled the Nano. The price was 100,000 rupees before taxes, about $2,500 at the time, roughly half the price of India''s cheapest car
    then. Engineers had cut costs everywhere: a small engine in the back, a top speed of about 65 miles per hour, and in the basic model no air conditioning, power steering or electric windows. Tata kept
    his price promise even though steel and other costs had risen during the four years of development. Newspapers around the world called it "the world''s cheapest car."


    Then came trouble. Tata had chosen to build the Nano factory in Singur, in the state of West Bengal, on about 997 acres of farmland the state government had acquired. Many farmers said their land had
    been taken unfairly, and opposition politicians led months of protests. On October 3, 2008, Tata announced it was leaving Singur. It moved production to Sanand, in the state of Gujarat, but the move
    delayed the car and cost money. In 2016, India''s Supreme Court ruled the land acquisition illegal and ordered the land returned to its owners.


    At first, demand looked strong. In April 2009 Tata took more than 203,000 bookings for the Nano in about two weeks, and deliveries began that July. But then several Nanos caught fire in 2010. Tata said
    the car''s design was not the cause and blamed extra electrical parts fitted near the exhaust, but it extended the warranty to four years to reassure buyers. The damage to the car''s image was done.


    The biggest problem may have been the word "cheapest." For many families a first car is a sign of moving up in the world, and observers argued that few buyers wanted to be seen in a car known mainly
    for being cheap. A former auto executive told Business Today that presenting the Nano as cheap rather than innovative was "not the right brand statement." Sales peaked at about 74,500 in the 2011–2012
    business year, far below the factory''s capacity of tens of thousands per month. In January 2012 Ratan Tata admitted, "I don''t think we were adequately ready with an advertising campaign and a dealer
    network." In 2015 he said that marketing the Nano as "cheap" rather than "affordable" had been a mistake.


    Tata tried upgrades, including a better-equipped GenX Nano in 2015, but sales kept falling. By June 2018 the plant built just one Nano, and production soon ended. The Nano was a remarkable piece of
    engineering and a sincere attempt to help families.

    '
  timeline:
  - - '2006'
    - Tata announces the Nano will be built in Singur, West Bengal.
  - - Jan 10, 2008
    - Nano unveiled in New Delhi at 100,000 rupees (about $2,500) before tax.
  - - Oct 3, 2008
    - Tata pulls out of Singur after land protests; production moves to Sanand, Gujarat.
  - - Apr 2009
    - More than 203,000 bookings in about two weeks.
  - - July 2009
    - First deliveries to customers.
  - - '2010'
    - Several Nano fires; Tata extends the warranty to four years.
  - - 2011–2012
    - Sales peak at about 74,500 cars in one business year.
  - - June 2018
    - Only one Nano is built; production soon ends.
  numbers:
  - - Launch price before tax (2008)
    - 100,000 rupees, about $2,500
  - - Bookings (April 2009)
    - more than 203,000
  - - Best year of sales (fiscal 2011–12)
    - about 74,527
  - - Monthly production capacity vs. sales (Nov 2012)
    - about 21,000 vs. about 3,500
  - - Nanos built in June 2018
    - '1'
  lessons:
  - 'Positioning and customer identity: The Nano was marketed as the world''s cheapest car at 100,000 rupees, about $2,500. For many buyers a first car signals social progress, and few wanted a car known
    mainly for being cheap. Christensen''s jobs-to-be-done framework includes social and emotional jobs, not only functional ones. Price positioning can undermine the purchase motivation it was meant to
    serve.'
  - 'Bottom-of-pyramid markets: Prahalad''s work argued that low-income markets can be profitable if products are redesigned for affordability. Tata cut costs through a rear engine, few features and a public
    price commitment. Engineering for affordability is necessary but not sufficient. Distribution, financing and brand matter as much at the bottom of the market.'
  - 'Site selection and political risk: The Singur plant, on about 997 acres of acquired farmland, faced protests, and Tata left in October 2008. Production moved to Sanand, delaying launch. India''s Supreme
    Court later ruled the acquisition illegal. Stakeholder and land-rights risk should be part of site selection, not handled afterward.'
  - 'Demand signals and capacity: More than 203,000 bookings in April 2009 suggested strong demand, but the best sales year reached about 74,500. By November 2012 capacity was about 21,000 per month against
    sales of about 3,500. Bookings are not purchases. Capacity should be phased in step with confirmed demand.'
  - 'Product safety perception: Several Nanos caught fire in 2010. Tata denied a design flaw but extended the warranty to four years. For a low-price product, buyers already worry about quality, so any
    safety incident confirms their fears. Ratan Tata later admitted shortcomings in advertising and dealer readiness, and called the "cheap" message a mistake.'
  questions:
  - You are Tata's marketing head in 2007. Rewrite the Nano's positioning so that price is not the main message. What would you emphasize and why?
  - Using the capacity and sales figures, estimate how underused the Sanand plant was in late 2012. What should Tata have done with that capacity?
  - Ratan Tata publicly committed to a 100,000-rupee price. Did that commitment help or hurt the project?
  - Which current low-cost products in emerging markets have succeeded where the Nano failed, and what did they do differently?
  note: The exact end date of production is reported differently; Tata said in mid-2018 that no decision had been taken, though output had nearly stopped. Tata Motors denied that a design flaw caused the
    2010 fires. In 2023 an arbitration panel awarded Tata Motors about 766 crore rupees plus interest for its Singur losses.
  sources:
  - name: IndustryWeek / AFP, 'Tata Unveils World's Cheapest Car' (2008)
    url: https://www.industryweek.com/leadership/companies-executives/article/21956428/tata-unveils-worlds-cheapest-car
  - name: Autocar Professional, 'Nano gets 2.03 lakh bookings' (2009)
    url: https://www.autocarpro.in/news-national/nano-203-lakh-bookings-425
  - name: 'Business Today, ''Tata Nano: A blemish on Ratan Tata''s brilliant record'' (2013)'
    url: https://www.businesstoday.in/opinion/perspective/story/tata-nano-a-blemish-on-ratan-tata-brilliant-record-38746-2013-01-28
  - name: 'Gardner Business Media, ''Tata: Branding Nano as Cheap Was a Mistake'' (2015)'
    url: https://www.gardnerweb.com/news/tata-branding-nano-as-cheap-was-a-mistake
