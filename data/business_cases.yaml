- slug: starbucks-schultz-returns-2008
  title: Starbucks Closes Its Doors to Learn to Make Coffee
  company: Starbucks
  year: '2008'
  industry: Restaurants & coffee
  tags:
  - Leadership
  - Customers
  - Culture & people
  summary: After years of racing to open stores, Starbucks found that its coffee and its shop experience were slipping and customers were coming less often. Founder-leader Howard Schultz returned as CEO
    in 2008, closed about 7,100 U.S. stores for an evening to retrain baristas, and later shut hundreds of stores that should never have opened.
  moral: Growth that outpaces the capabilities behind a premium brand erodes the brand itself; restoring it requires cutting growth, closing recent mistakes and reinvesting visibly in the core experience.
  story: 'Howard Schultz built Starbucks from a small Seattle coffee seller with four stores in 1982 into one of the best-known brands in the world. He was chief executive until 2000 and then stayed on
    as chairman. Through the mid-2000s, Starbucks opened new stores at an amazing pace, aiming for 40,000 locations someday. By early 2008 it had more than 15,000.


    But Schultz worried that something important was being lost along the way. In a memo dated February 14, 2007, he warned the company''s leaders about a "watering down of the Starbucks experience." He
    pointed to choices that had made sense one at a time, like faster automatic espresso machines and bagged coffee, but that together made stores feel less like a special coffeehouse and more like a chain.
    The memo leaked to the press, and Starbucks confirmed it was real.


    By the end of 2007, fewer customers were visiting, and rivals such as McDonald''s and Dunkin'' Donuts were selling cheaper coffee drinks. Starbucks'' stock had fallen by about half in a year. On January
    7, 2008, the board announced that Schultz would return as chief executive, replacing Jim Donald. The company said it would slow its U.S. store openings and close some stores that weren''t doing well.


    Schultz''s most famous move came a few weeks later. On the evening of February 26, 2008, about 7,100 company-run Starbucks stores across the United States locked their doors at 5:30 p.m. for about three
    hours. Roughly 135,000 workers stayed inside for training on how to pull a proper espresso shot and steam milk the right way. Closing every store at once cost the company sales, and some critics called
    it a publicity stunt. But it sent a clear message to customers and employees alike. "Tonight is about making sure our baristas have what they need," Schultz said.


    The hardest decisions came next. In July 2008, Starbucks said it would close 600 U.S. stores, far more than the 100 it had planned earlier, affecting about 12,000 workers. About seven in ten of those
    stores had opened since the start of 2006. The company expected charges of more than $300 million. Admitting that so many recent stores had been mistakes was painful, and it happened just as the U.S.
    economy fell into a deep recession.


    Schultz kept working on the basics: better coffee, a calmer store experience, and fewer, better new stores. Starbucks cut its plan for new company-run stores in fiscal 2009 in half, to fewer than 200,
    a huge change for a company that had recently been opening thousands a year. The results took time but did come. In November 2010, Starbucks reported record earnings for its fourth quarter, with profits
    up 86 percent from a year earlier. Schultz called the year "a defining year" for the company.

    '
  timeline:
  - - Feb 14, 2007
    - Schultz writes a memo warning about a 'watering down of the Starbucks experience'; it later leaks.
  - - Jan 7, 2008
    - Schultz returns as CEO, replacing Jim Donald; Starbucks plans to slow U.S. openings.
  - - Feb 26, 2008
    - About 7,100 U.S. stores close for about three hours so roughly 135,000 workers can retrain.
  - - July 1, 2008
    - Starbucks says it will close 600 U.S. stores, affecting about 12,000 workers.
  - - Fiscal 2009
    - Company-run store openings are cut in half, to fewer than 200.
  - - Nov 2010
    - Starbucks reports record fourth-quarter earnings, with profits up 86 percent.
  numbers:
  - - U.S. stores closed for retraining (Feb 2008)
    - about 7,100
  - - Workers retrained that evening
    - about 135,000
  - - U.S. stores closed for good (announced July 2008)
    - '600'
  - - Expected charges for closures (2008)
    - about $328 million to $348 million
  - - Fourth-quarter profit growth (2010)
    - up 86 percent from a year earlier
  lessons:
  - 'The growth trap: In "What Is Strategy?" (1996), Porter warns that the pursuit of growth can blur a company''s distinctive position through small compromises. Schultz''s 2007 memo described this: faster
    espresso machines and bagged coffee each made sense alone, but together they made stores feel like a chain. With more than 15,000 stores and a 40,000 goal, scale was undermining the premium experience.'
  - 'Ignore sunk costs when cutting units: In July 2008 Starbucks said it would close 600 U.S. stores, far more than the 100 planned earlier, with charges of more than $300 million. About seven in ten had
    opened since the start of 2006. Recent investments are not sacred. Units should be judged on forward-looking returns, and a cluster of recent failures should trigger a review of site selection and approval.'
  - 'Costly signals are credible signals: Closing about 7,100 U.S. stores for about three hours to retrain roughly 135,000 workers cost real sales, and critics called it a stunt. It was both training and
    a message. Because the gesture was expensive and public, employees and customers had reason to believe the quality focus was serious. Leaders can use visible, costly commitments to show a change in
    priorities.'
  - 'Competitive pressure on a premium position: By late 2007 traffic was falling and McDonald''s and Dunkin'' Donuts were selling cheaper coffee drinks, just before a deep recession. A premium brand is
    most exposed when rivals offer a good-enough product at lower prices and customers become price-sensitive. The defense is a clearly better experience, not matching price, which is why Schultz focused
    on coffee quality and store atmosphere.'
  - 'Attribute results carefully: In November 2010 Starbucks reported record fourth-quarter earnings, with profit up 86 percent from a year earlier. That comparison was against a recession-hit year that
    included closure costs, and the economy was recovering. Turnaround performance should be judged on several metrics and against the cycle, so leaders and boards learn which decisions actually worked.'
  questions:
  - 'It is January 2008 and you are returning as CEO with the stock down about half in a year. Which comes first: slowing openings, closing weak stores or fixing the in-store experience? What will you tell
    investors about growth targets?'
  - About seven in ten of the 600 closed stores had opened since the start of 2006. What does that suggest about how sites were being approved, and what controls would you add to the expansion process?
  - The three-hour closure of about 7,100 stores cost sales and drew criticism. Outline how you would estimate its cost and its benefits, and argue whether it was worth it.
  - Profits rose 86 percent in the fourth quarter of 2010 as the economy recovered. How would you separate the effect of management's decisions from the business cycle?
  note: Some observers at the time called the 2008 training closure a public-relations stunt; it was both a real training session and a highly visible message. The turnaround also overlapped with the 2008–2009
    recession, so not every change in results can be traced to Schultz's decisions. Schultz stepped down as CEO again in 2017, returned on an interim basis in 2022, and left again in 2023.
  sources:
