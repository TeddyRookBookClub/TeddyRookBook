    url: https://en.wikipedia.org/wiki/Tata_Nano_Singur_controversy
- slug: hershey-town-school-trust
  title: 'Milton Hershey: Chocolate, a Town and a School'
  company: Hershey Chocolate Company (The Hershey Company)
  year: 1903–present
  industry: Food and candy
  tags:
  - Leadership
  - Ethics & trust
  - Culture & people
  summary: Milton Hershey built a chocolate factory and a whole town around it, then gave his fortune to a school for children in need. The trust he created still controls the Hershey Company, which has shaped every major decision about the company's future.
  moral: Success is measured by what you build for others, not just what you keep.
  story: 'Milton Hershey was born in 1857 in central Pennsylvania. He was fired from his first job as a teenager, and by age 25 his first candy businesses had failed. He kept going. His Lancaster Caramel Company became a big success, and in 1893, at the World''s Fair in Chicago, he bought German chocolate-making machines. In 1900 he sold the caramel business for $1 million and bet everything on milk chocolate.


    In 1903 Hershey broke ground on a chocolate factory near the village of Derry Church. Instead of just building a factory, he built a town around it. He oversaw the building of comfortable homes for workers, good public schools, public transportation, parks, and in 1907 the park that later became Hersheypark. The town took the name Hershey. The factory was profitable almost from the start, and its earnings kept growing.


    Milton and his wife, Catherine, were never able to have children. In 1909 they signed a deed of trust creating the Hershey Industrial School, a home and school for orphaned boys who would learn a trade. Hershey later explained, "I have no heirs," so he decided the orphan boys of the country would be his heirs. Then, in November 1918, he quietly placed all of his shares in the Hershey Chocolate Company into a trust for the school. The shares were worth roughly $60 million at the time. The public did not learn about the gift until 1923.


    During the Great Depression of the 1930s, when millions of Americans were out of work, Hershey started a building program in his town. More than 600 men were hired to build a hotel, a community building, a sports arena, a theater and a high school. In 1935 he also set up the M. S. Hershey Foundation to support education and culture in the town. He died in 1945. Years later, in 1963, $50 million from the school trust was used to help create the Milton S. Hershey Medical Center.


    The school, now called Milton Hershey School, grew far beyond its beginnings. Today it serves more than 2,100 students from pre-kindergarten through 12th grade, girls and boys from families with limited means, and it covers all their costs, including housing, meals, clothing and health care. The trust that funds it is worth many billions of dollars.


    Because the trust holds controlling voting power over The Hershey Company, Milton Hershey''s gift still shapes the company. In 2002 the trust''s board explored selling its controlling stake, and the chewing-gum maker Wrigley reportedly offered about $12.5 billion. Townspeople and employees protested, fearing job losses. Pennsylvania''s attorney general went to court and won an order blocking the sale while its effects were studied, and the board called off the sale. In 2016 Hershey also turned down a roughly $23 billion offer from snack company Mondelez.


    Tying a charity''s fortune so closely to one company brings both strengths and risks. But Hershey''s choice remains a remarkable example of a business owner deciding that his company''s purpose was bigger than making him rich. His factory, his town and his school are still connected more than a hundred years later.'
  timeline:
  - - '1857'
    - Milton Hershey is born in Pennsylvania.
  - - '1900'
    - He sells his caramel company for $1 million.
  - - '1903'
    - He breaks ground on a chocolate factory near Derry Church, Pennsylvania.
  - - '1909'
    - Milton and Catherine Hershey create the Hershey Industrial School for orphan boys.
  - - Nov 1918
    - Hershey gives all his company shares, worth about $60 million, to a trust for the school.
  - - 1930s
    - Depression-era building program employs more than 600 men in Hershey.
  - - '1945'
    - Milton Hershey dies.
  - - '2002'
    - Planned sale of the trust's controlling stake is blocked in court and called off.
  numbers:
  - - Sale price of caramel company (1900)
    - $1 million
  - - Value of shares given to the school trust (1918)
    - about $60 million
  - - Wrigley's reported offer (2002)
    - about $12.5 billion
  - - Students at Milton Hershey School (2020s)
    - more than 2,100
  lessons:
  - 'Failure is not final: Hershey''s early businesses failed before his big success.'
  - 'Build community: a business can lift the town around it.'
  - 'Plan your legacy: decisions about ownership can protect a mission for generations.'
  - 'Purpose can outlast profit: a company''s reason for being can be bigger than its founder''s wealth.'
  questions:
  - Why do you think Hershey built a whole town instead of just a factory?
  - Should a charity own a controlling share of a company? What are the risks and benefits?
  - If you owned a successful business, what would you want it to do after you're gone?
  note: The trust holds a controlling share of the votes in The Hershey Company, though it owns a smaller share of the total stock; news reports describe its stake differently. The $12.5 billion Wrigley figure was reported by the press; the deal was never completed. The school, once only for orphan boys, now serves girls and boys from low-income families.
