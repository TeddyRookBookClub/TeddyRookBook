cases:
- slug: tylenol-1982
  title: Johnson & Johnson and the Tylenol Recall
  company: Johnson & Johnson
  year: '1982'
  industry: Health products
  tags:
  - Crisis
  - Ethics & trust
  - Leadership
  summary: In the fall of 1982, seven people in the Chicago area died after taking Extra-Strength Tylenol capsules that someone had laced with cyanide. Johnson & Johnson pulled about 31 million bottles off shelves nationwide, at a cost of about $100 million, and brought Tylenol back in safer packaging. It is still the classic example of a company putting customer safety ahead of short-term profit and winning back trust.
  moral: When people's safety is on the line, do the right thing first and count the cost later.
  story: 'In 1982, Tylenol was one of the most trusted products in America. It was the best-selling pain reliever in the country, with roughly 35 percent of a market worth about $1.2 billion a year. It was made by McNeil Consumer Products, a part of Johnson & Johnson, often called J&J.


    Then, starting on September 29, 1982, people in the Chicago area began dying suddenly. The first was a 12-year-old girl named Mary Kellerman. Within three days, seven people were dead, including three members of one family. Investigators found that all of them had taken Extra-Strength Tylenol capsules that had been filled with cyanide, a deadly poison. Someone had tampered with bottles sold in Chicago-area stores. J&J had not put the poison there, but its name was on every bottle.


    J&J''s chief executive, James Burke, had to decide what to do fast, with very little information. The poisonings seemed to be limited to the Chicago area. Some advisers worried that a giant recall would make the problem look bigger and might destroy the brand forever. J&J first had its sales force pull about 264,000 bottles from Chicago-area stores. Then, on October 5, 1982, it went much further and recalled Tylenol capsules across the whole country: about 31 million bottles, worth roughly $100 million at the time. It told people to stop using the capsules and offered to exchange them for a safe product. Burke also worked openly with the FBI, the Food and Drug Administration, and the news media instead of hiding.


    Burke later said the company''s Credo helped him decide. The Credo is a one-page statement of values written in 1943 by Robert Wood Johnson, the company''s longtime leader. It lists the people J&J is responsible to, starting with the doctors, nurses, patients, and families who use its products, then employees, then communities, and only last the stockholders. Burke said the Credo gave him "the ammunition I needed" to persuade shareholders and others to spend the money on the recall. In other words, the hard choice had been made years earlier, when the company wrote down what it cared about most.


    The damage was real. Tylenol''s share of the pain-reliever market crashed to about 7 percent. Many people, even inside the company, thought the brand was finished. But J&J used the pause to make the product safer. On November 11, 1982, it showed off new tamper-resistant packaging with three layers of protection: glued box flaps, a plastic seal around the cap, and a foil seal over the mouth of the bottle. Tylenol came back to stores within weeks. By about a year later, its share had climbed back to around 30 percent.


    The crisis changed the whole industry. Sealed caps and foil liners became normal on medicines and many foods. In 1983, Congress passed a law that made tampering with consumer products a federal crime. Sadly, the person who poisoned the capsules has never been caught. A man named James Lewis was convicted of sending J&J a letter demanding $1 million to "stop the killing," but he was never charged with the murders.


    The Tylenol story is taught in business schools because it shows that trust is a company''s most valuable possession. J&J lost a lot of money in the short run. In return, it kept the faith of millions of customers, and that faith kept Tylenol alive.'
  timeline:
  - - Sept 29, 1982
    - The first victims die in the Chicago area after taking poisoned Extra-Strength Tylenol capsules.
  - - Oct 1, 1982
    - The seventh and last victim is found; the deaths are linked to Tylenol.
  - - Early Oct 1982
    - J&J's sales force pulls about 264,000 bottles from Chicago-area stores and warns the public.
  - - Oct 5, 1982
    - J&J recalls Tylenol capsules nationwide, about 31 million bottles.
  - - Nov 11, 1982
    - J&J unveils new triple-sealed, tamper-resistant packaging.
  - - '1983'
    - Congress makes tampering with consumer products a federal crime; Tylenol's market share climbs back toward 30 percent.
  numbers:
  - - People killed (1982)
    - '7'
  - - Bottles recalled nationwide (1982)
    - about 31 million
  - - Value of recalled product (1982)
    - about $100 million
  - - Tylenol market share
    - about 35% before, about 7% after the deaths, about 30% roughly a year later
  lessons:
  - 'Put people first: protecting customers'' safety mattered more than protecting one year''s sales.'
  - 'Decide your values before the storm: a written set of priorities makes a hard choice clearer when there''s no time to think.'
  - 'Be open in a crisis: working with police, regulators and reporters built trust instead of suspicion.'
  - 'Turn a problem into an improvement: the new sealed package made the product safer than before.'
  questions:
  - J&J did not cause the poisonings. Why do you think it still accepted the cost of a nationwide recall?
  - If your family business had a one-page 'credo,' what would be first on the list, and what would be last?
  - What everyday products in your home have safety seals today, and how might this story explain why?
  note: Sources differ slightly on Tylenol's pre-crisis market share (about 35% in Wharton's account, 37% in others). The Credo was written in 1943 by Robert Wood Johnson, according to J&J; it was not written at the company's founding. The murders remain officially unsolved. James Lewis served prison time for the extortion letter only and always denied any role in the poisonings. Exactly how calm and fast J&J's early decisions were has been polished over decades of retelling, but the recall, its size and its cost are well documented.
  sources:
  - name: Knowledge at Wharton, 'Tylenol and the Legacy of J&J's James Burke' (2012)
    url: https://knowledge.wharton.upenn.edu/article/tylenol-and-the-legacy-of-jjs-james-burke/
  - name: Johnson & Johnson, '8 Fun Facts About Our Credo'
    url: https://www.jnj.com/our-heritage/8-fun-facts-about-the-johnson-johnson-credo
  - name: 'Retail Brew, ''Total recall: How the Tylenol murders of 1982 ushered in tamper-resistant packaging'' (2022)'
    url: https://retailbrew.com/stories/2022/10/13/total-recall-how-the-tylenol-murders-of-1982-ushered-in-tamper-resistant-packaging
  - name: NPR, 'FBI Searches Home in Review of '82 Tylenol Deaths' (2009)
    url: https://www.npr.org/2009/02/04/100268518/fbi-searches-home-in-review-of-82-tylenol-deaths
  - name: Interesting Engineering, 'Tamper-resistant packaging began in 1982 with 7 still-unsolved murders'
    url: https://interestingengineering.com/innovation/tamper-resistant-packaging-began-in-1982-with-7-still-unsolved-murders
- slug: new-coke-1985
  title: Coca-Cola and New Coke
  company: The Coca-Cola Company
  year: '1985'
  industry: Food & beverages
  tags:
  - Customers
  - Marketing
  - Strategy
  summary: In April 1985, Coca-Cola replaced its 99-year-old recipe with a sweeter "New Coke" after nearly 200,000 taste tests said people liked it better. Loyal fans were furious, and just 79 days later the company brought back the original as "Coca-Cola Classic." The story shows that customers buy feelings and memories, not just flavors, and that admitting a mistake quickly can save a brand.
  moral: A taste test measures the tongue; loyalty lives in the heart.
  story: 'For most of the 1900s, Coca-Cola was the best-selling soft drink in the world. But by the early 1980s, its lead over Pepsi had been slipping for about 15 years in a row. Pepsi ran a famous advertising campaign called the Pepsi Challenge, where people took a sip of two unlabeled colas and picked the one they liked. Many picked Pepsi, which is sweeter. Coca-Cola''s own private tests found the same thing. Its leaders, including chairman Roberto Goizueta and president Donald Keough, decided the problem might be the taste itself.


    So the company''s scientists worked on a new, sweeter formula. Coca-Cola tested it on nearly 200,000 people. In blind tests, where people did not know which brand they were drinking, the new recipe beat both Pepsi and the old Coke. On paper, the decision looked safe. On April 23, 1985, the company announced the first change to its recipe in 99 years. Goizueta called it "the surest move ever made." Pepsi gave its employees a day off to celebrate and ran ads saying the other guy had "blinked."


    What the taste tests had not measured was how people felt about Coke. To millions of Americans, Coca-Cola was part of childhood, holidays, baseball games and family memories. Changing it felt like someone had changed a piece of their history without asking. Angry phone calls poured in. Coca-Cola''s own records say its hotline went from about 400 calls a day to about 1,500 a day by June; other accounts put the number of angry calls much higher. The company received tens of thousands of letters. One was addressed to "Chief Dodo, The Coca-Cola Company." People stocked up on old Coke, some buying hundreds of bottles, and a protest group called Old Cola Drinkers of America formed. The consumer-service team grew from about a dozen people to 180 almost overnight to keep up.


    Coca-Cola''s leaders had a choice. They could insist they were right, because the data said so, or they could listen. They listened. On July 11, 1985, just 79 days after New Coke launched, the company held a press conference to apologize and announce that the original formula was coming back as "Coca-Cola Classic." Keough told reporters that the company''s boss was the consumer. News programs interrupted regular shows to report it, and in the two days after the announcement the hotline took more than 31,600 calls.


    Coca-Cola Classic quickly outsold New Coke and, within months, was again the top-selling sugar cola, ahead of Pepsi. New Coke stayed on shelves for years, was renamed Coke II in 1990, and was finally discontinued in 2002.


    Some people later suggested the whole thing was a clever plan to make people fall in love with Coke again, but there is no evidence for that. Ten years later, Goizueta described it as a case of "taking intelligent risks." Whatever the intent, the result was a powerful lesson: Coca-Cola had studied what customers tasted, but it had not studied what they valued. And when it found out, it had the humility to change course fast.'
  timeline:
  - - Early 1980s
    - Coca-Cola's lead over Pepsi has been slipping for about 15 years; the Pepsi Challenge favors Pepsi's sweeter taste.
  - - 1984–1985
    - Coca-Cola tests a new, sweeter formula with nearly 200,000 consumers.
  - - Apr 23, 1985
    - Coca-Cola announces New Coke, the first recipe change in 99 years.
  - - May–June 1985
    - Angry calls and letters pour in; the consumer-service team grows from about 12 to 180 people.
  - - July 11, 1985
    - The company apologizes and brings back the original formula as Coca-Cola Classic.
  - - '1990'
    - New Coke is renamed Coke II.
  - - '2002'
    - Coke II is discontinued.
  numbers:
  - - Consumers in taste tests (1984–85)
    - nearly 200,000
  - - Age of the original recipe (1985)
    - 99 years
  - - Days New Coke was the only Coke (1985)
    - '79'
  - - Hotline calls in two days after Classic's return (July 1985)
    - more than 31,600
  lessons:
  - 'Know what you are really selling: Coke''s customers were buying tradition and memories, not just a flavor.'
  - 'Data can answer the wrong question: blind sips did not ask, ''How would you feel if we took the old one away?'''
  - 'Listen to loud customers: the angry calls were valuable information, not just noise.'
  - 'Admit mistakes quickly: reversing in 79 days limited the damage and won back goodwill.'
  questions:
  - Is there a product, place or tradition you would be upset to see changed, even if the new version were 'better'? Why?
  - How could Coca-Cola have tested the idea in a way that revealed people's feelings before the launch?
  - Was bringing back the old formula a sign of weakness or of strength? Explain your answer.
  note: 'Call-volume figures differ by source: Coca-Cola''s archives cite about 1,500 hotline calls a day by June 1985, while History.com reports 5,000 to 8,000 a day; the story uses the company''s own lower figure. The theory that New Coke was a deliberate marketing trick is popular, but there is no evidence for it. The often-quoted Keough line "we''re not that dumb, and we''re not that smart" could not be verified in the sources used here and is left out.'
  sources:
  - name: 'The Coca-Cola Company, ''New Coke: The Most Memorable Marketing Blunder Ever?'''
    url: https://www.coca-colacompany.com/about-us/history/new-coke-the-most-memorable-marketing-blunder-ever
  - name: The Coca-Cola Company, 'Veteran Employees Remember Infamous 1985 Launch of New Coke' (2015)
    url: https://www.coca-colacompany.com/about-us/history/the-infamous-1985-launch-of-new-coke
  - name: History.com, 'Why Coca-Cola's "New Coke" Flopped'
    url: https://www.history.com/articles/why-coca-cola-new-coke-flopped
  - name: History.com, 'New Coke debuts in one of the biggest product flops in history'
    url: https://www.history.com/this-day-in-history/new-coke-debuts-one-of-the-biggest-product-flops-in-history
- slug: netflix-blockbuster
  title: Netflix, Blockbuster and the Offer That Was Turned Down
  company: Netflix and Blockbuster
  year: 2000–2010
  industry: Entertainment & retail
  tags:
  - Strategy
  - Innovation
  - Customers
  summary: In 2000, the founders of a small, money-losing DVD-by-mail company called Netflix offered to sell it to Blockbuster, the giant of video rental, for $50 million. Blockbuster said no. Ten years later, Blockbuster filed for bankruptcy while Netflix had about 20 million subscribers, a reminder that today's leader can miss the change that matters most.
  moral: The giant who laughs at the little newcomer may one day be looking up at it.
  story: 'In the 1990s, renting a movie usually meant driving to a Blockbuster store. At its peak, Blockbuster had about 9,000 locations and around $6 billion a year in revenue. It also made a lot of money from late fees, the charges you paid for bringing a movie back late. In 2000 alone, those fees brought in about $800 million.


    Netflix started much smaller. It launched in 1998, renting DVDs by mail from a website. Co-founder Reed Hastings has said one spark for the idea was a $40 late fee he got from Blockbuster. Netflix soon switched to a monthly subscription: you paid one price, kept movies as long as you liked, and never paid a late fee.


    In 2000, Netflix was losing money, and the dot-com bubble was bursting. Hastings and co-founder Marc Randolph met with Blockbuster''s leaders, including CEO John Antioco. Their pitch: Blockbuster could buy Netflix for $50 million, and Netflix would run Blockbuster''s online business. Blockbuster turned them down. Netflix''s former finance chief, Barry McCarthy, later said Blockbuster "laughed us out of their office." From Blockbuster''s point of view at the time, this was understandable. Netflix was tiny and unprofitable, and most customers still went to stores. Few people in 2000 could picture renting movies without ever leaving home, and Blockbuster''s leaders had a huge, successful business to run.


    Netflix kept growing anyway. It passed 1 million subscribers within about three years of that meeting and reached 6 million by the end of 2006. Blockbuster did eventually respond, and it fought harder than many people remember. In 2004 it launched Blockbuster Online, which gained more than a million subscribers in under a year. In 2006 it added "Total Access," which let online customers return DVDs at stores and get a free movie. It worked so well that in one 2007 quarter Netflix actually lost 55,000 subscribers. But each in-store swap cost Blockbuster about $2, and the company was carrying about $1 billion of debt from when it separated from its former owner, Viacom, in 2004.


    Then the leadership changed. In 2007, after a dispute with investor Carl Icahn over his pay, Antioco left. The new CEO, James Keyes, pulled back from the costly online push and focused on the stores again. Meanwhile, Netflix began streaming movies over the internet in 2007, a change that would make both DVDs and video stores far less important.


    On September 23, 2010, Blockbuster filed for bankruptcy protection. It had about 3,000 U.S. stores left and listed about $1.46 billion in debts. That same year, Netflix reached about 20 million subscribers and began expanding to other countries. Years later, only one Blockbuster store remained, in Bend, Oregon.


    It is tempting to say that Netflix simply "killed" Blockbuster, but the true story is more interesting. Blockbuster saw the threat, built a strong answer, and for a while was winning. What sank it was a mix of heavy debt, a business that depended on fees customers hated, and a change of leaders who stepped back from the future just as it was arriving.'
  timeline:
  - - '1998'
    - Netflix launches as a DVD-rental website.
  - - '2000'
    - Hastings and Randolph offer to sell Netflix to Blockbuster for $50 million; Blockbuster declines.
  - - '2004'
    - Blockbuster launches Blockbuster Online after its spin-off from Viacom leaves it with about $1 billion in debt.
  - - '2006'
    - Blockbuster's 'Total Access' lets online customers return DVDs to stores; Netflix reaches 6 million subscribers.
  - - '2007'
    - Antioco leaves Blockbuster after a pay dispute with investor Carl Icahn; Netflix starts streaming.
  - - Sept 23, 2010
    - Blockbuster files for bankruptcy protection.
  numbers:
  - - Price Netflix asked from Blockbuster (2000)
    - $50 million
  - - Blockbuster late-fee revenue (2000)
    - about $800 million
  - - Blockbuster debts in bankruptcy filing (2010)
    - about $1.46 billion
  - - Netflix subscribers (2010)
    - about 20 million
  lessons:
  - 'Don''t judge a newcomer by its size: small companies with a better idea for customers can grow fast.'
  - 'Beware profits customers resent: late fees made money but gave customers a reason to leave.'
  - 'Debt limits your choices: a heavily borrowed company has less room to invest in the future.'
  - 'Stick with the hard change: Blockbuster''s online push was working before new leaders pulled back.'
  questions:
  - If you ran Blockbuster in 2000, would you have bought Netflix for $50 million? What would have worried you?
  - Can you think of a business today that earns money from something customers dislike? What could replace it?
  - Why might a new leader choose to protect an old business instead of building a new one?
  note: The $50 million offer and the 2000 meeting are reported by Netflix insiders; Blockbuster's side has been told differently in some accounts, and nobody disputes that Blockbuster declined. Popular retellings often say Blockbuster ignored the internet, but it built a real online service that briefly hurt Netflix. Exact store and revenue peaks vary by source.
  sources:
  - name: CNBC, 'How Netflix almost lost the movie rental wars to Blockbuster' (2020)
    url: https://www.cnbc.com/2020/09/22/how-netflix-almost-lost-the-movie-rental-wars-to-blockbuster.html
  - name: Christian Science Monitor / AP, 'Bankruptcy protection filed by Blockbuster' (2010)
    url: https://csmonitor.com/Business/Latest-News-Wires/2010/0923/Bankruptcy-protection-filed-by-Blockbuster
  - name: Quartz, 'Netflix launched streaming video 10 years ago' (2017)
    url: https://qz.com/887010/netflix-nflx-launched-streaming-video-10-years-ago-and-changed-the-way-we-watch-everything
- slug: kodak-digital-camera
  title: Kodak and the Digital Camera It Invented
  company: Eastman Kodak
  year: 1975–2012
  industry: Photography
  tags:
  - Innovation
  - Strategy
  summary: In 1975, a young Kodak engineer named Steven Sasson built the first known self-contained digital camera. Kodak patented it but did not turn it into a product, because film was its money-maker. In January 2012, with digital photography everywhere, Kodak filed for bankruptcy, a famous lesson about protecting an old business instead of embracing the new one.
  moral: If you won't replace your own best product, someone else will do it for you.
  story: 'For most of the 20th century, Kodak was photography. George Eastman founded the company in 1888 with a simple promise: you press the button, we do the rest. Kodak sold cameras cheaply and made most of its money on what came after: film, chemicals, paper and printing. Every family vacation and birthday party meant more rolls of Kodak film.


    In 1974, Kodak gave a 24-year-old electrical engineer named Steven Sasson a small project: see whether a new kind of electronic light sensor could capture a picture. Sasson built a camera out of spare parts. It was about the size of a toaster, weighed about 8 pounds, and ran on 16 AA batteries. Its sensor was just 100 by 100 pixels, or 0.01 megapixels, and it took black-and-white pictures. Capturing an image took a split second, but recording it onto a cassette tape took 23 seconds. To see the photo, you played the tape into a special device connected to a TV.


    In December 1975, Sasson took his first picture, of a lab technician down the hall. In 1976 he showed his invention around the company in a presentation called "Film-less Photography." People asked good questions: When could customers buy one? How would people look at their photos? But Kodak''s leaders did not see a market. Sasson later told the New York Times that they thought "no one would ever want to look at their pictures on a television set." Prints had been around for more than 100 years. They were cheap, familiar and loved, and nobody was complaining about them. And a camera that needed no film threatened the business that paid everyone''s salary. Kodak received a patent on Sasson''s camera in 1978, but it was never put into production, and Sasson was told not to show it to outsiders.


    It would be unfair to say Kodak ignored digital forever. It kept doing research and later sold digital cameras. Sasson himself helped build one of the first commercially available digital cameras in 1994, working with Nikon. But Kodak moved slowly and cautiously, always trying to protect film. One account says it took Kodak roughly 18 years after the prototype to truly make the switch.


    By then, the world had changed. Digital cameras got cheaper and better, and then smartphones put a camera in almost every pocket. People stopped buying film and stopped printing most of their photos. The business that Kodak had protected for so long shrank fast, and its new businesses were not big enough to replace it.


    On January 19, 2012, Eastman Kodak filed for bankruptcy protection. It listed about $6.75 billion in debts against about $5.1 billion in assets and borrowed $950 million from Citibank to keep operating. Kodak came out of bankruptcy in 2013 as a much smaller company.


    The most painful part of the story is that Kodak did not lose because it lacked ideas or smart people. It had invented the future in its own lab. What it lacked was the willingness to let that future replace the past while there was still time.'
  timeline:
  - - '1888'
    - George Eastman founds the company that becomes Eastman Kodak.
  - - '1974'
    - Kodak assigns engineer Steven Sasson to explore electronic image sensors.
  - - Dec 1975
    - Sasson takes the first picture with his digital camera prototype.
  - - '1976'
    - Sasson presents 'Film-less Photography' inside Kodak; leaders see no market.
  - - '1978'
    - Sasson receives a U.S. patent for the camera; it is never produced.
  - - '1994'
    - Sasson helps build one of the first commercially available digital cameras, with Nikon.
  - - Jan 19, 2012
    - Eastman Kodak files for bankruptcy protection.
  - - '2013'
    - Kodak emerges from bankruptcy as a smaller company.
  numbers:
  - - Prototype resolution (1975)
    - 100 x 100 pixels (0.01 megapixels)
  - - Time to record one photo (1975)
    - 23 seconds
  - - Prototype weight (1975)
    - about 8 pounds
  - - Debts listed in bankruptcy (2012)
    - about $6.75 billion
  lessons:
  - 'Invent and then act: having the idea first does not help if you never bring it to customers.'
  - 'Be willing to replace yourself: protecting a profitable product can blind you to what customers will want next.'
  - 'Small and clumsy can grow up fast: an early, awkward version of a technology can still be the future.'
  - 'Ask what business you are really in: Kodak was in the business of memories, not just film.'
  questions:
  - Why do you think it was so hard for Kodak's leaders to get excited about a camera that needed no film?
  - What is something that seems clumsy or silly today that might be normal in 20 years?
  - If your family business found a new idea that could hurt your best-selling product, what would you do?
  note: The popular version, "Kodak invented digital and then buried it," is partly true but simplified. Kodak did keep researching digital imaging and sold digital cameras for years; the bigger problem was moving too slowly and leaning on film profits. Sources give the prototype's weight as about 8 to 8.5 pounds (3.6 kg).
  sources:
  - name: IEEE Spectrum, 'The First Digital Camera' (history article)
    url: https://spectrum.ieee.org/first-digital-camera-history
  - name: PetaPixel, 'What Kodak Said About Digital Photography in 1975' (2017)
    url: https://petapixel.com/2017/09/21/kodak-said-digital-photography-1975/
  - name: Engadget, 'Time Machines' on Sasson's camera (2013)
    url: https://www.engadget.com/2013-11-24-time-machines.html
  - name: CNN Money, 'Kodak files for bankruptcy' (2012)
    url: https://money.cnn.com/2012/01/19/news/companies/kodak_bankruptcy/
- slug: intel-exits-memory-1985
  title: Intel Walks Out the Door and Comes Back In
  company: Intel
  year: '1985'
  industry: Semiconductors
  tags:
  - Strategy
  - Leadership
  summary: Intel was founded on memory chips, but by 1985 Japanese competitors were selling them for less, and Intel's profits had nearly vanished. Andy Grove asked Gordon Moore what a brand-new CEO would do; Moore said, "Get us out of memories." They did it themselves, bet the company on microprocessors, and Intel became the world's leading chipmaker.
  moral: Look at your business like a stranger would, and you'll see what love hides.
  story: 'Intel was started in 1968, and its first big success was memory chips, the tiny parts that let computers store information. For years, memory was what Intel was known for. Its leaders liked to say, in effect, that memories were who they were.


    By the early 1980s, that was becoming a problem. Japanese manufacturers had learned to make memory chips very well and very cheaply. Memory chips were turning into a commodity, a product where buyers mostly care about price because one company''s version is nearly the same as another''s. Prices fell and fell. According to Fortune magazine, Intel''s profits dropped from about $198 million in 1984 to less than $2 million in 1985. Intel''s own annual report called 1985 "a miserable year" for the company and the industry, with losses in three of its four quarters.


    Intel''s managers argued for months about what to do. There was no easy answer, and every month of delay meant more money lost while competitors kept cutting prices. Many had spent their careers on memory, and walking away felt like giving up the company''s identity. Andy Grove, Intel''s president, later described a conversation in his office with Gordon Moore, the chairman and CEO, in 1985. Grove asked Moore: "If we got kicked out and the board brought in a new CEO, what do you think he would do?" Moore answered right away: "He would get us out of memories." Grove then asked, "Why shouldn''t you and I walk out the door, come back and do it ourselves?"


    That question changed everything. It let two leaders who loved the memory business look at it the way an outsider would, without pride or habit getting in the way. Intel phased out of the main kind of memory chip, called DRAM, in 1985. Instead, it bet its future on microprocessors, the "brains" of personal computers. IBM had already chosen an Intel processor for its PC, and in October 1985 Intel launched the powerful 386 chip.


    The change was painful. Intel''s 1986 annual report called that year "without question, the toughest year in Intel''s history, filled with plant closings, layoffs and deep losses." Over two years, Intel cut about 7,200 jobs and closed eight older factories. In 1986 it lost more than $180 million, its only yearly loss since its earliest days.


    But the bet paid off. As personal computers spread into offices, schools and homes in the late 1980s and 1990s, nearly all of them needed a processor, and Intel''s chips were inside most of them. Intel grew into one of the most important technology companies in the world. Grove later wrote about this period in his book Only the Paranoid Survive, where he called such moments "strategic inflection points," times when the basic rules of a business change.


    The lesson is not that memory chips were bad or that change is always right. It is that the people closest to a business can be the last to see that it has changed. Grove''s trick of imagining a new boss gave him a fresh pair of eyes without having to wait to be replaced.'
  timeline:
  - - '1968'
    - Intel is founded; memory chips become its first big business.
  - - Early 1980s
    - Japanese makers drive memory-chip prices down.
  - - '1985'
    - Intel's profit falls to nearly zero; Grove and Moore have their 'new CEO' conversation.
  - - '1985'
    - Intel phases out of the DRAM memory business.
  - - Oct 1985
    - Intel launches the 386 microprocessor.
  - - '1986'
    - Intel posts a loss of more than $180 million amid layoffs and plant closings.
  numbers:
  - - Intel profit (1984)
    - about $198 million
  - - Intel profit (1985)
    - less than $2 million
  - - Intel loss (1986)
    - more than $180 million on about $1.3 billion in sales
  - - Jobs cut (1985–86)
    - about 7,200
  lessons:
  - 'Borrow a stranger''s eyes: ask what a new leader would do with your business, then do it yourself.'
  - 'Don''t confuse your history with your future: what made you successful may not keep you successful.'
  - 'Watch for commodities: when buyers only care about price, find where you can be truly different.'
  - 'Hard choices hurt before they help: Intel''s best decision came with its worst year.'
  questions:
  - Why do you think it was so hard for Intel's leaders to leave the business they started with?
  - 'Try Grove''s question on something in your life: if someone new took over, what would they change first?'
  - Is there a product or activity in your family business that you keep mostly out of habit?
  note: 'The Grove–Moore conversation comes from Grove''s own later account in Only the Paranoid Survive (1996), so it is one person''s memory of a private talk. Intel''s pivot was also not instant: it had been shifting toward microprocessors for years, and the decision to leave DRAM was debated inside the company for months. The 1984, 1985 and 1986 figures come from Fortune as quoted secondhand, and from Intel''s annual reports.'
  sources:
  - name: Intel, 1985 Annual Report
    url: https://intel.com/content/www/us/en/history/history-1985-annual-report.html
