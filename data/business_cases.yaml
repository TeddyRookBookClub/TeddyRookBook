    url: https://www.confectionerynews.com/Article/2002/09/27/Hershey-Trust-bows-to-pressure-over-future-sale/
  - name: Fortune, 'Hershey's hometown and the Mondelez merger' (2016)
    url: https://fortune.com/2016/07/05/hershey-hometown-merger-mondelez
