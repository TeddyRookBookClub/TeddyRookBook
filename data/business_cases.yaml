    url: https://www.nhpr.org/national/2012-12-26/zappos-logs-record-service-call
  - name: Refinery29, 'Zappos customer service call' (2016)
    url: https://www.refinery29.com/en-us/2016/07/118020/zappos-customer-service-call
  - name: EBSCO Research Starters, 'Zappos (Company)'
    url: https://ebsco.com/research-starters/business-and-management/zappos-company
- slug: ritz-carlton-2000-rule
  title: The Ritz-Carlton's $2,000 Rule
  company: The Ritz-Carlton Hotel Company
  year: 1990s
  industry: Hotels and hospitality
  tags:
  - Customers
  - Culture & people
  - Leadership
  summary: The Ritz-Carlton hotel chain famously allowed any employee, from housekeeper to front desk clerk, to spend up to $2,000 to fix a guest's problem on the spot. Paired with heavy training and a
    culture of respect, the policy helped the company win America's top quality award twice.
  moral: Placing decision rights with front-line employees speeds service recovery and builds loyalty, but only when supported by selective hiring, extensive training, clear standards and shared customer
    data.
  story: 'Imagine you are a guest at a fancy hotel and something goes wrong. Your room is not ready, or the laundry ruined your shirt before a big meeting. In many businesses, the employee you talk to says,
    I''ll have to ask my manager. You wait, you get more frustrated, and the problem grows.


    The Ritz-Carlton Hotel Company decided that was the wrong way to run a luxury hotel. Under Horst Schulze, a co-founder who led the company''s operations for years, the chain gave every employee the
    power to solve a guest''s problem right away. Each employee could spend up to $2,000 to fix a problem or settle a complaint, without getting a manager''s permission first. Schulze said the point was
    to let employees make decisions to keep a customer, and to train them to handle complaints themselves instead of passing them along.


    That number got a lot of attention, and it still does. But the money was never really the main idea. Few problems actually cost anywhere near $2,000 to fix. The rule was a signal. It told every worker,
    we trust your judgment, and the guest''s happiness is your job, not just your boss''s. It also told guests that whoever they asked for help could actually help. A housekeeper who heard a guest complain
    did not have to shrug and point toward the front desk. She could own the problem from start to finish, and then share what happened so the hotel could keep it from happening again.


    Trust like that only works if people are well prepared. The Ritz-Carlton invested heavily in training. According to the U.S. government''s quality award program, first-year front-line employees got
    about 250 hours of training. Every day, staff discussed one of the company''s service standards. The company also kept a shared database with nearly a million guest files, so that a hotel in one city
    could remember a guest''s preferences from a stay in another.


    Schulze also wanted employees to feel respected, not like servants. Since he was a teenager working in hotels, he had believed in a simple motto, which became the company''s: "We are ladies and gentlemen
    serving ladies and gentlemen." Workers were treated as professionals, and they were expected to act that way.


    The results were remarkable. The Ritz-Carlton won the Malcolm Baldrige National Quality Award, given by the U.S. Department of Commerce, in 1992 and again in 1999. It was the only company in the service
    category to win twice. In 1999 the company ran 36 hotels with about 17,000 employees, and an independent survey found 99 percent of guests satisfied with their stay.


    There is an important catch for anyone who wants to copy this. A spending limit without training, clear standards and good hiring could lead to waste or confusion. The $2,000 worked because it sat on
    top of a whole system built to help ordinary people make good decisions. A small business does not need a $2,000 limit. It might be $20 or $200. What matters is that the person closest to the customer
    is trained, trusted and allowed to make things right.

    '
  timeline:
  - - '1992'
    - The company wins its first Malcolm Baldrige National Quality Award.
  - - 1990s
    - Every employee is empowered to spend up to $2,000 to fix a guest's problem on the spot.
  - - '1999'
    - The company wins a second Baldrige Award, the only two-time winner in the service category.
  - - '1999'
    - Horst Schulze, president and chief operating officer, credits the award to the company's 17,000 'ladies and gentlemen.'
  numbers:
  - - Employee spending authority
    - up to $2,000 to resolve a guest problem
  - - Training for first-year front-line staff (1999)
    - about 250 hours
  - - Company size (1999)
    - 36 hotels, about 17,000 employees
  - - Guest satisfaction (1999 survey)
    - 99 percent satisfied
  lessons:
  - 'Decision rights and local knowledge: Every employee could spend up to $2,000 to fix a guest problem without asking a manager. Jensen and Meckling argued that decision rights work best when placed with
    the person who holds the relevant knowledge. At a hotel, that is often whoever is standing with the guest. Delegation cuts delay and the cost of escalation.'
  - 'Guardrails make empowerment safe: The $2,000 was a ceiling, not an allowance, and few fixes approached it. It sat on top of about 250 hours of first-year training and daily review of service standards.
    Authority without training produces inconsistent decisions and waste. The right limit for a smaller business may be $20 or $200, set by the value of the customer relationship.'
  - 'Service recovery as a system: Employees were expected to fix the problem and report it so the hotel could prevent a recurrence. Service recovery thus feeds a quality improvement loop. A guest database
    of nearly a million files carried preferences across properties. Treat each complaint as both a retention event and a data point for process change.'
  - 'Signaling and culture: The motto "ladies and gentlemen serving ladies and gentlemen" and the spending authority both signaled trust and professional status. Policies communicate values more credibly
    than slogans because they carry real cost. Respect for front-line staff supports the service-profit chain linking engagement to guest satisfaction.'
  - 'External validation of quality: The company won the Malcolm Baldrige National Quality Award in 1992 and 1999 and reported 99 percent guest satisfaction in a 1999 survey across 36 hotels. External benchmarks
    impose discipline and help sustain standards as a firm grows. Popular retellings exaggerate the $2,000 rule, and current policies may differ from the 1990s.'
  questions:
  - You run a 40-location dental chain. What spending limit would you give front-desk staff to resolve complaints, and how would you set it using customer lifetime value?
  - What controls would you put in place to detect misuse of front-line authority without undermining the sense of trust?
  - The Ritz-Carlton invested about 250 hours of training per new front-line employee. How would you justify that cost to a CFO in an industry with high turnover?
  - Which industries are poorly suited to this level of front-line authority, and why?
  note: The $2,000 figure is confirmed by the U.S. government's Baldrige Award profile and by Horst Schulze. Many popular retellings exaggerate it as a daily allowance or say employees routinely spend it;
    in practice it was a ceiling meant to signal trust. The Ritz name in luxury hotels is much older than the modern company described here, and its policies today may differ from those of the 1990s.
  sources:
  - name: 'NIST, Baldrige Award recipient profile: The Ritz-Carlton Hotel Company (1999)'
    url: https://www.nist.gov/node/449566
  - name: Hospitality Net, 'Ritz-Carlton wins Baldrige Award for second time' (1999)
    url: https://www.hospitalitynet.org/news/4003868/revolutionizing-the-service-industry-the-ritz-carlton-hotel-company-wins-coveted-malcolm-baldrige-national-quality-award-for-second-time
  - name: Chief Executive, 'Ritz-Carlton Founder Horst Schulze on Creating a Gold Standard'
    url: https://chiefexecutive.net/ritz-carlton-founder-horst-schulze-gold-standard/2
- slug: nordstrom-tire-story
  title: Nordstrom and the Tires It Never Sold
  company: Nordstrom
  year: 1975–1979
  industry: Department stores
  tags:
  - Customers
  - Culture & people
  - Marketing
  summary: For decades, people have told the story of a Nordstrom clerk in Alaska who gave a man a refund for tires, even though Nordstrom never sold tires. Long treated as a likely legend, the story was
    later confirmed by Nordstrom, and it became a symbol of a company that trusts employees to use good judgment.
  moral: Organizational stories transmit norms more efficiently than rulebooks, but a judgment-based culture needs boundaries against abuse, and leaders should be careful which stories they let define them.
  story: 'Nordstrom began in 1901 as a shoe store in Seattle. John W. Nordstrom, a Swedish immigrant, had come back from the Klondike gold rush with about $13,000 and opened the store, called Wallin and
    Nordstrom, with a partner named Carl Wallin. Their founding idea was simple: give customers the best possible service, selection, quality and value. The shoe store grew into one of the best-known department
    stores in America.


    Over the years, Nordstrom became famous for how its salespeople treated customers. Rather than a thick rulebook, employees were reportedly handed a single card with one rule: "Use good judgment in all
    situations." The company''s message was that the people on the sales floor knew best how to help the person in front of them.


    The most famous example is the tire story. In 1975, Nordstrom bought three stores in Alaska from a local company called Northern Commercial. Northern Commercial had sold all kinds of things, including
    auto supplies. Nordstrom changed the stores to sell clothing and shoes. Nordstrom has never sold tires, not in Alaska and not anywhere else.


    As the story goes, a man walked into the Fairbanks store one winter day rolling two tires. He said he had bought them in that very building and had been promised he could return them anytime. A young
    employee named Craig Trounce had no way to look up the price, so he called a tire shop to ask what the tires were worth, then gave the man that amount in cash, reportedly about $25. Trounce later joked
    that he mostly wanted to get the dirty tires away from the shirts.


    For years, many people assumed the story was made up. It spread through business magazines and books in the 1980s and 1990s, and some versions changed the details. A 1988 Washington Post article even
    reported that Nordstrom officials called it apocryphal, meaning probably not true. The fact-checking website Snopes concluded it was most likely a legend. But later, members of the Nordstrom family
    said it really happened. In a company podcast, Pete Nordstrom said, "The tire story did happen," and named Trounce as the employee. A Fairbanks newspaper interviewed people involved and placed the event
    in the winter of 1979.


    Was it smart business to refund money for something the store never sold? On its own, it cost a little money. But the story has been told so many times, in so many books and classrooms, that it has
    probably been worth far more than $25 in goodwill. More importantly, it showed employees what the company valued: treating customers with respect, even when they are confused, and not hiding behind
    rules.


    There is a balance here. Stores also need return policies that protect them from people who take advantage. Over the years, Nordstrom, like other retailers, has had to set limits.

    '
  timeline:
  - - '1901'
    - John W. Nordstrom and Carl Wallin open a shoe store in Seattle.
  - - 1960s
    - Nordstrom begins adding clothing and grows into a department store.
  - - '1975'
    - Nordstrom buys three Alaska stores from Northern Commercial, which had sold auto supplies.
  - - Mid-to-late 1970s
    - A Fairbanks clerk refunds a customer for tires the store never sold.
  - - 1980s
    - The tire story spreads in business magazines; Nordstrom officials reportedly call it apocryphal in 1988.
  - - 2010s–2022
    - Nordstrom family members and a Fairbanks newspaper say the story is true.
  numbers:
  - - Nordstrom founded
    - 1901, in Seattle
  - - John W. Nordstrom's Klondike stake
    - about $13,000
  - - Alaska stores bought (1975)
    - '3'
  - - Reported tire refund
    - about $25
  lessons:
  - 'Stories as culture carriers: The tire refund, reportedly about $25, has been retold for decades in books and classrooms. A single concrete story can teach employees what the firm values faster than
    a policy manual. The story''s accuracy was long disputed: Nordstrom officials called it apocryphal in 1988 before family members later confirmed it. Companies should verify the stories they promote.'
  - 'Rules versus judgment: Employees reportedly received a card with one rule: use good judgment. Judgment-based systems adapt to unusual cases that rules cannot anticipate, but they depend on hiring and
    training people whose judgment the firm trusts. The company also maintains other policies, so the one-rule claim describes an emphasis, not the absence of rules.'
  - 'Inherited obligations in acquisitions: Nordstrom bought three Alaska stores from Northern Commercial in 1975, which had sold auto supplies. The customer believed the building''s earlier promise still
    applied. Acquirers inherit customer expectations, goodwill and grievances along with property. Integration plans should account for how the previous business treated its customers.'
  - 'Policy abuse and limits: Liberal returns invite opportunistic behavior, and Nordstrom, like other retailers, later set limits. A generous policy must be calibrated so that honest customers benefit
    while abuse remains rare. Track return patterns to separate the occasional goodwill gesture from systematic exploitation.'
  questions:
  - You are the store manager in Fairbanks the day after the refund. Do you praise, correct or ignore the clerk's decision, and what signal does each choice send?
  - Nordstrom officials once called the story apocryphal. Should a company promote a story it cannot verify? What are the risks?
  - How would you design a return policy that preserves a reputation for generosity while limiting abuse? Which data would you monitor?
  - Identify a story inside an organization you know that shapes behavior. Is it teaching the lesson leadership intends?
  note: This story was long considered partly or wholly legend, and details still differ. Snopes concluded it was most likely apocryphal, and a 1988 Washington Post report said Nordstrom officials called
    it apocryphal. Later, John Nordstrom described witnessing it in the mid-1970s, the company's podcast named clerk Craig Trounce, and a 2022 Fairbanks Daily News-Miner report dated it to 1979. The exact
    amount (often given as $25) and date are not certain. The one-rule handbook is described by Nordstrom spokespeople, though the company also has other policies.
  sources:
  - name: 'Nordstrom press release, ''Nordy Pod: The Truth About Nordstrom''s Legendary Tire Story'''
    url: https://press.nordstrom.com/news-releases/news-release-details/nordy-pod-truth-about-nordstroms-legendary-tire-story
  - name: Snopes, 'Return to Spender'
    url: https://www.snopes.com/fact-check/return-to-spender/
  - name: Fairbanks Daily News-Miner, 'The tire story is true' (2022)
    url: https://www.newsminer.com/news/kris_capps/the-tire-story-is-true-and-it-happened-in-fairbanks-43-years-ago/article_7c7a7c62-1206-11ed-8d78-13011efcd986.html
  - name: Business Insider, 'Nordstrom's Employee Handbook Has Only One Rule'
    url: https://www.businessinsider.in/retail/nordstroms-employee-handbook-has-only-one-rule/articleshow/44804035.cms
  - name: Choose Washington State, 'Nordstrom success story'
    url: https://choosewashingtonstate.com/success-stories/nordstrom/
- slug: ltcm-1998
  title: 'Long-Term Capital Management: When Geniuses Borrow Too Much'
  company: Long-Term Capital Management
  year: 1994–1998
  industry: Investment fund (hedge fund)
  tags:
  - Finance & risk
  - Crisis
  - Leadership
  summary: A hedge fund run by star traders and two Nobel Prize winners earned huge returns, then lost about $4.6 billion in a few months in 1998 because it had borrowed so heavily. Its collapse threatened
    Wall Street, and the Federal Reserve gathered major banks to take it over.
  moral: Leverage converts small model errors into insolvency; strategies that depend on historical correlations and continuous funding fail precisely when markets are stressed and liquidity disappears.
  story: 'In 1994, a former Salomon Brothers bond trader named John Meriwether started an investment fund called Long-Term Capital Management, or LTCM. A fund like this, called a hedge fund, collects money
    from wealthy investors and big institutions and tries to earn high returns. LTCM''s team was dazzling. It included top Wall Street traders and two famous economists, Myron Scholes and Robert Merton,
    who shared the Nobel Prize in economics in 1997.


    LTCM''s strategy used complex math to find tiny price differences between investments that were very similar, like two government bonds with slightly different dates. The bet was that the prices would
    move back together over time. Each bet earned only a small amount, so to make big profits LTCM borrowed huge sums of money to make the bets much larger. This is called leverage. It is like using a long
    lever to lift something heavy: a small push becomes a big movement, in either direction.


    At first, it worked beautifully. The fund returned about 20 percent in 1994, 43 percent in 1995, 41 percent in 1996 and 17 percent in 1997. At the end of 1997, LTCM gave about $2.75 billion back to
    its investors but kept its bets just as large, which meant borrowing even more. By then it had roughly $30 of debt for every $1 of its own money. It also had derivatives contracts, which are financial
    agreements whose value depends on other investments, with a face value of more than a trillion dollars.


    Then, on August 17, 1998, Russia stopped paying some of its debts. Investors around the world panicked and rushed to the safest investments they could find. Prices that LTCM had bet would move together
    instead moved apart, almost everywhere at once. Because LTCM had borrowed so much, even small price moves caused enormous losses. The fund lost 44 percent of its value in August alone. By the end of
    that month, it had lost about half its capital.


    The danger was not just to LTCM''s investors. Many of the world''s biggest banks had lent to LTCM or traded with it. If the fund were forced to sell everything at once, prices could crash and spread
    the damage. In September 1998, the Federal Reserve Bank of New York called together the heads of major banks. On September 23, fourteen financial firms agreed to put in about $3.6 billion in exchange
    for 90 percent of the fund. Fed Chairman Alan Greenspan stressed that no government money was used. "This agreement was not a government bailout," he told Congress, adding that Federal Reserve funds
    were never provided.


    LTCM''s partners, who had invested much of their own wealth, lost most of it. The banks slowly sold off the fund''s positions and got their money back by the end of 1999, and the fund was closed in
    early 2000. In total, LTCM lost about $4.6 billion in under four months.

    '
  timeline:
  - - Feb 1994
    - John Meriwether launches LTCM with just over $1 billion.
  - - 1995–1996
    - The fund earns returns of more than 40 percent a year.
  - - Dec 1997
    - LTCM returns about $2.75 billion to investors but keeps its bets large.
  - - Aug 17, 1998
    - Russia stops paying some debts; markets panic.
  - - Aug 1998
    - LTCM loses 44 percent of its value in a single month.
  - - Sept 23, 1998
    - Fourteen firms agree to put about $3.6 billion into LTCM, with the New York Fed's help.
  - - Early 2000
    - After repaying the rescuers, the fund is closed.
  numbers:
  - - Starting capital (1994)
    - just over $1 billion
  - - Leverage (end of 1997)
    - about $30 of debt per $1 of capital
  - - Loss in August 1998
    - 44 percent of the fund's value
  - - Private rescue (Sept 1998)
    - about $3.6 billion from 14 firms
  - - Total losses (1998)
    - about $4.6 billion in under four months
  lessons:
  - 'Leverage arithmetic: At about $30 of debt per $1 of capital, a loss of roughly 3 percent on total assets would wipe out equity. LTCM''s convergence trades earned small spreads, so leverage was needed
    for high returns. Before adding leverage, calculate the asset decline that would eliminate capital and judge whether that move is truly unlikely.'
  - 'Model risk and correlation breakdown: LTCM''s models relied on historical relationships between similar securities. After Russia''s default on August 17, 1998, investors fled to safety, and prices
    that were expected to converge moved apart in many markets at once. Correlations tend to rise in a crisis, so diversification measured in calm periods overstates protection. Stress-test against scenarios
    outside the historical data.'
  - 'Limits of arbitrage: Shleifer and Vishny (1997) argued that arbitrage depends on capital and patience, and that losses can force arbitrageurs to sell exactly when opportunities are best. LTCM lost
    44 percent in August 1998. A trade can be right in the long run and still bankrupt the firm if funding runs out first.'
  - 'Capital decisions under leverage: At the end of 1997 LTCM returned about $2.75 billion to investors but kept its positions the same size, raising leverage. Returning capital while holding risk constant
    reduces the buffer against loss. Shrink positions in step with capital, or recognize that the risk profile has changed.'
  - 'Systemic risk and moral hazard: Banks had lent to LTCM and traded with it, so a fire sale threatened the system. The New York Fed brought 14 firms together to inject about $3.6 billion, with no government
    money. Critics argued that even a privately funded, Fed-arranged rescue could encourage risk-taking. Counterparties must monitor concentrated exposure rather than rely on reputation.'
  questions:
  - You are an LTCM partner in December 1997. Would you return $2.75 billion of capital or reduce positions? Show how each option changes leverage and survival odds.
  - As a bank risk officer lending to a fund run by Nobel laureates, what information would you require, and what limits would you set?
  - Was the New York Fed right to organize a private rescue? Weigh the systemic risk avoided against the moral hazard created.
  - Where outside hedge funds (corporate treasury, real estate, startups) do similar leverage and liquidity traps appear?
  note: Sources give slightly different figures for the rescue ($3.5 billion to $3.65 billion) and for yearly returns, depending on rounding and whether fees are counted. Greenspan's testimony gave about
    $3.5 billion; the Federal Reserve's history essay gives $3.625 billion. Bear Stearns and one other invited firm declined to join the rescue. Some critics argued that even a privately funded rescue arranged
    by the Fed could encourage risky behavior.
  sources:
  - name: Federal Reserve History, 'Near Failure of Long-Term Capital Management'
    url: https://www.federalreservehistory.org/essays/ltcm-near-failure
  - name: Federal Reserve Board, Testimony of Chairman Alan Greenspan (Oct 1, 1998)
    url: https://www.federalreserve.gov/boarddocs/Testimony/1998/19981001.htm
  - name: Wikipedia, 'Long-Term Capital Management'
    url: https://en.wikipedia.org/wiki/Long-Term_Capital_Management
- slug: lehman-brothers-2008
  title: The Fall of Lehman Brothers
  company: Lehman Brothers
  year: '2008'
  industry: Investment banking
  tags:
  - Finance & risk
  - Crisis
  - Ethics & trust
  summary: On September 15, 2008, the 158-year-old investment bank Lehman Brothers filed for the largest bankruptcy in U.S. history after betting heavily on real estate and running out of lenders. Its collapse
    turned a housing slump into a worldwide financial panic.
  moral: A highly leveraged firm funded with short-term borrowing is only as strong as its counterparties' confidence; concentration and opaque accounting accelerate a run that capital raising cannot stop.
  story: 'Lehman Brothers had a long history. In 1844, a German immigrant named Henry Lehman opened a dry goods store in Montgomery, Alabama. His brothers joined him, and by 1850 the business was called
    Lehman Brothers. Over the next century and a half it grew into a Wall Street investment bank that survived railroad failures, the Great Depression and many market crashes. By 2008, it was the fourth-largest
    investment bank in the United States, with about 25,000 employees.


    In the early 2000s, home prices in America were rising fast, and lenders were making loans to many borrowers who could not really afford them, called subprime mortgages. Lehman jumped in. In 2003 and
    2004, it bought five mortgage lenders, including some that specialized in subprime loans. It bundled loans into investments to sell, and it also kept many of them. Even as home prices started falling,
    Lehman kept increasing its real estate bets. By the end of 2007, it held about $111 billion in real estate assets, more than twice as much as a year before.


    Like other investment banks, Lehman paid for its investments mostly with borrowed money, much of it short-term loans that had to be renewed constantly. That worked only as long as lenders trusted Lehman.
    In March 2008, a rival bank, Bear Stearns, ran into trouble and was sold to JPMorgan Chase with backing from the government. Many people wondered who would be next.


    Lehman tried to calm the worry. In June 2008, after its first quarterly loss as a public company, it raised $6 billion from investors. But on September 10, it announced a loss of about $3.9 billion
    for the quarter and $5.6 billion in write-downs, meaning it admitted some of its assets were worth much less than it had said. Lenders and trading partners began pulling away.


    That weekend, government officials, including Treasury Secretary Henry Paulson, met with bank leaders at the Federal Reserve Bank of New York to look for a rescue. Bank of America chose to buy Merrill
    Lynch instead. A deal with the British bank Barclays fell apart when British regulators would not approve it in time. The government decided not to put its own money in. Early on Monday, September 15,
    2008, Lehman filed for bankruptcy, listing about $639 billion in assets and $613 billion in debts. That day the Dow Jones stock index fell more than 500 points. Within weeks, credit markets froze, and
    Congress passed a huge rescue plan for the banking system.


    Later, a court-appointed examiner, Anton Valukas, studied what went wrong. His 2010 report described an accounting move called Repo 105 that let Lehman temporarily shift about $50 billion off its books
    at the end of a quarter, making it look less indebted. He found enough evidence for possible legal claims against some former executives and Lehman''s auditor, though that was not a court ruling. CEO
    Richard Fuld said he did not know about the transactions. Federal prosecutors and the SEC ultimately brought no charges against Lehman''s leaders.

    '
  timeline:
  - - '1844'
    - Henry Lehman opens a dry goods store in Montgomery, Alabama.
  - - 2003–2004
    - Lehman buys five mortgage lenders, including subprime specialists.
  - - Mar 2008
    - Rival Bear Stearns is sold to JPMorgan Chase with government backing.
  - - Jun 2008
    - After its first loss as a public company, Lehman raises $6 billion.
  - - Sept 10, 2008
    - Lehman reports a quarterly loss of about $3.9 billion.
  - - Sept 12–14, 2008
    - Weekend rescue talks fail; Bank of America buys Merrill Lynch instead.
  - - Sept 15, 2008
    - Lehman files for bankruptcy; the Dow falls more than 500 points.
  - - Mar 2010
    - Bankruptcy examiner's report describes Repo 105 accounting.
  numbers:
  - - Assets at bankruptcy (2008)
    - about $639 billion
  - - Debts at bankruptcy (2008)
    - about $613 billion
  - - Employees (2008)
    - about 25,000
  - - Real estate assets (end of 2007)
    - about $111 billion
  - - Repo 105 at end of Q2 2008
    - about $50 billion moved off the balance sheet
  lessons:
  - 'Leverage and thin equity: At bankruptcy Lehman listed about $639 billion in assets and $613 billion in debts, leaving roughly $26 billion of book equity, about 4 percent of assets. A small percentage
    decline in asset values could erase that cushion. The same leverage that magnified profits in the boom made the firm fragile when real estate prices fell.'
  - 'Funding liquidity risk: Lehman financed long-term, illiquid assets with short-term loans that had to be renewed constantly. This maturity mismatch works only while lenders trust the borrower. Once
    confidence breaks, funding disappears faster than assets can be sold. After Bear Stearns nearly collapsed in March 2008, Lehman''s funding should have been treated as the central risk.'
  - 'Concentration risk: Lehman bought five mortgage lenders in 2003 and 2004, and by the end of 2007 held about $111 billion in real estate assets, more than double the year before, while home prices were
    starting to fall. Increasing a concentrated bet as the cycle turns compounds exposure. Risk limits should tighten, not loosen, when leading indicators weaken.'
  - 'Governance and accounting transparency: The examiner described Repo 105 transactions that moved about $50 billion off the balance sheet at quarter-end, making leverage look lower. The examiner found
    colorable claims against some former executives and the auditor, which is not a court finding, and no charges were brought. When counterparties suspect reported figures, they withdraw. Accounting choices
    that flatter ratios can destroy trust at the worst moment.'
  - 'Too big to fail and moral hazard: The government backed the sale of Bear Stearns but declined to put money into Lehman. Market participants who expected a rescue were wrong. Expectations of bailouts
    encourage risk-taking, and an abrupt reversal of those expectations can trigger panic. Firms should plan for no rescue rather than count on one.'
  questions:
  - You are Lehman's CFO in April 2008 after Bear Stearns. What three actions would you take on funding, assets and capital, and what would each cost?
  - Using the bankruptcy figures, calculate Lehman's equity-to-assets ratio. What decline in asset values would have made it insolvent?
  - Should the government have rescued Lehman? Argue both sides, considering moral hazard and systemic risk.
  - Where else do maturity mismatches appear (corporate treasury, fintech lenders, real estate developers), and how would you test for them?
  note: The examiner's report found 'colorable claims', meaning enough evidence that a court case could be brought, against some former executives and auditor Ernst & Young; it was not a court finding of
    wrongdoing. Richard Fuld denied knowing about Repo 105, and neither the SEC nor the Justice Department charged Lehman executives. Some sources date the firm's founding to 1844 (Henry Lehman's store)
    and others to 1850 (when it became Lehman Brothers). Barclays later bought Lehman's North American business, saving about 10,000 jobs.
  sources:
  - name: HISTORY.com, 'Lehman Brothers collapses' (This Day in History)
    url: https://www.history.com/this-day-in-history/september-15/lehman-brothers-collapses
  - name: Bloomberg, 'Lehman Files for Biggest Bankruptcy in U.S. After Suitors Balk' (2008)
    url: https://www.bloomberg.com/news/articles/2008-09-15/lehman-files-for-biggest-bankruptcy-in-u-s-after-suitors-balk
  - name: NBC News, 'Report details how Lehman hid its woes' (2010)
    url: https://www.nbcnews.com/id/wbna35828326
  - name: Newser, 'Why Lehman Brothers Wasn't Prosecuted' (2013)
    url: https://www.newser.com/story/173950/why-lehman-brothers-wasnt-prosecuted.html
- slug: chipotle-food-safety-2015
  title: Chipotle's Food-Safety Crisis
  company: Chipotle Mexican Grill
  year: 2015–2020
  industry: Restaurants
  tags:
  - Crisis
  - Operations
  - Ethics & trust
  summary: In 2015, outbreaks of E. coli and norovirus linked to Chipotle restaurants sickened hundreds of people and sent sales plunging. The company later admitted that workers had not followed its safety
    rules and paid a record $25 million federal fine in 2020.
  moral: A premium brand promise raises the reputational cost of operational failure; safety policies protect the firm only when incentives, staffing and audits make compliance the easiest path for employees.
  story: 'Chipotle Mexican Grill built its reputation on a simple idea: fast food made with fresh, high-quality ingredients. Founded by chef Steve Ells, the chain grew quickly by promising customers better
    food than typical fast food. By 2015, it had become one of the most admired restaurant companies in America. Then customers started getting sick.


    In August 2015, at a Chipotle in Simi Valley, California, 234 customers and employees became ill with norovirus, a very contagious stomach virus. Federal prosecutors later said an employee who had vomited
    was sent home, but the illness was not reported inside the company as required, and safety steps were not taken until two days later.


    That fall, the problem grew much bigger. From October to December 2015, the Centers for Disease Control and Prevention, or CDC, tracked an outbreak of a type of E. coli bacteria among people who had
    eaten at Chipotle. In the end, 55 people in 11 states got sick, and 21 went to the hospital. A second, smaller E. coli outbreak sickened five more people in three states. Investigators never identified
    which ingredient was to blame. In December 2015, about 140 people, many of them Boston College students, got norovirus after eating food from a Chipotle near campus. Prosecutors said a sick employee
    had been told to keep working.


    The news coverage was enormous, and customers stayed away. Chipotle temporarily closed dozens of restaurants and announced new food-safety procedures, including more food testing. On February 8, 2016,
    it closed every restaurant for several hours to hold a national meeting with employees about food safety. The CDC said the E. coli outbreaks appeared to be over on February 1, 2016. But the damage was
    done. In the first three months of 2016, Chipotle''s revenue fell 23.4 percent to about $834.5 million, sales at restaurants open at least a year dropped 29.7 percent, and the company lost $26.4 million.


    The trouble did not end there. In July 2018, nearly 650 people got sick after eating at a Chipotle in Powell, Ohio, from bacteria that grow when food is not kept at the right temperature. In 2018, the
    company hired a new chief executive, Brian Niccol, and Steve Ells stepped back to become chairman.


    In April 2020, Chipotle settled federal criminal charges with the U.S. Justice Department. It was charged with two counts of serving adulterated, or contaminated, food. Under a deferred prosecution
    agreement, Chipotle agreed to pay a $25 million fine, the largest ever in a food-safety case, and to improve its safety program; the charges would be dropped if it complied. Prosecutors said more than
    1,100 people were sickened in outbreaks from 2015 to 2018. The U.S. attorney said Chipotle "failed to ensure that its employees both understood and complied with its food safety protocols." The company
    admitted its sick-leave rules had not been properly enforced.

    '
  timeline:
  - - Aug 2015
    - Norovirus at a Simi Valley, California, Chipotle sickens 234 people.
  - - Oct–Dec 2015
    - An E. coli outbreak linked to Chipotle sickens 55 people in 11 states.
  - - Dec 2015
    - About 140 people, many Boston College students, get norovirus near campus.
  - - Feb 1, 2016
    - The CDC says the E. coli outbreaks appear to be over.
  - - Feb 8, 2016
    - Chipotle closes all restaurants for several hours for a food-safety meeting.
  - - Apr 2016
    - Chipotle reports first-quarter sales down 29.7 percent at established restaurants.
  - - Jul 2018
    - Nearly 650 people are sickened at a Chipotle in Powell, Ohio.
  - - Apr 2020
    - Chipotle agrees to a record $25 million fine in a deferred prosecution agreement.
  numbers:
  - - E. coli outbreak (2015)
    - 55 sick in 11 states, 21 hospitalized
  - - Drop in sales at established restaurants (Q1 2016)
    - 29.7 percent
  - - Net loss (Q1 2016)
    - $26.4 million
  - - People sickened in outbreaks (2015–2018)
    - more than 1,100
  - - Federal fine (2020)
    - $25 million, the largest in a food-safety case
  lessons:
  - 'Policy versus practice: Chipotle had food-safety rules, but prosecutors said sick employees kept working and illnesses went unreported. The company admitted its sick-leave rules were not properly enforced.
    Compliance fails when employees face pressure, lost pay or understaffing that makes following policy costly. Audit actual behavior and remove incentives that reward working while ill.'
  - 'Brand promise as exposure: Chipotle''s position rested on fresh, high-quality food. Outbreaks attacked that core claim directly, so the damage was larger than it would be for a firm competing only
    on price. In the first quarter of 2016, revenue fell 23.4 percent, same-store sales fell 29.7 percent and the company lost $26.4 million. The stronger the promise, the higher the cost of breaking it.'
  - 'Operational complexity and risk: Fresh ingredients and on-site preparation increase the number of control points compared with centralized processing. Investigators never identified the ingredient
    behind the 2015 E. coli outbreaks. A differentiating operating model may carry structural risks that require stronger controls than competitors need. Design the control system for the model you actually
    run.'
  - 'Crisis response and recurrence: Chipotle closed restaurants, added food testing and held a national safety meeting on February 8, 2016. Yet nearly 650 people were sickened in Powell, Ohio, in 2018.
    Visible gestures restore confidence only if follow-through prevents repeat incidents. A second failure undermines credibility far more than the first.'
  - 'Legal and governance consequences: In 2020 Chipotle agreed to a $25 million fine under a deferred prosecution agreement, with charges to be dropped if it complied. Prosecutors cited more than 1,100
    people sickened from 2015 to 2018. Leadership changed in 2018. Boards should treat operational safety as an enterprise risk, with reporting that reaches directors before regulators do.'
  questions:
  - You are Chipotle's COO in September 2015 after the Simi Valley outbreak. What changes would you make to staffing, sick-leave pay and reporting, and what would they cost?
  - Compare the Q1 2016 loss and sales decline with the cost of a stronger sick-leave policy. How would you build the business case before a crisis?
  - Did the national closure on February 8, 2016 help or hurt the brand? What else could have rebuilt trust?
  - What other businesses rely on a differentiating promise that raises their operational risk, and how should their controls differ?
  note: The CDC never identified the specific food that caused the 2015 E. coli outbreaks. Counts for the Boston outbreak vary between reports (about 136 to 141 people). In the 2020 deferred prosecution
    agreement, Chipotle accepted the government's description of failures, including not enforcing sick-leave rules; the charges were to be dismissed if it complied.
  sources:
  - name: CDC, '2015 E. coli Outbreak Linked to Chipotle Mexican Grill Restaurants' (final update, 2016)
    url: https://archive.cdc.gov/www_cdc_gov/ecoli/2015/o26-11-15/index.html
  - name: PBS NewsHour / AP, 'Chipotle agrees to record $25 million fine over tainted food' (2020)
    url: https://www.pbs.org/newshour/economy/chipotle-agrees-to-record-25-million-fine-over-tainted-food
  - name: Courthouse News, 'Feds slap Chipotle with $25 million fine over norovirus outbreaks' (2020)
    url: https://www.courthousenews.com/feds-slap-chipotle-with-25-million-fine-over-norovirus-outbreaks/
  - name: Chipotle, 'Chipotle Mexican Grill, Inc. Announces First Quarter 2016 Results'
    url: https://newsroom.chipotle.com/2016-04-26-chipotle-mexican-grill-inc-announces-first-quarter-2016-results
  - name: CBS Boston, 'Chipotle closing restaurants nationwide to address food safety' (2016)
    url: https://www.cbsnews.com/amp/boston/news/chipotle-closing-restaurants-nationwide-to-address-food-safety
- slug: southwest-no-layoffs-2001
  title: Southwest Airlines Keeps Its People After 9/11
  company: Southwest Airlines
  year: '2001'
  industry: Airlines
  tags:
  - Culture & people
  - Crisis
  - Finance & risk
  summary: After the September 11, 2001 attacks emptied the skies, most big U.S. airlines cut thousands of jobs. Southwest Airlines promised its employees no layoffs, no furloughs and no pay cuts, and kept
    that promise while still ending the year with a profit. It shows how money saved in good years can protect people in bad ones.
  moral: 'Financial slack built in good times is a strategic option: it lets a firm honor commitments to employees during a shock and turn crisis into lasting trust.'
  story: 'On the morning of September 11, 2001, terrorists hijacked four passenger jets. Within hours the U.S. government ordered every civilian airplane in the country to land, and for several days nothing
    flew. For airlines, this was a nightmare. Planes sat parked, money stopped coming in, and many people were afraid to fly once the skies reopened.


    Southwest Airlines, based in Dallas, was in a strange position. Its longtime leader, Herb Kelleher, had handed the chief executive job to Jim Parker, the company''s lawyer, only three months earlier,
    in June 2001. Southwest had a reputation as a fun, low-fare airline, but it also had a quieter habit that mattered more that week: it was careful with money. According to the company''s own report to
    shareholders, it had about $1 billion in cash on September 11, and much less debt than most of its rivals.


    Southwest''s leaders say they decided on the very first morning that they would do everything in their power to avoid layoffs. Kelleher''s advice to the finance team was short: get cash. On September
    12 the company drew on its bank credit line, eventually borrowing about $1.1 billion, so it could keep paying its bills while planes were grounded. Parker then told every employee that their jobs were
    safe and their paychecks would keep coming.


    Other airlines went the opposite way. Within about a week of the attacks, rival carriers announced job cuts in the thousands. Southwest''s 2002 report to shareholders states that it gave its people
    "100 percent job security," with no layoffs, furloughs, unpaid leaves, or cuts to pay or benefits. The top leaders went further: Kelleher, Parker and company president Colleen Barrett gave up their
    own salaries for the last three months of 2001. Southwest also went ahead and paid about $197.5 million into employee profit-sharing and savings plans, even though the money would have been handy to
    keep.


    Southwest returned to the air on September 14 and kept a planned new service to Norfolk, Virginia, that fall. Employees worked very long days to rebuild schedules and set up new security rules. For
    2001 as a whole, the airline reported a profit of about $511 million, its 29th profitable year in a row. To be fair and complete, part of that profit came from a federal emergency grant that all airlines
    received after the attacks; without the grant and some special charges, Southwest''s profit would have been about $413 million. Still, it was the only major U.S. airline that stayed profitable.


    Why could Southwest do this when others could not? The main reason was choices made long before the crisis. For years it had kept a strong balance sheet, meaning more savings and less borrowing than
    its competitors. That cushion gave leaders room to choose loyalty over quick cost-cutting. They also believed that employees who feel safe give better service, and that the trust built in a hard moment
    lasts for years.


    The story is not a fairy tale with no problems afterward. Parker''s time as CEO also saw tense negotiations with the flight attendants'' union, and he stepped down in 2004. But the decision after 9/11
    is still one of the most cited examples of a company protecting its people in a crisis.

    '
  timeline:
  - - June 18, 1971
    - Southwest begins flying with three Boeing 737s in Texas.
  - - June 2001
    - Jim Parker succeeds Herb Kelleher as CEO.
  - - Sept 11, 2001
    - Attacks ground all U.S. flights; leaders vow to avoid layoffs.
  - - Sept 12, 2001
    - Southwest draws on its credit line to raise cash.
  - - Sept 14, 2001
    - Southwest resumes flying.
  - - Oct–Dec 2001
    - Top three leaders give up their salaries for the quarter.
  - - Early 2002
    - Southwest reports a 2001 profit of about $511 million, its 29th straight profitable year.
  - - July 2004
    - Parker steps down as CEO; Gary Kelly succeeds him.
  numbers:
  - - Cash on hand, Sept 11, 2001
    - about $1.0 billion
  - - Money borrowed after the attacks (2001)
    - about $1.1 billion
  - - 2001 net profit
    - about $511 million (about $413 million without the federal grant and special charges)
  - - Paid into employee profit-sharing and savings plans (2001)
    - about $197.5 million
  - - Employees (2001)
    - about 31,850
  lessons:
  - 'Liquidity as a strategic option: Southwest had about $1 billion in cash on September 11 and less debt than rivals, then drew about $1.1 billion on its credit line the next day. A strong balance sheet
    functions like a real option: it costs something in normal times but gives choices others lack in a crisis. Size reserves for the scenarios that threaten core commitments.'
  - 'Implicit contracts and trust: Southwest had a long practice of avoiding layoffs, and leaders decided on the first morning to keep it. Breaking an implicit promise in the first real test would have
    destroyed its value. Commitments to employees are credible only if the firm honors them when they are costly.'
  - 'Leadership signaling: Kelleher, Parker and Barrett gave up their salaries for the last quarter of 2001, and the company paid about $197.5 million into profit-sharing and savings plans. Visible sacrifice
    by leaders makes requests for effort from employees credible. Shared pain is a more persuasive message than any memo.'
  - 'Reading the numbers fairly: Southwest reported 2001 profit of about $511 million, but about $413 million excluding the federal grant all airlines received and special charges. It was still the only
    major U.S. airline to stay profitable. When judging a crisis decision, separate the effect of management choices from external support that rivals also received.'
  - 'Stakeholder trade-offs: Protecting about 31,850 jobs reduced flexibility to cut costs quickly. Later tension with the flight attendants'' union shows that goodwill from one decision does not settle
    future labor relations. Stakeholder commitments create value through trust but must be renewed in each negotiation.'
  questions:
  - You are Southwest's CFO on September 12, 2001. How long could the airline sustain no layoffs at different traffic levels, and what would trigger a change of course?
  - Rivals announced thousands of job cuts within a week. Were they wrong, or did their balance sheets leave no choice? What does that imply for capital structure decisions before a crisis?
  - How much cash should an airline hold in normal times? Weigh the cost of idle cash against the option value shown in 2001.
  - Which other industries face sudden demand shocks where a no-layoff policy could be a competitive advantage, and which could not afford it?
  note: The no-layoff promise and the financial figures come from Southwest's own shareholder report and company history, and are confirmed by news coverage. The 2001 profit included a $235 million (before
    tax) federal grant under the Air Transportation Safety and System Stabilization Act, which other airlines also received.
  sources:
  - name: Southwest Airlines proxy statement filed with the SEC (2002)
    url: https://www.sec.gov/Archives/edgar/data/0000092380/000095013402003643/d95363ddef14a.txt
  - name: 'Southwest Airlines, ''A Shining Light in the Darkest of Hours: Southwest and 9/11'''
    url: https://southwest50.com/our-stories/a-shining-light-in-the-darkest-of-hours-southwest-and-9-11
  - name: FOX 4 / AP, 'Former Southwest Airlines CEO James Parker dies at 72' (2019)
    url: https://www.fox4news.com/news/former-southwest-airlines-ceo-james-parker-dies-at-72
  - name: Encyclopedia.com, 'Southwest Airlines Company'
    url: https://www.encyclopedia.com/economics/economics-magazines/southwest-airlines-company
- slug: mattel-recalls-2007
  title: Mattel and the Summer of Toy Recalls
  company: Mattel (including Fisher-Price)
  year: '2007'
  industry: Toys
  tags:
  - Ethics & trust
  - Operations
  - Crisis
  summary: In the summer of 2007, Mattel recalled more than 21 million Chinese-made toys, some because of lead paint and many more because of tiny magnets that could come loose. The crisis showed that a
    company is responsible for everything that goes into its products, even work done by suppliers of its suppliers.
  moral: Outsourcing production moves the work but not the accountability; brand owners must control sub-tier suppliers and their own design risk, and diagnose root causes before assigning public blame.
  story: 'Mattel, the company behind Barbie, Hot Wheels and Fisher-Price, is one of the biggest toy makers in the world. Like most toy companies, it had many of its toys built by contract factories in China.
    That arrangement keeps costs low, but it also means the company does not control every step, every worker and every can of paint.


    On August 2, 2007, the U.S. Consumer Product Safety Commission (CPSC), the government agency that watches over product safety, announced that Fisher-Price was recalling about 967,000 toys, including
    Sesame Street and Dora the Explorer figures. A recall means the company asks customers to stop using a product and return it. The problem was that surface paint on the toys could contain too much lead.
    Lead is poisonous, especially for young children who put toys in their mouths, and lead paint on toys had been banned in the United States since 1978. No injuries were reported. The toys had been made
    by a Chinese factory called Lee Der Industrial.


    Two weeks later, on August 14, Mattel announced two more recalls. One was about 436,000 die-cast "Sarge" cars from the Cars movie line, again for lead paint. Mattel explained that a subcontractor that
    painted parts of the toy had used paint from an unapproved supplier instead of the paint it was supposed to use. The second recall was much larger: about 18.2 million toys worldwide, such as some Polly
    Pocket sets, that contained small, powerful magnets that could fall out. If a child swallows more than one magnet, they can stick together inside the body and cause serious harm. On September 4 came
    yet another lead-paint recall, about 675,000 Barbie accessory sets in the United States.


    Mattel''s chief executive, Robert Eckert, apologized publicly, saying the company was "deeply apologetic to everyone affected." Mattel announced tighter rules: only paint from certified suppliers, testing
    of every batch of paint, more surprise inspections at factories, and testing of every production run of finished toys before shipment.


    Then the story took a turn. On September 21, 2007, a Mattel executive, Thomas Debrowski, met China''s product safety chief and apologized to China. He acknowledged that the "vast majority" of the recalled
    toys were recalled because of a design flaw by Mattel itself, the magnet problem, not because of mistakes by Chinese factories. In other words, the lead paint came from the supply chain, but most recalled
    toys traced back to Mattel''s own design.


    The government also had the final word on the lead paint. In June 2009, Mattel and Fisher-Price agreed to pay a $2.3 million civil penalty, the largest the CPSC had ever imposed for that kind of violation.
    The agency said the two companies had brought in up to about 2 million toys that broke the lead-paint ban between 2006 and 2007. As is common in such settlements, the companies did not admit wrongdoing
    and denied knowingly breaking the law.

    '
  timeline:
  - - '1978'
    - U.S. bans lead paint on toys above a very small limit.
  - - Aug 2, 2007
    - Fisher-Price recall of about 967,000 toys for lead paint is announced.
  - - Aug 14, 2007
    - Mattel recalls about 436,000 'Sarge' cars for lead paint and about 18.2 million magnet toys worldwide.
  - - Sept 4, 2007
    - Mattel recalls about 675,000 Barbie accessory sets in the U.S. for lead paint.
  - - Sept 21, 2007
    - Mattel executive apologizes to China, saying most recalls came from Mattel's own design flaw.
  - - June 5, 2009
    - Mattel and Fisher-Price agree to a $2.3 million civil penalty, without admitting wrongdoing.
  numbers:
  - - Toys in the first Fisher-Price lead recall (2007)
    - about 967,000
  - - Magnet toys recalled worldwide (Aug 2007)
    - about 18.2 million
  - - Total toys in Mattel's three big 2007 recalls
    - more than 21 million
  - - CPSC civil penalty (2009)
    - $2.3 million
  lessons:
  - 'Sub-tier supply risk: The Sarge car recall happened because a subcontractor used paint from an unapproved supplier. Brand owners often audit direct suppliers but have little visibility into their suppliers''
    suppliers. Contracts, approved-vendor lists and batch testing need to reach the tier where the risk actually sits. Mattel later required certified paint suppliers and testing of every batch.'
  - 'Design risk versus manufacturing risk: About 18.2 million recalled toys involved a magnet design flaw, compared with roughly 2 million toys in the lead-paint recalls. A Mattel executive acknowledged
    to China''s product safety chief that most recalls traced to Mattel''s own design. Root-cause analysis should come before public statements about who is responsible.'
  - 'Crisis communication: Mattel''s CEO apologized to customers, and a later apology to China corrected the impression that Chinese factories caused most of the problem. Early messaging that misattributes
    blame can damage supplier relationships and government relations. Accuracy is more valuable than speed when assigning fault.'
  - 'Brand accountability: Customers held Mattel and Fisher-Price responsible regardless of which factory made the toys. In 2009 the companies paid a $2.3 million CPSC civil penalty, the largest for that
    type of violation, without admitting wrongdoing. The regulator and the customer both treat the brand owner as the responsible party.'
  - 'Controls as a cost of outsourcing: Low-cost contract manufacturing is cheaper only if quality assurance costs are included. Mattel added surprise inspections and testing of every production run before
    shipment. Compare suppliers on total landed cost including inspection, recall risk and brand damage, not on unit price alone.'
  questions:
  - You are Mattel's head of supply chain in July 2007. Design a supplier control program that would have caught the Sarge car paint problem. What would it cost per unit?
  - Mattel's magnet recall was much larger than the lead-paint recalls. How should a firm divide quality resources between design review and supplier audits?
  - Evaluate the September 2007 apology to China. Was it the right decision for shareholders, customers and supplier relations?
  - How does this case apply to a firm that outsources software development or customer data processing?
  note: Mattel first announced the Fisher-Price recall on August 1, 2007; the CPSC notice is dated August 2. In the 2009 settlement, Mattel and Fisher-Price did not admit wrongdoing; the penalty resolved
    the CPSC staff's allegations.
  sources:
  - name: CPSC, 'Fisher-Price Recalls Licensed Character Toys Due to Lead Poisoning Hazard' (2007)
    url: https://www.cpsc.gov/Recalls/2007/fisher-price-recalls-licensed-character-toys-due-to-lead-poisoning-hazard
  - name: Reliable Plant, 'Production issues force expanded recall of Mattel toys' (2007)
    url: https://reliableplant.com/Articles/Print/7822?id=7822
  - name: CPSC, 'Mattel Recalls Various Barbie Accessory Toys' (2007)
    url: https://www.cpsc.gov/Recalls/2007/mattel-recalls-various-barbie-accessory-toys-due-to-violation-of-lead-paint-standard
  - name: NBC News / NYT, 'Mattel apologizes to China over recalls' (2007)
    url: https://www.nbcnews.com/id/wbna20903731
  - name: CPSC, 'Mattel, Fisher-Price to Pay $2.3 Million Civil Penalty' (2009)
    url: https://www.cpsc.gov/Newsroom/News-Releases/2009/Mattel-Fisher-Price-to-Pay-23-Million-Civil-Penalty-for-Violating-Federal-Lead-Paint-Ban-Penalty-is-highest-ever-for-CPSC-regulated-product-violations
- slug: polaroid-rise-and-fall
  title: 'Polaroid: The Instant Camera That Didn''t Change Fast Enough'
  company: Polaroid Corporation
  year: 1937–2001
  industry: Photography
  tags:
  - Innovation
  - Strategy
  summary: Polaroid invented instant photography and for decades owned it completely. It even did early digital camera research, but its business depended on selling high-profit film, and it filed for bankruptcy
    in October 2001. It is a classic story of a company that saw the future but could not let go of the past.
  moral: A firm can foresee and invest in a technological shift yet still fail if its business model and managers' beliefs stay tied to the old profit source.
  story: 'Edwin Land was a brilliant inventor who left Harvard as a teenager to work on a new material that could polarize light, the same idea used in many sunglasses today. In 1937 he founded the Polaroid
    Corporation in Cambridge, Massachusetts. During World War II, Polaroid made goggles and optical equipment for the U.S. military.


    Land''s most famous idea came next. According to company lore, his young daughter asked why she couldn''t see a photo right after it was taken. In 1947 Land showed the world a camera that produced a
    finished print right out of the camera, and the first model went on sale in 1948 for $89.75. In 1972 Polaroid launched the SX-70, a camera that pushed out a picture that developed before your eyes.
    Polaroid had a monopoly, meaning it was the only seller of instant photography. At its peak, around 1978, it employed about 21,000 people.


    Polaroid made most of its money the way a razor company does: the camera got you started, but the real profit was in the film you kept buying. A later CEO said instant film earned gross margins well
    above 65 percent, meaning most of each film sale was profit after the cost of making it. When Kodak started selling instant cameras in 1976, Polaroid sued for patent infringement and won. In 1990 a
    court awarded Polaroid about $909 million, and the court had already ordered Kodak out of the instant camera business.


    Polaroid did not ignore computers and electronics. It took out early patents on electronic camera parts in the 1960s, formed an electronic imaging group in 1981, and by 1989 was spending 42 percent
    of its research budget on digital imaging. In the late 1990s it was even a top seller of digital cameras. But leaders kept believing that people would always want a printed picture in their hands. A
    digital camera needs no film, and film was where Polaroid''s profits lived.


    Other problems piled up. To fight off a hostile takeover attempt in 1989, Polaroid took on heavy debt. One-hour photo labs and then digital cameras cut into demand for instant pictures. Business customers
    who used Polaroids for ID cards, insurance claims and real estate switched to digital. Revenue peaked at about $3 billion in 1991 and then slid.


    In October 2001, with more than $900 million in debt and its stock trading at about 28 cents a share, Polaroid filed for Chapter 11 bankruptcy, a legal process that protects a struggling company from
    creditors while it reorganizes or sells itself. Most of the business was sold. The new owners later went through their own bankruptcy in 2008.


    The name did not disappear. In 2008 a group of fans called the Impossible Project took over a former Polaroid film factory in the Netherlands and figured out how to make instant film again. Years later
    that business took the Polaroid name, and instant cameras became popular with a new generation. The lesson is not that Polaroid''s idea was bad. It is that a company built around one profitable product
    can find it very hard to replace that product, even when it can see the change coming.

    '
  timeline:
  - - '1937'
    - Edwin Land and George Wheelwright found Polaroid in Cambridge, Massachusetts.
  - - 1947–1948
    - Land demonstrates instant photography; the first camera goes on sale for $89.75.
  - - '1972'
    - Polaroid launches the SX-70 instant camera.
  - - '1976'
    - Kodak enters instant photography; Polaroid sues for patent infringement.
  - - '1981'
    - Polaroid forms an electronic imaging group.
  - - '1990'
    - Court awards Polaroid about $909 million against Kodak.
  - - Oct 2001
    - Polaroid files for Chapter 11 bankruptcy.
  - - '2008'
    - Post-bankruptcy Polaroid files again; the Impossible Project begins reviving instant film.
  numbers:
  - - First instant camera price (1948)
    - $89.75
  - - Peak employment (1978)
    - about 21,000
  - - Peak revenue (1991)
    - about $3 billion
  - - Research budget spent on digital imaging (1989)
    - 42 percent
  - - Debt at bankruptcy (2001)
    - more than $900 million
  lessons:
  - 'Business model lock-in: Polaroid earned most of its profit on film, with gross margins reported above 65 percent. Digital cameras needed no film, so success in digital meant destroying the profit engine.
    When a new technology removes your consumable, the threat is to the business model, not just the product. Plan for the new profit pool before the old one shrinks.'
  - 'Capability is not enough: Polaroid had early electronic patents, an electronic imaging group from 1981, and spent 42 percent of its research budget on digital imaging in 1989. Tripsas and Gavetti (2000)
    studied Polaroid and argued that managers'' beliefs about the business, such as customers always wanting a print, held the firm back more than missing technology did. Test the assumptions behind your
    strategy, not only the technology.'
  - 'Core rigidities: The strengths that made Polaroid, chemistry, film manufacturing and patent protection, did not transfer to digital electronics. Leonard-Barton (1992) described how core capabilities
    can become core rigidities when the environment shifts. A firm''s competence can limit what it sees as possible.'
  - 'Patents defend, but do not create, the future: Polaroid won about $909 million from Kodak in 1990 and forced it out of instant photography. That protected the existing business against a direct competitor
    but offered no defense against substitute technologies. Intellectual property strategy should be judged against substitutes as well as imitators.'
  - 'Leverage reduces strategic flexibility: Heavy debt taken on to defend against a 1989 takeover attempt left less capacity to fund a transition as revenue fell from its 1991 peak of about $3 billion.
    Polaroid entered bankruptcy in 2001 with more than $900 million in debt. Financial structure determines how long a firm can survive while reinventing itself.'
  questions:
  - You are Polaroid's CEO in 1990 with a $909 million award from Kodak. How would you allocate it between film, digital imaging and debt reduction, and why?
  - How could Polaroid have built a profitable digital business without film margins? Propose a business model and estimate what share of film profit it would need to replace.
  - What warning signs should Polaroid's board have tracked through the 1990s, and what would have justified a decisive shift?
  - Name a current company whose profits depend on a consumable or recurring product threatened by a substitute. What should it learn from Polaroid?
  note: Sources give October 11, 12 or 13, 2001 for the bankruptcy filing; CNN reported it was filed Friday, October 12. The story about Land's daughter inspiring the instant camera comes from Land and
    Polaroid themselves and is widely repeated, but it is a personal anecdote rather than a documented record.
  sources:
  - name: CNN Money, 'Polaroid files for bankruptcy' (2001)
    url: https://money.cnn.com/2001/10/12/companies/polaroid/
  - name: Yale Insights, 'What Was Polaroid Thinking?'
    url: https://insights.som.yale.edu/insights/what-was-polaroid-thinking
  - name: Fortune, 'Polaroid's instant karma' (2012)
    url: https://fortune.com/2012/10/05/polaroids-instant-karma
  - name: Wikipedia, 'Polaroid Corporation'
    url: https://en.wikipedia.org/wiki/Polaroid_Corporation
- slug: walmart-logistics
  title: 'Walmart: Low Prices Start in the Warehouse'
  company: Walmart
  year: 1962–2000s
  industry: Retail
  tags:
  - Operations
  - Strategy
  - Customers
  summary: 'Walmart grew from one store in Arkansas to the world''s largest retailer by keeping prices low every day. The secret was not just bargaining hard: it built one of the most efficient systems
    ever for moving goods from suppliers to shelves, using distribution centers, cross-docking, satellites and shared sales data.'
  moral: A sustainable cost advantage comes from a system of reinforcing activities, such as distribution density, cross-docking, shared data and stable pricing, that rivals cannot copy piece by piece.
  story: 'Sam Walton opened the first Walmart store in Rogers, Arkansas, on July 2, 1962. His idea was simple: sell for less than anyone else, and make up for thin profits on each item by selling many more
    items. Many of his early stores were in small towns.


    Low prices are easy to promise and hard to keep. If a store pays too much to get goods onto its shelves, it cannot cut prices for long. So Walmart treated logistics, the business of moving and storing
    goods, as a weapon. Around 1970 to 1971 it opened its first distribution center in Bentonville, Arkansas. A distribution center is a giant building where trucks from suppliers unload and other trucks
    carry goods out to stores. Walmart built new stores within driving distance of these centers, like spokes around the hub of a wheel, so its own trucks could restock them quickly.


    Walmart became famous for a method called cross-docking. In a normal warehouse, goods arrive, sit on shelves for weeks, and then get shipped out. In cross-docking, goods from a supplier''s truck move
    across the building and onto a truck headed to a store, often within hours, without being stored at all. That saves rent, labor and the cost of money tied up in inventory. A widely cited figure says
    Walmart moved about 85 percent of its merchandise this way.


    Technology made the system faster. Walmart began scanning bar codes at its registers in 1983, so it knew exactly what sold. In 1987 it finished the largest private satellite network in the United States,
    at a cost of about $24 million, linking every store to headquarters for voice, data and video. Around 1991 to 1992 it created Retail Link, a system that let suppliers see how their products were selling
    in each store, so they could plan production and restock shelves before they went empty.


    All of this supported a pricing idea often called "everyday low prices." Many stores use a high-low approach: regular prices are higher, and then big sales pull shoppers in. Walmart aimed instead for
    steady low prices on most items, every day, so customers did not have to wait for a sale. From 1988 to 2007 its slogan was "Always Low Prices. Always." Steady prices also made demand easier to predict,
    which helped the supply chain run smoothly.


    The results were striking. Walmart reached $1 billion in yearly sales in 1980 and its first $100 billion year in 1997. By 2009, it sold through its entire inventory about 8.5 times a year, compared
    with about 6.4 times for Target.


    Walmart''s rise also brought real criticism, which is part of a fair story. Critics have argued that its low prices hurt small-town shops, that it pushed suppliers hard, and that it paid workers too
    little; employees have held strikes over wages, and Walmart has since raised its starting pay. Families can admire the cleverness of the system while still asking who pays for low prices.

    '
  timeline:
  - - July 2, 1962
    - Sam Walton opens the first Walmart in Rogers, Arkansas.
  - - 1970–1971
    - Walmart goes public and opens its first distribution center in Bentonville.
  - - '1980'
    - Annual sales reach $1 billion across 276 stores.
  - - '1983'
    - Stores begin scanning bar codes at checkout.
  - - '1987'
    - Walmart completes the largest private satellite network in the U.S.
  - - 1991–1992
    - Retail Link begins sharing sales data with suppliers.
  - - '1997'
    - Walmart has its first $100 billion sales year.
  numbers:
  - - Satellite network cost (1987)
    - about $24 million
  - - Merchandise moved by cross-docking (widely cited)
    - about 85 percent
  - - Inventory turnover per year (2009)
    - about 8.5 times (Target about 6.4)
  - - Annual sales (1997)
    - over $100 billion
  lessons:
  - 'Activity system fit: Walmart linked store location, distribution centers, private trucking, information systems and everyday low prices. Porter ("What Is Strategy?", 1996) argued that durable advantage
    comes from activities that reinforce each other. Competitors could copy any single practice, but not the whole system, so the advantage lasted.'
  - 'Hub-and-spoke density: Stores were built within driving distance of distribution centers, starting with Bentonville around 1970 to 1971. Density lowers transport cost per store and allows frequent
    restocking. Growth that follows the logistics network, rather than the most attractive isolated markets, can produce lower costs than faster but scattered expansion.'
  - 'Cross-docking and inventory turnover: A widely cited figure says about 85 percent of merchandise was cross-docked, though that may not describe today''s system. In 2009 Walmart turned inventory about
    8.5 times a year versus about 6.4 for Target. Higher turnover means less capital tied up in stock and lower storage costs, which funds lower prices.'
  - 'Information sharing in the supply chain: Bar-code scanning from 1983, a satellite network costing about $24 million in 1987, and Retail Link around 1991 to 1992 gave suppliers store-level sales data.
    Sharing demand data reduces the bullwhip effect described by Lee, Padmanabhan and Whang (1997), in which small changes in demand get amplified upstream.'
  - 'EDLP and demand stability: Everyday low prices avoided the spikes of high-low promotions, making demand easier to predict and the supply chain easier to run. Pricing strategy and operations reinforced
    each other. The model also drew criticism over effects on small-town shops, supplier pressure and wages, which a full assessment of the strategy must weigh.'
  questions:
  - You are a regional retailer in 1985 competing with Walmart. Which part of its system would you try to copy first, and which would you avoid competing on?
  - Using the 2009 turnover figures, estimate how much less inventory Walmart holds than Target per dollar of sales. What does that mean for working capital and pricing?
  - Walmart shared sales data with suppliers through Retail Link. What are the risks for suppliers, and why might they accept them?
  - How should a board weigh efficiency gains against criticism over wages and supplier pressure in a low-cost strategy?
  note: 'Sources differ slightly on dates: Walmart''s own history puts the first distribution center in 1971, while other sources say 1970; Retail Link is dated 1991 by some and 1992 by others. The 85 percent
    cross-docking figure is widely repeated from the 1990s and may not describe Walmart''s system today.'
  sources:
  - name: Walmart, 'Our History'
    url: https://corporate.walmart.com/about/history
  - name: 'CIO, ''45 Years of Wal-Mart History: A Technology Time Line'''
    url: https://www.cio.com/article/274537/infrastructure-45-years-of-wal-mart-history-a-technology-time-line.html
  - name: The Geography of Transport Systems, 'Cross-Docking Distribution Center'
    url: https://transportgeography.org/contents/chapter7/logistics-freight-distribution/cross-docking-distribution-center/
  - name: 'Gallaugher, ''Data Asset in Action: Technology and the Rise of Wal-Mart'' (open textbook)'
    url: https://saylordotorg.github.io/text_information-systems-a-managers-guide-to-harnessing-technology-v2.0/s15-07-data-asset-in-action-technolog.html
  - name: Wikipedia, 'Walmart'
    url: https://en.wikipedia.org/wiki/Walmart
- slug: in-n-out-slow-growth
  title: 'In-N-Out Burger: Growing Slowly on Purpose'
  company: In-N-Out Burger
  year: 1948–present
  industry: Restaurants
  tags:
  - Strategy
  - Operations
  - Culture & people
  summary: In-N-Out Burger has kept a tiny menu, never franchised and never sold stock to the public, growing only as far as its fresh-food supply lines can reach. While other chains raced across the country,
    this family-owned company chose control and consistency over speed.
  moral: Growth limited by a firm's critical capability can protect quality and brand; private ownership and refusal to franchise trade expansion speed and market reach for control.
  story: 'On October 22, 1948, Harry and Esther Snyder opened a tiny hamburger stand in Baldwin Park, California. It was California''s first drive-thru burger stand: customers ordered through a two-way
    speaker box without leaving their cars. The menu was short, the food was cooked to order, and the second location did not open until 1951.


    While other burger chains grew huge by franchising, In-N-Out did something unusual. Franchising means letting other business owners pay to open restaurants under your name and follow your rules. It
    is a fast way to grow because other people put up the money. In-N-Out never did it. Every restaurant is owned and run by the company. It also never sold shares on the stock market, so no outside investors
    can push it to grow faster.


    The menu shows the same discipline. For decades the main items have been a hamburger, a cheeseburger, the Double-Double, French fries, sodas and three flavors of milkshake. When the company added hot
    chocolate in 2018, it was the first new menu item in about 15 years. Fans know about a "not-so-secret" menu, with orders such as "Protein Style" and "Animal Style," but these are mostly new ways of
    combining the same ingredients. A short menu means fewer ingredients to buy, fewer things to go wrong, and faster service. The company also guards its name closely; for example, in 2007 it sued a Utah
    restaurant it said had copied its look and menu.


    Most importantly, In-N-Out only grows as far as its supply chain can reach. It uses fresh beef that is never frozen, and it makes its own patties at company facilities. That is why, as of 2017, all
    of its then 319 restaurants sat within about 500 miles of its distribution centers. When the company wants to enter a new region, it first builds the supply line, then the restaurants. It took until
    1992 to open outside Southern California, in Las Vegas. Texas came in 2011, with a patty-making plant built there around the same time. Colorado followed in 2020, and in 2023 the company announced an
    eastern hub near Nashville, Tennessee, with its first restaurants there starting in late 2025.


    The family has faced hard times. Harry Snyder died in 1976, and his son Rich, just 24, took over. Rich died in a plane crash in 1993, and his brother Guy died in 1999. Esther led the company again until
    her death in 2006. In 2010 the founders'' granddaughter, Lynsi Snyder, became president. In a 2015 CBS interview, asked about going public or franchising, she answered, "I wouldn''t do it," explaining
    she wanted to keep the company the way her family would have wanted.


    Slow growth has costs. Millions of Americans live nowhere near an In-N-Out, and the company has surely left money on the table. But it has more than 400 restaurants in about ten states, a loyal following,
    and a reputation for consistent food.

    '
  timeline:
  - - Oct 22, 1948
    - Harry and Esther Snyder open the first In-N-Out in Baldwin Park, California.
  - - '1976'
    - Harry dies; son Rich Snyder becomes president at 24.
  - - '1992'
    - First restaurant outside Southern California opens in Las Vegas.
  - - '2010'
    - Granddaughter Lynsi Snyder becomes president.
  - - '2011'
    - In-N-Out enters Texas after building a patty plant there.
  - - '2018'
    - Hot chocolate becomes the first new menu item in about 15 years.
  - - 2023–2025
    - Company announces a Tennessee hub; first Nashville-area restaurants open in late 2025.
  numbers:
  - - Restaurants (2017)
    - 319, all within about 500 miles of a distribution center
  - - Restaurants (2026)
    - more than 400 in about 10 states
  - - Franchised restaurants
    - zero
  - - Years between 1st and 2nd location
    - about 3 (1948 to 1951)
  lessons:
  - 'Capability-constrained growth: In-N-Out uses fresh beef and makes its own patties, so it expands only where supply reaches. In 2017 all 319 restaurants sat within about 500 miles of a distribution
    center. Entry into Texas in 2011 was paired with a new patty plant there. Expansion pace should match the capability that defines the product, not market demand alone.'
  - 'Ownership and control: In-N-Out has never franchised and never sold shares. Franchising uses other people''s capital to grow quickly but weakens control over operations. Remaining private removes pressure
    from outside investors for faster growth. The trade-off is slower expansion and capital limited to what the company can fund itself.'
  - 'Strategic trade-offs: The menu barely changed for decades. Hot chocolate in 2018 was the first new item in about 15 years. Porter (1996) argued that strategy means choosing what not to do. A short
    menu lowers ingredient complexity and speeds service, while the not-so-secret menu provides variety with no added complexity.'
  - 'Vertical integration for quality: Owning patty production and distribution gives control over freshness and consistency at the cost of fixed investment in each region. Vertical integration makes sense
    when a critical input is hard to buy reliably from outside suppliers at the required standard.'
  - 'Succession and key-person risk: Harry Snyder died in 1976, and sons Rich and Guy died in 1993 and 1999. Control has passed through the family to Lynsi Snyder in 2010. Family control preserves strategy
    only if succession is planned. Her stated refusal to franchise or go public is an intention, not a legal commitment.'
  questions:
  - You are In-N-Out's CEO and a private equity firm offers capital to triple the store count in five years. What would you need to believe to accept, and what would you require?
  - Estimate the revenue In-N-Out forgoes by staying out of most U.S. states for decades. How would you weigh it against the brand value of scarcity?
  - Which restaurant chains have grown quickly through franchising while keeping quality? What differs in their model?
  - When does a constraint like a 500-mile supply radius become a strategic advantage, and when does it become a liability?
  note: Store counts change often; figures here are from 2017 (Nation's Restaurant News) and mid-2026 (Newsweek). The company says it has no plans to franchise or go public, but these are statements of
    intent, not legal promises.
  sources:
  - name: Wikipedia, 'In-N-Out Burger'
    url: https://en.wikipedia.org/wiki/In-N-Out_Burger
  - name: 'Nation''s Restaurant News, ''The Power List 2017: Lynsi Snyder'''
    url: https://www.nrn.com/quick-service/the-power-list-2017-lynsi-snyder
  - name: Newsweek, 'Map shows In-N-Out to open new restaurants in 5 states' (2026)
    url: https://www.newsweek.com/map-shows-in-n-out-open-new-restaurants-5-states-12151937
- slug: dell-direct-model
  title: 'Dell: Cutting Out the Middleman'
  company: Dell
  year: 1984–2013
  industry: Computers
  tags:
  - Strategy
  - Operations
  - Customers
  summary: Michael Dell started selling computers from his college dorm with $1,000, building each machine only after a customer ordered it. Selling directly, first by phone and then online, made Dell the
    world's top PC seller by 2001, but rivals copied the model and Dell later had to change course.
  moral: A distribution innovation can beat larger rivals through lower inventory and costs, but operational advantages are copyable; lasting success requires repositioning before the model's edge erodes.
  story: 'In 1984 Michael Dell was a freshman at the University of Texas at Austin. He had been upgrading IBM-compatible personal computers and selling them to people he knew. With $1,000, he started a
    company called PC''s Limited. Business grew so fast that he left college after his first year to run it full time. One early model, the Turbo PC, sold for $795, and within months the young company was
    selling tens of thousands of dollars'' worth of computers a month.


    At the time, most people bought computers in stores. A computer maker built machines, shipped them to a store, and the store marked up the price. Computers could sit on store shelves for weeks, and
    because technology changed quickly, an unsold computer lost value every day. Dell''s idea was to skip the store. Customers ordered directly from Dell, first by phone and mail, and Dell built each computer
    to the customer''s choices and shipped it straight to them.


    This direct model had several advantages. Dell did not have to share profit with a store. Because it built computers only after they were ordered, it kept very little inventory, the stock of parts and
    products a company holds, and so it was less likely to get stuck with outdated parts. And because Dell talked directly to its customers, it learned quickly what they wanted.


    The company grew fast. It changed its name to Dell Computer Corporation and sold shares to the public in 1988, raising $30 million. In 1992 it joined the Fortune 500, and Michael Dell, then 27, was
    the youngest chief executive on the list. When the internet arrived, it fit the direct model perfectly. Dell started taking orders online in 1996, and that year its website was soon selling more than
    $1 million worth of computers a day. Dell passed IBM in PC sales in 1999 and Compaq in 2001 to become the world''s top PC seller.


    But a strong idea can be copied. Rivals adopted their own low-cost, build-to-order methods while still selling through stores, and some moved into services and software while Dell stayed focused on
    PCs and servers. Dell began losing sales to a revitalized Hewlett-Packard. Michael Dell stepped down as CEO in 2004 and came back in 2007. That same year, in a big break from its history, Dell announced
    it would sell two desktop models in about 3,000 Walmart stores.


    In 2013, Michael Dell and an investment firm, Silver Lake, bought the company from public shareholders for about $24 billion, taking it private. He said the company''s turnaround needed "more time,
    investment and patience" than public investors would give it. Dell later bought the data-storage company EMC for $67 billion in 2016 and returned to the stock market in 2018.

    '
  timeline:
  - - '1984'
    - Michael Dell founds PC's Limited with $1,000 as a University of Texas freshman.
  - - '1988'
    - Company becomes Dell Computer Corporation and goes public, raising $30 million.
  - - '1992'
    - Dell joins the Fortune 500; Michael Dell, 27, is its youngest CEO.
  - - '1996'
    - Dell begins selling online; web sales soon top $1 million a day.
  - - '2001'
    - Dell becomes the world's top PC seller.
  - - '2007'
    - Michael Dell returns as CEO; Dell announces sales through Walmart stores.
  - - '2013'
    - Michael Dell and Silver Lake take the company private.
  - - '2018'
    - Dell Technologies returns to the stock market.
  numbers:
  - - Starting money (1984)
    - $1,000
  - - Raised in stock offering (1988)
    - $30 million
  - - Online sales (1996)
    - more than $1 million a day
  - - Walmart stores carrying Dell desktops (2007)
    - about 3,000
  - - Going-private deal (2013)
    - about $24 billion
  lessons:
  - 'Disintermediation and inventory: Dell sold directly and built after orders arrived, so it held little inventory in an industry where components lost value quickly. Build-to-order is a textbook example
    of using customer orders to fund operations. In fast-depreciating products, inventory reduction is both a cost advantage and a risk reduction.'
  - 'Direct customer information: Selling directly gave Dell real-time data on customer demand. Online sales, starting in 1996 and soon topping $1 million a day, extended this advantage. Direct channels
    capture information intermediaries would otherwise keep. Use that data to plan production and product mix.'
  - 'Operational effectiveness is not strategy: Rivals adopted low-cost, build-to-order methods while keeping retail channels, and Hewlett-Packard regained share. Porter (1996) distinguished operational
    effectiveness, which competitors can imitate, from strategic positioning, which rests on distinct trade-offs. Dell''s efficiency edge narrowed once others copied it, and it had few other differentiators
    in place. Ask which of your advantages are practices a rival can learn.'
  - 'Channel strategy shift: In 2007 Dell began selling desktops in about 3,000 Walmart stores, a break from its direct-only history. When customers change how they buy, a firm must follow even if it means
    abandoning a defining practice. Rigid adherence to a once-successful model can become its own risk.'
  - 'Ownership and strategic time horizon: In 2013 Michael Dell and Silver Lake took the company private for about $24 billion, saying the turnaround needed patience public investors would not give. The
    company then bought EMC for $67 billion in 2016 and returned to public markets in 2018. Ownership structure can be chosen to match the time horizon of a strategy.'
  questions:
  - You are Dell's CEO in 2004 as competitors copy build-to-order. What new source of advantage would you build, and what would you stop doing?
  - Selling through Walmart in 2007 reversed Dell's identity. How would you manage the channel conflict with direct sales?
  - Michael Dell argued public markets were too impatient. Under what conditions is going private the right answer to a strategic transition?
  - Which current direct-to-consumer brands face the same imitation risk Dell faced, and how should they respond?
  note: 'Reports of the 2013 deal value differ: news coverage at announcement said about $24.4 billion, while Dell''s own history says $24.9 billion, depending on what is counted. The famous dorm-room start
    is confirmed by Dell, though details such as the exact room vary in retellings.'
  sources:
