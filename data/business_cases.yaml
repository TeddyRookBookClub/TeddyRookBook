    url: https://www.yahoo.com/news/boeing-seeks-withdraw-guilty-plea-205458771.html
- slug: theranos-2015
  title: Theranos and the Blood Test That Wasn't
  company: Theranos
  year: 2015–2022
  industry: Health technology
  tags:
  - Ethics & trust
  - Leadership
  - Innovation
  summary: Theranos promised that a few drops of blood from a finger prick could run hundreds of medical tests, and investors valued the startup at about $9 billion. Reporting in 2015 showed the technology
    did not work as claimed; the company shut down, and founder Elizabeth Holmes and former president Sunny Balwani were convicted of fraud.
  moral: Visionary claims must stay distinguishable from verified performance; when investors, partners and boards accept secrecy in place of evidence, governance fails and fraud can follow.
  story: 'In 2003, a 19-year-old Stanford student named Elizabeth Holmes left college to start a company called Theranos. Her idea was exciting. Instead of drawing tubes of blood from your arm, a tiny finger-prick
    sample could be run through a small machine to check for hundreds of diseases, quickly and cheaply. If it worked, it could change health care.


    Over the next decade, Theranos became one of the most celebrated startups in Silicon Valley. It raised more than $700 million from investors, according to the SEC, and private investors valued it at
    about $9 billion at its peak. Famous business leaders and former government officials joined its board. Theranos partnered with the Walgreens drugstore chain to offer its tests in stores in Arizona
    and California. Holmes appeared on magazine covers.


    But the technology did not do what Theranos said it did. In October 2015, Wall Street Journal reporter John Carreyrou published an investigation, based partly on former employees, showing that Theranos
    ran most of its tests on altered machines made by other companies rather than on its own device, and that its results were often unreliable. Regulators began investigating. In 2016 Theranos lost its
    Walgreens partnership, cut about 40 percent of its staff, and saw Holmes barred by regulators from owning or running a lab for two years. Real patients had received inaccurate results from its tests.


    In March 2018, the SEC charged Theranos, Holmes and former company president Ramesh "Sunny" Balwani with an "elaborate, years-long fraud" against investors. The SEC said they had exaggerated the technology,
    falsely suggested it had been used by the U.S. military in battlefield conditions, and projected more than $100 million in revenue for 2014 when the company actually brought in about $100,000. Holmes
    settled without admitting or denying the charges; she paid a $500,000 penalty, gave up control of the company, and was barred from leading a public company for 10 years. Theranos shut down later in
    2018.


    Federal prosecutors then brought criminal charges. In January 2022, a jury found Holmes guilty of four counts of defrauding investors. The same jury found her not guilty on four counts of defrauding
    patients, and could not agree on three other counts. At trial, Holmes testified for days, blamed lab directors for problems, and accused Balwani, her former boyfriend, of abuse. He denied it. In July
    2022, a separate jury convicted Balwani on all 12 counts against him, including fraud against patients. Holmes was sentenced in November 2022 to 11 years and 3 months in prison, and Balwani to nearly
    13 years. The judge ordered them to pay $452 million to victims. Holmes reported to prison in May 2023, and an appeals court upheld her conviction and sentence. In 2025, she asked President Trump to
    commute her sentence, and the request was still pending in 2026.

    '
  timeline:
  - - '2003'
    - Elizabeth Holmes, 19, leaves Stanford and founds Theranos.
  - - 2013–2014
    - Theranos launches tests in Walgreens stores; investors value it at about $9 billion.
  - - Oct 2015
    - The Wall Street Journal reports Theranos's technology does not work as claimed.
  - - '2016'
    - Theranos loses its Walgreens partnership; regulators bar Holmes from running a lab for two years.
  - - Mar 2018
    - The SEC charges Theranos, Holmes and Balwani with fraud; the company shuts down later that year.
  - - Jan 3, 2022
    - A jury convicts Holmes on four counts of defrauding investors and acquits her on patient counts.
  - - July 2022
    - A jury convicts Balwani on all 12 counts.
  - - Nov 18, 2022
    - Holmes is sentenced to 11 years and 3 months in prison.
  numbers:
  - - Peak private valuation
    - about $9 billion (around 2014)
  - - Money raised from investors
    - more than $700 million (SEC, 2018)
  - - Projected vs. actual 2014 revenue (SEC)
    - more than $100 million projected; about $100,000 actual
  - - Holmes's prison sentence
    - 135 months (11 years, 3 months)
  - - Restitution ordered (2023)
    - $452 million
  lessons:
  - 'Due diligence cannot be outsourced to reputation: Theranos raised more than $700 million and reached a valuation of about $9 billion, yet the SEC said it projected over $100 million in 2014 revenue
    against about $100,000 actual, a thousandfold gap. Investors leaned on prestige, press and board names. In private markets with deep information asymmetry, independent technical and financial verification
    is the investor''s job.'
  - 'Board composition must match the core risk: Theranos''s board featured famous business leaders and former government officials, but the company''s central risk was whether a clinical lab technology
    worked. A board of prestige without relevant scientific and regulatory expertise cannot challenge management on the question that matters most. Directors should be chosen to test the firm''s critical
    assumptions, not to lend credibility.'
  - 'Startup optimism has limits in regulated fields: Talking about what a product will become is normal for founders. But in diagnostics, real patients received inaccurate results, which made overpromising
    a safety issue as well as a financial one. A jury acquitted Holmes on patient counts but convicted her on investor fraud, while Balwani was convicted on all 12 counts. The tolerable gap between vision
    and reality shrinks as the harm from error grows.'
  - 'Partners inherit diligence responsibility: Walgreens offered Theranos tests in stores in Arizona and California, which signaled credibility to patients and investors. The partnership ended in 2016
    after the WSJ investigation. When your brand becomes someone else''s evidence, you take on their risk, and your diligence must match the trust you are lending.'
  - 'Secrecy about the core claim is a red flag: The WSJ, drawing partly on former employees, reported that most tests ran on altered machines from other companies, not Theranos''s own device. When management
    blocks access to the data needed to verify the central claim, investors and directors should treat that as a material risk, not as protection of trade secrets.'
  questions:
  - You are a late-stage investor in 2013 offered shares at a valuation implying about $9 billion. What technical, financial and governance diligence would you insist on, and what would you do if the company
    refused?
  - The SEC said Theranos projected more than $100 million in 2014 revenue against about $100,000 actual. What controls should exist between a company's internal forecasts and what it tells investors?
  - You sponsor the Walgreens partnership. What evidence would you require before putting tests in stores, and how would you price the reputational risk into the deal?
  - Holmes was convicted of defrauding investors but acquitted on patient counts, while Balwani was convicted on both. What does this suggest about how legal liability and leadership responsibility can
    diverge?
  note: 'Figures for money raised differ: the SEC cited more than $700 million, while some news reports say nearly $1 billion. Holmes''s abuse allegations against Balwani were made in her testimony and
    denied by him; no court ruled on them. Her 2025 commutation request had not been decided as of September 2026.'
  sources:
  - name: NPR, 'SEC charges Theranos founder Elizabeth Holmes with elaborate, years-long fraud' (2018)
    url: https://www.npr.org/sections/thetwo-way/2018/03/15/593809254/sec-charges-theranos-founder-elizabeth-holmes-with-elaborate-years-long-fraud
  - name: 'NPR, ''Elizabeth Holmes verdict: Former Theranos CEO is found guilty on 4 counts'' (2022)'
    url: https://www.npr.org/2022/01/03/1063973490/elizabeth-holmes-trial-verdict-guilty-theranos
  - name: CNBC via NBC Bay Area, 'Elizabeth Holmes sentenced to more than 11 years in prison' (2022)
    url: https://www.nbcbayarea.com/news/business/money-report/former-theranos-ceo-elizabeth-holmes-sentenced-to-more-than-11-years-in-prison/3082761/?amp=1
  - name: CNBC, 'Elizabeth Holmes will report to jail on May 30' (2023)
    url: https://www.cnbc.com/2023/05/17/disgraced-theranos-ceo-elizabeth-holmes-will-report-to-jail-on-may-30.html/
  - name: ABC7 News, 'Elizabeth Holmes asks Trump administration to commute her prison sentence' (2026)
    url: https://abc7news.com/post/theranos-founder-elizabeth-holmes-requests-president-donald-trump-commute-prison-sentence-us-department-justice/18444913/
- slug: ford-pinto-1970s
  title: The Ford Pinto and the Cost-Benefit Memo
  company: Ford Motor Company
  year: 1971–1980
  industry: Automobiles
  tags:
  - Ethics & trust
  - Finance & risk
  - Operations
  summary: Ford's small, cheap Pinto had a fuel tank that could leak and catch fire in rear-end crashes, leading to a huge jury verdict in 1978 and a recall of 1.5 million cars. A famous 1973 Ford memo
    that put a dollar value on human life is often told as the "Pinto memo," but the real document was about something else, and the full story is more complicated than the legend.
  moral: Cost-benefit analysis is a legitimate tool for safety trade-offs, but its inputs, framing and disclosure will be judged by juries and the public, not only by engineers.
  story: 'In the late 1960s, small, inexpensive imported cars from Japan and Germany were winning American buyers. Ford answered with the Pinto, a low-priced small car launched for the 1971 model year.
    But the Pinto''s fuel tank sat behind the rear axle, and in some rear-end crashes the tank or its filler pipe could be punctured, spilling gasoline that could catch fire.


    The most famous court case began in 1972. A Pinto stalled on a California freeway and was hit from behind. It burst into flames. The driver, Lilly Gray, died, and her 13-year-old passenger, Richard
    Grimshaw, suffered terrible burns that required many surgeries. His family and Gray''s family sued Ford. In February 1978, after a six-month trial that included evidence about Ford''s own crash tests,
    a jury awarded about $2.5 million to Grimshaw and about $560,000 to the Gray family, plus $125 million in punitive damages, which are meant to punish a company rather than just repay a victim. The judge
    cut the punitive award to $3.5 million, and a California appeals court upheld the verdict in May 1981.


    Regulators acted too. The Center for Auto Safety had asked the National Highway Traffic Safety Administration (NHTSA), the federal car-safety agency, for a recall in 1974. In 1977, Mother Jones magazine
    published a sharp article called "Pinto Madness." NHTSA opened a defect investigation that September, ran its own crash tests, and found the fuel system a safety defect. On June 9, 1978, Ford agreed
    to recall about 1.5 million 1971–1976 Pintos and some Mercury Bobcats to add shields and a better filler pipe. In 1980, Ford was put on trial in Indiana for reckless homicide after three young women
    died in a 1978 Pinto fire. The jury found Ford not guilty.


    Then there is the memo. Mother Jones and many later textbooks described a Ford document that seemed to show the company deciding it was cheaper to let people die than fix the Pinto. A real Ford document
    does exist. Written in 1973 by two Ford employees, Grush and Saunby, it was sent to federal regulators to argue against a proposed rule. It estimated that a fix costing about $11 per vehicle, for about
    12.5 million cars and light trucks, would cost $137 million. It weighed that against about $49.5 million in "benefits," based on preventing an estimated 180 burn deaths and 180 serious injuries. For
    each death it used a value of about $200,000, a figure taken from a government estimate of the cost to society of a traffic death.


    What is disputed is what the memo meant. Law professor Gary Schwartz, in a well-known 1991 study, pointed out that the memo was about fuel leaks in rollover crashes for all cars and light trucks, not
    rear-end crashes in the Pinto, and that the Grimshaw judge did not allow it into evidence. He also estimated that Pinto rear-end fires caused about 27 deaths, far fewer than the 500 that Mother Jones
    had claimed without a clear source. Other writers still see the memo as a troubling example of turning human lives into numbers.


    So what lessons hold up? The courts and regulators established that the Pinto''s fuel system was defective and that Ford was liable for harm in the Grimshaw case. Ford did not admit fault in the criminal
    case and was acquitted. And the memo, whatever its exact purpose, became a lasting symbol. Companies must make trade-offs about cost and safety every day, but how they make those choices, and how they
    would look to a jury or a grieving family, matters enormously.

    '
  timeline:
  - - '1971'
    - Ford introduces the Pinto, a low-priced small car.
  - - '1972'
    - Pinto crash in California kills Lilly Gray and badly burns 13-year-old Richard Grimshaw.
  - - Sept 1973
    - Ford's Grush-Saunby cost-benefit analysis on rollover fuel leaks is sent to regulators.
  - - '1977'
    - Mother Jones publishes 'Pinto Madness'; NHTSA opens a defect investigation in September.
  - - Feb 1978
    - A California jury awards $125 million in punitive damages in Grimshaw v. Ford; the judge cuts it to $3.5 million.
  - - June 9, 1978
    - Ford agrees to recall about 1.5 million Pintos.
  - - Mar 13, 1980
    - An Indiana jury finds Ford not guilty of reckless homicide.
  - - May 1981
    - A California appeals court upholds the Grimshaw verdict.
  numbers:
  - - Pintos recalled (1978)
    - about 1.5 million (1971–1976 models)
  - - Grimshaw punitive damages (1978)
    - $125 million by the jury, reduced to $3.5 million
  - - Memo's estimated fix cost
    - about $11 per vehicle, $137 million total (1973 estimate)
  - - Memo's estimated 'benefits'
    - about $49.5 million (1973 estimate)
  - - Rear-end fire deaths (Schwartz estimate)
    - about 27, versus 500 claimed in 1977
  lessons:
  - 'Quantifying risk is unavoidable, framing is a choice: The 1973 Grush-Saunby memo compared an $11-per-vehicle fix, $137 million in total, with about $49.5 million in benefits, using a government estimate
    of about $200,000 per death. Regulators also put values on statistical lives, so the method itself was standard. But a document that reads as pricing deaths against parts will be judged on its language
    and assumptions, not only its arithmetic.'
  - 'Separate documented facts from contested narrative: Schwartz''s 1991 study argued the memo concerned rollover fuel leaks across all cars and light trucks, was not about the Pinto, and was excluded
    from the Grimshaw trial. He estimated about 27 rear-end fire deaths, not the unsourced 500. Whether the memo shaped Pinto design remains unproven. Managers studying any case, and responding to any crisis,
    must keep what is established apart from what is alleged.'
  - 'Internal evidence drives legal exposure: The Grimshaw jury, after hearing evidence about Ford''s own crash tests, awarded $125 million in punitive damages, cut to $3.5 million and upheld in 1981. Ford
    was later acquitted of reckless homicide in Indiana. When internal tests show a known hazard and a fix is not adopted, the legal outcome depends heavily on what the records show about how the choice
    was made.'
  - 'Recall on your terms or the regulator''s: The Center for Auto Safety asked for a recall in 1974. NHTSA opened an investigation only in 1977 and found a defect, and Ford recalled about 1.5 million Pintos
    in June 1978. Waiting until forced lets regulators, the press and plaintiffs set the timeline and the story. Acting early on a known risk usually keeps more control over the fix, its cost and the narrative.'
  questions:
  - You are a Ford planner in 1973 asked to analyze a proposed fuel-system safety rule. How would you build the cost-benefit analysis, which inputs would you challenge, and how would you document it knowing
    a jury may read it?
  - The memo valued a death at about $200,000, a figure taken from a government estimate. Is it defensible for a company to use the value regulators use? What are the alternatives, and what are their weaknesses?
  - Estimates of Pinto rear-end fire deaths range from about 27 to an unsourced 500. How should a company respond when a damaging but inaccurate story takes hold, and when does arguing the facts make things
    worse?
  - Which current decisions, such as autonomous-vehicle software or medical-device design, involve explicit trade-offs between cost and harm? How should firms make and disclose them?
  note: 'Much of the popular Pinto story is contested. Documented: the Grimshaw verdict and its 1981 affirmation; NHTSA''s defect finding and the June 1978 recall; Ford''s 1980 acquittal in Indiana; and
    the 1973 Grush-Saunby analysis with its $11-per-vehicle and $200,000-per-death figures. Disputed: whether that analysis had anything to do with the Pinto''s design (Schwartz and others say it concerned
    rollovers for all vehicles and was excluded from the Grimshaw trial), and how many people died in Pinto fires (estimates range from about 27 to the unsourced 500). Schwartz''s analysis also found the
    Pinto''s overall fatality rate roughly average for small cars of its time. Some summaries still describe the memo as a Pinto-specific decision; we treat that as unproven.'
  sources:
  - name: Center for Auto Safety, 'Ford Pinto Fuel Tank'
    url: https://www.autosafety.org/ford-pinto-fuel-tank/
  - name: Tort Museum, 'Grimshaw v. Ford Motor Company, 1981'
    url: https://www.tortmuseum.org/?p=57
  - name: 'Mark P. Rossow, ''Ethics: An Alternative Account of the Ford Pinto Case'' (PDHonline course summarizing Schwartz, 2015)'
    url: https://pdhonline.com/courses/r152/Ethics-Alternative Account of Pinto .pdf
  - name: EBSCO Research Starters, 'Court Finds Ford Ignored Pinto's Safety Problems'
    url: https://www.ebsco.com/research-starters/law/court-finds-ford-ignored-pintos-safety-problems
- slug: firestone-ford-explorer-2000
  title: Firestone, Ford and the Explorer Tire Recall
  company: Bridgestone/Firestone and Ford
  year: 2000–2001
  industry: Automobiles and tires
  tags:
  - Crisis
  - Customers
  - Leadership
  summary: In 2000, Firestone recalled about 6.5 million tires after tread separations, many on Ford Explorer SUVs, were linked to deadly rollover crashes. Instead of working together, the two companies
    blamed each other, ended their long business relationship, and taught a lasting lesson about how not to handle a shared crisis.
  moral: Shared product risk requires shared data and a pre-agreed crisis protocol; when supply partners fight over blame in public, both brands lose and regulators set the terms.
  story: 'Ford and Firestone had worked together for many decades, and Firestone was a major supplier of tires for Ford vehicles. In the 1990s, one of Ford''s best-selling products was the Explorer, a popular
    sport utility vehicle (SUV), and many Explorers came with Firestone tires.


    Trouble showed up first in other countries. In hot places like Saudi Arabia and Venezuela, the tread on some Firestone tires was peeling away from the tire at highway speed, a failure called tread separation.
    When that happened on an SUV, the vehicle could swerve and roll over. In 1999, Ford began replacing tires on Explorers in Saudi Arabia, and in May 2000 it did the same for about 150,000 tires in Venezuela.
    In the U.S., a researcher at State Farm insurance noticed a pattern of tread-separation claims in 1998 and 1999 and forwarded them to the federal car-safety agency, NHTSA.


    On August 9, 2000, Bridgestone/Firestone, the U.S. arm of Japan''s Bridgestone, announced a recall of about 6.5 million tires: certain sizes of its ATX, ATX II and Wilderness AT models. Many of the
    worst-performing tires had been made at a Firestone plant in Decatur, Illinois. Congress held hearings in September, and by November 2000 it had passed the TREAD Act, a law requiring car and tire makers
    to report safety problems, including problems found overseas, to U.S. regulators sooner.


    As the crisis grew, the two companies turned on each other. Firestone argued that the Explorer itself was part of the problem, pointing out that Ford had recommended a fairly low tire pressure of 26
    pounds per square inch, which can make tires run hotter. Ford said the tires were the problem. In October 2000, Firestone''s top executive, Masatoshi Ono, resigned. On May 21, 2001, Firestone''s new
    chief, John Lampe, wrote to Ford''s chief executive saying Firestone would no longer sign new contracts to supply Ford. The next day, Ford announced it would replace all of its remaining Wilderness
    AT tires, about 13 million of them, at a cost of about $3 billion.


    The government had the final word on the technical question. In October 2001, NHTSA reported that many Wilderness AT tires made before May 1998 had a safety defect, and Firestone agreed to recall another
    3.5 million tires. NHTSA linked 271 U.S. deaths to rollovers and other crashes involving the tire failures. It also said Explorers with tread separations were no more likely to crash than other SUVs
    and that it "found no basis" for Firestone''s claims against the Explorer. Firestone disputed the report, and Ford said it was vindicated. Firestone closed the Decatur plant at the end of 2001 and agreed
    that November to pay $41.5 million to settle lawsuits brought by states.


    Both brands were badly damaged, and families were left grieving. The case is often taught because so much went wrong at once. Warning signs overseas were not shared quickly with U.S. regulators. Two
    longtime partners argued in public instead of solving the problem together. And customers, who simply wanted to know whether their family car was safe, were caught in the middle.

    '
  timeline:
  - - 1998–1999
    - A State Farm researcher spots a pattern of Firestone tread-separation crashes and alerts NHTSA.
  - - Aug 1999
    - Ford begins replacing Firestone tires on Explorers in Saudi Arabia.
  - - May 2000
    - Ford replaces about 150,000 Firestone tires in Venezuela.
  - - Aug 9, 2000
    - Firestone recalls about 6.5 million ATX, ATX II and Wilderness AT tires.
  - - Nov 1, 2000
    - The TREAD Act becomes law, requiring faster defect reporting.
  - - May 21–22, 2001
    - Firestone ends new contracts with Ford; Ford announces it will replace about 13 million more tires.
  - - Oct 4, 2001
    - After NHTSA finds a defect, Firestone agrees to recall another 3.5 million tires.
  numbers:
  - - Tires in the August 2000 recall
    - about 6.5 million
  - - Tires Ford replaced in 2001
    - about 13 million, at about $3 billion
  - - Additional Firestone recall (Oct 2001)
    - 3.5 million tires
  - - U.S. deaths linked by NHTSA
    - 271 (as of 2001)
  - - Ford's recommended Explorer tire pressure
    - 26 psi
  lessons:
  - 'Aggregate weak signals across markets: Ford replaced tires in Saudi Arabia from 1999 and about 150,000 in Venezuela in May 2000, and a State Farm researcher had flagged U.S. claims in 1998 and 1999.
    The U.S. recall of about 6.5 million tires came only in August 2000. Firms need early-warning systems that pool warranty claims, insurer data and foreign field actions. A fix in one country raises a
    disclosure question in all of them.'
  - 'Risk concentrates at component interfaces: Firestone blamed the Explorer and Ford''s 26 psi recommended pressure; Ford blamed the tires. NHTSA found a tire defect and no basis for Firestone''s claims
    about the Explorer, which Firestone disputed. Whatever the technical truth, neither firm owned the interface between tire and vehicle. Supply contracts for safety-critical parts should assign joint
    testing, shared field data and clear ownership of system-level risk.'
  - 'Public blame raises costs for both partners: Firestone''s CEO resigned, Firestone ended new contracts with Ford in May 2001, and the next day Ford said it would replace about 13 million tires at about
    $3 billion. Firestone later recalled 3.5 million more tires, closed its Decatur plant and paid $41.5 million to states. A pre-agreed protocol for joint investigation and communication protects both
    brands better than a public fight.'
  - 'Process variation at one plant can define a brand: Many of the worst-performing tires came from the Decatur, Illinois plant, and NHTSA found a defect in many Wilderness AT tires made before May 1998.
    Plant-level quality monitoring and batch traceability let a firm limit a recall and fix the source. Without them, a local process problem becomes a crisis for the whole brand.'
  - 'Crises produce industry-wide rules: Congress held hearings in September 2000 and passed the TREAD Act by November, requiring car and tire makers to report safety problems, including those found overseas,
    sooner. Regulation followed within about three months of the recall. Firms that disclose early can help shape the rules; those that wait receive rules shaped by their own failures.'
  questions:
  - It is May 2000 and Ford is replacing about 150,000 Firestone tires in Venezuela after doing the same in Saudi Arabia. As Ford's head of safety, what do you owe U.S. regulators and customers, before
    any law requires it?
  - Ford chose to replace about 13 million tires at roughly $3 billion, beyond what regulators required at the time. Evaluate that decision financially and reputationally. What alternatives did Ford have?
  - 'Draft the key terms of a crisis protocol between an automaker and a major supplier: data sharing, joint testing, who speaks publicly, and how costs are split while the investigation is open.'
  - When two partners share responsibility for a product failure, what determines whether cooperation or confrontation better protects each firm's interests?
  note: 'Death counts vary by date and source: about 203 U.S. deaths had been linked by mid-2001, and NHTSA cited 271 by its October 2001 decision, with dozens more reported in Venezuela. Firestone continued
    to dispute NHTSA''s finding that the Explorer was not a factor, and the question of the Explorer''s role was argued in many private lawsuits. This case sticks to NHTSA''s official conclusions.'
  sources:
  - name: CNN Money, 'Firestone may face bigger recall' (2001)
    url: https://money.cnn.com/2001/07/19/companies/firestone/index.htm
  - name: CNN Money, 'Firestone recalls 3.5 million more tires' (2001)
    url: https://money.cnn.com/2001/10/04/recalls/firestone/index.htm
  - name: Ward's Auto, 'Good news for Ford, bad news for Firestone' (2001)
    url: https://www.wardsauto.com/news/archive-wards-good-news-for-ford-bad-news-for-firestone/765019/
