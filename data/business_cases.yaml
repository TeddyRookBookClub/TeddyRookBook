- slug: tata-nano
  title: 'Tata Nano: The Car Nobody Wanted to Be Seen In'
  company: Tata Motors
  year: 2008–2018
  industry: Automobiles
  tags:
  - Marketing
  - Innovation
  - Customers
  summary: Tata Motors set out to build a safe, affordable car for Indian families who were riding four to a motorbike, and in 2008 it unveiled the Nano at about 100,000 rupees (about $2,500). Factory troubles, early fires and a "cheapest car" image kept buyers away, and production stopped in 2018.
  moral: People buy pride along with the product, so never sell anything as merely "cheap."
  story: 'Ratan Tata, chairman of India''s giant Tata Group, said he was moved by a common sight on Indian roads: whole families, sometimes four people, squeezed onto one motorbike, even in pouring monsoon rain. He wanted to build a "people''s car" that those families could afford, and he publicly promised it would cost about 100,000 rupees, also called one lakh.


    On January 10, 2008, at the auto show in New Delhi, Tata Motors unveiled the Nano. The price was 100,000 rupees before taxes, about $2,500 at the time, roughly half the price of India''s cheapest car then. Engineers had cut costs everywhere: a small engine in the back, a top speed of about 65 miles per hour, and in the basic model no air conditioning, power steering or electric windows. Tata kept his price promise even though steel and other costs had risen during the four years of development. Newspapers around the world called it "the world''s cheapest car."


    Then came trouble. Tata had chosen to build the Nano factory in Singur, in the state of West Bengal, on about 997 acres of farmland the state government had acquired. Many farmers said their land had been taken unfairly, and opposition politicians led months of protests. On October 3, 2008, Tata announced it was leaving Singur. It moved production to Sanand, in the state of Gujarat, but the move delayed the car and cost money. In 2016, India''s Supreme Court ruled the land acquisition illegal and ordered the land returned to its owners.


    At first, demand looked strong. In April 2009 Tata took more than 203,000 bookings for the Nano in about two weeks, and deliveries began that July. But then several Nanos caught fire in 2010. Tata said the car''s design was not the cause and blamed extra electrical parts fitted near the exhaust, but it extended the warranty to four years to reassure buyers. The damage to the car''s image was done.


    The biggest problem may have been the word "cheapest." For many families a first car is a sign of moving up in the world, and observers argued that few buyers wanted to be seen in a car known mainly for being cheap. A former auto executive told Business Today that presenting the Nano as cheap rather than innovative was "not the right brand statement." Sales peaked at about 74,500 in the 2011–2012 business year, far below the factory''s capacity of tens of thousands per month. In January 2012 Ratan Tata admitted, "I don''t think we were adequately ready with an advertising campaign and a dealer network." In 2015 he said that marketing the Nano as "cheap" rather than "affordable" had been a mistake.


    Tata tried upgrades, including a better-equipped GenX Nano in 2015, but sales kept falling. By June 2018 the plant built just one Nano, and production soon ended. The Nano was a remarkable piece of engineering and a sincere attempt to help families. It shows that a product has to fit how customers want to feel, not just what they can afford.'
  timeline:
  - - '2006'
    - Tata announces the Nano will be built in Singur, West Bengal.
  - - Jan 10, 2008
    - Nano unveiled in New Delhi at 100,000 rupees (about $2,500) before tax.
  - - Oct 3, 2008
    - Tata pulls out of Singur after land protests; production moves to Sanand, Gujarat.
  - - Apr 2009
    - More than 203,000 bookings in about two weeks.
  - - July 2009
    - First deliveries to customers.
  - - '2010'
    - Several Nano fires; Tata extends the warranty to four years.
  - - 2011–2012
    - Sales peak at about 74,500 cars in one business year.
  - - June 2018
    - Only one Nano is built; production soon ends.
  numbers:
  - - Launch price before tax (2008)
    - 100,000 rupees, about $2,500
  - - Bookings (April 2009)
    - more than 203,000
  - - Best year of sales (fiscal 2011–12)
    - about 74,527
  - - Monthly production capacity vs. sales (Nov 2012)
    - about 21,000 vs. about 3,500
  - - Nanos built in June 2018
    - '1'
  lessons:
  - 'Words matter: calling a product ''cheap'' can make customers feel cheap.'
  - 'Understand why people buy: a car is about pride and safety, not just price.'
  - 'Respect the community: the fight over farmland delayed and damaged the launch.'
  - 'Protect trust early: a few fires early on hurt the brand for years.'
  questions:
  - Why might someone pay more for a product than they need to?
  - How would you have marketed the Nano differently?
  - Who should have a say when a company wants to build a factory on farmland?
  note: The exact end date of production is reported differently; Tata said in mid-2018 that no decision had been taken, though output had nearly stopped. Tata Motors denied that a design flaw caused the 2010 fires. In 2023 an arbitration panel awarded Tata Motors about 766 crore rupees plus interest for its Singur losses.
