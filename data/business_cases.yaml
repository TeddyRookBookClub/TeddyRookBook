- slug: dominos-pizza-turnaround-2009
  title: Domino's Admits Its Pizza Was Bad
  company: Domino's Pizza
  year: 2009–2010
  industry: Restaurants & food delivery
  tags:
  - Customers
  - Marketing
  - Ethics & trust
  summary: 'Domino''s was famous for fast delivery but not for tasty pizza. In late 2009 the company did something almost unheard of: it ran ads showing customers calling its pizza bad, then announced it
    had rebuilt the recipe from scratch. Sales jumped, and the honesty became one of the best-known comebacks in marketing.'
  moral: Public admission of a product's failure builds credibility only when backed by a genuinely better product and consistent execution; candor amplifies whatever customers find when they try again.
  story: 'For years Domino''s Pizza was known for one thing above all: getting a pizza to your door quickly. Customers were loyal, but when people rated pizza chains on taste, Domino''s scored painfully
    low. In focus groups, where companies invite ordinary people to talk honestly about a product, customers said Domino''s pizza was worse than frozen pizza from the microwave and "totally void of flavor."
    Online, people were even meaner.


    By 2009 the business itself was struggling, with sales at existing stores flat and some locations closing. Around 2008 the company had already decided to start over. Its chefs spent about a year and
    a half to two years testing new combinations of dough, sauce, cheese and spices. The new pizza had a garlic-seasoned crust, a bolder tomato sauce, and shredded mozzarella cheese instead of diced cheese.
    Domino''s didn''t just tweak a few toppings. It changed the core recipe it had used for decades.


    Then came the bold part. Starting in December 2009, Domino''s ran TV ads that looked like a documentary. They showed real focus-group comments, including one person saying, "Domino''s pizza crust to
    me is like cardboard," and another saying, "The sauce tastes like ketchup." Company leaders appeared on camera, admitting the criticism stung and explaining what they had changed. The ads invited people
    to try the new pizza, with two medium pizzas for $5.99 each as a starting deal. Comedians joked about it on late-night TV, and many experts thought it was a huge gamble.


    The gamble was personal for Patrick Doyle, who ran Domino''s U.S. business. In January 2010, the company announced that Doyle would take over as chief executive that March, replacing David Brandon,
    who was leaving to become athletic director at the University of Michigan. Doyle had led the pizza remake as head of the U.S. business. He later recalled telling employees, "If people tried (the pizza)
    again and they had a bad experience, we''d be done." If the new pizza disappointed people who had just been told it was better, the brand might never recover. Domino''s also spent a great deal of time
    retraining store workers so the new pizza would be made correctly everywhere.


    The results came quickly. In the first three months of 2010, sales at U.S. Domino''s stores open at least a year rose 14.3 percent compared with a year earlier, a very large jump for a big restaurant
    chain. "We couldn''t be more pleased with the success of our New and Inspired Pizza," Doyle said in the company''s report. Over the following years Domino''s kept investing in better food and in easy
    online ordering, and it grew into one of the world''s largest pizza companies.


    Why did admitting failure work? Customers already knew what they thought of the old pizza. When Domino''s said it out loud, the company showed it was listening and gave people a reason to try again.
    But honesty alone would not have been enough. The new pizza had to actually be better, and enough customers agreed that it was.

    '
  timeline:
  - - About 2008
    - Domino's begins reworking its pizza recipe after harsh feedback from focus groups and online.
  - - Dec 2009
    - Documentary-style ads begin, showing customers calling the old pizza bad.
  - - Jan 5, 2010
    - Domino's announces Patrick Doyle will become CEO, replacing David Brandon.
  - - March 2010
    - Doyle takes over as chief executive.
  - - May 4, 2010
    - Domino's reports U.S. same-store sales up 14.3 percent for the first quarter of 2010.
  numbers:
  - - Time spent reworking the recipe
    - about 18 months to 2 years (2008–2009)
  - - Launch deal (2010)
    - two medium pizzas for $5.99 each
  - - U.S. same-store sales growth, Q1 2010
    - 14.3 percent
  lessons:
  - 'Candor as a costly signal: Domino''s ran ads quoting customers who called its crust "like cardboard" and its sauce "like ketchup." Few companies would air such criticism, which made the claim of change
    believable. The ads confirmed what customers already thought and added new information: the product had changed. Admitting weakness works when it matches customer perception and comes with a credible
    fix.'
  - 'Fix the core product, not the message: Domino''s spent about 18 months to two years rebuilding its dough, sauce, cheese and seasoning, changing a recipe it had used for decades. Compare New Coke: Coca-Cola
    changed a product customers loved, while Domino''s changed one they disliked. Before reformulating, know whether the current product is an asset or a liability in customers'' minds.'
  - 'Execution across the store network: Domino''s spent heavily on retraining store workers so the new pizza would be made correctly everywhere. A campaign that promises a better product drives trial,
    but repeat purchase depends on consistency at every location. In multi-unit and franchised businesses, operational readiness is part of the launch cost and the main determinant of whether the promise
    holds.'
  - 'Lower the cost of trial and measure cleanly: The launch offer of two medium pizzas for $5.99 each reduced customers'' risk of trying again. U.S. same-store sales, which exclude new stores, rose 14.3
    percent in the first quarter of 2010. The note cautions that the economy and ongoing deals also helped. Pair a credibility campaign with a trial offer, but test which element drove results.'
  - 'Align leadership with the bet: Patrick Doyle led the remake as head of the U.S. business and became CEO in March 2010, and he told employees that a bad experience after the relaunch would mean "we''d
    be done." Choosing the leader who owns the strategy keeps it funded and coherent. Contrast Blockbuster, where a leadership change reversed a strategy midstream.'
  questions:
  - It is late 2009. Your new recipe is ready and the agency proposes ads quoting customers who called the old pizza "cardboard." What could go wrong, and what evidence would you require before approving
    the campaign?
  - Domino's paired the campaign with two medium pizzas at $5.99 each. How would you design the offer to maximize trial without training customers to wait for discounts?
  - Same-store sales rose 14.3 percent in the first quarter of 2010. How would you split that gain among the recipe, the advertising, the price promotion and the economy, and how could you test your estimate?
  - Why did changing a core product work for Domino's in 2009 and fail for Coca-Cola in 1985? What general rule would you take to a third company considering a reformulation?
  note: '''Same-store sales'' compares sales at stores open at least a year, so growth from new stores doesn''t count. Some experts at the time worried the ads would remind people why they disliked Domino''s;
    the strong sales results suggested the risk paid off, though better economic conditions and ongoing deals also played a role.'
  sources:
  - name: Domino's Pizza first-quarter 2010 results, press release filed with the SEC
    url: https://www.sec.gov/Archives/edgar/data/1286681/000119312510105392/dex991.htm
  - name: Domino's Pizza press release on CEO succession, filed with the SEC (Jan 5, 2010)
    url: https://www.sec.gov/Archives/edgar/data/1286681/000119312510002829/dex991.htm
  - name: Slate, 'Like Cardboard' Ad Report Card (2010)
    url: https://www.slate.com/articles/business/ad_report_card/2010/01/like_cardboard.html
  - name: Associated Press via HeraldNet, 'Domino's ad campaign admits its old pizza was pretty bad' (2010)
    url: https://www.heraldnet.com/?p=186500
  - name: 'AnnArbor.com, ''Patrick Doyle: Pizza relaunch could have been the end of Domino''s'''
    url: https://www.annarbor.com/business-review/patrick-doyle-pizza-relaunch-could-have-been-the-end-of-dominos/
- slug: patagonia-dont-buy-this-jacket-2011
  title: Patagonia Says 'Don't Buy This Jacket'
  company: Patagonia
  year: '2011'
  industry: Outdoor clothing
  tags:
  - Marketing
  - Ethics & trust
  - Customers
  summary: On Black Friday 2011, the busiest shopping day of the year, outdoor clothing maker Patagonia ran a full-page New York Times ad telling people not to buy its jacket unless they really needed it.
    The ad was part of a larger promise to make gear that lasts and to help customers repair, reuse and recycle it.
  moral: A values claim builds brand equity only as a costly, verifiable signal backed by operations; without that backing, the same message reads as a stunt.
  story: 'Black Friday, the day after Thanksgiving, is famous for crowds, big sales and shopping carts piled high. On that day in 2011, November 25, readers of The New York Times turned to a full-page ad
    from Patagonia, a California company that makes outdoor clothing and gear. Above a photo of one of its best-selling fleece jackets, the R2, the headline said: "Don''t Buy This Jacket."


    The ad explained why. Making that one jacket, it said, used 135 liters of water, enough to meet the daily needs of 45 people. Shipping it from where it was made to Patagonia''s warehouse in Reno, Nevada,
    created nearly 20 pounds of carbon dioxide, a gas that warms the planet. Along the way, the jacket left behind waste equal to about two-thirds of its own weight. And this was a jacket made with 60 percent
    recycled polyester. The message was not that the jacket was bad. It was that everything we buy has a cost to the earth, so we should "buy less and reflect before" spending money.


    The ad pointed readers to Patagonia''s Common Threads Initiative, a pledge with five R''s. Patagonia promised to make long-lasting products, help people repair them, help them find new owners, and take
    back worn-out gear for recycling. Customers were asked to reduce what they buy, repair what breaks, reuse or pass on what they don''t need, and keep old gear out of landfills. The fifth R was to "reimagine
    a world where we take only what nature can replace."


    According to a later account by journalist David Gelles, the idea came from longtime Patagonia executive Rick Ridgeway, and the ad cost about $57,000 to run. Not everyone inside the company was sure
    it was wise. Some worried it would look like a clever trick, or that it would cut sales during the most important shopping season. Then-CEO Casey Sheahan later said the ad brought "$40 million to $50
    million of free publicity." Patagonia''s sales went on to reach new highs in the following years, which led some critics to point out the irony of an ad against buying that may have helped the company
    sell more.


    The repair part of the promise was real, not just words. Patagonia runs a repair center in Reno that the company calls the largest clothing repair operation in North America. By 2017 it employed about
    45 full-time repair technicians and fixed about 40,000 items a year. The company later renamed its repair, resale and used-gear efforts "Worn Wear," sent a repair truck on tours to fix clothing from
    any brand, and worked with the repair website iFixit to publish free guides so people could mend their own gear.


    Patagonia''s founder, Yvon Chouinard, took the idea further in September 2022, when his family gave away its ownership of the company. Most of the company''s stock went to a nonprofit called the Holdfast
    Collective, which was set to receive about $100 million a year in profits to fight the environmental crisis.


    The "Don''t Buy This Jacket" ad worked because it matched what the company actually did. Plenty of companies talk about values. Patagonia backed its words with products built to last and a repair shop
    to keep them going.

    '
  timeline:
  - - Nov 25, 2011
    - The 'Don't Buy This Jacket' ad runs in The New York Times on Black Friday.
  - - Later years
    - Patagonia renames its repair and used-gear efforts 'Worn Wear' and takes repair trucks on tour.
  - - '2015'
    - Patagonia and iFixit publish free do-it-yourself repair guides for Patagonia clothing.
  - - '2017'
    - Patagonia's Reno repair center employs about 45 technicians and fixes about 40,000 items a year.
  - - Sept 14, 2022
    - The Chouinard family transfers ownership of Patagonia to a trust and a nonprofit.
  numbers:
  - - Water used to make one R2 jacket (per the 2011 ad)
    - 135 liters
  - - Cost of the full-page ad (2011)
    - about $57,000
  - - Free publicity estimated by Patagonia's CEO
    - $40 million to $50 million
  - - Repairs per year at Reno center (2017)
    - about 40,000
  - - Profits pledged to environmental work (2022)
    - about $100 million a year
  lessons:
  - 'Costly signaling: Telling customers not to buy on Black Friday was credible because Patagonia had already paid for the claim with durable products and a repair operation. A signal persuades when a
    firm that did not mean it could not afford to send it. Before running a values campaign, check whether your cost structure and products would survive a reporter''s audit.'
  - 'Earned media economics: The ad cost about $57,000, and the CEO estimated $40 million to $50 million in free publicity. That ratio came from the message''s novelty and its contradiction of category
    norms, not from media spend. Estimates of earned media are self-reported and imprecise, so treat them as directional, but the asymmetry shows how a distinctive position can substitute for paid reach.'
  - 'Activity fit: The Reno repair center, with about 45 technicians fixing about 40,000 items a year, the Worn Wear resale program and the iFixit guides all reinforce one position. In Porter''s terms ("What
    Is Strategy?", 1996), activities that support each other are harder to imitate than any single policy. A rival can copy the ad in a week but not the system behind it.'
  - 'The growth paradox: Sales reached new highs after a campaign that asked people to buy less, which critics called ironic. The tension is real: a mission of reduced consumption sits inside a business
    that needs revenue. Managers should state openly how they reconcile the two, here "buy less but better", rather than let critics frame the contradiction for them.'
  - 'Ownership as commitment device: In 2022 the Chouinard family moved about 98 percent of the stock to the Holdfast Collective and the rest to the Patagonia Purpose Trust, directing about $100 million
    a year in profits to environmental work. Governance structure is the most durable way to lock in purpose, because it binds future owners and managers, not only today''s leaders.'
  questions:
  - You are Patagonia's CMO in October 2011 and colleagues fear the ad will cut holiday sales. What evidence would you gather in advance, and what metrics would tell you afterward whether it worked?
  - Critics say the campaign increased consumption. Given that sales rose, how would you defend or reframe the strategy to an environmental group, and to a skeptical investor?
  - Which elements of Patagonia's system (repair, resale, ownership structure) could a publicly traded apparel company adopt, and which depend on private ownership?
  - If a fast-fashion brand ran the same headline tomorrow, how would customers and the press respond, and what does that tell you about the limits of copying a position?
  note: Because Patagonia's sales grew after the ad, some critics argued the campaign still encouraged buying; Patagonia said the point was to buy less but better. The 135-liter and 20-pound figures are
    Patagonia's own estimates from the ad, not independent measurements. In the 2022 ownership change, the Holdfast Collective received about 98 percent of the company's stock and the Patagonia Purpose
    Trust holds the rest.
  sources:
  - name: Patagonia, 'Don't Buy This Jacket' New York Times ad (Nov 25, 2011, PDF)
    url: https://www.patagonia.com/blog/wp-content/uploads/2016/07/nyt_11-25-11.pdf
  - name: GreenBiz/Trellis, 'Patagonia's conscientious response to Black Friday consumer madness' (2011)
    url: https://trellis.net/article/patagonias-conscientious-response-black-friday-consumer-madness
  - name: David Gelles, 'The Secret History of Don't Buy This Jacket'
    url: https://davidgelles.substack.com/p/the-secret-history-of-dont-buy-this
  - name: UC Berkeley Haas, 'Patagonia's Worn Wear' (2017)
    url: https://haas.berkeley.edu/responsible-business/blog/posts/patagonias-worn-wear-2017/
  - name: ABC7 News, 'Patagonia founder Yvon Chouinard gives away company' (2022)
    url: https://abc7news.com/patagonia-founder-yvon-chouinard-news/12230633/
- slug: costco-wages-membership
  title: Costco Pays Well and Charges a Membership
  company: Costco
  year: 1983–2025
  industry: Retail
  tags:
  - Strategy
  - Culture & people
  - Customers
  summary: Costco sells a limited selection of goods at very low markups, earns much of its profit from yearly membership fees, and pays its workers well above most retailers. Wall Street analysts once
    called it too generous, but the model has kept members renewing and employees staying for decades.
  moral: Costco's profit engine is the membership fee, not the merchandise margin; aligning low markups, limited assortment and high wages around that engine creates a system rivals struggle to copy.
  story: 'Costco opened its first warehouse store in Seattle on September 15, 1983. Its founders, Jim Sinegal and Jeffrey Brotman, built on an idea from retail pioneer Sol Price: a giant, plain store with
    concrete floors, items stacked on pallets, and prices so low that shoppers would happily pay a yearly fee just to get in.


    The heart of the model is a simple trade. Costco limits how much it adds to the price of what it sells. According to widely reported company policy, it marks up most brand-name goods no more than 14
    percent over its cost, and its own Kirkland Signature products no more than 15 percent. A typical supermarket marks up many items far more. Costco also keeps its selection small, fewer than 4,000 different
    products in a warehouse, according to its 2024 annual report. Carrying fewer items lets Costco buy each one in huge amounts and push suppliers for better prices. Costco even treats a few prices as promises:
    its food-court hot dog and soda combo has cost $1.50 since 1985.


    With such thin markups, how does Costco make money? A big part of the answer is membership fees. In fiscal 2024, Costco collected about $4.8 billion in membership fees, about half of its operating income
    and roughly two-thirds of its net income. Because members have already paid to shop there, they tend to come back often, and most renew: at the end of 2024, about 93 percent of members in the United
    States and Canada renewed. That September, Costco raised its basic fee from $60 to $65 a year, its first increase since 2017.


    The other unusual part of Costco''s model is how it treats workers. In 2005, The New York Times reported that Sam''s Club, Costco''s main competitor, paid its workers about 42 percent less on average,
    and that Wall Street analysts had warned Sinegal he was being too generous to employees. That same year, about 85 percent of Costco''s U.S. workers had company health insurance, compared with less than
    half at Walmart and Target. Sinegal largely ignored the critics. He argued that well-paid, well-treated workers stay longer and serve customers better, which saves the cost of constantly hiring and
    training new people.


    Costco kept that approach after Sinegal retired in 2012. By the end of fiscal 2024, it said its starting wage in the U.S. and Canada was at least $19.50 an hour and its average U.S. hourly pay was about
    $31. In early 2025, during contract talks with its union workers, Costco announced raises that would bring top-of-scale hourly pay to $30.20 that March, with $1 increases planned for each of the next
    two years.


    Costco''s way of doing business is not the only path to success, and it doesn''t fit every company. In fiscal 2024 Costco earned about $7.4 billion in net income, with about 76 million paid members,
    890 warehouses and 333,000 employees around the world.

    '
  timeline:
  - - Sept 15, 1983
    - Costco opens its first warehouse in Seattle.
  - - '1993'
    - Costco merges with Price Club, the warehouse club started by Sol Price.
  - - '2005'
    - The New York Times reports that analysts call Costco too generous to workers.
  - - Jan 2012
    - Co-founder Jim Sinegal retires as CEO.
  - - Sept 1, 2024
    - Basic membership rises from $60 to $65, the first increase since 2017.
  - - Jan 2025
    - Costco announces raises taking top hourly pay to $30.20 in March 2025.
  numbers:
  - - Maximum markup (company policy)
    - 14 percent on brand names, 15 percent on Kirkland Signature
  - - Membership fees (fiscal 2024)
    - about $4.8 billion
  - - Renewal rate, U.S. and Canada (end of 2024)
    - about 93 percent
  - - Average U.S. hourly pay (end of 2024)
    - about $31
  - - Net income (fiscal 2024)
    - about $7.4 billion
  lessons:
  - 'Profit pool design: In fiscal 2024 Costco collected about $4.8 billion in membership fees against net income of about $7.4 billion. Merchandise is priced near cost, with widely reported markup caps
    of 14 to 15 percent, so the fee is the main source of profit. Know which revenue line actually carries your earnings, then set prices on the other lines to strengthen it.'
  - 'Switching costs and commitment: A paid membership is a sunk cost that pulls members back to recover its value, and about 93 percent in the U.S. and Canada renewed. Fee revenue is recurring and highly
    predictable, which also funds price cuts elsewhere. The September 2024 increase from $60 to $65, the first since 2017, shows the firm treats fee pricing power as something to use sparingly.'
  - 'Limited assortment as scale economy: Carrying fewer than 4,000 products concentrates volume per item, which increases buying power and simplifies operations. The trade-off is less choice for customers.
    This is Porter''s cost leadership achieved through deliberate trade-offs: the firm is defined as much by what it refuses to carry as by what it sells.'
  - 'Efficiency wages and the service-profit chain: Costco pays an average of about $31 an hour in the U.S., and Sinegal argued that higher pay lowers turnover and training costs and improves service. Efficiency
    wage theory and the service-profit chain (Heskett et al., 1994) both predict this link. Pay comparisons with rivals depend on jobs and years, so test the payoff against your own turnover and productivity
    data.'
  - 'Governance and investor pressure: In 2005 analysts called Costco too generous to employees. Management held its position, and the model has sustained decades of growth to about 890 warehouses and 76
    million paid members. Leaders who understand the full economics of a policy can resist short-term pressure, but they must explain those economics to investors in measurable terms.'
  questions:
  - Using the fiscal 2024 figures, estimate what share of Costco's net income comes from fees. What would happen to profits if a competitor forced Costco to cut its fee by $10?
  - You are a CFO at a rival warehouse club considering matching Costco's wages. What data would you need to decide whether the efficiency wage effect would pay for itself in your business?
  - Costco keeps the $1.50 hot dog combo price fixed. What is the strategic purpose of a price that never moves, and when would you break such a promise?
  - Which elements of the Costco model could transfer to a software subscription business, and which depend on physical retail?
  note: The 14 and 15 percent markup limits are widely reported, but they are not spelled out in the company's annual reports. Comparisons with other retailers' pay depend on which jobs and years are compared.
    Some Costco workers are union members represented by the Teamsters, and pay raises in 2025 came during contract talks.
  sources:
  - name: Costco Wholesale, Form 10-K for fiscal 2024 (SEC)
    url: https://www.sec.gov/Archives/edgar/data/909832/000090983224000049/cost-20240901.htm
