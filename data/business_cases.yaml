    url: https://news.bloomberglaw.com/esg/costco-increases-pay-to-over-30-an-hour-for-most-store-workers
  - name: Cornell Catherwood Library summary of New York Times, 'How Costco Became the Anti-Wal-Mart' (2005)
    url: https://catherwood.library.cornell.edu/wit/how-costco-became-the-anti-wal-mart
