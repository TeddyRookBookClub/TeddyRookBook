    url: https://www.businesstoday.in/opinion/perspective/story/tata-nano-a-blemish-on-ratan-tata-brilliant-record-38746-2013-01-28
  - name: 'Gardner Business Media, ''Tata: Branding Nano as Cheap Was a Mistake'' (2015)'
    url: https://www.gardnerweb.com/news/tata-branding-nano-as-cheap-was-a-mistake
