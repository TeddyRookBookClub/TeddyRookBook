crumb: Geometry
title: Geometry
eyebrow: Homeschool · Math
hero: Wentworth's <i>Plane and Solid Geometry</i>, the standard American geometry textbook around 1900, free to read here or download. Teaching guides are on the way.
about:
  title: About the book
  paras:
  - George A. Wentworth (1835–1906) taught mathematics at Phillips Exeter Academy and wrote a long series of school math books for Ginn. His geometry teaches the subject the classical way, as a chain of definitions, axioms and proved theorems, with many original exercises for the student to prove. It suits students of about 13 and up who are comfortable with arithmetic and a little algebra.
  - Plane geometry (Books I–V) covers lines, angles, triangles, circles, proportion, areas and regular polygons. Solid geometry (Books VI–IX) covers planes, solids, the cylinder, cone and sphere. A ruler and compass are all the tools you need, and the site's <a href="/homeschool/calculator/">graphing calculator</a> is handy for checking numbers.
