crumb: McGuffey's Readers
title: McGuffey's Eclectic Readers
eyebrow: Homeschool · Reading
hero: The readers that taught generations of American children to read, from the first letters in the Primer to great literature in the Sixth Reader. All seven books and the McGuffey speller, free to read here or download, with a step-by-step teaching guide for every lesson.
start:
  paras:
  - For a child just learning to read, begin with the <b>Primer</b>, then go on to the <b>First Reader</b>. Each lesson brings in a few new words, shown at the top, followed by a short reading with a picture, and often a line in handwriting to copy.
  - 'An older child who already reads can start wherever the reading feels comfortable but not easy: try a page aloud from the Second or Third Reader. The later books add spelling lists, definitions and notes, and the Fifth and Sixth Readers open with lessons on reading aloud well.'
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
  buttons:
  - label: Primer guides →
    url: homeschool/mcguffey/primer/
    pri: true
  - label: First Reader guides →
    url: homeschool/mcguffey/first-reader/
about:
  title: What are McGuffey's Readers?
  paras:
  - William Holmes McGuffey (1800–1873) was a teacher and minister who taught at Miami University in Ohio and later at the University of Virginia. In the 1830s the Cincinnati publishers Truman & Smith asked him to prepare a series of school readers. The first ones appeared in 1836 and 1837, and his younger brother Alexander added the higher books. Together the readers became one of the best-selling schoolbooks ever printed in America, with sales usually estimated at over 100 million copies.
  - 'The books were revised several times. The 1879 revision, issued by Van Antwerp, Bragg and later printed by the American Book Company, is the edition most homeschool families use today, and the one on this page. It moves step by step: letters and short words in the Primer, simple sentences in the First Reader, then stories, poems and finally selections from great English and American writers, with lessons on reading aloud clearly and with feeling.'
groups:
- title: The seven readers
  note: In order. Ages are rough guides; go by what your child can read comfortably.
  books:
  - id: mcguff1steclprimer01mcguf
    title: McGuffey's Eclectic Primer
    year: Revised edition (this copy printed in 1920)
    level: First steps in reading, about ages 5 to 6
    what: 'Short words with pictures: a cat, a rat, a man. Each lesson adds a few words and a line of handwriting, building to simple sentences.'
    mb: 5.0
    scan: Scanned from a Brigham Young University–Idaho copy.
    guides: /homeschool/mcguffey/primer/
  - id: mcguffeysfirstec00mcgu2
    title: McGuffey's First Eclectic Reader
    year: Revised edition, 1879 (this copy printed about 1920)
    level: Beginning readers, about ages 6 to 7
    what: Short lessons with a picture, the new words listed at the top, and a handwriting line to copy. The sentences grow from a few words to short stories.
    mb: 6.1
    scan: Scanned from a New York Public Library copy.
    guides: /homeschool/mcguffey/first-reader/
  - id: mcguffeyseclecti02mcgu
    title: McGuffey's Second Eclectic Reader
    year: Revised edition, 1879
    level: About ages 7 to 8
    what: Longer stories and simple poems, many about children, animals and home, with the new words for each lesson.
    mb: 13.7
    scan: Scanned from a University of Alberta copy.
    guides: /homeschool/mcguffey/second-reader/
  - id: mcguffeyseclecti03mcgu
    title: McGuffey's Third Eclectic Reader
    year: Revised edition, 1879
    level: About ages 8 to 10
    what: Stories, fables and poems, with words to define and spell at the start of each lesson.
    mb: 16.5
    scan: Scanned from a University of Alberta copy.
    guides: /homeschool/mcguffey/third-reader/
  - id: mcguffeyseclecti04mcgu_0
    title: McGuffey's Fourth Eclectic Reader
    year: Revised edition, 1879
    level: About ages 9 to 11
    what: Selections from well-known writers, with short notes about the authors, definitions, and lessons on reading aloud.
    mb: 15.2
    scan: Scanned from a University of Alberta copy.
    guides: /homeschool/mcguffey/fourth-reader/
  - id: mcguffeyseclecti05mcgu_0
    title: McGuffey's Fifth Eclectic Reader
    year: Revised edition, 1879
    level: About ages 11 to 13
    what: Opens with a course in reading aloud well, then prose and poetry from British and American authors, with notes and definitions.
    mb: 18.5
    scan: Scanned from a University of Alberta copy.
    guides: /homeschool/mcguffey/fifth-reader/
  - id: mcguffeyseclecti06mcgu_0
    title: McGuffey's Sixth Eclectic Reader
    year: Revised edition, 1879
    level: About ages 13 and up
    what: 'The most advanced book: essays, speeches, stories and poems from great writers in English, with notes on each author. Many families use it as a high-school literature reader.'
    mb: 22.8
    scan: Scanned from a University of Alberta copy.
    guides: /homeschool/mcguffey/sixth-reader/
- title: The McGuffey speller
  books:
  - id: mcguffeyseclecti00mcgurich
    title: McGuffey's Eclectic Spelling-Book
    year: Revised edition, 1879
