crumb: Nature Study
title: Nature Study
eyebrow: Homeschool · Nature study
hero: Classic nature books for children, from Clara Dillingham Pierson's talking farmyard animals and Thornton Burgess's bird and animal books to Fabre's insects and Anna Botsford Comstock's great handbook,
  free to read here or download, with a step-by-step teaching guide for the Handbook of Nature-Study.
about:
  title: How to use these books
  paras:
  - Nature study happens outdoors. Read a short chapter together, then go and look for the real thing, in your own garden, a park or a hedge, in whatever season it is now. Spring is for nests and flowers,
    autumn for seeds and spiders. Give each child a nature notebook for drawing what they find, with the date and the place, and a few words about it. Over a year the notebook becomes their own field guide,
    and that one habit does most of the work.
  - Look, but do not take or taste. Never eat a wild plant, berry or mushroom, leave nests and eggs alone, watch stinging insects and wild animals from a distance, and wash hands after handling soil, ponds
    and leaf litter. These books were written a hundred years ago or more. Plant names have changed since, some animals are rarer or more common than they were, and the stories in the read-alouds make the
    animals talk, so talk together about what is story and what is fact.
groups:
- title: Read-alouds about animals
  note: In rough order of reading age. Ages are rough guides; a younger child can listen to most of these read aloud. The animals talk, but the habits they describe are drawn from real life.
  books:
  - id: amongfarmyardpe00pier
    title: Among the Farmyard People
    year: '1899'
    level: About ages 5 to 8, read aloud
    what: Clara Dillingham Pierson's gentle stories of the animals in a farmyard, from the hens and the Big Gobbler to the Blind Horse and the Lame Duckling, told as if the animals could talk to each other.
    mb: 18.3
    scan: Scanned from a Library of Congress copy.
    label: Story form
  - id: amongforestpeopl00pier
    title: Among the Forest People
    year: '1898'
    level: About ages 5 to 9, read aloud
    what: Short stories of the animals and birds of the woods, such as the Ground Hog and the Crow, by the same author. A companion to Among the Farmyard People.
    mb: 13.6
    scan: Scanned from a Library of Congress copy.
    label: Story form
  - id: burgessbirdbookf00burgiala
    title: The Burgess Bird Book for Children
    year: '1919'
    level: About ages 6 to 10, read aloud
    what: Peter Rabbit learns about the birds around him from Jenny Wren and his other feathered neighbours, a bird or two to a chapter, with colour pictures by the bird painter Louis Agassiz Fuertes. Good
      to read with a bird feeder in view.
    mb: 16.7
    scan: Scanned from a University of California Libraries copy.
  - id: burgessanimalboo00burg2
    title: The Burgess Animal Book for Children
    year: '1920'
    level: About ages 6 to 10, read aloud
    what: Peter Rabbit and his friends go to Old Mother Nature's school to learn about the mammals of North America, from mice and squirrels to bears and bison. Pictures by Louis Agassiz Fuertes. The companion
      to the Bird Book.
    mb: 26.6
    scan: Scanned from a New York Public Library copy.
- title: Insects and spiders
  note: True observations by the French naturalist J.-H. Fabre, who spent his life watching insects in his own garden and fields.
  books:
  - id: insectadventures00fabr
    title: Insect Adventures
    year: 1917 (English translation)
    level: About ages 9 to 13
    what: Chapters from Fabre's insect studies, chosen and retold for young people by Louise Seymour Hasbrouck from Alexander Teixeira de Mattos's translation. A good first meeting with Fabre.
    mb: 20.4
    scan: Scanned from a Library of Congress copy.
  - id: thelifeofaspider00fabr
    title: The Life of the Spider
    year: 1916 printing (English translation first published 1912)
    level: About ages 12 and up
    what: Fabre's full chapters on the spiders he watched for years, how they hunt, spin and raise their young, in Teixeira de Mattos's translation, with a preface by Maurice Maeterlinck. For older readers
      after Insect Adventures.
    mb: 12.5
    scan: Scanned from a Smithsonian Libraries copy.
- title: Field guides and handbooks
  note: For the parent to read ahead, and for older children to use on walks.
  books:
  - id: cu31924090281373
    title: Handbook of Nature-Study
    year: 1918 eighth edition (first published 1911)
    level: For parents and teachers; the lessons suit about ages 6 and up
    what: Anna Botsford Comstock's handbook for teachers and parents, based on the Cornell nature-study leaflets, with short lessons on birds, animals, insects, plants and trees, rocks, the weather and
      the sky. Each lesson says what to look for and gives questions to answer by watching.
    mb: 57.9
    scan: Scanned from a Cornell University copy.
    guides: /homeschool/nature-study/handbook-of-nature-study/
    label: Handbook
  - id: howtoknowwildflo00parsrich
    title: How to Know the Wild Flowers
    year: 1920 printing of the new edition with coloured plates (first published 1893)
    level: About ages 10 and up, for walks
    what: Mrs. William Starr Dana (Frances Theodora Parsons) helps you put a name to the common wild flowers of the eastern United States, with the flowers arranged by colour so you can look them up by
      what you see. Some of the plant names have changed since.
    mb: 27.6
    scan: Scanned from a University of California Libraries copy.
    label: Field guide
start:
  paras:
  - Begin with the <b>Handbook of Nature-Study</b>. The teaching guide takes you through its lessons one at a time, so you know what to read ahead and what to look for when you go outside. The read-alouds
    above can go alongside, a chapter at a time.
  buttons:
  - label: Handbook of Nature-Study →
    url: homeschool/nature-study/handbook-of-nature-study/
    pri: true
  steps:
  - Pick a lesson (start with Lesson 1, or one that fits the season).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, then go outside and look.
note: For more science, see <a href="/homeschool/science/">Science</a>, which has Fabre's Story-Book of Science and Arabella Buckley's Fairy-Land of Science.
