crumb: Latin
title: Latin
eyebrow: Homeschool · Latin
hero: Two classic first-year Latin courses from the early 1900s, free to read here or download. D'Ooge's <i>Latin for Beginners</i> has a step-by-step teaching guide for every lesson, written so a parent who has never studied Latin can teach it.
start:
  paras:
  - Start with <b>D'Ooge's Latin for Beginners</b>, about ages 11 to 14 (or any age after that). Each lesson teaches one piece of grammar with a short vocabulary and sentences to translate, and the guides walk you through it and give answers.
  - For practice beyond the book, use the site's <a href="/languages/flashcards/">Latin flashcards</a> and <a href="/languages/sentences/">sentence drills</a>.
  buttons:
  - label: Latin for Beginners guides →
    url: homeschool/latin/latin-for-beginners/
    pri: true
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
about:
  title: About the books
  paras:
  - Benjamin L. D'Ooge (1860–1940) taught Latin and Greek at the Michigan State Normal College, a teachers' college in Ypsilanti. His <i>Latin for Beginners</i> (Ginn, 1909) became one of the most popular first-year Latin books in American schools. It moves in small steps, has many short exercises, and ends with easy Latin stories, including the labors of Hercules.
  - <i>First Year Latin</i> by William C. Collar and M. Grant Daniell (Ginn, 1901) is a similar course from a few years earlier, by two Boston-area schoolmasters. It is a good second book for more practice. Both books use classical (Roman) pronunciation and mark long vowels.
