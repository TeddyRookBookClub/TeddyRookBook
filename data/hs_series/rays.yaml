crumb: Ray's Arithmetic
title: Ray's Arithmetic
eyebrow: Homeschool · Math
hero: 'The arithmetic books generations of American children learned from, now free to read and download, with step-by-step teaching guides for all four main books: Primary, Intellectual, Practical and Higher.'
start:
  paras:
  - For a young child, begin with <b>Ray's New Primary Arithmetic</b>. Every lesson has a guide that tells you what to get out, what to say, and which page of the book to open. Most take about fifteen minutes.
  - Then go on to <b>Ray's New Intellectual Arithmetic</b> (mental arithmetic, fractions, ratio and percentage), then <b>Practical</b> (written arithmetic, measures, percentage and interest, about ages 9 to 12) and <b>Higher</b> (the whole subject in depth, about 12 and up). Each has a guide for every session.
  buttons:
  - label: Primary →
    url: homeschool/rays-arithmetic/primary/
    pri: true
  - label: Intellectual →
    url: homeschool/rays-arithmetic/intellectual/
  - label: Practical →
    url: homeschool/rays-arithmetic/practical/
  - label: Higher →
    url: homeschool/rays-arithmetic/higher/
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
about:
  title: What is Ray's Arithmetic?
  paras:
  - Joseph Ray (1807–1855) grew up on a farm in what is now West Virginia, studied medicine, and then spent his life teaching mathematics in Cincinnati, at Woodward High School and Woodward College. His first arithmetic came out in 1834. Over the next decades it grew into a series, from a first book for small children to a higher arithmetic for older students, and it became one of the most widely used schoolbooks in America, alongside McGuffey's Readers from the same Cincinnati publishers.
  - 'After Ray''s death the series was revised and reissued in 1877 as <i>Ray''s New Arithmetics</i>, the edition most homeschoolers use today, and the one on this page. The method is simple and thorough: count real things first, learn each table by heart, then use it straight away in short story problems, and explain every answer in a full sentence. Old prices and measures aside, the arithmetic is the same today.'
groups:
- title: The six books of the 1877 series
  note: In the usual order. Ages are rough guides; go by what your child can do.
  books:
  - id: raysnewprimarya00raygoog
    title: Ray's New Primary Arithmetic
    year: '1877'
    level: Beginners, about ages 5 to 7
    what: Counting, reading and writing numbers to 100, then the addition, subtraction, multiplication and division tables, story problems, and the tables of money and measures. 89 short lessons with pictures.
    mb: 1.6
    guides: /homeschool/rays-arithmetic/primary/
    scan: Scanned by Google from a Harvard University copy.
  - id: raysnewintellect00rayjrich
    title: Ray's New Intellectual Arithmetic
    year: '1877'
    level: Mental arithmetic, about ages 7 to 10
    what: 'Arithmetic done in the head and explained aloud: the four operations with larger numbers, fractions, and many story problems. Ray''s “intellectual” means mental.'
    mb: 7.9
    guides: /homeschool/rays-arithmetic/intellectual/
    scan: Scanned from a University of California copy.
  - id: raysnewpractical00rayjrich
    title: Ray's New Practical Arithmetic
    year: '1877'
    level: Written arithmetic, about ages 9 to 12
    what: 'Working on paper: long multiplication and division, fractions, decimals, measures, percentage and interest. The core book of the series.'
    mb: 22.6
    scan: Scanned from a University of California copy. (Printed pages 39–42 are missing from this scan.)
    guides: /homeschool/rays-arithmetic/practical/
  - id: raysnewhigherari00rayjrich
    title: Ray's New Higher Arithmetic
    year: about 1880
    level: Advanced, about ages 12 and up
    what: 'The whole subject again in depth: number theory, ratio and proportion, powers and roots, series, and business arithmetic.'
    mb: 32.9
    scan: Scanned from a University of California copy.
    guides: /homeschool/rays-arithmetic/higher/
  - id: raysnewtestexamp00rayjrich
    title: Ray's New Test Examples in Arithmetic
    year: about 1883
    level: Extra practice
    what: Thousands of extra problems for review and tests, arranged to follow the other books.
    mb: 16.5
    scan: Scanned from a University of California copy.
  - id: keytoraysnewarit00rayj
    title: 'Key to Ray''s New Arithmetic: Intellectual and Practical'
    year: later printing (1907 scan)
    level: For the parent
    what: The answers and worked solutions for the Intellectual and Practical books.
    mb: 18.0
    scan: Scanned printing dated 1907.
- title: The algebra books
  note: After the arithmetic, Ray's series went on to algebra. Teaching guides for these are on the way.
  books:
  - id: cu31924031244258
    title: Ray's New Elementary Algebra
    year: '1866'
    level: First algebra, about ages 12 to 15
    what: 'Algebra from the beginning: signs and letters, the four operations, factoring, fractions, equations, powers and roots, and quadratics, with many exercises and their answers.'
    mb: 5.2
    scan: Scanned from a Cornell University copy. The title page reads “Primary Elements of Algebra”.
  - id: cu31924031285806
    title: Ray's New Higher Algebra
    year: '1866'
    level: Advanced algebra, high school and up
    what: 'The whole subject again in more depth, for older students: series, logarithms, the theory of equations and more.'
    mb: 9.4
    scan: Scanned from a Cornell University copy.
  - id: keytoraysnewalge00rayj
    title: Key to Ray's New Algebras, Elementary and Higher
    year: '1867'
    level: For the parent
    what: Worked solutions for both algebra books.
    mb: 8.5
    scan: Scanned from a York University copy.
- title: The 1850s editions
  note: If you have heard of Ray's from the 1850s, these are the books from before the 1877 revision. They teach the same way, with older wording.
  books:
  - id: practicalarithme00rayjrich
    title: Practical Arithmetic, by Induction and Analysis
    year: about 1857
    what: The pre-1877 Practical Arithmetic, as schoolchildren used it in the 1850s.
    mb: 28.2
  - id: raysarithmeticse00rayjrich
    title: 'Ray''s Arithmetic, Second Book: Intellectual Arithmetic'
    year: '1860'
    what: The earlier Intellectual Arithmetic, part of the numbered first, second and third books.
    mb: 11.6
