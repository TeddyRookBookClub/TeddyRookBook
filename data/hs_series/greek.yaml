crumb: Greek
title: New Testament Greek
eyebrow: Homeschool · Greek (Koine)
hero: J. Gresham Machen's <i>New Testament Greek for Beginners</i> (1923), the classic first course in Koine Greek, the Greek of the New Testament. Free to read here or download.
about:
  title: About the book
  paras:
  - J. Gresham Machen (1881–1937) taught New Testament at Princeton Theological Seminary. He wrote this book for students starting Greek with no background, and it is still used today. Its lessons teach Koine Greek forms and grammar step by step, with exercises in both directions and vocabulary drawn from the New Testament.
  - This is <b>Koine</b> Greek, the common Greek of the first century. It is close to, but not the same as, the Homeric Greek of the <i>Iliad</i> and <i>Odyssey</i> and the Attic Greek of Athens. The site's <a href="/languages/alphabet/">Greek alphabet</a> page, <a href="/languages/flashcards/">flashcards</a> and <a href="/languages/reader/">Gospel reader</a> are all Koine too.
