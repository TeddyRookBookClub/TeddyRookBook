crumb: Spelling and Grammar
title: Spelling and Grammar
eyebrow: Homeschool · English
hero: 'Two classic 1800s English books: Noah Webster''s famous “blue-backed speller” and Thomas Harvey''s grammar and composition course. Free to read here or download, with a step-by-step teaching guide for every lesson.'
start:
  paras:
  - <b>Webster's speller</b> teaches reading and spelling by sound, starting with the alphabet and syllables like <i>ba, be, bi, bo, bu</i>, then words of one, two and more syllables. Many families use it alongside a reader such as <a href="/homeschool/mcguffey/">McGuffey's</a>.
  - <b>Harvey's Elementary Grammar</b> is for children who already read well, about ages 9 to 12. Each short lesson explains one idea, such as nouns, verbs or sentences, and ends with exercises, including writing sentences and short compositions.
  buttons:
  - label: Webster's Speller guides →
    url: homeschool/spelling-and-grammar/webster/
    pri: true
  - label: Harvey's Grammar guides →
    url: homeschool/spelling-and-grammar/harvey/
about:
  title: About the books
  paras:
  - Noah Webster (1758–1843), best known for his dictionary, first published his speller in 1783. Later revised and renamed <i>The Elementary Spelling Book</i>, it was used in American schools for more than a century, and its blue cover gave it the nickname “the blue-backed speller.” It also helped set American spellings such as <i>color</i> and <i>center</i>.
  - Thomas W. Harvey (1821–1892) was an Ohio teacher and school leader. His grammars came from the same Cincinnati publishers as McGuffey's Readers and Ray's Arithmetic, and were used widely in the late 1800s. The <i>Elementary Grammar and Composition</i> (1880) is the first of his two books, and the gentler one.
