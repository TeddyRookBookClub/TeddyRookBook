crumb: Writing
title: Writing
eyebrow: Homeschool · Writing
hero: Classic books for learning to write well, from Arnold and Kittredge's Mother Tongue to Palmer's business handwriting and Brooks and Hubbard's Composition-Rhetoric, free to read here or download, with
  step-by-step teaching guides for The Mother Tongue and the Palmer Method.
about:
  title: How to use these books
  paras:
  - Writing grows best a little at a time, most days. Before a child writes something down, let them say it out loud first, telling back a story, describing a picture or a walk, until the sentences come
    easily. Then write a few of those sentences down, and read them back together. Copying a short, good passage, and later writing it from dictation, teaches spelling, punctuation and sentence shape all
    at once.
  - Handwriting is a separate skill, and a few minutes a day does more than one long session a week. Sit well, hold the pen lightly, and stop before the hand gets tired. Palmer's drills and the Spencerian
    copies were made for older children and adults, so a young child may only manage a line or two at first. Some usage and a few rules in these books are old-fashioned; where they differ from what is taught
    now, go with the modern rule.
groups:
- title: Language and composition
  note: In rough order of age.
  books:
  - id: mothertonguebook00arno_0
    title: The Mother Tongue, Book One
    year: '1900'
    level: About ages 9 to 12, over three years
    what: Sarah Louise Arnold and George Lyman Kittredge's lessons in speaking, reading and writing English, in three parts for the fourth, fifth and sixth years of school. Good prose and poems to read,
      talk about and learn by heart, with models to copy and many subjects to write about, and a first introduction to grammar.
    mb: 20.7
    scan: Scanned from an original 1900 Ginn printing.
    guides: /homeschool/writing/mother-tongue/
  - id: mothertongue02arnouoft
    title: The Mother Tongue, Book Two
    year: 1908 revised edition (first published 1900)
    level: About ages 11 to 14
    what: The companion volume, “an elementary English grammar” by the same authors, on the sentence and its parts and then the parts of speech, with many exercises. Introductory chapters on what language
      is are meant to be read aloud and talked over.
    mb: 21.6
    scan: Scanned from a University of Toronto copy.
    label: Grammar
  - id: compositionrheto00broouoft
    title: Composition-Rhetoric
    year: '1905'
    level: About ages 13 to 17
    what: Stratton D. Brooks and Marietta Hubbard's high school course in writing, built on the idea that pupils improve by writing new pieces often, not by copying out corrections. Its aim is to help every
      pupil write freely, clearly and forcibly.
    mb: 24.2
    scan: Scanned from a University of Toronto copy.
    label: Textbook
- title: Handwriting
  note: A few minutes a day.
  books:
  - id: palmermethodofbu00palmrich
    title: The Palmer Method of Business Writing
    year: 1915 edition
    level: About ages 9 and up, and adults
    what: A. N. Palmer's self-teaching lessons in plain, rapid “muscular movement” handwriting, the most widely taught American handwriting of the early twentieth century. Drills of ovals and push-pulls
      come before letters and words.
    mb: 3.7
    scan: Scanned from a University of California Libraries copy.
    guides: /homeschool/writing/palmer-method/
  - id: cu31924029485467
    title: Spencerian Key to Practical Penmanship
    year: '1866'
    level: For parents and older students
    what: The full handbook to the Spencerian system, the flowing, slanted hand of nineteenth-century America, prepared by the “Spencerian Authors”, the sons of its founder Platt Rogers Spencer and their
      associates. It explains position, movement and the forms of the letters, step by step.
    mb: 4.5
    scan: Scanned from a Cornell University copy.
start:
  paras:
  - Begin with <b>The Mother Tongue</b> for speaking and writing, and the <b>Palmer Method</b> for handwriting, side by side. Each guide takes you through its book one lesson at a time.
  buttons:
  - label: The Mother Tongue →
    url: homeschool/writing/mother-tongue/
    pri: true
  - label: The Palmer Method →
    url: homeschool/writing/palmer-method/
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
note: For spelling and grammar, see <a href="/homeschool/spelling-and-grammar/">Spelling and Grammar</a>; for reading, <a href="/homeschool/mcguffey/">McGuffey's Readers</a>. To make handwriting and copywork
  pages, use the <a href="/homeschool/practice-sheets/">practice sheets</a>.
