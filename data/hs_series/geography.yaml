crumb: Geography
title: Geography
eyebrow: Homeschool · Geography
hero: Classic geography books for children, from C. C. Long's Home Geography and Alexis Frye's First Steps to Frank G. Carpenter's travel readers on every continent, free to read here or download, with
  a step-by-step teaching guide for Home Geography.
about:
  title: How to use these books
  paras:
  - Geography starts at your own front door. Begin with what your child can see and walk to, the street, the nearest hill and stream, the way the sun moves across the sky, and draw a simple map of a room,
    then the house, then the neighbourhood. Then widen the circle, to your town, your country, and the whole round world. Keep a globe or a big map near where you read, and find every place in the book
    on it. Carpenter's readers and the Little Cousin books are for that wider circle, read aloud like a journey.
  - These books were written between the 1890s and the 1920s, and much has changed since. Borders and the names of countries and cities have moved, populations have grown, and many of the ways of life they
    describe have gone. The travel books also reflect the attitudes of their time towards other peoples, sometimes in ways that would not be said today. Reading them with an adult nearby, and talking about
    what has changed, is part of the point.
groups:
- title: Start at home
  note: For the first years of geography.
  books:
  - id: homegeographyfor00longrich
    title: Home Geography for Primary Grades
    year: '1894'
    level: About ages 7 to 9
    what: C. C. Long's conversational lessons start with what a child can see close to home, such as hills, streams, ponds and the weather, and use them to imagine the rivers, mountains and seas of the
      wider world.
    mb: 10.9
    scan: Scanned from a University of California Libraries copy.
    guides: /homeschool/geography/home-geography/
  - id: firststepsingeog00fryerich
    title: First Steps in Geography
    year: '1906'
    level: About ages 9 to 12
    what: Alexis Everett Frye's short course for two school years, with many maps and pictures, on how people live with the land, its climate, products, trade and cities. Much of it is about the United
      States. A good next step after Home Geography.
    mb: 20.6
    scan: Scanned from a University of California Libraries copy.
    label: Textbook
- title: Carpenter's Geographical Readers
  note: Frank G. Carpenter takes the children on a “personally conducted tour” of each continent. One book to a continent; read them in any order, with a map open beside you.
  books:
  - id: carpentersgeo00carprich
    title: North America
    year: 1915 revised edition (first published 1898)
    level: About ages 9 to 13
    what: A tour through the United States, Canada, Mexico and Central America, visiting farms, mines, forests, cities and natural wonders such as Niagara Falls, the Grand Canyon and Yellowstone, and on
      north to Alaska.
    mb: 32.3
    scan: Scanned from a University of California Libraries copy.
  - id: southamerica00carprich
    title: South America
    year: 1915 revised edition (first published 1899)
    level: About ages 9 to 13
    what: From New York through the new Panama Canal and down the west coast, over the Andes and Lake Titicaca, round through the Strait of Magellan, and up through Argentina and Brazil to the Amazon.
    mb: 26.4
    scan: Scanned from a University of California Libraries copy.
  - id: carpentersgeogra02carp
    title: Europe
    year: 1912 revised edition (first published 1902)
    level: About ages 9 to 13
    what: Across the Atlantic and through the countries of Europe as they were just before the First World War, steaming down the Rhine and the Danube, climbing the Alps, and watching the midnight sun from
      the North Cape.
    mb: 30.6
    scan: Scanned from a Library of Congress copy.
  - id: carpentersgeogra00carprich
    title: Asia
    year: 1911 revised edition (first published 1897)
    level: About ages 9 to 13
    what: A tour of the countries and peoples of Asia, meant to be read alongside the map to bring the names on it to life.
    mb: 26.3
    scan: Scanned from a University of California Libraries copy.
  - id: carpentersgeog00carprich
    title: Africa
    year: '1905'
    level: About ages 9 to 13
    what: Around and through Africa, from the Mediterranean lands and the Sahara up the Nile to Abyssinia and across to the Indian Ocean. Written in colonial times, so read ahead.
    mb: 24.1
    scan: Scanned from a University of California Libraries copy.
  - id: australiaourcolo00carp
    title: Australia, Our Colonies, and Other Islands of the Sea
    year: '1904'
    level: About ages 9 to 13
    what: A zigzag tour of Australia and the chief islands of the world, especially those that had lately come under the United States, such as Hawaii, Samoa, the Philippines and Puerto Rico. It is written
      from the American point of view of 1904, so read ahead.
    mb: 21.8
    scan: Scanned from a University of California Libraries copy.
- title: Children around the world
  note: From the Little Cousin series, each the story of a child in another country. A few representative titles of many; they are short, and good for ages 7 to 10.
  books:
  - id: cu31924024011664
    title: Our Little Chinese Cousin
    year: '1903'
    level: About ages 7 to 10, read aloud
    what: Isaac Taylor Headland, who lived in China, tells of a Chinese child's home and family life, with pictures from photographs and drawings by Chinese artists.
    mb: 2.0
    scan: Scanned from a Cornell University copy.
    label: Story form
  - id: ourlittlenorwegi00waderich
    title: Our Little Norwegian Cousin
    year: '1903'
    level: About ages 7 to 10, read aloud
    what: Mary Hazelton Wade's story of a child's everyday life in Norway.
    mb: 5.6
    scan: Scanned from a University of California Libraries copy.
    label: Story form
  - id: ourlittlespanish00nixo
    title: Our Little Spanish Cousin
    year: 1910 printing (first published 1906)
    level: About ages 7 to 10, read aloud
    what: Mary F. Nixon-Roulet's story of a child's everyday life in Spain.
    mb: 6.0
    scan: Scanned from a University of North Carolina at Chapel Hill copy.
    label: Story form
start:
  paras:
  - Begin with <b>Home Geography</b>. The teaching guide takes you through it lesson by lesson, starting from what your child can see outside the door. When it is done, go on to First Steps in Geography
    and the Carpenter readers.
  buttons:
  - label: Home Geography →
    url: homeschool/geography/home-geography/
    pri: true
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
note: For the history of the places in these books, see <a href="/homeschool/history/">History</a>.
