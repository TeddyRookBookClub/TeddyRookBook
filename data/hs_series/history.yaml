crumb: History
title: History
eyebrow: Homeschool · History
hero: The story books of Greek and Roman history that children read around 1900, from Famous Men of Greece and Rome to Homer and Plutarch, free to read here or download, with step-by-step teaching guides
  for the Famous Men books.
about:
  title: How to use these books
  paras:
  - These are books to read aloud together, a chapter at a time. After each reading, your child tells the story back in their own words (narration). That one habit does most of the work. Add a map to find
    the places, and a timeline on the wall to pin the names and dates to. The guided books, <i>Famous Men of Greece</i> and <i>Famous Men of Rome</i>, make a good spine. The others in each group can go
    alongside for a fuller picture, or come later for older readers.
  - Books of this age tell the old stories well, but they sometimes tell legends as history, such as Romulus and Remus or the laws of Lycurgus. They also reflect the attitudes of the time they were written
    in. Reading them with an adult nearby is part of the point. Where a story is a legend, the guides say so gently (“this is the story the Romans told”). When a book says something that would not be said
    today, that is worth talking about too.
groups:
- title: Greece
  note: In rough order of reading age. Ages are rough guides; a younger child can listen to most of these read aloud.
  books:
  - id: storyofgreecetol00macg
    title: The Story of Greece, Told to Boys and Girls
    year: undated T. C. & E. C. Jack edition (1910s)
    level: About ages 7 to 11, read aloud
    what: Mary Macgregor tells the story of Greece in short chapters for children, beginning with its myths and legends. This copy has colour plates by Walter Crane.
    mb: 18.2
    scan: Scanned from a New York Public Library copy.
    label: Story form
  - id: famousmengreece00polagoog
    title: Famous Men of Greece
    year: '1904'
    level: About ages 8 to 11
    what: Short life stories of the heroes and leaders of Greece, one or two to a chapter, from the old stories of the gods and heroes to the fall of Greece in 146 B.C. A favourite first history book for
      families who teach history through biography.
    mb: 4.5
    scan: Scanned by Google from a Harvard University copy.
    guides: /homeschool/history/famous-men-of-greece/
  - id: heroesorgreekfai00kingrich
    title: The Heroes, or Greek Fairy Tales for My Children
    year: 1914 edition (first published 1856)
    level: About ages 8 to 12, read aloud
    what: Charles Kingsley retells the stories of Perseus, the Argonauts and Theseus, written for his own children. Good to read before or alongside the history, so the names are familiar.
    mb: 13.3
    scan: Scanned from a University of California Libraries copy.
    label: Myths
  - id: storyofgreeks00guerrich
    title: The Story of the Greeks
    year: '1896'
    level: About ages 9 to 12
    what: H. A. Guerber tells Greek history as a series of short stories, from the myths and early legends to the great days of Athens and Sparta and beyond.
    mb: 15.1
    scan: Scanned from a University of California Libraries copy.
    label: Story form
  - id: childrenshomerad00colu
    title: The Children's Homer
    year: '1918'
    level: About ages 9 to 13
    what: Padraic Colum retells the adventures of Odysseus and the tale of Troy in flowing prose, with pictures by Willy Pogány. A good first meeting with Homer.
    mb: 13.8
    scan: Scanned from a New York Public Library copy.
    label: Homer retold
  - id: storiesfromhomer00churiala
    title: Stories from Homer
    year: '1878'
    level: About ages 10 to 14
    what: Alfred J. Church retells the Iliad and the Odyssey in plain prose, illustrated with John Flaxman's drawings. Closer to Homer's own telling than the Children's Homer, for older readers.
    mb: 11.0
    scan: Scanned from a University of California Libraries copy.
    label: Homer retold
  - id: storyofgreekpeop00tapprich
    title: The Story of the Greek People
    year: '1908'
    level: About ages 11 to 14
    what: Eva March Tappan's “elementary history of Greece”, a connected school history rather than separate stories. A good next step after Famous Men of Greece.
    mb: 16.3
    scan: Scanned from a University of California Libraries copy.
    label: Textbook
- title: Rome
  note: In rough order of reading age.
  books:
  - id: storyofromefrome00macg
    title: The Story of Rome, Told to Boys and Girls
    year: '1912'
    level: About ages 7 to 11, read aloud
    what: Mary Macgregor tells the story of Rome “from the earliest times to the death of Augustus” in short chapters for children.
    mb: 22.0
    scan: Scanned from a New York Public Library copy.
    label: Story form
  - id: famousmenofrome00haarrich
    title: Famous Men of Rome
    year: 1904 (American Book Company printing)
    level: About ages 8 to 11
    what: Short life stories of the famous Romans in order, beginning with Romulus and Numa. The companion to Famous Men of Greece.
    mb: 17.1
    scan: Scanned from a University of California Libraries copy.
    guides: /homeschool/history/famous-men-of-rome/
  - id: storyofromans00guerrich
    title: The Story of the Romans
    year: '1896'
    level: About ages 9 to 12
    what: H. A. Guerber's companion to The Story of the Greeks, telling Roman history as a series of short stories.
    mb: 15.6
    scan: Scanned from a University of California Libraries copy.
    label: Story form
  - id: storiesfromlivy00churiala
    title: Stories from Livy
    year: '1883'
    level: About ages 10 to 14
    what: Alfred J. Church retells the early stories of Rome from the Roman historian Livy, from Romulus and Numa to Lars Porsenna and Coriolanus, with pictures after Pinelli.
    mb: 19.2
    scan: Scanned from a University of California Libraries copy.
    label: Livy retold
  - id: cu31924031441862
    title: The Story of the Roman People
    year: '1910'
    level: About ages 11 to 14
    what: Eva March Tappan's “elementary history of Rome”, the companion to her Story of the Greek People.
    mb: 10.6
    scan: Scanned from a Cornell University copy.
    label: Textbook
- title: Plutarch and the wider world
  note: For going on from Greece and Rome, and for older readers.
  books:
  - id: childshistoryofw0000vmhi
    title: A Child's History of the World
    year: 1924 (the original edition)
    level: About ages 7 to 10, read aloud
    what: V. M. Hillyer, headmaster of the Calvert School, tells the whole story of the world from the earliest times to the end of the First World War, talking straight to the child. This is the 1924 original,
      not the later revised edition. Some passages reflect the attitudes of the 1920s, so read ahead.
    mb: 19.0
    scan: Scanned by the Internet Archive.
  - id: famousmenofmiddl0000john
    title: Famous Men of the Middle Ages
    year: 1904 (American Book Company printing)
    level: About ages 8 to 11
    what: The next book after Famous Men of Rome, with the same short life stories, now of the leaders of the Middle Ages.
    mb: 14.0
    scan: Scanned by the Internet Archive.
    guides: /homeschool/history/famous-men-of-the-middle-ages/
  - id: ourislandstoryhi00marsuoft
    title: Our Island Story
    year: undated thirteenth impression (first published 1905)
    level: About ages 8 to 12, read aloud
    what: H. E. Marshall's history of England for boys and girls, told as stories from the earliest legends to Queen Victoria, with coloured pictures by A. S. Forrest. Many families read it alongside the
      Famous Men books.
    mb: 31.4
    scan: Scanned from a University of Toronto copy.
    label: Story form
  - id: plutarchslivestr01plut_0
    title: Plutarch's Lives, Volume 1
    year: 1911 printing (Clough's revision first published 1859)
    level: About ages 12 and up, or younger read aloud
    what: Plutarch's own lives of famous Greeks and Romans, in the Dryden translation revised by A. H. Clough. This first volume of five has Theseus, Romulus, Lycurgus, Numa, Solon, Poplicola, Themistocles,
      Camillus, Pericles and Fabius. Families often read one life slowly over a term.
    mb: 30.6
    scan: Scanned from a University of North Carolina at Chapel Hill copy.
    label: Primary source
start:
  paras:
  - Begin with <b>Famous Men of Greece</b>, then go on to <b>Famous Men of Rome</b> and <b>Famous Men of the Middle Ages</b>. Each guide covers one chapter or so in a single sitting. It says where and when
    the story happens, has you read it aloud together, and gives prompts for your child to tell it back, a few questions to talk about, and something to remember.
  buttons:
  - label: Famous Men of Greece →
    url: homeschool/history/famous-men-of-greece/
    pri: true
  - label: Famous Men of Rome →
    url: homeschool/history/famous-men-of-rome/
  - label: Famous Men of the Middle Ages →
    url: homeschool/history/famous-men-of-the-middle-ages/
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
note: For the Greek language itself, see <a href="/homeschool/greek/">New Testament Greek</a>; for Latin, <a href="/homeschool/latin/">Latin</a>.
