crumb: Science
title: Science
eyebrow: Homeschool · Science
hero: Classic science books for children and young people, from Agnes Giberne's astronomy and geology to Faraday's candle lectures and Millikan's physics, free to read here or download, with step-by-step
  teaching guides for four of them, plus free modern open textbooks for older students.
about:
  title: How to use these books
  paras:
  - Old science books are wonderful for the things that do not change. They teach children to look closely, ask why, and follow a careful explanation step by step, often written by the scientists themselves
    for young audiences. Read a section together, then go and look. Find the stars, sort a handful of pebbles, watch a candle burn, and ask your child to explain back what they saw and why.
  - Some facts have changed since these books were written, about the planets and their moons, the age of the Earth, and the atom, for example. And some experiments in them are not safe at home. The teaching
    guides flag both. A short “What we know now” note gives the modern picture, and dangerous experiments are marked <b>watch only</b>, with a safe activity to do instead. For older students, the modern
    open textbooks at the end of this page are free and up to date.
extras:
  title: Hands-on physics
  note: An interactive lesson and a game to go with the physics books below.
  items:
  - icon: ⚖️
    title: Why Things Fall Over
    url: /homeschool/science/balancing-physics/
    what: Balance and the centre of gravity, why tall things fall slower, swinging up, a lean that doubles, inertia, energy, wind and chaos, with things to try at home. About ages 10 and up.
    go: Read the lesson →
  - icon: 🛒
    title: Book Cart
    url: /games/book-cart/
    what: Swing a chain of books up from a rolling shopping cart and balance it, with real physics and live numbers on screen, and a Lab for experiments.
    go: Play →
groups:
- title: Astronomy
  note: In rough order of reading age. Ages are rough guides; go by what your child can do.
  books:
  - id: starlandbeingtal00balluoft
    title: Star-Land
    year: 1890 printing (seventh thousand)
    level: About ages 8 to 12, read aloud
    what: Sir Robert Ball, Royal Astronomer of Ireland, wrote up his Christmas lectures for young people at the Royal Institution, starting with the Sun and the Moon and going on to the planets and beyond.
    mb: 43.7
    scan: Scanned from a University of Toronto copy.
  - id: sunmoonstarsastr00gibe
    title: Sun, Moon, and Stars
    year: 1893 revised edition (first published 1879)
    level: About ages 9 to 13
    what: Agnes Giberne's “astronomy for beginners”, a friendly tour of the Sun, the Moon, the planets and the stars, written for children and grown-ups alike. Revised by the author to bring it up to date
      in 1893.
    mb: 25.8
    scan: Scanned from a Library of Congress copy.
    guides: /homeschool/science/sun-moon-and-stars/
  - id: fieldbookofstars00olcorich
    title: A Field Book of the Stars
    year: '1907'
    level: About ages 10 and up, for star-gazing
    what: A small book for learning the constellations season by season, one at a time, with a simple diagram for each. Everything in it can be seen with the naked eye or an opera-glass. It was written
      for the skies of the northern United States.
    mb: 13.1
    scan: Scanned from a University of California Libraries copy.
  - id: astronomywithope00servuoft
    title: Astronomy with an Opera-Glass
    year: 1890 (third edition; first published 1888)
    level: About ages 12 and up
    what: Garrett P. Serviss shows how much of the sky you can explore with a small opera-glass (a pair of binoculars works too), with star maps and directions for finding the constellations and the principal
      stars.
    mb: 11.1
    scan: Scanned from a University of Toronto copy.
  - id: storyofheavens00ballrich
    title: The Story of the Heavens
    year: 1886 (second edition)
    level: About ages 14 and up
    what: Sir Robert Ball's full-length popular astronomy for older readers, with coloured plates. A deeper read after Star-Land.
    mb: 54.0
    scan: Scanned from a University of California Libraries copy.
- title: Geology
  note: In rough order of reading age.
  books:
  - id: worldsfoundation00giberich
    title: The World's Foundations, or Geology for Beginners
    year: 1883 (second edition; first published 1882)
    level: About ages 10 to 14
    what: 'Agnes Giberne''s companion to Sun, Moon, and Stars, written on the same plan for beginners of all ages: what rocks are made of and how to read them, the fossils in them, the story of the Earth''s
      past age by age, and the work of rivers and ice.'
    mb: 29.6
    scan: Scanned from a University of California Libraries copy.
    guides: /homeschool/science/worlds-foundations/
  - id: elementarylesson00geikuoft
    title: Elementary Lessons in Physical Geography
    year: 1889 printing of the revised edition (first published 1877)
    level: About ages 12 and up
    what: Sir Archibald Geikie's school book on the familiar features of the Earth's surface, starting from what children already know and have seen.
    mb: 18.9
    scan: Scanned from a University of Toronto copy.
    label: Textbook
  - id: storyofhillsbook00hutc
    title: The Story of the Hills
    year: '1891'
    level: About ages 13 and up
    what: 'H. N. Hutchinson''s “book about mountains for general readers”, in two parts: mountains as they are, with their weather, plants and animals, and how mountains were made.'
    mb: 18.5
    scan: Scanned from a Library of Congress copy.
- title: Chemistry
  note: In rough order of reading age. These books include experiments that are not safe at home; the guides mark them watch only.
  books:
  - id: wonderbookofchem00fabr
    title: The Wonder Book of Chemistry
    year: 1922 (English translation)
    level: About ages 10 to 14
    what: J.-H. Fabre teaches chemistry as talks by “Uncle Paul” to two boys, Jules and Emile, with experiments made from ordinary things such as bottles and tumblers. Some of the experiments use dangerous
      substances and are for watching only.
    mb: 20.3
    scan: Scanned from a New York Public Library copy.
  - id: chemicalhistoryo00faraiala
    title: The Chemical History of a Candle
    year: 1908 printing (first published 1861)
    level: About ages 11 and up
    what: 'Michael Faraday''s famous lectures to a young audience at the Royal Institution, which start from a burning candle and follow where it leads: the flame, the air, water and breathing. Edited by
      William Crookes.'
    mb: 6.4
    scan: Scanned from a University of California Libraries copy.
    guides: /homeschool/science/chemical-history-of-a-candle/
  - id: firstprincipleso00browrich
    title: First Principles of Chemistry
    year: 1915 revised edition (first published 1907)
    level: About ages 14 and up
    what: A first-year high school chemistry textbook by five New York City high school teachers, with much attention to how things are made in industry.
    mb: 33.9
    scan: Scanned from a University of California Libraries copy.
    label: Textbook
- title: Physics
  books:
  - id: b21496006
    title: The Various Forces of Matter
    year: 1860 (second edition)
    level: About ages 12 and up
    what: Faraday's six Christmas lectures to young people at the Royal Institution in 1859–60, on the forces of nature and how they relate to each other, edited by William Crookes. A companion to The Chemical
      History of a Candle.
    mb: 6.9
    scan: Scanned from a Wellcome Library copy.
  - id: firstcourseinphy00milluoft
    title: A First Course in Physics
    year: '1906'
    level: About ages 14 and up
    what: Robert A. Millikan and Henry G. Gale's physics textbook, which grew out of the elementary physics teaching at the University of Chicago.
    mb: 28.3
    scan: Scanned from a University of Toronto copy.
    guides: /homeschool/science/first-course-in-physics/
    label: Textbook
- title: Science for younger children
  note: Gentle read-alouds for younger children, or for anyone starting out.
  books:
  - id: storybookofscien00fabruoft
    title: The Story-Book of Science
    year: 1917 (English translation)
    level: About ages 8 to 12, read aloud
    what: J.-H. Fabre's Uncle Paul tells the children true stories of the natural world, beginning with the ants.
    mb: 22.3
    scan: Scanned from a University of Toronto copy (the Canadian issue of the Century Co. translation).
  - id: fairylandscience00buckiala
    title: The Fairy-Land of Science
    year: 1880 (first published 1879)
    level: About ages 9 to 13
    what: Arabella Buckley's ten lectures for children on sunbeams, the air, water and ice, sound, a primrose, a piece of coal and bees, showing the forces of nature as the real “fairies” at work in the
      everyday world.
    mb: 15.4
    scan: Scanned from a University of California Libraries copy.
    guides: /homeschool/science/fairy-land-of-science/
start:
  paras:
  - 'Five of the books have a teaching guide for every session: <b>The Fairy-Land of Science</b> for about ages 7 to 10, <b>Sun, Moon, and Stars</b> and <b>The World''s Foundations</b> for about ages 9
    to 13, <b>The Chemical History of a Candle</b> for about 11 and up, and <b>A First Course in Physics</b> for older students. Each guide has a question to start with, a passage to read together, a safe
    thing to try or watch for, and questions to check understanding, with answers.'
  buttons:
  - label: Sun, Moon, and Stars →
    url: homeschool/science/sun-moon-and-stars/
    pri: true
  - label: The World's Foundations →
    url: homeschool/science/worlds-foundations/
  - label: Chemical History of a Candle →
    url: homeschool/science/chemical-history-of-a-candle/
  - label: First Course in Physics →
    url: homeschool/science/first-course-in-physics/
  - label: The Fairy-Land of Science →
    url: homeschool/science/fairy-land-of-science/
  steps:
  - Pick a lesson (start with Lesson 1).
  - Press <b>Teach this lesson</b>.
  - Follow the steps one screen at a time, with the book page beside you.
note: 'The modern textbooks at the bottom are not public domain: they are free to read under the open licenses shown, from their publishers’ own sites.'
open:
- title: Physics
  publisher: OpenStax (Rice University)
  license: CC BY-NC-SA 4.0
  url: https://openstax.org/books/physics/pages/1-introduction
  level: High school, a one-year course, about ages 14 to 18
  what: A full modern high school physics course by Paul Peter Urone and Roger Hinrichs, free to read online. A good next step after Millikan and Gale.
  credit: Access for free at https://openstax.org/books/physics/pages/1-introduction
- title: College Physics 2e
  publisher: OpenStax (Rice University)
  license: CC BY-NC-SA 4.0
  url: https://openstax.org/books/college-physics-2e/pages/1-introduction-to-science-and-the-realm-of-physics-physical-quantities-and-units
  level: Introductory college physics using algebra and trigonometry, no calculus; about ages 16 and up
  what: The algebra-based introductory college course by the same authors, in more depth than the high school book.
  credit: Access for free at https://openstax.org/books/college-physics-2e/pages/1-introduction-to-science-and-the-realm-of-physics-physical-quantities-and-units
- title: Chemistry 2e
  publisher: OpenStax (Rice University)
  license: CC BY-NC-SA 4.0
  url: https://openstax.org/books/chemistry-2e/pages/1-introduction
  level: Two-semester general chemistry (college level); about ages 16 and up
  what: 'A full modern general chemistry course by Paul Flowers, Klaus Theopold, Richard Langley and William R. Robinson. OpenStax also publishes <i>Chemistry: Atoms First 2e</i>, an atoms-first version
    of the same book.'
  credit: Access for free at https://openstax.org/books/chemistry-2e/pages/1-introduction
- title: Astronomy 2e
  publisher: OpenStax (Rice University)
  license: CC BY-NC-SA 4.0
  url: https://openstax.org/books/astronomy-2e/pages/1-introduction
  level: Introductory college astronomy for non-science students; about ages 15 and up
  what: A modern introduction to astronomy, from the night sky and the planets to stars, galaxies and the universe. The up-to-date companion to Giberne and Ball.
  credit: Access for free at https://openstax.org/books/astronomy-2e/pages/1-introduction
- title: Physical Geology – 2nd Edition
  publisher: BCcampus
  license: CC BY 4.0
  url: https://opentextbc.ca/physicalgeology2ed/
  level: Introductory college geology; about ages 15 and up
  what: Steven Earle's comprehensive introduction to physical geology, free to read online. The modern companion to The World's Foundations.
  credit: Physical Geology – 2nd Edition by Steven Earle is used under a Creative Commons Attribution 4.0 International Licence.
