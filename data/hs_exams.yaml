    url: https://www.csmonitor.com/The-Culture/Family/2013/0812/1912-eighth-grade-exam-Could-you-make-it-to-high-school-in-1912
  notes: The original was donated to the Bullitt County History Museum in Shepherdsville, KY. The museum's exam page shows only a scanned image. The museum says the exam was handed out as a scroll, and that pupils gathered at the county courthouse once or twice a year to take this "Common Exam." Passing could earn a scholarship to high school. The museum thinks the copy was a master sent to schools. It warns that the exam contains typesetting errors, such as "eneeavor" for "endeavor" in the spelling list, and that the exam should not be used to compare students then and now. The question text below follows the museum's own wording, as reprinted on its answers page, and the Modern Survival Blog transcription. The two match on every item checked. The bracketed notes the museum added to Geography Q5 ("[Ottoman Empire]", "[Serbia today]", "[early spelling of Romania]") have been removed. "Limit Monarchy" (Civil Government Q1) appears this way in both copies and is kept. The scan includes a spelling
    list (CSM says it has 40 words) that is not in any text transcription found, so it is missing here. Neither copy gives the Reading or Writing tasks or a time limit. The spelling list should be added from the scan before use.
  instructions: null
  sections:
  - name: Spelling, Reading, Writing
    questions:
    - q: 'Spelling: a list of words given by the teacher. (The word list is on the museum''s scan of the original, linked above; it hasn''t been typed out.) Reading and writing were also judged.'
      answer: 'There is nothing to look up here: the word list on the original sheet has not been typed out, so make your own test. Read aloud 20 words, one at a time, from the McGuffey speller or Webster''s Elementary Spelling Book: say the word, use it in a short sentence, and say the word again. The child writes each word in a neat column. Choose mostly longer words of two to four syllables, the kind a 1912 eighth grader was expected to know (for example: separate, necessary, believe, receive, business, February, Wednesday, endeavor, physician, apparatus). Mark each word right or wrong, with no part credit, and have the child copy any missed word correctly three times. The same paper serves as the writing test: grade the penmanship for neatness, even letters and a straight line. For reading, have the child read a page aloud from a McGuffey Fifth or Sixth Reader, then tell back in their own words what it said.'
      then: Spelling was always given orally by the examiner and written by the pupil, and the list was usually drawn from the speller the county used. The museum notes the printed list had typesetting errors ("eneeavor" for "endeavor"), so even the examiners had to read with care. Reading and writing were graded from the pupil's reading aloud and from the handwriting on the papers, not from separate written questions.
      study: Webster's Elementary Spelling Book (see the step-by-step guides at /homeschool/spelling-and-grammar/webster/), or the McGuffey speller; for the reading, McGuffey's Fifth or Sixth Reader.
  - name: Arithmetic
    questions:
    - q: 'Write in words the following: .5764; .000003; .123416; 653.0965; 43.37.'
      answer: '.5764: five thousand seven hundred sixty-four ten-thousandths. .000003: three millionths. .123416: one hundred twenty-three thousand four hundred sixteen millionths. 653.0965: six hundred fifty-three and nine hundred sixty-five ten-thousandths. 43.37: forty-three and thirty-seven hundredths. Method: read the digits after the point as a whole number, then name the place of the last digit (4 places = ten-thousandths, 6 places = millionths), and use "and" only for the decimal point.'
      then: Textbooks insisted that "and" be kept for the decimal point alone, so "six hundred and fifty-three" would be marked wrong here.
      study: Ray's New Practical Arithmetic, Decimal Fractions (numeration and notation of decimals).
    - q:
        Solve: 35.7 plus 4, 5.8 plus 5.14 - 59.112.
      answer: 'The question is garbled as printed, so check what the child thinks it says. The most likely reading is that the comma is a misprint and the problem is 35.7 + 45.8 + 5.14 - 59.112 = 27.528. Read exactly as printed (35.7 + 4 + 5.8 + 5.14 - 59.112) the answer is -8.472, a negative number, which eighth graders of 1912 were not taught, so that reading is unlikely. If every sign is meant to be "plus," the sum is 109.752. Method: line up the decimal points, fill empty places with zeros, add, then subtract. (Python: 35.7+45.8+5.14-59.112 = 27.528; 35.7+4+5.8+5.14-59.112 = -8.472; 35.7+4+5.8+5.14+59.112 = 109.752.)'
      then: 'Both known transcriptions print it the same way ("35.7 plus 4, 5.8 plus 5.14 - 59.112"), and the scan of the original could not be checked here, so the intended problem is uncertain. The point being tested is the same either way: keeping the decimal points in line.'
      study: Ray's New Practical Arithmetic, Addition and Subtraction of Decimals.
    - q: Find cost at 12½ cents per sq. yd. of kalsomining the walls of a room 20 ft. long, 16 ft. wide and 9 ft. high, deducting 1 door 8 ft. by 4 ft 6 in. and 2 windows 5 ft. by 3 ft. 6 in. each.
      answer: '$8.01. Method: the four walls are 20 + 16 + 20 + 16 = 72 ft. around, times 9 ft. high = 648 sq. ft. Take out the door (8 x 4 1/2 = 36 sq. ft.) and the two windows (2 x 5 x 3 1/2 = 35 sq. ft.): 648 - 71 = 577 sq. ft. Divide by 9 to get square yards: 64 1/9 sq. yd. At 12 1/2 cents: 64 1/9 x $0.125 = $8.0139, or $8.01. (Python: (2*(20+16)*9 - 8*4.5 - 2*5*3.5)/9*0.125 = 8.0139.)'
      then: 'Kalsomine (calcimine) was a cheap whitewash-like paint of whiting, glue and water, used on plaster walls and ceilings. Only the walls are asked for, so the ceiling is not included. A handy trick from the textbooks: 12 1/2 cents is 1/8 of a dollar, so divide the square yards by 8.'
      study: Ray's New Practical Arithmetic, Mensuration (plastering and painting) and Denominate Numbers (square measure).
    - q: A man bought a farm for $2400 and sold it for $2700. What percent did he gain?
      answer: '12 1/2 percent. Method: gain = $2,700 - $2,400 = $300; gain divided by cost = 300 / 2,400 = 1/8 = 0.125 = 12 1/2%. (Python: 300/2400*100 = 12.5.)'
      then: Percent of gain or loss is always figured on the cost, not the selling price. A pupil who divided by $2,700 (getting 11 1/9%) would be marked wrong.
      study: Ray's New Practical Arithmetic, Percentage (profit and loss).
    - q: A man sold a watch for $180 and lost 16⅔%. What was the cost of the watch?
      answer: '$216. Method: a loss of 16 2/3% (= 1/6) means he sold it for 5/6 of the cost. So 5/6 of the cost = $180; 1/6 = $36; the whole cost = 6 x $36 = $216. Check: $216 - $180 = $36 loss, and 36/216 = 1/6. (Python: 180/(1-1/6) = 216.0.)'
      then: Textbooks trained pupils to see 16 2/3% as 1/6 at once (like 12 1/2% = 1/8 and 33 1/3% = 1/3), which makes this a quick problem.
      study: 'Ray''s New Practical Arithmetic, Percentage (profit and loss: to find the cost).'
    - q: Find the amount of $50.30 for 3 yrs., 3 mo. and 3 days, at 8 percent.
      answer: '$63.41 (interest $13.11). "Amount" means principal plus interest. Method: 3 yrs. 3 mo. 3 days = 1,173 days, counting 30-day months and a 360-day year; interest = $50.30 x 0.08 x 1,173/360 = $13.1115; amount = $50.30 + $13.11 = $63.41. (Python: 50.30*0.08*1173/360 = 13.1115; plus 50.30 = 63.4115.)'
      then: Schools used the 30-day month and 360-day "commercial year," or the "six percent method" (multiply by 8/6), which gives the same answer.
      study: Ray's New Practical Arithmetic, Simple Interest (to find the amount).
    - q: A school enrolled 120 pupils and the number of boys was two thirds of the number of girls. How many of each sex were enrolled?
      answer: '48 boys and 72 girls. Method: if the girls are 3 parts, the boys are 2 parts, so 5 parts = 120 pupils and 1 part = 24. Girls = 3 x 24 = 72; boys = 2 x 24 = 48. Check: 48 is two thirds of 72, and 48 + 72 = 120. (Python: 120*3/5 = 72; 120*2/5 = 48.)'
      study: Ray's New Practical Arithmetic, Fractions (problems in analysis).
    - q: How long a rope is required to reach from the top of a building 40 ft. high, to the ground 30 ft. from the base of the building?
      answer: '50 ft. Method: the wall, the ground and the rope form a right triangle, so the rope is the hypotenuse: the square root of (40 x 40 + 30 x 30) = the square root of 2,500 = 50 ft. (Python: (40**2 + 30**2)**0.5 = 50.0.)'
      then: This was taught under "Square Root" and its applications to the right-angled triangle; the 3-4-5 triangle (here 30-40-50) was the favorite example.
      study: Ray's New Practical Arithmetic, Involution and Evolution (square root and the right-angled triangle).
    - q: How many steps 2 ft. 4 in. each will a man take in walking 2¼ miles?
      answer: 'About 5,091 steps (exactly 5,091 3/7). Method: 2 1/4 miles x 5,280 ft. = 11,880 ft.; each step is 2 ft. 4 in. = 2 1/3 ft. (28 inches); 11,880 / 2 1/3 = 5,091 3/7 steps. (Python: 2.25*5280/(28/12) = 5091.43.)'
      then: 'Since a man cannot take 3/7 of a step, 5,091 full steps (or 5,092 to finish the walk) would both be accepted if explained. Working in inches gives the same result: 142,560 / 28.'
      study: Ray's New Practical Arithmetic, Denominate Numbers (long measure).
    - q: At $1.62½ a cord, what will be the cost of a pile of wood 24 ft. long, 4 ft. wide and 6 ft. 3 in. high?
      answer: '$7.62 (exactly $7.6171875). Method: the pile holds 24 x 4 x 6 1/4 = 600 cu. ft.; a cord is 128 cu. ft. (8 ft. x 4 ft. x 4 ft.), so 600 / 128 = 4 11/16 cords; times $1.62 1/2 = $7.62. (Python: 24*4*6.25/128*1.625 = 7.6171875.)'
      then: 'Every country child knew the cord: a stack 8 ft. long, 4 ft. wide and 4 ft. high. Firewood at $1.62 1/2 a cord was a realistic price in rural Kentucky.'
      now: Firewood is still sold by the cord (128 cu. ft.), though sellers often use the loose "face cord" or "rick," which is only one row deep.
      study: Ray's New Practical Arithmetic, Denominate Numbers (cubic measure and wood measure).
  - name: Grammar
    questions:
    - q: How many parts of speech are there? Define each.
      answer: Eight. A noun is the name of anything (Kentucky, boy, river). A pronoun is a word used in place of a noun (he, it, they). An adjective is a word used to modify (describe or limit) a noun or pronoun (tall, three, this). A verb is a word that asserts action, being, or state (run, is, seems). An adverb is a word that modifies a verb, an adjective, or another adverb (quickly, very, here). A preposition is a word that shows the relation between its object and some other word (in, over, to). A conjunction is a word that connects words, phrases, or clauses (and, but, because). An interjection is a word that expresses sudden feeling and is not grammatically connected with the rest of the sentence (oh, alas, hurrah).
      then: A few grammars counted nine or ten parts of speech by listing the article (a, an, the) or the participle separately. A pupil who explained this would get credit.
      now: Modern grammars still teach the same eight, though linguists sometimes add determiners (a, the, this) as a separate class.
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), opening lessons on the parts of speech.
    - q: Define proper noun; common noun. Name the properties of a noun.
      answer: A proper noun is the particular name of a person, place, or thing, and begins with a capital letter (Helen, Shepherdsville, the Ohio). A common noun is a name that may be applied to any one of a whole class of things (girl, town, river). The properties of a noun are person, number, gender, and case.
      then: Some grammars listed only gender, number, and case, treating person as belonging chiefly to pronouns. Either list was accepted.
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), lessons on nouns and their properties (modifications).
    - q: What is a Personal Pronoun? Decline I.
      answer: 'A personal pronoun is one that shows by its form whether it stands for the speaker (first person), the one spoken to (second person), or the one spoken of (third person): I, you (thou), he, she, it, and their other forms. Declension of I: Singular: nominative I, possessive my or mine, objective me. Plural: nominative we, possessive our or ours, objective us.'
      then: Declining meant giving the forms for each case in the singular and plural, usually as a small table.
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), the declension of the personal pronouns.
    - q: What properties have verbs?
      answer: 'Voice, mode (mood), tense, person, and number. Voice: active or passive ("William struck James" / "James was struck"). Mode: the manner of the assertion: indicative, subjunctive, potential, imperative (and the infinitive). Tense: the time of the action: present, past, future, present perfect, past perfect, future perfect. Person and number: the verb agrees with its subject in these (I am, he is, they are).'
      then: Grammars of the day often added a fifth mode, the "potential" (may, can, must, might, could, would, should go), which modern books treat as helping verbs, not a mode. Some also listed "form" (common, progressive, emphatic).
      now: 'Today "mood" has replaced "mode," and only three moods are usually taught: indicative, imperative, and subjunctive.'
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), lessons on the modifications of the verb.
    - q: '"William struck James." Change the Voice of the verb.'
      answer: '"James was struck by William." The active voice (the subject acts) becomes the passive voice (the subject is acted upon): the object James becomes the subject, the verb becomes "was struck" (a form of "to be" plus the past participle), and William moves into a phrase with "by." The tense (past) stays the same.'
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), lessons on active and passive voice.
    - q: Adjectives have how many Degrees of Comparison? Compare good; wise, beautiful.
      answer: 'Three: positive, comparative, and superlative. good, better, best (irregular). wise, wiser, wisest (adding -er and -est). beautiful, more beautiful, most beautiful (longer words use more and most). A careful pupil might add the descending forms: beautiful, less beautiful, least beautiful.'
      then: Some grammars noted that adjectives like "round" or "perfect" cannot properly be compared, since nothing can be rounder than round.
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), lessons on the comparison of adjectives.
    - q: 'Diagram: The Lord loveth a cheerful giver.'
      answer: 'In the Reed and Kellogg style: draw a long horizontal base line. Write "Lord" on it, then a short vertical line crossing the base line (to separate subject from predicate), then "loveth," then a short vertical line that stops at the base line (to show a direct object), then "giver." Under "Lord" hang "The" on a slanted line. Under "giver" hang "a" and "cheerful" on two slanted lines. Analysis in words: a simple declarative sentence. Subject: Lord, modified by the article "The." Predicate: loveth (old form of "loves"). Object: giver, modified by "a" and "cheerful."'
      then: The sentence is adapted from the King James Bible, 2 Corinthians 9:7 ("God loveth a cheerful giver"), so pupils would have known it from church and school. "Loveth" is the old third-person form of "loves," and still a transitive verb, present tense.
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), the diagramming lessons (simple sentences with objects and adjective modifiers).
    - q: 'Parse all the words in the following sentences: "John ran over the bridge." "Helen''s parents love her."'
      answer: '"John ran over the bridge." John: proper noun, third person, singular number, masculine gender, nominative case, subject of "ran." ran: irregular verb (run, ran, run), intransitive, indicative mode, past tense, third person, singular number, agreeing with its subject "John." over: preposition, showing the relation between "bridge" and "ran." the: definite article (an adjective), limiting "bridge." bridge: common noun, third person, singular, neuter gender, objective case, object of the preposition "over." "Helen''s parents love her." Helen''s: proper noun, third person, singular, feminine gender, possessive case, modifying "parents." parents: common noun, third person, plural, common gender (both masculine and feminine), nominative case, subject of "love." love: regular verb, transitive, active voice, indicative mode, present tense, third person, plural number, agreeing with "parents." her: personal pronoun, third person, singular, feminine, objective case, object of "love";
        its antecedent is "Helen(''s)."'
      then: To "parse" meant to name each word's part of speech, its properties (person, number, gender, case, mode, tense) and its use in the sentence, in a fixed order. Some grammars would call "over the bridge" an adverb phrase modifying "ran"; a pupil could add that.
      study: Reed & Kellogg's Higher Lessons in English (or Harvey's English Grammar), the lessons and models on parsing.
  - name: Geography
    questions:
    - q: Define longitude and latitude.
      answer: Longitude is distance east or west of a chosen prime meridian (usually the meridian of Greenwich, near London), measured in degrees, up to 180 degrees east or west. Latitude is distance north or south of the equator, measured in degrees, up to 90 degrees north or south. Lines of latitude (parallels) run east and west; meridians (lines of longitude) run from pole to pole.
      then: American books of the time sometimes also gave longitude from Washington, D.C. Greenwich became the international standard in 1884.
      study: The opening chapter of a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
    - q: Name and give the boundaries of the five zones.
      answer: The torrid zone lies between the Tropic of Cancer (23 1/2 degrees north) and the Tropic of Capricorn (23 1/2 degrees south), with the equator through its middle. The north temperate zone lies between the Tropic of Cancer and the Arctic Circle (66 1/2 degrees north). The south temperate zone lies between the Tropic of Capricorn and the Antarctic Circle (66 1/2 degrees south). The north frigid zone lies between the Arctic Circle and the North Pole. The south frigid zone lies between the Antarctic Circle and the South Pole.
      then: 'Textbooks explained the zones by the sun: in the torrid zone the sun is directly overhead at some time of year; in the frigid zones there is at least one day with no sunset and one with no sunrise.'
      now: The tropics are now placed at about 23.44 degrees and the polar circles at about 66.56 degrees; they shift very slowly as the earth's tilt changes.
      study: The chapter on the earth's motions and zones in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
    - q: Tell what you know of the Gulf Stream.
      answer: The Gulf Stream is a great warm current, a "river in the ocean." Warm water driven west across the Atlantic by the trade winds piles up in the Caribbean Sea and the Gulf of Mexico, and pours out through the Straits of Florida between Florida and Cuba. It flows northward along the coast of the United States, deep blue and warmer than the sea around it, then turns northeast off Cape Hatteras and the Newfoundland banks and spreads across the Atlantic toward the British Isles and Norway. It is about 50 miles wide off Florida and moves some 4 or 5 miles an hour there. Where it meets the cold Labrador Current near Newfoundland it causes thick fogs. It warms the winds that blow over it, which is given as the reason that the British Isles and northwestern Europe have mild winters compared with places as far north in America (such as Labrador), and that Norway's ports stay open in winter.
      then: Books of the time credited the Gulf Stream with nearly all of western Europe's mild climate.
      now: Scientists now say the Gulf Stream is driven mainly by the winds and the earth's rotation, and the warm westerly winds and the ocean's general circulation share credit for Europe's mild climate. It is part of a larger Atlantic circulation (the AMOC) that scientists are watching for signs of weakening as the climate warms.
      study: The chapter on ocean currents in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
    - q: Locate Erie Canal; what waters does it connect, and why is it important?
      answer: The Erie Canal is in the State of New York. It runs about 363 miles from Buffalo, on Lake Erie, east through Rochester, Syracuse and Utica along the Mohawk Valley to the Hudson River at Albany (Troy). It connects Lake Erie (and so the whole chain of the Great Lakes) with the Hudson River, which flows to New York City and the Atlantic Ocean. It is important because it gave the first cheap water route between the Atlantic coast and the West. It was opened in 1825 under Governor DeWitt Clinton, cut the cost of freight from Buffalo to New York to a small fraction of the wagon rate, carried grain and settlers west and east, helped settle the Great Lakes states, and made New York City the leading port and commercial city of the nation.
      then: In 1912 the canal was being rebuilt as the larger New York State Barge Canal, finished in 1918.
      now: Today it is part of the New York State Canal System and is used mostly by pleasure boats; it is a National Heritage Corridor.
      study: The New York State pages of a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography); the Erie Canal section of a period school U.S. history (such as Montgomery's or Fiske's).
    - q: 'Locate the following countries which border each other: Turkey, Greece, Servia, Montenegro, Roumania.'
      answer: 'All five are in the Balkan Peninsula of southeastern Europe. As of early 1912: Turkey (European Turkey) stretched across the middle of the peninsula from the Black Sea, the Bosporus and Constantinople (its capital) west to the Adriatic Sea, taking in Thrace, Macedonia and Albania; it bordered Greece on the south, Bulgaria, Servia and Montenegro on the north. Greece was at the southern end of the peninsula, between the Ionian and Aegean Seas, with Turkey on the north; capital Athens. Servia was an inland kingdom south of the Danube and Save rivers (Austria-Hungary across them), with Bulgaria to the east, Turkey to the south, and a short Danube border with Roumania to the northeast; capital Belgrade. Montenegro was a small mountain kingdom on the Adriatic, between Austria-Hungary (Bosnia-Herzegovina and Dalmatia) and Turkey (Albania); capital Cetinje. Roumania lay north of the lower Danube, between Austria-Hungary and Russia on the north and west and Bulgaria on the south, with
        the Black Sea on the east; capital Bucharest.'
      then: 'The question is a little loose: not every pair bordered each other. Roumania was separated from Turkey by Bulgaria (left off the list, though independent since 1908), and Servia and Montenegro were kept apart by a strip of Turkish land, the Sanjak of Novi Pazar. Also, the map changed within months: the First Balkan War broke out in October 1912, and by 1913 Turkey had lost nearly all its European land, Servia and Montenegro had divided the Sanjak and touched, and Albania became a separate state. The answer depends on whether the exam was given before or after the war.'
      now: Turkey has been a republic since 1923 and keeps only eastern Thrace in Europe, with Ankara as capital and Istanbul (Constantinople) its largest city. Servia is Serbia; Roumania is Romania. Montenegro (capital Podgorica; Cetinje is the old royal capital) became independent again in 2006 after being part of Yugoslavia. The region now also includes Albania, North Macedonia, Bulgaria, and Kosovo.
      study: The map of the Balkan Peninsula in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography); a modern atlas for today's borders.
    - q: Name and give the capitals of States touching the Ohio River.
      answer: 'Six States touch the Ohio River: Pennsylvania (Harrisburg), Ohio (Columbus), West Virginia (Charleston), Kentucky (Frankfort), Indiana (Indianapolis), and Illinois (Springfield). The river is formed at Pittsburgh by the Allegheny and Monongahela rivers and flows into the Mississippi at Cairo, Illinois; it forms the whole northern boundary of Kentucky.'
      now: Unchanged today. Under the 1792 boundary, Kentucky's line runs along the north shore, so nearly all of the river along Kentucky belongs to Kentucky.
      study: The map of the Central States in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
    - q: 'Locate these cities: Mobile, Quebec, Buenos Aires, Liverpool, Honolulu.'
      answer: 'Mobile: in southwestern Alabama, at the head of Mobile Bay, at the mouth of the Mobile River, on the Gulf of Mexico; Alabama''s seaport, shipping cotton and lumber. Quebec: in Canada, on the north bank of the St. Lawrence River where it narrows (at the mouth of the St. Charles), on a high bluff; capital of the province of Quebec. Buenos Aires: in Argentina, on the south bank of the wide estuary of the Rio de la Plata; capital and chief port of Argentina. Liverpool: in western England, on the east bank of the Mersey River near its mouth on the Irish Sea; the great English port for cotton and the Atlantic trade with America. Honolulu: on the south coast of the island of Oahu, in the Hawaiian Islands, in the middle of the Pacific Ocean; capital of the Territory of Hawaii and a coaling and naval station.'
      then: Hawaii was annexed by the United States in 1898 and became a territory in 1900.
      now: Hawaii became the 50th State in 1959, and Honolulu is its capital.
      study: The maps of the Southern States, Canada, South America, the British Isles, and the Pacific islands in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
    - q: Name in order of their size three largest States in the United States.
      answer: 'In 1912: Texas (about 266,000 sq. mi.), California (about 158,000 sq. mi.), and Montana (about 147,000 sq. mi.).'
      then: In 1912 there were 48 States (New Mexico and Arizona were admitted that January and February). Alaska was a district, not a State, so it did not count.
      now: Since Alaska became a State in 1959, the three largest are Alaska (about 665,000 sq. mi.), Texas, and California; Montana is now fourth.
      study: The table of States and areas in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography) (or a period almanac).
    - q: 'Locate the following mountains: Blue Ridge, Himalaya, Andes, Alps, Wasatch.'
      answer: 'Blue Ridge: in the eastern United States, the easternmost range of the Appalachian system, running from southern Pennsylvania through Maryland, Virginia and North Carolina into northern Georgia; its highest peaks are in western North Carolina. Himalaya: in Asia, along the northern border of India, between the plain of the Ganges and the plateau of Tibet; the highest mountains in the world, with Mount Everest the highest peak. Andes: in South America, along the whole western (Pacific) side of the continent from the Caribbean to Cape Horn; the longest mountain chain, with Aconcagua the highest peak in the Americas. Alps: in south-central Europe, curving through southeastern France, Switzerland, northern Italy, southern Germany and Austria; Mont Blanc is the highest peak. Wasatch: a range of the Rocky Mountains in northern Utah (reaching into southeastern Idaho), just east of Salt Lake City and Great Salt Lake.'
      now: Everest is now measured at 29,032 feet (older books said about 29,002). Mount Mitchell in the Black Mountains, a spur of the Blue Ridge, is the highest point east of the Mississippi.
      study: The relief maps of North America, Asia, South America and Europe in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
    - q: Through what waters would a vessel pass in going from England through the Suez Canal to Manila?
      answer: 'From London: down the Thames, through the Strait of Dover and the English Channel into the Atlantic Ocean (crossing the Bay of Biscay), through the Strait of Gibraltar, the length of the Mediterranean Sea to Port Said, through the Suez Canal (by way of the Bitter Lakes) to Suez, through the Gulf of Suez and the Red Sea, the Strait of Bab el Mandeb, the Gulf of Aden, the Arabian Sea (Indian Ocean), past Ceylon, across the Bay of Bengal to the Strait of Malacca, past Singapore, then northeast across the China Sea to Manila Bay. (From Liverpool, the ship would start through the Irish Sea and St. George''s Channel instead of the English Channel.)'
      then: Manila had belonged to the United States since 1898, so this was the regular route for mail and troops from Europe to the Philippines.
      now: The Philippines have been independent since 1946, with Manila as capital. Ships still use this route; the sea is now usually called the South China Sea (in the Philippines, the West Philippine Sea).
      study: A map of the world on Mercator's projection in a period school geography (such as Frye's or Redway and Hinman's Natural Advanced Geography).
  - name: Physiology
    questions:
    - q: How does the liver compare in size with other glands in the human body? Where is it located? What does it secrete?
      answer: The liver is the largest gland in the body, weighing about 3 to 4 pounds in a grown person. It lies in the upper part of the abdomen, mostly on the right side, just below the diaphragm and sheltered by the lower ribs, reaching partly across to the left over the stomach. It secretes bile (gall), a greenish-yellow fluid that is stored in the gall bladder and poured into the small intestine to help digest fats. It also stores sugar from the blood as "animal starch" (glycogen).
      now: 'It is still called the largest gland and the largest internal organ (the skin is the largest organ overall). It has many jobs besides making bile: breaking down drugs, alcohol and poisons, making blood proteins, and storing vitamins and iron.'
      study: The chapter on digestion in a period physiology (such as Overton's or Conn and Budington's).
    - q: Name the organs of circulation.
      answer: The heart, the arteries, the capillaries, and the veins, with the blood they carry. Some books also counted the lymphatic vessels.
      study: The chapter on circulation in a period physiology (such as Overton's or Conn and Budington's).
    - q: Describe the heart.
      answer: 'The heart is a hollow, muscular organ shaped like a cone, about the size of the closed fist. It lies in the chest between the lungs, behind the breastbone, with its point (apex) turned down and to the left, where its beat can be felt between the fifth and sixth ribs. It is wrapped in a tough sac, the pericardium. A wall divides it into a right and a left side, and each side has two chambers: an upper auricle, which receives blood, and a lower ventricle, which pumps it out, making four chambers in all. Valves (the tricuspid on the right, the mitral or bicuspid on the left, and the semilunar valves at the openings of the great arteries) let the blood flow only one way. The right side sends dark, impure blood to the lungs; the left side, whose walls are the thickest, sends pure blood through the aorta to the whole body. It beats about 72 times a minute in a grown person, faster in children.'
      then: The upper chambers were called "auricles."
      now: The upper chambers are now called atria. A normal adult resting rate is 60 to 100 beats a minute.
      study: The chapter on the heart and circulation in a period physiology (such as Overton's or Conn and Budington's).
    - q: Compare arteries and veins as to function. Where is the blood carried to be purified?
      answer: 'Arteries carry blood away from the heart to all parts of the body; veins carry it back to the heart. Arteries have thick, strong, elastic walls, carry bright red blood, lie mostly deep, beat with each heartbeat (the pulse), and spurt when cut. Veins have thinner walls, contain valves to keep the blood from flowing backward, carry dark (impure) blood, lie nearer the surface, and bleed in a steady flow. (The exceptions are the pulmonary artery, which carries dark blood to the lungs, and the pulmonary veins, which bring bright blood back.) The blood is carried to the lungs to be purified: there it gives off carbonic acid gas and takes up oxygen.'
      then: A pupil might add that the kidneys and skin also take waste out of the blood; textbooks called them organs of excretion.
      now: Carbonic acid gas is now called carbon dioxide. Blood in the veins is dark red, never blue; veins only look blue through the skin. We now say the kidneys and liver do much of the blood's cleaning of other wastes, while the lungs exchange gases.
      study: The chapters on circulation and respiration in a period physiology (such as Overton's or Conn and Budington's).
    - q: Where is the chief nervous center of the body?
      answer: 'The brain, inside the skull (cranium). With the spinal cord it forms the central nervous system, and the brain is its chief center: the seat of thought, feeling and will, controlling the rest of the body through the nerves.'
      then: Some textbooks might have accepted the medulla oblongata (the lowest part of the brain, which controls breathing and the heartbeat) as the "vital" center, but the expected answer is the brain.
      study: The chapter on the nervous system in a period physiology (such as Overton's or Conn and Budington's).
    - q: Define Cerebrum; Cerebellum.
      answer: 'Cerebrum: the largest part of the brain, filling the upper and front part of the skull; it is divided into two halves (hemispheres), and its surface is folded into ridges (convolutions) covered with gray matter. It is the seat of the mind: thought, memory, reason, will, the senses, and voluntary movement. Cerebellum: the "little brain," lying in the lower back part of the skull, under the back of the cerebrum. It controls the working together (coordination) of the muscles, and balance.'
      now: Still correct in outline. Researchers now know the cerebellum also plays a part in learning skills and some thinking, and that different parts of the cerebrum handle different jobs (speech, sight, movement).
      study: The chapter on the brain in a period physiology (such as Overton's or Conn and Budington's).
    - q: What are the functions (or uses) of the spinal column?
      answer: 'The spinal column (backbone) is the main support of the body: it holds up the head and trunk, gives attachment to the ribs and many muscles, encloses and protects the spinal cord in its canal, and, being made of many small bones (vertebrae) with pads of cartilage between them, lets the body bend and turn while its curves and pads soften jars from walking and jumping.'
      then: 'The question may have meant the spinal cord, which some pupils confused with the column. If so: the spinal cord carries messages (nerve impulses) between the brain and the body, and acts by itself as a center for reflex actions, such as jerking the hand from a hot stove. Give credit for either if the pupil makes clear which one is meant.'
      study: The chapters on the bones and the nervous system in a period physiology (such as Overton's or Conn and Budington's).
    - q: Why should we study Physiology?
      answer: So that we may understand how our bodies are made and how they work, and so learn how to keep them healthy and strong; to avoid disease and know how it spreads; to know the harm done by alcohol, tobacco and other narcotics; to know what to do in accidents and emergencies; and so that we may care for others and be more useful in life. Good health is needed for good work and happiness.
      then: By 1912 nearly every state, Kentucky included, required schools to teach physiology and hygiene with special attention to the effects of alcohol and narcotics, so a pupil was expected to mention them.
      study: The introduction to a period physiology (such as Overton's or Conn and Budington's).
    - q: Give at least five rules to be observed in maintaining good health.
      answer: 'Any five, for example: (1) breathe fresh air, keep the windows open at night and the house well aired; (2) get plenty of sleep, 9 or 10 hours for children; (3) bathe often and keep the body and clothing clean; (4) eat plain, wholesome food at regular hours, and chew it well; (5) take exercise in the open air every day; (6) drink pure water, from a well that is far from the barnyard and privy, and boil it if in doubt; (7) avoid alcoholic drinks and tobacco; (8) keep the teeth clean; (9) sit and stand erect; (10) keep flies and mosquitoes away from food and out of the house by screens.'
      then: In 1912 typhoid fever, spread by bad water and flies, and tuberculosis (consumption), spread by coughing and spitting, were great dangers in rural Kentucky, so clean water, screens, fresh air and a ban on spitting were stressed.
      now: Modern lists would add washing the hands, staying up to date on vaccinations, wearing a seat belt, using sunscreen, and limiting screen time.
      study: The hygiene chapters in a period physiology (such as Overton's or Conn and Budington's).
  - name: Civil Government
    questions:
    - q: 'Define the following forms of government: Democracy, Limit Monarchy, Absolute Monarchy, Republic. Give examples of each.'
      answer: 'Democracy: a government in which the people themselves meet and make the laws directly. Examples: ancient Athens; the New England town meeting; some of the small Swiss cantons. Limited monarchy (the printed "Limit Monarchy" means "limited"): a government by a king or emperor whose power is limited by a constitution and by a lawmaking body chosen in part by the people. Examples: Great Britain, Italy, Belgium, Germany. Absolute monarchy: a government in which the ruler''s will is the law, with no constitution or elected body to check it. Examples given in 1912: Russia (though it had had a Duma since 1906), Turkey before 1908, and China before its revolution. Republic: a government in which the people choose representatives to make and carry out the laws for them. Examples: the United States, France, Switzerland, Mexico.'
      then: 'Real absolute monarchies were hard to find even in 1912: Turkey got a constitution in 1908 and China became a republic early in 1912, so textbook examples were going out of date as the exam was printed. Accept any well-explained example.'
      now: 'Today''s examples: limited (constitutional) monarchies include the United Kingdom, Japan, Sweden and Spain; nearly absolute monarchies include Saudi Arabia, Oman and Brunei; most countries are republics. Political scientists now often call the United States a representative democracy as well as a republic.'
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself.
    - q: To what four governments are students in school subjected?
      answer: The question is not fully clear; the usual answer was the government of the home (parents), of the school (the teacher and school board), of the State (Kentucky), and of the nation (the United States). Many civics books of the time started with exactly this "circle" of governments, from the family outward.
      then: 'A pupil might instead name four public governments: the school district, the county, the State, and the United States (or include the city or town). Since the intended list depended on the textbook, any sensible four with reasons should get credit.'
      study: The opening chapters of a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself.
    - q: Name five county officers, and the principal duties of each.
      answer: 'Any five (Kentucky, 1912): County judge: presides over the county court and the fiscal court, manages the county''s business (roads, bridges, the poor), and handles probate of wills and guardianships. County clerk: keeps the county records, records deeds and mortgages, issues marriage and other licenses, and has charge of election papers. Sheriff: keeps the peace, arrests offenders, serves court papers, carries out court orders, and in Kentucky collects the taxes. County attorney: prosecutes cases in the county court and is the legal adviser to the county officers and fiscal court. Jailer: keeps the jail and has charge of prisoners (and of the courthouse). Others: county superintendent of schools (oversees the common schools and gives these examinations); tax commissioner or assessor (lists and values property for taxes); coroner (holds inquests in cases of sudden or violent death); surveyor (surveys land); circuit court clerk (keeps the records of the circuit court); justices
        of the peace (try small cases and sit on the fiscal court).'
      then: In 1912 the county superintendent of schools was elected by the voters and was the officer who held this very examination.
      now: Since reforms in the 1970s the Kentucky county judge has become the county judge/executive, with no court duties; the assessor is now the property valuation administrator (PVA); and school superintendents are appointed by county school boards. Sheriff, county clerk, county attorney, jailer and coroner are still elected.
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself; for Kentucky, the Kentucky Constitution of 1891 (still in force).
    - q: Name and define the three branches of the government of the United States.
      answer: 'Legislative: Congress, made up of the Senate and the House of Representatives; it makes the laws. Executive: the President (with the Vice-President and the Cabinet and departments); he enforces, or carries out, the laws. Judicial: the Supreme Court and the lower federal courts; they explain (interpret) the laws, decide cases arising under them, and can declare a law void if it conflicts with the Constitution.'
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself, Articles I, II and III of the Constitution.
    - q: Give three duties of the President. What is meant by the veto power?
      answer: 'Any three: he is commander in chief of the army and navy; he sees that the laws are faithfully executed; he makes treaties, with the consent of two thirds of the Senate; he appoints ambassadors, judges of the Supreme Court and other officers, with the consent of the Senate; he gives Congress information on the state of the Union and recommends laws; he may call Congress into special session; he may grant reprieves and pardons for offenses against the United States. The veto power is the President''s right to refuse to sign a bill passed by Congress. He returns it with his objections to the house in which it began. It can then become a law only if both houses pass it again by a two-thirds vote. If he neither signs nor returns a bill within ten days (Sundays excepted), it becomes law without his signature, unless Congress has adjourned in the meantime, in which case it fails (the "pocket veto").'
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself, Article II and Article I, Section 7 of the Constitution.
    - q: Name three rights given Congress by the Constitution and two rights denied Congress.
      answer: 'Rights given (any three, from Article I, Section 8): to lay and collect taxes and duties; to borrow money; to regulate commerce with foreign nations and among the States; to coin money; to establish post offices and post roads; to declare war; to raise and support armies and a navy; to make rules for naturalization; to grant copyrights and patents. Rights denied (any two, from Article I, Section 9 and the First Amendment): to suspend the writ of habeas corpus except in rebellion or invasion; to pass a bill of attainder or an ex post facto law; to tax goods exported from any State; to grant titles of nobility; to favor the ports of one State over another; to draw money from the Treasury except by law; to make any law establishing a religion or abridging freedom of speech or of the press.'
      then: In 1912 a direct tax had to be divided among the States by population, which the Supreme Court said (in 1895) barred a general income tax.
      now: The Sixteenth Amendment (1913) allowed an income tax without dividing it among the States.
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself, Article I, Sections 8 and 9 of the Constitution.
    - q: In the election of a president and vice-president, how many electoral votes is each State allowed?
      answer: 'Each State has as many electoral votes as it has Senators and Representatives in Congress together: two for its Senators plus one for each Representative. In the 1912 election Kentucky had 13 (2 Senators and 11 Representatives), and there were 531 in all for the 48 States.'
      now: Today there are 538 electoral votes, since the Twenty-third Amendment (1961) gave the District of Columbia three. After the 2020 census Kentucky has 8.
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself, Article II and the Twelfth Amendment.
    - q: Give the eligibility of president, vice-president and Governor of Kentucky.
      answer: 'President: must be a natural-born citizen of the United States, at least 35 years old, and a resident of the United States for 14 years. Vice-President: the same, since the Twelfth Amendment says no one ineligible to be President may be Vice-President. Governor of Kentucky: must be at least 30 years old and a citizen and resident of Kentucky for at least six years next before the election; under the 1891 Constitution he could not succeed himself (he was ineligible for the next four years after his term).'
      now: Since the Twenty-second Amendment (1951), no one may be elected President more than twice. A 1992 amendment to the Kentucky Constitution lets a governor serve two terms in a row, and now sets the same age and residence rules for the lieutenant governor.
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself; Article II of the U.S. Constitution; Sections 71 and 72 of the Kentucky Constitution.
    - q: What is a copyright? Patent right?
      answer: A copyright is the exclusive right, granted by the government, of an author, composer or artist to print, publish and sell copies of his book, music, picture or other work for a term of years. A patent right is the exclusive right, granted by the government, of an inventor to make, use and sell his invention for a term of years. Both come from the Constitution, which lets Congress "promote the progress of science and useful arts" by securing these rights for limited times.
      then: In 1912 a copyright (under the law of 1909) lasted 28 years and could be renewed for 28 more; it was recorded at the Library of Congress. A patent, issued by the Patent Office, lasted 17 years.
      now: Copyright now usually lasts for the author's life plus 70 years, and a patent 20 years from the date of filing.
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself, Article I, Section 8, Clause 8 of the Constitution.
    - q: Describe the manner in which the president and vice-president of the United States are elected.
      answer: Each party first names its candidates at a national convention. Then, on election day (the Tuesday after the first Monday in November, every fourth year), the voters of each State vote for a set of presidential electors, as many as the State has Senators and Representatives; no Senator, Representative or federal officer may be an elector. The party that wins the most votes in a State elects all its electors. The electors meet in their own State capitals (in 1912, on the second Monday in January) and vote by ballot, separately, for President and for Vice-President. The lists of votes are sealed and sent to the President of the Senate, who opens them before both houses of Congress, and the votes are counted (in 1912, on the second Wednesday in February). The person with a majority of all the electoral votes is elected. If no one has a majority for President, the House of Representatives chooses from the three highest, each State having one vote; if no one has a majority for Vice-President,
        the Senate chooses from the two highest. The President is inaugurated (in 1912) on March 4.
      then: This is the plan of the Twelfth Amendment (1804), which ended the old system in which electors cast two votes without saying which was for President.
      now: Electors now meet in December, Congress counts the votes on January 6, and the inauguration has been on January 20 since the Twentieth Amendment (1933). Maine and Nebraska now divide their electors by congressional district instead of giving all to the State winner.
      study: a period civil government text (such as Fiske's Civil Government in the United States), and the U.S. Constitution itself, Article II and the Twelfth Amendment.
  - name: History
    questions:
    - q: 'Who first discovered the following places: Florida, Pacific Ocean, Mississippi River, St. Lawrence River?'
      answer: 'Florida: Juan Ponce de Leon, a Spaniard, in 1513, while seeking the Fountain of Youth; he named it at Easter time (Pascua Florida). Pacific Ocean: Vasco Nunez de Balboa, a Spaniard, in 1513, who saw it from a mountain on the Isthmus of Darien (Panama) and called it the South Sea. Mississippi River: Hernando De Soto, a Spaniard, in 1541. St. Lawrence River: Jacques Cartier, a Frenchman, in 1535 (he explored the Gulf of St. Lawrence in 1534).'
      now: These are the first Europeans; Native peoples knew all these places long before. Historians also note that Florida appears on Spanish maps a few years before 1513, and that the mouth of the Mississippi was probably seen by Alonso Alvarez de Pineda in 1519.
      study: The chapters on Spanish and French explorers in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: Sketch briefly Sir Walter Raleigh, Peter Stuyvesant.
      answer: 'Sir Walter Raleigh (about 1552-1618): an English soldier, courtier, explorer and poet, a favorite of Queen Elizabeth. In 1584 he received a grant to settle land in America and sent out an expedition that explored the coast of what is now North Carolina; the land was named Virginia after Elizabeth, the "Virgin Queen." His colony on Roanoke Island (1585) gave up and went home; his second (1587, under John White, where Virginia Dare was born, the first English child born in America) vanished and became the "Lost Colony." He is said to have made tobacco smoking and the potato popular in England and Ireland. Under King James I he was imprisoned in the Tower of London for years on a charge of plotting, and wrote a History of the World there. Released in 1616 to search for gold in Guiana, he failed and his men fought the Spaniards, and he was beheaded in 1618. Peter Stuyvesant (about 1610-1672): the last Dutch governor (director-general) of New Netherland, from 1647 to 1664. He had
        lost a leg in battle and wore a wooden one. He was honest and able but stern and hot-tempered, and ruled with a heavy hand. He took New Sweden on the Delaware in 1655, and built the wall that gave Wall Street its name. In 1664 an English fleet appeared before New Amsterdam; the people would not fight, and he had to surrender. The colony became New York. He lived out his life on his farm (bouwerie, the origin of "the Bowery") in the city.'
      now: Raleigh never set foot in North America himself, and the tobacco and potato stories are partly legend. Historians also note Stuyvesant's harsh treatment of Quakers, Lutherans and Jewish settlers, and that New Netherland depended on enslaved African labor.
      study: The chapters on the English and Dutch colonies in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: 'By whom were the following settled: Georgia, Maryland, Massachusetts, Rhode Island, Florida?'
      answer: 'Georgia: by James Oglethorpe and the English, at Savannah in 1733, as a home for poor debtors and a defense against the Spanish. Maryland: by Lord Baltimore (Cecil Calvert; the colonists were led by his brother Leonard) and English Catholics, at St. Mary''s in 1634. Massachusetts: by the Pilgrims (English Separatists) at Plymouth in 1620, and by the Puritans of the Massachusetts Bay Company at Salem (1628) and Boston (1630) under John Winthrop. Rhode Island: by Roger Williams and his followers, at Providence in 1636, after he was banished from Massachusetts; Anne Hutchinson''s followers settled nearby. Florida: by the Spaniards under Pedro Menendez de Aviles, who founded St. Augustine in 1565, the oldest town in the United States.'
      then: A pupil might add that French Huguenots built Fort Caroline in Florida in 1564 but were wiped out by Menendez.
      now: Historians add that all these places were already home to Native peoples, such as the Yamacraw in Georgia, the Piscataway in Maryland, the Wampanoag in Massachusetts, the Narragansett in Rhode Island, and the Timucua in Florida.
      study: The chapters on the founding of the colonies in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: 'During what wars were the following battles fought: Brandywine, Great Meadows, Lundy''s Lane, Antietam, Buena Vista?'
      answer: 'Brandywine: the Revolutionary War (September 1777, in Pennsylvania; the British under Howe defeated Washington and went on to take Philadelphia). Great Meadows: the French and Indian War (1754, in western Pennsylvania; young George Washington surrendered Fort Necessity to the French; this was the opening of the war). Lundy''s Lane: the War of 1812 (July 1814, near Niagara Falls in Canada; a hard-fought, bloody battle between the Americans under Jacob Brown and Winfield Scott and the British). Antietam: the Civil War (September 17, 1862, at Sharpsburg, Maryland; McClellan stopped Lee''s invasion of the North; the bloodiest single day of the war; it led Lincoln to issue the Emancipation Proclamation). Buena Vista: the Mexican War (February 1847, in northern Mexico; Zachary Taylor defeated Santa Anna).'
      then: Kentucky volunteers fought at Buena Vista, where Henry Clay's son, Lieutenant Colonel Henry Clay Jr., was killed, so a Kentucky pupil might well have known the battle.
      study: The war chapters in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: Describe the battle of Quebec.
      answer: The battle of Quebec (September 13, 1759) was the decisive battle of the French and Indian War. Quebec, the French capital of Canada, stood on high cliffs above the St. Lawrence and was thought impossible to take. The English general James Wolfe besieged it all summer without success. At last, on a dark night, he floated his men down the river in boats, landed at a cove (now Wolfe's Cove) above the city, and led them up a narrow, steep path to the top of the cliffs. At daybreak his army was drawn up on the Plains of Abraham behind the city. The French general Montcalm hurried out to attack; the English held their fire until the French were close, then broke their lines with volleys and a charge, and the battle was over in less than an hour. Both generals were mortally wounded. Told the French were running, Wolfe is said to have said, "Now, God be praised, I will die in peace." Montcalm died the next day. Quebec surrendered a few days later. Montreal fell in 1760, and by the
        Treaty of Paris (1763) France gave up Canada to England.
      then: There was also an American attack on Quebec during the Revolution (December 31, 1775), when Richard Montgomery and Benedict Arnold tried to storm the city in a snowstorm; Montgomery was killed and the attack failed. A pupil who described this battle instead should be asked which one they meant, but the 1759 battle is the expected answer.
      study: The chapter on the French and Indian War in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: Give the cause of the War of 1812, and name an important battle fought during that war.
      answer: 'Causes: the British were stopping American ships on the high seas, searching them and taking off sailors, claiming they were British deserters, and forcing them into the British navy (impressment); thousands of American seamen were taken this way. Britain also seized American ships and cargoes and tried to stop American trade with France (the Orders in Council), and British agents in Canada were said to be stirring up the Indians of the Northwest (Tecumseh) against American settlers. The "War Hawks" in Congress, led by Henry Clay of Kentucky, pressed for war, and some hoped to conquer Canada. Battles (any one): New Orleans (January 8, 1815; Andrew Jackson defeated the British); Lake Erie (1813; Oliver Hazard Perry, "We have met the enemy and they are ours"); the Thames (1813; William Henry Harrison defeated the British, and Tecumseh was killed); Lundy''s Lane (1814); the Constitution''s victory over the Guerriere (1812); Fort McHenry (1814; the "Star-Spangled Banner").'
      then: Kentucky sent more soldiers than almost any other state. Kentuckians remembered the massacre at the River Raisin (1813) and fought at the Thames under Governor Isaac Shelby, where Colonel Richard M. Johnson of Kentucky was said to have killed Tecumseh.
      study: The War of 1812 chapter in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: Name 2 presidents who have died in office; three who were assassinated.
      answer: 'Died in office (natural causes): William Henry Harrison (1841) and Zachary Taylor (1850). Assassinated: Abraham Lincoln (1865), James A. Garfield (1881), and William McKinley (1901).'
      then: Lincoln was born in Kentucky (in Hardin, now LaRue, County) and Taylor grew up near Louisville, which Kentucky teachers liked to point out.
      now: Since 1912, Warren G. Harding (1923) and Franklin D. Roosevelt (1945) died in office, and John F. Kennedy (1963) was assassinated.
      study: a period school U.S. history (such as Montgomery's or Fiske's), the list of Presidents usually printed at the back of the book.
    - q: Name the last battle of the Civil War; War of 1812; French and Indian War, and the commanders in each battle.
      answer: 'Civil War: the last battle is usually given as Palmito (Palmetto) Ranch, near Brownsville, Texas, May 12-13, 1865, between Union troops under Colonel Theodore H. Barrett and Confederates under Colonel John S. "Rip" Ford; the Confederates won, a month after Lee''s surrender. War of 1812: New Orleans, January 8, 1815, General Andrew Jackson (American) against General Sir Edward Pakenham (British), who was killed; it was fought two weeks after the peace treaty of Ghent was signed, before the news reached America. French and Indian War: Quebec, 1759, General James Wolfe (English) against the Marquis de Montcalm (French); both were killed.'
      then: This question is unclear, because "last battle" depended on the textbook. Many school histories of 1912 ended the Civil War with Lee's surrender to Grant at Appomattox (April 9, 1865) or with the last fighting around Appomattox, and did not mention Palmito Ranch; accept Appomattox, Grant and Lee. For the French and Indian War, Quebec (1759) was the last great battle the books described; strictly, fighting went on to Sainte-Foy (April 1760, Levis against Murray) and Montreal surrendered without a battle in 1760 (Vaudreuil to Amherst).
      now: Some historians count a small British victory at Fort Bowyer, Alabama (February 1815), as the last action of the War of 1812.
      study: The chapters on the end of each war in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: What president was impeached, and on what charge?
      answer: Andrew Johnson, in 1868. The House impeached him chiefly for breaking the Tenure of Office Act by removing Secretary of War Edwin M. Stanton without the Senate's consent; other charges accused him of speeches bringing Congress into disgrace. The real cause was his quarrel with Congress over Reconstruction. The Senate tried him and failed by one vote to reach the two-thirds needed to convict, so he stayed in office.
      now: Since then, Bill Clinton (1998, on charges of perjury and obstruction of justice) and Donald Trump (2019 and 2021) have been impeached by the House; all were acquitted by the Senate. The Supreme Court later (1926) said that a law like the Tenure of Office Act, which had been repealed in 1887, was unconstitutional.
      study: The Reconstruction chapter in a period school U.S. history (such as Montgomery's or Fiske's).
    - q: 'Who invented the following: magneto, telegraph, cotton gin, sewing machine, telephone, phonograph?'
      answer: 'Magneto: this item is unclear, since no single person is usually named. The principle (making electricity by moving a magnet near a coil) was discovered by Michael Faraday in 1831, and the first magneto was built by Hippolyte Pixii of Paris in 1832; the high-tension magneto used in automobiles in 1912 came from the Bosch company of Germany (1902). Telegraph: Samuel F. B. Morse (patented in 1840; first line, Washington to Baltimore, 1844, "What hath God wrought"). Cotton gin: Eli Whitney (1793). Sewing machine: Elias Howe (patented 1846; Isaac Singer improved it). Telephone: Alexander Graham Bell (1876). Phonograph: Thomas A. Edison (1877).'
      then: A 1912 examiner may have meant the magnetic telegraph (Morse), or simply expected "Faraday," whose discoveries every school science book credited. Accept any of these with an explanation.
      now: 'Historians now give part of the credit to others: Joseph Henry for the electromagnet behind the telegraph (and Cooke and Wheatstone in England); Elisha Gray, who filed for a telephone patent the same day as Bell, and Antonio Meucci; and Walter Hunt, who built a sewing machine before Howe.'
      study: The chapters on inventions and industrial growth in a period school U.S. history (such as Montgomery's or Fiske's).
