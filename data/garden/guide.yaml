# Researched October 2026 from US extension, USDA, NRCS, EPA, FDA/FoodSafety.gov sources.
meta:
  page: 'Food Garden Planner: Guidance'
  site: Teddy Rook Book
  spelling: American
  researched: 2026-10
  evidence_rule: Only well-established advice from university extension services, USDA, NRCS, EPA, and
    FDA/CDC food-safety basics is included. Where research is mixed, the text says so. Numbers are typical
