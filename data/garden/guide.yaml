- id: site
  title: Choosing your spot
  intro: Where you put a garden matters more than almost anything else you do. Look for sun, water, and
    good drainage, and find out what's in the soil before you plant food in it.
  items:
  - t: 'Sun: 6 to 8 hours for most crops'
    how: Fruiting crops like tomatoes, peppers, squash, and beans need full sun, at least 6 to 8 hours
      of direct light a day. Leafy greens and herbs can get by with less. Watch your yard through a whole
      day to see where the sun really falls.
  - t: Water close at hand
    how: Choose a spot near a faucet or other water source. Hauling water is the fastest way to lose interest
      in a garden.
  - t: Good drainage
    how: Avoid low spots where puddles sit after rain. Heavy clay holds too much water and sandy soil
      drains too fast, and adding organic matter helps both. Raised beds are a good answer for soggy ground.
  - t: Gentle slopes and frost pockets
    how: Steep slopes lose water and soil to runoff, so pick flatter ground or build terraced beds. A
      slight slope is fine and even lets cold air drain away on frosty nights.
  - t: Sites to think twice about
    how: Compacted ground, old dumping areas, and land along railroads or power line rights-of-way may
      hold leftover chemicals. Ask your extension office before planting food on ground with a questionable
      history.
  - t: Test pH and nutrients through extension
    how: Your county extension office can send a soil sample to a lab for a small fee. Collect soil from
      8 to 10 spots, mix it in a clean bucket, and send one sample. Most plants do best around pH 6.0
      to 7.2, and the report tells you how much lime or fertilizer to add.
  - t: Consider a lead test in cities and older neighborhoods
    how: Soil near older homes, especially those built before 1980, and near busy roads can hold lead
      from old paint and past traffic. Health departments and extension soil labs can test for it. Results
      come as ppm or mg/kg, which mean the same thing.
  - t: If lead is a concern, build up with clean soil
    how: EPA calls raised beds filled with clean soil one of the best ways to protect yourself. Lay landscape
      fabric or another barrier on the ground, then fill the bed with clean soil and compost. Containers
      work too.
  - t: When lead levels are high
    how: EPA advises not growing in existing soil above about 400 ppm lead. Use raised beds with at least
      16 inches of clean soil over a fabric barrier, or containers, and add fresh clean soil and compost
      each year. Your local health department or extension office can help you read your results.
  - t: Everyday habits that lower lead exposure
    how: Wear gloves, wash hands after gardening, and leave garden shoes at the door. Keep bare soil covered
      with mulch, peel root crops, remove outer leaves of greens, and wash all produce. Keep young children
      out of soil with unknown lead levels.
  - t: Fruiting crops take up less lead
    how: Tomatoes, peppers, squash, cucumbers, beans, peas, and corn are less likely to carry lead than
      leafy greens and root crops. On soil with any lead concern, grow greens and root crops in clean
      raised beds or containers. Keeping soil pH near 6.5 or higher also reduces uptake.
  - t: Treated wood for raised beds
    how: Older CCA-treated lumber contains arsenic, and EPA restricted it for home use in 2004. Today's
      common treatments like ACQ contain no arsenic, and extension services consider the risk from these
      in garden beds to be very small. Avoid railroad ties and old wood that may contain creosote. Cedar,
      redwood, and concrete block are safe alternatives.
  sources:
  - *id012
  - *id003
  - &id045
    name: U.S. EPA, Healthy Gardening Practices to Reduce Exposure to Lead-Contaminated Soil
    url: https://www.epa.gov/node/299831
  - name: U.S. EPA fact sheet, Gardening in Lead-Contaminated Soil (2013)
    url: https://www.epa.gov/sites/default/files/2015-08/documents/plv-gardening-fs-2013-en.pdf
  - name: University of Illinois Extension, Urban Soil Lead Exposure
    url: https://extension.illinois.edu/soil/urban-soil-lead-exposure
