- id: kids_and_hobby
  title: Kids and hobby gardeners
  intro: Gardening is a great way to learn, play, and eat well, and kids can help with nearly every step.
  items:
  - t: Quick, easy first crops
    how: Radishes are ready in less than a month. Bush beans, snow peas, cherry tomatoes, and sunflowers
      grow fast and are fun to pick. Indoors, microgreens are ready in one to three weeks.
  - t: Give kids their own space
    how: A small bed or a few containers that belong to them builds pride and interest. Keep the choices
      simple, with a handful of plants they pick themselves. Beds about 3 feet wide fit a child's reach.
  - t: Kid-sized tools
    how: A small watering can and child-sized tools make it easier for kids to take part. Show them how
      to carry and put away tools safely.
  - t: Jobs kids can do
    how: Children can help plan, plant big seeds like beans, peas, squash, and sunflowers, water, pull
      weeds, pick off beetles, and harvest. Digging potatoes is a favorite.
  - t: Notice the wildlife
    how: Look for bees, birds, toads, butterflies, and beneficial insects, and see how many kinds you
      can name. Sunflower blooms turn to follow the sun over the day, which is fun to watch.
  - t: Save seeds together
    how: Let a few bean or pea pods dry on the plant until they rattle, then shell and save them for next
      year. It's a simple way to show the whole life cycle of a plant.
  - t: Safety first
    how: Have everyone wash their hands after gardening. If the soil hasn't been tested for lead, keep
      young children in raised beds or containers filled with clean soil. Store tools and any garden products
      out of reach.
  - t: For hobby gardeners
    how: Try a new variety or crop each year, keep a garden journal, and experiment with seed saving or
      season extension. Extension Master Gardener programs are a great next step if you want to learn
      more and help others.
