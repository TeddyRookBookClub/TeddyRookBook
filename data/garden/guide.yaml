- id: find_local_help
  title: Finding local help
  intro: The best advice for your garden comes from people who know your climate and soil. These free
    public resources are a good place to start.
  items:
  - t: Your county extension office
    how: Every state has a land-grant university that runs Cooperative Extension, usually with an office
      in each county. Use the USDA NIFA Land-Grant University Website Directory to find your state's university,
      then look for its extension page and your county office.
  - t: What extension can do for you
    how: Extension offices offer soil testing, local planting calendars, recommended varieties, help identifying
      pests and diseases, and food preservation guidance. Most of it is free or low-cost.
  - t: Extension Master Gardeners
    how: Master Gardeners are trained volunteers who share research-based gardening advice through extension.
      Nearly every state has a program. Find yours at mastergardener.extension.org.
  - t: USDA Plant Hardiness Zone Map
    how: Look up your zone at planthardiness.ars.usda.gov. The zone is based on average coldest winter
      temperatures, so use it to pick perennials like fruit and berries, and use frost dates for vegetable
      timing.
  - t: Frost dates
    how: Ask your extension office for local frost dates or a planting calendar. NOAA also maps average
      last spring freeze dates.
  - t: USDA Service Centers for farms
    how: If you're starting a farm, your local USDA Service Center connects you with the Farm Service
      Agency and NRCS for farm numbers, conservation planning, and programs. Find yours at farmers.gov/service-locator.
  - t: Urban growers
    how: USDA's Office of Urban Agriculture and Innovative Production offers resources and grants for
      community gardens and urban farms, with extra support in several cities. See farmers.gov/urban.
  - t: Lead and soil safety
    how: Your local health department and extension soil lab can test soil for lead. They can also help
      you understand the results and decide where it's safe to grow food.
  - t: Safe food preservation
    how: The National Center for Home Food Preservation (nchfp.uga.edu) has tested canning, freezing,
      and drying instructions. Many extension offices also teach food preservation classes.
