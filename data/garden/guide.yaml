- id: save_money
  title: Ways to save money
  intro: A food garden doesn't have to cost much. These habits keep spending low and harvests high.
  items:
  - t: Sow seeds where you can
    how: Beans, peas, carrots, beets, radishes, corn, and squash grow easily from seed sown right in the
      garden. A packet of seed can produce many plants. Buy a few transplants of slow-starting crops like
      tomatoes and peppers unless you have lights to start them.
  - t: Save seeds from open-pollinated varieties
    how: Open-pollinated and heirloom varieties grow true from saved seed, so the next plants look and
      taste like the parent. Hybrid (often labeled F1) seeds don't come true, and their offspring are
      unpredictable.
  - t: Start seed saving with easy crops
    how: Beans, peas, tomatoes, and peppers mostly pollinate themselves, so they're easiest. Squash, cucumbers,
      melons, and corn cross easily with nearby plants, which makes their seed less reliable. Save seed
      only from healthy plants.
  - t: Store seeds cool and dry
    how: Keep dry seeds in sealed glass jars in a cool spot, such as the refrigerator. Label them with
      the variety and date, because older seed sprouts less well.
  - t: Check your library for a seed library
    how: Many public libraries now lend free seeds that you take home and plant, and some ask you to return
      seed you save. Extension offices often help support them.
  - t: Make your own compost
    how: Kitchen scraps, leaves, and grass clippings become free compost. It improves your soil and cuts
      down on fertilizer you need to buy.
  - t: Use free mulch, carefully
    how: In many areas, tree services give away arborist wood chips, and fall leaves are free for the
      raking. Ask about herbicide history before using hay, grass clippings, or manure from someone else.
  - t: Buy perennials once
    how: Strawberries, raspberries, blackberries, blueberries, and perennial herbs like chives come back
      year after year. You pay once and harvest for years.
  - t: Grow what you'd otherwise buy
    how: Put your space toward the produce your family eats most and that costs the most at the store.
      Herbs, salad greens, and berries are common choices for small spaces.
  - t: Get a cheap soil test
    how: Extension soil tests usually cost a small fee and tell you exactly what to add. That keeps you
      from buying fertilizer or lime you don't need.
  - t: Use extension and Master Gardeners
    how: Extension offices and Master Gardener volunteers answer gardening questions for free or at low
      cost, using research-based information. Many offer classes and plant clinics.
  - t: Join a community garden
    how: Community garden plots often come with water, shared tools, and experienced neighbors for a small
      fee. It's a good option if you have no yard.
  - t: Preserve the extra
    how: Freezing, drying, and safe canning turn a summer glut into winter meals instead of waste. Plan
      for it before peak season so you have jars, bags, and freezer space ready.
