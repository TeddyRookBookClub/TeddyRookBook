- id: pests_and_problems
  title: Pests and problems
  intro: 'Most gardens have some pests and still produce plenty of food. The approach extension services
    recommend is called integrated pest management (IPM): prevent problems, watch closely, and use the
    gentlest fix that works.'
  items:
  - t: Start with healthy plants
    how: Healthy, well-watered plants have fewer pest problems and recover from damage better. Check transplants
      before you buy them, and choose resistant varieties when they're available.
  - t: Identify before you act
    how: Many insects in the garden are harmless or helpful. Learn to recognize the common pests and figure
      out what you're dealing with before treating anything. Your extension office can help identify insects
      and diseases.
  - t: Scout every week
    how: Walk the garden and turn over leaves to look for insects and egg clusters. Crush egg masses when
      you find them.
  - t: Accept a little damage
    how: Vigorous plants can lose some leaves and still give a good crop. Ask whether damage is serious
      before deciding to act.
  - t: Hand-pick larger pests
    how: Colorado potato beetles, Mexican bean beetles, Japanese beetles, and many caterpillars are easy
      to pick off and destroy. It's safe and costs nothing, and kids are often good at it.
  - t: Use row covers as a barrier
    how: Lightweight fabric over young plants keeps many insects from reaching them. Remove covers from
      squash, cucumbers, and melons once flowers appear so bees can pollinate them.
  - t: Clean up and rotate
    how: Pull spent plants and weeds after harvest, since many pests spend the winter in garden debris.
      Keep diseased plants out of the compost, and rotate plant families so soil pests don't build up.
  - t: Encourage beneficial insects
    how: Lady beetles, lacewings, hover flies, and tiny parasitic wasps eat or parasitize pests. Small-flowered
      plants like dill, cilantro, parsley, basil, and sweet alyssum feed them, especially when something
      is blooming all season. More beneficial insects doesn't always mean fewer pests, so keep scouting.
  - t: A word on companion planting
    how: Many popular companion planting charts aren't backed by research, and the evidence for specific
      pairings is mixed. Mixing in flowers for beneficial insects and growing a variety of plants has
      more support than claims that one plant repels a pest from another.
  - t: Water to prevent disease
    how: Water the soil instead of the leaves, and water in the morning so foliage dries quickly. Mulch
      also keeps soil from splashing up onto leaves and fruit.
  - t: Pesticides as a last resort
    how: If you decide to use any pesticide, including organic products, read and follow the label. The
      label must list both your crop and the pest, and it tells you how long to wait before harvest. Spot-treat
      only where the pest is, and ask your extension office which options make sense.
  sources:
  - *id018
  - name: UC ANR / UC IPM, How to Manage Pests Without Pesticides
    url: https://ucanr.edu/blog/pests-urban-landscape/article/how-manage-pests-without-pesticides
  - name: University of Delaware Extension, Adding Diversity to the Garden
    url: https://www.udel.edu/academics/colleges/canr/cooperative-extension/fact-sheets/adding-diversity-garden/
  - name: 'Mississippi State Extension, Companion Planting: Myth or Truth?'
    url: https://extension.msstate.edu/blogs/extension-for-real-life/companion-planting-myth-or-truth
  - *id004
  - *id005
  - *id040
- id: harvest_and_storage
  title: Harvest and storage
  intro: 'Storing food well can double the value of a garden. Each crop has its own needs: some want cold
    and damp, some cool and dry, and a few want warmth.'
  items:
  - t: 'Potatoes: cure, then keep cold and dark'
    how: Cure potatoes for about 2 weeks at 50 to 60°F in high humidity and darkness so skins toughen
      and nicks heal. Then store them around 40°F with high humidity and no light. Colder than about 38°F
      makes them sweet, and above 50°F they sprout sooner.
  - t: Keep potatoes away from apples
    how: Apples and other ripening fruit give off ethylene gas, which makes potatoes sprout. Store them
      apart.
  - t: 'Sweet potatoes: warm and humid'
    how: After curing, store sweet potatoes around 55 to 60°F with high humidity. Never refrigerate them,
      because temperatures below 50°F damage them.
  - t: 'Onions and garlic: cold and dry'
    how: Once cured, store onions and garlic in mesh bags or crates with good air flow. Onions keep best
      around 32 to 40°F with fairly dry air. Check them often and use any that start to soften.
  - t: 'Winter squash: cool and dry'
    how: Store cured squash at about 50 to 60°F, off cold floors, in a single layer. A spare bedroom closet
      or cool corner of the house often works.
  - t: 'Carrots, beets, and other roots: cold and very humid'
    how: Root crops like carrots, beets, parsnips, turnips, and rutabagas keep best around 32 to 40°F
      at 90 to 95 percent humidity. Trim the tops first.
  - t: Root cellar basics
    how: An unheated basement corner, enclosed porch, or shed can work as a root cellar. Use the coldest
      part away from the furnace, raise humidity with a pan of water or damp burlap, and check the temperature
      so nothing freezes. Watch for rodents and remove anything that starts to rot.
  - t: 'Freezing: blanch first'
    how: Most vegetables keep better frozen if you blanch them, which means a short boil followed by quick
      cooling in ice water. Blanching stops enzymes that ruin color, flavor, and texture. It improves
      quality but doesn't make food safer, and blanching times vary by vegetable.
  - t: Drying
    how: Food dehydrators or ovens that hold about 140°F work well. Sun drying is fine for fruit but not
      recommended for vegetables. Herbs can be air-dried in bundles indoors.
  - t: 'Canning: tested recipes only'
    how: Use only tested recipes from the USDA Complete Guide to Home Canning or the National Center for
      Home Food Preservation (nchfp.uga.edu). Recipes that haven't been tested in a lab may not heat the
      food enough to make it safe.
  - t: Low-acid foods need a pressure canner
    how: Vegetables, meats, poultry, and seafood are low-acid foods and must be processed in a pressure
      canner. A boiling-water canner can't destroy the bacteria that cause botulism in these foods. Adjust
      times or pressure for your altitude as the tested recipe directs.
  - t: Wash produce simply
    how: Rinse fruits and vegetables under cold running water just before eating, and scrub firm produce
      like potatoes and melons with a clean brush. Don't use soap, bleach, or other cleaners on produce.
