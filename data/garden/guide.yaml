- id: crop_rotation
  title: Crop rotation
  intro: Crop rotation means moving each plant family to a new spot every year. Related plants share pests,
    diseases, and nutrient needs, so moving them keeps problems from building up in one place.
  items:
  - t: Why rotate
    how: Plants in the same family often get the same diseases and insects. Growing them in the same soil
      year after year lets those problems build up, while moving them away breaks the cycle. Rotation
      also spreads out how each family draws on soil nutrients.
  - t: Rotate by family, not by crop
    how: 'Tomatoes, peppers, eggplant, and potatoes are all one family, so swapping tomatoes for potatoes
      isn''t a rotation. Root crops are not one family either: carrots, beets, radishes, potatoes, and
      sweet potatoes all belong to different families.'
  - t: Nightshade family
    how: Tomatoes, peppers, eggplant, and potatoes. These are heavy feeders and share several soil-borne
      diseases, so they benefit most from rotation.
  - t: Cabbage family (brassicas)
    how: Cabbage, broccoli, cauliflower, kale, collards, Brussels sprouts, kohlrabi, mustard greens, radishes,
      turnips, and rutabagas. Mustard and radish cover crops belong here too.
  - t: Pea family (legumes)
    how: Garden peas, snap beans, dry beans, lima beans, soybeans, and cowpeas. Clover and vetch cover
      crops are legumes too. Legumes work with soil bacteria to add nitrogen.
  - t: Squash family (cucurbits)
    how: Cucumbers, summer and winter squash, pumpkins, melons, watermelons, and gourds. These plants
      use a lot of nitrogen.
  - t: Onion family (alliums)
    how: Onions, garlic, leeks, shallots, and chives. This family uses more potassium than some others,
      so moving it around helps balance what the soil supplies.
  - t: Carrot family (umbellifers)
    how: Carrots, parsnips, celery, parsley, dill, fennel, and cilantro. Their small flowers also feed
      beneficial insects if you let a few plants bloom.
  - t: Beet family
    how: Beets, Swiss chard, and spinach. These are often grouped with root crops or leafy crops in a
      simple rotation, but they are their own family.
  - t: Grass family
    how: Sweet corn, popcorn, and grain corn. Cereal rye, oats, and wheat cover crops are in this family
      too, so count them when you plan.
  - t: Other families
    how: Lettuce and endive are in the sunflower family, sweet potatoes are in the morning glory family,
      and okra is in the mallow family. Give each its own turn in the rotation like any other family.
  - t: A simple four-bed plan
    how: 'One extension approach groups crops into four blocks and moves each block over one spot every
      year, in this order: legumes, root crops, fruiting crops, leafy crops. Keep each family in a single
      group, for example legumes (peas, beans); roots and bulbs (carrot family, onion family); fruiting
      (nightshades including potatoes, squash family, corn); and leafy (cabbage family including radishes
      and turnips, beet family, lettuce).'
  - t: The rule that matters most
    how: Extension sources agree there's no single right order. What matters is that a family doesn't
      come back to the same spot too soon. Any plan that keeps families moving works.
  - t: How long to wait
    how: Wait 3 to 4 years before planting the same family in the same spot, and longer if you can. Some
      soil-borne diseases live in the soil for several years.
  - t: Rotation in small gardens
    how: A full 3- to 4-year cycle can be hard in a small space, but changing families from year to year
      still helps. Separate beds rotate better than zones in one tilled plot, which mixes soil between
      zones. Containers with fresh potting mix give you an extra spot, especially for tomatoes.
  - t: Rotation on a farm
    how: Divide the land into fields or blocks of similar size and rotate crop families across them on
      a planned cycle. Working farms build in cover crops, and some include a hay or grass-legume phase
      before returning to vegetables. Keep a field map every year.
  - t: Keep a map or photos
    how: Memory fades fast. A simple sketch or a photo of the garden each year shows you where every family
      grew.
  sources:
  - name: University of Wisconsin Extension, Using Crop Rotation in the Home Vegetable Garden
    url: https://hort.extension.wisc.edu/articles/using-crop-rotation-home-vegetable-garden-0/
  - *id002
  - *id015
  - name: WSU Extension (Snohomish County), Using Crop Rotation in Home Vegetable Gardens
    url: https://extension.wsu.edu/snohomish/croprotation/
  - *id023
  - *id024
- id: planting_calendar
  title: Planting calendar basics
  intro: 'Timing is built around two dates: your average last spring frost and your average first fall
    frost. Cool-season crops go in around them, and warm-season crops fill the frost-free months in between.'
  items:
  - t: What frost dates mean
    how: The average last spring frost date is when the chance of a freeze drops to about 50 percent.
      That means about half of years still get a frost after that date. Watch the forecast and keep covers
      handy.
  - t: How to find your frost dates
    how: Your county extension office usually publishes a local planting calendar with frost dates. NOAA
      also maps average last spring freeze dates from weather station records.
  - t: Hardiness zones are not frost dates
    how: The USDA Plant Hardiness Zone Map shows average coldest winter temperatures. It helps you choose
      perennials like fruit and berries that will survive your winters, but it doesn't give you planting
      dates.
  - t: Cool-season crops
    how: Hardy crops like peas, spinach, onions, cabbage, kale, and broccoli can go in about 4 to 6 weeks
      before the last frost. Half-hardy crops like lettuce, beets, carrots, chard, radishes, and potatoes
      can go in about 2 to 3 weeks before. Many of them can be planted again in mid to late summer for
      a fall harvest.
  - t: Warm-season crops
    how: Tomatoes, peppers, eggplant, squash, cucumbers, melons, beans, corn, and sweet potatoes are damaged
      by frost. Plant them after your last frost date, once the soil has warmed. Beans sprout best above
      60°F soil, and sweet potatoes need soil around 65°F.
  - t: Start indoors or sow directly?
    how: Tomatoes, peppers, and eggplant transplant easily and are usually started indoors, about 6 weeks
      before the last frost for tomatoes and 8 weeks for peppers and eggplant. Beans, beets, carrots,
      and corn don't transplant well, so sow them right in the garden. Squash, cucumbers, and melons can
      be started indoors about 4 weeks ahead if you handle the roots gently, or sown directly.
  - t: Seed-starting setup
    how: Use a soilless seed-starting mix, not garden soil. Seeds sprout best in mix around 65 to 75°F.
      A window rarely gives enough light, so hang fluorescent or LED lights close above the seedlings
      for 12 to 16 hours a day and raise them as plants grow.
  - t: Hardening off
    how: Seedlings raised indoors need about 2 weeks to get used to sun and wind. Start with a few hours
      outside in a sheltered spot and add time each day, and bring them in on cold nights until nights
      stay at or above 50°F. Water a little less often, but don't let them wilt.
  - t: Succession planting
    how: Instead of planting a whole row at once, sow a portion every two weeks for a steady harvest.
      When an early crop like peas or lettuce finishes, follow it with a warm-season crop, then a fall
      crop or a cover crop.
  - t: Fall gardens
    how: Many cool-season crops taste best maturing in cool fall weather. Count back from your first fall
      frost using the days to maturity on the seed packet, and plant garlic in the fall for next summer.
  - t: Row covers
    how: Lightweight fabric row covers laid over crops hold in a few degrees of warmth, and heavier covers
      protect some crops down to about 25°F. They also keep out many insects. Anchor the edges with pins,
      rocks, or sandbags.
  - t: Low tunnels and cold frames
    how: Hoops over a bed hold fabric or plastic off the plants. A cold frame is a low box with a clear
      lid that traps the sun's warmth. Both can overheat fast on sunny days, so open or vent them.
  - t: Crops that keep going in the cold
    how: Spinach, kale, arugula, chard, parsley, and some leaf lettuces handle cold well, especially under
      cover. Carrots and other root crops often get sweeter after cold weather.
  sources:
  - &id051
    name: NOAA Climate.gov, Average date of last spring freeze
    url: https://www.climate.gov/spring-freeze
