- id: watering
  title: Watering
  intro: Steady moisture is what helps vegetables grow well. Water deeply, water the soil instead of the
    leaves, and use mulch to make every gallon last.
  items:
  - t: About an inch a week
    how: Most vegetable gardens need about 1 inch of water a week, and you make up whatever rain doesn't
      supply. An inch of water is about 2/3 gallon per square foot, or roughly 60 to 65 gallons for a
      10-by-10-foot bed.
  - t: Measure with a can
    how: Set a straight-sided can, like a tuna can, in the garden and time how long your sprinkler or
      hose takes to fill it an inch deep. A rain gauge tells you how much nature already gave.
  - t: Check the soil before watering
    how: Push a finger 2 to 3 inches into the soil. If it's still moist there, wait.
  - t: Water deeply, less often
    how: Light daily sprinkles keep roots shallow and weak. A thorough soaking once or twice a week, depending
      on weather and soil, sends roots deeper where the soil stays moist longer.
  - t: Morning is best
    how: Early morning watering lets leaves dry quickly, which lowers disease risk. Avoid the heat of
      mid-afternoon, when much of the water evaporates.
  - t: Soaker hoses and drip lines
    how: Both put water right at the roots with little waste and keep leaves dry. Soaker hoses are cheap
      and simple, and drip costs more but is very precise and pairs well with a timer.
  - t: Mulch holds water in
    how: Organic mulch slows evaporation and keeps soil cooler, so you water less often. Spread it a few
      inches deep over moist soil.
  - t: Containers and raised beds dry faster
    how: Pots can need water every day in summer, and raised beds dry out faster than in-ground soil.
      Check them more often than the rest of the garden.
  - t: Rain barrels
    how: A barrel under a downspout stores soft rainwater for dry spells. Put a tight screen on top to
      keep mosquitoes out, run the overflow hose to a second barrel or a soaker hose, and never drink
      the water.
  - t: Using rainwater on food crops
    how: Apply rainwater to the soil, not on the leaves or fruit, ideally through drip or soaker lines,
      and don't harvest right after watering. Wash produce before eating as usual.
  - t: Check local rules first
    how: Rules about collecting rainwater, and rebates for rain barrels, vary by state and city. Check
      with your local government or water utility before you set one up.
  sources:
  - *id004
  - *id005
  - *id009
  - *id013
  - name: Rutgers NJAES Fact Sheet FS1218, rain barrel water for gardens
    url: https://njaes.rutgers.edu/fs1218
  - name: Texas A&M-hosted TCEQ GI-383, Rainwater Harvesting with Rain Barrels
    url: https://texaslocalproduce.tamu.edu/files/2017/10/GI-383-Rainwater-Harvesting-with-Rain-Barrels.pdf
- id: crops
  title: Crop guides
  intro: Short how-tos for crops that feed a family well and store well. Your extension office can recommend
    the best varieties for your area.
  groups:
  - id: potatoes
    title: Potatoes
    items:
    - t: Plant certified seed potatoes
      how: Buy certified disease-free seed potatoes from a garden center or seed company. Grocery-store
        potatoes may be treated to keep them from sprouting, and saved potatoes can carry diseases you
        can't see.
    - t: Cut and plant
      how: Cut large seed potatoes into pieces with 1 or 2 eyes each, and plant small ones whole. Let
        cut pieces dry and heal for a few days so they don't rot in cool, wet soil.
    - t: When and how deep
      how: Plant in early spring as soon as the soil can be worked. Set pieces cut side down about 4 inches
        deep and 1 foot apart, in rows 2 to 3 feet apart.
    - t: Hill as they grow
      how: Pull loose soil up around the stems as plants grow. Hilling gives tubers room and keeps them
        covered so sunlight can't turn them green.
    - t: Why green potatoes matter
      how: Light makes potatoes turn green and build up solanine and related compounds, which are bitter
        and can make you sick. These compounds are highest in green skin, sprouts, and eyes, and cooking
        doesn't destroy them.
    - t: Cut away the green, or toss it
      how: If greening is only skin-deep, peel the potato and cut away all the green parts and sprouts.
        Throw out potatoes that are green deep into the flesh, taste bitter, or are shriveled with long
        sprouts. Store potatoes in the dark to prevent greening.
    - t: Harvest
      how: Dig a few new potatoes once they're over about 1 1/2 inches across. For storage potatoes, wait
        until the vines die, then test a hill. If the skins rub off easily, wait several more days so
        they toughen up.
    sources:
    - &id029
      name: Iowa State Extension, Growing Potatoes in the Home Garden
      url: https://yardandgarden.extension.iastate.edu/how-to/growing-potatoes-home-garden
    - &id030
      name: 'Iowa State Extension AnswerLine, Sprouting or Greening Potatoes: Keep or Toss?'
      url: https://blogs.extension.iastate.edu/answerline/2024/04/02/spouting-or-greening-potatoes-keep-or-toss/
  - id: sweet_potatoes
    title: Sweet potatoes
    items:
    - t: Grow from slips
      how: Sweet potatoes are grown from rooted sprouts called slips, not pieces of the potato. Buy slips,
        or grow your own about 6 weeks ahead by bedding roots in moist sand or potting mix kept around
        75 to 85°F. Sweet potatoes aren't related to regular potatoes, so they count as their own family
        in your rotation.
    - t: Wait for warm soil
      how: Plant slips after the soil reaches about 65°F, well after the last frost. Black plastic mulch
        warms the soil and helps a lot in northern gardens. Space slips about 12 inches apart.
    - t: Dig before cold damage
      how: Harvest before frost and before soil gets colder than about 50°F, which can injure the roots.
        If frost kills the vines, dig right away. Handle roots gently because the skin bruises easily.
    - t: Cure, then wait to eat
      how: Cure roots somewhere warm and humid, about 80 to 85°F, for about a week to heal nicks. Flavor
        improves after a few weeks of storage as starches turn to sugar.
    sources:
    - *id025
    - *id026
    - *id002
  - id: carrots
    title: Carrots
    items:
    - t: Loose soil
      how: Carrots grow best in loose, well-drained soil or raised beds. In containers, use a box at least
        12 inches deep, or choose short, round varieties.
    - t: Shallow sowing, steady moisture
      how: Sow seeds 1/4 to 1/2 inch deep and keep the seedbed moist until they come up. Carrot seed is
        slow to sprout, so don't give up too soon.
    - t: Thin early
      how: Pull extra seedlings so the ones you keep are at least 2 inches apart. Crowded carrots stay
        small.
    - t: Harvest and store
      how: Most carrots are ready when the top of the root is about 1/2 inch across or wider. Cut off
        the greens and store carrots cold and humid, around 32 to 40°F.
    sources:
    - &id031
      name: Oregon State Extension, Carrots
      url: https://extension.oregonstate.edu/imported-publication/carrots
    - *id009
    - &id027
      name: WSU Extension (Clark County), Storing Your Garden Harvest
      url: https://wpcdn.web.wsu.edu/extension/uploads/sites/57/2019/08/Storing-Your-Garden-Harvest.pdf
  - id: berries
    title: Strawberries, blueberries, raspberries, and blackberries
    items:
    - t: Strawberry types
      how: June-bearing strawberries give one big crop in late spring or early summer. Day-neutral types
        bear over a longer season, mostly in spring and again in late summer and fall. Both need full
        sun.
    - t: Strawberry care
      how: Pinch off flowers the first season on June-bearers, or for the first 4 to 6 weeks on day-neutrals,
        so plants build strong roots. Mulch with straw to keep berries clean and weeds down. After harvest,
        renew June-bearing beds by mowing the leaves and thinning plants. Beds usually decline after 3
        to 4 years.
    - t: Blueberries need acid soil
      how: Blueberries want a soil pH of about 4.5 to 5.2, much more acidic than most gardens. Test first,
        and if the pH is above 5.5, mix sulfur into the top few inches several months before planting,
        or a year ahead if the pH is above 6. Test again before you plant.
    - t: Blueberry care
      how: Work in organic matter like peat moss or aged wood chips, and keep 2 to 4 inches of mulch on
        top. Plant at least two varieties for bigger berries and larger crops. Pick off blossoms for the
        first two years, and use netting to keep birds from the fruit.
    - t: Raspberry and blackberry types
      how: Floricane types fruit on second-year canes, usually in early summer. Primocane types fruit
        on first-year canes from late summer until frost. Each cane fruits and then dies, but the roots
        keep sending up new ones.
    - t: Bramble care
      how: Cut canes that have finished fruiting off at ground level. A simple trellis keeps canes upright
        and easy to pick. Plant in full sun, at least 300 feet from wild brambles that can spread disease,
        and start with healthy, disease-free plants.
    sources:
    - &id032
      name: University of Maryland Extension, Growing Strawberries in the Home Garden
      url: https://www.extension.umd.edu/resource/growing-strawberries-home-garden
    - &id033
      name: Ohio State Extension HYG-1422, Growing Highbush Blueberries
      url: https://ohioline.osu.edu/factsheet/HYG-1422
    - &id034
      name: University of Maryland Extension, Growing Raspberries and Blackberries in the Home Garden
      url: https://extension.umd.edu/resource/growing-raspberries-and-blackberries-home-garden
  - id: garlic_onions
    title: Garlic and onions
    items:
    - t: Plant garlic in fall
      how: Plant individual cloves in fall, pointed end up, about 2 inches deep and 4 to 5 inches apart.
        Cover with about 4 inches of clean straw, not hay, which carries weed seeds. Don't plant grocery-store
        garlic, which may be treated to keep it from sprouting.
    - t: Garlic scapes and harvest
      how: Hardneck garlic sends up curly flower stalks called scapes. Snap them off for bigger bulbs
        and cook them like green onions. Dig the bulbs when the lower leaves start to yellow, before all
        the leaves turn brown.
    - t: Cure and store garlic
      how: Don't wash the bulbs. Dry them in a shaded, airy spot for 2 to 4 weeks, then store them cool
        and dry in mesh bags, not plastic. Softneck garlic usually keeps longer than hardneck.
    - t: Choose onions for your day length
      how: Onions start making bulbs based on day length. Short-day onions suit the South, long-day onions
        suit the North, and intermediate types fall in between. The wrong type gives small bulbs.
    - t: Transplants beat sets for big bulbs
      how: Onion transplants, sold in bundles, are the easiest way to grow storage onions. Sets tend to
        flower early and stop bulbing, so they're best for green onions. Plant in early spring about 4
        inches apart and keep soil evenly moist, especially once bulbs start swelling.
    - t: Harvest and cure onions
      how: Harvest when most of the tops have fallen over and started to dry. Cure them in a single layer
        in a warm, dry, airy place for 2 to 3 weeks, until the necks are dry and the skins rustle. Use
        thick-necked onions first, since they don't store well.
    sources:
    - &id035
      name: Ohio State CFAES, Growing Garlic in the Garden
      url: https://cfaes.osu.edu/fact-sheet/growing-garlic-garden
    - *id027
    - &id036
      name: 'Nebraska Extension (Lancaster County), Onions: Long Day, Short Day or Neutral?'
      url: https://lancaster.unl.edu/onions
    - &id037
      name: Iowa State Extension, How do you harvest, dry, and store onions?
      url: https://yardandgarden.extension.iastate.edu/faq/how-do-you-harvest-dry-and-store-onions
  - id: winter_squash
    title: Winter squash and pumpkins
    items:
    - t: Harvest when fully mature
      how: Mature squash have hard rinds and full color, and many types have dry, corky stems. Cut them
        from the vine with a 2- to 4-inch stem and never carry them by the stem.
    - t: Cure most types
      how: Cure butternut, hubbard, buttercup, kabocha, and pumpkins somewhere warm and fairly humid,
        about 80 to 85°F, for about 5 to 10 days. Acorn and delicata squash shouldn't be cured, because
        it shortens their storage life.
    - t: Store cool, not cold
      how: Keep squash at about 50 to 60°F in moderately dry air, in a single layer off cold concrete.
        Below 50°F they suffer chilling injury.
    - t: How long they keep
      how: Acorn and delicata keep about 1 to 3 months. Butternut, buttercup, kabocha, and hubbard can
        keep about 3 to 6 months.
    sources:
    - &id038
      name: UMass Extension, Pumpkin and Winter Squash Harvest, Curing and Storage
      url: https://www.umass.edu/agriculture-food-environment/vegetable/fact-sheets/pumpkin-winter-squash-harvest-curing-storage
    - &id039
      name: University of Illinois Extension, Storing Your Summer Harvest (winter squash handout)
      url: https://extension.illinois.edu/sites/default/files/2021_august_eat_fresh_eat_local_storing_your_summer_harvest_handout.pdf
  - id: dry_beans
    title: Dry beans
    items:
    - t: Grow them like green beans
      how: Dry beans are planted and grown like snap beans, but you let the seeds mature fully. Plant
        after the soil is above 60°F, and never in soil below 50°F. Bush types are simple, and pole types
        save space but need a trellis.
    - t: Harvest when pods are dry
      how: Pick when pods are dry and open easily in your hand, before they split and drop beans. You
        can pull whole plants and finish drying them under cover.
    - t: Thresh and clean
      how: Pile dry plants on a tarp or in a bag and walk on them to split the pods. Sift out the beans
        through a screen and let a breeze or fan blow away the chaff.
    - t: Store for years
      how: Keep beans in tightly closed jars or buckets in a dark, dry place. They keep for several years,
        but very old beans may stay hard when cooked. Dry beans are about 22 percent protein.
    sources:
    - *id028
