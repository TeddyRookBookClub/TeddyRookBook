- id: who_this_helps
  title: Who this helps
  intro: Food gardening works in almost any situation. Here are some ideas for where you are now.
  items:
  - t: Apartments and city homes
    how: Start with a sunny window, a grow light, or balcony containers, and focus on greens, herbs, and
      compact tomatoes and peppers. If you garden in city soil, test for lead and use raised beds or containers
      with clean soil if needed.
  - t: Suburban yards
    how: A few raised or in-ground beds in the sunniest part of the yard can provide fresh vegetables
      from spring through fall. Add berries along a fence and a compost pile for leaves and clippings.
  - t: Rural homes and homesteads
    how: With more room, you can grow storage crops like potatoes, winter squash, onions, and dry beans,
      rotate plant families across blocks, and use cover crops. Extension and NRCS can help with soil,
      water, and conservation planning.
  - t: Renters
    how: Containers and fabric grow bags move with you. Ask your landlord before digging, and consider
      a community garden plot for more space.
  - t: Families on a budget
    how: Grow from seed, save seeds from open-pollinated varieties, make compost, use free mulch, and
      check your library's seed library. Focus on what your family eats most.
  - t: Families with kids
    how: Fast crops like radishes, beans, and sunflowers keep children interested. A small bed they manage
      themselves teaches patience and where food comes from.
  - t: Community garden gardeners
    how: Learn the garden's rules on water, mulch, and pesticides. Rotate crops within your plot, keep
      it tidy so pests don't spread to neighbors, and learn from experienced gardeners around you.
  - t: Schools and homeschool families
    how: A garden makes a natural outdoor classroom for science, math, and nature study. Kids can measure
      growth, keep journals, track weather, and study the insects and birds that visit.
  - t: People with limited mobility
    how: Raised beds 2 to 3 feet high, or garden tables with knee room underneath, let you garden seated
      or standing without bending. Firm, smooth paths 3 to 4 feet wide fit wheelchairs and walkers. Long-handled,
      lightweight tools and self-watering containers or drip lines save effort.
