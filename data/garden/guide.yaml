- id: soil_and_compost
  title: Soil and compost
  intro: Good garden soil is loose, drains well, and holds plenty of organic matter. You build it a little
    every year with compost, mulch, and cover crops.
  items:
  - t: Organic matter is the key
    how: Compost, leaves, and other organic matter help sandy soil hold water and help clay soil drain.
      Soil rich in organic matter also holds onto nutrients so plants can use them.
  - t: Fertilize by the soil test
    how: A soil test tells you which nutrients are low and whether you need lime. Adding fertilizer by
      guesswork can waste money or overload the soil with nutrients it doesn't need.
  - t: 'Compost basics: greens and browns'
    how: Mix about one part greens (fruit and vegetable scraps, coffee grounds, fresh grass clippings)
      with two parts browns (dry leaves, straw, small twigs). Keep the pile about as damp as a wrung-out
      sponge, and turn it to add air and speed things up.
  - t: What to leave out of compost
    how: Skip meat, bones, dairy, oils and fats, and dog or cat waste, which attract pests or carry germs.
      Also leave out diseased or bug-infested plants and weeds that have gone to seed or spread by roots.
  - t: Know where manure, hay, and compost come from
    how: Some long-lasting weed killers stay active in hay, grass clippings, manure, and even finished
      compost. They can twist and stunt tomatoes, peppers, beans, and peas. Ask suppliers what was sprayed
      on the hay or pasture before you bring it home.
  - t: Do a quick bean test on outside materials
    how: Mix some of the manure or compost half and half with store-bought potting mix in a few pots,
      plant pea or bean seeds, and grow pots of plain potting mix next to them. If the plain pots look
      normal after 2 to 3 weeks and the test pots are twisted or stunted, don't use that material on your
      garden.
  - t: Mulch the soil surface
    how: A 3- to 4-inch layer of organic mulch holds in moisture, smothers small weeds, and keeps soil
      cooler in summer. It also stops mud from splashing onto plants and fruit. Shred leaves first so
      they don't mat, and know that hay often carries weed seeds.
  - t: 'Wood chips: great for paths and perennials'
    how: Arborist wood chips are often free and make an excellent long-lasting mulch for paths, berries,
      and fruit plantings. Spread them on top and don't dig them into the soil. They only tie up nitrogen
      right where they touch the soil surface.
  - t: Don't work wet soil
    how: Digging or tilling wet soil damages its structure. If a handful sticks together in a ball and
      won't crumble, wait a few days.
  - t: What cover crops do
    how: Cover crops are planted to protect and build soil, not to eat. They add organic matter, hold
      soil against erosion, crowd out weeds, and soak up leftover nutrients. Legume cover crops like clover,
      vetch, and cowpeas can add nitrogen.
  - t: Cool-season cover crops (late summer and fall)
    how: Oats die over a cold winter and leave an easy mulch for spring. Cereal rye and hairy vetch survive
      winter and grow lots of biomass. Crimson clover sometimes survives winter.
  - t: Warm-season cover crops (summer)
    how: Buckwheat, cowpeas, and sorghum-sudangrass grow fast in warm soil and fill a gap of about 45
      to 60 days between crops. Buckwheat flowers also feed pollinators.
  - t: Ending cover crops on time
    how: Cut down buckwheat before it sets seed, and never let hairy vetch go to seed, because its seed
      lasts for years. Cereal rye is easiest to kill once it flowers, and you should finish it 2 to 3
      weeks before planting because it can hold back seedlings. Mixes of species often work better than
      a single cover crop.
  sources:
  - *id012
  - *id011
  - *id003
  - &id040
    name: UGA Extension, Composting at Home
    url: https://site.extension.uga.edu/georgiagreen/files/2021/01/Composting-at-Home1.pdf
  - &id042
    name: NC State Extension, Herbicide Carryover in Hay, Manure, Compost, and Grass Clippings
    url: https://content.ces.ncsu.edu/herbicide-carryover
  - *id005
  - &id041
    name: WSU Extension FS160E (archived), Using Arborist Wood Chips as a Landscape Mulch
    url: https://pubs.extension.wsu.edu/using-arborist-wood-chips-as-a-landscape-mulch-home-garden-series
