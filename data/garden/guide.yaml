sections:
- id: getting_started
  title: Getting started, wherever you grow
  intro: You can grow real food in a sunny window, on a balcony, in a backyard, or across several acres.
    Pick the setting closest to yours and follow the steps in order. Start smaller than you think you
    need. A small garden you can keep up with gives you more food than a big one that gets away from you.
  groups:
  - id: indoor
    title: 'Indoors: windowsills and grow lights'
    intro: Leafy greens, herbs, and microgreens do well indoors. Fruiting crops are harder.
    items:
    - t: Start with greens and herbs
      how: Lettuce, arugula, mustard and Asian greens, and herbs are the easiest indoor crops because
        they need the least light. Tomatoes and strawberries can grow under lights, but they need much
        more of it, and good indoor fruit usually takes grow lights all year.
    - t: Find your brightest window
      how: Herbs and leafy greens need at least 4 to 6 hours of direct sun a day. Winter sun is weaker,
        so plants on a windowsill may grow slowly or stretch toward the glass in the darker months.
    - t: Add a grow light if the window falls short
      how: LED or fluorescent fixtures work well and give off little heat, and LEDs use less power for
        the same light. Aim for about 16 hours of light a day and plug the light into a simple timer.
        For greens, lights are typically 6 to 12 inches above the leaves, but follow your fixture's instructions.
    - t: Use pots with drainage holes and a tray
      how: Small to medium pots are fine for herbs and greens, and you can move them to follow the light.
        Water should drain out the bottom, so set each pot on a tray and don't let it sit in standing
        water.
    - t: Fill with potting mix, not garden soil
      how: Garden soil is too dense for indoor containers. Use a light soilless mix made from ingredients
        like peat moss, coconut coir, perlite, vermiculite, and compost.
    - t: Water when the top of the mix is dry
      how: Push a finger into the mix. Water when the top part is dry but the whole pot isn't, and water
        until a little drains out. Herbs like it a bit drier, while leafy greens want steady moisture.
    - t: Feed plants that stay a while
      how: Microgreens need no fertilizer. Herbs and greens you keep for weeks can get a controlled-release
        or water-soluble fertilizer once or twice a month, mixed as the label says.
    - t: Try microgreens for quick wins
      how: Microgreens like radish, kale, mustard, and beets are ready in about 7 to 21 days, when they
        are 2 to 3 inches tall. Baby greens take about 3 to 6 weeks and can often be cut and regrown once
        or twice.
    - t: Sow a little, often
      how: Plant a small tray or pot every week or two instead of all at once. That way you have something
        ready to eat most of the time.
    sources:
    - &id001
      name: UT Extension W 1288-B, Small-Space Indoor Food Production
      url: https://utia.tennessee.edu/publications/wp-content/uploads/sites/269/2025/04/W1288B.pdf
    - &id007
      name: University of Maryland Extension, Growing Microgreens and Baby Greens Indoors
      url: https://extension.umd.edu/resource/growing-microgreens-and-baby-greens-indoors
    - &id008
      name: Clemson HGIC, FAQs about Starting Vegetable Seeds Indoors
      url: https://hgic.clemson.edu/faqs-about-starting-vegetable-seeds-indoors/
    - &id006
      name: University of Maryland Extension, Planting Vegetables in Succession
      url: https://extension.umd.edu/resource/planting-vegetables-succession
  - id: balcony
    title: 'Balconies and patios: container gardens'
    intro: Containers let renters and apartment dwellers grow a surprising amount in a small space.
    items:
    - t: Watch how much sun you get
      how: Most vegetables need at least 6 hours of sun a day. If your balcony gets less, lean on leafy
        greens and herbs, which handle partial light better than tomatoes or peppers.
    - t: Check with your landlord or building
      how: Ask about any rules for balcony pots, hanging planters, and dripping water before you buy supplies.
        Wet soil is heavy, so ask about weight limits, and secure anything that could blow over.
    - t: Choose containers big enough for the crop
      how: A 5-gallon bucket fits one tomato, zucchini, eggplant, or bush winter squash. A 2-gallon pot
        fits one pepper or bush cucumber. Window boxes work for lettuce, spinach, radishes, onions, and
        herbs, and carrots need a box at least 12 inches deep.
    - t: Make sure every pot drains
      how: Each container needs at least one drainage hole in the bottom. Buckets, dishpans, and storage
        tubs all work once you drill holes.
    - t: Use a good potting mix
      how: Fill containers with a commercial potting mix or a homemade mix with compost, peat, and vermiculite.
        Leave about an inch of space below the rim so water doesn't spill over.
    - t: Pick compact varieties
      how: Seed catalogs label varieties as patio, bush, compact, or container types. These stay smaller
        and produce well in pots, like patio tomatoes, bush cucumbers, and bush winter squash.
    - t: Plan to water often
      how: Containers dry out much faster than garden beds and may need water every day in hot weather.
        Self-watering containers, which you can make from 5-gallon buckets, hold a reserve and cut down
        on daily watering.
    - t: Feed regularly in summer
      how: Watering washes nutrients out of pots. A balanced water-soluble fertilizer every other week
        during summer, mixed as the label directs, keeps plants growing.
    - t: Grow up, not out
      how: A trellis or railing lets pole beans, peas, cucumbers, and small melons climb. Vertical plants
        catch more sun and wind, so check them for water more often.
    - t: Pick often
      how: Harvest vegetables as soon as they are ripe. Regular picking keeps many plants, like beans,
        cucumbers, and zucchini, producing longer.
    sources:
    - &id009
      name: 'University of Maine Extension Bulletin #2762, Growing Vegetables in Container Gardens'
      url: https://extension.umaine.edu/publications/?p=4567
    - &id010
      name: University of Maryland Extension, Container Food Gardening
      url: https://extension.umd.edu/resources/yard-garden/containers-and-small-spaces/container-food-gardening
    - *id001
    - &id011
      name: Oklahoma State Extension, Components of Intensive Gardening
      url: https://extension.okstate.edu/programs/gardening/grow-gardening-columns/grow-columns-2020/april-19-2020-components-of-intensive-gardening.html
  - id: backyard
    title: 'Backyard beds: in-ground and raised'
    intro: A few beds behind the house can supply fresh produce for much of the year.
    items:
    - t: Pick the sunniest spot you have
      how: Most vegetables need at least 6 to 8 hours of direct sun. Stay clear of trees and buildings
        that cast shade, and remember that shadows are longer in spring and fall.
    - t: Put the garden near a hose
      how: You will water more often than you expect. A spot close to a faucet makes it much more likely
        the garden gets watered in a dry week.
    - t: Test your soil first
      how: A soil test from your extension office tells you the pH and nutrient levels and gives lime
        and fertilizer recommendations. If your home is older or you live in a city, ask about a lead
        test too (see Choosing your spot).
    - t: Decide between in-ground and raised beds
      how: In-ground beds cost less and hold moisture longer. Raised beds drain better, warm up earlier
        in spring, and are a good fix for poor or contaminated soil, but they dry out faster and need
        more watering.
    - t: Keep beds narrow enough to reach the middle
      how: A bed about 4 feet wide works for most adults when you can reach in from both sides. Avoid
        stepping in the beds, because that packs the soil down.
    - t: Build frames from safe materials
      how: Cedar, redwood, concrete blocks, and stone are all good choices. Don't use railroad ties or
        old lumber that may contain creosote. Extension services consider today's arsenic-free treated
        lumber low risk.
    - t: Prepare the soil
      how: Fill raised beds with a mix high in organic matter, or remove sod and loosen in-ground soil
        to about 8 inches deep. Only dig when the soil is dry enough to crumble in your hand. Wet soil
        that sticks together is too wet to work.
    - t: Plan with crop families and seasons
      how: Sketch which bed gets which plant family this year so you can rotate next year. Plant cool-season
        crops in early spring and fall, and warm-season crops after your last frost.
    - t: Mulch and water deeply
      how: Cover bare soil with mulch to hold moisture and block weeds. Give the garden about an inch
        of water a week when rain falls short, in fewer, deeper waterings.
    - t: Keep a simple garden log
      how: Write down or photograph what you planted where, when you planted it, and how it did. This
        makes rotation and next year's planning much easier.
    sources:
    - &id012
      name: 'UT Extension W 346-A, The Tennessee Vegetable Garden: Site Selection and Soil Testing'
      url: https://utia.tennessee.edu/publications/wp-content/uploads/sites/269/2023/10/W346-A.pdf
    - &id003
      name: UT Extension (Grainger County), Soil Testing
      url: https://grainger.tennessee.edu/wp-content/uploads/sites/153/2022/08/Soil-Testing.pdf
    - &id013
      name: Oregon State Extension FS 270, Raised Bed Gardening
      url: https://extension.oregonstate.edu/sites/extd8/files/catalog/auto/FS270.pdf
    - &id014
      name: 'Oregon State Extension, Raised bed lumber: pressure treated safe?'
      url: https://extension.oregonstate.edu/gardening/techniques/raised-bed-lumber-pressure-treated-safe
    - &id002
      name: Iowa State Extension, Crop Rotation in the Vegetable Garden
      url: https://yardandgarden.extension.iastate.edu/how-to/crop-rotation-vegetable-garden
    - &id004
      name: 'NC State Extension (Wilkes County), Watering Wisely: How Much Your Summer Vegetable Garden
        Really Needs'
      url: https://wilkes.ces.ncsu.edu/2025/06/watering-wisely-how-much-your-summer-vegetable-garden-really-needs
    - &id005
      name: UGA Extension C 984, Mulching Vegetables
      url: https://fieldreport.caes.uga.edu/publications/C984/mulching-vegetables
  - id: large_home
    title: Large home gardens
    intro: A big garden can feed a family through much of the year, with some planning.
    items:
    - t: Map the garden by plant family
      how: Divide the garden into blocks or beds and assign each to a plant family group. Move each group
        to a new block every year so no family returns to the same soil for 3 to 4 years.
    - t: Test the soil and amend by the results
      how: Sample from 8 to 10 spots across each area and mix them for one test. Fall testing is a good
        idea because lime takes months to change soil pH, so it can work before spring planting.
    - t: Set up efficient watering
      how: At this size, soaker hoses or drip lines on a timer save hours and put water at the roots,
        where it's needed. Drip costs more up front but uses water very efficiently.
    - t: Lay out permanent paths
      how: Wide, firm paths let you bring in a wheelbarrow and keep you off the beds. Paths of 3 to 4
        feet fit both wheelbarrows and wheelchairs.
    - t: Grow fresh crops and storage crops
      how: Plant salad crops, beans, and tomatoes in succession for fresh eating. Add storage crops like
        potatoes, onions, garlic, winter squash, sweet potatoes, and dry beans to eat through fall and
        winter.
    - t: Plant cover crops on resting beds
      how: Instead of leaving soil bare, sow a cover crop such as oats, cereal rye, or clover. Cover crops
        protect the soil, add organic matter, and smother weeds.
    - t: Mulch to save labor
      how: A few inches of organic mulch cuts weeding and watering a great deal. In a large garden, mulch
        is often the difference between keeping up and falling behind.
    - t: Scout every week
      how: Walk the garden weekly and look under leaves for insects and eggs. Problems caught early are
        much easier to handle.
    - t: Plan for the harvest glut
      how: Big gardens produce more than you can eat fresh at peak season. Decide ahead of time how you'll
        store, freeze, dry, can, or share the extra.
    sources:
