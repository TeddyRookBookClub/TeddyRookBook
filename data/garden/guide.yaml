  - id: small_farm
    title: Small family farms (about 1 to 10+ acres)
    intro: Growing on acres is a different job from gardening. Extension and USDA both offer free help
      for new farmers, so use it early.
    items:
    - t: Set clear goals
      how: Decide whether the farm is mainly to feed your family, to earn income, or both, and how many
        hours a week you can give it. Your goals shape every other choice.
    - t: Talk to extension and your USDA Service Center
      how: Your county extension office can advise on crops, varieties, and methods for your area. At
        a USDA Service Center you can register a farm number, meet NRCS staff about a free conservation
        plan, and learn about programs and loans. Each state also has a beginning farmer coordinator.
    - t: Soil test every field
      how: Test each field separately, since soils can change across a property. Extension labs report
        pH and nutrients and give lime and fertilizer recommendations for your crops.
    - t: Secure a reliable water source
      how: Know where irrigation water will come from in a dry summer and how you'll get it to the crops.
        If you sell produce, the quality of your farm water may also fall under food safety rules.
    - t: Research markets before you plant
      how: 'If you plan to sell, find buyers first: farmers markets, CSA members, grocers, restaurants,
        or wholesale. Growing a crop is only half the job if no one nearby wants to buy it.'
    - t: Start small with one or two enterprises
      how: Begin with a single crop or product and a manageable piece of land, then expand as you learn.
        Land-grant universities publish free enterprise budgets that help you estimate costs and returns.
    - t: Match equipment to your scale
      how: Research the tools and machinery your crops really need before buying, and count equipment
        costs in your enterprise budget. Buying more machine than your acreage needs ties up money you
        may need elsewhere.
    - t: Plan a field rotation with cover crops
      how: Divide your land into fields or blocks and rotate plant families across them. Sample rotations
        from working vegetable farms include cover crops, and sometimes a hay or grass-legume phase, before
        returning to vegetables.
    - t: Check the rules early
      how: Zoning, licenses, food processing, pesticide use, and food safety are all regulated, and the
        rules vary by state and county. Farms that sell produce may be covered by the FDA Produce Safety
        Rule, which has exemptions based on sales, so check where you stand.
    - t: Keep records and keep learning
      how: Track plantings, yields, costs, and sales from day one. Extension workshops and beginning farmer
        programs are a good place to get training.
    sources:
    - &id019
      name: N.C. Cooperative Extension (Warren County), How Do You Start a Farm?
      url: https://warren.ces.ncsu.edu/news/how-do-you-start-a-farm/
