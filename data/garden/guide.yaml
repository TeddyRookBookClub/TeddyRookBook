- id: grow_more_food
  title: Growing more of your own food
  intro: If you want your garden to cover more of your meals, it helps to know which crops supply energy
    (calories) and which mainly supply vitamins, fiber, and flavor.
  items:
  - t: An honest note about calories
    how: Most home gardens supply freshness, vitamins, minerals, and fiber more than total calories. Salad
      greens, cucumbers, tomatoes, and most other vegetables are low in calories, so even a large harvest
      doesn't add many. That's still a big win for a family's health and grocery bill.
  - t: Calorie crops
    how: 'The crops that supply the most food energy are starchy or dense ones that also store well: potatoes,
      sweet potatoes, winter squash, dry beans, and dry corn grown for meal. These are the foundation
      if you want to grow a larger share of what you eat.'
  - t: Potatoes and sweet potatoes
    how: Potatoes yield heavily for the space. Iowa State expects about 20 to 30 pounds per 10-foot row
      with good care. Because they yield heavily and are mostly starch, potatoes and sweet potatoes are
      generally among the most productive calorie crops a home garden can grow.
  - t: Dry beans
    how: Dry beans yield fewer pounds per row, about 1.2 pounds per 10 feet, but they are dense food.
      They're about 22 percent protein and keep for years on a shelf.
  - t: Plan for storage
    how: Calorie crops matter most when they last into winter. Potatoes, sweet potatoes, winter squash,
      onions, and dry beans all store for months with the right conditions.
  - t: Growing all your calories takes room
    how: Feeding a family entirely from a garden takes a lot of land, skill, and work. Most people do
      best growing a meaningful share and building up year by year.
  - t: Intensive planting
    how: Wide beds with plants spaced closely in all directions grow more food per square foot than single
      rows with wide paths. Interplanting two crops in the same bed and replanting as soon as something
      is harvested make fuller use of the space. Close spacing needs deep, fertile soil and steady water.
  - t: Vertical growing
    how: Cucumbers, pole beans, peas, small melons, and tomatoes can grow up trellises, fences, or cages
      instead of across the ground. Melons and tomatoes need to be tied to their supports. Vertical plants
      dry out faster, so water them more often.
  - t: Stretch the season
    how: Succession planting, fall crops, row covers, and cold frames add weeks or months of harvest from
      the same beds. See the planting calendar section for how each one works.
  - t: Reduce losses
    how: Food lost to pests, missed harvests, or poor storage is food you grew for nothing. Weekly scouting,
      picking on time, and good storage add up.
