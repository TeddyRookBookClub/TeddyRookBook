  - id: broiler_weeks
    label: 'Meat chickens (Cornish Cross type): weeks to processing'
    value:
      weeks_low: 6
      weeks_high: 8
    notes: 'UMN and Penn State: Cornish Cross reach processing size in 6 to 8 weeks. Penn State warns that keeping
      them past 8 weeks raises the risk of lameness, heat stress, heart problems and sudden death.'
    sources:
    - name: 'University of Minnesota Extension: Raising Chickens for Meat'
