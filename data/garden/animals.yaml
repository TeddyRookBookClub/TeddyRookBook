  - id: coop_floor_space
    label: Coop (indoor) floor space per standard-size hen
    value:
      with_run_sqft_low: 3
      with_run_sqft_high: 4
      without_run_sqft_low: 8
      without_run_sqft_high: 10
      unit: square feet per bird
    notes: At least 3 square feet per bird inside when hens also have an outdoor run (UF/IFAS, UNH, Oregon State);
      NC State gives 2.5 to 3.5, UMN 3 to 5. If birds are kept inside with no run, Oregon State advises 8 to 10
      square feet per bird. Bantams need less; large breeds need more.
    sources:
    - name: 'UF/IFAS Extension AN239: Raising Backyard Chickens for Eggs'
