  - id: brooding_chicks
    title: Brooding chicks
    intro: Baby chicks cannot keep themselves warm for their first couple of weeks. A brooder is simply a safe,
      draft-free box or pen with a heat source, feed, and water.
    items:
    - t: Set up heat before chicks arrive
      how: Keep it 90 to 95 F at chick level for the first week, then lower it about 5 F each week by raising the
        lamp or adjusting the heater. Chicks are usually feathered and ready to do without heat at about 4 to 6
        weeks, once the brooder is close to room temperature.
    - t: Let the chicks tell you
      how: Chicks huddled under the heat are cold. Chicks pressed against the far walls are too hot. Chicks crowded
        to one side may be in a draft. Happy chicks are spread out, softly peeping, eating, and drinking.
    - t: Use heat lamps safely
      how: Heat lamps can start fires. Hang the lamp with a chain, never by its cord, use a guarded fixture, and
        keep it well away from bedding. Radiant heaters made for poultry are another option.
    - t: Give them room
      how: Start with about 1/2 square foot per chick and give more space as they grow. A deep box or pen with clean
        pine shavings works well.
    - t: Water first, then starter feed
      how: Have clean water ready and dip each chick's beak in it when they arrive. Feed chick starter (about 20
        to 22 percent protein) for the first six weeks, then switch to grower feed. Clean and refill waterers daily.
    - t: Keep the brooder out of the kitchen
      how: Chicks can carry Salmonella even when they look healthy. CDC advises keeping poultry, including chicks,
        out of the house, especially where food is made or eaten, and washing hands after every handling.
    sources:
    - name: 'UNH Extension: Brooding and Caring for Chicks'
      url: https://extension.unh.edu/resource/brooding-and-caring-chicks
    - name: 'UF/IFAS Extension AN239: Raising Backyard Chickens for Eggs'
      url: https://ask.ifas.ufl.edu/publication/AN239
