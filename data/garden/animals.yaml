      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
  - id: health_biosecurity
    title: Health and biosecurity
    intro: '"Biosecurity" just means keeping germs away from your birds. It is the best protection against bird
      flu and other serious diseases.'
    items:
    - t: Know the signs of bird flu
      how: USDA lists sudden death, low energy and appetite, a drop in eggs or soft or misshapen eggs, swelling
        or purple color of the comb, wattles, or legs, trouble breathing, coughing or sneezing, twisting of the
        head and neck, stumbling, and diarrhea. Highly pathogenic bird flu can kill a whole flock within days, so
        act fast if you see these signs.
    - t: Report sick or dying birds quickly
      how: If birds get sick or die suddenly, contact your veterinarian, your state veterinarian, or USDA's toll-free
        line at 1-866-536-7593. Avian influenza is a reportable disease. Wear gloves around sick or dead birds and
        wash up well.
    - t: Keep wild birds away
      how: Wild birds can bring avian flu and other diseases to backyard flocks. Keep your birds apart from wild
        birds and other people's poultry, and keep wild birds out of their feed and water. A covered run helps.
    - t: Quarantine new birds
      how: Keep new birds separate from your flock for at least 30 days. Care for your existing birds first, then
        the new ones, and use separate gloves and boots or wash up in between.
    - t: Do not haul disease home
      how: Limit visitors to the coop, use dedicated chore shoes, and avoid borrowing or sharing tools and equipment
        with other poultry owners. Clean cages and vehicles after shows or swaps.
    - t: Watch for everyday warning signs
      how: Sick birds often eat or drink less, have ruffled feathers, runny droppings, discharge from the eyes or
        nose, or lay fewer or odd-looking eggs. Check birds monthly for lice and mites, and give them loose soil
        or sand for dust bathing.
    sources:
    - name: 'USDA APHIS: Avian Influenza'
      url: https://www.aphis.usda.gov/livestock-poultry-disease/avian/avian-influenza
    - name: 'USDA APHIS: Defend the Flock'
      url: https://www.aphis.usda.gov/livestock-poultry-disease/avian/defend-the-flock
    - name: 'CDC: Backyard Poultry (Healthy Pets, Healthy People)'
      url: https://www.cdc.gov/healthy-pets/about/backyard-poultry.html
    - name: 'UNH Extension: Producing Your Own Eggs'
      url: https://extension.unh.edu/resource/producing-your-own-eggs
  - id: winter_and_heat
    title: Winter and hot-weather care
    intro: Healthy adult chickens handle cold better than heat. Dry air, steady water, and shade matter more than
      fancy gear.
    items:
    - t: Keep the coop dry, not sealed
      how: Seal drafts near the birds but keep vents open up high so moist air escapes. Frostbite on combs and toes
        is mostly caused by cold plus dampness. Remove wet bedding and manure regularly.
    - t: Keep water from freezing
      how: Use a heated waterer or base made for poultry, or swap in fresh water several times a day. Hens eat up
        to about 25 percent more feed in cold weather, so keep feeders full.
    - t: Be careful with heat
      how: If you add heat, use radiant heaters approved for poultry, hang lamps by a chain in a guarded fixture,
        and keep cords and bulbs away from bedding and water. Have an electrician handle permanent coop wiring.
    - t: Watch for heat stress
      how: Heat stress can start in the 80s F. Warning signs are heavy panting, wings held away from the body, crouching,
        and pale combs. Provide shade, good airflow, and cool, fresh water. Adding ice or frozen water bottles to
        waterers helps during heat waves.
    - t: Adjust feeding in heat
      how: Feed in the cooler morning or evening and skip scratch grain and corn during heat waves, since digesting
        them makes extra body heat. Frozen fruit or vegetable treats can help, in moderation.
    sources:
    - name: 'University of Minnesota Extension: Caring for Chickens in Cold Weather'
      url: https://extension.umn.edu/small-scale-poultry/caring-chickens-cold-weather
    - name: 'Penn State Extension: Summer Flock Care'
      url: https://extension.psu.edu/summer-flock-care-keeping-your-birds-cool-and-comfortable
    - name: 'UNH Extension: Producing Your Own Eggs'
      url: https://extension.unh.edu/resource/producing-your-own-eggs
  - id: meat_birds
    title: Raising and processing meat birds
    intro: Raising meat chickens is a short project, usually 6 to 12 weeks. It is worth planning the end of that
      project, the processing, before the chicks arrive.
    items:
    - t: Raising broilers
      how: Brood meat chicks like layer chicks, then give them more space as they grow. They need a high-protein
        starter feed (about 20 to 24 percent protein) and plenty of water. Cornish Cross grow so fast that they
        can develop leg and heart problems. Process them on time, around 6 to 8 weeks.
    - t: Plan processing before you buy chicks
      how: Decide whether you will process at home or use a poultry processor. Processors often book up months ahead,
        so reserve a date before you order chicks. Many towns do not allow backyard slaughter, so check local rules.
    - t: Humane processing basics
      how: Extension guides advise removing feed (but not water) for several hours beforehand, handling birds calmly
        to avoid bruising, and using a killing cone and a very sharp knife so the job is quick. If you have never
        done it, learn from an experienced person or an extension workshop first.
    - t: Keep it clean
      how: Work in a clean area with good water, away from flies. Keep scald water at the right temperature (UMN
        gives 125 to 130 F for 30 to 75 seconds for young birds). Remove the intestines carefully so they do not
        tear, and wash hands, knives, and surfaces often.
    - t: Chill fast
      how: Chill carcasses in ice water right after processing until the meat is 40 F, then refrigerate or freeze.
        A carcass should be below 45 F within about four hours. Cook chicken to 165 F.
    - t: Selling meat or eggs is regulated
      how: You can process birds for your own household without inspection, but selling poultry or eggs is regulated,
        and rules differ by state. Before selling anything, check with your state department of agriculture or extension
        office about licenses, labels, and limits.
    sources:
    - name: 'University of Minnesota Extension: Raising Chickens for Meat'
      url: https://extension.umn.edu/small-scale-poultry/getting-started-broilers
    - name: 'University of Minnesota Extension: Home Processing of Poultry'
      url: https://extension.umn.edu/small-scale-poultry/home-processing-poultry
    - name: 'Penn State Extension: A Quick Guide to Raising Pastured Broilers'
      url: https://extension.psu.edu/a-quick-guide-to-raising-pastured-broilers
    - name: 'Poultry Extension (Univ. of Kentucky): Food Safety of Poultry Meat from Backyard Flocks'
      url: https://poultry.extension.org/articles/food-safety-with-poultry-meat-and-eggs/food-safety-of-poultry-meat-from-backyard-flocks/
    - name: 'Oklahoma State University Extension: Backyard Flock Production'
      url: https://extension.okstate.edu/fact-sheets/backyard-flock-production
    - name: 'CDC: Backyard Poultry (Healthy Pets, Healthy People)'
      url: https://www.cdc.gov/healthy-pets/about/backyard-poultry.html
  - id: costs_honest
    title: The honest truth about costs
    intro: Most families keep chickens for the fresh eggs, the learning, and the fun, not to save money.
    items:
    - t: Home eggs usually cost more
      how: Extension specialists are clear on this. Penn State says small-flock eggs will always cost more than
        store eggs, Oklahoma State says home eggs and meat often cost more than retail, and NC State says you will
        not make a profit or even recover costs from a small flock.
    - t: Feed is the biggest ongoing cost
      how: Feed is roughly 70 percent of the cost of raising chickens. The coop, fencing, feeders, waterers, and
        chicks or pullets are the upfront costs.
    - t: Older hens cost the same to feed
      how: A hen eats about the same whether she lays five eggs a week or one. As hens age, their feed can cost
        more than their eggs are worth.
    - t: Budget for losses and the vet
      how: Some flocks lose 10 percent or more of their birds to illness or predators. Order an extra chick or two,
        and set aside a little for vet care and repairs.
    sources:
    - name: 'Penn State Extension: Successfully Raising a Small Flock of Laying Chickens'
      url: https://extension.psu.edu/successfully-raising-a-small-flock-of-laying-chickens
    - name: 'Oklahoma State University Extension: Backyard Flock Production'
      url: https://extension.okstate.edu/fact-sheets/backyard-flock-production
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
    - name: 'UF/IFAS Extension AN239: Raising Backyard Chickens for Eggs'
      url: https://ask.ifas.ufl.edu/publication/AN239
    - name: 'University of Georgia Extension C954: Nutrition for the Backyard Flock'
      url: https://fieldreport.caes.uga.edu/publications/C954/nutrition-for-the-backyard-flock/
  - id: end_of_laying
    title: When hens stop laying
    intro: Hens lay best in their first two years and keep laying less each year after that, but they can live 8
      years or more. It helps to decide ahead of time what you will do.
    items:
    - t: Keep them as part of the flock
      how: Many families keep older hens for bug control, companionship, and the occasional egg. Plan for the feed
        and coop space they will keep using.
    - t: Process them for the table
      how: Older hens of dual-purpose breeds can be used for stewing meat or broth. The meat is tougher than a young
        broiler and is best cooked slowly.
    - t: Rehome them
      how: Some owners find new homes for older hens. Pass along health information, and remember the new owner
        will need to quarantine them.
    - t: Plan for natural deaths
      how: Check your local and state rules for disposing of dead birds. If a bird dies suddenly, especially if
        several do, contact your veterinarian or state veterinarian.
    sources:
    - name: 'University of Minnesota Extension: Raising Chickens for Eggs'
      url: https://extension.umn.edu/agriculture/animals-and-livestock/poultry/raising-chickens-for-eggs
    - name: 'Penn State Extension: Successfully Raising a Small Flock of Laying Chickens'
      url: https://extension.psu.edu/successfully-raising-a-small-flock-of-laying-chickens
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
