  sections:
  - id: before_you_start
    title: Before you start
    intro: Chickens are rewarding, but they are animals that need care every single day for years. A little homework
      now saves heartache later.
    items:
    - t: Check your local rules first
      how: Look up your city or county ordinances, zoning, and any HOA rules before you buy a single chick. Many
        places limit how many birds you can keep and how close the coop can be to property lines. Call your local
        zoning or animal control office if the rules are unclear.
    - t: Expect roosters to be off-limits
      how: 'Many towns that allow hens ban roosters because of crowing and noise rules. You do not need a rooster:
        hens lay eggs without one. NC State advises that small flocks (under ten hens) are better off without a
        rooster anyway.'
    - t: Talk with your neighbors
      how: A quick, friendly conversation before the coop goes up helps a lot. Keep the coop clean so odor and flies
        stay down, and a dozen eggs now and then goes a long way.
    - t: Plan for daily care, every day
      how: Someone has to feed, water, let the birds out, close them in at dusk, and collect eggs seven days a week.
        Add weekly coop cleaning and a deeper cleaning once or twice a year.
    - t: Line up vacation help
      how: Before you get birds, find a neighbor, friend, or pet sitter who can do the daily chores when you travel.
        Show them how to close the coop at night, since that is when predators strike.
    - t: Find help for sick birds
      how: CDC suggests finding a veterinarian who treats poultry before you need one. Your county extension office
        is also a good free source of advice.
    sources:
    - name: 'CDC: Backyard Poultry (Healthy Pets, Healthy People)'
      url: https://www.cdc.gov/healthy-pets/about/backyard-poultry.html
    - name: 'UF/IFAS Extension AN239: Raising Backyard Chickens for Eggs'
      url: https://ask.ifas.ufl.edu/publication/AN239
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
    - name: 'University of Minnesota Extension: Raising Chickens for Eggs'
      url: https://extension.umn.edu/agriculture/animals-and-livestock/poultry/raising-chickens-for-eggs
  - id: choosing_birds
    title: Choosing your birds
    intro: 'Decide first what you want most: eggs, meat, or a little of both. That choice points you to the right
      kind of bird.'
    items:
    - t: Egg-laying breeds
      how: Breeds and crosses bred for eggs, such as White Leghorns and sex-link hybrids, lay the most eggs for
        the feed they eat. Brown-egg layers such as Rhode Island Reds and Plymouth Rocks are calm, popular choices
        for families.
    - t: Meat birds
      how: Cornish Cross broilers grow very fast and are ready in about 6 to 8 weeks. They are bred only for meat,
        do not lay well, and do not do well if kept long past processing age.
    - t: Dual-purpose breeds
      how: Breeds like Plymouth Rock, Rhode Island Red, New Hampshire, and Wyandotte lay fairly well, and extra
        males can be raised for meat. They grow more slowly than broilers. Heavier breeds such as these and Orpingtons
        also handle cold winters well.
    - t: Chicks or started pullets
      how: Day-old chicks are the least expensive and the most common choice, but they need a heated brooder and
        about five months before the first egg. Started pullets (young hens near laying age) cost more but skip
        the brooder stage. "Straight-run" chicks are not sorted by sex and are about half males, so order sexed
        female chicks if you only want hens, and consider one or two extra to allow for losses.
    - t: Buy from NPIP hatcheries
      how: CDC and UF/IFAS recommend buying from hatcheries that take part in the USDA National Poultry Improvement
        Plan (NPIP), which works to reduce Salmonella and other diseases in baby poultry. Choose birds that are
        bright, alert, and active, with clean, smooth feathers.
    sources:
    - name: 'Poultry Extension (Univ. of Kentucky): Selecting a Chicken Breed for Small or Backyard Flocks'
      url: https://poultry.extension.org/articles/getting-started-with-small-and-backyard-poultry/selecting-birds-to-get-for-a-small-or-backyard-poultry-flock/selecting-a-chicken-breed-for-small-or-backyard-poultry-flocks/
    - name: 'University of Minnesota Extension: Raising Chickens for Meat'
      url: https://extension.umn.edu/small-scale-poultry/getting-started-broilers
    - name: 'University of Minnesota Extension: Caring for Chickens in Cold Weather'
      url: https://extension.umn.edu/small-scale-poultry/caring-chickens-cold-weather
    - name: 'UNH Extension: Producing Your Own Eggs'
      url: https://extension.unh.edu/resource/producing-your-own-eggs
    - name: 'UF/IFAS Extension AN239: Raising Backyard Chickens for Eggs'
      url: https://ask.ifas.ufl.edu/publication/AN239
