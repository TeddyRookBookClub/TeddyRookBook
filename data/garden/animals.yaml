      url: https://poultry.extension.org/articles/feeds-and-feeding-of-poultry/feeding-chickens-for-egg-production/
    - name: 'CDC: Backyard Poultry (Healthy Pets, Healthy People)'
      url: https://www.cdc.gov/healthy-pets/about/backyard-poultry.html
  - id: coop_and_run
    title: Coop and run
    intro: A good coop keeps birds dry, out of drafts, well ventilated, and safe from predators. Predators cause
      more losses in small flocks than anything else, so build strong from the start.
    items:
    - t: Give enough space
      how: Plan at least 3 square feet per hen inside the coop plus 8 to 10 square feet per hen in an outdoor run.
        If birds will not have a run, plan 8 to 10 square feet each inside. Crowding leads to pecking and dirty
        conditions.
    - t: Nest boxes and roosts
      how: Provide one nest box for about every four hens, roughly 12 inches square, dark, and filled with clean
        shavings or straw. Chickens sleep on roosts, so give each bird about 8 to 10 inches of perch, placed higher
        than the nest boxes and away from them.
    - t: Ventilate without drafts
      how: Chickens give off a lot of moisture and ammonia. Vents near the top of the coop let damp air out while
        keeping wind off the birds where they roost. Damp air in winter is a main cause of frostbite.
    - t: Use hardware cloth, not chicken wire, for safety
      how: 'Chicken wire keeps chickens in but does not keep predators out: raccoons can reach through it and weasels
        can slip through it. Use sturdy welded wire or hardware cloth with openings smaller than 1 inch on windows,
        vents, and the run. The smaller the mesh, the smaller the predators it stops.'
    - t: Stop diggers and climbers
      how: Bury wire about 12 inches deep around the run, or lay a wire apron at least 12 inches out along the ground.
        Cover the top of the run to keep out hawks, owls, raccoons, and climbing cats.
    - t: Lock them in every night
      how: Predators are most active at night. Close and latch the coop at dusk every evening. Chickens learn to
        go in on their own, especially if you feed them there in the evening.
    - t: Bedding and cleaning
      how: Use a few inches of absorbent pine shavings or straw and replace wet spots promptly. CDC recommends cleaning
        equipment outdoors, never in the kitchen or bathroom sink, and wearing gloves when cleaning the coop.
    sources:
