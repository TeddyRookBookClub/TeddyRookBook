    value:
      live_lb_low: 4
      live_lb_high: 6
      dressed_pct_low: 70
      dressed_pct_high: 75
      typical_carcass_lb: 4
    notes: 'UMN: 4 to 6 lb market weight in 6 to 8 weeks; ready-to-cook weight is about 70 to 75 percent of live
      weight. Penn State: about 5.25 lb live at 6 weeks for a target carcass of about 4 lb (75 percent dressing).'
    sources:
    - name: 'University of Minnesota Extension: Raising Chickens for Meat'
