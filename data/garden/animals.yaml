    value:
      lb_feed_per_bird_low: 9
      lb_feed_per_bird_high: 15
      commercial_feed_conversion: about 1.9 lb feed per lb of live weight (commercial research flocks)
    notes: 'Estimates vary with management. UMN: about 8 to 9 lb of feed per bird to 8 weeks for commercial strains.
      Penn State''s pastured-broiler guide budgets about 15 lb per Cornish Cross to harvest (about 16 lb for slower-growing
