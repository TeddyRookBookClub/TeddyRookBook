      - stage: chick starter
        ages: 0 to 6 weeks
        protein_pct: 20 to 22
      - stage: pullet grower
        ages: 6 to about 18-20 weeks
        protein_pct: 14 to 17
      - stage: layer feed
        ages: from first eggs (about 18-20 weeks)
        protein_pct: 16 to 18
        calcium_pct: about 3.5 to 4
