  - id: egg_safety
    title: Egg handling and safety
    intro: Fresh backyard eggs are a treat, but chickens can carry Salmonella even when they look healthy. A few
      simple habits keep your family safe.
    items:
    - t: Collect eggs often
      how: Gather eggs at least once a day, and twice if you can. Eggs left in the nest get dirty, cracked, or eaten.
        Throw away cracked eggs, since germs get in more easily.
    - t: Clean gently, and do not soak
      how: Clean nest boxes keep eggs clean. Brush off dirt with a dry cloth, brush, or fine sandpaper. If you must
        wash eggs, use water warmer than the egg (UF/IFAS says at least 20 F warmer), never soak them, and dry them
        before storing. Cold water can pull germs in through the shell.
    - t: Refrigerate right away
      how: Refrigerate eggs as soon as you can after collecting, at 40 F or below, in a carton on an inside shelf
        rather than the door. Once eggs are cold, keep them cold. Use raw eggs in the shell within about 3 to 5
        weeks.
    - t: Cook eggs thoroughly
      how: Cook eggs until the yolk and white are firm, and cook egg dishes to 160 F. Use pasteurized eggs for recipes
        that call for raw or lightly cooked eggs.
    - t: Wash hands every time
      how: Wash hands with soap and running water after touching chickens, eggs, feed, or anything in the coop.
        Keep hand sanitizer by the coop for when soap is not handy, and supervise children's handwashing.
    - t: Keep birds outside
      how: Do not let chickens in the house, especially where food is made, served, or stored. Keep a pair of shoes
        just for chore time and leave them outside. Do not kiss or snuggle birds and then touch your face.
    - t: Protect young children
      how: CDC advises that children younger than 5 should not handle or touch chicks or other poultry, because
        they are more likely to get seriously sick. Always supervise older children around chickens and while they
        wash up afterward.
    sources:
    - name: 'CDC: Backyard Poultry (Healthy Pets, Healthy People)'
      url: https://www.cdc.gov/healthy-pets/about/backyard-poultry.html
    - name: 'USDA FSIS: Shell Eggs from Farm to Table'
      url: https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/eggs/shell-eggs-farm-table
