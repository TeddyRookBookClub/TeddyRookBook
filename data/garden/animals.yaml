  - id: water_per_hen
    label: Water per hen per day
    value:
      gallons_per_25_hens: 1
      approx_cups_per_hen: 0.6
      unit: per day in mild weather
    notes: 'UF/IFAS: 25 hens can drink about a gallon a day, which is about 5 ounces (a little over half a cup)
      per hen. UGA: birds drink about twice as much as they eat by weight. Hens drink about 25 percent more above
      80 F (UNH), and a single day without water cuts laying for several days. Keep clean water available at all
