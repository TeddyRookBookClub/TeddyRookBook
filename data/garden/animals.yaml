  - id: nest_boxes
    label: Nest boxes
    value:
      hens_per_box: 4
      range: 1 box per 4 to 5 hens
      box_size_inches: about 12 x 12 to 12 x 14
    notes: One nest box for every four hens is the most common figure (Oregon State, UNH, Oklahoma State); NC State
