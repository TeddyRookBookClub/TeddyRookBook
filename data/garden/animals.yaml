      extraction_equipment: extra; Oklahoma State example small-scale harvest setup totaled about $1,079
    notes: Prices are from NC State and Oklahoma State (published 2021) and will have changed. Oklahoma State's
      figures do not include honey-harvest equipment. NC State suggests starting with two hives so you can compare
      them and borrow resources between them.
    sources:
    - name: 'NC State Extension: How to Become a Beekeeper in North Carolina'
      url: https://content.ces.ncsu.edu/how-to-become-a-beekeeper-in-north-carolina
    - name: 'Oklahoma State University Extension: Beginning Honey Beekeeping Equipment and Associated Costs (2021)'
      url: https://extension.okstate.edu/fact-sheets/beginning-honey-beekeeping-equipment-and-associated-costs
    - name: 'Oklahoma State University Extension: Beekeeping - Honey Harvest Methods, Costs and Breakeven'
      url: https://extension.okstate.edu/fact-sheets/beekeeping-honey-harvest-methods-costs-and-breakeven-calculations
  - id: varroa_thresholds
    label: Varroa mite action levels (mites per 100 bees)
    value:
      sample: about 300 bees (1/2 cup) per alcohol or soap wash or sugar roll
      thresholds:
      - phase: dormant (winter)
        act_above_pct: 1
      - phase: population increase (spring)
        act_above_pct: 2 to 3
      - phase: peak population (summer)
        act_above_pct: 3
      - phase: population decrease (late summer/fall)
        act_above_pct: 2 to 3
      monitor_times_per_year_min: 4
    notes: Honey Bee Health Coalition guide. Divide the mite count by 3 for a 300-bee sample to get mites per 100
      bees. UMN Bee Lab suggests monthly checks and keeping levels below about 1 percent when you can.
    sources:
    - name: 'Honey Bee Health Coalition: Tools for Varroa Management guide (8th ed. PDF; 9th ed. now current)'
      url: https://honeybeehealthcoalition.org/wp-content/uploads/2022/08/HBHC-Guide_Varroa-Mgmt_8thEd-082422.pdf
    - name: 'University of Minnesota Bee Lab: Varroa Mite Testing and Management'
      url: https://beelab.umn.edu/node/786
  - id: syrup_ratios
    label: Sugar syrup ratios
    value:
      spring_or_stimulative: 1 part sugar to 1 part water
      fall_or_winter_stores: 2 parts sugar to 1 part water
      sugar_type: white granulated sugar
    notes: 'UGA Bee Program and UF/IFAS. Feed syrup only when bees need it. University of Illinois: bees can take
      syrup until it falls below about 50 F.'
    sources:
    - name: 'University of Georgia Bee Program: Honey Bee Management'
      url: https://bees.caes.uga.edu/beekeeping-resources/getting-started-topics/getting-started-honey-bee-management.html
    - name: 'UF/IFAS Extension IN1006: Overwintering Honey Bee Colonies in Northern Climates'
      url: https://ask.ifas.ufl.edu/publication/in1006
    - name: 'University of Illinois Extension: Prepare Your Bees for Winter'
      url: https://extension.illinois.edu/blogs/know-how-know-more/2021-11-11-prepare-your-bees-winter
    - name: 'Oklahoma State University Extension: Beginning Honey Beekeeping Equipment and Associated Costs (2021)'
      url: https://extension.okstate.edu/fact-sheets/beginning-honey-beekeeping-equipment-and-associated-costs
  sections:
  - id: before_you_start
    title: Before you start
    intro: Honeybees are fascinating and fairly low-maintenance compared with many animals, but they still need
      regular care and good neighbor relations.
    items:
    - t: Check local rules
      how: Look up city, county, and HOA rules before you buy bees. Some places limit the number of hives or require
        them to sit a certain distance from property lines.
    - t: Register if your state requires it
      how: Many states ask or require beekeepers to register their hives with the state department of agriculture
        or apiary inspector, including Pennsylvania and North Carolina. Some states also regulate honey-extracting
        rooms. Your state apiarist or extension office can tell you what applies.
    - t: Talk with your neighbors
      how: Explain your plans before the hives arrive. Many "bee stings" people report are really from wasps, and
        a friendly talk heads off worry. Oregon State also notes that not every homeowner's insurance policy covers
        beekeeping, so check yours.
    - t: Think about allergies
      how: A little pain and swelling where you were stung is normal. A small share of people have serious allergic
        reactions that need emergency care. If you or someone in your household has had a severe reaction to a sting,
        talk with a doctor before keeping bees.
    - t: Plan your time
      how: Expect regular hive checks from spring through fall, about every two weeks during swarm season, plus
        mite checks, feeding when needed, and harvest. Two hives take only a little more time than one.
    sources:
    - name: 'Penn State Extension: Beekeeping - Honey Bees'
      url: https://extension.psu.edu/beekeeping-honey-bees
    - name: 'NC State Extension: How to Become a Beekeeper in North Carolina'
      url: https://content.ces.ncsu.edu/how-to-become-a-beekeeper-in-north-carolina
    - name: 'Oregon State University Extension EM 9186: Residential Beekeeping Best-Practice Guidelines'
      url: https://extension.oregonstate.edu/catalog/em-9186-residential-beekeeping-best-practice-guidelines-nuisance-free-beekeeping-oregon
    - name: 'Penn State Extension: Honey Bee Management Throughout the Seasons'
      url: https://extension.psu.edu/honey-bee-management-throughout-the-seasons
  - id: learning
    title: Learning the craft
    intro: Beekeeping is easiest to learn from people who keep bees near you, because the timing of the season depends
      on your local climate and flowers.
    items:
    - t: Take a beginner class
      how: Extension offices and beekeeping clubs often run beginner courses, usually in winter before bees arrive
        in spring. Some universities offer online courses too.
    - t: Join a local club
      how: Local and state beekeeping associations are the best place to find advice tuned to your area, plus mentors
        and friendly help. In North Carolina alone, NC State counts more than 80 county chapters.
    - t: Find a mentor
      how: An experienced beekeeper who will open a hive with you is worth more than any book. Clubs can often pair
        you with one.
    - t: Read a good beginner book
      how: Choose one that covers honey bee biology and seasonal management. Be choosy with online videos and check
        what you learn against extension advice.
    sources:
    - name: 'University of Missouri Extension G7600: Beekeeping Tips for Beginners'
      url: https://extension.missouri.edu/publications/g7600
    - name: 'NC State Extension: How to Become a Beekeeper in North Carolina'
      url: https://content.ces.ncsu.edu/how-to-become-a-beekeeper-in-north-carolina
    - name: 'Penn State Extension: Beekeeping - Honey Bees'
      url: https://extension.psu.edu/beekeeping-honey-bees
  - id: getting_bees
    title: Getting bees
    intro: There are three common ways to start a colony. Order early, well before spring.
    items:
    - t: Packages
      how: A package is about 3 pounds of worker bees plus a queen in a screened box. Packages are usually the least
        expensive purchased option and unlikely to carry brood disease, but the colony starts from scratch, needs
        feeding, and rarely makes a honey crop the first year.
    - t: Nucs
      how: A nuc (nucleus colony) is a small working colony, usually five frames of bees, brood, food, and a laying
        queen. It costs more but builds up faster, lets you see the queen's laying pattern, and is less likely to
        fail.
    - t: Swarms
      how: Swarms are free, usually caught in spring, and fun to collect, but you cannot judge the queen ahead of
        time and supply is unpredictable. Ask your club to help with your first one.
    - t: Order and set up early
      how: Missouri suggests ordering bees in November or December for spring delivery and having hives assembled
        and in place about a month before bees arrive. That gives you time to learn the parts before the bees show
        up.
    sources:
    - name: 'Penn State Extension: Beekeeping - Honey Bees'
      url: https://extension.psu.edu/beekeeping-honey-bees
    - name: 'NC State Extension: How to Become a Beekeeper in North Carolina'
      url: https://content.ces.ncsu.edu/how-to-become-a-beekeeper-in-north-carolina
    - name: 'University of Missouri Extension G7600: Beekeeping Tips for Beginners'
      url: https://extension.missouri.edu/publications/g7600
  - id: equipment
    title: Equipment and protective gear
    intro: Most beginners in the U.S. use Langstroth hives, the stackable wooden boxes with removable frames. Standard
      sizes make it easy to buy parts and get help.
    items:
    - t: The hive
      how: A basic hive has a bottom board, one or two deep boxes for the brood nest, frames with foundation, an
        inner cover, and a telescoping outer cover. Medium "honey supers" go on top when the colony is strong and
        nectar is flowing. An entrance reducer helps in cold weather and against robbing.
    - t: Tools
      how: You will need a smoker, a hive tool for prying frames apart, a bee brush, and a feeder. Supplies for
        mite checks are also essential.
    - t: Protective gear
      how: At minimum, wear a veil. Many beginners also like gloves and a jacket or full suit. Light colors are
        better than dark ones.
    - t: Paint and stand
      how: Paint the outside of the boxes with a light-colored exterior paint. Set the hive on a sturdy stand about
        18 inches up, and strap it down in windy areas.
    - t: Harvest equipment can wait
      how: Extracting equipment is a separate, larger cost. New colonies often make little or no extra honey the
        first year, so you can usually put off buying it.
    sources:
    - name: 'University of Missouri Extension G7600: Beekeeping Tips for Beginners'
      url: https://extension.missouri.edu/publications/g7600
    - name: 'Oklahoma State University Extension: Beginning Honey Beekeeping Equipment and Associated Costs (2021)'
      url: https://extension.okstate.edu/fact-sheets/beginning-honey-beekeeping-equipment-and-associated-costs
    - name: 'NC State Extension: How to Become a Beekeeper in North Carolina'
      url: https://content.ces.ncsu.edu/how-to-become-a-beekeeper-in-north-carolina
  - id: placement
    title: Where to put your hives
    intro: A good spot keeps the bees healthy and keeps them out of the way of people and pets.
    items:
    - t: Morning sun, some shelter
      how: Face the entrance east or south so the morning sun gets bees flying early. A windbreak on the north side
        helps in winter, and light afternoon shade in summer is welcome.
    - t: Provide water
      how: Bees need water every day. Set up a shallow water source with floats, stones, or sticks to land on before
        the bees start visiting your neighbor's pool or birdbath, and keep it from running dry.
    - t: Steer the flight path
      how: A solid fence or hedge about 6 feet tall near the hive makes bees fly up and over people. Keep hives
        away from sidewalks, play areas, doors, and spots where people or pets pass often.
    - t: Keep it level and dry
      how: Set hives on a stand off the ground, level side to side with a slight forward tilt so rain drains out.
        Make sure you can reach the hive easily with equipment.
    sources:
    - name: 'University of Missouri Extension G7600: Beekeeping Tips for Beginners'
      url: https://extension.missouri.edu/publications/g7600
    - name: 'Oregon State University Extension EM 9186: Residential Beekeeping Best-Practice Guidelines'
      url: https://extension.oregonstate.edu/catalog/em-9186-residential-beekeeping-best-practice-guidelines-nuisance-free-beekeeping-oregon
  - id: beekeeping_year
    title: The beekeeping year
    intro: Timing shifts by several weeks from south to north, so learn your local calendar from a nearby club or
      extension office. This is the general pattern.
    items:
    - t: Late winter and early spring
      how: Bees start raising brood again. On mild days, check that colonies are alive and have food. Feed syrup
        or pollen substitute if stores are low. Install new packages or nucs in spring.
    - t: Late spring and early summer
      how: Colonies grow fast and this is swarm season. Inspect about every two weeks, add honey supers before the
        main nectar flow, and consider splitting strong colonies.
    - t: Summer
      how: Harvest honey when supers are full and capped. Begin regular varroa mite checks.
    - t: Late summer and fall
      how: Nectar runs short and bees may rob weaker hives, so reduce entrances and keep inspections short. Check
        and treat mites to protect the bees that will carry the colony through winter. Make sure each hive has enough
        honey, feeding heavy syrup if needed, and combine weak colonies.
    - t: Winter
      how: Leave the cluster alone except for quick checks of food on mild days. Keep entrances clear, use a mouse
        guard, and make sure moist air can escape from the top of the hive.
    sources:
    - name: 'Penn State Extension: Honey Bee Management Throughout the Seasons'
      url: https://extension.psu.edu/honey-bee-management-throughout-the-seasons
    - name: 'University of Georgia Bee Program: Honey Bee Management'
      url: https://bees.caes.uga.edu/beekeeping-resources/getting-started-topics/getting-started-honey-bee-management.html
    - name: 'UF/IFAS Extension IN1006: Overwintering Honey Bee Colonies in Northern Climates'
      url: https://ask.ifas.ufl.edu/publication/in1006
  - id: varroa
    title: Varroa mites
    intro: The University of Minnesota Bee Lab calls varroa mites a primary cause of honeybee colony deaths in the
      U.S. Checking and managing mites is a core part of beekeeping, not an optional extra.
    items:
    - t: Why they matter
      how: Varroa mites feed on developing and adult bees and spread viruses. Colonies with unchecked mite levels
        often die in fall or winter, and mites spread to neighboring hives through drifting and robbing bees.
    - t: Count your mites
      how: Take about 300 bees (1/2 cup) from a brood frame and do an alcohol or soapy-water wash, the most reliable
        method, or a powdered sugar roll, which lets most bees survive but works poorly in humid weather or during
        a nectar flow. Divide the mites counted by 3 to get mites per 100 bees.
    - t: Check regularly
      how: Check at least four times a year, starting in spring, and monthly if you can. Check more often in late
        summer and fall, and always recheck after a treatment to make sure it worked.
    - t: Act at the right levels
      how: The Honey Bee Health Coalition advises prompt control above about 2 to 3 mites per 100 bees in spring
        and late summer, 3 in summer, and 1 in winter. Below about 2, you can usually keep watching instead of treating
        right away.
    - t: Use integrated pest management
      how: Combine good practices, such as mite-tolerant stock, brood breaks, and drone brood removal, with registered
        treatments when needed. Follow the label exactly, since using a product any other way is against federal
        and state law, and rotate treatment types to slow resistance. The Honey Bee Health Coalition's free guide
        and your extension office can help you choose.
    sources:
    - name: 'University of Minnesota Bee Lab: Varroa Mite Testing and Management'
      url: https://beelab.umn.edu/node/786
    - name: 'Honey Bee Health Coalition: Tools for Varroa Management guide (8th ed. PDF; 9th ed. now current)'
      url: https://honeybeehealthcoalition.org/wp-content/uploads/2022/08/HBHC-Guide_Varroa-Mgmt_8thEd-082422.pdf
    - name: 'Honey Bee Health Coalition: Varroa Management resources'
      url: https://honeybeehealthcoalition.org/resources/varroa-management/
  - id: swarming
    title: Swarming basics
    intro: 'Swarming is how honeybee colonies reproduce: the old queen leaves with a large part of the colony to
      find a new home. Penn State notes the colony can shrink by half or more, which sharply cuts its strength and
      honey crop, and swarms can worry neighbors.'
    items:
    - t: Know the season
      how: Swarming happens mostly in spring and early summer, when colonies grow fast and get crowded. Queen cells
        along the bottom edges of frames are a sign a swarm is coming soon.
    - t: Give them room early
      how: Add honey supers before the main nectar flow and before the top box is about two-thirds full. A crowded
        brood nest is a main trigger.
    - t: Split strong colonies
      how: Dividing a strong colony into two in spring relieves crowding and gives you an extra colony. Penn State
        calls a split the most effective step once a colony has started raising queens.
    - t: If a swarm leaves
      how: Swarms are usually very docile. Keep people back and call a local beekeeping club for help collecting
        it, especially the first time.
    sources:
    - name: 'Penn State Extension: Honey Bee Management Throughout the Seasons'
      url: https://extension.psu.edu/honey-bee-management-throughout-the-seasons
    - name: 'Oregon State University Extension EM 9186: Residential Beekeeping Best-Practice Guidelines'
      url: https://extension.oregonstate.edu/catalog/em-9186-residential-beekeeping-best-practice-guidelines-nuisance-free-beekeeping-oregon
    - name: 'University of Georgia Bee Program: Honey Bee Management'
      url: https://bees.caes.uga.edu/beekeeping-resources/getting-started-topics/getting-started-honey-bee-management.html
  - id: feeding
    title: Feeding your bees
    intro: 'Bees do best on their own honey and pollen. Feed only when they need it: new colonies, spring shortages,
      or light hives in fall.'
    items:
    - t: 'Spring: 1:1 syrup'
      how: Mix 1 part white granulated sugar to 1 part water by volume to help new colonies build comb or tide over
        colonies that run low in spring. Stop once natural nectar is flowing well.
    - t: 'Fall: 2:1 syrup'
      how: Mix 2 parts sugar to 1 part water for light colonies in fall. The thicker syrup is easier for bees to
        store as winter food.
    - t: Use plain white sugar
      how: Use white granulated sugar. Bees can take syrup until temperatures fall below about 50 F. In the cold
        of winter, beekeepers use fondant or hard sugar instead of liquid syrup.
    sources:
    - name: 'University of Georgia Bee Program: Honey Bee Management'
      url: https://bees.caes.uga.edu/beekeeping-resources/getting-started-topics/getting-started-honey-bee-management.html
    - name: 'UF/IFAS Extension IN1006: Overwintering Honey Bee Colonies in Northern Climates'
      url: https://ask.ifas.ufl.edu/publication/in1006
    - name: 'University of Illinois Extension: Prepare Your Bees for Winter'
      url: https://extension.illinois.edu/blogs/know-how-know-more/2021-11-11-prepare-your-bees-winter
    - name: 'Oklahoma State University Extension: Beginning Honey Beekeeping Equipment and Associated Costs (2021)'
      url: https://extension.okstate.edu/fact-sheets/beginning-honey-beekeeping-equipment-and-associated-costs
    - name: 'Penn State Extension: Honey Bee Management Throughout the Seasons'
      url: https://extension.psu.edu/honey-bee-management-throughout-the-seasons
  - id: harvesting
    title: Harvesting and storing honey
    intro: Harvest only true surplus. The bees' own winter food always comes first.
    items:
    - t: Leave enough for winter
      how: In cold northern areas, a colony may need about 90 pounds of honey to get through winter, about one full
        deep box or two full medium supers; in Missouri, at least 40 to 80 pounds per brood box; in Georgia, the
        whole hive should weigh at least 100 pounds in late fall. Ask local beekeepers what works in your area.
    - t: Take capped honey
      how: Harvest frames that are at least 80 percent capped with wax. If nectar drips when you gently shake a
        frame, it is not ready, so leave it in the hive. Uncured honey has too much water and can ferment.
    - t: Clear the bees gently
      how: Use a little smoke and brush or shake bees off the frames, or use a bee escape board the day before to
        clear bees from the supers. Work calmly and keep the lids off only as long as needed.
    - t: Extract and strain
      how: Slice off the wax cappings, spin the frames in an extractor, and strain the honey through a fine strainer
        to remove wax. Let it settle so air bubbles rise, then bottle it in clean, dry, airtight jars.
    - t: Store it dry
      how: Keep honey tightly sealed in a dry place; it does not need refrigeration and only ferments if it takes
        on extra water. Honey that crystallizes has not spoiled. Set the jar in warm-to-the-touch water to soften
        it, and do not overheat it.
    sources:
    - name: 'UF/IFAS Extension IN1006: Overwintering Honey Bee Colonies in Northern Climates'
      url: https://ask.ifas.ufl.edu/publication/in1006
    - name: 'University of Illinois Extension: Prepare Your Bees for Winter'
      url: https://extension.illinois.edu/blogs/know-how-know-more/2021-11-11-prepare-your-bees-winter
    - name: 'University of Missouri Extension G7600: Beekeeping Tips for Beginners'
      url: https://extension.missouri.edu/publications/g7600
    - name: 'University of Georgia Bee Program: Honey Bee Management'
      url: https://bees.caes.uga.edu/beekeeping-resources/getting-started-topics/getting-started-honey-bee-management.html
    - name: 'Oklahoma State University Extension: Beekeeping - Honey Harvest Methods, Costs and Breakeven'
      url: https://extension.okstate.edu/fact-sheets/beekeeping-honey-harvest-methods-costs-and-breakeven-calculations
    - name: 'UF/IFAS Extension AA154: Honey and Its Uses'
      url: https://ask.ifas.ufl.edu/publication/AA154
  - id: honey_safety_and_selling
    title: Honey safety and selling
    intro: Honey is a wonderful food for most of the family, with one important exception.
    items:
    - t: No honey for babies under 12 months
      how: 'CDC: honey can cause infant botulism, a serious illness, in children younger than 12 months. Do not
        give babies honey, and do not add it to their food, water, formula, or pacifier. This includes your own
        raw honey.'
    - t: 'Selling honey: check your state''s rules'
      how: Rules for selling honey vary by state. Oklahoma, for example, lets small producers sell raw honey with
        a specific label, while Pennsylvania requires honey-extracting rooms to be registered, even a home kitchen.
        Check with your state department of agriculture or extension office before selling.
    - t: Label clearly
      how: In Oklahoma, small-producer honey labels must show the product name, net weight, the beekeeper's name,
        phone number, and address, and a statement that it was packed in an uninspected facility. Other states have
        their own label rules.
    sources:
    - name: 'CDC: Foods and Drinks to Avoid or Limit (infants and toddlers)'
      url: https://www.cdc.gov/infant-toddler-nutrition/foods-and-drinks/foods-and-drinks-to-avoid-or-limit.html
    - name: 'Oklahoma State University Extension: Beekeeping - Honey Harvest Methods, Costs and Breakeven'
      url: https://extension.okstate.edu/fact-sheets/beekeeping-honey-harvest-methods-costs-and-breakeven-calculations
    - name: 'Penn State Extension: Beekeeping - Honey Bees'
      url: https://extension.psu.edu/beekeeping-honey-bees
  supporting_pollinators:
    id: supporting_pollinators
    title: Not ready for bees? Help pollinators instead
    intro: You do not need a hive to help bees. More than 3,600 kinds of bees live in the U.S., and most are native
      bees that need flowers, nesting spots, and fewer pesticides. Many of them nest in the ground.
    items:
    - t: Plant native flowers
      how: Native plants offer plenty of nectar and pollen and are usually easy to care for. Plant them in clumps
        so pollinators can find them.
    - t: Keep something blooming all season
      how: Aim for at least three kinds of plants flowering in each of spring, summer, and fall. Herbs such as oregano,
        basil, and borage, and vegetables allowed to flower, help too.
    - t: Leave places to nest
      how: About 70 percent of U.S. bees nest in the ground. Leave a few sunny patches of bare, undisturbed soil,
        and leave some plant stems and leaves standing over winter for insects that shelter in them.
    - t: Use fewer pesticides
      how: Not every pest problem needs a spray. Healthy plants, early scouting, and row covers prevent many problems.
        If you do use a pesticide, read the label's bee and environmental warnings, never spray plants in bloom,
        and spray when pollinators are not active.
    - t: Offer shallow water
      how: A shallow dish with stones or other good landing spots gives bees a safe place to drink. Butterflies
        also use damp soil or mud for minerals.
    - t: Mix flowers into the lawn
      how: Lawns offer little food for pollinators. Letting clover, self-heal, or early dandelions bloom, or raising
        the mower to about 4 inches, adds food for bees.
    sources:
    - name: 'USDA People''s Garden: The Importance of Pollinators'
      url: https://www.usda.gov/about-usda/general-information/initiatives-and-highlighted-programs/peoples-garden/importance-pollinators
    - name: 'University of Illinois Extension: 6 Ways to Support Native Pollinators'
      url: https://extension.illinois.edu/blogs/ilriverhort/2024-03-05-6-ways-support-native-pollinators-illinois-and-beyond
    - name: 'University of Illinois Extension: Protecting Pollinators from Pesticides'
      url: https://extension.illinois.edu/blogs/pesticide-news/2025-04-04-protecting-pollinators-pesticides
