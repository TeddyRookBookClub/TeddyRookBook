  - id: slow_growing_meat
    label: 'Slower-growing and dual-purpose meat birds: timing'
    value:
      slow_growing_broilers_weeks: about 8 to 12 (Freedom Ranger type; some guides say up to 15)
      dual_purpose_weeks: 10 to 12 or longer
    notes: 'Penn State: slower-growing broilers (such as Freedom Rangers) take 2 to 3 weeks longer than Cornish
