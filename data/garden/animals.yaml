  - id: brooding_temperature
    label: Brooder temperature for chicks
    value:
      week_1_f_low: 90
      week_1_f_high: 95
      drop_per_week_f: 5
      end_f: about 65 to 70
      unit: degrees F at chick level
    notes: '90 to 95 F at chick level the first week, then about 5 F lower each week until chicks are feathered
      (about 4 to 6 weeks) or the brooder matches room temperature of about 65 to 70 F. Watch the chicks: huddling
      means too cold, crowding away from the heat means too hot.'
    sources:
