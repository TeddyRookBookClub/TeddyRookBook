# Teddy Rook Book: Food Production Planner - backyard chickens (eggs, meat) and honeybees (honey)
# Structure:
#   chickens.numbers[] / bees.numbers[] -> {id, label, value, notes, sources[{name, url}]}
#   chickens.sections[] / bees.sections[] -> {id, title, intro, items[{t, how}], sources[{name, url}]}
#   bees.supporting_pollinators -> same shape as a section
# Researched October 2026; see animal_sources.md for what each source supports and what was left out.
meta:
  page: 'Food Production Planner: Backyard Chickens and Honeybees'
  site: Teddy Rook Book
  spelling: American
  researched: 2026-10
  evidence_rule: Only well-established advice from university extension services, USDA (FSIS, APHIS), CDC, and the
    Honey Bee Health Coalition is included. Numbers are typical ranges from those sources; where sources disagree,
    the range or the more cautious figure is given. Local extension advice wins when it differs.
  disclaimer: Rules for keeping animals, and for selling eggs, meat, and honey, vary by city and state. Check local
    ordinances and your state department of agriculture before you start. Your county extension office is a free
    source of help.
chickens:
  numbers:
  - id: eggs_per_hen_year
    label: Eggs per hen per year (backyard flock)
    value:
      typical_low: 200
      typical_high: 240
      unit: eggs per hen per year
    notes: 'UF/IFAS gives 200 to 240 eggs (17 to 20 dozen) per hen per year for a small backyard flock, with some
      breeds laying up to about 300 and others as few as 150. NC State is more cautious for a hen''s first laying
      year: about two eggs every three days, up to about 15 dozen (180). Plan on the lower end for a home flock.'
    sources:
    - name: 'UF/IFAS Extension AN239: Raising Backyard Chickens for Eggs'
      url: https://ask.ifas.ufl.edu/publication/AN239
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
  - id: eggs_by_breed
    label: Approximate eggs per year by breed
    value:
      unit: eggs per hen per year
      breeds:
      - breed: White Leghorn
        low: 250
        high: 300
      - breed: Rhode Island Red
        low: 250
        high: 280
      - breed: Barred Rock
        low: 200
        high: 280
      - breed: Black Australorp
        low: 200
        high: 280
      - breed: Buff Orpington
        low: 200
        high: 280
      - breed: Ameraucana / Easter Egger
        low: 180
        high: 200
      - breed: Standard Cochin
        low: 100
        high: 160
    notes: Figures from UNH Extension. Strains vary a lot. Penn State notes commercial sex-link hybrids lay about
      240 to 280 eggs a year, while some heritage strains lay far fewer (Penn State cites 50 to 100) with great
      variability.
    sources:
    - name: 'UNH Extension: Producing Your Own Eggs'
      url: https://extension.unh.edu/resource/producing-your-own-eggs
    - name: 'Penn State Extension: Successfully Raising a Small Flock of Laying Chickens'
      url: https://extension.psu.edu/successfully-raising-a-small-flock-of-laying-chickens
  - id: laying_start_age
    label: Age hens start laying
    value:
      low: 16
      high: 24
      unit: weeks
    notes: 'NC State: pullets begin to lay at 16 to 24 weeks depending on breed and conditions; UF/IFAS PS029: about
      18 to 22 weeks. Chicks bought in spring usually start laying in mid to late summer (UNH).'
    sources:
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
    - name: 'UF/IFAS Extension PS029: Factors Affecting Egg Production in Backyard Chicken Flocks'
      url: https://ask.ifas.ufl.edu/publication/PS029
    - name: 'UNH Extension: Producing Your Own Eggs'
      url: https://extension.unh.edu/resource/producing-your-own-eggs
  - id: laying_by_age
    label: How laying changes with age
    value:
      year_1_dozen_max: 15
      year_2_dozen_max: 12
      trend: declines each year after
    notes: 'NC State: up to about 15 dozen in the first laying year, up to about 12 dozen in year two, then fewer
      each year. UF/IFAS: a flock peaks about 6 to 8 weeks after laying starts, falls to about 65 percent of hens
      laying on a given day after 12 months, and many hens decline significantly after two or three years. Hens
      can live 8 years or more (Penn State).'
    sources:
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
    - name: 'UF/IFAS Extension PS029: Factors Affecting Egg Production in Backyard Chicken Flocks'
      url: https://ask.ifas.ufl.edu/publication/PS029
    - name: 'Penn State Extension: Successfully Raising a Small Flock of Laying Chickens'
      url: https://extension.psu.edu/successfully-raising-a-small-flock-of-laying-chickens
  - id: daylight_for_laying
    label: Daylight needed for steady laying
    value:
      hours_per_day: 14
      range_low: 14
      range_high: 16
      unit: hours of light per day
    notes: Hens need about 14 hours of light a day to keep laying. Shortening fall days slow or stop laying and
      often trigger a molt, a rest of roughly 6 to 8 weeks or more while hens regrow feathers. Added light can keep
      hens laying, but NC State notes it is fine to let them rest in winter. If you add light, Penn State advises
      not more than 16 hours.
    sources:
    - name: 'Poultry Extension: How Many Eggs Can a Hen Lay in One Day?'
      url: https://poultry.extension.org/articles/poultry-related-youth-programs/how-many-eggs-can-a-chicken-lay-in-one-day/
    - name: 'UF/IFAS Extension PS029: Factors Affecting Egg Production in Backyard Chicken Flocks'
      url: https://ask.ifas.ufl.edu/publication/PS029
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
      url: https://content.ces.ncsu.edu/keeping-garden-chickens-in-north-carolina
    - name: 'Penn State Extension: Successfully Raising a Small Flock of Laying Chickens'
      url: https://extension.psu.edu/successfully-raising-a-small-flock-of-laying-chickens
    - name: 'UNH Extension: Producing Your Own Eggs'
      url: https://extension.unh.edu/resource/producing-your-own-eggs
  - id: feed_per_hen
    label: Feed per laying hen
    value:
      lb_per_day_low: 0.25
      lb_per_day_high: 0.33
      lb_per_year_low: 90
      lb_per_year_high: 120
      unit: pounds of complete layer feed
    notes: 'Oklahoma State: about 0.25 lb a day. NC State: about 1/3 lb a day while laying, or about 5 lb of feed
      per dozen eggs. UNH: about 90 to 100 lb per hen over a laying cycle of about 13 months; a 50-lb bag lasts
      10 hens about two to three weeks. The yearly range here is 0.25 to 0.33 lb times 365 days. Hens eat more in
      cold weather (up to 25 percent more, per UMN) and less in heat.'
    sources:
    - name: 'Oklahoma State University Extension: Backyard Flock Production'
      url: https://extension.okstate.edu/fact-sheets/backyard-flock-production
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
