  - id: feeding_and_water
    title: Feeding and water
    intro: A bagged, complete feed matched to the bird's age does nearly all the work. Treats and scraps are extras,
      not the main meal.
    items:
    - t: Feed a complete layer ration
      how: Once hens start laying, at around 18 to 20 weeks, switch to a layer feed with about 16 to 18 percent
        protein. Each hen eats roughly 1/4 to 1/3 pound a day. Store feed in a dry, rodent-proof container and use
        it within a few weeks so it stays fresh.
    - t: Offer calcium if shells are thin
      how: Layer feed already contains extra calcium. If you see thin or easily cracked shells, or as hens get older,
        offer crushed oyster shell in a separate dish so hens can take what they need. Do not feed layer feed to
        young growing birds.
    - t: Provide grit
      how: Chickens grind food in their gizzards with small stones. If they eat anything besides complete feed,
        such as scraps, grain, or forage, offer poultry grit free-choice. Oyster shell is not a substitute for grit.
    - t: Keep treats small
      how: Scraps and scratch grains should be no more than about 10 percent of the diet, or only what the flock
        finishes in about 20 minutes. Too many treats unbalance the diet. Avoid feeding extra cracked corn.
    - t: Water, always
      how: Hens need clean water at all times, and more in hot weather. A day without water can stop laying for
        several days. In freezing weather, use a heated waterer or bring out fresh water morning and afternoon.
    sources:
    - name: 'Poultry Extension (Univ. of Kentucky): Feeding Chickens for Egg Production'
      url: https://poultry.extension.org/articles/feeds-and-feeding-of-poultry/feeding-chickens-for-egg-production/
