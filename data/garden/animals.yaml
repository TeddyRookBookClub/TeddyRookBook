    value:
      adult_inches_per_bird: 3
      chick_inches_start: 1
      chick_inches_after_2_weeks: 2
    notes: 'NC State and Penn State: about 3 linear inches of feeder per adult bird; chicks 1 inch at first, 2 inches
      after two weeks.'
    sources:
    - name: 'NC State Extension: Keeping Garden Chickens in North Carolina'
