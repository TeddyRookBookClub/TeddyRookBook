    - The book says Oliver Goldsmith was born in Ireland, studied at Trinity College in Dublin, at Edinburgh and at Leyden, wandered through Europe in poverty, and settled in London, where he knew Dr. Johnson and Sir Joshua Reynolds. He wrote "The Deserted Village," "She Stoops to Conquer" and "The Vicar of Wakefield." He died heavily in debt, and his monument is in Westminster Abbey.
  - - Words and meanings
    - 'An elegy is a poem mourning someone who has died. Read the definitions after the poem:

      ~ Accord, agreement of opinion, consent.

      ~ Pledge, personal property delivered to another as a security for a debt.

      ~ Mortal, destructive to life.'
  - - Read aloud
    - 'Read it in a mock-solemn voice, as if very sad, so the jokes come through.

      ~ Good people all, with one accord,

      ~ Lament for Madam Blaize,'
  - - Find the jokes
    - 'Read this stanza ending together:

      ~ She never slumbered in her pew —

      ~ But when she shut her eyes.

      Say: Is that really praise? What is the joke?

      Go through the other stanzas and find the twist in each one.'
  - - Talk about it
    - 'Say: What kind of person was Madam Blaize really?

      Say: Why is it funnier to pretend to praise her than to criticize her openly?'
  - - Memorize
    - 'Learn the first stanza, which begins:

      ~ Good people all, with one accord,'
  - - Write (optional)
    - Write a two-line "praise" of something that is really a joke, the way Goldsmith does.
