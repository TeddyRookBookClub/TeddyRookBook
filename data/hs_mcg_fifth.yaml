  unit: 7
  title: Control your Temper (John Todd)
  mins: 30
  goal: Your child explains, in their own words, how Roger Sherman learned to govern his temper, and copies the lesson's opening sentence.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'An essay by John Todd: no temper is too good to need training or too bad to improve. The example is Roger Sherman, who stayed calm when a student flashed sunlight in his face and when his mother struck his child during family prayers. A note about Sherman follows.'
  steps:
  - - Words and meanings
    - 'The words and meanings are printed at the end of the lesson. Read a few together before the reading, so they don''t trip your child up:

      ~ Control, subdue, restrain, govern.

      ~ Disciplined, brought under control, trained.

      ~ Reprimanded, reproved for a fault.

      ~ Achieved, gained.

      Your child reads each meaning aloud, then uses the word in a sentence of their own.'
  - - About the author
    - 'The book says John Todd, D.D. (b. 1800, d. 1873), was born in Rutland, Vermont, became a pastor in Pittsfield, Massachusetts, wrote books such as "Lectures to Children" and "The Student''s Manual," and helped found the Mount Holyoke Female Seminary.

