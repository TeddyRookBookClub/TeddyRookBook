  title: A Pen Picture (William Black)
  mins: 30
  goal: Your child notices how a writer paints a scene in words, and writes a short "pen picture" of their own.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: From a novel by William Black. On a still summer evening on an island in the Hebrides, off Scotland, Sheila and her visitors sit as the sun sets over the Atlantic, then Sheila and Lavender walk over the moor to the village and home by moonlight. Definitions and notes about the places follow.
  steps:
  - - About the author
    - The book calls William Black a leading modern English novelist whose stories are mostly set in Scotland, and says his most remarkable power is seen in "vivid, poetical descriptions" of scenery. His books include "A Daughter of Heth" and "Kilmeny."
  - - Words and meanings
    - 'The words and meanings are printed at the end of the lesson. Read a few together before the reading, so they don''t trip your child up:

      ~ Glamour, witchery, or a charm on the eyes, making them see things differently from what they really are.

      ~ Loch, a lake, a bay or arm of the sea.

      ~ Peat, a kind of turf used for fuel.

      ~ Curlew, an aquatic bird which takes its name from its cry.

      The notes say Sheila is a young Scottish girl living on Borva, a small island her father owns, near Lewis, one of the Hebrides. Find the Hebrides on a map of Scotland.'
  - - Read aloud
    - 'Read the lesson aloud slowly, enjoying the description. A few sentences to notice:

      ~ The sun had gone down in red fire behind the Atlantic

      ~ The cool air of the twilight was scented with sweet-brier.

      ~ And this was Sheila''s home.'
  - - Talk about it
    - 'Say: Find one thing you could see, one you could hear and one you could smell in this picture.

      Say: Why is this lesson called "A Pen Picture"?

      Say: The writer calls Sheila a kind of princess. What in the scene makes it feel like a fairy tale?'
  - - Write a pen picture
    - Your child writes a short paragraph describing a place at sunset or by moonlight (the backyard, a street, a park), using at least one sight, one sound and one smell.
