  - - What is a pun?
    - 'A pun is a joke that uses a word with two meanings. Read the first stanza:

      ~ Ben Battle was a soldier bold,

      ~ And used to war''s alarms;

      ~ But a cannon-ball took off his legs,

      ~ So he laid down his arms!

