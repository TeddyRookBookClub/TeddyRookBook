      ~ Upbraid, to charge with something wrong or disgraceful, to reproach.

      ~ Reck, to take heed, to care.

      ~ Random, without fixed aim or purpose, left to chance.

      Your child reads each meaning aloud, then uses the word in a sentence of their own.'
  - - Read aloud
    - 'Read the poem slowly, like a drumbeat at a funeral. It begins:

      ~ Not a drum was heard, not a funeral note,

      ~ As his corse to the rampart we hurried;

      ~ Not a soldier discharged his farewell shot

      ~ O''er the grave where our hero was buried.'
  - - Talk about it
    - 'Say: Why was the burial so hurried and secret? What were the soldiers afraid of?

