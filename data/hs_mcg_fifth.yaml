book:
  id: mcguffeyseclecti05mcgu_0
  title: McGuffey's Fifth Eclectic Reader, Revised Edition
  year: 1879 (revised edition)
  key: mcg-fifth
  short: Fifth Reader
  eyebrow: McGuffey's Readers · Fifth Reader · revised edition
  hero: An opening section on reading aloud, then 117 selections of prose and poetry by Irving, Longfellow, Whittier, Alcott, Hawthorne and many more, each with notes about the author and definitions, for readers about 11 to 13. Every lesson has a guide you can follow step by step, with the right page of the book beside it.
  how:
  - <b>One selection, one or two days.</b> Most guides take 30 to 40 minutes. Split a long story over two days and begin day two with a quick retelling.
  - <b>Words first.</b> The definitions are printed at the end of each lesson. Look at a few before reading, so the hard words don't stop the story.
  - <b>Meet the author.</b> Most lessons begin with a short note about the writer. Read it together; the guides only repeat what the book says.
  - <b>Read aloud, then tell it back.</b> McGuffey's readers were trained to read aloud well. Take turns reading, then have your child narrate the piece in their own words.
  - <b>Keep the good lines.</b> Copy a fine sentence or learn a stanza by heart each week. Over a year this builds a small treasury of memorized poetry.
  - <b>Elocution is optional.</b> The opening chapter on reading aloud is marked optional. Dip into it a little at a time rather than all at once.
  unitword: Part
