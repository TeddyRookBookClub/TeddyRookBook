  mins: 30
  goal: Your child reads Southey's famous sound poem aloud with growing speed, and explains how its words imitate rushing water.
  materials: *id002
  book: Southey's poem answering a child's question, "How does the water come down at Lodore?" with a long, rushing torrent of rhyming words.
  steps:
  - - About the poem
    - This poem is by Robert Southey, whose life is told in Lesson XX. Lodore is a waterfall in the English lake country, near where Southey lived. In the opening lines a little boy asks his father the question, and the father answers in rhyme.
  - - Read aloud
    - 'Read the opening calmly:

      ~ How does the water

      ~ Come down at Lodore?

      Then read the rest, letting it gather speed as the water does. Your child reads the second half.'
  - - Listen to the words
    - 'Say: Find words that sound like what they mean (splashing, roaring and so on). That is called onomatopoeia.

