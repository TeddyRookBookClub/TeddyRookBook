  - - About the author
    - The book says John Wilson, better known as "Christopher North," was born at Paisley, Scotland, studied at Glasgow and Oxford, lived among the "Lake School" poets, and was Professor of Moral Philosophy at the University of Edinburgh. This selection is adapted from "The Foresters," a tale of Scottish life.
