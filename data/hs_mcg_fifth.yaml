      Older children can write their narration in a short paragraph instead. Don''t correct while they talk; just listen.'
  - - Copywork
    - 'Your child copies this sentence slowly and neatly:

      ~ No one has a temper naturally so good, that it does not need attention and cultivation,

      Check spelling and commas against the book.'
  - - Optional writing
    - Your child writes three or four sentences about a time they kept (or lost) their temper, and what they might do next time.
  tip: Keep this one gentle. The point is that everyone can improve, not that anyone is bad.
