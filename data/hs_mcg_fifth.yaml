    - The book says Nathaniel Hawthorne was born in Salem, Massachusetts, graduated from Bowdoin College in 1825, wrote "Twice-Told Tales" and "The Scarlet Letter," and was U.S. consul at Liverpool. It says he was modest and avoided publicity, and that as a prose writer he has no superior among American authors.
