  goal: Your child reads a summer poem with feeling and names the country sights and sounds the poet longs for.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A short poem by George Arnold in which the speaker longs to leave for the wooded hills, slow streams, birds and herds of summer. Each stanza ends with a line about the green fields waiting.
  steps:
  - - About the author
    - The book says George Arnold (b. 1834, d. 1865) was born in New York, was taught at home by his parents, studied painting, then turned to writing and journalism in New York City. Two volumes of his poems were published after his death.
  - - Read aloud
    - 'Read the poem aloud. Here is the second stanza:

      ~ I long for shadowy founts, where the birds

      ~ Twitter and chirp at noon from every tree;

      ~ I long for blossomed leaves and lowing herds;

      ~ And Nature''s voices say in mystic words,

      ~ The green fields wait for thee.'
  - - Talk about it
    - 'Say: What does the poet long for? Make a list of sights and sounds.

      Say: Why does each stanza end with the green fields "waiting"?

      Say: The poet was a city journalist. Why might summer make him long for the country?'
  - - Picture it
    - Your child picks one stanza and draws or describes the scene in it.
  - - Memorize
    - Learn the second stanza (above) by heart.
