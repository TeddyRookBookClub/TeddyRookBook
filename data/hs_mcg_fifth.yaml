  steps:
  - - About the author
    - The book says Charles Wolfe (b. 1791, d. 1823) was an Irish clergyman born in Dublin. The poem first appeared in a newspaper with his initials, without his knowledge. The book also quotes Lord Byron, who said he "would rather be the author of it than of any one ever written."
