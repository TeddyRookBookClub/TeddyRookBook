  unit: 11
  title: Hamlet (Shakespeare)
  mins: 40
  goal: Your child reads a scene from Shakespeare aloud, taking parts, and tells what Horatio reports to Hamlet.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  - 'Optional: one or two more readers to take parts'
  book: Act I, Scene II of Shakespeare's "Hamlet" (part). Horatio, Marcellus and Bernardo tell Prince Hamlet that they have seen the ghost of his dead father on the castle platform at night. Hamlet questions them closely and decides to watch with them that night. Definitions and many helpful notes follow.
  steps:
  - - About the author
    - The book says William Shakespeare (b. 1564, d. 1616) was born at Stratford-upon-Avon, England, went to London, acted and wrote plays and poems, and retired to Stratford a few years before his death. It says his works show a wonderful knowledge of human nature.
  - - Who's who
    - 'Before reading, explain: Hamlet is a prince of Denmark whose father, the king, has died, and whose mother has quickly married again. Horatio is his school friend. Marcellus and Bernardo are officers who keep watch at night. Ham., Hor., Mar. and Ber. are their names in the play.'
  - - Words and meanings
    - 'The words and meanings are printed at the end of the lesson. Read a few together before the reading, so they don''t trip your child up:

      ~ Truant, wandering from business, loitering.

      ~ Cap-a-pie, from head to foot.

      ~ Beaver, a part of the helmet covering the face, so constructed that the wearer could raise or lower it.

      ~ Tenable, capable of being held.

      The notes explain more: Wittenberg is a university town where Hamlet and Horatio had been school-fellows, and "funeral baked meats" refers to the old custom of funeral feasts.'
  - - Read it as a play
    - 'Take parts and read the scene aloud. Some lines to listen for:

      ~ Ham. In my mind''s eye, Horatio.

      ~ Hor. My lord, I think I saw him yesternight.

      ~ A countenance more in sorrow than in anger.'
  - - Talk about it
    - 'Say: How does Hamlet feel about his mother''s quick wedding? Which line tells you?

      Say: What questions does Hamlet ask about the ghost? Why does he ask so many?

      Say: Why does Hamlet want them to keep it secret?'
  - - Memorize
    - 'Learn this exchange with a partner:

      ~ Hor. I saw him once; he was a goodly king.

      ~ Ham. I shall not look upon his like again.'
  tip: If your child enjoys this, a good children's retelling of "Hamlet" can tell them what happens next.
