  goal: Your child reads the last poem in the book with feeling and explains why this old Bible is so precious to the speaker.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'The last lesson in the book: George P. Morris''s poem about a family Bible, all that is left of the speaker''s mother. He remembers the family names written in it, his father reading it aloud and his mother''s face, and says it taught him how to live and how to die. (The page also has the end and definitions of Lesson CXVI.)'
  steps:
  - - About the author
