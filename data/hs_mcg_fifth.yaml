lessons:
- num: 1
  roman: Elocution
  idx: 12
  unit: 1
  title: 'Principles of Elocution: preliminary remarks and the elementary sounds'
  mins: 30
  goal: Your child knows the book's first rule for reading aloud and can say the vowel sounds and the paired consonant sounds clearly.
  materials: &id001
  - The book, open to these pages
  - A notebook and pencil
  book: 'The Introduction opens with Preliminary Remarks and Rule I, then II. Articulation: the elementary sounds of English, divided into vocals, subvocals and aspirates, with tables of example words.'
  steps:
  - - What this section is for
    - 'The Fifth Reader opens with about thirty pages on elocution, the art of reading aloud well. You don''t need to master it before starting the lessons. Read a little of it now and return to it now and then.

      Read the first rule together:

      ~ Before attempting to read a lesson, the learner should make himself fully acquainted with the subject

      Say: Why would it help to understand a piece before you read it aloud to someone?'
  - - Three kinds of sounds
    - 'The book says the elementary sounds of English are divided into vocals, subvocals and aspirates.

      Read its definitions together:

      ~ Subvocals are those sounds in which the vocalized breath is more or less obstructed.

      ~ Aspirates consist of breath only, modified by the vocal organs.

      In plain words: vocals are open voice sounds (the vowels), subvocals use voice but are partly blocked (like b, d, v), and aspirates are breath only (like p, t, f).'
  - - Try the vowel sounds
    - 'Use the table of vocals on the page. Say each example word firmly, then say just its vowel sound, the way the book directs. Start with the long vowels (eve, pine, tube, no), then the short ones (mat, met, it, us), then oil and out.

      Let your child lead the second time.'
  - - Feel the pairs
    - 'Have your child put a hand on the throat and say b, then p. One buzzes (voice), the other is only breath. The book calls such pairs cognates.

      Try a few more pairs from the table: d and t, v and f, z and s.

      Say: Which one makes your throat buzz?'
  - - Practice on words
    - 'Read the words in the table aloud, slowly and clearly, pronouncing the last sound fully: babe, bad, judge, move, buzz; rap, at, book, rich, life, hiss.'
  - - Wrap up
    - 'Say: Tell me the three kinds of sounds the book names, and give an example of each.'
  practice: Spend a minute a day this week saying the vowel table aloud.
  tip: Keep it light. The point is to notice sounds, not to memorize the terms.
  optional: true
- num: 2
  roman: Elocution
  idx: 15
  unit: 1
  title: 'Principles of Elocution: faults to be remedied'
  mins: 30
  goal: Your child pronounces unaccented vowels, final consonants and word endings clearly, and keeps words from running together.
  materials: *id001
  book: 'Substitutes (letters that stand for other sounds), then Faults to be Remedied: the Direction and Rules II to V, with lists of incorrect and correct pronunciations, and Exercises in Articulation.'
  steps:
  - - The main direction
    - 'Read the book''s direction together:

      ~ Give to each sound, to each syllable, and to each word its full, distinct, and appropriate utterance.

      Say: What does distinct mean here?'
  - - Don't drop the middle vowel
    - 'Read Rule II:

      ~ Avoid the omission of unaccented vowels.

      Say these words carefully from the list, giving every syllable its due: sep-a-rate, ev-i-dent, mem-o-ry, par-tic-u-lar. Then say them at normal speed without losing the middle sound.'
  - - Finish your words
    - 'Read Rule IV:

      ~ Utter distinctly the terminating subvocals and aspirates.

      The book lists mistakes like "an''" for and and "moun''" for mount. Have your child read: and, band, mount, desk, thrust.

      The book warns against the opposite error too: don''t become slow and stiff while fixing it.'
  - - Keep words apart
    - 'Read Rule V:

      ~ Avoid blending syllables which belong to different words.

      Try the examples on the page, keeping each word whole.'
  - - Tongue practice
    - 'Read the Exercises in Articulation aloud, slowly first and then faster, without slurring:

      ~ The little tattler tittered at the tempest.

      ~ Folly is never pleased with itself.

      ~ Every vice fights against nature.'
  - - Wrap up
    - 'Say: Which rule do you think you most need? Read one sentence from the exercises again using it.'
  practice: Pick two exercise sentences a day and say them clearly three times.
  tip: Listen for these faults in the lessons that follow and point them out gently, one at a time.
  optional: true
- num: 3
  roman: Elocution
  idx: 18
  unit: 1
  title: 'Principles of Elocution: inflections'
  mins: 30
  goal: Your child hears and makes the rising and falling slides of the voice, and knows when a falling slide is usual.
  materials: *id001
  book: III. Inflections, several pages of rules and examples on the rising and falling slides of the voice, with practice sentences marked to show each slide.
  steps:
  - - What an inflection is
    - 'Read the definition together:

      ~ Inflections are slides of the voice upward or downward.

      The book marks the rising slide and the falling slide with little accent marks over or after a word.'
  - - Hear the difference
    - 'Read these aloud. The voice goes up on the first choice and down on the second:

      ~ Did you walk or ride?

      ~ Is he sick, or is he well?

      (The book prints small marks over the words to show each slide.)

      Say: Where did my voice go up? Where did it come down?'
  - - The falling slide
    - 'Read Rule VI:

      ~ The falling inflection is generally proper wherever the sense is complete.

      Try it on a plain statement:

      ~ Truth is more wonderful than fiction.

      Say: Does your voice go up or down at the end of a statement?'
  - - Practice the examples
    - Go through a handful of the marked examples on the next pages. Have your child read each one, then tell whether the slide was up or down. Don't try to cover all the rules in one day.
  - - Make your own
    - Have your child write two questions that offer a choice (like "Do you want tea or milk?") and read them aloud with the right slides.
  - - Wrap up
    - 'Say: Ask me a yes-or-no question, and I''ll tell you if your voice went up.'
  practice: On later days, come back and work through more of the inflection rules, a page at a time.
  tip: Inflections are easier to hear than to explain. Exaggerate the slides at first, then make them natural.
  optional: true
- num: 4
  roman: Elocution
  idx: 29
  unit: 1
  title: 'Principles of Elocution: accent and emphasis'
  mins: 30
  goal: Your child knows the difference between accent (stress on a syllable) and emphasis (stress on a word), and shows how emphasis changes meaning.
  materials: *id001
  book: IV. Accent, with words whose accent changes with their meaning, and V. Emphasis, with examples and a question answered four ways.
  steps:
  - - Accent
    - 'Read what the book says: in every word of more than one syllable, one syllable is spoken with greater stress. Say a few of its examples, clapping on the accented syllable: lovely, member, window, return, remember.'
  - - Accent can change the word
    - 'The book lists words whose meaning changes with the accent. Try PRES-ent (a gift) and pre-SENT (to give), AU-gust (the month) and au-GUST (grand).

      Say: Can you think of another word like that? (Record and re-CORD is one.)'
  - - Emphasis
    - 'Read the definition:

      ~ A word is said to be emphasized when it is uttered with a greater stress of voice than the other words with which it is connected

      Try the examples, stressing the contrasted parts:

      ~ There is a difference between giving and forgiving.

      ~ What is done, can not be undone.

      Notice that emphasis can even move the accent, as in forGIVing.'
  - - One question, four answers
    - 'The book asks:

      ~ Did you walk into the city yesterday?

      It gives four answers. Read each one and ask your child which word in the question should be stressed to fit it:

      ~ No, my brother went.

      ~ No, I rode.

      ~ No, I went into the country.

      ~ No, I went the day before.'
  - - Your turn
    - Have your child say "I didn't take your pencil" five times, stressing a different word each time, and tell what each version means.
  - - Wrap up
    - 'Say: What is the difference between accent and emphasis?'
  practice: When reading later lessons, stop once or twice to ask which word deserves the emphasis.
  optional: true
- num: 5
  roman: Elocution
  idx: 33
  unit: 1
  title: 'Principles of Elocution: modulation and poetic pauses'
  mins: 30
  goal: Your child chooses a comfortable reading pitch, varies the voice instead of reading in a monotone, and pauses well in poetry.
  materials: *id001
  book: VI. Modulation (pitch, compass, quantity and quality of the voice), VII. Poetic Pauses (the slight pause at the end of each line and the caesura in the middle).
  steps:
  - - Pitch and the key-note
    - 'The book says each speaker has a key-note, the note the voice most often returns to, and that the range above and below it is the compass. Rule XII says to choose the pitch where you feel most at ease.

      Have your child read a sentence high, then low, then at an easy middle pitch.'
  - - Beware of monotony
    - 'The book warns that staying on one note is monotony, one of the worst faults in reading. Read a sentence of any lesson in a flat, droning voice, then read it naturally.

      Say: Which would you rather listen to?'
  - - Pauses in poetry
    - 'Read what the book says:

      ~ At the end of each line a slight pause is proper, whatever be the grammatical construction or the sense.

      There is also a pause near the middle of a line, the caesura. The book marks it with two lines:

      ~ There are hours long departed || which memory brings'
  - - Sense comes first
    - 'Read the warning:

      ~ The cæsural pause should never be so placed as to injure the sense.

      Try the book''s examples. Pause slightly at the marks, but never so long that the meaning breaks apart.'
  - - Try it on a poem
    - Turn to any short poem you know and have your child read four lines with a slight pause at each line end and a small one in the middle.
  - - Wrap up
    - 'Say: What is monotony, and how do you avoid it?'
  optional: true
- num: 6
  roman: Elocution
  idx: 37
  unit: 1
  title: 'Principles of Elocution: exercises'
  mins: 30
  goal: Your child reads short practice pieces aloud with the right tone, using what the introduction taught.
  materials: *id001
  book: Exercises for reading aloud, beginning with I. Death of Franklin (to be read in a solemn tone) and II. Bonaparte, followed by more short pieces.
  steps:
  - - Set the tone
    - 'The book says the first exercise is to be read in a solemn tone. Read its opening aloud slowly:

      ~ Franklin is dead.

      Say: What makes a voice sound solemn? (Slower, lower, steady.)'
  - - Read Death of Franklin
    - 'Your child reads the whole exercise, slowly and clearly.

      ~ Nations should wear mourning for none but their benefactors.

      Say: What is a benefactor? Why does the speaker say nations should mourn Franklin?'
  - - Read Bonaparte
    - 'This piece is made of short, sharp sentences that judge Napoleon:

      ~ He knew no motive but interest.

      ~ Nature had no obstacle that he did not surmount.

      Have your child read it with force, stressing the strongest words.'
  - - Compare
    - 'Say: How is the tone of the second piece different from the first? Which words would you stress?'
  - - More practice
    - Choose one more exercise from the following pages and let your child prepare it silently first, then read it aloud to you or the family.
  - - Wrap up
    - 'Say: Which rule from the introduction helped you most today?'
  practice: Return to these exercises for a quick warm-up before any lesson.
  optional: true
- num: 7
  roman: I
  idx: 42
  unit: 2
  title: The Good Reader
  mins: 35
  goal: Your child retells the story of the little girl who read for the King, and explains what makes a good reader.
  materials: &id002
  - The book, open to this lesson
  - A notebook and pencil
  book: A story about Frederick the Great, two pages who read badly, and a little girl who reads a widow's petition so well that the King acts on it. Definitions and a note about Frederick II of Prussia follow.
  steps:
  - - Words and meanings
    - 'The definitions come at the end of the lesson. Read a few together before you start:

      ~ Petition, a formal request.

      ~ Articulate, to utter the elementary sounds.

      ~ Monotony, lack of variety.

      ~ Affected, unnatural and silly.

      ~ Drafted, selected by lot.

      Say: Which of these words describe bad reading?'
  - - About the King
    - There is no author's name on this lesson, but there is a note about the King. It says Frederick II of Prussia, called Frederick the Great, was one of the greatest of German rulers, known for his military exploits, his wise and just government and his writing. He wrote many works in French.
  - - Read aloud
    - 'Take turns reading the numbered paragraphs aloud. The opening:

      ~ It is told of Frederick the Great, King of Prussia

      When you reach the two pages, read their parts the way the story describes them: the first huddling words together, the second stiff and affected. Then read the girl''s part plainly and well.'
  - - Talk about it
    - 'Say: What was wrong with the first page''s reading? What about the second''s?

      Say: The King said, "Oh! now I understand what it is all about." Why did he understand only when the girl read?

      Say: What did the King do for the widow, for the girl, and for the two pages?

      Say: Why do you think this story was put first in the book?'
  - - Tell it back
    - Close the book. Your child tells the whole story in order, from the petition to the end, in their own words.
  - - Copywork
    - 'Copy the King''s advice to the pages:

      ~ advising them to occupy the time in learning to read.

      Then copy two definitions from the lesson.'
  - - Write (optional)
    - In a few sentences, describe a good reader. Use at least two words from the lesson's list.
  practice: Reread one paragraph aloud each day, first badly like a page, then well like the girl, and talk about the difference.
  tip: 'This lesson sets the goal for the whole book: read so that the listener understands. Refer back to it often.'
- num: 8
  roman: II
  idx: 45
  unit: 2
  title: The Bluebell
  mins: 35
  goal: Your child follows the little parable of the white flower that became blue, and states its lesson in their own words.
  materials: *id002
  book: A short poem, with no author named, about a little white flower in a dim ravine that looks up at a strip of blue sky until it turns blue itself, ending with a lesson for a patient child. Definitions follow.
  steps:
  - - Words and meanings
    - 'Read a few definitions from the end of the lesson:

      ~ Rift, a narrow opening, a cleft.

      ~ Swayed, swung.

      ~ Chalice, a cup or bowl.

      ~ Bonny, beautiful.

      Say: Where would you see a rift of sky?'
  - - Read aloud
    - 'Read the poem to your child first, slowly, with a slight pause at the end of each line. Then your child reads it.

      ~ With one blue rift of sky between;

      ~ Swayed in the silence to and fro.

      ~ Day after day, with longing eye,'
  - - Talk about it
    - 'Say: Where did the little flower grow, and what could it see?

      Say: What happened to the flower after watching the sky so long?

      Say: The poem ends with a patient child. What is the lesson?

      Say: Why do you think the poet called it a little white flower at first?'
  - - Tell it back
    - Your child tells the story of the flower in plain prose, then says the lesson in one sentence.
  - - Memorize
    - 'Learn the closing stanza, the one about the patient child, which begins:

      ~ The patient child whose watchful eye

      Say it a few lines at a time, then all together. Copy it neatly once.'
  - - Write (optional)
    - 'Write two or three sentences: What do you look at often, and how might it change you?'
  practice: Say the memorized stanza each day this week.
- num: 9
  roman: III
  idx: 46
  unit: 2
  title: The Gentle Hand, by T. S. Arthur
  mins: 40
  goal: Your child retells how a girl's gentle touch changed her mother, her brother and a stubborn pony, and talks about why gentleness has power.
  materials: *id002
  book: A traveler's story of a night at a farmhouse, where a slender girl calms a fierce dog, softens her mother's refusal and quiets a balky pony. A note about T. S. Arthur opens the lesson and a long list of definitions ends it.
  steps:
  - - Words and meanings
    - 'Read some of the definitions at the end of the lesson:

      ~ Vicinity, neighborhood.

      ~ Repulsive, repelling, forbidding.

      ~ Peremptory, commanding, decisive.

      ~ Chiding, scolding, rebuking.

      ~ Crotchet, a perverse fancy, a whim.

      Say: Use peremptory in a sentence about a teacher or a parent.'
  - - About the author
    - Read the note at the start. It says Timothy S. Arthur was born near Newburgh, New York, and spent most of his life in Baltimore and Philadelphia. His schooling was limited, so he may be called self-educated. He wrote more than a hundred volumes, mostly novels of home life with a moral tone.
  - - Read aloud
    - 'This lesson is long. Read it over one or two days, taking turns by paragraph.

      ~ Dusky twilight was giving place to deeper shadows,

      ~ "Go in, Tiger," said the girl,

      Later, at the pony:

      ~ Dick stood firmly disobedient.'
  - - Talk about it
    - 'Say: How did the girl get the big dog to obey? How did the mother change her mind?

      Say: What did the farmer and the boy try with Dick the pony? What worked instead?

      Say: The companion says, "She''s good! Every body and every thing loves her." What does that tell us about where her power came from?

      Say: Why does the author show the gentle hand three times instead of once?'
  - - Tell it back
    - 'Your child narrates the story aloud, keeping the three moments in order: the dog, the mother, the pony.'
  - - Copywork
    - 'Copy:

      ~ "What a wonderful power that hand possesses!" said I,'
  - - Write (optional)
    - Write about a time when a gentle word worked better than a harsh one.
  practice: If you split the reading, begin day two by having your child tell what happened so far.
- num: 10
  roman: IV
  idx: 52
  unit: 2
  title: The Grandfather, by C. G. Eastman
  mins: 30
  goal: Your child reads a quiet poem about an old farmer and his grandchild with feeling, and notices how the poet tells a story in pictures.
  materials: *id002
  book: A short poem about a farmer resting in his easy-chair after dinner with his granddaughter on his knee, until both fall asleep. A note about the poet and a few definitions follow.
  steps:
  - - Words and meanings
    - 'Read the definitions:

      ~ Hale, healthy.

      ~ Mantel-tree, shelf over a fire-place.

      ~ Plodded, went slowly.

      ~ Heaving, rising and falling.'
  - - About the author
    - The book says Charles G. Eastman was born in Maine but moved young to Vermont, where he worked for newspapers in Burlington, Woodstock and Montpelier. He published a volume of poems in 1848 that faithfully pictured rural life in New England.
  - - Read aloud
    - 'Read the poem through to your child, then let your child read it.

      ~ The farmer sat in his easy-chair

      ~ Smoking his pipe of clay,

      And near the end:

      ~ Fast asleep were they both on that summer day.'
  - - Talk about it
    - 'Say: Who is in the room, and what is each one doing?

      Say: Why do tears come to the old man''s eyes? What does the little girl think is the reason?

      Say: The poem has no big events. What makes it interesting anyway?

      Say: Which picture in the poem do you see most clearly?'
  - - Tell it back
    - 'Your child describes the scene as if painting it: the room, the farmer, his wife, the child, the end of the afternoon.'
  - - Memorize
    - 'Learn the first stanza, which begins:

      ~ The farmer sat in his easy-chair

      Read it with a calm, slow voice, as the scene is calm.'
  - - Write (optional)
    - Write a short description of a grandparent or older friend in their favorite chair.
- num: 11
  roman: V
  idx: 53
  unit: 2
  title: A Boy on a Farm, by C. D. Warner
  mins: 35
  goal: Your child enjoys the humor of Warner's piece, retells the boy's many chores, and notices how exaggeration makes writing funny.
  materials: *id002
  book: A humorous essay from "Being a Boy" about how much work falls to a farm boy, who is called idle all the same. A note about Charles Dudley Warner opens it; definitions follow.
  steps:
  - - Words and meanings
    - 'Read some of the definitions:

      ~ Factotum, a person employed to do all kinds of work.

      ~ Indispensable, absolutely necessary.

      ~ Perpetually, continually.

      ~ Chore, the light work of the household either within or without doors.

      Say: Is anyone in our house a factotum?'
  - - About the author
    - The book says Charles Dudley Warner was born at Plainfield, Massachusetts, graduated from Hamilton College in 1851, and became a lawyer before turning to newspapers at Hartford, Connecticut, and to literature. "My Summer in a Garden" and "Backlog Studies" are among his best known works. This piece is from "Being a Boy."
  - - Read aloud
    - 'Take turns by paragraph. Let the funny lines land:

      ~ boys, it is my impression that a farm without a boy would very soon come to grief.

      ~ He practices standing on his head, in order to accustom himself to any position.'
  - - Talk about it
    - 'Say: List as many of the boy''s jobs as you can remember.

      Say: Why does the writer call him "an idle boy" at the end? Does he mean it?

      Say: "He has a natural genius for combining pleasure with business." What does the boy do that shows this?

      Say: Find a sentence that exaggerates to be funny.'
  - - Tell it back
    - Your child tells you what a day in the life of this farm boy would be like, using details from the essay.
  - - Copywork
    - 'Copy:

      ~ His work is like a woman''s, — perpetually waiting on others.'
  - - Write (optional)
    - Write a short, funny paragraph listing your own chores, in the style of Warner.
- num: 12
  roman: VI
  idx: 55
  unit: 2
  title: The Singing Lesson, by Jean Ingelow
  mins: 30
  goal: Your child reads the story-poem of the embarrassed nightingale, talks about mistakes and pride, and finds the moral.
  materials: *id002
  book: A poem about a nightingale who sang a few notes out of tune and hid in shame, until a dove scolded her and she sang again. A note about Jean Ingelow begins the lesson; definitions and a note about the nightingale end it.
  steps:
  - - Words and meanings
    - 'Read some definitions:

      ~ Sauntering, wandering idly, strolling.

      ~ Snicker, to laugh in a half suppressed manner.

      ~ Crest, a tuft growing on an animal''s head.

      ~ Moral, the practical lesson which any thing is fitted to teach.

      Also read the note: the nightingale is a small brown bird with a very strong, sweet voice, common in Europe but not found in America.'
  - - About the author
    - The book says Jean Ingelow was born in Boston, Lincolnshire, England. Her fame came with her "Poems" in 1863. She also wrote novels and children's stories such as "Mopsa, the Fairy," and lived in London, spending much of her time in deeds of charity.
  - - Read aloud
    - 'Read it together, giving each bird its own voice.

      ~ A nightingale made a mistake;

      ~ She sang a few notes out of tune:

      The dove''s question:

      ~ Why behave like a goose?'
  - - Talk about it
    - 'Say: What did the nightingale do after her mistake? What did the lark and the thrush do?

      Say: What did the dove tell her to remember?

      Say: The poem ends by leaving the moral for you to find. What is it?

      Say: Have you ever wanted to hide after a mistake?'
