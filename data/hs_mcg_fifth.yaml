      Then read the Note about Roger Sherman together.'
  - - Talk about it
    - 'Say: What two things happened to Mr. Sherman that could have made him lose his temper? What did he do each time?

      Say: The writer says a victory over yourself was "worth more than the proudest one ever achieved on the field of battle." Why would he say that?

      Say: The writer doesn''t just tell us to be calm. He tells stories about a real man. Why do the stories help?'
  - - Tell it back
    - 'Close the book.

