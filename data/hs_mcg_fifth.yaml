  unit: 7
  title: William Tell, Part 1 (Sheridan Knowles)
  mins: 40
  goal: Your child reads a scene from a play with expression, taking a part, and explains why Tell will not bow to Gesler.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  - 'Optional: a second reader (parent or sibling) to take parts'
  book: The first part of a scene from James Sheridan Knowles's play "William Tell." Tell stands in chains before the tyrant Gesler, who learns that the boy brought in is Tell's son and orders Tell to shoot an apple from the boy's head. A long list of definitions ends the lesson.
  steps:
  - - About the author
    - 'The book says James Sheridan Knowles (b. 1784, d. 1862) was born in Cork, Ireland, was an actor and writer of plays, visited America in 1835, and later left the stage to become a Baptist minister. His plays include "Virginius," "The Hunchback" and "William Tell."

      Say: This lesson is a play, not a story. The names in front of each speech tell you who is talking. Tell is William Tell; Ges. is Gesler, the governor; Alb. is Albert, the boy.'
  - - Words and meanings
    - 'The words and meanings are printed at the end of the lesson. Read a few together before the reading, so they don''t trip your child up:

      ~ Comeliness, that which is becoming or graceful.

      ~ Caitiff, a mean villain.

      ~ Thraldom, bondage, slavery.

      ~ Blanch, to turn white.

      Your child reads each meaning aloud, then uses the word in a sentence of their own.'
  - - Read it as a play
    - 'Take parts: one of you reads Tell, the other reads Gesler and the others. Read slowly and with feeling. Listen for lines like these:

      ~ Though they were doubled, and did weigh me down

      ~ Prostrate to the earth, methinks I could rise up

      ~ Now heart, thy nerve; forget thou''rt flesh, be rock.

      This is a long lesson. It is fine to read half today and half tomorrow.'
  - - Talk about it
    - 'Say: Tell is in chains, yet he speaks boldly to Gesler. What does he say a tyrant cannot take away from a man?

      Say: Why does Tell try to hide that the boy is his son?

      Say: When Gesler sees a tear, he says he has found Tell''s weak spot. What is it? How does Gesler use it?'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what has happened in the scene so far, and what Gesler orders Tell to do.

      Older children can write their narration in a short paragraph instead. Don''t correct while they talk; just listen.'
  - - Memorize
    - 'Choose one short speech to learn by heart and say with expression. This one is strong:

      ~ Mayst thou live, my boy,

      ~ To see thy country free, or die for her,

      ~ As I do!

      Say it a few times a day until it comes easily.'
  practice: Before the next lesson, reread the last page of the scene aloud so the story is fresh.
  tip: Dramatic reading is the heart of this lesson. Let your child be loud, slow and fierce when Tell speaks.
