  - - Read aloud
    - 'Read the poem aloud slowly and gently. It begins:

      ~ This book is all that''s left me now,

      and later:

      ~ For many generations past

      ~ Here is our family tree;

      ~ My mother''s hands this Bible clasped,

      ~ She, dying, gave it me.'
  - - Talk about it
    - 'Say: Why is this book "all that''s left" to the speaker?

      Say: What memories does the Bible bring back? Find the father and the mother in the poem.

      Say: Does your family have an old book, Bible, photo or object that holds family memories? What is its story?'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what the speaker remembers when he holds the book.

      A few sentences are enough.'
  - - Memorize
    - Learn the "For many generations past" stanza (above) by heart.
  - - Celebrate
    - This is the last lesson in the Fifth Reader. Let your child choose a favorite poem or passage from the whole book to read aloud or recite for the family.
