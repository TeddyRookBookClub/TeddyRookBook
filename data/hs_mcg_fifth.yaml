  goal: Your child reads a short, musical poem aloud and explains what the sea, mountains and woods "say."
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'A four-stanza poem by Charles T. Brooks: the sea calls to the mountains, the torrents and the pine forests answer, and the last stanza asks the human heart to sing like them. (The page also has notes for "A Pen Picture.")'
  steps:
  - - About the author
    - The book says Charles T. Brooks (b. 1813, d. 1883) was born in Salem, Massachusetts, graduated from Harvard in 1832, was a minister in Newport, Rhode Island, and translated much German poetry, beginning with Schiller's "William Tell." (Your child met that story in Lessons LXVII and LXVIII.)
  - - Read aloud
    - 'Read the poem aloud, letting the voices answer each other. It begins:

      ~ A voice from the sea to the mountains,

      ~ From the mountains again to the sea;

      ~ A call from the deep to the fountains,

      ~ "O spirit! be glad and be free."'
  - - Talk about it
    - 'Say: Who is speaking in each stanza: the sea, the torrents, the pines? What do they each say?

      Say: In the last stanza, who is told to sing? How should it sing?

      Say: Find words that rhyme at the ends of the lines. How do the rhymes make the poem sound like an echo?'
  - - Memorize
    - 'Learn the last stanza by heart:

      ~ Oh! sing, human heart, like the fountains,

      ~ With joy reverential and free,

      ~ Contented and calm as the mountains,

      ~ And deep as the woods and the sea.'
  - - Optional writing
    - Your child writes two lines about what the wind, the rain or a river might "say."
