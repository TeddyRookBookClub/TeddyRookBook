    - 'Say: What does the first stanza mean: "Not what we would, but what we must"?

      Say: The poet lives in the city. What does he remember and miss about the country?

      Say: At the end, he asks if any life is "more rational and free" than the farmer''s. What do you think?'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what the poet remembers, stanza by stanza.

      A few sentences are enough.'
  - - Memorize
    - Learn the first stanza (above) by heart. It is a short, wise saying worth keeping.
  - - Optional writing
    - Your child writes about a place they love and would miss if they moved away.
