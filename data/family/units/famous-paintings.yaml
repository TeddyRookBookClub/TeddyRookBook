# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: famous-paintings
title: "Famous Paintings"
subject: art
icon: "🖼️"
blurb: "How to look at a painting, then the Renaissance, the Dutch masters, the Impressionists and American painters, with color and design along the way."
parts:
  - title: "How to Look at a Painting"
    read: ["Looking Closely", "/art/young-artists/count-details/"]
    more: [["The Art Gallery", "/art/gallery/"], ["Formal analysis in Art History I", "/art/art-history-1/formal-analysis/"]]
    ask:
      - "What is the first thing you notice in this painting?"
      - "Where does the painting lead your eye, and how?"
      - "Can you enjoy a painting without knowing its story? What does knowing the story add?"
    do: "Pick one painting from the gallery. Look at it in silence for two minutes, then take turns naming one thing each until no one can find anything new."
    A: [ydraw.count-details, ydraw.draw-what-you-see, ydraw.kinds-of-pictures]
    B: [ydraw.kinds-of-pictures, design.elements-overview, design.line-element]
    C: [design.elements-overview, ah1.formal-analysis, ah1.subject-style]
    D: [ah1.formal-analysis, ah1.subject-style, ah1.painting-media, ah1.dating-attribution]
  - title: "The Renaissance"
    read: ["Leonardo da Vinci in Art History I", "/art/art-history-1/leonardo/"]
    more: [["Linear perspective in Art History I", "/art/art-history-1/linear-perspective/"]]
    ask:
      - "What is the woman in the Mona Lisa doing with her face?"
      - "How did Renaissance painters make flat walls look deep?"
      - "Leonardo was a painter, an engineer and a scientist. Did one help the others?"
    do: "Try Leonardo's soft shading (sfumato): draw a ball with only light pencil strokes, blending with a finger so no edge shows."
    A: [ydraw.face-parts, ydraw.happy-sad, ydraw.shadows-kids]
    B: [ydraw.near-far, draw.shading-sphere, draw.smooth-tone]
    C: [ah1.early-renaissance-art, ah1.leonardo, ah1.linear-perspective]
    D: [ah1.leonardo, ah1.raphael-michelangelo, ah1.venice, ah1.northern-renaissance]
  - title: "The Dutch Masters"
    read: ["Vermeer in Art History II", "/art/art-history-2/vermeer/"]
    more: [["Rembrandt in Art History II", "/art/art-history-2/rembrandt/"]]
    ask:
      - "What is happening in Vermeer's quiet rooms?"
      - "Where does the light come from in a Vermeer? In a Rembrandt?"
      - "Why might a nation of merchants want paintings of everyday life instead of kings and saints?"
    do: "Set up a still life on a table by a window: a jug, some fruit, a cloth. Draw or paint it, paying attention to where the light falls."
    A: [ydraw.shadows-kids, ydraw.lighter-darker, ydraw.draw-what-you-see]
    B: [draw.light-direction, draw.cast-shadows, draw.still-life]
    C: [ah2.dutch-market, ah2.rembrandt, ah2.vermeer, draw.light-on-form]
    D: [ah2.dutch-market, ah2.rembrandt, ah2.vermeer, ah2.leyster-genre]
  - title: "The Impressionists"
    read: ["Impressionism in Art History II", "/art/art-history-2/impressionism/"]
    more: [["Monet's series in Art History II", "/art/art-history-2/monet-series/"]]
    ask:
      - "What colors do you see in Monet's water lilies?"
      - "Why did the Impressionists paint outdoors, quickly?"
      - "Critics first laughed at Impressionism. Why do new styles so often meet scorn before they are admired?"
    do: "Paint the same view from a window three times in one day: morning, noon and late afternoon, as Monet did with his haystacks."
    A: [ydraw.rainbow, ydraw.warm-cool, ydraw.mixing-colors]
    B: [ydraw.warm-cool, ydraw.color-wheel-kids, design.color-wheel]
    C: [ah2.impressionism, ah2.monet-series, design.complementary, design.temperature]
    D: [ah2.impressionism, ah2.van-gogh, ah2.cezanne-gauguin, design.simultaneous-contrast]
  - title: "American Painters"
    read: ["The Hudson River School in Art History II", "/art/art-history-2/hudson-river/"]
    more: [["Early America in Art History II", "/art/art-history-2/early-america/"]]
    ask:
      - "What do these painters love about the American land?"
      - "Why did painters in the 1800s paint such huge, wild landscapes?"
      - "How might these paintings have shaped what Americans thought about the West?"
    do: "Paint or draw a landscape from a real place near you: the sky, the far hills or buildings, and something close up in front."
    A: [ydraw.sky-ground, ydraw.near-far, ydraw.draw-big]
    B: [ydraw.near-far, draw.atmospheric, draw.horizon-line]
    C: [ah2.hudson-river, ah2.american-19th, draw.atmospheric]
    D: [ah2.early-america, ah2.hudson-river, ah2.american-19th, ah2.photography]
  - title: "Color and Design in Paintings"
    read: ["Color in Paintings", "/art/color-and-design/color-in-paintings/"]
    ask:
      - "Which painting from this unit has the happiest colors? The saddest?"
      - "How do painters use color to point your eye to the most important part?"
      - "Does color mean the same thing in every culture? How could you find out?"
    do: "Make a family art gallery: each person frames their best work from the unit and writes a small museum label. Invite someone to visit."
    A: [ydraw.primary-colors, ydraw.rainbow, ydraw.art-tools]
    B: [design.color-wheel, design.tints-tones-shades, design.balance-principle]
    C: [design.emphasis, design.color-in-paintings, design.thirds-focus-paintings]
    D: [design.color-in-paintings, design.color-meaning, design.composition-structures, ah2.style-recognition]
projects:
  A:
    t: "My painting, like a master"
    do: "Pick a painting from the unit and make your own picture in the same colors or the same subject. Show both side by side."
    rubric: ["Picture finished", "Uses colors or a subject from the master's painting", "Can name the painter"]
  B:
    t: "Five painters book"
    do: "Make a book with one page each for five painters from the unit: a sketch of one of their paintings, their name, when they lived and one thing about their style."
    rubric: ["Five painters", "Dates and facts correct", "A sketch for each", "Style described in your own words"]
  C:
    t: "Museum audio guide"
    do: "Choose four paintings from the unit. Write and record a one-minute audio guide for each: what to look at, how it was made and why it matters."
    rubric: ["Four paintings, correctly identified", "Points to specific details", "Explains technique and context accurately", "Clear, lively recordings"]
  D:
    t: "Formal analysis essay"
    do: "Write a 2-3 page formal analysis of one painting: line, color, light, composition and subject, then what the choices mean in their time."
    rubric: ["Close description of formal elements", "Interpretation supported by what is visible", "Historical context, cited", "Organized and edited"]
