# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-harvard-classics
title: "The Harvard Classics"
subject: language
icon: "📚"
blurb: "Six weeks of great books read aloud: Franklin, Homer, Darwin, Faraday, a sailor's voyage and the Declaration, with the skills to talk and write about them."
parts:
  - title: "Franklin's Autobiography"
    read: ["Harvard Classics: Franklin's Advice for the New Year", "/harvard-classics/january-1/"]
    more: [["Harvard Classics: Franklin Learned the Secret", "/harvard-classics/october-26/"]]
    ask:
      - "Franklin made a list of good habits to practice. Which one would you pick?"
      - "Why did Franklin work on one habit a week instead of all at once?"
      - "Franklin admits he never reached his goal. Was the plan still worth it?"
    do: "Make a family habit chart in Franklin's style: each person picks one habit for the week and marks each day they keep it."
    A: [young.tidying-up, young.feelings, fwr.days-months]
    B: [fwr.days-months, comp.summarizing, g2.picture-bar-graphs]
    C: [comp.summarizing, comp.topic-sentences, comp.supporting-details]
    D: [comp.summarizing, comp.paraphrasing, rhet.ethos]
  - title: "Homer's Odyssey"
    read: ["Harvard Classics: Odysseus Silenced the Sirens", "/harvard-classics/january-24/"]
    more: [["Harvard Classics: Odysseus Adrift on a Raft", "/harvard-classics/october-20/"]]
    ask:
      - "How did Odysseus get past the Sirens?"
      - "Why did he want to hear their song at all?"
      - "Odysseus planned ahead for his own weakness. When is that the wisest thing a person can do?"
    do: "Draw a map of the Odyssey on a big sheet, adding each place you hear about. Keep it for the whole unit."
    A: [fwr.characters-setting, fwr.beginning-middle-end, maps.island-peninsula]
    B: [fwr.characters-setting, comp.narrative, maps.island-peninsula]
    C: [comp.narrative, ah1.greek-vases, worldgeo.islands-peninsulas]
    D: [ah1.aegean, rhet.figures-of-speech, rhet.analysis-intro]
  - title: "Darwin's Voyage of the Beagle"
    read: ["Harvard Classics: Crabs Climb Trees?", "/harvard-classics/march-16/"]
    more: [["Harvard Classics: Million-Year-Old Islands", "/harvard-classics/december-27/"]]
    ask:
      - "What surprising animal did Darwin describe?"
      - "Darwin wrote down everything he saw. Why is a careful notebook so useful?"
      - "How do careful observations lead to big questions?"
    do: "Keep a naturalist's notebook for the week: each person sketches and describes one living thing a day, with the date and place."
    A: [lifek.observing, lifek.animal-homes, lifek.coverings]
    B: [lifek.observing, lifesci.structural-adaptations, lifesci.classification-ranks]
    C: [lifesci.structural-adaptations, lifesci.dichotomous-keys, lifesci.natural-selection]
    D: [hsbio.natural-selection, hsbio.evidence-fossils-anatomy, hsbio.speciation]
  - title: "Faraday's Experiments"
    read: ["Harvard Classics: First Sparks of Electricity", "/harvard-classics/may-2/"]
    more: [["Circuit Builder (Science Lab)", "/science-lab/circuits/"]]
    ask:
      - "What can a magnet pick up? What can't it?"
      - "Faraday made electricity by moving a magnet near a wire. Why was that such a big discovery?"
      - "Faraday had little schooling and taught himself. What made him such a good scientist?"
    do: "Test what a magnet sticks to around the house and sort the things into two piles. Then build a circuit in the Circuit Builder."
    A: [k.sort-and-count, k.describe-attributes, k.more-fewer-same]
    B: [physsci.magnets, physsci.circuits-intro, physsci.current-voltage]
    C: [physsci.magnets, physsci.electromagnets, physsci.generators]
    D: [physsci.generators, phys2.faradays-law, physsci.electric-power]
  - title: "Two Years Before the Mast"
    read: ["Harvard Classics: A College Boy Goes to Sea", "/harvard-classics/august-14/"]
    more: [["Harvard Classics: Home After Storms and Adventures", "/harvard-classics/september-18/"]]
    ask:
      - "What was hard about life on a sailing ship?"
      - "Why did Dana, a college student, choose to work as a common sailor?"
      - "Dana's book changed how people thought about sailors' lives. How can one honest account change minds?"
    do: "Learn three sailor's knots together and tie them on a rope rail between two chairs."
    A: [maps.oceans, maps.compass-rose, k.count-to-20]
    B: [maps.oceans, maps.compass-rose, worldgeo.oceans-seas]
    C: [worldgeo.oceans-seas, worldgeo.straits-canals, earthsci.surface-currents]
    D: [earthsci.surface-currents, worldgeo.latitude, comp.evidence-types]
  - title: "The Declaration of Independence"
    read: ["Harvard Classics: Some Chose to Remain British Subjects", "/harvard-classics/july-4/"]
    ask:
      - "What does 'independence' mean?"
      - "Which words from the Declaration do people quote most?"
      - "The Declaration is written as an argument. What does it set out to prove, and how?"
    do: "Read the opening two paragraphs aloud, each person taking a sentence. Copy one favorite line in your best handwriting."
    A: [usyoung.declaration-young, usyoung.independence-day, hand.neat-copy]
    B: [usyoung.declaration-young, ush1.declaration-of-independence, hand.cursive-sentences]
    C: [ush1.declaration-of-independence, gov.declaration-ideas, comp.thesis]
    D: [gov.declaration-ideas, gov.natural-rights-social-contract, rhet.logos, rhet.claims]
projects:
  A:
    t: "My favorite story"
    do: "Pick your favorite reading from the unit. Draw three pictures of what happened and tell it back to the family."
    rubric: ["Three pictures in order", "Tells the story clearly", "Says why it was a favorite"]
  B:
    t: "A reading journal"
    do: "After each reading, write three sentences: what happened, what you learned, and a question you still have. Add a drawing for two of them."
    rubric: ["An entry for each reading", "Three sentences each", "Thoughtful questions", "Neat and complete"]
  C:
    t: "Book talk"
    do: "Choose one author from the unit. Read a little more of their work and give a five-minute talk on who they were, what they wrote and why it lasted."
    rubric: ["Accurate facts about the author", "Reads a short passage aloud", "Explains why the work lasted", "Clear, well-paced talk"]
  D:
    t: "Comparative essay"
    do: "Write a 3-page essay comparing two readings from the unit on one theme (courage, curiosity, liberty, hard work). Quote both texts."
    rubric: ["A clear thesis linking the two texts", "Quotations explained, not just dropped in", "Fair to both texts", "Organized and edited"]
