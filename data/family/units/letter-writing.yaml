# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: letter-writing
title: "Letter Writing"
subject: language
icon: "✉️"
blurb: "The parts of a letter, thank-you notes, friendly letters and pen pals, famous letters from history, business letters and email."
parts:
  - title: "The Parts of a Letter"
    read: ["Letter Parts", "/writing/first-writing/letter-parts/"]
    ask:
      - "What goes at the top of a letter, and what goes at the end?"
      - "Why do we start with 'Dear' even when writing to a stranger?"
      - "A letter is slower than a text. When is slow better?"
    do: "Set up a family post office: a shoebox mailbox for each person. Everyone writes at least one short letter to someone in the house each day this week."
    A: [fwr.letter-parts, fwr.greeting-closing, fwr.capital-names]
    B: [fwr.letter-parts, fwr.greeting-closing, usage.commas-everyday]
    C: [comp.business-letter, adult.letters, adult.envelopes]
    D: [adult.letters, adult.envelopes, comp.business-letter]
  - title: "Thank-You Notes"
    read: ["Thank-You Notes in Manners for Growing Up", "/etiquette/growing-up/thank-you-notes/"]
    ask:
      - "Who could you thank this week, and for what?"
      - "What makes a thank-you note feel real instead of polite?"
      - "Why does a handwritten note still matter when an email is faster?"
    do: "Each person writes or draws three thank-you notes to people who have helped the family. Address the envelopes and mail them together."
    A: [fwr.thank-you-note, young.thank-you, young.thank-you-picture]
    B: [fwr.thank-you-note, growing.thank-you-notes, hand.cursive-sentences]
    C: [growing.thank-you-notes, adult.thank-you-notes-adult, comp.concluding-sentences]
    D: [adult.thank-you-notes-adult, adult.condolence-notes, rhet.register]
  - title: "Friendly Letters and Pen Pals"
    read: ["Harvard Classics: Letters to an Emperor (Pliny)", "/harvard-classics/november-3/"]
    ask:
      - "What would you tell a pen pal about your life?"
      - "How do you make a letter sound like you?"
      - "Pliny wrote to the emperor Trajan nearly 2,000 years ago, and we still have the replies. What do letters save that history books leave out?"
    do: "Find a pen pal (a cousin, a grandparent, a friend who moved away). Each person writes a first letter with three questions to answer back."
    A: [fwr.telling-sentences, fwr.asking-sentences, fwr.capital-i]
    B: [fwr.asking-sentences, fwr.join-with-and, fwr.because-so]
    C: [comp.purpose-audience, comp.supporting-details, comp.transitions]
    D: [rhet.rhetorical-situation, rhet.register, comp.concise]
  - title: "Letters That Made History"
    read: ["Harvard Classics: Survivor's Story of Vesuvius (Pliny)", "/harvard-classics/august-24/"]
    more: [["Harvard Classics: Columbus' Letter Miraculously Found", "/harvard-classics/october-12/"]]
    ask:
      - "What did Pliny see from across the bay?"
      - "Why do historians trust a letter written at the time more than a story told years later?"
      - "Columbus wrote his letter to win support back home. How might that shape what he chose to say?"
    do: "Write a letter to a grandparent or older friend asking about one thing they remember from when they were your age. Save the answer in a family history folder."
    A: [usyoung.then-and-now, fwr.time-words, fwr.days-months]
    B: [ush1.primary-secondary, fwr.days-months, comp.narrative]
    C: [ush1.primary-secondary, ush1.sourcing-hipp, comp.evidence-types]
    D: [ush1.sourcing-hipp, comp.source-credibility, rhet.ethos]
  - title: "Persuasive Letters"
    read: ["Harvard Classics: A Letter from a Lion (Johnson)", "/harvard-classics/february-7/"]
    ask:
      - "If you wrote to the mayor, what would you ask for?"
      - "What reasons would make the mayor want to say yes?"
      - "Johnson's letter is polite and devastating at once. How does he manage both?"
    do: "Write a real letter of request: to a library asking for a book, to a park about a broken swing, or to a company about a product you like or dislike. Mail it."
    A: [fwr.opinion, fwr.because-so, young.please]
    B: [fwr.opinion, comp.persuasive, comp.topic-sentences]
    C: [comp.persuasive, comp.fact-opinion, rhet.logos]
    D: [rhet.ethos, rhet.pathos, rhet.logos, rhet.tone]
  - title: "Email and Business Letters"
    read: ["Email in Composition", "/writing/composition/email/"]
    ask:
      - "How is an email to Grandma different from an email to a teacher?"
      - "What makes a good subject line?"
      - "Why is it wise to read an email twice before sending it, especially when you're upset?"
    do: "Write a practice email to a pretend company asking a question. Trade with someone in the family, who answers it as the company."
    A: [young.phone-hello, growing.phone-calls, fwr.check-your-work]
    B: [growing.answering-messages, growing.texting, fwr.fix-it]
    C: [comp.email, comp.business-letter, adult.email]
    D: [comp.email, adult.email, adult.interviews, rhet.concision]
projects:
  A:
    t: "A letter to someone far away"
    do: "Draw a picture and dictate a short letter to a relative or friend who lives far away. Help address the envelope and put it in the mailbox."
    rubric: ["Has a greeting and a closing", "Says something about your life", "Mailed"]
  B:
    t: "Pen-pal letters"
    do: "Write three letters to a pen pal over the unit, each with a greeting, three paragraphs or parts, and a closing. Keep copies in a folder with any replies."
    rubric: ["Three complete letters in letter form", "Each asks and answers questions", "Capitals, commas and end marks correct", "Neat handwriting"]
  C:
    t: "A letter to a leader"
    do: "Write a polite, persuasive letter to a local leader (mayor, librarian, park director) about a real issue. Include a clear request, three reasons and a thank-you. Mail it."
    rubric: ["Proper business-letter form", "A clear request", "Three good reasons with facts", "Polite tone and careful editing"]
  D:
    t: "A historian's letter collection"
    do: "Gather or transcribe five letters from your family's or your town's past (or from a public archive). Write a 2-page introduction explaining what they show about their time."
    rubric: ["Five letters, carefully transcribed", "Each letter's date and writer identified", "An introduction that draws careful conclusions", "Sources noted"]
