# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: american-revolution
title: "The American Revolution"
subject: history
icon: "🔔"
blurb: "Thirteen colonies, the quarrel over taxes, the Declaration of Independence, the war, and what the new nation set out to be."
parts:
  - title: "Thirteen Colonies"
    read: ["The Thirteen Colonies", "/american-history/young-learners/thirteen-colonies/"]
    more: [["Harvard Classics: The First Step Toward Independence", "/harvard-classics/january-14/"]]
    ask:
      - "Name some of the thirteen colonies. Which one is closest to where we live?"
      - "How was life different in New England, the Middle Colonies and the South?"
      - "Colonists governed many of their own affairs for over a century. How might that have made them less willing to accept rules from far away?"
    do: "Draw the Atlantic coast on a long strip of paper and label the thirteen colonies from north to south. Keep it on the wall for the whole unit."
    A: [usyoung.thirteen-colonies, usyoung.jamestown, usyoung.pilgrims]
    B: [usyoung.thirteen-colonies, usgeo.first-thirteen, ush1.comparing-regions]
    C: [usgeo.first-thirteen, ush1.new-england, ush1.middle-colonies, ush1.southern-colonies]
    D: [ush1.comparing-regions, ush1.colonial-self-government, ush1.mercantilism, ush1.awakening-enlightenment]
  - title: "Taxes and Protest"
    read: ["Why Break Away?", "/american-history/young-learners/why-break-away/"]
    ask:
      - "What were the colonists upset about?"
      - "'No taxation without representation.' What did that mean?"
      - "Britain had spent a great deal defending the colonies in the French and Indian War. How might a British leader have seen the taxes differently from a colonist?"
    do: "Stage a two-sided family debate: one side speaks for Parliament, the other for the colonists. Then switch sides."
    A: [usyoung.why-break-away, usyoung.why-rules, usyoung.rules-and-laws]
    B: [usyoung.why-break-away, ush1.french-and-indian-war, ush1.taxes-and-protest]
    C: [ush1.french-and-indian-war, ush1.taxes-and-protest, ush1.road-to-revolution]
    D: [ush1.taxes-and-protest, ush1.road-to-revolution, gov.english-roots, informal.premise-conclusion]
  - title: "The Declaration of Independence"
    read: ["The Declaration of Independence", "/american-history/young-learners/declaration-young/"]
    more: [["Harvard Classics: Some Chose to Remain British Subjects", "/harvard-classics/july-4/"]]
    ask:
      - "What day do we celebrate the Declaration, and how?"
      - "Read the line about 'unalienable rights.' Which rights does it name?"
      - "Many signers held people in slavery while writing that all men are created equal. How did Americans later use those same words to argue for freedom?"
    do: "Read the Declaration's second paragraph aloud together. Each person copies one sentence in their best handwriting and signs their name below it."
    A: [usyoung.declaration-young, usyoung.independence-day, usyoung.liberty-bell]
    B: [usyoung.declaration-young, ush1.declaration-of-independence, hand.signature]
    C: [ush1.declaration-of-independence, gov.declaration-ideas, gov.natural-rights-social-contract]
    D: [gov.declaration-ideas, gov.natural-rights-social-contract, rhet.logos, rhet.pathos]
  - title: "The War"
    read: ["Revolution Heroes", "/american-history/young-learners/revolution-heroes/"]
    ask:
      - "Who was George Washington, and what was his job in the war?"
      - "How could a new army beat Britain, which had one of the strongest armies in the world?"
      - "Many colonists stayed loyal to Britain. What reasons might a Loyalist family have had?"
    do: "Make a timeline on the wall from 1754 to 1783. Each person adds three events with dates and a small drawing."
    A: [usyoung.george-washington, usyoung.revolution-heroes, usyoung.the-flag]
    B: [usyoung.revolution-heroes, ush1.war-begins, ush1.revolutionary-war]
    C: [ush1.war-begins, ush1.loyalists-patriots, ush1.revolutionary-war, ush1.treaty-of-paris-1783]
    D: [ush1.loyalists-patriots, ush1.revolutionary-war, ush1.treaty-of-paris-1783, ush1.cause-and-effect]
  - title: "A New Nation"
    read: ["A Plan for Government", "/american-history/young-learners/constitution-young/"]
    more: [["Harvard Classics: Washington's Dictum on Private Life", "/harvard-classics/april-30/"]]
    ask:
      - "After the war, the states needed rules for working together. What is a constitution?"
      - "Why did the Articles of Confederation not work well?"
      - "What changed for different groups of Americans after the Revolution, and what stayed the same?"
    do: "Write a family constitution: a short preamble saying what the family wants, and three rules everyone agrees to. Everyone signs."
    A: [usyoung.constitution-young, usyoung.three-branches-young, usyoung.good-citizens]
    B: [usyoung.constitution-young, ush1.articles-of-confederation, ush1.revolution-changes]
    C: [ush1.revolution-changes, ush1.articles-of-confederation, gov.articles-weaknesses]
    D: [ush1.revolution-changes, ush1.articles-of-confederation, ush1.shays-rebellion, gov.articles-weaknesses]
  - title: "Symbols of the New Nation"
    read: ["The Star-Spangled Banner", "/american-history/young-learners/star-spangled-banner/"]
    ask:
      - "What do the stars and stripes on the flag stand for?"
      - "Why do countries have symbols at all?"
      - "The anthem was written in a later war, in 1814. Why might a young country need songs and symbols to hold it together?"
    do: "Learn the first verse of the national anthem together and talk through the hard words. Then fold a flag the traditional way."
    A: [usyoung.the-flag, usyoung.bald-eagle, usyoung.star-spangled-banner]
    B: [usyoung.statue-of-liberty, usyoung.washington-dc, growing.flag-display]
    C: [growing.pledge-anthem, growing.flag-display, growing.flag-care]
    D: [growing.pledge-anthem, gov.preamble, rhet.kairos]
projects:
  A:
    t: "My Liberty Bell"
    do: "Make a Liberty Bell from a paper cup or cardboard, with the crack. Tell the family what the bell stands for."
    rubric: ["The bell is finished and shows the crack", "Says what the bell stands for", "Speaks clearly"]
  B:
    t: "Revolution newspaper"
    do: "Make a one-page newspaper from 1776 with a headline about the Declaration, a short news story, a drawing and an advertisement of the time."
    rubric: ["Headline and story about a real event", "At least three true facts", "Drawing and advertisement fit the time", "Neat and readable"]
  C:
    t: "Patriot and Loyalist letters"
    do: "Write two letters, one from a Patriot and one from a Loyalist, each explaining their choice to a friend. Use real events from the unit."
    rubric: ["Both letters give real reasons", "Each side is shown fairly", "Uses at least three real events", "Letter form and correct spelling"]
  D:
    t: "The Declaration as an argument"
    do: "Write a 2-3 page analysis of the Declaration as an argument: its premises, its evidence (the list of grievances) and its conclusion. How well does it persuade, and to whom was it written?"
    rubric: ["Lays out the argument's structure clearly", "Quotes the text and explains each quotation", "Considers the audience", "Organized and cited"]
