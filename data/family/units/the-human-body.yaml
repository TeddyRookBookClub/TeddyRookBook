# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-human-body
title: "The Human Body"
subject: science
icon: "🫀"
blurb: "The senses, bones and muscles, the heart and lungs, digestion, the brain and nerves, and how germs and the body's defenses work."
parts:
  - title: "Our Senses"
    read: ["Five Senses", "/biology/young-learners/five-senses/"]
    ask:
      - "Which sense do you use to know a lemon is sour?"
      - "How do your senses work together when you eat?"
      - "Your brain sometimes fills in what your senses miss. How might that fool us?"
    do: "Set up a senses table: a blindfold tasting of five safe foods, a 'mystery bag' to feel, and sounds to guess with eyes closed."
    A: [lifek.five-senses, lifek.observing, ydraw.draw-what-you-see]
    B: [lifek.five-senses, lifek.animal-senses, lifesci.nervous-system]
    C: [lifesci.nervous-system, lifesci.levels-of-organization, physsci.sound]
    D: [hsbio.neurons, hsbio.body-systems-hierarchy, physsci.color]
  - title: "Bones and Muscles"
    read: ["The Skeletal System", "/biology/life-science/skeletal-system/"]
    ask:
      - "Feel the bones in your hand. How many can you find?"
      - "Why do muscles work in pairs?"
      - "Bones are alive and change all your life. What helps keep them strong?"
    do: "Trace a family member on a big sheet of paper and draw in the main bones. Label the skull, ribs, spine, arm and leg bones."
    A: [lifek.body-parts, lifek.grow-change, k.compare-directly]
    B: [lifesci.skeletal-system, lifesci.muscular-system, g2.measure-length]
    C: [lifesci.skeletal-system, lifesci.muscular-system, physsci.levers]
    D: [lifesci.muscular-system, physsci.levers, phys1.torque, hsbio.atp]
  - title: "The Heart and Lungs"
    read: ["The Circulatory System", "/biology/life-science/circulatory-system/"]
    more: [["Harvard Classics: Pulse Aids Epochal Discoveries", "/harvard-classics/june-3/"]]
    ask:
      - "Put your hand on your chest. What do you feel, and what is it doing?"
      - "Why does your heart beat faster when you run?"
      - "William Harvey showed in 1628 that blood goes around in a circle. How did he reason it out without modern tools?"
    do: "Count pulses for 15 seconds at rest, then after a minute of jumping jacks. Multiply by four and make a family bar graph."
    A: [lifek.needs, k.count-to-100, k.more-fewer-same]
    B: [lifesci.circulatory-system, lifesci.respiratory-system, g3.scaled-graphs]
    C: [lifesci.circulatory-system, lifesci.respiratory-system, g6.mean]
    D: [hsbio.circulation, hsbio.gas-exchange, hsbio.feedback-loops, stat.compare-distributions]
  - title: "Digestion"
    read: ["The Digestive System", "/biology/life-science/digestive-system/"]
    ask:
      - "Where does your food go after you swallow it?"
      - "Why do we chew? What does saliva do?"
      - "The small intestine is long and folded. Why would more surface help?"
    do: "Model digestion: mash a cracker in a zip bag with a little water (the stomach), then squeeze it through an old stocking (the intestines)."
    A: [lifek.needs, young.chewing, young.wash-hands]
    B: [lifesci.digestive-system, lifesci.excretory-system, g3.elapsed-time]
    C: [lifesci.digestive-system, lifesci.excretory-system, lifesci.systems-together]
    D: [hsbio.digestion-absorption, hsbio.kidneys, hsbio.enzymes, hsbio.enzyme-conditions]
  - title: "Brain and Nerves"
    read: ["The Nervous System", "/biology/life-science/nervous-system/"]
    ask:
      - "What does your brain do while you sleep?"
      - "Catch a falling ruler. How fast did your nerves send the message?"
      - "Why are some actions, like pulling your hand from a hot stove, done before you even think?"
    do: "Ruler-drop test: one person drops a ruler, the other catches it. Record the distance and use a chart to turn it into reaction time."
    A: [lifek.five-senses, young.listening, k.compare-directly]
    B: [lifesci.nervous-system, g2.measure-length, g3.measure-half-quarter-inch]
    C: [lifesci.nervous-system, lifesci.systems-together, g6.median-mode]
    D: [hsbio.neurons, hsbio.feedback-loops, physsci.acceleration-intro, phys1.free-fall]
  - title: "Germs and Defenses"
    read: ["Harvard Classics: He Introduced the Germ", "/harvard-classics/september-28/"]
    more: [["Immune basics in Life Science", "/biology/life-science/immune-basics/"]]
    ask:
      - "Why do we wash our hands before we eat?"
      - "How does the body fight germs that get inside?"
      - "Before Pasteur, many doctors didn't believe tiny living things caused disease. What evidence changed their minds?"
    do: "Glitter germs: put a pinch of glitter on one person's hands, then shake hands around the family. See how far it spreads, then see how well soap and water get it off."
    A: [young.wash-hands, young.coughs-sneezes, lifek.living-nonliving]
    B: [lifesci.immune-basics, lifesci.bacteria, lifesci.viruses]
    C: [lifesci.bacteria, lifesci.viruses, lifesci.helpful-harmful-microbes, lifesci.immune-basics]
    D: [hsbio.immune-system, lifesci.bacteria-growth, hsbio.population-models, hsbio.hypotheses-experiments]
projects:
  A:
    t: "Me, inside and out"
    do: "On your traced body outline, glue paper shapes for the heart, lungs, stomach and brain. Point to each and say what it does."
    rubric: ["Four organs in about the right places", "Says what each one does", "Finished and shown to the family"]
  B:
    t: "Body systems booklet"
    do: "Make a six-page booklet, one page per system from the unit (senses, bones, muscles, heart and lungs, digestion, nerves), with a drawing and three facts each."
    rubric: ["Six systems covered", "Three accurate facts each", "Clear labeled drawings", "Neat and complete"]
  C:
    t: "How the systems work together"
    do: "Make a poster or slide show following one bite of food, or one breath of air, through the body, showing every system it touches."
    rubric: ["Follows the path in the right order", "Names each organ and system", "Explains how the systems depend on each other", "Clear and accurate"]
  D:
    t: "A lab report on exercise and heart rate"
    do: "Measure heart rate before and after three levels of exercise for several family members. Write a report with a hypothesis, data table, graph, and an explanation using what you learned about circulation and feedback."
    rubric: ["Clear hypothesis and method", "Data in a table and graph", "Explanation uses correct biology", "Discusses limits of the data"]
