# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-civil-war
title: "The Civil War"
subject: history
icon: "⚖️"
blurb: "Slavery and the road to war, Lincoln, the two sides, Gettysburg, emancipation, Clara Barton and the home front, and Reconstruction."
parts:
  - title: "Slavery and Freedom"
    read: ["Slavery and Freedom", "/american-history/young-learners/slavery-and-freedom/"]
    more: [["Freedom Heroes", "/american-history/young-learners/freedom-heroes/"]]
    ask:
      - "What does it mean to be free?"
      - "How did Frederick Douglass and Harriet Tubman work against slavery?"
      - "The Declaration said all men are created equal, yet slavery was legal in many states. How did abolitionists use the nation's own founding words?"
    do: "Read one short passage from Frederick Douglass's Narrative aloud (a grown-up chooses it first). Talk about why learning to read mattered so much to him."
    A: [usyoung.slavery-and-freedom, usyoung.freedom-heroes, usyoung.good-citizens]
    B: [usyoung.slavery-and-freedom, usyoung.freedom-heroes, ush1.abolition]
    C: [ush1.colonial-slavery, ush1.abolition, ush1.seneca-falls]
    D: [ush1.colonial-slavery, ush1.abolition, ush1.primary-secondary, ush1.sourcing-hipp]
  - title: "A House Divided"
    read: ["Abraham Lincoln", "/american-history/young-learners/abraham-lincoln/"]
    more: [["Harvard Classics: Oxford Corrects Lincoln's Mistake", "/harvard-classics/february-12/"]]
    ask:
      - "What was Abraham Lincoln like as a boy?"
      - "Why did Southern states leave the Union after Lincoln was elected in 1860?"
      - "Lincoln said a house divided against itself cannot stand. What did he mean, and was he right?"
    do: "Make a Lincoln log cabin from pretzel sticks or craft sticks. While you build, take turns telling stories from his life."
    A: [usyoung.abraham-lincoln, usyoung.presidents-day, usyoung.leaders-and-voting]
    B: [usyoung.abraham-lincoln, ush1.lincoln-and-1860, ush1.secession]
    C: [ush1.compromise-of-1850, ush1.kansas-nebraska, ush1.lincoln-and-1860, ush1.secession]
    D: [ush1.kansas-nebraska, ush1.dred-scott, ush1.lincoln-and-1860, ush1.secession]
  - title: "Two Sides"
    read: ["Two Sides in U.S. History I", "/american-history/us-history-1/two-sides/"]
    ask:
      - "Which states were in the Union and which in the Confederacy?"
      - "The North had more factories and railroads. Why didn't that end the war quickly?"
      - "Why did border states like Kentucky and Maryland matter so much to both sides?"
    do: "Color a map of the states in 1861: Union, Confederacy and border states. Count how many of each."
    A: [maps.states-of-us, maps.map-colors, k.compare-numerals]
    B: [usgeo.regions, usgeo.fifty-states, g2.picture-bar-graphs]
    C: [ush1.two-sides, usgeo.south-atlantic-states, g6.ratio-language]
    D: [ush1.two-sides, ush1.civil-war-battles, g7.random-samples]
  - title: "Gettysburg"
    read: ["The Gettysburg Address", "/american-history/us-history-1/gettysburg-address/"]
    more: [["Harvard Classics: Gettysburg by an Eyewitness", "/harvard-classics/july-3/"]]
    ask:
      - "Why do we remember the battle of Gettysburg?"
      - "Lincoln's speech was very short. Which words stay with you?"
      - "Lincoln called the war a test of whether a nation 'conceived in liberty' could last. What did he think the soldiers had died for?"
    do: "Each person learns one or two sentences of the Gettysburg Address. Together, recite the whole speech in order."
    A: [usyoung.abraham-lincoln, usyoung.memorial-veterans-day, fwr.telling-sentences]
    B: [ush1.civil-war-battles, ush1.gettysburg-address, fwr.commas-in-lists]
    C: [ush1.civil-war-battles, ush1.gettysburg-address, rhet.rhetorical-devices]
    D: [ush1.gettysburg-address, rhet.pathos, rhet.rhetorical-devices, rhet.analysis-intro]
  - title: "Emancipation and the Home Front"
    read: ["Clara Barton", "/american-history/young-learners/clara-barton/"]
    more: [["Harvard Classics: O Captain! My Captain!", "/harvard-classics/april-15/"]]
    ask:
      - "How did Clara Barton help soldiers?"
      - "What did the Emancipation Proclamation do, and what didn't it do?"
      - "How did the war change life for women, for freed people and for families at home?"
    do: "Put together a care package for someone who serves (a nursing home, a fire station, a neighbor in the military), and write a note to go with it."
    A: [usyoung.clara-barton, usyoung.community-helpers, young.thank-you-picture]
    B: [usyoung.clara-barton, ush1.emancipation, ush1.home-fronts]
    C: [ush1.emancipation, ush1.home-fronts, ush1.reconstruction-amendments]
    D: [ush1.emancipation, ush1.home-fronts, gov.equal-protection-civics, ush1.cause-and-effect]
  - title: "Reconstruction"
    read: ["Reconstruction in U.S. History I", "/american-history/us-history-1/presidential-reconstruction/"]
    ask:
      - "After the war, what did the country need to rebuild?"
      - "What did the 13th, 14th and 15th Amendments promise?"
      - "Why did many of the promises of Reconstruction go unkept for so long, and how were they finally pursued?"
    do: "Make a 'promises' chart: the three amendments in one column, and in the other, when each promise was fully kept in practice. Fill it in as you read."
    A: [usyoung.then-and-now, usyoung.rosa-parks-and-mlk, usyoung.good-citizens]
    B: [ush1.reconstruction-amendments, usyoung.rosa-parks-and-mlk, gov.voting-amendments]
    C: [ush1.presidential-reconstruction, ush1.congressional-reconstruction, ush1.reconstruction-amendments, ush1.end-of-reconstruction]
    D: [ush1.congressional-reconstruction, ush1.end-of-reconstruction, ush2.jim-crow-plessy, gov.voting-amendments]
projects:
  A:
    t: "A thank-you to a helper"
    do: "Draw a picture of Clara Barton or another helper from the unit and dictate a thank-you message to go with it."
    rubric: ["Picture shows the helper and what they did", "A message that says thank you and why", "Finished and shared"]
  B:
    t: "A Civil War timeline"
    do: "Make a timeline from 1850 to 1877 with at least eight events, each dated, with a sentence and a small picture."
    rubric: ["At least eight events, correctly dated", "A clear sentence for each", "In the right order", "Neat and readable"]
  C:
    t: "A soldier's or nurse's letters home"
    do: "Write three letters home from a soldier or nurse at different points in the war (1861, 1863, 1865). Use real places and events."
    rubric: ["Three letters at three points in the war", "Real events and places", "Shows how the writer's view changes", "Letter form and correct spelling"]
  D:
    t: "The Gettysburg Address, line by line"
    do: "Write a 2-3 page analysis of the Gettysburg Address: its occasion, its structure, its key words and its appeals. Compare it with Edward Everett's two-hour speech that day."
    rubric: ["Explains the occasion and audience", "Analyzes structure and word choice with quotations", "Compares with Everett fairly", "Organized and cited"]
