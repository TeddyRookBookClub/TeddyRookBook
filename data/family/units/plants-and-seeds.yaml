# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: plants-and-seeds
title: "Plants and Seeds"
subject: science
icon: "🌱"
blurb: "What plants need, roots, stems and leaves, how plants make food, flowers and pollinators, seeds and how they travel, and the plants we eat."
parts:
  - title: "What Plants Need"
    read: ["What Plants Need", "/biology/young-learners/plant-needs/"]
    more: [["Home Geography: What plants need to grow", "/homeschool/geography/home-geography/lesson-35/"]]
    ask:
      - "What does a plant need to live and grow?"
      - "How could we test whether a plant really needs light?"
      - "In a fair test, why do we change only one thing at a time?"
    do: "Start a bean test: plant beans in four cups. Give one cup no light, one no water, one no soil (wet paper towel), and one everything. Check them every day of the unit."
    A: [lifek.living-nonliving, lifek.needs, lifek.plant-needs]
    B: [lifek.plant-needs, lifek.grow-change, lifesci.fair-tests]
    C: [lifesci.characteristics-of-life, lifesci.fair-tests, lifesci.plant-growth-factors]
    D: [hsbio.hypotheses-experiments, hsbio.reading-data, lifesci.plant-growth-factors]
  - title: "Roots, Stems and Leaves"
    read: ["Parts of a Plant", "/biology/young-learners/plant-parts/"]
    ask:
      - "What does each part of a plant do?"
      - "How does water get from the roots to the top of a tall tree?"
      - "Why do leaves have tiny openings, and what is the trade-off of having them?"
    do: "Put a white carnation or a celery stalk in water with food coloring. Check it after a few hours and again the next day, then cut the stem to look inside."
    A: [lifek.plant-parts, lifek.roots, lifek.stems-leaves]
    B: [lifek.roots, lifek.stems-leaves, lifesci.plant-transport]
    C: [lifesci.plant-transport, lifesci.cell-parts, lifesci.plant-animal-cells]
    D: [lifesci.plant-transport, hsbio.water-properties, hsbio.osmosis-tonicity, hsbio.plant-homeostasis]
  - title: "How Plants Make Food"
    read: ["Plants Make Food", "/biology/young-learners/plants-make-food/"]
    more: [["Fairy-Land of Science: How a plant makes its own food", "/homeschool/science/fairy-land-of-science/lesson-20/"]]
    ask:
      - "Where does a plant get its food?"
      - "What goes into a leaf, and what comes out, when it makes sugar?"
      - "Most of a tree's mass comes from the air, not the soil. How can that be?"
    do: "Cover part of a leaf on a living plant with foil for three or four days. Then compare its color with the uncovered part."
    A: [lifek.plants-make-food, lifek.sun-energy, lifek.producers-consumers]
    B: [lifek.plants-make-food, lifek.sun-energy, lifesci.photosynthesis]
    C: [lifesci.photosynthesis, lifesci.cellular-respiration, lifesci.photo-resp-together]
    D: [hsbio.photosynthesis, hsbio.photosynthesis-factors, hsbio.cellular-respiration, hsbio.photo-resp-carbon]
  - title: "Flowers and Pollinators"
    read: ["Pollinators", "/biology/young-learners/pollinators/"]
    more: [["Fairy-Land of Science: Taking a flower apart", "/homeschool/science/fairy-land-of-science/lesson-21/"], ["Nature Study: The honey-bee", "/homeschool/nature-study/handbook-of-nature-study/lesson-103/"]]
    ask:
      - "Why do bees visit flowers?"
      - "What are the parts of a flower, and what does each do?"
      - "Why might a plant 'pay' a bee with nectar? What does each side get out of it?"
    do: "Take apart a large flower (a lily or tulip from the store works well). Lay out the parts on paper, label them, and look at the pollen with a magnifying glass."
    A: [lifek.flowers-fruits-seeds, lifek.pollinators, lifek.insects]
    B: [lifek.pollinators, lifesci.flowers-seeds, lifesci.species-interactions]
    C: [lifesci.flowers-seeds, lifesci.plant-groups, lifesci.species-interactions]
    D: [lifesci.flowers-seeds, hsbio.meiosis, hsbio.community-interactions]
  - title: "Seeds and How They Travel"
    read: ["Seeds Travel", "/biology/young-learners/seeds-travel/"]
    more: [["Fairy-Land of Science: Inside a seed", "/homeschool/science/fairy-land-of-science/lesson-19/"], ["Nature Study: The dandelion", "/homeschool/nature-study/handbook-of-nature-study/lesson-143/"]]
    ask:
      - "How do seeds get to new places?"
      - "Soak a bean overnight and open it. What is inside a seed?"
      - "Why might a plant make thousands of seeds when only a few will grow?"
    do: "Go on a seed hunt outside (or in the kitchen). Sort what you find by how it travels: wind, water, animals, or popping."
    A: [lifek.seeds-travel, lifek.seed-grows, k.sort-and-count]
    B: [lifek.seed-grows, lifek.plant-life-cycle, g2.picture-bar-graphs]
    C: [lifesci.flowers-seeds, lifesci.structural-adaptations, g6.dot-plots-histograms]
    D: [hsbio.natural-selection, hsbio.adaptation-in-action, stat.histograms-shape]
  - title: "Plants We Eat"
    read: ["Plants We Eat", "/biology/young-learners/plants-we-eat/"]
    more: [["Home Geography: Useful grains", "/homeschool/geography/home-geography/lesson-30/"], ["Food Garden Planner", "/garden/"]]
    ask:
      - "Which part of the plant is a carrot? A lettuce leaf? An apple?"
      - "Where in the world did corn, wheat and potatoes first come from?"
      - "Farmers have changed crops over thousands of years by choosing seeds. How is that like and unlike changing a plant's genes in a lab?"
    do: "Make a 'parts of the plant' salad or snack plate: roots (carrots), stems (celery), leaves (lettuce), flowers (broccoli), fruits (tomatoes) and seeds (sunflower seeds)."
    A: [lifek.plants-we-eat, lifek.plant-parts, lifek.plant-care]
    B: [lifek.plants-we-eat, lifek.plant-care, usyoung.three-sisters]
    C: [lifesci.breeding-engineering, ush1.columbian-exchange, humangeo.agricultural-hearths]
    D: [lifesci.breeding-engineering, hsbio.recombinant-dna, humangeo.agricultural-revolutions, humangeo.food-debates]
projects:
  A:
    t: "My bean diary"
    do: "Draw your bean plant every two days in a little book. A grown-up writes down what you say about how it changed."
    rubric: ["A drawing for each check", "Says what changed each time", "Uses plant words (root, stem, leaf)"]
  B:
    t: "The bean test report"
    do: "Write up the four-cup bean test: the question, what you did, a chart of heights by day, and what you found out."
    rubric: ["States the question and the one thing changed", "Measurements in a chart", "A conclusion that matches the results", "Neat and labeled"]
  C:
    t: "A plant field guide"
    do: "Make a field guide to eight plants near your home: a drawing or pressed leaf, its name, where it grows, and how its seeds travel."
    rubric: ["Eight plants, each correctly named", "Drawing or specimen for each", "Seed travel explained for each", "Organized like a real guide"]
  D:
    t: "Design your own experiment"
    do: "Plan and run an experiment on one plant growth factor (light color, salt in water, fertilizer amount). Write a lab report with hypothesis, method, data table, graph and conclusion."
    rubric: ["A testable hypothesis", "A fair method with one variable changed and a control", "Data in a table and a graph", "A conclusion that discusses error and next steps"]
