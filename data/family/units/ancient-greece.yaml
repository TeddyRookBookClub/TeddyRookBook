# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: ancient-greece
title: "Ancient Greece"
subject: history
icon: "🏛️"
blurb: "Myths and heroes, Homer's Odyssey, Sparta and Athens, the Persian Wars, Greek art and buildings, and the Greek words we still use."
parts:
  - title: "Gods, Myths and Heroes"
    read: ["Famous Men of Greece: The Gods of Greece", "/homeschool/history/famous-men-of-greece/lesson-1/"]
    more: [["Famous Men of Greece: Perseus", "/homeschool/history/famous-men-of-greece/lesson-5/"]]
    ask:
      - "Which Greek god or hero did you like best, and why?"
      - "Greek myths often explain something in nature. Which one did, and what did it explain?"
      - "Heroes like Hercules are strong but not always good. What did the Greeks seem to admire in a hero?"
    do: "Find Greece on a globe or map, with its many islands and the sea all around. Then act out one myth together, with simple props."
    A: [maps.globe, maps.find-continents, maps.island-peninsula]
    B: [maps.island-peninsula, worldgeo.countries-southern-europe, roots.word-parts]
    C: [worldgeo.countries-southern-europe, worldgeo.physical-europe, roots.latin-greek]
    D: [ah1.aegean, worldgeo.physical-europe, roots.latin-greek]
  - title: "Homer and the Odyssey"
    read: ["Famous Men of Greece: The Adventures of Ulysses (I)", "/homeschool/history/famous-men-of-greece/lesson-12/"]
    more: [["Harvard Classics: Odysseus Silenced the Sirens", "/harvard-classics/january-24/"], ["Harvard Classics: Trapped in a Cave with a Frenzied Giant", "/harvard-classics/july-22/"]]
    ask:
      - "How did Ulysses trick the Cyclops?"
      - "Ulysses is clever more than strong. Where did his cleverness help him, and where did it get him into trouble?"
      - "Why might a story about a long trip home matter so much to people who lived by the sea?"
    do: "Make a map of Ulysses' trip home on a big sheet: draw each adventure as a stop. Add a stop each day as the story goes on."
    A: [fwr.beginning-middle-end, fwr.characters-setting, maps.oceans]
    B: [fwr.characters-setting, fwr.problem-solution, roots.word-parts]
    C: [comp.narrative, ah1.aegean, roots.log-graph]
    D: [ah1.aegean, aegean.mycenaeans, aegean.evans-knossos, aegean.greek-alphabet]
  - title: "Sparta and Athens"
    read: ["Famous Men of Greece: Lycurgus", "/homeschool/history/famous-men-of-greece/lesson-15/"]
    more: [["Famous Men of Greece: Draco and Solon", "/homeschool/history/famous-men-of-greece/lesson-16/"]]
    ask:
      - "How was growing up in Sparta different from growing up in Athens?"
      - "Solon wrote laws for Athens. What makes a law fair?"
      - "Athens let many citizens vote but left out women, enslaved people and foreigners. How should we judge a people who began an idea but did not carry it all the way?"
    do: "Hold a family assembly the Athenian way: one question (what to cook Saturday), speeches for each side, then a vote with pebbles in two jars."
    A: [usyoung.why-rules, usyoung.rules-and-laws, usyoung.leaders-and-voting]
    B: [usyoung.rules-and-laws, usyoung.leaders-and-voting, roots.cracy-archy]
    C: [roots.cracy-archy, gov.forms-of-government, gov.models-of-democracy]
    D: [gov.forms-of-government, gov.models-of-democracy, gov.rule-of-law]
  - title: "Marathon and Thermopylae"
    read: ["Famous Men of Greece: Miltiades, the Hero of Marathon", "/homeschool/history/famous-men-of-greece/lesson-18/"]
    more: [["Famous Men of Greece: Leonidas at Thermopylae", "/homeschool/history/famous-men-of-greece/lesson-19/"], ["Harvard Classics: Citizens Lured from Their Homes", "/harvard-classics/september-24/"]]
    ask:
      - "Why did the small Greek cities fight the huge Persian Empire?"
      - "Why do we still call a long race a marathon?"
      - "The Greeks won by working together, then Athens and Sparta fought each other. Why is it hard for allies to stay friends after a war?"
    do: "Measure out a short 'marathon' course in your yard or a park and time each person. Then work out how many of your laps make 26 miles."
    A: [k.count-to-20, k.compare-numerals, maps.cardinal-directions]
    B: [g3.round-10-100, g4.convert-units, maps.map-scale]
    C: [worldgeo.countries-southwest-asia, worldgeo.map-scale, g6.unit-rate-problems]
    D: [worldgeo.countries-southwest-asia, ah1.parthenon, humangeo.boundary-types]
  - title: "Greek Art and Buildings"
    read: ["Greek Vases", "/art/art-history-1/greek-vases/"]
    more: [["Famous Men of Greece: Pericles", "/homeschool/history/famous-men-of-greece/lesson-23/"], ["Harvard Classics: Athenians Also Complained of Taxes", "/harvard-classics/july-13/"]]
    ask:
      - "What pictures did the Greeks paint on their pots?"
      - "Find a column on a building near you. Is it plain, scrolled or leafy, like a Greek order?"
      - "Greek statues grew more lifelike over time. What changed, and why might artists have wanted that?"
    do: "Draw a Greek vase shape on orange paper and paint a scene from your own family's week on it in black, the way Greek painters showed everyday life and myths."
    A: [ydraw.basic-shapes, ydraw.repeating-patterns, ydraw.symmetry]
    B: [ydraw.symmetry, draw.shapes-to-forms, design.pattern]
    C: [ah1.greek-vases, ah1.greek-orders, design.balance-principle]
    D: [ah1.greek-orders, ah1.parthenon, ah1.greek-sculpture, ah1.contrapposto-hellenistic]
  - title: "Thinkers and Alexander"
    read: ["Famous Men of Greece: Socrates", "/homeschool/history/famous-men-of-greece/lesson-26/"]
    more: [["Famous Men of Greece: Alexander the Great", "/homeschool/history/famous-men-of-greece/lesson-30/"], ["Harvard Classics: An Honest Life's Reward", "/harvard-classics/may-17/"]]
    ask:
      - "Socrates taught by asking questions. What is a good question to ask about something everyone thinks they know?"
      - "Alexander built a huge empire very fast. Why did it split apart after he died?"
      - "Socrates said the unexamined life is not worth living. What do you think he meant, and do you agree?"
    do: "Play the question game at dinner: one person states something everyone believes, and the others may only ask questions, never argue, for five minutes."
    A: [young.listening, young.waiting-to-talk, ydraw.kinds-of-pictures]
    B: [roots.chron-temp, roots.path-phil, informal.statements]
    C: [roots.path-phil, informal.arguments, trad.three-acts]
    D: [trad.three-acts, trad.syllogism-parts, informal.charity]
projects:
  A:
    t: "My hero mask"
    do: "Make a paper-plate mask of a Greek god or hero and tell the family that hero's story while wearing it."
    rubric: ["The mask shows who the hero is (a tool or symbol)", "Tells the story with a beginning, middle and end", "Speaks clearly to the family"]
  B:
    t: "An Odyssey comic"
    do: "Draw a six-panel comic of one adventure from the Odyssey, with speech bubbles and a caption for each panel."
    rubric: ["Six panels in the right order", "Captions tell what happens", "Characters and places match the story", "Neat, readable lettering"]
  C:
    t: "Athens or Sparta? A comparison chart and speech"
    do: "Make a chart comparing Athens and Sparta (government, schooling, army, daily life). Then give a two-minute speech on which city you would rather have grown up in, and why."
    rubric: ["At least four points of comparison", "Facts are accurate", "Speech gives clear reasons", "Speaks clearly and keeps to time"]
  D:
    t: "A Socratic dialogue"
    do: "Write a short dialogue (2-3 pages) in which Socrates questions someone about a big word such as courage, fairness or friendship. Show how the questions test each answer."
    rubric: ["The question is clear from the start", "Each answer is tested by a fair question", "The reasoning is easy to follow", "Ends with what was learned, even if the question stays open"]
