# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: ancient-rome
title: "Ancient Rome"
subject: history
icon: "🦅"
blurb: "Romulus and the early kings, the Republic, roads and aqueducts, Caesar and Augustus, Pompeii, and the Latin under our own words."
parts:
  - title: "The Founding of Rome"
    read: ["Famous Men of Rome: Romulus, part 1", "/homeschool/history/famous-men-of-rome/lesson-1/"]
    more: [["The Roman Story, part 1 (infographic)", "/infographics/roman-story-1-kingdom-and-republic/"]]
    ask:
      - "Who were Romulus and Remus, and what does the story say happened to them as babies?"
      - "Rome was built on seven hills by a river. Why was that a good place for a city?"
      - "Romans told this story about their own beginning. What does it say about how they wanted to see themselves?"
    do: "Find Italy on a map: the boot, the Tiber River and Rome. Then build seven hills from clay or play dough and set a small city among them."
    A: [maps.find-continents, maps.land-and-water, maps.mountains-hills-valleys]
    B: [maps.river-parts, worldgeo.countries-southern-europe, roots.latin-greek]
    C: [worldgeo.capitals-southern-europe, worldgeo.physical-europe, roots.latin-greek]
    D: [worldgeo.physical-europe, humangeo.city-site-situation, roots.latin-greek]
  - title: "The Republic"
    read: ["Famous Men of Rome: Cincinnatus", "/homeschool/history/famous-men-of-rome/lesson-12/"]
    more: [["Famous Men of Rome: Junius Brutus", "/homeschool/history/famous-men-of-rome/lesson-7/"], ["Harvard Classics: Refused to Serve Three Terms", "/harvard-classics/september-15/"]]
    ask:
      - "Cincinnatus went back to his farm after he saved Rome. Why do people still admire that?"
      - "The Romans had two consuls instead of one king. Why would they want two?"
      - "George Washington was called a modern Cincinnatus. Which choices of his fit that name?"
    do: "Make a family Senate: elect two 'consuls' for the week who share one job (choosing the read-aloud time). At the end of the week, they give it up."
    A: [usyoung.why-rules, usyoung.leaders-and-voting, usyoung.george-washington]
    B: [usyoung.leaders-and-voting, usyoung.three-branches-young, roots.con-syn]
    C: [gov.forms-of-government, gov.separation-of-powers, roots.cracy-archy]
    D: [gov.forms-of-government, gov.separation-of-powers, gov.checks-and-balances, gov.english-roots]
  - title: "Roads, Aqueducts and Arches"
    read: ["Famous Men of Rome: Appius Claudius, part 1", "/homeschool/history/famous-men-of-rome/lesson-17/"]
    more: [["Roman Architecture in Art History", "/art/art-history-1/roman-architecture/"]]
    ask:
      - "How did Romans bring water into their city?"
      - "Why does an arch hold up so much weight?"
      - "Roman roads helped trade and travel, and also moved armies. Can a good invention serve both peace and war?"
    do: "Build an arch from sugar cubes or blocks over a curved support, then take the support away. Try it without a keystone and see what happens."
    A: [k.name-shapes, k.position-words, ydraw.basic-shapes]
    B: [g3.perimeter, g4.measure-angles, g4.convert-units]
    C: [g7.circumference, g6.unit-rate, ah1.roman-architecture]
    D: [ah1.roman-architecture, physsci.forces-intro, physsci.net-force]
  - title: "Hannibal and the Punic Wars"
    read: ["Famous Men of Rome: Scipio Africanus, part 1", "/homeschool/history/famous-men-of-rome/lesson-20/"]
    more: [["Famous Men of Rome: Regulus", "/homeschool/history/famous-men-of-rome/lesson-19/"]]
    ask:
      - "How did Hannibal get his army and elephants over the Alps?"
      - "Rome lost big battles to Hannibal but still won the war. How?"
      - "Regulus kept a promise to his enemies even though it cost him his life. Was he right?"
    do: "On a big map of the Mediterranean, trace Hannibal's march from Spain over the Alps into Italy. Measure it with the map scale."
    A: [maps.map-scale, maps.routes, maps.mountains-hills-valleys]
    B: [maps.map-scale, maps.routes, worldgeo.physical-africa]
    C: [worldgeo.countries-north-africa, worldgeo.map-scale, worldgeo.physical-europe]
    D: [worldgeo.countries-north-africa, worldgeo.straits-canals, informal.causal-reasoning]
  - title: "Caesar and Augustus"
    read: ["Famous Men of Rome: Julius Caesar, part 2", "/homeschool/history/famous-men-of-rome/lesson-30/"]
    more: [["Harvard Classics: Beware the Ides of March!", "/harvard-classics/march-15/"], ["Famous Men of Rome: Augustus, part 2", "/homeschool/history/famous-men-of-rome/lesson-34/"]]
    ask:
      - "What does 'crossing the Rubicon' mean today?"
      - "The months July and August are named for Julius Caesar and Augustus. Why would the Romans honor them that way?"
      - "Rome went from a republic to rule by an emperor. Why might citizens accept losing some of their say in exchange for peace?"
    do: "Make a calendar page for July and August with Roman numerals for the dates. Practice reading the numerals out loud."
    A: [k.numerals-0-10, k.count-to-20, g1.count-to-120]
    B: [g3.round-10-100, g2.number-forms, roots.numbers]
    C: [roots.numbers, roots.chron-temp, gov.forms-of-government]
    D: [gov.rule-of-law, gov.forms-of-government, rhet.ethos]
  - title: "Pompeii and the End of the West"
    read: ["Harvard Classics: Survivor's Story of Vesuvius", "/harvard-classics/august-24/"]
    more: [["Famous Men of Rome: The end of the Western Empire", "/homeschool/history/famous-men-of-rome/lesson-42/"], ["The Roman Story, part 2 (infographic)", "/infographics/roman-story-2-the-empire/"]]
    ask:
      - "What happened to the town of Pompeii in AD 79?"
      - "Pliny wrote a letter about what he saw. Why is an eyewitness letter so useful to historians?"
      - "Historians still argue about why the Western Empire fell. Which causes seem strongest to you, and what would you need to know to be sure?"
    do: "Make a volcano from a bottle, clay and baking soda with vinegar. Then talk about why ash buried the town so quickly and kept it for us to find."
    A: [earthsci.volcanoes, lifek.grow-change, usyoung.then-and-now]
    B: [earthsci.volcanoes, earthsci.earth-layers, roots.ex-in]
    C: [earthsci.volcanoes, earthsci.plate-boundaries, comp.evidence-types]
    D: [geology.eruption-styles, geology.volcanic-hazards, comp.source-credibility]
projects:
  A:
    t: "My Roman shield"
    do: "Decorate a cardboard shield with an eagle or another Roman symbol and the Roman numerals for your age. Show it and tell one thing about Rome."
    rubric: ["The shield has a Roman symbol", "The Roman numeral for your age is right", "Tells one true thing about Rome"]
  B:
    t: "Build a Roman invention"
    do: "Build a model of an arch, a road in layers, or an aqueduct that carries water downhill. Write five sentences on how it works."
    rubric: ["The model works or shows the idea clearly", "Five sentences explain it", "Uses at least two words from the unit (arch, keystone, aqueduct)", "Neat and finished"]
  C:
    t: "Letter from Rome"
    do: "Write a letter, as a Roman child, to a cousin far away. Describe one big event (Hannibal's march, Caesar crossing the Rubicon, Vesuvius) as if you saw it."
    rubric: ["Letter form: date, greeting, closing", "The event is told accurately", "Includes three real details of Roman life", "Clear sentences and correct spelling"]
  D:
    t: "Why did the Western Empire fall? A short essay"
    do: "Write a 2-3 page essay weighing three causes historians give for the fall of the Western Empire. Say which you find strongest and why, and give the other views fairly."
    rubric: ["A clear, defensible thesis", "Three causes explained with evidence", "Other views given fairly", "Sources cited"]
