# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: fractions-in-the-kitchen
title: "Fractions in the Kitchen"
subject: math
icon: "🥣"
blurb: "Halves and quarters, measuring cups, doubling and halving recipes, ratios, percents on labels and planning a week of meals, cooking from the Meal Prep recipes."
parts:
  - title: "Halves, Thirds and Quarters"
    read: ["Equal Shares", "/math/grade-2/equal-shares/"]
    more: [["Meal Prep: Sheet-pan pizza", "/meal-prep/recipes/sheet-pan-pizza/"]]
    ask:
      - "If we cut a pizza into four equal pieces, what is each piece called?"
      - "Which is bigger, one half or one quarter? Why does the bigger number give the smaller piece?"
      - "Can two halves be different shapes and still be halves?"
    do: "Make the sheet-pan pizza together and cut it into halves, then quarters, then eighths, naming each fraction as you go."
    A: [g1.halves-fourths, k.name-shapes, g2.equal-shares]
    B: [g3.equal-parts, g3.unit-fractions, g3.compare-same-numerator]
    C: [g4.equivalent-fractions-multiply, g4.simplest-form, g4.compare-fractions]
    D: [g6.divide-fractions-meaning, g7.fractions-to-decimals, alg1.equations-fractions-decimals]
  - title: "Measuring Cups and Spoons"
    read: ["Meal Prep: Pancakes", "/meal-prep/recipes/pancakes/"]
    more: [["Meal Prep: Pancake mix from scratch", "/meal-prep/scratch/pancake-mix/"]]
    ask:
      - "Which cup is bigger, the 1/2 cup or the 1/3 cup?"
      - "How can you measure 3/4 cup with only a 1/4 cup?"
      - "How many tablespoons are in a cup, and how could you figure it out with water?"
    do: "Make pancakes from scratch. Let each child measure one ingredient, saying its fraction out loud, and check with a different cup."
    A: [g1.halves-fourths, k.count-to-10, k.compare-directly]
    B: [g3.build-fractions, g3.fractions-number-line, g4.decompose-fractions]
    C: [g4.add-like-fractions, g5.add-unlike-fractions, g5.unlike-mixed-numbers]
    D: [g5.add-unlike-fractions, g6.convert-units-ratios, chem.dimensional-analysis]
  - title: "Doubling and Halving a Recipe"
    read: ["Meal Prep: Banana muffins", "/meal-prep/recipes/banana-muffins/"]
    ask:
      - "If the recipe makes 12 muffins and we want 24, what do we do?"
      - "What is half of 3/4 cup? How about double 2/3 cup?"
      - "Some things don't scale simply, like baking time or a single egg. Why not?"
    do: "Bake banana muffins at one and a half times the recipe. Write the new amount for every ingredient before you start."
    A: [k.put-together, g1.doubles-near-doubles, g2.even-odd]
    B: [g4.fraction-times-whole, g3.equivalent-fractions-models, g4.mixed-numbers]
    C: [g5.multiply-fractions, g5.multiply-mixed-numbers, g5.multiplication-as-scaling]
    D: [g7.proportional-equations, g7.solve-proportions, geo.scaling-solids]
  - title: "Ratios and Recipes"
    read: ["Meal Prep: Overnight oats", "/meal-prep/recipes/overnight-oats/"]
    more: [["Meal Prep: Vinaigrette", "/meal-prep/scratch/vinaigrette/"]]
    ask:
      - "For every cup of oats we use one cup of milk. What if we use three cups of oats?"
      - "A salad dressing is 3 parts oil to 1 part vinegar. How much of each makes one cup?"
      - "Why do bakers often weigh ingredients and think in ratios instead of cups?"
    do: "Make overnight oats in jars, one per person, with each jar the same ratio but a different size. Check that they taste the same."
    A: [k.count-out, k.one-more, g1.add-in-any-order]
    B: [g3.equal-groups, g3.arrays-multiplication, g4.times-as-many]
    C: [g6.ratio-language, g6.equivalent-ratios, g6.unit-rate]
    D: [g7.proportional-tables, g7.constant-of-proportionality, chem.percent-composition]
  - title: "Percents on the Label"
    read: ["Percent Meaning", "/math/grade-6/percent-meaning/"]
    more: [["Meal Prep: Guides", "/meal-prep/guides/"]]
    ask:
      - "Find a number with a % sign on a box in the pantry. What does it mean?"
      - "If a serving is 1/4 of the box, how many servings are in the box?"
      - "Labels use a 'daily value' based on a typical diet. Why might that number fit some people better than others?"
    do: "Read five labels from the pantry together. Line them up by serving size and by one number you choose (like fiber), and make a chart."
    A: [k.sort-and-count, k.compare-numerals, g1.data-three-groups]
    B: [g4.tenths-hundredths, g4.decimal-notation, g2.picture-bar-graphs]
    C: [g6.percent-meaning, g6.percent-of-a-number, g6.find-the-whole]
    D: [g7.percent-change, g7.markup-discount-tax, stat.categorical-displays]
  - title: "Planning a Week of Meals"
    read: ["Meal Prep: The meal planner", "/meal-prep/plan/"]
    ask:
      - "What should we have for dinner this week?"
      - "How much will the food for the week cost, and how can we spend less?"
      - "How do you plan meals that are healthy, cheap and quick, when those goals pull against each other?"
    do: "Plan a week of dinners together with the Meal Prep planner. Each child chooses one meal, makes the shopping list for it and helps cook it."
    A: [g2.coin-values, g2.count-money, k.count-to-20]
    B: [g2.money-word-problems, g4.multistep-word-problems, g5.decimal-word-problems]
    C: [g5.decimal-word-problems, g6.unit-rate-problems, g7.markup-discount-tax]
    D: [g7.markup-discount-tax, g7.simple-interest, micro.budget-constraint, micro.opportunity-cost]
projects:
  A:
    t: "My fraction snack"
    do: "Make a snack plate cut into halves and quarters (a sandwich, an apple, a tortilla). Show the family each fraction and share it fairly."
    rubric: ["Pieces cut into equal parts", "Names halves and quarters correctly", "Shares fairly"]
  B:
    t: "A family recipe card, doubled"
    do: "Copy a family recipe neatly onto a card, then write a second card with every amount doubled and a third with every amount halved."
    rubric: ["Three cards, neatly written", "Doubled amounts correct", "Halved amounts correct", "Units written for each amount"]
  C:
    t: "Cook for the family"
    do: "Choose a Meal Prep recipe, scale it to feed the family exactly, make the shopping list with prices, and cook it with a grown-up. Show your math on one page."
    rubric: ["Scaling math correct and shown", "Shopping list with prices and a total", "The meal is cooked and served", "Clean, organized page"]
  D:
    t: "A cost-per-serving study"
    do: "Compare three ways to make one dish (from scratch, from a mix, ready-made). Work out the cost per serving and time per serving, make a table and graph, and write up which you would choose and why."
    rubric: ["Real prices with sources", "Correct unit-cost calculations", "A clear table and graph", "A reasoned recommendation"]
