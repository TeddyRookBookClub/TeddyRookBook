# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: poetry
title: "Poetry"
subject: language
icon: "🪶"
blurb: "Rhythm and rhyme, pictures in words, nature poems, story poems, poems about people, and writing and reciting your own."
parts:
  - title: "Rhythm and Rhyme"
    read: ["Home Geography: What the winds bring (poem)", "/homeschool/geography/home-geography/lesson-6/"]
    ask:
      - "Which words in the poem rhyme?"
      - "Clap the beat of one line. Where do the strong beats fall?"
      - "Why do so many old poems rhyme, and why do many newer ones not?"
    do: "Rhyme chain: one person says a word, and everyone takes turns with a rhyme until someone gets stuck. Then clap the rhythm of a nursery rhyme."
    A: [fwr.short-vowels, fwr.word-endings, fwr.digraphs]
    B: [fwr.vowel-teams, fwr.silent-e, gram.parts-of-speech]
    C: [gram.parts-of-speech, rhet.figures-of-speech, adv.happy]
    D: [rhet.figures-of-speech, rhet.sentence-variety, rhet.diction]
  - title: "Pictures in Words"
    read: ["Harvard Classics: Nature Guided His Pen (Wordsworth)", "/harvard-classics/april-7/"]
    ask:
      - "What picture did you see in your mind as you listened?"
      - "Find a simile (like or as) or a metaphor. What two things does it compare?"
      - "Why might a poet say something is something else instead of saying it plainly?"
    do: "Go outside for ten quiet minutes. Each person writes or says five 'picture' lines about what they see, hear and feel."
    A: [fwr.adjectives, fwr.five-senses, fwr.expand-sentences]
    B: [fwr.adjectives, gram.adjectives, gram.adverbs]
    C: [comp.descriptive, comp.show-dont-tell, rhet.figures-of-speech]
    D: [rhet.figures-of-speech, rhet.diction, rhet.tone]
  - title: "Nature Poems"
    read: ["Home Geography: The brook (poem)", "/homeschool/geography/home-geography/lesson-20/"]
    more: [["Harvard Classics: A Field Mouse Made Famous (Burns)", "/harvard-classics/january-25/"]]
    ask:
      - "What does the brook say about itself?"
      - "How does the poet make the sound of water in the words?"
      - "Burns wrote to a mouse whose nest he had plowed up. What larger point does he make about plans?"
    do: "Read the poem aloud as a family, each person taking a line, with sound effects (a pan of water, rustling paper). Record it."
    A: [lifek.water-habitats, maps.river-parts, fwr.adjectives]
    B: [maps.river-parts, gram.action-linking-verbs, fwr.time-words]
    C: [comp.descriptive, rhet.figures-of-speech, rhet.tone]
    D: [rhet.figures-of-speech, rhet.tone, rhet.choices-effects]
  - title: "Story Poems"
    read: ["Harvard Classics: How the Glorious News was Carried to Aix (Browning)", "/harvard-classics/december-12/"]
    more: [["Harvard Classics: O Captain! My Captain! (Whitman)", "/harvard-classics/april-15/"]]
    ask:
      - "What happens in the poem? Tell it back in order."
      - "How does the rhythm sound like galloping horses?"
      - "Whitman never names Lincoln in 'O Captain! My Captain!' How do we know who it is about?"
    do: "Act out a story poem: one narrator, the rest acting it in mime. Swap parts and do it again."
    A: [fwr.beginning-middle-end, fwr.time-words, fwr.characters-setting]
    B: [fwr.beginning-middle-end, fwr.characters-setting, comp.narrative]
    C: [comp.narrative, comp.paragraph-order, rhet.rhetorical-devices]
    D: [rhet.analysis-intro, rhet.choices-effects, rhet.rhetorical-devices]
  - title: "Poems About People"
    read: ["Harvard Classics: Maud Muller (Whittier)", "/harvard-classics/september-17/"]
    more: [["Harvard Classics: A Psalm of Life and other poems (Longfellow)", "/harvard-classics/february-27/"]]
    ask:
      - "Who is the poem about? What do we learn about them?"
      - "What words does the poet choose to show how the person feels?"
      - "Can a short poem tell us as much about a person as a long biography? Why or why not?"
    do: "Each person writes or dictates a short poem about another family member: three things they do and one thing they love. Read them at dinner."
    A: [fwr.nouns, fwr.verbs, fwr.capital-names]
    B: [fwr.pronouns, gram.nouns, gram.personal-pronouns]
    C: [comp.descriptive, rhet.tone, rhet.diction]
    D: [rhet.tone, rhet.diction, rhet.analysis-thesis]
  - title: "Writing and Reciting"
    read: ["Home Geography: Spring (poem)", "/homeschool/geography/home-geography/lesson-28/"]
    ask:
      - "Which poem from this unit do you want to learn by heart?"
      - "What makes a poem easy to remember?"
      - "Why did people once learn so many poems by heart? Is it still worth doing?"
    do: "Hold a family poetry night: each person recites a poem from memory and reads one they wrote. Serve a special snack."
    A: [hand.neat-copy, fwr.check-your-work, fwr.capital-start]
    B: [hand.cursive-sentences, comp.writing-process, fwr.fix-it]
    C: [comp.writing-process, comp.revision, comp.editing]
    D: [comp.revision, rhet.concision, rhet.classic-advice]
projects:
  A:
    t: "My poem, illustrated"
    do: "Learn a short poem by heart. Draw a picture for it, and say it for the family on poetry night."
    rubric: ["Says the poem from memory", "A picture that fits the poem", "Speaks clearly and slowly"]
  B:
    t: "A small book of poems"
    do: "Write four poems of your own (one rhyming, one about nature, one about a person, one of your choice). Copy them neatly into a little book with drawings."
    rubric: ["Four finished poems", "At least one uses rhyme well", "Uses picture words", "Neat handwriting and drawings"]
  C:
    t: "Poetry anthology"
    do: "Collect ten favorite poems (from the unit and elsewhere) into an anthology. For each, write a short note on why you chose it and one thing the poet does well. Add two of your own."
    rubric: ["Ten poems with sources", "A thoughtful note for each", "Two original poems", "Organized with a table of contents"]
  D:
    t: "Close reading essay"
    do: "Choose one poem from the unit. Write a 2-3 page close reading: what the poem says, how its sound, images and structure work, and what it means. Recite it on poetry night."
    rubric: ["A clear thesis about the poem", "Analysis of sound, imagery and structure with quotations", "Interpretation supported by the text", "Recited from memory"]
