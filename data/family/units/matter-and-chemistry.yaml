# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: matter-and-chemistry
title: "Matter and Chemistry Basics"
subject: science
icon: "🧪"
blurb: "Solids, liquids and gases, measuring matter, mixtures and solutions, atoms and elements, and changes you can see in the kitchen."
parts:
  - title: "Solids, Liquids and Gases"
    read: ["Fairy-Land of Science: Solids, liquids, gases", "/homeschool/science/fairy-land-of-science/lesson-3/"]
    more: [["Gas in a Box (Science Lab)", "/science-lab/gas/"]]
    ask:
      - "Is water a solid, a liquid or a gas? Can it be all three?"
      - "What happens to the tiny particles in ice as it melts?"
      - "Why does a gas fill any container you put it in, but a liquid doesn't?"
    do: "Freeze a cup of water and mark the top. When it's frozen, look again: did it grow or shrink? Then let it melt and boil a little in a pot with a grown-up, watching the steam."
    A: [k.describe-attributes, k.sort-and-count, lifek.living-nonliving]
    B: [g3.mass-and-liquid-volume, g4.convert-units, physsci.phase-changes]
    C: [chem.states-of-matter, physsci.phase-changes, chem.matter-classification]
    D: [chem.states-of-matter, chem.kinetic-molecular-theory, chem.heating-curves]
  - title: "Measuring Matter"
    read: ["Measuring in the Chemistry Ladder", "/chemistry/chemistry/si-prefixes/"]
    ask:
      - "Which is heavier, a cup of rice or a cup of popcorn?"
      - "Why do scientists all use the same units?"
      - "Why does a big log float but a small stone sinks?"
    do: "Density tower: in a tall clear glass, slowly pour honey, dish soap, water with food coloring and cooking oil. Drop in a grape, a coin and a cork and see where each stops."
    A: [k.compare-directly, k.describe-attributes, g1.measure-with-units]
    B: [g3.mass-and-liquid-volume, g4.convert-units, g5.convert-units-multistep]
    C: [chem.si-prefixes, chem.density, g6.unit-rate]
    D: [chem.si-prefixes, chem.dimensional-analysis, chem.density, chem.significant-figures]
  - title: "Mixtures and Solutions"
    read: ["Dissolving in the Chemistry Ladder", "/chemistry/chemistry/dissolving/"]
    ask:
      - "Where does sugar go when you stir it into water?"
      - "Can you get salt back out of salt water? How?"
      - "Why does more sugar dissolve in hot tea than in iced tea?"
    do: "Grow crystals: dissolve as much salt or sugar as you can in warm water, hang a string in it, and check it every day for a week."
    A: [k.sort-and-count, k.describe-attributes, k.more-fewer-same]
    B: [physsci.phase-changes, g3.mass-and-liquid-volume, g4.line-plots-fraction-data]
    C: [chem.matter-classification, chem.dissolving, chem.solubility-curves]
    D: [chem.dissolving, chem.solubility-curves, chem.molarity, chem.dilution]
  - title: "Atoms and Elements"
    read: ["The Elements (Science Lab)", "/science-lab/elements/"]
    more: [["Build an Atom (Science Lab)", "/science-lab/atom/"]]
    ask:
      - "Everything is made of tiny pieces. What are they called?"
      - "What are an atom's three main parts?"
      - "How can just over a hundred elements make every substance in the world?"
    do: "Build atoms from candy or clay: one color for protons, one for neutrons, one for electrons. Make hydrogen, helium and carbon, and check them in Build an Atom."
    A: [k.count-to-10, k.how-many, k.count-to-20]
    B: [physsci.charges-in-atoms, g4.large-numbers, g5.powers-of-ten]
    C: [physsci.charges-in-atoms, chem.atomic-models, chem.subatomic-particles, chem.periodic-table-organization]
    D: [chem.subatomic-particles, chem.isotopes, chem.electron-shells, chem.valence-electrons]
  - title: "Physical and Chemical Changes"
    read: ["Physical and Chemical Changes", "/chemistry/chemistry/physical-chemical-changes/"]
    more: [["Mixing Lab (Science Lab)", "/science-lab/chem-lab/"]]
    ask:
      - "When you bake a cake, can you get the eggs back out?"
      - "How can you tell that a new substance was made?"
      - "Is dissolving sugar a chemical change? Argue both sides, then decide."
    do: "Mix baking soda and vinegar in a bottle with a balloon over the top. Watch the balloon fill, then talk about what gas was made."
    A: [k.describe-attributes, k.sort-and-count, k.compare-directly]
    B: [physsci.phase-changes, g3.elapsed-time, g2.picture-bar-graphs]
    C: [chem.physical-chemical-changes, chem.conservation-of-mass, chem.reaction-types]
    D: [chem.conservation-of-mass, chem.balancing-equations, chem.reaction-types, chem.exo-endo]
  - title: "Chemistry in the Kitchen"
    read: ["The Chemical History of a Candle: What candles are made of", "/homeschool/science/chemical-history-of-a-candle/lesson-1/"]
    more: [["Acids and bases in the Chemistry Ladder", "/chemistry/chemistry/acid-base-definitions/"]]
    ask:
      - "Which foods taste sour? What makes them sour?"
      - "Why does a cut apple turn brown, and why does lemon juice slow it down?"
      - "Faraday gave his candle lectures to young people in 1860. Why did he think a candle could teach all of chemistry?"
    do: "Make a red cabbage indicator: chop red cabbage, soak it in hot water, and strain. Add a spoonful to lemon juice, vinegar, water, and baking soda water, and line up the colors."
    A: [k.sort-and-count, k.describe-attributes, k.more-fewer-same]
    B: [g2.picture-bar-graphs, g3.scaled-graphs, physsci.phase-changes]
    C: [chem.acid-base-definitions, chem.ph-scale, chem.neutralization]
    D: [chem.acid-base-definitions, chem.ph-scale, chem.strong-weak-acids, chem.neutralization]
projects:
  A:
    t: "Solid, liquid or gas?"
    do: "Make a three-column poster with pictures (drawn or cut out) of solids, liquids and gases from your home. Tell the family about one in each column."
    rubric: ["Pictures in all three columns", "Each picture is in the right column", "Explains one in each"]
  B:
    t: "Crystal growing journal"
    do: "Grow crystals from two different solutions (salt and sugar). Measure and draw them every two days and write what was different."
    rubric: ["Regular dated measurements", "Drawings of both crystals", "Compares the two clearly", "Neat and complete"]
  C:
    t: "Kitchen chemistry demonstration"
    do: "Choose a kitchen experiment (cabbage indicator, baking soda reaction, density tower). Present it to the family with a poster explaining the science."
    rubric: ["The experiment works", "The poster explains the science correctly", "Uses at least four science words correctly", "Clear presentation"]
  D:
    t: "Quantitative lab report"
    do: "Measure how much gas (by balloon size or mass lost) different amounts of baking soda make with the same vinegar. Find the limiting reactant and write a lab report with a graph."
    rubric: ["Measurements with units and repeated trials", "A graph of the results", "Correctly identifies and explains the limiting reactant", "Discusses error"]
