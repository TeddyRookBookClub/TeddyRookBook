# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: citizenship
title: "Citizenship"
subject: geography
icon: "🗳️"
blurb: "Rules and helpers, rights and duties, voting, local government, how someone becomes a citizen, and serving the community."
parts:
  - title: "Rules and Helpers"
    read: ["Community Helpers", "/american-history/young-learners/community-helpers/"]
    ask:
      - "Who helps keep our town running?"
      - "What would happen if nobody followed the rules of the road?"
      - "Is it ever right to break a rule? What would make it right?"
    do: "Visit or write to a community helper (a librarian, a mail carrier, a firefighter). Ask what their job is like, and thank them."
    A: [usyoung.community-helpers, usyoung.why-rules, usyoung.rules-and-laws]
    B: [usyoung.rules-and-laws, usyoung.good-citizens, gov.local-government]
    C: [gov.purposes-of-government, gov.rule-of-law, gov.local-government]
    D: [gov.purposes-of-government, gov.rule-of-law, law.what-is-law]
  - title: "Rights and Responsibilities"
    read: ["Good Citizens", "/american-history/young-learners/good-citizens/"]
    ask:
      - "What does a good citizen do?"
      - "What rights do citizens have, and what do they owe in return?"
      - "Which matters more to a free country, rights or duties? Can you have one without the other?"
    do: "Make a family chart of rights and responsibilities: for each right in the home (to be heard, to have your things respected), write the matching duty."
    A: [usyoung.good-citizens, young.taking-turns, young.sharing]
    B: [gov.rights-and-responsibilities, gov.bill-of-rights-overview, usyoung.good-citizens]
    C: [gov.rights-and-responsibilities, gov.bill-of-rights-overview, gov.becoming-a-citizen]
    D: [gov.rights-and-responsibilities, gov.natural-rights-social-contract, gov.political-socialization]
  - title: "Voting"
    read: ["Leaders and Voting", "/american-history/young-learners/leaders-and-voting/"]
    ask:
      - "How do we choose leaders in our country?"
      - "Why is a vote secret?"
      - "Why do some eligible people not vote? What could change that?"
    do: "Hold a secret-ballot family election on something real (the next family outing). Make ballots, a ballot box and count the votes together."
    A: [usyoung.leaders-and-voting, k.more-fewer-same, k.sort-and-count]
    B: [gov.voting-and-turnout, gov.voting-amendments, g2.picture-bar-graphs]
    C: [gov.voting-and-turnout, gov.political-parties, gov.electoral-college]
    D: [gov.voting-and-turnout, gov.primaries-conventions, gov.electoral-college, gov.public-opinion]
  - title: "Our Town and State"
    read: ["Local Government in Civics and Government", "/american-history/civics-and-government/local-government/"]
    ask:
      - "Who is in charge of our town?"
      - "What does a city council or county board decide?"
      - "Some decisions are made in town, some in the state capital and some in Washington. Why not make them all in one place?"
    do: "Attend a town council or school board meeting together (or watch one online). Write down one decision made and how it was made."
    A: [maps.city-suburb-rural, maps.capital-city, usyoung.community-helpers]
    B: [gov.local-government, gov.state-government, maps.capital-city]
    C: [gov.state-government, gov.local-government, gov.direct-democracy]
    D: [gov.federalism-basics, gov.direct-democracy, gov.fiscal-federalism, gov.tribal-government]
  - title: "Becoming a Citizen"
    read: ["Becoming a Citizen", "/american-history/civics-and-government/becoming-a-citizen/"]
    more: [["Citizenship Test Practice", "/american-history/citizenship-test/"]]
    ask:
      - "How do people become citizens of the United States?"
      - "Try five questions from the citizenship test. Which were hardest?"
      - "Why does the country ask new citizens to learn its history and government?"
    do: "Take a practice citizenship test as a family, with older children asking the questions. Talk about what surprised you."
    A: [usyoung.the-flag, usyoung.statue-of-liberty, usyoung.star-spangled-banner]
    B: [gov.becoming-a-citizen, gov.civics-test-history, usyoung.statue-of-liberty]
    C: [gov.becoming-a-citizen, gov.civics-test-government, gov.civics-test-history]
    D: [gov.becoming-a-citizen, gov.civics-test-government, gov.civics-test-history, humangeo.migration-types]
  - title: "Serving Others"
    read: ["Heroes of Service: Rosa Parks and Martin Luther King Jr.", "/american-history/young-learners/rosa-parks-and-mlk/"]
    more: [["Helping neighbors (Outdoor Skills)", "/homeschool/outdoor-skills/helping-neighbors/"]]
    ask:
      - "How can kids help their neighbors?"
      - "Rosa Parks and Dr. King changed laws by peaceful protest. How did that work?"
      - "What is the difference between charity and changing a law? Does a community need both?"
    do: "Plan and do a family service project: rake a neighbor's leaves, collect food for a pantry, or make cards for a nursing home."
    A: [usyoung.rosa-parks-and-mlk, usyoung.mlk-day, young.feelings]
    B: [usyoung.rosa-parks-and-mlk, growing.helping-home, growing.respect-elders]
    C: [ush2.montgomery, ush2.sit-ins-freedom-rides, gov.interest-groups-media]
    D: [ush2.montgomery, ush2.civil-rights-laws, gov.civil-rights-acts, gov.interest-groups-media]
projects:
  A:
    t: "Helper thank-you card"
    do: "Make a card for a community helper with a drawing of them at work. Deliver it together."
    rubric: ["A drawing of the helper's job", "Says thank you", "Delivered or mailed"]
  B:
    t: "Citizen handbook"
    do: "Make a small handbook: five rights, five responsibilities, how voting works, and who leads your town and state."
    rubric: ["Five rights and five responsibilities", "Voting explained correctly", "Real names of local and state leaders", "Neat and complete"]
  C:
    t: "Local issue report"
    do: "Pick a question your town is deciding (a park, a road, a school rule). Interview two people with different views and write a fair one-page report on both sides."
    rubric: ["The issue is clearly explained", "Two views given fairly", "Quotes from the interviews", "No side taken unless asked; clear writing"]
  D:
    t: "Service project with a write-up"
    do: "Plan and lead a community service project with the family. Write a 2-page report: the need, your plan, what happened, and what you would do differently."
    rubric: ["A real need, clearly described", "A workable plan carried out", "An honest account of results", "Reflection on what was learned"]
