# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-solar-system
title: "The Solar System"
subject: science
icon: "🪐"
blurb: "Day and night, the Moon and its phases, the Sun, the planets near and far, comets and meteors, and the stars beyond."
parts:
  - title: "Day, Night and the Seasons"
    read: ["Sun, Moon, and Stars: Day and night, and the seasons", "/homeschool/science/sun-moon-and-stars/lesson-4/"]
    more: [["Day and night in Earth Science", "/earth-and-space/earth-science/day-and-night/"]]
    ask:
      - "Why is it dark at night?"
      - "Why is summer warmer than winter, if Earth isn't much closer to the Sun?"
      - "How would the seasons be different if Earth weren't tilted?"
    do: "In a dark room, shine a flashlight 'Sun' on a globe. Turn the globe slowly to make day and night, then walk it around the light with the tilt kept the same."
    A: [maps.globe, maps.equator, lifek.trees-seasons]
    B: [earthsci.day-and-night, earthsci.seasons, maps.hemispheres]
    C: [earthsci.day-and-night, earthsci.seasons, worldgeo.special-parallels]
    D: [astro.solar-sidereal-day, astro.seasons, astro.sun-noon-altitude]
  - title: "The Moon"
    read: ["Sun, Moon, and Stars: A pretend trip to the Moon", "/homeschool/science/sun-moon-and-stars/lesson-7/"]
    more: [["Moon phases in Earth Science", "/earth-and-space/earth-science/moon-phases/"], ["The Moon Landing", "/american-history/young-learners/moon-landing/"]]
    ask:
      - "Does the Moon really change shape?"
      - "Why do we always see the same face of the Moon?"
      - "What causes a solar eclipse, and why don't we have one every month?"
    do: "Draw the Moon every clear night of the unit, at about the same time. Then make the phases with an orange (the Moon), a lamp and your head (Earth)."
    A: [usyoung.moon-landing, ydraw.draw-what-you-see, ydraw.shapes-in-things]
    B: [earthsci.moon-phases, earthsci.eclipses, usyoung.moon-landing]
    C: [earthsci.moon-phases, earthsci.eclipses, earthsci.tides]
    D: [astro.moon-phases, astro.synodic-month, astro.eclipses, astro.tides]
  - title: "The Sun"
    read: ["Sun, Moon, and Stars: The head of our family: the Sun", "/homeschool/science/sun-moon-and-stars/lesson-2/"]
    ask:
      - "Why do we never look straight at the Sun?"
      - "How does the Sun make its light and heat?"
      - "The Sun is an ordinary star. Why does it look so different from the others?"
    do: "Make a shadow clock: stand a stick in the ground and mark the end of its shadow every hour. Measure the shadows and see when it was shortest."
    A: [maps.sun-directions, lifek.sun-energy, g1.time-hour-half-hour]
    B: [maps.sun-directions, earthsci.solar-system-objects, g3.time-to-minute]
    C: [earthsci.solar-system-objects, physsci.radiation-energy, physsci.em-spectrum]
    D: [astro.sun-layers, astro.sun-fusion, astro.solar-activity, astro.light-travel-time]
  - title: "The Planets"
    read: ["Sun, Moon, and Stars: The giant planets, and a model you can walk", "/homeschool/science/sun-moon-and-stars/lesson-6/"]
    more: [["Sky and Solar System (Science Lab)", "/science-lab/night-sky/"]]
    ask:
      - "Which planet is the biggest? Which is closest to the Sun?"
      - "Why are the inner planets rocky and the outer ones giant balls of gas?"
      - "A real-scale model of the solar system won't fit in a book. Why is it so hard to picture its size?"
    do: "Walk a scale model: the Sun is a ball at your front door, and you pace out each planet's distance down the street using a printed scale."
    A: [k.count-to-20, k.compare-numerals, ydraw.basic-shapes]
    B: [earthsci.solar-system-objects, earthsci.solar-system-scale, g4.large-numbers]
    C: [earthsci.solar-system-scale, earthsci.gravity-orbits, g8.scientific-notation]
    D: [astro.planet-families, astro.kepler-third-law, astro.solar-system-formation, g8.scientific-operations]
  - title: "Comets and Meteors"
    read: ["Sun, Moon, and Stars: Visitors: the comets", "/homeschool/science/sun-moon-and-stars/lesson-8/"]
    more: [["Name That Space Rock (infographic)", "/infographics/name-that-space-rock/"]]
    ask:
      - "What is a shooting star really?"
      - "Why does a comet's tail point away from the Sun?"
      - "Some meteorites are older than any rock on Earth. What can they tell us?"
    do: "Make a comet from a ball of foil with paper streamer tails. Run with it past a 'Sun' lamp and turn so the tail always points away from it."
    A: [ydraw.draw-big, ydraw.lines-all-around, k.count-on]
    B: [earthsci.solar-system-objects, g4.compare-large-numbers, earthsci.fossils]
    C: [astro.small-bodies, earthsci.half-life, earthsci.geologic-time-scale]
    D: [astro.small-bodies, astro.orbits-escape, geology.radiometric-dating]
  - title: "Stars and Beyond"
    read: ["Nature Study: The two Dippers and the Pole-star", "/homeschool/nature-study/handbook-of-nature-study/lesson-225/"]
    more: [["Stars (Outdoor Skills)", "/homeschool/outdoor-skills/stars/"], ["Harvard Classics: Star Gazing, a Cure for Tired Minds", "/harvard-classics/july-11/"]]
    ask:
      - "Can you find the Big Dipper?"
      - "How do sailors use the North Star?"
      - "The light from some stars left them thousands of years ago. What does that mean when we look at them?"
    do: "On a clear night, go out together and find the Big Dipper and the North Star. Draw what you see, then try to find one more constellation."
    A: [maps.cardinal-directions, ydraw.count-details, ydraw.draw-what-you-see]
    B: [maps.cardinal-directions, earthsci.stars-galaxies, g4.large-numbers]
    C: [earthsci.stars-galaxies, astro.celestial-sphere, astro.altitude-latitude]
    D: [astro.parallax, astro.brightness-distance, astro.hr-diagram, astro.milky-way]
projects:
  A:
    t: "My planet mobile"
    do: "Make a mobile of the Sun and eight planets from paper circles of different sizes, in the right order. Name them as you hang them up."
    rubric: ["Sun and eight planets", "In the right order", "Can name each one"]
  B:
    t: "Moon journal"
    do: "Keep a Moon journal for four weeks: a drawing and the date each clear night, then a page explaining the phases."
    rubric: ["Regular dated drawings", "Phases named correctly", "A clear explanation of why phases happen", "Neat and complete"]
  C:
    t: "A scale model of the solar system"
    do: "Work out a scale for the planets' sizes and distances. Build or draw a model to that scale, and write up your math."
    rubric: ["Correct scale calculations shown", "Sizes and distances follow the scale", "Model is labeled", "Explains why sizes and distances need different scales"]
  D:
    t: "Measuring the sky"
    do: "Measure the Sun's noon shadow on several days, or time the Moon's rising over a week. Write a lab report connecting your data to Earth's motion, with a graph."
    rubric: ["Careful repeated measurements", "Data in a table and graph", "Explanation uses correct astronomy", "Discusses sources of error"]
