# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: money
title: "Money"
subject: math
icon: "🪙"
blurb: "Coins and bills, making change, what money is for, earning and choosing, saving and interest, and a family budget."
parts:
  - title: "Coins and Bills"
    read: ["Coin Values", "/math/grade-2/coin-values/"]
    ask:
      - "Which coin is worth the most? Is it the biggest one?"
      - "How many different ways can you make 25 cents?"
      - "Why is a dime smaller than a nickel but worth more?"
    do: "Empty a coin jar onto the table. Sort the coins, count each pile, and find the total together."
    A: [g2.coin-values, k.sort-and-count, k.count-to-100]
    B: [g2.count-money, g2.coin-values, g4.decimal-notation]
    C: [g4.decimal-notation, g5.add-subtract-decimals, g5.decimal-word-problems]
    D: [macro.money-functions, macro.money-supply-measures, g8.scientific-notation]
  - title: "Shopping and Making Change"
    read: ["Count Money", "/math/grade-2/count-money/"]
    ask:
      - "If something costs 60 cents and you pay a dollar, how much change do you get?"
      - "How do cashiers count up to make change?"
      - "Why do so many prices end in 99 cents?"
    do: "Set up a family store with price tags on toys and snacks. Take turns as shopkeeper and customer, paying with real coins and making change."
    A: [g2.count-money, k.count-on, g1.count-on-to-add]
    B: [g2.money-word-problems, g3.subtract-within-1000, g4.add-subtract-algorithm]
    C: [g5.decimal-word-problems, g7.markup-discount-tax, g6.unit-rate-problems]
    D: [g7.markup-discount-tax, micro.law-of-demand, micro.price-elasticity-demand]
  - title: "What Money Is For"
    read: ["Harvard Classics: They Had No Money, Yet Bought and Sold", "/harvard-classics/may-24/"]
    ask:
      - "What would it be like to trade without money?"
      - "Why did people start using coins?"
      - "Money is only worth something because people agree it is. How can that work?"
    do: "Hold a barter morning: everyone trades toys, books or snacks with no money. Then try again with play money, and talk about which was easier."
    A: [k.more-fewer-same, k.compare-numerals, young.sharing]
    B: [micro.scarcity-resources, g3.mult-div-word-problems, g4.multistep-word-problems]
    C: [micro.scarcity-resources, micro.opportunity-cost, micro.gains-from-trade]
    D: [macro.money-functions, micro.comparative-advantage, micro.gains-from-trade, micro.economic-systems]
  - title: "Earning and Choosing"
    read: ["Opportunity Cost in Microeconomics", "/economics/microeconomics/opportunity-cost/"]
    more: [["Harvard Classics: Wages, Why and How Much?", "/harvard-classics/september-11/"]]
    ask:
      - "How do grown-ups earn money?"
      - "If you spend your money on a toy, what else can't you buy?"
      - "Why are some jobs paid more than others? List the main reasons economists give."
    do: "Make a family job board: small paid jobs beyond the usual chores. Each child chooses jobs and keeps a record of what they earn this week."
    A: [g2.money-word-problems, k.put-together, k.take-away]
    B: [micro.scarcity-resources, micro.opportunity-cost, g4.multistep-word-problems]
    C: [micro.opportunity-cost, micro.budget-constraint, micro.marginal-analysis]
    D: [micro.marginal-analysis, micro.marginal-revenue-product, micro.factor-market-shifts]
  - title: "Saving and Interest"
    read: ["Use a Bank Account (Being an Adult 101)", "/being-an-adult/use-a-bank-account/"]
    more: [["Harvard Classics: Franklin's Advice for the New Year", "/harvard-classics/january-1/"]]
    ask:
      - "What are you saving for?"
      - "How does a bank pay you for keeping money there?"
      - "Why does money saved early grow so much more than money saved later?"
    do: "Make three jars for each child: spend, save and give. Split this week's earnings among them and label each jar with a goal."
    A: [g2.count-money, k.count-to-20, k.more-fewer-same]
    B: [g3.mult-div-word-problems, g4.multiply-by-10-100-1000, g4.multistep-word-problems]
    C: [g7.simple-interest, g6.percent-of-a-number, g7.percent-change]
    D: [g7.simple-interest, macro.real-interest-rate, macro.loanable-funds, alg2.compound-interest]
  - title: "A Family Budget"
    read: ["Make a Budget (Being an Adult 101)", "/being-an-adult/make-a-budget/"]
    ask:
      - "What does our family spend money on?"
      - "What is the difference between a need and a want?"
      - "If prices rise and pay stays the same, what has to change in a budget?"
    do: "Give each child pretend money for a pretend month. They must pay for 'needs' cards, choose 'wants' cards, and keep a little for savings."
    A: [g2.money-word-problems, k.sort-and-count, g1.data-three-groups]
    B: [g4.multistep-word-problems, g5.decimal-word-problems, g3.scaled-graphs]
    C: [g6.percent-of-a-number, micro.budget-constraint, stat.categorical-displays]
    D: [micro.budget-constraint, macro.inflation-rate, g7.percent-change, stat.categorical-displays]
projects:
  A:
    t: "My money book"
    do: "Make a book with a page for each coin and the dollar bill: a rubbing or drawing, its name and its value."
    rubric: ["A page for each coin and the dollar", "Names and values correct", "Can count a small handful of coins"]
  B:
    t: "Savings goal plan"
    do: "Choose something to save for. Make a chart of what you earn and save each week, and figure out how many weeks until you reach your goal."
    rubric: ["A clear goal with a price", "A weekly record", "Correct math for weeks needed", "Neat chart"]
  C:
    t: "Run a small business for a day"
    do: "Plan a lemonade stand or bake sale: costs, prices, how many you need to sell to break even. Run it and write a one-page report on profit and what you learned."
    rubric: ["A cost list and price plan", "Break-even worked out", "Real sales recorded", "Honest report on results"]
  D:
    t: "A first-year budget"
    do: "Build a monthly budget for a young adult living on their own in your area: a realistic job and pay after tax, rent, food, transportation, savings. Use a spreadsheet and real prices, and write a page on the hardest trade-offs."
    rubric: ["Realistic income and costs, with sources", "Spreadsheet adds up correctly", "Includes savings", "Thoughtful reflection on trade-offs"]
