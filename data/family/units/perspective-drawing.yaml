# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: perspective-drawing
title: "Perspective"
subject: art
icon: "📐"
blurb: "Near and far, overlapping and size, the horizon line, one-point and two-point perspective, and the haze that makes distance."
parts:
  - title: "Near and Far"
    read: ["Near and Far", "/art/young-artists/near-far/"]
    ask:
      - "Look out the window. Which things look small because they are far away?"
      - "How can a drawing on flat paper look deep?"
      - "Children's drawings often stack far things higher on the page. Is that wrong, or another way of showing space?"
    do: "Line up toy figures down a hallway and photograph them. Then draw what you see, making the far ones smaller."
    A: [ydraw.near-far, ydraw.overlap, ydraw.sky-ground]
    B: [ydraw.near-far, ydraw.overlap, draw.depth-cues]
    C: [draw.depth-cues, draw.negative-space, draw.shapes-to-forms]
    D: [draw.depth-cues, draw.proportion, draw.sighting]
  - title: "The Horizon Line"
    read: ["The Horizon Line", "/art/drawing-basics/horizon-line/"]
    ask:
      - "Where does the sky meet the ground?"
      - "Why does the horizon move up when you stand on a chair?"
      - "Why does the horizon line always sit at the artist's eye level?"
    do: "Hold a ruler level at your eye, outdoors, and find the horizon. Then sit on the ground and stand on a step, and see how it moves."
    A: [ydraw.sky-ground, ydraw.straight-curved, ydraw.line-directions]
    B: [ydraw.line-directions, draw.horizon-line, g4.parallel-perpendicular]
    C: [draw.horizon-line, g4.parallel-perpendicular, g4.points-lines-rays]
    D: [draw.horizon-line, geo.perpendicular-parallel-constructions, draw.angles-plumb]
  - title: "One-Point Perspective"
    read: ["One-Point Perspective", "/art/drawing-basics/one-point/"]
    more: [["Linear perspective in Art History I", "/art/art-history-1/linear-perspective/"]]
    ask:
      - "Stand in a long hallway. What happens to the walls as they go away?"
      - "Where do the lines of the road meet in a picture?"
      - "Brunelleschi showed this method around 1420. Why did it change painting so much?"
    do: "Draw a road or railroad going straight away from you to one point on the horizon. Add trees or poles that get smaller as they go."
    A: [ydraw.draw-big, ydraw.lines-all-around, ydraw.draw-house]
    B: [draw.one-point, draw.drawing-boxes, g4.angle-types]
    C: [draw.one-point, draw.one-point-scenes, ah1.linear-perspective]
    D: [draw.one-point-scenes, ah1.linear-perspective, ah1.florence-dome, g8.dilations]
  - title: "Boxes and Buildings"
    read: ["Drawing Boxes", "/art/drawing-basics/drawing-boxes/"]
    ask:
      - "How can you make a square look like a box?"
      - "Which edges of a box are parallel in real life but meet in a drawing?"
      - "Why might an architect draw a building in perspective before it is built?"
    do: "Collect boxes of different sizes. Arrange them on a table and draw them from a low eye level and then from above."
    A: [k.flat-and-solid, k.name-shapes, ydraw.shapes-in-things]
    B: [draw.drawing-boxes, g5.volume-unit-cubes, g5.volume-of-prism]
    C: [draw.drawing-boxes, draw.construction, g7.cross-sections]
    D: [draw.construction, draw.ellipses, g7.cross-sections, geo.cross-sections-revolution]
  - title: "Two-Point Perspective"
    read: ["Two-Point Perspective", "/art/drawing-basics/two-point/"]
    ask:
      - "Look at the corner of a house. How many sides can you see?"
      - "Why does a corner view need two vanishing points?"
      - "When would an artist break the rules of perspective on purpose?"
    do: "Draw a street corner in two-point perspective, with two vanishing points on the edges of the page. Add windows and doors."
    A: [ydraw.draw-house, ydraw.basic-shapes, ydraw.symmetry]
    B: [draw.two-point, draw.drawing-boxes, g4.measure-angles]
    C: [draw.two-point, draw.three-point, g7.angle-relationships]
    D: [draw.two-point, draw.three-point, g8.similar-figures, g8.angle-angle-similarity]
  - title: "Atmosphere and Distance"
    read: ["Atmospheric Perspective", "/art/drawing-basics/atmospheric/"]
    more: [["The Hudson River School in Art History II", "/art/art-history-2/hudson-river/"]]
    ask:
      - "Why do far-away mountains look blue?"
      - "How can colors and edges show that something is far away?"
      - "Leonardo wrote about this haze. What did careful looking teach him that rules alone could not?"
    do: "On a hazy day (or in photos), compare the colors of near hills and far hills. Paint a landscape in four layers, each farther one lighter and bluer."
    A: [ydraw.lighter-darker, ydraw.warm-cool, ydraw.sky-ground]
    B: [ydraw.lighter-darker, draw.atmospheric, design.tints-tones-shades]
    C: [draw.atmospheric, design.temperature, design.value-element]
    D: [draw.atmospheric, design.value-pattern, physsci.color, ah2.hudson-river]
projects:
  A:
    t: "My road picture"
    do: "Draw a road going far away, with a house near and a house far, and color the sky and ground."
    rubric: ["A road that gets narrower", "A near house bigger than the far one", "Sky and ground filled in"]
  B:
    t: "Perspective street"
    do: "Draw a street in one-point perspective with at least three buildings, trees or poles, and people at different distances."
    rubric: ["One clear vanishing point", "Lines go to the vanishing point", "Sizes shrink with distance", "Neat and finished"]
  C:
    t: "Dream room"
    do: "Design your dream bedroom in one-point or two-point perspective, with furniture drawn as boxes and then finished in detail."
    rubric: ["Correct vanishing point(s) and horizon", "Furniture in perspective", "Shading shows form", "Finished, careful drawing"]
  D:
    t: "A building, three ways"
    do: "Draw one real building three ways: a straight-on view, a one-point view and a two-point view. Write a page on what each view shows best."
    rubric: ["Three accurate drawings", "Construction lines visible but light", "A thoughtful written comparison", "Craft and finish"]
