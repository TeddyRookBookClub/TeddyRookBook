# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: maps-and-mapmaking
title: "Maps and Mapmaking"
subject: geography
icon: "🗺️"
blurb: "What a map is, keys and symbols, directions and the compass, grids and coordinates, scale and distance, and the globe."
parts:
  - title: "What Is a Map?"
    read: ["What Is a Map?", "/geography/maps-and-places/what-is-a-map/"]
    more: [["Home Geography: Pictures and plans", "/homeschool/geography/home-geography/lesson-8/"]]
    ask:
      - "What does your room look like from above, like a bird would see it?"
      - "Why do maps leave things out?"
      - "Every map is drawn for a purpose. How does the purpose change what goes on it?"
    do: "Each person draws a bird's-eye map of their bedroom. Swap maps and try to find a hidden toy using someone else's map."
    A: [maps.what-is-a-map, maps.birds-eye-view, maps.room-map]
    B: [maps.birds-eye-view, maps.parts-of-a-map, worldgeo.kinds-of-maps]
    C: [worldgeo.kinds-of-maps, worldgeo.flat-maps, earthsci.topographic-maps]
    D: [worldgeo.kinds-of-maps, humangeo.geographic-data, humangeo.thematic-maps]
  - title: "Keys and Symbols"
    read: ["Map Symbols", "/geography/maps-and-places/map-symbols/"]
    ask:
      - "What symbol would you use for a park? A school?"
      - "Why does every map need a key?"
      - "How can a map's colors and symbols make a place look better or worse than it is?"
    do: "Make a map of your neighborhood walk with your own symbols and a key. Take the walk and add anything you missed."
    A: [maps.map-symbols, maps.map-key, maps.map-colors]
    B: [maps.map-key, maps.map-colors, maps.parts-of-a-map]
    C: [earthsci.topographic-maps, worldgeo.kinds-of-maps, humangeo.thematic-maps]
    D: [humangeo.thematic-maps, humangeo.spatial-patterns, humangeo.scale-of-analysis]
  - title: "Directions and the Compass"
    read: ["Home Geography: How the compass shows direction", "/homeschool/geography/home-geography/lesson-4/"]
    more: [["Maps and compass (Outdoor Skills)", "/homeschool/outdoor-skills/maps-and-compass/"]]
    ask:
      - "Where does the Sun come up in the morning?"
      - "How does a compass needle know where north is?"
      - "Why might a compass point a little away from true north?"
    do: "Hide a treasure and write directions in steps and compass directions (ten steps north, five east). Trade directions and hunt."
    A: [maps.location-words, maps.cardinal-directions, maps.compass-rose]
    B: [maps.intermediate-directions, maps.follow-directions, maps.using-a-compass]
    C: [maps.using-a-compass, physsci.magnets, worldgeo.parallels-meridians]
    D: [physsci.magnets, geology.paleomagnetism, worldgeo.degrees-minutes]
  - title: "Grids and Coordinates"
    read: ["Grid Squares", "/geography/maps-and-places/grid-squares/"]
    ask:
      - "On a grid, how do you say exactly where a square is?"
      - "How do latitude and longitude make a grid for the whole Earth?"
      - "How does a phone know where it is on that grid?"
    do: "Play family battleship on graph paper with lettered columns and numbered rows. Then find your home's latitude and longitude."
    A: [maps.grid-squares, maps.grid-locate, k.position-words]
    B: [maps.grid-locate, g5.coordinate-plane, g5.graph-real-world-points]
    C: [worldgeo.latitude, worldgeo.longitude, worldgeo.read-coordinates, g6.four-quadrants]
    D: [worldgeo.find-by-coordinates, worldgeo.degrees-minutes, worldgeo.gps-gis]
  - title: "Scale and Distance"
    read: ["Map Scale", "/geography/maps-and-places/map-scale/"]
    more: [["Home Geography: How to tell distance", "/homeschool/geography/home-geography/lesson-7/"]]
    ask:
      - "How can a whole town fit on one piece of paper?"
      - "If one inch on the map means one mile, how far is three inches?"
      - "A map can't show everything at every scale. What do you lose on a map of the whole world?"
    do: "Measure the yard or a room in paces or feet, then draw it to scale on graph paper (one square = one foot)."
    A: [maps.routes, g1.order-by-length, g1.measure-with-units]
    B: [maps.map-scale, g2.measure-length, g3.mult-div-word-problems]
    C: [worldgeo.map-scale, g7.scale-drawings, g6.unit-rate]
    D: [worldgeo.map-scale, worldgeo.degree-distance, g7.scale-drawings]
  - title: "The Globe and Flat Maps"
    read: ["The Globe", "/geography/maps-and-places/globe/"]
    ask:
      - "Why is a globe round?"
      - "Find the equator and the poles. Which part of the Earth is hottest?"
      - "Every flat map of the world stretches something. Why is Greenland so big on some maps?"
    do: "Peel an orange in one piece if you can, then try to lay the peel flat. Talk about why flat maps of a round world must stretch or tear."
    A: [maps.globe, maps.continents, maps.oceans]
    B: [maps.globe-vs-map, maps.equator, maps.hemispheres]
    C: [worldgeo.flat-maps, worldgeo.mercator, worldgeo.equal-area]
    D: [worldgeo.mercator, worldgeo.equal-area, worldgeo.compromise-projections, worldgeo.tissot]
projects:
  A:
    t: "Map of my home"
    do: "Draw a map of your home or yard with a key of at least four symbols and a compass rose."
    rubric: ["A key with four symbols", "A compass rose", "Can find three places on the map"]
  B:
    t: "Treasure map"
    do: "Make a treasure map of your yard or a park with a grid, a key, a compass rose and a scale. Write five clues using grid squares and directions."
    rubric: ["Grid, key, compass rose and scale", "Five clues that work", "Someone can follow it to the treasure", "Neat and labeled"]
  C:
    t: "A neighborhood map to scale"
    do: "Map a few blocks of your neighborhood to scale, with a key, a scale bar, a north arrow and real street names."
    rubric: ["Measurements turned into a correct scale", "Key, scale bar and north arrow", "Accurate street names and places", "Clean, readable map"]
  D:
    t: "A thematic map"
    do: "Collect data on a question (where your town's parks are, which states grow the most corn) and make a thematic map with a clear legend, a title and a short write-up on the pattern you see."
    rubric: ["Real data, with sources", "A suitable map type and clear legend", "An honest write-up of the pattern", "Careful design"]
