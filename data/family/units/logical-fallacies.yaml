# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: logical-fallacies
title: "Logical Fallacies"
subject: logic
icon: "🦉"
blurb: "What an argument is, giving reasons, attacking the person, the straw man, false choices and hasty conclusions, and arguing fairly."
parts:
  - title: "What Is an Argument?"
    read: ["Arguments in Informal Logic", "/logic/informal-logic/arguments/"]
    more: [["What Is a Debate?", "/debate/learn/what-is-a-debate/"]]
    ask:
      - "What is the difference between a quarrel and an argument?"
      - "Find the reason in this sentence: 'We should bring umbrellas because it is cloudy.'"
      - "Can an argument be good even if you disagree with its conclusion?"
    do: "At dinner, each person makes a claim about something small (the best fruit) and gives one reason. Others say whether the reason supports the claim."
    A: [fwr.opinion, fwr.because-so, young.listening]
    B: [fwr.opinion, informal.statements, informal.arguments]
    C: [informal.statements, informal.arguments, informal.premise-conclusion, informal.indicator-words]
    D: [informal.premise-conclusion, informal.standard-form, informal.argument-maps, informal.unstated-premises]
  - title: "Attacking the Person"
    read: ["Ad Hominem in Informal Logic", "/logic/informal-logic/ad-hominem/"]
    ask:
      - "If someone says 'You're wrong because you're little,' is that fair?"
      - "Why doesn't who says something decide whether it is true?"
      - "When is it fair to point out that a speaker has a reason to mislead?"
    do: "Fallacy detectives: a grown-up reads silly ads or made-up arguments, and the kids hold up a card when they hear someone attack the person instead of the reason."
    A: [young.kind-words, young.listening, young.waiting-to-talk]
    B: [informal.fallacy-intro, informal.ad-hominem, growing.disagreeing]
    C: [informal.fallacy-intro, informal.ad-hominem, informal.tu-quoque]
    D: [informal.ad-hominem, informal.tu-quoque, informal.appeal-to-authority, informal.appeal-to-popularity]
  - title: "The Straw Man"
    read: ["Steelman vs. Strawman", "/debate/learn/steelman-vs-strawman/"]
    ask:
      - "If I say 'I want a small snack' and you say 'You want to eat all the cookies!', is that what I said?"
      - "Why is it tempting to make the other side sound sillier than it is?"
      - "What does it take to state someone's view so well that they'd agree you got it right?"
    do: "Steelman game: one person states a view, and another must repeat it back so well that the first person says 'Yes, exactly.' Then switch."
    A: [young.listening, young.waiting-to-talk, growing.listening-well]
    B: [growing.listening-well, informal.straw-man, informal.red-herring]
    C: [informal.straw-man, informal.red-herring, informal.charity]
    D: [informal.straw-man, informal.charity, informal.objections, rhet.counterargument]
  - title: "False Choices"
    read: ["False Dilemma in Informal Logic", "/logic/informal-logic/false-dilemma/"]
    ask:
      - "'Either you like dogs or you hate animals.' Are those the only choices?"
      - "How can you spot an argument that leaves out other options?"
      - "Some choices really do have only two options. How do you tell a real either-or from a false one?"
    do: "Two-choice challenge: a grown-up gives five either-or statements, and the kids find a third option for each."
    A: [k.sort-and-count, fwr.opinion, young.sharing]
    B: [informal.false-dilemma, informal.complex-question, fwr.join-with-but]
    C: [informal.false-dilemma, informal.complex-question, informal.begging-question]
    D: [informal.false-dilemma, informal.begging-question, trad.disjunctive-syllogism, trad.dilemmas]
  - title: "Jumping to Conclusions"
    read: ["Hasty Generalization in Informal Logic", "/logic/informal-logic/hasty-generalization/"]
    ask:
      - "If one cat scratched you, are all cats mean?"
      - "How many examples do you need before you can say 'always'?"
      - "Two things happen together. How can you tell if one caused the other?"
    do: "Flip a coin ten times and record the results. Does a run of heads mean the next flip will be tails? Try it a few times and see."
    A: [k.count-to-10, k.sort-and-count, k.more-fewer-same]
    B: [informal.hasty-generalization, g2.picture-bar-graphs, g3.scaled-graphs]
    C: [informal.hasty-generalization, informal.false-cause, g7.experimental-probability]
    D: [informal.false-cause, informal.causal-reasoning, informal.generalizations, stat.variable-types]
  - title: "Arguing Fairly"
    read: ["Fallacies in Debate", "/debate/learn/fallacies-in-debate/"]
    ask:
      - "How can we disagree and still be kind?"
      - "Which fallacy from this unit do you hear most often?"
      - "Is it fair to call out a fallacy in a friend's argument? How would you do it kindly?"
    do: "Hold a short family debate on a fun question (cats or dogs, summer or winter). Everyone must steelman the other side before they rebut."
    A: [young.taking-turns, young.good-sport, young.waiting-to-talk]
    B: [growing.disagreeing, growing.sportsmanship, informal.telling-apart]
    C: [informal.telling-apart, informal.fallacy-or-not, informal.evaluate-argument]
    D: [informal.fallacy-or-not, informal.evaluate-argument, rhet.fallacies-in-writing, rhet.concession-rebuttal]
projects:
  A:
    t: "Good reasons poster"
    do: "Make a poster: 'I think ___ because ___' with three of your own opinions and a good reason for each. Draw a picture for each."
    rubric: ["Three opinions", "Each has a reason that fits", "Pictures that match"]
  B:
    t: "Fallacy comic book"
    do: "Draw a comic strip for four fallacies from the unit. Each strip shows a character making the mistake and another catching it."
    rubric: ["Four fallacies, each correctly shown", "Names each fallacy", "Shows how to catch it", "Neat and readable"]
  C:
    t: "Fallacy field guide"
    do: "Make a field guide to eight fallacies: name, a plain definition, an example you made up and a tip for spotting it."
    rubric: ["Eight fallacies", "Accurate definitions", "Original examples that fit", "Useful spotting tips"]
  D:
    t: "Evaluate a famous argument"
    do: "Pick a famous speech or essay from before 2000 (the Gettysburg Address, a Federalist essay, a Lincoln-Douglas debate). Map its argument, name any fallacies, and write a 2-3 page evaluation that also states its strongest points fairly."
    rubric: ["Argument mapped accurately", "Fallacies named with evidence, not guessed", "Strengths stated fairly", "Organized and cited"]
