# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: simple-machines
title: "Simple Machines"
subject: science
icon: "⚙️"
blurb: "Pushes and pulls, levers, wheels and axles, pulleys, ramps, wedges and screws, and how machines trade force for distance."
parts:
  - title: "Pushes and Pulls"
    read: ["Forces in Physical Science", "/physics/physical-science/forces-intro/"]
    more: [["Newton's Laws of Motion (Science Lab)", "/science-lab/newtons-laws/"]]
    ask:
      - "Is opening a door a push or a pull? What about a drawer?"
      - "Why is it harder to push a full wagon than an empty one?"
      - "What does it mean that every push comes with an equal push back?"
    do: "Go on a push-and-pull hunt around the house. Make two lists, then see which things need both."
    A: [k.position-words, k.compare-directly, k.describe-attributes]
    B: [physsci.forces-intro, physsci.net-force, g3.mass-and-liquid-volume]
    C: [physsci.forces-intro, physsci.net-force, physsci.friction-intro, physsci.first-law-inertia]
    D: [phys1.free-body-diagrams, phys1.newtons-third-law, phys1.second-law-systems, phys1.normal-force]
  - title: "Levers"
    read: ["Levers in Physical Science", "/physics/physical-science/levers/"]
    ask:
      - "How does a seesaw let a small child lift a bigger one?"
      - "Where is the fulcrum on scissors? On a bottle opener?"
      - "Archimedes said that with a long enough lever he could move the world. What did he mean?"
    do: "Make a lever from a ruler and a pencil. Stack coins on each end and move the pencil until they balance. Record where the fulcrum is for each pile."
    A: [k.compare-directly, k.more-fewer-same, k.count-to-20]
    B: [g3.mass-and-liquid-volume, g3.mult-div-word-problems, physsci.levers]
    C: [physsci.levers, physsci.simple-machines, g7.solve-proportions]
    D: [phys1.torque, phys1.rotational-equilibrium, physsci.levers]
  - title: "Wheels and Axles"
    read: ["Simple Machines in Physical Science", "/physics/physical-science/simple-machines/"]
    ask:
      - "What would life be like without wheels?"
      - "Why is it easier to turn a doorknob than the thin rod inside it?"
      - "Why do big wheels roll over bumps more easily than small ones?"
    do: "Build a car from a box, two straws for axles and bottle caps for wheels. Roll it down a board and measure how far it goes."
    A: [k.name-shapes, k.flat-and-solid, g1.order-by-length]
    B: [g2.measure-length, g3.perimeter, physsci.simple-machines]
    C: [g7.circumference, physsci.simple-machines, physsci.work-intro]
    D: [phys1.angular-quantities, phys1.linear-angular, phys1.rolling]
  - title: "Pulleys"
    read: ["Pulleys in Physics 1", "/physics/physics-1/pulley-systems/"]
    more: [["Knots (Outdoor Skills)", "/homeschool/outdoor-skills/knots/"]]
    ask:
      - "How does a flag get to the top of a flagpole?"
      - "Why does a pulley with two wheels make lifting easier?"
      - "If a pulley halves the force, what do you give up in exchange?"
    do: "Hang a broom handle between two chairs. Loop a rope over it to lift a bucket of books, then add a second loop and feel the difference."
    A: [k.position-words, k.compare-directly, g1.measure-with-units]
    B: [physsci.simple-machines, physsci.work-intro, g4.measurement-word-problems]
    C: [physsci.work-intro, physsci.efficiency, physsci.power-intro]
    D: [phys1.pulley-systems, phys1.connected-objects, phys1.work, phys1.power]
  - title: "Ramps, Wedges and Screws"
    read: ["Work in Physical Science", "/physics/physical-science/work-intro/"]
    ask:
      - "Why do ramps help people move heavy things?"
      - "How is an axe like a ramp?"
      - "A screw is a ramp wrapped around a pole. Why does that let it hold so tightly?"
    do: "Pull a toy truck full of coins up a board with a rubber band. Measure how far the band stretches as the ramp gets steeper."
    A: [k.compare-directly, g1.order-by-length, g1.measure-with-units]
    B: [g2.measure-length, g4.angle-types, g4.measure-angles]
    C: [g4.measure-angles, physsci.work-intro, physsci.efficiency]
    D: [phys1.inclined-planes, phys1.forces-at-angles, phys1.friction-on-inclines]
  - title: "Machines in Our Lives"
    read: ["Trebuchet Workshop (Science Lab)", "/science-lab/trebuchet/"]
    more: [["Harvard Classics: Pins and Other Points", "/harvard-classics/march-28/"]]
    ask:
      - "Find a machine at home made of two simple machines together."
      - "A bicycle uses many simple machines. Which ones can you find?"
      - "Machines can't make energy. So how does a machine help us at all?"
    do: "Take apart something old and broken (a toy, a pencil sharpener, a clock) with a grown-up, and find every simple machine inside."
    A: [usyoung.inventors, k.sort-and-count, k.name-shapes]
    B: [usyoung.inventors, physsci.energy-forms, physsci.simple-machines]
    C: [physsci.energy-forms, physsci.energy-conservation-intro, physsci.efficiency]
    D: [phys1.energy-conservation, phys1.friction-energy, phys1.work-energy-theorem]
projects:
  A:
    t: "Machine hunt book"
    do: "Draw five simple machines you found at home, one per page, and tell a grown-up what each one helps you do."
    rubric: ["Five machines, each drawn", "Each one is a real simple machine", "Says how it helps"]
  B:
    t: "Build a working lever or pulley"
    do: "Build a lever or pulley that lifts a small load. Test it with three loads and write down what you found."
    rubric: ["The machine works", "Three tests recorded", "Explains how it makes lifting easier", "Neat drawing with labels"]
  C:
    t: "A compound machine"
    do: "Design and build a machine that uses at least three simple machines to do one small job (ring a bell, drop a ball in a cup). Draw a labeled plan."
    rubric: ["At least three simple machines", "The machine does its job", "A clear labeled plan", "Explains each step"]
  D:
    t: "Mechanical advantage lab"
    do: "Measure the force needed to lift a load directly, with a ramp and with a pulley. Calculate the ideal and actual mechanical advantage and the efficiency of each, and write a lab report."
    rubric: ["Careful measurements with units", "Correct calculations shown", "Compares ideal and actual and explains the difference", "Clear graph or table"]
