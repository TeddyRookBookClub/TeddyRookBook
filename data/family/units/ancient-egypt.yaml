# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: ancient-egypt
title: "Ancient Egypt"
subject: history
icon: "🏺"
blurb: "The Nile and its flood, pharaohs and pyramids, gods and the afterlife, daily life, hieroglyphs, and how Egypt was found again."
parts:
  - title: "The Gift of the Nile"
    read: ["The Nile River", "/egyptology/young-explorers/nile-river/"]
    more: [["Map of Egypt and Nubia", "/egypt/map/"], ["Herodotus: In the Cradle of Civilization", "/harvard-classics/january-26/"]]
    ask:
      - "Why did almost everyone in Egypt live close to the river?"
      - "The flood came every year. Why was it good news for farmers, and what happened when it was too low?"
      - "Herodotus called Egypt the gift of the Nile. Is that fair to the Egyptians who dug the canals and farmed the land?"
    do: "Make a Nile in a baking pan: a strip of soil down the middle, sand on both sides. Pour water along the soil and watch where it goes. Then plant a few seeds in the wet strip and check them each day this unit."
    A: [kids.nile-river, kids.flood, kids.farming]
    B: [kids.nile-river, kids.river-north, kids.upper-lower, kids.flood]
    C: [kids.upper-lower, kids.seasons, hist.geography, hist.inundation]
    D: [hist.geography, hist.inundation, hist.two-lands, hist.sources]
  - title: "Pharaohs and the Two Lands"
    read: ["Pharaohs", "/egyptology/young-explorers/pharaoh/"]
    more: [["Timeline: Egypt", "/timeline/"]]
    ask:
      - "What did a pharaoh wear, and what did the two crowns stand for?"
      - "Egypt had pharaohs for about 3,000 years. What helped one kingdom last so long?"
      - "Egyptians said the king kept maat, the right order of things. How did that idea help a king rule, and what did it ask of him?"
    do: "Make a red crown and a white crown from paper, then fit them together into the double crown. Take turns telling one fact about a pharaoh while wearing it."
    A: [kids.pharaoh, kids.crowns, kids.tutankhamun]
    B: [kids.pharaoh, kids.crowns, kids.one-kingdom, kids.hatshepsut]
    C: [kids.one-kingdom, kids.ramesses, hist.periods, hist.unification]
    D: [hist.periods, hist.unification, hist.kingship, relart.maat]
  - title: "Pyramids"
    read: ["Why Pyramids?", "/egyptology/young-explorers/why-pyramids/"]
    more: [["Giza", "/egypt/sites/giza/"], ["Saqqara", "/egypt/sites/saqqara/"]]
    ask:
      - "What shape is a pyramid, and what was inside one?"
      - "How did pyramids change from Djoser's steps to the smooth sides at Giza?"
      - "What do the workers' towns near Giza tell us about who built the pyramids, and what don't we know yet?"
    do: "Build a step pyramid from sugar cubes or blocks, then a smooth one. Count the blocks in each and talk about how many people a real one would need."
    A: [kids.why-pyramids, kids.steps-to-smooth, kids.giza]
    B: [kids.why-pyramids, kids.steps-to-smooth, kids.giza, kids.building]
    C: [kids.building, hist.djoser, hist.pyramid-age, relart.pyramid-complex]
    D: [hist.djoser, hist.pyramid-age, hist.pyramid-state, relart.pyramid-complex]
  - title: "Gods and the Afterlife"
    read: ["Many Gods", "/egyptology/young-explorers/many-gods/"]
    more: [["Gods of Egypt (infographic)", "/infographics/gods-of-egypt/"]]
    ask:
      - "Why did many Egyptian gods have animal heads?"
      - "Why did Egyptians take such care of the body after death?"
      - "In the weighing of the heart, what did a person's heart have to show? What does that tell us about what Egyptians valued?"
    do: "Draw a scale on a big sheet. On one side put a feather; on the other, write good deeds the family can do this week. Add one each day."
    A: [kids.many-gods, kids.god-animals, kids.tombs-treasure]
    B: [kids.many-gods, kids.god-animals, kids.osiris-isis, kids.weighing-heart]
    C: [kids.mummies, kids.weighing-heart, relart.many-gods, relart.afterlife]
    D: [relart.osiris-myth, relart.afterlife, relart.judgment, relart.why-mummify]
  - title: "Daily Life by the River"
    read: ["Homes", "/egyptology/young-explorers/homes/"]
    more: [["Deir el-Medina in the Ladder", "/egyptology/history/deir-el-medina/"]]
    ask:
      - "What did Egyptian children eat and play?"
      - "Which jobs did Egypt need, and which do we still have today?"
      - "Most of what we know comes from tombs and the town of the tomb builders. How might that give us a lopsided picture?"
    do: "Cook a simple Egyptian-style meal together: flat bread, lentils, onions and dates. Play a board game of the time with a homemade board (a row-and-square race game like senet)."
    A: [kids.homes, kids.food, kids.games]
    B: [kids.homes, kids.food, kids.clothes, kids.jobs]
    C: [kids.jobs, hist.people, hist.deir-el-medina, hist.economy]
    D: [hist.people, hist.women, hist.economy, hist.administration]
  - title: "Hieroglyphs and the Rosetta Stone"
    read: ["Scribes", "/egyptology/young-explorers/scribes/"]
    more: [["The Rosetta site", "/egypt/sites/rosetta/"]]
    ask:
      - "How did a scribe write, and on what?"
      - "Some signs stand for sounds and some for ideas. Why would a writing system use both?"
      - "Champollion read hieroglyphs in 1822, after centuries when no one could. What did he need to know, and why did the Rosetta Stone matter so much?"
    do: "Write each family member's name in a cartouche using the sound signs, and hang them on the door. Then try to read each other's."
    A: [kids.scribes, kids.your-name, kids.numbers]
    B: [kids.sound-signs, kids.which-way, kids.cartouche, kids.rosetta-stone]
    C: [kids.idea-signs, kids.champollion, kids.carter, hist.first-writing]
    D: [hist.first-writing, hist.ptolemies, hist.how-sure, relart.canon]
projects:
  A:
    t: "My Nile picture book"
    do: "Make a four-page book: the river, a pharaoh, a pyramid and your name in hieroglyphs. Draw each page and tell a grown-up one sentence to write under it."
    rubric: ["Four pages, each about Egypt", "Each picture shows something real from the unit", "Can tell one fact about each page"]
  B:
    t: "A day in an Egyptian village"
    do: "Write a short story (one page) about a child in a farming village during the flood. Include a job, a meal, a game and one god the family honored. Add a drawing."
    rubric: ["Story has a beginning, middle and end", "At least four true details from the unit", "Neat writing with capitals and end marks", "A drawing that matches the story"]
  C:
    t: "Museum label set"
    do: "Choose five things from ancient Egypt (a crown, a canopic jar, a scarab, a papyrus, a statue). Draw or model each and write a museum label: what it is, when it was made, what it was for."
    rubric: ["Five objects, each drawn or modeled", "Labels give name, period and use", "Facts match the lessons", "Labels are clear and spelled correctly"]
  D:
    t: "How do we know? A short research paper"
    do: "Write a 2-3 page paper on one question, such as how Egyptologists date the reign of a king, or what the workers' town tells us about the pyramid builders. Use at least three sources and cite them."
    rubric: ["A clear question and thesis", "Evidence from at least three sources, cited", "Separates what is known from what is guessed", "Well organized, with few errors"]
