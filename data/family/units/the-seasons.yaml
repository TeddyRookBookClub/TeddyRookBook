# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-seasons
title: "The Seasons"
subject: nature
icon: "🍂"
blurb: "Why Earth has seasons, a tree adopted for the year, birds and animals getting ready for winter, the sky's calendar, and a nature journal."
parts:
  - title: "Why We Have Seasons"
    read: ["Sun, Moon and Stars: Day and night, and the seasons", "/homeschool/science/sun-moon-and-stars/lesson-4/"]
    more: [["Why We Have Seasons in Earth Science", "/earth-and-space/earth-science/seasons/"], ["Handbook of Nature Study: The Sun and the Earth", "/homeschool/nature-study/handbook-of-nature-study/lesson-232/"]]
    ask:
      - "What are the four seasons, and which one are we in now?"
      - "Earth is a little closer to the Sun in January. So why is January cold in the United States?"
      - "How does the tilt of Earth's axis change both the length of the day and how strongly sunlight hits the ground?"
    do: "In a dark room, carry a globe (or a ball with a pencil through it) around a lamp. Keep the pencil leaning the same way the whole time, and watch which half gets more light at each side of the circle."
    A: [lifek.trees-seasons, fwr.days-months, maps.globe]
    B: [lifek.trees-seasons, maps.equator, maps.hemispheres, earthsci.seasons]
    C: [earthsci.day-and-night, earthsci.seasons, earthsci.latitude-longitude]
    D: [earthsci.seasons, astro.seasons, weather.insolation]
  - title: "Adopt a Tree"
    read: ["Handbook of Nature Study: Adopting a tree for a year", "/homeschool/nature-study/handbook-of-nature-study/lesson-188/"]
    more: [["How to make leaf prints", "/homeschool/nature-study/handbook-of-nature-study/lesson-189/"], ["Home Geography: Forest trees", "/homeschool/geography/home-geography/lesson-33/"]]
    ask:
      - "What does our tree look like today? What color are its leaves?"
      - "Why do many trees drop their leaves in fall while pines keep their needles?"
      - "A leaf turns yellow or red when the tree stops making green chlorophyll. Why would a tree stop making it before winter?"
    do: "Pick one tree near home to visit all through this unit. Measure around its trunk with a string, make a bark rubbing, and press one leaf. Start a family nature journal with a page for the tree."
    A: [lifek.plant-parts, lifek.stems-leaves, ydraw.draw-tree-flower]
    B: [lifek.stems-leaves, lifek.plants-make-food, g2.measure-length, g3.measure-half-quarter-inch]
    C: [lifesci.photosynthesis, lifesci.plant-transport, lifesci.plant-responses]
    D: [hsbio.photosynthesis, hsbio.photosynthesis-factors, hsbio.plant-homeostasis]
  - title: "Getting Ready for Winter"
    read: ["Animals in Winter", "/biology/young-learners/animals-winter/"]
    more: [["Getting Ready for Winter", "/biology/young-learners/getting-ready/"], ["Handbook of Nature Study: Birds' nests in winter", "/homeschool/nature-study/handbook-of-nature-study/lesson-35/"]]
    ask:
      - "Where do bugs, frogs and bears go in winter?"
      - "Some birds fly south and some stay all winter. How do the ones that stay find food and keep warm?"
      - "Hibernating, migrating and staying active are three ways to get through winter. What does each one cost an animal, and what does it gain?"
    do: "Make a simple bird feeder from a pine cone, peanut butter (or shortening) and birdseed. Hang it where you can see it from a window and keep a tally of the birds that visit."
    A: [lifek.animals-winter, lifek.getting-ready, lifek.birds]
    B: [lifek.animals-winter, lifek.getting-ready, lifek.coverings, g2.picture-bar-graphs]
    C: [lifesci.behavioral-adaptations, lifesci.structural-adaptations, lifesci.body-temperature]
    D: [lifesci.behavioral-adaptations, hsbio.temperature-control, hsbio.feedback-loops]
  - title: "Weather Through the Year"
    read: ["Home Geography: Dew, frost, clouds, fog, rain, hail and snow", "/homeschool/geography/home-geography/lesson-16/"]
    more: [["Handbook of Nature Study: Water forms: vapor, dew, frost and snow", "/homeschool/nature-study/handbook-of-nature-study/lesson-221/"]]
    ask:
      - "What kind of weather do we get in each season where we live?"
      - "What is the difference between weather and climate?"
      - "Places near the equator have hardly any winter, and places near the poles have months of dark. Use Earth's tilt to explain both."
    do: "Keep a family weather chart for the week: the temperature at the same time each day, the sky, and the wind. At the end of the week, make a bar graph of the temperatures."
    A: [maps.equator, maps.poles, g1.data-three-groups]
    B: [g3.scaled-graphs, earthsci.weather-vs-climate, usgeo.climate-regions]
    C: [earthsci.weather-vs-climate, earthsci.climate-factors, usgeo.climate-regions]
    D: [weather.climate-normals, weather.climographs, weather.climate-zones]
  - title: "The Sky's Calendar"
    read: ["Handbook of Nature Study: How to make a sundial", "/homeschool/nature-study/handbook-of-nature-study/lesson-233/"]
    more: [["The Sun Shows the Way", "/geography/maps-and-places/sun-directions/"], ["McGuffey's Third Reader: The Clock and the Sun-Dial", "/homeschool/mcguffey/third-reader/lesson-28/"]]
    ask:
      - "Where does the Sun come up in the morning, and where does it go down?"
      - "Why is your noon shadow short in summer and long in winter?"
      - "Before clocks and printed calendars, how could people use the Sun and Moon to know the time of year?"
    do: "Stand a stick in the ground (or tape a pencil upright on a sunny windowsill). Mark the tip of its shadow every hour on a sunny day. Then measure the noon shadow once a week for the rest of the unit."
    A: [maps.sun-directions, maps.cardinal-directions, g1.time-hour-half-hour]
    B: [maps.sun-directions, g2.time-five-minutes, g3.elapsed-time, usgeo.daylight-saving]
    C: [earthsci.day-and-night, earthsci.moon-phases, usgeo.time-zones, usgeo.daylight-saving]
    D: [astro.sun-noon-altitude, astro.solar-sidereal-day, astro.moon-phases]
  - title: "Poems of the Seasons"
    read: ["Home Geography: The signs of the seasons", "/homeschool/geography/home-geography/lesson-40/"]
    more: [["Harvard Classics: If Winter Comes (Shelley)", "/harvard-classics/october-18/"], ["Harvard Classics: Thoreau's Walking", "/harvard-classics/july-12/"]]
    ask:
      - "Which season is your favorite, and what do you see, hear and smell in it?"
      - "Poets often use the seasons to stand for something else, like spring for a new start. Can you find an example?"
      - "Shelley asked, 'If Winter comes, can Spring be far behind?' What was he really saying, and do you agree?"
    do: "Read your nature journal pages together. Each person picks one page and turns it into a short poem or a picture with a caption. Share them at a family poetry tea."
    A: [fwr.days-months, ydraw.nature-patterns, lifek.observing]
    B: [lifek.observing, fwr.days-months, ydraw.nature-patterns]
    C: [comp.descriptive, lifesci.fair-tests, draw.contour]
    D: [rhet.figures-of-speech, hsbio.hypotheses-experiments, draw.sketchbook]
projects:
  A:
    t: "My tree through the seasons"
    do: "Fold a paper into four boxes, one for each season. Draw your adopted tree as it looks now, then draw how you think it looks in the other three seasons. Tell a grown-up one thing about each box to write underneath."
    rubric: ["Four boxes, one for each season", "Each picture shows a real change (leaves, buds, snow, fruit)", "Can tell one fact about each season"]
  B:
    t: "A season field guide"
    do: "Make a four-page field guide to this season where you live: one page of trees, one of birds or animals, one of weather, one of the sky. Draw each thing and write two true sentences about it."
    rubric: ["Four pages with drawings from real observation", "Two true sentences on each page", "At least one measurement (temperature, shadow or trunk size)", "Neat writing with capitals and end marks"]
  C:
    t: "Shadow and daylight report"
    do: "Use the noon shadow you measured each week, plus sunrise and sunset times from a newspaper or almanac, to make two line graphs. Write one page explaining what the graphs show and how Earth's tilt causes it."
    rubric: ["Two clearly labeled graphs from real data", "The explanation uses tilt, not distance from the Sun", "At least three measurements on each graph", "Clear writing with few errors"]
  D:
    t: "A nature-study investigation"
    do: "Ask one question about the season (for example: does the noon Sun's height match the angle the ladder predicts for our latitude, or how does leaf color change on one tree week by week?). Collect data for at least three weeks, compare it with what the lessons predict, and write a two-page report."
    rubric: ["A clear, testable question", "Data collected on at least three dates and shown in a table or graph", "Compares results with the expected values and explains any difference", "Well organized, with sources cited"]
