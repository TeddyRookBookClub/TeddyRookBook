# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-fifty-states
title: "The Fifty States"
subject: geography
icon: "🇺🇸"
blurb: "Our own state, the regions, states and capitals, rivers and mountains, national parks, and how the country grew to fifty."
parts:
  - title: "Where We Live"
    read: ["Nested Places", "/geography/maps-and-places/nested-places/"]
    ask:
      - "What is our address? What town, state and country do we live in?"
      - "What is our state's capital, and why do states have capitals?"
      - "How does where you live shape what you do every day?"
    do: "Make a set of nesting circles: your home in the middle, then town, county, state, country, continent and planet. Fill in each name."
    A: [maps.address, maps.nested-places, maps.city-suburb-rural]
    B: [maps.states-of-us, maps.capital-city, usgeo.us-on-the-map]
    C: [usgeo.us-on-the-map, usgeo.regions, usgeo.postal-codes]
    D: [usgeo.regions, humangeo.regions, humangeo.location]
  - title: "The Northeast and the Midwest"
    read: ["Northeast States", "/geography/us-geography/northeast-states/"]
    ask:
      - "Which states touch the Great Lakes?"
      - "Why did so many early cities grow in the Northeast?"
      - "How did the Midwest come to be called the nation's breadbasket?"
    do: "Cook a dish from each region this week (clam chowder, deep-dish pizza, a hotdish). Find each dish's state on the map."
    A: [maps.states-of-us, maps.land-and-water, maps.oceans-lakes-rivers]
    B: [usgeo.northeast-states, usgeo.midwest-states, usgeo.great-lakes]
    C: [usgeo.northeast-states, usgeo.northeast-capitals, usgeo.midwest-states, usgeo.midwest-capitals]
    D: [usgeo.northeast-capitals, usgeo.midwest-capitals, usgeo.great-lakes, usgeo.farms-resources]
  - title: "The South"
    read: ["South Atlantic States", "/geography/us-geography/south-atlantic-states/"]
    ask:
      - "Which state is a peninsula?"
      - "What rivers flow through the South to the Gulf of Mexico?"
      - "How did the climate of the South shape what was grown there and how people lived?"
    do: "Trace the Mississippi River from Minnesota to the Gulf with your finger, naming the states on each side."
    A: [maps.island-peninsula, maps.river-parts, maps.bays-gulfs]
    B: [usgeo.south-atlantic-states, usgeo.south-central-states, usgeo.mississippi-system]
    C: [usgeo.south-atlantic-capitals, usgeo.south-central-capitals, usgeo.mississippi-system]
    D: [usgeo.south-central-capitals, usgeo.coasts-bays, usgeo.climate-regions, usgeo.storms-hazards]
  - title: "The Mountain West and the Pacific"
    read: ["Mountain States", "/geography/us-geography/mountain-states/"]
    ask:
      - "Which states have the Rocky Mountains?"
      - "Why are Alaska and Hawaii drawn in boxes on many maps?"
      - "Why does the Continental Divide decide which ocean a raindrop reaches?"
    do: "Make a salt-dough relief map of the western states with the Rockies, the Sierra Nevada and the Cascades."
    A: [maps.mountains-hills-valleys, maps.plains-plateaus, maps.deserts-forests-grasslands]
    B: [usgeo.mountain-states, usgeo.pacific-states, usgeo.alaska-hawaii]
    C: [usgeo.mountain-capitals, usgeo.pacific-capitals, usgeo.mountain-ranges, usgeo.continental-divide]
    D: [usgeo.mountain-ranges, usgeo.continental-divide, usgeo.high-low-points, usgeo.deserts]
  - title: "National Parks and Landmarks"
    read: ["National Parks", "/geography/us-geography/national-parks/"]
    ask:
      - "Which national park would you most like to visit?"
      - "Why did the country decide to set aside land as parks?"
      - "Parks protect nature and welcome visitors. How do those two goals pull against each other?"
    do: "Plan a dream road trip to three national parks. Measure the route on the map and work out how many days of driving it would take."
    A: [usyoung.statue-of-liberty, usyoung.washington-dc, maps.routes]
    B: [usgeo.national-parks, usgeo.landmarks, g4.multistep-word-problems]
    C: [usgeo.parks-west, usgeo.parks-east, usgeo.landmarks, g6.unit-rate-problems]
    D: [usgeo.parks-west, usgeo.parks-east, earthsci.landforms, geology.glaciers]
  - title: "From Thirteen to Fifty"
    read: ["The First Thirteen", "/geography/us-geography/first-thirteen/"]
    ask:
      - "How many states are there? Which state did you learn the most about?"
      - "Which were the first and last states to join?"
      - "Why did it take so long for some territories to become states?"
    do: "Make a fifty-states puzzle from a printed map glued to cardboard. Time how fast each person can put it together."
    A: [usyoung.fifty-states, usyoung.thirteen-colonies, maps.north-america]
    B: [usgeo.first-thirteen, usgeo.growth-of-the-us, usgeo.all-states]
    C: [usgeo.all-states, usgeo.all-capitals, usgeo.statehood-order, usgeo.neighbor-states]
    D: [usgeo.statehood-order, usgeo.territories, usgeo.state-populations, usgeo.population-density-us]
projects:
  A:
    t: "My state book"
    do: "Make a small book about our state: its shape, its capital, its flag and one place you love. Draw a page for each."
    rubric: ["Four pages about our state", "The capital is right", "Tells one thing about each page"]
  B:
    t: "State report"
    do: "Choose one state (not your own). Make a poster with its map, capital, flag, three landmarks and three interesting facts."
    rubric: ["Map, capital and flag correct", "Three landmarks and three facts", "Facts come from real sources", "Neat and labeled"]
  C:
    t: "Regions compared"
    do: "Make a chart or slide show comparing four regions: land, climate, cities, what people grow or make, and one landmark each."
    rubric: ["Four regions, five points each", "Facts are accurate", "Shows real differences between regions", "Clear and organized"]
  D:
    t: "A state, then and now"
    do: "Write a 2-3 page profile of one state: its physical geography, how and when it became a state, how its population and economy have changed, and a map you made."
    rubric: ["Accurate physical geography", "Statehood history with dates", "Changes over time with data", "A clear map and cited sources"]
