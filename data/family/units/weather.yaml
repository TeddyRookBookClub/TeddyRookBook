# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: weather
title: "Weather"
subject: science
icon: "⛅"
blurb: "The air around us, the water cycle, clouds and rain, wind and pressure, storms, and how forecasters read the sky."
parts:
  - title: "The Air Around Us"
    read: ["Fairy-Land of Science: We live at the bottom of an ocean of air", "/homeschool/science/fairy-land-of-science/lesson-7/"]
    more: [["Air pressure in Earth Science", "/earth-and-space/earth-science/air-pressure/"]]
    ask:
      - "Can you feel air? How do you know it's there?"
      - "Air presses on us all the time. Why don't we feel squashed?"
      - "Why does air get thinner as you climb a mountain?"
    do: "Fill a glass to the brim with water, cover it with a card, and turn it over above a sink. Talk about what holds the card on."
    A: [lifek.needs, lifek.trees-seasons, g1.data-three-groups]
    B: [earthsci.air-composition, earthsci.atmosphere-layers, g2.picture-bar-graphs]
    C: [earthsci.air-composition, earthsci.atmosphere-layers, earthsci.air-pressure]
    D: [weather.pressure-units, weather.pressure-height, weather.gas-law-air]
  - title: "The Water Cycle"
    read: ["Home Geography: The waterdrop's story", "/homeschool/geography/home-geography/lesson-22/"]
    more: [["Fairy-Land of Science: A drop of water goes up into the sky", "/homeschool/science/fairy-land-of-science/lesson-10/"]]
    ask:
      - "Where does a puddle go when it dries up?"
      - "Tell the story of one drop of water through the whole water cycle."
      - "The same water has gone around and around for billions of years. What powers the cycle?"
    do: "Make a water cycle in a bag: a little water with blue coloring in a zip bag taped to a sunny window. Check it each morning and draw what you see."
    A: [maps.oceans-lakes-rivers, maps.land-and-water, g1.data-three-groups]
    B: [earthsci.water-cycle, earthsci.water-distribution, g3.mass-and-liquid-volume]
    C: [earthsci.water-cycle, earthsci.water-distribution, earthsci.groundwater]
    D: [weather.saturation, weather.relative-humidity, weather.dew-point, weather.latent-heat]
  - title: "Clouds and Rain"
    read: ["Home Geography: Dew, frost, clouds, fog, rain, hail and snow", "/homeschool/geography/home-geography/lesson-16/"]
    more: [["Weather (Outdoor Skills)", "/homeschool/outdoor-skills/weather/"]]
    ask:
      - "What shapes do you see in the clouds today?"
      - "Why do clouds form high up and not at the ground?"
      - "Why does one side of a mountain range get lots of rain and the other side very little?"
    do: "Keep a family cloud log: twice a day, look up, sketch the clouds and name the type. Did that kind of cloud bring rain later?"
    A: [ydraw.sky-ground, ydraw.draw-what-you-see, g1.data-three-groups]
    B: [earthsci.water-cycle, g2.picture-bar-graphs, g2.line-plots]
    C: [earthsci.air-masses-fronts, earthsci.weather-vs-climate, g6.dot-plots-histograms]
    D: [weather.cloud-types, weather.adiabatic-cooling, weather.rain-shadow, weather.precipitation-types]
  - title: "Wind"
    read: ["Wind in Earth Science", "/earth-and-space/earth-science/wind/"]
    more: [["Fairy-Land of Science: Air pushes up, weighing the air, and the wind", "/homeschool/science/fairy-land-of-science/lesson-9/"]]
    ask:
      - "How can we tell which way the wind is blowing?"
      - "Why does a breeze blow in from the sea on a hot afternoon?"
      - "Why do winds curve instead of blowing straight from high pressure to low?"
    do: "Make a wind vane from a straw, a pin, a pencil eraser and a paper arrow. Mark north, south, east and west on its base and read it each day."
    A: [maps.cardinal-directions, maps.compass-rose, maps.sun-directions]
    B: [maps.intermediate-directions, earthsci.wind, earthsci.air-pressure]
    C: [earthsci.wind, earthsci.global-winds, earthsci.surface-currents]
    D: [weather.pressure-gradient, weather.coriolis, weather.highs-and-lows, weather.three-cells]
  - title: "Storms"
    read: ["Thunderstorms in Weather and Climate", "/earth-and-space/weather-and-climate/thunderstorms/"]
    ask:
      - "What makes thunder?"
      - "Count the seconds between a flash and its thunder. What does the number tell you?"
      - "How do forecasters warn people about a hurricane days ahead but a tornado only minutes ahead?"
    do: "Next time there is a storm, watch from indoors: count seconds from flash to thunder and divide by five to estimate the miles to the lightning."
    A: [k.count-to-20, k.how-many, lifek.animals-winter]
    B: [physsci.sound, g3.mult-div-word-problems, usgeo.storms-hazards]
    C: [physsci.sound, usgeo.storms-hazards, earthsci.air-masses-fronts]
    D: [weather.thunderstorms, weather.lightning-thunder, weather.tornadoes, weather.hurricanes]
  - title: "Forecasting"
    read: ["Nature Study: How to read weather maps", "/homeschool/nature-study/handbook-of-nature-study/lesson-224/"]
    more: [["Forecasting tools in Weather and Climate", "/earth-and-space/weather-and-climate/instruments/"]]
    ask:
      - "What will the weather be tomorrow? How could we guess?"
      - "What tools do weather watchers use?"
      - "A forecast says 40 percent chance of rain. What does that mean, and what doesn't it mean?"
    do: "Run a family weather station for the week: a thermometer, a rain gauge from a straight-sided jar, and your wind vane. Make a forecast each night and check it in the morning."
    A: [g1.data-three-groups, k.sort-and-count, k.more-fewer-same]
    B: [g2.line-plots, g3.scaled-graphs, earthsci.weather-vs-climate]
    C: [earthsci.weather-vs-climate, g7.experimental-probability, g7.probability-scale]
    D: [weather.station-model, weather.surface-maps, weather.forecast-models, weather.probability-of-precipitation]
projects:
  A:
    t: "My weather chart"
    do: "Keep a picture weather chart for one week: draw sun, clouds, rain or wind each day. At the end, count which weather came most."
    rubric: ["A picture for each day", "Counts each kind of weather", "Tells which came most"]
  B:
    t: "Two weeks of weather"
    do: "Record temperature, rain and wind each day for two weeks. Make a bar graph of temperature and write three things you noticed."
    rubric: ["A reading every day", "A correct, labeled bar graph", "Three thoughtful observations", "Neat record sheet"]
  C:
    t: "Be the forecaster"
    do: "Record weather for two weeks and make your own forecast each evening. Present a two-minute weather report on video or live, and score how often your forecasts were right."
    rubric: ["Daily records and forecasts", "Forecasts use real clues (clouds, pressure, wind)", "Honest scoring of hits and misses", "Clear, lively presentation"]
  D:
    t: "Storm study"
    do: "Choose one kind of storm. Write a 2-3 page report on how it forms, how it is forecast, and one historic example before 2000, with a diagram and cited sources."
    rubric: ["Accurate explanation of how it forms", "Explains forecasting and warnings", "A historic example with facts and dates", "Diagram and cited sources"]
