# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: fables-and-folk-tales
title: "Fables and Folk Tales"
subject: language
icon: "🦊"
blurb: "Aesop's fables and their morals, animal characters, tales from McGuffey's Readers, Grimm and Andersen, and writing your own fable."
parts:
  - title: "What Is a Fable?"
    read: ["Harvard Classics: 2,500 Years Ago Aesop Said . . .", "/harvard-classics/march-26/"]
    ask:
      - "What happened to Androcles and the lion?"
      - "What is the moral, the lesson, of the story?"
      - "Why might a teacher tell a story instead of just saying the lesson?"
    do: "Start a family fable jar: each person writes or draws one moral (a lesson in a sentence) on a slip and puts it in. Each night, pull one and tell a fable that fits."
    A: [fwr.beginning-middle-end, fwr.characters-setting, young.kind-words]
    B: [fwr.beginning-middle-end, fwr.problem-solution, comp.narrative]
    C: [comp.narrative, comp.text-structures, comp.summarizing]
    D: [comp.summarizing, rhet.analysis-intro, rhet.figures-of-speech]
  - title: "Animal Characters"
    read: ["McGuffey's Second Reader: The Fox and the Ducks", "/homeschool/mcguffey/second-reader/lesson-48/"]
    more: [["McGuffey's Second Reader: Two Dogs", "/homeschool/mcguffey/second-reader/lesson-5/"]]
    ask:
      - "Why is the fox in so many fables?"
      - "Which animal stands for which kind of person: the fox, the ant, the lion?"
      - "Animals in fables stand for people. Why might that make a lesson easier to hear?"
    do: "Draw animal masks for a fox, a crow and a lion. Act out 'The Fox and the Crow' from memory, then switch masks."
    A: [lifek.mammals, lifek.birds, lifek.body-parts]
    B: [fwr.characters-setting, fwr.adjectives, gram.adjectives]
    C: [comp.descriptive, comp.show-dont-tell, gram.adjectives]
    D: [rhet.figures-of-speech, rhet.diction, comp.descriptive]
  - title: "Fables About Honesty"
    read: ["McGuffey's Third Reader: The Wolf", "/homeschool/mcguffey/third-reader/lesson-13/"]
    ask:
      - "Why didn't anyone come the last time the boy cried 'Wolf!'?"
      - "Once trust is lost, how can someone earn it back?"
      - "Is it ever right to tell a lie? What do the main traditions of thought say?"
    do: "Play two truths and a lie at dinner, then talk about how it felt to be fooled, even in a game."
    A: [young.sorry, young.tattling-telling, fwr.telling-sentences]
    B: [growing.apologizing, fwr.because-so, comp.topic-sentences]
    C: [informal.statements, informal.arguments, comp.topic-sentences]
    D: [informal.charity, informal.appeal-to-authority, rhet.ethos]
  - title: "Folk Tales from Grimm"
    read: ["Harvard Classics: A Flounder Fish Story (Grimm)", "/harvard-classics/january-4/"]
    more: [["Harvard Classics: Old Stories Ever New (The Valiant Little Tailor)", "/harvard-classics/november-20/"], ["Fairy Tale Shelf (infographic)", "/infographics/fairy-tale-shelf/"]]
    ask:
      - "What did the fisherman's wife keep asking for?"
      - "Why do so many folk tales repeat things three times?"
      - "The brothers Grimm wrote down stories people told aloud. What might change when a spoken story is written down?"
    do: "Tell a folk tale around the table, one sentence each, going around and around. Record it, then listen back."
    A: [fwr.beginning-middle-end, k.count-to-10, fwr.time-words]
    B: [fwr.time-words, fwr.problem-solution, comp.narrative]
    C: [comp.narrative, comp.paragraph-order, comp.transitions]
    D: [comp.paraphrasing, rhet.analysis-intro, rhet.choices-effects]
  - title: "Andersen's Tales"
    read: ["Harvard Classics: World's Greatest Bedtime Stories (The Ugly Duckling)", "/harvard-classics/august-4/"]
    more: [["Harvard Classics: The Night Life of Flowers (Little Ida's Flowers)", "/harvard-classics/may-18/"]]
    ask:
      - "How did the ugly duckling feel, and how did it end?"
      - "How is a fairy tale different from a fable?"
      - "Andersen was teased as a child. Do you think the story is about him? What makes you think so?"
    do: "Draw the duckling's year as a four-panel strip: spring, summer, autumn and winter, then spring again."
    A: [lifek.birds, lifek.chicken-cycle, young.feelings]
    B: [lifek.compare-cycles, fwr.characters-setting, comp.narrative]
    C: [comp.narrative, comp.text-structures, rhet.tone]
    D: [rhet.tone, rhet.analysis-thesis, rhet.choices-effects]
  - title: "Write Your Own Fable"
    read: ["McGuffey's Fourth Reader: Waste not, Want not", "/homeschool/mcguffey/fourth-reader/lesson-25/"]
    ask:
      - "What lesson would you like to teach with a story?"
      - "Which animals would make good characters for your lesson?"
      - "A good moral is short and surprising. How do you keep a fable from preaching?"
    do: "Fable-writing night: everyone writes or dictates a fable. Read them aloud and guess each moral before it is told."
    A: [fwr.beginning-middle-end, fwr.capital-start, fwr.choose-end-mark]
    B: [fwr.problem-solution, comp.writing-process, fwr.check-your-work]
    C: [comp.writing-process, comp.revision, comp.editing]
    D: [comp.revision, rhet.concision, rhet.classic-advice]
projects:
  A:
    t: "My fable puppet show"
    do: "Make two paper-bag puppets and act out a fable for the family. Say the moral at the end."
    rubric: ["Two puppets that fit the fable", "Tells the story in order", "Says the moral"]
  B:
    t: "A fable book"
    do: "Write and draw three fables of your own, each with animal characters and a moral at the end."
    rubric: ["Three complete fables", "Animal characters that stand for something", "A clear moral for each", "Neat writing and drawings"]
  C:
    t: "Fables across the world"
    do: "Find three fables or folk tales from different countries that teach a similar lesson. Retell each briefly and write a page comparing them."
    rubric: ["Three tales with sources", "Accurate short retellings", "A thoughtful comparison", "Organized and edited"]
  D:
    t: "Literary analysis"
    do: "Write a 2-3 page essay on one Grimm or Andersen tale: its structure, its symbols and what it says about the time it came from. Support every claim with the text."
    rubric: ["A clear, arguable thesis", "Evidence from the text with quotations", "Considers the time and place of the tale", "Organized, with few errors"]
