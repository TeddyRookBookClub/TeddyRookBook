# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: ecosystems
title: "Ecosystems"
subject: science
icon: "🦉"
blurb: "Habitats, food chains and webs, decomposers, predators and prey, biomes, and how living things change their surroundings."
parts:
  - title: "Habitats"
    read: ["Habitats", "/biology/young-learners/habitats/"]
    ask:
      - "What does an animal need from its home?"
      - "Why can't a polar bear live in a desert?"
      - "What happens to the animals when a habitat changes quickly?"
    do: "Explore a square yard of ground (a hula hoop works). Count every living thing you find inside it, and draw a map of it."
    A: [lifek.habitats, lifek.land-habitats, lifek.water-habitats]
    B: [lifek.fit-habitat, lifek.animal-homes, lifesci.biotic-abiotic]
    C: [lifesci.biotic-abiotic, lifesci.levels-ecology, lifesci.ecosystem-roles]
    D: [lifesci.levels-ecology, hsbio.density-factors, hsbio.stability-change]
  - title: "Food Chains"
    read: ["Food Chains", "/biology/young-learners/food-chains/"]
    ask:
      - "What did you eat for lunch, and where did its energy first come from?"
      - "Draw a food chain with four links. What happens if one link disappears?"
      - "Why are there always fewer big predators than plant eaters?"
    do: "Make a food chain paper chain: each link is one living thing, starting with the Sun. Then join chains together into a web on the wall."
    A: [lifek.sun-energy, lifek.food-chains, lifek.producers-consumers]
    B: [lifek.food-chains, lifek.producers-consumers, lifesci.food-webs]
    C: [lifesci.food-webs, lifesci.web-changes, lifesci.energy-pyramids]
    D: [hsbio.energy-flow, lifesci.energy-pyramids, hsbio.keystone-species]
  - title: "Decomposers"
    read: ["Decomposers", "/biology/young-learners/decomposers/"]
    more: [["Nature Study: Field observations on ants", "/homeschool/nature-study/handbook-of-nature-study/lesson-95/"]]
    ask:
      - "What happens to a leaf after it falls?"
      - "Why are worms and mushrooms important to a forest?"
      - "Where would all the dead plants and animals be if there were no decomposers?"
    do: "Make a compost jar: layers of soil, leaves, fruit peels and a few worms. Keep it damp and dark, and look each week."
    A: [lifek.decomposers, lifek.once-living, lifek.caring-nature]
    B: [lifek.decomposers, lifesci.fungi, lifesci.helpful-harmful-microbes]
    C: [lifesci.fungi, lifesci.carbon-cycle, lifesci.nitrogen-cycle]
    D: [hsbio.matter-cycles, lifesci.nitrogen-cycle, weather.carbon-cycle]
  - title: "Predators and Prey"
    read: ["Predators and Prey (Science Lab)", "/science-lab/ecosystem/"]
    ask:
      - "Name a predator and its prey."
      - "How do prey animals stay safe? Think of colors, speed and herds."
      - "In the simulation, why do the numbers of rabbits and foxes rise and fall in turns?"
    do: "Play a predator-and-prey tag game in the yard: a few 'foxes' and many 'rabbits.' Count both after each round and graph them."
    A: [lifek.animal-diets, lifek.coverings, lifek.moving]
    B: [lifek.animal-diets, lifesci.structural-adaptations, lifesci.behavioral-adaptations]
    C: [lifesci.predator-prey, lifesci.species-interactions, lifesci.population-growth]
    D: [hsbio.population-models, hsbio.community-interactions, hsbio.group-behavior]
  - title: "Biomes of the World"
    read: ["Biomes in World Geography", "/geography/world-geography/biomes/"]
    ask:
      - "What is it like in a rainforest? In a desert?"
      - "Which biome do we live in? How can you tell?"
      - "Why are biomes found in bands around the world?"
    do: "Make a biome box (a shoebox scene) of a biome you would like to visit, with its plants, animals and weather."
    A: [maps.deserts-forests-grasslands, maps.continent-animals, maps.continents]
    B: [maps.deserts-forests-grasslands, worldgeo.biomes, lifek.land-habitats]
    C: [worldgeo.biomes, worldgeo.climate-zones, lifesci.biomes]
    D: [worldgeo.biome-climate, worldgeo.climographs, lifesci.biomes, lifesci.succession]
  - title: "People and Nature"
    read: ["Caring for Nature", "/biology/young-learners/caring-nature/"]
    more: [["Caring for nature (Outdoor Skills)", "/homeschool/outdoor-skills/caring-for-nature/"]]
    ask:
      - "How can our family take care of the living things around us?"
      - "How do people change ecosystems, for good and for harm?"
      - "People disagree about how to balance using land with protecting it. What are the main concerns on each side?"
    do: "Do one thing for local wildlife: hang a bird feeder, plant a native flower, or pick up litter at a park. Keep a log of the visitors."
    A: [lifek.caring-nature, lifek.change-surroundings, lifek.plant-care]
    B: [lifek.change-surroundings, lifesci.human-impact, lifesci.biodiversity]
    C: [lifesci.human-impact, lifesci.biodiversity, earthsci.natural-resources]
    D: [hsbio.biodiversity-impact, earthsci.human-impact, humangeo.human-environment, micro.negative-externalities]
projects:
  A:
    t: "My food chain mobile"
    do: "Make a hanging mobile of a food chain: the Sun at the top, then a plant, a plant eater and a meat eater. Tell the family how energy moves down it."
    rubric: ["Sun, plant and two animals", "In the right order", "Says how energy moves"]
  B:
    t: "Backyard habitat survey"
    do: "Survey one small area outside three times. List the living things you find, draw five of them, and make a food web from what you found."
    rubric: ["Three dated surveys", "Five careful drawings", "A food web with arrows the right way", "Neat and labeled"]
  C:
    t: "Biome travel guide"
    do: "Make a travel guide to one biome: climate (with a climograph), plants, animals, a food web, and how people use it."
    rubric: ["Accurate climate data and climograph", "Plants and animals that really live there", "A correct food web", "Clear, attractive layout"]
  D:
    t: "Population study"
    do: "Use the Predators and Prey simulation to run three experiments (change one setting each time). Graph the populations and write a report explaining the patterns with what you learned about ecology."
    rubric: ["Three controlled experiments", "Graphs of each run", "Explains patterns with correct ecology", "Says what a real ecosystem adds that the model leaves out"]
