# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: westward-expansion
title: "Westward Expansion"
subject: history
icon: "🐂"
blurb: "The Louisiana Purchase, Lewis and Clark, pioneers on the trails, the Gold Rush, the railroad, and the Native nations whose lands it crossed."
parts:
  - title: "The Louisiana Purchase"
    read: ["Lewis and Clark", "/american-history/young-learners/lewis-and-clark/"]
    ask:
      - "What did Lewis and Clark set out to find?"
      - "In 1803 the United States bought a huge territory from France. Why did both sides want the deal?"
      - "Jefferson wasn't sure the Constitution allowed the purchase, but he made it anyway. Was that the right call?"
    do: "On a blank map of the United States, color the land of the Louisiana Purchase. Then trace the route of Lewis and Clark up the Missouri River to the Pacific."
    A: [usyoung.lewis-and-clark, maps.cardinal-directions, maps.compass-rose]
    B: [usyoung.lewis-and-clark, usgeo.growth-of-the-us, usgeo.major-rivers]
    C: [ush1.jefferson-louisiana, usgeo.growth-of-the-us, usgeo.mississippi-system]
    D: [ush1.jefferson-louisiana, ush1.marshall-court, usgeo.continental-divide, usgeo.physical-regions]
  - title: "Explorers and Mapmakers"
    read: ["Using a Compass", "/geography/maps-and-places/using-a-compass/"]
    more: [["Maps and compass (Outdoor Skills)", "/homeschool/outdoor-skills/maps-and-compass/"]]
    ask:
      - "How can you tell which way is north?"
      - "Lewis and Clark had no maps of the West. How did they make their own?"
      - "Sacagawea and many Native guides helped the expedition. What did they know that the explorers didn't?"
    do: "Go outside with a compass. Make a map of your yard or a park, with a key, a compass rose and paces for distance."
    A: [maps.cardinal-directions, maps.sun-directions, maps.map-key]
    B: [maps.using-a-compass, maps.intermediate-directions, maps.map-scale]
    C: [worldgeo.latitude, worldgeo.longitude, worldgeo.read-coordinates]
    D: [worldgeo.read-coordinates, worldgeo.degree-distance, worldgeo.kinds-of-maps]
  - title: "Pioneers on the Trail"
    read: ["Pioneers", "/american-history/young-learners/pioneers/"]
    more: [["Westward Expansion in U.S. History I", "/american-history/us-history-1/manifest-destiny/"]]
    ask:
      - "What did pioneer families pack in their wagons?"
      - "Why would a family leave everything they knew to go west?"
      - "'Manifest destiny' was a popular idea in the 1840s. What did it claim, and who disagreed with it?"
    do: "Pack a pretend wagon: a space the size of a big blanket. Choose what to bring for a six-month trip, and weigh the pile on a bathroom scale."
    A: [usyoung.pioneers, k.compare-directly, k.sort-and-count]
    B: [usyoung.pioneers, g3.mass-and-liquid-volume, g4.convert-units]
    C: [ush1.manifest-destiny, ush1.territorial-growth, g6.unit-rate-problems]
    D: [ush1.manifest-destiny, ush1.mexican-american-war, ush1.territorial-growth, humangeo.push-pull]
  - title: "Gold Rush"
    read: ["Harvard Classics: Just Before the Gold Rush", "/harvard-classics/november-16/"]
    ask:
      - "Why did so many people rush to California in 1849?"
      - "Who got rich in the Gold Rush, the miners or the people who sold them supplies?"
      - "California grew so fast it became a state by 1850. What problems does very fast growth bring?"
    do: "Pan for 'gold': hide painted pebbles in a tub of sand and water and pan with pie tins. Then set prices for a store and see who earns more, the miner or the shopkeeper."
    A: [g2.coin-values, g2.count-money, k.count-out]
    B: [g2.money-word-problems, g4.multistep-word-problems, usgeo.pacific-states]
    C: [ush1.gold-rush-immigration, ush1.compromise-of-1850, g7.percent-change]
    D: [ush1.gold-rush-immigration, ush1.compromise-of-1850, micro.supply-shifters, micro.shortage-surplus]
  - title: "Native Nations of the West"
    read: ["Native Homes", "/american-history/young-learners/native-homes/"]
    ask:
      - "How did Plains peoples use the buffalo?"
      - "How did settlers and the railroad change life for Native nations?"
      - "Treaties were made and often broken. How should a nation keep its promises, and what happens to trust when it doesn't?"
    do: "Learn about the Native nation that lived where your home is now. Find its name on a map and one thing about its way of life, then share it at dinner."
    A: [usyoung.first-peoples, usyoung.native-homes, usyoung.native-nations-today]
    B: [usyoung.native-homes, usyoung.native-nations-today, ush1.native-cultures-1491]
    C: [ush1.native-societies, ush1.indian-removal, ush2.plains-wars]
    D: [ush1.indian-removal, ush2.plains-wars, ush2.assimilation-dawes, gov.tribal-government]
  - title: "The Railroad Ties It Together"
    read: ["The Transcontinental Railroad", "/american-history/us-history-2/transcontinental-railroad/"]
    ask:
      - "How long did it take to cross the country by wagon, and how long by train?"
      - "Who built the railroad, and what was the work like?"
      - "The railroad helped the country grow and also ended the open range. How do we weigh a change that helps some and harms others?"
    do: "Lay a 'railroad' of masking tape across the house from east to west, with a station for each part of the unit. Walk it and tell the story of the West in order."
    A: [usyoung.inventors, usyoung.then-and-now, maps.routes]
    B: [usyoung.inventors, usgeo.time-zones, g4.multistep-word-problems]
    C: [usgeo.time-zones, usgeo.time-zone-math, ush2.transcontinental-railroad]
    D: [ush2.transcontinental-railroad, ush2.industrialization, ush2.new-immigration, usgeo.time-zone-math]
projects:
  A:
    t: "My covered wagon"
    do: "Build a covered wagon from a small box, paper and straws. Put three tiny things in it a pioneer family would need, and say why."
    rubric: ["The wagon has a cover and wheels", "Three things a pioneer would need", "Says why each one matters"]
  B:
    t: "Trail diary"
    do: "Write five diary entries as a child on the Oregon Trail: leaving home, crossing a river, a hard day, meeting new people, arriving. Add a map of the route."
    rubric: ["Five dated entries", "Real places and dangers of the trail", "A map with the route", "Clear sentences, capitals and end marks"]
  C:
    t: "Then and now map"
    do: "Make a large map showing how the United States grew from 1783 to 1853, with each addition dated and colored, and a short paragraph on how each was gained."
    rubric: ["All the main additions shown and dated", "A paragraph for each, accurate", "Clear key and labels", "Neat and complete"]
  D:
    t: "Many sides of the West"
    do: "Write a 2-3 page essay on westward expansion from three points of view (a settler family, a Native nation, a railroad worker), using primary or secondary sources for each."
    rubric: ["Three viewpoints, each fairly given", "Evidence from sources, cited", "A thoughtful conclusion", "Organized, with few errors"]
