# Family Study unit (the format is described at the top of layouts/homeschool/family.html).
# key = file name; parts = about one week each; read/more = [title, URL on this site]; ask = three depths (all, older, oldest);
# A, B, C, D = ladder topic ids for ages 5-7, 8-10, 11-13 and 14-18; projects A-D = { t, do, rubric: [3 or 4 things to look for] }.
key: the-constitution
title: "The Constitution"
subject: history
icon: "📜"
blurb: "Why the Constitution was written, the three branches, checks and balances, the Bill of Rights, federalism, and how it can be changed."
parts:
  - title: "Why a Constitution?"
    read: ["Why We Have Rules", "/american-history/young-learners/why-rules/"]
    more: [["Harvard Classics: Hamilton, Father of Wall Street", "/harvard-classics/january-11/"]]
    ask:
      - "What would a game be like with no rules?"
      - "What problems did the country have under the Articles of Confederation?"
      - "The Preamble begins 'We the People.' Why does it matter who a government says its power comes from?"
    do: "Read the Preamble aloud and act out each of its six goals (union, justice, peace at home, defense, welfare, liberty) as charades."
    A: [usyoung.why-rules, usyoung.rules-and-laws, usyoung.constitution-young]
    B: [usyoung.constitution-young, ush1.articles-of-confederation, ush1.constitutional-convention]
    C: [ush1.articles-of-confederation, ush1.constitutional-convention, gov.preamble]
    D: [gov.purposes-of-government, gov.articles-weaknesses, gov.convention-compromises, gov.preamble]
  - title: "Three Branches"
    read: ["Three Branches", "/american-history/young-learners/three-branches-young/"]
    ask:
      - "What are the three branches, and what does each one do?"
      - "Why split power three ways instead of giving it to one person?"
      - "Give an example of one branch checking another. Is there a risk in too many checks?"
    do: "Make a three-legged stool from cardboard and label each leg with a branch. Take one leg away and see what happens."
    A: [usyoung.three-branches-young, usyoung.leaders-and-voting, usyoung.washington-dc]
    B: [usyoung.three-branches-young, gov.separation-of-powers, gov.checks-and-balances]
    C: [gov.article-1, gov.article-2, gov.article-3, gov.checks-and-balances]
    D: [gov.separation-of-powers, gov.checks-and-balances, gov.judicial-review, gov.federal-courts]
  - title: "Congress and How a Bill Becomes a Law"
    read: ["How a Bill Becomes a Law", "/american-history/civics-and-government/how-a-bill-becomes-law/"]
    ask:
      - "Who makes the laws for our country?"
      - "Why does Congress have two houses, one by population and one with two senators per state?"
      - "Most bills never become law. Is that a flaw, or did the framers mean it to be hard?"
    do: "Write a family 'bill' (a later bedtime on Fridays?). Pass it through two 'houses' (the kids and the grown-ups) and a 'president' who may sign or veto."
    A: [usyoung.leaders-and-voting, usyoung.good-citizens, usyoung.community-helpers]
    B: [gov.house-and-senate, gov.how-a-bill-becomes-law, usgeo.fifty-states]
    C: [gov.house-and-senate, gov.powers-of-congress, gov.how-a-bill-becomes-law]
    D: [gov.apportionment-redistricting, gov.committees, gov.how-a-bill-becomes-law, gov.representation]
  - title: "The Bill of Rights"
    read: ["The Bill of Rights in U.S. History I", "/american-history/us-history-1/bill-of-rights-1791/"]
    more: [["The Ratification Debate", "/american-history/ratification-debate/"]]
    ask:
      - "What is a right? Name one right you have."
      - "Why did some states refuse to ratify the Constitution until a bill of rights was promised?"
      - "Rights sometimes pull against each other or against public safety. How should a free country decide where one right ends?"
    do: "Make a poster of the first ten amendments in your own words, one short line each, with a small drawing for each."
    A: [usyoung.good-citizens, usyoung.rules-and-laws, usyoung.statue-of-liberty]
    B: [ush1.bill-of-rights-1791, gov.bill-of-rights-overview, gov.rights-and-responsibilities]
    C: [ush1.ratification-debate, gov.bill-of-rights-overview, gov.freedom-of-speech, gov.freedom-of-religion]
    D: [gov.federalist-antifederalist, gov.ratification-bill-of-rights, gov.selective-incorporation, gov.rights-of-accused]
  - title: "States and the Nation"
    read: ["The Fifty States", "/american-history/young-learners/fifty-states/"]
    ask:
      - "What is the capital of our state, and who leads it?"
      - "Name something the national government does and something our state or town does."
      - "Americans have argued since 1787 about how much power belongs to the states. What are the main arguments on each side?"
    do: "Find out three things your town or county government does (roads, libraries, parks). Visit one, or look at its website together."
    A: [usyoung.fifty-states, maps.states-of-us, maps.capital-city]
    B: [usgeo.fifty-states, usgeo.all-capitals, gov.local-government]
    C: [gov.federalism-basics, gov.state-government, gov.local-government]
    D: [gov.federalism-basics, gov.supremacy-necessary-proper, gov.interstate-relations, gov.tribal-government]
  - title: "Changing the Constitution"
    read: ["Amending the Constitution", "/american-history/civics-and-government/amending/"]
    ask:
      - "Can the rules of the Constitution ever change? How?"
      - "Why did the framers make amending hard, but not impossible?"
      - "Pick one amendment that changed who could vote. What arguments won it, and how long did it take?"
    do: "Play 'amend the family constitution': propose one change and see if you can get three-fourths of the family to agree."
    A: [usyoung.leaders-and-voting, usyoung.good-citizens, usyoung.then-and-now]
    B: [gov.amending, gov.voting-amendments, gov.becoming-a-citizen]
    C: [gov.amending, gov.voting-amendments, ush1.reconstruction-amendments]
    D: [gov.amending, gov.voting-amendments, gov.civics-test-government, gov.judicial-philosophy]
projects:
  A:
    t: "Our family rules book"
    do: "Make a small book of three family rules. Draw a picture for each and tell why it helps everyone."
    rubric: ["Three rules, each with a picture", "Says why each rule helps", "Book is finished and neat"]
  B:
    t: "The three branches poster"
    do: "Make a poster with the three branches: who is in each, what each does, and one way each checks another."
    rubric: ["All three branches shown correctly", "One check for each branch", "Clear labels and drawings", "Facts match the lessons"]
  C:
    t: "A citizen's guide to the Bill of Rights"
    do: "Make a pocket guide (a folded booklet) explaining each of the first ten amendments in plain words, with one example of each."
    rubric: ["All ten amendments included", "Plain, accurate explanations", "A fitting example for each", "Neat, readable layout"]
  D:
    t: "Federalist or Anti-Federalist? A position paper"
    do: "Read one Federalist essay and one Anti-Federalist essay on the same question. Write 2-3 pages explaining both arguments fairly, then say which you find more persuasive and why."
    rubric: ["Both arguments explained fairly and accurately", "Quotes from both essays", "A reasoned judgment of your own", "Organized and cited"]
