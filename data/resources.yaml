# Free resources page. Each group has a title and a list of links: name, url, note.
- title: "Learning Latin"
  icon: "🏛️"
  links:
    - {name: "Dickinson College Commentaries", url: "https://dcc.dickinson.edu/", note: "Latin and Greek texts with notes and vocabulary for learners, plus core vocabulary lists of the most common words."}
    - {name: "Latinitium", url: "https://latinitium.com/", note: "Articles, audio and videos in and about Latin, and a free dictionary search."}
    - {name: "Textkit", url: "https://www.textkit.com/", note: "Public-domain Latin and Greek textbooks to download, and a learners’ forum."}
    - {name: "The National Archives: Learn Latin", url: "https://www.nationalarchives.gov.uk/latin/", note: "Step-by-step beginner lessons with exercises."}
    - {name: "Whitaker’s Words", url: "https://archives.nd.edu/words.html", note: "Type any Latin word form and get its dictionary entry and parsing."}
    - {name: "The Latin Library", url: "https://www.thelatinlibrary.com/", note: "A large collection of plain Latin texts, from Plautus to the Middle Ages."}
    - {name: "Daily Dose of Latin", url: "https://dailydoseoflatin.com/", note: "Short videos that walk through one Latin sentence a day."}
- title: "Learning Greek"
  icon: "🏺"
  links:
    - {name: "Daily Dose of Greek", url: "https://dailydoseofgreek.com/", note: "Two-minute videos on one New Testament verse a day, plus a free beginner course."}
    - {name: "Ancient Greek Tutorials (Donald Mastronarde)", url: "https://atticgreek.org/", note: "Pronunciation guides, drills and paradigms from the University of California, Berkeley."}
    - {name: "STEP Bible", url: "https://www.stepbible.org/", note: "The Greek New Testament and Septuagint with a click-through dictionary and grammar for every word."}
    - {name: "Bible Hub Interlinear", url: "https://biblehub.com/interlinear/", note: "Word-by-word Greek and English for the whole New Testament."}
    - {name: "Logeion", url: "https://logeion.uchicago.edu/", note: "Look a word up in many Greek and Latin dictionaries at once, including Liddell–Scott–Jones and Lewis & Short."}
    - {name: "Alpheios Reading Tools", url: "https://alpheios.net/", note: "A browser add-on that explains any Greek or Latin word you double-click."}
- title: "Reading the texts"
  icon: "📜"
  links:
    - {name: "Perseus Digital Library", url: "https://www.perseus.tufts.edu/", note: "Greek and Latin literature with translations, dictionaries and word-by-word help."}
    - {name: "Scaife Viewer", url: "https://scaife.perseus.org/", note: "The newer reading interface for the Perseus collection."}
    - {name: "Loebolus", url: "https://ryanfb.github.io/loebolus/", note: "Public-domain Loeb Classical Library volumes as free PDFs."}
    - {name: "LacusCurtius", url: "https://penelope.uchicago.edu/Thayer/E/Roman/home.html", note: "Bill Thayer’s large site of Roman texts in translation, including Plutarch, Cassius Dio and Suetonius."}
    - {name: "The Internet Classics Archive", url: "https://classics.mit.edu/", note: "Several hundred works of classical literature in English translation."}
    - {name: "New Advent: Church Fathers", url: "https://www.newadvent.org/fathers/", note: "The writings of the early Church Fathers in English, including Augustine’s City of God."}
    - {name: "Christian Classics Ethereal Library", url: "https://www.ccel.org/", note: "Public-domain Christian writings from every period."}
- title: "Great books"
  icon: "📚"
  links:
    - {name: "Project Gutenberg", url: "https://www.gutenberg.org/", note: "Over 70,000 free e-books, including most of the Western canon."}
    - {name: "Standard Ebooks", url: "https://standardebooks.org/", note: "Carefully formatted and proofread editions of public-domain books."}
    - {name: "LibriVox", url: "https://librivox.org/", note: "Free audiobooks of public-domain works, read by volunteers."}
    - {name: "Internet Archive", url: "https://archive.org/", note: "Scanned books, including old editions of the Harvard Classics and many translations."}
    - {name: "Hillsdale College Online Courses", url: "https://online.hillsdale.edu/", note: "Free video courses on the great books, history and philosophy."}
    - {name: "Open Yale Courses", url: "https://oyc.yale.edu/", note: "Full recorded Yale lecture courses, including ancient Greek history and the early Middle Ages."}
- title: "History and background"
  icon: "🗺️"
  links:
    - {name: "World History Encyclopedia", url: "https://www.worldhistory.org/", note: "Readable, reviewed articles on the ancient and medieval world."}
    - {name: "Livius", url: "https://www.livius.org/", note: "Jona Lendering’s articles on ancient history, with many photographs of sites."}
    - {name: "ORBIS", url: "https://orbis.stanford.edu/", note: "Stanford’s travel map of the Roman world: how long and how costly a journey was."}
    - {name: "Pleiades", url: "https://pleiades.stoa.org/", note: "A gazetteer of ancient places, each with its location and names."}
    - {name: "Theoi", url: "https://www.theoi.com/", note: "Greek gods and myths, with the ancient sources quoted for each."}
    - {name: "The History of Rome (podcast)", url: "https://thehistoryofrome.typepad.com/", note: "Mike Duncan’s narrative of Rome from its founding to the fall of the West."}
    - {name: "Literature and History (podcast)", url: "https://literatureandhistory.com/", note: "Doug Metzger’s episode-by-episode tour of ancient literature."}
