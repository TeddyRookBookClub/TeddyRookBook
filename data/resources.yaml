# Free resources page. Each group has a title and a list of links: name, url, note.
- title: "Homeschool curricula"
  icon: "🏡"
  links:
    - {name: "Hannah Ward Education (Actual Reading)", url: "https://www.hannahwardeducation.com/", note: "Hannah Ward’s free early-years curricula: Little House Pre-K and Kindergarten, the alphabet, learning to read, American Pioneer and phonics boot camp, lesson by lesson. Also on this site, with her permission."}
    - {name: "AmblesideOnline", url: "https://www.amblesideonline.org/", note: "A free Charlotte Mason curriculum for every grade, built around living books, many of them public domain."}
    - {name: "Easy Peasy All-in-One Homeschool", url: "https://allinonehomeschool.com/", note: "A complete free online curriculum with a daily plan for each subject and grade."}
    - {name: "Core Knowledge Foundation", url: "https://www.coreknowledge.org/", note: "Free downloadable language arts, history and geography, and science materials, organized by grade."}
    - {name: "The Baldwin Project", url: "https://mainlesson.com/", note: "Hundreds of classic children’s books (history, myths, nature study) to read online."}
    - {name: "Lit2Go", url: "https://etc.usf.edu/lit2go/", note: "Free audiobooks and texts of classic stories and poems from the University of South Florida."}
- title: "Science and math"
  icon: "🔭"
  links:
    - {name: "Khan Academy", url: "https://www.khanacademy.org/", note: "Free lessons and practice in math and science, from counting to calculus, chemistry and physics."}
    - {name: "OpenStax", url: "https://openstax.org/", note: "Free, openly licensed high-school and college textbooks: physics, chemistry, biology, astronomy and math."}
    - {name: "CK-12", url: "https://www.ck12.org/", note: "Free online textbooks and practice for math and science, grades K–12."}
    - {name: "PhET Interactive Simulations", url: "https://phet.colorado.edu/", note: "Free physics, chemistry and earth-science simulations from the University of Colorado Boulder."}
    - {name: "NASA Space Place", url: "https://spaceplace.nasa.gov/", note: "NASA’s site for children about the Sun, planets, Earth and space, with activities."}
    - {name: "Stellarium Web", url: "https://stellarium-web.org/", note: "A free planetarium in your browser: see tonight’s sky from where you live."}
    - {name: "Royal Institution Christmas Lectures", url: "https://www.rigb.org/christmas-lectures", note: "The science lectures for young people that Faraday began in 1825, with recent lectures to watch online."}
- title: "Sign language (ASL)"
  icon: "🤟"
  links:
    - {name: "Lifeprint / ASL University", url: "https://www.lifeprint.com/asl101/lessons/lessons.htm", note: "Dr. Bill Vicars, a Deaf ASL professor, teaches 60 free lessons with videos, vocabulary and practice sentences, plus a big sign dictionary (free with ads)."}
    - {name: "ASL-LEX", url: "https://asl-lex.org/", note: "A free research dictionary of about 2,700 signs, each with a video, from university researchers."}
    - {name: "American Society for Deaf Children: ASL Stories", url: "https://deafchildren.org/knowledge-center/asl-resources/sign-language-stories/", note: "Hundreds of free videos of children's books retold in ASL."}
    - {name: "Clerc Center Bilingual Stories Bookshelf", url: "https://clerccenter.gallaudet.edu/real/bookshelf-app/", note: "Gallaudet's free app of picture books translated into ASL."}
    - {name: "Fingerspelling.xyz", url: "https://fingerspelling.xyz/", note: "A free webcam game that checks your fingerspelling; the site says the camera picture stays on your device."}
    - {name: "Signing Savvy", url: "https://www.signingsavvy.com/", note: "An ASL video dictionary; browsing by letter is free, with more for paid members."}
    - {name: "HandSpeak", url: "https://www.handspeak.com/", note: "An ASL dictionary and articles on fingerspelling, numbers and Deaf culture (free with ads; its terms ask that under-16s use it with a parent)."}
    - {name: "National Association of the Deaf: ASL", url: "https://nad.org/knowledge-hub/american-sign-language/", note: "Why ASL matters, from the national Deaf civil-rights organization."}
- title: "Growing food"
  icon: "🥕"
  links:
    - {name: "Food Garden Planner", url: "/garden/", site: true, note: "On this site: tell it your space, climate and household and it suggests what to grow, how much it might give you and how to rotate it."}
    - {name: "Growing Guides", url: "/garden/guides/", site: true, note: "On this site: step-by-step guides from a windowsill to a small farm, from extension services, USDA and CDC."}
    - {name: "USDA Plant Hardiness Zone Map", url: "https://planthardiness.ars.usda.gov/", note: "Find your zone by ZIP code."}
    - {name: "Land-Grant University Website Directory (USDA NIFA)", url: "https://www.nifa.usda.gov/grants/land-grant-university-website-directory", note: "Find your state's university extension service for local planting dates, soil tests and advice."}
    - {name: "Extension Master Gardener: Find a Program", url: "https://mastergardener.extension.org/find-a-program/", note: "Volunteer gardeners trained by extension who answer questions near you."}
    - {name: "National Center for Home Food Preservation", url: "https://nchfp.uga.edu/resources/entry/about-the-usda-guide-to-home-canning-2015-revision", note: "The USDA Complete Guide to Home Canning and tested methods for keeping your harvest."}
- title: "Chickens and bees"
  icon: "🐔"
  links:
    - {name: "Backyard chickens guide", url: "/garden/guides/#chickens", site: true, note: "On this site: before you start, choosing birds, chicks, coop and run, feed, eggs, health and meat birds."}
    - {name: "Honeybees guide", url: "/garden/guides/#bees", site: true, note: "On this site: getting bees, equipment, hive placement, the beekeeping year, mites, swarms and honey."}
    - {name: "University of Minnesota Extension: Raising chickens for eggs", url: "https://extension.umn.edu/agriculture/animals-and-livestock/poultry/raising-chickens-for-eggs", note: "A clear, thorough start for a small flock."}
    - {name: "USDA APHIS: Defend the Flock", url: "https://www.aphis.usda.gov/livestock-poultry-disease/avian/defend-the-flock", note: "Biosecurity for backyard birds: keeping avian flu and other diseases out."}
    - {name: "CDC: Backyard Poultry", url: "https://www.cdc.gov/healthy-pets/about/backyard-poultry.html", note: "Staying healthy around chickens, especially for young children."}
    - {name: "Penn State Extension: Beekeeping", url: "https://extension.psu.edu/beekeeping-honey-bees", note: "Articles, courses and seasonal guides for new beekeepers."}
- title: "Life skills"
  icon: "🔧"
  links:
    - {name: "Being an Adult 101", url: "/being-an-adult/", site: true, note: "On this site: 34 step-by-step guides for the house, the car, money and taxes, the kitchen and everyday life, each with the science or math behind it."}
    - {name: "FoodSafety.gov: Safe minimum internal temperatures", url: "https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures", note: "The U.S. government chart of safe cooking temperatures."}
    - {name: "CFPB: Consumer tools", url: "https://www.consumerfinance.gov/consumer-tools/", note: "Plain-language help with budgeting, bank accounts, credit reports and scores, and more, from the Consumer Financial Protection Bureau."}
    - {name: "NHTSA: Tires", url: "https://www.nhtsa.gov/vehicle-safety/tires", note: "Tire pressure, tread and safety from the National Highway Traffic Safety Administration."}
    - {name: "U.S. Fire Administration: Smoke alarms", url: "https://www.usfa.fema.gov/prevention/home-fires/prepare-for-fire/smoke-alarms/", note: "Where smoke alarms go, how to test them and when to replace them."}
- title: "Making and mending"
  icon: "🧵"
  links:
    - {name: "Sewing & Knitting", url: "/sewing/", site: true, note: "On this site: step-by-step stitches, buttons, hems, patches and darns, the sewing machine, knitting and crochet, with every tool explained."}
    - {name: "Outdoor Skills", url: "/homeschool/outdoor-skills/", site: true, note: "On this site: knots, maps, tracks, stars, camp cooking, whittling, handicrafts and more to learn and try."}
    - {name: "Craft Yarn Council: Learn to knit and crochet", url: "https://www.craftyarncouncil.com/getting_started.php3", note: "Free how-to pages, yarn weights and pattern standards from the yarn industry's trade group."}
    - {name: "Utah State University Extension: Sewing and needle arts", url: "https://extension.usu.edu/sewing/index", note: "4-H sewing, knitting and crochet handbooks and project sheets."}
    - {name: "University of Kentucky: Clothing repair", url: "https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-147.pdf", note: "Patching, darning, hems and seams: a classic extension guide."}
- title: "Learning Latin"
  icon: "🏛️"
  links:
    - {name: "Dickinson College Commentaries", url: "https://dcc.dickinson.edu/", note: "Latin and Greek texts with notes and vocabulary for learners, plus core vocabulary lists of the most common words."}
    - {name: "Latinitium", url: "https://latinitium.com/", note: "Articles, audio and videos in and about Latin, and a free dictionary search."}
    - {name: "Textkit", url: "https://www.textkit.com/", note: "Public-domain Latin and Greek textbooks to download, and a learners’ forum."}
    - {name: "The National Archives: Learn Latin", url: "https://www.nationalarchives.gov.uk/latin/", note: "Step-by-step beginner lessons with exercises."}
    - {name: "Whitaker’s Words", url: "https://archives.nd.edu/words.html", note: "Type any Latin word form and get its dictionary entry and parsing."}
    - {name: "The Latin Library", url: "https://www.thelatinlibrary.com/", note: "A large collection of plain Latin texts, from Plautus to the Middle Ages."}
    - {name: "Daily Dose of Latin", url: "https://dailydoseoflatin.com/", note: "Short videos that walk through one Latin sentence a day."}
- title: "Learning Greek"
  icon: "🏺"
  links:
    - {name: "Daily Dose of Greek", url: "https://dailydoseofgreek.com/", note: "Two-minute videos on one New Testament verse a day, plus a free beginner course."}
    - {name: "Ancient Greek Tutorials (Donald Mastronarde)", url: "https://atticgreek.org/", note: "Pronunciation guides, drills and paradigms from the University of California, Berkeley."}
    - {name: "STEP Bible", url: "https://www.stepbible.org/", note: "The Greek New Testament and Septuagint with a click-through dictionary and grammar for every word."}
    - {name: "Bible Hub Interlinear", url: "https://biblehub.com/interlinear/", note: "Word-by-word Greek and English for the whole New Testament."}
    - {name: "Logeion", url: "https://logeion.uchicago.edu/", note: "Look a word up in many Greek and Latin dictionaries at once, including Liddell–Scott–Jones and Lewis & Short."}
    - {name: "Alpheios Reading Tools", url: "https://alpheios.net/", note: "A browser add-on that explains any Greek or Latin word you double-click."}
- title: "Reading the texts"
  icon: "📜"
  links:
    - {name: "Perseus Digital Library", url: "https://www.perseus.tufts.edu/", note: "Greek and Latin literature with translations, dictionaries and word-by-word help."}
    - {name: "Scaife Viewer", url: "https://scaife.perseus.org/", note: "The newer reading interface for the Perseus collection."}
    - {name: "Loebolus", url: "https://ryanfb.github.io/loebolus/", note: "Public-domain Loeb Classical Library volumes as free PDFs."}
    - {name: "LacusCurtius", url: "https://penelope.uchicago.edu/Thayer/E/Roman/home.html", note: "Bill Thayer’s large site of Roman texts in translation, including Plutarch, Cassius Dio and Suetonius."}
    - {name: "The Internet Classics Archive", url: "https://classics.mit.edu/", note: "Several hundred works of classical literature in English translation."}
    - {name: "New Advent: Church Fathers", url: "https://www.newadvent.org/fathers/", note: "The writings of the early Church Fathers in English, including Augustine’s City of God."}
    - {name: "Christian Classics Ethereal Library", url: "https://www.ccel.org/", note: "Public-domain Christian writings from every period."}
- title: "Great books"
  icon: "📚"
  links:
    - {name: "Project Gutenberg", url: "https://www.gutenberg.org/", note: "Over 70,000 free e-books, including most of the Western canon."}
    - {name: "Standard Ebooks", url: "https://standardebooks.org/", note: "Carefully formatted and proofread editions of public-domain books."}
    - {name: "LibriVox", url: "https://librivox.org/", note: "Free audiobooks of public-domain works, read by volunteers."}
    - {name: "Internet Archive", url: "https://archive.org/", note: "Scanned books, including old editions of the Harvard Classics and many translations."}
    - {name: "Hillsdale College Online Courses", url: "https://online.hillsdale.edu/", note: "Free video courses on the great books, history and philosophy."}
    - {name: "Open Yale Courses", url: "https://oyc.yale.edu/", note: "Full recorded Yale lecture courses, including ancient Greek history and the early Middle Ages."}
- title: "History and background"
  icon: "🗺️"
  links:
    - {name: "World History Encyclopedia", url: "https://www.worldhistory.org/", note: "Readable, reviewed articles on the ancient and medieval world."}
    - {name: "Livius", url: "https://www.livius.org/", note: "Jona Lendering’s articles on ancient history, with many photographs of sites."}
    - {name: "ORBIS", url: "https://orbis.stanford.edu/", note: "Stanford’s travel map of the Roman world: how long and how costly a journey was."}
    - {name: "Pleiades", url: "https://pleiades.stoa.org/", note: "A gazetteer of ancient places, each with its location and names."}
    - {name: "Theoi", url: "https://www.theoi.com/", note: "Greek gods and myths, with the ancient sources quoted for each."}
    - {name: "The History of Rome (podcast)", url: "https://thehistoryofrome.typepad.com/", note: "Mike Duncan’s narrative of Rome from its founding to the fall of the West."}
    - {name: "Literature and History (podcast)", url: "https://literatureandhistory.com/", note: "Doug Metzger’s episode-by-episode tour of ancient literature."}
