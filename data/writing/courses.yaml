# Writing & Grammar Ladder courses, bottom rung first (the order of this list is the ladder).
# Contract: /tmp/briefs/ladders_spec.md and /tmp/briefs/mathladder_spec.md section 3; brief /tmp/briefs/writing_design.md.
# Skill maps: data/writing/topics/<key>.json (generated from /tmp/work_writing/src/*.py). Design notes and conventions for
# course builders: /tmp/work_writing/overview.md. The brief's one Grammar course is split in two (grammar, then usage
# and mechanics) because together they needed about 95 one-idea topics. Handwriting (hand) sits beside First Writing:
# both start the ladder (after: []), and neither needs the other.
- key: hand
  slug: handwriting
  title: "Handwriting: Print and Cursive"
  short: "Handwriting"
  band: "Elementary"
  grade: "K–4"
  icon: "🖍️"
  color: "#a8641a"
  blurb: "For ages 5 to 10, read aloud with a grown-up: sitting, holding the pencil and placing the paper, every print letter and number with its strokes, then a traditional cursive: the basic strokes, lowercase and capitals, joining letters, sentences, your signature, and reading cursive, old documents included."
  after: []
- key: fwr
  slug: first-writing
  title: "First Writing"
  short: "First Writing"
  band: "Elementary"
  grade: "1–3"
  icon: "✏️"
  color: "#b4531f"
  blurb: "For ages 6 to 9, with a grown-up nearby: complete sentences, capital letters and end marks, naming and action words, describing words, spelling patterns, joining ideas with and and but, writing about a picture, letters and thank-you notes, and stories with a beginning, middle and end."
  after: []
- key: gram
  slug: grammar
  title: "Grammar"
  short: "Grammar"
  band: "Middle school"
  grade: "4–8"
  icon: "🧩"
  color: "#2f6a8f"
  blurb: "How English sentences are built: the eight parts of speech, subjects and predicates, objects and complements, phrases and clauses, the four sentence structures, and sentence diagrams you can build by hand."
  after: [fwr]
- key: usage
  slug: usage-and-mechanics
  title: "Usage and Mechanics"
  short: "Usage and Mechanics"
  band: "Middle school"
  grade: "5–9"
  icon: "📌"
  color: "#7a4e9c"
  blurb: "The conventions of standard written English: agreement, pronoun case, verb tenses, modifiers, commas and every other mark, fragments and run-ons, parallel structure, capitals, tricky word pairs, and what to do where usage guides disagree."
  after: [gram]
- key: comp
  slug: composition
  title: "Composition"
  short: "Composition"
  band: "High school"
  grade: "6–10"
  icon: "📝"
  color: "#2f7d5a"
  blurb: "From paragraph to essay: the writing process, topic sentences and transitions, narrative, descriptive, expository and persuasive writing, thesis statements and outlines, evidence and quotations, paraphrase without plagiarism, MLA, APA and Chicago citations, revision, and letters and emails."
  after: [gram]
- key: rhet
  slug: rhetoric
  title: "Rhetoric and Advanced Writing"
  short: "Rhetoric"
  band: "High school"
  grade: "10–12"
  icon: "🏛️"
  color: "#4a5568"
  blurb: "High school to college, and a foundation for AP English Language: the rhetorical situation, ethos, pathos and logos, the Toulmin model, counterarguments, argument, rhetorical analysis and synthesis essays, style that is clear and concise, college essays and timed writing."
  after: [comp, usage]
