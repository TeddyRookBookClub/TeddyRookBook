  hw: [[99, 0]]
  note: 'Hannah Ward''s Little House lessons cover math and English. The Math Ladder''s Pre-K course and the pre-reading games are here too, as options.'
  link: {url: /homeschool/pre-k/, text: 'More in Pre-K at home →'}
  courses:
  - key: ar-little-house-prek
