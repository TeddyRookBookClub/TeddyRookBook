# The lesson planner's subjects and courses (layouts/homeschool/planner.html, static/homeschool/planner.js).
# Subject: key, name, icon, start/until (ages switched on by default; 99 = off), replaces (subjects switched off when
#   this one is switched on), mins and hw ([age up to, minutes] rows: lesson minutes a week, study minutes a day),
#   more: true (listed under "More subjects", with its note).
# Course: key, name, url, from/to (ages; the first course whose "to" fits a child's age is suggested), rep, alt (an
#   "also try" course the plan never moves into), w (the word before the number: Lesson, Chapter, Session...), and one of
#   data: <book data>   ar: <Hannah Ward curriculum>   ext: <data with lesson urls>
#   ladder: <ladder key> + lc: <course key>   one lesson per topic (mins each, about a school year at the subject's time)
#   practice: <page path> + sessions: N      a practice page, one session a school day (Today's practice, songs, Test Prep)
#   section: <page path>                      the section's pages by weight (Music chapters)
#   unit: <data/science_units key>            Science Lab and Business units, chapter by chapter
#   trade: <data/trades key>   adult: [<data/adult keys>]
# A course whose pages are missing from the build is left out of the planner.
