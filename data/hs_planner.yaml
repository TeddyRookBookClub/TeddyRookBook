# The lesson planner's subjects and courses (layouts/homeschool/planner.html, static/homeschool/planner.js).
# The ladders lead; the classic public-domain books stay as options ("also try" courses or their own subjects).
# Subject: key, name, icon, note (shown under the name), link: {url, text} (a link after the note, when that page is built),
#   on_ages: [[from, to], ...]  the ages it is switched on by default (empty: off until a parent switches it on),
#   rank: [[age up to, rank], ...]  its place in the list at each age: lower comes first, ties keep this file's order,
#     100 or more puts it under "More subjects" for that age. Ranks only order the list; they never switch anything on or off.
#   replaces: subjects switched off when this one is switched on (by default, or by a parent),
#   mins and hw: [[age up to, minutes], ...] rows: lesson minutes a week, study minutes a day.
# Course: key, name, url, from/to (ages; the first course whose "to" fits a child's age is suggested), rep, alt (an
#   "also try" course the plan never moves into), w (the word before the number: Lesson, Chapter, Session...), and one of
#   data: <book data>   ar: <Hannah Ward curriculum>   ext: <data with lesson urls>
#   ladder: <ladder key> + lc: <course key>   one lesson per topic (mins each, about a school year at the subject's time)
#   practice: <page path> + sessions: N      a practice page, one session a school day (Today's practice, songs, Test Prep)
#   section: <page path>                      the section's pages by weight (Music chapters, Learn to Debate)
#   unit: <data/science_units key>            Science Lab and Business units, chapter by chapter
#   lab: young | teen                         Science Lab play ideas (data/hs_planner_lab.yaml), dealt out one lab after another
#   trade: <data/trades key>   adult: [<data/adult keys>]
#   whole: true  lessons are never split across days: a lesson waits until the subject's minutes add up to it
#     (Science Lab: 40 minutes a week of 20-minute sessions = two sessions a week).
# A course whose pages are missing from the build is left out of the planner. Course keys are saved in people's plans:
# don't rename them (planner.js moves a saved course to the subject that now holds it).
subjects:
