# "Report a problem" (static/js/report.js): where people send the details they copy.
# channel: x      the dialog's second button opens X (the handle below); people paste the details in a direct message.
# channel: email  the button opens an email to the address below, with the details filled in. Needs an address;
#                 with none, the dialog stays on X.
# x_id (optional): the account's number on X. When set, the button opens the message box with the details already in it.
channel: x            # x | email
x_handle: teddyrookbook
x_id: ""
email: ""             # later, e.g. a forwarding address on the site's domain; never a personal address
