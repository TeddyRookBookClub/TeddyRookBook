book:
  id: sunmoonstarsastr00gibe
  title: 'Sun, Moon, and Stars: Astronomy for Beginners'
  year: '1893'
  key: sun-moon-stars
  short: Sun, Moon, and Stars
  eyebrow: Science · Astronomy · 1893
  hero: 'Agnes Giberne''s friendly tour of the heavens for beginners (new and revised edition, 1893): the Sun and its family of planets, the Moon, comets
    and shooting stars, then the stars, clusters, nebulae and the Milky Way. 31 guides for children about 9 to 12 cover the whole book, with the right page
    beside each one, safe things to try, and short notes on what we know now.'
  how:
  - <b>A little, often.</b> One guide is one session of 25 to 40 minutes. Two or three a week covers the book in about a school term or two.
  - <b>Look up as you go.</b> Start a Moon diary in Part I and keep it going, and watch for the planets and stars each chapter names. A free planetarium
    app or website helps you find them; cloudy weeks are fine, just catch up later.
  - <b>Never look at the Sun.</b> Not even for a moment, and not through sunglasses, smoked glass, binoculars or a telescope. The guides show the Sun safely
    with a pinhole or a colander, and the book's own old advice about darkened glass is marked as unsafe.
  - <b>What we know now.</b> The book is from 1893. Most of it holds up well, but numbers of moons, what sunspots and nebulae are, and why the Sun shines
    have changed. Each guide adds short notes so you can read the book as written and still teach today's science.
  - <b>Faith and science.</b> Each chapter opens with a Bible verse, and the author often speaks of God as Creator. Read these as your family wishes; the
    guides keep to the astronomy.
  - <b>Old words.</b> The author writes 'billions' in the old British sense (a million millions, an American trillion) and calls the Sun 'he' and the Earth
    and Moon 'she'. The guides point these out where they matter.
  unitword: Part
  lessonword: ''
  numnote: Guides follow the book's three Parts and their chapters in order; the book's own chapter is shown beside each title, and a few long chapters
    are split into two sessions.
units:
- id: 1
  name: 'Part I: Our family in the sky, and its neighbors'
  from: 1
  to: 12
  text: The Earth as one planet among many, the Sun, gravity, day and night and the seasons, the planets, the Moon, comets, meteors, and the first steps
    out to the stars.
- id: 2
  name: 'Part II: A closer look at the Solar System'
  from: 13
  to: 24
  text: Orbits and ellipses, sunspots, eclipses, the Moon's phases and the tides, each planet in turn, and comets and meteor showers.
- id: 3
  name: 'Part III: The stars'
  from: 25
  to: 31
  text: Many suns, famous stars, variable and double stars, clusters and nebulae, the Milky Way, reading starlight, and the lives of stars.
lessons:
- num: 1
  roman: Part I, Ch. I
  idx: 28
  unit: 1
  title: The Earth, one of a family
  mins: 30
  goal: Your child can explain that the Earth is a round, moving planet, that every star is a sun, and how a planet differs from a star.
  materials:
  - The book, open to Part I, Chapter I
  - A globe or a ball
  - Two small toy figures (or paper cut-outs) and a bit of tape
  - A clear evening for star-watching later this week
  book: 'The first chapter asks what our world is: once thought the flat, fixed center of everything, it is really a round globe that moves, one of a family
    of worlds called the Solar System. It explains that stars are suns, and that planets are worlds that shine by the Sun''s light.'
  steps:
  - - Hook question
    - 'Say: When you sit perfectly still on the couch, are you moving?

      Let your child answer, then say you will find out the surprising answer in this book.'
  - - Read together
    - 'Read the chapter aloud, or take turns by paragraph. It opens like this:

      ~ What is this world of ours?

      ~ Something very great — and yet something very little.

      Pause after the train example and ask if your child has ever felt a parked car or train seem to move when it was really the one next to it.'
  - - The big idea in plain words
    - 'People long ago thought the Earth was flat and still, with the Sun and stars going round it. In fact the Earth spins and travels, and the Sun and
      stars only seem to move, just as fields seem to rush past a train window.

      Read the book''s key sentences together:

      ~ A star is a sun. Our sun is nothing more nor less than a star.

      ~ so our earth or world is a planet, and planets are worlds.'
  - - 'Try it: which way is up?'
    - 'Tape one toy figure on the top of the globe and one on the bottom. Each one''s head points away from the Earth.

      Say: The book says up is always straight away from the Earth, and down is always toward its center. So both of these people are standing the right
      way up.

      Turn the globe slowly so your child sees neither figure is really upside down.'
  - - What we know now
    - 'The book says no one could tell how far the stars reach. Today we know our Sun is one star among hundreds of billions in a great star-city called
      the Milky Way galaxy, and that there are billions of other galaxies beyond it.

      The book also says the stars keep their places. They do move, but so slowly and so far away that the star patterns barely change in a human lifetime.'
  - - Tell it back
    - 'Ask your child to tell you, in their own words:

      What people used to believe about the Earth, and what we know instead.

      Why the Sun looks so much bigger and brighter than the other stars.

      How you can tell a planet from a star.'
  - - Check questions
    - 'What is the family of worlds that the Earth belongs to called?

      Is the evening star really a star?

      Why do the stars seem to rise and set every night?'
  - - Notice it this week
    - On a clear evening, go outside with an adult and let your eyes get used to the dark for 10 minutes. Look for the seven bright stars of the Great Bear
      (the Big Dipper) or, in winter, Orion. If you see a very bright point that does not twinkle, it may be a planet.
  practice: 'On another evening, look for a bright ''star'' low in the west after sunset. Watch it for a minute: does it twinkle? If not, it is probably
    Venus or another planet.'
  tip: If your sky is cloudy or too bright with city lights, a free planetarium app or website can show tonight's sky. Then look out when it clears.
  answers: 'The Solar System. No, the evening star (Venus) is a planet that shines by reflected sunlight. Because the Earth turns round once a day; the
    stars only seem to move. Model narration: People thought the Earth was flat and still in the middle of everything; now we know it is a round globe that
    spins and travels round the Sun. The Sun looks big because it is much nearer than the other stars. Planets usually do not twinkle, and they shine by
    the Sun''s light, not their own.'
- num: 2
  roman: Part I, Ch. II
  idx: 39
  unit: 1
  title: 'The head of our family: the Sun'
  mins: 35
  goal: Your child can describe how far away and how big the Sun is, using the book's train and model comparisons, and knows the Sun must never be looked
    at directly.
  materials:
  - The book, open to Part I, Chapter II
  - A tape measure or yardstick
  - A pea or a bead (about a quarter-inch) and a large ball
  - 'For the pinhole viewer: two pieces of stiff white card and a pin'
  book: This chapter gives the Sun's distance (about ninety-two million miles) and size (865,000 miles across), with a train ride and a field-sized model
    to picture them. Then it tells of the first sunspots and describes the Sun's shining surface, its fiery edge, the red prominences and the pale corona
    seen in an eclipse.
  steps:
  - - Safety first
    - 'Safety first: never look at the Sun, not even for a moment, and not through sunglasses, smoked or darkened glass, film, binoculars or a telescope.
      It can hurt your eyes for good, and it does not hurt while it happens.

      Say: In this chapter a man stares at the Sun until he is too dazzled to go on. That was dangerous, and we will never copy it. Today we will learn
      a safe way to see the Sun''s shape.'
  - - Read together
    - 'Read the chapter aloud. Stop at the big numbers and say them slowly together:

      ~ ninety-two millions of MILES.

      Then read the train journey: going at 60 miles an hour without stopping, a traveler would take about 175 years to get there.'
  - - Picture the size
    - 'The book says the Sun is about 108 times as wide as the Earth. Shrink the Earth to a one-inch ball, and the Sun becomes a globe nine feet across,
      set 320 yards away.

      Measure nine feet along the floor with the tape measure, and lay a one-inch object beside the end. Say: That little thing is the Earth. The whole
      nine feet is the Sun.'
  - - Make a pinhole viewer (the safe way)
    - 'Poke one small, neat hole in a card with a pin. Stand with your back to the Sun. Hold the pierced card up so sunlight passes through the hole, and
      let the light fall on the second card held about three feet below it.

      You will see a small round image of the Sun. Look only at the image on the card, never up through the hole.

      Say: This is how we look at the Sun: with our backs to it, at its picture.'
  - - What we know now
    - 'The book calls sunspots huge storms, perhaps holes. We now know they are cooler, darker patches made by the Sun''s powerful magnetism.

      The Sun is not made of molten metal clouds. It is a ball of extremely hot gas, mostly hydrogen and helium, about 10,000 °F at its surface.

      The book says little was known about the corona. We now know it is a very thin, extremely hot outer layer, over a million degrees, that streams out
      into space as the solar wind.

      The Sun''s average distance is about 93 million miles, very close to the book''s number.'
  - - Tell it back
    - 'Ask your child to tell you:

      How long a nonstop express train would take to reach the Sun.

      What sunspots taught astronomers about the Sun''s turning.

      What prominences are, and when people used to be able to see them.'
  - - Check questions
    - 'About how many times wider than the Earth is the Sun?

      How long does the Sun take to turn once on its axis?

      Why is it never safe to look at the Sun?'
  - - Notice it this week
    - Look at the shadows of leaves under a tree on a sunny day. The little round spots of light on the ground are pinhole images of the Sun, made by gaps
      between the leaves.
  practice: Ask a grown-up to help you look up today's photo of the Sun taken by a NASA space observatory, and count the sunspots. Check again a few days
    later to see that they have moved across the Sun.
  tip: The book mentions looking at the Sun 'through darkened glass'. That is not safe. Only the pinhole method (or special certified eclipse glasses, worn
    under adult supervision) is safe, and the pinhole is all you need here.
  answers: 'About 108 to 109 times wider. About twenty-five days (the book''s figure). Because its light can burn the back of the eye and cause lasting
    harm, without any pain while it happens. Train: about 350 years at 30 miles an hour, about 175 years at 60. Sunspots move across the Sun, vanish round
    one edge and come back on the other, which showed the Sun turns. Prominences are huge red tongues of glowing gas, mostly hydrogen, rising from the Sun''s
    edge; once they could be seen only in a total eclipse.'
- num: 3
  roman: Part I, Ch. III, part 1
  idx: 54
  unit: 1
  title: 'What binds the family together: gravity'
  mins: 30
  goal: Your child can explain that gravity pulls the planets toward the Sun, and that their forward speed keeps them from falling in, so they travel in
    orbits.
  materials:
  - The book, open to Part I, Chapter III
  - A soft ball or a sock tied in a knot, on a string about two feet long
  - An apple or a small ball to drop
  - A plastic cup half full of water and a towel
  book: 'The first half of the chapter explains attraction, or gravity: why an apple falls, why heavy things are heavy, and how Newton saw the same pull
    holding the planets to the Sun. A ball whirled on a string and a glass of water carried round a corner show why the Earth does not fall into the Sun.'
  steps:
  - - Hook question
    - 'Say: The Sun pulls hard on the Earth. So why doesn''t the Earth fall into the Sun?

      Let your child guess. Don''t correct yet.'
  - - Read together
    - 'Read the first part of the chapter, up to the sentence about the earth''s speed letting her wander away for ever. The book asks:

      ~ What causes an apple to fall to the ground when it drops from the branch?

      Drop the apple. Say: The Earth pulls it down. That pull is called gravity.'
  - - Try the book's string experiment
    - 'Go outside or to a clear space. Swing the soft ball on its string in a circle beside you (not over anyone''s head). Feel it pull outward.

      Say: The string is like the Sun''s pull. The ball is like the Earth, always trying to fly off in a straight line.

      Let go of the string once, away from people and windows, and watch the ball fly off straight.'
  - - The water and the corner
    - 'Over a towel, walk quickly with the half-full cup and turn sharply. Some water keeps going straight and slops out, just as in the book.

      Read the book''s rule together:

      ~ everything which is once set moving must continue moving in a straight line until checked.'
  - - Put it together
    - 'Say: The Sun pulls the Earth inward. The Earth''s speed carries it forward. The two together make it go round and round. That path is called an orbit.

      The book says the Earth goes more than eighteen miles every second.'
  - - What we know now
    - 'The book says two people floating far out in space would be pulled together and unable to stay apart. The pull between two people is real but extremely
      tiny; they would drift together only very slowly.

      Everything else here is still how scientists explain orbits. Newton''s ideas about gravity still guide spacecraft today.'
  - - Tell it back
    - Ask your child to explain, using the ball on the string, why the Earth goes round the Sun instead of falling in or flying away.
  - - Check questions
    - 'Who first showed that the same pull that drops an apple also holds the planets?

      What would happen if the Earth suddenly went much faster?

      What would happen to life on Earth without the Sun?'
  practice: Roll a marble around the inside of a round cake pan or pie plate. The rim keeps it turning, like the string. Lift the rim away at one point
    (or use a pan with a gap) and watch the marble roll off straight.
  tip: Keep the swinging ball soft and the string short, and swing it beside the body, not overhead.
  answers: 'Isaac Newton. She would slowly move farther from the Sun, and at about 25 miles a second she would escape it for ever. Without the Sun, plants
    would wither, water would freeze and animals and people would die. Model answer: the Sun''s pull is like the string, the Earth''s speed is like the
    ball''s pull outward; balanced together, the Earth keeps circling.'
- num: 4
  roman: Part I, Ch. III, part 2
  idx: 61
  unit: 1
  title: Day and night, and the seasons
  mins: 35
  goal: Your child can show with an orange and a lamp why we have day and night, and why the tilt of the Earth's axis gives us summer and winter.
  materials:
  - The book, open near the end of Part I, Chapter III
  - An orange
  - A wooden skewer or a pencil (an adult pushes it through the orange)
  - A lamp with its shade off, or a flashlight standing on end, in a darkened room
  - A marker
  book: 'The end of the chapter explains the Earth''s two movements: turning on her axis once a day, and going round the Sun once a year. The book shows
    both with an orange on a knitting needle near a candle: turning it makes day and night, and carrying it round the table with the needle always slanting
    the same way makes the seasons.'
  steps:
  - - Get ready
    - 'An adult pushes the skewer straight through the orange from top to bottom. Mark a dot for where you live on the upper half. Put the lamp in the middle
      of a table and darken the room.

      Safety: the book uses a candle. A bare lamp or an upright flashlight works just as well and is safer. If you do use a candle, an adult lights it and
      stays at the table.'
  - - Read together
    - 'Read from the paragraph about the old-world notion that the Earth was fixed, to the end of the chapter. Two key lines:

      ~ First: She turns round upon her axis once in every twenty-four hours.

      ~ Secondly: She travels round the sun once in about every three hundred and sixty-five days and a quarter.'
  - - Day and night
    - 'Hold the orange about a yard from the lamp. Turn it slowly on the skewer. Watch the dot go into light (morning), full light (midday), toward the
      shadow (evening) and into dark (night).

      Say: The lamp never moves. The turning makes the day.

      Then point to the middle of the orange and to a spot near the skewer. Say: The middle has much farther to go round in one turn. The book says a person
      at the equator is carried along at more than a thousand miles an hour.'
  - - The seasons
    - 'Now do it the book''s way. Tilt the skewer so the top points toward one wall of the room. Keep it pointing at that same wall the whole time as you
      walk the orange in a circle around the lamp.

      On one side, the top half gets more light: summer in the north. On the far side, the bottom half gets more: winter in the north. Halfway between,
      light falls evenly from pole to pole: the equinoxes.

      The book warns that everything depends on keeping the tilt pointing the same way.'
  - - What we know now
    - 'The book says the Earth has a third movement and saves it for later. (At the end of Part I it tells how the Sun carries the whole family with him
      through space.) We now know the Sun, with all its planets, also circles the center of our Milky Way galaxy, once in about 230 million years.

      Seasons: it is still exactly the tilt, as the book shows. The Earth''s distance from the Sun changes only a little through the year, and it is actually
      nearest in early January, during northern winter.'
  - - Tell it back
    - Ask your child to show you, with the orange and lamp, what makes day and night, then what makes summer and winter, explaining as they go.
  - - Check questions
    - 'How long does the Earth take to turn once? To go round the Sun once?

      Is summer caused by the Earth being nearer the Sun? (Let them think about the orange.)

      What is the Sun''s yearly path among the stars called?'
  - - Notice it this week
    - At the same time each day, mark where the shadow of a fence post or a stick in the ground ends. Over weeks you will see the noon shadow grow shorter
      toward summer and longer toward winter.
  practice: Repeat the orange-and-lamp walk, this time telling it to someone else in the family.
  tip: Painter's tape on the wall makes a good target for the top of the skewer, so it is easy to keep the tilt the same all the way round.
  answers: 'About 24 hours to turn; about 365 and a quarter days to go round the Sun. No: the seasons come from the tilted axis, which lets one half of
    the Earth get more direct sunlight and longer days. The ecliptic.'
- num: 5
  roman: Part I, Ch. IV
  idx: 70
  unit: 1
  title: The inner planets and the asteroids
  mins: 30
  goal: Your child can name the four inner planets in order from the Sun, say one fact about each, and explain why planets shine.
  materials:
  - The book, open to Part I, Chapter IV
  - A flashlight and a hand mirror
  - Four small balls or wads of paper to stand for planets
  - Paper and colored pencils for a planet chart
  book: Planets shine by reflected sunlight, like a mirror in the sun. The chapter sorts the planets into inferior (inside our orbit) and superior (outside),
    then into two groups of four with the asteroid belt between, and describes Mercury, Venus, Mars and the asteroids, with their years and speeds.
  steps:
  - - 'Hook: shining without a light'
    - 'In a dim room, shine the flashlight on the mirror so it flashes a spot on the wall. Then switch the flashlight off.

      Say: The mirror stopped shining. Planets are like the mirror. The Sun is like the flashlight.

      ~ A lamp shines by its own light; but a looking-glass, set in the sun''s rays and flashing beams in all directions, shines by reflected light.'
  - - Read together
    - 'Read the chapter aloud. Stop at the book''s list of the planets in two groups and copy it onto paper: Mercury, Venus, Earth, Mars, then the asteroids,
      then Jupiter, Saturn, Uranus, Neptune.'
  - - Planet birthdays
    - 'The book says a year on Mercury is not quite 88 days, so a person would have about four birthdays for each one of ours.

      Work out together: if you are 10 Earth years old, about how old would you be in Mercury years? (About 40.) Mars takes 687 days, nearly two of our
      years. About how old would you be on Mars? (About 5.)'
  - - Hoops on a table
    - 'Lay out four balls in a line from a lamp or a ''sun'' on the floor: Mercury, Venus, Earth, Mars. Walk each one round in a circle, the nearest ones
      faster.

      Say: The book says the orbits lie almost flat, like hoops on a table, and every planet goes round the same way.'
  - - What we know now
    - 'The book counts about 350 asteroids. Today more than a million are known.

      Pallas is not the largest: Ceres is, about 590 miles across, and it is now called a dwarf planet.

      Vulcan, the planet once thought to be inside Mercury''s orbit, does not exist.

      Venus has no moon, as the book suspected. Mars has two tiny moons, Phobos and Deimos.

      The dark patches on Mars are not water but darker rock and dust. Its white polar caps are ice.'
  - - Tell it back
    - Ask your child to name the inner planets in order and tell one thing about each from the book.
  - - Check questions
    - 'What is the difference between how a star shines and how a planet shines?

      Which two planets are inferior planets, and why?

      Why does Mercury have to travel faster than the Earth?'
  - - Notice it this week
    - Venus is often the brightest point in the sky after sunset or before sunrise. Look for it low in the west in the evening or the east in the morning,
      after the Sun is fully down or before it rises.
  practice: 'Start a planet chart: one box per planet, with its place from the Sun, its year, and one fact. Add the outer planets after the next lesson.'
  tip: Only look for Venus and Mercury when the Sun is completely below the horizon. Never sweep binoculars near where the Sun is.
  answers: 'A star shines by its own light; a planet shines by reflected sunlight. Mercury and Venus, because their orbits lie inside the Earth''s. Because
    it is nearer the Sun, the pull is stronger, so it must go faster or it would fall in. Order: Mercury, Venus, Earth, Mars. Facts from the book: Mercury''s
    year is under 88 days; Venus is nearly the size of the Earth and shows phases like the Moon; Mars is reddish, its day is only about 40 minutes longer
    than ours, and its year is 687 days.'
- num: 6
  roman: Part I, Ch. V
  idx: 82
  unit: 1
  title: The giant planets, and a model you can walk
  mins: 40
  goal: Your child can name the four outer planets in order, and has paced out a scale model that shows how huge the distances are.
  materials:
  - The book, open to Part I, Chapter V
  - A ball about 8 inches across (a playground ball) for the Sun
  - Pins, a peppercorn or two, a few beads, two hazelnuts or large marbles
  - Index cards and a marker for labels
  - 'A long open space: a park, a beach, or a quiet road with an adult'
  book: 'The chapter travels out past the asteroids to Jupiter, Saturn, Uranus and Neptune: their sizes, speeds, long years, moons and Saturn''s rings.
    It ends with two scale models (from Proctor and Herschel): one shrinks the Earth to three inches, the other puts a two-foot Sun at the center with Neptune
    more than a mile away.'
  steps:
  - - Read together
    - 'Read the chapter aloud. Pause at each new planet to add it to the planet chart from last time.

      Enjoy the book''s birthday jokes: a 37-year-old would be 3 on Jupiter, and a 60-year-old would just have had a second birthday on Saturn.'
  - - The book's two-foot Sun
    - 'Read the last pages again slowly. With a two-foot Sun, the Earth is a pea 215 feet away, Jupiter an orange nearly a quarter of a mile off, and Neptune
      a plum about a mile and a quarter away.

      ~ These proportions as to size and distance, if carefully studied, will serve to give a clearer idea of the Solar System as a whole than learning
      a long list of numbers would do.'
  - - Walk a smaller model
    - 'Use an 8-inch ball for the Sun, one third the size of the book''s. Then take big steps of about a yard each and place a labeled card for each planet:

      Mercury (a grain of sand or pin-head): 9 steps from the Sun.

      Venus and Earth (each a pin-head): 17 and 24 steps.

      Mars (a smaller pin-head): 36 steps.

      Jupiter (a large marble or hazelnut): 124 steps.

      Saturn (a slightly smaller hazelnut): 229 steps.

      Uranus and Neptune (each a peppercorn): 458 and 718 steps.

      Most families stop at Jupiter or Saturn and just point toward the rest. That is fine: the point is how empty space is.'
  - - Look back at the Sun
    - 'From the Earth card, look back at the 8-inch ball. Say: That is how big the Sun looks from Earth compared with the distance. Now look from Jupiter.'
  - - What we know now
    - 'The book''s eight planets are the same eight we count today. Pluto, found in 1930, is now called a dwarf planet.

      Moons: the book gives Jupiter five, Saturn eight, Uranus four, Neptune one. We now know Jupiter has about a hundred, Saturn well over two hundred,
      Uranus more than two dozen and Neptune more than a dozen, and more small ones are still being found.

      Saturn has many rings, not three, made of countless pieces of ice and rock. Jupiter, Uranus and Neptune have thin rings too.

      Jupiter and Saturn are giant balls of gas and liquid with no solid surface to stand on. Neptune is a little narrower than Uranus but heavier.'
  - - Tell it back
    - Ask your child to name all eight planets in order from the Sun and say which is biggest, which has the famous rings, and which takes longest to go
      round the Sun.
  - - Check questions
    - 'How many Earths would fit inside Jupiter, according to the book?

      How long is a day on Jupiter?

      How long is Neptune''s year?'
  practice: 'Make up a sentence to remember the order, one word per planet: for example, ''My Very Excellent Mother Just Served Us Nachos.'''
  tip: If space is short, walk only to Mars in the backyard and use a map app to find a landmark about the right distance away for Jupiter (about 124 yards)
    and Neptune (about 718 yards).
  answers: 'More than twelve hundred. About ten hours. About 165 of our years. Order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Jupiter
    is biggest, Saturn has the famous rings, and Neptune takes longest.'
- num: 7
  roman: Part I, Ch. VI
  idx: 95
  unit: 1
  title: A pretend trip to the Moon
  mins: 35
  goal: Your child can describe the Moon's size and distance, why we always see the same face, and what the Moon's surface is like, and starts a Moon diary.
  materials:
  - The book, open to Part I, Chapter VI
  - A notebook to become a Moon diary, and a pencil
  - 'For craters: a baking pan, about 2 inches of flour, a spoonful of cocoa powder, and a few marbles or pebbles'
  - Binoculars, if you have them (for the Moon at night only)
  book: 'The chapter visits ''our particular friend'', the Moon: about 240,000 miles away and a quarter as wide as the Earth, always turning the same face
    to us. Then the book takes an imaginary trip there: no air, no sound, a black sky with stars by day, sharp shadows, huge craters, and the Earth hanging
    large and still in the sky.'
  steps:
  - - Hook question
    - 'Say: If you shouted on the Moon, would anyone hear you?

      Keep the answer a secret until the reading reveals it.'
  - - Read together
    - 'Read the chapter aloud. When the imaginary journey begins, your child can close their eyes and picture it as you read.

      ~ Come — it will not take us long.

      Stop at the part about sound and ask the hook question again.'
  - - Always the same face
    - 'Walk slowly in a circle around a chair, always keeping your face toward it. Say: I turned all the way round once, and the chair only ever saw my
      face. That is how the Moon goes round the Earth.

      Let your child try it.'
  - - Make craters
    - 'Smooth the flour in the pan and dust the cocoa over the top. Drop marbles or pebbles from different heights, then lift them out gently. Look at the
      round pits, raised rims and splashed rays, like the Moon''s.

      Do this outside or over newspaper; it gets messy.'
  - - What we know now
    - 'The book wondered if the craters were old volcanoes. We now know most of them were blasted out by rocks from space crashing into the Moon, which
      is what your marbles copied.

      The book says the ground stays below zero even in the long Moon day. In fact the sunlit ground gets hotter than boiling water, and at night it drops
      far colder than any winter on Earth.

      Between 1969 and 1972, twelve astronauts really walked on the Moon. They found the black sky, the silence and the light, bouncy steps the book imagined.

      Spacecraft have photographed the far side many times. And small amounts of frozen water hide in dark craters near the Moon''s poles.

      Note: in the story the travelers look at the Sun through tinted glass. That would not be safe, on the Moon or on Earth.'
  - - Tell it back
    - 'Ask your child to describe the trip to the Moon as if they had just come home from it: what they saw, heard (or didn''t hear) and felt.'
  - - Check questions
    - 'About how far away is the Moon?

      Why do we only ever see one side of the Moon?

      Why is the sky black on the Moon, even in the daytime?'
  - - Start a Moon diary
    - 'Tonight or tomorrow, find the Moon (it is sometimes up in the daytime too). In the diary, write the date and time, draw its shape, and note where
      it is in the sky. Keep this up for a month.

      If you have binoculars, rest your elbows on a fence or car roof and look at the Moon. The craters show best along the line between light and dark.'
  practice: Add to the Moon diary every clear night or day you can. Leave a blank with 'cloudy' when you can't see it.
  tip: Only use binoculars on the Moon when the Sun has set, so there is no chance of swinging them toward the Sun.
  answers: 'About 240,000 miles. Because it turns once on its axis in exactly the time it takes to go once round the Earth. Because there is no air to scatter
    the sunlight; on Earth, the air makes the sky blue. (And no, no one would hear you shout: sound needs air to travel.)'
- num: 8
  roman: Part I, Ch. VII
  idx: 107
  unit: 1
  title: 'Visitors: the comets'
  mins: 30
  goal: Your child can describe the parts of a comet, explain why its tail points away from the Sun, and tell the story of Halley's Comet.
  materials:
  - The book, open to Part I, Chapter VII
  - Paper and pencil
  - A fan or a hair dryer on its cool setting, and a strip of tissue paper
  book: Comets once frightened people, who thought a collision would end the world. The chapter explains the head (nucleus and coma) and the tail, the three
    kinds of comet paths, why tails point away from the Sun, and the comets of Halley, Encke and Newton.
  steps:
  - - Read together
    - 'Read the chapter aloud. Enjoy the story of the shopkeeper family who fled to America to escape a comet. Ask: Was that a sensible thing to do?'
  - - Name the parts
    - 'Draw a comet together: the bright nucleus, the hazy coma (the ''hair'' around it) and the long tail.

      ~ The word "comet" means "a hairy body," the name having been given from the hairy appearance of the light around the nucleus.'
  - - Draw a comet's path
    - 'Draw a dot for the Sun. Around it, draw a nearly round loop for the Earth''s path. Then draw a very long, thin oval that passes just inside the Earth''s
      loop at one end and stretches far off the page at the other. That is a comet path like Halley''s.

      Say: The comet rushes fast when it swings close to the Sun, then creeps slowly far out past Neptune. (You will draw ovals the book''s way, with pins
      and thread, in Part II.)'
  - - Why the tail points away
    - 'Hold a strip of tissue in front of a fan or a hair dryer on cool. Walk the tissue around the fan in a circle. It always streams away from the fan,
      whichever way you walk.

      Say: The Sun is like the fan. Its light and a wind of tiny particles from it push the comet''s tail away.'
  - - What we know now
    - 'A comet''s nucleus is like a dirty snowball: a lump of ice, dust and rock usually a few miles across. Near the Sun the ice turns to gas, making the
      coma and tail.

      Halley''s Comet came back as predicted, last in 1986, and is due again in 2061.

      Comets can collide with planets: pieces of one comet crashed into Jupiter in 1994. But scientists watch the sky, and no known comet is on its way
      to hit the Earth.'
  - - Tell it back
    - Ask your child to tell why people were once afraid of comets, and what comets really are.
  - - Check questions
    - 'Which part of a comet is the heaviest?

      How long does Halley''s Comet take to go round the Sun?

      Name the three kinds of comet paths the book describes.'
  practice: Work out with your child how old they will be in 2061 when Halley's Comet returns. Write it in the planet chart or Moon diary.
  answers: The nucleus (the bright head). About 76 years. Closed oval paths that bring them back; paths so long that we cannot tell if they close; and open
    paths of visitors that pass once and never return.
- num: 9
  roman: Part I, Ch. VIII
  idx: 117
  unit: 1
  title: 'Little servants: shooting stars and meteorites'
  mins: 30
  goal: Your child can explain what a shooting star is, how the air protects us, and when to watch for a meteor shower.
  materials:
  - The book, open to Part I, Chapter VIII
  - A calendar
  - A blanket or reclining chair for a night of meteor-watching
  book: Shooting stars are not stars but tiny bodies circling the Sun in flocks, which burn up as they rush into our air. A few reach the ground as meteorites.
    The chapter also tells of fire-balls, the August and November showers, Saturn's rings, and the Zodiacal Light.
  steps:
  - - Hook question
    - 'Say: Have you ever seen a shooting star? Is it really a star?'
  - - Read together
    - 'Read the chapter aloud. It begins on a walk at night:

      ~ That which you have seen was not the beginning of a story, but in ninety-nine cases out of a hundred it was the end of a story.'
  - - Our blanket of air
    - 'Rub your palms together hard and fast. Feel them warm up. Say: A tiny meteor hits the air at many miles a second. The rubbing makes it so hot that
      it glows and vanishes, high above us. That glow is the shooting star.'
  - - Meteor showers on the calendar
    - 'The book names two showers in August and November. Mark them on your calendar. Say: The Earth crosses the same ''ring'' of meteors at the same time
      every year.'
  - - What we know now
    - 'Most shooting stars come from bits no bigger than a grain of sand. The meteor rings the Earth crosses are dust trails left behind by comets.

      Today the big August shower (the Perseids) is best around August 12 and 13, and the November one (the Leonids) around November 17. The Geminids in
      mid-December are often the best show of the year.

      The book guesses meteors might feed the Sun''s heat. We now know the Sun shines by nuclear fusion deep inside it, joining tiny particles of hydrogen
      into helium.

      The book is right that Saturn''s rings are made of countless small pieces: mostly ice, with some rock and dust.'
  - - Tell it back
    - Ask your child to tell the life story of one tiny meteor, from flying round the Sun with its flock to its last flash in our sky.
  - - Check questions
    - 'About how high up do shooting stars appear and vanish?

      What is a meteorite?

      What protects us from being hit by most meteors?'
  - - Notice it this week
    - Plan a meteor watch on a clear, moonless night, ideally near a shower date. Lie on a blanket with an adult, away from lights, and give your eyes 20
      minutes to adjust. Count the meteors you see in half an hour.
  practice: If a natural history museum is nearby, look for a meteorite you are allowed to touch.
  tip: On a meteor night, a red-light flashlight (or a regular one with red cellophane over it) keeps everyone's night vision.
  answers: They appear about seventy miles up and vanish about fifty miles up (the book's figures). A meteorite is a piece of rock or metal from space that
    reaches the ground. The Earth's atmosphere, the air.
- num: 10
  roman: Part I, Ch. IX, part 1
  idx: 126
  unit: 1
  title: 'Neighboring families: how many stars, and how far?'
  mins: 30
  goal: Your child knows that star 'magnitude' means brightness, and can show with their thumb how astronomers use a shift in view to measure distance.
  materials:
  - The book, open to Part I, Chapter IX
  - Just your thumb
  - A notebook for a star count
  book: 'Our Sun is just one star among millions. The chapter tells how many stars the eye can see (two or three thousand at once), what magnitudes mean,
    and how astronomers measure distance with a base-line, shown by a tree across a river. It ends with the first star distances: Alpha Centauri, 61 Cygni
    and Sirius.'
  steps:
  - - Read together
    - 'Read from the start of the chapter to the steeple seen through two window panes. Ask: How many stars do you think you can see on a clear night? Then
      read what the book says.'
  - - Magnitude means brightness
    - 'Say: Astronomers call the brightest stars ''first magnitude''. The faintest you can see without a telescope are ''sixth magnitude''. Bigger number,
      fainter star.

      ~ So when we speak of different magnitudes we really mean different brightnesses.'
  - - The thumb jump
    - 'Hold your thumb up at arm''s length in front of a far-off object, like a door frame or a tree. Close your left eye, then switch to the right eye.
      Your thumb seems to jump.

      Now bring your thumb close to your face and do it again. It jumps much more.

      Say: The space between your eyes is your base-line. Near things jump a lot, far things jump a little. Astronomers look at a star from opposite sides
      of the Earth''s orbit, six months apart, and measure its tiny jump.'
  - - Why it was so hard
    - 'Read the book''s steeple picture again: the stars are so far that even the Earth''s whole orbit is like two window panes looking at a steeple twenty
      miles off. Most stars hardly jump at all.'
  - - What we know now
    - 'The book says fewer than a hundred star distances were known. Today a space telescope called Gaia has measured the distances of more than a billion
      stars this same way.

      The book thinks other suns may have planets. Since the 1990s astronomers have found thousands of planets circling other stars, more than 5,000 so
      far.

      Our galaxy, the Milky Way, holds hundreds of billions of stars, not sixty million.'
  - - Tell it back
    - Ask your child to explain the river and tree example, and then do the thumb trick for someone else, explaining it.
  - - Check questions
    - 'About how many stars can a person see at once on a clear night?

      What does ''first magnitude'' mean?

      What is the nearest star whose distance the book gives?'
  - - Notice it this week
    - On a clear night, hold up a paper towel tube and count the stars you can see through it in one patch of sky. Try again from a darker spot, or on a
      night with no Moon, and compare.
  answers: About two to three thousand (five or six thousand round the whole world). The brightest stars, about twenty of them; magnitude means brightness,
    not size. Alpha Centauri.
- num: 11
  roman: Part I, Ch. IX, part 2
  idx: 134
  unit: 1
  title: The speed of light, and light that is years old
  mins: 25
  goal: Your child can say how fast light travels, how long sunlight takes to reach us, and what it means to see light that left a star years ago.
  materials:
  - The book, open to the last pages of Part I, Chapter IX
  - A watch or timer
  - A calculator (optional)
  book: 'The end of the chapter measures the star distances with light: it races 186,300 miles a second, takes about eight minutes from the Sun, over four
    years from Alpha Centauri, and nearly nine years from Sirius. The light of fainter stars may have started thousands of years ago.'
  steps:
  - - Read together
    - 'Read from ''Do you know how fast light travels'' to the end of the chapter.

      ~ Light takes time to travel.'
  - - Eight minutes from the Sun
    - 'Start the timer and sit quietly together for one minute, picturing a ray of sunlight racing toward the Earth. Say: It would have to keep going for
      about eight more minutes to reach us.

      The book says light could go about eight times round the Earth in one second. Count ''one-thousand-one'' together and picture that.'
  - - Light from the past
    - 'Say: When you look at Sirius, the light hitting your eye left it nearly nine years ago. How old were you then?

      Work out together what year the light left Sirius. (Take away nine from this year.)'
  - - What we know now
    - 'Sunlight takes about 8 minutes and 20 seconds to reach us, a little less than the book''s eight and three-quarters.

      Astronomers now measure star distances in light-years: how far light goes in a year. Alpha Centauri is about 4.4 light-years away, and a small companion
      star of it, Proxima Centauri, is the nearest star of all, at about 4.2.

      The book''s ''more than seven years'' for 61 Cygni is too short: its light takes about eleven years. Sirius is about 8.6, just as the book says, ''nearly
      nine''.

      The farthest galaxies we can see sent their light billions of years ago.'
  - - Tell it back
    - Ask your child to explain, in their own words, why looking at a star is a little like looking back in time.
  - - Check questions
    - 'How fast does light travel, according to the book?

      Without air, what color would the daytime sky be?

      How long does light take to reach us from Alpha Centauri?'
  - - Notice it this week
    - In winter, look for Sirius, the brightest star of the night, low in the south below Orion. Say hello to light that left it before you started school.
  answers: 186,300 miles a second. Black (the book says the sky would be black, with the stars showing). Four years and four months, by the book's figure
    (about 4.4 years).
- num: 12
  roman: Part I, Ch. X
  idx: 139
  unit: 1
  title: 'Our neighbors'' movements: the Pole-star and moving suns'
  mins: 35
  goal: Your child can find the Pole-star using the Pointers, explain why stars seem to circle it, and knows that the stars, and our Sun, really are moving.
  materials:
  - The book, open to Part I, Chapter X
  - An umbrella and some star stickers or chalk (to model the turning sky)
  - A clear evening, a watch, and the Moon diary
  book: The last chapter of Part I separates the stars' seeming movements (caused by the Earth's turning and journey) from their real ones. It shows how
    to find the Pole-star from the Pointers of the Great Bear, why stars near it never set, why the constellations never seem to change, and that our Sun
    is carrying its family toward the constellation Hercules.
  steps:
  - - Read together
    - Read the chapter aloud. At the Pointers, draw the Great Bear (Big Dipper) together and draw a line from its two end stars to the Pole-star.
  - - The umbrella sky
    - 'Put star stickers (or chalk dots) inside an open umbrella, including one at the very center for the Pole-star. Hold it over your child''s head and
      turn it slowly.

      Say: The center star stays put. The others go round it. Those near the edge dip below the ''horizon'' (the umbrella''s rim) and come back. That is
      how the sky seems to turn, because the Earth turns.'
  - - Ships on the horizon
    - 'Read the book''s picture of the ships seen from a cliff.

      ~ In ten thousand years you might see something. In fifty thousand years you might see much.

      Say: The stars race along, but they are so far away that in a person''s whole life the patterns don''t change.'
  - - We are moving too
    - Walk through a doorway or down a hall and watch the things at your sides slide backward. The book says astronomers used the same idea to find that
      our Sun is heading toward Hercules.
  - - What we know now
    - 'The Pole-star is very close to, but not exactly at, the sky''s north pole. Because the Earth''s axis slowly wobbles, other stars take turns being
      the pole-star over about 26,000 years.

      The ''distant centre'' the book wonders about is the middle of our Milky Way galaxy. The Sun carries us round it at about 140 miles a second, once
      in about 230 million years.

      Some of the star speeds in the book were measured again later. Sirius, for one, is actually drifting slowly toward us, not away.'
  - - Tell it back
    - Ask your child to explain why stars near the Pole-star never set, using the umbrella.
  - - Check questions
    - 'Which two stars point to the Pole-star?

      What would you see if you stood at the North Pole at night?

      Toward which constellation is our Sun traveling?'
  - - Notice it this week
    - 'Find the Big Dipper and the Pole-star early one evening and sketch where the Dipper is. Two hours later, look and sketch again. It will have turned
      around the Pole-star.

      If you live south of the equator, the Pole-star is below your horizon; use the Southern Cross instead, which circles the south pole of the sky.'
  practice: Keep up the Moon diary. By now you may notice the Moon rises later each day.
  answers: The Pointers, the two end stars of the Great Bear (Big Dipper). The Pole-star straight overhead and all the stars circling round it once in twenty-four
    hours, never rising or setting. Hercules.
- num: 13
  roman: Part II, Ch. I
  idx: 160
  unit: 2
  title: 'More about the Solar System: ellipses and a corkscrew path'
  mins: 35
  goal: Your child can draw an ellipse the book's way, explain that the Sun sits at one focus of each orbit, and describe the Earth's corkscrew path as
    the Sun carries it through space.
  materials:
  - The book, open to Part II, Chapter I
  - A sheet of paper on a corkboard, cardboard or a folded towel
  - Two pins or thumbtacks
  - A loop of thread or thin string (tie the ends), and a pencil
  - A Slinky or a spring, if you have one
  book: Part II begins by looking at the whole Solar System again, far fuller than people once thought. It explains the Earth's third motion (traveling
    through space with the Sun), the difference between a circle and an ellipse, how to draw both with pins and thread, and how the planets tug on one another.
  steps:
  - - Read together
    - 'Read the chapter aloud. At the part about the little boy walking round the mast of a moving ship, stop and act it out: walk in a circle around a
      chair while someone slowly pushes the chair across the room on a rug, or just picture it.'
  - - Draw a circle and an ellipse
    - 'Follow the book exactly. One pin and a loop of thread make a circle. Then:

      ~ To draw an ellipse you must fix two pins.

      Draw ovals with the pins close together, then farther apart. Finally draw a ''comet orbit'' with the pins five or six inches apart, as the book suggests.'
  - - Where is the Sun?
    - 'Say: In a planet''s orbit, the Sun sits at one of the pins, not in the middle. So a planet is a little nearer the Sun at one time of year.

      The book says the Earth is about three million miles nearer in our northern winter than in summer, and that this hardly matters to how warm we feel.'
  - - The corkscrew
    - 'Stretch a Slinky slowly upward, or draw a long spiral. Say: The Earth goes round and round the Sun, but the Sun is moving too, carrying us along.
      So our true path through space is like a corkscrew.'
  - - Planets pulling on planets
    - 'The book explains that Jupiter and Saturn speed each other up and slow each other down as they pass, and that this is how astronomers weigh the planets:
      like two children pulling against each other to see who is stronger.'
  - - What we know now
    - 'The book wonders whether there is life on other worlds. Scientists are still searching, on Mars and on icy moons such as Europa and Enceladus, which
      have hidden oceans under their ice. So far, life has been found only on Earth.

      Space between the planets is not quite empty, as the book guesses: it holds dust, gas and a thin wind of particles streaming out from the Sun.'
  - - Tell it back
    - Ask your child to explain, using the ship and the mast, how the Earth can go round the Sun and travel through space at the same time.
  - - Check questions
    - 'What is the difference between a circle and an ellipse?

      How many foci does an ellipse have?

      When is the Earth nearest the Sun?'
  practice: Draw a planet orbit (pins about half an inch apart) and a comet orbit (pins five or six inches apart) on the same sheet, and color the Sun at
    one focus of each.
  tip: Keep the thread tight against the pencil the whole way round; that is the trick to a smooth ellipse.
  answers: A circle is the same distance from its center all the way round and has one center (focus); an ellipse is an oval with two foci. Two. In the
    northern winter (early January).
- num: 14
  roman: Part II, Ch. II
  idx: 178
  unit: 2
  title: 'More about the Sun: sunspots and eclipses'
  mins: 40
  goal: Your child can describe the parts of a sunspot and the eleven-year sunspot cycle, and can explain total, partial and annular eclipses of the Sun
    with a ball and a lamp.
  materials:
  - The book, open to Part II, Chapter II
  - A lamp with the shade off, and a small ball
  - A coin
  - 'For safe Sun-viewing: a kitchen colander or a pinhole card, and a sheet of white paper'
  - A compass (the kind with a needle)
  book: This chapter looks closer at sunspots (umbra, penumbra and nucleus), their changes, the eleven-year sunspot cycle and its link with compass needles,
    and the 'willow-leaf' mottling on the Sun. Then it explains eclipses of the Sun, with a candle and a ball, and quotes an eyewitness of the total eclipse
    of 1860 in Spain.
  steps:
  - - Safety first
    - 'Safety first: never look at the Sun, not even for a moment, and not through sunglasses, smoked or darkened glass, film, binoculars or a telescope.
      It can hurt your eyes for good, and it does not hurt while it happens.

      Say: Even during an eclipse, when part of the Sun is covered, the uncovered part can still hurt your eyes. We will watch eclipses only by projection.'
  - - Read together
    - 'Read the chapter aloud. Stop after the sunspot cycle and ask: Why do you think people laughed at the man who compared the sunspots and the compass
      needles? Were they right to laugh?'
  - - The eleven-year beat
    - 'Say: Sunspots come and go in a rhythm, many for a few years, then few, then many again, about every eleven years. And when there are most spots,
      compass needles on Earth shake most.

      Look at your compass needle. It points north, steady, because the Earth is a giant magnet.'
  - - Small covers big, and making an eclipse
    - 'Hold a coin at arm''s length and close one eye. Cover a whole house, tree or car far away with it.

      ~ Any small object very near will easily hide from your sight a large object at a considerable distance.

      In a darkened room, stand facing the lamp, a few feet away. Move the ball slowly across, between your eye and the bulb. When it covers the bulb exactly,
      that is a total eclipse. A little high or low, a partial one. Move the ball farther from your eye so it looks smaller than the bulb: a ring of light
      shows all round. That is an annular eclipse.

      Never do this with the real Sun.'
  - - What we know now
    - 'Sunspots are not cyclones or holes. They are patches where the Sun''s magnetism is very strong. They look dark only because they are a few thousand
      degrees cooler than the glowing surface around them.

      The bright outburst the two astronomers saw (in 1859) was a solar flare. Flares and eruptions can fling particles toward Earth that shake compass
      needles, make bright auroras (northern lights), and even upset satellites and power lines.

      The ''willow leaves'' are called granules: the tops of bubbling columns of hot gas, each several hundred miles across, rising and sinking in minutes.'
  - - Tell it back
    - 'Ask your child to retell the 1860 eclipse from the book: the colors of the sky, the people, the birds and the flowers.'
  - - Check questions
    - 'Why can an eclipse of the Sun happen only at new moon?

      What is an annular eclipse?

      How long is the sunspot cycle?'
  - - Notice it this week
    - On a sunny day, hold a colander over white paper with your back to the Sun. Each hole makes a little round picture of the Sun. During a partial eclipse
      they all turn into little crescents. Look up the date of the next solar eclipse visible where you live.
  practice: Each sunny day this week, check a NASA solar-observatory image of the Sun online with an adult and count the spots. Does the count change?
  tip: If an eclipse comes your way, the colander or a pinhole card, or the dappled light under a leafy tree, is the safest way for children to enjoy it.
  answers: Because only at new moon is the Moon between the Earth and the Sun. An annular eclipse is when the Moon is a little farther away, looks slightly
    smaller than the Sun, and leaves a bright ring showing round it. About eleven years.
- num: 15
  roman: Part II, Ch. III
  idx: 191
  unit: 2
  title: 'Yet more about the Sun: prominences, the corona, and the Sun''s pull'
  mins: 30
  goal: Your child can describe a solar prominence and the corona, and compare how much they would weigh on the Sun, the Earth and the Moon.
  materials:
  - The book, open to Part II, Chapter III
  - Paper and pencil, or a calculator
  - A bathroom scale (optional)
  - Black paper and white and red crayons or pastels
  book: The chapter describes a giant eruption Professor Young watched in 1871 at the edge of the Sun, the shapes and heights of the red prominences, and
    the many descriptions of the corona seen in eclipses. It ends with the Sun's size, density and enormous pull.
  steps:
  - - Read together
    - 'Read the chapter aloud. At the story of Professor Young, pause: he was called away for half an hour, and when he came back the great cloud of fire
      had been blown to shreds.

      Say: He watched it with a special instrument, the spectroscope, not with his bare eyes.'
  - - How big are the flames?
    - 'Read:

      ~ The earth, Venus, Mars, and Mercury would lie like little toy-balls at its foot.

      Draw a curved Sun edge on black paper, a red prominence rising from it, and a tiny dot for the Earth at its foot.'
  - - The corona
    - Read a few of the book's descriptions of the corona aloud. Let your child add a soft white crown with streamers around the Sun picture, in the style
      they like best.
  - - Weigh yourself on other worlds
    - 'The book says a person would be crushed by their own weight on the Sun and could leap over a house on the Moon. Use real numbers: on the Sun''s surface
      you would weigh about 28 times as much as on Earth; on the Moon, about one sixth.

      Take your child''s weight. Work out their ''Sun weight'' (times 28) and ''Moon weight'' (divided by 6).'
  - - What we know now
    - 'The book says knowledge of the corona was ''in its infancy''. We now know it is the Sun''s very thin, extremely hot outer air, over a million degrees,
      and a spacecraft, the Parker Solar Probe, has flown through it.

      The eruption Young saw is what scientists now call a coronal mass ejection: a huge cloud of the Sun''s gas thrown out into space.

      The book is right that the Earth is about four times as dense as the Sun.'
  - - Tell it back
    - Ask your child to tell Professor Young's story as if they were the professor writing in a diary that evening.
  - - Check questions
    - 'What gas are the prominences mostly made of?

      When can people see the corona without special instruments?

      Why is the pull of gravity so strong on the Sun?'
  practice: 'Hang the black-paper Sun picture up and label: photosphere, prominence, corona.'
  answers: Glowing hydrogen gas. Only during a total eclipse of the Sun, when the Moon covers the bright face. (Photographs of eclipses are the easy way
    to enjoy it.) Because the Sun is so enormous; even though it is less dense than the Earth, its huge size gives it great weight and pull.
