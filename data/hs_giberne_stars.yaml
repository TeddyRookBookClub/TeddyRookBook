  unit: 3
  title: The Milky Way
  mins: 30
  goal: Your child can describe the Milky Way as our home galaxy, explain why Herschel's map was mistaken, and picture how big it is with a scale model.
  materials:
  - The book, open to Part III, Chapter V
  - Two small beads or peppercorns
  - A map app or a road map of your area
  - A dark-sky outing, if you can arrange one
  book: The Milky Way, a soft band of light round the whole sky, is made of countless suns, with dark gaps like the Coal-sack. The chapter tells how Herschel
    counted stars in different directions to sketch its shape, why his rules could mislead, how bright stars gather along it, and imagines a model with
    the Sun and Alpha Centauri just one yard apart.
  steps:
  - - Read together
    - 'Read the chapter aloud.

      ~ There are little suns as well as great suns in the Milky Way.'
  - - Herschel's mistake
    - 'Say: Herschel assumed all stars are about the same, so dim stars must be far away. The book points out the flaw: 61 Cygni is dim, Sirius is bright,
      yet Sirius is the farther of the two.

      Ask: What other mistake could make him think he had reached the edge, when he saw a dark patch?'
  - - The one-yard model
    - 'Do the book''s model. Put two beads one yard apart: the Sun and Alpha Centauri. Say: In this model, the Sun and the Earth would be closer together
      than the width of a hair.

      Then look at a map. At this scale, our whole Milky Way would be about 13 miles across. Find a town about 13 miles away. The Andromeda Galaxy would
      be about 325 miles away. Find a city that far.'
  - - What we know now
    - 'The Milky Way is a flat, spiral-shaped galaxy about 100,000 light-years across, with hundreds of billions of stars. The Sun is not near the middle,
      as Herschel thought; it is about halfway out, in one of the spiral arms.

      Herschel was fooled partly by dust: dark clouds of dust block the light of stars behind them. The Coal-sack is one of these dust clouds.

      The book''s guess that little suns may outnumber great ones was right: small red stars are the most common of all.'
  - - Tell it back
    - Ask your child to describe what the Milky Way is and where we are in it, using a dinner plate as the galaxy and a crumb as the Sun.
  - - Check questions
    - 'What is the dark gap in the southern Milky Way called?

      About how many stars can be seen with the naked eye in the whole sky, according to the book?

      Which way is the Sun traveling, according to the book?'
  - - Notice it this week
    - The Milky Way needs a dark sky, far from city lights, on a night without a bright Moon. Summer and early autumn evenings show its brightest part,
      toward Sagittarius in the south. Many parks hold dark-sky nights.
  answers: The Coal-sack. Not more than six thousand. Toward the neighborhood of the constellation Hercules.
- num: 30
  roman: Part III, Ch. VI
  idx: 342
  unit: 3
  title: 'Reading the light: the spectroscope'
  mins: 35
  goal: Your child can make a spectrum, name its colors in order, and explain how dark lines in starlight tell what a star is made of and whether it is
    coming or going.
  materials:
  - The book, open to Part III, Chapter VI
  - A clear glass of water and a sheet of white paper (for a sunny window)
  - An old CD or DVD
  - A lamp
  - A TV remote and a phone camera (optional)
  book: The spectroscope splits light into its colors. The chapter explains how heat turns metals to gas, how Newton's prism spreads white light into red,
    orange, yellow, green, blue, indigo and violet, how a narrow slit shows dark lines in sunlight, and how each gas makes its own lines, so we can tell
    that iron, sodium and hydrogen are in the Sun and stars. A shift in the lines shows a star rushing toward or away from us.
  steps:
  - - Read together
    - 'Read the chapter aloud.

      ~ The spectroscope may be looked upon as twin-sister to the telescope.'
  - - Make a rainbow (the safe way)
    - 'Set a full glass of water on a sunny windowsill and put white paper on the floor or table where the light comes through. Move the paper until a little
      rainbow appears. Look at the paper, not at the Sun.

      Name the colors in order together: red, orange, yellow, green, blue, indigo, violet. Just as the book says, red is bent the least and violet the most.'
  - - A spectrum from a CD
    - 'Hold a CD under a lamp and tilt it until bands of color appear. Try different lights in the house: an old-style bulb gives a smooth rainbow, while
      some LED and fluorescent lights give broken bands. Say: Different lights have different ''fingerprints''. That is the whole idea of the spectroscope.'
  - - Light we cannot see
    - 'The book says there are rays below the red that we can feel as warmth but cannot see. Point a TV remote at a phone camera and press a button. Many
      cameras show a flicker of light your eyes cannot see: that is infrared, below the red.'
  - - Coming and going
    - 'Say: When a siren comes toward you, its sound is higher; going away, lower. The book says starlight does something like this: the waves are pressed
      together when a star comes toward us and stretched when it goes away. Listen for a passing car or siren this week.'
  - - What we know now
    - 'In 1868 astronomers found lines in the Sun''s light that matched no known element. They named it helium, after the Greek word for the Sun, and found
      it on Earth only years later.

      The spectroscope showed that stars are made mostly of hydrogen and helium. And the shifting of lines in the light of distant galaxies showed that
      the universe is expanding.

      Tiny wobbles in a star''s lines, caused by a planet tugging it, have helped find many of the planets now known around other stars.'
  - - Tell it back
    - Ask your child to explain, in their own words, how astronomers can tell there is iron in the Sun without going there.
  - - Check questions
    - 'Who first found that white light is made of many colors?

      Which color is bent least by a prism? Which most?

      Why are moonlight''s dark lines the same as sunlight''s?'
  tip: Do the glass-of-water rainbow when the Sun is low (morning or late afternoon), so the light streams in sideways. Remind your child to keep their
    back to the window and look only at the paper.
  answers: Newton. Red is bent least, violet most. Because moonlight is really sunlight reflected from the Moon.
