  - - What we know now
    - 'Sirius'' companion is a white dwarf: a burned-out star about the size of the Earth but as heavy as the Sun. It is not cooler than Sirius, as the
      book guesses; it is actually hotter, but so small that it is very faint.

      Light from Sirius takes about 8.6 years to reach us (the book says twenty years here, but nearly nine in Part I; the nine is right). Sirius is also
      drifting slowly toward us, not away.

      Alpha Centauri has a third, tiny red star, Proxima Centauri, which is the nearest star to the Sun of all. Planets have been found circling Proxima.

      61 Cygni is about 11 light-years away, a little farther than the book thought.'
  - - Tell it back
    - Ask your child to choose one of the three stars and tell everything the book says about it.
  - - Check questions
    - 'Why did astronomers think the faint star 61 Cygni might be near?

      Can you see Alpha Centauri from England or most of the United States?

      How did astronomers know Sirius had a companion before they saw it?'
  - - Notice it this week
    - 'In winter, find Sirius: follow the three stars of Orion''s belt down and to the left. Notice how it twinkles in many colors when low in the sky.
      That is our air shaking its light, not the star changing.'
