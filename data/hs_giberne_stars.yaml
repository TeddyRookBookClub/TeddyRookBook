  materials:
  - The book, open to Part II, Chapter IV
  - A lamp with the shade off, in a darkened room
  - A white ball (a foam ball on a pencil, or an orange)
  - The Moon diary
  book: The Moon has almost no air, likely because her weak pull could not hold it. The chapter compares her size and weight with the Earth's, explains
