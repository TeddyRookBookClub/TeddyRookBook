  steps:
  - - Look at the Moon diary
    - 'Open the Moon diary. Lay out the drawings in order. Ask: What pattern do you see? Does the bright part grow from one side?'
  - - Read together
    - Read the chapter aloud, up to the candle-and-ball experiment.
  - - Make the phases
    - 'Do the book''s experiment with a lamp instead of a candle. Your child holds the ball out at arm''s length, a little above their head, and turns slowly
      to the left on the spot, watching the ball.

      Facing the lamp: the lit side is turned away. New moon.

      A quarter turn: half of what you see is lit. First quarter.

      Back to the lamp: the whole face is lit. Full moon.

      Another quarter turn: last quarter. Then new moon again.

      Let your child name each phase as it appears and match it to a Moon diary drawing.'
  - - Eclipses with the same ball
    - 'Hold the ball exactly between your eye and the lamp: it hides the lamp, a ''Sun'' eclipse at new moon. Hold it exactly behind your head, away from
      the lamp: your head''s shadow falls on it, a ''Moon'' eclipse at full moon.

      Say: Usually the ball passes a little above or below. That is why eclipses don''t happen every month.'
  - - Earth-shine
    - 'Read the book''s part about the faint glow on the dark part of a young crescent Moon. Say: That is sunlight bounced off the Earth, onto the Moon,
      and back to us.'
  - - What we know now
    - 'The book''s figures for the Moon''s size and weight are right. It is about a quarter as wide as the Earth and about one eightieth as heavy.

      The Moon does have a trace of gas around it, but so thin it is almost nothing, just as the book says.

      In a total eclipse of the Moon, it often turns a coppery red. That is sunlight bent through the Earth''s air, the light of all the world''s sunrises
      and sunsets falling on the Moon. Eclipses of the Moon are completely safe to watch with your eyes, binoculars or a telescope.'
  - - Tell it back
    - Ask your child to teach the phases to someone else in the family with the lamp and ball.
  - - Check questions
    - 'At what phase can an eclipse of the Sun happen? An eclipse of the Moon?

      What is earth-shine?

      Why does the Moon have no air to speak of, according to the book?'
  practice: Keep the Moon diary going. Look up the date of the next eclipse of the Moon visible where you live and plan to watch it.
  tip: A foam ball stuck on a pencil gives a handle, so the hand doesn't cast a shadow on the 'Moon'.
  answers: An eclipse of the Sun at new moon; an eclipse of the Moon at full moon. Earth-shine is sunlight reflected from the Earth onto the dark part of
    the Moon, and back to us. Because she is so small that her pull was too weak to hold the swift gas particles, so they slowly escaped into space.
- num: 17
  roman: Part II, Ch. V
  idx: 213
  unit: 2
  title: 'Yet more about the Moon: tides and the Moon''s face'
  mins: 35
  goal: Your child can explain how the Moon (with help from the Sun) makes two tides a day, why spring tides come at new and full moon, and can name some
    of the Moon's 'seas' and craters.
  materials:
  - The book, open to Part II, Chapter V
  - Paper, a pencil and a coin or bottle cap to trace circles
  - The Moon diary
  - Binoculars (for the Moon at night only), or a good photo of the full Moon
  book: 'The Moon can be thought of as a sister-planet: the Sun pulls her more than twice as hard as the Earth does. The chapter explains her wavy path
    round the Sun, the tides (two a day, with spring tides and neap tides), why we never see her far side, and her craters, mountains and dark ''seas''.
    A note from a naval officer explains flood, ebb and slack water.'
  steps:
  - - Hook question
    - 'Say: If you build a sandcastle near the water at the beach, why might it be gone a few hours later?'
  - - Read together
    - 'Read the chapter aloud. On the tides part, read slowly:

      ~ If there were only one wave, there would be only one tide in each twenty-four hours.

      Say: The book says the Moon is the chief cause of the tides, and the Sun helps.'
  - - Draw the two bulges
    - 'Draw the Earth as a circle. Draw a stretched oval of ''ocean'' around it, bulging toward a small Moon on one side and also bulging out on the far
      side.

      Turn the paper slowly under your finger, which stays on one spot as ''you''. Say: As the Earth turns, you pass through one bulge (high tide), a low
      part, the other bulge (high tide again) and another low part. Two high tides a day.'
  - - Spring and neap tides
    - 'Draw the Sun on the same side as the Moon (new moon), then on the opposite side (full moon). The book says the pulls work together then: spring tides,
      the biggest. At the quarters they pull at right angles: neap tides, the smallest.

      Say: ''Spring'' here has nothing to do with the season. It means the water springs up high.'
  - - The Moon's face
    - Look at the full Moon (or a photo). Find the dark 'seas' that make the face or the 'man in the moon'. If you can, find the bright crater Tycho near
      the bottom, with rays like a splash. The book says Tycho is about fifty-four miles across.
  - - What we know now
    - 'High tides come about 12 hours and 25 minutes apart, not exactly 12, so they come about 50 minutes later each day, just as the Moon rises about 50
      minutes later each day. Real tides are also shaped by coastlines and the shape of the ocean floor.

      The book guessed some craters might be made by rocks from space. That guess was right: nearly all the Moon''s craters were made that way.

      The dark ''seas'' are wide plains of dark, hardened lava that flooded huge basins long ago.

      The book says water could only be there as ice. Spacecraft have found ice in dark craters near the Moon''s poles. And the far side, photographed since
      1959, has very few dark seas.'
  - - Tell it back
    - Ask your child to explain, with the drawing, why there are two high tides each day.
  - - Check questions
    - 'Which pulls the Moon harder, the Sun or the Earth?

      When do spring tides happen? Neap tides?

      Are the Moon''s ''seas'' made of water?'
  practice: 'If you live near a coast, look up a tide table and visit the shore at high and low tide on the same day. Inland, check the Moon diary: mark
    the days of new and full moon as ''spring tide'' days.'
  answers: The Sun; its pull on the Moon is more than twice the Earth's. Spring tides at new and full moon; neap tides at the first and last quarters. No,
    the book explains they were named 'seas' before it was found that there is no water there.
- num: 18
  roman: Part II, Ch. VI, part 1
  idx: 225
  unit: 2
  title: Mercury and Venus up close
  mins: 30
  goal: Your child can describe Mercury and Venus as we know them now, explain what a transit is, and say why Venus is the brightest planet in our sky.
  materials:
  - The book, open to Part II, Chapter VI
  - A lamp, a ball and the darkened room from the Moon-phase lesson
  - The planet chart
  book: The chapter revisits Mercury (fast, with a very oval orbit and a blazing Sun) and Venus (Earth's 'twin', with phases like the Moon). It explains
    transits, when Mercury or Venus crosses the face of the Sun as a black dot, and how the transits of Venus helped measure the Sun's distance. It ends
    with guesses about the length of their days and their climates.
  steps:
  - - Read together
    - 'Read from the start of the chapter to the part about the climate of Venus. Stop at the list of transit years: 1761, 1769, 1874, 1882.'
  - - Venus has phases
    - 'Use the lamp and ball again, but this time the ball goes round the lamp, inside your own circle, while you watch from outside. You see a thin crescent
      when it is nearly between you and the lamp, a half when it is off to the side, and a small full disc when it is far beyond the lamp.

      Say: That is why Venus looks brightest when it is a crescent or half: it is much nearer to us then.'
  - - A black dot on the Sun
    - 'Safety first: never look at the Sun, not even for a moment, and not through sunglasses, smoked or darkened glass, film, binoculars or a telescope.
      It can hurt your eyes for good, and it does not hurt while it happens.

      Say: In a transit, Venus or Mercury looks like a tiny black dot crossing the Sun. Astronomers watched it with special telescopes and filters, or by
      projecting the Sun''s image onto a white screen. We look at photographs.'
  - - What we know now
    - 'Mercury does not keep one face to the Sun, as Schiaparelli thought. It turns three times for every two trips round the Sun. With no air to hold heat,
      its ground is hotter than an oven by day and far colder than any place on Earth by night.

      Venus turns very slowly, and backward; its day is longer than its year. It is hidden under thick clouds of acid, and its air is so thick and full
      of carbon dioxide that it traps heat like a blanket: Venus is the hottest planet, hot enough to melt lead. The book was right that an atmosphere keeps
      a planet warmer.

      Radar has mapped Venus'' mountains through the clouds; the highest is taller than Mount Everest, though not three or four times taller.

      The last transits of Venus were in 2004 and 2012. The next pair will not come until 2117 and 2125.'
  - - Tell it back
    - Ask your child to describe, as a space travel guide would, what a visitor to Mercury or to Venus would find.
  - - Check questions
    - 'What is a transit?

      Why are transits of Venus so rare?

      Why do Mercury and Venus show phases like the Moon?'
  - - Notice it this week
    - If Venus is an evening star now, look for it after sunset each clear evening and note whether it is getting higher or lower in the sky from week to
      week. Look only after the Sun has fully set.
  practice: Update the planet chart with one new fact each for Mercury and Venus.
  answers: A transit is when Mercury or Venus passes exactly between us and the Sun and is seen as a small black dot crossing the Sun's face. Because their
    orbits are tilted a little from ours, so they usually pass just above or below the Sun. Because they go round the Sun inside our orbit, so we see different
    amounts of their sunlit side.
- num: 19
  roman: Part II, Ch. VI, part 2
  idx: 235
  unit: 2
  title: Mars, the red planet
  mins: 25
  goal: Your child can tell what the book believed about Mars and what spacecraft have since found there.
  materials:
  - The book, open to the Mars pages near the end of Part II, Chapter VI
  - Paper and red, brown and white crayons
  - The planet chart
  book: 'The last pages of the chapter are about Mars: its two tiny moons, Deimos and Phobos, its lightness, its air, its reddish and dark markings (then
    thought to be continents and seas), its clouds, and its white polar caps that shrink and grow with the seasons.'
  steps:
  - - Read together
    - Read the Mars pages aloud. Enjoy the book's idea of a traveler who could go everywhere on Mars by land or by water.
  - - Watch the ice caps
    - 'Read the part about the polar caps again. Draw Mars twice: once with a big white cap at the top and a small one at the bottom, once the other way
      round.

      ~ This is exactly what takes place in the summers and winters of our north and south poles.'
  - - What we know now
    - 'Mars has no seas or canals. The dark markings are darker rock and dust; great dust storms sometimes wrap the whole planet, which helps explain the
      changes the book mentions.

      The polar caps are real ice, partly frozen water and partly frozen carbon dioxide (dry ice), and they do grow and shrink with the seasons, just as
      the book says.

      Rovers have driven across Mars, and a small helicopter has flown there. They found dry riverbeds and rocks that formed in water, so Mars had lakes
      and rivers long ago. Its air today is very thin and mostly carbon dioxide.

      Phobos and Deimos, the moons the book mentions, are small lumpy rocks only a few miles across.'
  - - Tell it back
    - Ask your child to tell you two things the book got right about Mars and two things we have learned since.
  - - Check questions
    - 'What are the names of Mars'' two moons?

      Why does the book think Mars has seasons?

      Why is it easier to study Mars than Venus from Earth?'
  - - Notice it this week
    - Ask a grown-up to help you check a sky chart or app to see whether Mars is in the evening sky. It looks like a steady orange-red 'star'.
  answers: Deimos and Phobos. Because its white polar caps shrink when that pole is turned toward the Sun and grow when it is turned away, just like seasons
    on Earth. Because Mars is outside our orbit, so when it is nearest it shows us its sunlit face, while Venus at its nearest turns its dark side to us
    (and Venus is covered in clouds).
- num: 20
  roman: Part II, Ch. VII
  idx: 240
  unit: 2
  title: Jupiter, the giant
  mins: 30
  goal: Your child can describe Jupiter's belts and four large moons, and can watch the moons change places from night to night.
  materials:
  - The book, open to Part II, Chapter VII
  - Binoculars and something steady to lean on (a fence, a car roof, or a tripod)
  - A notebook for a Jupiter-moon log
  - A watch, to show which way 'west to east' goes
  book: 'Jupiter is huge and spins in about ten hours. The chapter describes its light and dark cloud belts, its fierce winds, the guess that it might still
    be hot inside, and its moons: a tiny new fifth moon found by Professor Barnard, and the four large ones, Io, Europa, Ganymede and Callisto. A side passage
    explains the plane of the ecliptic with a sheet of cardboard and a watch.'
  steps:
  - - Read together
    - 'Read the chapter aloud. At the cardboard-and-watch passage, lay a watch face-up on the table. Say: The planets go round the Sun the opposite way
      from these hands, seen from above the north.'
  - - Draw Jupiter
    - Draw a slightly squashed circle (the book says Jupiter is flattened at the poles because it spins so fast). Color light and dark stripes across it.
      Add four dots in a line beside it for the moons.
  - - Watch the moons yourself
    - 'Look up whether Jupiter is in the evening sky (it is usually the brightest ''star'' in the sky after Venus). Hold the binoculars very steady, and
      you can often see up to four tiny points of light in a line beside it: the moons Galileo first saw in 1610.

      Draw what you see in the Jupiter-moon log. Look again the next clear night: the moons will have moved.'
  - - What we know now
    - 'Jupiter has no solid surface to stand on. It is mostly hydrogen and helium, getting thicker and hotter deeper down. The book''s guess that it is
      hot inside was partly right: Jupiter gives off a little more heat than it receives from the Sun. But it is not cooling toward a solid crust.

      Its Great Red Spot is a storm wider than the whole Earth that has blown for centuries. Its winds can go faster than 300 miles an hour.

      Spacecraft have visited many times. Io has hundreds of volcanoes; Europa hides an ocean under its ice. Callisto is just a little smaller than Mercury,
      not larger. And Jupiter has about a hundred known moons, not five.'
  - - Tell it back
    - 'Ask your child to describe Jupiter''s four big moons from the book: which is nearest, which is biggest, how long each takes to go round.'
  - - Check questions
    - 'How long is a day on Jupiter?

      Why does Jupiter have almost no seasons?

      How does the book know Jupiter does not shine by its own light?'
  practice: Keep the Jupiter-moon log for a week. Number the moon dots and see if you can guess which one is Callisto (it strays farthest from Jupiter).
  tip: Binoculars braced against something solid make all the difference. Even a tripod adapter for a few dollars helps.
  answers: Nearly ten hours (a five-hour day and a five-hour night, as the book puts it). Because its axis is tilted only a tiny amount. Because Jupiter
    casts a shadow that eclipses its moons; a body shining by its own light would not throw a dark shadow in sunlight.
- num: 21
  roman: Part II, Ch. VIII
  idx: 252
  unit: 2
  title: Saturn and its rings
  mins: 30
  goal: Your child can describe Saturn's rings and what they are made of, and knows Saturn is light enough to float.
  materials:
  - The book, open to Part II, Chapter VIII
  - A paper plate, scissors and a ping-pong ball or small orange (for a ring model)
  - A bowl of water and an apple (to show floating)
  book: 'Saturn, nearly the size of Jupiter but much lighter, wrapped in clouds, with eight moons and three rings: the dusky Crape Ring, a bright middle
    ring, and a grayish outer ring. The rings are believed to be made of countless small bodies, and the chapter imagines what they would look like from
    different places on Saturn, including eight-year eclipses in its long winters.'
  steps:
  - - Read together
    - 'Read the chapter aloud. Stop at this line and talk about it:

      ~ He appears to be made of very light materials — not more than three-quarters as dense as water.'
  - - Saturn would float
    - 'Drop an apple into a bowl of water. It floats because it is less dense than water. Say: If you had a bathtub big enough, Saturn would float too.'
  - - Make a ringed planet
    - 'Cut the middle out of a paper plate so a ping-pong ball or small orange fits snugly in the hole. Color three bands on the rim: dusky purple inside,
      bright white in the middle, gray outside, with a thin gap (the book gives about 1,700 miles) between the bright and the gray.

      Tilt it to see the rings wide open, then turn it edge-on and watch them almost vanish. From Earth, Saturn''s rings look edge-on every 15 years or
      so.'
  - - What we know now
    - 'Saturn has many rings, made of billions of pieces of ice and rock, from specks of dust to chunks as big as a house. They are enormously wide but
      astonishingly thin.

      Its largest moon, Titan, is bigger than Mercury, as the book says. It has thick air and lakes of liquid methane, and a probe landed there in 2005.

      Saturn is mostly hydrogen and helium, not a molten ball cooling down. It has well over two hundred known moons. The Cassini spacecraft circled it
      for 13 years.'
  - - Tell it back
    - 'Ask your child to describe the view of the rings from Saturn, as the book imagines it: from the equator, from the poles, and in between.'
  - - Check questions
    - 'How many rings does the book describe, and what colors?

      How long is Saturn''s winter in each half of the planet?

      About how much light does all of Saturn''s eight moons together give, compared with our one full moon?'
  - - Notice it this week
    - Check a sky chart to see if Saturn is up. It looks like a steady, pale yellow star. Even a small telescope at a local astronomy club's public night
      will show its rings; many clubs welcome children.
  answers: 'Three: the inner dusky or purple Crape Ring, a very bright middle ring, and a grayish outer ring. About fifteen of our years. About one-sixteenth
    of the light of our full moon.'
- num: 22
  roman: Part II, Ch. IX
  idx: 262
  unit: 2
  title: 'Uranus and Neptune: a planet found with pencil and paper'
  mins: 30
  goal: Your child can tell how Herschel found Uranus and how Adams and Leverrier found Neptune by working out where it had to be.
  materials:
  - The book, open to Part II, Chapter IX
  - A friend or family member to play 'hidden planet'
  - A small ball and a long piece of string
  book: Till 1781 Saturn was the outermost planet known. The chapter tells how Herschel found Uranus, and how Uranus kept wandering from its predicted path
    until two young astronomers, John Couch Adams and Leverrier, each worked out where an unseen planet must be pulling it. Neptune was found close to that
    very spot.
  steps:
  - - Read together
    - Read the chapter aloud. The detective story is the heart of it, so read it with some drama.
  - - Play 'hidden planet'
    - 'One person (the hidden planet) stands behind a door or curtain. Another walks slowly past the door with a ball on a long string swinging in front
      of them. The hidden planet gently tugs the string as the walker passes.

      The watcher sees the ball wobble off its straight line and has to guess where the hidden puller is standing. That is what Adams and Leverrier did
      with Uranus.'
  - - A triumph of thinking
    - 'Read:

      ~ This was indeed a triumph of human intellect.

      Say: They found a planet without looking for it first. They used the laws of gravity and arithmetic, then the telescope proved them right.'
  - - What we know now
    - 'Neptune was first seen in 1846 at the Berlin observatory, using Leverrier''s prediction.

      Uranus is tipped right over on its side, so each pole has about 42 years of daylight and then 42 years of darkness, even longer and drearier than
      the book imagined.

      Both are ''ice giants'' with thick blue-green air. Neptune is a little narrower than Uranus but heavier, and it has the fastest winds in the Solar
      System.

      Only one spacecraft, Voyager 2, has visited them: Uranus in 1986 and Neptune in 1989. Uranus has more than two dozen known moons and Neptune more
      than a dozen, and both have faint rings.'
  - - Tell it back
    - Ask your child to tell the story of Neptune's discovery as if they were a newspaper reporter in 1846.
  - - Check questions
    - 'Who discovered Uranus, and what did he first think it was?

      How did astronomers know there must be another planet beyond Uranus?

      How long is a year on Uranus?'
  practice: Add Uranus and Neptune to the planet chart. Your chart now holds all eight planets.
  answers: William Herschel; he first took it for a comet without a tail. Because Uranus did not follow its predicted path, sometimes going faster and sometimes
    slower; something unseen beyond it had to be pulling on it. About eighty-four of our years.
- num: 23
  roman: Part II, Ch. X
  idx: 271
  unit: 2
  title: 'Comets and meteors: family ties'
  mins: 25
  goal: Your child can explain that meteor showers come from the paths of comets, and why the Earth meets the same shower each year.
  materials:
  - The book, open to Part II, Chapter X
  - A hula hoop or a circle of rope on the floor
  - A handful of uncooked rice or birdseed
  book: 'A surprising discovery: comets and streams of meteors travel along the same orbits. The chapter describes the August and November (Leonid) meteor
    rings, the great November display of 1866, and the idea that the Solar System may hold countless meteor streams, using a blind man feeling rain to picture
    it.'
  steps:
  - - Read together
    - 'Read the chapter aloud. At the 1866 shower, stop: eight thousand meteors in two and a quarter hours were counted at Greenwich.'
  - - Walk through a meteor stream
    - 'Lay the hoop on the floor: that is the Earth''s orbit. Sprinkle a line of rice across one part of the hoop: that is the comet''s dusty path.

      Your child walks round the hoop as the Earth. Every time they come to the rice, they ''collect'' some: a meteor shower. Say: The Earth crosses the
      same stream at the same time every year.'
  - - Rain on the window
    - 'Read the book''s rain picture:

      ~ Or look at the rain-drops on your window some dull and rainy day.

      Say: The few meteors we see are like the few drops on one window. There are many more everywhere else.'
  - - What we know now
    - 'Comets leave trails of dust as their ice turns to gas near the Sun. When the Earth passes through such a trail, we get a meteor shower. The August
      Perseids come from Comet Swift-Tuttle; the November Leonids from Comet Tempel-Tuttle.

      The great Leonid display the book expected in 1899 was a disappointment, because the planets'' pulls had nudged the stream aside. But the Leonids
      put on spectacular storms in 1966 and again around 1999 to 2002.'
  - - Tell it back
    - Ask your child to explain, with the hoop and rice, why the Leonid meteors come back every November.
  - - Check questions
    - 'Why are the November meteors called the Leonids?

      How often does the Leonid stream give a grand display?

      What is the connection between a comet and a meteor stream?'
  answers: Because they seem to shoot out from a spot in the constellation Leo. About once every thirty-three years. They travel along the same orbit; the
    meteors seem to belong to the comet.
- num: 24
  roman: Part II, Ch. XI
  idx: 279
  unit: 2
  title: 'More about comets: tails, dust and visitors'
  mins: 30
  goal: Your child can explain why a comet's tail always points away from the Sun, even when it leads the comet, and what comets and meteorites are made
    of.
  materials:
  - The book, open to Part II, Chapter XI
  - A flashlight or lamp for the Sun
  - A cotton ball and a strip of ribbon or tissue taped to it for a comet
  - A dark plate and a magnet in a plastic bag (optional, for collecting space dust)
  book: The chapter tells of famous comets of the 1800s (1811, Halley's in 1835, 1843, Donati's in 1858), how a star shone undimmed through Donati's tail,
    how Jupiter's moons threw a comet off its path, and how the tail always points away from the Sun, so that a comet going away seems to push its tail
    in front. It closes with what comets and meteorites are made of and comets that visit from beyond.
  steps:
  - - Read together
    - 'Read the chapter aloud. At Donati''s comet, stop: the star Arcturus shone through its tail as if nothing were there.'
  - - Tail first, head first
    - 'Put the lamp in the middle of the room. Carry the cotton-ball comet in a long loop around it, always keeping the ribbon tail pointing away from the
      lamp.

      Coming in, the tail trails behind. Going round the lamp, it swings. Going away, the tail goes first.

      ~ The comet thus appears to be moving backwards.'
  - - What we know now
    - 'Comets often have two tails: a curved dust tail pushed by sunlight, and a straight, bluish gas tail blown by the solar wind, a stream of electrically
      charged particles from the Sun. The book''s guess that ''electricity may have something of a hand in the matter'' was a good one.

      In 2014 a spacecraft, Rosetta, orbited a comet and dropped a small lander on it. The nucleus was a dark, dusty lump of ice and rock a couple of miles
      across.

      Meteorites do not come from the Sun or from Earth''s volcanoes. Most are pieces of asteroids; a few were knocked off the Moon or Mars by crashes.
      Today''s estimates say many tons of space dust fall on the Earth every day.

      Most comets belong to the Sun''s family, coming from far out beyond Neptune. But in 2019 astronomers did spot a comet that came from another star,
      and another visitor from outside the Solar System was found in 2025.'
  - - Tell it back
    - Ask your child to explain why a comet going away from the Sun seems to be pushing its tail ahead of it.
  - - Check questions
    - 'How did astronomers know Donati''s comet''s tail was very thin?

      What happened to the comet that passed among Jupiter''s moons in 1770?

      About how often does Halley''s Comet return?'
  - - Try it (optional)
    - 'Collect space dust: set a dark plate out in the rain or in a gutter''s run-off, or rinse rain-gutter grit into a bowl. Dry it, then pass a magnet
      sealed in a plastic bag over it. Tiny round metal specks under a magnifier may be micrometeorites, though most will be ordinary dust. Wash hands afterward.'
  practice: Look back at the comet drawing from Part I and add a second, straight tail.
  answers: Because the bright star Arcturus shone through the densest part of the tail, close to the nucleus, without being dimmed at all. Jupiter and its
    moons pulled it into a completely new orbit, while the comet did not disturb the moons at all. About every seventy-six years.
- num: 25
  roman: Part III, Ch. I
  idx: 292
  unit: 3
  title: Many suns
  mins: 25
  goal: Your child can explain why stars look like points of light even in a telescope, and that stars differ in size, color and brightness.
  materials:
  - The book, open to Part III, Chapter I
  - A flashlight
  - A long hallway, yard or street (with an adult) at dusk
  book: 'Part III leaves the Solar System for the stars. The first chapter reminds us that the Sun is just one star and every star a sun, explains why no
    telescope shows a star as a disc, and says that stars are not all alike: the book sorts them into white suns, golden suns like ours, variable stars
    and small red suns. It ends by saying that every star is moving.'
  steps:
  - - Read together
    - 'Read the chapter aloud.

      ~ For the sun is a star — only a star.'
  - - Bright because near, or near because bright?
    - 'At dusk, have one person stand close with a flashlight and another far away with the same kind of flashlight. Which looks brighter? Then switch one
      flashlight for a dimmer one (or cover it with a tissue) and put it close. Can you still tell which is nearer just by brightness?

      Say: That is the book''s puzzle. A star may look bright because it is near, or because it is big, or because it is very brilliant. We can''t tell
      from brightness alone.'
  - - Stars have colors
    - 'Read the four kinds of suns. On a clear night, compare a few bright stars: some look white or bluish, some yellow, some orange or reddish. In winter,
      Betelgeuse (orange-red) and Rigel (blue-white) in Orion are a good pair.'
  - - What we know now
    - 'Star colors tell their temperature: blue-white stars are the hottest, yellow ones like our Sun are in the middle, and red ones are the coolest.

      The book is right that small red suns are hard to see. In fact, small dim red stars are the most common kind of all.

      Telescopes can now measure the size of some nearby giant stars directly. Betelgeuse is so big that, put in place of our Sun, it would swallow the
      orbits of Mercury, Venus, Earth and Mars.

      Our Sun is an ordinary, middle-sized star, as the book suggests.'
  - - Tell it back
    - Ask your child to explain why stars all look like tiny points, while planets show a small round disc in a telescope.
  - - Check questions
    - 'How long does light take to reach us from the nearest known star, according to the book?

      Into what four classes does the book sort the stars?

      Does the brightest star always have to be the nearest?'
  - - Notice it this week
    - Find three stars of different colors and write their colors in your star notebook. A free sky app can tell you their names.
  answers: 'Four years and one-third (or four years and four months). White suns, golden suns, variable stars, and small red suns. No: a star may look bright
    because it is very large or very brilliant, even if it is farther away.'
