  - The star notebook
  book: 'Three neighbors of the Sun: 61 Cygni, a faint double star whose distance was measured first; Alpha Centauri, the nearest known, a pair of suns
    circling each other in about eighty-five years; and Sirius, the brightest star, whose dim companion was predicted from its wobbling path and then seen
    eighteen years later. The chapter ends with what the spectroscope tells of Sirius'' make.'
  steps:
