    - This book uses 'billion' in the old British way, meaning a million millions (what Americans call a trillion). So when it says 61 Cygni is 'forty billions
      of miles away', it means forty trillion miles.
  - - Read together
    - 'Read the chapter aloud. At Alpha Centauri, read:

      ~ Of all the stars shining in the heavens round our earth, two only — Sirius and Canopus — show greater brilliancy than Alpha Centauri.'
  - - Two suns dancing
    - 'Tie a small ball and a big ball together with a short string. Hold the string near the big ball and twirl them gently on a table: they swing around
      a point between them, closer to the big one. Say: That is how a double star moves. The small star swings around more widely and faster.'
  - - The hidden companion
    - 'Retell the Sirius story: astronomers noticed Sirius wobbling in its path, worked out that an unseen companion must be tugging it, and eighteen years
