      Then your child reads a column alone, pointing to each word.'
  - - Spell aloud by syllables
    - 'Spell the old way: say the word, spell each syllable and say it, then say the whole word again. Show one first:

      Say: fatal. f-a, fa; t-a-l, tal; fatal.

      Then your child spells eight or ten words from the list the same way. The spaces between syllables in the book show where to break.'
  - - Write from dictation
    - 'Close the book. Read 10 words from the list, one at a time. Say each word clearly, use it in a short sentence of your own if it is unfamiliar, then say it again.

