      ~ These lessons are intended as exercises in the meaning as well as the spelling of words.

      Find these words in the sentences and talk about what each one means.'
  - - Read the sentences together
    - 'Read all the sentences aloud together. Some of them:

      ~ He ate seven or eight apples.

      ~ Send the pale maid with the pail of milk.

      ~ Age gives edge to wine.

      Ask your child to spell the tricky words in each sentence aloud before you go on.'
  - - Write from dictation
    - 'Close the book. Read one sentence at a time, slowly, in short parts. Read the whole sentence once more at the end.

