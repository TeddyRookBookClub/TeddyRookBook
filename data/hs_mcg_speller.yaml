  book: “Long Sounds of Vowels under the Accent.” Columns of two-syllable words, printed with the syllables apart and an accent mark on the stressed one.
  steps:
  - - Look at the pattern
    - 'First two-syllable words. In each one, the first syllable is the loud one (it has the accent), and its vowel is long: fa-tal, le-gal, lo-cal.

