  title: Abbreviations
  mins: 10
  goal: Your child reads common abbreviations and writes them with their periods.
  materials:
  - The book page for this lesson
  - A slate, small whiteboard, or paper and pencil
  book: “Abbreviations used in Writing and Printing.” Lines of abbreviations, each followed by what it stands for.
  steps:
  - - Look at the pattern
    - 'An abbreviation is a short way to write a word, usually ending with a period: Bro. for Brother, A.M. for Master of Arts.'
  - - Read the lines together
    - 'Open the book. Read each abbreviation and what it stands for. For example:

      ~ Bro., Brother

      Some are still used today (Mon., Sat., M.D., P.S.); some are old-fashioned. Spend your time on the ones still in use.'
  - - Cover and recall
    - Cover the meanings with a card. Your child reads an abbreviation and says what it stands for.
  - - Write from dictation
    - Say the full word (for example, the name of a day). Your child writes the abbreviation, with its period. Do six to eight.
  - - Check and correct
    - 'Open the book and check each word together, letter by letter. For each mistake, your child looks at the right spelling, says it, spells it aloud, and writes it correctly three times.

      Add any word that was missed to a hard-words list.'
  practice: Next time you see a calendar or a letter, look for abbreviations together.
  optional: true
