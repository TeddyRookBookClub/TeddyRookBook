  book: “Homophonous Words.” Pairs of words that sound alike, each followed by a short meaning.
  steps:
  - - Look at the pattern
    - 'Homophones are words that sound the same but are spelled differently and mean different things: raised and razed, pray and prey. The only way to tell them apart in writing is by meaning.'
  - - Read the pairs and their meanings
    - 'Open the book. Read each word with its meaning aloud together. Some of the pairs:

      ~ raised, razed

      ~ pries, prize

      ~ pray, prey

      ~ pore, pour

      ~ poll, pole

      For each pair, ask: which one means this? Your child points to it.'
  - - Spell each pair aloud
    - Your child spells both words of a pair, one after the other, and says how they differ (a silent letter, a different vowel spelling).
  - - Write the word that fits
    - 'Close the book. Read a meaning from the book, or use the word in a short sentence of your own. Your child writes the word that fits that meaning.

      Do eight or ten. Mix up the order so both words of a pair come up.'
  - - Check and correct
    - 'Open the book and check each word together, letter by letter. For each mistake, your child looks at the right spelling, says it, spells it aloud, and writes it correctly three times.

      Add any word that was missed to a hard-words list.'
