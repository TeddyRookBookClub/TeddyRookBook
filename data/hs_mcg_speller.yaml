book:
  id: mcguffeyseclecti00mcgurich
  title: McGuffey's Eclectic Spelling-Book, Revised Edition
  year: 1879 (revised edition)
  key: mcg-speller
  short: Speller
  eyebrow: McGuffey's Readers · Eclectic Spelling-Book
  hero: 248 short spelling lessons, from cat and bed to prefixes, sound-alike words and punctuation, for children about 6 to 12. Every lesson has a guide you can follow step by step, with the page of the book beside it.
  how:
  - <b>A little each day.</b> One lesson takes 10 to 15 minutes. Most are half a page, so the book can be spread over two or three school years.
  - '<b>Say, spell, say.</b> The old way of spelling aloud: say the word, spell each syllable and say it, then say the whole word again. The guides use it throughout.'
  - <b>Always write too.</b> Every lesson ends with dictation on a slate or paper. Spelling aloud and spelling on paper are different skills; practice both.
  - <b>Keep a hard-words list.</b> Missed words go on a card. Ask three or four at the start of each lesson until they are right twice in a row.
  - <b>Fit it to the child.</b> Younger children can take half a list at a time. Lessons from about 172 on are harder; some late ones (foreign words, old abbreviations, place names) are marked optional.
  - <b>Don't worry about every mark.</b> The book's pronunciation marks help, but the goal is spelling. Learn the long and short marks first; the rest come in Lessons 36 to 57.
  unitword: Part
  lessonword: Lesson
  numnote: Guide numbers match the book's own lesson numbers.
units:
- id: 1
  name: Short and long vowels
  from: 1
  to: 10
  text: Short and long sounds of the five vowels in one-syllable words, then the first two-syllable words.
- id: 2
  name: The many sounds of each vowel
  from: 11
  to: 35
  text: Each vowel's other sounds, accent, the first dictation sentences and the first silent letters.
- id: 3
  name: The 43 sounds and their marks
  from: 36
  to: 58
  text: The book's tour of every sound in English, one numbered exercise at a time, with the mark that shows it.
- id: 4
  name: Sound-alikes, accent and dictation
  from: 59
  to: 90
  text: Homophones like pray and prey, which syllable is loud, and dictation sentences that use them.
- id: 5
  name: Longer words and special spellings
  from: 91
  to: 135
  text: Three-syllable words, -tion and -ture, the sh and zh sounds, and more dictation.
- id: 6
  name: Endings (affixes)
  from: 136
  to: 155
  text: Plurals, -ing and -ed, and endings like -ful, -less, -ness and -able, with the spelling rules for adding them.
- id: 7
  name: Prefixes and compound words
  from: 156
  to: 171
  text: Beginnings like re-, un-, dis- and pre-, what they mean, and words made of two words.
- id: 8
  name: Words often said wrong
  from: 172
  to: 200
  text: Look-alike words, vowels often mispronounced, and where the accent belongs.
- id: 9
  name: Synonyms, near-alikes and hard spellings
  from: 201
  to: 229
  text: Words of nearly the same meaning, pairs to tell apart, silent letters and words that need care in spelling.
- id: 10
  name: Odd words, names, abbreviations and punctuation
  from: 230
  to: 248
  text: Words not said as spelled, first names, abbreviations, states and places, and the closing page on punctuation and capitals.
lessons:
- num: 1
  roman: '1'
  idx: 20
  unit: 1
  title: Short sounds of a and e
  mins: 15
  goal: Your child reads every word in the lesson aloud and spells most of them from dictation.
  materials:
  - The book page for this lesson
  - A slate, small whiteboard, or paper and pencil
  - A card or notebook page for the hard-words list
  book: The first lesson, “Short Sounds of Vowels.” Two groups of three-letter words in columns, under “Short Sound of A” and “Short Sound of E.” The tables of sounds and marks are a few pages earlier, at the front of the book.
  steps:
  - - How the book marks sounds
    - 'Take a minute to learn the book''s own signs before you start. You will see them on every page.

      Syllables are printed with a space between them, and a small accent mark ('') comes after the loud syllable.

      Marks over the vowels show which sound they make. These are the dictionary marks of Webster''s dictionary, which the preface says the book follows. A straight line over a vowel means the long sound (the letter says its name). A small curved cup means the short sound. Other marks (dots, a little hat, a wavy line) show the other sounds; the tables at the front of the book list every mark with a sample word.

      Silent letters are printed crossed out, so your child can see that they are written but not said.

      You don''t need to teach every mark today. Lessons 36 to 57 go through them one at a time.'
  - - Look at the pattern
    - 'Every word here has one short vowel: the a in cat, or the e in bed. Short a and short e are the quick sounds, not the letter names.'
  - - Read the list aloud together
    - 'Open the book to the lesson. Read the words aloud together, one column at a time. Some of them:

      ~ am, cat, gap, ban, cap, an, bad, bag

      ~ bed, den, net, sell, tent, led, men, set

      Then your child reads a column alone, pointing to each word.'
  - - Spell aloud
    - 'Your child looks at a word, says it, spells it aloud letter by letter, and says it again. Then close the book and try the same words from memory.

      Do eight or ten words, a few from each column.'
  - - Write from dictation
    - 'Close the book. Read 10 words from the list, one at a time. Say each word clearly, use it in a short sentence of your own if it is unfamiliar, then say it again.

      Your child writes each word on a slate or paper. No peeking at the book.'
  - - Check and correct
    - 'Open the book and check each word together, letter by letter. For each mistake, your child looks at the right spelling, says it, spells it aloud, and writes it correctly three times.

      Add any word that was missed to a hard-words list.'
  - - Finish with something easy
    - End by having your child spell three words from today's list that came easily. Start a hard-words list on a card or in a notebook; it will be used at the start of each lesson.
  practice: Tomorrow, before the next lesson, dictate five words from this list again, including any your child missed.
  tip: 'Say the short vowel sound, not the letter''s name: “a as in cat,” not “ay.” Keep the first lessons light and quick.'
