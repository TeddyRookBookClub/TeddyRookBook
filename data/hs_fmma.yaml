  book: 'Chapter XIII (871-901 A.D.): the Danes hold much of England. Young Alfred learns to read to win his mother''s book of Saxon ballads. He becomes
    king in 871, builds the first English navy, but is driven into hiding. A cowherd''s wife scolds him for letting her cakes burn. Disguised as a minstrel
    he spies on the Danish camp, then defeats Guthrum, who becomes a Christian. Alfred rebuilds towns, starts a school and translates Latin books into Saxon.'
  steps:
  - - Set the scene
    - 'Find England, then Denmark across the North Sea. Say: In Alfred''s time the Danes held the north and east of England. Alfred was king of the West
