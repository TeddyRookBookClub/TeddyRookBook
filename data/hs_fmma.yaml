  title: Henry the Fifth
  mins: 25
  goal: Your child can tell how wild Prince Hal became a serious king, and what happened at Agincourt and at the siege of Rouen.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XXVIII (1413-1422): Prince Hal draws his sword on a judge and is sent to prison; he jokes with fat Sir John Falstaff; as king he gives
    up his wild friends. He claims Normandy and France, invades, and with about fifteen thousand men defeats a much larger French army at Agincourt. He
    starves Rouen into surrender, takes Normandy, enters Paris, and is promised the French crown and the hand of Princess Katherine, but dies within two
    years; all is later lost except Calais.'
  steps:
  - - Set the scene
    - 'Find Agincourt in the north of France, near Calais and Crécy. Then find Rouen on the Seine. Say: This is the same war the Black Prince fought, sixty
      years later.'
  - - Read the chapter
    - 'Read Chapter XXVIII aloud. It begins:

      ~ Of all the kings that England ever had Henry V was perhaps the greatest favorite among the people.

      Heads-up: at Rouen, twelve thousand country people are put out of the city and starve between the walls and the English trenches. Read ahead and decide
      how much to read aloud.'
  - - Tell it back
    - 'Prompts:

      - What did the judge do when Prince Hal threatened him?

      - What did Henry tell his wild companions when he became king?

      - What did he say when an officer wished for more soldiers?

      - How did Henry take Rouen?'
  - - Story or history?
    - 'Say: Sir John Falstaff is a character from Shakespeare''s plays about Henry IV and Henry V. He was made up for the plays, though Shakespeare drew
      on stories about young Hal''s wild days.'
  - - Talk it over
    - 'Read Henry''s words the night before the battle:

      ~ If God give us victory, it will be plain we owe it to His grace. If not, the fewer we are, the less loss for England.

      Then read what he said at Rouen:

      ~ War has three handmaidens,—fire, blood, and famine. I have chosen the meekest of the three.

      Ask: Was famine really the "meekest"? What do you think of how the people of Rouen were treated?'
  - - Remember it
    - 'Add to the timeline: "1415 Battle of Agincourt." Say: The English archers won it with their longbows, just as at Crécy.'
  practice: 'Ask your child to compare Henry V with the Black Prince: how were they alike?'
  tip: 'The judge story is a good one for children: even a prince had to obey the law, and his father was glad of it.'
  answers: 'He bravely ordered the prince arrested and put in prison, and Hal accepted his punishment. He told them his wild days were over and advised
    them to lead better lives. He said he would not have a single man more: victory would show God''s grace, and defeat would mean less loss for England.
    He dug trenches round the city so no food could get in, and starved it until it surrendered on generous terms.'
- num: 37
  roman: Ch. XXIX
  idx: 248
  unit: 9
  title: Joan of Arc
  mins: 30
  goal: 'Your child can tell the story of Joan of Arc: her voices, the relief of Orleans, the crowning at Rheims, and her capture and death.'
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XXIX (1412-1431): Joan, a peasant girl of Domrémy, says she hears voices telling her to deliver France. Her parents and the village try
    to stop her. At Chinon she persuades King Charles VII to let her lead an army. In white armor, with a white banner, she relieves Orleans in 1429 and
    is called the Maid of Orleans. Charles is crowned at Rheims with Joan beside him. Captured by the Duke of Burgundy and sold to the English, she is tried
    for sorcery and burned at the stake in Rouen.'
  steps:
  - - Set the scene
    - 'Find Domrémy in the east of France, then Chinon on the Loire, Orleans, Rheims (Reims) and Rouen. Say: When Joan was a girl, the English held much
      of France, and the French king had not even been crowned.'
  - - Read the chapter
    - 'Read Chapter XXIX aloud. It begins:

      ~ In the long wars between the French and English not even the Black Prince or King Henry V gained such fame as did a young French peasant girl, Joan
      of Arc.

      Heads-up: the chapter ends with Joan burned at the stake. The book tells it simply and gently, but read ahead and decide what to read aloud. You can
      stop at her capture and tell the end in your own words.'
  - - Tell it back
    - 'Prompts:

      - What did Joan''s voices tell her, and what did her parents say?

      - What did Joan carry when she rode out from Chinon?

      - What happened when she was wounded at Orleans?

      - What did she ask the king after his crowning?'
  - - Joan's voices
    - 'Read what Joan told her mother:

      ~ Mother, I would far rather sit and spin by your side than take part in war. My mission is no dream.

      Say: Joan said she heard the voices of saints and angels. Her friends believed her and her enemies said it was the work of the devil. People of different
      beliefs still think about her voices in different ways, but almost everyone admires her courage.'
  - - What happened later
    - 'Say: About twenty-five years after Joan died, a new trial declared that she had been innocent. In 1920 the Catholic Church named her a saint. Today
      she is one of the heroes of France.'
  - - Talk it over
    - 'The book says it put Joan among the great men "although she was only a simple peasant girl." Ask: The book is called Famous Men, yet here is a girl.
      What does that tell you about Joan? What would you say to the authors about "only"?'
  - - Remember it
    - 'Add to the timeline: "1429 Joan saves Orleans" and "1431 Joan dies at Rouen."'
  practice: 'Ask your child to tell Joan''s story in five parts: home, Chinon, Orleans, Rheims, Rouen.'
  tip: Many children are deeply moved by Joan. Give time for questions, and focus on her courage and on the fact that she was later cleared.
  answers: They told her she could deliver France from the English and help King Charles; her father said it was only her fancy and she should marry. She
    carried an ancient sword found near a saint's tomb and a white banner embroidered with lilies, and wore white armor. Her soldiers began to retreat;
    she told them to rest, and came back, touched the fort with her banner, and they took it. She asked to go home to her parents, saying the will of God
    was done.
- num: 38
  roman: Ch. XXX
  idx: 258
  unit: 9
  title: Gutenberg and the art of printing
  mins: 25
  goal: Your child can explain how books were made before printing, how movable type was better than block-printing, and why printing changed the world.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  - 'For the extra: a potato, a small knife (adult only), and paint or a stamp pad'
  book: 'Chapter XXX (1400-1468): books were written by hand; then came block-printing, each page carved on one block of wood. Gutenberg works in secret
    in an old monastery room in Strasburg, so that neighbors think he is a wizard. The goldsmith Fust lends him money, then sues him and takes his tools.
    With a friend''s help Gutenberg makes movable types, first of wood and then of metal, and prints a Latin Bible. The Dutch say Lorenz Coster was first.
    Printing spreads across Europe; Aldus Manutius of Venice prints beautiful "Aldine" books.'
  steps:
  - - Set the scene
    - Find Mainz on the Rhine in Germany, and Strasbourg (the book's Strasburg), now in France. Then find Venice and Haarlem in the Netherlands.
  - - Read the chapter
    - 'Read Chapter XXX aloud. It begins:

      ~ While Joan of Arc was busy rescuing France from the English, another wonderful worker was busy in Germany.'
  - - Tell it back
    - 'Prompts:

      - How was block-printing done, and what was slow about it?

      - Why did Gutenberg''s neighbors think he was a wizard?

      - What happened between Gutenberg and Fust?

      - Why were movable types better than blocks?'
  - - Talk it over
    - 'Read this:

      ~ Gutenberg enjoyed reading the manuscripts and block books that his parents and their wealthy friends had; and he often said it was a pity that only
      rich people could own books.

      Ask: How would your life be different if every book had to be copied by hand? Who would own books?'
  - - What we know now
    - 'Say: Movable type had already been invented in China, and metal type was used in Korea before Gutenberg''s time. But Gutenberg''s printing press
      is what spread printing all over Europe, very quickly.'
  - - Make a stamp (optional)
    - 'An adult cuts a potato in half and carves one simple letter, like T or L, so that it stands up from the cut face. Your child inks it and prints it.

      Then try a letter like F or R. Ask: Why does the letter come out backwards? Printers had to carve every letter backwards.

      Safety: only an adult uses the knife.'
  - - Remember it
    - 'Add to the timeline: "About 1450 Gutenberg prints with movable metal type." (Chapter XIII of the book says printing was invented about 1440.)'
  practice: Ask your child to explain to someone why printing was such an important invention.
  tip: The book you are reading was printed with type descended from Gutenberg's. Look closely at a page together and notice how even the letters are.
  answers: The printer carved a whole page into one block of wood, cutting away the wood around each letter, then inked it and pressed paper on it; each
    block took a long time to make and printed only one page. He worked in secret, leaving early and coming home late, so they thought the devil was helping
    him. Fust lent him money, then lost patience, sued him and won, and took all his tools. Movable types could be set up for one page, then taken apart
    and used again for any number of pages.
- num: 39
  roman: Ch. XXXI, part 1
  idx: 264
  unit: 9
  title: 'Warwick the Kingmaker, part 1: The Wars of the Roses begin'
  mins: 25
  goal: Your child can tell who Warwick was, why the duke of York claimed the throne, and why the war was called the Wars of the Roses.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XXXI, section I (1428-1471): the earl of Warwick, the "kingmaker," is the richest and most powerful man in England, with a great castle
    and thousands fed daily. King Henry VI, son of Henry V, often loses his reason. Warwick tells his cousin Richard, duke of York, that he has the better
    claim to the throne. Their petition is ignored, and a thirty-year war begins: the Lancastrians with a red rose, the Yorkists with a white. Henry is
    captured, and Parliament agrees that York shall be king after him.'
  steps:
  - - Set the scene
    - 'Find Warwick in the middle of England, then York in the north and London. Say: This is the last chapter of the book. It is about a war between two
      branches of the same royal family.'
  - - Read the chapter
    - 'Read section I aloud. It begins:

      ~ The earl of Warwick, known as the "kingmaker," was the most famous man in England for many years after the death of Henry V.'
  - - Tell it back
    - 'Prompts:

      - How rich and powerful was Warwick?

      - What was wrong with King Henry VI?

      - Why did Warwick say the duke of York had a better claim?

      - What did Parliament decide after the first battle?'
  - - Draw the family tree
    - 'Draw a simple tree together. At the top: Edward III (the Black Prince''s father). Below him, two of his sons: Lionel (the second son) and the duke
      of Lancaster, John of Gaunt (the fourth son). Under Lancaster write Henry V, then Henry VI. Under Lionel write "Richard, duke of York" (his claim
      came through his mother''s side). Color the Lancaster side red and the York side white.'
  - - Remember it
    - 'Read this:

      ~ The Lancastrians took a red rose for their badge; the Yorkists a white one.

      Add "Wars of the Roses begin" to the timeline.'
  - - Talk it over
    - 'Ask: Warwick said, "Let us first ask for reform," before going to war. Do you think he really wanted peace? What could Henry VI have done to stop
      the war?'
  practice: Ask your child to explain the family tree and which rose each side wore.
  tip: The family tree is the key to this chapter. Keep it out for part 2; your child will add to it.
  answers: He had a great castle, a guard of six hundred men, a hundred and ten estates, the whole city of Worcester and three islands, and fed 30,000 people
    daily. He often lost his reason, so others had to govern for him. York's claim came through Lionel, an older son of Edward III, and through both his
    father and his mother. Henry would stay king for life, and then the crown would go to the duke of York.
- num: 40
  roman: Ch. XXXI, part 2
  idx: 267
  unit: 9
  title: 'Warwick the Kingmaker, part 2: Red rose, white rose, Tudor rose'
  mins: 30
  goal: Your child can tell how the crown passed back and forth in the Wars of the Roses, and how Henry Tudor ended them, and can look back over the whole
    book.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  - Your family tree from part 1
  book: 'Chapter XXXI, sections II and III: Queen Margaret fights for her son, wins two battles, and the duke of York is killed. Warwick makes York''s son
    king as Edward IV. Margaret escapes with help from a robber. Edward quarrels with Warwick; Warwick joins Margaret, brings Henry VI back, and Edward
    flees, returns, and kills Warwick at Barnet. Margaret''s son is murdered and Henry dies, probably poisoned. Richard III has the two young princes murdered
    in the Tower and is killed at Bosworth by Henry Tudor, who marries the heiress of York and ends the Wars of the Roses.'
  steps:
  - - Set the scene
    - Look at the family tree from last time. Ask your child to tell you who wore the red rose and who wore the white.
  - - Read the chapter
    - 'Read from section II to the end of the book. It begins:

      ~ Most people thought this was a wise arrangement; but Queen Margaret, Henry''s wife, did not like it at all, because it took from her son the right
      to reign after his father''s death.

      Heads-up: this part has several cruel deaths: York''s head is set over a gate in a paper crown, Margaret''s son is murdered, and the two young princes
      are smothered in the Tower. Read ahead and decide what to read aloud.'
  - - Tell it back
    - 'Prompts:

      - How did Queen Margaret save her son from the robber?

      - Why did Warwick change sides?

      - How did Warwick die?

      - Who was Henry Tudor, and how did the wars end?'
  - - Add to the tree
    - 'Add Edward IV and Richard III under the duke of York, and Henry Tudor on the Lancaster side. Draw a line joining Henry Tudor and the York heiress.

      Say: Their badge, the Tudor rose, was red and white together.'
  - - What we know now
    - 'Say: Historians still argue about what really happened to the two princes in the Tower. And in 2012, the bones of Richard III were found buried under
      a parking lot in the city of Leicester. He was reburied in Leicester Cathedral.'
  - - Talk it over
    - 'Read the book''s last line:

      ~ So the long and terrible Wars of the Roses came to end.

      Ask: Warwick made kings and unmade them. In the end, did all his power make him happy or safe?'
  - - Look back over the book
    - 'Spread out the whole timeline, from the gods of the Teutons to Henry Tudor. Ask:

      - Which person in this book did you admire most, and why?

      - Which one would you least like to have met?

      Let your child tell the story of their favorite one more time.'
  practice: 'Over the next week, play "Who am I?": you describe someone from the book in one or two sentences and your child guesses (for example, "I burned
    the cakes" or "I saw a spider try six times").'
  tip: The Wars of the Roses are confusing even for adults. If your child can say "two sides of one royal family fought for the crown until Henry Tudor
    joined them by marriage," that is plenty.
  answers: She told the robber, "I am your queen and this is your prince," and trusted her son to his care; he helped them escape. Edward IV would not follow
    his advice and they quarreled and fought; Warwick was driven out, met Margaret in France and joined her. He was killed when Edward defeated him at the
    battle of Barnet. Henry Tudor, earl of Richmond, was a Lancastrian through his mother; he defeated and killed Richard III at Bosworth and married the
    heiress of York, joining the two sides.
