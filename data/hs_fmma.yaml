  - - Read the chapter
    - 'Read Chapter XIII aloud. It begins:

      ~ The Danes were neighbors of the Norwegian Vikings, and like them were fond of the sea and piracy.'
  - - Tell it back
    - 'Prompts:

      - How did Alfred win the book of ballads?

      - What happened in the cowherd''s hut?

      - How did Alfred find out about the Danish army?

      - What did Alfred ask of Guthrum in return for his freedom?'
  - - Legend or history?
    - 'Say: Alfred was a real king, and his wars with the Danes really happened. The burnt cakes and the minstrel are famous old stories. Nobody knows for
