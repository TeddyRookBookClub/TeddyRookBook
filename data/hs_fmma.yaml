  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XIV (919-936 A.D.): Charlemagne''s empire has fallen to pieces. Dying King Conrad advises the German nobles to elect his old enemy, Henry,
    duke of Saxony. The messenger finds Henry hunting with falcons in the Hartz Mountains. Henry captures the Magyar king''s son and trades him for a nine-year
    truce, paying gold each year while he trains horsemen and builds forts. Then he refuses to pay and routs the Magyars. His son Otto takes the title of
    Emperor; the Holy Roman Empire lasts until 1806.'
  steps:
  - - Set the scene
    - 'Find Germany and the Harz Mountains (the book spells them Hartz) in the middle of it. Then find Hungary to the southeast. Say: The Magyars came from
      there; Hungarians still call themselves Magyars.'
  - - Read the chapter
    - 'Read Chapter XIV aloud. It begins:

      ~ About a hundred years had passed since the death of Charlemagne, and his great empire had fallen to pieces.'
  - - Tell it back
    - 'Prompts:

      - Why was Henry so surprised to be chosen?

      - Why was he called the Fowler?

      - What deal did he make with the Magyar king?

      - What did he do during the nine years of truce?'
  - - A word from history
    - 'Say: A falcon is a hunting bird. People trained falcons to sit on their wrist, fly at ducks or partridges, and bring them down. Hunting this way
