  - - Talk it over
    - 'Read the muezzin''s call as the book gives it:

      ~ Come to prayer, come to prayer. There is no god but God. He giveth life, and he dieth not. I praise his perfection. God is great.

      Ask: Muslims all over the world turn toward Mecca when they pray. What does it mean to millions of people to face the same place?'
  - - Remember it
    - 'Add to the timeline: "622 The Hejira" and "632 Mohammed dies in Medina."

