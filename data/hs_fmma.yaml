    that there were now two "Roman" emperors.
  answers: The Saxons were a German people, still pagans; Charlemagne fought them for thirty years. Moorish friends in Spain asked for help against a Muslim
    leader from Damascus. Basques on the cliffs rolled rocks and tree trunks down on the rear guard and then attacked; Roland and all his men were killed.
    The Pope placed a crown on his head and proclaimed him Emperor of the Romans. The title linked him to the old glory of Rome and made him the greatest
