    - Draw the yearly parade of a "do-nothing" king in his gilded chariot, with Pepin quietly in charge behind him.
  practice: 'Ask: Why was Charles called Martel? Who was Pepin''s father? Who was Pepin''s son? (That last one is the next chapter.)'
  tip: The mayor of the palace is a hard idea. Compare it to a team where the captain wears the armband but someone else calls all the plays.
  answers: 'The Do-nothings were Frankish kings who cared only for pleasure; the mayors of the palace did all the work of government. Abd-er-Rahman was
    killed, and the Saracens slipped away in the night, leaving their spoils. Pepin jumped into the arena and killed a lion with his sword when no one else
    would separate the lion and the bull. They asked who ought to be king: the man with the title, or the man with the power who does the duties. A danger:
    anyone strong enough could claim the throne.'
- num: 14
