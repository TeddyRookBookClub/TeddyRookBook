  practice: Ask your child to tell the story of the burnt cakes, with the cowherd's wife's words, to someone in the family.
  tip: The book points out that there were no printed books or even paper in Alfred's time. Feeling a piece of thick paper and imagining it is sheepskin
    makes this real.
  answers: He studied hard all week while his brothers played and read best at the end of the week. He was told to watch the cakes but forgot them while
    thinking of his troubles; they burned and the woman drove him out. He went into the Danish camp disguised as a minstrel with a harp. He asked Guthrum
    to become a Christian and never again make war on his people.
