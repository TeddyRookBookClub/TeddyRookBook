  book: 'Chapter VIII (714-768 A.D.): the Saracens conquer Spain in 711. The Frankish kings, called the "Do-nothings," leave all the work to the mayors
    of the palace. Charles Martel, mayor of the palace, defeats the Saracen army of Abd-er-Rahman between Tours and Poitiers in 732. His son Pepin the Short
