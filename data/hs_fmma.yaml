    - 'Read Chapter XI aloud. It begins:

      ~ Egbert the Saxon lived at the same time as did Harun-al-Rashid and Charlemagne.'
  - - Tell it back
    - 'Prompts:

      - Who were the Britons, and where were they pushed?

      - What did the monk Gregory say when he saw the Angle captives?

