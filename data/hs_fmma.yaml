  - - Read the chapter
    - 'Read Chapter VIII aloud. It begins:

      ~ After the death of Mohammed the Saracens, as Mohammedans are also called, became great warriors.'
  - - Tell it back
    - 'Prompts:

      - Who were the "Do-nothings," and who really ruled?

      - What happened on the seventh day of the battle near Tours?

      - How did Pepin the Short show he was brave?

      - What question did Pepin''s friends ask the Pope?'
  - - Talk it over
    - 'Read the Pope''s answer:

      ~ the man who has the power and does the duties.

      Ask: Who do you think should be king: the person with the title, or the person who does the work? Is there any danger in the Pope''s answer?'
  - - Then and now
    - 'The book calls the battle of Tours one of the decisive battles of the world, which decided that Christians, not Muslims, would rule Europe. Say:
      That was the usual view in 1904. Historians today still argue about how important this one battle was.'
  - - Remember it
    - 'Read how Charles got his name:

      ~ It is said that the name Martel was given to him because of his bravery during the fight.

