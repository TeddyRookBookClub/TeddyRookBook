  steps:
  - - Set the scene
    - 'Find Mecca and Medina again. Say: Last time, Mohammed was a trusted trader who spent weeks praying in a cave. Today he begins to preach.'
  - - Read the chapter
    - 'Read from section III to the end of the chapter. It begins:

      ~ When Mohammed returned home after the angel had first spoken to him, he told his wife of what he had seen and heard.'
  - - Tell it back
    - 'Prompts:

      - Who were the first to believe, and how did most people in Mecca react?

      - Why did Mohammed leave Mecca, and where did he go?

      - What does a muezzin do?

      - What does every Muslim hope to do at least once in life?'
  - - The Hejira
    - 'Read this:

      ~ It was in the year of our Lord 622 that Mohammed fled from Mecca.

      Say: Hejira means flight, or leaving. Muslims count their years from it, just as the book counts years from the birth of Christ. So there are two
      calendars, both still used today.'
  - - The book's 1904 view
    - 'Section IV begins: "Mohammed thought that it was right to spread his religion by force." Say: That is the book''s short, one-sided summary. Muslims
