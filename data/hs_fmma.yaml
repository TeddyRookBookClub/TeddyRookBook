    - 'Read section I aloud, up to the description of the coat of mail. It begins:

      ~ Pepin had two sons, Charles and Carloman.'
  - - Tell it back
    - 'Prompts:

      - Who were the Saxons, and how long did Charlemagne fight them?

      - Why did he go into Spain?

      - What happened to Roland in the pass?

      - What happened in St. Peter''s church on Christmas Day?'
  - - Talk it over
    - 'Read the words the Pope said:

