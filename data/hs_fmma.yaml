  book: 'Chapter IX, section I (768-814 A.D.): Pepin''s son Charles, called Charlemagne, Charles the Great, fights the Saxons for thirty years until their
    chief Wittekind submits. He drives the Lombards from the Pope''s lands, and in 778 helps Moorish friends in Spain. On the way home Roland''s rear guard
    is crushed by Basques in the pass of Roncesvalles. In 800 the Pope crowns him Emperor of the Romans in St. Peter''s. The chapter describes his palace
    at Aix-la-Chapelle and the armor of his day.'
  steps:
