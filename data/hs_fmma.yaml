  tip: This is a short session. It pairs well with a library book of Viking pictures or a look at a museum website.
  answers: Long and swift, with a single mast and one large sail; mostly they were rowed, sometimes by twenty rowers. They took the place and stabled their
    horses in the cathedral Charlemagne had built. He found wild grapes there. Good answers mention the Native peoples who already lived in America, then
    the Vikings who came first from Europe, and Columbus, whose voyage made the land known to Europe for good.
