  practice: Ask your child to explain to someone else what the Hejira was and why the year 622 matters.
  tip: The book's last paragraph mentions the old story that the coffin floated in the air; the book itself calls it a fable made up by enemies. You can
    skip it or use it to talk about rumors.
  answers: Khadijah, then members of his family, then some poor people and slaves; most people in Mecca laughed at him or called him a dreamer, and his
    own tribe threatened to kill him. His wife and uncle had died, he had few friends left in Mecca, and many people in Medina believed and invited him.
