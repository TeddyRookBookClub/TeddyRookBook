  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XVIII (1066-1087): William, Duke of Normandy, says Edward promised him the throne, but Harold is crowned. William crosses with a great
    army. On October 14, 1066, near Hastings, the Normans attack Harold''s men on their hill; William shows his face when a rumor says he is dead; Harold
