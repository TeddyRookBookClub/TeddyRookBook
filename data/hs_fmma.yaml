  - - Remember it
    - 'Add to the timeline: "871 Alfred becomes king" and "875 first English naval victory."'
  - - Extra (optional)
    - 'The book describes Alfred''s mother''s book: brightly colored letters and pictures of knights and ladies on parchment. Make one decorated capital
