  practice: 'Ask: Why is France called France? Repeat until the answer comes easily.'
  tip: This is a short session. If your child is keen, go straight on to part 2 another day this week.
  answers: Frank means free. Clovis was sixteen. Syagrius laughed and shouted that a boy had come to fight him. He ran away early in the battle and left
