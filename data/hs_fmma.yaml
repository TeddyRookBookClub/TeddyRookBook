book:
  id: famousmenofmiddl0000john
  title: Famous Men of the Middle Ages
  year: '1904'
  key: fm-middle-ages
  short: Famous Men of the Middle Ages
  eyebrow: History · Middle Ages · 1904
  hero: John H. Haaren and A. B. Poland's 31 short life stories of the Middle Ages, from Alaric the Goth to Warwick the Kingmaker, with an opening on the
    old Teuton gods and the Nibelungs, for children about 9 to 12. 40 guides cover the whole book, with the right page of the book beside each one.
  how:
  - <b>One story at a time.</b> About 20 to 30 minutes, two or three times a week. A few long chapters are split into two parts.
  - <b>Read it, then tell it back.</b> After each reading, your child tells the story in their own words. The prompts in each guide help when they get stuck.
  - <b>Keep a timeline.</b> Tape sheets of paper into one long strip and add a date and a small drawing each lesson. Every date in this book is A.D., from
    about 400 to about 1500, so the years count up.
  - <b>Find it on a map.</b> Keep a map of Europe and the Mediterranean nearby (a free online map or a globe). A few chapters travel to Arabia, Baghdad,
    India and China.
  - <b>Legends and hard parts.</b> The book mixes history with legends (Alfred's cakes, Bruce's spider, William Tell). Many chapters have battles and cruel
    deeds; the guides flag the hardest ones so you can read ahead.
  - <b>A book from 1904.</b> The authors wrote from a Christian, European point of view. The guides note gently where their words or views have changed,
    especially in the chapters on Mohammed and the Crusades, and treat every faith with respect.
  lessonword: ''
  numnote: Each guide covers one chapter of the book, shown beside the title; the Introduction (the Teuton gods and the Nibelungs) and a few long chapters
    are split into parts.
units:
- id: 1
  name: Gods and heroes of the Teutons
  from: 1
  to: 3
  text: The old gods of the northern peoples and the Nibelung legend of Siegfried (the Introduction).
- id: 2
  name: The barbarian kingdoms
  from: 4
  to: 10
  text: Goths, Huns, Vandals and Franks break up the Roman West, while Justinian rules in Constantinople (Chapters I to VI).
- id: 3
  name: Mohammed and the Saracens
  from: 11
  to: 13
  text: The rise of Islam in Arabia, and the Frankish mayors who met the Saracen armies at Tours (Chapters VII and VIII).
- id: 4
  name: The age of Charlemagne
  from: 14
  to: 17
  text: Charlemagne is crowned emperor, Harun-al-Rashid rules at Bagdad, and Egbert unites the English (Chapters IX to XI).
- id: 5
  name: Northmen, Danes and Saxons
  from: 18
  to: 22
  text: Viking raids and voyages, Normandy, Alfred the Great, Henry the Fowler and Canute (Chapters XII to XV).
- id: 6
  name: The Cid and the Norman Conquest
  from: 23
  to: 25
  text: The Cid in Spain, then Edward the Confessor and William the Conqueror in 1066 (Chapters XVI to XVIII).
- id: 7
  name: The Crusades
  from: 26
  to: 30
  text: Peter the Hermit, Barbarossa, Henry II and his sons, and Saint Louis, in the age of the Crusades (Chapters XIX to XXII).
- id: 8
  name: Freedom fighters and far travelers
  from: 31
  to: 35
  text: Robert Bruce, Marco Polo, the Black Prince, William Tell and Tamerlane (Chapters XXIII to XXVII).
- id: 9
  name: The end of the Middle Ages
  from: 36
  to: 40
  text: Henry V, Joan of Arc, Gutenberg and the Wars of the Roses (Chapters XXVIII to XXXI).
lessons:
- num: 1
  roman: Intro, part 1
  idx: 8
  unit: 1
  title: The gods of the Teutons
  mins: 25
  goal: Your child can name the chief gods the Teutons believed in, tell the story of Baldur, and say which days of the week are named after these gods.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - A long strip of paper for a timeline (taped-together sheets work well)
  book: 'The first part of the Introduction: after Rome''s power was broken, tribes from north of the Danube and the Rhine (Goths, Vandals, Huns, Franks
    and Anglo-Saxons) took over its lands. The Teutons'' gods are described: Woden and his horse Sleipnir, Thor and his hammer, Tiew, Frija, bright Baldur
    killed by a mistletoe arrow, the Valkyries and Valhalla, the giant Ymir, the world tree, and the last great battle of gods and giants.'
  steps:
  - - Set the scene
    - 'Find the River Rhine and the River Danube on the map. Say: The Roman Empire once reached up to these two rivers. North of them lived tribes the Romans
      called barbarians.

      If your child read Famous Men of Rome, remind them how it ended: Rome was taken by Goths and Vandals, and the last emperor of the West lost his throne.
      This book starts there.'
  - - Read the chapter
    - 'Read the section called The Gods of the Teutons aloud together. It begins:

      ~ In the little volume called The Famous Men of Rome you have read about the great empire which the Romans established.

      Stop after each god and let your child say in a few words what that god did.'
  - - Tell it back
    - 'Close the book and ask your child to tell what they remember. Prompts if they get stuck:

      - Who was the king of all the gods, and what did he ride?

      - What happened when Thor threw his hammer?

      - Why could nothing hurt Baldur except the mistletoe?

      - Who were the Valkyries, and where did they carry the warriors?'
  - - Days of the week
    - 'Read this together:

      ~ Four of the days of the week are named after these gods. Tuesday means the day of Tiew; Wednesday, the day of Woden; Thursday, the day of Thor;
      and Friday, the day of Frija.

      Say each day slowly and listen for the god''s name inside it. Write the four days with the god''s name beside each.'
  - - Talk it over
    - 'The book explains what the Baldur story meant to the Teutons: his bright face was the sunshine, and the world''s sorrow at his death was the gloom
      of the long northern winter.

      Ask:

      - Why do you think people who lived through dark, cold winters told a story like this?

      - How did the Teutons explain thunder and lightning?'
  - - A note about 1904
    - 'The book calls the Teutons "war-like, savage and cruel" and says the greatest nations of modern times came from them. That is how many writers talked
      in 1904.

      Say: These were the old beliefs of the people of northern Europe. Later in this book many of them become Christians, but the old stories were not
      forgotten.'
  - - Start a timeline (optional)
    - 'Lay out a long paper strip. Write "The Middle Ages" across the top. Say: The Middle Ages are the years between the fall of Rome and about the time
      Columbus sailed, roughly a thousand years. All the dates in this book are A.D., so they count up.

      Your child can draw Thor''s hammer at the left end.'
  practice: During the week, each time you say the name of a day, ask your child whose day it is.
  tip: Some families know these gods from comics and films. The book's versions are older and a little different; that is a good thing to notice together,
    not to argue about.
  answers: Woden (Odin) was king of the gods and rode the eight-footed horse Sleipnir. Thor's hammer made lightning as it flew and thunder when it struck
    the ice mountains. Frija made every living thing promise not to hurt Baldur but forgot the mistletoe. The Valkyries were warrior women who carried Woden's
    favorite warriors to Valhalla, the hall of the slain. Thunder was Thor's hammer; a storm was the snorting of Sleipnir.
- num: 2
  roman: Intro, part 2
  idx: 17
  unit: 1
  title: 'The Nibelungs, part 1: Siegfried and Brunhilda'
  mins: 25
  goal: 'Your child can tell the first half of the Nibelung story: who Siegfried was, how he won the treasure, and how he helped King Gunther win Brunhilda.'
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  book: 'The Nibelungs, sections I to III: an unknown poet of the twelfth century wrote down the old stories in the Nibelungenlied. Siegfried comes to Worms
    to win Princess Kriemhilda. Hagen tells how he won the Nibelung treasure, the sword Balmung and the cap of darkness, and how dragon''s blood made his
    skin like horn. Siegfried beats the Saxons and Danes, then, invisible, helps Gunther win the contests with Brunhilda, queen of Iceland.'
  steps:
  - - Set the scene
    - 'Find the Rhine again. Point to Worms, a city on the Rhine in Germany, and to the Netherlands where the Rhine reaches the sea. Then find Iceland,
      far to the northwest.

      Say: This is not history. It is a great old poem of the Germans, full of dwarfs, dragons and magic. But it tells us what the people of the Middle
      Ages loved to hear.'
  - - Read the chapter
    - 'Read from the start of The Nibelungs to the double wedding at Worms. The story begins:

      ~ In the grand old city of Worms, in Burgundy, there lived long ago the princess Kriemhilda.

      Explain two words if needed: a hoard is a hidden treasure; to woo is to try to win someone as a husband or wife.'
  - - Tell it back
    - 'Prompts:

      - How did Siegfried get the Nibelung treasure, the sword and the cap of darkness?

      - Why could no sword wound him?

      - What three contests did a knight have to win against Brunhilda?

      - How did Siegfried help Gunther win?'
  - - Talk it over
    - 'Ask:

      - Was it fair for Siegfried to help Gunther in secret? What might happen if Brunhilda found out?

      - The book says whoever owned the treasure "was followed by a curse." Keep that in mind for next time.'
  - - Remember it
    - 'Read what Kriemhilda said when Siegfried came home a hero:

      ~ Welcome, Sir Siegfried, welcome; we thank you one and all.

      Say: Siegfried, Kriemhilda, Gunther, Brunhilda, Hagen. Write the five names with one word about each.'
  - - Extra (optional)
    - Draw Siegfried and the dragon, or Brunhilda hurling her huge stone. The book says it took twelve men to lift it.
  practice: Ask your child to tell the story of the cap of darkness to someone else in the family.
  tip: The book mentions that Wagner's operas are based on these legends. If your child likes music, a few minutes of Wagner's "Ride of the Valkyries" is
    a fun follow-up.
  answers: Siegfried divided the hoard for two princes; they quarreled and attacked him, and he killed them, then beat the dwarf Alberich and took the cap
    of darkness. He had bathed in a dragon's blood, which turned his skin to horn. The contests were leaping, hurling the spear and pitching the stone.
    Wearing the cap of darkness, he stood unseen beside Gunther and did the work for him.
- num: 3
  roman: Intro, part 3
  idx: 24
  unit: 1
  title: 'The Nibelungs, part 2: The treasure brings sorrow'
  mins: 20
  goal: Your child can tell how the quarrel of the two queens led to Siegfried's death, and how Kriemhilda's revenge ended the story.
  materials:
  - The book, open to this chapter
  - Paper and colored pencils
  book: 'The Nibelungs, sections IV and V: the two queens quarrel, Hagen learns Siegfried''s one weak spot and kills him at a spring, then hides the treasure
    in the Rhine. Kriemhilda marries Etzel (Attila), king of the Huns, invites her brothers to a festival, and a great fight destroys the Burgundians. Kriemhilda
    and Hagen are both killed.'
  steps:
  - - Set the scene
    - Ask your child to remind you who Siegfried, Kriemhilda, Gunther, Brunhilda and Hagen were.
  - - Read the chapter
    - 'Read from section IV to the end of the Introduction. It begins:

      ~ Now comes the sad part of the Nibelung tale.

      Heads-up: Siegfried is speared in the back, and at the end Kriemhilda has her brother and Hagen beheaded. The book tells it in a few plain sentences.
      Read ahead and decide how much to read aloud to a younger child.'
  - - Tell it back
    - 'Prompts:

      - How did Hagen find out where Siegfried could be wounded?

      - What did Hagen do with the treasure?

      - Why did Kriemhilda agree to marry Etzel?

      - How did the story end?'
  - - Talk it over
    - 'Read this sentence:

      ~ Thus the treasure of the Nibelungs brought disaster to Siegfried.

      Ask:

      - Was it really the treasure that caused all the trouble, or something in the people?

      - Kriemhilda''s revenge brought more killing. What does the story seem to say about revenge?'
  - - A link to history
    - 'Say: Etzel is the old German name for Attila, king of the Huns. He was a real man, and you will meet him in Chapter II. The poem mixes real people
      with legends.'
  - - Extra (optional)
    - Draw Hagen sinking the treasure into the Rhine. Some people say it is still there.
  practice: Ask your child to retell the whole Nibelung story in five sentences, one for each part.
  tip: This is the saddest story in the book's opening. If your child is upset, it helps to say that poets in those days liked stories that ended in great
    tragedy, like some of Shakespeare's plays.
  answers: Hagen tricked Kriemhilda into sewing a little silk cross on Siegfried's clothes over the spot. He hid the treasure in the Rhine. She hoped Etzel,
    who carried the sword of Tiew, would help her take vengeance on Gunther and Hagen. After a great fight at Etzel's court, Kriemhilda had Gunther and
    Hagen killed, and then a friend of Hagen killed her. The treasure seems to bring out greed and hatred; revenge only leads to more sorrow.
- num: 4
  roman: Ch. I
  idx: 28
  unit: 2
  title: Alaric the Visigoth
  mins: 25
  goal: Your child can tell who the Visigoths were, how Alaric's dream came true when he took Rome, and how he was buried.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter I (394-410 A.D.): the Goths settle south of the Danube with the emperor''s permission. Alaric becomes king of the Visigoths, dreams of
    riding through Rome as emperor, plunders Athens, fights the general Stilicho, and besieges Rome three times while the emperor Honorius hides at Ravenna.
    Rome is taken and plundered for six days. Alaric dies on the way to Sicily and is buried in the bed of the river Busento.'
  steps:
  - - Set the scene
    - 'Find the Danube near the Black Sea, then Romania and Bulgaria (the book spells it Roumania). Then find Athens, Rome and Ravenna.

      Say: Visigoths means Western Goths. Ostrogoths means Eastern Goths. Both names come back later.'
  - - Read the chapter
    - 'Read Chapter I aloud. It begins:

      ~ Long before the beginning of the period known as the Middle Ages a tribe of barbarians called the Goths lived north of the River Danube in the country
      which is now known as Roumania.

      Heads-up: at the very end, the slaves who dug Alaric''s grave are put to death so no one would know where it was.'
  - - Tell it back
    - 'Prompts:

      - Why did the Goths ask to cross the Danube, and what did they promise?

      - What did Alaric dream?

      - How did Honorius make things worse?

      - What did Alaric order about the churches, and what happened to the rest of Rome?'
  - - Talk it over
    - 'Read this:

      ~ The city was taken, and Alaric''s dream came true.

      Ask:

      - Honorius made promises and broke them. How might things have gone if he had kept his word?

      - Why did the Goth chiefs cheer when Alaric said he would attack Rome?'
  - - Remember it
    - 'Add to the timeline: "410 A.D. Alaric takes Rome." (Chapter XI of this book gives 410 as the year Alaric sacked Rome.)

      Say: For eight hundred years no enemy had captured Rome. People all over the empire were shocked.'
  - - Extra (optional)
    - Draw the river turned aside while Alaric's grave is dug in its bed, then the water flowing back over it.
  practice: Ask your child to tell the story of Alaric's dream to someone in the family.
  tip: If your child knows the Rome book, ask who else rode in triumph through Rome. Alaric is copying the Roman generals he defeated.
  answers: The Goths were tired of fighting the Huns; they promised to be friends of Rome and fight for her. Alaric dreamed he drove a golden chariot through
    Rome while the people hailed him as emperor. Honorius broke his promises and even let a barbarian ally attack Alaric during peace talks, so Alaric came
    back a third time. Alaric ordered that the Christian churches not be harmed; the rest of the city was plundered. The chiefs hoped to share the riches
    of the richest city in the world.
- num: 5
  roman: Ch. II
  idx: 37
  unit: 2
  title: Attila the Hun
  mins: 25
  goal: Your child can tell how Attila became the "Scourge of God," how he was beaten at Chalons, and how Rome was spared.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter II (the book gives 433 or 434 to 453 A.D.): young Attila hears a hermit''s prophecy, takes the "sword of Tiew" found by a shepherd, and
    attacks the Roman Empire. At Orleans he turns to face an army of Romans and Visigoths under Aetius and Theodoric and is defeated at Chalons. He invades
    Italy; people fleeing Aquileia found Venice. Pope Leo I persuades him not to attack Rome. He dies the day after his wedding.'
  steps:
  - - Set the scene
    - 'Find the Danube again, then Orleans and Chalons in France (the book says Chalons stands in the plain of Champagne). Then find Venice at the top of
      the Adriatic Sea.

      Say: The Huns came from Asia. They were the people who had pushed the Goths across the Danube in the last chapter.'
  - - Read the chapter
    - 'Read Chapter II aloud. It begins:

      ~ The fierce and warlike tribe, called the Huns, who had driven the Goths to seek new homes, came from Asia into Southeastern Europe and took possession
      of a large territory lying north of the River Danube.

      Heads-up: near the end the Huns cut their faces in mourning, and the slaves who dug Attila''s grave are killed.'
  - - Tell it back
    - 'Prompts:

      - What did the Hermit of the Rocks tell Attila?

      - Where did the sword of Tiew come from?

      - Who beat Attila at Chalons, and who was lifted on a shield?

      - How did the city of Venice begin?'
  - - Legend or history?
    - 'The book says Pope Leo went to Attila''s camp and persuaded him to spare Rome. Historians agree that Leo met Attila.

      It also says "It is also told" that the apostles Peter and Paul appeared to Attila. Say: That is a story the people of Rome told afterward. The book
      is careful to say "it is told."'
  - - Talk it over
    - 'Read this:

      ~ The people had such dread of him that he was called the "Scourge of God" and the "Fear of the World."

      Ask: Attila believed nobody could beat him while he had the sword of Tiew. What happened to that belief at Chalons?'
  - - Remember it
    - 'Add to the timeline: "453 A.D. Attila dies." Draw the three coffins: gold, silver and iron.'
  - - Extra (optional)
    - Venice is built on islands in a lagoon, with canals for streets. Look at a picture of Venice from the air together.
  practice: 'Ask: Who were the Huns, and who stopped them? Repeat until "Aetius and the Visigoths, at Chalons" comes easily.'
  tip: The numbers in this chapter (700,000 Huns) are the book's; old writers often made armies much bigger than they were.
  answers: The hermit said Attila would be a famous conqueror and master of many nations, but that death would strike him just after he married the woman
    he loved. A shepherd followed a trail of blood from an ox's foot and found a sword point sticking out of the ground. Aetius, the Roman general, and
    the Visigoths beat him; Thorismond, son of the dead Visigoth king, was lifted on a shield and hailed as king. People from Aquileia fled to the islands
    and marshes of the Adriatic and founded Venice. At Chalons Attila was beaten for the first time, sword or no sword.
- num: 6
  roman: Ch. III
  idx: 47
  unit: 2
  title: Genseric the Vandal
  mins: 25
  goal: Your child can tell how the Vandals won North Africa, why Genseric sacked Rome, and where our word "vandal" comes from.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter III (427-477 A.D.): lame young Genseric becomes king of the Vandals in southern Spain. A plot by Aetius makes Count Boniface invite the
    Vandals into Africa. Genseric conquers the coast, takes Hippo and Carthage, and rules the sea as a pirate king. Invited by the Empress Eudoxia, he plunders
    Rome for fourteen days. He burns Emperor Majorian''s fleet and destroys Emperor Leo''s great fleet with fire ships, and dies in 477 still master of
    his kingdom.'
  steps:
  - - Set the scene
    - 'Find southern Spain, the Strait of Gibraltar, and the coast of North Africa. Point to Carthage (near Tunis today). Say: Carthage was once Rome''s
      great enemy, in the days of Hannibal.'
  - - Read the chapter
    - 'Read Chapter III aloud. It begins:

      ~ The Vandals were another wild and fierce tribe that came from the shores of the Baltic and invaded central and southern Europe in the later times
      of the Roman Empire.'
  - - Tell it back
    - 'Prompts:

      - How did the plot of Aetius bring the Vandals to Africa?

      - Why did Genseric go to Rome, and what did the Vandals do there?

      - How did Emperor Majorian spy on the Vandals?

      - How did Genseric destroy the great Roman fleet?'
  - - A word from history
    - 'Read this:

      ~ This was what the Vandals did whenever they took a town, and so the word vandal came to mean a person who needlessly or wantonly destroys valuable
      property.

      Say: Today we still say "vandalism" when someone smashes or spray-paints things that belong to others.'
  - - Talk it over
    - 'Ask:

      - Boniface was loyal to Rome until he was tricked. Who do you think was most to blame for the Vandals coming to Africa?

      - Genseric asked for a five-day truce and used it to attack. Was that fair? Why did it work?'
  - - Remember it
    - 'Add to the timeline: "455 A.D. The Vandals plunder Rome." (The book says it was forty-five years after Alaric.) Then "477 Genseric dies."'
  - - Extra (optional)
    - Draw the fire ships drifting into the Roman fleet at night.
  practice: Ask your child to use the word "vandal" in a sentence of their own.
  tip: 'Ask your child to count up with you: 410 plus 45 is 455. Small sums like this make the timeline feel real.'
  answers: Aetius told the empress that Boniface was a traitor and secretly told Boniface the empress would kill him; Boniface refused to come home and
    invited Genseric to Africa. Empress Eudoxia asked him to protect her from Maximus; the Vandals plundered Rome for fourteen days and carried off gold,
    works of art and prisoners. Majorian dyed his hair and came to Carthage pretending to be an ambassador. During a truce he sent burning boats in among
    the Roman ships at night. The Vandals did not keep their word; it worked because the Romans trusted the truce.
- num: 7
  roman: Ch. IV
  idx: 56
  unit: 2
  title: Theodoric the Ostrogoth
  mins: 25
  goal: Your child can tell how Theodoric grew up as a hostage, led his whole people over the Alps, and became king of Italy.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter IV (475-526 A.D.): Theodoric is sent as a boy to Constantinople as a hostage and educated there. As king of the Ostrogoths he is sent by
    Emperor Zeno to take Italy from Odoacer, who had replaced the last Western emperor. He leads 250,000 people over the Alps, wins battles at Aquileia,
    Verona (where his mother rallies his men) and the Adda, starves Ravenna into surrender, then murders Odoacer and rules Italy for thirty-three years.'
  steps:
  - - Set the scene
    - 'Find the Black Sea and Constantinople (Istanbul today). Then trace a line west to the Alps and down into Italy: Aquileia, Verona, Ravenna.

      Say: This time a whole people moved: men, women and children, with their wagons and horses.'
  - - Read the chapter
    - 'Read Chapter IV aloud. It begins:

      ~ The Ostrogoths, or East Goths, who had settled in Southern Russia, at length pushed southward and westward to the mouth of the Danube.

      Heads-up: near the end Theodoric murders Odoacer at a banquet, a few days after promising to share Italy with him.'
  - - A word from history
    - 'The book explains the word hostage: a person given to another king as a pledge that a treaty would be kept.

      Ask: Theodoric lived as a hostage for ten years. How was he treated? What did he learn?'
  - - Tell it back
    - 'Prompts:

      - Who was Odoacer, and how had he become ruler of Italy?

      - What did the Ostrogoths do when they saw Italy from the top of the Alps?

      - How did Theodoric''s mother save the battle of Verona?

      - How did Theodoric finally take Ravenna?'
  - - Talk it over
    - 'Read Theodoric''s words on the Alps:

      ~ There is the country which shall be our home. Let us march on. It certainly shall be ours.

      Ask: The book praises Theodoric''s long rule, but also tells how he killed Odoacer. Can someone be a good ruler and also do something very wrong?'
  - - Remember it
    - 'Add to the timeline: "Theodoric, king of Italy" with the dates the book gives, 475-526.

      If your child read the Rome book, say: Odoacer is the man who ended the Western Empire in 476.'
  practice: Ask your child to explain to someone what a hostage was, using Theodoric as the example.
  tip: Theodoric's long march is a good place to ask what it would be like to move house with everything you own in a wagon, over mountains.
  answers: Odoacer had been a general under the last Western emperor, Romulus Augustulus; the unpaid soldiers drove out the emperor and chose Odoacer. The
    Ostrogoths shouted and danced for joy. She stopped the men who were running away and shamed them into going back to fight. He surrounded Ravenna and
    kept food out until the city had to surrender. Good answers notice both sides; the book itself tells both.
- num: 8
  roman: Ch. V, part 1
  idx: 62
  unit: 2
  title: 'Clovis, part 1: The boy king of the Franks'
  mins: 20
  goal: Your child can tell who the Franks were, how France got its name, and how sixteen-year-old Clovis beat the Romans at Soissons.
  materials:
  - The book, open to this chapter
  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter V, sections I and II (481-511 A.D.): the Franks, whose name means free, cross the Rhine into Gaul, which is later named France after them.
    Clovis becomes king at sixteen. The Roman general Syagrius laughs at him as a boy, but the Franks win the battle of Soissons, and Clovis goes on to
    make himself king of all the Franks.'
  steps:
  - - Set the scene
    - 'Find the Rhine, then France. Say: In Roman times this land was called Gaul. Find Soissons, northeast of Paris.'
  - - Read the chapter
    - 'Read sections I and II, up to the taking of Soissons. It begins:

      ~ While the power of the Roman Empire was declining there dwelt on the banks of the River Rhine a number of savage Teuton tribes called Franks.'
  - - Tell it back
    - 'Prompts:

      - What does the word Frank mean?

      - How old was Clovis when he became king?

      - What did Syagrius shout when he saw Clovis?

      - What happened to Syagrius during the battle?'
