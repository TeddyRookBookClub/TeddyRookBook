  - - Remember it
    - 'Add to the timeline: "1016 Canute king of all England." Say: The years now have four figures. We are past the year 1000.'
  - - Extra (optional)
    - Draw Canute on his chair with the waves around his feet and the surprised courtiers behind him.
  practice: Ask your child to tell the story of Canute and the tide, ending with what he said.
  tip: 'People sometimes tell this story as if Canute was proud enough to think he could stop the sea. The book tells it the old way: he did it to show
    his flatterers they were wrong.'
  answers: Edmund was the son of King Ethelred, a brave Saxon who fought Canute in five battles in one year. The Saxon noble Edric took his men out of the
    fight. Canute admired him, treated him generously and shared England with him. He wanted to show the courtier who said he could do anything that even
    a king cannot command the tide; flattery hides the truth from a ruler.
