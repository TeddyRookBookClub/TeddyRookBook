  - A map of Europe and the Mediterranean (a free online map or a globe)
  - Paper and colored pencils
  - Your timeline strip (see the tips at the top)
  book: 'Chapter XV (1014-1035): Sweyn, king of Denmark, conquers England in 1013; his son Canute, nineteen, follows him. Edmund Ironside fights Canute
    in six battles and is beaten only when the traitor Edric pulls his men out. Canute shares England with Edmund until Edmund dies in 1016, then rules
    wisely, sends his Danish army home, and rebukes his courtiers'' flattery by commanding the tide to go back.'
  steps:
  - - Set the scene
    - 'Find Denmark and England again. Say: The kings after Alfred drove the Danes back. Now, more than a hundred years later, a Danish king tries again.'
  - - Read the chapter
    - 'Read Chapter XV aloud. It begins:

      ~ The Danes, you remember, had the eastern and northern parts of England in the time of Alfred.'
  - - Tell it back
    - 'Prompts:

      - Who was Edmund Ironside?

      - How were the Saxons beaten in the sixth battle?

      - How did Canute treat Edmund after winning?

      - Why did Canute put his chair at the edge of the sea?'
  - - Talk it over
    - 'Read what Canute said with his feet in the water:

      ~ Learn how feeble is the power of earthly kings. None is worthy the name of king but He whom heaven and earth and sea obey.

