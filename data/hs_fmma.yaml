      - Henry paid the Magyars gold for nine years. Was that weak, or clever?'
  - - Remember it
    - 'Add to the timeline: "919 Henry the Fowler elected king of Germany." Say: His son Otto took the title of Emperor. The "Holy Roman Empire" lasted
      until 1806.'
  practice: Ask your child to explain why Henry's truce was a clever plan.
  tip: If you can find a video of a falconer flying a hawk or falcon, it brings this chapter to life.
  answers: 'King Conrad had been a Frank and Henry''s bitter enemy. He loved hunting birds with falcons. He would give back the king''s son if the Magyars
    left Germany and kept peace for nine years, and he would pay five thousand pieces of gold a year. He trained a strong force of horsemen, drilled the
    foot soldiers, and built and strengthened forts. It was clever: he bought time to get ready.'
- num: 22
