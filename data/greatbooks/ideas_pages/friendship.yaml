key: friendship
question: What is a true friend? Why do we need friends, and what kinds of love are there?
stops:
- rung: gbgreeks.plato-symposium-phaedrus
  year: -380
  text: 'In the Symposium, friends at a dinner take turns praising love. Socrates passes on what he says he learned from a wise woman,
    Diotima: love can rise step by step, from caring for one person to loving good character, then knowledge, and at last beauty itself.
    For Plato, love is a longing that can lift the soul upward.'
- rung: gbgreeks.aristotle-ethics
  year: -340
  text: 'Aristotle sorts friendships into three kinds: friends who are useful to each other, friends who enjoy each other, and friends
    who love each other for their goodness. Only the third kind lasts, because it rests on who the friends are. A true friend, he says,
    is like another self, and no one would choose to live without friends even with every other good thing.'
- rung: gbmiddle.aquinas-later-parts
  year: 1272
  text: Aquinas takes Aristotle's idea of friendship and uses it to describe love of God. Charity, he argues, is a friendship between
    a person and God, and it reaches out from there to love one's neighbor. Friendship becomes the model for the highest love.
  quote:
    text: 'The love which is based on this communication, is charity: wherefore it is evident that charity is the friendship of man
      for God.'
    author: Thomas Aquinas
    work: Summa Theologica, Second Part of the Second Part, Question 23, Article 1
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/3023.htm
- rung: gbren.montaigne-essays
  year: 1580
  text: 'Montaigne writes about his friend Étienne de La Boétie, who died young. Ordinary friendships, he says, are built on usefulness
    or habit, but theirs was a joining of two souls that he could not fully explain. Asked why he loved his friend, he could only answer:
    because it was he, because it was I.'
- rung: gbren.shakespeare-sonnets
  year: 1609
  text: Shakespeare's sonnets praise a beloved friend and promise that poetry will keep his beauty alive. Sonnet 116 describes a love
    that does not change when times change. It is a steady mark that ships can steer by in a storm.
  quote:
    text: Let me not to the marriage of true minds Admit impediments.
    author: William Shakespeare
    work: Sonnet 116
    tr: ''
    ed: Shake-speares Sonnets, London
    year: 1609
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1041
- rung: gb18.boswell-life-of-johnson
  year: 1791
  text: Boswell, a young Scot, became the friend of the great English writer Samuel Johnson, though Johnson liked to tease the Scots.
    Boswell wrote down their talks for years. His book shows a real friendship between two very different men, with arguments, jokes
    and loyalty.
- rung: gb19.austen-emma
  year: 1815
  text: In Emma, Mr. Knightley proves his friendship by telling Emma when she has done wrong, as when she mocks poor Miss Bates. Emma's
    friendship with Harriet, by contrast, is spoiled because Emma tries to manage her. Austen suggests that a true friend wants your
    good, not only your comfort.
  quote:
    text: Her situation should secure your compassion.
    author: Austen
    work: Emma, Volume III, Chapter VII
    tr: ''
    ed: John Murray, London (first edition)
    year: 1815
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/emma00158gut
- rung: gb19.twain-huckleberry-finn
  year: 1884
  text: Huck and Jim, a man escaping slavery, float down the Mississippi together. Huck was raised to see Jim as property, but on the
    raft he comes to know Jim as a kind, wise friend. Twain shows a friendship growing stronger than the rules of the society around
    them.
  quote:
    text: We said there warn't no home like a raft, after all.
    author: Twain
    work: Adventures of Huckleberry Finn, Chapter XVIII
    tr: ''
    ed: Charles L. Webster and Company, New York
    year: 1885
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/theadventuresofh07103gut
young:
- 'A friend is someone you like to be with and who wants good things for you. Aristotle noticed three kinds of friends: friends who
  help each other, friends who have fun together, and friends who care about each other because they are both good people.'
- The third kind lasts the longest. A true friend will play with you, but also tell you kindly when you are being unfair, and stay with
  you when things are hard.
talk:
- Which of Aristotle's three kinds of friendship do you have? Can one friendship be more than one kind?
- Mr. Knightley tells Emma she was unkind. Is it friendly to tell a friend they did something wrong? How should you do it?
- Montaigne couldn't explain why he loved his friend. Can you explain why you like your best friend?
- Huck and Jim become friends even though the world around them said they shouldn't. Why do you think their friendship grew?
- Can a family member also be a friend?
