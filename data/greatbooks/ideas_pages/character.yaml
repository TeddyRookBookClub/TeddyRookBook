# Great Books Ladder: the Great Idea "character", followed through the books (page: /great-books/ideas/character/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
#   question: one or two plain sentences.  intro: optional.  stances: optional [{key, label}] (colors the timeline; only where views divide cleanly)
#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: character
question: Where does good character come from? Can goodness be taught, or is it built by practice, or is it a gift?
stances:
- key: knowledge
  label: Virtue as a kind of knowledge
- key: habit
  label: Virtue built by practice and habit
- key: grace
  label: Goodness as a gift of God's grace
- key: both
  label: Habit and grace together
stance_note: Uncolored stops take up character in other ways.
stops:
- rung: gbgreeks.plato-meno
  year: -385
  stance: knowledge
  text: Meno asks Socrates whether virtue can be taught. Socrates leans toward the view that virtue is a kind of wisdom, since no one
    does wrong knowing it is bad for them. But he also notices that good fathers often fail to teach their sons, and the dialogue ends
    with the puzzle still open, suggesting that good people may have their goodness as a gift of the gods.
  quote:
    text: Can you tell me, Socrates, whether virtue is acquired by teaching or by practice; or if neither by teaching nor by practice,
      then whether it comes to man by nature, or in what other way?
    author: Plato
    work: Meno 70a
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. II, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0002
- rung: gbgreeks.aristotle-ethics
  year: -340
  stance: habit
  text: Aristotle answers that character virtues come from practice. We become brave by doing brave things, the way a builder learns
    by building. Each virtue is a settled habit of choosing the middle path between too much and too little, guided by practical wisdom.
  quote:
    text: And so by doing just acts we become just, and by doing acts of temperance and courage we become temperate and courageous.
    author: Aristotle
    work: Nicomachean Ethics II.1, 1103a–b
    tr: F. H. Peters
    ed: Kegan Paul
    year: 1881
    src: Internet Archive
    url: https://archive.org/details/nicomachethic00arisuoft
- rung: gbrome.plutarch-greek-lives
  year: 110
  text: 'Plutarch writes lives, not histories, so that readers can see character up close: in small sayings and choices as well as in
    battles. He believes that seeing a good action told well makes us want to do likewise. His paired lives of Greeks and Romans are
    meant as mirrors for the reader.'
  quote:
    text: But virtue, by the bare statement of its actions, can so affect men’s minds as to create at once both admiration of the things
      done and desire to imitate the doers of them.
    author: Plutarch
    work: Life of Pericles, chapter 2
    tr: John Dryden and others, revised by Arthur Hugh Clough
    ed: The Harvard Classics, vol. 12, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/harvardclassicsp0000char_g1f9
- rung: gbrome.augustine-confessions
  year: 398
  stance: grace
  text: Augustine tells how he knew what was good for years and still could not make himself do it. His will was divided against itself.
    He came to believe that only God's grace could heal the will, and that a person cannot become good by effort alone.
- rung: gbmiddle.aquinas-later-parts
  year: 1272
  stance: both
  text: Aquinas joins Aristotle and Augustine. The moral virtues, such as courage and self-control, can be gained by practice, as Aristotle
    taught. But faith, hope and charity, which direct a person to God, are in his view given by God, and charity is the form that gives
    all the other virtues their full worth.
  quote:
    text: It is therefore evident that hope is a virtue, since it causes a human act to be good and to attain its due rule.
    author: Thomas Aquinas
    work: Summa Theologica, Second Part of the Second Part, Question 17, Article 1
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/3017.htm
- rung: gbren.machiavelli-the-prince
  year: 1513
  text: Machiavelli uses the word virtù for a ruler's boldness, skill and readiness to act, which is not the same as moral goodness.
    He advises that a prince who wants to keep power must learn to be able not to be good when needed. Readers have argued for centuries
    over whether he was describing politics as it is or recommending it.
- rung: gb18.kant-moral-philosophy
  year: 1785
  text: Kant says the one thing good without any qualification is a good will. Talents, courage and even happiness can be used badly.
    What gives an act its moral worth, in his view, is that it is done because it is right, not because it is pleasant or useful.
  quote:
    text: Nothing can possibly be conceived in the world, or even out of it, which can be called good without qualification, except
      a Good Will.
    author: Immanuel Kant
    work: Fundamental Principles, First Section
    tr: Thomas Kingsmill Abbott
    ed: Kant's Critique of Practical Reason and Other Works on the Theory of Ethics, 4th edition, Longmans, Green, London
    year: 1889
    src: Internet Archive
    url: https://archive.org/details/critiquepractic00kantuoft
- rung: gb19.austen-emma
  year: 1815
  stance: habit
  text: Jane Austen's Emma is clever and kind but sure of her own judgment, and she meddles in her friends' lives. Her character grows
    through mistakes and through a friend willing to tell her the truth. Austen shows virtue being learned in ordinary life, in visits,
    conversations and apologies.
  quote:
    text: Knightley, in fact, was one of the few people who could see faults in Emma Woodhouse, and the only one who ever told her of
      them ...
    author: Austen
    work: Emma, Volume I, Chapter I
    tr: ''
    ed: John Murray, London (first edition)
    year: 1815
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/emma00158gut
- rung: gb19.james-principles-of-psychology
  year: 1890
  stance: habit
  text: William James brings Aristotle's point into the age of science. Habits, he explains, are paths worn into the nervous system
    by repetition. So we should make good actions automatic early, start new habits strongly, and never allow an exception until the
    habit is firm.
  quote:
    text: The great thing, then, in all education, is to make our nervous system our ally instead of our enemy.
    author: William James
    work: The Principles of Psychology, Chapter IV (Habit)
    tr: ''
    ed: Henry Holt and Company, New York
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/bub_gb_JLcAAAAAMAAJ
young:
- Character is the kind of person you are when you choose what to do. Are you kind? Do you tell the truth? Do you keep trying when something
  is hard?
- 'Aristotle says you get good character the way you get good at piano or soccer: by practicing. Every time you share, or tell the truth
  when it is hard, it gets a little easier next time. Some writers add that we also need help from others, and many believe we need
  help from God.'
talk:
- Can you learn to be kind the way you learn to read? What would the lessons be?
- Think of a good habit you have. How did you build it?
- Aristotle says courage sits between being reckless and being a coward. Can you think of another good trait that sits between two extremes?
- Why does it help to have a friend, like Mr. Knightley, who will tell you your faults?
- Kant says a good will matters most. Can someone mean well and still do harm?
