key: freedom
question: What does it mean to be free? Is freedom something inside us, or something a society gives and protects?
stances:
- key: inner
  label: 'Freedom inside: of the mind, will or soul'
- key: civil
  label: Freedom in society, under law
stops:
- rung: gbgreeks.herodotus-histories
  year: -430
  stance: civil
  text: 'Herodotus tells of the Persian king Xerxes, who could not see why free Greeks with no single master would stand and fight his
    huge army. A Spartan exile tells him that the Greeks are free, but they have a master: their law, which they fear more than Xerxes''
    men fear him. For Herodotus, the Greek victory showed what free citizens can do.'
- rung: gbrome.epictetus-discourses
  year: 108
  stance: inner
  text: 'Epictetus was born a slave. He teaches that the only true freedom is freedom of the will: wanting only what is in your power.
    A tyrant can chain the body, he says, but no one can force you to judge or choose against your will.'
  quote:
    text: 'And the things in our power are by nature free, not subject to restraint nor hindrance: but the things not in our power are
      weak, slavish, subject to restraint, in the power of others.'
    author: Epictetus
    work: Encheiridion (Handbook), chapter 1
    tr: George Long
    ed: George Bell and Sons, London
    year: 1877
    src: Internet Archive
    url: https://archive.org/details/discoursesofepic00epicrich
- rung: gb17.milton-areopagitica-and-poems
  year: 1644
  stance: civil
  text: Milton writes to Parliament against licensing books before they are printed. Truth is strong, he argues, and grows by meeting
    falsehood in open argument, so a free people should let books be published and judged. He also says that a virtue that has never
    been tested is not worth much.
  quote:
    text: Let her and Falsehood grapple; who ever knew Truth put to the worse, in a free and open encounter?
    author: John Milton
    work: Areopagitica
    tr: ''
    ed: printed in London; Project Gutenberg text
    year: 1644
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/608
- rung: gb17.spinoza-ethics
  year: 1677
  stance: inner
  text: Spinoza says that everything follows from causes, so freedom cannot mean acting without a cause. A person is free when they
    act from their own understanding instead of being pushed about by passions. The free person, for him, is the one who sees clearly.
  quote:
    text: 'Human infirmity in moderating and checking the emotions I name bondage: for, when a man is a prey to his emotions, he is
      not his own master, but lies at the mercy of fortune…'
    author: Baruch Spinoza
    work: Ethics, Part IV, Preface
    tr: R. H. M. Elwes
    ed: The Chief Works of Benedict de Spinoza, vol. II, George Bell & Sons
    year: 1883
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/971
- rung: gb18.locke-government-and-toleration
  year: 1689
  stance: civil
  text: Locke argues that people are by nature free and that government exists to protect their lives, liberty and property. Freedom
    is not doing whatever you like, he says, but living under laws you have consented to. In his letter on toleration, he adds that
    belief cannot be forced, so governments should not try.
  quote:
    text: And such is the nature of the understanding, that it cannot be compelled to the belief of any thing by outward force.
    author: John Locke
    work: A Letter Concerning Toleration
    tr: William Popple
    ed: A Letter Concerning Toleration, London edition
    year: 1796
    src: Internet Archive
    url: https://archive.org/details/bim_eighteenth-century_a-letter-concerning-tole_locke-john_1796
- rung: gb18.rousseau-social-contract
  year: 1762
  stance: civil
  text: 'Rousseau opens with a famous line: people are born free and are everywhere in chains. He seeks a kind of society in which each
    person, by joining with all, still obeys only himself. Obeying a law we have given ourselves, he argues, is real freedom.'
  quote:
    text: Man is born free; and everywhere he is in chains.
    author: Jean-Jacques Rousseau
    work: The Social Contract, Book I, ch. 1
    tr: G. D. H. Cole
    ed: The Social Contract & Discourses, Everyman's Library, J. M. Dent, London, and E. P. Dutton, New York
    year: 1913
    src: Internet Archive
    url: https://archive.org/details/therepublicofpla00rousuoft
- rung: gb19.hegel-philosophy-of-history
  year: 1837
  stance: civil
  text: Hegel reads all of history as the story of freedom growing. In the oldest empires, he says, only one person, the ruler, was
    free; in Greece and Rome, some were; in the modern world, the idea is that all people are free. He thought this freedom becomes
    real in laws and institutions.
  quote:
    text: The History of the world is none other than the progress of the consciousness of Freedom.
    author: Hegel
    work: Lectures on the Philosophy of History, Introduction
    tr: J. Sibree
    ed: Bohn's Philosophical Library, London (1884 printing)
    year: 1857
    src: Internet Archive
    url: https://archive.org/details/lecturesonphilos00hege_0
- rung: gb19.mill-on-liberty
  year: 1859
  stance: civil
  text: 'Mill worries less about kings than about the pressure of public opinion. His principle: society may limit a person''s freedom
    only to prevent harm to others, not for that person''s own good. He defends free speech because even a wrong opinion can help us
    understand the truth better.'
  quote:
    text: That the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will,
      is to prevent harm to others.
    author: Mill
    work: On Liberty, Chapter I
    tr: ''
    ed: John W. Parker and Son, London
    year: 1859
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/onliberty34901gut
- rung: gb19.dostoevsky-brothers-karamazov
  year: 1880
  stance: inner
  text: 'Ivan Karamazov tells a story about a Grand Inquisitor who says most people do not want freedom: they want bread, wonder and
    someone to obey. Dostoevsky, who was a believer, gives this argument great force on purpose. He answers it through Alyosha and the
    elder Zosima, whose free, active love shows a different way.'
young:
- 'Being free means being able to make your own choices. Some freedoms come from outside: being allowed to speak, read and play. Your
  family and your country protect those freedoms with rules that keep everyone safe.'
- Another freedom is inside you. Even when you can't choose what happens, like a rainy day or a hard test, you can choose how you act
  and what you think. A Greek teacher who had been a slave said no one can take that freedom away.
talk:
- Are you more free with no rules at all, or with good rules? Think of a game with no rules.
- Mill says people should be free to do anything that doesn't harm others. Can you think of a hard case?
- Epictetus was a slave, yet said he was free inside. What did he mean?
- Milton says truth wins in a fair argument. Do you agree?
- What freedoms do you have now that you didn't have when you were little? What comes with them?
