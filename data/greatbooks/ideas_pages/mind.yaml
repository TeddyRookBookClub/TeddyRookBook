#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: mind
question: What is the mind? How do thinking, feeling and remembering work, and how is the mind related to the body?
stops:
- rung: gbgreeks.plato-symposium-phaedrus
  year: -370
  work: Phaedrus
  text: 'Plato pictures the soul as a chariot with a driver and two winged horses: one noble, one unruly. Reason is the driver, trying
    to steer both. The image explains why we often feel pulled in two directions.'
  quote:
    text: And let the figure be composite—a pair of winged horses and a charioteer.
    author: Plato
    work: Phaedrus 246a–b
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. I, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0001
- rung: gbgreeks.aristotle-on-the-soul
  year: -350
  text: 'Aristotle says the soul is to the body as the shape is to a wax seal: not a separate thing but what makes the body alive and
    active. He studies the powers of living things in layers: growing, sensing, moving and thinking.'
  quote:
    text: It is therefore unnecessary to ask whether body and soul are one, as one should not ask whether the wax and the figure are
      one…
    author: Aristotle
    work: On the Soul II.1, 412b
    tr: William Alexander Hammond
    ed: Aristotle's Psychology, Swan Sonnenschein
    year: 1902
    src: Internet Archive
    url: https://archive.org/details/aristotlespsycho00aris
- rung: gbrome.augustine-confessions
  year: 398
  text: In Book X of the Confessions, Augustine wanders through memory as through great halls full of images, skills and feelings. He
    is amazed that he can remember forgetting, and that his mind is too vast for him to grasp. Memory leads him to search for God within.
- rung: gb17.descartes-meditations
  year: 1641
  text: Descartes concludes that he is a thinking thing, and that the mind is a different kind of thing from the body, which takes up
    space. This split between mind and matter shaped centuries of debate about how the two interact.
  quote:
    text: It is a thing that doubts, understands, [conceives], affirms, denies, wills, refuses, that imagines also, and perceives.
    author: René Descartes
    work: Meditations, II
    tr: John Veitch
    ed: Descartes' Meditations and Selections from the Principles of Philosophy, Open Court
    year: 1913
    src: Internet Archive
    url: https://archive.org/details/meditationsselec00desc
- rung: gb17.spinoza-ethics
  year: 1677
  text: 'Spinoza answers Descartes: mind and body are not two things but one thing seen in two ways. Every event in the body has its
    match in the mind. Understanding our emotions, he argues, is the way to be free of their rule.'
- rung: gb18.kant-critique-of-pure-reason
  year: 1781
  text: Kant argues that the mind is not a blank screen but an active organizer. It arranges what the senses give in space and time
    and links it by concepts like cause. Without the mind's work, there would be no experience at all.
- rung: gb19.james-principles-of-psychology
  year: 1890
  text: William James helped found psychology as a science. He describes consciousness as a stream, always flowing and changing, and
    studies attention, habit, memory and emotion. He tied the mind closely to the brain while leaving room for free will.
  quote:
    text: It is nothing jointed; it flows.
    author: William James
    work: The Principles of Psychology, Chapter IX (The Stream of Thought)
    tr: ''
    ed: Henry Holt and Company, New York
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/bub_gb_JLcAAAAAMAAJ
- rung: gb20.freud-interpretation-of-dreams
  year: 1900
  text: Freud argued that much of the mind is unconscious, and that dreams and slips of the tongue reveal hidden wishes. His ideas spread
    widely and changed how people talk about the mind. Later researchers have rejected many of his specific claims, while some of his
    broad themes, such as that much mental activity happens outside awareness, are widely accepted.
  quote:
    text: At any rate the interpretation of dreams is the via regia to a knowledge of the unconscious in the psychic life.
    author: Sigmund Freud
    work: The Interpretation of Dreams, Chapter VII
    tr: A. A. Brill
    ed: Macmillan, New York (3rd edition)
    year: 1913
    src: Internet Archive
    url: https://archive.org/details/interpretationof1913freu
- rung: gb20.proust-swann-in-love
  year: 1913
  text: In Swann in Love, a little phrase of music becomes bound up with Swann's feelings, and hearing it again later brings that whole
    lost time back to him. Proust's great novel explores how memory, set off by the senses, can bring back the past more vividly than
    effort can. Time lost can be found again in the mind.
young:
- Your mind is the part of you that thinks, feels, remembers and dreams. Right now it is reading these words and maybe wondering what's
  for lunch!
- 'William James said thoughts flow like a stream, one into the next. Try this: close your eyes for one minute and notice your thoughts.
  Where did they go? The great writers have wondered how the mind works and how it is connected to the brain and body.'
talk:
- What is your earliest memory? Why do you think you remember it?
- Plato said the soul is like a chariot with two horses. When do you feel pulled two ways?
- Can a song, a smell or a taste bring back a memory for you, as a piece of music did for Swann?
- Is your mind the same thing as your brain? What do you think?
- Where do you think dreams come from?
