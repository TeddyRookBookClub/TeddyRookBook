key: equality
question: In what ways are people equal? And what follows from it for laws, families and governments?
stops:
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle says justice means treating equals equally and unequals unequally, so everything depends on who counts as equal. He
    reports that democrats think free birth makes people equal, while oligarchs think wealth makes them unequal. He also held that some
    people are slaves by nature, a view that later thinkers rejected.
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes argues that nature made people roughly equal in body and mind. Even the weakest can kill the strongest by trickery or
    by joining with others. This equality, he says, breeds fear and rivalry, which is why people need a government.
- rung: gb18.locke-government-and-toleration
  year: 1689
  text: Locke holds that in the state of nature all people are equal and independent, with no one born to rule another. Political power
    can therefore rest only on consent. His argument became one of the foundations for later talk of equal rights.
  quote:
    text: Men being, as has been said, by nature all free, equal, and independent, no one can be put out of this estate and subjected
      to the political power of another without his own consent…
    author: John Locke
    work: Second Treatise, ch. VIII, §95
    tr: ''
    ed: Two Treatises on Civil Government, Morley's Universal Library, 2nd edition, George Routledge and Sons, London
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/twotreatisesonc01filmgoog
- rung: gb18.rousseau-discourses
  year: 1755
  text: Rousseau separates natural inequality, such as strength or age, from inequality that society creates, such as wealth and rank.
    He traces the second kind to the rise of private property. His story of how it began is one of the most famous openings in political
    writing.
  quote:
    text: The first man who, having enclosed a piece of ground, bethought himself of saying This is mine, and found people simple enough
      to believe him, was the real founder of civil society.
    author: Jean-Jacques Rousseau
    work: Discourse on the Origin of Inequality, Part II
    tr: G. D. H. Cole
    ed: The Social Contract & Discourses, Everyman's Library, J. M. Dent, London, and E. P. Dutton, New York
    year: 1913
    src: Internet Archive
    url: https://archive.org/details/therepublicofpla00rousuoft
- rung: gb18.american-state-papers
  year: 1776
  when: the Declaration of Independence, 1776
  text: The Declaration of Independence states that all men are created equal and given rights by their Creator. Its signers did not
    end slavery, and that gap was argued over from the start. Later Americans, including those who worked to end slavery and to win
    votes for women, appealed to these same words.
- rung: gb19.tocqueville-democracy-in-america
  year: 1835
  text: 'Visiting the United States, Tocqueville is struck most by the equality of conditions: no nobles, and people in every rank meeting
    as equals. He thinks equality is spreading everywhere. He admires much of it, but warns that a love of equality can sometimes outweigh
    a love of liberty.'
  quote:
    text: Amongst the novel objects that attracted my attention during my stay in the United States, nothing struck me more forcibly
      than the general equality of conditions.
    author: Tocqueville
    work: Democracy in America, Volume 1, Introduction
    tr: Henry Reeve
    ed: Colonial Press, New York (revised edition)
    year: 1899
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/democracyinameri00815gut
- rung: gb19.ibsen-plays
  year: 1879
  work: A Doll's House
  text: In A Doll's House, Nora's husband treats her like a pet. When she finally sees it, she leaves to learn who she is. Ibsen's play
    started arguments across Europe about equality in marriage, and he leaves the audience to judge.
  quote:
    text: I think that before all else I am a human being, just as much as you are—or at least I will try to become one.
    author: Ibsen
    work: A Doll's House, Act III
    tr: William Archer
    ed: Ibsen's Prose Dramas, ed. William Archer (Walter Scott, London)
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/ibsensprosedrama01ibse
- rung: gb20.orwell-animal-farm
  year: 1945
  text: In Orwell's fable, farm animals overthrow their farmer in the name of equality. Little by little the pigs take power, change
    the rules and live like the old masters. Orwell shows how the words of equality can be twisted by those who want power.
young:
- Equal means the same in some important way. You and your friends may not be equally tall or equally fast, but you are equally people,
  and you each deserve to be treated fairly.
- 'In a race, everyone starts at the same line: that''s equal. But should the youngest kid get a head start? People argue about which
  kinds of equality matter most, and the great books argue too.'
talk:
- In what ways are you and your best friend different? In what ways are you equal?
- Is it fair to treat everyone exactly the same? When might it not be?
- The Declaration said all men are created equal, but slavery went on. How did later people use those words?
- In Animal Farm the pigs change the rules. Why is it important that rules apply to everyone?
