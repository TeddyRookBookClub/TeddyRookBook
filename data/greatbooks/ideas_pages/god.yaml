key: god
question: What have the great writers argued and believed about God? Can reason tell us anything about God?
intro: This page reports what each author argued, in their own terms. The authors disagree deeply, and families will have their own
  beliefs; the point here is to understand each view fairly.
stops:
- rung: gbgreeks.plato-timaeus
  year: -360
  text: Plato's Timaeus tells of a good divine maker who shaped the world out of disorder, using eternal patterns as his model. Because
    the maker is good and free of envy, he wanted everything to be as good as possible. Plato offers it as a likely story, not a proof.
  quote:
    text: And being free from jealousy, he desired that all things should be as like himself as they could be.
    author: Plato
    work: Timaeus 29d–e
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. III, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0003
- rung: gbgreeks.aristotle-metaphysics
  year: -340
  text: Aristotle reasons that the eternal motion of the heavens needs a first source that is not itself moved. This unmoved mover is
    pure thought, thinking about itself, and it moves the world the way something loved moves the one who loves it. Aristotle's god
    does not create the world or watch over individuals.
  quote:
    text: The final cause, then, produces motion as being loved, but all other things move by being moved.
    author: Aristotle
    work: Metaphysics XII.7, 1072b
    tr: W. D. Ross
    ed: The Works of Aristotle, vol. VIII, 2nd edition, Clarendon Press
    year: 1928
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0008wdro_h7t3
- rung: gbrome.plotinus-enneads
  year: 260
  text: Plotinus teaches that everything flows from a first principle he calls the One, beyond all description. From it come Mind and
    then Soul, and the soul can turn back and rise toward its source. His thought later shaped both Christian and Islamic writers.
- rung: gbrome.augustine-confessions
  year: 398
  text: Augustine writes the Confessions as a long prayer to God, telling how he searched through pleasure, philosophy and Plotinus
    before coming to Christian faith. For him, God is the creator of all things, closer to us than we are to ourselves. He describes
    God as the one in whom the restless heart finds rest.
- rung: gbmiddle.aquinas-on-god
  year: 1268
  text: Aquinas holds that some truths about God can be shown by reason, and he offers five ways, from motion, causes, things that need
    not exist, degrees of goodness, and the order of nature. Other truths, like the Trinity, he says, are known only by revelation.
    Philosophers have debated his arguments ever since.
  quote:
    text: The existence of God can be proved in five ways.
    author: Thomas Aquinas
    work: Summa Theologica, First Part, Question 2, Article 3
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/1002.htm
- rung: gbren.calvin-institutes
  year: 1559
  text: Calvin begins by saying that nearly all wisdom is knowing God and knowing ourselves, and that each leads to the other. He holds
    that people have a sense of God built in, but that it is clouded, so they need the Bible to know God rightly. His Institutes became
    a founding work of Reformed Protestant churches.
  quote:
    text: 'Our wisdom, in so far as it ought to be deemed true and solid Wisdom, consists almost entirely of two parts: the knowledge
      of God and of ourselves.'
    author: John Calvin
    work: Institutes of the Christian Religion, Book I, Chapter 1
    tr: Henry Beveridge
    ed: Calvin Translation Society, Edinburgh
    year: 1845
    src: Hanover Historical Texts Project
    url: https://history.hanover.edu/courses/excerpts/346cal.html
- rung: gb17.pascal-pensees
  year: 1670
  text: 'Pascal, a great mathematician, doubts that proofs bring people to God. He offers instead his famous wager: if God exists, believing
    gains everything; if not, little is lost. He also says the heart knows things reason cannot, and he wrote as a committed Christian.'
  quote:
    text: Let us weigh the gain and the loss in wagering that God is.
    author: Blaise Pascal
    work: Pensées, 233
    tr: W. F. Trotter
    ed: The Harvard Classics, vol. 48, P. F. Collier & Son
    year: 1910
    src: Christian Classics Ethereal Library
    url: https://ccel.org/ccel/pascal/pensees.iv.html
- rung: gb17.spinoza-ethics
  year: 1677
  text: Spinoza defines God as the one infinite substance of which everything is a part, so that God and Nature are the same. His God
    does not act for purposes or answer prayers in the usual sense. Some readers called him an atheist, others a deeply religious thinker,
    and the argument continues.
- rung: gb19.dostoevsky-brothers-karamazov
  year: 1880
  text: Ivan Karamazov says he cannot accept a world in which innocent children suffer, whatever the final harmony. Dostoevsky, a believer,
    gives Ivan's protest full strength. He answers not with an argument but with the life of the elder Zosima and the gentle love of
    Alyosha.
  quote:
    text: '"It''s not God that I don''t accept, Alyosha, only I most respectfully return Him the ticket." "That''s rebellion," murmured
      Alyosha, looking down.'
    author: Dostoevsky
    work: The Brothers Karamazov, Book V, Chapter IV, "Rebellion"
    tr: Constance Garnett
    ed: William Heinemann, London
    year: 1912
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/thebrotherskaram28054gut
- rung: gb20.barth-word-of-god
  year: 1924
  text: The Swiss theologian Karl Barth argues that the Bible is not mainly human thoughts about God but God speaking to people. Human
    beings, he says, cannot reach God by their own reasoning. Preachers must speak of God, yet cannot do it by their own power, and
    that tension is the heart of his message.
  quote:
    text: It is not the right human thoughts about God which form the content of the Bible, but the right divine thoughts about men.
    author: Karl Barth
    work: The Word of God and the Word of Man, The Strange New World within the Bible
    tr: Douglas Horton
    ed: The Pilgrim Press, Boston
    year: 1928
    src: Internet Archive
    url: https://archive.org/details/wordofgodwordofm00bart_0
young:
- People all over the world, for thousands of years, have asked about God. Many believe God made the world and loves people. Some believe
  in different ways, and some do not believe in God at all.
- The great books are full of these questions. Some writers tried to reason about God, some prayed, and some wrote stories and poems.
  Your family can talk about what you believe, and why other people believe differently. Listening carefully is the first step to understanding.
talk:
- What questions do you have about God?
- Aquinas thought reason could show some things about God. Pascal said the heart knows things reason doesn't. What do you think?
- Why do you think people in every age have asked these questions?
- How can we listen respectfully to someone who believes differently?
