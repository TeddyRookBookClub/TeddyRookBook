# Great Books Ladder: the Great Idea "god", followed through the books (page: /great-books/ideas/god/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
