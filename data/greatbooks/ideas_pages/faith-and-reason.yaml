#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: faith-and-reason
question: How do believing and reasoning fit together? Are they friends, rivals or partners?
intro: Each stop describes an author's own view. Thinkers of faith and thinkers of reason appear side by side, and readers can weigh
  them.
stances:
- key: together
  label: Faith and reason work together
- key: beyond
  label: Faith reaches beyond reason
- key: test
  label: Reason as the test of belief
stops:
- rung: gbrome.augustine-on-christian-doctrine
  year: 397
  stance: together
  text: 'Augustine encourages Christians to learn logic, history and science, since all truth belongs to God. His motto is often summed
    up as ''believe in order to understand'': faith comes first, and then reason explores what is believed.'
  quote:
    text: Let every good and true Christian understand that wherever truth may be found, it belongs to his Master.
    author: Augustine
    work: On Christian Doctrine, Book II, chapter 18
    tr: J. F. Shaw
    ed: A Select Library of the Nicene and Post-Nicene Fathers, vol. II, The Christian Literature Company, Buffalo
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/cityofgodtrbymar0002augu
- rung: gbmiddle.aquinas-on-god
  year: 1268
  stance: together
  text: Aquinas argues that faith and reason can't truly conflict, because both come from God. Reason can prove some things, like God's
    existence, while faith teaches others, like the Trinity, that are above reason but not against it. He used Aristotle's philosophy
    to explain Christian teaching.
- rung: gbren.erasmus-praise-of-folly
  year: 1511
  stance: beyond
  text: Erasmus has Folly mock theologians who split hairs over questions no one can answer. He praises a simple faith and a life like
    Christ's over clever debate. A scholar himself, he wanted learning to serve plain goodness.
- rung: gbren.calvin-institutes
  year: 1559
  stance: beyond
  text: Calvin holds that human reason, damaged by sin, can't find its way to true knowledge of God alone. Scripture, he says, is like
    glasses that let weak eyes see clearly. Reason is a gift for earthly matters, but faith rests on God's word.
  quote:
    text: On the other hand, it is evident that man never attains to a true self-knowledge until he have previously contemplated the
      face of God, and come down after such contemplation to look into himself.
    author: John Calvin
    work: Institutes of the Christian Religion, Book I, Chapter 1
    tr: Henry Beveridge
    ed: Calvin Translation Society, Edinburgh
    year: 1845
    src: Hanover Historical Texts Project
    url: https://history.hanover.edu/courses/excerpts/346cal.html
- rung: gb17.pascal-pensees
  year: 1670
  stance: beyond
  text: Pascal respects reason but says its last step is to see that many things are beyond it. The heart, he says, knows first principles
    and knows God in a way reason cannot prove. Faith is not against reason but goes beyond it.
  quote:
    text: The heart has its reasons, which reason does not know.
    author: Blaise Pascal
    work: Pensées, 277
    tr: W. F. Trotter
    ed: The Harvard Classics, vol. 48, P. F. Collier & Son
    year: 1910
    src: Christian Classics Ethereal Library
    url: https://ccel.org/ccel/pascal/pensees.v.html
- rung: gb18.hume-enquiry
  year: 1748
  stance: test
  text: Hume argues that a wise person matches belief to evidence. In his essay on miracles, he says that the evidence of experience
    against a miracle will usually outweigh any report of one. Believers replied that his argument assumes what it sets out to prove.
- rung: gb19.kierkegaard-fear-and-trembling
  year: 1843
  stance: beyond
  text: Kierkegaard argues that faith is not a conclusion reason reaches but a leap a person makes. Using Abraham's story, he says faith
    goes further than anything ethics or philosophy can explain. He thought his age had made faith too easy by treating it as a matter
    of argument.
- rung: gb20.barth-word-of-god
  year: 1924
  stance: beyond
  text: Barth argues that people do not climb up to God by reasoning; God speaks to them through the Bible. He was reacting against
    theologians who made faith fit the ideas of the day. For him, faith answers God's word rather than human arguments.
  quote:
    text: As ministers we ought to speak of God.
    author: Karl Barth
    work: The Word of God and the Word of Man, The Word of God and the Task of the Ministry (1922)
    tr: Douglas Horton
    ed: The Pilgrim Press, Boston
    year: 1928
    src: Internet Archive
    url: https://archive.org/details/wordofgodwordofm00bart_0
- rung: gb20.whitehead-science-and-the-modern-world
  year: 1925
  stance: together
  text: Whitehead, a mathematician and philosopher, argues that modern science grew from a belief, partly inherited from medieval theology,
    that nature is orderly and understandable. Religion and science, he says, have both changed over time, and their clashes can be
    a chance for each to deepen.
  quote:
    text: My explanation is that the faith in the possibility of science, generated antecedently to the development of modern scientific
      theory, is an unconscious derivative from medieval theology.
    author: Alfred North Whitehead
    work: Science and the Modern World, Chapter I
    tr: ''
    ed: The Macmillan Company, New York
    year: 1925
    src: Internet Archive
    url: https://archive.org/details/scienceandthemod010766mbp
young:
- Faith means trusting and believing, often in God. Reason means thinking things through, step by step. Some people think faith and
  reason are like two wings that help a bird fly. Others think faith goes beyond what reason can show, and some think reason should
  be the judge of what to believe.
- You use both every day. You trust your parents when they say a stove is hot (that's a kind of faith), and you also figure out a puzzle
  by thinking (that's reason).
talk:
- What things do you believe because someone you trust told you?
- Aquinas thought faith and reason can't really disagree. Pascal said the heart has reasons. What do they mean?
- Can a scientist also be a person of faith? Can you think of examples from history?
- How do you decide whom to trust?
