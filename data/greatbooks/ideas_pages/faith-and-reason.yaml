# Great Books Ladder: the Great Idea "faith-and-reason", followed through the books (page: /great-books/ideas/faith-and-reason/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
