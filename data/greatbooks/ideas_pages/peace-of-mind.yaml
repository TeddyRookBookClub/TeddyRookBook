key: peace-of-mind
question: How can a person stay calm and steady when life goes wrong?
stops:
- rung: gbrome.lucretius-on-the-nature-of-things
  year: -55
  text: Lucretius writes his poem to free readers from fear. If we understand that the world is made of atoms moving by natural laws,
    he argues, we will stop fearing angry gods and death. A calm mind comes from knowing how nature works.
- rung: gbrome.epictetus-discourses
  year: 108
  text: Epictetus says we are upset not by things but by our judgments about them. So the key is to sort what is up to us, our choices
    and opinions, from what is not. If someone puts him in chains, he says, they can bind his leg but not his will.
  quote:
    text: Does any man then hinder me from going with smiles and cheerfulness and contentment?
    author: Epictetus
    work: Discourses, Book I, chapter 1
    tr: George Long
    ed: George Bell and Sons, London
    year: 1877
    src: Internet Archive
    url: https://archive.org/details/discoursesofepic00epicrich
- rung: gbrome.marcus-aurelius-meditations
  year: 175
  text: Marcus Aurelius ruled an empire at war, yet he wrote about finding quiet inside himself. People long for a cottage in the country,
    he says, but a person can retreat into their own mind at any moment. There he reminds himself of what is true and returns to work
    calmer.
  quote:
    text: For nowhere, either with more quiet or more freedom from trouble, does a man retire than into his own soul.
    author: Marcus Aurelius
    work: Meditations, Book IV, section 3
    tr: George Long
    ed: The Chesterfield Society, London and New York
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/meditationsofemp00marcuoft
- rung: gbrome.augustine-confessions
  year: 398
  text: Augustine searched for calm in success, friendship and philosophy, but his heart stayed restless. He finds peace, he writes,
    only when he turns to God. For him, a quiet mind is not something we make for ourselves but something we receive.
- rung: gbren.montaigne-essays
  year: 1580
  text: Montaigne retired to a tower full of books to sit with his own thoughts. He found his mind running off like a wild horse, so
    he started writing to watch it. His calm comes from honest self-knowledge, accepting his limits and taking life as it comes.
- rung: gb17.pascal-pensees
  year: 1670
  text: Pascal notices that people rush into games, hunting and busy work to avoid thinking about themselves. Much of our trouble, he
    says, comes from not being able to sit quietly in a room. For Pascal, real peace comes only when we face the big questions, and
    he believed it was found in God.
  quote:
    text: Let us endeavour, then, to think well; this is the principle of morality.
    author: Blaise Pascal
    work: Pensées, 347
    tr: W. F. Trotter
    ed: The Harvard Classics, vol. 48, P. F. Collier & Son
    year: 1910
    src: Christian Classics Ethereal Library
    url: https://ccel.org/ccel/pascal/pensees.vii.html
- rung: gb17.spinoza-ethics
  year: 1677
  text: Spinoza calls it bondage when our emotions run us. The way out, he argues, is to understand the causes of what we feel, because
    a feeling we understand clearly loses its grip. He admits this path is hard but says it can be found.
  quote:
    text: But all things excellent are as difficult as they are rare.
    author: Baruch Spinoza
    work: Ethics, Part V, last note
    tr: R. H. M. Elwes
    ed: The Chief Works of Benedict de Spinoza, vol. II, George Bell & Sons
    year: 1883
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/975
young:
- 'Everyone gets upset sometimes: when a game is lost, a tower falls down or a friend is mean. Peace of mind means being able to calm
  down and think clearly again.'
- 'A Greek teacher named Epictetus had a good trick. Ask: is this in my control? You can''t control the rain on your picnic day, but
  you can choose to play a board game indoors instead. When we stop fighting what we can''t change, we feel calmer.'
talk:
- What helps you calm down when you are upset?
- 'Make two lists: things in your control today, and things that aren''t.'
- Marcus Aurelius says you can retreat into your own mind. What would your quiet place look like?
- Pascal says people stay busy to avoid thinking. Is it hard for you to sit quietly for five minutes? Try it together.
- Is being calm the same as not caring?
