# Great Books Ladder: the Great Idea "poetry", followed through the books (page: /great-books/ideas/poetry/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
