#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: poetry
question: How do poems and stories work? What makes a story good, and why does poetry matter?
stops:
- rung: gbgreeks.homer-iliad
  year: -750
  text: Homer's poems were sung aloud long before they were written down. Bards used repeated phrases, like 'swift-footed Achilles'
    and 'rosy-fingered dawn,' to help them compose as they sang. The poems open by calling on the Muse, the goddess of song.
- rung: gbgreeks.plato-republic-cave
  year: -375
  work: The Republic, Book X
  text: Plato, himself a gifted writer, worries about poetry. Poems copy appearances, not truth, and they stir up feelings that reason
    should rule. He would allow only hymns and praise of good people in his ideal city, while admitting he loves Homer.
- rung: gbgreeks.aristotle-poetics-rhetoric
  year: -335
  text: 'Aristotle answers Plato. Poetry, he says, imitates life in a way that teaches: it shows what could happen, not just what did.
    That makes it more philosophical than history. The most important part of a story is its plot, with a beginning, middle and end.'
  quote:
    text: Hence poetry is something more philosophic and of graver import than history, since its statements are of the nature rather
      of universals, whereas those of history are singulars.
    author: Aristotle
    work: Poetics 9, 1451b
    tr: Ingram Bywater
    ed: The Works of Aristotle, vol. XI, Clarendon Press
    year: 1924
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0011wrhy
- rung: gbrome.virgil-eclogues-georgics
  year: -29
  text: Virgil's early poems are about shepherds singing contests and farmers at work. He took old Greek forms and made them Roman.
    His careful verse became the model of Latin poetry for centuries.
- rung: gbmiddle.dante-inferno
  year: 1310
  text: Dante wrote his great poem not in Latin but in the Italian people spoke, in linked three-line stanzas. He chose Virgil as his
    guide, poet to poet. His choice helped make Italian a language of great literature.
- rung: gbren.shakespeare-sonnets
  year: 1609
  text: A sonnet has fourteen lines with a set rhyme pattern. Shakespeare's sonnets often turn in the last two lines, which sum up or
    surprise. He shows how strict form can make feelings sharper.
  quote:
    text: O, no! it is an ever-fixed mark, That looks on tempests and is never shaken;
    author: William Shakespeare
    work: Sonnet 116
    tr: ''
    ed: Shake-speares Sonnets, London
    year: 1609
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1041
- rung: gb17.milton-paradise-lost
  year: 1667
  text: Milton wrote his epic in blank verse, without rhyme, which he defended as closer to the great ancient poets. Blind by then,
    he composed lines in his head and dictated them. His poem aims to do what Homer and Virgil did, for a Christian story.
- rung: gb20.pirandello-six-characters
  year: 1921
  text: In Pirandello's play, six characters interrupt a rehearsal, looking for an author to finish their story. They insist they are
    more real than the actors. The play asks what a character is and who owns a story.
  quote:
    text: Because a character has really a life of his own, marked with his especial characteristics; for which reason he is always
      “somebody.”
    author: Pirandello
    work: Six Characters in Search of an Author, Act III
    tr: Edward Storer
    ed: Three Plays (E. P. Dutton & Co., New York)
    year: 1922
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/42148
- rung: gb20.eliot-waste-land
  year: 1922
  text: Eliot's Waste Land breaks the old rules. It jumps between voices, languages and quotations from older books, like broken pieces
    of a culture after the First World War. Readers had to learn new ways to read poetry.
  quote:
    text: April is the cruellest month, breeding Lilacs out of the dead land, mixing Memory and desire, stirring Dull roots with spring
      rain.
    author: T. S. Eliot
    work: The Waste Land, I. The Burial of the Dead, lines 1–4
    tr: ''
    ed: Boni and Liveright, New York
    year: 1922
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1321
young:
- 'Poems play with sounds: rhythm, rhyme and repeated words. Stories have characters, a problem and an ending. Aristotle said every
  good story has a beginning, a middle and an end.'
- Long ago, poems were sung out loud, and singers repeated phrases like 'rosy-fingered dawn' to help remember. Try making up a short
  poem with a repeated line, and say it aloud!
talk:
- What is your favorite poem or song? What do you like about its sound?
- Aristotle says poetry shows what could happen. Why might that teach us more than facts?
- Plato worried stories could be bad for us. Do you think some stories are? Why?
- Write a four-line poem together. Rhyme or no rhyme?
- In Pirandello's play, characters look for an author. If you were a character, what story would you want?
