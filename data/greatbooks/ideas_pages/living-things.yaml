key: living-things
question: What makes something alive? How are plants and animals built, and how do they grow?
stops:
- rung: gbgreeks.aristotle-biology
  year: -340
  text: Aristotle was the first great biologist. He sorted hundreds of animals by their parts and ways of life, and noticed that dolphins
    breathe air and feed their young with milk like land mammals. He urged students not to turn away from studying even humble creatures.
  quote:
    text: Every realm of nature is marvellous.
    author: Aristotle
    work: Parts of Animals, Book I, 5
    tr: William Ogle
    ed: Oxford, Clarendon Press
    year: 1912
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle05arisuoft
- rung: gbrome.virgil-eclogues-georgics
  year: -29
  text: 'Virgil''s Georgics is a poem about farming: plowing, vines, cattle and bees. He describes the bee colony with love and wonder,
    as a little city. It mixes real farm knowledge with old beliefs, and praises honest work on the land.'
- rung: gbrome.galen-on-the-natural-faculties
  year: 180
  text: Galen says growth and nutrition are shared by plants and animals, while feeling and voluntary motion belong to animals alone.
    He explains living processes by faculties, powers of attraction, holding, changing and expelling. It was an early attempt at a general
    physiology.
- rung: gb17.harvey-generation-of-animals
  year: 1651
  text: Harvey watches chicks form in the egg and deer embryos develop. He argues that the parts of an animal form gradually, one after
    another, not all at once in miniature. His motto was that all animals come from an egg.
- rung: gb18.kant-critique-of-judgment
  year: 1790
  text: Kant notices that living things are unlike machines. In an organism, each part both serves and is made by the whole, as a tree's
    leaves feed the tree that grows them. We cannot help thinking of living things as having purposes, he says, even when we study them
    as nature.
- rung: gb19.melville-moby-dick
  year: 1851
  text: In the middle of his adventure, Melville's narrator stops to catalog whales, their skeletons, their size and how whalers hunt
    them. Some of it is good natural history and some is out of date even for his time (he insists the whale is a fish). The whale remains
    a wonder beyond full understanding.
- rung: gb19.darwin-origin-of-species
  year: 1859
  text: Darwin argues that all living things are related, changing slowly over many generations. Individuals vary, more are born than
    can survive, and those with helpful traits leave more offspring. He ends by calling the tangled web of life a grand view.
- rung: gb20.schrodinger-what-is-life
  year: 1944
  text: Schrödinger, a physicist, asks how living things keep their order when everything else runs down. He guesses that genes are
    a kind of code written in a special molecule. His little book inspired scientists who later found the structure of DNA.
- rung: gb20.waddington-nature-of-life
  year: 1961
  text: Waddington describes how a single fertilized egg becomes a whole animal with many kinds of cells. Genes must be switched on
    and off at the right times and places. He pictured development as a ball rolling down a landscape of valleys toward different fates.
young:
- Living things grow, eat, breathe and make more of their kind. A rock doesn't do that, but a flower, a frog and you do!
- 'Aristotle studied animals so carefully 2,300 years ago that he noticed dolphins breathe air like we do. Try being a naturalist: watch
  a bird, an ant or a plant for ten minutes and write down everything you see.'
talk:
- What is the difference between a living thing and a machine?
- Aristotle said even small creatures are marvelous. What's a small creature you think is amazing?
- Watch a seed sprout in a wet paper towel. What happens first?
- Why do you think Virgil compared bees to a city?
