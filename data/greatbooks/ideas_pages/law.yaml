key: law
question: Where do laws come from, and why should we obey them? Can a law be wrong?
stops:
- rung: gbgreeks.sophocles-oedipus
  year: -441
  work: Antigone
  text: When King Creon forbids the burial of her brother, Antigone appeals to laws older than any king. Creon stands for the law of
    the city, which keeps order. Sophocles sets the two side by side and lets both suffer for their stubbornness.
  quote:
    text: For their life is not of today or yesterday, but for all time, and no man knows when they were first put forth.
    author: Sophocles
    work: Antigone
    tr: Richard C. Jebb
    ed: Cambridge University Press
    year: 1891
    src: Perseus Digital Library (Perseids)
    url: https://cts.perseids.org/read/greekLit/tlg0011/tlg002/perseus-eng2/448-470
- rung: gbgreeks.plato-laws
  year: -350
  text: In his last dialogue, Plato imagines three old men planning laws for a new city. He suggests each law should begin with a preamble
    that explains its reason, so citizens obey because they are persuaded, not only because they are afraid. Law, for him, should be
    a teacher of good character.
  quote:
    text: Tell me, Strangers, is a God or some man supposed to be the author of your laws?
    author: Plato
    work: Laws I, 624a
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. V, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0005
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle asks whether it is better to be ruled by the best man or by the best laws. He leans toward law, which he calls reason
    without passion, since any human ruler can be swayed by anger or desire. But laws are general, so wise judges are still needed for
    cases the law did not foresee.
- rung: gbmiddle.aquinas-on-happiness-and-law
  year: 1270
  text: 'Aquinas defines a law as a rule of reason for the common good, made by whoever cares for the community, and made known. He
    describes an order of laws: God''s eternal law, the natural law that reason can grasp, and human laws that apply it. Human laws,
    he says, should not try to forbid every vice, only the most serious harms.'
  quote:
    text: it is nothing else than an ordinance of reason for the common good, made by him who has care of the community, and promulgated.
    author: Thomas Aquinas
    work: Summa Theologica, First Part of the Second Part, Question 90, Article 4
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/2090.htm
- rung: gb17.hobbes-leviathan
  year: 1651
  text: 'Hobbes defines law more simply: the command of the sovereign, the power that the people have set over themselves. Where there
    is no common power, he says, there is no law. People obey because the sovereign keeps the peace that protects their lives.'
- rung: gb18.montesquieu-spirit-of-laws
  year: 1748
  text: 'Montesquieu compares the laws of many lands. He argues that good laws must fit the people they serve: their kind of government,
    their climate, trade, religion and customs. This is the spirit of the laws, and he also argues that liberty needs the power to make
    laws kept apart from the power to carry them out and to judge.'
- rung: gb18.american-state-papers
  year: 1787
  when: the Constitution, 1787
  text: The Constitution of the United States is a written law above ordinary laws. It sets up the government, limits its powers and
    gives a way to change it by amendment. It names itself the supreme law of the land, and the people, not a king, are said to establish
    it.
- rung: gb18.kant-moral-philosophy
  year: 1788
  text: 'Kant turns to a law inside each person. A rational being, he says, can give itself the moral law and follow it freely, and
    this self-rule is what makes people worthy of respect. He ends one book by saying two things fill him with awe: the starry sky and
    the moral law within.'
  quote:
    text: 'Two things fill the mind with ever new and increasing admiration and awe, the oftener and the more steadily we reflect on
      them: the starry heavens above and the moral law within.'
    author: Immanuel Kant
    work: Critique of Practical Reason, Conclusion
    tr: Thomas Kingsmill Abbott
    ed: Kant's Critique of Practical Reason and Other Works on the Theory of Ethics, 4th edition, Longmans, Green, London
    year: 1889
    src: Internet Archive
    url: https://archive.org/details/critiquepractic00kantuoft
- rung: gb19.hegel-philosophy-of-right
  year: 1820
  text: Hegel argues that laws, property, the family and the state are freedom made real in the world, not just limits on it. The first
    command of right, he says, is to be a person and respect others as persons. He thinks a people's laws grow out of its history.
  quote:
    text: Be a person and respect others as persons.
    author: Hegel
    work: Philosophy of Right, section 36 (on abstract right)
    tr: S. W. Dyde
    ed: George Bell and Sons, London
    year: 1896
    src: Internet Archive
    url: https://archive.org/details/cu31924014578979
young:
- Laws are rules for a whole country or town, like stopping at red lights or not taking things that aren't yours. They help people live
  together safely.
- But where do they come from? Some writers say good laws follow rules of right and wrong that are true everywhere. Others say a law
  is whatever the government decides. Many say a good law should have a good reason that people can understand, just as a good family
  rule does.
talk:
- What is a rule in your home? What is the reason for it?
- Plato says a law should explain itself. Do you follow rules better when you know why?
- Can a law ever be wrong? What should a person do then?
- Why is it helpful to have laws written down?
- 'Which is better: a very wise ruler or very good laws?'
