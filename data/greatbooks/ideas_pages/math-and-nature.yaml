key: math-and-nature
question: Why does mathematics describe the physical world so well? Is nature written in numbers and shapes?
stops:
- rung: gbgreeks.plato-timaeus
  year: -360
  text: 'Plato imagines the world built by a good maker using mathematical patterns: harmonious ratios for the soul of the world and
    geometric shapes for the elements. Nature is beautiful because it follows mathematical order.'
  quote:
    text: He was good, and the good can never have any jealousy of anything.
    author: Plato
    work: Timaeus 29d–e
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. III, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0003
- rung: gbgreeks.archimedes-works
  year: -250
  text: Archimedes proves the law of the lever and the law of floating bodies as mathematical theorems from a few simple assumptions.
    Physics, in his hands, looks like geometry. He was among the first to do this.
  quote:
    text: Two magnitudes, whether commensurable or incommensurable, balance at distances reciprocally proportional to the magnitudes.
    author: Archimedes
    work: On the Equilibrium of Planes, Book I, Propositions 6 and 7
    tr: Thomas L. Heath
    ed: Cambridge University Press
    year: 1897
    src: Internet Archive
    url: https://archive.org/details/worksofarchimede00arch
- rung: gbrome.ptolemy-almagest
  year: 150
  text: Ptolemy describes the motions of the sun, moon and planets with circles on circles and tables of numbers. Whether his circles
    were real or only a way to calculate, the mathematics predicted the sky. Astronomy was the first science built on math.
- rung: gb17.kepler-harmonies
  year: 1619
  text: 'Kepler searched for the mathematical harmony of the heavens. In The Harmonies of the World he announces his third law: the
    square of a planet''s year is proportional to the cube of its distance from the sun. He also imagined the planets singing chords
    as they moved.'
- rung: gb17.galileo-two-new-sciences
  year: 1638
  text: Galileo believed the book of nature is written in mathematics. He found that a falling body's distance grows as the square of
    the time and that a thrown body follows a parabola. Measuring and calculating replaced arguing about natures.
- rung: gb17.newton-principia
  year: 1687
  text: Newton's book is titled Mathematical Principles of Natural Philosophy. From his laws of motion and gravity he calculates the
    orbits of planets, the tides and the shape of the earth. Nature's whole system follows from a few equations.
  quote:
    text: The alteration of motion is ever proportional to the motive force impress'd; and is made in the direction of the right line
      in which that force is impress'd.
    author: Isaac Newton
    work: The Mathematical Principles of Natural Philosophy, Axioms, or Laws of Motion, Laws I–III
    tr: Andrew Motte
    ed: Benjamin Motte, London
    year: 1729
    src: Internet Archive
    url: https://archive.org/details/bim_eighteenth-century_principia-english-th_newton-sir-isaac_1729_1
- rung: gb20.poincare-science-and-hypothesis
  year: 1902
  text: Poincaré asks how far mathematics in physics is discovered and how far it is chosen. Some principles, he argues, are useful
    conventions, not facts. Mathematics gives physics its language, but experiment decides what the language should say.
- rung: gb20.einstein-relativity
  year: 1916
  text: Einstein uses a geometry of curved space-time, worked out by mathematicians decades earlier for its own sake, to describe gravity.
    It was a striking case of pure mathematics turning out to fit the world.
- rung: gb20.whitehead-science-and-the-modern-world
  year: 1925
  text: Whitehead asks why modern science arose in Europe. He suggests it rested on a deep belief that nature is orderly and can be
    understood, a belief he traces in part to medieval theology. Without that faith in order, he says, scientists' labors would be hopeless.
  quote:
    text: Without this belief the incredible labours of scientists would be without hope.
    author: Alfred North Whitehead
    work: Science and the Modern World, Chapter I
    tr: ''
    ed: The Macmillan Company, New York
    year: 1925
    src: Internet Archive
    url: https://archive.org/details/scienceandthemod010766mbp
young:
- Isn't it amazing that math describes the world? The same numbers that count your toys can tell us when the next eclipse will happen.
- 'Galileo found that a falling ball goes 1 unit in the first second, 3 in the next, then 5, then 7: the odd numbers! Add them up: 1,
  4, 9, 16. Those are square numbers. Nature seems to like patterns.'
talk:
- Where do you see math in nature? (Think of honeycombs, flowers and shells.)
- Why do you think nature follows mathematical rules?
- Kepler imagined the planets making music. Can math and music be connected?
- Can you think of something in nature that math can't describe?
