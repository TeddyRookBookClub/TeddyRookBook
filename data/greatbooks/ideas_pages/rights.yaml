key: rights
question: Do people have rights just by being human? Where do rights come from, and what does government owe them?
stops:
- rung: gbmiddle.aquinas-on-happiness-and-law
  year: 1270
  text: Aquinas does not use the modern language of rights, but he teaches that a natural law, known by reason, binds rulers as well
    as subjects. Human laws that break it lose their force. Later writers built on this idea of a law above rulers when they spoke of
    natural rights.
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes says each person has by nature a right to preserve their own life, by any means. That right can't be fully given away.
    To get peace, people give up their right to all things and accept a sovereign, keeping only the right to defend their own lives.
- rung: gb18.locke-government-and-toleration
  year: 1689
  text: Locke argues that people have natural rights to life, liberty and property before any government exists. Property begins when
    a person mixes their labor with something from nature. Government is formed by consent to protect these rights and loses its claim
    when it attacks them.
  quote:
    text: Though the earth and all inferior creatures be common to all men, yet every man has a "property" in his own "person." This
      nobody has any right to but himself.
    author: John Locke
    work: Second Treatise, ch. V, §27
    tr: ''
    ed: Two Treatises on Civil Government, Morley's Universal Library, 2nd edition, George Routledge and Sons, London
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/twotreatisesonc01filmgoog
- rung: gb18.rousseau-social-contract
  year: 1762
  text: 'Rousseau argues that force can never make a right: to give in to force is a necessity, not a duty. Real rights come from the
    social contract, in which each person joins with all and gains the rights of a citizen. Freedom, he says, can''t be given away.'
- rung: gb18.american-state-papers
  year: 1776
  when: the Declaration, 1776; the Bill of Rights, 1791
  text: The Declaration of Independence names rights to life, liberty and the pursuit of happiness, and says governments exist to secure
    them by the consent of the governed. Fifteen years later the Bill of Rights listed freedoms the new government could not take away,
    such as speech, religion and a fair trial.
- rung: gb19.hegel-philosophy-of-right
  year: 1820
  text: Hegel agrees that persons have rights, starting with property, but he thinks rights only become real inside a family, a society
    and a state with laws. Rights are not just shields against others; they are part of living freely together.
- rung: gb19.mill-on-liberty
  year: 1859
  text: Mill defends freedom of thought, speech and choice of how to live. Interestingly, he does not rest his case on natural rights.
    He argues instead that these freedoms make a society happier and wiser over time.
  quote:
    text: His own good, either physical or moral, is not a sufficient warrant.
    author: Mill
    work: On Liberty, Chapter I
    tr: ''
    ed: John W. Parker and Son, London
    year: 1859
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/onliberty34901gut
young:
- A right is something every person should be allowed to have or do, like being safe, speaking your mind or practicing your religion.
  In the United States, the Bill of Rights lists many of them.
- Rights come with responsibilities. You have a right to speak, and others do too, so you take turns and listen. Your right to play
  ends where it would hurt someone else.
talk:
- What rights do you think every child should have?
- Locke says you own your own work. If you build a sandcastle, is it yours?
- 'Where do rights come from: from nature, from God, from the government or from agreement? What do the writers say?'
- What responsibilities go with the right to speak freely?
