key: medicine
question: How does the body work, and how did healers learn to understand it and help it heal?
stops:
- rung: gbgreeks.hippocrates-works
  year: -400
  text: The Hippocratic writers insisted that diseases have natural causes, even epilepsy, which many called sacred. They watched patients
    carefully, noted the effects of climate, water and diet, and wrote down what they saw. The Oath bound doctors to help the sick and
    do them no harm.
  quote:
    text: 'It is thus with regard to the disease called Sacred: it appears to me to be nowise more divine nor more sacred than other
      diseases, but has a natural cause from which it originates like other affections.'
    author: Hippocrates (Hippocratic Corpus)
    work: On the Sacred Disease
    tr: Francis Adams
    ed: Sydenham Society, London
    year: 1849
    src: Internet Archive
    url: https://archive.org/details/genuineworksofhi02hippuoft
- rung: gbgreeks.aristotle-biology
  year: -340
  text: Aristotle dissected animals and described their organs carefully. He watched a chick develop in the egg day by day and saw the
    tiny heart beating. He thought the heart, not the brain, was the center of feeling, which later anatomists corrected.
  quote:
    text: This point beats and moves as though endowed with life.
    author: Aristotle
    work: History of Animals, Book VI, 3
    tr: D'Arcy Wentworth Thompson
    ed: Oxford, Clarendon Press
    year: 1910
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle04arisuoft
- rung: gbrome.galen-on-the-natural-faculties
  year: 180
  text: Galen, a doctor to gladiators and emperors, did experiments on animals to learn how organs work. By tying off the tubes from
    the kidneys, he showed that urine is made in the kidneys, not the bladder. His writings guided medicine for over a thousand years,
    mistakes and all.
- rung: gbren.montaigne-essays
  year: 1580
  text: Montaigne, who suffered from kidney stones, was skeptical of the doctors of his day, whose remedies often did more harm than
    good. He preferred to let nature take its course and to watch his own body. His doubts show how uncertain medicine still was.
- rung: gb17.harvey-motion-of-the-heart
  year: 1628
  text: Harvey shows that the heart is a pump and that blood circulates around the body, out through the arteries and back through the
    veins. He used dissection, experiments, the valves in veins and simple arithmetic. It overturned Galen's view that blood is made
    and used up.
  quote:
    text: Now this I afterwards found to be true …
    author: William Harvey
    work: On the Motion of the Heart and Blood in Animals, chapter 8
    tr: Robert Willis
    ed: The Sydenham Society, London
    year: 1847
    src: Internet Archive
    url: https://archive.org/details/worksofwilliamha00harviala
- rung: gb17.harvey-generation-of-animals
  year: 1651
  text: Harvey turns to how animals develop. Studying chicks and deer, he argues that all animals begin from an egg of some kind and
    that parts form one after another. He could not see the cell, but he set the questions for later embryology.
  quote:
    text: An egg is the common origin of all animals.
    author: William Harvey
    work: On the Generation of Animals, title of Exercise 62
    tr: Robert Willis
    ed: The Sydenham Society, London
    year: 1847
    src: Internet Archive
    url: https://archive.org/details/worksofwilliamha00harviala
- rung: gb20.freud-interpretation-of-dreams
  year: 1900
  text: Freud, a doctor of the nerves, tried to treat illnesses of the mind by talking with patients about their memories and dreams.
    He started a whole field of talk therapy. Later research rejected many of his theories, but the idea that talking can help some
    troubles of the mind lives on in other forms.
young:
- 'Long ago, people sometimes thought sickness was caused by angry gods. Hippocrates, a Greek doctor, said no: illness has natural causes
  we can study, like bad water or bad food.'
- 'Later, William Harvey discovered that your heart is a pump that sends blood all around your body in a loop. Put two fingers on your
  wrist and feel your pulse: that''s your heart pumping!'
talk:
- Why was it important to say sickness has natural causes?
- Feel your pulse. Can you find it on your neck too?
- The doctors' oath says first do no harm. Why is that a good rule?
- Galen made mistakes that lasted 1,000 years. How do mistakes get corrected in science?
