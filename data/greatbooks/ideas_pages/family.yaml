key: family
question: What is a family for, and what do parents and children owe each other?
stops:
- rung: gbgreeks.homer-odyssey
  year: -725
  text: Odysseus spends ten years trying to get home to his wife Penelope and son Telemachus. Penelope stays loyal, and Telemachus grows
    up looking for his father. When Odysseus finally arrives in disguise, his old dog Argos is the first to know him.
  quote:
    text: As soon as he saw Ulysses standing there, he dropped his ears and wagged his tail, but he could not get close up to his master.
    author: Homer
    work: The Odyssey, Book XVII
    tr: Samuel Butler
    ed: Longmans, Green
    year: 1900
    src: The Internet Classics Archive (MIT)
    url: https://classics.mit.edu/Homer/odyssey.17.xvii.html
- rung: gbgreeks.plato-republic-justice
  year: -375
  text: In his ideal city, Plato proposes that the guardians should have no private families, so they will treat the whole city as their
    family. It is one of his most startling ideas. Even ancient readers found it hard to accept.
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle answers Plato that the family is the first natural community, out of which villages and cities grow. Sharing everything
    would weaken love, he argues, because what belongs to everyone is cared for by no one. A city needs real families.
- rung: gbren.shakespeare-romeo-and-juliet
  year: 1595
  text: Two families in Verona are locked in an old feud. Their children fall in love and marry in secret, and the hatred between the
    houses leads to their deaths. Only then do the parents end the feud, too late.
  quote:
    text: Two households, both alike in dignity, In fair Verona, where we lay our scene, From ancient grudge break to new mutiny, Where
      civil blood makes civil hands unclean.
    author: William Shakespeare
    work: Romeo and Juliet, the Prologue
    tr: ''
    ed: First printed in quarto
    year: 1597
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1112
- rung: gbren.shakespeare-king-lear
  year: 1606
  text: Old King Lear divides his kingdom among the daughters who flatter him most and banishes Cordelia, who loves him truly but will
    not flatter. The flatterers then turn on him. The play is about what children and parents owe each other, and about forgiveness
    that comes almost too late.
  quote:
    text: How sharper than a serpent's tooth it is To have a thankless child!
    author: William Shakespeare
    work: King Lear, Act I, scene 4 (Lear, of Goneril)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1532
- rung: gb19.hegel-philosophy-of-right
  year: 1820
  text: Hegel sees the family as the first place where people live in unity through love. Children are raised there to become free,
    independent adults. Then they leave to form families of their own.
- rung: gb19.tolstoy-war-and-peace
  year: 1869
  text: Tolstoy follows several families through war and peace, above all the lively Rostovs. Their love, quarrels, losses and new marriages
    carry the story. In the end the novel finds much of life's meaning in family and home.
- rung: gb19.ibsen-plays
  year: 1879
  work: A Doll's House
  text: 'In A Doll''s House, a family that looks happy rests on secrets and on a wife treated as a child. Ibsen asks what a marriage
    should be: a partnership of equals or something else. Many audiences of his day were shocked by the ending.'
  quote:
    text: Before all else you are a wife and a mother.
    author: Ibsen
    work: A Doll's House, Act III
    tr: William Archer
    ed: Ibsen's Prose Dramas, ed. William Archer (Walter Scott, London)
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/ibsensprosedrama01ibse
- rung: gb19.dostoevsky-brothers-karamazov
  year: 1880
  text: Three very different brothers, a passionate soldier, a brilliant skeptic and a gentle novice, have a selfish father. Dostoevsky
    asks what we owe a parent who has failed us, and what brothers owe one another. Through Alyosha, he suggests that love and good
    memories of childhood can save a person.
young:
- A family is the people who take care of you and love you. Families come in many shapes. They give us food and a home, but also love,
  stories and someone to come home to.
- In the great stories, families quarrel, forgive and help each other. Odysseus spent ten years trying to get back to his family. Even
  his old dog was waiting for him!
talk:
- What makes your family special?
- What do parents owe children? What do children owe parents?
- Why do you think Cordelia wouldn't flatter her father?
- Romeo and Juliet's families were fighting. How can families end a quarrel?
- What is a family tradition you love?
