key: pride
question: Is the wish to be great a good thing or a danger? When does ambition lift a person up, and when does pride bring them down?
stops:
- rung: gbgreeks.homer-iliad
  year: -750
  text: The Iliad begins with wounded pride. King Agamemnon takes Achilles' prize, and Achilles, insulted, refuses to fight, so many
    of his friends die. Homer shows honor as a real good worth wanting, and pride as a force that can ruin the very people who prize
    honor most.
  quote:
    text: Sing, O goddess, the anger of Achilles son of Peleus, that brought countless ills upon the Achaeans.
    author: Homer
    work: The Iliad, Book I
    tr: Samuel Butler
    ed: Longmans, Green
    year: 1898
    src: The Internet Classics Archive (MIT)
    url: https://classics.mit.edu/Homer/iliad.1.i.html
- rung: gbgreeks.sophocles-oedipus
  year: -429
  work: Oedipus the King
  text: Oedipus saved Thebes by solving the Sphinx's riddle, and he trusts his own cleverness completely. He rushes to find a murderer
    and angrily rejects warnings, only to learn the truth about himself. Sophocles ends with a warning about great fortune.
  quote:
    text: What citizen did not gaze on his fortune with envy?
    author: Sophocles
    work: Oedipus the King
    tr: Richard C. Jebb
    ed: Cambridge University Press
    year: 1887
    src: Perseus Digital Library (Perseids)
    url: https://cts.perseids.org/read/greekLit/tlg0011/tlg004/perseus-eng2/1523-1530
- rung: gbrome.plutarch-roman-lives
  year: 110
  text: Plutarch's Julius Caesar is a man of huge ambition and talent. Passing a poor village, Caesar jokes that he would rather be
    first there than second in Rome. Plutarch admires his gifts but shows how his drive for first place helped bring civil war and his
    own murder.
  quote:
    text: To which Cæsar made answer seriously, “For my part, I had rather be the first man among these fellows, than the second man
      in Rome.”
    author: Plutarch
    work: Life of Caesar, chapter 11
    tr: John Dryden and others, revised by Arthur Hugh Clough
    ed: The Harvard Classics, vol. 12, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/harvardclassicsp0000char_g1f9
- rung: gbrome.augustine-city-of-god
  year: 420
  text: Augustine sees pride, the love of self above God, as the root of the earthly city. Rome's love of glory, he grants, produced
    real achievements. But he holds that humility, not glory, is the way to the heavenly city.
  quote:
    text: 'Accordingly, two cities have been formed by two loves: the earthly by the love of self, even to the contempt of God; the
      heavenly by the love of God, even to the contempt of self.'
    author: Augustine
    work: The City of God, Book XIV, chapter 28
    tr: Marcus Dods
    ed: A Select Library of the Nicene and Post-Nicene Fathers, vol. II, The Christian Literature Company, Buffalo
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/cityofgodtrbymar0002augu
- rung: gbmiddle.dante-purgatorio
  year: 1312
  text: On the first terrace of Dante's mountain of Purgatory, the proud walk bent under heavy stones, learning humility. Dante meets
    a famous artist of painted books who admits that his fame has already passed to another. Dante, aware of his own pride as a poet,
    walks bent alongside them for a while.
- rung: gbren.shakespeare-macbeth
  year: 1606
  text: Macbeth is a brave soldier until witches tell him he will be king. His ambition, urged on by his wife, leads him to murder,
    and one crime leads to another. He admits that nothing drives him but ambition itself.
  quote:
    text: I have no spur To prick the sides of my intent, but only Vaulting ambition, which o'erleaps itself And falls on th' other—
    author: William Shakespeare
    work: Macbeth, Act I, scene 7 (Macbeth)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1533
- rung: gb17.milton-paradise-lost
  year: 1667
  text: Milton's Satan refuses to bow to God's Son and leads a rebellion in heaven. Cast out, he still insists he can make his own heaven
    by force of mind. Milton gives Satan grand speeches, so readers feel the pull of pride, and then shows where it leads.
  quote:
    text: The mind is its own place, and in itself Can make a Heaven of Hell, a Hell of Heaven.
    author: John Milton
    work: Paradise Lost, Book I, lines 254–255
    tr: ''
    ed: 2nd edition, S. Simmons, London; Project Gutenberg text
    year: 1674
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/26
- rung: gb19.melville-moby-dick
  year: 1851
  text: Captain Ahab lost his leg to the white whale and wants revenge more than anything. He will not turn back, even when Starbuck
    begs him to think of their families. His proud will drives the whole crew toward disaster.
- rung: gb20.fitzgerald-great-gatsby
  year: 1925
  text: Jay Gatsby rises from a poor farm boy to a rich man with a mansion, all to win back the woman he loves. His dream is huge and
    hopeful, but it rests on wealth, show and a past he cannot bring back. Fitzgerald leaves readers torn between admiring Gatsby and
    pitying him.
young:
- It is good to want to do great things, like win a race, write a book or help people. That wish is called ambition. Being proud of
  hard work you did well is good too.
- But pride can turn bad when it makes us think we are better than others or that we can never be wrong. In many great stories, a hero's
  bad pride makes them stop listening, and that leads to a fall. Think of someone who brags so much that they stop practicing and lose
  the game.
talk:
- What is the difference between being proud of your work and being too proud?
- Macbeth and Ahab would not listen to warnings. Why is it hard to listen when we're proud?
- Caesar wanted to be first. Is it bad to want to be the best?
- Can you think of a story where someone learned humility?
- Milton makes Satan sound impressive. Why might a writer make a bad character sound grand?
