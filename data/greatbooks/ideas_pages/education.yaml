key: education
question: What is education for, and how do people really learn?
stops:
- rung: gbgreeks.plato-meno
  year: -385
  text: Socrates asks an enslaved boy questions about a square, without telling him the answer. Step by step the boy discovers how to
    double the square's area. Socrates says learning is drawing out what is already in the soul, and Plato calls it recollection.
- rung: gbgreeks.plato-republic-cave
  year: -375
  text: Plato says education is not putting sight into blind eyes but turning the whole person toward the light. He lays out years of
    study, from music and gymnastics to mathematics and philosophy. The goal is people who can see the good and rule wisely.
- rung: gbrome.augustine-on-christian-doctrine
  year: 397
  text: 'Augustine was a teacher of speaking before he became a bishop. He advises Christian teachers to use the skills of good speakers:
    to teach clearly, to delight so listeners keep listening, and to move them to act. He also tells students to learn useful arts and
    sciences wherever they are found.'
  quote:
    text: “To teach is a necessity, to delight is a beauty, to persuade is a triumph.”
    author: Augustine
    work: On Christian Doctrine, Book IV, chapter 12
    tr: J. F. Shaw
    ed: A Select Library of the Nicene and Post-Nicene Fathers, vol. II, The Christian Literature Company, Buffalo
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/cityofgodtrbymar0002augu
- rung: gbren.rabelais-gargantua
  year: 1534
  text: Rabelais mocks old-fashioned schooling, where the giant Gargantua memorizes books backward and learns nothing. His new tutor
    fills the day with reading, talks on walks, games, music, science and looking at the stars. It is comedy, but it carries a real
    hope for a fuller education.
- rung: gbren.montaigne-essays
  year: 1580
  text: Montaigne says a child's head should be well made rather than well filled. A good teacher lets the student judge, question and
    put lessons into practice. Students should digest what they learn the way bees turn flowers into their own honey.
  quote:
    text: Bees cull their several sweets from this flower and that blossom, here and there where they find them, but themselves afterward
      make the honey, which is all and purely their own, and no more thyme and marjoram ...
    author: Montaigne
    work: Essays, Book I, Chapter 25, "Of the Education of Children"
    tr: Charles Cotton, revised by William Carew Hazlitt
    ed: Reeves and Turner, London
    year: 1877
    src: HyperEssays
    url: https://hyperessays.net/essays/on-the-education-of-children/
- rung: gb17.bacon-advancement-of-learning
  year: 1605
  text: Bacon defends learning against those who say it makes people proud or useless. He surveys all the branches of knowledge to show
    what is known and what still needs work. Learning, he argues, should serve both the mind and the good of all.
- rung: gb19.james-principles-of-psychology
  year: 1890
  text: William James, who taught teachers as well as students, explains how attention and habit work. You can't learn what you don't
    attend to, and attention wanders. Good teaching connects new things to what the student already cares about.
  quote:
    text: Every one knows what attention is.
    author: William James
    work: The Principles of Psychology, Chapter XI (Attention)
    tr: ''
    ed: Henry Holt and Company, New York
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/bub_gb_JLcAAAAAMAAJ
- rung: gb20.joyce-portrait-of-the-artist
  year: 1916
  text: Joyce follows Stephen Dedalus from a small boy at school to a young man choosing his own path. His strict schooling gives him
    great learning, and he ends by setting out to shape his life as an artist. The novel's style grows up as Stephen does.
- rung: gb20.dewey-experience-and-education
  year: 1938
  text: John Dewey, a leader of new kinds of schools, warns against both old drill and careless freedom. Real education, he says, comes
    from experiences that lead to further growth, chosen and guided by a thoughtful teacher. Learning by doing must still be learning.
young:
- Education means learning. You learn at school, but also at home, outside, from books and by trying things yourself.
- 'Socrates taught by asking questions instead of giving answers, so his students figured things out for themselves. Montaigne said
  learning should be like bees making honey: you gather from many flowers and make something that''s your own. Try teaching someone
  a game by only asking questions!'
talk:
- What is the best thing you've ever learned? How did you learn it?
- Socrates taught by asking questions. Is that a good way to learn? Why?
- Montaigne says a well-made head is better than a full one. What do you think he meant?
- What makes a teacher great?
- What do you want to learn next?
