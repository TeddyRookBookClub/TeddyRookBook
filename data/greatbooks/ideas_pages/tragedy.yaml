key: tragedy
question: Why do people watch stories of great people brought low? What can tragedy teach?
stops:
- rung: gbgreeks.aeschylus-oresteia
  year: -458
  text: Aeschylus shows a family caught in a chain of crimes and revenge. The chorus sings that Zeus has made it a law that we learn
    through suffering. Tragedy, for him, is how wisdom is won.
  quote:
    text: Zeus, who sets mortals on the path to understanding, Zeus, who has established as a fixed law that wisdom comes by suffering.
    author: Aeschylus
    work: Agamemnon
    tr: Herbert Weir Smyth
    ed: Loeb Classical Library, Heinemann and G. P. Putnam's Sons
    year: 1926
    src: Perseus Digital Library (Perseids)
    url: https://cts.perseids.org/read/greekLit/tlg0085/tlg005/perseus-eng3/175-240
- rung: gbgreeks.sophocles-oedipus
  year: -429
  work: Oedipus the King
  text: Oedipus, a good and clever king, sets out to find who brought a plague on his city, and discovers it was himself, without knowing
    it. Sophocles shows how a person can be great and still be ruined. The ending warns against calling anyone happy too soon.
  quote:
    text: Therefore, while our eyes wait to see the final destined day, we must call no mortal happy until he has crossed life’s border
      free from pain.
    author: Sophocles
    work: Oedipus the King
    tr: Richard C. Jebb
    ed: Cambridge University Press
    year: 1887
    src: Perseus Digital Library (Perseids)
    url: https://cts.perseids.org/read/greekLit/tlg0011/tlg004/perseus-eng2/1523-1530
- rung: gbgreeks.euripides-plays
  year: -415
  text: Euripides puts ordinary feelings and suffering, especially of women and the defeated, at the center of tragedy. His characters
    argue fiercely and are torn by passion. Aristotle later called him the most tragic of the poets.
- rung: gbgreeks.aristotle-poetics-rhetoric
  year: -335
  text: Aristotle studies how tragedy works. The best tragedy shows a good but imperfect person falling through some error, with a reversal
    and a moment of recognition. It stirs pity and fear and leaves the audience cleansed, a word whose meaning critics still debate.
  quote:
    text: Now a whole is that which has beginning, middle, and end.
    author: Aristotle
    work: Poetics 7, 1450b
    tr: Ingram Bywater
    ed: The Works of Aristotle, vol. XI, Clarendon Press
    year: 1924
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0011wrhy
- rung: gbmiddle.chaucer-troilus
  year: 1385
  text: Chaucer tells of Troilus, a Trojan prince, who loves Criseyde and loses her when she is sent to the Greek camp. He calls his
    poem a tragedy, a fall from happiness to misery. At the end, Troilus looks down from the heavens and laughs at how small earthly
    troubles seem.
- rung: gbren.shakespeare-othello
  year: 1604
  text: Othello, a noble general, is tricked by his trusted officer Iago into believing his loving wife is unfaithful. Jealousy destroys
    him. Shakespeare makes the audience watch, knowing the truth, as a good man is ruined by a lie.
  quote:
    text: It is the green-ey'd monster which doth mock The meat it feeds on.
    author: William Shakespeare
    work: Othello, Act III, scene 3 (Iago)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1531
- rung: gbren.shakespeare-king-lear
  year: 1606
  text: King Lear gives away his kingdom to the daughters who flatter him and loses everything. Out in a storm, he learns humility and
    compassion for the poor. Many think it the greatest and darkest of tragedies.
- rung: gb17.racine-phaedra
  year: 1677
  text: Racine's Phaedra is torn by a love she knows is wrong and cannot master. Written in elegant verse that follows strict rules,
    the play shows a person destroyed by a passion she fights against. Racine based it on a play by Euripides.
  quote:
    text: Strength fails me, and I needs must rest awhile.
    author: Jean Racine
    work: Phaedra, Act I, Scene III
    tr: Robert Bruce Boswell
    ed: The Dramatic Works of Jean Racine, George Bell & Sons (Bohn's Library)
    year: 1890
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1977
- rung: gb20.oneill-mourning-becomes-electra
  year: 1931
  text: O'Neill sets Aeschylus' story of a cursed family in New England after the Civil War. Instead of gods and Furies, the family
    is driven by hidden feelings and the past. It shows how the old tragic shapes still speak to modern audiences.
young:
- A tragedy is a sad story where something goes badly wrong, often for a good person. Why would anyone want to watch that? Because tragedies
  help us feel for others and learn from their mistakes.
- In many tragedies the hero has one big flaw, like pride, jealousy or not listening. Think of a story you know that has a sad ending.
  What could the character have done differently?
talk:
- Why do people like sad stories?
- Aeschylus says we learn through suffering. Have you ever learned from something hard?
- Othello believed a lie. How can we avoid being fooled?
- Is a tragedy's hero to blame for what happens, or is it bad luck?
