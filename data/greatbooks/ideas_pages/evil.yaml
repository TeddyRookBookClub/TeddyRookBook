key: evil
question: Why is there evil and suffering in the world? Where does wrongdoing come from?
stops:
- rung: gbgreeks.plato-gorgias-protagoras
  year: -390
  work: Gorgias
  text: Socrates argues that doing wrong is worse than suffering it, because it damages the wrongdoer's own soul. He also holds that
    no one does wrong willingly; evil comes from ignorance of what is truly good. His listeners find this hard to believe.
- rung: gbrome.augustine-city-of-god
  year: 420
  text: Augustine argues that evil is not a thing God made but the lack or twisting of something good, like sickness in a body. Moral
    evil comes from free wills turning away from God toward lesser goods. God, he says, can bring good even out of evil.
- rung: gbmiddle.aquinas-on-god
  year: 1268
  text: Aquinas faces the objection that if God is all good and all powerful, there should be no evil. He answers, following Augustine,
    that God permits evil only because he can bring a greater good from it.
  quote:
    text: Since God is the highest good, He would not allow any evil to exist in His works, unless His omnipotence and goodness were
      such as to bring good even out of evil.
    author: Thomas Aquinas
    work: Summa Theologica, First Part, Question 2, Article 3, Reply to Objection 1 (quoting Augustine)
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/1002.htm
- rung: gbmiddle.dante-inferno
  year: 1310
  text: Dante's Hell is arranged by kinds of wrongdoing, from weakness to violence to fraud, which he thought worst because it misuses
    reason. Each punishment fits the sin. The journey through Hell is the first stage of a pilgrim's return to the good.
- rung: gbren.shakespeare-macbeth
  year: 1606
  text: Macbeth shows evil growing in a good man, step by step. The witches tempt him, his wife urges him, but he chooses. Once he starts,
    each crime leads to the next, until his life seems to him to mean nothing.
  quote:
    text: 'Fair is foul, and foul is fair:'
    author: William Shakespeare
    work: Macbeth, Act I, scene 1 (the witches)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1533
- rung: gb17.milton-paradise-lost
  year: 1667
  text: Milton tells of Satan's rebellion and the fall of Adam and Eve. He sets out to show that God is just in allowing evil, because
    creatures made free must be able to choose wrongly. Many readers find Satan the most vivid character, which has fueled centuries
    of argument.
  quote:
    text: That, to the height of this great argument, I may assert Eternal Providence, And justify the ways of God to men.
    author: John Milton
    work: Paradise Lost, Book I, lines 24–26
    tr: ''
    ed: 2nd edition, S. Simmons, London; Project Gutenberg text
    year: 1674
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/26
- rung: gb18.voltaire-candide
  year: 1759
  text: 'After a great earthquake destroyed Lisbon in 1755, Voltaire wrote Candide to mock the claim that this is the best of all possible
    worlds. His characters suffer one disaster after another while Dr. Pangloss explains it is all for the best. Voltaire''s answer
    is practical: stop theorizing and tend your garden.'
  quote:
    text: He proved admirably that there is no effect without a cause, and that, in this best of all possible worlds, the Baron's castle
      was the most magnificent of castles, and his lady the best of all possible Baronesses.
    author: Voltaire
    work: Candide, ch. I
    tr: anonymous translator
    ed: Candide, The Modern Library, Boni and Liveright, New York
    year: 1918
    src: Internet Archive
    url: https://archive.org/details/candide19942gut
- rung: gb19.goethe-faust
  year: 1808
  text: Goethe's devil, Mephistopheles, calls himself part of the power that always wants evil and always ends up doing good. Faust
    makes a bargain with him, and wrong follows. Goethe suggests that striving and love can still win out over evil.
  quote:
    text: Part of that Power, not understood, Which always wills the Bad, and always works the Good.
    author: Goethe
    work: Faust, Part One, the Study
    tr: Bayard Taylor
    ed: Houghton, Mifflin and Company, Boston (1882 printing)
    year: 1870
    src: Internet Archive
    url: https://archive.org/details/faustatragedy02taylgoog
- rung: gb19.dostoevsky-brothers-karamazov
  year: 1880
  text: Ivan Karamazov lists true stories of cruelty to children and says no future harmony could justify them. It is one of the strongest
    statements of the problem of evil ever written. Dostoevsky, a Christian, answers through the elder Zosima's teaching of active,
    forgiving love.
- rung: gb20.conrad-heart-of-darkness
  year: 1899
  text: Marlow travels up an African river to find Kurtz, a European trader who has given in to greed and power. Conrad suggests that
    the darkness lies not in a place but in the human heart, and in the greed of the empire Marlow serves. The story has mature themes,
    best for older readers.
young:
- 'Evil means something very bad, like being cruel or hurting people on purpose. Suffering means being hurt, sad or sick. People have
  always asked: why do bad things happen?'
- 'Some writers say people choose wrong when they forget what is truly good. Others say suffering can lead to something good, the way
  a hard time can make us stronger or kinder. Voltaire said: stop arguing and help make the world better, like tending a garden.'
talk:
- Why do you think people sometimes choose to do wrong?
- Socrates says doing wrong hurts the wrongdoer most. How could that be?
- Macbeth's first wrong choice led to more. Why does one bad choice make the next easier?
- Voltaire says 'tend your garden.' What could you do to make things better around you?
- Can something good ever come from something bad? Share an example.
