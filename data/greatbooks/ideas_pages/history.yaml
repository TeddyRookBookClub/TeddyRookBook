key: history
question: How do we find out what happened in the past, and why? Can history teach us anything?
stops:
- rung: gbgreeks.herodotus-histories
  year: -430
  text: Herodotus is called the father of history. His word for his work, historiē, means inquiry. He traveled, asked questions and
    told what different peoples said, sometimes adding that he didn't believe a story himself. He wanted great deeds not to be forgotten.
- rung: gbgreeks.thucydides-peloponnesian-war
  year: -411
  text: Thucydides tried to be more exact than Herodotus. He checked eyewitness accounts against each other and left out stories he
    thought were fables. He wrote, he said, a possession for all time, hoping it would help future readers understand events like these.
- rung: gbrome.plutarch-greek-lives
  year: 110
  text: Plutarch says he writes lives, not histories. A small saying or a joke may show character better than a great battle. History,
    for him, is a gallery of examples to learn from.
  quote:
    text: It must be borne in mind that my design is not to write histories, but lives.
    author: Plutarch
    work: Life of Alexander, chapter 1
    tr: John Dryden and others, revised by Arthur Hugh Clough
    ed: Everyman’s Library, J. M. Dent, vol. II
    year: 1910
    src: Internet Archive
    url: https://archive.org/details/livesdrydenpluta02plutuoft
- rung: gbrome.tacitus-annals-histories
  year: 110
  text: Tacitus promises to write without anger or bias, though he lived under the emperors he describes. He shows how fear bent the
    truth and how a few honest people held to their principles. His sharp, short sentences are famous.
  quote:
    text: Hence my purpose is to relate a few facts about Augustus—more particularly his last acts, then the reign of Tiberius, and
      all which follows, without either bitterness or partiality, from any motives to which I am far removed.
    author: Tacitus
    work: Annals, Book I, chapter 1
    tr: Alfred John Church and William Jackson Brodribb
    ed: Macmillan and Co.
    year: 1884
    src: Internet Archive
    url: https://archive.org/details/annalstranslated00taci
- rung: gbrome.augustine-city-of-god
  year: 420
  text: Augustine reads all of history as the story of two cities, the earthly and the heavenly, mixed together until the end of time.
    History, for him, has a direction and a meaning given by God. It was one of the first full philosophies of history.
- rung: gb18.gibbon-decline-and-fall-1
  year: 1776
  text: 'Gibbon writes the history of Rome''s long fall, based on careful reading of ancient sources. He blames many causes: overgrown
    size, armies that made emperors, and, controversially, changes in religion. His elegant style made history a great work of literature.'
  quote:
    text: But the decline of Rome was the natural and inevitable effect of immoderate greatness.
    author: Edward Gibbon
    work: General Observations on the Fall of the Roman Empire in the West (after ch. XXXVIII)
    tr: ''
    ed: The History of the Decline and Fall of the Roman Empire, with notes by H. H. Milman (Project Gutenberg text)
    year: 1781
    src: Internet Archive
    url: https://archive.org/details/historyofthedecl00892gut
- rung: gb19.hegel-philosophy-of-history
  year: 1837
  text: Hegel argues that history is not random but the unfolding of freedom through the rise and fall of peoples. Yet he also says
    peoples and governments rarely learn anything from history. Each age faces its own situation.
  quote:
    text: But what experience and history teach is this,—that peoples and governments never have learned anything from history, or acted
      on principles deduced from it.
    author: Hegel
    work: Lectures on the Philosophy of History, Introduction
    tr: J. Sibree
    ed: Bohn's Philosophical Library, London (1884 printing)
    year: 1857
    src: Internet Archive
    url: https://archive.org/details/lecturesonphilos00hege_0
- rung: gb19.marx-engels-manifesto
  year: 1848
  text: Marx and Engels read history as a series of struggles between economic classes, each era shaped by how people produce goods.
    Their view has influenced many historians, and many others have challenged it.
- rung: gb19.tolstoy-war-and-peace
  year: 1869
  text: Tolstoy breaks off his novel to argue with historians. They say great men make history, he complains, but history comes from
    the actions of countless ordinary people. No single cause can explain a war.
- rung: gb20.huizinga-waning-of-the-middle-ages
  year: 1919
  text: 'Huizinga tries to recover how people of the late Middle Ages felt: their colors, sounds, ceremonies and moods. History, for
    him, includes the feel of an age, not just its wars and kings.'
  quote:
    text: To the world when it was half a thousand years younger, the outlines of all things seemed more clearly marked than to us.
    author: Johan Huizinga
    work: The Waning of the Middle Ages, Chapter I
    tr: F. Hopman
    ed: Edward Arnold, London
    year: 1924
    src: Internet Archive (1924 edition)
    url: https://archive.org/details/in.ernet.dli.2015.60030
young:
- 'History is the story of what happened in the past. Historians are like detectives: they look for clues, like old letters, buildings
  and objects, and ask people what they remember.'
- 'Not every story about the past is true, so historians check their clues carefully. Try being a historian: ask a grandparent about
  when they were your age, and write down what they say.'
talk:
- Why is it important to remember the past?
- Herodotus wrote down stories even when he wasn't sure they were true. Was that a good idea?
- Can history teach us lessons? Hegel had doubts. What do you think?
- Tolstoy thought ordinary people shape history. How do you shape your family's history?
- What clues would a future historian find about your life?
