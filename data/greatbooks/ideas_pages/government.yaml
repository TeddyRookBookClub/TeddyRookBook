key: government
question: 'What is the best kind of government: rule by one, by a few, or by the many? And what is government for?'
stops:
- rung: gbgreeks.herodotus-histories
  year: -430
  text: Herodotus tells of three Persian nobles debating how to rule their empire. One praises rule by the people, one by the best few,
    and one by a single king, and the king's side wins. It is one of the earliest arguments in writing comparing kinds of government.
- rung: gbgreeks.plato-republic-cave
  year: -375
  text: Plato argues that a city will be well ruled only when those who love wisdom rule, the famous philosopher-kings. He ranks other
    kinds of government from best to worst and describes how each can slide into the next. He was deeply wary of democracy, which he
    saw as easily swayed by flatterers.
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle studies many real constitutions. He sorts governments by who rules, one, few or many, and whether they rule for the
    common good or for themselves. The best practical form, he thinks, is a mixed one with a strong middle class.
  quote:
    text: Hence it is evident that the state is a creation of nature, and that man is by nature a political animal.
    author: Aristotle
    work: Politics I.2, 1253a
    tr: Benjamin Jowett
    ed: The Works of Aristotle, vol. X, Clarendon Press
    year: 1921
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0010wdro
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes says government exists to keep the peace and save people from a war of all against all. Any form can do this if its power
    is complete, but he thought a single monarch was most likely to be steady. For him, the alternative to strong government is chaos.
- rung: gb18.locke-government-and-toleration
  year: 1689
  text: Locke answers that government is set up by the consent of the people to protect their rights. Its power is held in trust. If
    a government breaks that trust and tries to rule without law, he argues, the people may set up a new one.
- rung: gb18.montesquieu-spirit-of-laws
  year: 1748
  text: Montesquieu sorts governments into republics, monarchies and despotisms, each with its own spirit. A republic depends on its
    citizens' virtue, a monarchy on honor and a despotism on fear. He admired England for dividing power among different bodies.
- rung: gb18.federalist-papers
  year: 1788
  text: The authors of The Federalist argue for the new U.S. Constitution. Madison says a large republic, where many groups check each
    other and the people choose representatives, can guard against any one faction taking over. Hamilton argues for a strong, energetic
    president and independent courts.
- rung: gb19.tocqueville-democracy-in-america
  year: 1835
  text: Tocqueville studies American democracy at first hand. He praises its town meetings, local self-government and many associations.
    He also warns of a 'tyranny of the majority' and of people becoming so private that they leave public life to a distant government.
- rung: gb19.mill-utilitarianism
  year: 1861
  work: Considerations on Representative Government
  text: Mill argues that the best government is representative, with the people choosing those who make laws. It is best, he says, because
    it protects people's interests and also makes citizens more active and thoughtful. He also defended giving votes to women, which
    was unusual in his time.
young:
- A government is the group of people who make and carry out rules for a town or country. It can be one king or queen, a small group,
  or many people who vote.
- Think of your class picking a game for recess. The teacher could decide, a few kids could decide, or everyone could vote. Each way
  has good and bad sides. The great books have argued about these choices for over two thousand years.
talk:
- What is government for? Make a list together.
- If your family were a country, what kind of government would it be?
- Plato wanted the wisest people to rule. Aristotle liked a mix. Which do you think works better, and why?
- Why might a big group of people make better choices than one person? Why might it make worse ones?
- What did Tocqueville admire about American towns?
