key: facing-death
question: How should we think about death? Should we fear it, and how does it change the way we live?
stops:
- rung: gbgreeks.homer-iliad
  year: -750
  text: Achilles knows he can have a long quiet life at home or a short life with lasting glory. He chooses glory. Homer shows the warriors
    facing death with courage but also with grief, and the poem ends with two enemies, Achilles and old King Priam, weeping together
    over their losses.
- rung: gbgreeks.plato-phaedo
  year: -380
  text: On the last day of his life, Socrates talks calmly with his friends about the soul. He argues that the soul lives on after death,
    and that philosophy, which turns the mind from the body to the truth, is a lifelong practice for dying. He dies peacefully, and
    Plato calls him the wisest and best man he knew.
  quote:
    text: And the true philosophers, Simmias, are always occupied in the practice of dying, wherefore also to them least of all men
      is death terrible.
    author: Plato
    work: Phaedo 67e
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. II, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0002
- rung: gbrome.lucretius-on-the-nature-of-things
  year: -55
  text: Lucretius gives the opposite reason not to fear death. Following Epicurus, he teaches that the soul is made of atoms that scatter
    when we die, so there is no one left to suffer. We did not mind the ages before we were born, he says, so we need not mind the ages
    after.
- rung: gbrome.marcus-aurelius-meditations
  year: 175
  text: Marcus Aurelius reminds himself that death is a natural change, like ripening or growing old. Everything passes, even the famous.
    So he tries to live each day well, as if it might be his last, without fear or complaint.
- rung: gbren.montaigne-essays
  year: 1580
  text: 'Montaigne first writes that to do philosophy is to learn how to die, and he tries to keep death in mind. Later, after a bad
    fall from his horse that nearly killed him, he relaxes: nature will teach us how to die when the time comes. What matters is to
    live well now.'
- rung: gbren.shakespeare-hamlet
  year: 1600
  text: 'Hamlet thinks hard about death: about the skull of a jester he knew as a boy, and about what may come after. By the end he
    is calmer, saying that readiness is all. Shakespeare gives no single answer, but lets us watch a mind wrestle with the question.'
  quote:
    text: 'To be, or not to be, that is the question:'
    author: William Shakespeare
    work: Hamlet, Act III, scene 1 (Hamlet)
    tr: ''
    ed: First printed in quarto
    year: 1604
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1524
- rung: gbren.cervantes-don-quixote-2
  year: 1615
  text: At the end of the novel, the old knight comes home sick and wakes up clear in mind. He gives up his knightly dreams, makes his
    will and makes his peace. His squire Sancho, weeping, begs him to get up and go adventuring again.
  quote:
    text: '"Ah!" said Sancho weeping, "don''t die, master, but take my advice and live many years; for the foolishest thing a man can
      do in this life is to let himself die without rhyme or reason ..."'
    author: Cervantes
    work: Don Quixote, Part Two, Chapter LXXIV
    tr: John Ormsby
    ed: Smith, Elder, London
    year: 1885
    src: Project Gutenberg
    url: https://gutenberg.org/cache/epub/5945/pg5945-images.html
young:
- 'Every living thing has a beginning and an end: flowers, pets and people too. It is normal to feel sad or scared when we think about
  it, and it is good to talk about those feelings with someone you love.'
- 'The great writers believed different things about what happens after death, but many agreed on one thing: knowing life doesn''t last
  forever helps us use it well. It helps us be kind today, say thank you and spend time with the people we love.'
talk:
- Socrates and Lucretius both said not to fear death, for opposite reasons. What were their reasons?
- How might remembering that life is short change the way you spend a day?
- Why do you think Achilles chose glory over a long, quiet life? Would you?
- How do people in your family remember those who have died?
