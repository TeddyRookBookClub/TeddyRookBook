key: fate
question: Are our lives fixed in advance, or are they ours to choose? Can fate and free will both be true?
stops:
- rung: gbgreeks.sophocles-oedipus
  year: -429
  work: Oedipus the King
  text: An oracle foretells that Oedipus will kill his father and marry his mother. Everyone tries to escape the prophecy, and their
    efforts make it come true. Yet Oedipus chooses to search out the truth and takes responsibility. Sophocles leaves fate and choice
    tangled together.
- rung: gbrome.virgil-aeneid
  year: -19
  text: Aeneas is driven by fate to found Rome, and even the goddess Juno can only delay it. But he still has to choose, again and again,
    to follow his destiny. Virgil shows fate as a calling that takes courage to obey.
  quote:
    text: Jove will soon dispose To future good our past and present woes. … An hour will come, with pleasure to relate Your sorrows
      past, as benefits of Fate.”
    author: Virgil
    work: The Aeneid, Book 1
    tr: John Dryden
    ed: The Harvard Classics, vol. 13, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/virgilsaeneid0000virg
- rung: gbrome.augustine-city-of-god
  year: 420
  text: Augustine rejects the idea of blind fate ruled by the stars. He argues that God knows all things in advance, yet human wills
    are still free, because God foreknows what we will freely choose. His answer was debated by later thinkers for centuries.
- rung: gbmiddle.chaucer-troilus
  year: 1385
  text: Troilus, in despair, wonders whether everything is fixed by God's foreknowledge. Chaucer drew this speech from Boethius, a Roman
    writer much read in the Middle Ages. The poem lets fortune's wheel turn while asking how free its people really are.
- rung: gbren.shakespeare-romeo-and-juliet
  year: 1595
  text: The prologue calls Romeo and Juliet star-crossed lovers, as if doomed from the start. Yet the play is full of rash choices,
    bad timing and a feud people could have ended. Shakespeare lets the audience wonder how much was fate.
  quote:
    text: From forth the fatal loins of these two foes A pair of star-cross'd lovers take their life;
    author: William Shakespeare
    work: Romeo and Juliet, the Prologue
    tr: ''
    ed: First printed in quarto
    year: 1597
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1112
- rung: gbren.shakespeare-julius-caesar
  year: 1599
  text: 'Cassius tells Brutus not to blame the stars: if they are underlings, it is their own fault. It is a famous claim for free will.
    The play goes on to show how their choices lead to their downfall.'
  quote:
    text: The fault, dear Brutus, is not in our stars, But in ourselves, that we are underlings.
    author: William Shakespeare
    work: Julius Caesar, Act I, scene 2 (Cassius)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1522
- rung: gbren.shakespeare-macbeth
  year: 1606
  text: The witches tell Macbeth he will be king. Would it have happened anyway? Macbeth chooses to murder to make it come true. The
    play suggests that prophecy tempts, but people choose.
- rung: gb17.milton-paradise-lost
  year: 1667
  text: Milton's God says he made angels and people free, able to stand or fall. He foresaw the fall but did not cause it. Milton's
    whole poem rests on the belief that freedom is real and that the choice was Adam and Eve's.
- rung: gb19.tolstoy-war-and-peace
  year: 1869
  text: Tolstoy argues that each person feels free in each moment, yet history moves by laws made of millions of choices. Napoleon thought
    he steered events, but was carried by them. He tries to hold freedom and necessity together.
- rung: gb20.henry-james-beast-in-the-jungle
  year: 1903
  text: John Marcher is sure something huge and terrible is waiting to happen to him, like a beast in the jungle. He waits all his life,
    and lets his friend May's love go by unnoticed. Too late he sees that his fate was to have missed his life by waiting.
  quote:
    text: Something or other lay in wait for him, amid the twists and the turns of the months and the years, like a crouching Beast
      in the Jungle.
    author: Henry James
    work: The Beast in the Jungle, chapter II
    tr: ''
    ed: The Better Sort (first published 1903); text of the Martin Secker edition, London
    year: 1915
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1093
young:
- Fate is the idea that some things are meant to happen, no matter what. Free will is the idea that we choose what we do.
- In many old stories, heroes try to escape a prophecy, and it happens anyway! But in others, like Shakespeare's Julius Caesar, a character
  says our lives are up to us, not the stars. Do you think your future is already set, or do you make it?
talk:
- Do you think some things are meant to happen?
- Cassius says 'the fault is not in our stars, but in ourselves.' What does that mean?
- If Macbeth hadn't met the witches, would he still have become king?
- John Marcher waited his whole life for something to happen. What lesson might that teach?
- What choice did you make today that changed what happened next?
see:
