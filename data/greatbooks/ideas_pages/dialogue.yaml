key: dialogue
question: Why learn by talking things through? How can a conversation, even with books from long ago, lead to the truth?
stops:
- rung: gbgreeks.plato-trial-of-socrates
  year: -399
  work: Euthyphro
  text: Socrates meets Euthyphro, who is sure he knows what holiness is. By asking questions, Socrates shows that Euthyphro's answers
    don't hold together. The conversation ends without an answer, but both now know the question better.
  quote:
    text: The point which I should first wish to understand is whether the pious or holy is beloved by the gods because it is holy,
      or holy because it is beloved of the gods.
    author: Plato
    work: Euthyphro 10a
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. II, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0002
- rung: gbgreeks.plato-theaetetus
  year: -369
  text: Socrates calls himself a midwife of ideas. He doesn't give birth to his own answers, he says, but helps others bring theirs
    out and test whether they are sound. Philosophy begins in wonder and grows in talk.
  quote:
    text: I see, my dear Theaetetus, that Theodorus had a true insight into your nature when he said that you were a philosopher, for
      wonder is the feeling of a philosopher, and philosophy begins in wonder.
    author: Plato
    work: Theaetetus 155d
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. IV, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0004
- rung: gbmiddle.aquinas-on-god
  year: 1268
  text: Aquinas's Summa is built like a debate. Each article raises objections, gives the other side, then an answer, then replies.
    It records the conversations of the medieval university, where students argued questions out loud.
- rung: gb17.galileo-two-new-sciences
  year: 1638
  text: 'Galileo writes as a conversation among three friends: one speaks for the new science, one for Aristotle, and one is a sharp,
    open-minded listener. The dialogue lets readers follow the reasoning and the objections. It makes science a shared search.'
- rung: gb18.diderot-rameaus-nephew
  year: 1770
  text: Diderot writes a lively conversation between a sober philosopher and a clever, shameless musician in a Paris café. The nephew
    mocks every virtue, and the philosopher struggles to answer him. Diderot never says who wins.
- rung: gb18.boswell-life-of-johnson
  year: 1791
  text: 'Boswell spent years writing down Samuel Johnson''s conversation: his jokes, arguments and wise sayings. Johnson loved to talk
    and often argued the other side just to test an idea. The book shows how much a mind can come alive in conversation.'
  quote:
    text: Is not a Patron, my Lord, one who looks with unconcern on a man struggling for life in the water, and, when he has reached
      ground, encumbers him with help?
    author: James Boswell
    work: 'Life of Johnson: Johnson''s letter to Lord Chesterfield, February 1755'
    tr: ''
    ed: Boswell's Life of Johnson, edited by George Birkbeck Hill, vol. I, Clarendon Press, Oxford (Project Gutenberg text)
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/lifeofjohnsonvol08918gut
- rung: gb20.bohr-atomic-theory
  year: 1949
  text: Niels Bohr describes his long friendly debates with Albert Einstein about quantum physics. Einstein kept proposing puzzles;
    Bohr kept answering them. Neither fully convinced the other, but the arguments sharpened physics for both.
- rung: gbstart.the-great-conversation
  year: 1952
  who: Teddy Rook Book
  work: The Great Conversation (our opening rung)
  when: the idea behind the 1952 set
  text: The editors of Great Books of the Western World described the books as a great conversation across the centuries, each author
    answering earlier ones. Our opening rung tells that story and its critics. These Great Ideas pages try to let you hear that conversation.
young:
- A dialogue is a conversation where people share ideas, ask questions and listen. Talking things through can help us understand things
  better than thinking alone.
- 'Socrates learned by asking friends questions like ''What is courage?'' Try it at dinner: pick a big question, and take turns sharing
  ideas. Listen carefully and ask ''Why do you think that?'''
talk:
- What is a good question to talk about at dinner?
- Socrates called himself a midwife of ideas. What did he mean?
- Why is listening just as important as talking?
- Johnson sometimes argued the other side on purpose. Why might that help?
- How can you have a conversation with a writer who lived long ago?
