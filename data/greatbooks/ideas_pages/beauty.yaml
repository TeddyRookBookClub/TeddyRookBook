key: beauty
question: What is beauty? Is it in things themselves, or in the eye of the beholder? And what is art for?
stops:
- rung: gbgreeks.plato-symposium-phaedrus
  year: -380
  text: 'In the Symposium, Socrates describes a ladder of beauty: from one beautiful body, to all beautiful bodies, to beautiful souls,
    laws and knowledge, and finally to beauty itself, eternal and pure. For Plato, beauty draws the soul upward toward the truth.'
- rung: gbrome.plotinus-enneads
  year: 260
  text: Plotinus asks why things are beautiful. Not just because of symmetry, he says, since a single color or a simple sound can be
    beautiful too. Beauty is a form shining through matter, and the soul loves it because it recognizes its own home.
- rung: gbmiddle.dante-paradiso
  year: 1316
  text: As Dante rises through Heaven, Beatrice grows more beautiful with each sphere, and the light grows brighter. Beauty becomes
    a sign of God's glory. At the end, Dante's words fail before the beauty he sees.
  quote:
    text: His glory, by whose might all things are mov'd, Pierces the universe, and in one part Sheds more resplendence, elsewhere less.
      ...
    author: Dante
    work: Paradiso, Canto I
    tr: Henry Francis Cary
    ed: The Vision, London
    year: 1814
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/8796
- rung: gbren.shakespeare-sonnets
  year: 1609
  text: Shakespeare's sonnets praise a friend's beauty and worry that time will destroy it. Their answer is that the poem will keep
    that beauty alive as long as people read. Beauty fades, but art can preserve it.
  quote:
    text: Shall I compare thee to a summer's day?
    author: William Shakespeare
    work: Sonnet 18
    tr: ''
    ed: Shake-speares Sonnets, London
    year: 1609
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1041
- rung: gb17.kepler-harmonies
  year: 1619
  text: Kepler finds beauty in mathematics and in the heavens. He compares the planets' speeds to musical intervals and imagines a harmony
    of the spheres. For him, the beauty of the cosmos showed the mind of its maker.
- rung: gb18.kant-critique-of-judgment
  year: 1790
  text: 'Kant says that when we call something beautiful, we mean more than ''I like it'': we expect others to agree, though we can''t
    prove it by rules. Beauty pleases freely, without serving any use. He also describes the sublime, the awe we feel before vast mountains
    or storms.'
  quote:
    text: The beautiful is that which pleases universally, without a concept.
    author: Immanuel Kant
    work: Critique of Judgement, end of §9
    tr: J. H. Bernard
    ed: Kant's Critique of Judgement, 2nd edition, revised, Macmillan, London
    year: 1914
    src: Internet Archive
    url: https://archive.org/details/kantscritiqueofj48433gut
- rung: gb20.chekhov-uncle-vanya
  year: 1897
  text: Dr. Astrov plants forests and worries about their destruction. He says forests teach people about beauty and lift their minds.
    Chekhov lets beauty in nature stand against the dullness of the characters' lives.
  quote:
    text: He says that forests are the ornaments of the earth, that they teach mankind to understand beauty and attune his mind to lofty
      sentiments.
    author: Chekhov
    work: Uncle Vanya, Act I
    tr: Marian Fell
    ed: Plays by Anton Tchekoff (Charles Scribner's Sons, New York)
    year: 1912
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1756
- rung: gb20.huizinga-waning-of-the-middle-ages
  year: 1919
  text: Huizinga describes the late Middle Ages through its colors, ceremonies, art and sounds. He shows how beauty filled everyday
    life, from painted books to the ringing of church bells. Art, for him, is a key to understanding a whole age.
  quote:
    text: 'One sound rose ceaselessly above the noises of busy life and lifted all things unto a sphere of order and serenity: the sound
      of bells.'
    author: Johan Huizinga
    work: The Waning of the Middle Ages, Chapter I
    tr: F. Hopman
    ed: Edward Arnold, London
    year: 1924
    src: Internet Archive (1924 edition)
    url: https://archive.org/details/in.ernet.dli.2015.60030
- rung: gb20.hardy-mathematicians-apology
  year: 1940
  text: The mathematician G. H. Hardy argues that beauty is the first test of good mathematics. A beautiful proof is surprising, simple
    and inevitable. He compares the mathematician to a painter or a poet, a maker of patterns.
young:
- What do you think is beautiful? A sunset, a flower, a song, a kind face? Beauty is something that makes us stop and say 'wow.'
- People have argued for ages whether beauty is in the thing itself or in the eye of the person looking. Kant noticed that when we say
  something is beautiful, we hope others will see it too. Share something you think is beautiful with someone today.
talk:
- What is the most beautiful thing you have ever seen?
- Is beauty in the thing or in the eye of the beholder?
- Can math be beautiful? Can a good deed be beautiful?
- Why do people make art?
- Shakespeare said poems keep beauty alive. How else do we keep beautiful things?
