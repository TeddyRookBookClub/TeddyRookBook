key: wealth
question: What is wealth, and how is it made and shared? Is the love of money good, bad or neither?
stops:
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle separates managing a household, which gathers what a family needs, from money-making for its own sake, which has no
    natural limit. Money was invented to make trade easier. He criticized lending money at interest, since money then breeds money.
- rung: gbmiddle.aquinas-on-happiness-and-law
  year: 1270
  text: 'Aquinas argues that wealth can''t be what happiness is, because it is only a means to other things. Riches are for use: to
    support life and to help others. Like Aristotle, he warns against a desire for money that knows no limit.'
  quote:
    text: It is impossible for man's happiness to consist in wealth.
    author: Thomas Aquinas
    work: Summa Theologica, First Part of the Second Part, Question 2, Article 1
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/2002.htm
- rung: gb18.locke-government-and-toleration
  year: 1689
  text: Locke argues that property comes from work. When a person picks apples or plows a field, they mix their labor with nature and
    make it theirs. He thought labor gives things most of their value, and that money let people keep wealth without it spoiling.
  quote:
    text: The "labour" of his body and the "work" of his hands, we may say, are properly his.
    author: John Locke
    work: Second Treatise, ch. V, §27
    tr: ''
    ed: Two Treatises on Civil Government, Morley's Universal Library, 2nd edition, George Routledge and Sons, London
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/twotreatisesonc01filmgoog
- rung: gb18.smith-wealth-of-nations
  year: 1776
  text: Adam Smith says a nation's wealth is what its people produce, not the gold in its treasury. Dividing work into special tasks
    makes each worker far more productive, and trade lets each person benefit from others' skills. People serving their own interest
    in a free market, he argues, are often led to serve the common good, though he also warned against businesses joining to fix prices.
  quote:
    text: It is not from the benevolence of the butcher the brewer, or the baker that we expect our dinner, but from their regard to
      their own interest.
    author: Adam Smith
    work: Book I, ch. II
    tr: ''
    ed: An Inquiry into the Nature and Causes of the Wealth of Nations (Project Gutenberg text)
    year: 1776
    src: Internet Archive
    url: https://archive.org/details/aninquiryintothe03300gut
- rung: gb19.marx-engels-manifesto
  year: 1848
  text: Marx and Engels argue that history is driven by struggles between classes. They praise modern industry for producing more than
    any earlier age, but claim it divides society into owners and workers who have nothing to sell but their labor. They call for workers
    to unite and overthrow this order, a call that later movements and their critics have argued over ever since.
  quote:
    text: The history of all hitherto existing society is the history of class struggles.
    author: Marx and Engels
    work: Manifesto of the Communist Party, Section I
    tr: Samuel Moore
    ed: authorized English translation, edited and annotated by Frederick Engels
    year: 1888
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/manifestooftheco31193gut
- rung: gb19.marx-capital
  year: 1867
  text: In Capital, Marx studies how money is turned into more money. He contrasts selling in order to buy with buying in order to sell
    at a profit. He argues that profit comes from workers' unpaid labor, a claim many economists accept in part and many reject.
  quote:
    text: M—C—M, the transformation of money into commodities, and the change of commodities back again into money; or buying in order
      to sell.
    author: Marx
    work: Capital, Volume 1, Chapter IV
    tr: Samuel Moore and Edward Aveling
    ed: first American edition, Charles H. Kerr, Chicago
    year: 1906
    src: Internet Archive
    url: https://archive.org/details/capitalcritiqueo00marxuoft
- rung: gb20.veblen-leisure-class
  year: 1899
  text: Veblen notices that rich people often spend to show off, not because they need things. He calls it conspicuous consumption.
    Wealth wins respect, he says, only when others can see it.
  quote:
    text: Conspicuous consumption of valuable goods is a means of reputability to the gentleman of leisure.
    author: Thorstein Veblen
    work: The Theory of the Leisure Class, Chapter IV (Conspicuous Consumption)
    tr: ''
    ed: The Macmillan Company, New York (copyright 1899; 1908 printing)
    year: 1899
    src: Internet Archive
    url: https://archive.org/details/theoryofleisurec00vebl_3
- rung: gb20.tawney-acquisitive-society
  year: 1920
  text: Tawney criticizes a society that treats getting rich as the main goal of life. He argues that property and industry should be
    judged by the service they do for others. Owning things is fine, he says, but owning without working is what corrupts.
  quote:
    text: For it is not private ownership, but private ownership divorced from work, which is corrupting to the principle of industry.
    author: R. H. Tawney
    work: The Acquisitive Society, Chapter VI (The Functional Society)
    tr: ''
    ed: Harcourt, Brace and Howe, New York
    year: 1920
    src: Internet Archive
    url: https://archive.org/details/acquisitivesoci01tawngoog
- rung: gb20.keynes-general-theory
  year: 1936
  text: Writing during the Great Depression, Keynes argues that a market economy can get stuck with many people out of work if total
    spending falls. He thought governments could help by spending and by managing interest rates. Economists still debate how far his
    ideas hold.
young:
- 'Wealth is having the things people need and want: food, homes, tools and money to trade for them. Money itself is just a handy way
  to trade, so you don''t have to swap a chicken for a pair of shoes.'
- Adam Smith noticed that a baker bakes bread to earn a living, and that helps everyone get bread. Other writers worried that some people
  end up with far too much while others have too little. People still argue about the best way for wealth to be made and shared.
talk:
- Why is money useful? What would life be like without it?
- Smith says the baker works for his own good and helps us too. Can you think of other examples?
- Aristotle says there is such a thing as wanting too much money. What do you think?
- Veblen says people buy things to show off. Have you seen that? Why do people do it?
- If you earned ten dollars, how would you choose to spend, save or share it?
