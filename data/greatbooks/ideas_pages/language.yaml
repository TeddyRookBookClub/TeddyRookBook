key: language
question: How do words get their meaning? Can words make our thinking clearer, or cloud it?
stops:
- rung: gbgreeks.plato-theaetetus
  year: -369
  work: Cratylus
  text: 'In the Cratylus, two friends argue: are names right by nature, so that a word fits its thing, or only by agreement? Socrates
    plays with both sides and some funny word origins. He ends by saying we should study things themselves, not just their names.'
- rung: gbgreeks.aristotle-logic
  year: -350
  work: On Interpretation
  text: Aristotle says spoken words are signs of thoughts, and written words are signs of spoken ones. Words differ between peoples,
    but the thoughts and things they stand for are the same. He then studies how words join into statements that can be true or false.
  quote:
    text: Expressions which are in no way composite signify substance, quantity, quality, relation, place, time, position, state, action,
      or affection.
    author: Aristotle
    work: Categories 4
    tr: E. M. Edghill
    ed: The Works of Aristotle, vol. I, Clarendon Press
    year: 1928
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0001emed
- rung: gbrome.augustine-on-christian-doctrine
  year: 397
  text: Augustine divides everything we learn into things and signs. Words are the most important signs, and we learn about things through
    them. He uses this to teach how to read hard passages of the Bible, and how a speaker should teach, delight and persuade.
  quote:
    text: All instruction is either about things or about signs; but things are learnt by means of signs.
    author: Augustine
    work: On Christian Doctrine, Book I, chapter 2
    tr: J. F. Shaw
    ed: A Select Library of the Nicene and Post-Nicene Fathers, vol. II, The Christian Literature Company, Buffalo
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/cityofgodtrbymar0002augu
- rung: gbren.shakespeare-romeo-and-juliet
  year: 1595
  text: Juliet wishes Romeo had another family name, since a name is not the person. A rose would smell as sweet by any other name.
    But the play shows that names, and the feuds attached to them, have great power over people's lives.
  quote:
    text: That which we call a rose By any other name would smell as sweet.
    author: William Shakespeare
    work: Romeo and Juliet, Act II, scene 2 (Juliet)
    tr: ''
    ed: First printed in quarto
    year: 1597
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1112
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes says that words let us reason, but also let us talk nonsense. Reasoning goes wrong when we use words without clear definitions.
    Like a bird caught on sticky lime twigs, he says, the more we struggle with bad words the more stuck we get.
- rung: gb18.locke-human-understanding
  year: 1689
  text: Locke devotes a whole book to words. Many arguments, he says, come from people using the same word for different ideas, or words
    for no clear idea at all. Clearing up words is part of clearing up thinking.
- rung: gb18.lavoisier-elements-of-chemistry
  year: 1789
  text: Lavoisier and his colleagues gave chemistry a new set of names, like oxygen and hydrogen, built to show what substances are
    made of. He argued that a science improves when its words match its ideas and its ideas match the facts.
  quote:
    text: Like three impressions of the same seal, the word ought to produce the idea, and the idea to be a picture of the fact.
    author: Antoine Lavoisier
    work: Elements of Chemistry, Preface
    tr: Robert Kerr
    ed: William Creech, Edinburgh
    year: 1790
    src: Internet Archive
    url: https://archive.org/details/bim_eighteenth-century_elements-of-chemistry-i_lavoisier-antoine-laure_1790
- rung: gb20.wittgenstein-philosophical-investigations
  year: 1953
  text: Wittgenstein argues that the meaning of a word is mostly its use in the life of a community. Words are like tools in a toolbox,
    each with many jobs. Many puzzles, he thought, dissolve when we see how a word is used in everyday life.
young:
- 'Words are like labels we put on things and ideas. ''Dog'' means a furry pet that barks. But words can be tricky: ''bat'' could be
  an animal or something for baseball!'
- Clear words help us think and talk clearly. When two friends argue, sometimes they are using the same word to mean different things.
  Try asking, 'What do you mean by that?'
talk:
- Think of a word with two meanings. Can it cause a mix-up?
- Juliet said a rose would smell as sweet with another name. Do names matter?
- Lavoisier made up new words for chemistry. Why do scientists need exact words?
- Have you ever argued with someone and then found you meant different things?
- Make up a new word for something that doesn't have one.
