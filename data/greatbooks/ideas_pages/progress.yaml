# Great Books Ladder: the Great Idea "progress", followed through the books (page: /great-books/ideas/progress/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
#   question: one or two plain sentences.  intro: optional.  stances: optional [{key, label}] (colors the timeline; only where views divide cleanly)
#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: progress
question: Do things get better over time? Why do great powers rise and fall?
stops:
- rung: gbrome.lucretius-on-the-nature-of-things
  year: -55
  text: Lucretius tells how early people learned to use fire, build houses, speak, farm and make laws. Step by step, by trial and error,
    civilization grew. But he also notes that new comforts brought new wants and new wars.
- rung: gbrome.augustine-city-of-god
  year: 420
  text: Augustine wrote after Rome was sacked. He argues that no earthly empire lasts forever and that history's true goal is beyond
    it, in the city of God. Progress, for him, is not in empires but in souls.
- rung: gb17.bacon-new-atlantis
  year: 1627
  text: Bacon imagines an island ruled by wise scientists who do experiments to benefit everyone. Knowledge, he hopes, will bring better
    medicine, inventions and lives. It is an early dream of progress through science.
  quote:
    text: The end of our foundation is the knowledge of causes, and secret motions of things; and the enlarging of the bounds of human
      empire, to the effecting of all things possible.
    author: Francis Bacon
    work: New Atlantis
    tr: ''
    ed: first published 1627
    year: 1627
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/2434
- rung: gb18.voltaire-candide
  year: 1759
  text: Voltaire mocks the idea that all is already for the best. Yet he believed people could improve things by reason, work and tolerance.
    His famous ending, cultivate your garden, is a call to steady, practical effort.
- rung: gb18.gibbon-decline-and-fall-1
  year: 1781
  text: 'Gibbon wonders not why Rome fell but how it lasted so long. Great size, he says, made its fall natural. He ends hopefully,
    though: he did not think Europe would fall back into darkness, because useful knowledge, once gained, is hard to lose.'
  quote:
    text: The story of its ruin is simple and obvious; and instead of inquiring why the Roman empire was destroyed, we should rather
      be surprised that it had subsisted so long.
    author: Edward Gibbon
    work: General Observations on the Fall of the Roman Empire in the West (after ch. XXXVIII)
    tr: ''
    ed: The History of the Decline and Fall of the Roman Empire, with notes by H. H. Milman (Project Gutenberg text)
    year: 1781
    src: Internet Archive
    url: https://archive.org/details/historyofthedecl00892gut
- rung: gb19.hegel-philosophy-of-history
  year: 1837
  text: Hegel sees history as progress in freedom, from one free person in ancient empires, to some in Greece and Rome, to the idea
    that all are free. Progress comes through conflict, not smoothly. Great passions drive it forward.
  quote:
    text: '... we may affirm absolutely that nothing great in the World has been accomplished without passion.'
    author: Hegel
    work: Lectures on the Philosophy of History, Introduction
    tr: J. Sibree
    ed: Bohn's Philosophical Library, London (1884 printing)
    year: 1857
    src: Internet Archive
    url: https://archive.org/details/lecturesonphilos00hege_0
- rung: gb20.frazer-golden-bough
  year: 1890
  text: Frazer proposed that human thought moved from magic to religion to science. Many later scholars found his scheme too simple
    and too sure of its own age. He also admitted that the future might bring something new.
- rung: gb20.cather-a-lost-lady
  year: 1923
  text: Willa Cather shows the passing of the pioneer era on the prairie. The generous old railroad builders give way to sharp young
    men who care only about profit. Progress brings new wealth but loses something fine.
  quote:
    text: Any one but Captain Forrester would have drained the bottom land and made it into highly productive fields.
    author: Cather
    work: A Lost Lady, Part I, chapter I
    tr: ''
    ed: Alfred A. Knopf, New York
    year: 1923
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/65636
- rung: gb20.whitehead-science-and-the-modern-world
  year: 1925
  text: 'Whitehead says the nineteenth century''s greatest invention was the method of invention itself: organized science and engineering.
    Progress became something planned. He also warns that a narrow view of science can miss the values that give life meaning.'
  quote:
    text: The greatest invention of the nineteenth century was the invention of the method of invention.
    author: Alfred North Whitehead
    work: Science and the Modern World, Chapter VI
    tr: ''
    ed: The Macmillan Company, New York
    year: 1925
    src: Internet Archive
    url: https://archive.org/details/scienceandthemod010766mbp
young:
- Progress means getting better over time. People invented the wheel, then bikes, then cars and planes. Medicine has helped people live
  longer.
- 'But not everything always gets better. Great empires like Rome grew and then fell apart. The great books ask: does the world keep
  improving, or does it go up and down? What is one thing that''s better now than when your grandparents were young? Is anything worse?'
talk:
- What invention do you think made the biggest difference?
- Is the world getting better? How would you decide?
- Gibbon asked why Rome lasted so long, not why it fell. Why might that be a smarter question?
- Can a new thing make life better and worse at the same time?
- What would you like to improve in the world?
