key: war
question: Why do nations go to war? What does war do to people, and can war ever be just?
stops:
- rung: gbgreeks.homer-iliad
  year: -750
  text: 'The Iliad is a war poem, full of courage and glory. Yet Homer never forgets the cost: the widows, the orphans, the old fathers.
    Its last scene is a truce, as Achilles gives back Hector''s body to his grieving father.'
- rung: gbgreeks.thucydides-peloponnesian-war
  year: -431
  text: 'Thucydides wanted to explain the war, not just tell it. He separates the complaints people gave from what he saw as the true
    cause: fear of a rising power. He shows how war is a harsh teacher that changes the way people think and even what words mean.'
- rung: gbgreeks.euripides-plays
  year: -415
  work: The Trojan Women
  text: Euripides staged The Trojan Women while Athens was at war. It shows no battles at all, only the women of Troy after the city
    has fallen, waiting to be taken away. The play makes the audience feel war from the side of those who lose everything.
- rung: gbrome.augustine-city-of-god
  year: 420
  text: Augustine believes peace is what every war aims at, even the wars of the wicked. A good person may sometimes have to fight a
    just war, he argues, but should grieve that it was needed. His thoughts became a starting point for later ideas about just war.
- rung: gbren.shakespeare-histories
  year: 1599
  work: Henry V
  text: In Henry V, the king rallies his tired army with stirring speeches. But the night before the battle, in disguise, he hears common
    soldiers ask who will answer for those who die in an unjust war. Shakespeare shows both the glory and the weight of war.
  quote:
    text: Once more unto the breach, dear friends, once more, Or close the wall up with our English dead.
    author: William Shakespeare
    work: Henry V, Act III, scene 1 (King Henry)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1521
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes describes life without government as a war of each against all, where life is nasty, brutish and short. Competition,
    fear and pride drive people to fight. Peace, he argues, comes only when all agree to obey a common power.
- rung: gb18.gibbon-decline-and-fall-2
  year: 1788
  text: Gibbon follows centuries of wars as Rome's empire breaks apart. He shows how armies made and unmade emperors and how invasions
    wore down the frontiers. In his telling, war wins glory for a few and brings ruin to many.
- rung: gb19.tolstoy-war-and-peace
  year: 1869
  text: 'Tolstoy sets his novel during Napoleon''s invasion of Russia. He argues that great generals do not really control battles:
    the outcome comes from the choices of countless ordinary people. The novel moves between the chaos of the battlefield and the families
    waiting at home.'
  quote:
    text: History, that is, the unconscious, general, hive life of mankind, uses every moment of the life of kings as a tool for its
      own purposes.
    author: Tolstoy
    work: War and Peace, Book Nine, Chapter I
    tr: Louise and Aylmer Maude
    ed: Oxford University Press (World's Classics)
    year: 1922
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/warandpeace02600gut
young:
- A war is a big fight between countries or groups, with armies. Wars have caused great sadness, but stories about war also tell of
  courage, friendship and sacrifice.
- 'The great writers ask why wars start: fear, pride, wanting land or wanting to protect people. They also ask how peace can be kept.
  On a playground, fights often start from fear or pride too, and peace comes when people talk, share and follow fair rules.'
talk:
- Thucydides said fear caused the war. How can fear make people fight?
- Why do you think The Trojan Women shows no battles?
- Augustine says even wars aim at peace. What do you think he meant?
- Tolstoy thought ordinary people mattered more than generals. Do you agree?
- What helps people make peace after a fight?
