# Great Books Ladder: the Great Idea "method", followed through the books (page: /great-books/ideas/method/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
#   question: one or two plain sentences.  intro: optional.  stances: optional [{key, label}] (colors the timeline; only where views divide cleanly)
#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: method
question: Is there a step-by-step way to find the truth? How did thinkers and scientists learn to find things out?
stops:
- rung: gbgreeks.aristotle-logic
  year: -350
  work: Posterior Analytics
  text: 'Aristotle says scientific knowledge means proving things from first principles that are true and better known. But those first
    principles themselves come from experience, by noticing what is general in many cases. So science runs in two directions: up from
    observation, then down by proof.'
  quote:
    text: All instruction given or received by way of argument proceeds from pre-existent knowledge.
    author: Aristotle
    work: Posterior Analytics I.1
    tr: G. R. G. Mure
    ed: The Works of Aristotle, vol. I, Clarendon Press
    year: 1928
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0001emed
- rung: gbgreeks.euclid-plane-geometry
  year: -300
  text: Euclid's method is to state a few definitions and postulates, then prove each step from what came before. Nothing is accepted
    just because it looks right in the drawing. His method became the model for exact reasoning in many fields.
- rung: gb17.bacon-novum-organum
  year: 1620
  text: Bacon argues that science had been stuck for centuries. He warns against the 'idols' of the mind, habits of thought that mislead
    us, and calls for patient gathering of observations and experiments, then rising slowly to general laws. He compares good scientists
    to bees, who gather and also transform.
  quote:
    text: The bee, a mean between both, extracts matter from the flowers of the garden and the field, but works and fashions it by its
      own efforts.
    author: Francis Bacon
    work: Novum Organum, Book I, aphorism 95
    tr: the version edited by Joseph Devey
    ed: P. F. Collier & Son, New York
    year: 1902
    src: Internet Archive
    url: https://archive.org/details/novumorganum00bacogoog
- rung: gb17.descartes-discourse-on-method
  year: 1637
  text: 'Descartes gives his method in four rules: accept only what is clear, break problems into parts, go from simple to complex,
    and review everything. Bacon starts from the senses; Descartes trusts reason and mathematics first. Both wanted a fresh start for
    knowledge.'
- rung: gb17.galileo-two-new-sciences
  year: 1638
  text: 'Galileo combines experiment and mathematics. He rolls balls down gentle ramps and times them, then finds the mathematical rule:
    the distance grows as the square of the time. His dialogue shows a new science being argued out step by step.'
- rung: gb17.newton-principia
  year: 1687
  text: 'Newton sets out rules for reasoning in natural science: don''t invent more causes than you need, and treat what experiments
    show widely as true until new facts say otherwise. He refused to make up a hidden cause for gravity that he could not find in the
    evidence.'
  quote:
    text: But hitherto I have not been able to discover the cause of those properties of gravity from phænomena, and I frame no hypotheses.
    author: Isaac Newton
    work: The Mathematical Principles of Natural Philosophy, Book III, General Scholium
    tr: Andrew Motte
    ed: Benjamin Motte, London
    year: 1729
    src: Internet Archive
    url: https://archive.org/details/bim_eighteenth-century_principia-english-th_newton-sir-isaac_1729_2
- rung: gb18.lavoisier-elements-of-chemistry
  year: 1789
  text: Lavoisier made chemistry a science of careful weighing. He measured everything before and after a reaction and found that the
    total mass stays the same. Exact measurement settled arguments that words alone had not.
- rung: gb19.darwin-origin-of-species
  year: 1859
  text: Darwin spent over twenty years gathering facts from breeders, fossils, islands and barnacles before publishing. He presented
    his theory as one long argument, answered the strongest objections he could find, and admitted what he could not explain. His method
    was patient evidence from many directions.
- rung: gb20.poincare-science-and-hypothesis
  year: 1902
  text: Poincaré studies the parts of a scientific theory. Some are facts from experiment, some are useful choices or conventions, and
    some are guesses waiting to be tested. Hypotheses are necessary, he says, but we should know which kind each one is.
young:
- 'A method is a plan for doing something step by step. Scientists use a method to find things out: ask a question, make a guess, test
  it, and look carefully at what happens.'
- Galileo wanted to know how things fall. Instead of just arguing, he rolled balls down a ramp and timed them. You can do the same with
  a toy car, a book and a stopwatch!
talk:
- Bacon compared some thinkers to ants, some to spiders and the best to bees. What do you think he meant?
- 'Design a test: does a heavier ball roll down a ramp faster than a light one?'
- Why is it important to measure carefully?
- Darwin worked on his idea for twenty years. Why might he have waited so long?
- What's the difference between a guess and a test?
