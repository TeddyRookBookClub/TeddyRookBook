key: heroes
question: What makes someone a hero? And how did the idea of a hero change from Achilles to Huck Finn?
stops:
- rung: gbgreeks.homer-iliad
  year: -750
  text: Achilles is the greatest warrior at Troy, fast, strong and proud. He fights for honor and lasting fame, and he knows he will
    die young. Homer's hero is magnificent but flawed, and only at the end does he learn pity.
- rung: gbgreeks.homer-odyssey
  year: -725
  text: 'Odysseus is a different kind of hero: clever, patient and full of tricks. He survives by his wits, outsmarting the Cyclops
    and finding his way home. His heroism is endurance and loyalty to his family.'
  quote:
    text: Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy.
    author: Homer
    work: The Odyssey, Book I
    tr: Samuel Butler
    ed: Longmans, Green
    year: 1900
    src: The Internet Classics Archive (MIT)
    url: https://classics.mit.edu/Homer/odyssey.1.i.html
- rung: gbrome.virgil-aeneid
  year: -19
  text: Virgil's Aeneas is a hero of duty. He carries his father, leads his people and gives up what he wants to found a new nation.
    He is less dazzling than Achilles but more responsible.
  quote:
    text: Arms, and the man I sing, who, forc’d by fate, And haughty Juno’s unrelenting hate, Expell’d and exil’d, left the Trojan shore.
    author: Virgil
    work: The Aeneid, Book 1, the opening
    tr: John Dryden
    ed: The Harvard Classics, vol. 13, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/virgilsaeneid0000virg
- rung: gbrome.plutarch-greek-lives
  year: 110
  text: 'Plutarch''s heroes are real people: lawgivers, generals and statesmen of Greece and Rome. He shows their virtues and their
    faults, and pairs a Greek with a Roman so readers can compare. His Lives taught later readers, including Shakespeare and the American
    founders, about greatness.'
- rung: gbren.shakespeare-histories
  year: 1599
  work: Henry V
  text: In Henry V, the young king who once ran wild becomes a leader who inspires his tired soldiers. On the night before battle he
    walks among them in disguise. Shakespeare shows a hero who calls ordinary men his brothers.
- rung: gbren.cervantes-don-quixote-1
  year: 1605
  text: 'Don Quixote has read so many tales of knights that he sets out to be one, and attacks windmills he thinks are giants. Cervantes
    makes fun of old hero stories, yet the old man''s kindness and ideals win readers'' love. Who is the real hero: the dreamer or his
    sensible squire, Sancho?'
  quote:
    text: '"what we see there are not giants but windmills, and what seem to be their arms are the sails that turned by the wind make
      the millstone go."'
    author: Cervantes
    work: Don Quixote, Part One, Chapter VIII
    tr: John Ormsby
    ed: Smith, Elder, London
    year: 1885
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/996
- rung: gb19.twain-huckleberry-finn
  year: 1884
  text: 'Huck Finn is a poor, uneducated boy, not a knight or a king. His heroism is quiet: he protects his friend Jim against what
    his whole society tells him. Twain makes a hero out of plain decency.'
- rung: gb20.shaw-saint-joan
  year: 1923
  text: Shaw's Joan of Arc is a farm girl who leads armies, crowns a king and is burned for heresy, then named a saint centuries later.
    Shaw presents her as a person of genius and common sense whom the powers of her day could not understand.
  quote:
    text: She is the most notable Warrior Saint in the Christian calendar, and the queerest fish among the eccentric worthies of the
      Middle Ages.
    author: Shaw
    work: Saint Joan, Preface
    tr: ''
    ed: Brentano's, New York
    year: 1924
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/76323
young:
- A hero is someone who does something brave or good, often for others. Some heroes are strong, like Achilles. Some are clever, like
  Odysseus. Some are loyal, kind or honest.
- You don't need a sword to be a hero! Huck Finn was a hero because he stood by his friend. Who are the heroes in your life?
talk:
- Who is your favorite hero from a story? Why?
- Achilles was strong but proud. Can a hero have faults?
- Don Quixote thought windmills were giants. Is he a hero or a fool, or both?
- What makes an everyday hero?
- Would you rather be strong like Achilles or clever like Odysseus?
