#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: time
question: What is time? Did the world have a beginning, and why does time feel so different at different moments?
stops:
- rung: gbgreeks.plato-timaeus
  year: -360
  text: Plato calls time a moving image of eternity. The maker set the sun, moon and planets moving so that their regular cycles would
    measure days, months and years. Time and the heavens began together.
- rung: gbgreeks.aristotle-physics
  year: -350
  text: Aristotle defines time as the number of motion with respect to before and after. Without change, we would not notice time passing.
    He held that time and motion have no beginning and no end.
- rung: gbrome.augustine-confessions
  year: 398
  text: Augustine famously says he knows what time is until someone asks him. The past is no longer and the future not yet, so where
    is time? He concludes that time lives in the mind as memory, attention and expectation, and that God created time along with the
    world.
- rung: gbmiddle.aquinas-on-god
  year: 1268
  text: Aquinas asks whether the world always existed. He argues that reason alone cannot prove either answer, so the question can't
    be settled by philosophy. He believed, by faith, that the world had a beginning.
- rung: gbren.shakespeare-sonnets
  year: 1609
  text: Shakespeare's sonnets battle devouring Time, which wrinkles faces and topples monuments. Their answer is love and poetry, which
    can outlast it. The lines still live, as he promised.
  quote:
    text: 'Rough winds do shake the darling buds of May, And summer''s lease hath all too short a date: ...'
    author: William Shakespeare
    work: Sonnet 18
    tr: ''
    ed: Shake-speares Sonnets, London
    year: 1609
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1041
- rung: gb18.kant-critique-of-pure-reason
  year: 1781
  text: Kant argues that time is not a thing out in the world but a form of our own experience. We can't experience anything except
    in time. He also shows that reason gets tangled when it asks whether the world had a beginning in time.
- rung: gb20.bergson-introduction-to-metaphysics
  year: 1903
  text: Bergson separates clock time, cut into equal pieces, from lived time, which flows and builds up like a melody. Science measures
    the first, he says, but we know the second from inside, by intuition.
  quote:
    text: The first implies that we move round the object; the second that we enter into it.
    author: Henri Bergson
    work: An Introduction to Metaphysics
    tr: T. E. Hulme
    ed: G. P. Putnam's Sons, New York and London
    year: 1912
    src: Internet Archive
    url: https://archive.org/details/anintroductiont00berggoog
- rung: gb20.proust-swann-in-love
  year: 1913
  text: Proust writes about time lost and found. In Swann in Love, a phrase of music is tied to a season of feeling that Swann later
    meets again. Memory, for Proust, can bring the past back whole.
  quote:
    text: For a long time I used to go to bed early.
    author: Proust
    work: Swann's Way, Overture
    tr: C. K. Scott Moncrieff
    ed: Swann's Way (Henry Holt and Company, New York)
    year: 1922
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/7178
- rung: gb20.einstein-relativity
  year: 1916
  text: Einstein shows that time is not the same for everyone. Two events that are simultaneous for one observer may not be for another
    moving past. Clocks that move run slow, which has since been measured with precise clocks on airplanes and satellites.
  quote:
    text: Every reference-body (co-ordinate system) has its own particular time; unless we are told the reference-body to which the
      statement of time refers, there is no meaning in a statement of the time of an event.
    author: Albert Einstein
    work: Relativity, Part I, Section IX, The Relativity of Simultaneity
    tr: Robert W. Lawson
    ed: Methuen
    year: 1920
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/36114
- rung: gb20.woolf-to-the-lighthouse
  year: 1927
  text: In the middle part of To the Lighthouse, called Time Passes, ten years go by in a few pages while an empty house slowly decays.
    The rest of the novel stretches single days across many pages. Woolf shows how differently time feels from outside and inside.
young:
- 'Time is what clocks measure: seconds, minutes, days. But time feels different at different moments. Waiting for your birthday feels
  so slow, and a fun afternoon zips by!'
- 'Augustine said he knew what time was until someone asked him to explain it. Try it yourself: can you say what time is without using
  the word ''time''?'
talk:
- When does time feel slow for you? When does it feel fast?
- Augustine says the past lives in memory and the future in expectation. What do you think?
- If you could visit any time in the past, when would you go?
- Einstein said moving clocks run slow. Does that surprise you?
- Shakespeare hoped his poems would beat time. What do you hope will last?
