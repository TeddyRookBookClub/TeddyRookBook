# Great Books Ladder: the Great Idea "reading", followed through the books (page: /great-books/ideas/reading/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
#   question: one or two plain sentences.  intro: optional.  stances: optional [{key, label}] (colors the timeline; only where views divide cleanly)
#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: reading
question: How should we read, and why do books matter?
stops:
- rung: gbgreeks.plato-symposium-phaedrus
  year: -370
  work: Phaedrus
  text: Plato has Socrates worry about writing. A written page can't answer your questions, he says; it just says the same thing over
    and over. Real learning happens in living conversation. Ironically, we know this only because Plato wrote it down.
  quote:
    text: I cannot help feeling, Phaedrus, that writing is unfortunately like painting; for the creations of the painter have the attitude
      of life, and yet if you ask them a question they preserve a solemn silence.
    author: Plato
    work: Phaedrus 275d
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. I, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0001
- rung: gbrome.augustine-confessions
  year: 398
  text: Augustine was amazed to see Bishop Ambrose reading silently, his eyes moving and his lips still, since most people read aloud.
    Later, a child's voice singing 'take up and read' leads him to open a book that changes his life. Reading, for him, can be a turning
    point.
  quote:
    text: I heard from a neighbouring house a voice, as of boy or girl, I know not, chanting, and oft repeating, “Take up and read;
    author: Augustine
    work: Confessions, Book VIII, chapter 12
    tr: E. B. Pusey
    ed: A Library of Fathers of the Holy Catholic Church, John Henry Parker, Oxford
    year: 1838
    src: Internet Archive
    url: https://archive.org/details/confessionsofsau01augu
- rung: gbren.montaigne-essays
  year: 1580
  text: Montaigne reads for pleasure and for wisdom, and skips books that bore him. He borrows from the ancient writers freely but makes
    the ideas his own. His essays are a record of a reader thinking back at his books.
- rung: gbren.cervantes-don-quixote-1
  year: 1605
  text: Don Quixote reads so many tales of knights that he loses his grip on reality. Cervantes makes fun of bad books and of reading
    without judgment. Yet his book is also a love letter to stories and their power.
- rung: gbstart.how-to-read-a-great-book
  year: 1625
  who: Francis Bacon
  work: Of Studies (Essays)
  when: 1625 (Essays, final edition)
  text: Bacon says some books are to be tasted, others swallowed and a few chewed and digested. We should read neither to argue nor
    to accept everything, but to weigh and consider. His essay is quoted on our opening rung on how to read.
  quote:
    text: Read not to contradict and confute; nor to believe and take for granted; nor to find talk and discourse; but to weigh and
      consider.
    author: Francis Bacon
    work: Essays, "Of Studies"
    tr: ''
    ed: 1625 text, as printed in The Harvard Classics, vol. 3, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/Harvard-Classics/003_Harvard_Classics
- rung: gb17.milton-areopagitica-and-poems
  year: 1644
  text: Milton calls a good book the precious lifeblood of a master spirit. To destroy one, he says, is almost like killing a person.
    Readers, not censors, should judge books.
  quote:
    text: Who kills a man kills a reasonable creature, God's image; but he who destroys a good book, kills reason itself, kills the
      image of God, as it were in the eye.
    author: John Milton
    work: Areopagitica
    tr: ''
    ed: printed in London; Project Gutenberg text
    year: 1644
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/608
- rung: gbstart.syntopicon-and-adler
  year: 1952
  who: Mortimer J. Adler
  work: How to Read a Book (1940) and the Syntopicon (1952)
  when: 1940; 1952
  text: 'Mortimer Adler wrote a popular guide to reading actively: asking what a book says, whether it is true and what it means for
    you. He then helped build the Syntopicon, an index that lets readers compare what many great books say on one idea. These Great
    Ideas pages, in our own words, grew from his idea of reading books in conversation with each other.'
young:
- Books let us meet people who lived long ago and far away, and hear what they thought. Reading is a bit like time travel!
- 'Good readers ask questions as they read: What is happening? Why did that character do that? Do I agree? Try reading a story with
  a grown-up and stopping to ask questions along the way.'
talk:
- What is your favorite book? Why?
- Plato said books can't answer back. How can we 'talk' with a book?
- Bacon says some books should be tasted and some chewed. Which book would you chew slowly?
- Don Quixote believed everything in his books. Why is it important to read with judgment?
- What book would you save if you could only keep one?
