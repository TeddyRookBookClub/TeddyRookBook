key: doubt
question: How much can we be sure of? Is doubt a danger, or the first step toward knowing?
stops:
- rung: gbgreeks.plato-trial-of-socrates
  year: -399
  work: Apology
  text: At his trial Socrates explains that the oracle at Delphi called him the wisest man in Athens. Puzzled, he questioned people
    famous for wisdom and found they didn't know what they thought they knew. His only wisdom, he concluded, was knowing that he did
    not know.
- rung: gbren.montaigne-essays
  year: 1580
  text: Montaigne took as his motto the question 'What do I know?' He piles up examples of how customs, opinions and even the senses
    differ from place to place. His doubt makes him modest and tolerant, and he still lives and writes with great enjoyment.
- rung: gbren.shakespeare-hamlet
  year: 1600
  text: Hamlet doubts the ghost, his mother, his friends and himself. He stages a play to test whether his uncle is guilty. Shakespeare
    shows doubt as both a mark of a thoughtful mind and a trap that can freeze a person from acting.
- rung: gb17.bacon-advancement-of-learning
  year: 1605
  text: Bacon says hasty certainty is the enemy of learning. If we start with certainties we end in doubts, but if we are willing to
    start with doubts, careful inquiry can lead to certainty. Doubt, used well, is a tool.
  quote:
    text: 'So it is in contemplation: if a man will begin with certainties, he shall end in doubts; but if he will be content to begin
      with doubts, he shall end in certainties.'
    author: Francis Bacon
    work: The Advancement of Learning, First Book, V.8
    tr: ''
    ed: ed. Henry Morley, Cassell's National Library, Cassell & Company
    year: 1893
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/5500
- rung: gb17.descartes-meditations
  year: 1641
  text: Descartes doubts on purpose, as far as doubt can go. He imagines a powerful deceiver making him wrong about everything. Yet
    even then, he says, he must exist in order to be deceived, and that certainty becomes his starting point.
  quote:
    text: I will suppose, then, not that Deity, who is sovereignly good and the fountain of truth, but that some malignant demon, who
      is at once exceedingly potent and deceitful, has employed all his artifice to deceive me…
    author: René Descartes
    work: Meditations, I
    tr: John Veitch
    ed: Descartes' Meditations and Selections from the Principles of Philosophy, Open Court
    year: 1913
    src: Internet Archive
    url: https://archive.org/details/meditationsselec00desc
- rung: gb18.hume-enquiry
  year: 1748
  text: Hume finds that we cannot prove by reason that the future will be like the past, or even see causes at work. But he does not
    think we should doubt everything. Nature makes us go on believing, and he recommends a mild, modest doubt that keeps us careful.
- rung: gb20.poincare-science-and-hypothesis
  year: 1902
  text: 'Poincaré warns against two lazy habits: doubting everything and believing everything. Both, he says, save us the trouble of
    thinking. Science needs careful judgment about which parts of a theory are facts, which are conventions and which are guesses.'
  quote:
    text: To doubt everything or to believe everything are two equally convenient solutions; both dispense with the necessity of reflection.
    author: Henri Poincaré
    work: Science and Hypothesis, Author’s Preface
    tr: W. J. Greenstreet
    ed: Walter Scott Publishing
    year: 1905
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/37157
- rung: gb20.russell-problems-of-philosophy
  year: 1912
  text: 'Russell starts with a table: it looks different from every angle and in every light, so what is the real table? Philosophy
    may not settle such questions, he says, but it frees us from the tyranny of custom and widens our sense of what is possible.'
  quote:
    text: Is there any knowledge in the world which is so certain that no reasonable man could doubt it?
    author: Bertrand Russell
    work: The Problems of Philosophy, Chapter I
    tr: ''
    ed: Williams and Norgate, London (Home University Library)
    year: 1912
    src: Internet Archive
    url: https://archive.org/details/problemsofphilos1912russ
young:
- To doubt is to wonder if something is really true. It's good to doubt a little. If a stranger online says a magic pill will make you
  fly, you should doubt it!
- But you can't doubt everything, or you'd never do anything. Good thinkers ask questions, check the evidence and then decide. Socrates
  said the first step to being wise is knowing what you don't know.
talk:
- What is something you used to believe and now doubt?
- Socrates said he was wise because he knew he didn't know. What did he mean?
- Is there anything you are completely sure of? How do you know?
- When does doubting help you? When does it get in the way?
- Poincaré says believing everything and doubting everything are both lazy. Do you agree?
