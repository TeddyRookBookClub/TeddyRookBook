key: duty
question: What do we owe to others, to our country and to God? And how do we know what we ought to do?
stops:
- rung: gbgreeks.sophocles-oedipus
  year: -441
  work: Antigone
  text: Antigone's brother has died fighting against his own city, and King Creon forbids anyone to bury him. Antigone buries him anyway.
    She says there are unwritten laws from the gods that no ruler can cancel, and Sophocles lets both her duty to family and Creon's
    duty to the city speak strongly.
  quote:
    text: Nor did I think that your decrees were of such force, that a mortal could override the unwritten and unfailing statutes given
      us by the gods.
    author: Sophocles
    work: Antigone
    tr: Richard C. Jebb
    ed: Cambridge University Press
    year: 1891
    src: Perseus Digital Library (Perseids)
    url: https://cts.perseids.org/read/greekLit/tlg0011/tlg002/perseus-eng2/448-470
- rung: gbgreeks.plato-trial-of-socrates
  year: -399
  work: Crito
  text: 'In prison, Socrates'' friend Crito begs him to escape. Socrates refuses. He imagines the laws of Athens speaking to him: he
    has lived under them all his life, so breaking them now would be a wrong, and he holds that one must never do wrong, even in return
    for a wrong.'
  quote:
    text: that not life, but a good life, is to be chiefly valued?
    author: Plato
    work: Crito 48b
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. II, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0002
- rung: gbrome.virgil-aeneid
  year: -19
  text: 'Aeneas is famous for pietas: duty to his father, his son, his people and the gods. He carries his old father out of burning
    Troy on his shoulders. Later he leaves Queen Dido, whom he loves, because the gods call him to found a new home in Italy, and Virgil
    makes us feel the cost.'
  quote:
    text: Whate’er befalls, your life shall be my care;
    author: Virgil
    work: The Aeneid, Book 2
    tr: John Dryden
    ed: The Harvard Classics, vol. 13, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/virgilsaeneid0000virg
- rung: gbrome.marcus-aurelius-meditations
  year: 175
  text: The emperor Marcus Aurelius wrote notes to himself about doing his work well. Each morning he reminds himself that he will meet
    rude and ungrateful people, but that they are his kin and he must not be angry. People are made to work together, he says, as hands
    and feet do.
  quote:
    text: For we are made for co-operation, like feet, like hands, like eyelids, like the rows of the upper and lower teeth.
    author: Marcus Aurelius
    work: Meditations, Book II, section 1
    tr: George Long
    ed: The Chesterfield Society, London and New York
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/meditationsofemp00marcuoft
- rung: gbren.shakespeare-hamlet
  year: 1600
  text: 'Hamlet''s father''s ghost tells him to avenge a murder. Hamlet is unsure: is the ghost telling the truth, and is revenge right?
    The play shows a young man torn between a duty laid on him and his own doubts and conscience.'
  quote:
    text: O cursed spite, That ever I was born to set it right.
    author: William Shakespeare
    work: Hamlet, Act I, scene 5 (Hamlet)
    tr: ''
    ed: First printed in quarto
    year: 1604
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1524
- rung: gb18.kant-moral-philosophy
  year: 1785
  text: 'Kant argues that a duty binds everyone, whatever they happen to want. His test: act only on a rule you could will everyone
    to follow. He adds that we must treat every person as an end, never merely as a tool.'
  quote:
    text: Act only on that maxim whereby thou canst at the same time will that it should become a universal law.
    author: Immanuel Kant
    work: Fundamental Principles, Second Section
    tr: Thomas Kingsmill Abbott
    ed: Kant's Critique of Practical Reason and Other Works on the Theory of Ethics, 4th edition, Longmans, Green, London
    year: 1889
    src: Internet Archive
    url: https://archive.org/details/critiquepractic00kantuoft
- rung: gb19.kierkegaard-fear-and-trembling
  year: 1843
  text: 'Kierkegaard retells the Bible story of Abraham, asked by God to give up his son Isaac. He asks whether a duty to God could
    ever stand above ordinary moral duty. He does not make it easy: he says he admires Abraham''s faith but cannot understand it, and
    he wants readers to feel how hard the question is.'
- rung: gb19.twain-huckleberry-finn
  year: 1884
  text: Huck's conscience, trained by his society, tells him it is his duty to turn Jim in. His heart tells him to protect his friend.
    Twain shows that conscience can be taught wrong, and Huck chooses the better way while believing he is doing wrong.
young:
- A duty is something you ought to do, even if you don't feel like it. Feeding your pet, helping at home and keeping a promise are duties.
- Sometimes duties pull in different directions. Should you keep a secret for a friend, or tell a grown-up because your friend might
  get hurt? The great books are full of people trying to find the right thing to do when two duties clash.
talk:
- What duties do you have at home? At school?
- Antigone chose her family over the king's law. Was she right? What would Creon say?
- 'Kant says: only do what you would be okay with everyone doing. Try his test on telling a small lie.'
- Huck's conscience told him the wrong thing. How can we tell if our conscience is right?
- Can a promise ever be broken for a good reason?
