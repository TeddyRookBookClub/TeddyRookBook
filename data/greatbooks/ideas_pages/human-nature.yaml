key: human-nature
question: What is a human being? What sets us apart from other animals, and are we good or selfish at heart?
stops:
- rung: gbgreeks.sophocles-oedipus
  year: -441
  work: Antigone
  text: 'A chorus in Antigone sings of human wonder: people sail the seas, plow the land, tame horses, invent speech and build cities.
    Only death defeats them. But the song warns that this cleverness can serve good or evil.'
  quote:
    text: Wonders are many, and none is more wonderful than man.
    author: Sophocles
    work: Antigone
    tr: Richard C. Jebb
    ed: Cambridge University Press
    year: 1891
    src: Perseus Digital Library (Perseids)
    url: https://cts.perseids.org/read/greekLit/tlg0011/tlg002/perseus-eng2/332-390
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle says humans are the animal with reason and speech, made to live in communities and talk about what is just. Bees and
    cattle live in groups too, but only humans argue about good and bad.
- rung: gbren.machiavelli-the-prince
  year: 1513
  text: Machiavelli writes that, in general, people are ungrateful, changeable and eager for gain. A prince who counts on their goodness
    will fail. Whether he meant it as a full picture of human nature or a working rule for rulers is debated.
- rung: gbren.montaigne-essays
  year: 1580
  text: Montaigne studies human nature by studying himself, in all his changing moods. He finds people inconsistent, often foolish and
    not so different from animals. His honesty about it makes him kind toward others.
  quote:
    text: 'Thus, reader, myself am the matter of my book: there''s no reason thou shouldst employ thy leisure about so frivolous and
      vain a subject.'
    author: Montaigne
    work: Essays, "The Author to the Reader" (1580)
    tr: Charles Cotton, revised by William Carew Hazlitt
    ed: Reeves and Turner, London
    year: 1877
    src: HyperEssays
    url: https://hyperessays.net/cotton/book/fm/chapter/1/
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes paints people as driven by desire and fear, each seeking their own good. Without a government to keep order, they would
    live in constant fear of one another. His view is not that people are wicked, but that they need peace and rules.
- rung: gb17.pascal-pensees
  year: 1670
  text: 'Pascal says a human being is both great and wretched: weak as a reed but able to think about the whole universe. That mix of
    greatness and misery is, for him, the key puzzle of human nature.'
  quote:
    text: Man is but a reed, the most feeble thing in nature; but he is a thinking reed.
    author: Blaise Pascal
    work: Pensées, 347
    tr: W. F. Trotter
    ed: The Harvard Classics, vol. 48, P. F. Collier & Son
    year: 1910
    src: Christian Classics Ethereal Library
    url: https://ccel.org/ccel/pascal/pensees.vii.html
- rung: gb18.swift-gullivers-travels
  year: 1726
  text: In the last voyage, Gulliver meets wise, calm horses and filthy, greedy creatures that look like people. He comes home so disgusted
    with humankind that he prefers his horses. Swift's satire asks whether people live up to the name of reasoning animals.
- rung: gb18.rousseau-discourses
  year: 1755
  text: Rousseau answers Hobbes. He imagines early people as simple, peaceful and kind, and blames society, property and competition
    for making them vain and cruel. Critics replied that his picture of natural goodness was a guess.
- rung: gb19.darwin-descent-of-man
  year: 1871
  text: Darwin argues that humans share ancestors with other animals and differ from them in degree, not kind. Yet he names the moral
    sense as the most important human trait, one that leads people to risk their lives for others.
  quote:
    text: It is the most noble of all the attributes of man, leading him without a moment's hesitation to risk his life for that of
      a fellow-creature ...
    author: Darwin
    work: The Descent of Man, Chapter IV
    tr: ''
    ed: John Murray, London (first edition)
    year: 1871
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/thedescentofmana34967gut
- rung: gb20.freud-later-works
  year: 1917
  text: Freud claims that people are moved by unconscious wishes far more than they realize. He calls this a blow to human pride, like
    the discoveries of Copernicus and Darwin. Many of his theories are now doubted, but the debate he started about hidden motives continues.
  quote:
    text: But the third and most irritating insult is flung at the human mania of greatness by present-day psychological research, which
      wants to prove to the "I" that it is not even master in its own home.
    author: Sigmund Freud
    work: A General Introduction to Psychoanalysis, Lecture XVIII
    tr: anonymous, with a preface by G. Stanley Hall
    ed: Boni and Liveright, New York
    year: 1920
    src: Internet Archive
    url: https://archive.org/details/generalintroduct1920freu
young:
- What makes people people? We can talk, laugh, make up stories, build things and ask big questions like this one. Other animals are
  amazing too, but they don't write books!
- The great writers argue about whether people are good at heart or selfish at heart. Some say we're born kind, some say we need rules
  to be good, and many say we're a mix. What do you think?
talk:
- What can people do that no other animal can?
- Are people mostly kind or mostly selfish? Give examples.
- Pascal says we are weak like a reed but can think. Why does thinking make us great?
- Hobbes and Rousseau disagree about people without rules. What would happen at recess with no rules?
- What do people share with animals?
