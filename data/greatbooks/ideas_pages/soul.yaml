# Great Books Ladder: the Great Idea "soul", followed through the books (page: /great-books/ideas/soul/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
#   question: one or two plain sentences.  intro: optional.  stances: optional [{key, label}] (colors the timeline; only where views divide cleanly)
#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: soul
question: What is a soul? Is it something separate from the body, and does anything of us last after death?
intro: The authors disagree, and many families hold beliefs of their own. Each stop gives the author's own view.
stances:
- key: lives
  label: The soul lives on after death
- key: ends
  label: The soul ends with the body
stance_note: Uncolored stops take a different or more cautious line.
stops:
- rung: gbgreeks.plato-phaedo
  year: -380
  stance: lives
  text: 'On his last day, Socrates gives his friends arguments that the soul is immortal: it is like the unchanging truths it knows,
    and it gives life to the body as fire gives heat. His friends raise objections, and he answers them calmly. Then he drinks the poison
    without fear.'
  quote:
    text: Are not all things which have opposites generated out of their opposites?
    author: Plato
    work: Phaedo 70e
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. II, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0002
- rung: gbgreeks.aristotle-on-the-soul
  year: -350
  text: 'Aristotle defines the soul as the life of a natural body: what an eye''s seeing is to the eye. Plants, animals and people all
    have souls, with different powers. Whether any part of the soul, such as the intellect, can exist apart from the body, he leaves
    unclear, and readers still argue about it.'
  quote:
    text: For if the eye were an animal, vision would be its soul, i.e. vision is the notional essence of the eye.
    author: Aristotle
    work: On the Soul II.1, 412b
    tr: William Alexander Hammond
    ed: Aristotle's Psychology, Swan Sonnenschein
    year: 1902
    src: Internet Archive
    url: https://archive.org/details/aristotlespsycho00aris
- rung: gbrome.lucretius-on-the-nature-of-things
  year: -55
  stance: ends
  text: Lucretius argues that the soul is made of very fine atoms spread through the body. It grows and weakens with the body, and scatters
    at death. That, he says, is why death is nothing to fear.
- rung: gbrome.plotinus-enneads
  year: 260
  stance: lives
  text: Plotinus teaches that the soul comes from a higher world and is not truly at home in the body. By turning inward, it can rise
    toward Mind and the One. His student wrote that he seemed ashamed to be in a body.
  quote:
    text: Is it not enough to carry about this image in which nature has enclosed us?
    author: Porphyry
    work: Life of Plotinus, chapter 1 (Plotinus, refusing to sit for a portrait)
    tr: Stephen MacKenna
    ed: Philip Lee Warner, publisher to the Medici Society, London
    year: 1917
    src: Internet Archive
    url: https://archive.org/details/plotinusethicalt01plotuoft
- rung: gbmiddle.aquinas-on-god
  year: 1268
  stance: lives
  text: Aquinas combines Aristotle with Christian teaching. The soul is the form of the body, so a human being is one creature, not
    a soul trapped inside. Yet because the soul can think, which no bodily organ does by itself, he argues it survives death.
- rung: gb17.descartes-meditations
  year: 1641
  stance: lives
  text: Descartes argues that the mind is a thinking thing quite distinct from the body, which is extended in space. He hoped this would
    support belief in the soul's immortality. How two such different things work together became one of philosophy's hardest puzzles.
- rung: gb19.james-principles-of-psychology
  year: 1890
  text: William James writes as a scientist. He says psychology can study thoughts and feelings and their ties to the brain without
    needing the idea of a soul to explain them. He adds that this leaves the question of a soul open for philosophy and religion.
young:
- 'Many people believe each person has a soul: the deepest part of you that thinks, loves and chooses. Some believe the soul lives on
  after the body dies. Others believe differently.'
- The great thinkers argued about the soul for thousands of years. Plato said it lives forever. Aristotle said it is what makes a body
  alive, like the seeing in an eye. Your family can share what you believe.
talk:
- What do you think makes you you?
- Aristotle said the soul of an eye would be seeing. What would the soul of a hand be?
- Why do you think Socrates was calm on his last day?
- Do animals and plants have souls, as Aristotle thought? What would that mean?
