key: power
question: How do rulers gain and keep power? What makes power rightful, and how can it be kept in check?
stops:
- rung: gbgreeks.thucydides-peloponnesian-war
  year: -431
  text: Thucydides says the deepest cause of the great war between Athens and Sparta was the growth of Athenian power and the fear it
    caused in Sparta. Again and again he shows how power, fear and honor push states to act. He hoped his history would help later readers
    understand such times.
- rung: gbrome.tacitus-annals-histories
  year: 110
  text: Tacitus writes the history of the early Roman emperors. He shows how one-man rule bred flattery, fear and spying, and how even
    histories were bent by those in power. He promises to write without anger or favor.
  quote:
    text: The histories of Tiberius, Caius, Claudius, and Nero, while they were in power, were falsified through terror, and after their
      death were written under the irritation of a recent hatred.
    author: Tacitus
    work: Annals, Book I, chapter 1
    tr: Alfred John Church and William Jackson Brodribb
    ed: Macmillan and Co.
    year: 1884
    src: Internet Archive
    url: https://archive.org/details/annalstranslated00taci
- rung: gbren.machiavelli-the-prince
  year: 1513
  text: Machiavelli writes a guide for a new prince. He asks whether it is better to be loved or feared and answers that it is safer
    to be feared, if one cannot be both, though a prince must avoid being hated. Some readers see a cold handbook for tyrants, others
    a warning or a plain report of how politics works.
  quote:
    text: 'Upon this a question arises: whether it be better to be loved than feared or feared than loved?'
    author: Machiavelli
    work: The Prince, Chapter XVII
    tr: W. K. Marriott
    ed: J. M. Dent, London
    year: 1908
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1232
- rung: gbren.shakespeare-julius-caesar
  year: 1599
  text: In Julius Caesar, Brutus joins the plot against Caesar out of fear that Caesar will become a king. Then Mark Antony turns the
    crowd with one speech. Shakespeare shows the power of words, and how quickly power slips from those who think they hold it.
  quote:
    text: Friends, Romans, countrymen, lend me your ears;
    author: William Shakespeare
    work: Julius Caesar, Act III, scene 2 (Mark Antony)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1522
- rung: gb17.hobbes-leviathan
  year: 1651
  text: Hobbes argues that without a power over everyone, life would be a war of each against all. People agree to give up their right
    to rule themselves to a sovereign who keeps the peace. He thought that power should be very great and undivided, since a divided
    power leads to civil war.
- rung: gb18.montesquieu-spirit-of-laws
  year: 1748
  text: 'Montesquieu argues that anyone with power tends to abuse it. So liberty needs power to be divided: one body makes the laws,
    another carries them out and another judges. Each can then check the others.'
  quote:
    text: To prevent this abuse, it is necessary from the very nature of things that power should be a check to power.
    author: Montesquieu
    work: Book XI, ch. 4
    tr: Thomas Nugent
    ed: The Spirit of Laws, revised edition, Colonial Press, New York
    year: 1900
    src: Internet Archive
    url: https://archive.org/details/spiritoflawsincl01mont
- rung: gb18.federalist-papers
  year: 1788
  text: Writing to defend the new Constitution, James Madison accepts that people are not angels. So government must be given enough
    power to govern, and then be made to control itself. Separate branches, each with ways to resist the others, set ambition against
    ambition.
  quote:
    text: If men were angels, no government would be necessary.
    author: Publius (Hamilton, Madison and Jay)
    work: Federalist No. 51 (Madison)
    tr: ''
    ed: The Federalist Papers (Project Gutenberg text)
    year: 1788
    src: Internet Archive
    url: https://archive.org/details/thefederalistpap01404gut
- rung: gb20.orwell-animal-farm
  year: 1945
  text: Orwell's animal fable shows a revolution in which the new leaders become as bad as the old ones. The pigs use fear, lies and
    changed slogans to keep their power. Orwell meant it as a warning about how power can corrupt any cause.
young:
- Power is being able to make things happen or make people do things. A team captain, a teacher and a president all have some power.
- 'Power can help people, like a lifeguard keeping swimmers safe. But it can also be misused, like a bully on the playground. That''s
  why many writers say power should have limits: the captain must follow the rules of the game too.'
talk:
- Is it better for a leader to be loved or feared? Why?
- Why do you think the U.S. government has three branches?
- Who has power over you? Who do you have power over, like a younger sibling or a pet?
- Mark Antony changed a crowd's mind with a speech. Can words be a kind of power?
- What stops a leader from becoming a bully?
