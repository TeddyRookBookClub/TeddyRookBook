key: electricity
question: What are magnetism and electricity, and how did people find out they are connected?
stops:
- rung: gbrome.lucretius-on-the-nature-of-things
  year: -55
  text: Lucretius tries to explain the magnet, a stone that pulls iron, using atoms. He suggests that streams of atoms flowing from
    the stone clear a space, and iron atoms rush in. The explanation was wrong, but it treated magnetism as natural, not magic.
- rung: gbrome.galen-on-the-natural-faculties
  year: 180
  text: Galen uses the lodestone as a comparison. Just as the stone draws iron, he argues, the organs of the body draw to themselves
    what they need. He believed living bodies have attractive powers like the magnet's.
  quote:
    text: It has to do with the famous and far-renowned stone which draws iron [the lodestone].
    author: Galen
    work: On the Natural Faculties, Book I, 14
    tr: Arthur John Brock
    ed: Loeb Classical Library, Heinemann and Putnam
    year: 1916
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/43383
- rung: gb17.gilbert-on-the-loadstone
  year: 1600
  text: Gilbert tested old claims with experiments, and threw out myths such as that garlic stops a magnet. Using a small round magnet
    as a model, he showed the earth itself is a great magnet, which is why compasses point north. He also studied how rubbed amber attracts
    things, and his Latin word electricus gave English the word electric.
  quote:
    text: 'Hence some suspect that garlick is of avail against any deleterious power of the magnet: thus in philosophy many false and
      idle conjectures arise from fables and falsehoods.'
    author: William Gilbert
    work: On the Magnet, Book I, chapter 14
    tr: Silvanus P. Thompson and the Gilbert Club
    ed: Chiswick Press, London
    year: 1900
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/33810
- rung: gb19.faraday-experimental-researches
  year: 1832
  text: Faraday discovers that a changing magnetic field makes electric current flow in a wire. He pictures lines of force filling the
    space around magnets and currents. His discoveries are the basis of the electric generator and transformer.
  quote:
    text: When the contact was made, there was a sudden and very slight effect at the galvanometer, and there was also a similar slight
      effect when the contact with the battery was broken.
    author: Michael Faraday
    work: Experimental Researches in Electricity, First Series, paragraph 10
    tr: ''
    ed: Philosophical Transactions of the Royal Society of London, vol. 122
    year: 1832
    src: Internet Archive
    url: https://archive.org/details/philtrans01461252
- rung: gb20.einstein-relativity
  year: 1916
  text: Einstein's relativity grew partly from a puzzle in electricity and magnetism. Moving a magnet near a wire or a wire near a magnet
    gives the same current, yet the old theory described the two cases differently. Relativity shows that electricity and magnetism
    are two sides of one thing.
young:
- Magnets pull on iron and stick to the fridge. A compass needle is a little magnet that points north, because the whole earth is a
  giant magnet! William Gilbert figured that out over 400 years ago.
- 'Electricity is what lights your lamps. Michael Faraday found that moving a magnet near a coil of wire makes electricity. That''s
  how power stations make electricity today: spinning magnets and wires.'
talk:
- Rub a balloon on your hair. What happens when you hold it near small bits of paper?
- Gilbert tested whether garlic stops a magnet. Why was it important to test old claims?
- How does a compass work?
- What things in your home use electricity? What would life be like without it?
