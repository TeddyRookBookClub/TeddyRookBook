key: journeys
question: Why do so many great stories involve a journey? What do travelers find, and what do they bring home?
stops:
- rung: gbgreeks.homer-odyssey
  year: -725
  text: Odysseus takes ten years to sail home from Troy, facing monsters, storms and temptations. He escapes the Cyclops by calling
    himself 'Nobody.' The journey home is also a journey back to who he is.
  quote:
    text: Cyclops, you ask my name and I will tell it you; give me, therefore, the present you promised me; my name is Noman; this is
      what my father and mother and my friends have always called me.
    author: Homer
    work: The Odyssey, Book IX
    tr: Samuel Butler
    ed: Longmans, Green
    year: 1900
    src: The Internet Classics Archive (MIT)
    url: https://classics.mit.edu/Homer/odyssey.9.ix.html
- rung: gbrome.virgil-aeneid
  year: -19
  text: Aeneas journeys from fallen Troy to Italy to found a new home for his people. Unlike Odysseus, he can never go back. His journey
    is toward a future he will not live to see.
  quote:
    text: Long labors, both by sea and land, he bore, And in the doubtful war, before he won The Latian realm, and built the destin’d
      town;
    author: Virgil
    work: The Aeneid, Book 1, the opening
    tr: John Dryden
    ed: The Harvard Classics, vol. 13, P. F. Collier & Son
    year: 1909
    src: Internet Archive
    url: https://archive.org/details/virgilsaeneid0000virg
- rung: gbmiddle.dante-inferno
  year: 1310
  text: Dante finds himself lost in a dark wood in the middle of his life. Guided by the poet Virgil, he travels down through Hell,
    up the mountain of Purgatory and into Heaven. The journey is a picture of a soul's path from being lost to being found.
  quote:
    text: In the midway of this our mortal life, I found me in a gloomy wood, astray Gone from the path direct ...
    author: Dante
    work: Inferno, Canto I
    tr: Henry Francis Cary
    ed: The Vision, London
    year: 1814
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1005
- rung: gbmiddle.chaucer-canterbury-tales
  year: 1390
  text: Thirty pilgrims ride together from London to Canterbury in spring, telling stories to pass the time. The journey is real, holy
    and also lots of fun. Chaucer shows how a shared road brings very different people together.
  quote:
    text: Than longen folk to goon on pilgrimages ...
    author: Geoffrey Chaucer
    work: The Canterbury Tales, General Prologue, lines 1–2 and 12–18
    tr: ''
    ed: The Complete Works, ed. W. W. Skeat, Clarendon Press
    year: 1900
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/22120
- rung: gbren.cervantes-don-quixote-1
  year: 1605
  text: Don Quixote and Sancho Panza ride out across Spain looking for adventures. Each inn and road brings a new misunderstanding.
    Their wandering becomes a long conversation between a dreamer and a realist.
- rung: gb18.swift-gullivers-travels
  year: 1726
  text: Gulliver sails to lands of tiny people, giants, floating islands and talking horses. Each strange place is a mirror that shows
    the faults of England and of humankind. The journey makes him see home with new eyes, not all of them happy.
- rung: gb19.melville-moby-dick
  year: 1851
  text: Ishmael goes to sea whenever he feels gloomy. He joins the whaling ship Pequod, which sails around the world on Ahab's hunt.
    The voyage becomes a search for meaning in a vast, mysterious ocean.
  quote:
    text: Some years ago—never mind how long precisely—having little or no money in my purse, and nothing particular to interest me
      on shore, I thought I would sail about a little and see the watery part of the world.
    author: Melville
    work: Moby-Dick, Chapter 1, "Loomings"
    tr: ''
    ed: Harper and Brothers, New York (first American edition)
    year: 1851
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/mobydickorthewha02701gut
- rung: gb19.twain-huckleberry-finn
  year: 1884
  text: Huck and Jim float down the Mississippi on a raft, Huck escaping his father and Jim escaping slavery. The river is freedom and
    friendship; the towns on shore are full of cons and cruelty. At the end Huck plans to head west rather than be 'sivilized.'
- rung: gb20.conrad-heart-of-darkness
  year: 1899
  text: Marlow travels up a great African river to find a trader named Kurtz. The journey into the jungle becomes a journey into the
    darkness that greed and power can bring out in people. It is a story for older readers.
  quote:
    text: Going up that river was like traveling back to the earliest beginnings of the world, when vegetation rioted on the earth and
      the big trees were kings.
    author: Conrad
    work: Heart of Darkness, Part II
    tr: ''
    ed: 'Youth: A Narrative, and Two Other Stories (William Blackwood and Sons, Edinburgh and London)'
    year: 1902
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/219
young:
- 'Lots of great stories are about journeys: a hero leaves home, has adventures and comes back changed. Odysseus sailed for ten years
  to get home. Dante walked through the whole afterlife!'
- 'Journeys teach us things: about new places, about friends and about ourselves. Even a trip to a new park can be a little adventure.
  Draw a map of a journey you have taken, real or imagined.'
talk:
- What is the best trip you've ever taken? What did you learn?
- Why do so many stories have journeys in them?
- Odysseus wanted to go home. Aeneas could never go back. Which journey would be harder?
- If you could travel to one of Gulliver's lands, which would you pick?
- How does traveling change the way you see home?
