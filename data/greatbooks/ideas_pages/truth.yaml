key: truth
question: What does it mean for something to be true? And how do we find the truth when people disagree?
stops:
- rung: gbgreeks.plato-republic-cave
  year: -375
  text: For Plato, the truest things are the unchanging Forms, and the highest of them, the Good, is like the sun that lets us see everything
    else. Finding truth means turning the whole soul toward it. Opinions about changing things are only half true.
- rung: gbgreeks.aristotle-metaphysics
  year: -340
  text: 'Aristotle gives a plain account: to say of what is that it is, and of what is not that it is not, is true. He also defends
    the rule that a thing cannot both be and not be in the same respect at the same time. Without that rule, he says, no one could argue
    about anything.'
  quote:
    text: It is, that the same attribute cannot at the same time belong and not belong to the same subject and in the same respect…
    author: Aristotle
    work: Metaphysics IV.3, 1005b
    tr: W. D. Ross
    ed: The Works of Aristotle, vol. VIII, 2nd edition, Clarendon Press
    year: 1928
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0008wdro_h7t3
- rung: gbrome.augustine-on-christian-doctrine
  year: 397
  text: Augustine tells Christian readers not to fear the learning of pagan writers. Whatever is true, he says, comes from God, wherever
    it is found. He compares useful learning to treasure carried out of Egypt.
  quote:
    text: Let every good and true Christian understand that wherever truth may be found, it belongs to his Master.
    author: Augustine
    work: On Christian Doctrine, Book II, chapter 18
    tr: J. F. Shaw
    ed: A Select Library of the Nicene and Post-Nicene Fathers, vol. II, The Christian Literature Company, Buffalo
    year: 1887
    src: Internet Archive
    url: https://archive.org/details/cityofgodtrbymar0002augu
- rung: gb17.milton-areopagitica-and-poems
  year: 1644
  text: Milton argues that truth is strong enough to win in open argument. Licensing books before printing, he says, treats readers
    like children and keeps truth from growing. Truth needs to meet falsehood face to face.
- rung: gb19.mill-on-liberty
  year: 1859
  text: Mill adds that even when we are right, we need to hear the other side. A truth that is never challenged becomes a dead slogan
    instead of a living belief. And the silenced opinion might hold part of the truth we lack.
- rung: gb19.ibsen-plays
  year: 1884
  work: The Wild Duck
  text: In The Wild Duck, a young man is determined to reveal a family's hidden past, sure that truth will set them free. Instead it
    brings disaster. A cynical doctor says ordinary people need their comforting illusions, and Ibsen leaves the audience to weigh both
    sides.
  quote:
    text: Rob the average man of his life-illusion, and you rob him of his happiness at the same time.
    author: Ibsen
    work: The Wild Duck, Act V
    tr: Frances E. Archer
    ed: Ibsen's Prose Dramas, ed. William Archer (Walter Scott, London)
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/ibsensprosedrama02ibse
- rung: gb19.nietzsche-beyond-good-and-evil
  year: 1886
  text: Nietzsche asks why we want truth at all, and whether philosophers' systems are really personal confessions. He suspects that
    much of what passes for truth serves the needs of those who hold it. Readers still argue over whether he meant to reject truth or
    to demand a harder honesty about it.
  quote:
    text: It has gradually become clear to me what every great philosophy up till now has consisted of—namely, the confession of its
      originator, and a species of involuntary and unconscious auto-biography.
    author: Nietzsche
    work: Beyond Good and Evil, section 6
    tr: Helen Zimmern
    ed: T. N. Foulis, Edinburgh and London
    year: 1907
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/beyondgoodandevi04363gut
- rung: gb20.james-pragmatism
  year: 1907
  text: 'William James suggests a practical test: what difference would it make if an idea were true? True ideas, he says, are the ones
    we can check and that guide us well through experience. His critics answered that something can be useful and still be false.'
  quote:
    text: True ideas are those that we can assimilate, validate, corroborate and verify.
    author: William James
    work: Pragmatism, Lecture VI
    tr: ''
    ed: Longmans, Green, and Co., New York
    year: 1907
    src: Internet Archive
    url: https://archive.org/details/pragmatismanewn01jamegoog
- rung: gb20.russell-problems-of-philosophy
  year: 1912
  text: Russell answers James. A belief is true, he argues, when it matches the facts, and false when it doesn't, whatever it does for
    us. Truth depends on the world, not on what we would like.
young:
- Something is true when it matches how things really are. If you say 'it's raining' and it is raining, that's true. If it's sunny,
  it isn't.
- Finding the truth can be hard when people disagree. One good way is to listen to both sides, look at the evidence and be willing to
  change your mind. Milton thought truth wins if it gets a fair fight.
talk:
- How can you tell if something you hear is true?
- Mill says we should listen to people we disagree with. Why might that help us?
- Is it ever kind not to tell the truth? What does The Wild Duck suggest?
- James asks what difference a truth makes. Can something be true but make no difference?
- What is a time you changed your mind because of new facts?
