key: happiness
question: What makes a whole life go well? Is happiness pleasure, goodness, or something else?
stops:
- rung: gbgreeks.herodotus-histories
  year: -430
  text: Herodotus tells how the wise Athenian Solon visited the rich king Croesus. Croesus expected to be called the happiest of men,
    but Solon named ordinary people who had lived and died well. Wait until the end of a life, Solon warns, before you call it happy.
  quote:
    text: before he comes to his end it is well to hold back and not to call him yet happy but only fortunate.
    author: Herodotus
    work: The History, Book I
    tr: G. C. Macaulay
    ed: Macmillan
    year: 1890
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/2707
- rung: gbgreeks.aristotle-ethics
  year: -340
  text: 'Aristotle says everyone wants happiness, but people disagree about what it is: pleasure, honor or money. His answer is that
    happiness is a whole life of activity in keeping with virtue, with friends and enough good things around it. It is not a feeling
    that comes and goes but the shape of a life well lived.'
- rung: gbrome.epictetus-discourses
  year: 108
  text: 'Epictetus, a freed slave, teaches that happiness depends only on what is in our power: our own judgments and choices. Health,
    money and other people''s opinions are not in our power, so a wise person does not stake happiness on them. The Stoics agree with
    Aristotle that virtue matters most, but they say virtue alone is enough.'
  quote:
    text: Of things some are in our power, and others are not.
    author: Epictetus
    work: Encheiridion (Handbook), chapter 1
    tr: George Long
    ed: George Bell and Sons, London
    year: 1877
    src: Internet Archive
    url: https://archive.org/details/discoursesofepic00epicrich
- rung: gbrome.augustine-confessions
  year: 398
  text: Augustine looks back on years of chasing success and pleasure and says none of it gave him rest. He concludes that people are
    made for God and that only in God can the heart be at peace. Happiness, for him, is a gift found in loving the right things in the
    right order.
  quote:
    text: Thou awakest us to delight in Thy praise; for Thou madest us for Thyself, and our heart is restless, until it repose in Thee.
    author: Augustine
    work: Confessions, Book I, chapter 1
    tr: E. B. Pusey
    ed: A Library of Fathers of the Holy Catholic Church, John Henry Parker, Oxford
    year: 1838
    src: Internet Archive
    url: https://archive.org/details/confessionsofsau01augu
- rung: gbmiddle.aquinas-on-happiness-and-law
  year: 1270
  text: 'Aquinas works through the candidates one by one: wealth, honor, fame, power, bodily goods and pleasure. Each falls short of
    a complete good. He accepts much of Aristotle''s picture of happiness in this life but argues that perfect happiness lies only in
    knowing God.'
  quote:
    text: It is impossible for man's happiness to consist in wealth.
    author: Thomas Aquinas
    work: Summa Theologica, First Part of the Second Part, Question 2, Article 1
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/2002.htm
- rung: gb19.mill-utilitarianism
  year: 1863
  text: 'Mill holds that happiness is the goal of right action, and by happiness he means pleasure and freedom from pain. He answers
    the critics who call this a philosophy fit for pigs: some pleasures, such as those of the mind and of kindness, are higher than
    others. Those who have known both kinds, he says, prefer the higher.'
  quote:
    text: It is better to be a human being dissatisfied than a pig satisfied; better to be Socrates dissatisfied than a fool satisfied.
    author: Mill
    work: Utilitarianism, Chapter II
    tr: ''
    ed: Parker, Son and Bourn, London
    year: 1863
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/utilitarianism11224gut
- rung: gb19.tolstoy-war-and-peace
  year: 1869
  text: Tolstoy's characters look for happiness in glory, in society and in big ideas. Prince Andrei, lying wounded on a battlefield,
    suddenly sees the sky and feels how small his ambitions were. By the end of the novel, Pierre and others find a quieter happiness
    in family, work and simple days.
  quote:
    text: How was it I did not see that lofty sky before?
    author: Tolstoy
    work: War and Peace, Book Three, Chapter XVI
    tr: Louise and Aylmer Maude
    ed: Oxford University Press (World's Classics)
    year: 1922
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/warandpeace02600gut
- rung: gb20.chekhov-uncle-vanya
  year: 1897
  text: Chekhov shows people on a country estate who feel their lives have been wasted. He offers no big answer. At the end, Sonya tells
    her uncle that they will keep working, bear what they must, and hope for rest, and the play leaves us to judge whether that is despair
    or a kind of courage.
  quote:
    text: Yes, we shall live, Uncle Vanya.
    author: Chekhov
    work: Uncle Vanya, Act IV
    tr: Marian Fell
    ed: Plays by Anton Tchekoff (Charles Scribner's Sons, New York)
    year: 1912
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1756
young:
- 'What makes you happy? Maybe ice cream, a new game or a day at the beach. Those are good, but they don''t last long. The great books
  ask a bigger question: what makes a whole life happy, from start to finish?'
- Many of the writers say it is less about getting things and more about being a good person, having good friends and doing work you
  care about. Think of a grandparent who has had a long, kind life with a loving family. Many people would call that a happy life, even
  if it had hard days in it.
talk:
- Solon said you can't call someone happy until their life is over. What do you think he meant?
- Is being happy the same as having fun?
- Epictetus says to care most about what is in your power. What things in your day are in your power, and what things aren't?
- Mill says some pleasures are higher than others. Do you agree? Which ones?
- Who is the happiest person you know? What makes their life go well?
