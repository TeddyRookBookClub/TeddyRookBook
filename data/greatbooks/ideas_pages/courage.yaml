key: courage
question: What is courage? Is it having no fear, or doing what is right in spite of fear?
stops:
- rung: gbgreeks.homer-iliad
  year: -750
  text: 'In the Iliad, Hector knows that Achilles is stronger, and his family begs him to stay inside the walls of Troy. He goes out
    to face Achilles anyway, for the sake of his city and his honor. Homer shows courage mixed with fear: at first Hector even runs,
    then turns and stands.'
- rung: gbgreeks.plato-trial-of-socrates
  year: -399
  text: At his trial, Socrates refuses to beg or to stop doing philosophy, even to save his life. He compares himself to a soldier who
    must not leave his post. A good person, he says, should ask only whether an act is right or wrong, not whether it brings danger.
- rung: gbgreeks.plato-gorgias-protagoras
  year: -390
  work: Laches
  text: In the Laches, two Athenian generals try to define courage and fail. One says courage is standing firm in battle, but Socrates
    points out courage in sickness, poverty and the sea as well. They wonder whether courage is a kind of wisdom about what is truly
    worth fearing, and the dialogue ends without a final answer.
- rung: gbgreeks.aristotle-ethics
  year: -340
  text: 'Aristotle places courage between two faults: rashness, which fears too little, and cowardice, which fears too much. The brave
    person feels fear but faces it for a good reason and in the right way. Courage is a habit built by facing small fears first.'
- rung: gb19.melville-moby-dick
  year: 1851
  text: On the Pequod, first mate Starbuck is brave but sensible. He wants men in his boat who respect the danger of a whale, because
    fearless men are reckless. Melville sets his steady courage against Captain Ahab's wild daring.
  quote:
    text: '"I will have no man in my boat," said Starbuck, "who is not afraid of a whale."'
    author: Melville
    work: Moby-Dick, Chapter 26, "Knights and Squires"
    tr: ''
    ed: Harper and Brothers, New York (first American edition)
    year: 1851
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/mobydickorthewha02701gut
- rung: gb19.twain-huckleberry-finn
  year: 1884
  text: Huck's bravest moment is not a fight. He has written a letter that would send Jim back into slavery, and everything he has been
    taught says sending it is right. He tears it up, ready to take the blame, because he will not betray his friend.
  quote:
    text: I was a-trembling, because I'd got to decide, forever, betwixt two things, and I knowed it.
    author: Twain
    work: Adventures of Huckleberry Finn, Chapter XXXI
    tr: ''
    ed: Charles L. Webster and Company, New York
    year: 1885
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/theadventuresofh07106gut
- rung: gb20.shaw-saint-joan
  year: 1923
  text: Shaw's play shows Joan of Arc, a farm girl who leads armies and stands up to bishops and nobles. In the play she will not deny
    the voices she believes guide her, even at the cost of her life. Shaw presents her courage as coming from faith, plain good sense
    and a refusal to give in.
young:
- Courage doesn't mean you aren't scared. It means you do the right thing even when you are scared. A firefighter going into a burning
  house feels fear but goes in to help.
- 'There is everyday courage too: telling the truth when you might get in trouble, standing up for a kid who is being teased, or trying
  something new at school. Huck Finn was brave because he stood by his friend when it was hard.'
talk:
- Is someone who feels no fear brave, or just reckless? What does Starbuck think?
- Can you think of a time when telling the truth took courage?
- Socrates and Joan would not take back what they believed. When is it brave to stand firm, and when is it wiser to change your mind?
- Aristotle says courage grows by practice. What is a small brave thing you could practice?
- Who is someone you think is brave? What did they do?
