key: forgiveness
question: What do we do after someone does wrong? Can guilt be healed, and why forgive?
stops:
- rung: gbgreeks.aeschylus-oresteia
  year: -458
  work: The Eumenides
  text: Orestes is hunted by the Furies, spirits of revenge, for avenging his father. Athena's court acquits him, and she persuades
    the angry Furies to become kindly guardians of Athens. The trilogy ends not in punishment but in reconciliation.
- rung: gbrome.augustine-confessions
  year: 398
  text: Augustine tells the story of his own wrongdoing, starting with stealing pears as a boy just for the thrill of it. In a garden
    in Milan, weeping, he hears a child's voice say 'take up and read,' opens the Bible and finds peace. The whole book thanks God for
    forgiving him.
  quote:
    text: 'Take up and read.” Instantly, my countenance altered, I began to think most intently, whether children were wont in any kind
      of play to sing such words: nor could I remember ever to have heard the like.'
    author: Augustine
    work: Confessions, Book VIII, chapter 12
    tr: E. B. Pusey
    ed: A Library of Fathers of the Holy Catholic Church, John Henry Parker, Oxford
    year: 1838
    src: Internet Archive
    url: https://archive.org/details/confessionsofsau01augu
- rung: gbmiddle.dante-purgatorio
  year: 1312
  text: Dante's Purgatory is a mountain where forgiven souls are healed of their faults, one terrace at a time. Here, unlike in Hell,
    everyone is hopeful. Love, rightly ordered, is what they are learning.
  quote:
    text: And of that second region will I sing, In which the human spirit from sinful blot Is purg'd, and for ascent to Heaven prepares.
    author: Dante
    work: Purgatorio, Canto I
    tr: Henry Francis Cary
    ed: The Vision, London
    year: 1814
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1006
- rung: gbren.shakespeare-king-lear
  year: 1606
  text: King Lear banished his loyal daughter Cordelia. When they meet again, broken and humbled, he kneels and asks forgiveness. She
    says she has no cause to blame him, one of the most moving reconciliations in drama.
- rung: gbren.shakespeare-tempest
  year: 1611
  text: Prospero has his old enemies in his power at last. Instead of revenge, he chooses forgiveness, saying that virtue is a rarer
    action than vengeance. Then he gives up his magic.
  quote:
    text: 'Yet with my nobler reason ''gainst my fury Do I take part: the rarer action is In virtue than in vengeance: they being penitent,'
    author: William Shakespeare
    work: The Tempest, Act V, scene 1 (Prospero)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1540
- rung: gb19.austen-emma
  year: 1815
  text: Emma makes a cruel joke at Miss Bates's expense during a picnic. Mr. Knightley tells her how unkind it was, and she is ashamed.
    The next morning she visits Miss Bates to make amends, and Austen shows how a real apology begins to mend things.
- rung: gb19.goethe-faust
  year: 1832
  text: Faust does great harm in his bargain with the devil. Yet at the end of Part Two, angels carry his soul upward, because he never
    stopped striving and because of love, including that of Gretchen, whom he wronged. Goethe's ending has been argued over ever since.
  quote:
    text: Whoe'er aspires unweariedly Is not beyond redeeming.
    author: Goethe
    work: Faust, Part Two, Act V
    tr: Bayard Taylor
    ed: Houghton, Mifflin and Company, Boston (1882 printing)
    year: 1871
    src: Internet Archive
    url: https://archive.org/details/faustatragedy02taylgoog
- rung: gb19.dostoevsky-brothers-karamazov
  year: 1880
  text: The elder Zosima teaches that each person is responsible for all, and that love can forgive anything. He tells how, as a young
    officer, he struck his servant, then asked his forgiveness. Alyosha carries this teaching into the world.
  quote:
    text: Love all God's creation, the whole and every grain of sand in it.
    author: Dostoevsky
    work: The Brothers Karamazov, Book VI, Chapter III
    tr: Constance Garnett
    ed: William Heinemann, London
    year: 1912
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/thebrotherskaram28054gut
young:
- Everyone makes mistakes. When we hurt someone, we can say sorry and try to make it right. When someone hurts us, we can choose to
  forgive them.
- Forgiving doesn't mean pretending it didn't happen. It means letting go of wanting to get even. In Shakespeare's play The Tempest,
  Prospero could have taken revenge, but he chose to forgive, and everyone could start again.
talk:
- What makes a good apology?
- Is it hard for you to forgive? Why?
- Prospero says forgiveness is rarer than revenge. Why do you think it's rare?
- Emma went to apologize the next morning. Why is it important to make things right, not just say sorry?
- Can you forgive someone who hasn't said sorry?
