key: society
question: How do societies hold together? Where do classes, customs and institutions come from?
stops:
- rung: gbgreeks.aristotle-politics
  year: -335
  text: Aristotle says people are by nature political animals, made to live together and to talk about what is just. A person who could
    live wholly alone would be either a beast or a god. Society, for him, is not an invention but part of human nature.
  quote:
    text: 'But he who is unable to live in society, or who has no need because he is sufficient for himself, must be either a beast
      or a god: he is no part of a state.'
    author: Aristotle
    work: Politics I.2, 1253a
    tr: Benjamin Jowett
    ed: The Works of Aristotle, vol. X, Clarendon Press
    year: 1921
    src: Internet Archive
    url: https://archive.org/details/worksofaristotle0010wdro
- rung: gbmiddle.chaucer-canterbury-tales
  year: 1390
  text: 'Chaucer gathers pilgrims from almost every rank of English life: a knight, a miller, a nun, a cook, a lawyer, a plowman. Each
    tells a tale in their own style. The result is a lively, funny portrait of a whole society, its virtues and its faults.'
  quote:
    text: He was a verray parfit gentil knight.
    author: Geoffrey Chaucer
    work: The Canterbury Tales, General Prologue, lines 43–46 and 72
    tr: ''
    ed: The Complete Works, ed. W. W. Skeat, Clarendon Press
    year: 1900
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/22120
- rung: gb18.rousseau-discourses
  year: 1755
  text: Rousseau tells a story of how people left a simple state of nature and built societies with property, rank and envy. He argues
    that much inequality is made by society, not nature. His critics replied that his picture of early people was guesswork.
- rung: gb19.tocqueville-democracy-in-america
  year: 1835
  text: 'Tocqueville is amazed by how Americans form associations for everything: churches, schools, charities, clubs and town projects.
    Where in France people would wait for the government, Americans join together. He thinks these groups keep a free society healthy.'
  quote:
    text: Americans of all ages, all conditions, and all dispositions, constantly form associations.
    author: Tocqueville
    work: Democracy in America, Volume 2, Part II, Chapter V
    tr: Henry Reeve
    ed: Colonial Press, New York (revised edition)
    year: 1899
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/democracyinameri00816gut
- rung: gb19.marx-engels-manifesto
  year: 1848
  text: 'Marx and Engels argue that the way a society produces goods shapes everything else: its classes, laws and ideas. They see history
    as a series of class struggles. This way of looking at society has been very influential and also strongly disputed.'
- rung: gb19.dickens-little-dorrit
  year: 1857
  text: Dickens mocks the Circumlocution Office, a government department whose skill is never getting anything done. He shows a debtors'
    prison where families live for years, and the rich and poor bound together in one society. His satire helped readers see institutions
    that needed fixing.
  quote:
    text: Whatever was required to be done, the Circumlocution Office was beforehand with all the public departments in the art of perceiving—HOW
      NOT TO DO IT.
    author: Dickens
    work: Little Dorrit, Book I, Chapter 10
    tr: ''
    ed: Bradbury and Evans, London
    year: 1857
    src: Internet Archive (Project Gutenberg text)
    url: https://archive.org/details/littledorrit00963gut
- rung: gb19.george-eliot-middlemarch
  year: 1872
  text: George Eliot studies a whole English town, where the lives of a doctor, a banker, a clergyman's family and a young idealist
    are woven together. No one acts alone; each choice touches others. She ends by honoring the many quiet people whose good deeds are
    never recorded.
- rung: gb20.frazer-golden-bough
  year: 1890
  text: Frazer gathers customs and myths from around the world to trace how human thought developed. He proposed that thinking moved
    from magic to religion to science, a scheme that later anthropologists criticized as too simple. His huge collection still shapes
    how people read old customs.
  quote:
    text: The movement of the higher thought, so far as we can trace it, has on the whole been from magic through religion to science.
    author: James George Frazer
    work: The Golden Bough (abridged edition), Chapter LXIX
    tr: ''
    ed: The Macmillan Company, New York
    year: 1922
    src: Internet Archive
    url: https://archive.org/details/goldenbough0000sirj_k1e5
- rung: gb20.weber-essays-in-sociology
  year: 1919
  text: 'Max Weber studies how authority works: through tradition, through a leader''s personal gifts, or through rules and offices.
    He thought modern life was being organized more and more by bureaucracy. He saw its efficiency and also feared that people could
    become trapped in a cage of rules.'
young:
- 'A society is a big group of people living together, like a town or a country. People in a society have different jobs: farmers, teachers,
  doctors, builders. They depend on each other.'
- Societies also have customs, like how people greet each other or celebrate holidays. The great books ask how all these people and
  customs fit together, and how a society can be fair to everyone in it.
talk:
- Name ten jobs people do in your town. How do they depend on each other?
- Tocqueville saw Americans forming groups to fix problems. What groups do you or your family belong to?
- Chaucer's pilgrims came from every walk of life. What could they learn from each other on the road?
- Dickens made fun of an office that never got anything done. Why can it be hard for big organizations to act?
