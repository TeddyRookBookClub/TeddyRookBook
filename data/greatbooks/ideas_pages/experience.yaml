key: experience
question: What can our senses teach us, and what can't they? Do we see the world as it really is?
stops:
- rung: gbgreeks.plato-theaetetus
  year: -369
  text: 'The young mathematician Theaetetus suggests that knowledge is simply perception. Socrates tests the idea: the same wind feels
    cold to one person and warm to another, and we judge things the senses alone cannot, such as sameness and difference. So knowing
    must be more than sensing.'
  quote:
    text: I see, my dear Theaetetus, that Theodorus had a true insight into your nature when he said that you were a philosopher, for
      wonder is the feeling of a philosopher, and philosophy begins in wonder.
    author: Plato
    work: Theaetetus 155d
    tr: Benjamin Jowett
    ed: The Dialogues of Plato, 3rd edition, vol. IV, Clarendon Press
    year: 1892
    src: Internet Archive
    url: https://archive.org/details/b24750189_0004
- rung: gbgreeks.aristotle-on-the-soul
  year: -350
  text: Aristotle explains that a sense takes in the form of a thing without its matter, as wax takes the shape of a signet ring without
    the metal. Each sense has its own objects, like color for sight and sound for hearing. He trusted the senses as our starting point
    for knowing nature.
- rung: gb18.locke-human-understanding
  year: 1689
  text: Locke traces all ideas to experience. He separates qualities like size and shape, which he thought are really in things, from
    qualities like color and taste, which arise in us. His question of how far our ideas copy the world set the agenda for the next
    century.
  quote:
    text: Let us then suppose the mind to be, as we say, white paper, void of all characters, without any ideas; how comes it to be
      furnished?
    author: John Locke
    work: Essay, Book II, ch. I, §2
    tr: ''
    ed: An Essay Concerning Human Understanding, Thomas Tegg, London
    year: 1832
    src: Internet Archive
    url: https://archive.org/details/anessayconcerni23lockgoog
- rung: gb17.newton-optics
  year: 1704
  text: 'Newton''s prism experiments show that white sunlight is a mix of rays bent by different amounts. He adds a careful remark:
    the rays themselves are not colored. Color is the sensation they stir up in us.'
  quote:
    text: For the Rays to speak properly are not coloured.
    author: Isaac Newton
    work: Opticks, Book I, Part II, Proposition II, Definition
    tr: ''
    ed: 4th edition, William Innys, London
    year: 1730
    src: Internet Archive
    url: https://archive.org/details/bim_eighteenth-century_opticks-or-a-treatise-_newton-sir-isaac_1730
- rung: gb18.berkeley-principles
  year: 1710
  text: Berkeley argues that if color and taste exist only in the mind, so must shape and size, since we never meet one without the
    other. Things exist as perceived. He believed this answered doubt, since the world we see is the real world, kept in being by God.
  quote:
    text: Their ESSE is PERCIPI, nor is it possible they should have any existence out of the minds or thinking things which perceive
      them.
    author: George Berkeley
    work: Principles, §3
    tr: ''
    ed: A Treatise Concerning the Principles of Human Knowledge (1710), Project Gutenberg text
    year: 1710
    src: Internet Archive
    url: https://archive.org/details/atreatiseconcern04723gut
- rung: gb18.hume-enquiry
  year: 1748
  text: Hume says that all our ideas are copies of impressions from the senses or feelings. When a word stands for no impression at
    all, we should be suspicious of it. Experience is our only guide to matters of fact, and it works by habit.
- rung: gb18.kant-critique-of-pure-reason
  year: 1781
  text: Kant agrees that knowledge begins with experience but says the mind gives experience its shape. We see the world in space and
    time and as linked by causes because that is how our minds must take it in. What things are in themselves, apart from us, we cannot
    know.
  quote:
    text: That all our knowledge begins with experience there can be no doubt. … But, though all our knowledge begins with experience,
      it by no means follows that all arises out of experience.
    author: Immanuel Kant
    work: Critique of Pure Reason, Introduction, §I
    tr: J. M. D. Meiklejohn
    ed: Critique of Pure Reason, Bohn's Philosophical Library (Project Gutenberg text)
    year: 1855
    src: Internet Archive
    url: https://archive.org/details/thecritiqueofpur04280gut
- rung: gb19.james-principles-of-psychology
  year: 1890
  text: William James studies experience as a scientist of the mind. He notices that we never get pure sensations; experience flows
    like a stream, and attention picks out what we notice. What we see depends partly on what we are ready to see.
  quote:
    text: Consciousness, then, does not appear to itself chopped up in bits.
    author: William James
    work: The Principles of Psychology, Chapter IX (The Stream of Thought)
    tr: ''
    ed: Henry Holt and Company, New York
    year: 1890
    src: Internet Archive
    url: https://archive.org/details/bub_gb_JLcAAAAAMAAJ
young:
- 'Your five senses are how you meet the world: seeing, hearing, touching, tasting and smelling. They teach you a lot! But they can
  be fooled. A straw in a glass of water looks bent, but it isn''t.'
- 'Here''s a puzzle the great thinkers loved: is a strawberry red when no one is looking? Newton said light rays aren''t really colored;
  the color happens when light meets our eyes and brain. Try it: what color is your room in the dark?'
talk:
- Can you think of a time your eyes or ears fooled you?
- Is the strawberry red when no one is looking? What would Newton say? What would Berkeley say?
- Put one hand in warm water and one in cold, then both in lukewarm water. What happens? What does that tell you about your senses?
- What do you notice when you pay close attention that you usually miss?
