key: comedy
question: What makes us laugh, and what is laughter for? Can comedy make people better?
stops:
- rung: gbgreeks.aristophanes-comedies
  year: -405
  work: The Frogs
  text: Aristophanes wrote wild comedies full of jokes, singing frogs and flying beetles. He made fun of politicians, philosophers and
    poets by name. Behind the laughter, he gave Athens advice about peace and good sense.
  quote:
    text: Brekekekex, ko-ax, ko-ax! / Brekekekex, ko-ax, ko-ax!
    author: Aristophanes
    work: The Frogs
    tr: Benjamin Bickley Rogers
    ed: The Harvard Classics, vol. 8, P. F. Collier and Son
    year: 1909
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/7998
- rung: gbgreeks.aristotle-poetics-rhetoric
  year: -335
  text: Aristotle says comedy shows people as worse than average, but in ways that are laughable rather than painful or harmful. A comic
    mask is ugly and twisted but causes no pain. His book on comedy is lost, but this short definition shaped later thinking.
- rung: gbmiddle.chaucer-canterbury-tales
  year: 1390
  text: Chaucer's pilgrims tell all kinds of tales, from noble romances to rowdy jokes. He laughs at a greedy pardoner and a vain monk
    with sly, gentle humor. Some tales are rude, so families usually read selections.
- rung: gbren.erasmus-praise-of-folly
  year: 1511
  text: Erasmus lets Folly herself give a speech praising foolishness. She mocks proud scholars, greedy officials and quarreling theologians.
    The joke turns serious at the end, praising the holy 'foolishness' of simple faith.
- rung: gbren.rabelais-gargantua
  year: 1534
  text: Rabelais tells the adventures of giant kings with huge appetites and huge learning. His comedy is loud, silly and sometimes
    rude, but it mocks bad schools and stuffy officials. He says laughter is part of being human.
  quote:
    text: Because to laugh is proper to the man.
    author: Rabelais
    work: Gargantua, "Rabelais to the Reader"
    tr: Sir Thomas Urquhart
    ed: Book I, London
    year: 1653
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/8166
- rung: gbren.shakespeare-comedies
  year: 1595
  text: In Shakespeare's comedies, lovers get mixed up, people wear disguises and fairies play tricks, but everything ends in marriage
    and celebration. The mischievous fairy Puck laughs at human foolishness. The plays are funny and also wise about love.
  quote:
    text: Lord, what fools these mortals be!
    author: William Shakespeare
    work: A Midsummer Night's Dream, Act III, scene 2 (Puck)
    tr: ''
    ed: First printed in the First Folio
    year: 1623
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/1514
- rung: gb17.moliere-comedies
  year: 1668
  text: Molière laughs at hypocrites, misers, snobs and people who think they are sick. In The Miser, Harpagon loves his money more
    than his children. Molière believed comedy could correct faults by making them ridiculous.
  quote:
    text: We must eat to live, and not live to eat.
    author: Molière
    work: The Miser, Act III, Scene V
    tr: Charles Heron Wall
    ed: The Dramatic Works of Molière, George Bell & Sons
    year: 1876
    src: Project Gutenberg
    url: https://www.gutenberg.org/ebooks/6923
- rung: gb18.swift-gullivers-travels
  year: 1726
  text: Swift's satire is sharper. Lilliputians go to war over which end to break an egg; scientists try to get sunlight out of cucumbers.
    He laughs to show how silly and proud people can be.
- rung: gb18.voltaire-candide
  year: 1759
  text: Voltaire's Candide rushes from disaster to disaster while his teacher Pangloss insists all is for the best. The comedy is fast
    and biting. It makes readers laugh and then think hard about suffering and false comfort.
- rung: gb19.austen-emma
  year: 1815
  text: 'Austen''s comedy is quiet: misunderstandings, matchmaking gone wrong and silly neighbors who talk too much. Emma''s mistakes
    are funny because we see them coming. In the end the comedy teaches her, and us, to see more clearly.'
young:
- Comedy is the art of making people laugh. Funny stories often have mix-ups, silly characters and happy endings.
- Some comedy is just for fun, like a joke about a frog. Other comedy, called satire, pokes fun at people being proud or greedy, to
  help everyone see how silly it is. Write a funny short scene where two characters get mixed up!
talk:
- What makes you laugh the hardest?
- Rabelais says laughing is part of being human. Do animals laugh?
- Is it okay to make fun of someone? When is it kind and when is it not?
- Molière said comedy can fix bad habits. How?
- What is the funniest story you know?
