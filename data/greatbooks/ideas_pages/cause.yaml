# Great Books Ladder: the Great Idea "cause", followed through the books (page: /great-books/ideas/cause/, layout layouts/math/gbidea.html).
# Our own words: inspired by Adler's Syntopicon, NOT copied from it. Checked by scripts/greatbooks/check-gb.py.
