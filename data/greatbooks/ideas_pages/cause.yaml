#   stops (4-10, oldest first): rung (a rung id), year (number, negative = BC), optional when/who/work (else the rung's date/author/work),
#     optional stance, text (2-4 sentences, our own words), optional quote: ONE short line (under 40 words) copied exactly from an
#     excerpt already in that rung's lesson (scripts/greatbooks/src/<rung>/lesson.json), with that excerpt's credit fields; nothing from 1931 or later.
#   young: paragraphs for young readers.  talk: 4-6 family questions.  see: topic ids on other ladders.  pages: optional [{url, title}].
key: cause
question: Why do things happen? Do events have causes and purposes, or does chance play a part?
stops:
- rung: gbgreeks.hippocrates-works
  year: -400
  text: 'The Hippocratic doctors look for natural causes of disease: winds, water, seasons, diet. They reject explanations by the anger
    of gods. Finding the cause, they believed, is the first step toward a cure.'
  quote:
    text: Men regard its nature and cause as divine from ignorance and wonder, because it is not at all like to other diseases.
    author: Hippocrates (Hippocratic Corpus)
    work: On the Sacred Disease
    tr: Francis Adams
    ed: Sydenham Society, London
    year: 1849
    src: Internet Archive
    url: https://archive.org/details/genuineworksofhi02hippuoft
- rung: gbgreeks.aristotle-physics
  year: -350
  text: 'Aristotle names four kinds of cause: what a thing is made of, its form, what started it, and what it is for. A statue''s bronze,
    its shape, its sculptor and its purpose all help explain it. He thought nature too acts for ends, as an acorn grows toward an oak.'
  quote:
    text: Again (4) in the sense of end or 'that for the sake of which' a thing is done, e.g. health is the cause of walking about.
    author: Aristotle
    work: Physics, Book II, 3
    tr: R. P. Hardie and R. K. Gaye
    ed: Oxford, Clarendon Press
    year: 1930
    src: Internet Archive
    url: https://archive.org/details/workstranslatedi02arisuoft
- rung: gbrome.lucretius-on-the-nature-of-things
  year: -55
  text: Lucretius explains everything by atoms moving and colliding, with no purposes and no gods steering. To leave room for free will,
    he says atoms sometimes swerve slightly, by chance. Nature, for him, is cause and chance, not plan.
- rung: gbmiddle.aquinas-on-god
  year: 1268
  text: Aquinas argues that a chain of causes can't go back forever without a first cause, and that things in nature act for ends as
    if directed. He calls the first cause and director God. He also holds that God works through natural causes, which science can study.
  quote:
    text: Therefore some intelligent being exists by whom all natural things are directed to their end; and this being we call God.
    author: Thomas Aquinas
    work: Summa Theologica, First Part, Question 2, Article 3 (the fifth way)
    tr: the Fathers of the English Dominican Province
    ed: Second and Revised Edition
    year: 1920
    src: New Advent
    url: https://www.newadvent.org/summa/1002.htm
- rung: gb17.spinoza-ethics
  year: 1677
  text: Spinoza holds that everything follows necessarily from the nature of God, or Nature, as a theorem follows from geometry. There
    is no chance and no purpose in the usual sense. Understanding the causes of things, he thinks, brings peace.
- rung: gb18.hume-enquiry
  year: 1748
  text: Hume asks what we really see when one billiard ball strikes another. We see one motion followed by another, but never the power
    that links them. Our idea of cause, he argues, comes from habit after seeing the same thing happen again and again.
  quote:
    text: May not the first ball return in a straight line, or leap off from the second in any line or direction?
    author: David Hume
    work: Enquiry, Section IV, Part I
    tr: ''
    ed: An Enquiry Concerning Human Understanding, reprinted from the edition of 1777, Open Court, Chicago
    year: 1900
    src: Internet Archive
    url: https://archive.org/details/enquiryconcernin01hume
- rung: gb18.voltaire-candide
  year: 1759
  text: Voltaire mocks Dr. Pangloss, who insists that everything happens for the best, no matter how terrible. Pangloss finds a purpose
    for everything, even noses made to hold spectacles. Voltaire's target was a kind of easy optimism about causes and purposes.
  quote:
    text: Observe, that the nose has been formed to bear spectacles—thus we have spectacles."
    author: Voltaire
    work: Candide, ch. I
    tr: anonymous translator
    ed: Candide, The Modern Library, Boni and Liveright, New York
    year: 1918
    src: Internet Archive
    url: https://archive.org/details/candide19942gut
- rung: gb19.tolstoy-war-and-peace
  year: 1869
  text: Tolstoy asks what caused Napoleon's invasion of Russia. Not Napoleon alone, he answers, but millions of causes in millions of
    people. Historians who name one cause are, in his view, fooling themselves.
- rung: gb20.heisenberg-physics-and-philosophy
  year: 1958
  text: Heisenberg explains that in quantum physics, single events like an atom's decay can be predicted only as probabilities. Chance
    seems built into nature at the smallest scale. Physicists still debate what that means.
young:
- A cause is what makes something happen. If you drop a glass, the glass breaks. The drop is the cause; the broken glass is the effect.
- 'Aristotle asked four ''why'' questions about a thing: What is it made of? What shape is it? Who or what made it? What is it for?
  Try them on your toothbrush!'
talk:
- Ask Aristotle's four questions about a chair. What are the answers?
- Is anything really an accident, or does everything have a cause?
- Hume says we never see the cause itself, only one thing after another. Is he right?
- Pangloss thought everything happens for the best. What did Voltaire think of that?
- What caused something good that happened to you this week?
