# Great Books Ladder: fixes to the automatic Harvard Classics Daily matching (scripts/greatbooks/harvard.py).
#   <rung id>: { add: [day ids MM-DD], drop: [day ids] }
# Writers: one line per rung, added with a small edit.
# Voltaire's Letters XV (On Attraction) and XVI (On Newton's Optics), Harvard Classics vol. 34.
# gbclean: Kelvin's lecture on the tides (Aug 25) explains Newton's theory of the tides from the Principia.
gb17.newton-principia: { add: ["03-20", "08-25"], drop: [] }
gb17.newton-optics: { add: ["03-20"], drop: [] }
# Pascal's The Art of Persuasion, from his essay on the geometrical mind (minor works, Harvard Classics vol. 48).
gb17.pascal-scientific-treatises: { add: ["01-23"], drop: [] }
# Plutarch's Themistocles and Aristides: the Persian Wars' leaders (Harvard Classics vol. 12).
gbgreeks.herodotus-histories: { add: ["09-24", "06-13"], drop: [] }
# Plutarch's Pericles and Alcibiades: leaders of Athens in the Peloponnesian War (Harvard Classics vol. 12).
gbgreeks.thucydides-peloponnesian-war: { add: ["07-13", "12-11"], drop: [] }
# Dante (Cary, Harvard Classics vol. 20): pp. 267-279 are Purgatorio XXX-XXXI (Beatrice in the Earthly Paradise); pp. 387-395 are Paradiso XXIV (St. Peter).
gbmiddle.dante-inferno: { add: [], drop: ["01-27", "09-14"] }
gbmiddle.dante-purgatorio: { add: ["01-27"], drop: [] }
gbmiddle.dante-paradiso: { add: ["09-14"], drop: [] }
# The Fundamental Orders of Connecticut, an early written constitution (Harvard Classics vol. 43).
gb18.american-state-papers: { add: ["01-14"], drop: [] }
# Voltaire's letter on Circassian customs is not about Candide and less suited to families; the Letters on the English stay.
gb18.voltaire-candide: { add: [], drop: ["11-21", "02-10"] }  # both Voltaire letter days include material not suited to children
# gbw1: Macaulay's essay on Machiavelli; Lamb on Marlowe's Edward II beside Richard II; Lamb on reading the tragedies; More's Utopia beside his friend Erasmus.
gbren.machiavelli-the-prince: { add: ["10-25"], drop: [] }
gbren.shakespeare-histories: { add: ["02-06"], drop: [] }
gbren.shakespeare-king-lear: { add: ["11-26"], drop: [] }
# gbclean: More's Utopia, Book II (Nov 27), as on July 6.
gbren.erasmus-praise-of-folly: { add: ["07-06", "11-27"], drop: [] }
# Mill's Autobiography days (Harvard Classics vol. 25) also belong with his Utilitarianism; Darwin's Origin days with the Descent of Man.
gb19.mill-utilitarianism: { add: ["06-23", "09-25"], drop: [] }
gb19.darwin-descent-of-man: { add: ["07-01", "09-05"], drop: [] }
# gbclean (round 31): sources, commentaries and the same figures; each day was read in full first.
# Plutarch's Caesar (Ides of March; Brutus and Cassius) and Antony (Cleopatra's barge on the Cydnus) are Shakespeare's sources; Dryden's All for Love retells Antony and Cleopatra after Shakespeare.
gbren.shakespeare-julius-caesar: { add: ["03-15", "07-02", "08-29", "02-15", "09-02"], drop: [] }
# Lamb's essay on the tragedies dwells on Hamlet. (Voltaire's letter On Tragedy, Feb 10, translates "To be, or not to be", but the same day's letter on comedy is less suited to families.)
gbren.shakespeare-hamlet: { add: ["11-26"], drop: [] }
# Lamb's essay on the tragedies weighs "the texture of Othello's mind".
gbren.shakespeare-othello: { add: ["11-26"], drop: [] }
# The Aeneid, Book II: Hector's ghost and the fall of Priam's Troy, the story the Iliad leads toward.
gbgreeks.homer-iliad: { add: ["01-06"], drop: [] }
# Cowley's essay Of Agriculture opens with Virgil's Georgics ("O fortunatos nimium") and praises them throughout.
gbrome.virgil-eclogues-georgics: { add: ["07-28"], drop: [] }
# Pliny's two letters on Vesuvius were written to Tacitus, for his Histories.
gbrome.tacitus-annals-histories: { add: ["08-24"], drop: [] }
# Schiller's letters on aesthetic education say they "rest chiefly upon Kantian principles".
gb18.kant-critique-of-judgment: { add: ["05-09"], drop: [] }
# Thackeray's lecture on Swift, with his reading of Gulliver's last voyage.
gb18.swift-gullivers-travels: { add: ["10-22"], drop: [] }
# Marlowe's Doctor Faustus, the earlier play of the Faust legend; Mazzini's essay on Goethe, with Faust.
gb19.goethe-faust: { add: ["06-01", "01-05"], drop: [] }
