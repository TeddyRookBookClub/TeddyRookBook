# The Great Books Ladder: every rung, in ladder order. THE source for data/greatbooks/topics/*.json
# (run: python3 scripts/greatbooks/build.py). Format: /tmp/work_gbcore/FORMAT.md, section 2.
# The volumes are those of Great Books of the Western World, 2nd edition (Encyclopaedia Britannica, 1990, 60 volumes).
# Summaries, idea tags and groupings are our own words.
#   id, unit, title, vol (number or list), author, life, date (of the work), work, short (one line), ideas (data/greatbooks/ideas.yaml)
#   optional: prereqs, xp (default 3), trouble, care (a content note for parents), read [{name, url}] (PUBLIC-DOMAIN English only),
#   q (Project Gutenberg search words, when no read list yet), nopd: true (no public-domain English translation: no excerpts;
#   the page points to libraries instead), where (where to find it), hc: { author: "...", works: "regex", default: true }
#   (Harvard Classics matching, see scripts/greatbooks/harvard.py), soon: true (remove when the rung is built)
units:
  gbstart:
    - { key: start, title: "Opening Rungs", blurb: "How to read a great book, what the Great Books idea is, and Mortimer Adler's Syntopicon, with our own index of ideas." }
  gbgreeks:
    - { key: epic-and-drama, title: "Epic and Drama", blurb: "Homer's two epics and the playwrights of Athens, who invented tragedy and comedy." }
    - { key: history, title: "The First Historians", blurb: "Herodotus and Thucydides, who first tried to find out what happened and why." }
    - { key: plato, title: "Plato", blurb: "Socrates' questions, written down by his student: justice, knowledge, love and the soul." }
    - { key: aristotle, title: "Aristotle", blurb: "Logic, nature, the soul, ethics, politics and poetry from the philosopher who tried to study everything." }
    - { key: medicine-and-mathematics, title: "Medicine and Mathematics", blurb: "Hippocrates' medicine, Euclid's geometry and Archimedes' mechanics." }
  gbrome:
    - { key: roman-poets, title: "Roman Poets", blurb: "Lucretius on atoms and Virgil on farms, shepherds and the founding of Rome." }
    - { key: lives-and-histories, title: "Lives and Histories", blurb: "Plutarch's paired lives of Greeks and Romans, and Tacitus on the emperors." }
    - { key: stoics-and-plotinus, title: "Stoics and Plotinus", blurb: "A freed slave and an emperor on calm in hard times, and Plotinus on the One." }
    - { key: science, title: "Numbers, Stars and Medicine", blurb: "Nicomachus on number, Ptolemy's astronomy and Galen's medicine." }
    - { key: augustine, title: "Augustine", blurb: "The Confessions, The City of God and On Christian Doctrine." }
  gbmiddle:
    - { key: aquinas, title: "Thomas Aquinas", blurb: "The Summa Theologica: faith and reason brought together in one great structure of questions." }
    - { key: dante-and-chaucer, title: "Dante and Chaucer", blurb: "A journey through the next world, and a pilgrimage full of stories." }
  gbren:
    - { key: humanists, title: "Humanists", blurb: "Erasmus, Machiavelli, Rabelais and Montaigne: new looks at people, power and the self." }
    - { key: reformation, title: "Reformation", blurb: "John Calvin's Institutes." }
    - { key: new-sky, title: "A New Sky", blurb: "Copernicus puts the sun at the center." }
    - { key: shakespeare, title: "Shakespeare", blurb: "The comedies, histories, tragedies, romances and sonnets." }
    - { key: cervantes, title: "Cervantes", blurb: "Don Quixote, the knight who read too many books." }
  gb17:
    - { key: new-science, title: "The New Science", blurb: "Gilbert, Kepler, Bacon, Harvey, Descartes and Galileo: nature tested by experiment and written in mathematics." }
    - { key: philosophers, title: "Philosophers", blurb: "Descartes' doubt, Hobbes' Leviathan and Spinoza's Ethics." }
    - { key: pascal, title: "Pascal", blurb: "The vacuum and the arithmetic triangle, the Provincial Letters and the Pensées." }
    - { key: poets-and-playwrights, title: "Poets and Playwrights", blurb: "Milton's epic, Molière's comedies and Racine's tragedies." }
    - { key: newton-and-huygens, title: "Newton and Huygens", blurb: "The laws of motion and gravity, light as a wave, and light split into colors." }
  gb18:
    - { key: philosophers, title: "Philosophers", blurb: "Locke, Berkeley, Hume and Kant on knowledge, government and morals." }
    - { key: satire, title: "Satire", blurb: "Swift, Voltaire and Diderot laugh at the follies of their age." }
    - { key: laws-and-society, title: "Laws, Society and Wealth", blurb: "Montesquieu, Rousseau, Adam Smith and the founding papers of the United States." }
    - { key: history-and-lives, title: "History and a Life", blurb: "Gibbon's fall of Rome and Boswell's Life of Johnson." }
    - { key: chemistry, title: "Chemistry", blurb: "Lavoisier and the new chemistry." }
  gb19:
    - { key: philosophers, title: "Philosophers", blurb: "Hegel, Mill, Kierkegaard and Nietzsche." }
    - { key: society, title: "Society and History", blurb: "Tocqueville on American democracy, and Marx and Engels on capital." }
    - { key: science, title: "Science", blurb: "Faraday's electricity, Darwin's evolution and William James's psychology." }
    - { key: novels-and-plays, title: "Novels and Plays", blurb: "Goethe, Austen, Balzac, Melville, Dickens, Tolstoy, George Eliot, Ibsen, Dostoevsky and Twain." }
  gb20:
    - { key: freud, title: "Freud", blurb: "Sigmund Freud's theories of the mind, and how later research judged them." }
    - { key: philosophy-and-religion, title: "Philosophy and Religion", blurb: "Volume 55: eight thinkers of the 20th century." }
    - { key: natural-science, title: "Natural Science", blurb: "Volume 56: relativity, the atom, the expanding universe, genes and life." }
    - { key: social-science, title: "Social Science", blurb: "Volumes 57 and 58: economics, sociology, anthropology and history." }
    - { key: literature, title: "Imaginative Literature", blurb: "Volumes 59 and 60: stories, plays and poems of the 20th century." }

rungs:
  # ============================================================ START HERE
  - { id: gbstart.how-to-read-a-great-book, unit: start, title: "How to Read a Great Book", author: "Teddy Rook Book", work: "A guide for families, crediting Adler and Van Doren's How to Read a Book", short: "How to choose a book, read it more than once, ask it questions, mark it up, talk about it, and come back to it.", ideas: [reading, education, dialogue] }
  - { id: gbstart.the-great-conversation, unit: start, title: "The Great Conversation", author: "Teddy Rook Book", work: "The Great Books idea, its history, and its critics", short: "Why people read the great books together, where the idea came from, the case against a fixed list, and how this ladder works.", ideas: [reading, dialogue, education] }
  - { id: gbstart.syntopicon-and-adler, unit: start, title: "The Syntopicon and Mortimer Adler", vol: [1, 2], author: "Mortimer J. Adler", life: "1902–2001", date: "1952; 2nd edition 1990", work: "The Syntopicon (The Great Ideas), volumes 1 and 2", short: "Who Mortimer Adler was, how his index of great ideas works across the whole set, his other books, and our own idea index.", ideas: [reading, dialogue, knowledge], nopd: true, where: "Still under copyright, so we describe it and don't quote it. Find it at a library: [Open Library](https://openlibrary.org/search?q=Syntopicon+great+ideas) or [WorldCat](https://search.worldcat.org/search?q=Syntopicon)." }

  # ============================================================ THE GREEKS
  - { id: gbgreeks.homer-iliad, unit: epic-and-drama, title: "Homer: The Iliad", vol: 3, author: "Homer", life: "dates unknown; probably 8th century BC", date: "c. 750 BC (from older oral poetry)", work: "The Iliad", short: "The anger of Achilles in the last year of the Trojan War, and what it costs Greeks and Trojans alike.", ideas: [heroes, war, pride, facing-death, courage], care: "Battle scenes in the Iliad are vivid and violent; young readers can follow a retelling and the scene of Priam and Achilles.", q: "Homer Iliad Butler", hc: { works: "Iliad" }, read: [{ name: "Butler translation (Longmans, Green, 1898), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/2199" }, { name: "Butler translation, The Internet Classics Archive (MIT)", url: "https://classics.mit.edu/Homer/iliad.html" }] }
  - { id: gbgreeks.homer-odyssey, unit: epic-and-drama, title: "Homer: The Odyssey", vol: 3, author: "Homer", life: "dates unknown; probably 8th century BC", date: "c. 725 BC (from older oral poetry)", work: "The Odyssey", short: "Odysseus' ten-year voyage home from Troy, and his wife and son holding out for him in Ithaca.", ideas: [journeys, heroes, family], q: "Homer Odyssey Butler", hc: { works: "Odys", default: true }, read: [{ name: "Butler translation (Longmans, Green, 1900), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/1727" }, { name: "Butler translation, The Internet Classics Archive (MIT)", url: "https://classics.mit.edu/Homer/odyssey.html" }] }
  - { id: gbgreeks.aeschylus-oresteia, unit: epic-and-drama, title: "Aeschylus: The Oresteia", vol: 4, author: "Aeschylus", life: "c. 525–456 BC", date: "458 BC (the Oresteia); seven plays survive", work: "Agamemnon, The Libation Bearers, The Eumenides, and his other plays", short: "A family curse runs through three plays and ends in a court of law: revenge gives way to justice.", ideas: [justice, tragedy, law], care: "The plays turn on murders within a family, told rather than shown.", hc: { author: "Æschylus" }, read: [{ name: "The House of Atreus, Morshead translation (1881), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/8604" }, { name: "Smyth translation (Loeb, 1926), Perseus Digital Library", url: "https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0085.tlg005" }] }
  - { id: gbgreeks.sophocles-oedipus, unit: epic-and-drama, title: "Sophocles: Oedipus and Antigone", vol: 4, author: "Sophocles", life: "c. 496–406 BC", date: "c. 441–401 BC", work: "Oedipus the King, Oedipus at Colonus, Antigone, and his other plays", short: "A king hunts for the cause of a plague and finds himself; his daughter defies a king to bury her brother.", ideas: [fate, tragedy, law, duty], care: "Oedipus' story includes a terrible discovery about his parents; summarize it simply for young readers.", hc: { works: "Antigone|dipus" }, read: [{ name: "Oedipus the King, Oedipus at Colonus, Antigone, Storr translation (Loeb, 1912), Project Gutenberg", url: "https://www.gutenberg.org/ebooks/31" }, { name: "Jebb translations (1887–1891), Perseus Digital Library", url: "https://catalog.perseus.org/catalog/urn:cts:greekLit:tlg0011.tlg004" }] }
