# The Great Books Ladder: OUR OWN index of ideas (/great-books/ideas/).
# Inspired by Mortimer J. Adler's Syntopicon (volumes 1-2 of Great Books of the Western World), with credit; this list,
# its names, its groups and its order are our own and are NOT the Syntopicon's list of great ideas.
# Rungs are tagged in data/greatbooks/rungs.yaml (ideas: [key, ...]); the index page is built from those tags.
#   groups: { key, title, blurb }     ideas: { key, name, group, blurb }   (blurb: one plain sentence, our own words)
groups:
  - { key: living, title: "Living well", blurb: "How a person should live: what makes a life good, and what it asks of us." }
  - { key: together, title: "Living together", blurb: "Families, cities and nations: who rules, what is fair, and what we owe each other." }
  - { key: knowing, title: "Knowing and thinking", blurb: "How we know what we know, how we reason, and how we learn." }
  - { key: nature, title: "Nature and science", blurb: "The world around us, from the planets to the heartbeat, and how people found out how it works." }
  - { key: faith, title: "God and the soul", blurb: "The deepest questions people have asked about God, the soul, good and evil, and the meaning of a life." }
  - { key: stories, title: "Stories, art and words", blurb: "Heroes and journeys, laughter and tears, beauty, and the craft of telling." }
ideas:
  # living well
  - { key: happiness, name: "Happiness and the good life", group: living, blurb: "What it means for a whole life to go well." }
  - { key: character, name: "Virtue and character", group: living, blurb: "The habits that make a person good, self-control among them, and how they are formed." }
  - { key: friendship, name: "Friendship and love", group: living, blurb: "Why we need friends, and the many kinds of love." }
  - { key: courage, name: "Courage", group: living, blurb: "Facing danger, pain or fear for the sake of something worth it." }
  - { key: duty, name: "Duty and conscience", group: living, blurb: "What we ought to do, and the inner voice that tells us." }
  - { key: facing-death, name: "Facing death", group: living, blurb: "How the great writers thought about dying well and living in its light." }
  - { key: pride, name: "Ambition and pride", group: living, blurb: "The drive to be great, and how it can lift a person up or bring them down." }
  - { key: peace-of-mind, name: "Peace of mind", group: living, blurb: "Staying calm and steady when things go wrong." }
  # living together
  - { key: justice, name: "Justice and fairness", group: together, blurb: "Giving each person what is due to them, in a city and in a soul." }
  - { key: law, name: "Laws and lawgivers", group: together, blurb: "Where laws come from, why we obey them, and when they can be wrong." }
  - { key: freedom, name: "Freedom and its limits", group: together, blurb: "How much a person may do as they choose, and what limits freedom fairly." }
  - { key: equality, name: "Equality", group: together, blurb: "In what ways people are equal, and what follows from it." }
  - { key: power, name: "Power and rulers", group: together, blurb: "How rulers gain power and keep it, and what makes power legitimate." }
