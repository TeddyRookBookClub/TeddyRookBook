  - { key: war, name: "War and its causes", group: together, blurb: "Why nations fight, what war does to people, and how peace is kept." }
  - { key: rights, name: "Rights and consent", group: together, blurb: "The idea that people have rights and that government rests on their consent." }
  - { key: wealth, name: "Wealth, money and markets", group: together, blurb: "How wealth is made, traded and shared." }
  - { key: family, name: "Family and home", group: together, blurb: "Parents and children, marriage and the household." }
  - { key: society, name: "How societies work", group: together, blurb: "Customs, classes and institutions, studied from the outside." }
