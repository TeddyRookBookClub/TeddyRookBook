problems:
  - id: P1
    day: 1
    topic: "Point sets symmetric about every perpendicular bisector"
    areas: [geometry]
    difficulty: 2
    answer: "The vertex sets of regular polygons"
    hints:
      - 'Every symmetry of a finite set fixes its centroid. What does that say about where the points lie?'
      - 'Once the points are on a circle, use the perpendicular bisector of two points that are second neighbors.'
    solution: |
      **Key idea:** all the reflections fix the centroid, so the points lie on a circle around it. Reflecting in the bisector of second neighbors shows that consecutive gaps are equal.

      **On a circle.** Let $G$ be the centroid of $S$. A reflection that maps $S$ to itself maps $G$ to the centroid of the image, which is $G$. So $G$ lies on the perpendicular bisector of every pair $A,B$, that is $GA=GB$. All points are equally far from $G$.

      **Equal gaps.** List the points around the circle as $P_1,\dots,P_n$ (indices mod $n$, $n\ge3$). The reflection in the perpendicular bisector of $P_iP_{i+2}$ swaps $P_i$ and $P_{i+2}$ and maps the arc between them that contains $P_{i+1}$ to itself. The only point of $S$ inside that arc is $P_{i+1}$, so it is mapped to itself, and it lies on the axis: it is the midpoint of the arc. So $P_iP_{i+1}=P_{i+1}P_{i+2}$ for all $i$, and $S$ is a regular polygon.

      **Converse.** For a regular $n$-gon, the perpendicular bisector of two vertices passes through the center at an angle that is a multiple of $\frac\pi n$ from a vertex, which is one of the polygon's mirror lines.
    checked: "reasoning"
    status: ready

  - id: P2
    day: 1
    topic: "Best constant for a symmetric quartic inequality"
    areas: [algebra]
    difficulty: 2
    answer: "$C=\\frac18$, with equality when two of the $x_i$ are equal and the rest are $0$ (or all are $0$)"
    hints:
      - 'Bound $x_i^2+x_j^2$ by the sum of all squares $p$. Then the left side is at most $p\,q$, where $q=\sum_{i<j}x_ix_j$.'
      - '$(\sum x_i)^4=(p+2q)^2$. Use AM–GM on $p$ and $2q$.'
    solution: |
      **Key idea:** replace each $x_i^2+x_j^2$ by the full sum of squares, then AM–GM on $p$ and $2q$.

      Let $p=\sum x_i^2$ and $q=\sum_{i<j}x_ix_j$, so $\big(\sum x_i\big)^2=p+2q$. Since all $x_k\ge0$, $x_i^2+x_j^2\le p$, so
      $$\sum_{i<j}x_ix_j(x_i^2+x_j^2)\le p\,q=\frac18\cdot4\,p\,(2q)\le\frac18(p+2q)^2=\frac18\Big(\sum x_i\Big)^4 .$$
      So $C=\frac18$ works.

      **Equality.** We need $x_i^2+x_j^2=p$ whenever $x_ix_j>0$, and $p=2q$ (or both sides $0$). If three numbers are positive, the first fails. If exactly one is positive, the left side is $0$ and the right is not. If exactly two are positive, say $x,y$, then $p=x^2+y^2$ and $q=xy$, and $p=2q$ forces $x=y$. Indeed for $x_1=x_2=1$ and the rest $0$, both sides equal $2$. So $C=\frac18$ is the least constant, with equality exactly when two values are equal and the rest are $0$, or all are $0$.
    checked: "numeric: 20,000 random nonnegative vectors"
    status: ready

