problems:
  - id: P1
    day: 1
    topic: "Functional equation with floors inside and outside"
    areas: [algebra]
    difficulty: 2
    answer: '$f\equiv0$, or $f\equiv c$ with $1\le c<2$'
    hints:
      - 'Put $x=0$. Either $f(0)=0$, or $\lfloor f(y)\rfloor=1$ for every $y$.'
      - 'If $f(0)=0$, take $x\in[0,1)$. Then use $x$ with $\lfloor x\rfloor=n$ and $y\in[0,1)$ to reach every real number $ny$.'
    solution: |
      **Key idea:** the value $f(0)$ splits the problem in two. If it is nonzero, $f$ is constant. If it is zero, $f$ vanishes on $[0,1)$, and every real number is an integer times a number in $[0,1)$.

      Write the equation as $f(\lfloor x\rfloor y)=f(x)\lfloor f(y)\rfloor$.

      **Case $f(0)\ne0$.** With $x=0$: $f(0)=f(0)\lfloor f(y)\rfloor$, so $\lfloor f(y)\rfloor=1$ for all $y$. With $y=0$: $f(0)=f(x)\lfloor f(0)\rfloor=f(x)$. So $f\equiv c$ with $\lfloor c\rfloor=1$, that is, $1\le c<2$. These work: both sides equal $c$.

      **Case $f(0)=0$.** For $x\in[0,1)$ we get $0=f(x)\lfloor f(y)\rfloor$ for all $y$.
      - If $\lfloor f(y)\rfloor=0$ for every $y$, then the right side is always $0$, and $x=1$ gives $f(y)=0$ for all $y$.
      - Otherwise $f(x)=0$ for all $x\in[0,1)$. Then for $y\in[0,1)$ the right side is $f(x)\lfloor0\rfloor=0$, so $f(ny)=0$ for every integer $n$ (take $x=n$). Every real $t$ has this form: for $t\ge0$ use $n=\lfloor t\rfloor+1$, for $t<0$ use $n=-\lfloor -t\rfloor-1$, and $y=t/n\in[0,1)$. So $f\equiv0$.

      $f\equiv0$ clearly works. So the solutions are $f\equiv0$ and the constants $c\in[1,2)$.
    checked: "logic: both cases are exhaustive; the constants were checked against the equation on random inputs"
    status: ready

