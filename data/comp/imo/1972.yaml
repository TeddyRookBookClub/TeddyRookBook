problems:
  - id: P1
    day: 1
    topic: "Two-digit numbers: two disjoint groups with equal sums"
    areas: [combinatorics]
    difficulty: 1
    hints:
      - 'How many nonempty subsets are there, and how large can a subset''s sum be?'
      - 'Two different subsets with the same sum may overlap. What happens if you remove the common part?'
    solution: |
      **Key idea:** pigeonhole. There are more subsets than possible sums.

      Ten numbers have $2^{10}-1=1023$ nonempty subsets. Every subset sum is at most $90+91+\dots+99=945$. So two different subsets $X\ne Y$ have the same sum.

      Remove the common elements: $X'=X\setminus Y$ and $Y'=Y\setminus X$ are disjoint and still have equal sums (we subtracted the same amount from both). Neither is empty: if, say, $X'$ were empty, then $Y'$ would have sum $0$, so $Y'$ would be empty too, and $X=Y$. So $X'$ and $Y'$ are the required subsets.
    checked: "algebra only: counting argument"
    status: ready

