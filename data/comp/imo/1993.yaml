  - id: P5
    day: 2
    topic: "Increasing function whose double application adds the input"
    areas: [algebra, number-theory]
    difficulty: 2
    answer: "Yes: for example $f(n)=\\lfloor n\\varphi+\\tfrac12\\rfloor$ with $\\varphi=\\frac{1+\\sqrt5}2$"
    hints:
      - 'If $f(n)\approx cn$, then $c^2=c+1$. So try the golden ratio.'
      - 'Round $n\varphi$ to the nearest integer and use $\varphi=1+\frac1\varphi$.'
    solution: |
      **Key idea:** take $f(n)$ to be $n\varphi$ rounded, where $\varphi^2=\varphi+1$. Rounding errors shrink by the factor $\frac1\varphi$, so they never spoil the identity.

      Let $\varphi=\frac{1+\sqrt5}2$, so $\varphi=1+\frac1\varphi$, and let $f(n)$ be the integer nearest to $n\varphi$ (no ties, since $n\varphi$ is irrational).
      - $f(1)=\lfloor1.618\ldots+0.5\rfloor=2$.
      - **Increasing.** $(n+1)\varphi=n\varphi+\varphi$ with $\varphi>1$, and rounding to the nearest integer is nondecreasing and commutes with adding $1$. So $f(n+1)\ge f(n)+1$.
      - **The identity.** Write $m=f(n)=n\varphi+\varepsilon$ with $|\varepsilon|<\frac12$. Then
      $$m\varphi=m+\frac m\varphi=m+n+\frac\varepsilon\varphi,$$
      and $\big|\frac\varepsilon\varphi\big|<\frac1{2\varphi}<\frac12$. So the nearest integer to $m\varphi$ is $m+n$, that is $f(f(n))=f(n)+n$.
    checked: "script: the three properties hold for n < 100,000"
    status: ready

  - id: P6
    day: 2
    topic: "Lamps in a circle toggled by their neighbors"
    areas: [combinatorics, algebra]
    difficulty: 4
    hints:
      - 'Record the value $b_t$ of the lamp changed at step $t$. Show that $b_t=b_{t-1}+b_{t-n}$ mod $2$.'
      - 'Work in the ring of polynomials mod $2$ modulo $x^n+x^{n-1}+1$. If $x^M=1$ there, the sequence repeats with period $M$.'
      - 'From $x^{n-1}(x+1)=1$, use the Frobenius rule $(u+v)^{2^k}=u^{2^k}+v^{2^k}$.'
    solution: |
      **Key idea:** the lamp values satisfy a linear recurrence mod $2$ with characteristic polynomial $x^n+x^{n-1}+1$. Showing $x^M\equiv1$ modulo that polynomial gives the period, and squaring maps in characteristic $2$ make that easy for $n=2^k$ and $2^k+1$.

      **(a)** The state is the set of lamps that are on together with the step number mod $n$. There are finitely many states, and each step can be undone: $L_{i-1}$ is not changed at step $s_i$, so we know whether $L_i$ was toggled. So the sequence of states is purely periodic, and some $M(n)$ returns to all lamps on at a step number divisible by $n$.

      **A recurrence.** Let $b_t\in\{0,1\}$ be the state of lamp $L_{t\bmod n}$ right after step $t$, and set $b_{-n}=\dots=b_{-1}=1$. Before step $t$, lamp $L_t$ shows $b_{t-n}$, and $L_{t-1}$ shows $b_{t-1}$. So
      $$b_t\equiv b_{t-1}+b_{t-n}\pmod2 .$$
      After $M$ steps the lamps show $b_{M-n},\dots,b_{M-1}$. So it suffices that $b_{t+M}=b_t$ for all $t$.

      **Algebra.** Let $p(x)=x^n+x^{n-1}+1$ over $\mathbb F_2$. If $x^M-1=q(x)p(x)$, apply both sides to the sequence as polynomials in the shift $S$ ($Sb_t=b_{t+1}$). Since $p(S)$ kills our sequence, so does $S^M-1$, which means period $M$. Now compute mod $p$: $x^{n-1}(x+1)=1$, so $x$ and $x+1$ are invertible.

      **(b) $n=2^k$.** From $x^n=x^{n-1}+1$ we get $x^{n-1}=\frac1{x+1}$ and $x^n=\frac x{x+1}$. Raising to the power $n=2^k$ (a ring homomorphism mod $2$):
      $$x^{n^2}=\frac{x^n}{x^n+1}=\frac{x/(x+1)}{1/(x+1)}=x .$$
      So $x^{n^2-1}=1$, and $M=n^2-1$ works.

      **(c) $n=2^k+1$.** Let $m=n-1=2^k$. Then $x^m=\frac1{x+1}$, and raising to the power $m$:
      $$x^{m^2}=\frac1{x^m+1}=\frac1{\frac1{x+1}+1}=\frac{x+1}x .$$
      So $x^{m^2+1}=x+1=x^{-m}$, that is $x^{m^2+m+1}=1$. Since $m^2+m+1=n^2-n+1$, this $M$ works.
    checked: "script: simulated the lamps; the first return times divide n²−1 and n²−n+1 for k ≤ 5"
    status: ready
