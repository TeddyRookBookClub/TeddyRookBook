  - id: P5
    day: 2
    topic: "Power sums of eight numbers vanishing infinitely often"
    areas: [algebra]
    difficulty: 2
    answer: "Exactly the odd $n$"
    hints:
      - 'Even power sums are positive. So infinitely many odd ones vanish.'
      - 'Divide by the $n$-th power of the largest absolute value and let $n\to\infty$ through odd values.'
    solution: |
      **Key idea:** for large odd $n$, the numbers of largest absolute value dominate the sum. They must cancel in pairs $\pm M$. Peel them off and repeat.

      For even $n$, $c_n$ is a sum of non-negative terms, not all zero, so $c_n>0$. Hence $c_n=0$ for infinitely many **odd** $n$.

      **Claim:** the non-zero $a_i$ split into pairs $\{x,-x\}$. Let $M>0$ be the largest $|a_i|$. Suppose $M$ appears $u$ times and $-M$ appears $v$ times. For odd $n$,
      $$\frac{c_n}{M^n}=u-v+\sum_{|a_i|<M}\Bigl(\frac{a_i}{M}\Bigr)^n .$$
      The last sum tends to $0$ as $n\to\infty$. Along the infinitely many odd $n$ with $c_n=0$, this forces $u-v=0$. For odd $n$, the $u$ copies of $M$ and the $u$ copies of $-M$ cancel, so removing them does not change $c_n$ for any odd $n$. The remaining numbers again have $c_n=0$ for infinitely many odd $n$. Repeat until only zeros remain.

      So the numbers are zeros together with pairs $x,-x$. Then every odd power sum is $0$, and every even one is positive. The answer is: $c_n=0$ exactly for odd $n$.
    checked: "script: for random multisets of pairs ±x plus zeros, c_n vanishes for odd n and is positive for even n"
    status: ready

  - id: P6
    day: 2
    topic: "Medals handed out by a one-seventh rule"
    areas: [algebra, number-theory]
    difficulty: 2
    answer: "$6$ days and $36$ medals"
    hints:
      - 'If $r_k$ medals remain before day $k$, then $r_{k+1}=\frac67(r_k-k)$.'
      - 'Solve the recurrence: $r_k=42-6k+C\bigl(\frac67\bigr)^{k-1}$. The last day gives $C$, and $r_1$ must be a whole number.'
    solution: |
      **Key idea:** the remaining medals follow a linear recurrence. Its solution has a term $(\frac67)^{k}$, and whole numbers force that term to vanish.

      Let $r_k$ be the number of medals left before day $k$, so $r_1=m$. On day $k$, $k+\frac17(r_k-k)$ medals are given out, which leaves
      $$r_{k+1}=\frac67(r_k-k).$$
      **Solving.** Try $r_k=\alpha k+\beta$: $\alpha(k+1)+\beta=\frac67(\alpha k+\beta-k)$ gives $\alpha=-6$, $\beta=42$. So the general solution is
      $$r_k=42-6k+C\Bigl(\frac67\Bigr)^{k-1}.$$
      **The last day.** On day $n$ all remaining medals, $n$ of them, are given, so $r_n=n$:
      $$C\Bigl(\frac67\Bigr)^{n-1}=7n-42,\qquad m=r_1=36+C=36+\frac{7^n(n-6)}{6^{n-1}} .$$
      Since $m$ is a whole number and $7^n$ is coprime to $6$, we need $6^{n-1}\mid n-6$. For $n\ge2$, $6^{n-1}>|n-6|$ (check $n=2$: $6>4$; after that the left side grows much faster). So $n-6=0$.

      Hence $n=6$ and $m=36$. Check: each day $6$ medals are given ($1+\frac{35}{7}$, then $2+\frac{28}{7}$, and so on), and on day $6$ the last $6$ remain.
    checked: "script: brute force over n < 40 and m < 5000; (6, 36) is the only solution"
    status: ready
