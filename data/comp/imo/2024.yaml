problems:
  - id: P1
    day: 1
    topic: "Sums of floors of multiples, divisible by their count"
    areas: [number-theory, algebra]
    difficulty: 1
    answer: 'Exactly the even integers'
    hints:
      - 'Adding $2$ to $\alpha$ adds $n(n+1)$ to the sum. So only $0\le\alpha<2$ needs study.'
      - 'For $1\le\alpha<2$, write the sum as $n\,u_n$ and compare $u_n$ with $u_{n-1}$.'
    solution: |
      **Key idea:** shifting $\alpha$ by $2$ changes nothing, so only $[0,2)$ matters. There, comparing the average of the first $n$ terms with the average of the first $n-1$ pins everything down.

      Let $S_n(\alpha)=\lfloor\alpha\rfloor+\lfloor2\alpha\rfloor+\dots+\lfloor n\alpha\rfloor$. Call $\alpha$ **good** if $n\mid S_n(\alpha)$ for all $n\ge1$.

      **Even integers are good.** For $\alpha=2m$, $S_n=2m(1+\dots+n)=m\,n(n+1)$.

      **Shifting by 2.** Since $\lfloor i(\alpha+2)\rfloor=\lfloor i\alpha\rfloor+2i$, we get $S_n(\alpha+2)=S_n(\alpha)+n(n+1)$. So $\alpha$ is good exactly when $\alpha+2$ is. Every real number differs from a number in $[0,2)$ by an even integer, so it is enough to show that $0$ is the only good number in $[0,2)$.

      **$0<\alpha<1$ is not good.** Let $m$ be the first index with $\lfloor m\alpha\rfloor\ge1$. Then $m\ge2$, the earlier terms are $0$, and $\lfloor m\alpha\rfloor=1$ because $m\alpha=(m-1)\alpha+\alpha<1+1$. So $S_m=1$, which is not a multiple of $m$.

      **$1\le\alpha<2$ is not good.** Suppose it were, and write $S_n=n\,u_n$ with whole numbers $u_n$, so $u_1=\lfloor\alpha\rfloor=1$. For $n\ge2$,
      $$n\,(u_n-u_{n-1})=\big(S_n-S_{n-1}\big)-u_{n-1}=\lfloor n\alpha\rfloor-u_{n-1}.$$
      Now $u_{n-1}$ is the average of $\lfloor i\alpha\rfloor$ over $i\le n-1$, and each $\lfloor i\alpha\rfloor$ lies in $(i\alpha-1,\,i\alpha]$, so $u_{n-1}$ lies in $\big(\tfrac{n\alpha}2-1,\ \tfrac{n\alpha}2\big]$. Also $\lfloor n\alpha\rfloor\in(n\alpha-1,\,n\alpha]$. Therefore
      $$\lfloor n\alpha\rfloor-u_{n-1}\in\Big(\frac{n\alpha}2-1,\ \frac{n\alpha}2+1\Big)\subseteq\Big(\frac n2-1,\ n+1\Big).$$
      For $n\ge2$ the only multiple of $n$ in that last interval is $n$ itself. So $u_n=u_{n-1}+1$ for all $n\ge2$, giving $u_n=n$ and $S_n=n^2$. Then $\lfloor n\alpha\rfloor=S_n-S_{n-1}=2n-1$, so $\alpha\ge 2-\frac1n$ for every $n$, and $\alpha\ge2$. Contradiction.

      So the good numbers are exactly the even integers.
    checked: "script: every rational p/q with q ≤ 12 and |p/q| ≤ 6 was tested for n ≤ 60; exactly the even integers passed"
    status: ready

  - id: P2
    day: 1
    topic: "When a gcd of two exponential expressions settles"
    areas: [number-theory]
    difficulty: 2
    answer: '$(a,b)=(1,1)$ only'
    hints:
      - 'Look at both expressions modulo $ab+1$, which is coprime to $a$ and to $b$.'
      - 'Choose $n\equiv-1$ modulo $\varphi(ab+1)$, then $n\equiv 0$.'
    solution: |
      **Key idea:** modulo $M=ab+1$, an exponent $n\equiv-1$ turns $a^n$ into $a^{-1}$, and then $a^n+b$ and $b^n+a$ are both multiples of $M$. So $M$ divides the constant gcd. An exponent $n\equiv0$ then shows that $M$ is too big unless $a=b=1$.

      **$(1,1)$ works:** the gcd is always $\gcd(2,2)=2$.

      **Nothing else works.** Suppose the gcd equals $g$ for all $n\ge N$. Let $M=ab+1$. It is coprime to $a$ and to $b$ (a common factor of $M$ and $a$ would divide $M-ab=1$). Let $\varphi=\varphi(M)$, so $a^\varphi\equiv b^\varphi\equiv1\pmod M$ by Euler's theorem.

      *Step 1: $M\mid g$.* Take $n\ge N$ with $n\equiv-1\pmod\varphi$. Then $a^{n+1}\equiv1$, so
      $$a\,(a^n+b)=a^{n+1}+ab\equiv1+ab\equiv0\pmod M .$$
      As $a$ is invertible modulo $M$, $M\mid a^n+b$. In the same way $M\mid b^n+a$. So $M$ divides the gcd, which is $g$.

      *Step 2: $M\mid b+1$.* Now take $n\ge N$ with $\varphi\mid n$. Then $a^n+b\equiv1+b\pmod M$. But $g\mid a^n+b$ and $M\mid g$, so $M\mid b+1$.

      Since $0<b+1\le ab+1=M$, this forces $b+1=M$, that is, $a=1$. By symmetry ($M\mid a+1$ the same way) $b=1$.
    checked: "script: for 1 ≤ a, b ≤ 24, only (1, 1) gives the same gcd for every n from 30 to 399"
    status: ready

