problems:
  - id: P1
    day: 1
    topic: "Covering a triangle of lattice points with sunny lines"
    areas: [combinatorics]
    difficulty: 2
    answer: '$k=0$, $1$ or $3$ (for every $n\ge3$)'
    hints:
      - 'The points on the three sides of the triangle are hard to cover. A line that is not a side line meets the boundary in at most two of them.'
      - 'So for $n\ge4$ one of the lines is a side line. Remove it and shrink to $n-1$. Then settle $n=3$ by hand.'
    solution: |
      **Key idea:** for $n\ge4$, some line must be one of the three sides of the triangle. Removing it leaves the same problem one size smaller, with the same number of sunny lines. So everything comes down to $n=3$.

      Let $T_n$ be the set of points $(a,b)$ with positive integers and $a+b\le n+1$. Its convex hull is the triangle with corners $(1,1)$, $(1,n)$, $(n,1)$. The three **side lines** are $x=1$, $y=1$ and $x+y=n+1$. None of them is sunny.

      **Constructions.** For any $n\ge3$:
      - $k=0$: the $n$ lines $y=1,2,\dots,n$.
      - $k=1$: the lines $y=1,\dots,n-1$, plus the sunny line $y=x+n-1$ through the last point $(1,n)$.
      - $k=3$: the $n-3$ lines $x+y=n+1,\ n,\ \dots,\ 5$ cover every point with $a+b\ge5$. What remains is $T_3$, and the three sunny lines through $(1,1),(2,2)$, through $(1,2),(3,1)$, and through $(2,1),(1,3)$ cover it. (Their slopes are $1$, $-\tfrac12$ and $-2$.)

      **Shrinking.** Let $n\ge4$, and take $n$ lines covering $T_n$ with $k$ sunny. The boundary of the hull contains $3n-3$ points of $T_n$. A line that is not a side line meets the boundary of a triangle in at most two points, so if no side line were used, the lines would cover at most $2n<3n-3$ boundary points. So one of the lines is a side line. Remove it. The points it misses form a copy of $T_{n-1}$: if it was $x+y=n+1$ they are exactly $T_{n-1}$, and if it was $x=1$ (or $y=1$) they are $T_{n-1}$ shifted one step right (or up). A shift doesn't change directions, so the other $n-1$ lines, shifted back, cover $T_{n-1}$, and $k$ of them are sunny. Repeating, any value of $k$ possible for $n$ is also possible for $n=3$.

      **The case $n=3$.** Here $T_3$ has $6$ points, and $k\le3$. Only three triples of them are collinear, and they lie on the side lines. So a sunny line contains at most $2$ points, and a non-sunny line at most $3$, with $3$ only for a side line. Suppose exactly $2$ of the $3$ lines are sunny.
      - If the third line is a side line, say $x=1$, the remaining points $(2,1),(2,2),(3,1)$ must be covered by the two sunny lines. But each pair of these lies on a vertical, horizontal or slope $-1$ line, so a sunny line contains at most one of them, and two sunny lines can't cover three points. The other two side lines behave the same way: the map $(a,b)\mapsto(b,a)$ and the map $(a,b)\mapsto(5-a-b,\,b)$ send $T_3$ to itself, permute the three non-sunny directions, and so keep sunny lines sunny.
      - Otherwise the third line covers at most $2$ points, and $2+2+2=6$ means each line covers exactly $2$ points with no overlap. The non-sunny lines with exactly two points are $x=2$, $y=2$ and $x+y=3$, which are images of each other under the same maps, so take $x=2$. The four remaining points include $(1,1),(1,2),(1,3)$, and a sunny line holds at most one of these three, so two sunny lines can't cover them.

      So $k=2$ is impossible for $n=3$, hence for every $n$, and the answer is $k\in\{0,1,3\}$.
    checked: "script: exhaustive search over covers for n = 3, 4, 5 gives exactly k = 0, 1, 3"
    viz: imo-2025-p1
    status: ready

  - id: P2
    day: 1
    topic: "Two crossing circles, an orthocenter and a tangent line"
    areas: [geometry]
    difficulty: 4
    hints:
      - 'Put the common chord $AB$ on the $y$-axis and the line of centers on the $x$-axis, with $A=(0,1)$. Use the $x$-coordinates $c$ and $d$ of $C$ and $D$ as the two free parameters. Every point in the figure then has rational coordinates.'
      - 'Walk along line $AP$ as $(t(c+d),\,1+t(cd-1))$. The second intersections with the two circles have simple values of $t$. For the last step, substitute the parallel line through $H$ into the equation of the circle and look for a perfect square.'
    solution: |
      **Key idea:** with the right two parameters, every point is rational and short. The tangency becomes the fact that one quadratic is a perfect square.

      **Setup.** Take the line of centers as the $x$-axis and the common chord as the $y$-axis, scaled so that $A=(0,1)$ and $B=(0,-1)$. Write $C=(c,0)$ and $D=(d,0)$. The center $M=(m,0)$ is equally far from $A$ and $C$, so $m^2+1=(m-c)^2$, which gives $m=\dfrac{c^2-1}{2c}$. In the same way $N=\big(\tfrac{d^2-1}{2d},0\big)$. The circles are
      $$\Omega:\ x^2+y^2-\tfrac{c^2-1}{c}\,x-1=0,\qquad \Gamma:\ x^2+y^2-\tfrac{d^2-1}{d}\,x-1=0 .$$
      $C$ lies beyond $M$ away from $N$, so $c=m-|MA|<0$, and similarly $d>0$.

      Two facts about $c$ and $d$:
      - $cd<-1$. Let $\alpha=\angle ACM$ and $\beta=\angle ADN$. The triangles $MAC$ and $NAD$ are isosceles, so the exterior angles give $\angle AMN=2\alpha$ and $\angle ANM=2\beta$. These are two angles of triangle $AMN$, so $\alpha+\beta<90^\circ$ and $\angle CAD=180^\circ-\alpha-\beta>90^\circ$. Hence $\vec{AC}\cdot\vec{AD}=cd+1<0$.
      - $c+d\ne0$. If $d=-c$, then $N$ is the mirror image of $M$ in the $y$-axis and the two radii are equal. The radii are different, so this can't happen.

      **The points.** $P$ is on the perpendicular bisector $x=\tfrac{c+d}2$ of $CD$. From $PA=PC$ one gets
      $$P=\Big(\tfrac{c+d}2,\ \tfrac{1+cd}2\Big).$$
      So line $AP$ has direction $w=(c+d,\ cd-1)$, and its points are $X(t)=\big(t(c+d),\,1+t(cd-1)\big)$. Note $|w|^2=(c+d)^2+(cd-1)^2=(1+c^2)(1+d^2)$. Substituting $X(t)$ into the equation of $\Omega$ gives $t=0$ (the point $A$) and
      $$t_E=\frac{c-d}{c(1+d^2)},\qquad\text{and in the same way, from }\Gamma,\qquad t_F=\frac{d-c}{d(1+c^2)} .$$
      For $H$: side $MN$ is horizontal, so the altitude from $P$ is the line $x=\tfrac{c+d}2$. For a triangle with base on the $x$-axis, the orthocenter has height $-\dfrac{(x_P-x_M)(x_P-x_N)}{y_P}$. Here $x_P-x_M=\tfrac{1+cd}{2c}$ and $x_P-x_N=\tfrac{1+cd}{2d}$, so
      $$H=\Big(\tfrac{c+d}2,\ -\tfrac{1+cd}{2cd}\Big).$$

      **The circle $BEF$.** Consider
      $$G(x,y)=2cd\,(x^2+y^2)-(cd-1)(c+d)\,x-(c-d)^2\,y-(c^2+d^2).$$
      Since $2cd\ne0$, the set $G=0$ is a circle (or empty, or a point). It passes through $B$: $2cd+(c-d)^2-(c^2+d^2)=0$. On line $AP$,
      $$G(X(t))=2cd(1+c^2)(1+d^2)\,t^2-2(cd-1)(c-d)^2\,t-2(c-d)^2 .$$
      The roots of this quadratic have product $-\dfrac{(c-d)^2}{cd(1+c^2)(1+d^2)}$ and sum $\dfrac{(cd-1)(c-d)^2}{cd(1+c^2)(1+d^2)}$, and one checks that $t_Et_F$ and $t_E+t_F$ have exactly these values. So the roots are $t_E$ and $t_F$, and $G=0$ passes through $E$ and $F$. Moreover $t_E\ne t_F$, because $t_E=t_F$ simplifies to $(c+d)(1+cd)=0$. And $B$ is not on line $AP$, since that line is not vertical ($c+d\ne0$). So $B,E,F$ are three distinct points, not on one line, and $G=0$ is their circumcircle.

      **The tangency.** The line through $H$ parallel to $AP$ consists of the points $H+s\,w$. Substituting into $G$ and simplifying,
      $$G(H+s\,w)=\frac{(1+c^2)(1+d^2)}{2cd}\,\big(2cd\,s+1\big)^2 .$$
      (The coefficients of $s^2$, $s$ and $1$ are $2cd(1+c^2)(1+d^2)$, $2(1+c^2)(1+d^2)$ and $\frac{(1+c^2)(1+d^2)}{2cd}$.) This quadratic in $s$ has a double root, $s=-\frac1{2cd}$, and no other. So the line meets the circle $BEF$ in exactly one point, which means it is tangent to it.
    checked: "computer algebra: every displayed formula re-derived symbolically; numeric test on 10,000 random pairs of circles, distance from the circle's center to the line equals the radius to relative error 1e-8"
    status: ready

  - id: P3
    day: 1
    topic: "Divisibility functions with exponents: the best linear bound"
    areas: [number-theory]
    difficulty: 4
    answer: '$c=4$'
    hints:
      - 'Plug in $b=a$, then $a=1$. Then show that a prime $p$ dividing any value forces $p\mid f(p)$.'
      - 'If $p\mid f(p)$, then $f(b)\equiv b\pmod p$ for every $b$. Either this happens for infinitely many primes, or only $p=2$ can be special.'
    solution: |
      **Key idea:** every prime that divides a value of $f$ makes $f(b)\equiv b$ modulo that prime. With infinitely many such primes $f$ is the identity. Otherwise only the prime $2$ can appear, and a lifting-the-exponent count with $b=3$ gives $f(n)\le4n$. An explicit example shows $4$ is reached.

      Call $f$ bonza. Throughout, $f(a)\mid b^a-f(b)^{f(a)}$.

      **Basic facts.**
      - With $b=a$: $f(a)\mid a^a-f(a)^{f(a)}$, so $f(a)\mid a^a$. Every prime factor of $f(a)$ divides $a$.
      - With $a=b=1$: $f(1)\mid 1-f(1)^{f(1)}$, so $f(1)\mid1$ and $f(1)=1$.
      - If a prime $p$ divides some $f(a)$, take $b=p$: $p\mid p^a-f(p)^{f(a)}$, so $p\mid f(p)$.

      Let $\mathcal P$ be the set of primes $p$ with $p\mid f(p)$. Every prime factor of every value of $f$ lies in $\mathcal P$, and for a prime $q\notin\mathcal P$ we have $f(q)=1$ (since $f(q)\mid q^q$ but $q\nmid f(q)$).

      **The congruence.** Let $p\in\mathcal P$, so $f(p)=p^e$ with $e\ge1$. Taking $a=p$: $p\mid b^p-f(b)^{p^e}$. By Fermat's little theorem $b^p\equiv b$ and $f(b)^{p^e}\equiv f(b)$ modulo $p$. So
      $$f(b)\equiv b\pmod p\qquad\text{for every } b .$$

      **Case 1: $\mathcal P$ is infinite.** Then $f(b)-b$ has infinitely many prime factors, so $f(b)=b$ for every $b$, and $f(n)\le n$.

      **Case 2: $\mathcal P$ is finite.** First, $\mathcal P$ contains no odd prime. Suppose an odd $p\in\mathcal P$. Let $m=p\prod_{r\in\mathcal P}r-1$. Then $m\equiv-1\pmod p$. A product of primes that are all $\equiv1\pmod p$ is $\equiv1$, and $-1\not\equiv1$ since $p\ge3$, so $m$ has a prime factor $q\not\equiv1\pmod p$. This $q$ is not in $\mathcal P$, because every prime of $\mathcal P$ divides $m+1$. So $f(q)=1$, and the congruence gives $1\equiv q\pmod p$. Contradiction.

      So either $\mathcal P$ is empty, and then $f\equiv1$, or $\mathcal P=\{2\}$. In the second case every value of $f$ is a power of $2$, and for odd $n$, $f(n)\mid n^n$ forces $f(n)=1$. For even $n$, take $b=3$ (so $f(3)=1$): $f(n)\mid 3^n-1$. By the lifting-the-exponent formula for even $n$,
      $$v_2(3^n-1)=v_2(3-1)+v_2(3+1)+v_2(n)-1=v_2(n)+2 .$$
      So $f(n)\le 2^{v_2(n)+2}\le4n$.

      In all cases $f(n)\le4n$, so $c=4$ works.

      **$4$ is needed.** Define $f(n)=1$ for odd $n$, $f(n)=2$ when $n\equiv2\pmod4$, and $f(n)=2^{v_2(n)+2}$ when $4\mid n$. Then $f(4)=16=4\cdot4$. To check that $f$ is bonza:
      - $a$ odd: $f(a)=1$ divides everything.
      - $a\equiv2\pmod4$: $f(a)=2$, and $b^a-f(b)^2$ is even because $b$ and $f(b)$ have the same parity.
      - $4\mid a$, with $v=v_2(a)\ge2$ and $f(a)=2^{v+2}$. If $b$ is odd, $f(b)=1$, and $v_2(b^a-1)=v_2(b-1)+v_2(b+1)+v-1\ge v+2$ because $v_2(b-1)+v_2(b+1)\ge3$. If $b$ is even, both $b^a$ and $f(b)^{f(a)}$ are divisible by $2^{v+2}$, since $a\ge 2^v\ge v+2$ and $f(a)\ge v+2$.

      So the smallest constant is $c=4$.
    checked: "script: the example satisfies the condition for all a, b ≤ 64; an exhaustive search over all bonza functions on 1..10 finds max f(n)/n = 4"
    status: ready

  - id: P4
    day: 2
    topic: "Repeatedly summing the three largest proper divisors"
    areas: [number-theory]
    difficulty: 3
    answer: '$a_1=6\cdot12^{j}\cdot m$ with $j\ge0$ and $\gcd(m,10)=1$'
    hints:
      - 'If $d_1<d_2<d_3$ are the three smallest divisors of $N$ above $1$, the next term is $N\big(\frac1{d_1}+\frac1{d_2}+\frac1{d_3}\big)$.'
      - 'Show that a term not divisible by $6$ starts a strictly decreasing sequence. Then see what happens to multiples of $6$.'
    solution: |
      **Key idea:** the next term is $N(\frac1{d_1}+\frac1{d_2}+\frac1{d_3})$. That ratio is less than $1$ unless $2$ and $3$ divide $N$, and a decreasing sequence of positive integers can't go on forever. For multiples of $6$ there are only three cases: multiply by $\frac{13}{12}$, stay fixed, or turn odd.

      For $N$ with at least three proper divisors, let $1<d_1<d_2<d_3$ be its three smallest divisors above $1$ (the third may be $N$ itself). The three largest proper divisors are $N/d_1$, $N/d_2$, $N/d_3$, so the next term is
      $$F(N)=N\Big(\frac1{d_1}+\frac1{d_2}+\frac1{d_3}\Big).$$

      **Step 1: terms not divisible by 6 lead to a dead end.**
      - If $N$ is odd, all divisors are odd, so $d_1,d_2,d_3\ge3,5,7$ and $F(N)\le N\big(\frac13+\frac15+\frac17\big)<N$. Also $F(N)$ is a sum of three odd numbers, so it is odd.
      - If $N$ is even and $3\nmid N$, then $d_1=2$, $d_2\ge4$ and $d_3\ge5$, so $F(N)\le N\big(\frac12+\frac14+\frac15\big)<N$. Moreover $F(N)$ is odd or not divisible by $3$. If $4\mid N$, then $d_2=4$ and $F(N)=3\cdot\frac N4+\frac N{d_3}$, and the last term is not a multiple of $3$. If $4\nmid N$, then $d_2=p$, the smallest odd prime factor. If $d_3=2p$, then $F(N)=N\cdot\frac{p+3}{2p}$, not a multiple of $3$ since $3\nmid p$. If $d_3$ is odd, then $N/2$ is odd while $N/p$ and $N/d_3$ are even, so $F(N)$ is odd.

      So once a term is not a multiple of $6$, every later term is not a multiple of $6$ either, and the terms strictly decrease. A strictly decreasing sequence of positive integers can't be infinite. Hence **every term is a multiple of $6$**.

      **Step 2: multiples of 6.** Now $d_1=2$, $d_2=3$, and $d_3\in\{4,5,6\}$, because $6\mid N$.
      - If $4\mid N$: $F(N)=N\big(\frac12+\frac13+\frac14\big)=\frac{13}{12}N$.
      - If $4\nmid N$ and $5\mid N$: $F(N)=\frac{31}{30}N=31\cdot\frac N{30}$, which is odd since $\frac N{30}$ is odd. That breaks Step 1, so this never happens.
      - If $4\nmid N$ and $5\nmid N$: $F(N)=N\big(\frac12+\frac13+\frac16\big)=N$. The sequence stays put forever.

      **Step 3: putting it together.** Each step of the first kind lowers the exponent of $2$ by $2$, so it can only happen finitely often. So the sequence takes $j\ge0$ steps of the first kind and then sits at a fixed point $M$ with $2\| M$, $3\mid M$, $5\nmid M$. Since $a_{j+1}=(13/12)^j a_1$, we get $a_1=12^j\cdot M/13^j$. Writing $M=6\cdot13^j m$ (the factor $13^j$ must be there since $a_1$ is an integer, and $13^j$ is coprime to $12^j$) gives $a_1=6\cdot12^j m$ with $m$ odd and $5\nmid m$, that is, $\gcd(m,10)=1$.

      Conversely, if $a_1=6\cdot12^j m$ with $\gcd(m,10)=1$, then for $i\le j$ the term $a_i=6\cdot12^{j-i+1}13^{i-1}m$ is divisible by $12$, so the next term is $\frac{13}{12}a_i$. After $j$ steps we reach $6\cdot13^j m$, which is a fixed point because it is divisible by $6$ but not by $4$ or $5$. Every term is a multiple of $6$, so it has the proper divisors $1,2,3$, as required.
    checked: "script: running the sequence from every a₁ < 30,000 gives exactly the numbers 6·12^j·m with gcd(m, 10) = 1"
    status: ready

  - id: P5
    day: 2
    topic: "A game of sum budgets against square-sum budgets"
    areas: [algebra]
    difficulty: 3
    answer: 'Alice wins for $\lambda>1/\sqrt2$, Bazza wins for $\lambda<1/\sqrt2$, and at $\lambda=1/\sqrt2$ neither can force a win'
    hints:
      - 'Bazza can always use up his whole budget: pick $x_{2k}$ so that the sum of squares becomes exactly $2k$. What does that do to the ordinary sum?'
      - 'Alice can wait with zeros. By Cauchy–Schwarz, Bazza''s numbers after $2k$ turns add up to at most $k\sqrt2$.'
    solution: |
      **Key idea:** the threshold comes from a pair of turns. If Bazza fills his square budget, each pair of turns adds at least $\sqrt2$ to the ordinary sum. If Alice waits, Bazza's numbers add up to at most $k\sqrt2$ after $2k$ turns. Comparing $k\sqrt2$ with $2k\lambda$ gives $\lambda=1/\sqrt2$.

      Write $S_n=x_1+\dots+x_n$ and $Q_n=x_1^2+\dots+x_n^2$.

      **Bazza's plan: fill the square budget.** On each even turn $2k$, Bazza picks $x_{2k}=\sqrt{2k-Q_{2k-1}}$ whenever this is possible, making $Q_{2k}=2k$. It is possible as long as Alice's previous number satisfied $x_{2k-1}\le\sqrt2$, because then $Q_{2k-1}=2(k-1)+x_{2k-1}^2\le 2k$. With this plan each pair of turns has $x_{2i-1}^2+x_{2i}^2=2$, so
      $$\big(x_{2i-1}+x_{2i}\big)^2=2+2x_{2i-1}x_{2i}\ge2,\qquad x_{2i-1}+x_{2i}\ge\sqrt2,\qquad S_{2k}\ge k\sqrt2 .$$
      So on turn $2k+1$ Alice's number satisfies
      $$x_{2k+1}\le \lambda(2k+1)-S_{2k}\le k\,(2\lambda-\sqrt2)+\lambda .$$

      **Alice's plan: wait, then strike.** Alice plays $x_n=0$ on odd turns. This is always allowed when $\lambda\ge1/\sqrt2$: by Cauchy–Schwarz, Bazza's numbers satisfy $S_{2k}=x_2+x_4+\dots+x_{2k}\le\sqrt{k\cdot Q_{2k}}\le\sqrt{k\cdot2k}=k\sqrt2\le 2k\lambda<(2k+1)\lambda$. At a turn $2k+1$ of her choice she instead plays the largest number allowed, $x_{2k+1}=\lambda(2k+1)-S_{2k}\ge k(2\lambda-\sqrt2)+\lambda$.

      **$\lambda<1/\sqrt2$: Bazza wins.** Bazza uses his plan. While $k(2\lambda-\sqrt2)+\lambda\ge0$, Alice's numbers are at most $\lambda<\sqrt2$, so Bazza can always reply. But $2\lambda-\sqrt2<0$, so for large $k$ the bound $k(2\lambda-\sqrt2)+\lambda$ is negative, and Alice has no legal move.

      **$\lambda>1/\sqrt2$: Alice wins.** Alice waits with zeros, then strikes at a turn $2k+1$ with $\big(k(2\lambda-\sqrt2)+\lambda\big)^2>2k+2$. Such $k$ exists because the left side grows like $k^2$. Then $Q_{2k+1}\ge x_{2k+1}^2>2k+2$, and Bazza has no legal move on turn $2k+2$. (If Bazza gets stuck even earlier, Alice wins sooner.)

      **$\lambda=1/\sqrt2$: nobody can force a win.** Alice can play zeros forever (shown above), so she never loses. Bazza can follow his plan forever: Alice's numbers are at most $k(2\lambda-\sqrt2)+\lambda=\lambda<\sqrt2$, so he always has a reply, and he never loses either.
    checked: "algebra; also simulated: Bazza's plan beats random and greedy play by Alice at λ = 0.70, and Alice's plan beats Bazza's plan at λ = 0.72"
    status: ready

  - id: P6
    day: 2
    topic: "Fewest tiles leaving one hole per row and column"
    areas: [combinatorics]
    difficulty: 5
    answer: '$2112$'
    hints:
      - 'If the smallest rectangle containing two squares also contains an uncovered square, the two squares lie in different tiles. Look for many covered squares, every two of which are separated like this. Good candidates are the squares right next to the uncovered ones.'
      - 'Pick one uncovered square $x$ that lies on a long increasing run of uncovered squares and on a long decreasing run. Around $x$, use left or right neighbors and upper or lower neighbors depending on the quadrant. Counting the runs gives at least $n+2\sqrt n-3$ tiles.'
      - 'For the construction, think of the classic tiling of the plane by large squares and small squares. Here the large squares are $45\times45$ and the small ones are the uncovered squares.'
    solution: |
      **Key idea:** the uncovered squares form a permutation. Next to them sit covered squares that must lie in pairwise different tiles. Choosing them around one well-placed uncovered square gives $n+a+b-3$ of them, where $a$ and $b$ are the lengths of an increasing and a decreasing run of uncovered squares through it, and a counting argument makes $a+b\ge2\sqrt n$. A tilted pattern of $45\times45$ squares shows the bound is reached.

      Let $n=2025=k^2$ with $k=45$, and number the rows (top to bottom) and columns (left to right) from $0$ to $n-1$. Call the uncovered squares **holes**. There is one in each row and each column, and every other square is covered. We show the least number of tiles is $n+2k-3=2112$.

      **Part 1: at least 2112 tiles.**

      **A separation test.** For two squares $X$ and $Y$, let $\mathrm{box}(X,Y)$ be the smallest rectangle of squares containing both. A tile containing $X$ and $Y$ contains their box. So if the box contains a hole, then $X$ and $Y$ are different squares in different tiles. Hence a set of squares in which every two have a hole in their box needs at least that many tiles.

      **Neighbors.** For a hole $h$ in row $r_h$ and column $c_h$, write $L_h,R_h,U_h,D_h$ for the squares just left of, right of, above and below it. When they exist, they are covered, since a row or column holds only one hole. We call $L,R,U,D$ the **side** of the neighbor.

      **Lemma.** Let $X$ be a neighbor of the hole $h$ and $Y$ a neighbor of the hole $g$. Then $\mathrm{box}(X,Y)$ contains $h$, unless $Y$ lies *strictly* on the side of $h$ where $X$ is. For $X=L_h$ that means $Y$ is in a column $<c_h$; for $X=U_h$, a row $<r_h$; and so on.

      *Proof for $X=L_h$* (the other sides are the same, turned). The box contains row $r_h$ because $X$ is in it. Its columns run from column $c_h-1$ to the column of $Y$, so they include $c_h$ unless $Y$ is in a column $<c_h$. $\square$

      So the box of $X$ and $Y$ misses both holes only if $Y$ is strictly on $X$'s side of $h$ **and** $X$ is strictly on $Y$'s side of $g$. Call such a pair an **escape**. Checking the cases:
      - Two neighbors of the same hole never escape: a neighbor on another side of $h$ is in $h$'s row or column, so it is not strictly on $X$'s side.
      - Two neighbors on the same side never escape. For $L_h$ and $L_g$ it would need $c_g-1<c_h$ and $c_h-1<c_g$, so $c_g=c_h$.
      - $L_h,R_g$ escape only if $g$ is left of $h$; and $U_h,D_g$ only if $g$ is above $h$.
      - $L_h,U_g$ escape only if $g$ is below and to the left of $h$; and $L_h,D_g$ only if $g$ is above and to the left of $h$.
      - $R_h,U_g$ escape only if $g$ is below and to the right of $h$; and $R_h,D_g$ only if $g$ is above and to the right of $h$.

      (For example, for $L_h,U_g$: $Y=U_g$ must be left of column $c_h$, so $c_g<c_h$, and $X=L_h$ must be above row $r_g$, so $r_h<r_g$.)

      **Runs.** An **increasing run** is a list of holes, each below and to the right of the one before; a **decreasing run** goes below and to the left. Two holes of an increasing run are never placed one below-left of the other, and two holes of a decreasing run are never placed one below-right of the other.

      **The chosen squares.** Fix a hole $x$ in row $r_0$ and column $c_0$, an increasing run $I$ through $x$ with $a$ holes, and a decreasing run $J$ through $x$ with $b$ holes. Every other hole lies in one of the four quadrants around $x$: up-left, up-right, down-left, down-right. The holes of $I$ other than $x$ lie in the up-left and down-right quadrants; those of $J$ lie in the up-right and down-left quadrants. Choose neighbors as follows.
      - At $x$: all four sides.
      - At a hole $h$ in the up-left quadrant: side $L$ if some hole of $I$ in this quadrant lies weakly above and weakly to the right of $h$ (it may be $h$ itself), and side $U$ otherwise. Holes of $I$ get side $U$ as well, so they get both.
      - Up-right quadrant, sides $R$ and $U$: side $R$ if some hole of $J$ in the quadrant is weakly above and weakly left of $h$, side $U$ otherwise; holes of $J$ get both.
      - Down-left quadrant, sides $L$ and $D$: side $L$ if some hole of $J$ in the quadrant is weakly below and weakly right of $h$, side $D$ otherwise; holes of $J$ get both.
      - Down-right quadrant, sides $R$ and $D$: side $R$ if some hole of $I$ in the quadrant is weakly below and weakly left of $h$, side $D$ otherwise; holes of $I$ get both.

      That is $4+(n-1)+(a-1)+(b-1)=n+a+b+1$ choices. Note that side $L$ is used only at holes in columns $\le c_0$, side $R$ only in columns $\ge c_0$, side $U$ only in rows $\le r_0$, and side $D$ only in rows $\ge r_0$.

      **No escapes.** Same hole and same side are covered above.
      - $L_h,R_g$ would need $c_g<c_h$, but $c_h\le c_0\le c_g$. In the same way $U_h,D_g$ is impossible.
      - $L_h,U_g$ would need $g$ below-left of $h$. Then $r_h<r_g\le r_0$ and $c_g<c_h\le c_0$, so $h$ and $g$ are both in the up-left quadrant. Since $h$ has side $L$, some hole $z$ of $I$ there is weakly above-right of $h$, so strictly above-right of $g$. Then $g$ also has side $L$, and it has side $U$ only because it belongs to $I$. But then $z$ and $g$ are two holes of $I$ with $g$ below-left of $z$, which is impossible.
      - $L_h,D_g$ ($g$ above-left), $R_h,U_g$ ($g$ below-right) and $R_h,D_g$ ($g$ above-right) work the same way, in the down-left, up-right and down-right quadrants, using that a decreasing run has no pair placed below-right and an increasing run no pair placed below-left.

      **The grid edge.** A chosen side names no square only when it points off the grid, such as side $L$ at the hole in column $0$. There is one hole next to each of the four edges, so at most $4$ choices are lost. The remaining at least $n+a+b-3$ squares have a hole in the box of every two, so
      $$\#\text{tiles}\ \ge\ n+a+b-3 .$$

      **A good choice of $x$.** Let $I$ be a longest increasing run, with $a$ holes. For each hole $y$, let $\ell(y)$ be the length of the longest increasing run ending at $y$. If $y'$ is below-right of $y$, then $\ell(y')\ge\ell(y)+1$. So holes with the same value of $\ell$ form a decreasing run. The values lie between $1$ and $a$, so some value $m$ is taken by at least $n/a$ holes. Let $J$ be those holes, so $b=|J|\ge n/a$. The $m$-th hole of $I$ has $\ell=m$: at least $m$ because of the first $m$ holes of $I$, and not more, or the rest of $I$ would extend a longer run past length $a$. So the $m$-th hole of $I$ lies on both $I$ and $J$, and we take it as $x$. Then
      $$a+b\ \ge\ a+\frac na\ \ge\ 2\sqrt n=90,$$
      and every placement needs at least $2025+90-3=2112$ tiles.

      **Part 2: a placement with 2112 tiles.**

      **The holes.** Put a hole at row $ki+j$, column $kj+(k-1-i)$, for $0\le i,j\le k-1$. The row determines the pair $(i,j)$, and so does the column (it determines $j$ and $k-1-i$). So there is exactly one hole in each row and each column.

      **The whole plane.** For any square $(r,c)$ of the infinite plane, let $\varphi(r,c)$ be the remainder of $c-kr$ modulo $k^2+1$. Our holes have $c-kr=(k-1)-(k^2+1)i$, so $\varphi=k-1$. In the plane, call **every** square with $\varphi=k-1$ a hole. A row of the grid has $k^2<k^2+1$ squares, so their values of $\varphi$ are all different, and the grid gets no new holes.

      Below each hole $(r,c)$ of the plane, place the $k\times k$ square of rows $r+1,\dots,r+k$ and columns $c,\dots,c+k-1$. A square $p$ lies in the block of the hole $p-(t,s)$, for offsets $1\le t\le k$ and $0\le s\le k-1$. Since $\varphi$ is additive, $p-(t,s)$ is a hole exactly when $\varphi(p)-(k-1)\equiv s-kt$. The $k^2$ numbers $s-kt$ are the consecutive integers $-k^2,\dots,-1$, which hit every nonzero remainder modulo $k^2+1$ exactly once. So a non-hole $p$ lies in exactly one block, and a hole in none. The blocks tile the plane around the holes. Cutting them along the edge of the grid gives rectangles, one for each block that meets the grid, covering exactly the non-hole squares of the grid.

      **Counting the blocks that meet the grid.** Blocks lie below and to the right of their holes.
      - Holes in the grid: each block meets the grid, except for the hole in the last row. That gives $n-1$ blocks.
      - Holes above the grid: their blocks meet the grid only by crossing row $0$. Each block meets row $0$ in $k$ consecutive columns, cut at the grid's edge. The hole of row $0$ is in column $k-1$. To its right, the run containing column $k$ starts at column $k$, and the columns $k,\dots,k^2-1$ split into exactly $k-1$ runs of $k$. To its left, columns $0,\dots,k-2$ lie in one more run. None of these $k$ blocks belongs to a hole in the grid, since those blocks start in row $1$ or lower. That gives $k$ blocks.
      - Holes to the left of the grid, in rows $\ge0$: their blocks meet column $0$ below row $0$. The hole of column $0$ is in row $k(k-1)$, and below it lies that hole's own block. Above it, rows $0,\dots,k(k-1)-1$ split into $k-1$ runs of $k$. The top run is a block already counted (it meets row $0$). The other $k-2$ runs are blocks of holes to the left of the grid. That gives $k-2$ blocks.

      Blocks of holes below or to the right of the grid miss it. In total there are $(n-1)+k+(k-2)=n+2k-3=2112$ tiles, and each row and column has exactly one uncovered square.
