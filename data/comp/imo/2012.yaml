  - id: P4
    day: 2
    topic: "Integer functions with a symmetric quadratic rule on zero-sum triples"
    areas: [algebra, number-theory]
    difficulty: 3
    answer: '$f(x)=kx^2$; $f(x)=k$ for odd $x$ and $0$ for even $x$; $f(x)=0,k,4k,k$ for $x\equiv0,1,2,3\pmod4$ (any integer $k$)'
    hints:
      - 'Read the rule as a quadratic in $f(a+b)$ (use the triple $(a,b,-a-b)$ and that $f$ is even). Its roots are $f(a)+f(b)\pm2\sqrt{f(a)f(b)}$.'
      - 'Let $k=f(1)$. Then $f(2)\in\{0,4k\}$, $f(3)\in\{k,9k\}$, $f(4)\in\{0,16k\}$. Each branch either becomes periodic or is forced to $kn^2$.'
    solution: |
      **Key idea:** the rule says $f(a+b)$ is a root of a quadratic with roots $f(a)+f(b)\pm2\sqrt{f(a)f(b)}$. Starting from $k=f(1)$, the first few values split into three branches, and each branch is then forced.

      **Basics.** $(0,0,0)$: $3f(0)^2=6f(0)^2$, so $f(0)=0$. $(a,-a,0)$: $(f(a)-f(-a))^2=0$, so $f$ is even. Using $(a,b,-a-b)$ and evenness, the rule is a quadratic in $f(a+b)$:
      $$f(a+b)^2-2\big(f(a)+f(b)\big)f(a+b)+\big(f(a)-f(b)\big)^2=0,$$
      whose roots are $f(a)+f(b)\pm2\sqrt{f(a)f(b)}$ (the discriminant $4f(a)f(b)$ is $\ge0$ since a root exists). $\quad(\dagger)$

      Let $k=f(1)$. If $k=0$, then $(\dagger)$ with $b=1$ gives $f(n+1)=f(n)$, so $f\equiv0$ (which is $kx^2$ with $k=0$). From now on $k\ne0$.

      **$f(2)$.** $(\dagger)$ with $a=b$: $f(2a)\in\{0,4f(a)\}$. So $f(2)\in\{0,4k\}$.

      **Branch $f(2)=0$.** $(\dagger)$ with $b=2$: $f(n+2)=f(n)$. So $f$ is $k$ on odd numbers and $0$ on even numbers.

      **Branch $f(2)=4k$.** $(\dagger)$ with $(a,b)=(2,1)$: $f(3)=5k\pm4k\in\{k,9k\}$. Also $f(4)\in\{0,4f(2)\}=\{0,16k\}$, and $(\dagger)$ with $(3,1)$ gives $f(4)=f(3)+k\pm2\sqrt{kf(3)}$.
      - If $f(3)=k$: $f(4)\in\{0,4k\}$, so $f(4)=0$. Then $(\dagger)$ with $b=4$ gives $f(n+4)=f(n)$: the values are $0,k,4k,k$ by residue mod $4$.
      - If $f(3)=9k$: $f(4)\in\{4k,16k\}$, so $f(4)=16k$. Now suppose $f(j)=kj^2$ for $j\le n$, with $n\ge4$. $(\dagger)$ with $(n,1)$ gives $f(n+1)\in\{k(n+1)^2,k(n-1)^2\}$, and with $(n-1,2)$ gives $f(n+1)\in\{k(n+1)^2,k(n-3)^2\}$. Since $(n-1)^2\ne(n-3)^2$ for $n\ne2$, $f(n+1)=k(n+1)^2$. So $f(x)=kx^2$.

      **Check.** Each of the three families satisfies the rule for every zero-sum triple: for $kx^2$ this is the identity $\sum a^4=2\sum a^2b^2$ when $a+b+c=0$, and for the two periodic families it is a finite check of residues.
    checked: "script: the three families pass every triple with |a|, |b| ≤ 30 for several k; a search of f(1..5) in [−150, 150] finds only these"
    status: ready

  - id: P5
    day: 2
    topic: "Right triangle, two circles, and equal tangent lengths"
    areas: [geometry]
    difficulty: 3
    hints:
      - 'Draw the circle about $A$ through $C$ (it contains $L$) and the circle about $B$ through $C$ (it contains $K$). Line $CD$ is their common chord line, and $X$ is on it.'
      - 'Let lines $AX$ and $BX$ meet these circles again at $K''$ and $L''$. Show $K,K'',L,L''$ lie on one circle, and that $AL$ and $BK$ are tangent to it.'
    solution: |
      **Key idea:** $K$ and $L$ lie on one circle $\Gamma$ to which $AL$ and $BK$ are both tangent. Then $MK$ and $ML$ are the two tangent segments from $M$ to $\Gamma$.

      Let $\omega_A$ be the circle with center $A$ through $C$, and $\omega_B$ the circle with center $B$ through $C$. Then $L\in\omega_A$ and $K\in\omega_B$.

      **Tangents at $C$.** $\angle ACB=90^\circ$, so $AC$ is tangent to $\omega_B$ at $C$, and $BC$ is tangent to $\omega_A$ at $C$. Hence the power of $A$ with respect to $\omega_B$ is $AC^2$, and the power of $B$ with respect to $\omega_A$ is $BC^2$.

      **The common chord.** The two circles meet at $C$ and at its reflection $C'$ in line $AB$. So their radical axis is line $CC'$, which is line $CD$. The point $X$ is on it, so it has the same power with respect to both circles.

      **A circle through four points.** Let line $AX$ meet $\omega_B$ at $K$ and $K'$, and line $BX$ meet $\omega_A$ at $L$ and $L'$. Then
      $$XK\cdot XK'=\operatorname{pow}_{\omega_B}(X)=\operatorname{pow}_{\omega_A}(X)=XL\cdot XL' .$$
      So $K,K',L,L'$ lie on one circle $\Gamma$ (converse of the power of a point).

      **Two tangents.** $A$ lies on line $KK'$, so its power with respect to $\Gamma$ is $AK\cdot AK'$, which is its power with respect to $\omega_B$, namely $AC^2=AL^2$. Since $L\in\Gamma$, the line $AL$ meets $\Gamma$ at $L$ and at a point $L^*$ with $AL\cdot AL^*=AL^2$, so $L^*=L$. That means $AL$ is tangent to $\Gamma$ at $L$. In the same way, $B$ has power $BL\cdot BL'=BC^2=BK^2$, so $BK$ is tangent to $\Gamma$ at $K$.

      **Finish.** $M$ is where the tangents at $K$ and $L$ meet. Two tangent segments from one point to a circle are equal, so $MK=ML$.
    viz: imo-2012-p5
    checked: "script: 1,000 random right triangles and points X; |MK − ML| below 2e-14"
    status: ready

