  - id: P4
    day: 2
    topic: "Doubling cevians across the base; meeting on the circumcircle"
    areas: [geometry]
    difficulty: 2
    hints:
      - 'Triangles $BAP$ and $BCA$ are similar, and so are $CAQ$ and $CBA$. Find $AP$, $AQ$, $BP$, $CQ$ in terms of the sides.'
      - 'Show triangles $BPM$ and $NQC$ are similar. Then add up angles in triangle $BXC$.'
    solution: |
      **Key idea:** the two cevians have the same length, and the doubled points make two similar triangles. Then the angle at the meeting point is $180^\circ-\angle A$, so it is on the circumcircle.

      Let $a,b,c$ be the sides and $\alpha=\angle A$.

      **Lengths.** $\angle PAB=\angle C$ and the angle at $B$ is shared, so triangles $BAP$ and $BCA$ are similar: $BP=\dfrac{c^2}a$, $AP=\dfrac{bc}a$, and $\angle APB=\alpha$. In the same way $CQ=\dfrac{b^2}a$, $AQ=\dfrac{bc}a$, and $\angle AQC=\alpha$. So $PM=AP=AQ=QN=\dfrac{bc}a$.

      **Similar triangles.** $M$ is on ray $AP$ beyond $P$, so $\angle BPM=180^\circ-\angle APB=180^\circ-\alpha$. Likewise $\angle NQC=180^\circ-\alpha$. Also
      $$\frac{BP}{PM}=\frac{c^2/a}{bc/a}=\frac cb,\qquad\frac{NQ}{QC}=\frac{bc/a}{b^2/a}=\frac cb .$$
      So triangles $BPM$ and $NQC$ are similar (equal angle between proportional sides), and $\angle PBM=\angle QNC$.

      **The meeting point.** Let $X$ be where $BM$ and $CN$ meet; it lies on the other side of $BC$ from $A$. Then
      $$\angle XBC+\angle XCB=\angle PBM+\angle QCN=\angle QNC+\angle QCN=180^\circ-\angle NQC=\alpha .$$
      So $\angle BXC=180^\circ-\alpha$. A point on the opposite side of $BC$ from $A$ that sees $BC$ at $180^\circ-\alpha$ lies on the circumcircle.
    viz: imo-2014-p4
    checked: "script: 1,000 random acute triangles; the meeting point is on the circumcircle to 1e-15"
    status: ready

  - id: P5
    day: 2
    topic: "Packing unit-fraction coins into at most 100 groups"
    areas: [combinatorics, number-theory]
    difficulty: 4
    hints:
      - 'Tidy up first: two coins $\frac1{2k}$ can be treated as one coin $\frac1k$, and $d$ coins $\frac1d$ make a full group by themselves.'
      - 'After tidying, put the denominators $2k-1$ and $2k$ together in group $k$. Then add the small coins greedily.'
    solution: |
      **Key idea:** after tidying, the coins with denominators $2k-1$ and $2k$ fit into one group. The remaining coins are tiny, and a greedy filling can only fail if every group is nearly full, which the total doesn't allow.

      Keep track of $N$, the number of groups still available, and the total value $V$ of the coins not yet placed. At the start $N=100$ and $V\le N-\tfrac12$.

      **Tidying.** Repeat while possible:
      - If there are two coins $\frac1{2k}$, glue them into one "coin" of value $\frac1k$ (they will go to the same group).
      - If there are $d$ coins $\frac1d$ (for any $d$, including $d=1$), put them in a group of their own. This uses one group and removes value exactly $1$, so $V\le N-\tfrac12$ still holds.

      Each step lowers the number of coins, so this stops. Afterwards: at most one coin $\frac1{2k}$ for each $k$, and at most $d-1$ coins $\frac1d$ for each odd $d$. Also $N\ge1$ unless nothing is left, because $V\ge0$.

      **The first $N$ groups.** Put all coins with denominators $2k-1$ and $2k$ into group $k$, for $k=1,\dots,N$. Its value is at most
      $$\frac{2k-2}{2k-1}+\frac1{2k}<\frac{2k-2}{2k-1}+\frac1{2k-1}=1 .$$

      **Small coins.** The coins left have denominators at least $2N+1$, so each is at most $\frac1{2N+1}$. Place them one by one into any group where they fit. If some coin fits nowhere, every group has value more than $1-\frac1{2N+1}=\frac{2N}{2N+1}$, and
      $$V>\frac{2N^2}{2N+1}=N-\frac{N}{2N+1}>N-\frac12,$$
      a contradiction. So all coins are placed, in the $N$ groups plus the full groups made earlier. That is at most $100$ groups, each of value at most $1$.
    checked: "script: the procedure run with exact fractions on 400 random collections with 5, 10 or 20 groups and total ≤ groups − ½; it never failed"
    status: ready

