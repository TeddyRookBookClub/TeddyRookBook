  - id: P4
    day: 2
    topic: "Two circles through a base point and a collinear orthocenter"
    areas: [geometry]
    difficulty: 3
    hints:
      - 'Let the two circles meet again at $Z$. Since $BCMN$ is cyclic, $A$ has the same power with respect to both circles. So $A$, $Z$, $W$ are collinear.'
      - '$X$ and $Y$ both lie on the line through $Z$ perpendicular to $AW$. Show $H$ is on it too, using $AZ\cdot AW=AN\cdot AB=AH\cdot AD$, where $D$ is the foot from $A$.'
    solution: |
      **Key idea:** the second meeting point $Z$ of the two circles lies on line $AW$. The diameters through $W$ make $X$, $Z$, $Y$ lie on the perpendicular to $AW$ at $Z$, and a power-of-a-point computation puts $H$ on that perpendicular too.

      Let $D$ be the foot of the altitude from $A$, and let $\omega_1$ and $\omega_2$ meet again at $Z$.

      **$A$ is on the common chord.** $\angle BNC=\angle BMC=90^\circ$, so $B,C,M,N$ lie on one circle and $AN\cdot AB=AM\cdot AC$. The left side is the power of $A$ with respect to $\omega_1$ (line $AB$ meets it at $N$ and $B$), and the right side is its power with respect to $\omega_2$. So $A$ lies on the radical axis $WZ$: the points $A$, $Z$, $W$ are collinear.

      **$X$, $Z$, $Y$ are collinear.** $WX$ is a diameter of $\omega_1$, so $\angle WZX=90^\circ$. Likewise $\angle WZY=90^\circ$. So $X$ and $Y$ both lie on the line $\ell$ through $Z$ perpendicular to $ZW$, which is line $AW$.

      **$H$ is on $\ell$.** $\angle BNH=\angle BDH=90^\circ$, so $B,N,H,D$ are concyclic and $AN\cdot AB=AH\cdot AD$. Together with the first step,
      $$AZ\cdot AW=AH\cdot AD .$$
      So $Z,W,D,H$ are concyclic (converse of the power of a point). In that circle, $\angle HZW$ is equal or supplementary to $\angle HDW=90^\circ$, so $HZ\perp AW$, and $H\in\ell$.

      **Edge cases.** If $Z=W$ (the circles touch), $\ell$ is the line through $W$ perpendicular to $AW$, and $AW^2=AH\cdot AD$ makes triangles $AWH$ and $ADW$ similar, so $\angle AWH=\angle ADW=90^\circ$ and again $H\in\ell$. If $W=D$, the equation gives $AZ=AH$, so $Z=H$, which is on $\ell$.

      So $X$, $Y$ and $H$ are collinear.
    viz: imo-2013-p4
    checked: "script: 1,000 random acute triangles and points W; the distance from H to line XY is below 2e-15"
    status: ready

  - id: P5
    day: 2
    topic: "Super-additive, sub-multiplicative function on positive rationals"
    areas: [algebra]
    difficulty: 3
    hints:
      - 'From (i) with $y=1$ and (iii), $f(1)\ge1$. Then (ii) gives $f(n)\ge n$ for integers, and $f$ is positive and increasing.'
      - 'Show $f(x)\ge x$ for $x>1$ using $f(x)^n\ge f(x^n)\ge\lfloor x^n\rfloor$. Then use $a^n$ to squeeze $f(m)\le m$ for integers $m$.'
    solution: |
      **Key idea:** first show $f(x)\ge x$ for $x>1$. The fixed point $a$ gives $f(a^n)=a^n$ for all powers, and super-additivity at those huge values squeezes $f(m)\le m$ for integers. Then rationals follow from (i) and (ii).

      **Step 1: basic facts.** By (i) with $x=a$, $y=1$: $af(1)=f(a)f(1)\ge f(a)=a$, so $f(1)\ge1$. By (ii), $f(n)\ge nf(1)\ge n$ for every positive integer $n$. For $x=\frac pq$, (i) gives $f(q)f(x)\ge f(p)>0$, so $f(x)>0$ for all $x$. Then (ii) shows $f$ is strictly increasing: $f(x+y)\ge f(x)+f(y)>f(x)$.

      **Step 2: $f(x)\ge x$ for $x>1$.** For $z\ge1$, $f(z)\ge f(\lfloor z\rfloor)\ge\lfloor z\rfloor>z-1$. By (i) repeatedly (all values are positive), $f(x)^n\ge f(x^n)>x^n-1$. So $f(x)>(x^n-1)^{1/n}$ for every $n$, and letting $n\to\infty$ gives $f(x)\ge x$.

      **Step 3: $f(m)=m$ for integers.** By (i), $f(a^n)\le f(a)^n=a^n$, and by Step 2, $f(a^n)\ge a^n$. So $f(a^n)=a^n$. Fix a positive integer $m$ and take $n$ so large that $a^n-m>1$. Then by (ii) and Step 2,
      $$a^n=f(a^n)\ge f(a^n-m)+f(m)\ge a^n-m+f(m),$$
      so $f(m)\le m$. With Step 1, $f(m)=m$.

      **Step 4: rationals.** Let $x=\frac pq$. By (i), $f(q)f(x)\ge f(p)$, so $f(x)\ge\frac pq$. By (ii) applied $q$ times, $f(p)=f(qx)\ge qf(x)$, so $f(x)\le\frac pq$. Hence $f(x)=x$.
    checked: "logic: four steps; the limit in Step 2 uses (x^n − 1)^(1/n) → x for x > 1"
    status: ready

