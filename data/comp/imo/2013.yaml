problems:
  - id: P1
    day: 1
    topic: "Splitting a fraction into a product of unit steps"
    areas: [number-theory]
    difficulty: 2
    hints:
      - 'Use induction on $k$. Peel off one factor $1+\frac1m$ so that what is left has the same shape with $k-1$ and a new denominator.'
      - 'Treat even and odd $n$ separately. For $n=2t$ the leftover should be $1+\frac{2^{k-1}-1}{t}$; the same works for $n=2t-1$.'
    solution: |
      **Key idea:** induction on $k$. One factor $1+\frac1m$ can always be split off so that the remaining fraction is of the same type with $2^{k-1}-1$ on top and about half the denominator.

      **Base.** For $k=1$, take $m_1=n$.

      **Step.** Suppose the claim holds for $k-1$ and every $n$. Note
      $$1+\frac{2^{k-1}-1}{t}=\frac{2t+2^k-2}{2t}.$$
      - **$n=2t$ even.**
      $$1+\frac{2^k-1}{2t}=\frac{2t+2^k-1}{2t}=\frac{2t+2^k-2}{2t}\cdot\frac{2t+2^k-1}{2t+2^k-2}=\Big(1+\frac{2^{k-1}-1}{t}\Big)\Big(1+\frac1{2t+2^k-2}\Big).$$
      - **$n=2t-1$ odd.**
      $$1+\frac{2^k-1}{2t-1}=\frac{2t+2^k-2}{2t-1}=\frac{2t+2^k-2}{2t}\cdot\frac{2t}{2t-1}=\Big(1+\frac{2^{k-1}-1}{t}\Big)\Big(1+\frac1{2t-1}\Big).$$

      In both cases the first factor is a product of $k-1$ factors $1+\frac1{m_i}$ by the induction hypothesis (with $t$ in place of $n$), and the second factor is one more, with a positive integer denominator. That gives $k$ factors.
    checked: "exact arithmetic: the recursive construction verified for k ≤ 8 and n < 200"
    status: ready

  - id: P2
    day: 1
    topic: "Fewest lines to separate red and blue points"
    areas: [combinatorics, geometry]
    difficulty: 3
    answer: '$k=2013$'
    hints:
      - 'Lower bound: put the points on a circle, alternating colors as much as possible. Each line crosses the circle at most twice.'
      - 'Upper bound: two lines parallel to a segment, very close to it, cut off exactly the two endpoints. Pair up the points of one color, after using one line on the convex hull.'
    solution: |
      **Key idea:** on a circle with alternating colors, every color change needs its own crossing, and a line crosses the circle only twice. Conversely, pairs of same-colored points can be fenced off by thin strips, and one extra line at the convex hull handles the odd one out.

      **Lower bound.** Place the $4027$ points on a circle in the order $R,B,R,B,\dots,R,B,B$. No three points of a circle are collinear. Each of the $2013$ red points has blue points on both sides, so there are $4026$ arcs between neighbors of different colors. For such neighbors $P,Q$, some line must separate them, so it crosses the chord $PQ$. A line entering the region between the chord and the short arc $PQ$ through the chord must leave through the arc. So each of these $4026$ arcs is crossed by some line, and a line meets the circle at most twice. So at least $2013$ lines are needed.

      **Strips.** For two points $P,Q$ of the configuration, take the two lines parallel to $PQ$ at a tiny distance on either side. If the distance is small enough, the strip between them contains no other point of the configuration (no three are collinear). So these two lines cut $P$ and $Q$ off from all other points.

      **Upper bound.** Look at the convex hull.
      - If some vertex of the hull is red, one line cuts that red point off from the rest. Pair the other $2012$ red points into $1006$ pairs and use two strip lines for each pair: $1+2012=2013$ lines. Every region containing a red point lies inside a strip or inside the cut-off part, and these contain only red points. Every other region contains only blue points.
      - If every hull vertex is blue, take two neighboring hull vertices; one line cuts these two blue points off. Pair the remaining $2012$ blue points with strips: again $2013$ lines, and now every region with a blue point contains only blue points, and the rest only red.

      So $2013$ lines always suffice, and the answer is $k=2013$.
    checked: "logic: the circle argument and the strip construction; the count 1 + 2·1006 = 2013"
    status: ready

