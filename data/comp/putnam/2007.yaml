problems:
  - id: A1
    topic: "Calculus: tangency of a parabola and its mirror image"
    areas: [calculus, algebra]
    difficulty: 2
    answer: '$\alpha=\tfrac23,\ \tfrac32,\ \dfrac{13\pm\sqrt{601}}{12}$'
    hints:
      - 'The second curve is the mirror image of the first in the line $y=x$. Subtract the two equations.'
      - 'Tangency means parallel normal vectors. Show this can only happen on the line $y=x$, where the slope must be $1$ or $-1$.'
    solution: |
      **Key idea:** the curves are mirror images in $y=x$; a tangency off that line is impossible, and on it the parabola's slope must be $\pm1$.

      Let $F(x,y)=\alpha x^2+\alpha x+\frac1{24}-y$ and $G(x,y)=F(y,x)$. ($\alpha=0$ gives two perpendicular lines, so assume $\alpha\ne0$.)

      **Where can they be tangent?** Tangency at a common point means $\nabla F=(2\alpha x+\alpha,-1)$ and $\nabla G=(-1,2\alpha y+\alpha)$ are parallel, i.e. with $u=2\alpha x+\alpha$, $v=2\alpha y+\alpha$:
      $$uv=1 .$$
      Subtracting $F=0$ and $G=0$ gives $(x-y)\big(\alpha(x+y)+\alpha+1\big)=0$. If $x\ne y$, then $\alpha(x+y)=-\alpha-1$, so $u+v=2\alpha(x+y)+2\alpha=-2$. With $uv=1$ this forces $u=v=-1$, hence $x=y$, a contradiction. So tangency happens only at points with $x=y$, where $u=v$ and $u^2=1$: the parabola's slope there is $1$ or $-1$.

      **Slope $1$.** The parabola touches the line $y=x$: $\alpha x^2+(\alpha-1)x+\frac1{24}=0$ has a double root, so $(\alpha-1)^2=\frac\alpha6$, i.e. $6\alpha^2-13\alpha+6=0$, giving $\alpha=\frac23$ or $\frac32$.

      **Slope $-1$.** We need $2\alpha x+\alpha=-1$, so $x=-\frac{1+\alpha}{2\alpha}$, and the point must lie on $y=x$: $\alpha x^2+(\alpha-1)x+\frac1{24}=0$. Substituting,
      $$\frac{(1+\alpha)^2}{4\alpha}-\frac{(\alpha-1)(\alpha+1)}{2\alpha}+\frac1{24}=0\iff\frac{3+2\alpha-\alpha^2}{4\alpha}=-\frac1{24}\iff6\alpha^2-13\alpha-18=0,$$
      so $\alpha=\frac{13\pm\sqrt{601}}{12}$.

      All four values give a tangency (at a point on $y=x$, both curves pass through it with the same tangent line).
    checked: "script: sympy's discriminant of the intersection resultant factors as (2α−3)(3α−2)(6α²−13α−18)³ times a power of α"
    status: ready

  - id: A2
    topic: "Geometry: smallest convex set meeting four hyperbola branches"
    areas: [geometry]
    difficulty: 2
    answer: '$4$'
    hints:
      - 'Pick one point on each branch, one in each quadrant. The convex set contains their convex hull.'
      - 'Split the hull into four triangles at the origin. Each has area at least $1$.'
    solution: |
      **Key idea:** one point per branch, one per quadrant; the hull contains the origin, and the four triangles from the origin each have area at least $1$ by AM–GM.

      The four branches lie in the four open quadrants. A convex set meeting them contains points $P_1=(a,\frac1a)$, $P_2=(-b,\frac1b)$, $P_3=(-c,-\frac1c)$, $P_4=(d,-\frac1d)$ with $a,b,c,d>0$, and so contains their convex hull $H$.

      **The origin is in $H$.** Otherwise a line through the origin would have $H$ strictly on one side: $w\cdot P_i>0$ for some fixed $w=(w_1,w_2)\ne0$ and all $i$. Take the quadrant whose $x$-sign is opposite to the sign of $w_1$ and whose $y$-sign is opposite to the sign of $w_2$ (either sign where $w_j=0$). Its point $P_i$ has $w\cdot P_i<0$, a contradiction.

      **Four triangles.** The points are in angular order around the origin, with consecutive angles less than $\pi$ apart, so the triangles $OP_1P_2$, $OP_2P_3$, $OP_3P_4$, $OP_4P_1$ lie in $H$ and do not overlap. For the first,
      $$\text{area}=\tfrac12\Big|a\cdot\tfrac1b-(-b)\cdot\tfrac1a\Big|=\tfrac12\Big(\frac ab+\frac ba\Big)\ge1 ,$$
      and the other three work the same way. So the area is at least $4$.

      **Equality.** The square with vertices $(\pm1,\pm1)$ has area $4$ and its corners lie on all four branches.
    viz: putnam-2007-a2
    checked: "proof; the bound is AM–GM, and the square attains it"
    status: ready

  - id: A3
    topic: "Probability: random order avoiding partial sums divisible by 3"
    areas: [probability, combinatorics]
    difficulty: 3
    answer: '$\dfrac{k!\,(k+1)!}{(3k+1)\,(2k)!}$'
    hints:
      - 'Work mod $3$. Ignore the multiples of $3$ at first: what must the sequence of nonzero residues look like?'
      - 'Multiples of $3$ do not change the running sum mod $3$, so they may go anywhere except first.'
    solution: |
      **Key idea:** mod $3$, the nonzero residues are forced into one pattern, and the multiples of $3$ can go anywhere except the very first place.

      Among $1,\dots,3k+1$ there are $k+1$ numbers $\equiv1$, $k$ numbers $\equiv2$, and $k$ multiples of $3$ (mod $3$).

      **Nonzero residues.** Track the running sum mod $3$; it must never be $0$ (a positive sum divisible by $3$). If it is $1$, the next nonzero residue must be $1$ (making $2$), not $2$ (making $0$). If it is $2$, the next must be $2$. Starting with a $1$ forces $1,1,2,1,2,\dots,1,2$, which uses one more $1$ than $2$s. Starting with a $2$ forces $2,2,1,2,1,\dots$, which uses more $2$s than $1$s, impossible here. So the $2k+1$ nonzero residues must appear in the single order $1,1,2,1,2,\dots,1,2$. In a random order, the residues of these $2k+1$ numbers form a uniformly random arrangement of $k+1$ ones and $k$ twos, so this happens with probability $\frac{(k+1)!\,k!}{(2k+1)!}$.

      **Multiples of 3.** A multiple of $3$ leaves the running sum mod $3$ unchanged, so it is harmless unless it comes first (then the sum is a positive multiple of $3$ right away). The positions of the $k$ multiples of $3$ are independent of the relative order of the other numbers, and the first position is a non-multiple with probability $\frac{2k+1}{3k+1}$.

      Multiplying,
      $$P=\frac{(k+1)!\,k!}{(2k+1)!}\cdot\frac{2k+1}{3k+1}=\frac{k!\,(k+1)!}{(3k+1)\,(2k)!}.$$
    checked: "script: brute force over all orders for k = 1, 2, 3 gives 1/4, 1/14, 1/50, matching the formula"
    status: ready

  - id: A4
    topic: "Polynomials: maps that send repunits to repunits"
    areas: [algebra, number-theory]
    difficulty: 3
    answer: '$f(x)=\dfrac{10^c(9x+1)^d-1}{9}$ with integers $d\ge0$ and $c\ge1-d$'
    hints:
      - 'A repunit is $\frac{10^m-1}9$. Change variables so that repunits become powers of $10$.'
      - 'If a polynomial $g$ sends every $10^m$ to a power of $10$, compare $g(10^m)$ with its leading term as $m\to\infty$.'
    solution: |
      **Key idea:** after the change of variable $x\mapsto9x+1$, the question becomes which polynomials send powers of $10$ to powers of $10$; growth forces $g(x)=10^cx^d$.

      Write $R_m=\frac{10^m-1}9$ for $m\ge1$. Let $g(x)=9f\big(\frac{x-1}9\big)+1$, a polynomial with real coefficients. Then $9R_m+1=10^m$, and $f(R_m)=R_{h(m)}$ for some $h(m)\ge1$ means
      $$g(10^m)=10^{h(m)}\qquad\text{for all }m\ge1 .$$

      **Form of $g$.** $g$ is not the zero polynomial. Let $d=\deg g$ and $A$ its leading coefficient. Then $\frac{g(10^m)}{10^{dm}}\to A$, and the left side equals $10^{h(m)-dm}$, a power of $10$ with integer exponent. Positive powers of $10$ with integer exponents can approach a nonzero limit only if the exponents are eventually constant, say equal to $c$, and then $A=10^c$. So $g(10^m)=10^c\cdot10^{dm}$ for all large $m$, and the polynomial $g(x)-10^cx^d$ has infinitely many roots. Hence $g(x)=10^cx^d$.

      **Back to $f$.** $f(x)=\frac{g(9x+1)-1}9=\frac{10^c(9x+1)^d-1}9$, and then $f(R_m)=R_{c+dm}$. This is a repunit for every $m\ge1$ exactly when $c+dm\ge1$ for all $m\ge1$, i.e. $c+d\ge1$ (with $d\ge0$).

      So the solutions are $f(x)=\frac{10^c(9x+1)^d-1}9$ with integers $d\ge0$, $c\ge1-d$. Examples: the constants $R_c$ ($d=0$), $f(x)=x$ ($c=0,d=1$), and $f(x)=10x+1$ ($c=1,d=1$).
    checked: "script: for (c, d) = (0,1), (1,1), (−1,2), (3,0), (−2,3), (2,2) the formula sends R_1 … R_8 to repunits; the growth argument is the proof"
    status: ready

  - id: A5
    topic: "Group theory: elements of prime order, count mod p"
    areas: [algebra]
    difficulty: 3
    hints:
      - 'Count the $p$-tuples $(g_1,\dots,g_p)$ with $g_1g_2\cdots g_p=e$.'
      - 'Rotating such a tuple gives another one. Which tuples are fixed by rotation?'
    solution: |
      **Key idea:** count solutions of $g_1g_2\cdots g_p=e$ in two ways: there are $|G|^{p-1}$ of them, and cyclic rotation groups them into orbits of size $p$ except for the constant tuples.

      If $p\nmid|G|$, there are no elements of order $p$ (Lagrange), so $n=0$. Assume $p\mid|G|$.

      Let $X$ be the set of $p$-tuples with $g_1g_2\cdots g_p=e$. The first $p-1$ entries are free and the last is then determined, so $|X|=|G|^{p-1}$, a multiple of $p$.

      If $g_1g_2\cdots g_p=e$, then $g_2\cdots g_pg_1=g_1^{-1}(g_1\cdots g_p)g_1=e$. So rotating a tuple keeps it in $X$. Rotation generates a cyclic group of order $p$ acting on $X$; since $p$ is prime, each orbit has size $1$ or $p$. Orbits of size $1$ are constant tuples $(g,\dots,g)$ with $g^p=e$: the identity and the $n$ elements of order $p$. So
      $$|G|^{p-1}=|X|\equiv n+1\pmod p,$$
      and $p\mid n+1$.
    checked: "script: checked n ≡ −1 (mod p) or n = 0 for p = 2, 3, 5 in S4, A5, S5 and a dihedral group"
    status: ready

