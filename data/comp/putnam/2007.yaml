  - id: B1
    topic: "Number theory: divisibility after one iteration of a polynomial"
    areas: [number-theory, algebra]
    difficulty: 1
    hints:
      - 'Mod $f(n)$, the number $f(n)+1$ is $1$.'
    solution: |
      **Key idea:** modulo $f(n)$, plugging in $f(n)+1$ is the same as plugging in $1$.

      For an integer polynomial, $u\equiv v\pmod M$ implies $f(u)\equiv f(v)\pmod M$. With $M=f(n)$, $u=f(n)+1$, $v=1$:
      $$f(f(n)+1)\equiv f(1)\pmod{f(n)}.$$
      So $f(n)$ divides $f(f(n)+1)$ exactly when it divides $f(1)$.

      - For $n=1$ this holds.
      - For $n\ge2$: $f$ has positive coefficients and is not constant, so it is strictly increasing on the positive numbers, and $f(n)>f(1)>0$. A number larger than $f(1)$ cannot divide it.
    checked: "proof only"
    status: ready

  - id: B2
    topic: "Integral inequality: partial integral bounded by the derivative"
    areas: [analysis, calculus]
    difficulty: 2
    hints:
      - 'Use $\int_0^1f=0$ to write $\int_0^\alpha f$ as a double integral of $f(x)-f(y)$ over $x<\alpha<y$.'
      - '$|f(x)-f(y)|\le M|x-y|$ with $M=\max|f''|$.'
    solution: |
      **Key idea:** since $f$ has mean zero, $\int_0^\alpha f$ is an average of differences $f(x)-f(y)$ across $\alpha$; each is at most $M$ times the distance, and that double integral is at most $\frac18$.

      Let $F=\int_0^\alpha f$, so $\int_\alpha^1f=-F$. Then
      $$\int_0^\alpha\!\!\int_\alpha^1\big(f(x)-f(y)\big)\,dy\,dx=(1-\alpha)F-\alpha(-F)=F .$$
      With $M=\max|f'|$, the mean value theorem gives $|f(x)-f(y)|\le M(y-x)$ for $x<y$. Hence
      $$|F|\le M\int_0^\alpha\!\!\int_\alpha^1(y-x)\,dy\,dx=M\Big(\alpha\cdot\frac{1-\alpha^2}2-(1-\alpha)\frac{\alpha^2}2\Big)=M\,\frac{\alpha(1-\alpha)}2\le\frac M8,$$
      since $\alpha(1-\alpha)\le\frac14$.
    checked: "script: random polynomials with mean zero; max |∫₀^α f| ≤ max|f′|/8 every time"
    status: ready

  - id: B3
    topic: "Recurrences: floor with root 5 gives Fibonacci numbers"
    areas: [number-theory, algebra]
    difficulty: 3
    answer: '$x_{2007}=2^{2006}F_{4017}=\dfrac{2^{2006}}{\sqrt5}\Big(\varphi^{4017}+\varphi^{-4017}\Big)$, with $\varphi=\frac{1+\sqrt5}2$'
    hints:
      - 'Divide the given terms by powers of $2$ and compare with Fibonacci numbers.'
      - 'Use $L_m^2-5F_m^2=-4$ for odd $m$ ($L_m$ the Lucas numbers) to evaluate the floor.'
    solution: |
      **Key idea:** $x_n=2^{n-1}F_{2n+3}$; the floor of $\sqrt5\,x_n$ is $2^{n-1}L_{2n+3}$ because $\sqrt5F_m$ is just above the Lucas number $L_m$ when $m$ is odd.

      Let $F_m$ be the Fibonacci numbers ($F_1=F_2=1$) and $L_m=F_{m-1}+F_{m+1}$ the Lucas numbers. With $\varphi=\frac{1+\sqrt5}2$ and $\psi=-\frac1\varphi$: $F_m=\frac{\varphi^m-\psi^m}{\sqrt5}$ and $L_m=\varphi^m+\psi^m$.

      **Claim:** $x_n=2^{n-1}F_{2n+3}$. It holds for $n=0$ ($\frac12\cdot2=1$). Suppose it holds for $n$, and let $m=2n+3$ (odd).

      *The floor.* $\sqrt5F_m-L_m=-2\psi^m=2\varphi^{-m}>0$ (for odd $m$), so
      $$\sqrt5\,x_n-2^{n-1}L_m=2^n\varphi^{-m}=\frac{2^n}{\varphi^{3}(\varphi^2)^n}<1,$$
      because $\varphi^2>2$ and $\varphi^3>1$. Also $2^{n-1}L_m$ is an integer ($L_3=4$ covers $n=0$). So $\lfloor\sqrt5x_n\rfloor=2^{n-1}L_m$.

      *The step.* Then $x_{n+1}=2^{n-1}(3F_m+L_m)$. Since $L_m=F_{m-1}+F_{m+1}=F_m+2F_{m-1}$,
      $$3F_m+L_m=4F_m+2F_{m-1}=2F_m+2(F_m+F_{m-1})=2F_m+2F_{m+1}=2F_{m+2}.$$
      So $x_{n+1}=2^nF_{m+2}=2^nF_{2(n+1)+3}$, as claimed.

      **Answer.** $x_{2007}=2^{2006}F_{4017}=\frac{2^{2006}}{\sqrt5}\big(\varphi^{4017}+\varphi^{-4017}\big)$, using $\psi^{4017}=-\varphi^{-4017}$.
    checked: "script: exact integer iteration (integer square roots) agrees with 2^(n−1)·F(2n+3) for n < 60"
    status: ready

  - id: B4
    topic: "Polynomials: writing X^(2n)+1 as a sum of two squares"
    areas: [algebra]
    difficulty: 3
    answer: '$2^{n+1}$'
    hints:
      - 'Factor $P^2+Q^2=(P+iQ)(P-iQ)$ over the complex numbers.'
      - 'The roots of $X^{2n}+1$ are simple and come in $n$ conjugate pairs. How many ways can $P+iQ$ take its roots?'
    solution: |
      **Key idea:** $P+iQ$ must take exactly one root from each conjugate pair of roots of $X^{2n}+1$, and its leading coefficient is $\pm1$.

      Let $G=P+iQ$. Since $P,Q$ are real, the conjugate polynomial is $\bar G=P-iQ$, and $G\bar G=P^2+Q^2=X^{2n}+1$.

      **Degrees.** $\deg P>\deg Q$, so $\deg G=\deg P$ and the leading coefficient of $G$ is the real leading coefficient $c$ of $P$. Comparing with $X^{2n}+1$: $2\deg G=2n$ and $c^2=1$.

      **Roots.** $X^{2n}+1$ has $2n$ simple roots, none real, in $n$ conjugate pairs $\{\zeta,\bar\zeta\}$. If $\zeta$ is a root of $G$, then $\bar\zeta$ is a root of $\bar G$. Since the roots are simple, $G$ takes exactly one root from each pair. So
      $$G=c\prod_{\text{pairs}}(X-\zeta_{\text{chosen}}),\qquad c=\pm1,$$
      giving at most $2\cdot2^n$ possibilities.

      **Each works.** For any such choice, $G\bar G=c^2\prod(X-\zeta)(X-\bar\zeta)=X^{2n}+1$. Put $P=\frac{G+\bar G}2$, $Q=\frac{G-\bar G}{2i}$, real polynomials with $P^2+Q^2=G\bar G$. $G$ has the real leading term $cX^n$, so $P$ has degree $n$ and $Q$ has smaller degree. Different choices give different $G$, hence different pairs.

      So there are $2^{n+1}$ pairs.
    checked: "script: built all 2^(n+1) choices numerically for n ≤ 6; each gives P² + Q² = X^(2n) + 1 with deg Q < deg P, and all are distinct"
    status: ready

  - id: B5
    topic: "Polynomials: powers of a floor quotient"
    areas: [algebra, number-theory]
    difficulty: 2
    hints:
      - 'Let $q=\lfloor n/k\rfloor$. Then $n-kq$ is one of $0,1,\dots,k-1$.'
      - 'So the product $\prod_{j=0}^{k-1}(n-j-kq)$ is always $0$.'
    solution: |
      **Key idea:** the product of $n-kq-j$ over $j=0,\dots,k-1$ vanishes, and expanding it expresses $q^k$ through lower powers of $q$.

      Let $q=\lfloor n/k\rfloor$. Then $n-kq\in\{0,1,\dots,k-1\}$, so one factor of
      $$\prod_{j=0}^{k-1}\big(n-j-kq\big)$$
      is zero, and the product is $0$ for every integer $n$. As a polynomial in $q$ with coefficients that are polynomials in $n$, its leading term is $(-k)^kq^k$. So
      $$(-k)^kq^k+\sum_{i=0}^{k-1}c_i(n)\,q^i=0 .$$
      Dividing by $-(-k)^k$ gives $q^k=\sum_{i<k}P_i(n)q^i$ with $P_i(n)=-\frac{c_i(n)}{(-k)^k}$, polynomials (with rational coefficients) depending only on $k$.
    checked: "script: for k ≤ 5 the product vanishes at q = floor(n/k) for −30 ≤ n < 30"
    status: ready

