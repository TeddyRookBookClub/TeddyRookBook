problems:
  - id: A1
    topic: "Number theory: derivatives of integer polynomials and factorials"
    areas: [number-theory, algebra]
    difficulty: 1
    answer: "$j = 8$"
    hints:
      - "Differentiate $x^i$ exactly $j$ times. What factor appears in front?"
      - "Factor $2016$ into primes and look for the first factorial that contains it."
    solution: |
      **Key idea:** every $j$-th derivative of an integer polynomial at an integer is a multiple of $j!$, and $x^j$ shows that nothing better is true.

      Differentiating $x^i$ a total of $j$ times gives $\frac{i!}{(i-j)!}x^{i-j} = j!\binom{i}{j}x^{i-j}$ (and $0$ when $i<j$). So for $p(x)=\sum a_i x^i$ with integer $a_i$ and an integer $k$,
      $$p^{(j)}(k) = j!\sum_{i\ge j} a_i\binom{i}{j}k^{i-j},$$
      which is $j!$ times an integer. Hence if $2016 \mid j!$, the property holds.

      Conversely, the polynomial $p(x)=x^j$ has $p^{(j)}(k)=j!$ for every $k$, so the property forces $2016\mid j!$.

      Now $2016 = 2^5\cdot 3^2\cdot 7$. A factorial divisible by $7$ needs $j\ge 7$. But $7! = 5040 = 2^4\cdot 3^2\cdot 5\cdot 7$ has only four factors of $2$, so $7!$ fails. Then $8! = 2^7\cdot 3^2\cdot 5\cdot 7$ works. The answer is $j=8$.
    checked: "script: smallest j with 2016 | j! is 8"
    status: ready

  - id: A2
    topic: "Asymptotics: comparing two binomial coefficients"
    areas: [combinatorics, analysis]
    difficulty: 2
    answer: "$\\dfrac{3+\\sqrt5}{2}$"
    hints:
      - "Write the ratio of the two binomial coefficients as a simple rational function of $m$ and $n$."
      - "The condition becomes a quadratic inequality in $m$; its larger root grows like a constant times $n$."
    solution: |
      **Key idea:** the ratio of the two binomial coefficients is a rational function, so the inequality is a quadratic in $m$.

      When $m \ge n+1$ both coefficients are positive, and cancelling factorials gives
      $$\frac{\binom{m}{n-1}}{\binom{m-1}{n}} = \frac{m!\,n!\,(m-1-n)!}{(n-1)!\,(m-n+1)!\,(m-1)!} = \frac{mn}{(m-n+1)(m-n)}.$$
      So for $m\ge n+1$ the inequality holds exactly when $mn > (m-n)(m-n+1)$, which expands to
      $$q(m) := m^2-(3n-1)m+(n^2-n) < 0 .$$
      The quadratic $q$ is negative exactly between its roots
      $$r_\pm(n) = \frac{(3n-1)\pm\sqrt{5n^2-2n+1}}{2}.$$
      For large $n$ we have $r_-(n) < n+1 < r_+(n)$ (indeed $r_-\approx 0.38n$ and $r_+\approx 2.62n$), so every integer $m$ with $n+1\le m<r_+$ satisfies the inequality, and no integer $m\ge r_+$ does. Therefore $M(n)$ is the largest integer below $r_+(n)$, and
      $$r_+(n)-1 \le M(n) < r_+(n).$$
      Dividing by $n$,
      $$\lim_{n\to\infty}\frac{M(n)}{n} = \lim_{n\to\infty}\frac{r_+(n)}{n} = \frac{3+\sqrt5}{2}.$$
      (It is the larger root of $x^2-3x+1=0$, which is what you get from $x=(x-1)^2$ when you set $m\approx xn$.)
    checked: "script: computed M(n)/n for n up to 3000; it approaches 2.6180"
    status: ready

  - id: A3
    topic: "Functional equation: a three-cycle and arctangent integrals"
    areas: [analysis, calculus]
    difficulty: 2
    answer: "$\\dfrac{3\\pi}{8}$"
    hints:
      - "Apply the map $x\\mapsto 1-\\tfrac1x$ three times. Where do you end up?"
      - "With three equations in three unknown values, solve for $f(x)$, then integrate each arctangent term separately."
    solution: |
      **Key idea:** the substitution $x\mapsto 1-\frac1x$ has order three, so the equation can be solved for $f$ exactly.

      Let $T(x)=1-\frac1x$. For $x\ne 0,1$ we get $T(x)=\frac{x-1}{x}$, $T(T(x)) = \frac{1}{1-x}$, and $T(T(T(x)))=x$. Write $y=T(x)$ and $z=T(y)$. Using the given relation at $x$, $y$ and $z$:
      $$f(x)+f(y)=\arctan x,\qquad f(y)+f(z)=\arctan y,\qquad f(z)+f(x)=\arctan z.$$
      Adding the first and third and subtracting the second,
      $$f(x)=\tfrac12\Big(\arctan x-\arctan\big(1-\tfrac1x\big)+\arctan\tfrac{1}{1-x}\Big)\qquad (x\ne0,1).$$
      Now integrate each piece over $(0,1)$.

      - $\int_0^1\arctan x\,dx = \frac{\pi}{4}-\frac{\ln 2}{2}$ (integrate by parts).
      - With $u=1-x$: $\int_0^1 \arctan\frac{1}{1-x}\,dx=\int_0^1\arctan\frac1u\,du=\int_0^1\big(\frac\pi2-\arctan u\big)du=\frac\pi4+\frac{\ln2}{2}$.
      - For $0<x<1$, $1-\frac1x=-\frac{1-x}{x}$. Let $I=\int_0^1\arctan\frac{1-x}{x}\,dx$. The swap $x\leftrightarrow1-x$ shows $I=\int_0^1\arctan\frac{x}{1-x}\,dx$. Since $\arctan t+\arctan\frac1t=\frac\pi2$ for $t>0$, adding the two forms gives $2I=\frac\pi2$, so $I=\frac\pi4$. Hence $\int_0^1\arctan(1-\frac1x)\,dx=-\frac\pi4$.

      Putting it together:
      $$\int_0^1 f(x)\,dx=\tfrac12\Big(\tfrac\pi4-\tfrac{\ln2}2+\tfrac\pi4+\tfrac\pi4+\tfrac{\ln2}2\Big)=\frac{3\pi}{8}.$$
    checked: "script: numerical integration of the solved f gives 1.178097 = 3π/8; the functional equation was checked at sample points"
    status: ready

  - id: A4
    topic: "Tiling: odd rectangle with trominoes and skew tetrominoes"
    areas: [combinatorics]
    difficulty: 3
    answer: "$mn$ tiles"
    hints:
      - "Mark the cells whose row and column numbers are both odd. How many marked cells can one tile cover?"
      - "For the construction, find a way to tile a strip two cells wide with as few tiles as the marked cells in it, then build up from a small base case."
    solution: |
      **Key idea:** a coloring gives the lower bound $mn$; a $7\times7$ base tiling plus two-wide strips gives the matching construction.

      **Lower bound.** Number rows and columns from $1$. Call a cell *marked* if its row and column are both odd. The region has $m$ odd rows and $n$ odd columns, so there are $mn$ marked cells. The three-cell L tile fits inside a $2\times2$ box, which has only one cell with both coordinates odd. Turn the four-cell skew tile so that it lies in two consecutive rows (otherwise swap the roles of rows and columns). In each of its rows it uses two consecutive columns, so it meets at most one odd row and, within it, at most one odd column. So every tile covers at most one marked cell, and at least $mn$ tiles are needed.

      **Construction.** (The picture shows our tilings.)

      *A strip.* A strip $2$ cells wide and $2m-1$ cells long can be tiled with exactly $m$ tiles. Put an L at one end covering both cells of the first row and one cell of the second. Then lay skew tiles in a staircase. Each one covers two cells in one column and the next two cells in the other column, and it moves both columns forward by two. After $m-2$ skew tiles, the three cells left at the far end form an L. That is $2+(m-2)=m$ tiles.

      *Base case.* The $7\times 7$ square ($m=n=4$) can be tiled with $16$ tiles: fifteen L's and one skew tile, as in the picture. (Area check: $15\cdot3+4=49$.)

      *Growing.* Adding a strip of width $2$ along a side of length $2m-1$ turns a $(2m-1)\times(2n-1)$ tiling with $mn$ tiles into a $(2m-1)\times(2n+1)$ tiling with $mn+m=m(n+1)$ tiles. The same works in the other direction. Starting from $7\times7$ we reach every $(2m-1)\times(2n-1)$ with $m,n\ge4$ using exactly $mn$ tiles.

      So the minimum is $mn$.
    viz: putnam-2016-a4
    checked: "script: backtracking search found a 16-tile tiling of the 7×7 square (shown); the strip pattern and the counting bound were checked by hand"
    status: ready

  - id: A5
    topic: "Group theory: words in alternating generators"
    areas: [algebra]
    difficulty: 3
    hints:
      - "Group the word into blocks $g^{\\pm1}h^{\\pm1}$. The question is which elements are products of such blocks, and how many blocks are needed."
      - "In a finite group, a shortest product never repeats a partial product."
    solution: |
      **Key idea:** the blocks $g^{\pm1}h^{\pm1}$ already generate $G$ because $g$ has odd order, and a shortest product in a finite group has at most $|G|$ factors.

      Let $T=\{gh,\ gh^{-1},\ g^{-1}h,\ g^{-1}h^{-1}\}$. A word of the required shape with $r$ blocks is exactly a product $t_1t_2\cdots t_r$ with every $t_i\in T$. So we must show two things: every element of $G$ is such a product, and $r\le|G|$ blocks are enough.

      **Step 1: products of blocks give all of $G$.** In a finite group, the products of elements of $T$ (with at least one factor) form a subgroup $H$. It is closed under products, and the inverse of $t$ is $t^{k-1}$ where $k$ is the order of $t$. Now
      $$(gh)(g^{-1}h)^{-1} = gh\,h^{-1}g = g^2 \in H.$$
      Since $g$ has odd order $2s+1$, we get $g = g^{2s+2}=(g^2)^{s+1}\in H$. Then $h = g^{-1}(gh)\in H$. As $g$ and $h$ generate $G$, $H=G$.

      **Step 2: few blocks suffice.** Take $x\in G$ and write it as $t_1\cdots t_r$ with $r\ge1$ as small as possible. Look at the partial products $p_i=t_1\cdots t_i$ for $i=1,\dots,r$. If $p_i=p_j$ with $i<j$, then $t_{i+1}\cdots t_j=e$, and deleting those factors gives a shorter product for $x$ that still has at least one factor. This contradicts minimality. So the $r$ partial products are distinct elements of $G$, and $r\le|G|$.

      Together these give the required form with $1\le r\le |G|$ and all exponents in $\{-1,1\}$. (The identity is covered too: it is $t^k$ for any $t\in T$ of order $k$, and the same shortening argument applies.)
    checked: "proof only; no numeric answer"
    status: ready

