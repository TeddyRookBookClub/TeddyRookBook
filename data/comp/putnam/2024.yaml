  - id: B6
    topic: "Growth of a lacunary series near the unit circle"
    areas: [analysis]
    difficulty: 4
    answer: '$c=-\dfrac12$'
    hints:
      - 'Put $x=e^{-t}$. The exponent is $2n-n^2t=\frac1t-t\big(n-\frac1t\big)^2$, a Gaussian bump of width about $t^{-1/2}$.'
      - 'Check that $\frac1t-\frac1{1-x}\to-\frac12$.'
    solution: |
      **Key idea:** the terms form a Gaussian bump around $n\approx1/t$ of width about $t^{-1/2}$. So $F_a(x)\approx t^{-a-1/2}e^{1/t}$, and the factor $e^{-1/(1-x)}$ cancels $e^{1/t}$ up to a bounded factor.

      Let $s=1-x$ and $t=-\ln x=s+\frac{s^2}2+\dots$. Then $\frac1t=\frac1s-\frac12+O(s)$, so $E:=e^{1/t-1/s}\to e^{-1/2}$. Also
      $$F_a(x)\,e^{-1/s}=E\sum_{n\ge1}n^a\,e^{-t(n-1/t)^2}.$$

      **$a>-\frac12$: the limit is $\infty$.** Keep only the integers $n\in[\frac1t,\frac1t+t^{-1/2}]$; for small $t$ there are at least $\frac12t^{-1/2}$ of them. For each, $t(n-\frac1t)^2\le1$, and $n^a\ge\kappa\,t^{-a}$ with $\kappa=\min(1,2^a)$ (since $\frac1t\le n\le\frac2t$). So the sum is at least $\frac{\kappa}{2e}\,t^{-a-1/2}\to\infty$, while $E\to e^{-1/2}$.

      **$a<-\frac12$: the limit is $0$.** Here $a<0$. Split the sum.
      - $n>\frac1{2t}$: $n^a<(2t)^{-a}$, and $\sum_ne^{-t(n-1/t)^2}\le1+\int e^{-tu^2}du=1+\sqrt{\pi/t}$. This part is $O(t^{-a}\cdot t^{-1/2})=O(t^{-a-1/2})\to0$.
      - $n\le\frac1{2t}$: there $2n-n^2t\le\frac{3}{4t}$ (the quadratic increases up to $n=\frac1t$), and $n^a\le1$. This part of $F_a(x)e^{-1/s}$ is at most $\frac{1}{2t}e^{3/(4t)-1/s}$, and since $\frac1t-\frac1s$ is bounded, the exponent behaves like $-\frac1{4s}$. So it tends to $0$.

      Hence $c=-\frac12$. (At $a=-\frac12$ the expression tends to $\sqrt{\pi}\,e^{-1/2}\approx1.075$.)
    checked: "numeric: evaluated F_a(x)e^(−1/(1−x)) for x = 1 − 10^(−k), k ≤ 4; it decreases for a = −0.7, grows for a = −0.3, and settles near 1.075 for a = −0.5"
    status: ready
