  - id: B3
    topic: "Matrices with arithmetic-progression entries closed under powers"
    areas: [linear-algebra]
    difficulty: 2
    answer: "$M=a\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$ or $M=c\\begin{pmatrix}-3&-1\\\\1&3\\end{pmatrix}$ ($a,c$ real)"
    hints:
      - 'By Cayley–Hamilton, $M^k=\alpha M+\beta I$. Is the identity matrix in $S$?'
      - 'So $\beta=0$. Use the eigenvalues; note $\det M=-2d^2$ where $d$ is the common difference.'
    solution: |
      **Key idea:** $M^k=\alpha M+\beta I$ and $I\notin S$ force $\beta=0$, which pins down the eigenvalues.

      Elements of $S$ are $M=\begin{pmatrix}a&a+d\\a+2d&a+3d\end{pmatrix}$, and $S$ is a vector space. Note $\operatorname{tr}M=2a+3d$ and $\det M=a(a+3d)-(a+d)(a+2d)=-2d^2$.

      **Reduction.** By Cayley–Hamilton, dividing $t^k$ by the characteristic polynomial gives $M^k=\alpha M+\beta I$ for some real $\alpha,\beta$. If $M^k\in S$, then $\beta I=M^k-\alpha M\in S$. The identity has entries $1,0,0,1$, which are not in arithmetic progression, so $\beta=0$.

      **When is $\beta=0$?** Let the eigenvalues be $\lambda,\mu$. They are real, since the discriminant $(\operatorname{tr}M)^2+8d^2\ge0$.
      - If $\lambda=\mu$: dividing $t^k$ by $(t-\lambda)^2$ leaves $k\lambda^{k-1}t+(1-k)\lambda^k$, so $\beta=0$ forces $\lambda=0$, and $\det M=0$.
      - If $\lambda\ne\mu$: the remainder has $\beta=\dfrac{\lambda\mu\,(\mu^{k-1}-\lambda^{k-1})}{\lambda-\mu}$. So $\beta=0$ means $\lambda\mu=0$, or $\lambda^{k-1}=\mu^{k-1}$, which for distinct reals means $\mu=-\lambda$ (and $k-1$ even).

      **The two families.**
      - $\det M=0$ means $d=0$, so $M=aJ$ with $J=\begin{pmatrix}1&1\\1&1\end{pmatrix}$. Then $M^k=2^{k-1}a^kJ\in S$ for every $k$.
      - $\mu=-\lambda\ne0$ means $\operatorname{tr}M=0$ and $d\ne0$, so $a=-\frac32d$ and $M=\frac d2\begin{pmatrix}-3&-1\\1&3\end{pmatrix}$. With $N=\begin{pmatrix}-3&-1\\1&3\end{pmatrix}$ we get $N^2=8I$, so $N^3=8N\in S$.

      So the answer is exactly the multiples of $J$ and the multiples of $N$ (including $0$).
    checked: "script: searched all integer a, d in [−6, 6] and k ≤ 8; every M with some M^k in S is a multiple of J or of N"
    status: ready

  - id: B4
    topic: "Series: weighted sum over all integer triangles"
    areas: [combinatorics, number-theory]
    difficulty: 2
    answer: "$\\dfrac{17}{21}$"
    hints:
      - 'Parametrize integer triangles: $a=q+r$, $b=p+r$, $c=p+q$ when the perimeter is even.'
      - 'When the perimeter is odd, use $a=q+r+1$, $b=p+r+1$, $c=p+q+1$ with $p,q,r\ge0$. Each sum factors into three geometric series.'
    solution: |
      **Key idea:** the substitution $p=\frac{b+c-a}2$ (and its odd-perimeter version) turns the sum into products of geometric series.

      **Parametrization.** For a nondegenerate triangle with integer sides:
      - if $a+b+c$ is even, $p=\frac{b+c-a}2$, $q=\frac{a+c-b}2$, $r=\frac{a+b-c}2$ are positive integers, and $a=q+r$, $b=p+r$, $c=p+q$;
      - if $a+b+c$ is odd, $p=\frac{b+c-a-1}2$ and so on are integers $\ge0$, and $a=q+r+1$, $b=p+r+1$, $c=p+q+1$.

      Both maps are bijections onto their parameter sets.

      **Even perimeter.** The term is $\dfrac{2^{q+r}}{3^{p+r}5^{p+q}}=\Big(\frac1{15}\Big)^p\Big(\frac25\Big)^q\Big(\frac23\Big)^r$. Summing over $p,q,r\ge1$:
      $$\frac{1/15}{14/15}\cdot\frac{2/5}{3/5}\cdot\frac{2/3}{1/3}=\frac1{14}\cdot\frac23\cdot2=\frac2{21}.$$

      **Odd perimeter.** The term is $\dfrac{2}{15}\Big(\frac1{15}\Big)^p\Big(\frac25\Big)^q\Big(\frac23\Big)^r$. Summing over $p,q,r\ge0$:
      $$\frac2{15}\cdot\frac{15}{14}\cdot\frac53\cdot3=\frac57 .$$

      Total: $\frac2{21}+\frac57=\frac{17}{21}$.
    checked: "script: direct summation over all triangles with sides below 60 gives 0.8095238 = 17/21"
    status: ready

