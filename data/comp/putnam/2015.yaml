  - id: B6
    topic: "Series: alternating sum of counts of small odd divisors"
    areas: [analysis, number-theory]
    difficulty: 3
    answer: "$\\dfrac{\\pi^2}{16}$"
    hints:
      - 'Write $k=dm$ with $d$ odd. The size condition becomes $m>d/2$, and the sign is $(-1)^{m-1}$.'
      - 'For each $d$, the inner sum is a tail of $\sum(-1)^{m-1}/m$; write it as an integral of $x^{M-1}/(1+x)$, then substitute $x=t^2$.'
    solution: |
      **Key idea:** regroup by the odd divisor $d$, write each inner tail as an integral, and the sum over $d$ becomes $\int_0^1\frac{2\arctan t}{1+t^2}\,dt=\frac{\pi^2}{16}$.

      **Regrouping.** An odd divisor $d$ of $k=dm$ satisfies $d<\sqrt{2k}$ exactly when $d^2<2dm$, that is $m>\frac d2$. Since $d$ is odd, $(-1)^{k-1}=(-1)^{m-1}$. So the partial sum up to $K$ is
      $$S_K=\sum_{d\text{ odd}}\frac1d\sum_{d/2<m\le K/d}\frac{(-1)^{m-1}}m ,$$
      where only $d<\sqrt{2K}$ contribute. Let $T(d)=\sum_{m>d/2}\frac{(-1)^{m-1}}m$. The missing tail $\sum_{m>K/d}$ is an alternating tail, so it is at most its first term $\le\frac dK$. Hence
      $$\Big|S_K-\sum_{d\text{ odd},\,d<\sqrt{2K}}\frac{T(d)}d\Big|\le\sum_{d<\sqrt{2K}}\frac1K\le\frac{\sqrt{2K}}K\to0 .$$
      Also $|T(d)|\le\frac2d$, so $\sum_dT(d)/d$ converges absolutely. Therefore $\lim S_K=\sum_{d\text{ odd}}T(d)/d$.

      **Each tail as an integral.** With $M=\frac{d+1}2$, the first $m$ above $\frac d2$, and $\frac1m=\int_0^1x^{m-1}dx$ (the remainder of the geometric sum tends to $0$),
      $$T(d)=\sum_{m\ge M}(-1)^{m-1}\int_0^1x^{m-1}dx=(-1)^{M-1}\int_0^1\frac{x^{M-1}}{1+x}\,dx=(-1)^{\frac{d-1}2}\int_0^1\frac{2t^d}{1+t^2}\,dt,$$
      using $x=t^2$.

      **Summing over $d$.** The series $\sum_{d\text{ odd}}(-1)^{(d-1)/2}\frac{t^d}d=\arctan t$ converges uniformly on $[0,1]$ (alternating, with tail at most $\frac1D$). So we may swap the sum and the integral:
      $$\sum_{d\text{ odd}}\frac{T(d)}d=\int_0^1\frac{2\arctan t}{1+t^2}\,dt=\Big[\arctan^2t\Big]_0^1=\frac{\pi^2}{16}.$$
    checked: "script: partial sums up to k = 10^4 give 0.61652, approaching π²/16 = 0.61685 (the error shrinks like 1/√k)"
    status: ready
