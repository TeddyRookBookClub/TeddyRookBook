problems:
  - id: A1
    topic: "Geometry: twelve lengths always contain an acute triangle"
    areas: [geometry, combinatorics]
    difficulty: 1
    hints:
      - 'Sort the lengths. If three neighbors $a\le b\le c$ never form an acute triangle, then $c^2\ge a^2+b^2$.'
      - 'The squares then grow at least like Fibonacci numbers.'
    solution: |
      **Key idea:** if no three consecutive lengths form an acute triangle, their squares grow like Fibonacci numbers and pass $144$.

      For $a\le b\le c$, the condition $a^2+b^2>c^2$ already gives a triangle, because $(a+b)^2>a^2+b^2>c^2$. It is then acute, since its largest angle is opposite $c$.

      Sort the numbers: $d_1\le d_2\le\dots\le d_{12}$. Suppose no three of them form an acute triangle. Then for every $k\ge3$,
      $$d_k^2\ge d_{k-1}^2+d_{k-2}^2 .$$
      Let $F_1=F_2=1$, $F_k=F_{k-1}+F_{k-2}$. Since $d_1^2>1$ and $d_2^2>1$, induction gives $d_k^2>F_k$ for every $k$. But $F_{12}=144$, so $d_{12}>12$, contradicting $d_{12}<12$.
    checked: "script: F_12 = 144; random trials with 12 numbers in (1,12) always found an acute triple"
    status: ready

  - id: A2
    topic: "Algebra: cancellation in a commutative semigroup with division"
    areas: [algebra]
    difficulty: 1
    hints:
      - 'Find an element $e$ with $a*e=a$. Is it an identity for everything?'
      - 'Once you have an identity, find an inverse for $c$.'
    solution: |
      **Key idea:** the solvability condition produces an identity element and inverses; then cancel.

      **An identity.** Pick any $a\in S$ and choose $e$ with $a*e=a$. Given any $y\in S$, choose $w$ with $a*w=y$. Then, by commutativity and associativity,
      $$y*e=(a*w)*e=(a*e)*w=a*w=y .$$
      So $e$ is an identity for all of $S$.

      **Inverses.** For $c\in S$, choose $c'$ with $c*c'=e$.

      **Cancellation.** If $a*c=b*c$, then
      $$a=a*e=(a*c)*c'=(b*c)*c'=b*e=b .$$
    checked: "proof only"
    status: ready

  - id: A3
    topic: "Functional equation: a self-similar function on an interval"
    areas: [analysis]
    difficulty: 2
    answer: "$f(x)=\\sqrt{1-x^2}$"
    hints:
      - 'Guess from $f(0)=1$ and the behavior near $x=1$, then check the identity.'
      - 'For uniqueness, divide by $\sqrt{1-x^2}$ and iterate the map $x\mapsto\frac{x^2}{2-x^2}$.'
    solution: |
      **Key idea:** $\sqrt{1-x^2}$ satisfies the equation, and the ratio $f(x)/\sqrt{1-x^2}$ is unchanged under the map $\varphi(x)=\frac{x^2}{2-x^2}$, whose iterates run to $0$.

      **It works.** Let $f(x)=\sqrt{1-x^2}$. Then
      $$1-\Big(\frac{x^2}{2-x^2}\Big)^2=\frac{(2-x^2)^2-x^4}{(2-x^2)^2}=\frac{4(1-x^2)}{(2-x^2)^2},$$
      so $\frac{2-x^2}2f\big(\frac{x^2}{2-x^2}\big)=\frac{2-x^2}{2}\cdot\frac{2\sqrt{1-x^2}}{2-x^2}=f(x)$. Also $f(0)=1$, and $f(x)/\sqrt{1-x}=\sqrt{1+x}\to\sqrt2$.

      **It is the only one.** Let $f$ satisfy the conditions and set $g(x)=f(x)/\sqrt{1-x^2}$ on $(-1,1)$, a continuous function with $g(0)=1$. Dividing the equation by $\sqrt{1-x^2}=\frac{2-x^2}{2}\sqrt{1-\varphi(x)^2}$ gives
      $$g(x)=g(\varphi(x)) .$$
      Fix $x\in(-1,1)$ and let $x_0=x$, $x_{k+1}=\varphi(x_k)$. From $k=1$ on, $x_k\in[0,1)$. For $t\in(0,1)$ we have $\varphi(t)<t$, because this is $t<2-t^2$, that is $(t+2)(t-1)<0$. So the sequence decreases and has a limit $L\in[0,1)$ with $\varphi(L)=L$. The only such $L$ is $0$. By continuity of $g$ at $0$,
      $$g(x)=g(x_k)\to g(0)=1 .$$
      So $f(x)=\sqrt{1-x^2}$ on $(-1,1)$, and by continuity also at $\pm1$, where both sides are $0$. (Condition (iii) is not even needed for this argument.)
    viz: putnam-2012-a3
    checked: "script: verified the functional equation symbolically and at 1000 random points; iterates of φ reach below 1e-9 within 40 steps from x = 0.999999"
    status: ready

  - id: A4
    topic: "Number theory: an arithmetic progression hidden in a residue condition"
    areas: [number-theory, geometry]
    difficulty: 3
    hints:
      - 'Turn each $a\in S$ into a lattice point $(a,b)$ with $b\in B$ and $ra\equiv b\pmod q$. Which lattice is this?'
      - 'A triangle drawn inside a rectangle covers at most half of it. Can three of the lattice points in $A\times B$ fail to be on one line?'
    solution: |
      **Key idea:** the pairs $(a,b)$ with $ra\equiv b\pmod q$ form a lattice in which every triangle has area at least $q/2$. The box $A\times B$ is too small to hold such a triangle, so its lattice points sit on one line, and their first coordinates form a progression.

      **How to read the claim.** The progression is allowed to be finite, so the claim is that $S$ is empty or a finite arithmetic progression. If it had to be infinite, the claim would fail. For example, with $q=4$, $r=3$, $A=[0,3]$, $B=[2,3]$ the lengths multiply to $3<4$, and $S=\{1,2\}$. An infinite progression through $1$ and $2$ with no other point in $A$ is impossible, since $0$ and $3$ are in $A$.

      **The lattice.** Let $\Lambda$ be the set of integer points $(x,y)$ with $y\equiv rx\pmod q$. It is closed under addition and subtraction. An integer $a$ lies in $S$ exactly when $a\in A$ and some integer $b\in B$ has $ra-b$ divisible by $q$, that is, when $(a,b)\in\Lambda\cap(A\times B)$. So $S$ is the set of first coordinates of the points of $\Lambda$ in the box $A\times B$.

      **Lattice triangles are big.** For two vectors $(x_1,y_1),(x_2,y_2)$ in $\Lambda$,
      $$x_1y_2-x_2y_1\equiv x_1(rx_2)-x_2(rx_1)=0\pmod q .$$
      So if $P_1,P_2,P_3\in\Lambda$ are not on one line, this determinant for $P_2-P_1$ and $P_3-P_1$ is a nonzero multiple of $q$, and the triangle $P_1P_2P_3$ has area at least $\frac q2$.

      **The box is small.** Let $A$ and $B$ have lengths $\alpha$ and $\beta$. The box fits in a closed $\alpha\times\beta$ rectangle with sides parallel to the axes. A triangle inside it has area at most $\frac{\alpha\beta}2$. To see this, cut the triangle by the horizontal line through its middle vertex (middle in height). The cut has length at most $\alpha$, and the two pieces are triangles on this cut whose heights add up to at most $\beta$. So the area is at most $\frac12\alpha\beta<\frac q2$.

      **Conclusion.** By the two facts, all points of $\Lambda$ in the box lie on one line $\ell$. If there are at most two, their first coordinates already form a progression. Otherwise, the points of $\Lambda$ on $\ell$ form a group under subtraction inside a line, so they are $P_0+kv$ $(k\in\mathbb Z)$ for one vector $v=(v_1,v_2)$. The box is convex, so the values of $k$ that land in it form a block of consecutive integers. The first coordinates are $x_0+kv_1$ for those $k$, where $x_0$ is the first coordinate of $P_0$. That is an arithmetic progression with step $v_1$ (a single number if $v_1=0$), and it is exactly $S$.
    checked: "script: 300,000 random cases with |A||B| < q (closed intervals, rational endpoints); S was always empty or a progression (22,286 cases had 3 or more terms); the infinite reading fails on the example shown"
    status: ready

  - id: A5
    topic: "Finite fields: affine maps that visit every vector"
    areas: [linear-algebra, algebra]
    difficulty: 3
    answer: "$n=1$ with any $p$, and $(p,n)=(2,2)$"
    hints:
      - 'If the orbit covers everything, $G$ is a single cycle of length $p^n$, so $M^{p^n}=I$. What does that say about $M-I$?'
      - 'Write $M=I+N$. Over $\mathbb F_p$, $\sum_{i<p^k}(1+N)^i=N^{p^k-1}$, and $N^n=0$.'
    solution: |
      **Key idea:** $G$ must be one big cycle, which forces $M=I+N$ with $N$ nilpotent; then $G^{p^{n-1}}$ is the identity unless $p^{n-1}-1<n$.

      Suppose the $p^n$ vectors $G^{(k)}(0)$ are distinct. Then they are all of $\mathbb F_p^n$, so $G$ permutes the space as a single cycle of length $p^n$. Thus $G$ is a bijection (so $M$ is invertible), $G^{(p^n)}$ is the identity, and $G^{(p^{n-1})}$ is not.

      **$M$ is unipotent.** The linear part of $G^{(p^n)}$ is $M^{p^n}=I$. Over a field of characteristic $p$, $(M-I)^{p^n}=M^{p^n}-I=0$. So $N=M-I$ is nilpotent, and $N^n=0$.

      **Powers of $G$.** By induction, $G^{(m)}(x)=M^mx+\big(\sum_{i<m}M^i\big)v$. Let $m=p^k$. Using $\sum_{i<m}\binom ij=\binom m{j+1}$,
      $$\sum_{i<m}(I+N)^i=\sum_{j\ge0}\binom{m}{j+1}N^j=N^{m-1},$$
      since $\binom{p^k}{j+1}\equiv0\pmod p$ unless $j+1=p^k$. Also $(I+N)^{p^k}=I+N^{p^k}$. So
      $$G^{(p^k)}(x)=x+N^{p^k}x+N^{p^k-1}v .$$
      If $p^{n-1}-1\ge n$, both powers of $N$ vanish for $k=n-1$, and $G^{(p^{n-1})}$ is the identity. That is impossible. So we need $p^{n-1}-1<n$:
      - $n=1$: always true;
      - $n=2$: $p-1<2$, so $p=2$;
      - $n\ge3$: $p^{n-1}\ge2^{n-1}\ge n+1$, never.

      **Examples.** For $n=1$: $G(x)=x+1$ runs through $1,2,\dots,p-1,0$. For $p=n=2$: take $M=\begin{pmatrix}1&0\\1&1\end{pmatrix}$ and $v=\binom10$. The orbit of $0$ is $\binom10,\binom01,\binom11,\binom00$, all four vectors.
    checked: "script: verified the (2,2) example; exhaustive search finds no example for (p,n) = (3,2) or (2,3)"
    status: ready

