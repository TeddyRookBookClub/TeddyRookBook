  - id: B1
    topic: "Function classes: products from sums, compositions and differences"
    areas: [analysis, algebra]
    difficulty: 1
    hints:
      - '$e^{x}-1$ and $\ln(1+x)$ undo each other.'
      - '$(1+f)(1+g)-1=f+g+fg$, and $1+f=e^{\ln(1+f)}$.'
    solution: |
      **Key idea:** $f+g+fg=(1+f)(1+g)-1$ is $f_1$ applied to $f_2\circ f+f_2\circ g$, and subtracting $f+g$ leaves $fg$.

      Let $f_1(x)=e^x-1$ and $f_2(x)=\ln(x+1)$. For $f,g\in S$, the functions $f_2\circ f$ and $f_2\circ g$ are in $S$ (composition), so is their sum, and so is
      $$h=f_1\circ\big(f_2\circ f+f_2\circ g\big)=e^{\ln(1+f)+\ln(1+g)}-1=(1+f)(1+g)-1=f+g+fg .$$
      Also $f+g\in S$. Since $f,g\ge0$, we have $h-(f+g)=fg\ge0$, so the difference rule applies:
      $$fg=h-(f+g)\in S .$$
    checked: "exact algebra"
    status: ready

  - id: B2
    topic: "Geometry: covering a polyhedron's surface with small balls"
    areas: [geometry, analysis]
    difficulty: 2
    hints:
      - 'How much of one flat face can a ball of radius $r$ cover?'
      - 'Compare $\sum r_i^2$ with $\sum r_i^3$ using Hölder''s inequality.'
    solution: |
      **Key idea:** a ball of radius $r$ covers at most $F\pi r^2$ of the surface, where $F$ is the number of faces; Hölder turns the total $\sum r_i^2$ into a bound involving $n$ and $V$.

      Let $P$ have surface area $\mathcal A>0$ and $F$ faces. A ball of radius $r$ meets the plane of a face in a disk of radius at most $r$. So it covers at most $\pi r^2$ of each face and at most $F\pi r^2$ of the surface.

      If balls of radii $r_1,\dots,r_n$ cover the surface,
      $$\mathcal A\le F\pi\sum r_i^2 .$$
      By Hölder's inequality with exponents $\frac32$ and $3$,
      $$\sum r_i^2\le\Big(\sum r_i^3\Big)^{2/3}n^{1/3}=\Big(\frac{3V}{4\pi}\Big)^{2/3}n^{1/3},$$
      since $\sum\frac43\pi r_i^3=V$. Combining and cubing,
      $$n\ \ge\ \Big(\frac{\mathcal A}{F\pi}\Big)^3\Big(\frac{4\pi}{3V}\Big)^2=\frac{c_0}{V^2},\qquad c_0=\Big(\frac{\mathcal A}{F\pi}\Big)^3\Big(\frac{4\pi}{3}\Big)^2 .$$
      Taking $c(P)=c_0/2$ gives the strict inequality $n>c(P)/V^2$.
    checked: "proof only; the Hölder step was spot-checked on 1000 random lists of radii"
    status: ready

  - id: B3
    topic: "Tournaments: choosing distinct daily winners with Hall's theorem"
    areas: [combinatorics]
    difficulty: 2
    answer: "Yes"
    hints:
      - 'Set up a bipartite graph: days on one side, teams on the other, joining each day to its winners.'
      - 'If $k$ days had fewer than $k$ winners, many teams lost every game on those days. Where did those teams play each other?'
    solution: |
      **Key idea:** Hall's marriage theorem; a set of days with too few winners leaves too many all-losing teams, who could not have fit their games against each other into the remaining days.

      Join each day to the $n$ teams that won that day. We want a matching that covers all days. By Hall's theorem it is enough to show: any $k$ days have, together, at least $k$ different winners.

      Suppose some set $D$ of $k$ days has a winner set $W$ with $|W|\le k-1$. Let $L$ be the other teams, so $|L|\ge2n-k+1$. Every team in $L$ lost all its games on the days in $D$.

      Two teams of $L$ cannot have met on a day in $D$: one of them would have won. So all games among teams of $L$ happened on the $2n-1-k$ days outside $D$. A team of $L$ plays the other $|L|-1$ teams of $L$, one game per day, so
      $$|L|-1\le2n-1-k,\qquad\text{that is}\qquad|L|\le2n-k .$$
      This contradicts $|L|\ge2n-k+1$. So Hall's condition holds, and we can choose a different winning team for each day.
    checked: "script: 50 random round-robin schedules (circle method) with random results for each 2n ≤ 12; a full matching always existed"
    status: ready

  - id: B4
    topic: "Recurrences: a sequence growing like the logarithm"
    areas: [analysis]
    difficulty: 2
    answer: "Yes; the limit is $0$"
    hints:
      - 'Look at $b_n=e^{a_n}$. What is $b_{n+1}-b_n$?'
      - 'Show $1<b_{n+1}-b_n<1+\frac1{b_n}$.'
    solution: |
      **Key idea:** $b_n=e^{a_n}$ grows by a little more than $1$ each step, so $b_n/n\to1$ and $a_n-\log n=\log(b_n/n)\to0$.

      Let $b_n=e^{a_n}$, so $b_0=e$ and
      $$b_{n+1}=e^{a_n+e^{-a_n}}=b_n\,e^{1/b_n},\qquad b_{n+1}-b_n=b_n\big(e^{1/b_n}-1\big).$$
      For $0<u\le1$, $u<e^u-1=u+\sum_{k\ge2}\frac{u^k}{k!}\le u+u^2(e-2)<u+u^2$. With $u=1/b_n\le1$:
      $$1<b_{n+1}-b_n<1+\frac1{b_n} .$$
      The left inequality gives $b_n\ge n+e$, which keeps $u\le1$. Then the right one gives
      $$n+e\le b_n\le n+e+\sum_{k=0}^{n-1}\frac1{k+e}\le n+e+1+\ln n .$$
      So $b_n/n\to1$, and
      $$a_n-\log n=\log\frac{b_n}{n}\to0 .$$
      The limit exists and equals $0$.
    checked: "script: iterated to n = 10^6; a_n − ln n = 0.0057, 0.00069, 0.00008, 0.000009 at n = 10^3..10^6"
    status: ready

  - id: B5
    topic: "Convexity: a supremum of exponentials as a max of lines"
    areas: [analysis]
    difficulty: 2
    hints:
      - 'Show the left side, as a function of $x$, is convex and finite.'
      - 'A convex function is the maximum of its tangent (supporting) lines, and the maximum is reached.'
    solution: |
      **Key idea:** the left side is a finite convex function of $x$, and every convex function is the maximum of its supporting lines, with the maximum reached at the point of tangency.

      Let $\Phi(x)=\sup_s g_1(s)^xg_2(s)$.

      **$\Phi$ is finite.** Say $g_1\le C_1$ and $g_2\le C_2$. Since $g_1\ge1$, $g_1(s)^x\le C_1^x$ for $x\ge0$ and $g_1(s)^x\le1$ for $x<0$. So $\Phi(x)\le C_2\max(C_1^x,1)<\infty$, and $\Phi(x)>0$.

      **$\Phi$ is convex.** For each $s$, $x\mapsto g_2(s)e^{x\ln g_1(s)}$ is convex (an exponential times a positive constant). A pointwise supremum of convex functions is convex.

      **Supporting lines.** A finite convex function on $\mathbb R$ has a supporting line at every point: for each $t$ there is a slope $m(t)$ with
      $$\Phi(x)\ge\Phi(t)+m(t)(x-t)\quad\text{for all }x,$$
      for example the right derivative at $t$. Set $h_1(t)=m(t)$ and $h_2(t)=\Phi(t)-t\,m(t)$. Then $xh_1(t)+h_2(t)\le\Phi(x)$ for all $t$, with equality at $t=x$. Hence
      $$\Phi(x)=\max_t\big(xh_1(t)+h_2(t)\big),$$
      and the maximum is reached.
    checked: "script: for 50 random step functions g1, g2, the maximum over a grid of supporting lines never exceeded Φ and matched it to grid accuracy"
    status: ready

  - id: B6
    topic: "Permutations: parity of cubing modulo a prime"
    areas: [number-theory, combinatorics]
    difficulty: 2
    hints:
      - 'Use a primitive root to turn cubing on the nonzero residues into multiplication by $3$ on $\mathbb Z/(p-1)$.'
      - 'Count inversions of $i\mapsto3i \bmod m$ on $0,1,\dots,m-1$ by splitting into three increasing runs.'
    solution: |
      **Key idea:** cubing becomes $i\mapsto3i$ modulo $m=p-1$, whose inversions can be counted exactly; the count is $\frac32q(q+1)$ with $m=3q+1$.

      Since $p\equiv2\pmod3$, $\gcd(3,p-1)=1$, so cubing is a bijection. It fixes $0$. Let $g$ be a primitive root; then $g^i\mapsto g^{3i}$. So on the nonzero residues, $\pi$ has the same cycle structure, and therefore the same sign, as $\sigma(i)=3i\bmod m$ on $\{0,\dots,m-1\}$, $m=p-1$.

      **Counting inversions.** Here $m\equiv1\pmod3$; write $m=3q+1$. List $\sigma(0),\sigma(1),\dots$:
      - for $0\le i\le q$: the values $0,3,\dots,3q$ (multiples of $3$);
      - for $q+1\le i\le2q$: the values $2,5,\dots,3q-1$;
      - for $2q+1\le i\le3q$: the values $1,4,\dots,3q-2$.

      Each run increases, so inversions only occur between runs.
      - Runs 1 and 2: $3u>3v+2$ iff $u>v$, for $0\le u\le q$, $0\le v\le q-1$. That gives $\sum_{u=0}^qu=\frac{q(q+1)}2$ pairs.
      - Runs 1 and 3: $3u>3v+1$ iff $u>v$. Again $\frac{q(q+1)}2$.
      - Runs 2 and 3: $3u+2>3v+1$ iff $u\ge v$, for $0\le u,v\le q-1$. Again $\frac{q(q+1)}2$.

      In total $\frac32q(q+1)$ inversions, so the sign is $(-1)^{q(q+1)/2}$.

      **Reading off $p$.** Since $p=3q+2$ is odd, $q$ is odd. If $q\equiv1\pmod4$, then $\frac{q(q+1)}2$ is odd and $p\equiv5\equiv1\pmod4$. If $q\equiv3\pmod4$, then $\frac{q(q+1)}2$ is even and $p\equiv11\equiv3\pmod4$. So $\pi$ is even exactly when $p\equiv3\pmod4$.
    checked: "script: computed the sign of x ↦ x³ directly for all primes p ≡ 2 (mod 3) below 200; even exactly when p ≡ 3 (mod 4)"
    status: ready
