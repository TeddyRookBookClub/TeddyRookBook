intro: |
  The examiners called this paper "Easy Problems." It covers the subjects of the first three days of the 1878 Tripos:
  geometry and conics, algebra and trigonometry, statics and dynamics, hydrostatics, optics and astronomy. "Easy" is
  relative: twenty-two problems in three hours.
