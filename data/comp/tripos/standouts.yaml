  - id: 1821-radix
    year: 1821
    paper: "Monday Morning, Mr Chevallier (first and second classes)"
    number: "1"
    src: cp1831
    page: "1"
    leaf: 6
    topic: 'Number bases: 803 in disguise'
    areas: [algebra, number-theory]
    difficulty: 1
    statement: |
      The number $803$ expressed in a different scale of notation becomes $30203$; required the radix of the scale.
    note: 'The **radix** is the base of the number system. We write numbers in base ten.'
    answer: '$4$'
    solution: |
      In base $b$, the digits $30203$ mean $3b^4 + 0b^3 + 2b^2 + 0b + 3$. So
      $$3b^4 + 2b^2 + 3 = 803, \qquad 3b^4 + 2b^2 - 800 = 0.$$
      This is a quadratic in $b^2$: $b^2 = \dfrac{-2 + \sqrt{4 + 9600}}{6} = \dfrac{-2 + 98}{6} = 16$, so $b = 4$. Check: $3\cdot256 + 2\cdot16 + 3 = 803$. (The digit $3$ is allowed in base $4$.)
    checked: "arithmetic"
    status: ready
  - id: 1821-clepsydra
    year: 1821
    paper: "Monday Morning, Mr Chevallier (first and second classes)"
    number: "4"
    src: cp1831
    page: "1"
    leaf: 6
    topic: 'Water clock: a bowl whose level falls evenly'
    areas: [hydrostatics, calculus]
    difficulty: 2
    statement: |
      A clepsydra is constructed to mark equal portions of time, in the form of a paraboloid having its vertex downwards, the equation to the generating curve being $y^4 = ax$. How must the scale on the axis be graduated?
    note: 'A **clepsydra** is a water clock that keeps time as water runs out through a small hole at the bottom. Here $x$ is measured up the vertical axis and $y$ is the radius at height $x$. We use Torricelli''s law: water leaves a small hole at the speed $\sqrt{2gx}$ it would gain falling from the surface.'
    hints:
      - 'At height $x$ the water surface is a circle of area $\pi y^2 = \pi\sqrt{ax}$.'
    answer: 'In equal divisions: the surface falls at a steady rate'
    solution: |
      When the water stands at height $x$, its surface is a circle of radius $y = (ax)^{1/4}$, with area $\pi y^2 = \pi\sqrt a\,\sqrt x$.

      Water leaves through a hole of small area $\sigma$ at speed $\sqrt{2gx}$, so the volume falls at the rate $\sigma\sqrt{2gx}$. The same volume leaves the top layer, so
      $$\pi\sqrt a\,\sqrt x\,\frac{dx}{dt} = -\sigma\sqrt{2g}\,\sqrt x, \qquad \frac{dx}{dt} = -\frac{\sigma\sqrt{2g}}{\pi\sqrt a}.$$
      The $\sqrt x$ cancels: the level falls at a constant speed. So the scale on the axis is graduated in equal parts, each part marking the same time. That is the point of the shape: in a plain cylinder the level would fall fast at first and slowly at the end.
    viz: tp-s-clepsydra
    checked: "script: simulated the outflow; the level falls at a constant rate"
    status: ready
  - id: 1824-mirror-path
    year: 1824
    paper: "Monday Morning, Mr Hughes"
    number: "4"
    src: cp1831
    page: "52"
    leaf: 57
    topic: 'Optics: a reflected path of fixed length'
    areas: [optics, geometry]
    difficulty: 2
    statement: |
      A ray of light proceeding from a moveable point is reflected by a fixed plane mirror to a given point; find the locus of the first point when the path of the ray is of given length.
    hints:
      - 'Reflect the given point in the mirror.'
    answer: 'An arc of the circle centered at the mirror image of the given point, with radius equal to the given length'
    solution: |
      Let $B$ be the given point and $B'$ its image in the mirror. For any point $M$ of the mirror, $MB = MB'$. A ray from $X$ that reflects at $M$ and reaches $B$ has the same length as the path $X \to M \to B'$. The law of reflection (equal angles) says exactly that $X$, $M$, $B'$ are in a straight line, so the path length is $XB'$.

      So the path has length $\ell$ exactly when $XB' = \ell$. The locus is the part of the circle with center $B'$ and radius $\ell$ that lies in front of the mirror (with the line $XB'$ crossing the mirror itself).
    checked: "script: path lengths for points on the circle"
    status: ready
  - id: 1825-slide-roll
    year: 1825
    paper: "Tuesday Morning, Mr Warren"
    number: "7"
    src: cp1831
    page: "78"
    leaf: 83
    topic: 'Rolling: sliding sphere against rolling sphere'
    areas: [mechanics]
    difficulty: 2
    statement: |
      Compare the time in which a sphere slides down an inclined plane with the time in which it rolls down the same plane.
    note: 'Sliding means on a smooth plane; rolling means on a rough one, without slipping. A solid sphere of mass $m$ and radius $r$ has moment of inertia $\tfrac25mr^2$ about a diameter.'
    hints:
      - 'Some of the work done by gravity goes into spinning the rolling ball.'
    answer: 'As $\sqrt5 : \sqrt7$; the sliding sphere wins'
    solution: |
      **Sliding.** On a smooth plane of inclination $\alpha$ the acceleration is $g\sin\alpha$.

      **Rolling.** Let friction $F$ act up the slope. Then $ma = mg\sin\alpha - F$, and the turning effect of friction spins the ball: $Fr = \tfrac25mr^2\cdot\dfrac ar$, so $F = \tfrac25ma$. Together, $\tfrac75ma = mg\sin\alpha$, so $a = \tfrac57g\sin\alpha$.

      **Times.** From rest over a distance $L$, $t = \sqrt{2L/a}$, so time is proportional to $1/\sqrt a$:
      $$\frac{t_{\text{slide}}}{t_{\text{roll}}} = \sqrt{\frac57} = \frac{\sqrt5}{\sqrt7} \approx 0.845.$$
    viz: tp-s-slide-roll
    checked: "script: the two accelerations"
    status: ready
  - id: 1827-rolling-parabola
    year: 1827
    paper: "Monday Afternoon, Mr Coddington"
    number: "2"
    src: cp1831
    page: "107"
    leaf: 112
    topic: 'Rolling curves: a parabola rolling on its twin'
    areas: [conics, geometry]
    difficulty: 4
    statement: |
      What are the lines traced by the vertex and the focus of a parabola rolling on another equal to it, the vertices coinciding in one position?
    hints:
      - 'When an equal curve rolls on its mirror image, at every moment the rolling curve is the reflection of the fixed one in their common tangent.'
      - 'Where does the reflection of the focus in a tangent land?'
    answer: 'The focus traces the directrix of the fixed parabola; the vertex traces a cissoid of Diocles, $y^2(2a + x) = -x^3$'
    solution: |
      Fix the parabola $y^2 = 4ax$, with vertex $A$ at the origin, focus $S = (a, 0)$ and directrix $x = -a$.

      **The rolling copy is a mirror image.** At the start the two parabolas touch at their vertices, mirror images of each other in the common tangent there. Rolling without slipping means the arcs measured from the two vertices to the point of contact are always equal. So the contact point is the same point of the curve on both, and the rolling parabola is always the reflection of the fixed one in the common tangent at the contact point $P$. Its focus and vertex are the reflections of $S$ and $A$ in that tangent.

      **The focus.** Let $M$ be the foot of the perpendicular from $P$ to the directrix. Then $PS = PM$ (the defining property of the parabola), and the tangent at $P$ bisects the angle $SPM$ (the reflecting property). So the tangent is the perpendicular bisector of $SM$, and the reflection of $S$ is $M$, on the directrix. The rolling focus slides along the directrix of the fixed parabola.

      **The vertex.** Take $P = (at^2, 2at)$, where the tangent is $x - ty + at^2 = 0$. Reflecting the origin in this line gives
      $$\left(-\frac{2at^2}{1+t^2},\ \frac{2at^3}{1+t^2}\right).$$
      Writing $X$, $Y$ for these coordinates, one checks $Y^2(2a + X) = -X^3$. This is the **cissoid of Diocles**, with its cusp at $A$ and the asymptote $x = -2a$.
    checked: "script: reflections computed for several t"
    viz: tp-s-rolling-parabola
    status: ready
  - id: 1828-ladder
    year: 1828
    paper: "Evening Problems, Mr Whewell"
    number: "4"
    src: cp1831
    page: "123"
    leaf: 128
    topic: 'Statics: a ladder against a sloping bank'
    areas: [mechanics]
    difficulty: 2
    statement: |
      A ladder of uniform thickness rests with its lower end on a horizontal plane, and its upper end on a slope inclined $60^\circ$ to the horizon. The ladder makes an angle of $30^\circ$ with the horizon; find the force which must act horizontally at the foot to prevent sliding.
    note: 'We take both surfaces as smooth, so each pushes straight out from its surface. The slope faces the ladder, rising away from its foot.'
    hints:
      - 'Take moments about the foot of the ladder.'
    answer: '$\tfrac{\sqrt3}{4}W \approx 0.43W$, pushing the foot towards the slope'
    solution: |
      Let the ladder have weight $W$ and length $2l$, with the foot at the origin. Three forces besides the push $F$ act: the weight $W$ at the middle, the upward reaction $R$ of the ground, and the reaction $N$ of the slope, perpendicular to the slope, so at $60^\circ$ to the vertical and leaning back towards the foot.

      **Moments about the foot.** The top is at $(2l\cos30^\circ, 2l\sin30^\circ)$ and $N = N(-\sin60^\circ, \cos60^\circ)$. Its moment is
      $$2lN(\cos30^\circ\cos60^\circ + \sin30^\circ\sin60^\circ) = 2lN\cos30^\circ,$$
      and the weight's moment the other way is $Wl\cos30^\circ$. So $N = \tfrac12W$.

      **Horizontal forces.** The slope pushes the top back with horizontal force $N\sin60^\circ$, so the foot needs
      $$F = \tfrac12W\cdot\frac{\sqrt3}{2} = \frac{\sqrt3}{4}W \approx 0.433\,W$$
      towards the slope.
    checked: "script: moments checked numerically"
    status: ready
  - id: 1828-dice
    year: 1828
    paper: "Evening Problems, Mr Whewell"
    number: "17"
    src: cp1831
    page: "125"
    leaf: 130
    topic: 'Probability: six, twelve and eighteen dice'
    areas: [probability]
    difficulty: 2
    statement: |
      $A$ throws $6$ dice, $B$ throws $12$, $C$ throws $18$. Compare the chances of $A$ throwing one six, $B$ two sixes and $C$ three sixes.
    note: 'Read “one six” as “at least one six,” and so on.'
    hints:
      - 'Use the complement: the chance of fewer sixes than needed.'
    answer: 'About $0.665$, $0.619$ and $0.597$: $A$ has the best chance'
    solution: |
      Each die shows a six with chance $\tfrac16$. The number of sixes among $n$ dice is binomial.

      $$P(A) = 1 - \left(\tfrac56\right)^6 \approx 0.6651,$$
      $$P(B) = 1 - \left(\tfrac56\right)^{12} - 12\cdot\tfrac16\left(\tfrac56\right)^{11} \approx 0.6187,$$
      $$P(C) = 1 - \left(\tfrac56\right)^{18} - 18\cdot\tfrac16\left(\tfrac56\right)^{17} - \binom{18}{2}\left(\tfrac16\right)^2\left(\tfrac56\right)^{16} \approx 0.5973.$$
      Each player expects the same proportion of sixes, but $A$ does best. With more dice the count of sixes clusters more tightly around its average, and needing the full average (or more) gets harder.
    checked: "script: binomial sums"
    status: ready
  - id: 1829-roof
    year: 1829
    paper: "Evening Problems, Mr Bowstead"
    number: "9"
    src: cp1831
    page: "160"
    leaf: 165
    topic: 'Rolling: a ball rolls off a roof'
    areas: [mechanics]
    difficulty: 3
    statement: |
      The heights of the ridge and eaves of a house are $H$ and $h$, and the roof is inclined at $30^\circ$ to the horizon. Find where a sphere *rolling* down the roof from the ridge will strike the ground, and also the time of descent from the eaves.
    note: 'The **ridge** is the top of the roof and the **eaves** its lower edge. Take a small solid sphere starting from rest. Its spin does not change its flight once it leaves the roof (air is ignored).'
    hints:
      - 'A rolling solid sphere accelerates at $\tfrac57 g\sin\alpha$.'
      - 'It leaves the eaves moving at $30^\circ$ below the horizontal.'
    answer: 'It leaves with $v^2 = \tfrac{10}{7}g(H - h)$, lands after $t = \dfrac{\sqrt{v^2/4 + 2gh} - v/2}{g}$, at $\tfrac{\sqrt3}{2}vt$ beyond the eaves'
    solution: |
      **Down the roof.** A rolling solid sphere accelerates at $\tfrac57g\sin30^\circ = \tfrac{5}{14}g$ (see the 1825 problem on sliding and rolling). The roof is $2(H - h)$ long, so at the eaves
      $$v^2 = 2\cdot\tfrac5{14}g\cdot2(H-h) = \tfrac{10}{7}g(H - h).$$

      **The fall.** It leaves at $30^\circ$ below the horizontal, with downward speed $\tfrac12v$ and sideways speed $\tfrac{\sqrt3}2v$, from height $h$. The time $t$ to the ground solves $h = \tfrac12vt + \tfrac12gt^2$:
      $$t = \frac{\sqrt{\tfrac14v^2 + 2gh} - \tfrac12v}{g}.$$
      It lands $\tfrac{\sqrt3}{2}vt$ beyond the eaves (horizontally).

      **Example.** With $H = 40$ ft, $h = 30$ ft and $g = 32$ ft/s²: $v \approx 21.4$ ft/s, $t \approx 1.08$ s, landing about $19.9$ ft out from the wall.
    checked: "script: the example"
    viz: tp-s-roof
    status: ready
  - id: 1830-urns
    year: 1830
    paper: "Evening Problems, Mr King"
    number: "13"
    src: cp1831
    page: "191"
    leaf: 196
    topic: 'Probability: swapping balls between two urns'
    areas: [probability]
    difficulty: 2
    statement: |
      There are two urns $A$ and $B$, the former containing three white and the latter three black balls: a ball is taken from each at the same time and put into the other, and this operation is repeated three times; what is the probability that $A$ will contain three black and $B$ three white balls?
    hints:
      - 'Track $k$, the number of black balls in $A$. Every swap can raise $k$ by at most one.'
    answer: '$\tfrac{4}{81}$'
    solution: |
      Let $k$ be the number of black balls in $A$; then $B$ holds $3 - k$ black and $k$ white. A swap raises $k$ by one when it takes a white ball from $A$ (chance $\tfrac{3-k}{3}$) and a black ball from $B$ (chance $\tfrac{3-k}{3}$).

      To reach $k = 3$ in three swaps, every swap must raise $k$:
      - from $k = 0$: chance $1\cdot 1 = 1$;
      - from $k = 1$: chance $\tfrac23\cdot\tfrac23 = \tfrac49$;
      - from $k = 2$: chance $\tfrac13\cdot\tfrac13 = \tfrac19$.

      Multiplying, the probability is $\tfrac{4}{81} \approx 0.049$.
    checked: "script: exact chain and a simulation of 200,000 runs"
    status: ready
  - id: 1830-mirrors
    year: 1830
    paper: "Friday Afternoon"
    number: "9"
    src: cp1831
    page: "179"
    leaf: 184
    topic: 'Optics: the images between two mirrors'
    areas: [optics, geometry]
    difficulty: 3
    statement: |
      Having given the position of an object placed between two plane mirrors inclined to each other at a given angle, find the number and positions of the images.
    hints:
      - 'All the images lie on one circle: the one through the object, centered on the line where the mirrors meet.'
      - 'Follow the light that reflects first in one mirror, then the other, and so on. Stop when an image falls behind the next mirror.'
    answer: '$\left\lceil\dfrac{180^\circ - \phi}{\theta}\right\rceil + \left\lceil\dfrac{180^\circ - (\theta - \phi)}{\theta}\right\rceil$ images (one fewer if the last two coincide); for $\theta = 360^\circ/m$ with $m$ even, $m - 1$'
    solution: |
      Look down the line where the mirrors meet, a point $O$. Measure angles from the first mirror: it lies along $0^\circ$, the second along $\theta$, and the object at angle $\phi$, with $0 < \phi < \theta$.

      **Positions.** Reflecting in the first mirror sends angle $\psi$ to $-\psi$; reflecting in the second sends it to $2\theta - \psi$. Reflections keep distances from $O$, so every image lies on the circle through the object with center $O$. Starting with the first mirror, the images are at
      $$-\phi,\quad 2\theta + \phi,\quad -(2\theta + \phi),\quad 4\theta + \phi,\ \dots$$
      and starting with the second mirror they are at $2\theta - \phi,\ -2\theta + \phi,\ 4\theta - \phi, \dots$. Each new image is formed only if the previous one lies in front of the mirror that reflects it.

      **How many.** The images of each chain move round the circle in steps of $\theta$ (in angular distance from the nearer mirror), and a chain stops once an image passes into the region behind both mirrors. Counting the steps gives
      $$\left\lceil\frac{180^\circ - \phi}{\theta}\right\rceil \text{ images in the first chain}, \qquad \left\lceil\frac{180^\circ - (\theta - \phi)}{\theta}\right\rceil \text{ in the second},$$
      and if the two chains end at the same point it is one image, not two.

      **Examples.** At $90^\circ$ you see $3$ images, at $60^\circ$ you see $5$, and whenever $360^\circ/\theta = m$ is an even whole number you see $m - 1$, wherever the object is. That is how a kaleidoscope makes a perfect pattern. For $m$ odd you see $m - 1$ if the object is on the bisector of the angle and $m$ otherwise.
    checked: "script: traced the reflections for ten angles and forty object positions each; the count formula matched every time"
    viz: tp-s-mirrors
    status: ready
  - id: 1830-rainbow
    year: 1830
    paper: "Tuesday Afternoon"
    number: "6"
    src: cp1831
    page: "205"
    leaf: 210
    topic: 'Optics: the refractive index from a rainbow'
    areas: [optics]
    difficulty: 3
    statement: |
      Having given the radius of the arc of any colour in the primary rainbow, find the index of refraction, for that colour, out of air into water.
    note: 'The **radius** of the rainbow is the angle between the rainbow and the point straight opposite the Sun, about $42^\circ$ for red.'
    hints:
      - 'In the primary bow, light enters a drop, reflects once inside, and leaves. Its total deviation is $180^\circ + 2i - 4r$, where $i$ and $r$ are the angles of incidence and refraction.'
      - 'The bow is where the deviation is least. Show that this happens when $\tan i = 2\tan r$.'
    answer: 'Solve $2t^3 - 3kt^2 - k = 0$ for $t = \tan r$, with $k = \tan\tfrac\rho2$; then $i = 2r - \tfrac\rho2$ and $\mu = \sin i/\sin r$. For $\rho = 42^\circ$, $\mu \approx 1.333$.'
    solution: |
      **Deviation.** A ray meets a spherical drop at incidence $i$ and bends to $r$, with $\sin i = \mu\sin r$. It turns through $i - r$ entering, $180^\circ - 2r$ at the reflection inside, and $i - r$ leaving: $D = 180^\circ + 2i - 4r$. The rainbow sits where $D$ is least, because the rays bunch up there.

      **Least deviation.** Differentiating $\sin i = \mu\sin r$ gives $\cos i\,di = \mu\cos r\,dr$. At the least deviation $dD = 2di - 4dr = 0$, so $di = 2dr$ and $2\cos i = \mu\cos r$. Dividing $\sin i = \mu\sin r$ by this:
      $$\tan i = 2\tan r.$$

      **The radius.** The bow is seen at angle $\rho = 180^\circ - D = 4r - 2i$ from the point opposite the Sun. So $i = 2r - \tfrac\rho2$, and $\tan(2r - \tfrac\rho2) = 2\tan r$. With $t = \tan r$ and $k = \tan\tfrac\rho2$, expanding the left side and clearing fractions gives
      $$2t^3 - 3kt^2 - k = 0.$$
      This cubic has one positive root. From it, $r = \tan^{-1}t$, $i = 2r - \tfrac\rho2$ and $\mu = \sin i/\sin r$.

      **Red light.** For $\rho = 42^\circ$: $t \approx 0.845$, $r \approx 40.2^\circ$, $i \approx 59.4^\circ$, and $\mu \approx 1.333$, the refractive index of water. A check: least deviation also requires $\cos^2 i = \tfrac13(\mu^2 - 1)$, and these numbers satisfy it.
    checked: "script: solved the cubic for 42° and checked cos² i = (μ² − 1)/3"
    viz: tp-s-rainbow
    status: ready
