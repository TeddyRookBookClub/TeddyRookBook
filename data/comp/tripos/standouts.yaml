  - id: 1854-coins
    year: 1854
    paper: "Problems, Wednesday, January 18, 9½ to 12½"
    number: "2"
    src: sh1854
    page: "211"
    leaf: 222
    topic: 'Expectation: what are the four coins worth?'
    areas: [probability]
    difficulty: 1
    statement: |
      A bag contains nine coins, five are sovereigns, the other four are equal to each other in value; find what this value must be, in order that the expectation of receiving two coins at random out of the bag may be worth twenty-four shillings.
    note: 'A **sovereign** was a gold coin worth $20$ shillings. The **expectation** is the average value.'
    hints:
      - 'Each of the two coins drawn is worth, on average, the average coin in the bag.'
    answer: '$2$ shillings each (a florin)'
    solution: |
      Each coin drawn, taken alone, is equally likely to be any of the nine coins, so its expected value is the average value in the bag. With the four coins worth $x$ shillings each, that average is $\dfrac{5\cdot20 + 4x}{9}$. For two coins,
      $$2\cdot\frac{100 + 4x}{9} = 24 \quad\Longrightarrow\quad 100 + 4x = 108 \quad\Longrightarrow\quad x = 2.$$
      The other coins are worth $2$ shillings each: florins.
    checked: "exact arithmetic"
    status: ready
  - id: 1854-broken-rod
    year: 1854
    paper: "Problems, Wednesday, January 18, 9½ to 12½"
    number: "7"
    src: sh1854
    page: "212"
    leaf: 223
    topic: 'Probability: can the broken rod make a triangle?'
    areas: [probability, calculus]
    difficulty: 3
    statement: |
      A rod is marked at random at two points, and then divided into three parts at those points; shew that the probability of its being possible to form a triangle with the pieces is $\tfrac14$.

      Again: a piece is cut off the end of a rod, and the remainder is cut into two pieces at random; shew that the probability of its being possible to form a triangle with the pieces is in this case $\log_e 2 - \tfrac12$.
    hints:
      - 'Three pieces make a triangle when each is shorter than half the rod.'
      - 'For the second part, condition on the length $x$ of the first piece.'
    solution: |
      Take the rod to have length $1$. Three lengths adding to $1$ make a triangle exactly when each is less than $\tfrac12$ (each side must be shorter than the other two together).

      **First part.** Let the marks be at $u$ and $w$, chosen independently and uniformly, so the point $(u, w)$ is uniform in the unit square. Take $u < w$ (half the square; the other half is the same by symmetry). The pieces are $u$, $w - u$, $1 - w$, and we need
      $$u < \tfrac12, \qquad w > \tfrac12, \qquad w - u < \tfrac12.$$
      In the triangle $0 < u < w < 1$ (area $\tfrac12$) these cut out a small triangle with corners $(0, \tfrac12)$, $(\tfrac12, \tfrac12)$, $(\tfrac12, 1)$, of area $\tfrac18$. The probability is $\tfrac18 \big/ \tfrac12 = \tfrac14$.

      **Second part.** Let the first piece have length $x$, uniform on $(0, 1)$, and cut the rest at a uniform fraction $y$: the pieces are $x$, $(1-x)y$, $(1-x)(1-y)$. We need $x < \tfrac12$, and then $(1-x)y < \tfrac12$ and $(1-x)(1-y) < \tfrac12$, that is,
      $$1 - \frac{1}{2(1-x)} < y < \frac{1}{2(1-x)},$$
      an interval of length $\dfrac{1}{1-x} - 1$. So the probability is
      $$\int_0^{1/2}\left(\frac{1}{1-x} - 1\right)dx = \ln 2 - \frac12 \approx 0.193.$$
    checked: "script: 400,000 random rods for each part"
    viz: tp-s-stick
    status: ready
  - id: 1854-halfway
    year: 1854
    paper: "Problems, Wednesday, January 18, 9½ to 12½"
    number: "9"
    src: sh1854
    page: "212"
    leaf: 223
    topic: 'Geometry: half way to A, B, C forever'
    areas: [geometry]
    difficulty: 3
    statement: |
      $A$, $B$, $C$ are three fixed points, and $P$ a point which moves first half way to $A$, then half way to $B$, then half way to $C$, then half way to $A$ again, and so on for ever; shew that from whatever position $P$ start, its path approximates to the perimeter of a certain triangle whose area is one-seventh of the area of the triangle $ABC$.
    hints:
      - 'Each move halves the distance between two copies of $P$ started from different places. So all paths come together.'
      - 'Look for three points $X_A$, $X_B$, $X_C$ that the moves cycle through exactly.'
    solution: |
      **Everything settles down.** A move "half way to $A$" is $P \mapsto \tfrac12(P + A)$. If two starting points differ by a vector $\mathbf d$, after one move they differ by $\tfrac12\mathbf d$. So whatever the start, after many moves the path is as close as we like to the path from any other start.

      **The limiting cycle.** Look for points $X_A$, $X_B$, $X_C$ (the places reached just after moving towards $A$, $B$, $C$) with
      $$X_A = \tfrac12(X_C + A), \quad X_B = \tfrac12(X_A + B), \quad X_C = \tfrac12(X_B + C).$$
      Substituting round the cycle, $X_A = \tfrac12A + \tfrac14C + \tfrac18B + \tfrac18X_A$, so
      $$X_A = \frac{4A + B + 2C}{7}, \quad X_B = \frac{2A + 4B + C}{7}, \quad X_C = \frac{A + 2B + 4C}{7}.$$
      Every path approaches the triangle $X_AX_BX_C$, going round its perimeter.

      **Its area.** The area of a triangle whose corners are these weighted averages of $A$, $B$, $C$ is the determinant of the weights times the area of $ABC$:
      $$\frac{1}{7^3}\det\begin{pmatrix}4&1&2\\2&4&1\\1&2&4\end{pmatrix} = \frac{49}{343} = \frac17.$$
    checked: "script: iterated 300 moves from a far start; area ratio 1/7 to 10⁻¹²"
    viz: tp-s-halfway
    status: ready
  - id: 1854-table
    year: 1854
    paper: "Problems, Wednesday, January 18, 9½ to 12½"
    number: "16"
    src: sh1854
    page: "213"
    leaf: 224
    topic: 'Projectiles: up a ramp and off the top'
    areas: [mechanics, calculus]
    difficulty: 3
    statement: |
      An inclined plane is fixed on a table, and from the foot of it a body is projected upwards along the plane with the velocity due to the height $h$; after passing over the top of the plane the body strikes the table at a distance $z$ from the foot of the plane; shew that, if the length of the plane be $l$, and $\alpha$ its inclination to the horizon be less than $\tfrac14\pi$, the greatest value of $z$ for given values of $h$ and $\alpha$ is $\dfrac{h}{\sin\alpha\cos\alpha}$, and corresponds to the value $l = 2h\dfrac{\cot2\alpha}{\cos\alpha}$.
    note: '“The velocity due to the height $h$” is $\sqrt{2gh}$, the speed gained falling through $h$. The plane is smooth.'
    hints:
      - 'At the top, the speed is $\sqrt{2g(h - l\sin\alpha)}$ and the body flies off along the plane. Its flight is part of the parabola it would follow if launched from the foot at angle $\alpha$ with the full speed.'
    solution: |
      Let $H = l\sin\alpha$ be the height of the top, and write $s = \sin\alpha$, $c = \cos\alpha$.

      **Leaving the top.** The plane is smooth, so at the top the speed is $u$ with $u^2 = 2g(h - H)$, and the body flies off in the direction of the plane, at angle $\alpha$ above the horizontal, from height $H$.

      **The flight.** Its horizontal run $X$ before landing solves $\dfrac{gX^2}{2u^2c^2} - X\dfrac sc - H = 0$. Taking the positive root and using $u^2/g = 2(h-H)$,
      $$X = 2c\left[(h-H)s + \sqrt{(h-H)(hs^2 + Hc^2)}\right].$$
      (Inside the square root, $(h-H)^2s^2 + H(h-H) = (h-H)(hs^2 + Hc^2)$.)

      **The distance from the foot.** The top is $H\cot\alpha$ from the foot, so $z = Hc/s + X$, and
      $$\frac zc = H\,\frac{\cos2\alpha}{s} + 2hs + 2\sqrt{(h-H)(hs^2 + Hc^2)},$$
      using $\tfrac1s - 2s = \tfrac{\cos2\alpha}{s}$. The square root of a positive product of two linear factors with opposite slopes is a concave function, so $z$ is greatest where its derivative in $H$ vanishes:
      $$\frac{\cos2\alpha}{s} + \frac{h\cos2\alpha - 2Hc^2}{\sqrt{(h-H)(hs^2 + Hc^2)}} = 0.$$

      **The best plane.** Try $H = h\cos2\alpha/c^2$. Then $h - H = hs^2/c^2$ and $hs^2 + Hc^2 = hc^2$, so the square root is $hs$, and the derivative is $\frac{\cos2\alpha}{s} - \frac{h\cos2\alpha}{hs} = 0$. This $H$ is positive only when $\alpha < 45^\circ$, which is why the problem needs that. The length of the plane is
      $$l = \frac Hs = \frac{h\cos2\alpha}{sc^2} = 2h\,\frac{\cot2\alpha}{\cos\alpha},$$
      since $\sin2\alpha = 2sc$.

      **The greatest distance.** Putting this back, $\dfrac zc = \dfrac{h\cos^22\alpha}{c^2s} + 4hs$, so
      $$z = \frac{h\left(\cos^22\alpha + 4s^2c^2\right)}{sc} = \frac{h\left(\cos^22\alpha + \sin^22\alpha\right)}{sc} = \frac{h}{\sin\alpha\cos\alpha}.$$
    checked: "script: searched all lengths l for h = 1, α = 0.5; greatest z and the best l agree with the formulas to 10⁻⁴"
    status: ready
  - id: 1854-two-ways
    year: 1854
    paper: "Problems, Tuesday, January 17, 9 to 12"
    number: "13"
    src: sh1854
    page: "208"
    leaf: 219
    topic: 'Projectiles: the two aims that hit the same mark'
    areas: [mechanics]
    difficulty: 3
    statement: |
      There are generally two directions in which a projectile may be projected with given velocity from a point $A$, so as to pass through another point $B$; shew that one of these directions is inclined to the vertical at the same angle that the other is inclined to the line $AB$. Hence shew that the locus of points, for which a given sight must be used in firing with a given charge of powder, is the surface generated by the revolution, about the vertical, of the path of the bullet obtained by aiming at the zenith with the given sight, and with the given charge of powder.
    note: 'A gun''s **sight** sets the angle between the barrel and your line of sight to the target; the **charge of powder** sets the speed. The **zenith** is the point straight overhead.'
    hints:
      - 'With $T = \tan\phi$, the condition to hit $B$ is a quadratic in $T$. Find $\tan(\phi_1 + \phi_2)$ from the sum and product of its roots.'
    solution: |
      Let $B$ be at distance $R$ from $A$ along a line at elevation $\theta$, so $x = R\cos\theta$, $y = R\sin\theta$. Launch at speed $v$ and elevation $\phi$, with $T = \tan\phi$ and $k = \dfrac{gx^2}{2v^2}$.

      **The two directions.** Passing through $B$ means $y = xT - k(1 + T^2)$, or $kT^2 - xT + (k + y) = 0$. Its two roots satisfy $T_1 + T_2 = \dfrac xk$ and $T_1T_2 = 1 + \dfrac yk$, so
      $$\tan(\phi_1 + \phi_2) = \frac{T_1 + T_2}{1 - T_1T_2} = \frac{x/k}{-y/k} = -\cot\theta = \tan(90^\circ + \theta).$$
      So $\phi_1 + \phi_2 = 90^\circ + \theta$. Then the angle between the first direction and the vertical is $90^\circ - \phi_1 = \phi_2 - \theta$, which is the angle between the second direction and the line $AB$.

      **The sight.** A sight setting fixes the angle $\delta$ between the barrel and the line of sight $AB$. If $B$ is hit with the barrel at angle $\delta$ to $AB$, then by the first part the other possible aim makes angle $\delta$ with the vertical. So $B$ lies on the path of a bullet fired at angle $\delta$ from the vertical, which is the path you get by sighting straight up at the zenith with that sight. The direction around the vertical can be anything, so the points form the surface swept out when that path is spun about the vertical through $A$. And each step reverses, so every point of that surface needs that sight.
    checked: "script: solved for both angles for a sample target"
    viz: tp-s-two-ways
    status: ready
  - id: 1854-ring-bead
    year: 1854
    paper: "Problems, Tuesday, January 17, 9 to 12"
    number: "20"
    src: sh1854
    page: "209"
    leaf: 220
    topic: 'Oscillations: a bead in a ring that can slide'
    areas: [mechanics]
    difficulty: 4
    statement: |
      A thin hollow ring, of which the plane is vertical, and which contains a bead, is placed upon a smooth horizontal plane: prove that the bead, having been placed near the lowest point of the ring, will oscillate isochronously with a perfect pendulum the length of which is equal to
      $$\frac{\mu a}{m + \mu},$$
      $a$ being the radius of the ring, $\mu$ its mass, and $m$ the mass of the bead.
    note: '“Oscillate isochronously with” means swing with the same period as. A **perfect pendulum** is a point weight on a light string. The bead moves without friction inside the ring.'
    hints:
      - 'Nothing pushes the system sideways, so its center of mass does not move sideways.'
      - 'Write the kinetic and potential energy for a small angle $\theta$ of the bead from the bottom.'
    solution: |
      Let the ring's center move sideways by $X$ and the bead sit at angle $\theta$ from the bottom, small.

      **Momentum.** The smooth plane pushes only upward, so the total sideways momentum stays zero: $\mu\dot X + m(\dot X + a\dot\theta) = 0$ (to first order), giving $\dot X = -\dfrac{ma}{m + \mu}\dot\theta$. The bead's sideways speed is then $\dot X + a\dot\theta = \dfrac{\mu a}{m+\mu}\dot\theta$.

      **Energy.** For small $\theta$,
      $$\text{KE} = \tfrac12\mu\dot X^2 + \tfrac12m(\dot X + a\dot\theta)^2 = \tfrac12\,\frac{m\mu a^2}{m + \mu}\,\dot\theta^2, \qquad \text{PE} = \tfrac12mga\,\theta^2.$$
      This is simple harmonic motion with
      $$\omega^2 = \frac{mga}{m\mu a^2/(m+\mu)} = \frac{g(m + \mu)}{\mu a}.$$
      A pendulum of length $L$ has $\omega^2 = g/L$, so $L = \dfrac{\mu a}{m + \mu}$. A very heavy ring ($\mu \gg m$) gives $L = a$, the ordinary bead in a fixed ring; a light ring swings much faster.
    checked: "script: integrated the full equations of motion; the period matches to 10⁻³"
    viz: tp-s-ring
    status: ready
  - id: 1854-chord
    year: 1854
    paper: "Problems, Thursday, January 19, 9 to 12"
    number: "1"
    src: sh1854
    page: "216"
    leaf: 227
    topic: 'Geometry: a big circle touching two small ones'
    areas: [geometry]
    difficulty: 2
    statement: |
      Two circles of radii $r$, $r'$, touch a straight line at the same point on opposite sides: a circle, of which the radius is $R$ and of which the straight line is a chord, touches both the former circles. Prove that the length of the chord is equal to
      $$\frac{4R}{\left(\dfrac{r}{r'}\right)^{\frac12} + \left(\dfrac{r'}{r}\right)^{\frac12}}.$$
    hints:
      - 'Put the line on the $x$-axis and the common point at the origin. The small circles are inside the big one, touching it.'
    solution: |
      Put the line along the $x$-axis, the common point of contact at the origin, and the small circles' centers at $(0, r)$ and $(0, -r')$. Let the big circle have center $(h, k)$. Its half-chord on the $x$-axis is $\sqrt{R^2 - k^2}$.

      The small circles lie inside the big one and touch it, so the distances between centers are $R - r$ and $R - r'$:
      $$h^2 + (k - r)^2 = (R - r)^2, \qquad h^2 + (k + r')^2 = (R - r')^2.$$
      Expanding, $h^2 + k^2 = R^2 - 2r(R - k)$ and $h^2 + k^2 = R^2 - 2r'(R + k)$. So $r(R - k) = r'(R + k)$, which gives
      $$k = R\,\frac{r - r'}{r + r'}, \qquad R^2 - k^2 = R^2\,\frac{4rr'}{(r + r')^2}.$$
      The chord is $2\sqrt{R^2 - k^2} = \dfrac{4R\sqrt{rr'}}{r + r'}$. Dividing top and bottom by $\sqrt{rr'}$ gives the stated form.
    checked: "script: a sample case"
    status: ready
