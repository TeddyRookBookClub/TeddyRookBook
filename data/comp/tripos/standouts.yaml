# Forty standout problems from the Cambridge Senate-House examination (the Mathematical Tripos), 1801–1860.
# Public domain. Each problem names its year, paper, number and the scan it was transcribed from (`src`, a key of
# `sources`, with the printed page and the archive.org leaf). Hints, notes and solutions are our own.
# Format: layouts/comp/tpaper.html and scripts/comp/check-comp.js.
kind: collection
slug: problems
title: "Forty standout Tripos problems"
intro: |
  Forty problems picked from Tripos papers set between 1801 and 1860, chosen because they are still fun today and
  because most of them move: projectiles, pulleys, rolling balls, billiard tables, mirrors and rainbows. The words are
  the examiners' own. The hints, notes and solutions are ours.
