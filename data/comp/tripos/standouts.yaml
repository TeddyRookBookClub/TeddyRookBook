    areas: [combinatorics, geometry]
    difficulty: 1
    statement: |
      There are $n$ points in space, of which $p$ are in one plane, and there is no other plane which contains more than three of them; how many planes are there, each of which contains three of the points?
    answer: '$\dbinom n3 - \dbinom p3 + 1$'
    solution: |
      Any three of the points that are not in a line fix a plane. Count the triples: there are $\binom n3$. A plane containing exactly three of the points comes from exactly one triple. The special plane contains $\binom p3$ triples but is only one plane. So the number of planes is
      $$\binom n3 - \binom p3 + 1.$$
      (We take it, as intended, that no three of the points are in a straight line.)
