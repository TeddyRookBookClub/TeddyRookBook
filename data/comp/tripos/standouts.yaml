  - id: 1860-hyperbola
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "4"
    src: sh1860
    page: "166"
    leaf: 177
    topic: 'Conics: an isosceles triangle on an asymptote'
    areas: [conics]
    difficulty: 3
    statement: |
      If the tangent at any point $P$ of an hyperbola cut an asymptote in $T$, and if $SP$ cut the same asymptote in $Q$, then $SQ = QT$.
    note: '$S$ is a focus of the hyperbola (either one works).'
    hints:
      - 'Use $P = (a\sec\phi, b\tan\phi)$ and the asymptote $y = \tfrac ba x$. Find $T$ and $Q$.'
    hints:
      - 'Name the points of the asymptote by $\lambda$: the point $(a\lambda, b\lambda)$ is at distance $c\lambda$ from the center, where $c = \sqrt{a^2+b^2}$.'
      - 'Use the cosine rule for $SQ$, and find $\lambda$ for $T$ and for $Q$ with $P = (a\sec\phi, b\tan\phi)$.'
    solution: |
      Take $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$ with center $C$, let $c = \sqrt{a^2+b^2}$, so the focus is $S = (c, 0)$, and use the asymptote $y = \tfrac bax$. Its point $(a\lambda, b\lambda)$ is at distance $c\lambda$ from $C$, and the asymptote makes an angle with $CS$ whose cosine is $a/c$. Let $P = (a\sec\phi, b\tan\phi)$, and write $\sigma = \sin\phi$, $\kappa = \cos\phi$.

      **The point $T$.** The tangent at $P$ is $\dfrac{x\sec\phi}{a} - \dfrac{y\tan\phi}{b} = 1$. On the asymptote this gives $\lambda(\sec\phi - \tan\phi) = 1$, so
      $$\lambda_T = \frac{\kappa}{1 - \sigma}, \qquad \lambda_T^2 - 1 = \frac{\kappa^2 - (1-\sigma)^2}{(1-\sigma)^2} = \frac{2\sigma}{1-\sigma}.$$

      **The point $Q$.** $(a\lambda, b\lambda)$ is on the line $SP$ when $(a\lambda - c)\,b\tan\phi = b\lambda\,(a\sec\phi - c)$. Solving and multiplying through by $\kappa$,
      $$\lambda_Q = \frac{c\,\sigma}{c\kappa - a + a\sigma}.$$

      **Compare the lengths.** By the cosine rule in triangle $SCQ$, $SQ^2 = c^2\left(\lambda_Q^2 - \tfrac{2a}{c}\lambda_Q + 1\right)$, and $QT^2 = c^2(\lambda_T - \lambda_Q)^2$. So
      $$\frac{SQ^2 - QT^2}{c^2} = 2\lambda_Q\left(\lambda_T - \frac ac\right) - (\lambda_T^2 - 1).$$
      Now $\lambda_T - \dfrac ac = \dfrac{c\kappa - a + a\sigma}{c(1-\sigma)}$, so $2\lambda_Q\left(\lambda_T - \frac ac\right) = \dfrac{2\sigma}{1-\sigma} = \lambda_T^2 - 1$. The difference is zero: $SQ = QT$. For the other focus, replace $c$ by $-c$ throughout; the same lines go through.
    checked: "script: both foci and four points on a sample hyperbola; SQ = QT to 10⁻⁹; computer algebra for λ_Q"
    status: ready
  - id: 1860-sum-products
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "5"
    src: sh1860
    page: "166"
    leaf: 177
    topic: 'Algebra: adding all products of two numbers'
    areas: [algebra]
    difficulty: 1
    statement: |
      Prove that the sum of the products of the first $n$ natural numbers taken two and two together is
      $$\frac{(n-1)\,n\,(n+1)(3n+2)}{24}.$$
    hints:
      - 'Square $1 + 2 + \cdots + n$.'
    solution: |
      Squaring the sum $1 + 2 + \cdots + n$ gives every square once and every product of two different numbers twice:
      $$\Big(\sum_{i=1}^n i\Big)^2 = \sum_{i=1}^n i^2 + 2\sum_{i<j} ij.$$
      So
      $$\sum_{i<j} ij = \frac12\left[\frac{n^2(n+1)^2}{4} - \frac{n(n+1)(2n+1)}{6}\right] = \frac{n(n+1)\big[3n(n+1) - 2(2n+1)\big]}{24} = \frac{n(n+1)(3n^2 - n - 2)}{24},$$
      and $3n^2 - n - 2 = (n - 1)(3n + 2)$.
    checked: "script: n up to 39"
    status: ready
  - id: 1860-escribed
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "6"
    src: sh1860
    page: "166"
    leaf: 177
    topic: 'Geometry: the excenters lie outside the circumcircle'
    areas: [geometry]
    difficulty: 3
    statement: |
      The centres of the escribed circles of a triangle must lie without the circumscribing circle, and cannot be equidistant from it unless the triangle be equilateral.
    note: 'An **escribed circle** touches one side of the triangle and the other two sides extended. Its center is an **excenter**.'
    hints:
      - 'Let the bisector from $A$ meet the circumcircle again at $M$. Then $M$ is equally far from $B$, $C$, the incenter $I$ and the excenter $I_a$.'
      - 'Compute the power of $I_a$ with respect to the circumcircle: $I_aM\cdot I_aA$.'
    solution: |
      Let $I$ be the incenter, $I_a$ the excenter opposite $A$, $r_a$ its radius, and $O$, $R$ the circumcenter and circumradius.

      **A key point.** The bisector of angle $A$ passes through $I$ and $I_a$ and meets the circumcircle again at $M$, the middle of arc $BC$. We know $MB = MC = MI$ (see the 1878 paper, problem 1). The bisectors $BI$ and $BI_a$ of the inside and outside angles at $B$ are perpendicular, so the circle on $II_a$ as diameter passes through $B$, and its center, the midpoint of $II_a$, is equally far from $I$ and $B$. Only one point of the line $II_a$ is equally far from $I$ and $B$, and $M$ is such a point. So $M$ is the midpoint of $II_a$, and $MI_a = MI = MB$.

      **Power of $I_a$.** Along the line, the order is $A$, $I$, $M$, $I_a$. The power of $I_a$ with respect to the circumcircle is
      $$OI_a^2 - R^2 = I_aM\cdot I_aA.$$
      Now $I_aM = MB = 2R\sin\tfrac A2$ (a chord facing an angle $\tfrac A2$ at the circumference) and $I_aA = r_a/\sin\tfrac A2$ (from the right triangle formed by $A$, $I_a$ and the point where the excircle touches $AB$ extended). So
      $$OI_a^2 = R^2 + 2Rr_a > R^2.$$
      Every excenter lies outside the circumcircle.

      **Equal distances.** The distance from $I_a$ to the circle is $OI_a - R = \sqrt{R^2 + 2Rr_a} - R$, which increases with $r_a$. So the three excenters are equally far from the circle only if $r_a = r_b = r_c$. Since $r_a = \dfrac{\Delta}{s - a}$ (area over semiperimeter minus the side), this means $s - a = s - b = s - c$, so $a = b = c$.
    checked: "script: OI_a² = R² + 2R r_a on a sample triangle"
    status: ready
  - id: 1860-equilateral
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "vii"
    src: sh1860
    page: "166"
    leaf: 177
    topic: 'Geometry: reciprocals of perpendiculars to a tangent'
    areas: [geometry, trigonometry]
    difficulty: 3
    statement: |
      If perpendiculars be drawn from the angles of an equilateral triangle upon any tangent to the inscribed circle, prove that the sum of the reciprocals of those perpendiculars which fall upon the same side of the tangent is equal to the reciprocal of that perpendicular which falls upon the opposite side.
    note: 'The **angles** of a triangle here means its corners.'
    hints:
      - 'Use signed distances from the tangent line. Take the incircle of radius $1$; the corners are at distance $2$ from the center.'
      - 'The three numbers $1 - 2\cos\psi_k$, with $\psi_k$ spaced $120^\circ$ apart, are the roots of a cubic with no $x$ term.'
    solution: |
      Take the incircle to have radius $1$ and center $O$; then the corners are at distance $2$ from $O$, at angles $120^\circ$ apart. A tangent line has a unit normal $\mathbf n$ with the line at $\mathbf n\cdot X = 1$. The signed distance of a corner at angle $\psi$ from $\mathbf n$ is
      $$d = 1 - 2\cos\psi,$$
      positive on the same side as $O$. The claim is that $\dfrac1{d_1} + \dfrac1{d_2} + \dfrac1{d_3} = 0$, with exactly one $d$ negative.

      **A cubic.** With $\psi_k = \psi + 120^\circ k$, the numbers $c = \cos\psi_k$ are the three roots of $4c^3 - 3c = \cos3\psi$. Put $c = \tfrac12(1 - d)$:
      $$\tfrac12(1-d)^3 - \tfrac32(1-d) = \cos3\psi \quad\Longrightarrow\quad d^3 - 3d^2 + 2 + 2\cos3\psi = 0.$$
      This cubic has no term in $d$, and for a cubic $d^3 + pd^2 + qd + s$ the reciprocals of the roots add to $-q/s$. So $\sum 1/d_k = 0$.

      **Signs.** The product of the roots is $-(2 + 2\cos3\psi) < 0$ (when no corner is on the tangent), so an odd number of them are negative, and they cannot all be negative since the line touches the incircle between the corners. So one corner lies on the far side, and the reciprocals of the other two add up to the reciprocal of its distance.
    checked: "script: four tangent directions"
    status: ready
  - id: 1860-chords
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "12"
    src: sh1860
    page: "167"
    leaf: 178
    topic: 'Central forces: chords all taking the same time'
    areas: [mechanics, geometry]
    difficulty: 3
    statement: |
      If a particle slide along a chord of a circle under the action of a centre of force varying as the distance, the time will be the same for all chords provided they terminate at either extremity of the diameter through the centre of force.
    note: 'The particle starts from rest at one end of a smooth chord and is pulled towards a fixed point $O$ inside the circle with a force proportional to its distance from $O$.'
    hints:
      - 'Along a straight wire, a force proportional to distance from $O$ gives simple harmonic motion about the foot $N$ of the perpendicular from $O$ to the wire.'
      - 'Let $D$, $E$ be the ends of the diameter through $O$. For a chord $DA$, the angle $DAE$ is a right angle, so $ON$ is parallel to $EA$.'
    solution: |
      Let the force be $k^2$ times the distance, towards $O$.

      **Motion on one chord.** Let $N$ be the foot of the perpendicular from $O$ to the chord. The force splits into a part along $ON$, which the chord holds back, and a part along the chord, equal to $k^2$ times the distance from $N$. So the particle does simple harmonic motion about $N$ with angular frequency $k$, whatever the chord: starting from rest at distance $s_0$ from $N$, it is at distance $s_0\cos kt$ (on the same side) at time $t$.

      **Chords through $D$.** Let $DE$ be the diameter through $O$ and $DA$ a chord. The angle $DAE$ is a right angle (angle in a semicircle), so $ON \perp DA$ means $ON \parallel EA$. By similar triangles,
      $$\frac{DN}{NA} = \frac{DO}{OE},$$
      the same for every such chord.

      **The time.** Starting from rest at the end farther from $N$ — say $D$, if $DO \ge OE$ — the particle reaches $A$ when $\cos kt = -\dfrac{NA}{ND} = -\dfrac{OE}{DO}$, so
      $$t = \frac1k\cos^{-1}\left(-\frac{OE}{DO}\right),$$
      the same for all chords from $D$. The same holds for the chords from $E$.
    checked: "script: four chords from D; times equal to 10⁻⁹"
    viz: tp-s-chords
    status: ready
  - id: 1860-ray
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "xv"
    src: sh1860
    page: "167"
    leaf: 178
    topic: 'Optics: a light ray that bends into a circle'
    areas: [optics]
    difficulty: 3
    statement: |
      A ray of light passes through a medium of which the refractive index at any point is inversely proportional to the distance of that point from a certain plane. Prove that the path of the ray is a circular arc of which the centre is in the above-mentioned plane.
    hints:
      - 'Think of the medium as many thin layers parallel to the plane. Snell''s law says $\mu\cos\theta$ stays the same, where $\theta$ is the angle the ray makes with the layers.'
    solution: |
      Let $y$ be the distance from the plane, so $\mu = c/y$, and let $\theta$ be the angle between the ray and the plane (in the plane of the ray). The medium is layered parallel to the plane, so by Snell's law, layer after layer, $\mu\cos\theta$ is constant:
      $$\frac{\cos\theta}{y} = \text{constant}, \qquad\text{so}\qquad y = \rho\cos\theta$$
      for some constant $\rho$.

      **A circle does exactly this.** On a circle of radius $\rho$ with center in the plane ($y = 0$), the point at height $y$ has its radius at angle $\beta$ to the plane with $y = \rho\sin\beta$, and the tangent there is perpendicular to the radius, so it makes the angle $\theta = 90^\circ - \beta$ with the plane. Then $y = \rho\cos\theta$.

      The ray's direction is fixed by its height through $y = \rho\cos\theta$, and the circle through the starting point with center in the plane and the right direction obeys the same rule. So the ray follows that circle. (Such a medium is a model of the hyperbolic plane, the Poincaré half-plane, where these arcs play the part of straight lines.)
    checked: "script: traced a ray numerically; it stays on one circle centered on the plane"
    viz: tp-s-ray
    status: ready
  - id: 1860-bead
    year: 1860
    paper: "Problems, Thursday, January 5, 9 to 12"
    number: "16"
    src: sh1860
    page: "167"
    leaf: 178
    topic: 'Central forces: a bead pressing evenly on its wire'
    areas: [mechanics]
    difficulty: 3
    statement: |
      A small bead is projected with any velocity along a circular wire under the action of a force varying inversely as the fifth power of the distance from a centre of force situated in the circumference. Prove that the pressure on the wire is constant.
    note: '**Pressure** here is the push between bead and wire. The wire is smooth, and gravity is ignored.'
    hints:
      - 'If $O$ is the center of force and $C$ the center of the circle, triangle $OCP$ is isosceles. So $OP = 2a\cos\psi$, where $\psi$ is the angle at $P$.'
      - 'Use energy for the speed, and resolve the force towards $C$.'
    solution: |
      Let the circle have center $C$ and radius $a$, the center of force $O$ be on the circle, and the bead (mass $1$) be at $P$ with $OP = r$. The force is $\mu/r^5$ towards $O$.

      **Speed.** The potential energy is $-\dfrac{\mu}{4r^4}$, so energy conservation gives $v^2 = 2E + \dfrac{\mu}{2r^4}$ for a constant $E$.

      **Geometry.** $CO = CP = a$, so triangle $OCP$ is isosceles; with $\psi$ the angle $OPC$, we have $r = 2a\cos\psi$. The part of the force pointing towards $C$ is
      $$\frac{\mu}{r^5}\cos\psi = \frac{\mu}{r^5}\cdot\frac{r}{2a} = \frac{\mu}{2ar^4}.$$

      **The push of the wire.** Moving on a circle needs a total force $v^2/a$ towards the center. With $N$ the push of the wire towards $C$,
      $$N + \frac{\mu}{2ar^4} = \frac{v^2}{a} = \frac{2E}{a} + \frac{\mu}{2ar^4}, \qquad N = \frac{2E}{a},$$
      a constant. The pull of the force and the need for more speed cancel exactly.
    checked: "script: four positions on the circle give the same N"
    viz: tp-s-bead
    status: ready
