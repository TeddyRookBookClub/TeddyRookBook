  # ------------------------------------------------------------------ 1801-1820
  - id: 1801-ace
    year: 1801
    paper: "Morning Problems, Mr Hornbuckle (first and second classes)"
    number: "11"
    src: cp1821
    page: "2"
    leaf: 9
    topic: 'Probability: one die twice, or two dice once'
    areas: [probability]
    difficulty: 1
    statement: |
      Compare the chances of throwing an ace in two trials with one die, and in one trial with two.
    note: 'An **ace** is a one.'
    hints:
      - 'Find the chance of throwing *no* ace, then subtract from $1$.'
    answer: 'They are equal: each is $\tfrac{11}{36}$'
    solution: |
      In two throws of one die, the chance of no ace is $\tfrac56\cdot\tfrac56 = \tfrac{25}{36}$, so the chance of at least one ace is $\tfrac{11}{36}$.

      With two dice thrown once, each die is a one with chance $\tfrac16$, independently. The chance that neither is a one is again $\tfrac{25}{36}$, so the chance of an ace is again $\tfrac{11}{36}$.

      The chances are equal. That makes sense: throwing one die twice and throwing two dice once are the same experiment, just done at different times.
    checked: "script: exact fractions"
    status: ready
  - id: 1801-incline
    year: 1801
    paper: "Morning Problems, Mr Hornbuckle (first and second classes)"
    number: "9"
    src: cp1821
    page: "2"
    leaf: 9
    topic: 'Projectiles: the gentlest throw to the foot of a slope'
    areas: [mechanics]
    difficulty: 3
    statement: |
      A body is projected from the top of a given inclined plane. Required the direction of projection in which the least velocity will bring it to the bottom of the plane. Required also this velocity.
    hints:
      - 'The target is at distance $L$ (the length of the plane), at angle $\alpha$ below the horizontal. Write the speed needed for a launch angle $\phi$.'
      - 'Minimize $\cos\phi\,\sin(\phi + \alpha)$.'
    answer: 'Aim at $45^\circ - \tfrac12\alpha$ above the horizontal (halfway between the upward vertical and the plane); least speed $\sqrt{gL(1 - \sin\alpha)}$'
    solution: |
      Let the plane have length $L$ and inclination $\alpha$. From the top, the bottom is at horizontal distance $x = L\cos\alpha$ and depth $L\sin\alpha$.

      **Speed for a given angle.** Launch at speed $v$ and angle $\phi$ above the horizontal. The path is $y = x\tan\phi - \dfrac{gx^2}{2v^2\cos^2\phi}$, and it must pass through $y = -L\sin\alpha$ at $x = L\cos\alpha$. Solving for $v^2$:
      $$v^2 = \frac{gL\cos^2\alpha}{2\cos\phi\,(\cos\alpha\sin\phi + \sin\alpha\cos\phi)} = \frac{gL\cos^2\alpha}{2\cos\phi\sin(\phi + \alpha)}.$$

      **Make the denominator largest.** $2\cos\phi\sin(\phi+\alpha) = \sin(2\phi + \alpha) + \sin\alpha$, which is largest when $2\phi + \alpha = 90^\circ$, that is, $\phi = 45^\circ - \tfrac12\alpha$. Then
      $$v^2 = \frac{gL\cos^2\alpha}{1 + \sin\alpha} = gL(1 - \sin\alpha).$$
      The best direction bisects the angle between the upward vertical and the line from the top down to the bottom. (On level ground, $\alpha = 0$, this is the familiar $45^\circ$.)
    checked: "script: searched all launch angles numerically"
    viz: tp-s-incline
    status: ready
  - id: 1801-tower
    year: 1801
    paper: "Evening Problems, Mr Walker"
    number: "3"
    src: cp1821
    page: "7"
    leaf: 14
    topic: 'Projectiles: a tower found from a five-second flight'
    areas: [mechanics]
    difficulty: 1
    statement: |
      A body, projected from the top of a tower at an angle of $45^\circ$ above the horizontal direction, fell in $5''$ at a dist. from the bottom of the tower equal to its altitude: find that alt. in feet.
    note: '$5''''$ means five seconds. Feet and the old value $g \approx 32.2$ feet per second per second fit the problem.'
    hints:
      - 'At $45^\circ$ the horizontal and upward parts of the velocity are equal; call each $w$.'
    answer: '$h = \tfrac{25}{4}g \approx 201$ feet'
    solution: |
      Let the height be $h$ and let each component of the launch velocity be $w$ (they are equal at $45^\circ$). In $5$ seconds:

      - sideways: $5w = h$;
      - up and down: the body ends $h$ below where it started, so $-h = 5w - \tfrac12 g\cdot 25$.

      Substituting $5w = h$ gives $-h = h - \tfrac{25}{2}g$, so $h = \tfrac{25}{4}g$. With $g = 32.2$ ft/s², the tower is about $201$ feet high.
    checked: "arithmetic"
    status: ready
  - id: 1802-tower-range
    year: 1802
    paper: "Morning Problems, Mr Dealtry (first and second classes)"
    number: "7"
    src: cp1821
    page: "29"
    leaf: 36
    topic: 'Projectiles: the farthest throw from a tower'
    areas: [mechanics, calculus]
    difficulty: 3
    statement: |
      In what direction must a body be projected from the top of a given tower with a given velocity, so that it may fall upon the horizontal plane at the greatest distance possible from the bottom of the tower?
    hints:
      - 'Use energy: the body lands with speed $V = \sqrt{v^2 + 2gh}$.'
      - 'For the longest throw, the launch and landing directions are at right angles.'
    answer: '$\tan\theta = \dfrac{v}{\sqrt{v^2 + 2gh}}$; the greatest range is $\dfrac{v}{g}\sqrt{v^2 + 2gh}$'
    solution: |
      Let the tower have height $h$ and the speed be $v$. Launch at angle $\theta$; let $t$ be the time of flight and $R$ the range.

      **A vector picture.** The landing velocity is $\mathbf V = \mathbf v + \mathbf g t$, and $|\mathbf V|^2 = v^2 + 2gh$ by energy. The area of the triangle with sides $\mathbf v$ and $\mathbf g t$ (drawn from one point) is
      $$\tfrac12|\mathbf v \times \mathbf g t| = \tfrac12 g t\,v\cos\theta = \tfrac12 gR.$$
      The same triangle also has sides $\mathbf v$ and $\mathbf V$, so its area is $\tfrac12 vV\sin\gamma$, where $\gamma$ is the angle between launch and landing directions. So
      $$R = \frac{vV\sin\gamma}{g} \le \frac{vV}{g},$$
      with equality when the launch and landing directions are perpendicular.

      **The best angle.** Let the body land at angle $\theta'$ below the horizontal. Perpendicular launch and landing directions mean $\theta + \theta' = 90^\circ$. The horizontal part of the velocity never changes, so $v\cos\theta = V\cos\theta' = V\sin\theta$:
      $$\tan\theta = \frac vV = \frac{v}{\sqrt{v^2 + 2gh}}, \qquad R_{\max} = \frac{v}{g}\sqrt{v^2 + 2gh}.$$
      With $h = 0$ this gives $45^\circ$; from a tower the best angle is lower.
    checked: "script: searched all angles numerically"
    viz: tp-s-tower
    status: ready
  - id: 1806-pendulum
    year: 1806
    paper: "Second Evening, Mr J. Brown (first, second, third and fourth classes)"
    number: "1"
    src: cp1821
    page: "108"
    leaf: 115
    topic: 'Gravity: a pendulum clock on a mountain'
    areas: [mechanics]
    difficulty: 2
    statement: |
      A pendulum, which kept true time at the earth's surface, when carried to the top of a mountain lost $n$ seconds a day; What was the height of the mountain?
    hints:
      - 'The period of a pendulum is proportional to $1/\sqrt g$, and $g$ falls off as $1/(\text{distance from the Earth''s center})^2$.'
    answer: '$h = \dfrac{nR}{86400 - n} \approx \dfrac{nR}{86400}$, about $240n$ feet'
    solution: |
      Let $R$ be the Earth's radius and $h$ the height. Gravity at distance $d$ from the center is proportional to $1/d^2$, so $\sqrt g$ is proportional to $1/d$, and the period of the pendulum, proportional to $1/\sqrt g$, is proportional to $d$.

      So on the mountain each swing takes $\frac{R+h}{R}$ times as long, and in a true day the clock counts only $\frac{R}{R+h}$ of the $86400$ seconds. It loses
      $$n = 86400\cdot\frac{h}{R+h}, \qquad\text{so}\qquad h = \frac{nR}{86400 - n} \approx \frac{nR}{86400}.$$
      With $R \approx 3960$ miles (about $20.9$ million feet), each second lost per day means about $240$ feet of height. (This ignores the pull of the mountain itself, which makes the real loss a little smaller.)
    checked: "script: ticks counted per day for the computed height"
    status: ready
  - id: 1806-greatest-area
    year: 1806
    paper: "First Afternoon, Mr J. Brown (third, fourth, fifth and sixth classes)"
    number: "23"
    src: cp1821
    page: "99"
    leaf: 106
    topic: 'Projectiles: the arch that encloses the most area'
    areas: [mechanics, calculus]
    difficulty: 2
    statement: |
      At what angle must a body be projected with a given velocity, that the area of the parabola described may be a maximum?
    note: 'The area meant is the region between the path and the level ground.'
    hints:
      - 'The area under a parabolic arch is $\tfrac23\times$ base $\times$ height.'
    answer: '$60^\circ$'
    solution: |
      At speed $v$ and angle $\theta$, the range is $\dfrac{v^2\sin2\theta}{g}$ and the greatest height $\dfrac{v^2\sin^2\theta}{2g}$. The area under a parabolic arch is two-thirds of base times height, so
      $$A = \frac23\cdot\frac{v^2\sin2\theta}{g}\cdot\frac{v^2\sin^2\theta}{2g} = \frac{2v^4}{3g^2}\sin^3\theta\cos\theta.$$
      Differentiate $\sin^3\theta\cos\theta$: $3\sin^2\theta\cos^2\theta - \sin^4\theta = \sin^2\theta(3\cos^2\theta - \sin^2\theta)$. This is zero when $\tan^2\theta = 3$, so the area is greatest at $\theta = 60^\circ$ — steeper than the $45^\circ$ that gives the longest range.
    checked: "script: grid search over the angle"
    viz: tp-s-area
    status: ready
  - id: 1807-four-lives
    year: 1807
    paper: "First Morning, Mr D'Oyly, Monday, January 19, 1807"
    number: "11"
    src: cp1821
    page: "115"
    leaf: 122
    topic: 'Probability: two deaths among four people'
    areas: [probability]
    difficulty: 1
    statement: |
      There are $4$ individuals, of such an age, that, according to the tables of mortality, it is just an even chance whether each will be alive at the end of a year. What is the probability that two of them will die in that time?
    hints:
      - 'Each person is a fair coin. How many of the $16$ outcomes have exactly two deaths?'
    answer: '$\tfrac38$ for exactly two (and $\tfrac{11}{16}$ for at least two)'
    solution: |
      Each of the four lives or dies with chance $\tfrac12$, independently, so the $2^4 = 16$ patterns are equally likely. Exactly two deaths can happen in $\binom42 = 6$ ways, so the chance is $\tfrac{6}{16} = \tfrac38$.

      If "two of them will die" is read as "at least two," add the cases of three deaths ($4$ ways) and four deaths ($1$ way): $\tfrac{11}{16}$.
    checked: "script: exact fractions"
    status: ready
  - id: 1807-tower-horizontal
    year: 1807
    paper: "First Afternoon, Mr Woodhouse (third and fourth classes)"
    number: "17"
    src: cp1821
    page: "117–118"
    leaf: 124
    topic: 'Projectiles: thrown level from a tower'
    areas: [mechanics]
    difficulty: 1
    statement: |
      Let a body be projected from the top of a tower horizontally, with a velocity acquired in falling down a space equal to the height of the tower. At what distance from the base of the tower will it strike the horizon?
    note: '“The horizon” here means the level ground. “The velocity acquired in falling down a space $h$” is $\sqrt{2gh}$.'
    answer: 'Twice the height of the tower'
    solution: |
      Let the height be $h$. The speed is $\sqrt{2gh}$, and the time to fall $h$ is $\sqrt{2h/g}$. Moving sideways at constant speed for that time, the body travels
      $$\sqrt{2gh}\cdot\sqrt{\frac{2h}{g}} = 2h.$$
      It lands at twice the height of the tower from its base, whatever $g$ is.
    checked: "algebra"
    status: ready
  - id: 1807-atwood
    year: 1807
    paper: "Morning Problems, Mr D'Oyly (third, fourth, fifth and sixth classes)"
    number: "8"
    src: cp1821
    page: "126"
    leaf: 133
    topic: 'Pulleys: one ounce tips the balance'
    areas: [mechanics]
    difficulty: 2
    statement: |
      Two bodies, $P$ and $Q$, each $1$ lb. in weight, balance on a single pulley. An ounce weight is added to $P$. How long is it in descending through $12$ feet? and what velocity does it acquire?
    note: 'There are $16$ ounces in a pound. Take the pulley and string as light and smooth.'
    hints:
      - 'The pull of one ounce has to move all $33$ ounces.'
    answer: 'About $5$ seconds, reaching about $4.8$ feet per second'
    solution: |
      Count in ounces: the moving masses total $16 + 16 + 1 = 33$, and the unbalanced pull is the weight of $1$ ounce. So the acceleration is
      $$a = \frac{g}{33} \approx \frac{32.2}{33} \approx 0.976 \text{ ft/s}^2.$$
      To fall $12$ feet from rest takes $t = \sqrt{2\cdot 12/a} = \sqrt{792/g} \approx 4.96$ seconds, and the speed then is $at = \sqrt{2a\cdot12} \approx 4.84$ feet per second. This slow, measurable fall is the idea behind Atwood's machine, built to study gravity at a manageable speed.
    checked: "script: g = 32.2 ft/s²"
    viz: tp-s-atwood
    status: ready
  - id: 1808-pulley-axis
    year: 1808
    paper: "Evening Problems, Mr Woodhouse"
    number: "6"
    src: cp1821
    page: "140–141"
    leaf: 147
    topic: 'Pulleys: the load on the axle'
    areas: [mechanics]
    difficulty: 2
    statement: |
      If a power $P$ descending vertically by means of a string passing over a fixed pulley, elevates a weight $W$, what will be the pressure sustained by the axis of the pulley?
    note: 'A **power** is a weight used to drive a machine. Take the pulley and string as light and smooth.'
    hints:
      - 'Find the tension $T$ in the string first. The axle holds up $2T$, not $P + W$.'
    answer: '$\dfrac{4PW}{P + W}$, less than $P + W$'
    solution: |
      Let $T$ be the tension and $a$ the acceleration (masses $P/g$ and $W/g$). For each weight:
      $$\frac Pg a = P - T, \qquad \frac Wg a = T - W.$$
      Adding gives $a = g\dfrac{P - W}{P + W}$, and then $T = \dfrac{2PW}{P+W}$.

      Both strands pull down on the pulley with tension $T$, so the axle bears
      $$2T = \frac{4PW}{P + W}.$$
      This is less than $P + W$ unless $P = W$, since $(P + W)^2 - 4PW = (P - W)^2$. The weights are accelerating, so they do not lean their full weight on the axle.
    checked: "script: equations of motion for sample weights"
    status: ready
  - id: 1808-three-dice
    year: 1808
    paper: "Evening Problems, Mr Woodhouse"
    number: "10"
    src: cp1821
    page: "141"
    leaf: 148
    topic: 'Probability: ten against five with three dice'
    areas: [probability, combinatorics]
    difficulty: 1
    statement: |
      With three dice in one throw, compare the chance of throwing the number $10$ with the chance of throwing the number $5$.
    hints:
      - 'Count ordered throws. For a total of $5$, list them.'
    answer: '$27 : 6$, that is $9 : 2$'
    solution: |
      There are $6^3 = 216$ equally likely ordered throws.

      **Total 5.** The sets of numbers are $\{1,1,3\}$ and $\{1,2,2\}$, each in $3$ orders: $6$ throws.

      **Total 10.** The sets are $\{1,3,6\}$, $\{1,4,5\}$, $\{2,3,5\}$ ($6$ orders each), and $\{2,2,6\}$, $\{2,4,4\}$, $\{3,3,4\}$ ($3$ orders each): $18 + 9 = 27$ throws.

      So the chances are $\tfrac{27}{216}$ and $\tfrac{6}{216}$, in the ratio $27 : 6 = 9 : 2$.
    checked: "script: all 216 throws"
    status: ready
  - id: 1809-vessel
    year: 1809
    paper: "Tuesday Morning Problems, Mr Brown"
    number: "7"
    src: cp1821
    page: "166"
    leaf: 173
    topic: 'Calculus: the most economical open can'
    areas: [calculus]
    difficulty: 1
    statement: |
      Determine the ratio of the diameter and altitude of a cylindrical vessel open at the top, which shall contain a given quantity under the least possible internal superficies.
    note: '**Superficies** means surface area.'
    answer: 'Diameter : altitude $= 2 : 1$'
    solution: |
      Let the radius be $r$ and the height $h$, with fixed volume $V = \pi r^2h$. The inside surface (base and side, no lid) is
      $$S = \pi r^2 + 2\pi rh = \pi r^2 + \frac{2V}{r}.$$
      Then $\dfrac{dS}{dr} = 2\pi r - \dfrac{2V}{r^2}$, which is zero when $V = \pi r^3$, that is, $h = r$. Since $S$ grows without bound as $r \to 0$ and as $r \to \infty$, this is the least surface. The diameter is twice the height.
    checked: "script: numerical minimum of the surface"
    status: ready
  - id: 1811-cushions
    year: 1811
    paper: "Mr Jephson's paper (third and fourth classes)"
    number: "8"
    src: cp1821
    page: "202"
    leaf: 209
    topic: 'Billiards: a two-cushion shot into the corner'
    areas: [geometry, mechanics]
    difficulty: 2
    statement: |
      Two balls $A$ and $B$ are placed on a billiard-table; in what direction must $A$, which is perfectly elastic, be struck, that it may hit $B$ after impinging upon two adjacent sides of the table?
    note: 'For a perfectly elastic ball (and no spin), a bounce off a cushion is like a reflection in a mirror.'
    hints:
      - 'Reflect $B$ in one side, then reflect that image in the other side.'
      - 'Two reflections in perpendicular lines make a half-turn about the point where they meet.'
    answer: 'Aim at the point opposite $B$ through the corner, $2O - B$'
    solution: |
      **Unfolding.** Each bounce reverses the component of velocity across the cushion, which is exactly what a mirror does. So instead of bouncing, imagine the ball going straight on into a reflected copy of the table. A path $A \to$ first side $\to$ second side $\to B$ becomes a straight line from $A$ to the image of $B$ reflected in the second side and then in the first.

      **The corner.** The two sides are perpendicular and meet at a corner $O$. Reflecting in two perpendicular lines through $O$ is a half-turn about $O$: it sends $B$ to the point $B^*$ with $O$ the midpoint of $BB^*$.

      So strike $A$ straight towards $B^*$. (The order of the sides doesn't matter, and after both bounces the ball travels exactly opposite to its first direction.) This works when the straight line from $A$ to $B^*$ really crosses the two cushions near that corner.
    viz: tp-s-cushions
    checked: "script: traced a ball bouncing off two cushions; it hits B"
    status: ready
  - id: 1815-elliptic-table
    year: 1815
    paper: "Monday Afternoon, Mr Hustler (fifth and sixth classes)"
    number: "12"
    src: cp1821
    page: "294–295"
    leaf: 301
    topic: 'Billiards: an elliptic table struck from a focus'
    areas: [conics]
    difficulty: 2
    statement: |
      If a billiard-table be in the form of an ellipse, and a perfectly elastic ball be struck from either focus in any direction, it will return after two reflections from the curve to the same point.
    hints:
      - 'At any point of an ellipse, the lines to the two foci make equal angles with the tangent.'
    solution: |
      Let the foci be $S$ and $H$, and let $P$ be any point of the ellipse. The tangent at $P$ makes equal angles with $PS$ and $PH$. (One proof: for points $X$ on the tangent line, $SX + XH$ is least at $X = P$, since every other point of the line is outside the ellipse where this sum is bigger; and the shortest path from $S$ to a line and on to $H$ makes equal angles with the line.)

      A perfectly elastic ball bounces like light off a mirror, with equal angles to the tangent. So a ball struck from $S$ that hits the cushion at $P$ bounces off towards $H$. It passes through $H$, hits the cushion again at some point $Q$, and by the same property bounces back towards $S$. After two reflections it is back at its starting point.
    viz: tp-s-ellipse
    status: ready
