# Original Teddy Rook Book challenge problem (our own; not from any contest).
id: cm-near-twins
title: Two centers at the same height
tier: 1
order: 30
areas:
- geometry
problem: |
  A triangle has sides $13$, $14$ and $15$. Find the distance between its **incenter** (the center of the inscribed
  circle) and its **centroid** (where the three medians meet).
check:
  type: number
  answer: 1/3
answer: '$\tfrac13$'
hints:
- 'Put the side of length $14$ on the $x$-axis and find the third vertex. Its coordinates are whole numbers.'
- 'The incenter sits at height $r$ above that side, where $r$ is the inradius. Find $r$ from the area.'
- The centroid is the average of the three vertices. Compare the two heights.
solution: |
  Put $B=(0,0)$ and $C=(14,0)$. A third vertex $A=(5,12)$ gives $AB=\sqrt{25+144}=13$ and $AC=\sqrt{81+144}=15$.

  **Area and inradius.** The height is $12$, so the area is $\tfrac12\cdot14\cdot12=84$. The semiperimeter is
  $s=21$, and area $=rs$ gives $r=4$.

  **Incenter.** It lies at height $r=4$. Its foot on $BC$ is the point where the incircle touches $BC$, and the tangent
  length from $B$ is $s-AC=21-15=6$. So $I=(6,4)$.

  **Centroid.** $G=\big(\tfrac{0+14+5}{3},\tfrac{0+0+12}{3}\big)=\big(\tfrac{19}{3},4\big)$.

  Both points are at height $4$, so the distance is $\tfrac{19}{3}-6=\tfrac13$.

  The coincidence of heights is no accident: the centroid is at one third of the height $12$, and the inradius is
  $84/21=4$ as well.
