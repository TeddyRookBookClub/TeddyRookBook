# Original Teddy Rook Book challenge problem (our own; not from any contest).
id: cm-cubic-shuffle
title: A cubic that shuffles its roots
tier: 2
order: 70
areas:
- algebra
problem: |
  Let $a,b,c$ be the three roots of $x^3-3x+1=0$. Compute
  $$(a^2-2)(b^2-2)(c^2-2).$$
check:
  type: number
  answer: '-1'
answer: '$-1$'
hints:
- 'Try $x=2\cos\theta$. The identity $\cos3\theta=4\cos^3\theta-3\cos\theta$ is the key.'
- 'What is $(2\cos\theta)^2-2$?'
- 'Or, without trigonometry: $r^2-2=(r-\sqrt2)(r+\sqrt2)$, and a product over all roots is a value of the polynomial.'
solution: |
  **With angles.** Put $x=2\cos\theta$. Then $x^3-3x=8\cos^3\theta-6\cos\theta=2\cos3\theta$, so the equation says
  $\cos3\theta=-\tfrac12$. Three solutions with different cosines are $\theta=\tfrac{2\pi}9,\tfrac{4\pi}9,\tfrac{8\pi}9$, so
  $$\{a,b,c\}=\Big\{2\cos\tfrac{2\pi}9,\ 2\cos\tfrac{4\pi}9,\ 2\cos\tfrac{8\pi}9\Big\}.$$
  Now $(2\cos\theta)^2-2=2\cos2\theta$. Doubling the angles sends $\tfrac{2\pi}9\to\tfrac{4\pi}9\to\tfrac{8\pi}9\to\tfrac{16\pi}9$,
  and $\cos\tfrac{16\pi}9=\cos\tfrac{2\pi}9$. So the map $r\mapsto r^2-2$ **permutes the roots**, and
  $$(a^2-2)(b^2-2)(c^2-2)=abc=-1$$
  by Vieta's formulas.

  **With the polynomial.** Let $p(x)=x^3-3x+1=(x-a)(x-b)(x-c)$. Then
  $\prod(r-\sqrt2)=-p(\sqrt2)$ and $\prod(r+\sqrt2)=-p(-\sqrt2)$, so the product is
  $$p(\sqrt2)\,p(-\sqrt2)=(1-\sqrt2)(1+\sqrt2)=-1.$$
  The first method explains **why** the answer is so simple; the second checks it.
viz: cm-cubic-shuffle
checked: 'script: roots computed numerically, product -1 to 15 digits'
status: ready
