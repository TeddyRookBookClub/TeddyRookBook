# Original Teddy Rook Book challenge problem (our own; not from any contest).
id: cm-cube-trees
title: Spanning trees of a cube
tier: 3
order: 110
areas:
- combinatorics
- linear-algebra
problem: |
  The cube graph has the $8$ corners of a cube as vertices and its $12$ edges as edges. A **spanning tree** is a set of $7$
  edges that connects all $8$ corners without forming a loop. How many spanning trees does the cube graph have?
check:
  type: number
  answer: '384'
answer: '$384$'
hints:
- 'Kirchhoff''s matrix-tree theorem: the number of spanning trees is $\tfrac1n$ times the product of the nonzero eigenvalues of the Laplacian $L=\text{(degree)}I-A$.'
- 'Label the corners by $0/1$ vectors $x\in\{0,1\}^3$. The functions $x\mapsto(-1)^{s\cdot x}$ are eigenvectors of $A$.'
solution: |
  **The tool.** By Kirchhoff's **matrix-tree theorem** (1847), a connected graph on $n$ vertices has
  $\tfrac1n\lambda_2\cdots\lambda_n$ spanning trees, where $\lambda_2,\dots,\lambda_n$ are the nonzero eigenvalues of the
  Laplacian $L=\Delta-A$ (degree matrix minus adjacency matrix).

  **Eigenvalues.** Label corners by $x\in\{0,1\}^3$; two corners are joined when they differ in one coordinate. For each
  $s\in\{0,1\}^3$, the vector $v_s(x)=(-1)^{s\cdot x}$ satisfies
  $$(Av_s)(x)=\sum_{i=1}^3(-1)^{s\cdot(x+e_i)}=\Big(\sum_i(-1)^{s_i}\Big)v_s(x)=(3-2|s|)\,v_s(x),$$
  where $|s|$ is the number of ones in $s$. These $8$ vectors are independent, so the Laplacian $3I-A$ has eigenvalues
  $2|s|$: $0$ once, $2$ three times, $4$ three times, $6$ once.

  **Count.**
  $$\frac18\cdot2^3\cdot4^3\cdot6=\frac{3072}8=384.$$

  The picture draws random spanning trees of the cube, chosen fairly with Wilson's algorithm.
