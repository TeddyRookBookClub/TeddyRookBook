costs:
  - { tier: "Free", price: "$0", items: "A computer; browser circuit and microcontroller simulators; Python; ROS 2 with the Gazebo simulator on Linux; our Science Lab and Robotics Ladder pictures." }
  - { tier: "Budget", price: "about $120–$180", items: "A breadboard starter kit with an Arduino-compatible board or Raspberry Pi Pico; a basic multimeter; a two-wheel chassis kit with gear motors and encoders; a dual motor driver; two hobby servos; an IMU board; an ultrasonic sensor; AA battery holders." }
  - { tier: "Full", price: "about $350–$500", items: "The budget kit plus a Raspberry Pi computer with a camera; better encoder motors; a rechargeable lithium pack with its matching charger; a temperature-controlled soldering station with a fume extractor and safety glasses; an open-source robot arm kit (3D printing extra)." }
