homeschool:
  intro: "A school year is about 36 weeks. Two or three sessions a week, 45 to 90 minutes each, is plenty. Pick the band that fits your student; older students can start lower and move quickly."
  head: ["", "Ages 8–11", "Ages 12–14", "Ages 15–18"]
  rows:
    - ["Weeks 1–9", "Robotics for Kids: what robots are; sensors and motors; be-the-robot game", "Robotics for Kids, quickly; then a safe bench and Ohm's law", "Electronics and Microcontrollers"]
    - ["Weeks 10–18", "First circuits; paper circuit cards; block coding", "LED resistors, voltage dividers, analog readings, PWM", "Programming Robots, with Python and C"]
    - ["Weeks 19–27", "Cardboard arm and bristlebot; levers", "Programming Robots: tracing, decisions, state machines", "Mechanics and Motion; Feedback and Control"]
    - ["Weeks 28–36", "A first kit robot with block coding; a family robot show", "A line-following robot; start of Mechanics and Motion", "Sensing and Estimation; a capstone robot and portfolio"]
  notes:
    - "Pair it with math: the Math Ladder's trig and algebra topics for the older bands, and measurement and multiplication for the younger."
    - "Join a team if you can. FIRST lists FIRST LEGO League for grades K to 8, FIRST Tech Challenge for grades 7 to 12, and FIRST Robotics Competition for grades 9 to 12 (ages vary by region); homeschool students can join or form teams."
    - "A grown-up handles batteries, cutting and any soldering with younger students; see the safety notes in each course."
    - "Keep a robot notebook: sketches, programs, test logs and photos. It doubles as a portfolio and a record of the school year."
