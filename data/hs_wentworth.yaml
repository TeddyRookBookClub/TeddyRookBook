  steps:
  - - Warm up
    - 'Ask: What determines a plane? Name the five ways.'
  - - The new idea
    - '~ If a straight line is perpendicular to each of two other straight lines at their point of intersection, it is perpendicular to the plane of the two lines.

      ~ All the perpendiculars that can be drawn to a straight line at a given point lie in a plane which is perpendicular to the line at the given point.

      ~ Through a given point there can be one perpendicular to a given plane, and only one.

      § 512: the perpendicular is the shortest line from a point to a plane, and its length is the distance (§ 513).'
  - - Draw the figure
    - 'Stand a pencil upright on the table and lay two other pencils flat, crossing at its foot. Check with the corner of a card that the upright pencil makes right angles with both.

