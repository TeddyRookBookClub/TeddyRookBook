  - - The new idea
    - 'Read §§ 323–326. In a : b = c : d, a and d are the extremes, b and c the means.

      ~ In every proportion the product of the extremes is equal to the product of the means.

      ~ The mean proportional between two quantities is equal to the square root of their product.

      Props. III, IV and V: from ad = bc we may write a proportion; and a proportion can be rearranged by alternation (a : c = b : d) and by inversion (b : a = d : c).'
  - - Draw the figure
    - 'No figure today. Write a real proportion to test each theorem: 2 : 3 = 8 : 12. Check that 2 × 12 = 3 × 8, that 2 : 8 = 3 : 12, and that 3 : 2 = 12 : 8.'
  - - Walk through the proof
    - 'I: write the proportion as two equal fractions and clear of fractions.

      II: from a : b = b : c, the product of the extremes is b², so b = √(ac).

      III: divide both sides of ad = bc by bd.

      IV (alternation): multiply both sides of a/b = c/d by b/c.

      V (inversion): divide both sides of bc = ad by ac.'
