    - 'I: equal chords cut off equal arcs; each angle of the polygon stands on an arc made of the same number of these, so the angles are equal.

      II: pass a circle through three vertices; equal triangles show that it passes through the fourth, then the fifth, and so on. The sides are equal chords, so they are equally far from the centre, giving the inscribed circle.

