  - - Walk through the proof
    - 'XVIII and XIX: superposition, as for plane triangles; when the parts come in reverse order, use the symmetrical triangle.

      XX: equal sides mean equal face angles at the centre, so equal dihedral angles (§ 583), so equal angles.

      XXI: pass to the polar triangles: they are mutually equilateral, so mutually equiangular, so the original triangles are mutually equilateral (§ 793).

      XXII: ABD and ACD are mutually equilateral, so mutually equiangular.'
