  - - The new idea
    - '~ A conical surface is the surface generated by a moving straight line which constantly touches a fixed curve and passes through a fixed point not in the plane of the curve.

      ~ Every section of a cone made by a plane passing through its vertex is a triangle.

      ~ Every section of a circular cone made by a plane parallel to the base is a circle.

