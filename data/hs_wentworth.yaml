    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.

      Use the paper triangles to act out the "placing" in XX and XXI.'
  - - Exercises
    - '~ Ex. 7. If the equal sides of an isosceles triangle are produced, the angles on the other side of the base are equal.

      Hint: these angles are supplements of the equal base angles.'
  - - Wrap up
    - Read the note on the Principle of Duality (end of § 144). Ask your student to swap "sides" and "angles" in Prop. XX and see that it becomes Prop. XXI.
  tip: Paper cut-outs make the method of superposition concrete. Use them freely in this part of Book I.
  answers: 'Ex. 7: each angle beyond the base is the supplement of a base angle (§ 86); supplements of equal angles are equal (§ 85).'
