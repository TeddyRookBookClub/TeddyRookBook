  - - Walk through the proof
    - 'II: BC and BD are each perpendicular to AF at its middle point, so A and F are equally distant from C and from D (§ 160). Then triangles ACD and FCD are equal, which gives equal angles at C, then equal triangles ACE and FCE. So AE = FE, and BE (any other line through B) is also perpendicular to AF.

      III: if a perpendicular BE were outside the plane MN, the plane of AB and BE would contain two perpendiculars to AB at B, which is impossible (§ 83).

      IV: build the perpendicular by passing a plane through A perpendicular to a line of MN; then show any other line from A is oblique.'
