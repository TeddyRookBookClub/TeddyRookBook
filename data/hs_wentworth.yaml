  - - The new idea
    - '~ To draw a tangent to a parabola from an external point.

      ~ The line joining the focus to the intersection of two tangents makes equal angles with the focal radii drawn to the points of contact.

      ~ If two tangents RP and RQ are drawn from a point R to a parabola, the line drawn through R parallel to the axis bisects the chord of contact.

      § 889: the diameters of a parabola are parallel to its axis.'
  - - Draw the figure
