  - - The new idea
    - '~ If two sides of a triangle are unequal, the angles opposite are unequal, and the greater angle is opposite the greater side.

      ~ Reciprocally: If two angles of a triangle are unequal, the sides opposite are unequal, and the greater side is opposite the greater angle.

