book:
  id: planeandsolidge03wentgoog
  title: Wentworth's Plane and Solid Geometry
  year: 1899 (revised edition)
  key: wentworth
  short: Geometry
  eyebrow: Geometry · Wentworth · Plane and solid geometry
  hero: 'G. A. Wentworth''s geometry for students about 13 to 16: definitions and axioms, then theorems and problems with full proofs, and hundreds of original exercises. 148 guides cover all nine Books, plane (I–V) and solid (VI–IX), each a 30 to 45 minute session, with the right page of the book beside it.'
  how:
  - '<b>One session at a time.</b> Each guide is about 30 to 45 minutes: a few definitions, two to four propositions, or a set of exercises. Three or four sessions a week covers plane geometry in a school year.'
  - <b>Draw every figure.</b> Have a ruler, compasses and sharp pencil ready. The guides tell you exactly what to draw, and an accurate figure is half the proof.
  - <b>Say the proof back.</b> The author wanted students to prove propositions aloud, pointing to each line and angle. After you walk through a proof together, your student closes the book and gives it back.
  - '<b>Ask "Why?"</b> Every step of a proof has a reason: an axiom, a definition, or an earlier section (§). You do not need to know the answer; ask the question and look it up together.'
  - <b>Choose among the exercises.</b> The book has far more exercises than anyone works. The guides suggest a few each time; brief hints and answers are in each guide, but let your student try first.
  - <b>Review each Book.</b> At the end of a Book, go back over the propositions, drawing figures freehand and stating them aloud, as the author advises.
  lessonword: ''
  numnote: Each guide covers a few of the book's numbered sections (§) or propositions, shown beside the title. Proposition numbers start again at I in each Book.
  unitword: Book
units:
- id: 1
  name: Introduction
  from: 1
  to: 2
  text: Solids, surfaces, lines and points; axioms, theorems and the general axioms (§§ 1–35).
- id: 2
  name: 'Book I: Rectilinear Figures'
  from: 3
  to: 21
  text: Lines and angles, perpendiculars and parallels, triangles, loci, quadrilaterals, polygons and symmetry, with the methods of proof and the original exercises.
- id: 3
  name: 'Book II: The Circle'
  from: 22
  to: 39
  text: Arcs, chords and tangents, the theory of limits, the measure of angles, and the problems of construction.
- id: 4
  name: 'Book III: Proportion. Similar Polygons'
  from: 40
  to: 56
  text: The theory of proportion, similar triangles and polygons, the Pythagorean theorem and numerical properties of figures, with constructions and computations.
- id: 5
  name: 'Book IV: Areas of Polygons'
  from: 57
  to: 66
  text: Areas of rectangles, parallelograms, triangles and trapezoids, comparing areas, and constructing figures of given area.
- id: 6
  name: 'Book V: Regular Polygons and Circles'
  from: 67
  to: 79
  text: Regular polygons, the measurement of the circle and π, inscribed polygons, maxima and minima, and the miscellaneous exercises.
- id: 7
  name: 'Book VI: Lines and Planes in Space'
  from: 80
  to: 92
  text: Planes and their determination, perpendicular and parallel lines and planes, dihedral angles, projections and polyhedral angles, with the exercises (§§ 492–583).
- id: 8
  name: 'Book VII: Polyhedrons, Cylinders, and Cones'
  from: 93
  to: 117
  text: Prisms and parallelopipeds, pyramids and frustums, Euler's theorem, similar and regular polyhedrons, cylinders, cones and the prismatoid formula, with the problems of computation.
- id: 9
  name: 'Book VIII: The Sphere'
  from: 118
  to: 132
  text: Plane sections and tangent planes, spherical angles, polygons and polar triangles, the measurement of spherical surfaces and volumes, and the numerical and miscellaneous exercises.
- id: 10
  name: 'Book IX: Conic Sections'
  from: 133
  to: 148
  text: 'The parabola, the ellipse and the hyperbola: their construction, tangents and chief properties, and how each is cut from a cone; with a closing review of the table of formulas.'
lessons:
- num: 1
  roman: Introduction, §§ 1–17
  idx: 17
  unit: 1
  title: Solids, surfaces, lines and points
  mins: 30
  goal: Your student can explain what a geometric solid, surface, line and point are, and how many dimensions each has.
  materials:
  - The book, open to these pages
  - A box or block of wood
  - Pencil and a notebook
  book: The opening pages start from a cut block of wood and work down to surfaces, lines and points, then define Geometry, Plane Geometry and Solid Geometry.
  steps:
  - - Start with a real block
    - 'Hand your student a box, a book or a block of wood.

      Say: How many flat faces does it have? Where two faces meet, what do you see? Where three edges meet?

      Let them find the faces, edges and corners. The book does exactly this with a block of wood (Fig. 1).'
  - - Read the definitions together
    - 'Read §§ 1–8 aloud, taking turns. Stop after each and ask your student to say it in their own words.

      The key sentences:

      ~ A surface has only two dimensions, length and breadth.

      ~ A line has only one dimension, length.

      ~ A point has no dimension, but denotes position simply.'
  - - Ideal, not real
    - 'Read § 9. A pencil line has some width, but a geometric line has none. We draw lines only to help our thinking.

      Say: If a line has no width, can you ever really see one? (No; the drawing only stands for it.)'
  - - Motion makes figures
    - 'Read §§ 12–14. A moving point traces a line, a moving line sweeps out a surface, a moving surface sweeps out a solid.

      Demonstrate: drag a pencil point across paper (a line); slide a ruler flat across the table (a surface).'
  - - What geometry is
    - 'Read §§ 15–17 and copy the definition into the notebook:

      ~ Geometry is the science which treats of position, form, and magnitude.

      Ask: Is a drawing on this page plane or solid geometry? Is a cube?'
  - - Wrap up
    - Your student explains, without the book, the difference between a solid, a surface, a line and a point, and gives a real-life example of each.
  practice: Begin a geometry notebook with a page of definitions. Add to it every session.
  tip: 'The author says the first fourteen pages should simply be read in class with discussion. Keep it relaxed: talk, do not drill.'
- num: 2
  roman: Introduction, §§ 18–35
  idx: 20
  unit: 1
  title: Proofs, axioms, theorems and the general axioms
  mins: 35
  goal: Your student knows what an axiom, theorem, postulate, problem and corollary are, can state the converse of a theorem, and knows the nine general axioms.
  materials:
  - The book, open to these pages
  - Pencil and the geometry notebook
  book: Definitions of the general terms (proof, axiom, theorem, postulate, problem, corollary, scholium), the hypothesis and conclusion of a theorem, its contradictory, opposite and converse, then the nine General Axioms and the table of symbols.
  steps:
  - - Warm up
    - 'Ask: How many dimensions has a surface? a line? a point? What is geometry?'
  - - The words of geometry
    - 'Read §§ 18–26 together. The four most important:

      ~ An axiom is a statement admitted to be true without proof.

      ~ A theorem is a statement to be proved.

      ~ A postulate is a construction admitted to be possible.

      ~ A corollary is a truth that is easily deduced from known truths.'
  - - If ... then
    - 'Read §§ 28–31. A theorem has a hypothesis (what is assumed) and a conclusion (what follows).

      Use the book''s own example in § 32: "Every horse is a quadruped" is true, but its converse, "Every quadruped is a horse," is not.

      Say: Make up a true sentence whose converse is false. (If it is a dog, it has four legs.)'
  - - The general axioms
    - 'Read the nine axioms on page 6 aloud. Have your student explain each with numbers, for example axiom 2: if 5 = 5 and 3 = 3, then 5 + 3 = 5 + 3.

      ~ Magnitudes which are equal to the same magnitude, or equal magnitudes, are equal to each other.

      ~ The whole is greater than any of its parts.'
  - - Symbols
    - Look at the table of symbols in § 35 together. Your student copies the ones for angle, triangle, perpendicular, parallel, and "therefore" into the notebook. The proofs in the book use them constantly.
  - - Wrap up
    - 'Quick quiz: say a statement and ask, "Axiom or theorem?" Then ask for the converse of: If two angles are right angles, they are equal.'
  practice: Learn the nine general axioms well enough to give each one by number; the proofs cite them as "Ax. 3", "Ax. 7" and so on.
- num: 3
  roman: Book I, §§ 36–56
  idx: 23
  unit: 2
  title: Lines, planes and the straight line
  mins: 35
  goal: Your student can define straight, curved and broken lines, a plane, and equal and equivalent figures, and knows the postulates and axioms of the straight line.
  materials: &id002
  - The book, open to these pages
  - A ruler (straightedge) and a pair of compasses
  - Sharp pencil, eraser and plain paper (or a geometry notebook)
  book: The first definitions of Book I (straight, curved and broken lines, plane surfaces, rectilinear figures, similar, equivalent and equal figures), then the postulates and axioms of the straight line and the idea of a segment.
  steps:
  - - Warm up
    - 'Ask: What is the difference between an axiom and a postulate? What is the converse of a theorem?'
  - - Kinds of lines
    - 'Read §§ 36–38. Have your student draw a straight line, a curved line and a broken line, and label them.

      ~ A straight line is often called simply a line.'
  - - Planes and figures
    - 'Read §§ 39–43. The words similar, equivalent and equal are used all through the book. Draw two squares of different sizes (similar), a 2 × 8 rectangle and a 4 × 4 square (equivalent: same area), and two copies of one triangle (equal).'
  - - Postulates and axioms of the line
    - 'Read §§ 44–49 together:

      ~ A straight line can be drawn from one point to another.

      ~ A straight line can be produced indefinitely.

      ~ A straight line is the shortest line that can be drawn from one point to another.

      Ask: Why can two straight lines cross in only one point? (§ 48: if they had two points in common they would be the same line.)'
  - - Segments
    - Read §§ 50–56. Draw a line, mark A, C and B on it, and show that AB = AC + CB. Mark off equal steps with the compasses to show a line "multiplied" by a number.
  - - Wrap up
    - Your student gives the definitions of a straight line and a plane in their own words, then adds them to the notebook.
- num: 4
  roman: Book I, §§ 57–80
  idx: 25
  unit: 2
  title: Angles and how they are measured
  mins: 40
  goal: Your student can name and draw right, straight, acute, obtuse, reflex, vertical, complementary and supplementary angles, and knows that a right angle is 90°.
  materials: &id001
  - The book, open to these pages
  - A ruler (straightedge) and a pair of compasses
  - Sharp pencil, eraser and plain paper (or a geometry notebook)
  - A protractor
  book: The plane angle and how angles are named, the postulate of superposition, adjacent, right, straight, acute, obtuse and reflex angles, the angle as a rotation, the perigon, vertical, complementary and supplementary angles, and the degree.
  steps:
  - - Warm up
    - 'Ask: State the axiom about the shortest line between two points.'
  - - What an angle is
    - 'Read §§ 57–58.

      ~ The size of an angle depends upon the extent of opening of its sides, and not upon the length of its sides.

      Draw two angles of the same opening, one with long sides and one with short. Which is bigger? (Neither.)'
  - - Equal by fitting
    - Read §§ 59–60. Two figures are equal if one can be placed on the other so they coincide. Trace an angle on thin paper and lay it on another to test them. This idea runs through the early proofs.
  - - Kinds of angles
    - 'Read §§ 61–71. Your student draws and labels: adjacent angles, a right angle, a straight angle, an acute, an obtuse and a reflex angle.'
  - - Turning makes angles
    - 'Read §§ 72–78. Hold a pencil at a point and turn it: a quarter turn makes a right angle (90°), a half turn a straight angle (180°), a full turn a perigon (360°).

      Then read the definitions of vertical, complementary and supplementary angles.'
  - - Quick practice
    - 'With the protractor: draw an angle of 35°. What is its complement? (55°.) Its supplement? (145°.) Draw two crossing lines and mark the two pairs of vertical angles.'
  - - Wrap up
    - Your student defines complementary and supplementary angles from memory and gives one example of each.
- num: 5
  roman: Book I, Props. I–IV
  idx: 31
  unit: 2
  title: Straight angles, supplements and vertical angles
  mins: 40
  goal: Your student can prove that all straight angles are equal, that adjacent angles with exterior sides in a line are supplementary (and the converse), and that vertical angles are equal.
  materials: *id001
  book: Propositions I to IV (§§ 81–94) with their corollaries, the first proofs in the book, then Exercises 1–3 on complements and supplements.
  steps:
  - - Warm up
    - 'Ask: What is a straight angle? What are supplementary angles? How many degrees in a right angle?'
  - - The new idea
    - 'These are the first real proofs. Each one is short. The statements:

      ~ All straight angles are equal.

      ~ If two adjacent angles have their exterior sides in a straight line, these angles are supplementary.

      ~ Conversely: If two adjacent angles are supplementary, their exterior sides are in the same straight line.

      ~ If one straight line intersects another straight line, the vertical angles are equal.'
  - - Draw the figure
    - 'For Prop. II: draw a long line AB, mark O on it, and draw a slanting line OD up from O. That makes the adjacent angles AOD and BOD.

      For Prop. IV: draw two lines crossing at C. Label one line OP and the other AB, so the vertical angles are OCB and ACP.'
  - - Walk through the proof
    - 'Prop. I: lay one straight angle on the other with vertex on vertex and one side on a side; the other sides must fall together, because two straight lines with two common points coincide.

      Prop. II: the two angles together make the straight angle AOB, so their sum is a straight angle: they are supplementary.

      Prop. III (converse): suppose another line CF were in line with AC; then two angles would have the same supplement, so they are equal and the lines coincide.

      Prop. IV: angles OCB and ACP each have angle OCA as a supplement (Prop. II), and supplements of the same angle are equal (§ 85).'
  - - Your student proves it back
    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.

      For today, the most important one to say back is Prop. IV (vertical angles).'
  - - Exercises
    - 'Try Exercises 1–3 on page 18. For example:

      ~ Ex. 1. Find the complement and the supplement of an angle of 49°.

      ~ Ex. 3. Find the number of degrees in an angle if it is double its supplement; if it is one third of its supplement.

      For Ex. 2 and 3, call the angle x and write an equation.'
  - - Wrap up
    - 'Ask: Why are vertical angles equal? Your student should answer with the reason, not just "they look equal."'
  tip: The author suggests writing proofs at first "in his own language", step under step, with a neat figure. Keep that format from the start.
  answers: 'Ex. 1: complement 41°, supplement 131°. Ex. 2: 60° (x = 2(90 − x)); 18° (x = (90 − x)/4). Ex. 3: 120° (x = 2(180 − x)); 45° (x = (180 − x)/3).'
- num: 6
  roman: Book I, Props. V–VII
  idx: 35
  unit: 2
  title: 'Perpendiculars: equal obliques and the shortest line'
  mins: 35
  goal: Your student can prove that equal obliques cut off equal segments, that only one perpendicular can be drawn from an outside point, and that the perpendicular is the shortest line to a line.
  materials: *id001
  book: Propositions V, VI and VII (§§ 95–99), with Exercise 4 about the angle between clock hands.
  steps:
  - - Warm up
    - 'Ask: State Prop. IV and its reason. What is a perpendicular?'
  - - The new idea
    - 'Three facts about a perpendicular to a line:

      ~ Only one perpendicular can be drawn to a given line from a given external point.

      ~ The perpendicular is the shortest line that can be drawn to a straight line from an external point.

      Prop. V (§ 95) says that two lines from a point in the perpendicular, cutting off equal segments from its foot, are equal and make equal angles with the perpendicular.'
  - - Draw the figure
    - 'Draw a horizontal line AB. Mark P well above it and drop a perpendicular PC (use the corner of a set square or book). Draw another line PD from P to AB.

      For Prop. VII, extend PC below AB to P'', making CP'' = PC, and join DP''.'
  - - Walk through the proof
    - 'Prop. V: fold the figure over the perpendicular. One side falls on the other, the equal segments match, so the two slanting lines coincide.

      Prop. VI: extend PC to P'' with CP'' = PC. PCP'' is a straight line, so PDP'' is not. Angle PDC is half of angle PDP'', which is not a straight angle, so PDC is not a right angle.

      Prop. VII: PD = DP'' (Prop. V). PC + CP'' is a straight line, so it is shorter than PD + DP''. Halve both: PC < PD.'
  - - Your student proves it back
    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.'
  - - Exercises
    - 'Ex. 4 on page 19:

      ~ Ex. 4. Find the number of degrees in the angle included by the hands of a clock at 1 o''clock. 3 o''clock. 5 o''clock. 6 o''clock.

      Hint: the hour marks are 360° ÷ 12 = 30° apart.'
  - - Wrap up
    - Your student explains why a ladder leaning against a wall is longer than the height it reaches.
  answers: 'Ex. 4: 30°, 90°, 150°, 180°.'
- num: 7
  roman: Book I, Props. VIII–IX
  idx: 38
  unit: 2
  title: 'Lines drawn to a line: which is longer?'
  mins: 35
  goal: Your student can prove that the lines from a point to the ends of a segment are longer than lines from an inside point, and that the more remote oblique is the longer.
  materials: *id002
  book: Propositions VIII and IX (§§ 100–102) with the corollary that only two equal lines can be drawn from a point to a straight line.
  steps:
  - - Warm up
    - 'Ask: Prove that the perpendicular is the shortest line from a point to a line.'
  - - The new idea
    - '~ The sum of two lines drawn from a point to the extremities of a straight line is greater than the sum of two other lines similarly drawn, but included by them.

      ~ Of two straight lines drawn from the same point in a perpendicular to a given line, cutting off unequal segments from the foot of the perpendicular, the more remote is the greater.

      Say: Prop. VIII is a "detour" theorem: a path that goes around is longer than one inside it.'
  - - Draw the figure
    - 'Prop. VIII: draw a segment AB and a point C above it; join CA and CB. Mark O inside the triangle and join OA and OB. Extend AO to meet CB at E.

      Prop. IX: draw a line AB, a perpendicular OC to it, and two lines OG and OE meeting AB, with CE longer than CG.'
  - - Walk through the proof
    - 'Prop. VIII: CA + CE > OA + OE, and BE + OE > OB (a straight line is shortest). Add the two inequalities, replace CE + BE by CB, and take OE from both sides.

      Prop. IX: mark CF = CG, so OF = OG. Extend OC to D with CD = OC and join ED and FD. Then OE = ED and OF = FD, and by Prop. VIII OE + ED > OF + FD. Halve both.'
  - - Your student proves it back
    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.'
  - - Wrap up
    - 'Read § 102 together: only two equal straight lines can be drawn from a point to a straight line. Ask why there can''t be three.'
- num: 8
  roman: Book I, Props. X–XIII
  idx: 40
  unit: 2
  title: Parallel lines and the transversal
  mins: 40
  goal: Your student can define parallel lines, name the angles made by a transversal, and prove that the alternate-interior angles of parallels are equal (and the converse).
  materials: *id001
  book: The definition of parallels, the parallel axiom, Propositions X–XIII (§§ 103–111), the names of the angles a transversal makes, and Exercise 5.
  steps:
  - - Warm up
    - 'Ask: State Prop. VI. Why can''t there be two perpendiculars from one point to a line?'
  - - The new idea
    - '~ Two straight lines in the same plane perpendicular to the same straight line are parallel.

      ~ If a straight line is perpendicular to one of two parallel lines, it is perpendicular to the other also.

      ~ If two parallel lines are cut by a transversal, the alternate-interior angles are equal.

      Prop. XIII is the converse: if the alternate-interior angles are equal, the lines are parallel.

      Also read the axiom in § 105: through a given point only one straight line can be drawn parallel to a given straight line.'
  - - Draw the figure
    - 'Draw two parallel lines (slide a set square along a ruler, or use the lines of ruled paper). Draw a slanting transversal across both.

      Number the eight angles as in the book''s figure for § 109, and have your student point out the interior, exterior, alternate-interior and exterior-interior angles.'
  - - Walk through the proof
    - 'Prop. X: if the two perpendiculars met, there would be two perpendiculars from one point to a line (impossible by Prop. VI).

      Prop. XI: draw MN through C perpendicular to HK. MN is parallel to AB (Prop. X), and only one parallel goes through C, so EF is MN.

      Prop. XII: through O, the midpoint of BC, draw a perpendicular to both lines. Turn the lower half-figure onto the upper one: the vertical angles at O match, C falls on B, and the perpendiculars coincide, so the two angles coincide.

      Prop. XIII: draw MN through H parallel to CD. Its alternate angle equals angle HKD, which also equals angle AHK, so AB and MN coincide.'
  - - Your student proves it back
    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.

      For today, the most important one is Prop. XII.'
  - - Exercises
    - '~ Ex. 5. Find the complement and the supplement of an angle that contains 37° 53'' 49".

      Remember: 90° = 89° 59'' 60".'
  - - Wrap up
    - 'Point to pairs of angles on your figure and ask: "Equal or supplementary?"'
  answers: 'Ex. 5: complement 52° 6'' 11"; supplement 142° 6'' 11".'
- num: 9
  roman: Book I, Props. XIV–XVII
  idx: 44
  unit: 2
  title: More angle pairs of parallels
  mins: 40
  goal: Your student can prove the theorems on exterior-interior angles and on interior angles on the same side, with their converses.
  materials: *id002
  book: Propositions XIV–XVII (§§ 112–116) and Exercise 6 (on page 27).
  steps:
  - - Warm up
    - 'Ask: State Prop. XII and draw its figure. What are exterior-interior angles?'
  - - The new idea
    - '~ If two parallel lines are cut by a transversal, the exterior-interior angles are equal.

      ~ If two parallel lines are cut by a transversal, the two interior angles on the same side of the transversal are supplementary.

      Props. XV and XVII are the converses: if those angles are equal (or supplementary), the lines are parallel.'
  - - Draw the figure
    - Draw two parallels AB and CD, and a transversal EF cutting them at H and K. Mark angle EHB and angle HKD with arcs.
  - - Walk through the proof
    - 'Prop. XIV: angle EHB equals angle AHK (vertical angles), and angle AHK equals angle HKD (alternate-interior). So angle EHB = angle HKD.

      Prop. XVI: angle EHB + angle BHK is a straight angle, and angle EHB equals angle HKD. Substitute.

      Props. XV and XVII: the book gives no separate proofs. Have your student prove them the same way as Prop. XIII: draw a parallel through H and show it coincides with AB.'
  - - Your student proves it back
    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.'
  - - Exercises
    - ~ Ex. 6. If the complement of an angle is one third of its supplement, how many degrees does the angle contain ?
  - - Wrap up
    - Your student sorts all the angle pairs at a transversal of parallels into "equal" and "supplementary".
  answers: 'Ex. 6: 45° (90 − x = (180 − x)/3).'
- num: 10
  roman: Book I, §§ 117–137 (Prop. XVIII)
  idx: 46
  unit: 2
  title: Triangles and the sum of their angles
  mins: 40
  goal: Your student can classify triangles by sides and by angles and prove that the angles of a triangle add to two right angles.
  materials:
  - The book, open to these pages
  - A ruler (straightedge) and a pair of compasses
  - Sharp pencil, eraser and plain paper (or a geometry notebook)
  - A protractor
  - Scissors and scrap paper
  book: Definitions of triangles (§§ 117–128), then Proposition XVIII (§ 129) with its eight corollaries.
  steps:
  - - Warm up
    - 'Ask: If two parallels are cut by a transversal, which angles are equal? Which are supplementary?'
  - - The new idea
    - 'First read §§ 117–128 and have your student sketch: scalene, isosceles, equilateral; right, obtuse, acute; and mark an exterior angle and an altitude.

      Then the great theorem:

      ~ The sum of the three angles of a triangle is equal to two right angles.'
  - - Draw the figure
    - Draw a large triangle ABC. Through C draw CE parallel to AB, and extend AC beyond C to F.
  - - Walk through the proof
    - 'The three angles at C on one side of the line AF (angle ECF, angle ECB and angle BCA) make two right angles (§ 89).

      Angle A equals angle ECF (exterior-interior angles of parallels), and angle B equals angle BCE (alternate-interior angles).

      Put A and B in place of those two angles: A + B + BCA = 2 right angles.'
  - - Your student proves it back
    - 'Close the book. Your student redraws the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("because the radii are equal", "by § 143"). Point to each line or angle as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.

      Then go through the corollaries §§ 130–137 aloud. Ask, for each, "Why does it follow?" § 137, the exterior angle, is used often later.'
  - - Exercises
    - 'Cut a paper triangle, tear off the three corners and lay them side by side: they make a straight line. That is a check, not a proof.'
  - - Wrap up
    - 'Ask: Can a triangle have two obtuse angles? Why not?'
- num: 11
  roman: Book I, Props. XIX–XXII
  idx: 49
  unit: 2
  title: Sides of a triangle, and two ways triangles are equal
  mins: 40
  goal: Your student can prove that two sides of a triangle exceed the third, the angle-side-angle and side-angle-side cases of equal triangles, and that base angles of an isosceles triangle are equal.
  materials:
  - The book, open to these pages
  - A ruler (straightedge) and a pair of compasses
  - Sharp pencil, eraser and plain paper (or a geometry notebook)
  - Scissors and scrap paper
  book: Propositions XIX–XXII (§§ 138–146) with corollaries, the note on the Principle of Duality, and Exercise 7.
  steps:
  - - Warm up
    - 'Ask: What is the sum of the angles of a triangle? What is an exterior angle equal to?'
  - - The new idea
    - '~ The sum of two sides of a triangle is greater than the third side, and their difference is less than the third side.

      ~ Two triangles are equal if two angles and the included side of the one are equal, respectively, to two angles and the included side of the other.

      ~ Two triangles are equal if two sides and the included angle of the one are equal, respectively, to two sides and the included angle of the other.

      ~ In an isosceles triangle the angles opposite the equal sides are equal.'
