      ~ The area of a spherical triangle, expressed in spherical degrees, is numerically equal to the spherical excess of the triangle.

      § 836: area of a spherical triangle = πR² × E ÷ 180.

      Prop. XXX: for a polygon of n sides with angle sum T, the area in spherical degrees is T − (n − 2) 180.'
