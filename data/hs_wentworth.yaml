  steps:
  - - Warm up
    - 'Ask: What are the ways to prove two plane triangles equal?'
  - - The new idea
    - '~ Two mutually equilateral triangles on the same sphere or equal spheres are mutually equiangular, and are equal or symmetrical.

      ~ Two mutually equiangular triangles on the same sphere or equal spheres are mutually equilateral, and are either equal or symmetrical.

      ~ In an isosceles spherical triangle, the angles opposite the equal sides are equal.

      Notice the surprise of Prop. XXI: on a sphere, triangles with equal angles must have equal sides. There are no similar spherical triangles of different sizes on the same sphere.'
