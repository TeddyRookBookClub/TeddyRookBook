    - '~ A plane perpendicular to a radius at its extremity is tangent to the sphere.

      ~ A sphere may be inscribed in any given tetrahedron.

      ~ A sphere may be circumscribed about any given tetrahedron.

      ~ The intersection of two spherical surfaces is the circumference of a circle whose plane is perpendicular to the line joining the centres of the surfaces and whose centre is in that line.'
