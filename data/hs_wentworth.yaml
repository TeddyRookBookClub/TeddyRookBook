  steps:
  - - Warm up
    - 'Ask: What is a frustum? What is the mean proportional between 4 and 9? (6.)'
  - - The new idea
    - '~ The frustum of a triangular pyramid is equivalent to the sum of three pyramids whose common altitude is the altitude of the frustum and whose bases are the lower base, the upper base, and the mean proportional between the two bases of the frustum.

      § 656: V = ⅓ H × (B + b + √(B × b)).

      Prop. XXI extends this to the frustum of any pyramid.'
  - - Draw the figure
    - Draw the triangular frustum ABC-DEF and the two planes AEC and EDC that cut it into three pyramids.
  - - Walk through the proof
    - 'XX: E-ABC has base B and altitude H; C-EDF has base b and altitude H. The middle pyramid E-ADC is compared with each: E-ABC : E-ADC = AB : DE, and E-ADC : E-DFC = AC : DF; these ratios are equal (§ 645). So E-ADC is the mean proportional between the other two, and its volume is ⅓ H √(B × b).

