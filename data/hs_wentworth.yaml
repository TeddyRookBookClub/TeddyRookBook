    - 'For Props. XX and XXI: cut out two equal paper triangles, ABC and DEF, with the matching parts marked.

      For Prop. XXII: draw an isosceles triangle ABC with AB = AC (two equal radii from A with the compasses), and draw AD bisecting the angle at A.'
  - - Walk through the proof
    - 'XIX: AB + BC > AC, because a straight line is the shortest path; take BC from both sides for the difference.

      XX: place AB on DE. The equal angles make AC fall along DF and BC along EF, so C lands on F (two lines meet in only one point).

      XXI: place AB on DE. The equal angle makes AC fall along DF, and since AC = DF, C lands on F.

      XXII: the bisector AD makes two triangles that are equal by Prop. XXI (two sides and the included angle), so angle B = angle C.'
