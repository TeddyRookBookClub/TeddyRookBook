    - 'V: RB = RF and PB = PF, so triangles RPB and RPF are equal and RP bisects angle BPF (§ 869).

      VI: triangles RPF and RBP are equal, as are RQF and RCQ; and RB = RC, so the angles work out equal.

      VII: R is equally far from B and C, so the line through R parallel to the axis bisects BC, and so bisects PQ.

      VIII: use VII twice with the tangent at S.'
