      XXIX: triangle ABC with each neighbor forms a lune of angle A, B or C. Using symmetrical triangles, the three lunes cover a hemisphere (360 spherical degrees) plus the triangle twice more. So 2(A + B + C) = 360 + 2 × triangle, and triangle = A + B + C − 180.

