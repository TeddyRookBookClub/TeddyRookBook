  steps:
  - - Warm up
    - 'Ask: What is the area of a circle? How is the ellipse related to its auxiliary circle?'
  - - The new idea
    - '~ The area of an ellipse is equal to πab.

      ~ The section of a right circular cone made by a plane that cuts all the elements of the surface of the cone is an ellipse.'
  - - Draw the figure
    - 'Shine a flashlight at a slant on the floor: the spot of light is an ellipse. Draw the side view for Prop. XXIV: the cone, the slanting plane, and two balls inside the cone touching the plane at F and F'' (one above, one below).'
  - - Walk through the proof
    - 'XXIII: inside both the ellipse and the circle draw thin rectangles on the same bases; each ellipse rectangle is b/a of the circle rectangle. Take the limit: ellipse = (b/a) × πa² = πab.

      XXIV: from any point P of the curve, PF equals the tangent PN to the upper sphere and PF'' equals the tangent PN'' to the lower sphere. NN'' is the same length on every element, so PF + PF'' is constant.'
