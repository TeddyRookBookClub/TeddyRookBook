  - - Walk through the proof
    - 'II: PM² = PF² − FM² = DM² − FM² = (DM − FM)(DM + FM) = 2AF × 2AM.

      III: for Q inside, QF < QP + PF = QP + PC = QC.

      IV: if X is any other point of PT, XF = XC > XE (the perpendicular), so X is outside (§ 866).'
