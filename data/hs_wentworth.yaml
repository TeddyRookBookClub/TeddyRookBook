      XXXVII: the parallel section cuts each plane through the axis in a line parallel to a radius, making similar triangles; so every radius of the section is the same fraction of the base radius.

      XXXVIII: exactly as for the cylinder, the cone is the limit of inscribed and circumscribed pyramids.'
