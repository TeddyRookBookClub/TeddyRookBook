  - - Walk through the proof
    - 'XXVI: triangle AEC is isosceles, so angle AEC = angle ACE. Angle AEC is an exterior angle of triangle EBC, so it is greater than B. And angle ACB is greater than its part ACE. So ACB > B.

      XXVII (indirect): AB is equal to AC, less than AC, or greater. Equal would make the angles equal; less would make C less than B. Both contradict the hypothesis, so AB > AC.

      XXVIII: the bisector makes EF = FC. Then AF + FC = AF + FE > AE.

      XXIX: indirect again, using XXI and XXVIII.'
