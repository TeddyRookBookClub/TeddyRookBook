  steps:
  - - Warm up
    - 'Ask: In plane geometry, how many straight lines can be drawn through two points? (One.) Today we leave the flat page and work in space.'
  - - The new idea
    - '~ A plane is a surface such that a straight line joining any two points in it lies wholly in the surface.

      ~ Three points not in a straight line determine a plane.

      ~ If two planes cut each other, their intersection is a straight line.

      The five corollaries (§§ 494–498): one line does not determine a plane; a line and a point outside it, three points, two intersecting lines, or two parallel lines each do.'
  - - Draw the figure
    - 'Hold a card on one pencil and let it spin: one line does not fix it. Add a second pencil crossing the first, and the card can no longer move.

      Then show why a three-legged stool never wobbles but a four-legged one can: three points determine a plane.

      The book draws a plane as a parallelogram, a flat sheet seen at a slant. Practice drawing two such planes cutting each other.'
  - - Walk through the proof
    - 'Prop. I: take two points A and B common to both planes. The line AB lies in both (§ 492). No point outside AB can be in both, for a line and a point outside it determine only one plane (§ 495). So the intersection is exactly the line AB.'
  - - Your student proves it back
    - 'Close the book. Your student sketches the figure from memory (a simple perspective drawing is fine), letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason ("by § 501", "by § 507"). Point to each line and plane as it is named.

