    - 'Close the book. Your student draws the curve and the figure from memory, letters it the same way, and gives the proof aloud: what is given, what is to be proved, then each step with its reason. Point to each line as it is named.

      If a step is missing, ask "How do we know that?" rather than supplying it.'
