  book: Propositions XVII–XIX (§§ 650–654).
  steps:
  - - Warm up
    - 'Ask: What is the volume of a prism?'
  - - The new idea
    - '~ Two triangular pyramids having equivalent bases and equal altitudes are equivalent.

      ~ The volume of a triangular pyramid is equal to one third of the product of its base by its altitude.

      ~ The volume of any pyramid is equal to one third the product of its base by its altitude.'
