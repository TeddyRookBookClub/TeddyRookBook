  - - The new idea
    - '~ The ordinate of any point of a parabola is the mean proportional between the latus rectum and the abscissa.

      ~ Every point within the parabola is nearer to the focus than to the directrix; and every point without the parabola is farther from the focus than from the directrix.

      Prop. IV and § 869: the bisector of the angle between PF and the perpendicular from P to the directrix is tangent to the curve at P.

      § 876: the subtangent is bisected by the vertex. § 877: the subnormal is equal to half the latus rectum.'
  - - Draw the figure
