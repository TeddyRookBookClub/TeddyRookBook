  book: 'The opening of Book VIII: definitions (§§ 737–742), Proposition I (§ 743) with its corollaries, great and small circles, axis and poles (§§ 747–756), and the distance between two points on a sphere (§ 757).'
  steps:
  - - Warm up
    - 'Ask: What is a circle? Now imagine the same idea in space.'
  - - The new idea
    - '~ A sphere is a solid bounded by a surface all points of which are equally distant from a point within called the centre.

      ~ Every section of a sphere made by a plane is a circle.

      ~ A great circle of a sphere is a section made by a plane which passes through the centre of the sphere.

      § 757: the distance between two points on the surface of a sphere is the arc of the great circle that joins them.'
  - - Draw the figure
    - 'Cut an orange (or imagine it): every flat cut gives a circle; the cut through the middle gives the largest.

      On a ball, put a rubber band around the middle (a great circle) and another nearer the top (a small circle). Mark the two poles of each.'
  - - Walk through the proof
    - 'I: drop OC perpendicular to the section, and join O to any two points A and B of its boundary. The right triangles OAC and OBC have OC common and OA = OB, so CA = CB. All points of the boundary are equally distant from C.

      § 745: circles made by planes equally distant from the centre are equal, since AC² = OA² − OC².'
