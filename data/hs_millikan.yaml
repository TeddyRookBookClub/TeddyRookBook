  book: The siphon and the intermittent siphon; air pumps and compression pumps; the lift pump and force pump; the Cartesian diver; balloons and parachutes;
    diving bells and diving suits; the air brake; the bellows; the gas meter. Fourteen problems follow.
  steps:
  - - Hook question
    - 'Say: How could you empty a fish tank without tipping it over or using a pump?'
  - - Read together
    - Read §§ 99–112. Your student can skim the machine descriptions (§§ 110–112) and study the diagrams of the pumps (Figs. 78–79) closely.
  - - 'Try it: a siphon'
    - 'Fill the tube completely with water by holding it under water in a full bucket, cap both ends with thumbs, and put one end in the full bucket and
      the other in an empty bucket below it. Let go: water flows uphill over the edge and down. Raise the lower bucket above the upper one and watch the
      flow reverse (§ 99). Don''t start the siphon by sucking with your mouth.'
  - - 'Try it: Cartesian diver'
    - 'Fill a plastic bottle to the brim. Put in a dropper with just enough water in it to barely float (or a ketchup packet). Cap the bottle. Squeeze:
      the diver sinks. Let go: it rises. Ask your student to explain using three ideas: Pascal''s law, Boyle''s law and Archimedes'' principle (§ 106).'
  - - Explain the pumps
    - A lift pump does not "suck" water up; it removes air so the atmosphere pushes the water up the pipe. That is why it can never lift water more than
      about 34 ft (§ 104). A force pump pushes water up from below. Have your student trace the valves in Fig. 79 stroke by stroke.
  - - Balloons and divers
    - 'Read § 107: a balloon rises if it weighs less than the air it pushes aside. Ask: why is a balloon only partly filled at the start? Read § 109 and
      discuss why divers'' ears hurt going down.

      Party balloons and blimps today use helium, which cannot burn; hydrogen catches fire easily.'
  - - Say it back
    - Your student explains how a siphon works, using the picture in Fig. 72.
  - - Problems
    - 'Work a selection of problems 1–14 on book pages 80–81: try 2, 4, 5, 8, 9, 12, 13 and 14.'
  practice: Use the siphon to change the water in a fish tank or water the garden from a rain barrel.
  tip: The Cartesian diver works best with the bottle filled right to the top.
  answers: 2. 1.5 atmospheres × 1033.6 g × 50 sq. cm, about 77,500 g (77.5 kg). 4. One half; 1/8 left after 3 strokes; 1/1024 after 10. 5. (3/4)⁵ ≈ 0.237
    of the air is left; the barometer reads about 18 cm. 6. No; each stroke removes only a fraction of what is left. 8. 10 atmospheres. 9. About 1114 kg
    (1,200,000 g of air minus 85,700 g of hydrogen). 10. Each balloon carried about 2312 lb. (20,000 ÷ 64 = 312 lb. of letters, plus 2000 lb.); with the
