book:
  id: firstcourseinphy00milluoft
  title: A First Course in Physics
  year: '1906'
  key: millikan
  short: A First Course in Physics
  eyebrow: Science · Physics · 1906
  hero: 'Robert A. Millikan and Henry G. Gale''s high-school physics course, for students about 14 and up: measurement, force and motion, fluids, heat,
    magnetism and electricity, sound, light, and the brand-new discoveries of the electron, X rays and radium. 72 guides cover all 22 chapters, each a 30
    to 45 minute session with the right page of the book beside it.'
  how:
  - <b>One session at a time.</b> Each guide covers a few of the book's numbered sections (§) and takes 30 to 45 minutes. Three or four sessions a week
    finishes the book in a school year.
  - '<b>Do it, then read it.</b> Nearly every guide has a hands-on activity with ordinary household things: ramps and marbles, a rubber-band spring balance,
    levers, a thermometer in ice water, bottles, mirrors, a magnifying glass, magnets and an AA-battery circuit. Let your student handle things before the
    formulas.'
  - '<b>Safety first.</b> The book describes classroom demonstrations with mercury, acids, high voltage, X rays and radium. The guides mark these "Watch
    only": describe them, or look up a video of a teacher doing them. For circuits use only AA or AAA batteries, never a wall outlet, and never look at
    the Sun, even through a lens.'
  - <b>Work the problems.</b> Most groups of sections end with Questions and Problems. The book prints no answers; the guides give answers worked out and
    checked with a calculator, using the book's own tables. Let your student try first, and expect small differences from rounding.
  - <b>Old units and new.</b> The book works in centimeters, grams and seconds (and feet and pounds). The guides add today's SI units (meters, kilograms,
    newtons, joules, pascals) where it helps.
  - <b>Physics in 1906.</b> The book was written just before the atomic nucleus, relativity and quantum physics. Short "What we know now" notes point out
    where science has moved on, which is a good lesson in itself.
  lessonword: ''
  numnote: Each guide covers a group of the book's numbered sections (§), shown beside the title. The sections are numbered straight through the book, from
    § 1 to § 614.
  unitword: Chapter
units:
- id: 1
  name: 'Chapter I: Measurement'
  from: 1
  to: 2
  text: Units of length, mass and time, the metric system, weighing, and density (§§ 1–19).
- id: 2
  name: 'Chapter II: Force and Motion'
  from: 3
  to: 6
  text: Measuring and adding forces, gravitation and balance, falling bodies, and Newton's three laws (§§ 20–56).
- id: 3
  name: 'Chapter III: Pressure in Liquids'
  from: 7
  to: 9
  text: Pressure under water, Pascal's law and the hydraulic press, and Archimedes' principle of floating (§§ 57–80).
- id: 4
  name: 'Chapter IV: Pressure in Air'
  from: 10
  to: 12
  text: The weight of air and the barometer, Boyle's law, and siphons, pumps, divers and balloons (§§ 81–112).
- id: 5
  name: 'Chapter V: Molecular Motions'
  from: 13
  to: 15
  text: The kinetic theory of gases, evaporation and saturated vapor, dew, fog and humidity (§§ 113–150).
- id: 6
  name: 'Chapter VI: Molecular Forces'
  from: 16
  to: 18
  text: Elasticity and Hooke's law, surface tension and capillarity, solutions, crystals and dissolved gases (§§ 151–176).
- id: 7
  name: 'Chapter VII: Thermometry; Expansion Coefficients'
  from: 19
  to: 21
  text: Thermometers and temperature scales, the gas laws, and the expansion of liquids and solids (§§ 177–201).
- id: 8
  name: 'Chapter VIII: Work and Mechanical Energy'
  from: 22
  to: 25
  text: Work, pulleys, levers and the principle of work in all machines, power and energy (§§ 202–226).
- id: 9
  name: 'Chapter IX: Work and Heat Energy'
  from: 26
  to: 29
  text: Friction and efficiency, Joule and the conservation of energy, specific heat, and heat engines (§§ 227–263).
- id: 10
  name: 'Chapter X: Change of State'
  from: 30
  to: 32
  text: Melting and freezing, boiling, freezing mixtures, distillation and refrigeration (§§ 264–290).
- id: 11
  name: 'Chapter XI: The Transference of Heat'
  from: 33
  to: 34
  text: Conduction, convection and radiation, and heating and ventilating a house (§§ 291–304).
- id: 12
  name: 'Chapter XII: Magnetism'
  from: 35
  to: 36
  text: Magnets, poles and fields, the theory of magnetism, and the earth as a magnet (§§ 305–321).
- id: 13
  name: 'Chapter XIII: Static Electricity'
  from: 37
  to: 39
  text: Charges, conductors and induction, lightning and screens, potential, condensers and electrical machines (§§ 322–350).
- id: 14
  name: 'Chapter XIV: Electricity in Motion'
  from: 40
  to: 43
  text: Currents and their magnetic effect, volts, ohms and Ohm's law, series and parallel circuits, and batteries (§§ 351–386).
- id: 15
  name: 'Chapter XV: Effects of Electrical Currents'
  from: 44
  to: 46
  text: Electrolysis and plating, electro-magnets, bells and telegraphs, and the heating effect and electric lights (§§ 387–411).
- id: 16
  name: 'Chapter XVI: Induced Currents'
  from: 47
  to: 50
  text: Faraday's induction, dynamos, motors, transformers, power lines and the telephone (§§ 412–443).
- id: 17
  name: 'Chapter XVII: Nature and Transmission of Sound'
  from: 51
  to: 54
  text: Sources and speed of sound, waves and pitch, echoes and resonance, beats and standing waves (§§ 444–470).
- id: 18
  name: 'Chapter XVIII: Properties of Musical Sounds'
  from: 55
  to: 57
  text: The musical scale, vibrating strings and overtones, and pipes and wind instruments (§§ 471–494).
- id: 19
  name: 'Chapter XIX: Nature and Propagation of Light'
  from: 58
  to: 61
  text: The speed of light, shadows, brightness, reflection and refraction, and the wave nature of light (§§ 495–527).
- id: 20
  name: 'Chapter XX: Formation of Images'
  from: 62
  to: 65
  text: Images in mirrors and lenses, the lens formula, and cameras, the eye, telescopes and microscopes (§§ 528–564).
- id: 21
  name: 'Chapter XXI: Color Phenomena'
  from: 66
  to: 68
  text: Color and wave length, mixing colors, dispersion and the rainbow, and spectra (§§ 565–586).
- id: 22
  name: 'Chapter XXII: Invisible Radiations'
  from: 69
  to: 72
