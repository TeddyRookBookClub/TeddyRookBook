  roman: Ch. VIII, §§ 219–226
  idx: 184
  unit: 8
  title: Power and energy
  mins: 45
  goal: Your student can define power and its units (horse power, watt, kilowatt), tell potential from kinetic energy, and calculate both.
  materials:
  - The book, open to these pages
  - A stopwatch and a flight of stairs
  - A bathroom scale
  - 'A pendulum: a string with a weight'
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Power as the rate of doing work; Watt's horse power and the watt and kilowatt; energy as the capacity for doing work; potential and kinetic energy;
    their changes back and forth in a pendulum; the general law of frictionless machines; P.E. = Mgh and K.E. = ½Mv². Seven problems follow.
  steps:
  - - Hook question
    - 'Say: You and a friend carry identical boxes up the same stairs. You run, they walk. Who did more work? Who used more power?'
  - - Read together
    - 'Read §§ 219–226. The definition:

      ~ The energy of a body is defined as its capacity for doing work.'
  - - 'Try it: your horse power'
    - Weigh your student (in pounds). Measure the height of a flight of stairs (count steps × step height, in feet). Time a fast but safe climb. Power =
      weight × height ÷ seconds, in foot pounds per second. Divide by 550 to get horse power, or multiply ft·lb/s by 1.356 for watts. The book says an ordinary
      man is about 1/7 H.P.
  - - 'Try it: energy in a pendulum'
    - 'Pull the pendulum to one side and let go. At the ends it stops (all potential energy); at the bottom it is fastest (all kinetic). Without friction
      it would rise to the same height on the other side (§ 224). Let your student hold the bob at their nose and let it go: it swings back and stops just
      short of their nose.'
  - - The formulas
    - Potential energy = weight × height (or Mgh in ergs). Kinetic energy = ½Mv² ergs. In SI units, PE = mgh joules and KE = ½mv² joules, with m in kilograms
      and v in meters per second. A watt is a joule per second; 746 watts is a horse power.
  - - Say it back
    - Your student explains the energy changes in a pile driver (problem 4).
  - - Problems
    - Work problems 1–7 on book page 166.
  practice: 'Look at the power ratings (watts) on a few appliances: a light bulb, a hair dryer, a microwave. Which uses energy fastest?'
  answers: 1. About 347 kg. m per second, about 3.4 kW or 4.6 H.P. 2. About 13,150 H.P. (1,000,000 kg. m per second ÷ 76.05). 3. About 0.67 H.P. (220 lb.
    raised 100 ft. per minute). 4. Work lifting it becomes potential energy, then kinetic energy as it falls, then heat as it drives the pile; 60,000 ft.
    lb. ÷ ⅓ ft. = 180,000 lb. average resistance. 5. About 6,800,000 H.P. (taking a ton as 2000 lb.). 6. About 408,000 g. cm. 7. About 5,040,000 kg. m (about
    4.9 × 10¹⁴ ergs).
- num: 26
  roman: Ch. IX, §§ 227–237
  idx: 190
  unit: 9
  title: Friction and efficiency
  mins: 45
  goal: Your student can state the laws of sliding friction, find a coefficient of friction, and calculate the efficiency of a machine.
  materials:
  - The book, open to these pages
  - A brick or a block of wood with a hook or string, and a rubber band or luggage scale to pull it
  - A few round pencils (rollers)
  - Sandpaper, a smooth board, and a towel (different surfaces)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Friction always wastes work; the laws of sliding friction; the coefficient of friction; rolling friction and ball bearings; fluid friction; internal
    friction; the definition of efficiency; the efficiencies of simple machines, water wheels and turbines. Two sets of problems follow.
  steps:
  - - Hook question
    - 'Say: Why is it harder to get a heavy box moving across the floor than to keep it moving?'
  - - Read together
    - 'Read §§ 227–237 (the water-wheel paragraphs, §§ 235–237, can be skimmed). The first law of friction:

      ~ The friction between two solid surfaces is greater at starting than after the motion has begun.'
  - - 'Try it: test the laws'
    - 'Pull the brick slowly across a table with the rubber band (or luggage scale) and measure the stretch: once to start it, once to keep it moving. Then
      test:

      • double the load (put a book on top): about double the pull;

      • turn the brick on its side: about the same pull (law 4);

      • different surfaces: towel, board, sandpaper;

      • set it on pencils as rollers: the pull drops a great deal (§ 230).'
  - - Explain the idea
    - Coefficient of friction = pulling force ÷ weight (§ 229). Efficiency = useful work out ÷ total work put in (§ 233). A lever is nearly 100% efficient;
      a jackscrew may be only about 25%, because most of the work goes into friction.
  - - Say it back
    - Your student explains why ball bearings make a bicycle wheel spin so easily.
  - - Problems
    - Work questions 1–6 on book page 170 and problems 1–5 on book page 174. For the water wheels, the work put in each second is the weight of water times
      the height it falls.
  practice: 'Notice friction helping and hindering this week: brakes, shoe soles, a sticking drawer, a sled.'
  answers: 'Page 170: 1. Starting friction is greater than moving friction, and the load''s inertia must be overcome. 2. Friction with the banks and bed
    slows the water there. 3. The same distance in all three cases, since friction does not depend on the area of contact. 4. 0.1. 5. 150 g. 6. Friction
    keeps the screw from running back down; but it wastes much of the work. Page 174: 1. About 67% (400 ft. lb. out for 600 ft. lb. in). 2. 6. 3. About
    21.5 cu. ft. per second (taking the fall as the 72.5-ft. diameter). 4. About 22,900 cu. ft. per minute. 5. About 0.53 cu. ft. per second.'
- num: 27
  roman: Ch. IX, §§ 238–248
  idx: 197
  unit: 9
  title: 'Heat from work: Joule and the conservation of energy'
  mins: 45
  goal: Your student can explain where wasted work goes, define the calorie, describe Joule's paddle-wheel experiment, and state the law of conservation
    of energy.
  materials:
  - The book, open to these pages
  - Hands to rub together
  - A bicycle pump
  - A thermometer and a jar of sand with a lid (shake it hard for several minutes)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Rubbing, drilling and hammering make things hot; Rumford's view that heat is molecular motion; the calorie; Joule's paddle-wheel experiment and
    others (about 427 gram meters of work per calorie); heating by compressing a gas and cooling by expansion; the conservation of energy; perpetual motion;
    chains of energy changes; the sun as the source of nearly all our energy. Six problems follow, with a portrait of Joule.
  steps:
  - - Hook question
    - 'Say: Rub your hands together hard for ten seconds. Where did the warmth come from?'
  - - Read together
    - 'Read §§ 238–248. The great law:

      ~ Energy may be transformed, but it can never be created or destroyed.'
  - - 'Try it: shake the sand'
    - 'Take the temperature of a jar of dry sand. Put on the lid and shake it hard for five minutes (take turns). Measure again: it is a little warmer.
      Your work went into faster-moving molecules, just as Joule''s falling weights warmed the water (§ 240).

      Pump up a bicycle tire and feel the pump barrel get warm (§ 242).'
  - - Explain the idea
    - 'A calorie is the heat that warms 1 gram of water 1° C. Joule found that the same amount of work, about 427 gram meters (about 4.19 joules), always
      makes one calorie, whether by friction, collision or squeezing a gas. So heat is a form of energy, and energy is never lost: wasted work becomes heat
      (§ 245). That is why no perpetual-motion machine can work (§ 246).'
  - - 'Watch only: the fire syringe'
    - 'Watch only: don''t try this at home. The fire syringe in § 242 uses carbon bisulphide, a poisonous and very flammable liquid. Describe what happens:
      squeezing air very suddenly heats it enough to light the vapor with a flash. Look up a video of a teacher''s "fire syringe" or "fire piston" demonstration
      instead.'
  - - What we know now
    - 'The food "Calorie" on labels is 1000 of the book''s calories (a kilocalorie). In SI units we measure heat in joules: 1 calorie = 4.184 joules. Today
      we also know a source of energy not traced to the sun: the energy stored in atomic nuclei, which powers the sun itself.'
  - - Say it back
    - Your student traces the energy in a waterfall from the sun to the electric streetcar, as the book does in §§ 247–248.
  - - Problems
    - Work problems 1–6 on book page 182. Use 427 gram meters of work per calorie.
  practice: 'Spot energy changes for a day: food to motion, electricity to light and heat, a ball rolling to a stop.'
  answers: '1. About 46,800 calories (20,000,000 gram meters ÷ 427). 2. Their great kinetic energy becomes heat when they strike. 3. About 0.11° C (each
    gram falls 48.8 m: 48.8 ÷ 427). 4. About 281,000 calories. 5. 2,500,000 g. cm; about 2,450,000,000 ergs; about 58.5 calories. 6. Friction with the air
    turns their kinetic energy into heat until they glow.'
- num: 28
  roman: Ch. IX, §§ 249–251
  idx: 207
  unit: 9
  title: Specific heat and the method of mixtures
  mins: 40
  goal: Your student can define specific heat, use "heat lost = heat gained" to find a final temperature or a specific heat, and explain why water warms
    and cools slowly.
  materials:
  - The book, open to these pages
  - Two insulated mugs or foam cups
  - A kitchen scale (grams) and a thermometer
  - Hot tap water and cold water
  - A handful of metal objects (steel washers, coins or a metal spoon)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Heating by work and by contact; specific heat defined; the experiment with hot lead, iron and aluminum dropped into water; the method of mixtures
    with a worked example; a table of specific heats. Ten problems follow.
  steps:
  - - Hook question
    - 'Say: On a sunny day at the beach, why is the sand too hot to walk on while the water is still cool?'
  - - Read together
    - 'Read §§ 249–251. The definition:

      ~ The number of calories taken up by one gram of a substance when its temperature rises through 1° C., or given up when it falls through 1° C., is
      called the specific heat of that substance.'
  - - 'Try it: mixing water'
    - 'Weigh 200 g of hot tap water into one cup and 100 g of cold water into the other. Take both temperatures. Pour together, stir and measure. Predict
      first with "heat lost = heat gained": 200 × (hot − x) = 100 × (x − cold). How close was the prediction? (An adult handles the hot water.)'
  - - 'Try it: metal versus water'
    - Warm the metal objects in hot tap water for a few minutes, weigh them, and drop them into 100 g of cold water. The water warms only a little, because
      metals have small specific heats (iron about 0.11, from the table on page 185).
  - - Explain the idea
    - 'Specific heat is how many calories one gram needs to warm 1°. Water''s is 1, larger than almost anything else (question 6). That is why oceans keep
      islands mild and why water is used to cool engines.

      In SI units, water''s specific heat is about 4.18 joules per gram per degree.'
  - - Say it back
    - Your student explains the method of mixtures in their own words, using the book's lead-shot example.
  - - Problems
    - Work problems 1–10 on book pages 185–186, using the table of specific heats.
  practice: Compare how fast a metal spoon and a wooden spoon in the same cup of hot tea warm up, and how long a pot of soup stays hot.
  answers: 1. About 0.034. 2. 4,500,000,000 ergs; about 107 calories, which warms 10 g of lead (specific heat 0.0315) about 340° C. 3. About 135 m (0.315
    calorie × 427 gram meters per gram). 4. About 56.7° C. 5. About 21.2° C. 6. Water warms and cools slowly, so the sea keeps the island from getting very
    hot or very cold. 7. 120 g. 8. The work of the blows turns to heat; the iron is heated less, since the hammer bounces back with much of its energy and
    iron's specific heat is greater. 9. About 11,900 calories per gram of the moon's mass; spread over twice that mass with specific heat 0.5, a rise of
    about 11,900° C. 10. About 1774° C.
