  roman: Ch. VI, §§ 151–159
  idx: 128
  unit: 6
  title: 'Molecular forces in solids: elasticity and Hooke''s law'
  mins: 40
  goal: Your student can explain tensile strength and elasticity, discover Hooke's law with a rubber band or spring, and define hardness, brittleness, ductility
    and malleability.
  materials:
  - The book, open to these pages
  - A rubber band or a spring (a pen spring or toy Slinky)
  - A paper cup with a string handle and a bag of identical coins or washers
  - A ruler, tape
  - Graph paper
  - A notebook and pencil
  book: How strongly solids hold together (a steel rod 1 cm across holds several tons); breaking weights of wires; elasticity and the elastic constant;
    the limit of perfect elasticity; Hooke's law; why solids neither collapse nor fly apart; cohesion and adhesion; hardness, brittleness, ductility and
    malleability. Five problems follow.
  steps:
  - - Hook question
    - 'Say: Why does a spring come back to its shape, but a paper clip you bend stays bent?'
  - - Read together
    - 'Read §§ 151–159. Hooke''s law in the book''s words:

      ~ Within the limits of perfect elasticity elastic deformations of any sort, be they twists or bends or stretches, are directly proportional to the
      forces producing them.'
  - - 'Try it: discover Hooke''s law'
    - Hang the cup from the rubber band or spring and tape a ruler beside it. Add coins five at a time and write down the stretch each time. Plot coins
      (across) against stretch (up) on graph paper. While the band is not over-stretched, the points fall on a straight line. That is Hooke's law.
  - - Find the elastic limit
    - 'Unbend a paper clip a little and let go: it springs back. Bend it a lot: it stays bent. It has passed its limit of perfect elasticity (§ 155).'
  - - Explain the idea
    - 'Molecules in a solid pull on each other (cohesion) but also jiggle, which pushes them apart. A solid''s size is a balance between the two (§ 157).
      Glue sticking to wood is adhesion: unlike molecules attracting.

      Note the book''s careful meaning of "elastic": steel is more elastic than rubber, because it takes a much larger force to stretch it the same amount.'
  - - Test the properties
    - Use a scratch test on a few safe objects (a coin, a nail, glass, a fingernail) to rank hardness. Talk about which metals are ductile (copper wire)
      and malleable (aluminum foil).
  - - Say it back
    - Your student explains the difference between cohesion and adhesion with two examples of each.
  - - Problems
    - 'Work problems 1–5 on book page 113. Remember: strength and stiffness grow with the cross-section area, which grows with the square of the diameter.'
  practice: Weigh things this week with your rubber-band balance after marking it with known weights.
  answers: 'Using the book''s table (copper 51 kg, iron 77 kg per sq. mm): 1. About 1.23 mm (the area must be 77/51 times as large). 2. √5 ≈ 2.24 times.
    3. 12 kg, reading the problem as 1 kg stretching the first wire 1 mm (4 times the area, 3 times the stretch). 4. 0.875 mm (7 kg ÷ 4 × 0.5 mm). 5. Yes,
    because by Hooke''s law the stretch is proportional to the load.'
- num: 17
  roman: Ch. VI, §§ 160–167
  idx: 134
  unit: 6
  title: 'Molecular forces in liquids: surface tension and capillarity'
  mins: 40
  goal: Your student can explain why liquids pull into drops, why soap films shrink, why water rises in thin tubes and paper towels, and how a needle can
    float.
  materials:
  - The book, open to these pages
  - A bowl of water, a needle or paper clip, a small piece of tissue paper
  - Dish soap and a pipe cleaner or wire loop with a loop of thread
  - A paper towel strip and a glass of colored water
  - Two clean glass plates or two clear plastic rulers (optional)
  - A notebook and pencil
  book: Water clings to a glass plate; why a free liquid forms a sphere (oil in alcohol-and-water); soap films shrinking; liquids rising (water) or falling
    (mercury) in capillary tubes, and why; capillarity in wicks, towels, sugar and blotting paper; a needle floating on water. Six questions follow.
  steps:
  - - Hook question
    - 'Say: How can a water strider walk on a pond without sinking?'
  - - Read together
    - 'Read §§ 160–167. Why drops are round:

      ~ Now the geometrical figure which has the smallest area for a given volume is a sphere.'
  - - 'Try it: float a needle'
    - 'Lay a small square of tissue on the water and gently set a needle or paper clip on it. The tissue soaks and sinks, leaving the needle floating. Look
      closely for the little dent in the surface around it (§ 167). Now touch the water with a soapy finger: the needle sinks.'
  - - 'Try it: soap films'
    - Tie a loose loop of thread across a wire loop, dip it in soapy water, and pop the film inside the thread loop with a dry pencil point. The thread
      snaps into a perfect circle (§ 162, Fig. 110).
  - - 'Try it: capillary rise'
    - 'Dip the end of a paper-towel strip in colored water and watch the color climb. If you have two glass plates, hold them together with a matchstick
      between them at one edge and stand them in colored water: the water climbs highest where the gap is narrowest (§ 163).'
  - - Explain the idea
    - Water molecules pull on each other, so the surface acts like a stretched skin. Where water touches glass, the glass pulls it up the wall (adhesion
      stronger than cohesion), so the water rises in a narrow tube. Mercury does not wet glass, so it is pushed down (described in the book; we don't use
      mercury at home).
  - - Say it back
    - Your student explains why water rises higher in a thinner tube.
  - - Questions
    - Work questions 1–6 on book page 121.
  practice: Watch drips from a faucet, raindrops on a waxed car, and water climbing a sugar cube dipped in coffee or tea.
  answers: 1. Blotting paper is full of tiny open channels (capillary tubes); glazed paper has its pores filled. 2. 320 cm (ten times as high in a tube
    one tenth as wide). 3. The melted grease rises into the fine pores of the blotting paper. 4. The water pulls itself into drops, the shape with the least
    surface. 5. When soft, the glass's surface pulls it into the shape with least surface, rounding the corners. 6. The pressure forces the particles so
    close together that cohesion holds them.
