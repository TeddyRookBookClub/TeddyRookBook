  unit: 9
  title: 'Heat engines: steam, gas and turbines'
  mins: 45
  goal: Your student can explain how a steam engine, a four-stroke gas engine and a steam turbine turn heat into work, and why no heat engine is very efficient.
  materials:
  - The book, open to these pages
  - A pinwheel (to show the turbine idea by blowing on it)
  - Paper and pencil to draw the four strokes
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Watt's steam engine and its valve; condensing and noncondensing engines; the eccentric, boiler, draft, governor and reversing gear; compound engines;
    the efficiency of steam engines; the four-stroke gas engine; the steam turbine. Seven problems follow.
  steps:
  - - Hook question
    - 'Say: A car engine burns gasoline. Where does most of that energy end up? (Mostly as heat out of the exhaust and radiator.)'
  - - Read together
    - 'Read §§ 252–263, studying Figs. 188 and 194 closely. The book''s point about efficiency:

      ~ it is only a comparatively small fraction of the heat developed by combustion which can be transformed into work.'
  - - Trace the steam engine
    - 'With Fig. 188 open, have your student trace the steam: boiler, pipe, valve chest, one side of the piston, then out to the exhaust, while the sliding
      valve switches sides. Ask what the heavy fly wheel is for.'
  - - Draw the four strokes
    - 'Draw four boxes for Fig. 194: 1, draw in the fuel and air; 2, squeeze it; 3, the spark fires and pushes the piston (the only power stroke); 4, push
      out the burned gases. Most car engines today still work this way.'
  - - 'Try it: a turbine'
    - 'Blow on a pinwheel: steam turbines (§ 263) work the same way, with jets of steam on rows of blades. Most electricity today is still made by turbines
      turned by steam, water or wind.'
  - - What we know now
    - 'Engines are much better now: large modern power plants turn about 40–60% of their fuel''s heat into electricity, and car engines about 30–40%. But
      no heat engine can ever reach 100%, exactly as § 260 explains: some heat must always be thrown away.'
  - - Say it back
    - Your student explains why the gas engine needs a heavy fly wheel.
  - - Problems
    - Work problems 1–7 on book page 195. Use 427 gram meters per calorie and 76.05 kilogram meters per second for one horse power (550 ft. lb. per second
      in English units).
  practice: With an adult, open the hood of a car and find the engine, radiator and exhaust. Where does the waste heat go?
  answers: 1. 1500 kg. m (150,000 kg. cm) of work; about 3510 calories. 2. About 935 kg per hour. 3. About 335 kg. 4. About 274,000 kg (about 274 metric
    tons). 5. About 40,000 kg (40 metric tons) per hour. 6. About 374 H.P. for a metric ton of coal (about 340 H.P. for a ton of 2000 lb.). 7. 15,000 lb.
- num: 30
  roman: Ch. X, §§ 264–274
  idx: 221
  unit: 10
  title: 'Melting and freezing: the heat of fusion'
  mins: 45
  goal: Your student can explain why melting ice stays at 0° C, use the heat of fusion of ice (80 calories per gram) in mixing problems, and explain why
    water's expansion on freezing matters so much.
  materials:
  - The book, open to these pages
  - Ice cubes, a kitchen scale (grams), a thermometer and an insulated cup
  - Warm tap water
  - A plastic bottle filled to the top with water and capped loosely (for the freezer)
  - Two ice cubes
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The thermometer stays at 0° C while snow melts; the heat of fusion of ice (about 80 calories per gram), measured by mixing ice and warm water; freezing
    gives out heat; latent heat; fixed melting points of crystals and a table of them; glass and wax soften instead; water expands on freezing; pressure
    lowers the melting point of ice, and regelation (a wire cutting through ice). Seven problems follow.
  steps:
  - - Hook question
    - 'Say: If you heat a pot of ice slowly, the thermometer stops at 0° C until all the ice is gone. Where is the heat going?'
  - - Read together
    - 'Read §§ 264–274. The definition:

      ~ The number of calories of heat energy required to melt one gram of any substance without producing any change in its temperature is called the heat
      of fusion of that substance.'
  - - 'Try it: measure the heat of fusion'
    - 'Weigh about 200 g of warm water (near 40° C) in an insulated cup and record the temperature. Dry an ice cube with a paper towel, weigh it, drop it
      in and stir until it melts; record the final temperature.

      Work it like § 265: heat lost by the warm water = ice mass × x + ice mass × final temperature. Solve for x. You should get somewhere near 80.'
  - - Explain the idea
    - Melting does not speed up the molecules; it pulls them apart, so the temperature stays put. The same 80 calories come back out when the water freezes
      (§ 266). In SI units the heat of fusion of ice is about 334 joules per gram.
  - - 'Try it: ice that sticks'
    - 'Press two ice cubes firmly together for half a minute, under water if you like: they freeze together (§ 273). Pressure melts a thin film where they
      touch; when you let go, it freezes again. This is regelation.'
  - - Water expands when it freezes
    - Leave the full, loosely capped plastic bottle in the freezer overnight (plastic only, never glass). It bulges. The book points out that if ice sank
      instead of floating, lakes would freeze solid from the bottom up (§ 272).
  - - Say it back
    - Your student explains why ice at 0° C cools a drink much better than the same weight of water at 0° C (question 1).
  - - Problems
    - Work problems 1–7 on book page 202. Use 80 calories to melt a gram of ice and 427 gram meters of work per calorie.
  practice: Watch an ice cube melt in a glass of water with a thermometer in it. The water stays near 0° C until the ice is gone.
  answers: 1. The ice, because each gram must take in 80 calories to melt before it begins to warm. 2. 80° C. 3. About 66.7 g. 4. About 34,000 m (80 calories
    × 427 gram meters per gram). 5. Ice would sink as fast as it formed, and lakes and rivers would freeze solid from the bottom. 6. Pressing melting snow
    melts it a little at the points of contact, and it refreezes when released (regelation); very cold snow does not melt under the pressure of your hands.
    7. 20° C.
- num: 31
  roman: Ch. X, §§ 275–280
  idx: 228
  unit: 10
  title: Boiling and the heat of vaporization
  mins: 40
  goal: Your student can use the heat of vaporization of water (about 536 calories per gram), define the boiling point by vapor pressure, and explain why
    water boils at a lower temperature on a mountain.
  materials:
  - The book, open to these pages
  - A pot, water, a stove and a thermometer that reads to 100° C (adult supervision)
  - A clock
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Heat of vaporization; heat given out when steam condenses; measuring it by passing steam into cold water (about 536 calories per gram); the boiling
    point defined as the temperature at which vapor pressure equals the outside pressure; boiling points lower at high altitude and higher under pressure;
    evaporation compared with boiling. Fourteen problems follow.
  steps:
  - - Hook question
    - 'Say: A burn from steam is much worse than a burn from boiling water. Why, if both are at 100° C?'
  - - Read together
    - 'Read §§ 275–280. The exact definition of boiling:

      ~ The boiling point of a liquid is therefore defined as that temperature at which the pressure of the saturated vapor of the liquid is equal to the
      pressure acting upon the surface of the liquid.'
  - - 'Try it: heat a pot (with an adult)'
    - 'Put a measured amount of water on the stove and record the temperature each minute until it boils, then for five more minutes. It climbs steadily,
      then stops near 100° C (a little lower if you live high up) no matter how hard it boils. Note how long it took to heat from cold to boiling, and how
      much longer it would take to boil away; the book says about five times as long (§ 275). Safety: an adult handles the pot and keeps faces away from
      the steam.'
  - - Explain the idea
    - 'Turning water to steam pulls the molecules far apart: about 536 calories per gram (in SI units, about 2260 joules per gram). Steam gives all that
      back when it condenses on your skin, which is why steam burns are so bad (question 6).

      A bubble can only form when the vapor pressure inside it equals the air pressure outside. On a mountain the air pressure is lower, so water boils
      below 100° C (Quito about 90°, Mont Blanc about 84°). In a pressure cooker it boils hotter.'
  - - 'Watch only: boiling with cold water'
    - 'Watch only: don''t try this at home. The experiment in Fig. 199 stoppers a flask of boiling water and turns it over, and a sealed, cooling flask
      can crack or burst. Describe what happens: pouring cold water on the flask lowers the pressure inside and the water boils again without any flame.
      Look up a video of a teacher''s "boiling water with ice" demonstration.'
  - - Say it back
    - Your student explains the difference between evaporation and boiling (§ 280).
  - - Problems
    - 'Work a selection of problems 1–14 on book pages 206–207: try 2, 3, 4, 6, 8, 12, 13 and 14.'
  practice: Look up the altitude of your town and work out the boiling point there using the book's rule of about 1° C per 960 ft.
  tip: The "about five times as long" in § 275 comes from 536 calories to boil a gram away compared with 100 to heat it from 0° to 100°.
  answers: 1. The steam gives up its heat of vaporization as it condenses into water. 2. 10,720 calories (using 536). 3. 12,320 calories; it would warm
    1232 g of water from 10° to 20° C. 4. About 15.5° C. 5. They are bubbles of dissolved air driven out as the water warms; boiling bubbles are steam and
    form throughout at the boiling point. 6. Each gram of steam gives up about 536 extra calories as it condenses on the skin. 7. The pressure on them grows
    less as they rise, and more water evaporates into them. 8. Each gram of snow needs 80 calories to melt, which the air supplies only slowly. 9. Condensing
    dew gives out heat. 10. No; the pressure of the vapor keeps rising with the temperature. 11. Steam bubbles form at the hot bottom and collapse in the
    cooler water above, making the noise. 12. It will be raised. 13. About 94.8° C. 14. About 2400 ft.
- num: 32
  roman: Ch. X, §§ 281–290
  idx: 232
  unit: 10
  title: Freezing mixtures, distillation, and refrigeration
  mins: 45
  goal: Your student can explain why salt melts ice and makes a freezing mixture, how distillation purifies water, what a critical temperature is, and how
    an ice plant or refrigerator moves heat.
  materials:
  - The book, open to these pages
  - Ice, salt, two zip-top bags (one small, one large), milk or juice, sugar and vanilla (for ice cream in a bag)
  - A thermometer
  - Gloves or a towel (the bag gets very cold)
  - A notebook and pencil
  book: Cooling by dissolving salt; the freezing point of salt water; freezing mixtures of ice and salt; intense cold from evaporating carbon dioxide; distillation
    and fractional distillation; critical temperatures and a table of them; the liquid-air machine; ice plants and cold storage using ammonia. Ten questions
    follow.
  steps:
  - - Hook question
    - 'Say: Why do people put salt on icy sidewalks, and how does that make ice cream freeze in an old-fashioned churn?'
  - - Read together
    - 'Read §§ 281–290. Why salt and ice get so cold:

      ~ The efficiency of a mixture of salt and ice in producing cold is therefore due simply to the fact that the freezing point of a salt solution is
      lower than that of pure water.'
  - - 'Try it: ice cream in a bag'
    - 'Put a cup of milk, a tablespoon of sugar and a little vanilla in the small bag and seal it. Fill the large bag halfway with ice, add about a third
      as much salt (the book''s three parts ice to one of salt, § 283), and put the small bag inside. Shake for 5–10 minutes wearing gloves. Put a thermometer
      in the ice-salt mix: it falls well below 0° C.'
  - - Explain the idea
    - 'Salt water freezes at a lower temperature than pure water. When ice sits in salt water it keeps melting, and each gram of melting ice takes 80 calories
      from its surroundings, so the mixture gets colder and colder (§ 283).

      Distillation (§ 285): boil water, and the steam leaves the salt behind; cool the steam and you get pure water.'
  - - Refrigerators
    - 'Trace Fig. 203: a pump squeezes a gas until it turns to liquid (giving off heat outside), then lets it evaporate in the cold coils (taking heat in).
      Your kitchen refrigerator does exactly this; feel the warm coils at its back or bottom.

      What we know now: home refrigerators no longer use ammonia; they use other refrigerant gases chosen to be safer and kinder to the ozone layer.'
  - - 'Watch only: dry ice and liquid gases'
    - 'Watch only: don''t try this at home. The carbon dioxide snow, ether, frozen mercury and liquid air of §§ 284–288 are dangerous: extreme cold burns
      skin, and gases can build up pressure. Look up a video of a teacher demonstrating liquid nitrogen instead.'
  - - Say it back
    - Your student explains why the ocean freezes less easily than a lake (question 10).
  - - Questions
    - Work questions 1–10 on book page 215.
  practice: Leave a saucer of salt water in a sunny window and see the salt left behind as the water evaporates.
  answers: 1. By distilling it. 2. The salt dissolves into the ice, lowering its melting point so it melts. 3. It makes the remaining solution more concentrated.
    4. No; as ice freezes out, the rest becomes saltier and its freezing point falls, until it is saturated (about −22° C). 5. Air was above its critical
    temperature (−140° C), so no pressure could liquefy it. 6. It is boiling at its boiling point; to warm it, put it under pressure; to cool it, pump away
    the vapor above it. 7. Greater, since water's great specific heat and heats of melting and boiling even out the temperature. 8. The pressure in the
    boiler is higher than one atmosphere. 9. Both have vapor pressure at any temperature, so both evaporate together. 10. Salt water freezes at a lower
    temperature, and the sea is deep and kept stirred by currents.
- num: 33
  roman: Ch. XI, §§ 291–298
  idx: 241
  unit: 11
  title: 'Heat on the move: conduction and convection'
  mins: 40
  goal: Your student can tell good conductors from poor ones, explain why metal feels colder than wood at the same temperature, and explain convection currents,
    winds and sea breezes.
  materials:
  - The book, open to these pages
  - A metal spoon, a wooden spoon and a plastic spoon, and a mug of hot tap water
  - A metal tray and a wooden board or carpet (to touch)
  - Food coloring, a clear glass of cold water and a small jar of hot tap water
  - A notebook and pencil
  book: Metals conduct heat much better than wood or glass; a table of conductivities; water and air are poor conductors; conduction as molecule passing
    motion to molecule; why metal feels colder; air in fur, feathers and snow; the Davy safety lamp; convection currents in water; winds, land and sea breezes,
    and ocean currents. Six questions follow.
  steps:
  - - Hook question
    - 'Say: On a cold morning, why does a metal doorknob feel colder than a wooden door, when both are the same temperature?'
  - - Read together
    - 'Read §§ 291–298. The book''s explanation:

      ~ In general, the better a conductor the hotter it will feel to a hand colder than itself, and the colder to a hand hotter than itself.'
  - - 'Try it: spoon race'
    - 'Stand the three spoons in the mug of hot tap water. After a minute, feel the handles. The metal one is warm; wood and plastic stay cool. Then touch
      the metal tray and the wooden board: same room temperature, different feel.'
  - - 'Try it: watch convection'
    - 'Put a few drops of food coloring in the small jar of hot water, cover the top with your thumb (or plastic wrap), lower it gently into a big glass
      or bowl of cold water and uncover it. A colored plume rises to the top: hot water is lighter and rises (§ 297).'
  - - Explain the idea
    - Conduction passes heat from molecule to molecule (§ 293). Convection carries heat by moving whole currents of liquid or gas. Air is a very poor conductor,
      so things full of trapped air (fur, feathers, wool, fresh snow, foam cups) keep heat in (§ 295). Sea breezes come from the land heating faster than
      the water (§ 298).
  - - 'Watch only: gauze, flames and burning ether'
    - 'Watch only: don''t try this at home. The Davy-lamp gauze over an open gas jet (§ 296) and the burning ether on water (§ 292) need a lab. Describe
      what happens: the flame will not pass through the wire gauze, because the gauze carries the heat away.'
  - - Say it back
    - Your student explains why a wool sweater keeps you warm even though it makes no heat itself (question 6).
  - - Questions
    - Work questions 1–6 on book page 219.
  practice: 'Notice convection this week: shimmering air above a hot road, a radiator warming a room, smoke rising.'
  answers: '1. Flannel is a poor conductor: in summer it keeps the outside heat away; in winter it keeps the body''s heat in. 2. The metal carries the heat
    away from the paper so fast that it cannot reach its burning point; wood does not. 3. The metal pan conducts heat into the hand much faster than the
    bread. 4. Iron draws heat from the moist skin so quickly that the moisture freezes; wood conducts too slowly. 5. Paper is a poor conductor and keeps
    the earth''s heat around the plants. 6. No; it keeps the body''s own heat from escaping.'
- num: 34
  roman: Ch. XI, §§ 299–304
  idx: 246
  unit: 11
  title: Radiation, and heating and ventilating a house
  mins: 40
  goal: Your student can explain radiation as the third way heat travels and how it differs from conduction and convection, and explain how stoves, furnaces
    and hot-water systems heat and ventilate a house.
  materials:
  - The book, open to these pages
  - A sunny window or a lamp, and a piece of cardboard to block it
  - Two identical jars of water, one wrapped in black paper and one in white or foil, and a thermometer
  - A candle, a tall glass jar and a saucer of water (with an adult)
  - A notebook and pencil
  book: Heat from a fire or the sun that is neither conducted nor convected; radiation travels at the speed of light, in straight lines, and through air
    without heating it; the principle of ventilation (a candle under a lamp chimney); fresh air needed in houses; hot-air, hot-water and indirect heating.
    Eight questions follow.
  steps:
  - - Hook question
    - 'Say: The sun is 93 million miles away across empty space. How does its heat reach us?'
  - - Read together
    - 'Read §§ 299–304. The three differences in § 300: radiation is as fast as light, it goes in straight lines, and it can pass through something without
      heating it.'
  - - 'Try it: block the radiation'
    - 'Sit in the sun (or near a lamp) and feel the warmth on your face. Hold up the cardboard: the warmth stops at once, even though the air is the same.
      That is radiation traveling in straight lines.'
  - - 'Try it: black and white jars'
    - Set the black-wrapped and white-wrapped jars of water in the sun for an hour and take their temperatures. Dark surfaces take in more radiation. (Chapter
      XXII returns to this.)
  - - 'Try it: candle and chimney (with an adult)'
    - 'Stand a lit candle in a saucer of water and lower the tall jar over it so the rim sits in the water: the flame dims and dies as the oxygen is used
      up (§ 301). Lift the rim slightly and it brightens. Safety: an adult lights the candle and handles the jar; keep hair and sleeves back.'
  - - Heating a house
    - 'Trace the arrows in Figs. 211 and 213. Hot air or hot water rises from the furnace, gives up its heat in the rooms, and the cooler air or water sinks
      back. Ask: where does fresh air come in?

      What we know now: today radiation from the sun and fire is understood as electromagnetic waves (infrared light), which Chapter XXII introduces.'
  - - Say it back
    - Your student names the three ways heat travels and gives a household example of each.
  - - Questions
    - Work questions 1–8 on book page 226.
  practice: Find where the heat in your home comes from (furnace, radiators, heat pump, stove) and trace how it reaches each room.
  answers: '1. Sawdust stops the air from circulating, so there is no convection. 2. Hot water rises out of the top of the boiler and the cooled water returns
    to the bottom. 3. Radiation. 4. Direct radiation: chiefly radiation and convection from the radiators in the rooms; indirect: convection of air warmed
    by the coils. 5. Breath warmer than the hands warms them; fanning in summer speeds evaporation from the skin. 6. Thick glass heats unevenly, since glass
    conducts poorly; the inside expands before the outside and it cracks. 7. Into the cold room: warm air flows out at the top and cold air in at the bottom.
    8. Packed tightly it holds less trapped air, and air is the poorest conductor.'
- num: 35
  roman: Ch. XII, §§ 305–314
  idx: 252
  unit: 12
  title: Magnets, poles and lines of force
  mins: 40
  goal: Your student can state the law of magnetic poles, explain induced magnetism, and map a magnet's field with a compass and iron filings.
  materials:
  - The book, open to these pages
  - Two bar magnets (or strong fridge magnets) and a compass
  - Iron filings in a sealed clear plastic bag or jar, or a few paper clips and small iron nails
  - A sheet of paper or thin cardboard
  - A sewing needle, a slice of cork and a bowl of water
  - A notebook and pencil
  book: Lodestones and the first compasses; poles of a magnet; like poles repel and unlike attract, with force falling off as the square of the distance;
    the unit magnet pole; magnetic materials; induced magnetism in soft iron; permeability and retentivity; lines of force traced by a floating magnetized
    needle; fields of force shown with iron filings; field strength as lines per square centimeter.
  steps:
  - - Hook question
    - 'Say: A compass needle swings to point north. What is pulling it?'
  - - Read together
    - 'Read §§ 305–314. The law of magnets:

      ~ Like poles repel each other, unlike poles attract.'
  - - 'Try it: poles and the law'
    - 'Hang one bar magnet from a thread (or lay it on a floating dish) and let it settle north–south. Mark its north end. Bring the second magnet''s ends
      close to each end in turn: like ends push away, unlike ends pull together.'
  - - 'Try it: a chain of nails'
    - 'Hang a nail from one end of a magnet, then a second nail from the first, and a third (Fig. 219). Pull the magnet away carefully: the chain falls
      apart. The nails were magnets only while the magnet was near: induced magnetism (§ 310).'
  - - 'Try it: map the field'
    - 'Lay the paper over a magnet and sprinkle iron filings from the sealed bag (or tap a bag of filings flat over it) to see the pattern of Fig. 223.
      Or move the compass around the magnet and draw an arrow where it points at each spot. Join the arrows into curved lines from N to S: lines of force.'
  - - Explain the idea
    - 'Soft iron becomes a magnet easily but loses it easily (high permeability); hard steel is hard to magnetize but keeps it (high retentivity) (§ 311).
      Field strength is shown by how closely the lines crowd together.

      What we know now: the strongest modern magnets are made of special alloys such as neodymium-iron-boron, far stronger than the steel magnets of 1906.
      Today field strength is measured in teslas.'
  - - 'Try it: a floating needle'
    - 'Stroke a sewing needle 30 times in one direction with one end of a magnet, push it through a thin slice of cork and float it in the bowl. It turns
      to point north–south: you have made a compass (and it moves along the lines of force when a magnet is held below the bowl, Fig. 222).'
  - - Say it back
    - Your student explains why a compass needle sets itself along a line of force.
  practice: Keep the homemade compass and check it against a real one each day.
  tip: Keep magnets away from phones, credit cards and computer screens, and never let small children swallow small magnets.
- num: 36
  roman: Ch. XII, §§ 315–321
  idx: 257
  unit: 12
  title: Why magnets work, and the earth as a magnet
  mins: 40
  goal: Your student can explain the molecular theory of magnetism (breaking, heating, jarring, saturation), and describe the earth's magnetism, declination
    and dip.
  materials:
  - The book, open to these pages
  - A steel sewing needle or a paper clip straightened out, a magnet and a compass
  - Pliers or wire cutters (adult)
  - A steel rod or long screwdriver and a hammer (for § 321)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A tube of iron filings becomes a magnet when stroked; heating, jarring and breaking a magnet; the theory that molecules are tiny magnets lined up;
    saturation; Gilbert and the earth as a great magnet; declination and the map of lines of equal declination; dip of the compass needle; magnetizing a
    steel rod by tapping it in the earth's field. Ten questions follow, with a portrait of William Gilbert.
  steps:
  - - Hook question
    - 'Say: If you break a magnet in half, do you get a north piece and a south piece?'
  - - Read together
    - 'Read §§ 315–321. Gilbert''s idea, as the book gives it:

      ~ the earth itself is a great magnet with an S pole near the geographical north pole and an N pole near the geographical south pole.'
  - - 'Try it: break a magnet'
    - Magnetize a straightened paper clip by stroking it with a magnet, check both ends with the compass, then have an adult snip it in half. Each half
      has both a north and a south end (Fig. 226).
  - - Explain the theory
    - Each molecule acts as a tiny magnet. In unmagnetized iron they point every which way; magnetizing lines them up (Figs. 227–229). Jarring or heating
      shakes them out of line. When all are lined up the magnet is saturated.
  - - 'Try it: the earth magnetizes a rod'
    - 'Hold a steel rod pointing north and tilted steeply down (the dip in most of the United States is about 60–70°, as the book says) and tap the top
      end sharply with a hammer a dozen times. Test with the compass: the lower end now attracts the compass''s south end (§ 321).'
  - - What we know now
    - The earth's magnetic poles wander. The north magnetic pole has moved hundreds of miles since Ross found it in 1831 and is now in the Arctic Ocean,
      heading toward Siberia. Its magnetism comes from currents in the earth's molten iron core. And the "tiny magnets" in iron are now known to be the
      spinning electrons of its atoms, lined up in small regions called domains.
  - - Say it back
    - Your student explains why a compass does not point exactly north in most places (declination, § 319).
  - - Questions
    - Work questions 1–10 on book page 237. For question 5, the force between poles is (strength × strength) ÷ distance², in dynes.
  practice: Look up your town's magnetic declination online and check it with the compass against a street that runs true north–south.
  answers: '1. No; it only turns to point north–south, since the earth pulls its two poles equally in opposite directions. 2. Yes, a magnet''s near pole
    attracts more strongly than the far pole repels; the earth is so far away that its pull on the two poles is equal. 3. So that it is balanced before
    it is magnetized and any dip afterward is due only to magnetism. 4. No; the earth''s pull on its N and S poles is equal and opposite. 5. 6 × 1 ÷ 25
    = 0.24 dyne; with a pole of strength 9, 2.16 dynes. 6. The magnet induces an opposite pole in the near end of the iron, which it then attracts. 7. An
    S pole. 8. Hang or float the magnet and bring the iron near it: the magnet moves toward the iron. 9. A compass needle would have no fixed direction;
    a dipping needle would point straight down. 10. The keeper becomes a magnet by induction and helps hold the molecules in line.'
- num: 37
  roman: Ch. XIII, §§ 322–333
  idx: 265
  unit: 13
  title: 'Static electricity: charges, conductors and induction'
  mins: 45
  goal: Your student can explain the two kinds of charge and their law, tell conductors from insulators, charge an electroscope by induction, and describe
    the electron theory.
  materials:
  - The book, open to these pages
  - Two balloons, a wool sweater or your hair
  - A plastic comb and tiny bits of tissue paper
  - 'A homemade electroscope: a glass jar, a cardboard lid, a bent paper clip pushed through it with two thin strips of aluminum foil hanging from the hook
    inside'
  - Cellophane tape
  - A notebook and pencil
  book: Electrification by rubbing, from the Greeks' amber to Gilbert; two kinds of charge, positive (glass rubbed with silk) and negative (ebonite rubbed
    with fur); like charges repel, unlike attract; the unit of charge; conductors and insulators with the gold-leaf electroscope; induction; the two-fluid
    theory and J. J. Thomson's electron theory; charging by induction; equal plus and minus charges. Ten questions follow.
  steps:
  - - Hook question
    - 'Say: After you rub a balloon on your hair, it sticks to the wall. What is holding it there?'
  - - Read together
    - 'Read §§ 322–333. The law:

      ~ Electrical charges of like kind repel each other; those of unlike kind attract each other.'
  - - 'Try it: like and unlike'
    - 'Rub both balloons on the sweater and hang them side by side on threads: they push apart. Rub a comb through dry hair and pick up bits of tissue.
      Stick two strips of tape to a table, rip them off together and hold them near each other (they repel); then stick one on top of the other, rip apart,
      and they attract.'
  - - 'Try it: an electroscope'
    - 'Bring a charged balloon near the paper-clip top of the electroscope without touching it: the foil leaves spread (induction, § 327). Take it away:
      they fall. Now charge it by induction (§ 332): hold the balloon near, touch the clip with a finger, remove the finger, then remove the balloon. The
      leaves stay apart.'
  - - Explain the idea
    - Rubbing does not make electricity; it separates plus and minus charges that were there all along (§ 333). Conductors (metals, salt water, our bodies)
      let charges move; insulators (rubber, glass, plastic, dry silk) don't.
  - - What we know now
    - The electron theory in § 330 won. J. J. Thomson discovered the electron in 1897, and in 1911 Rutherford showed the atom's positive charge sits in
      a tiny nucleus with electrons around it. The book also notes that the direction we call current flow (§ 341) is opposite to the way electrons actually
      move; that convention is still used today. The SI unit of charge is the coulomb.
  - - Say it back
    - Your student explains how the electroscope can be charged by induction, step by step.
  - - Questions
    - Work questions 1–10 on book pages 246–247. Your homemade electroscope can test several of them.
  practice: 'Notice static this week: a shock from a doorknob, clothes clinging out of the dryer, hair standing up under a hat.'
  tip: Static experiments work best on a dry day; humid air carries the charge away.
  answers: '1. If the divergence increases, the paper is charged + (like the electroscope); if it decreases, the paper is −. 2. Charge the electroscope
    + by induction from the rubbed glass rod, then bring the unknown near: if the leaves spread farther it is +; if they fall it is − (or uncharged). 3.
    Each figure takes a charge from the charged plate, is repelled to the other plate, gives up its charge there, and is attracted back. 4. Bring the charged
    sphere near two touching spheres, separate them while it is still near, and then take it away. 5. The negative is bound by the attraction of the positive
    rod. 6. Otherwise the electricity that went to earth through the finger flows back and the electroscope is left uncharged. 7. In the hand the brass''s
    charge runs off through the body; held in rubber it is insulated. 8. It is attracted by induction, touches the rod and takes a charge of the same sign,
    and is then repelled. 9. An uncharged body is also attracted (by induction), but only a charged one can repel. 10. For example: charges exist on any
    body and can move through conductors, while magnetic poles exist only in iron and steel and stay fixed; a magnet always has both poles, but a body can
    have a single kind of charge.'
- num: 38
  roman: Ch. XIII, §§ 334–339
  idx: 274
  unit: 13
  title: Charges on conductors, points, and lightning
  mins: 35
  goal: Your student can explain why charge sits on the outside of a conductor and crowds at points, how a lightning rod works, and why a metal cage shields
    what is inside.
  materials:
  - The book, open to these pages
  - The homemade electroscope from last lesson and a balloon
  - A metal colander or a cage of aluminum foil or wire mesh
  - A radio or phone (for the shielding test)
  - A notebook and pencil
  book: Charge lives on the outside surface of a conductor; charge is densest where the surface is most curved; points let charge escape (the electric whirl
    and electric wind); Franklin's kite and the lightning rod; electric screens (Faraday's box). A portrait and short life of Benjamin Franklin.
  steps:
  - - Hook question
    - 'Say: Why is a car a fairly safe place to be in a lightning storm?'
  - - Read together
    - 'Read §§ 334–339 and the note on Franklin. The book''s conclusion:

      ~ These experiments show that an electric charge resides entirely on the outside surface of a conductor.'
  - - Explain the idea
    - All the bits of charge repel each other, so they spread out to the outside surface and crowd onto sharp curves and points. At a sharp point the charge
      is so dense it leaks into the air (§ 336). A lightning rod's point quietly leaks charge from the building, which helps prevent a strike (§ 338).
  - - 'Try it: a shield'
    - 'Charge the electroscope by induction so its leaves stand apart. Set the metal colander over it, then bring a charged balloon close outside: the leaves
      don''t move (§ 339). Then put a phone inside a closed metal pot or wrapped in several layers of foil and call it: often the call won''t connect. The
      metal screens out electrical disturbances.'
  - - 'Safety: lightning is not an experiment'
    - 'Franklin''s kite (1752) was extremely dangerous, and at least one scientist (Georg Richmann, in 1753) was killed trying a similar experiment. Never
      fly a kite in a storm or near power lines. When thunder roars, go indoors. Sparks from electrical machines, Leyden jars and the electric whirl are
      also for a teacher''s demonstration only: look up a video of a Van de Graaff generator instead.'
  - - What we know now
    - We now know a lightning rod mainly works by giving a strike a safe path to the ground, rather than mostly by preventing strikes; the book itself says
      there are discharges they do not stop. A car protects you because the metal body carries the current around the outside, just as in Faraday's box.
  - - Say it back
    - Your student explains in their own words why the charge collects at the point of a pear-shaped conductor.
  practice: Look at buildings and church steeples for lightning rods, and at the metal cage inside a microwave oven door that keeps the waves in.
- num: 39
  roman: Ch. XIII, §§ 340–350
  idx: 280
  unit: 13
  title: Potential, the volt, condensers and electrical machines
  mins: 45
  goal: Your student can explain electrical potential by comparison with water pressure, define the volt and capacity, describe a Leyden jar, and explain
    how an electrophorus and an influence machine make charge.
  materials:
  - The book, open to these pages
  - Two jugs or bottles and a tube (to show the water-pressure comparison)
  - A 1.5-volt AA battery and a 9-volt battery (just to read the labels)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Potential difference compared with water pressure; the earth as zero potential; the volt; measuring potential with an electroscope or by spark length;
    condensers and the Leyden jar; the electrophorus; the Toepler-Holtz and Wimshurst machines. Nine questions follow.
  steps:
  - - Hook question
    - 'Say: A battery is labeled 1.5 volts. What does a volt measure?'
  - - Read together
    - 'Read §§ 340–350, skimming the machine descriptions (§§ 348–350). The analogy:

      ~ just as water tends to flow from points of higher hydrostatic pressure to points of lower hydrostatic pressure, so electricity tends to flow from
      points of higher electrical pressure or potential to points of lower electrical pressure or potential.'
  - - Show the analogy
    - Connect two partly filled bottles with a tube (or simply describe Fig. 249). Water flows from the higher level to the lower until they are even. Charge
      does the same between two conductors until their potentials are equal (§ 340).
  - - Explain the idea
    - 'Potential difference is the work needed to carry a unit charge from one body to another. The volt is the practical unit (§ 342): a flashlight battery
      gives 1.5 volts, a house outlet in the United States about 120. A spark jumping 1 cm of air means about 30,000 volts (§ 343).

      A condenser (today called a capacitor) is two conductors close together with an insulator between; it can hold far more charge at the same potential
      (§ 344). Your phone and computer contain millions of tiny ones.'
  - - 'Watch only: Leyden jars and static machines'
    - 'Watch only: don''t try this at home. Leyden jars, the electrophorus sparks and the Toepler-Holtz and Wimshurst machines (§§ 345–350) make high voltages,
      and a charged Leyden jar can give a painful, dangerous shock. Look up a video of a teacher demonstrating a Wimshurst machine or a Leyden jar. Never
      open or play with real capacitors from electronics either; some hold a charge long after unplugging.'
  - - Energy in a spark
    - 'Read § 347: the energy in the electrophorus''s spark comes from the work of lifting the plate against the attraction of the charges. Conservation
      of energy again.'
  - - Say it back
    - Your student explains why touching only the knob of an insulated Leyden jar gives almost no spark, but connecting both coats gives a big one.
  - - Questions
    - Work questions 1–9 on book page 260.
  practice: Read the voltage labels on batteries, chargers and appliances around the house (read only; never open them).
  answers: 1. The clapper is attracted to one bell, takes its charge, is repelled to the other bell, gives up the charge there, and so carries charge back
    and forth. 2. No; charge lives only on the outside surface. 3. Surround it with a metal screen or cage connected to the earth. 4. 3 × (12 − (−8)) =
    60 ergs (in the book's absolute units). 5. The cloud induces positive electricity in the rod, which escapes from the point into the cloud. 6. Opposite
    electricity is induced on the nearby grounded conductor and "binds" the charge, so more can be put on before the potential rises. 7. The leaves stand
    farther apart now; grounding the outer coat binds the inner charge and lowers its potential. 8. The opposite charge cannot flow onto the outer coat
    to bind the inner charge. 9. The outer coats then supply each other with the opposite charges needed.
- num: 40
  roman: Ch. XIV, §§ 351–358
  idx: 290
  unit: 14
  title: Electric currents and their magnetic effect
  mins: 45
  goal: Your student can explain that a moving charge makes a magnetic field, repeat Oersted's experiment with a battery and compass, use the right-hand
    rule, and explain how a galvanometer measures current.
  materials:
  - The book, open to these pages
  - A 1.5-volt AA battery (or two in a holder), a flashlight bulb in a holder, and two or three short insulated wires with bare ends
  - A compass
  - Tape
  - A notebook and pencil
  book: A Leyden-jar spark magnetizes a needle; a charge at rest has no magnetic effect; Galvani, Volta and the galvanic cell; Oersted's experiment (1819);
    the plates of a cell are charged; a cell gives a small voltage but a large steady current; the circular magnetic field around a wire and the right-hand
    rule; galvanometers; the ampere; the ammeter. Five questions follow, with portraits of Volta and Ampère.
  steps:
  - - Hook question
    - 'Say: Is there any connection between electricity and magnetism? People wondered for centuries, until 1819.'
  - - Read together
    - 'Read §§ 351–358. The key fact:

      ~ magnetic effects are always observable near the path of a moving electrical charge, while no such effects can ever be observed near a charge at
      rest.'
  - - 'Try it: Oersted''s experiment'
    - 'Make a circuit: battery, bulb and wires, so the bulb lights. Lay the compass flat and let it settle north–south. Tape one wire of the circuit so
      it runs straight north–south just above the compass. When the bulb lights, the needle swings. Swap the battery around: it swings the other way. Run
      the wire under the compass instead: it swings the other way again.

      Safety: use only 1.5-volt AA or AAA batteries for every circuit in this course. Never connect anything to a wall outlet, and don''t hold a bare wire
      straight across a battery for more than a few seconds (it gets hot and drains the battery).'
  - - The right-hand rule
    - Grasp the wire with your right hand, thumb pointing the way the current flows (from + to −, § 341). Your fingers curl the way the magnetic lines go
      around the wire (§ 355). Have your student predict which way the needle will swing before trying each setup.
  - - Explain the galvanometer
    - 'Wind the wire several times around the compass: the swing grows, because every turn pushes the same way (§ 356). That is a galvanometer. Real ammeters
      (Fig. 272) use a coil that turns between magnet poles against a spring.

      What we know now: the ampere is now defined by fixing the charge of the electron, but it is still about the same size; a flashlight bulb draws a few
      tenths of an ampere.'
  - - 'Watch only: the Leyden jar spark'
    - 'Watch only: don''t try this at home. § 351 magnetizes a needle with a Leyden-jar spark, and § 352 uses sulphuric acid in the cell. Today''s AA battery
      does the same job safely.'
  - - Say it back
    - Your student explains why Oersted's experiment caused such excitement.
  - - Questions
    - Work questions 1–5 on book page 268, using the right-hand rule.
  practice: Look at a car's dashboard ammeter or a multimeter if you have one, and find the coil-and-magnet idea inside it in a diagram.
  answers: 1. Only when it is moving. 2. Toward the west (by the right-hand rule, with the current flowing south the magnetic lines above the wire run from
    east to west). 3. From north to south. 4. Down (a clockwise current, seen from above, makes the field inside the loop point downward). 5. As the needle
    turns toward the plane of the coil, less and less of the coil's force acts at right angles to the needle, while the earth's pull to turn it back grows.
- num: 41
  roman: Ch. XIV, §§ 359–368
  idx: 302
  unit: 14
  title: Voltage, resistance and Ohm's law
  mins: 40
  goal: Your student can explain electromotive force, potential drop along a circuit and resistance using the water analogy, and use Ohm's law (amperes
    = volts ÷ ohms).
  materials:
  - The book, open to these pages
  - Two AA batteries in a holder, a flashlight bulb in a holder, and wires
  - A soft pencil (graphite) line drawn heavily on paper, or a pencil lead (for a variable resistor)
  - A multimeter if you have one (optional)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Voltmeters as high-resistance galvanometers; the water analogy of a cell (a pump and tanks); electromotive force (E.M.F.); the E.M.F. depends only
    on the materials of the cell; fall of potential along a wire; resistance; specific resistances of metals; resistance proportional to length and inversely
    to cross section; resistance and temperature; the ohm; Ohm's law.
  steps:
  - - Hook question
    - 'Say: Why do the wires inside the walls of a house stay cool, while the thin wire in an old light bulb glows white hot, with the same current running
      through both?'
  - - Read together
    - 'Read §§ 359–368, following the water pictures (Figs. 274 and 278). Ohm''s law:

      ~ the currents furnished by different galvanic cells or combinations of cells are always directly proportional to the E.M.F.''s existing in the circuits
      in which the currents flow, and inversely proportional to the total resistances of these circuits'
  - - Explain with water
    - The cell is like a pump (§ 360); voltage is like the difference in water level; current is how much flows per second; resistance is like a narrow,
      rough pipe. Long thin wires resist more; thick short wires less (§ 365). Copper resists little, German silver (nichrome-like) a lot.
  - - 'Try it: a pencil dimmer'
    - 'Make a circuit with the bulb, but instead of connecting the last wire directly, press its bare end on a heavy pencil line (or a pencil lead) and
      slide it along. A longer stretch of graphite means more resistance: the bulb dims. A short stretch: brighter (§ 365). If you have a multimeter, measure
      the voltage of one and two batteries and the resistance of the pencil line.

      Safety: use only 1.5-volt AA or AAA batteries for every circuit in this course. Never connect anything to a wall outlet, and don''t hold a bare wire
      straight across a battery for more than a few seconds (it gets hot and drains the battery).'
  - - Use Ohm's law
    - 'amperes = volts ÷ ohms (C = E/R). Practice: 2 volts across 10 ohms gives 0.2 ampere; 0.3 ampere through 100 ohms needs 30 volts; a lamp with 110
      volts across it and 0.5 ampere through it has 220 ohms.'
  - - What we know now
    - Ohm's law and these units (volt, ampere, ohm) are exactly the ones used today. The book's "E.M.F." is still used too. Some materials, called superconductors,
      discovered in 1911, have no resistance at all when very cold.
  - - Say it back
    - Your student explains, with the water picture, why a voltmeter must let almost no current through it (§ 359).
  practice: 'Read the labels on a few chargers: they often give volts and amperes. Multiply them to find watts (you''ll meet that in the next chapter).'
  tip: The problems for §§ 359–374 come together at the end of the next lesson.
- num: 42
  roman: Ch. XIV, §§ 369–374
  idx: 309
  unit: 14
  title: Internal resistance, series and parallel, and shunts
  mins: 45
  goal: Your student can use Ohm's law for a whole circuit including the cell's own resistance, find the resistance of wires in series and in parallel,
    and solve the book's resistance problems.
  materials:
  - The book, open to these pages
  - Two flashlight bulbs in holders, two AA batteries in a holder, and wires
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The internal resistance of a cell; C = E/(Rₑ + Rᵢ); measuring internal resistance; measuring any resistance with an ammeter and voltmeter or with
    a high-resistance galvanometer; resistances in series and in parallel; shunts. Sixteen problems follow.
  steps:
  - - Hook question
    - 'Say: If you add a second bulb to a circuit, do both bulbs get brighter, dimmer, or stay the same? It depends on how you connect it.'
  - - Read together
    - 'Read §§ 369–374. The rule for parallel wires:

      ~ When n exactly similar conductors are joined in parallel, i.e. in the manner shown in Fig. 284, the total resistance between a and b is 1/n of the
      resistance of one of them'
  - - 'Try it: series and parallel'
    - 'Light one bulb from the batteries and note its brightness. Now connect two bulbs one after the other (series): both are dimmer, because the resistance
      has doubled. Then connect each bulb across the batteries separately (parallel): both are about as bright as one alone. Unscrew one bulb in each setup
      and see what happens to the other.

      Safety: use only 1.5-volt AA or AAA batteries for every circuit in this course. Never connect anything to a wall outlet, and don''t hold a bare wire
      straight across a battery for more than a few seconds (it gets hot and drains the battery).'
  - - Explain the idea
    - 'In series, resistances add. In parallel, there are more paths, so the total resistance is less. The cell itself has resistance (the liquid inside),
      so the full law is current = E.M.F. ÷ (outside resistance + inside resistance) (§ 369). A shunt is a side path: the currents divide inversely as the
      resistances (§ 374).'
  - - Key numbers for the problems
    - 'From the book: 9.35 ft of No. 30 copper wire, or 6.2 in. of No. 30 German silver wire, has 1 ohm (§ 367); No. 20 German silver wire has 190.2 ohms
      per 1000 ft. (problem 11). Resistance goes as length and inversely as the square of the diameter.'
  - - Say it back
    - Your student explains why the lights in a house are wired in parallel rather than in series.
  - - Problems
    - Work problems 1–16 on book pages 279–280.
  practice: 'Look at a string of holiday lights: when one bulb goes out, does the whole string go dark? That tells you how they are wired.'
  answers: 1. So that it draws too little current to lower the P.D. it is measuring. 2. About 18 m (German silver resists about 18 times as much as copper).
    3. ¼ ohm. 4. No. 20 has about 1/10 the resistance of No. 30 (0.098, from (10.025/31.96)²). 5. About 2 ft. (1.97 ft.). 6. About 56 ft. 7. 0.2 ampere.
    8. 30 volts. 9. 220 ohms. 10. 0.54 ampere; 0.27 ampere; about 0.0106 ampere. 11. About 0.95 ohm. 12. About 1.9 ohms. 13. About 1.26 ohms (1.07 + 0.19).
    14. 0.5 ampere (the ten wires in parallel make 0.5 ohm; 1 ÷ (1.5 + 0.5)). 15. 1/1001. 16. About 0.47 volt (3 × 3/19).
- num: 43
  roman: Ch. XIV, §§ 375–386
  idx: 313
  unit: 14
  title: 'Batteries: how cells work and how to connect them'
  mins: 45
  goal: Your student can explain how a simple cell makes a current, what polarization is, how the Daniell, Leclanché and dry cells differ, and when to connect
    cells in series or in parallel.
  materials:
  - The book, open to these pages
  - Three or four lemons, the same number of galvanized (zinc-coated) nails and clean copper coins or strips of copper, and wires with alligator clips
  - A red LED (a light-emitting diode) or a cheap digital clock, or a multimeter
  - A used AA battery to look at (not to open)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: What happens in a zinc-copper-acid cell; local action and amalgamation with mercury; the ion theory of the cell; polarization and its causes; the
    bichromate, Daniell, Leclanché and dry cells; series and parallel connections of cells and when to use each. Ten problems follow.
  steps:
  - - Hook question
    - 'Say: A battery has no moving parts. Where does its electricity come from?'
  - - Read together
    - 'Read §§ 375–386. The rule for connecting cells:

      ~ Hence series connection should always be used when the external resistance is large in comparison with the internal resistance of a single cell.'
  - - 'Try it: a lemon battery'
    - 'Push a galvanized nail and a copper coin into a lemon, not touching. That is a cell: zinc, copper and an acid (§ 377). One lemon gives roughly one
      volt but very little current. Join three or four lemons in series (the copper of one to the zinc of the next) and connect the ends to an LED (longer
      leg to the copper end) or a small digital clock. It glows faintly. A multimeter will show the voltage add up.

      Safety: don''t eat the lemons afterward.'
  - - Explain the idea
    - Zinc dissolves into the acid as positive ions, leaving the zinc plate negative; hydrogen comes out at the copper, making it positive (§ 377). Hydrogen
      bubbles on the copper weaken the cell (polarization, §§ 378–379). Better cells are designed to stop that (the Daniell cell) or recover (the Leclanché
      and dry cells).
  - - 'Watch only: acids and mercury'
    - 'Watch only: don''t try this at home. The book''s cells use sulphuric acid, bichromate, copper sulphate and mercury for amalgamating the zinc, all
      of which are hazardous. Never open a battery: the chemicals inside can burn skin.'
  - - What we know now
    - Most AA batteries today are alkaline cells, a later improvement on the book's dry cell (§ 383). Rechargeable batteries (lithium-ion in phones, lead-acid
      in cars) are storage batteries, which the next chapter introduces.
  - - Say it back
    - Your student explains when to use series and when to use parallel, with the water pictures in Figs. 296 and 297.
  - - Problems
    - Work problems 1–10 on book pages 290–291.
  practice: 'Look at how batteries are put into a flashlight or remote control: end to end (series) or side by side? Why?'
  answers: '1. Its E.M.F. stays nearly constant for a long time, with little polarization. 2. It needs no attention and does not waste away on open circuit,
    and doorbells need only short bursts of current. 3. In series: about 0.065 ampere (43.2 volts ÷ (500 + 160) ohms); one cell: about 0.0021 ampere; 40
    in parallel: about 0.0022 ampere. 4. 40 in parallel: 5.4 amperes; 40 in series: about 0.27 ampere; one cell: about 0.26 ampere. 5. Its E.M.F. is high
    and its internal resistance low, so it gives a large current, but it soon weakens. 6. When the outside resistance is large compared with the cell''s
    internal resistance. 7. About 2.16 ohms (taking its E.M.F. as 1.08 volts). 8. So that it draws too little current to lower the P.D. it measures. 9.
    So that putting it in the circuit does not reduce the current it measures. 10. Yes: the same current C flows through each wire, so the P.D. across each,
    C × r, is proportional to its resistance r.'
- num: 44
  roman: Ch. XV, §§ 387–393
  idx: 325
  unit: 15
  title: 'Chemical effects: electrolysis, plating and storage batteries'
  mins: 45
  goal: Your student can explain how a current carries ions through a liquid, describe the electrolysis of water, electroplating and the storage battery,
    and use Faraday's rule for the weight of metal deposited.
  materials:
  - The book, open to these pages
  - Red cabbage leaves, hot tap water, vinegar and baking soda (a cabbage-juice indicator)
  - Two AA batteries in a holder, two wires with clips, two pencils sharpened at both ends (graphite electrodes)
  - A glass of water with a spoonful of baking soda dissolved in it
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Purple cabbage juice shows acid and alkali forming at the two electrodes; ions moving through a liquid; electrolytes and electrolysis; splitting
    water into hydrogen and oxygen; electroplating, electrotyping and refining metals; Faraday's law (one ampere deposits 4.025 g of silver an hour); the
    lead storage battery. Eight problems follow.
  steps:
  - - Hook question
    - 'Say: Gold-plated jewelry has only a thin skin of gold. How does the gold get there so evenly?'
  - - Read together
    - 'Read §§ 387–393. The book''s idea of conduction in liquids:

      ~ it is thought to consist in the migration through the liquid of a swarm of positively charged ions in one direction, and of a corresponding swarm
      of negatively charged ions in the other direction.'
  - - 'Try it: cabbage indicator'
    - 'Tear red cabbage into hot tap water and let it steep 10 minutes; strain it. Add vinegar to a little: red (acid). Add baking soda to another: green-blue
      (alkali). This is the same test the book uses in § 387.'
  - - 'Try it: split water'
    - 'Stand the two pencil leads (sharpened at both ends) in the baking-soda water, not touching. Clip them to the two ends of the battery pack. Tiny bubbles
      stream from both leads, more from the one on the − side: that is hydrogen, and the other is oxygen, twice as much hydrogen as oxygen (§ 388). Add
      cabbage juice to the water and watch colors form at the two electrodes.

      Use baking soda, not table salt (salt water gives off chlorine). Work near an open window, don''t collect or light the gases, and pour the water down
      the sink afterward.

      Safety: use only 1.5-volt AA or AAA batteries for every circuit in this course. Never connect anything to a wall outlet, and don''t hold a bare wire
      straight across a battery for more than a few seconds (it gets hot and drains the battery).'
  - - 'Watch only: acids, cyanide and lead'
    - 'Watch only: don''t try this at home. The book''s experiments use sulphuric acid, mercury, nitric acid, copper sulphate, silver cyanide (a deadly
      poison) and lead plates in acid. Describe what happens: copper coats the negative plate in § 389, and in § 393 two lead plates in acid become a rechargeable
      cell that rings a bell. Look up a video of electroplating copper in a school lab.'
  - - Explain the idea
    - Positive metal or hydrogen ions are pulled to the negative plate and deposited there; negative ions go to the positive plate (§ 387). Faraday found
      that a given current for a given time always deposits the same weight of a given element (§ 392). A storage battery stores chemical energy, not electricity
      itself (§ 393). The car battery is still a lead storage battery; phones use lithium-ion cells.
  - - Say it back
    - Your student explains how electroplating puts silver on a spoon (Fig. 300).
  - - Problems
    - 'Work problems 1–8 on book page 298. Use the book''s figures: one ampere deposits 4.025 g of silver, 1.181 g of copper or 1.203 g of zinc per hour.'
  practice: Look for plated things around the house (chrome faucets, silver-plated forks, zinc-coated nails) and for the storage battery in a car.
  answers: '1. The plate that loses weight is where the current enters (the anode); the one that gains copper is where it leaves. 2. Hydrogen comes off
    twice as fast, at the negative electrode. 3. About 14.9 minutes (1 ÷ 4.025 hour). 4. About 0.30 g. 5. About 0.15 ampere. 6. Its plates are large and
    close together, so its internal resistance is very small. 7. 0.05 ohm (2 volts ÷ 20 amperes = 0.1 ohm in all, less the ammeter''s 0.05). 8. No: cells
    in parallel give only about 1.5 volts, less than the 2 volts the storage cell pushes back with.'
- num: 45
  roman: Ch. XV, §§ 394–403
  idx: 332
  unit: 15
  title: 'Coils and electro-magnets: the bell and the telegraph'
  mins: 45
  goal: Your student can explain why a current loop acts like a magnet, find the N pole of a coil with the right hand, build an electro-magnet, and explain
    how an electric bell and a telegraph work.
  materials:
  - The book, open to these pages
  - A large iron nail or bolt, about 2 m of thin insulated wire (enameled or plastic-coated), an AA battery and tape
  - Paper clips or staples
  - A compass
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A loop carrying a current behaves like a flat magnet; how it turns in a magnetic field; a helix (coil) acts like a bar magnet; the right-hand rule
    for coils; the electro-magnet and its strength in ampere-turns; the electric bell; Morse's telegraph, relays and sounders. Nine problems follow.
  steps:
  - - Hook question
    - 'Say: Junkyard cranes lift whole cars with a magnet, then drop them on command. How can a magnet be switched off?'
  - - Read together
    - 'Read §§ 394–403. The rule for a coil:

      ~ If the coil is grasped in the right hand in such a way that the fingers point in the direction in which the current is flowing in the wires, the
      thumb will point in the direction of the north pole of the helix'
  - - 'Try it: build an electro-magnet'
    - 'Wind the wire tightly around the nail 30–50 times, leaving long ends, and strip or sand the ends bare. Touch the ends to the battery: the nail picks
      up paper clips. Let go: they drop (§ 398). Count how many clips you pick up with 20 turns and with 50 turns: more ampere-turns, stronger magnet (§
      399). Use the compass to find which end is N, and check it with the right-hand rule.

      Connect only for a few seconds at a time; the wire and battery get warm. Safety: use only 1.5-volt AA or AAA batteries for every circuit in this course.
      Never connect anything to a wall outlet, and don''t hold a bare wire straight across a battery for more than a few seconds (it gets hot and drains
      the battery).'
  - - Explain the bell
    - 'Trace Fig. 312: the current magnetizes the core, which pulls the armature and hammer; that breaks the contact, the magnet lets go, the spring pulls
      back, the contact closes again, and so on, many times a second (§ 400).'
  - - The telegraph
    - 'Read § 401 and § 403. Tap out a message in Morse code with a flashlight or by knocking. The first line, from Baltimore to Washington, opened on May
      24, 1844, with "What hath God wrought?" (§ 401). The relay (§ 402) lets a weak current from far away switch on a strong local one: an idea still used
      in every computer.'
  - - Say it back
    - Your student explains why a relay needs many turns of fine wire (problem 8).
  - - Problems
    - Work problems 1–9 on book page 305.
  practice: 'Find electro-magnets at home: a doorbell, the latch of a washing machine, the speaker in a phone or radio.'
  answers: 1. Its north face is toward the south, so it will turn half way around (through 180°) until that face points north. 2. It turns until its plane
    is at right angles to the lines of force between the magnet poles. 3. In opposite directions; counterclockwise around the N pole, as you look down at
    it. 6. About 0.037 ampere, assuming one 150-ohm relay at each end (100 volts ÷ (2000 + 300 + 400) ohms). 7. About 370 ampere-turns. 8. About 0.042 ampere
    × 500 turns, only about 21 ampere-turns; on a long, high-resistance line the current is tiny whatever the magnet, so a relay must have very many turns
    (hence high resistance) to get enough ampere-turns. 9. From east to west.
- num: 46
  roman: Ch. XV, §§ 404–411
  idx: 338
  unit: 15
  title: 'Heating effects: watts, Joule''s law and electric lights'
  mins: 40
  goal: Your student can use volts × amperes = watts, calculate the heat made by a current (Joule's law), and compare the electric lights of 1906 with today's.
  materials:
  - The book, open to these pages
  - A few light bulbs or their boxes showing watts (incandescent, compact fluorescent or LED)
  - An appliance label or the electric bill (to find watts and kilowatt hours)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A thin wire glows and melts with a current; the energy spent is volts × amperes watts; calories = volts × amperes × seconds × 0.24; Joule's law;
    carbon-filament incandescent lamps and the watt hour; the arc light; the Nernst lamp; the Cooper-Hewitt mercury lamp. Five problems follow.
  steps:
  - - Hook question
    - 'Say: Why does a toaster wire glow red, while the cord that feeds it stays cool?'
  - - Read together
    - 'Read §§ 404–411. The rule:

      ~ volts x amperes = watts.'
  - - Explain the idea
    - 'Power in watts = volts × amperes (§ 405). Heat made in a wire is proportional to the resistance, the time and the square of the current (Joule''s
      law, § 406): H = C²R × t × 0.24 calories. The thin, high-resistance wire gets hot; the thick, low-resistance cord does not.

      You pay for energy by the kilowatt hour: 1000 watts for one hour (the book uses the watt hour, § 407).'
  - - 'Try it: read the labels'
    - Find the watts on several bulbs and appliances. Work out how many watt hours each uses in 10 hours, as the book does for a 55-watt lamp (550 watt
      hours). Find the price per kilowatt hour on an electric bill and the cost of running each one.
  - - What we know now
    - The carbon-filament lamp of 1906 used about 3.4 watts per candle power (§ 407). Tungsten filaments soon replaced carbon, and today an LED bulb gives
      the same light as an old 60-watt bulb using only about 8–10 watts. Mercury lamps (§ 411) are being phased out because mercury is poisonous.
  - - 'Watch only: melting wire and arcs'
    - 'Watch only: don''t try this at home. Melting a wire across a cell (§ 404) and the arc light (§ 408) involve very hot metal, intense light that can
      harm the eyes, and fire. Never try to make sparks or heat wires from a wall outlet.'
  - - Say it back
    - Your student explains why a fuse (a short, thin wire) melts first if too much current flows.
  - - Problems
    - Work problems 1–5 on book page 311. Use calories = volts × amperes × seconds × 0.24.
  practice: Make a list of the five appliances in your home with the highest wattage. Which run longest each day?
  answers: 1. About 15.8 calories per second (110 × 0.6 × 0.24). 2. 5760 calories (10² × 4 × 60 × 0.24). 3. About 9300 calories (current 220/750 ampere;
    220²/750 × 600 × 0.24). 4. 10 watts. 5. About 75 cells (746 ÷ 10).
- num: 47
  roman: Ch. XVI, §§ 412–417
  idx: 345
  unit: 16
  title: 'Faraday''s discovery: currents made by magnets'
  mins: 45
  goal: Your student can describe Faraday's discovery of induced currents, state Lenz's law and connect it to conservation of energy, and use the dynamo
    rule.
  materials:
  - The book, open to these pages
  - A strong magnet (a neodymium magnet if you have one, handled carefully) and a copper or aluminum tube, such as a length of copper plumbing pipe
  - About 10 m of thin insulated wire wound into a coil, and a compass
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A coil thrust over a magnet pole gives a momentary current; Faraday's discovery (1831); the direction of the induced current and Lenz's law; an
    E.M.F. is induced only when lines of force are cut; its strength (100,000,000 lines cut per second give 1 volt); the dynamo rule; a coil turning between
    magnet poles. Seven questions follow, with a portrait and short life of Michael Faraday.
  steps:
  - - Hook question
    - 'Say: Almost all the electricity in your home is made without any batteries or chemicals. How?'
  - - Read together
    - 'Read §§ 412–417 and the note on Faraday (who was apprenticed to a bookbinder as a boy). Lenz''s law:

      ~ Whenever a current is induced by the relative motion of a magnetic field and a conductor, the direction of the induced current is always such as
      to set up a magnetic field which opposes the motion.'
  - - 'Try it: the slow-falling magnet'
    - 'Drop the strong magnet down the copper or aluminum tube and time it; then drop a non-magnetic object about the same size (a short wooden dowel, or
      a few coins taped into a roll). The magnet falls very slowly. Currents induced in the tube make a field that opposes the motion: Lenz''s law you can
      see. (Copper isn''t magnetic at all; try the magnet on it.)

      Safety: strong magnets snap together hard and can pinch fingers; keep them away from phones and pacemakers.'
  - - 'Try it: Faraday''s experiment'
    - 'Wind 20 turns of the wire around a compass to make a simple galvanometer. Connect the ends to a separate coil (the rest of the wire wound into a
      loop about the size of a cup), placed a meter or more away from the compass. Push the magnet quickly into that coil: the compass twitches. Hold it
      still: nothing. Pull it out: it twitches the other way (§ 412). Faster motion, bigger twitch (§ 415). The effect is small: a strong magnet and many
      turns help.'
  - - Explain the idea
    - 'A current is made only when the conductor cuts magnetic lines, or the number of lines through a coil changes (§ 414). The induced current always
      pushes back against the motion that causes it, so you must do work to get electrical energy out (§ 413). That is the conservation of energy again.
      The dynamo rule (§ 416): right hand, forefinger along the field, thumb along the motion, middle finger gives the current.'
  - - What we know now
    - Faraday's 1831 discovery is the basis of every power-station generator, wind turbine and electric guitar pickup today. The book notes that Joseph
      Henry found it about the same time in America. The unit of magnetic flux today is the weber; a weber is 100,000,000 of the book's lines, so 1 volt
      is induced when one weber is cut per second.
  - - Say it back
    - Your student explains why the magnet falls slowly through the copper pipe, using Lenz's law.
  - - Questions
    - Work questions 1–7 on book page 317.
  practice: 'Find induction at work: an induction cooktop, a wireless phone charger, a bicycle dynamo light, the magnetic strip readers in stores.'
  answers: 1. When the magnet and a conductor move relative to each other so that lines of force are cut. 2. Counterclockwise as you look down (the induced
    current makes the coil's lower face an S pole to oppose the motion, so its upper face is N). 3. The induced current opposes the motion; if it helped
    the motion, the motion would speed itself up and make energy from nothing. 4. When the coil's circuit is closed, currents are induced in it as it swings,
    and by Lenz's law they oppose its motion. 5. In the northern hemisphere the E.M.F. is upward (from the bottom of the mast toward the top); the wire
    moves with the mast and has an equal E.M.F. induced in it, so the two cancel around the loop. 6. 100 volts (250 loops × 4,000,000 lines per turn × 10
    turns per second = 10,000,000,000 lines per second). 7. When the plane of the coil is at right angles to the magnetic meridian (facing north and south),
    where the number of lines through it is greatest.
- num: 48
  roman: Ch. XVI, §§ 418–423
  idx: 353
  unit: 16
  title: 'Dynamos: alternating and direct current'
  mins: 40
  goal: Your student can explain how an alternator makes alternating current, how a commutator turns it into direct current, and the difference between
    series, shunt and compound dynamos.
  materials:
  - The book, open to these pages
  - A hand-crank flashlight or radio, a bicycle dynamo light, or a small toy motor and an LED (spin the motor shaft fast to make the LED blink)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A coil spinning between electro-magnet poles; ring and drum armatures; slip rings and alternating current; multipolar alternators; the commutator;
    ring- and drum-armature direct-current dynamos; series, shunt and compound winding; lamps in parallel and arc lamps in series. Twelve problems follow.
  steps:
  - - Hook question
    - 'Say: The electricity from a wall outlet is called "alternating current." What is alternating about it?'
  - - Read together
    - 'Read §§ 418–423, studying Figs. 329–338. The commutator''s job:

      ~ By the use of a so-called commutator it is possible to transform a current which is alternating in the coils of the armature to one which always
      flows in the same direction through the external portion of the circuit.'
  - - Explain the alternator
    - As a coil turns between N and S poles, each side cuts lines first one way and then, half a turn later, the other way, so the current reverses twice
      each turn (§ 418). Slip rings (R and R′) carry this alternating current out. A commutator (§ 420) swaps the connections every half turn, so the outside
      circuit always gets current in one direction.
  - - 'Try it: be the power station'
    - 'Crank a hand-crank flashlight or radio and feel how much harder it gets when the light is on (Lenz''s law again). Or connect an LED to a small toy
      motor and spin the shaft fast between your fingers: the motor works as a dynamo and the LED flickers. (If it doesn''t light, reverse the LED.)'
  - - What we know now
    - The book's 1906 power stations made both kinds of current. Alternating current won for power grids, because transformers (two lessons from now) work
      only with AC. In the United States it alternates 60 times a second (120 alternations); in much of the world, 50. Batteries, phones and computers still
      use direct current inside.
  - - Say it back
    - Your student explains, with Fig. 335, how the split ring keeps the outside current flowing one way.
  - - Problems
    - 'Work a selection of problems 1–12 on book pages 325–326: try 1, 3, 6, 8, 9, 10, 11 and 12.'
  practice: Look for the label on an appliance that says "AC" or "DC" and "60 Hz" (or 50 Hz).
  answers: 1. 66⅔ alternations per second (20 poles × 200/60 revolutions per second). 3. The commutator reverses the coil's connections to the brushes just
    as the current in the coil reverses. 6. Twelve brushes. 8. The field magnets grow stronger, so the E.M.F. rises. 9. The field magnets grow weaker, so
    the E.M.F. falls. 10. In a compound dynamo the series coil strengthens the field as the shunt coil weakens it, and the two effects balance. 11. 5000
    amperes; 550 kilowatts, about 737 horse power. 12. About 218,000 lamps (12,000,000 watts ÷ 55 watts, taking 0.5 ampere per lamp).
- num: 49
  roman: Ch. XVI, §§ 424–427
  idx: 361
  unit: 16
  title: The electric motor
  mins: 40
  goal: Your student can explain the force on a current in a magnetic field, use the motor rule, explain how a motor turns, and explain back E.M.F.
  materials:
  - The book, open to these pages
  - 'A simple motor kit, or: an AA battery, a strong flat magnet, two large paper clips, tape, and about 1 m of enameled (varnished) copper wire with fine
    sandpaper'
  - A small toy motor (to take apart and look at, if you have an old one)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A wire carrying a current is pushed sideways in a magnetic field; the motor rule (left hand); a dynamo run backward as a motor; street-car motors;
    back E.M.F. and the starting box. Ten problems follow.
  steps:
  - - Hook question
    - 'Say: A dynamo turns motion into electricity. Can you run one backward?'
  - - Read together
    - 'Read §§ 424–427. The key fact:

      ~ a wire carrying a current in a magnetic field tends to move in a direction at right angles both to the direction of the field and to the direction
      of the current.'
  - - 'Try it: build a simple motor'
    - 'Wind the enameled wire into a coil about the size of a coin (10–15 turns), leaving two straight ends sticking out on opposite sides as an axle. Sand
      the varnish completely off one end, and off only the top half of the other end. Bend the paper clips into cradles, tape them to the ends of the battery,
      rest the coil in them, and set the magnet on the battery under the coil. Give it a flick: it spins. The half-sanded end acts as a simple commutator
      (§ 425).

      Safety: the battery and wire get warm; disconnect when not spinning. Safety: use only 1.5-volt AA or AAA batteries for every circuit in this course.
      Never connect anything to a wall outlet, and don''t hold a bare wire straight across a battery for more than a few seconds (it gets hot and drains
      the battery).'
  - - Explain the idea
    - 'The motor rule (§ 424): left hand, forefinger along the field, middle finger along the current, thumb gives the push. A motor is built just like
      a dynamo. Once it spins, it also acts as a dynamo and makes a back E.M.F. that opposes the current (§ 427). That is why a motor draws a big current
      when starting and less at full speed (problem 3).'
  - - What we know now
    - 'Electric motors are everywhere now: fans, washing machines, electric cars, the vibrator in a phone. Most streetcars are gone, but electric trains
      and subways still use the same ideas.'
  - - Say it back
    - Your student explains why an electric fan draws more current when it is first switched on.
  - - Problems
    - Work problems 1–10 on book pages 329–330.
  practice: Count the electric motors in your home (don't forget the refrigerator, clocks, printers and the hard drive of a computer).
  answers: 1. Toward the east (the force is at right angles to the downward current and the northward horizontal field). 3. At first there is no back E.M.F.;
    as it speeds up, the back E.M.F. cuts down the current. 5. No; the iron core greatly strengthens the field the wires move in. 6. Yes; with the circuit
    closed, the current's field opposes the turning (Lenz's law). 7. If the induced current helped the motion, a motor once started would speed itself up
    and do work for nothing. 8. Twice the current must be supplied at the same voltage, and the larger current in the armature pushes back twice as hard.
    9. The current reverses in the field magnets and the armature together, so the push is always the same way. 10. 5 amperes ((500 − 450) ÷ 10).
- num: 50
  roman: Ch. XVI, §§ 428–443
  idx: 365
  unit: 16
  title: Induction coils, transformers, power lines and the telephone
  mins: 45
  goal: Your student can explain how changing current in one coil induces current in another, how a transformer steps voltage up or down, why power is sent
    at high voltage, and how the telephone works.
  materials:
  - The book, open to these pages
  - A phone charger or doorbell transformer (to read its label only; don't open it)
  - Two paper cups and string (a string telephone), or an old pair of earbuds
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Making and breaking a current in one coil induces currents in another; direction by Lenz's law; secondary voltage proportional to turns; the large
    E.M.F. at break; the induction coil and its condenser; laminated cores and eddy currents; the transformer, step-up and step-down; efficiency; long-distance
    transmission (Niagara to Buffalo); Bell's telephone, the carbon transmitter, and the central-battery exchange. Seven questions follow.
  steps:
  - - Hook question
    - 'Say: Power lines carry tens of thousands of volts, yet the outlet in your wall gives about 120. Where does the voltage change?'
  - - Read together
    - 'Read §§ 428–443, skimming §§ 438 and 443. The transformer rule:

      ~ In general, the ratio between the voltages at the terminals of the primary and secondary is the ratio of the number of turns of wire upon the two.'
  - - Explain the transformer
    - 'A changing current in the primary coil makes changing magnetic lines in the iron core, which induce a current in the secondary (§ 428). Volts go
      as the number of turns: 20 times as many turns on the primary steps 2200 volts down to 110 (§ 436). Power in ≈ power out, so if the voltage goes down,
      the current goes up. That only works with alternating current, which is why AC won.'
  - - Why high voltage on long lines
    - The heat wasted in a line is C²R (§ 406). Sending the same power at 10 times the voltage needs 1/10 the current, so only 1/100 of the loss (§ 439).
      Work problem 5 together.
  - - 'Watch only: induction coils and power lines'
    - 'Watch only: don''t try this at home. § 431 describes holding the ends of an induction coil to feel a shock; never do this. Induction coils, spark
      gaps and transformers can deliver dangerous high voltages, and power lines can kill. Stay far away from downed lines, never climb poles or trees near
      lines, and never open a transformer or charger.'
  - - 'Try it: a telephone without electricity'
    - 'Make a cup-and-string telephone and talk across the room with the string pulled tight. Sound makes the cup bottom vibrate, and the string carries
      the vibration. Bell''s telephone (§ 441) did the same thing with a vibrating iron disk, a magnet and induced currents in a wire instead of a string.

      What we know now: today''s phones turn sound into digital signals carried by radio waves and light in glass fibers, but every phone still has a tiny
      speaker that works like the receiver in Fig. 360.'
  - - Say it back
    - Your student explains why an induction coil sparks at "break" and not at "make" (§ 431).
  - - Questions
    - Work questions 1–7 on book page 342.
  practice: 'Read the label on a phone charger: input (about 120 volts AC) and output (5 volts or so DC). It contains a small transformer.'
  answers: '1. At break, because the current, and so the magnetic field, can be stopped far faster than it can be started, and the induced E.M.F. depends
    on how fast the lines change. 3. Currents would be induced around the solid cylinders (eddy currents), wasting energy as heat; flat disks break up those
    paths. 4. The primary must have about 9.1 times as many turns as the secondary (1000 ÷ 110). 5. The 100-volt line carries 100 times the current, so
    to waste the same heat (C²R) its resistance must be 10,000 times smaller: a cross section 10,000 times as great.'
- num: 51
  roman: Ch. XVII, §§ 444–447
  idx: 378
  unit: 17
  title: Where sound comes from and how fast it travels
  mins: 40
  goal: Your student can show that sound comes from vibrating things, that it travels through solids, liquids and gases but not a vacuum, and use the speed
    of sound in problems.
  materials:
  - The book, open to these pages
  - A ruler or rubber band to twang
  - A table to put an ear against
  - A stopwatch, a tape measure or a long straight sidewalk, two people and two pot lids or wooden blocks to bang
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Sound comes from vibrating bodies (a string, a tuning fork); sound travels through wood and water; a bell in an exhausted jar fades; the speed of
    sound measured with cannon in 1738 and 1832 (331.2 m per second at 0° C); speed in water and iron; speed rises about 60 cm per second for each degree.
    Six problems follow.
  steps:
  - - Hook question
    - 'Say: You see lightning, then hear thunder several seconds later. Why the delay, and what can it tell you?'
  - - Read together
    - 'Read §§ 444–447. The book''s conclusion:

      ~ From these familiar facts we conclude that sound arises from the motions of matter.'
  - - 'Try it: feel the vibration'
    - 'Hold a ruler flat on a table with part of it hanging over the edge and twang it: you can see and hear it vibrate. Touch your throat while humming.
      Put your ear on one end of a table while someone scratches the other end lightly: louder through wood than through air (§ 445).'
  - - 'Try it: time an echo or a bang'
    - Stand 100 m or more apart in an open place. One person bangs two pot lids together with arms high; the other starts a stopwatch when they see the
      bang and stops it when they hear it. Divide distance by time. (It is hard to time well; average several tries.) The speed should be roughly 340 m
      per second (about 1100 ft per second).
  - - 'Watch only: the bell in a vacuum'
    - 'The bell-in-a-jar experiment (§ 445) needs an air pump; look up a video of a teacher''s "bell in a vacuum" demonstration. Describe the result: as
      the air is pumped out the ringing fades, so sound needs matter to travel. Light and heat from the sun cross empty space; sound cannot.'
  - - Explain the idea
    - 'Sound travels about 331 m/s at 0° C and about 60 cm/s faster for every degree (§ 447): about 343 m/s (1126 ft/s) at 20° C. It is faster in water
      (about 1400 m/s, today measured nearer 1480) and much faster in iron (about 5100 m/s). Count the seconds between lightning and thunder and divide
      by 3 to get the distance in kilometers (by 5 for miles).'
  - - Say it back
    - Your student explains how the 1738 French commission measured the speed of sound and why they fired cannon from both ends.
  - - Problems
    - Work problems 1–6 on book pages 345–346. Use 1126 ft/s or 343.2 m/s at 20° C.
  practice: Next thunderstorm (from indoors), count the seconds from flash to thunder and work out how far away the strike was.
  answers: 1. About 6000 ft. (5.5 × 1087 ft. at 0° C is 5980 ft.; at 20° C, 6190 ft.), a little over a mile. 2. Taking the earth's circumference as about
    25,000 miles, about 700 miles an hour (about 1000 ft. per second). 3. About 3490 ft. 4. 2252 ft. (686 m), or any whole multiple of it. 5. About 7.0
    seconds (6.39 seconds for the stone to fall, plus 0.58 second for the sound to come up). 6. About 4.4 seconds sooner (4.69 seconds through air, 0.32
    second through iron).
- num: 52
  roman: Ch. XVII, §§ 448–458
  idx: 381
  unit: 17
  title: 'The nature of sound: waves, wave length and pitch'
  mins: 45
  goal: Your student can explain how sound passes from particle to particle as condensations and rarefactions, use wave length = speed ÷ vibrations per
    second, explain loudness falling off with distance, and explain pitch and the Doppler effect.
  materials:
  - The book, open to these pages
  - A Slinky or long spring (for longitudinal waves) and a rope (for transverse waves)
  - A row of 5 coins or marbles on a table (or a Newton's cradle)
  - A playing card and a bicycle wheel (to make pitch), or a comb
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: How a pulse passes from particle to particle (the row of steel balls); loudness and the inverse square law; speaking tubes; trains of waves and
    wave length; l = v/n; condensations and rarefactions; water-wave analogy; longitudinal and transverse waves; musical sounds and noises (the siren disk);
    pitch; Doppler's principle. Nine problems follow.
  steps:
  - - Hook question
    - 'Say: When I talk to you, does the air from my mouth travel across the room to your ear?'
  - - Read together
    - 'Read §§ 448–458. The key relation:

      ~ wave length is equal to velocity divided by the number of vibrations per second'
  - - 'Try it: passing on a push'
    - 'Line up coins touching in a row on a smooth table and flick one coin into the end: the far coin shoots off while the rest barely move (Fig. 367).
      The motion travels, the particles don''t. Then stretch a Slinky on the floor and push one end sharply: a squeezed region (condensation) runs along
      it, followed by a stretched region (rarefaction). Shake a rope sideways for comparison: that wave is transverse (§ 455).'
  - - Explain the idea
    - Each vibration of the source sends out one condensation and one rarefaction. If a fork vibrates 110 times a second and sound goes 1100 ft per second,
      the waves are 10 ft apart (§ 451). Wave length = speed ÷ vibrations per second. Twice as far from a source, sound spreads over four times the area,
      so it is one fourth as loud (§ 449).
  - - 'Try it: pitch and the Doppler effect'
    - 'Hold a card against the spokes of a turning bicycle wheel (or run a fingernail along a comb, slowly then fast). Faster means more taps per second:
      higher pitch (§ 457). Listen to a car or ambulance passing: the pitch drops as it goes by (§ 458).

      What we know now: today vibrations per second are called hertz (Hz). The Doppler effect is used in radar speed guns, weather radar and by astronomers
      (you will meet it again for light in Chapter XXI).'
  - - Say it back
    - Your student explains, with the Slinky, the difference between longitudinal and transverse waves.
  - - Problems
    - Work problems 1–9 on book page 353.
  practice: Listen for the Doppler shift in passing cars, trains or motorcycles.
  answers: 1. The talker's voice vibrates the parchment, which pulls on the thread; the thread passes the vibrations to the other parchment, which sets
    the air there vibrating. 2. In a dense medium more matter is set in motion, so more energy reaches the ear. 3. 4 times as loud (half the distance).
    4. It gathers sound waves over a large opening and funnels them into the ear. 5. About 1.34 m (343.2 ÷ 256). 6. About 3 cm (343.2 m/s indoors, 334.2
    m/s outdoors; each divided by 300). 7. The saw slows down as it cuts, so fewer teeth strike per second. 8. About 323 pulses a second (the train covers
    88 ft. a second, which holds about 23 wave lengths of 3.77 ft.). 9. Sounds of all pitches travel at the same speed.
- num: 53
  roman: Ch. XVII, §§ 459–467
  idx: 389
  unit: 17
  title: Echoes, resonance and sounding-boards
  mins: 40
  goal: Your student can explain echoes and the conditions for reflecting sound, explain why a closed pipe resonates at a quarter wave length and an open
    pipe at a half, and tell resonance from forced vibration.
  materials:
  - The book, open to these pages
  - A tall glass or plastic bottle, a jug of water and a tuning fork if you have one (or a phone tone-generator app)
  - A paper-towel tube or a straw and scissors
  - A seashell or a cup
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Echoes and multiple echoes; why rooms help a speaker; sound is reflected wherever it meets a medium of different density; the reflected pulse; sound
    foci and whispering galleries; resonance in a tube over water; closed pipes resonate at ¼ wave length, open pipes at ½; resonators; forced vibrations
    and sounding-boards. Five problems follow.
  steps:
  - - Hook question
    - 'Say: Why does singing in the shower sound so good?'
  - - Read together
    - 'Read §§ 459–467. The rule for a closed tube:

      ~ the length of air column which gives the best response is approximately one fourth wave length.'
  - - 'Try it: a resonating bottle'
    - 'Play a steady tone from a tone-generator app (try 512 Hz) or strike a tuning fork and hold it over the mouth of a tall bottle. Slowly pour in water:
      at one water level the sound swells loudly. Measure the air column from the water to the top and compare with ¼ of the wave length (343 m/s ÷ 512
      ≈ 67 cm, so about 17 cm, a bit less because of the mouth). Blow across the bottle''s mouth to hear its own note.'
  - - 'Try it: forced vibration'
    - 'Strike a tuning fork (or a fork from the kitchen drawer, tapped on your knee) and listen; then press its handle onto a table top. Much louder: the
      table is forced to vibrate and moves more air (§ 467). A piano''s sounding-board does the same.'
  - - Explain the idea
    - 'An echo is sound reflected where it meets a different medium (§ 460). In a closed pipe, the reflected wave must return in half a vibration, so the
      pipe is ¼ wave length (§ 464); in an open pipe the reflection at the open end is reversed, so it must be ½ wave length (§ 465). Hold a seashell or
      cup to your ear: it hums at its own resonant note (§ 466).'
  - - Say it back
    - Your student explains why an echo needs a wall at least about 50 ft away (§ 459).
  - - Problems
    - Work problems 1–5 on book page 361.
  practice: Clap in different rooms, a stairwell and outdoors near a big building. Where do you hear an echo?
  answers: 1. The people and their clothes break up and absorb the sound waves instead of reflecting them. 2. About 2530 ft. (4.5 × 1126 ÷ 2). 3. 280 vibrations
    per second if the pipe is closed at one end, as in Fig. 376 (1 ft. = ¼ wave length); 560 if it is open at both ends. 4. 340 m per second (34 cm is half
    a wave length, so the wave is 68 cm; 500 × 68 cm). 5. In an open pipe the reflection at the open end is reversed, so the wave must travel down and back
    a whole wave length; in a closed pipe only half.
- num: 54
  roman: Ch. XVII, §§ 468–470
  idx: 396
  unit: 17
  title: 'Interference: beats and standing waves'
  mins: 35
  goal: Your student can explain beats as alternate reinforcement and cancellation, find the difference of two pitches from the beat rate, and explain nodes
    and loops in standing waves.
  materials:
  - The book, open to these pages
  - Two identical glasses or bottles and water, or a tone-generator app on two phones
  - A jump rope or long rope tied to a doorknob
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Beats from two nearly equal tuning forks, and the number of beats per second equals the difference of their rates; standing waves in a tube of cork
    dust (Kundt's tube); nodes half a wave length apart; the row of balls showing waves passing through each other; nodes and loops in a shaken rope. Three
    problems follow.
  steps:
  - - Hook question
    - 'Say: Two sounds together make more noise. Can two sounds ever add up to silence?'
  - - Read together
    - 'Read §§ 468–470. The book''s rule:

      ~ the number of beats per second must be equal to the difference in the vibration numbers of the two forks.'
  - - 'Try it: hear beats'
    - 'Play a 440 Hz tone on one phone and 443 Hz on another, held side by side: you hear a wah-wah-wah three times a second. Change one to 441: one beat
      a second. (Or tap two nearly equal glasses of water, adding a little water to one.) Musicians tune instruments by making the beats slow down and stop.'
  - - 'Try it: standing waves'
    - 'Tie a rope to a doorknob, back up until it is fairly tight, and shake your end steadily. At just the right rates the rope settles into loops with
      still points (nodes) between them: one loop, then two, then three as you shake faster (Fig. 383). The nodes are half a wave length apart (§ 470).'
  - - Explain the idea
    - When two sounds are in step they add; when one is pushing forward as the other pulls back, they cancel (§ 468, Fig. 380). A wave and its own reflection
      running through each other make a standing wave with fixed nodes. Noise-cancelling headphones today use exactly this idea, making a sound wave that
      cancels the noise.
  - - Say it back
    - Your student explains how to tell, from beats, which of two forks is the slower one (by adding wax).
  - - Problems
    - Work problems 1–3 on book page 365.
  practice: Listen for beats when two people sing almost the same note, or when two engines or fans run at nearly the same speed.
  answers: 1. 256 (it beats 4 times a second with the 260 fork, so it is 256 or 264; wax lowers it and the beats increase to 5, so it was the lower one).
    2. 1130 vibrations per second (the wave length is 2 × 6 in. = 1 ft.). 3. 32 ft. per second (each loop is half a wave, so the wave length is 8 ft.; 4
    × 8).
- num: 55
  roman: Ch. XVIII, §§ 471–474
  idx: 401
  unit: 18
  title: The physics of the musical scale
  mins: 40
  goal: Your student can explain that harmonious intervals have simple vibration ratios, build the major scale from three major chords, and find the vibration
    number of any note of the scale.
  materials:
  - The book, open to these pages
  - A piano, keyboard, or a free keyboard or tuner app
  - Eight identical glass bottles or glasses and water (a bottle xylophone)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: 'A siren disk with rows of 24, 30, 36 and 48 holes plays do, mi, sol, do''; the octave (1 : 2), fifth (2 : 3), fourth (3 : 4) and major third (4
    : 5); the major chord (4 : 5 : 6); the major diatonic scale built from three major chords, with a table of relative and absolute vibration numbers (C
    = 256); standard pitches. Six problems follow.'
  steps:
  - - Hook question
    - 'Say: Why do some pairs of notes sound sweet together and others clash?'
  - - Read together
    - 'Read §§ 471–474 and study the table on book page 368. The book''s discovery:

      ~ harmonious musical intervals correspond to very simple vibration ratios, and the more harmonious the combination the simpler the ratio.'
  - - Explain the idea
    - 'do : mi : sol : do'' = 4 : 5 : 6 : 8. The octave doubles the vibrations; sol is 3/2 of do. The scale is built from three major chords: do-mi-sol,
      fa-la-do'', sol-si-re (§ 473). With C = 256: D 288, E 320, F 341, G 384, A 427, B 480, C'' 512.'
  - - 'Try it: hear the ratios'
    - On a keyboard or app, play C and the C above together (octave), then C and G (a fifth), C and E (a third), then C and C-sharp (a clash). Play the
      chord C–E–G. A tuner app will show the vibration numbers (in hertz).
  - - 'Try it: a bottle scale'
    - Fill eight bottles with different amounts of water and tap them (or blow across them) to tune a scale, checking against the keyboard. Which needs
      more water for a higher note when tapped? When blown? (Tapping sounds the glass and water; blowing sounds the air column.)
  - - What we know now
    - Today's standard pitch is A = 440 vibrations per second (fixed in 1939), a little higher than the 435 of the book's "international pitch." Pianos
      are now tuned in "equal temperament," which makes every half step the same ratio, so most intervals are very slightly off the book's simple ratios.
  - - Say it back
    - Your student explains how the three major chords give all eight notes of the scale.
  - - Problems
    - Work problems 1–6 on book page 369.
  practice: Pick out simple tunes on the bottle scale or a keyboard and listen for octaves and fifths.
  answers: 1. G′, the sol of the octave above (768). 2. G″, two octaves above that G (1536). 3. E″, two octaves above E (1280). 4. 4.5 ft. 5. 2560 vibrations
    per second (an E, E‴). 6. F 400, A 500.
- num: 56
  roman: Ch. XVIII, §§ 475–486
  idx: 404
  unit: 18
  title: Strings, overtones, quality and harmony
  mins: 45
  goal: Your student can state the laws of vibrating strings (length and tension), explain fundamentals and overtones, explain what gives a sound its quality,
    and explain discord as a matter of beats.
  materials:
  - The book, open to these pages
  - A guitar, violin or ukulele if you have one; otherwise a rubber band stretched around an open box, with a pencil as a movable bridge
  - A piano (for the sympathetic-vibration test), if available
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The sonometer; vibration numbers inversely as length and as the square root of the tension; nodes and loops in strings; fundamentals and overtones
    (harmonics); a string plucked at different points; quality set by the overtones present; manometric flames; Helmholtz's resonators; sympathetic vibrations;
    harmony and discord explained by beats. Nine problems follow, with a portrait of Helmholtz.
  steps:
  - - Hook question
    - 'Say: A piano and a trumpet play the same note. Why do they sound different?'
  - - Read together
    - 'Read §§ 475–486. The cause of quality:

      ~ the characteristic of a tone which we call its quality is determined simply by the number and prominence of the overtones which are present in the
      tone.'
  - - 'Try it: the law of lengths'
    - 'Pluck the open string (or rubber band). Press it exactly at the middle and pluck one half: an octave higher (twice the vibrations). Press at one
      third: the sol above that (three times). Tighten the string: the pitch rises (§ 476).'
  - - 'Try it: harmonics'
    - 'On a guitar or a long rubber band, touch the string very lightly (don''t press) exactly at the middle and pluck near the end: a clear, high, bell-like
      note, the first overtone (§ 479). Touch lightly at one third: the second overtone. Then pluck the open string near the end and in the middle: same
      pitch, different quality (§ 481).'
  - - Explain the idea
    - 'A string vibrates as a whole and at the same time in halves, thirds, quarters and so on. The whole gives the fundamental; the parts give overtones
      with 2, 3, 4… times the vibrations. Which overtones are strong decides the quality. Discord is beats: two notes (or their overtones) differing by
      about 30 vibrations a second sound worst (§ 486).

      What we know now: today a computer can show a sound''s overtones on a screen (a spectrum), doing electronically what Helmholtz did with his resonators.'
  - - 'Try it: sympathetic vibration'
    - 'If you have a piano, hold down the right pedal and sing a loud note into it, then stop: the strings sing it back (§ 483–484).'
  - - Say it back
    - Your student explains why piano hammers are covered with felt (§ 481).
  - - Problems
    - Work problems 1–9 on book pages 379–380. Use the scale table on page 368.
  practice: Listen to the same note played on two different instruments (or two voices) and describe the difference in quality.
  answers: '1. One fourth of the string''s length from the end (C′ is 4/3 the vibrations of G, so ¾ of the string must vibrate). 2. They are the same (half
    as many from doubling the length, twice as many from four times the tension). 3. B″, two octaves above B (5 × the vibrations of G). 4. Fourth overtone
    E″; fifth overtone G″. 5. 9 kg (vibrations in the ratio 3 : 2 need tensions in the ratio 9 : 4). 6. 2000 vibrations per second; mi two octaves above
    (mi″). 7. About 4147 (27 × 128 for seven octaves, × 6/5 for the two notes A to C). 8. Lowest note about 42 ft.; highest about 0.27 ft. (about 3.3 in.).
    9. Bowing near the end brings out many overtones and a rich tone; bowing at the middle kills the even overtones and gives a hollow sound.'
- num: 57
  roman: Ch. XVIII, §§ 487–494
  idx: 417
  unit: 18
  title: Organ pipes, wind instruments and the phonograph
  mins: 40
  goal: Your student can explain how blown pipes make notes, why an open pipe sounds an octave higher than a closed pipe of the same length, which overtones
    each can make, and how wind instruments change pitch.
  materials:
  - The book, open to these pages
  - Drinking straws and scissors (straw pipes and a straw oboe)
  - A bottle to blow across
  - A recorder, whistle, or any wind instrument you have
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A tube blown across its mouth sounds the note it resonates to; closed pipes sound a wave length four times their length, open pipes twice; closed
    pipes give only the odd harmonics; how the air jet is set swinging by reflected pulses; organ pipes, flutes, whistles, reed instruments, bugles, cornets
    and trombones; Edison's phonograph. Seven problems follow.
  steps:
  - - Hook question
    - 'Say: An organ has a separate pipe for every note. How does a flute play many notes with one tube?'
  - - Read together
    - 'Read §§ 487–494. The closed pipe:

      ~ when a current of air is suitably directed across the mouth of a closed pipe it will emit a note which has a wave length four times the length of
      the pipe.'
  - - 'Try it: pan pipes'
    - 'Cut straws to several lengths, pinch or tape one end closed, and blow across the open ends: shorter, higher. Now open a closed one and blow again:
      it jumps up about an octave (§ 488). Blow harder on a bottle or recorder until the note jumps to an overtone (§ 489).'
  - - 'Try it: a straw reed'
    - 'Flatten one end of a straw and cut it to a point, like a V. Put the point in your mouth and blow firmly: the flaps buzz like an oboe reed (§ 492).
      Snip the straw shorter while blowing and hear the pitch rise.'
  - - Explain the idea
    - 'The air jet flips in and out of the pipe, timed by pulses returning from the far end (§ 490). Closed pipe: wave length 4 × length, overtones 3, 5,
      7… times. Open pipe: wave length 2 × length, overtones 2, 3, 4… times. Flutes shorten the tube by opening holes; bugles play only overtones; trombones
      slide to change the length (§§ 491–493).

      What we know now: the phonograph (§ 494) led to records, then tapes, CDs and digital recordings; but every recording still ends at a vibrating speaker
      cone.'
  - - Say it back
    - Your student explains why the pitch rises as water is poured into a deep bottle (problem 7).
  - - Problems
    - Work problems 1–7 on book page 387.
  practice: Play a few notes on a recorder or whistle and work out the pipe's sounding length from its pitch.
  answers: '1. Inversely as the vibration numbers: 1, 8/9, 4/5, 3/4, 2/3, 3/5, 8/15, 1/2. 2. About 26.6 cm (E = 320; wave length 340 ÷ 320 = 1.06 m; one
    fourth of that). 3. No; it is higher in summer, because sound travels faster in warm air while the pipes stay nearly the same length. 4. G′, the octave
    above. 5. G′ (sol′), three times the vibrations of C. 6. By blowing differently the player brings out its several overtones. 7. The air column gets
    shorter, so its wave length is shorter and its note higher.'
- num: 58
  roman: Ch. XIX, §§ 495–501
  idx: 425
  unit: 19
  title: The speed of light, straight-line travel and shadows
  mins: 40
  goal: Your student can describe how Roemer and Michelson measured the speed of light, explain how light's straight-line travel makes shadows, and tell
    umbra from penumbra.
  materials:
  - The book, open to these pages
  - A flashlight and a small LED or a candle (with an adult)
  - A ball or orange (a small earth or moon) and a larger ball
  - A white wall or sheet of paper
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Galileo's lantern experiment; Roemer's measurement from the eclipses of Jupiter's moon (1675); Michelson's and Perrotin's modern values (about 300,000
    km per second); seeing the stars as they were long ago; light slower in water; light travels in straight lines; umbra and penumbra and eclipses. Six
    problems follow.
  steps:
  - - Hook question
    - 'Say: When you look at a star, are you seeing it as it is tonight?'
  - - Read together
    - 'Read §§ 495–501. The modern value:

      ~ For most purposes it is sufficiently accurate to take the velocity of light in round numbers as 300,000 km. per second, which is equivalent to about
      186,000 miles per second.'
  - - Explain Roemer's idea
    - 'Using Fig. 407, explain: when the earth is on the far side of its orbit, light from Jupiter''s moon has farther to travel, so its eclipses come late.
      The delay (the book''s 996 seconds) is the time for light to cross the earth''s orbit (§ 496).

      What we know now: light actually takes about 1000 seconds (about 16½ minutes) to cross the orbit. The speed of light is now exactly 299,792,458 m
      per second, because since 1983 the meter has been defined by it. Jupiter has dozens of known moons, not the seven the book mentions.'
  - - 'Try it: umbra and penumbra'
    - 'In a dark room, shine a small LED (a near-point source) past a ball onto the wall: the shadow is sharp. Use a broad light (a lamp shade or several
      LEDs) instead: a dark center (umbra) and a fuzzy edge (penumbra) appear (§ 501). Move the ball toward the light and watch the penumbra grow.'
  - - 'Try it: model an eclipse'
    - Hold a small ball (moon) between the flashlight (sun) and a larger ball (earth). Where on the earth is the moon's umbra? The penumbra? Then put the
      moon behind the earth for an eclipse of the moon (Fig. 410).
  - - Say it back
    - Your student explains why the shadow of a tree in sunlight is sharp near its base but fuzzy near the top.
  - - Problems
    - 'Work problems 1–6 on book page 392. For the umbra problems, use similar triangles: the cone narrows from the size of the sun to a point.'
  practice: Look at shadows outdoors at different times of day, and at a streetlight's shadow versus the sun's.
  tip: A tiny LED or a phone flashlight makes a good near-point source; a lamp with a frosted shade or a bright window makes a broad one.
  answers: 1. About 320,000,000,000,000 miles (54.5 years × 186,000 miles a second). 2. About 873,000 miles (8000 × 93,000,000 ÷ 852,000). 3. About 217,000
    miles. 4. No; the moon's umbra is a narrow cone that only just reaches the earth. 5. About 37 miles (the umbra's width 4000 miles from its tip). 6.
    About 102 years.
- num: 59
  roman: Ch. XIX, §§ 502–505
  idx: 429
  unit: 19
  title: How bright? The inverse square law and photometers
  mins: 35
  goal: Your student can explain why illumination falls off as the square of the distance, and compare two lights with a grease-spot (Bunsen) photometer.
  materials:
  - The book, open to these pages
  - A sheet of plain white paper and a little cooking oil or butter (for a grease spot)
  - Two flashlights or two lamps, or one bulb and a candle (with an adult)
  - A tape measure
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Light spreads over four times the area at twice the distance (the inverse square law); Rumford's shadow photometer; candle power; Bunsen's grease-spot
    photometer. Five problems follow.
  steps:
  - - Hook question
    - 'Say: If you move a reading lamp twice as far from your book, does the page get half as bright?'
  - - Read together
    - 'Read §§ 502–505. The law:

      ~ the intensity of the illumination due to a given point source must vary inversely as the square of the distance from the source.'
  - - 'Try it: a grease-spot photometer'
    - 'Rub a drop of oil into the middle of the paper. Hold it up between two lights in a dark room and look at it from one side: the spot looks dark when
      that side is brighter, light when it is dimmer. Slide the paper until the spot almost vanishes: the illumination is equal on both sides (§ 505). Measure
      the two distances. The stronger light is stronger by the square of the ratio of the distances.'
  - - Explain the idea
    - 'Light from a point spreads out like a growing sphere. At twice the distance the same light covers four times the area, so each square foot gets one
      fourth as much (Fig. 411). The same law held for sound (§ 449) and for gravity (§ 31).

      What we know now: "candle power" is now the candela, and the total light from a bulb is given in lumens; an ordinary LED bulb is about 800 lumens.'
  - - Say it back
    - Your student explains how the shadow photometer in Fig. 412 compares a gas flame with candles.
  - - Problems
    - Work problems 1–5 on book page 395.
  practice: Read the lumens on a few light bulb boxes and compare them with the watts.
  tip: Keep candles on a saucer away from paper and curtains, and have an adult present.
  answers: 1. 1.5 m. 2. About 415 candle power (32 × (36/10)²). 3. About 0.58 m from the 5-candle-power light (1.42 m from the other). 4. About 147,000
    times as strong ((92,000,000/240,000)²). 5. 36 candle power.
- num: 60
  roman: Ch. XIX, §§ 506–515
  idx: 432
  unit: 19
  title: Reflection, refraction and total reflection
  mins: 45
  goal: Your student can state the law of reflection, explain diffuse reflection and why we see objects, describe refraction toward and away from the perpendicular,
    and explain total reflection and the critical angle.
  materials:
  - The book, open to these pages
  - A small mirror and a flashlight (or a laser pointer, used carefully)
  - A clear glass or plastic tub of water with a few drops of milk stirred in (to show the beam)
  - A coin, a pencil and an opaque cup
  - A notebook and pencil
  book: Angle of incidence equals angle of reflection; diffuse reflection from rough surfaces; why nonluminous bodies are visible and mirrors are not; light
    reflects at every boundary; refraction toward the perpendicular entering a slower medium and away on leaving; total reflection and the critical angle
    (water about 48.5°); total-reflecting prisms; paths through a prism and through plate glass. Fifteen questions follow.
  steps:
  - - Hook question
    - 'Say: Why does a straw in a glass of water look broken at the surface?'
  - - Read together
    - 'Read §§ 506–515. The rule for refraction:

      ~ whenever light travels obliquely from one medium into another in which the speed is less, it is bent toward the perpendicular'
  - - 'Try it: reflection'
    - 'In a dark room, shine the flashlight at the mirror at an angle and find the reflected spot. Change the angle: the reflected beam always leaves at
      the same angle it came in (§ 506). Shine it on white paper instead: the light scatters everywhere (diffuse reflection, § 507).'
  - - 'Try it: refraction'
    - 'Put the coin in the cup and back away until the rim just hides it. Have someone pour in water slowly: the coin appears (question 7). Look at the
      pencil in a glass of water from the side (question 8). Shine the flashlight beam into the milky water at an angle and watch it bend at the surface.'
  - - 'Try it: total reflection'
    - 'Look up from below through the side of a glass of water at the water''s surface: it looks like a silver mirror. Shine the beam up toward the surface
      from below at a steep angle: beyond the critical angle no light escapes, and all of it reflects (§ 511). This is how optical fibers carry internet
      signals today.'
  - - Explain the idea
    - Light bends because it travels at different speeds in different materials (§ 510). Going into a slower medium it bends toward the perpendicular; coming
      out into a faster one it bends away. For water the critical angle is about 48.5°.
  - - Say it back
    - Your student explains why a fisherman with a spear should aim below where the fish appears (question 9).
  - - Questions
    - Work questions 1–15 on book pages 403–404; choose about eight if time is short.
  practice: 'Notice reflections and refraction this week: a pool that looks shallower than it is, a mirage on a hot road, a rainbow of light from a glass
    edge.'
  tip: Never shine a laser pointer at anyone's eyes, and never look at the Sun, directly or through any lens, mirror or prism.
  answers: 1. White walls diffuse much of the light back into the room; black walls absorb it. 2. The paint diffuses the light in all directions, so little
    of it goes to the spot; the clean mirror sends the beam straight to the wall. 3. We see only the part of it lit by the sun, and the lit part changes
    as it moves around the earth. 5. The air above us is still lit by the sun and diffuses light down to us, and the air bends the sun's rays around the
    curve of the earth. 6. Sunlight reflected from the earth to the moon and back to the earth (earthshine); with a three-quarter moon the bright part is
    far too bright to see it, and less of the lit earth faces the moon. 7. Light from the coin is bent away from the perpendicular as it leaves the water,
    so it reaches the eye over the rim. 8. Light from the part under water is bent at the surface, so that part looks raised. 9. Low, because the fish looks
    higher than it really is. 10. The air grows denser gradually toward the ground, so the ray is bent a little at a time. 11. The glass shifts the light
    sideways (§ 515), so the part seen through it looks displaced. 12. Upward, at about 41.5° from the horizon (48.5° from the vertical). 13. It reflects
    all the light (total reflection), with no tarnish and only one reflecting surface. 14. The silvering (metal) on the back of the glass. 15. The prisms
    bend the daylight entering the window so that it travels deep into the room instead of falling on the floor near the window.
- num: 61
  roman: Ch. XIX, §§ 516–527
  idx: 441
  unit: 19
  title: What is light? Waves, interference and polarization
  mins: 45
  goal: Your student can compare the corpuscular and wave theories, explain the interference bands between two glass plates, use the index of refraction,
    and explain how polarization shows light waves are transverse.
  materials:
  - The book, open to these pages
  - Two clean microscope slides or small glass panes and a strip of paper (or a soap film on a wire loop)
  - Two pairs of polarized sunglasses (or one pair and a phone or computer screen)
  - A tall glass of water and a coin
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The corpuscular theory; Huygens's wave theory and the ether; interference bands in an air wedge between glass plates; the wave length of yellow
    light (about .000589 mm); sources of light waves; why light casts sharp shadows; the bottom of a glass of water looks raised by one fourth of the depth,
    giving the ratio of speeds; index of refraction and a table; tourmaline crystals and polarization. Five questions follow, with a portrait of Huygens.
  steps:
  - - Hook question
    - 'Say: Is light made of tiny bullets or of waves? Newton and Huygens disagreed.'
  - - Read together
    - 'Read §§ 516–527. The book''s verdict:

      ~ Hence the corpuscular theory is now practically abandoned, and light is universally regarded by physicists as a form of wave motion.'
  - - 'Try it: interference colors'
    - 'Press two clean glass slides together, with a strip of paper between them at one end, and look at the reflection of a window or lamp: fine colored
      bands appear (Fig. 430). A soap film or a puddle with a film of oil shows the same thing: light reflected from the two surfaces adds in some places
      and cancels in others.'
  - - 'Try it: the raised bottom'
    - Look straight down into a tall glass of water at a coin and mark with a finger on the outside where the bottom seems to be. It looks raised by about
      a fourth of the depth (§ 523), because light travels about ¾ as fast in water. The index of refraction of water is 1.33 (§ 525).
  - - 'Try it: polarization'
    - 'Look through one pair of polarized sunglasses at a second pair and rotate one: at one angle almost no light gets through (§ 527, like the crossed
      tourmalines in Fig. 437). Or look at a phone or computer screen through polarized sunglasses and tilt your head. Light waves vibrate across their
      direction of travel (transverse), like waves on a rope through a slotted fence (Fig. 434).'
  - - What we know now
    - 'The ether does not exist. Experiments (Michelson and Morley, 1887) found no trace of it, and Einstein''s relativity (1905) showed light needs no
      medium: light is a wave of electric and magnetic fields (Chapter XXII). Twentieth-century physics also brought back part of the particle idea: light
      comes in tiny packets of energy called photons, and behaves as both a wave and a particle.'
  - - Say it back
    - Your student explains how the interference bands show that light is a wave, using Fig. 431.
  - - Questions
    - Work questions 1–5 on book page 415.
  practice: Look through polarized sunglasses at the sky in different directions, at reflections on water, and at a car's rear window. What changes?
  answers: 1. About 225,600 km per second (300,000 ÷ 1.33). 2. Toward the perpendicular, since light travels more slowly in flint glass than in water. 3.
    Less, because the wave length of light is shorter in water, so the film need not thicken as much from one band to the next. 4. Less. 5. Farther from
    the surface (higher) than he really is.
- num: 62
  roman: Ch. XX, §§ 528–537
  idx: 455
  unit: 20
  title: Images in plane and convex mirrors
  mins: 40
  goal: Your student can locate the image in a plane mirror, explain why it is reversed, and explain why a convex mirror always gives a small, upright image
    behind it.
  materials:
  - The book, open to these pages
  - A flat mirror, a ruler and paper
  - A sheet of clear glass or plastic (a picture frame glass with taped edges) and two identical candles or small toys
  - A shiny spoon (back side for a convex mirror) or a car's side mirror
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The image of a point in a plane mirror lies as far behind it as the point is in front; why the angle of reflection equals the angle of incidence;
    constructing an image; reversed images; the candle-in-water trick and the stage ghost; multiple images in an ordinary mirror; convex mirrors, their
    focal length (half the radius) and their small, erect images. Four questions follow.
  steps:
  - - Hook question
    - 'Say: When you raise your right hand in a mirror, your image raises its left. Why doesn''t the mirror also flip you upside down?'
  - - Read together
    - 'Read §§ 528–537. The rule:

      ~ the image of a point in a plane mirror lies on the perpendicular drawn from the point to the mirror, and is as far back of the mirror as the point
      is in front of it.'
  - - 'Try it: the ghost in the glass'
    - 'Stand the clear glass upright on a table. Put one toy (or unlit candle) in front of it and move an identical one behind it until it seems to sit
      exactly where the reflection is (§ 531). Measure both distances from the glass: they are equal. A lit candle in front makes a candle that seems to
      burn behind the glass (with an adult).'
  - - Explain the idea
    - Light from each point reflects so that it seems to come from a point just as far behind the mirror. Front and back are swapped, which is why writing
      looks reversed (§ 530). Draw Fig. 439 with an arrow and its image.
  - - 'Try it: convex mirrors'
    - 'Look into the back of a shiny spoon: you look small and upright, and the image stays close behind the spoon however far away you go (§ 533). A car''s
      side mirror and a store''s security mirror are convex for the same reason: they show a wide view. Point out the warning printed on many car mirrors:
      objects are closer than they appear.'
  - - Say it back
    - Your student explains why a convex mirror's image can never be farther back than its focal point.
  - - Questions
    - Work questions 1–4 on book page 419. For question 4, draw the man, the mirror and the rays from his head and feet to his eye.
  practice: 'Find convex mirrors in the world: store corners, driveways, car side mirrors, the bell of a shiny teapot.'
  answers: 1. His image lies horizontally, as though he were lying stretched out (above or in front of him), since a 45° mirror turns vertical into horizontal.
    2. 60° (each ray makes 30° with the normal). 3. 24 ft. a second. 4. The mirror must reach from halfway between his eyes and the top of his head to halfway
    between his eyes and his feet, which is half his height; his distance from the mirror does not matter.
- num: 63
  roman: Ch. XX, §§ 538–545
  idx: 462
  unit: 20
  title: 'Concave mirrors: virtual and real images'
  mins: 40
  goal: Your student can find the focal length of a concave mirror, describe the whole series of images as an object moves back from it, and tell a real
    image from a virtual one.
  materials:
  - The book, open to these pages
  - A concave mirror (a shaving or makeup mirror, or the inside of a shiny spoon)
  - A white card, a ruler or tape measure, and a small flashlight or candle (with an adult) in a dim room
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Virtual, enlarged images when the object is inside the focus; focal length is half the radius; real, inverted images when the object is outside
    the focus, shown on a screen or seen in the air; conjugate points; size of image and object; finding the focal length with a distant object and the
    center of curvature with a candle; the rose-in-a-glass illusion; the full series of images.
  steps:
  - - Hook question
    - 'Say: In a makeup mirror your face looks big and upright. Step far back and it flips upside down. Why?'
  - - Read together
    - 'Read §§ 538–545. The definition:

      ~ This image differs from all which have so far been studied in that it can be thrown upon a screen, i.e. in that light actually emanates from P''
      as a center. For this reason it is called a real image.'
  - - 'Try it: find the focal length'
    - In a room with one bright window, hold the white card in front of the concave mirror and move it until a small, sharp, upside-down picture of the
      window (or a tree outside) appears on it (§ 543). The distance from card to mirror is the focal length. (Never use the Sun's image; it can burn.)
  - - 'Try it: the series of images'
    - 'Hold a small flashlight or candle very close to the mirror and back away slowly, watching its image: upright and enlarged; then blurry at the focus;
      then upside down and in front of the mirror (catch it on the card). At twice the focal length the image is the same size and at the same place as
      the object (§ 544).'
  - - Explain the idea
    - 'A concave mirror takes curvature away from the waves (the book''s way of putting it). Inside the focus, the waves still spread and seem to come from
      behind the mirror: a virtual image. Outside the focus, the waves are made to converge to a real point in front: a real image (§§ 540–541). The image
      and object sizes are in the ratio of their distances (§ 542).'
  - - Say it back
    - Your student lists the four kinds of image from § 545 as the candle moves back from the mirror.
  practice: Look at the images in both sides of a soup spoon as you move it toward and away from your face.
  tip: The problems on mirrors and lenses come together at the end of the next lesson.
- num: 64
  roman: Ch. XX, §§ 546–551
  idx: 467
  unit: 20
  title: Lenses and the lens formula
  mins: 45
  goal: Your student can find a convex lens's focal length, describe the images it forms as an object moves, use 1/u + 1/v = 1/f with image-size ratios,
    and describe images in a concave lens.
  materials:
  - The book, open to these pages
  - A magnifying glass (convex lens)
  - A white card or wall, a ruler, and a candle or small lamp in a darkened room (with an adult)
  - A pair of glasses for nearsightedness if anyone has them (concave lenses)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: A convex lens focuses sunlight; its focal length; the series of images from a convex lens (like a concave mirror); secondary foci at twice the focal
    length; image and object sizes; virtual images in a convex lens; concave lenses; the formulas 1/v = 1/u + 1/f and 1/u + 1/v = 1/f with a worked example.
    Sixteen problems follow.
  steps:
  - - Hook question
    - 'Say: How does a magnifying glass make things look bigger, and how can the same lens throw an upside-down picture of a window onto the wall?'
  - - Read together
    - 'Read §§ 546–551. The book''s summary:

      ~ We learn, then, that a convex lens forms a series of images which is identical with the series formed by a concave mirror.'
  - - 'Try it: a lens camera'
    - 'Stand across the room from a bright window and hold the magnifying glass between the window and a white wall or card. Move it until a small, sharp,
      upside-down picture of the window appears. The lens-to-card distance is about the focal length. Then do the same with a candle or lamp across a dark
      room: move the lens to make the image larger or smaller (§ 547).

      Safety: never look at the Sun through a lens, and never point a magnifying glass at the Sun near paper, skin or anything that can burn; a lens can
      focus sunlight hot enough to start a fire.'
  - - 'Try it: the magnifier'
    - 'Hold the lens close to print: the letters look larger and upright (a virtual image, § 549). If you have glasses for nearsightedness, look through
      them at print: the letters look smaller (a concave lens, § 550).'
  - - Use the formula
    - 'For a convex lens or concave mirror: 1/u + 1/v = 1/f, where u is the object distance, v the image distance and f the focal length. Work the book''s
      example: object 200 cm, image 50 cm: 1/200 + 1/50 = 1/40, so f = 40 cm. The image is to the object as v is to u.

      (When the formula gives a negative v, the image is virtual, on the same side as the object.)'
  - - Say it back
    - Your student explains why an object at twice the focal length gives an image the same size, at the same distance on the other side.
  - - Problems
    - Work problems 1–16 on book page 432; choose about ten if time is short (try 1, 2, 9, 10, 11, 13, 14, 15 and 16).
  practice: Use the magnifying glass to look closely at a leaf, salt grains and a fingerprint. Find its focal length again and compare with your first measurement.
  tip: 'Safety: never look at the Sun through a lens, and never point a magnifying glass at the Sun near paper, skin or anything that can burn; a lens can
    focus sunlight hot enough to start a fire.'
  answers: 1. 125 ft. 2. 2.25 in. 3. Its image lies on lines drawn to the center of curvature, which close in on each other as the object moves away. 4.
    The nose is nearer the mirror than the ears, so its image is relatively larger. 5. No; its images are always virtual and erect. 6. Real when the object
    is farther away than the focal length, virtual when nearer; enlarged when it is between the focus and twice the focal length (or inside the focus),
    diminished beyond twice the focal length; inverted when real, erect when virtual. 7. Erect, virtual and smaller than the object, because the lens always
    makes the waves spread more. 8. A real image is formed where the light actually meets and can be caught on a screen; a virtual image is only where the
    light seems to come from. 9. About 28.6 cm (focal length 14.3 cm). 10. The image is 2.5 times as large as the object. 11. Real, inverted, 60 cm from
    the lens and 4 times as large. 12. If u = v, then 2/u = 1/f, so u = 2f. 13. About 27.7 in. (about 2.3 ft.). 14. 1.8 in. 15. About 31.6 cm behind the
    mirror, virtual and erect, about 0.21 times the size of the object. 16. 120 cm behind the mirror, virtual and erect, 4 times the size of the object.
- num: 65
  roman: Ch. XX, §§ 552–564
  idx: 472
  unit: 20
  title: Cameras, the eye, magnifiers, telescopes and microscopes
  mins: 45
  goal: Your student can explain the pinhole and lens camera, the projector and the eye, and find the magnifying power of a simple lens, a telescope and
    a compound microscope.
  materials:
  - The book, open to these pages
  - A shoebox or tube, aluminum foil, a pin, wax paper and tape (a pinhole camera)
  - Two magnifying glasses of different strengths (for a simple telescope)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The pin-hole camera; the photographic camera; the projecting lantern; the eye and how it focuses; apparent size and the visual angle; the distance
    of most distinct vision (25 cm); the magnifying power of a lens (25/f), an astronomical telescope (F/f) and a compound microscope (25L/Ff); the terrestrial
    telescope, opera glass, stereoscope and Zeiss binocular. Eleven questions follow.
  steps:
  - - Hook question
    - 'Say: How is your eye like a camera, and how does it focus on things near and far?'
  - - Read together
    - 'Read §§ 552–564, studying Figs. 457–466. The eye:

      ~ The eye is essentially a camera in which the cornea C (Fig. 461), the aqueous humor I, and the crystalline lens O act as one single lens which forms
      an inverted image P''Q'' on the retina'
  - - 'Try it: a pinhole camera'
    - 'Cut a hole in one end of a box and tape foil over it; prick a small pinhole. Cut out the other end and tape wax paper over it. Point the pinhole
      at a bright window or a lamp with the wax paper toward you (cover your head and the box with a dark cloth): an upside-down picture appears (§ 552).
      Try a bigger hole: brighter but blurrier.'
  - - 'Try it: a two-lens telescope'
    - 'Hold the weaker magnifying glass at arm''s length toward a distant tree or building, and the stronger one near your eye. Slide the near one back
      and forth until the view is sharp: the image is magnified and upside down, just like the astronomical telescope in Fig. 465 (magnifying power = F/f).
      Never point it at the Sun.'
  - - Explain the magnifying powers
    - 'A simple lens: 25/f (f in cm), so a 2.5 cm lens magnifies 10 times (§ 558). A telescope: focal length of the objective ÷ focal length of the eyepiece
      (§ 559). A microscope: 25 × tube length ÷ (objective focal length × eyepiece focal length) (§ 560). In inches, use 10 in. instead of 25 cm.'
  - - What we know now
    - The Yerkes 40-inch refractor (§ 559) is still the largest lens telescope ever used for astronomy, but today's great telescopes use huge mirrors, some
      over 8 m across, and the James Webb Space Telescope's mirror is 6.5 m. Most cameras now record images on electronic sensors instead of photographic
      plates.
  - - Say it back
    - Your student explains how the eye focuses on near and far objects (§ 555) and what glasses do for a shortsighted eye (question 11).
  - - Questions
    - Work questions 1–11 on book page 442.
  practice: Make the pinhole camera bigger (a large box you can put your head into) and watch the street outside on a sunny day.
  tip: 'Safety: never look at the Sun through a lens, and never point a magnifying glass at the Sun near paper, skin or anything that can burn; a lens can
    focus sunlight hot enough to start a fire.'
  answers: '1. Farther away, so the whole figure''s image is small enough to fit on the plate. 2. We judge size by taking into account how far away things
    are. 3. 40 (10 in. ÷ ¼ in.). 4. 360. 5. The 6-in. lens: the image is as much larger than the slide as the screen distance is greater than the slide
    distance, which is nearly the focal length. 6. 160 (10 × 8 ÷ (½ × 1)). 7. Its eyepiece inverts the image a second time. 8. 4. 9. Nearer to the objective.
    10. 0.16 in. 11. Concave lenses for shortsightedness, convex lenses for longsightedness.'
- num: 66
  roman: Ch. XXI, §§ 565–574
  idx: 482
  unit: 21
  title: Color and wave length; mixing colors
  mins: 45
  goal: Your student can explain that each color is a wave length, that white light is a mixture, why objects have color, the difference between mixing
    colored lights and mixing paints, and why soap films are colored.
  materials:
  - The book, open to these pages
  - A glass prism, or a glass of water on a sunny windowsill, or an old CD
  - Red, green and blue cellophane or plastic and a flashlight
  - Crayons or paints (yellow and blue)
  - A cardboard disk, markers and a pencil (a Newton color wheel)
  - Soap-bubble solution
  - A notebook and pencil
  book: Soap-film fringes in red and green light show red has the longer wave; a table of wave lengths of the colors; a prism spreads white light into a
    spectrum; the color of a body is the light it does not absorb; colors under colored light; compound colors and Newton's color disk; complementary colors;
    retinal fatigue (afterimages); mixing pigments subtracts colors; the colors of thin films. Seven questions follow.
  steps:
  - - Hook question
    - 'Say: A red apple under a pure blue light looks almost black. Where did its red go?'
  - - Read together
    - 'Read §§ 565–574. The rule for colored objects:

      ~ the color which a body has in ordinary daylight is determined by the wave lengths which the body has not the power of absorbing.'
  - - 'Try it: make a spectrum'
    - 'Set a glass prism (or a glass full of water) in a sunny window and find the band of colors on the floor or wall: red, orange, yellow, green, blue,
      violet (§ 567). A CD tilted in sunlight also spreads the colors. Never look at the Sun itself.'
  - - 'Try it: colored light'
    - 'Cover a flashlight with red cellophane and shine it on a red, a blue and a white object in a dark room: red looks bright, white looks red, blue looks
      almost black (§ 569). Now stare for 30 seconds at a bright red square and then at white paper: a greenish-blue afterimage appears (retinal fatigue,
      § 572).'
  - - 'Try it: lights versus paints'
    - 'Color a cardboard disk half yellow and half blue, push a pencil through the center and spin it like a top: the colors blend toward gray or white,
      because spinning adds the lights (§ 570–571). Now mix yellow and blue paint: green, because each paint subtracts colors (§ 573).'
  - - Explain the idea
    - 'Red waves are longest (the book''s table: red about .000068 cm), violet shortest (about .000042 cm). Soap films and oil slicks are colored because
      each wave length cancels at a different film thickness (§ 574). Blow a bubble and watch its colors swirl.

      What we know now: wave lengths of light are usually given today in nanometers: the book''s .000068 cm is 680 nm. Screens make every color by adding
      red, green and blue light; printers subtract with cyan, magenta and yellow ink.'
  - - Say it back
    - Your student explains why yellow and blue lights can make white but yellow and blue paints make green.
  - - Questions
    - Work questions 1–7 on book page 450, using the table on page 444.
  practice: 'Look closely at a phone or TV screen with a magnifying glass: you will see the tiny red, green and blue dots that make every color.'
  tip: Colored cellophane from gift wrap or candy wrappers works well; stack two layers if the color is pale.
  answers: 1. The yellow fringes (wave length .000058 cm) are closer together than the red (.000068) and farther apart than the green (.000052). 2. Nearly
    black. 3. The blue glass lets only blue light through. 4. Nearly black, since blue glass absorbs a pure yellow. 5. The blue and violet. 6. Purple (the
    red, blue and violet left over). 7. Thinner (where the film is thin the short blue waves are destroyed and red is left).
- num: 67
  roman: Ch. XXI, §§ 575–579
  idx: 490
  unit: 21
  title: Dispersion and the rainbow
  mins: 35
  goal: Your student can explain why a prism spreads colors (each travels at its own speed in glass), why lenses show colored fringes, and how raindrops
    make the primary and secondary rainbows.
  materials:
  - The book, open to these pages
  - A garden hose with a fine spray nozzle (on a sunny day), or a clear round glass bowl or jar of water
  - A magnifying glass and a white card
  - A notebook and pencil
  book: Violet bends most because it travels slowest in glass; chromatic aberration of lenses; achromatic lenses of crown and flint glass; the rainbow made
    by refraction and reflection in drops (red at 42°, violet at 40°); the secondary bow with its colors reversed. Four questions follow.
  steps:
  - - Hook question
    - 'Say: Why is a rainbow always a circle around the point directly opposite the sun?'
  - - Read together
    - 'Read §§ 575–579. Why colors separate:

      ~ Since, therefore, the blue light was bent more than the red, it follows that the speed of blue light in glass must be less than that of red light.'
  - - 'Try it: make a rainbow'
    - 'On a sunny morning or late afternoon, stand with your back to the sun and spray a fine mist from the hose: a rainbow appears in the spray. Notice
      red is on the outside, violet inside (§ 578). Look for a fainter second bow outside it, with colors reversed (§ 579). (Indoors: shine a flashlight
      through a round glass of water onto a wall.)'
  - - 'Try it: colored fringes'
    - 'Use the magnifying glass to throw an image of a bright window onto a card. Move the card a little closer and then a little farther: the edges of
      the image show red and blue fringes (chromatic aberration, § 576).'
  - - Explain the idea
    - In glass or water, violet slows more than red, so it bends more. In a raindrop, light is bent going in, reflected inside, and bent coming out; red
      leaves at about 42° from the line to the sun, violet at about 40°. So all the drops that send you red lie on a circle 42° around the point opposite
      the sun. Good lenses pair crown and flint glass to cancel the color fringes (§ 577).
  - - Say it back
    - Your student explains why you never see a rainbow at noon in summer (question 3).
  - - Questions
    - Work questions 1–4 on book page 454.
  practice: Watch for rainbows in sprinklers, waterfalls and the spray of waves, and check that the sun is always behind you.
  tip: Never look straight at the Sun while hunting for rainbows.
  answers: 1. In the west, opposite the morning sun. 2. Lower at 4 o'clock, since the sun is higher then and the bow is always directly opposite it. 3.
    When the sun is more than 42° above the horizon the whole bow lies below the horizon. 4. In the middle the overlapping colored images of neighboring
    parts of the paper mix back to white; only at the edges is one color left uncovered.
- num: 68
  roman: Ch. XXI, §§ 580–586
  idx: 493
  unit: 21
  title: 'Spectra: what light tells us about the stars'
  mins: 40
  goal: Your student can tell a continuous spectrum from a bright-line spectrum, explain spectrum analysis and the dark Fraunhofer lines in sunlight, and
    explain how the Doppler effect reveals the motion of stars.
  materials:
  - The book, open to these pages
  - An old CD or DVD (a homemade spectroscope), a cardboard tube or box, tape, and two razor-thin edges of card to make a slit
  - 'Different lights to look at: an old-style incandescent bulb, an LED bulb, a fluorescent tube, a streetlight (from a distance)'
  - A notebook and pencil
  book: Hot solids and liquids give continuous spectra; glowing gases give bright lines (sodium, lithium, calcium, strontium); spectrum analysis and new
    elements; absorption spectra; the solar spectrum and Fraunhofer lines; sodium and iron in the sun; helium found first in the sun; Doppler's principle
    for light and the speeds of stars. Five questions follow.
  steps:
  - - Hook question
    - 'Say: How can anyone know what the sun is made of without going there?'
  - - Read together
    - 'Read §§ 580–586. The key rule:

      ~ every gas or vapor will absorb exactly those wave lengths which it itself is capable of emitting when incandescent.'
  - - 'Try it: a CD spectroscope'
    - 'Make a narrow slit in one end of a box or tube and tape a piece of CD (or hold the CD at an angle) at the other end; look at the slit''s rainbow
      reflected in the CD. Point it at an incandescent bulb: a smooth, continuous rainbow (§ 580). Point it at a fluorescent tube: separate bright lines
      (mostly from mercury vapor). Compare an LED bulb and a yellow sodium streetlight if you have one. Never point it at the Sun.'
  - - 'Watch only: flame tests'
    - 'Watch only: don''t try this at home. The book''s flame tests (§ 581) and burning sodium (§ 585) need a laboratory burner and reactive chemicals (sodium
      metal can burst into flame on contact with water). Look up a video of a teacher''s "flame test" demonstration: each salt colors the flame differently
      (sodium yellow, lithium and strontium red, copper green), which is how fireworks get their colors.'
  - - Explain the idea
    - 'Each element gives its own set of lines, like a fingerprint (§ 582). Cooler gas in front of a hot source takes out exactly those lines, leaving dark
      gaps: the Fraunhofer lines in sunlight (§ 585). That is how sodium, iron and other elements were found in the sun, and how helium was discovered there
      before it was found on earth. If a star moves toward us its lines shift toward violet; away, toward red (§ 586).

      What we know now: the shift of light toward the red from distant galaxies showed in the 1920s that the universe is expanding. Spectra also show the
      sun is mostly hydrogen and helium.'
  - - Say it back
    - Your student explains why the dark line in the yellow of the sun's spectrum shows there is sodium in the sun.
  - - Questions
    - Work questions 1–5 on book page 460.
  practice: Use your spectroscope on every kind of light you can find this week and sketch what each one shows.
  tip: Inexpensive diffraction-grating glasses or cards, sold for science classes, work even better than a CD. Never point any spectroscope at the Sun.
  answers: 1. There is a dark line in the solar spectrum exactly where sodium's bright yellow line falls, and sodium vapor darkens that same line. 2. The
    same as sunlight's, with the same dark lines, since moonlight is reflected sunlight. 3. Hold the mixture in a colorless Bunsen flame before the slit,
    look through the prism, and see whether calcium's green and red lines appear. 4. The molecules of a gas are free and vibrate at their own natural rates,
    like tuning forks; the crowded, jostling particles of a solid vibrate at all rates. 5. A wide slit, or a blurred image, makes the colored images of
    the slit overlap and cover the dark lines.
- num: 69
  roman: Ch. XXII, §§ 587–593
  idx: 500
  unit: 22
  title: 'Invisible light: infra-red and ultra-violet'
  mins: 40
  goal: Your student can show that the sun gives out invisible rays beyond both ends of the spectrum, explain that good absorbers are good radiators, and
    explain fluorescence.
  materials:
  - The book, open to these pages
  - A glass prism (or a mirror in a pan of water), a sheet of white paper, and three thermometers with bulbs blackened with a marker
  - A TV remote control and a phone camera
  - Tonic water (contains quinine) and an ultraviolet "black light" flashlight if you have one
  - A black and a white piece of cloth or paper
  - A notebook and pencil
  book: The radiometer; infra-red rays beyond the red, reflected and focused like light; water absorbs them but some liquids pass them; ultra-violet rays
    beyond the violet, found with photographic plates; the sun's spectrum is far longer than what we see; bodies glow red at about 525° C and white at 800–1200°
    C; good absorbers are good radiators; fluorescence. Seven questions follow.
  steps:
  - - Hook question
    - 'Say: Is there light that our eyes cannot see?'
  - - Read together
    - 'Read §§ 587–593. The book''s conclusion:

      ~ The sun''s spectrum is therefore at least ten times as long, measured by wave lengths, as is the part which we see.'
  - - 'Try it: Herschel''s experiment'
    - 'In bright sun, use the prism to throw a spectrum onto white paper in a box (shade the paper). Put one blackened thermometer in the blue, one in the
      red, and one just beyond the red where you see no color. After 5 minutes, the one beyond the red often reads highest: invisible infra-red rays (§
      588). Keep a third thermometer in the shade for comparison.'
  - - 'Try it: see the invisible'
    - 'Point a TV remote at a phone camera and press a button: the camera shows a flashing light your eyes cannot see. The remote sends infra-red.

      If you have a black light, shine it on tonic water in a dark room: it glows blue (the quinine fluoresces, as § 593 describes). Don''t look into the
      black light''s bulb.'
  - - Explain the idea
    - 'Light is only a small band of a much wider family of waves. Longer than red: infra-red, which we feel as heat. Shorter than violet: ultra-violet,
      which causes sunburn and makes some things fluoresce. Dull black surfaces absorb and radiate well; shiny surfaces reflect and radiate poorly (§ 592).
      Set the black and white cloths in the sun and feel which grows warmer.'
  - - What we know now
    - Herschel discovered infra-red in 1800 with thermometers and a prism, much as you just did. Today we know these are electromagnetic waves (no ether
      is needed), and infra-red cameras, TV remotes and sunscreen (which blocks ultra-violet) all depend on them.
  - - Say it back
    - Your student explains how a greenhouse (the book's "hotbed") stays warm (question 4).
  - - Questions
    - Work questions 1–7 on book page 465.
  practice: 'Wear sunscreen and sunglasses in bright sun: both block ultra-violet. Find which things in your house have shiny surfaces to keep heat in (a
    thermos, an emergency blanket).'
  tip: Never look at the Sun, even through a prism, and don't stare into an ultraviolet lamp.
  answers: 1. By radiation. 2. The thin air absorbs little of the sun's radiation and so is warmed very little; the ground absorbs it and warms the air
    near it. 3. The blue and violet. 4. Glass lets in the sun's light, which warms the soil; the warm soil sends out long infra-red rays, which the glass
    will not let out. 5. A white hat. 6. In a tarnished one; a dull surface is a better radiator. 7. The white-hot iron.
- num: 70
  roman: Ch. XXII, §§ 594–598
  idx: 505
  unit: 22
  title: Electric waves and wireless telegraphy
  mins: 35
  goal: Your student can explain how electric oscillations send out waves that travel at the speed of light, how early wireless telegraphy worked, and why
    light is now seen as an electro-magnetic wave.
  materials:
  - The book, open to these pages
  - An AM radio (or a phone radio app will not work; it needs a real AM radio)
  - An AA battery and a short piece of wire
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Two Leyden-jar circuits tuned alike respond to each other; the discharge is oscillatory; Hertz's discovery (1888) that electrical oscillations send
    out waves at the speed of light; the coherer; Marconi-style wireless telegraphy with an induction coil and aerial; Maxwell's electro-magnetic theory
    of light.
  steps:
  - - Hook question
    - 'Say: How can a message travel through the air with no wire at all?'
  - - Read together
    - 'Read §§ 594–598. The conclusion:

      ~ Hence modern physics regards light as an electro-magnetic phenomenon'
  - - 'Try it: make a radio wave'
    - Tune an AM radio between stations. Hold it next to an AA battery and quickly brush a wire across the battery's two ends (for just an instant; it gets
      warm if held). Each tiny spark makes a crackle in the radio. Like the book's spark gap (§ 597), the spark sends out electric waves that the radio
      picks up.
  - - 'Watch only: Leyden jars and induction coils'
    - 'Watch only: don''t try this at home. The book''s experiments (§§ 594–597) use charged Leyden jars, static machines and induction coils, all of which
      give dangerous high-voltage shocks. Look up a video of a "spark-gap transmitter" or "Hertz experiment" demonstration.'
  - - Explain the idea
    - 'A Leyden jar''s spark actually surges back and forth millions of times a second (§ 594). These oscillations send waves outward at the speed of light:
      wave length = speed ÷ vibrations per second (§ 595). Maxwell predicted them in 1864 and Hertz found them in 1888, showing that light itself is an
      electric and magnetic wave of very short wave length (§ 598).'
  - - What we know now
    - Wireless telegraphy grew into radio, television, radar, Wi-Fi, Bluetooth and cell phones; every one uses the electro-magnetic waves Hertz found. The
      SI unit of vibrations per second, the hertz (Hz), is named after him. The coherer was soon replaced by better detectors.
  - - Say it back
    - 'Your student works out the book''s example: 10,000,000 oscillations a second at 300,000,000 m per second gives a wave length of 30 m.'
  practice: Find the frequencies on a radio dial (AM in kilohertz, FM in megahertz) and work out the wave length of one station.
- num: 71
  roman: Ch. XXII, §§ 599–607
  idx: 509
  unit: 22
  title: Cathode rays, the electron, and X rays
  mins: 40
  goal: Your student can describe cathode rays and the evidence that they are tiny negative particles (electrons), describe X rays and their discovery,
    and compare the 1906 picture of the atom with what we know now.
  materials:
  - The book, open to these pages
  - A strong magnet (to show, by a video or a description, how it bends cathode rays)
  - A dental or medical X-ray picture if your family has one
  - A notebook and pencil
  book: Electric discharges in partial vacua (Geissler tubes); cathode rays at very low pressure, their heating effect and sharp shadows; their deflection
    by a magnet and by charges shows they are negative particles; their mass about 1/2000 of a hydrogen atom and speeds up to a third of light's; J. J.
    Thomson's electron theory of the atom; Röntgen's discovery of X rays (1895); X rays make gases conduct; X-ray pictures. Portraits of Röntgen and J.
    J. Thomson.
  steps:
  - - Hook question
    - 'Say: What is an atom made of? In 1906 that was one of the newest questions in physics.'
  - - Read together
    - 'Read §§ 599–607. The book''s careful verdict:

      ~ This theory undoubtedly contains many germs of truth. As yet, however, it is in the formative stage'
  - - 'Watch only: vacuum tubes and X rays'
    - 'Watch only: don''t try this at home. Cathode-ray tubes and X-ray tubes need very high voltages, and X rays are harmful (§§ 599–607). Look up a video
      of a teacher''s "Crookes tube" or "Maltese cross tube" demonstration and of a cathode-ray beam bent by a magnet.'
  - - Explain the idea
    - 'At very low pressure, invisible rays stream from the negative terminal. A magnet bends them the way it would bend a stream of negative charges (§
      601). Thomson showed (1897) that they are particles about 2000 times lighter than a hydrogen atom: electrons. Röntgen found (1895) that where cathode
      rays strike glass or metal they produce X rays, which pass through flesh but not bone (§ 607).'
  - - What we know now
    - The electron theory has been completely confirmed. But the details have changed. A hydrogen atom has just one electron (not about 2000 as § 603 suggests);
      almost all of an atom's mass is in a tiny nucleus, found by Rutherford in 1911, made of protons and neutrons. X rays are electro-magnetic waves like
      light, only with far shorter wave lengths. Doctors now use X rays at very low, carefully limited doses.
  - - Say it back
    - Your student explains the evidence that cathode rays are made of negatively charged particles and not of light.
  - - Look at an X-ray picture
    - If you have a dental or medical X-ray, look at what shows white (bones, teeth, metal fillings) and dark (soft tissue). Discuss why bones stop more
      X rays than flesh.
  practice: Read about J. J. Thomson and Ernest Rutherford in an encyclopedia, and draw the 1906 "solar system" atom next to a modern picture of the atom.
- num: 72
  roman: Ch. XXII, §§ 608–614
  idx: 517
  unit: 22
  title: Radio-activity and the energy in atoms
  mins: 40
  goal: Your student can tell the story of Becquerel's and the Curies' discoveries, describe alpha, beta and gamma rays, explain that radio-active atoms
    change into other elements, and compare the book's predictions with what came after.
  materials:
  - The book, open to these pages
  - Paper and pencil for a timeline (1895–today)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Becquerel's uranium rays (1896); Madame Curie's discovery of radio-active thorium and of radium in pitchblende; alpha, beta and gamma rays (Rutherford);
    the spinthariscope; Rutherford's theory that radio-active atoms are breaking down; helium produced from radium; the slow decay and birth of radium;
    the enormous energy stored in atoms, and the closing question whether man can ever use it.
  steps:
  - - Hook question
    - 'Say: The book ends with a question: could people ever use the energy locked inside atoms? What do you think happened?'
  - - Read together
    - 'Read §§ 608–614, including the last paragraph. The book''s final question:

      ~ Is it possible for man to gain control of this tremendous store of subatomic energy and to use it for his own ends?'
  - - 'Watch only: radio-active materials'
    - 'Watch only: never handle radio-active materials. Radium, uranium ore (pitchblende) and old radium-painted watch dials are dangerous; radium cost
      the health of many people in the early 1900s, including workers who painted glowing dials. Look up a video of a cloud chamber, where you can safely
      see the tracks of alpha and beta particles.'
  - - Explain the idea
    - 'Some heavy atoms are unstable. Now and then one breaks apart and shoots out a particle: alpha (positive, stopped by thin foil), beta (electrons),
      or gamma rays (very penetrating, § 610). What is left is a different element (§ 612). Each atom releases enormous energy, far more than burning coal
      (§ 614).'
  - - What we know now
    - 'Several of the book''s guesses have been corrected. An alpha particle is a helium nucleus, about four times as heavy as a hydrogen atom (not twice).
      Radium''s half-life is about 1600 years (the book estimates 1280). Gamma rays come from the nucleus itself. The earth is about 4.5 billion years old,
      which radio-active dating helped show. And the book''s question was answered: in 1942 the first nuclear reactor ran in Chicago, where Millikan and
      Gale taught; nuclear power plants and nuclear weapons followed. The sun is powered by nuclear fusion, as § 614 guessed.'
  - - Make a timeline
    - 'Together, put these on a timeline: Röntgen''s X rays 1895, Becquerel 1896, Thomson''s electron 1897, the Curies'' radium 1898, Rutherford''s alpha,
      beta and gamma rays (1899–1903), this book 1906, Rutherford''s nucleus 1911, the first reactor 1942.'
  - - Say it back
    - Your student explains why radium must be continually forming if it decays (§ 613).
  - - Wrap up the course
    - Look back at the table of contents together. Ask your student which chapter was most surprising, and which experiment they would like to repeat.
  practice: Read a short biography of Marie Curie, the first person to win two Nobel Prizes.
