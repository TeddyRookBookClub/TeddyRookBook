lessons:
- num: 1
  roman: Ch. I, §§ 1–11
  idx: 14
  unit: 1
  title: Why the metric system? Length, mass and time
  mins: 40
  goal: Your student can explain why the metric system was invented, name the meter, liter, gram and second, and convert between inches, centimeters, pounds
    and kilograms.
  materials:
  - The book, open to these pages
  - A ruler or tape measure marked in both inches and centimeters
  - A kitchen scale (grams if possible)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: 'The opening of the book: old units of length taken from the human foot and arm, the French Revolution and the metric system, the standard meter
    and kilogram kept in Paris, prefixes, a conversion table, and the three fundamental units (centimeter, gram, second). Seven problems follow.'
  steps:
  - - Hook question
    - 'Say: If everyone''s foot is a different size, how could "a foot" ever be a fair measure?

      Let your student guess. Then measure both of your feet in inches and compare.'
  - - Read together
    - 'Read §§ 1–11 aloud, taking turns by paragraph. Stop at the list of old feet in § 1 (Greek, Macedonian, Roman) and enjoy how different they were.

      The book''s own reason for the metric system:

      ~ every unit of length, area, volume, or mass is connected with the unit of next higher denomination by an invariable multiplier, and that the simplest
      possible multiplier, — namely, ten.'
  - - Explain the idea
    - 'In the old English system, 12 inches make a foot, 3 feet a yard and 5½ yards a rod: no pattern. In the metric system, every step is a factor of ten.
      The book says three relations should be memorized: 1 in. = 2.54 cm, 1 m = 39.37 in., and 1 kg = 2.2 lb.

      Scientists reduce every measurement to just three kinds: length, mass and time. The book calls this the C.G.S. system (centimeter, gram, second).'
  - - 'Try it: measure in two systems'
    - 'Measure a book, a table and your student''s height in both inches and centimeters. Check: does inches × 2.54 give the centimeters?

      Weigh a few things on the kitchen scale (a bag of flour, an apple). If the scale shows grams, change to kilograms (divide by 1000) and then to pounds
      (multiply by 2.2).'
  - - What we know now
    - Today's system is called SI. It uses the meter, kilogram and second (not the centimeter and gram), and the units are no longer defined by metal bars
      in Paris. Since 1983 the meter has been defined by the speed of light, and since 2019 the kilogram by a fixed constant of nature (Planck's constant).
      The second is now defined by the vibrations of cesium atoms, not by the length of a day.
  - - Say it back
    - 'Your student closes the book and explains: Why was the metric system invented? What are the three fundamental units? Why is ten the best multiplier?'
  - - Problems
    - 'Work the problems at the end of § 11 (book page 6–7) in the notebook, showing the conversion used. Problem 7 is a good challenge: change the gallons
      to cubic inches first.'
  practice: Find three packages in the kitchen that show both metric and English units. Check one conversion with the book's table.
  tip: Write 1 in. = 2.54 cm, 1 m = 39.37 in. and 1 kg = 2.2 lb on a card and keep it in the book. The problems use them all year.
  answers: 1. About 1099 ft. 2. About 16.08 ft. 3. About 72.7 kg (160 ÷ 2.2). 4. 3⅓ lb, about 1.51 kg. 5. 5,000,000 mm; 3 mi = 190,080 in. 6. About 146.9
    square rods (40,000 sq. ft ÷ 272¼); 90,000 square meters. 7. About 50.1 in. deep (346,500 cu. in. ÷ 6912 sq. in.); 1 m deep (6 cu. m ÷ 6 sq. m).
- num: 2
  roman: Ch. I, §§ 12–19
  idx: 20
  unit: 1
  title: Weighing, and the meaning of density
  mins: 45
  goal: Your student can define density as mass per cubic centimeter, use M = V × D, and find the density of a real object at home.
  materials:
  - The book, open to these pages
  - A kitchen scale that reads grams
  - A measuring cup marked in milliliters (1 mL = 1 cc)
  - 'A few small solid objects: a stone, a potato, a block of wood, a bar of soap'
  - A ruler
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: 'How meter sticks and sets of weights are copied from the standards, weighing by substitution, then density: tables of densities of liquids and
    solids, the formula M = V × D, and the difference between density and specific gravity. Twelve problems follow.'
  steps:
  - - Hook question
    - 'Say: Which is heavier, a pound of feathers or a pound of lead?

      Both weigh a pound, of course. But a cup of lead is far heavier than a cup of feathers. That difference is what this lesson names.'
  - - Read together
    - 'Read §§ 12–19. In § 16 notice the careful "method of substitution" for weighing. The key definition:

      ~ The term "density" is therefore introduced to denote the mass of unit volume of a substance.'
  - - Explain the idea
    - 'Density is how many grams one cubic centimeter of a substance has. Water: 1 g per cc. Iron: about 7.4. The book''s equation is M = V × D, or D =
      M ÷ V.

      Work the book''s example together: a cast-iron block 3 cm × 8 cm × 1 cm has 24 cc and weighs 177.6 g, so its density is 177.6 ÷ 24 = 7.4.

      Specific gravity is how many times heavier a thing is than the same volume of water. In grams and cubic centimeters it is the same number as the density.'
  - - 'Try it: find a density'
    - 'Pick a stone or potato. Weigh it in grams. To find its volume, fill the measuring cup partway with water, read the level, drop the object in (push
      a floater under with a toothpick) and read again. The rise in milliliters is its volume in cc.

      Divide grams by cc. Does it sink? Then its density should be more than 1. A block of wood measured with a ruler (length × width × height) works too.'
  - - Look at the table
    - 'Find gold, lead, cork and mercury in the table on book page 9–10. Ask: How many times heavier than water is gold? Why would cork float?'
  - - Say it back
    - Your student explains in their own words what density means, and how they measured it today.
  - - Problems
    - Work several of the twelve problems on book page 11. Problems 10–12 need the area of a circle (πr²) and are good algebra practice. Use the table values
      printed in the book.
  practice: Find the density of two more objects this week and add them to a little table in the notebook.
  tip: Milliliters and cubic centimeters are the same volume. Most kitchen measuring cups are marked in mL, which makes this lab easy.
  answers: 'Using the book''s table (zinc 7.15, gold 19.3, pine .5, lead 11.3, platinum 21.5, alcohol .79, mercury 13.6): 1. 336 g. 2. 0.5 g per cc. 3.
    13,600 g = 13.6 kg. 4. About 5.6 cc. 5. No: 8000 cc of gold weighs 154,400 g, about 154 kg (roughly 340 lb). 6. 160 cc. 7. About 5.9 metric tons (volume
    4/3 π × 50³ ≈ 523,600 cc). 8. About 2.12 liters. 9. About 7.8 g per cc. 10. About 14.2 cm (1266 cc of alcohol ÷ 8 cm = 158.2 sq. cm). 11. About 0.061
    cm (0.4 g of mercury fills 0.0294 cc). 12. About 113 cm.'
- num: 3
  roman: Ch. II, §§ 20–30
  idx: 25
  unit: 2
  title: Measuring force; adding and resolving forces
  mins: 45
  goal: Your student can tell a gram of mass from a gram of force, draw forces as arrows, find a resultant with a parallelogram, and find the force needed
    to hold something on a ramp.
  materials:
  - The book, open to these pages
  - A rubber band or spring and a ruler (a homemade spring balance)
  - Two luggage scales or spring scales if you have them (optional)
  - A board for a ramp and a toy car
  - Graph paper, ruler and protractor
  - A notebook and pencil
  book: The gram of force and the spring balance; forces drawn as lines; the resultant of two forces and the parallelogram law, tested with two spring balances;
    components of a force; the component of weight along an inclined plane; why a pendulum bob comes to rest under its support. Six problems follow.
  steps:
  - - Hook question
    - 'Say: If you pull a wagon east and your friend pulls it north, which way does it go?'
  - - Read together
    - 'Read §§ 20–30. The book is careful to keep two ideas apart:

      ~ the amount of matter in a body is always the same, no matter where the body is in the universe, while the pull of the earth upon that amount of
      matter decreases as we recede from the earth''s surface.'
  - - Explain the idea
    - 'A force has a size and a direction, so we draw it as an arrow of the right length. Two forces at an angle add up to the diagonal of the parallelogram
      they make (§ 25).

      Going the other way, any force can be split into components (§§ 27–28). On a ramp, the part of the weight pulling down the slope is weight × height
      ÷ length (§ 29).'
  - - 'Try it: a homemade spring balance'
    - 'Hang a rubber band from a hook and tape a ruler beside it. Hang a bag with 1, 2, 3 identical cans or water bottles and mark the stretch each time.
      That is the book''s spring balance in § 21.

      Then put a toy car on a ramp and pull it gently up the slope with the band. Raise the ramp and see the stretch grow, just as § 29 predicts.'
  - - Draw a parallelogram
    - 'On graph paper draw 10 squares east and 15 squares north from one point (the book''s example in § 23). Complete the parallelogram and measure the
      diagonal. Check it with the Pythagorean theorem: √(10² + 15²) ≈ 18.0.'
  - - What we know now
    - The "gram of force" is no longer used. Today force is measured in newtons (N). The pull of the earth on 1 kilogram is about 9.8 N, so the book's "gram
      of force" is about 0.0098 N.
  - - Say it back
    - Your student explains why a pendulum can only rest straight under its support, using the idea of components.
  - - Problems
    - Work problems 1–6 on book page 20. Draw a diagram for each one.
  practice: Find inclined planes this week (a wheelchair ramp, a slide, a road up a hill). Estimate height ÷ length for each.
  tip: SE and SW are at right angles, so problem 1 is a right-triangle problem.
  answers: '1. About 32 lb, a little west of due south (about 6° west of south). 2. 12 mi./hr = 17.6 ft./sec. Upstream: 12.6 ft./sec, about 8.6 mi./hr;
    downstream: 22.6 ft./sec, about 15.4 mi./hr. 3. About 19.2 mi., in a direction about 51° south of east. 4. 40 lb. 5. 5 lb. 6. 14 ft.'
- num: 4
  roman: Ch. II, §§ 31–37
  idx: 33
  unit: 2
  title: Gravitation, center of gravity and balance
  mins: 40
  goal: Your student can state Newton's law of gravitation, find the center of gravity of a flat shape with a plumb line, and tell stable, unstable and
    neutral equilibrium apart.
  materials:
  - The book, open to these pages
  - A piece of stiff cardboard cut into an irregular shape
  - A pushpin, string and a small weight (a washer or key) for a plumb line
  - A pencil and two table forks or butter knives (for problem 4)
  - An egg, a ball and a cone (an ice-cream cone or paper cone)
  - A notebook and pencil
  book: Newton's law of universal gravitation and how weight changes with height above the earth; the center of gravity and two ways to find it; stable,
    neutral and unstable equilibrium. Five questions follow.
  steps:
  - - Hook question
    - 'Say: Why doesn''t the Moon fall down? And why does a tall truck tip over more easily than a sports car?'
  - - Read together
    - 'Read §§ 31–37, including the short life of Newton under his portrait. Newton''s law in the book''s words:

      ~ Any two bodies in the universe attract each other with a force which is directly proportional to the product of the masses and inversely proportional
      to the square of the distance between them.'
  - - Explain the idea
    - '"Inversely as the square" means: twice as far, one fourth the pull; three times as far, one ninth. The earth''s radius is about 4000 miles, so 4000
      miles up (twice as far from the center) you would weigh one fourth as much.

      The center of gravity is the one point where the whole weight seems to act. A body is stable if tipping it raises its center of gravity.'
  - - 'Try it: find a center of gravity'
    - 'Make the hole near the edge of the cardboard and hang it from the pushpin with the plumb line beside it. Draw a line along the string. Hang it from
      a second hole and draw again. The lines cross at the center of gravity. Check: does the cardboard balance on a pencil point there?'
  - - 'Try it: three kinds of equilibrium'
    - 'Lay an egg on its side, then try to stand it on end. Roll a ball. Stand a cone on its base, its point and its side. For each, ask: does a little
      push raise, lower, or not change the center of gravity?'
  - - Say it back
    - Your student explains the three kinds of equilibrium using one example of each, without the book.
  - - Questions
    - Work questions 1–5 on book page 25. For question 4, try it with a pencil and two forks stuck in at an angle so their handles hang below your fingertip.
  practice: 'Notice how people carry heavy loads: leaning away from a heavy suitcase, leaning forward up a hill. Where is their center of gravity?'
  tip: Kids love the balancing-forks trick. Two forks pushed into a cork with a toothpick through it will balance on the rim of a glass.
  answers: 1. 25 kg at 4000 mi. up (twice as far from the center); 64 kg at 1000 mi. up (100 × (4/5)²); about 99.85 kg at 3 mi. up. 2. Ballast lowers the
    ship's center of gravity so it is more stable. 3. The heavy weight is in the rounded bottom; tipping the toy over would raise its center of gravity,
    so it rolls back upright. The center of gravity does not rise; it falls as the toy rights itself. 4. The knives hang below the fingertip and bring the
    center of gravity below the point of support. 5. To keep the vertical line through his center of gravity over his feet.
- num: 5
  roman: Ch. II, §§ 38–48
  idx: 40
  unit: 2
  title: Falling bodies and accelerated motion
  mins: 45
  goal: Your student can define velocity and acceleration, use v = at and S = ½at² for falling bodies, and explain Galileo's ramp and tower experiments.
  materials:
  - The book, open to these pages
  - A long board or plastic rain gutter for a ramp, propped up a few inches at one end
  - A marble or small ball
  - A stopwatch or phone timer; a metronome app if you have one
  - Tape measure and masking tape
  - A coin and a small piece of paper
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Uniform motion, velocity and acceleration; Galileo's grooved-board experiment timed with a metronome; the table of falling bodies (distances 1,
    4, 9, 16 …); the formulas v = at, s = ½a(2t − 1), S = ½at²; the acceleration of gravity (980 cm per sec per sec); the leaning tower of Pisa and the
    feather-and-coin tube; and the height reached by a body thrown upward. Eleven problems follow.
  steps:
  - - Hook question
    - 'Say: If a ball rolls 10 cm in the first second down a ramp, how far will it roll in 2 seconds? Most people guess 20 cm. Galileo found something surprising.'
  - - Read together
    - 'Read §§ 38–48. Galileo''s discovery:

      ~ He found that a body falls exactly 4 times as far in 2 seconds as in 1, 9 times as far in 3 seconds, 16 times as far in 4 seconds'
  - - 'Try it: Galileo''s ramp'
    - 'Prop the board or gutter so it rises only a few inches over its whole length. Let the marble go at a beat of the metronome (or say "tick" every second).
      Put tape where it is after 1 second, then after 2 and 3 seconds. Measure from the start.

      The distances should be roughly 1 : 4 : 9. It takes a few tries; slow ramps work best.'
  - - Explain the formulas
    - 'Acceleration is the velocity gained each second. For anything falling freely, a = 980 cm per second each second (about 32 ft). In SI units that is
      9.8 m/s².

      v = at (speed after t seconds); S = ½at² (distance in t seconds); and the book shows v = √(2gS) for a body falling from height S. Work the example
      in § 44 together: a ball that rolls 10 cm in the first second has a = 20, and after 10 seconds has gone ½ × 20 × 100 = 1000 cm.'
  - - 'Try it: feather and coin'
    - 'Drop a coin and a flat sheet of paper together: the coin wins. Now crumple the paper into a tight ball and try again. Then lay a small flat piece
      of paper on top of the coin and drop them together. The paper stays with the coin, because the coin keeps the air off it. This shows what the vacuum
      tube in § 46 shows.'
  - - Say it back
    - Your student explains what Galileo proved at Pisa and why a feather falls slowly in air.
  - - Problems
    - Work problems 1–11 on book pages 31–32. Use g = 980 cm/sec² (or 32.16 ft/sec² when the problem is in feet).
  practice: 'Drop a ball from a table and from twice the height. Does it take twice as long? (No: about 1.4 times as long.)'
  tip: Historians debate whether Galileo really dropped balls from the tower at Pisa; the ramp experiments are well recorded.
  answers: 1. About 11.4 sec. 2. 176 sec (2 min 56 sec). 3. 49,000 cm = 490 m. 4. 7840 cm/sec. 5. 4410 cm (½ × 980 × 9). 6. 122.5 cm. 7. 14,000 cm/sec =
    140 m/sec. 8. About 459,000 cm, roughly 4590 m. 9. About 189 ft./sec (√(2 × 32.16 × 555)). 10. About 167 cm/sec. 11. The acceleration down the plane
    is 80 cm/sec², and it equals g × 40.8/500, so g ≈ 980 cm/sec².
- num: 6
  roman: Ch. II, §§ 49–56
  idx: 47
  unit: 2
  title: Newton's three laws of motion
  mins: 45
  goal: Your student can state Newton's three laws, explain inertia and momentum, and use F = ma with dynes (and newtons).
  materials:
  - The book, open to these pages
  - A playing card and a coin on top of a glass (inertia trick)
  - Two balls of equal size (for collisions)
  - A balloon
  - A string and a book (for problem 5)
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: Newton's first law (inertia) and centrifugal force; momentum; the second law, tested on the grooved board; the dyne and why a gram of force is 980
    dynes; F = ma; the third law (action and reaction) with the swinging steel balls. Thirteen questions and problems follow.
  steps:
  - - Hook question
    - 'Say: When a bus stops suddenly, why do the passengers lurch forward? Nobody pushed them.'
  - - Read together
    - 'Read §§ 49–56. The first law in Newton''s words as the book gives them:

      ~ Every body continues in its state of rest or uniform motion in a straight line unless impelled by external force to change that state.'
  - - 'Try it: inertia'
    - 'Put a card on top of a glass and a coin on the card. Flick the card sharply sideways. The coin drops into the glass, because its inertia keeps it
      where it was.

      Tie a thin string to a heavy book, with a second string hanging below (problem 5). A sudden jerk on the lower string breaks the lower string; a slow
      pull breaks the upper one. (Use thin thread and keep feet out from under the book.)'
  - - Explain the second law
    - 'Momentum is mass × velocity. A force changes momentum, and twice the force makes twice the change each second. So F = ma.

      The book''s unit of force is the dyne (1 gram × 1 cm/sec²); a gram of force is 980 dynes. In SI, force is in newtons: 1 kg × 1 m/s² = 1 N = 100,000
      dynes.'
  - - 'Try it: action and reaction'
    - 'Blow up a balloon and let it go: air rushes back, balloon rushes forward. Roll one ball into an identical ball at rest, head on: the first stops
      and the second moves off, as in the steel balls of Fig. 27.'
  - - What we know now
    - Newton's laws are still used to build bridges and fly spacecraft. Einstein's relativity (1905) showed they need correcting only at speeds near the
      speed of light, and quantum physics at the scale of atoms. "Centrifugal force" is today usually explained as inertia, just as the book does.
  - - Say it back
    - Your student states the three laws in their own words and gives an everyday example of each.
  - - Problems
    - Work questions 1–13 on book page 37. Problems 6–9 use F = mv/t.
  practice: 'Spot the third law this week: swimming, walking, rowing, a garden hose kicking back.'
  tip: In problem 7, a metric ton is 1,000,000 grams; 4 minutes is 240 seconds.
  answers: '6. 3 cm/sec. 7. About 23.5 cm/sec (force 2,000,000 × 980 dynes on a mass of 20,000,000,000 g for 240 sec). 8. About 8.16 metric tons (mass 200,000,000
    g, acceleration 40 cm/sec², force 8,000,000,000 dynes ÷ 980,000). 9. Their momenta are equal and opposite, so the moon would move 80 times as fast as
    the earth. 10. More, because part of their weight now goes to keeping them moving in a circle. 13. They strike at the same time; the horizontal motion
    does not change the downward acceleration. The other questions are explanations: inertia (1–5, 12) and reaction (11).'
- num: 7
  roman: Ch. III, §§ 57–65
  idx: 53
  unit: 3
  title: Pressure under water
  mins: 40
  goal: Your student can explain that liquid pressure grows with depth and pushes equally in all directions, use p = hd and F = Ahd, and explain the hydrostatic
    paradox and why water finds its level.
  materials:
  - The book, open to these pages
  - A tall plastic bottle (a 2-liter soda bottle) and a nail or skewer to poke holes (adult does the poking)
  - A sink or the outdoors
  - A clear bendy straw or a short piece of clear tubing
  - A teapot or watering can
  - A notebook and pencil
  - A calculator (optional, for the problems)
  book: The upward push on a tube held under water; a pressure gauge made from a thistle tube and a drop of ink; force proportional to depth and the same
    in every direction; the force on a surface (F = Ahd); the hydrostatic paradox, with vessels of different shapes; pressure as force per square centimeter
    (p = hd); and why water stands at the same level in connected vessels. Nine problems follow.
  steps:
  - - Hook question
    - 'Say: Why do your ears hurt at the bottom of a deep swimming pool but not at the top?'
  - - Read together
    - 'Read §§ 57–65. The book''s summary of the gauge experiments:

      ~ We conclude, therefore, that at a given depth a liquid presses up and down and sidewise with exactly the same force.'
  - - 'Try it: the leaky bottle'
    - 'An adult pokes three holes up the side of a plastic bottle, one above the other. Cover them with tape, fill the bottle with water, stand it in the
      sink and pull off the tape. The jet from the lowest hole shoots out farthest: more depth, more pressure.

      Poke one more hole in the side near the bottom and one in the bottom itself: water comes out sideways and downward just as easily.'
  - - Explain the idea
    - 'Pressure means force on each square centimeter. In water (density 1), the pressure at a depth of h centimeters is h grams per square centimeter:
      p = hd. The total force on a surface is the area times the average depth times the density: F = Ahd.

      The paradox (§ 62): the force on the bottom of a vessel depends only on the depth and the area of the bottom, not on how much water is in it. The
      slanting walls push up or down on the water and make up the difference (§ 63).'
  - - 'Try it: water finds its level'
    - 'Fill a teapot or watering can and look at the spout: the water stands at the same height as in the pot. Fill a bendy straw partly with water and
      hold the two ends up like a U; tip it and watch both surfaces stay level.'
  - - What we know now
    - In SI units pressure is measured in pascals (1 Pa = 1 newton per square meter), named for Pascal. Ten meters of water adds about 100,000 Pa, roughly
      one atmosphere.
  - - Say it back
    - Your student explains the hydrostatic paradox in their own words, pointing to Fig. 32.
  - - Problems
    - 'Work problems 1–9 on book pages 44–45. Remember: pressure is grams per square centimeter; force is pressure times area.'
  practice: Look for a water tower or a hilltop reservoir near you and ask why it is built so high.
  tip: A dam is thickest at the bottom for the same reason the bottom jet goes farthest.
  answers: '1. 102,600 g (102.6 kg) per sq. cm. 2. 24,000,000 g = 24,000 kg (24 metric tons). 3. Each long side: 24,000 kg; each end: 16,000 kg (area times
    half the depth). 4. 20,000 g = 20 kg. 5. Less: the water in the cone weighs only a third as much as the force on its bottom, because the slanting sides
    push down on the water. 6. Bottom: 13,600 g; each side: 6800 g. 7. About 151 cm. 8. 17.5 kg. 9. The tap is 230 ft. = 6900 cm below the reservoir surface,
    so the pressure is 6.9 kg per sq. cm; with 1 in. = 2.5 cm that is about 95 lb. per sq. in.'
