  steps:
  - - Hook question
    - 'Say: How can a small child on a seesaw lift a grown-up?'
  - - Read together
    - 'Read §§ 208–211. The law:

      ~ The moment of the acting force is equal to the moment of the resisting force.'
  - - 'Try it: the coin seesaw'
    - 'Balance the ruler on the pencil at its middle. Put 3 coins 5 cm from the center. Where must 1 coin go to balance? (15 cm.) Where must 2 coins go?
