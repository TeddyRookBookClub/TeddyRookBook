# Sign Language (ASL) page. Every link was checked on 2026-10-12. Link out only: don't copy or embed other sites' signs, pictures or videos.
path:
- title: Start with the alphabet
  text: Learn the 26 handshapes of the fingerspelling alphabet and spell your own names. Fingerspelling is used for names, places and words without a sign of their own. Practice reading words with the fingerspelling page on this site.
  links:
  - {label: "Fingerspelling practice", url: "/asl/fingerspelling/"}
  - {label: "Lifeprint Lesson 1", url: "https://www.lifeprint.com/asl101/lessons/lesson01.htm", ext: true}
- title: Work through Lifeprint's free lessons
  text: Dr. Bill Vicars, a Deaf ASL professor, teaches 60 free lessons at Lifeprint (ASL University), each with videos, vocabulary and practice sentences. ASL 1 is Lessons 1–15, ASL 2 is 16–30, ASL 3 is 31–45, and ASL 4 (46–60) is practice sentences. One lesson a week, with a few minutes of practice each day, is a good pace for a family. The lesson planner can lay them out week by week.
  links:
  - {label: "Lifeprint lessons", url: "https://www.lifeprint.com/asl101/lessons/lessons.htm", ext: true}
  - {label: "Add ASL to the lesson planner", url: "/homeschool/planner/"}
- title: Watch stories told in ASL
  text: Children pick up a language from stories. The American Society for Deaf Children keeps a free directory of hundreds of children's books retold in ASL, and Gallaudet's Clerc Center has a free app of picture books translated into ASL.
  links:
  - {label: "ASDC ASL Stories Directory", url: "https://deafchildren.org/knowledge-center/asl-resources/sign-language-stories/", ext: true}
  - {label: "Clerc Center Bilingual Stories Bookshelf", url: "https://clerccenter.gallaudet.edu/real/bookshelf-app/", ext: true}
- title: Look up signs as you need them
  text: When you want a sign for something in your day, look it up in a video dictionary and use it right away. Signs are easiest to remember when you use them for real things at home.
  links:
  - {label: "ASL-LEX", url: "https://asl-lex.org/", ext: true}
  - {label: "Lifeprint dictionary", url: "https://www.lifeprint.com/", ext: true}
  - {label: "Signing Savvy (browse by letter)", url: "https://www.signingsavvy.com/", ext: true}
- title: Learn about the Deaf community
  text: ASL belongs to the Deaf community, and learning it includes learning about the people who use it. The National Association of the Deaf explains why ASL matters and where it comes from.
  links:
  - {label: "NAD: American Sign Language", url: "https://nad.org/knowledge-hub/american-sign-language/", ext: true}
  - {label: "NAD position statement on ASL", url: "https://nad.org/knowledge-hub/position-statements/position-statement-on-american-sign-language/", ext: true}
about:
- "American Sign Language is a complete language of its own, used by Deaf communities in the United States and much of Canada. It has its own grammar, which is not the same as English, and facial expressions and the space around the signer are part of that grammar. It is a visual language, so it's best learned by watching fluent signers, ideally Deaf teachers, on video and in person."
- "This page can't teach signs itself: signs need to be seen moving. It points to free lessons, stories and dictionaries, many of them by Deaf teachers and Deaf-education organizations, and adds fingerspelling practice of its own."
families: "If your family has a deaf or hard-of-hearing child: the American Society for Deaf Children and Gallaudet University's Clerc Center have free guidance for families, including the Clerc Center's 15 Principles for Reading to Deaf Children. SignIt ASL is free for parents of deaf or hard-of-hearing children aged 36 months or younger (others pay)."
familylinks:
