- {label: "15 Principles for Reading to Deaf Children", url: "https://clerccenter.gallaudet.edu/resources/15-principles-for-reading-to-deaf-children/"}
- {label: "SignIt ASL (free for parents of young deaf children)", url: "https://www.infanthearing.org/signit/index.php"}
tips:
- "<b>A little every day.</b> Ten minutes of signing beats an hour once a week."
- "<b>Use it at home.</b> Sign the things you say every day: eat, drink, more, finished, please, thank you, bath, bed, the names of family members."
- "<b>Watch faces, not just hands.</b> In ASL the face carries grammar, such as whether something is a question."
- "<b>Learn together.</b> Parents and children learning side by side is the point; nobody needs to be the expert."
- "<b>Practice receiving too.</b> Reading someone else's signing and fingerspelling is harder than signing yourself, so practice both."
