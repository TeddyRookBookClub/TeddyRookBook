- key: machine-basics
  name: Sewing Machine Basics
  icon: ⚙️
  group: machine
  level: beginner
  time: 45 minutes
  need:
  - sewing machine and its manual
  - all-purpose thread
  - empty bobbin that fits your machine
  - fabric scraps
  - pins
  - scissors
  - iron
  intro: Learn to wind a bobbin, thread the machine and sew a straight seam that won't come undone. Practice on scraps, or even on paper with no thread, until the machine feels easy to control.
  steps:
  - t: Wind the bobbin
    how: Put the spool on the spool pin. Lead the thread through the bobbin-winding guide and wrap it a few times around an empty bobbin. Snap the bobbin onto the winder, press the pedal, and stop before
      it's overfull. Your manual shows the exact path.
  - t: Put the bobbin in
    how: Drop or slide the bobbin into its case the way your manual shows, so it unwinds in the right direction. Leave a 4-inch tail.
  - t: Raise the foot and needle
    how: Lift the presser foot and turn the hand wheel toward you until the take-up lever is at its highest point.
  - t: Thread the top
    how: Follow the numbered guides from the spool, down, up through the take-up lever and back down to the needle. Thread the needle and pull out a 4-inch tail.
  - t: Bring up the bobbin thread
    how: Hold the top thread and turn the hand wheel toward you one full turn. Pull the loop of bobbin thread up, then lay both tails under the foot toward the back.
  - t: Set a straight stitch
    how: Pick a straight stitch of medium length, about 10 to 12 stitches per inch (2.5 mm).
  - t: Pin and line up
    how: Pin two scraps right sides together, with pins across the edge. Line the fabric edge up with the 5/8-inch line on the throat plate, and lower the foot.
  - t: Lock the start
    how: Sew forward 3 or 4 stitches, then hold reverse and sew back over them. Then sew forward again.
  - t: Sew the seam
    how: Press the pedal gently and keep the edge on the 5/8 line. Guide the fabric with both hands, but don't push or pull it. Take out each pin before it reaches the foot.
  - t: Pivot at a corner
    how: Stop 5/8 inch from the corner with the needle down in the fabric. Lift the foot, turn the fabric, lower the foot and keep going.
  - t: Lock the end
    how: Backstitch 3 or 4 stitches at the end. Raise the needle, lift the foot, slide the fabric out to the back, and clip the threads.
  - t: Press and finish the edges
    how: Press the seam flat, then open. To stop fraying, zigzag near each raw edge, or stitch 1/4 inch from the edge and trim with pinking shears.
  tips:
  - Use the same thread on top and in the bobbin.
  - If the bobbin thread shows on top, the top tension may be too tight. If loops show underneath, the machine is often threaded wrong. Rethread with the foot up.
  - Brush out lint around the bobbin often. Many problems start there.
  - Stop with the take-up lever at the top so the thread doesn't pull out of the needle when you start again.
  mistakes:
  - problem: A big nest of thread forms underneath.
    fix: Rethread the top with the presser foot up, so the thread settles into the tension discs.
  - problem: The seam wanders.
    fix: Watch the fabric edge on the 5/8 line, not the needle. Go slower.
  - problem: The needle broke.
    fix: Don't sew over pins. Unplug the machine, then put in a new needle the way your manual shows.
  safety:
  - Keep fingers away from the needle while the machine is running.
  - Unplug the machine before cleaning it or changing the needle.
  - Sew only as fast as you can control, and press the pedal only when you're ready.
  - Keep cords out of the way so no one trips.
  sources:
  - name: 'Oregon 4-H 320-15: Sewing Machines and Sergers'
    url: https://ir.library.oregonstate.edu/downloads/zp38wc75k
  - name: 'Oregon 4-H 320-19: Plain Seams and Seam Finishes'
    url: https://ir.library.oregonstate.edu/downloads/6d56zw74c
  - name: 'Texas 4-H: Simple Seaming Techniques'
    url: https://texas4-h.tamu.edu/wp-content/uploads/fashion_duds_to_dazzle_resource_simple_seaming_techniques.pdf
  - name: 'USU Extension: 4-H Sewing Club Meetings'
    url: https://ucanr.edu/sites/default/files/2020-04/323143.pdf
  - name: 'NMSU Guide C-102: Sewing Machine Maintenance'
    url: https://pubs.nmsu.edu/_c/C102
  - name: 'NMSU Guide C-202: Checklist of Common Sewing Machine Problems'
    url: https://pubs.nmsu.edu/_c/C202/index.html
  - name: 'Boston University: Sewing Machine Basics'
    url: https://www.bu.edu/eng/files/2023/04/Sewing-Machine-Basics.pdf
  - name: 'Ohio State Extension: Safety When Sewing'
    url: https://wayne.osu.edu/sites/wayne/files/imce/Safety%20rules.pdf
