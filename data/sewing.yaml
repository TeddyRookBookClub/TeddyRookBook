- key: darn-a-hole
  name: Darn a Sock or Sweater
  icon: 🧦
  group: mending
  level: next steps
  time: 30 minutes
  diagram: darn
  need:
  - darning egg or mushroom (or a smooth, hard ball)
  - darning or tapestry needle
  - yarn or thread close to the sock's color and thickness
  - scissors
  intro: Darning weaves brand-new fabric right across a hole, like a tiny loom. It's how socks and sweaters were kept going for generations, and it's still a great way to save a favorite pair.
  steps:
  - t: Tidy the hole
    how: Snip off long, loose ends. On knits, catch the loose loops around the hole with a few small stitches so they can't run.
  - t: Pick your yarn
    how: Use a single strand close to the sock in color and thickness. Yarn pulled from a hidden spot of the same garment matches best.
  - t: Slip in the darning egg
    how: Put the darning egg inside the sock under the hole, so the area lies smooth. Don't stretch it.
  - t: Lay the first threads
    how: Start about 1/2 inch beyond the hole in good fabric. Sew rows of small running stitches back and forth, straight across the hole and into the good fabric on the other side.
  - t: Leave little loops at the turns
    how: At the end of each row, leave a tiny loop instead of pulling tight. The darn stays flexible and won't pucker.
  - t: Weave across
    how: Turn and work the other way. Pass the needle over one thread and under the next, then do the opposite on the next row, like weaving a basket.
  - t: Finish without a knot
    how: When the hole is filled, run the end back through the darn on the inside and trim it.
  tips:
  - Darn thin spots before they become holes. It's quicker and the darn is smaller.
  - If you don't have a darning egg, any smooth, hard, rounded object will do, such as a wooden ball.
  mistakes:
  - problem: The darn is lumpy and hard.
    fix: Use thinner yarn, and leave small loops at the turns instead of pulling tight.
  - problem: The edges of the hole keep running.
    fix: Before weaving, catch all the loose loops around the edge with small stitches.
  sources:
  - name: 'Univ. of Kentucky CT-MMB.147: Clothing Repair (darning)'
    url: https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-147.pdf
