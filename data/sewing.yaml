- key: gauge-swatch
  name: Check Gauge with a Swatch
  icon: 📏
  group: knitting
  level: next steps
  time: 1-2 hours
  need:
  - The yarn and needles for your project
  - Ruler or tape measure
  - Pins
  intro: Gauge is how many stitches and rows fit in an inch (often given per 4 inches). If your gauge matches the pattern, your hat or sweater will come out the right size. You check it by knitting a small
    test square called a swatch.
  steps:
  - t: Read the pattern's gauge
    how: Find the gauge, such as '16 stitches = 4 inches in stockinette.'
  - t: Knit a swatch
    how: Use the same yarn, needles, and stitch pattern. Cast on enough for about 6 inches, a little more than 4 times the stitches per inch, and knit about 6 inches.
  - t: Lay it flat
    how: Bind off or slip it off the needle. Let it relax and lay it flat on a table without stretching it.
  - t: Measure the middle
    how: Pin out a 4-inch square in the center, away from the curly edges. Count the stitches across and rows up inside it.
  - t: Change needles if needed
    how: Too many stitches? Your knitting is tight; try bigger needles. Too few? It's loose; try smaller needles. Knit a new swatch until it matches.
  tips:
  - Stitch gauge matters more than row gauge for most beginner projects.
  - One needle size usually changes gauge by about half a stitch per inch.
  - For a dishcloth or scarf, gauge doesn't need to be exact.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  - name: Let's Learn to Knit with Increase and Decrease, 4JE-02PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je02po.pdf
