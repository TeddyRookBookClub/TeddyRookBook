- key: slip-knot
  name: Make a Slip Knot
  icon: 🪢
  group: knitting
  level: first steps
  time: 5 minutes
  need:
  - Yarn
  - One knitting needle
  intro: Almost every piece of knitting starts with a slip knot. It is a loop that tightens when you pull one end. It also counts as your first stitch.
  steps:
  - t: Measure a tail
    how: Pull out some yarn. For the long-tail cast-on, leave about 1 inch of tail for every stitch you plan to cast on, plus a few extra inches.
  - t: Make a loop
    how: Cross the yarn over itself to make a small circle.
  - t: Pull a loop through
    how: Reach through the circle and pull up a loop of the yarn coming from the ball.
  - t: Put it on the needle
    how: Slide the new loop onto one needle.
  - t: Snug it up
    how: Gently pull both yarn ends so the loop fits the needle. It should slide easily, not squeeze tight.
  mistakes:
  - problem: The knot won't slide or tighten.
    fix: You pulled the wrong strand through. Undo it and pull up the strand from the ball instead of the tail.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council / Warm Up America!: Learn to Knit'
    url: https://media.craftyarncouncil.com/files/teach/WUA-PTG_Bk_web_5.pdf
