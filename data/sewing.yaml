tools:
- group: Needles, thread and pins
  craft: sewing
  items:
  - name: Hand sewing needles
    kind: hand
    what: Thin steel needles in different lengths and eye shapes. Sharps are medium-length all-rounders, betweens are short for fine handwork, embroidery (crewel) needles have a long eye for thicker thread,
      and darners are longer still.
    tip: Sizes run backwards. A bigger number means a finer, thinner needle. A size 7 sharp is a good first needle.
    src:
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
    - https://ir.library.oregonstate.edu/downloads/12579s352
    - https://ucanr.edu/sites/default/files/2020-04/323143.pdf
  - name: Tapestry needle
    kind: hand
    what: A needle with a blunt tip and a big eye, made to slip between threads instead of piercing them. It is easy to thread with yarn.
    tip: 'These sizes also run backwards. A #13 is the biggest and a #26 is the finest.'
    src:
    - https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-760_0.pdf
  - name: All-purpose thread
    kind: hand
    what: Everyday thread for hand and machine sewing. It is usually polyester, or polyester wrapped in cotton. Polyester is strong and has a little stretch, so it suits knits too.
    tip: Match the thread to the fabric's main color. If you can't find an exact match, pick one shade darker.
    src:
    - https://digitalcommons.unl.edu/cgi/viewcontent.cgi?params=/context/extensionhist/article/2123/&path_info=NF91_37.pdf
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
  - name: Cotton thread
    kind: hand
    what: Soft thread with very little stretch. It is best on woven fabrics made of natural fibers, like cotton and linen.
    tip: Cotton thread can break on stretchy or polyester fabric. For mending, use thread of the same fiber as the fabric.
    src:
    - https://digitalcommons.unl.edu/cgi/viewcontent.cgi?params=/context/extensionhist/article/2123/&path_info=NF91_37.pdf
    - https://4h.tennessee.edu/wp-content/uploads/sites/47/2022/08/Activity-10.pdf
  - name: Heavy-duty and button thread
    kind: hand
    what: Thick, strong thread, often with a smooth glazed coating. It is for sewing buttons onto coats and other heavy fabric by hand.
    src:
    - https://digitalcommons.unl.edu/cgi/viewcontent.cgi?params=/context/extensionhist/article/2123/&path_info=NF91_37.pdf
    - https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-189.pdf
  - name: Thimble
    kind: hand
    what: A small hard cap for the middle finger of your sewing hand. It lets you push the needle through fabric without hurting your finger.
    tip: Choose one that fits snugly. Metal is a good choice.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
    - https://extension.sdstate.edu/sites/default/files/2026-03/S-0031-01-03-05-2026.pdf
  - name: Straight pins and pincushion
    kind: hand
    what: Pins hold layers of fabric together until you sew them. A pincushion keeps pins and needles in one safe place.
    tip: Use sharp pins, and throw out bent or rusty ones. Ballpoint pins are made for knits. A magnetic pin holder catches pins that fall.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
    - https://extension.purdue.edu/county/hancock/_docs/mini-sewing.pdf
  - name: Needle threader
    kind: hand
    what: A thin wire loop on a small handle. You push the loop through the needle's eye, put the thread through the loop, then pull it back.
    src:
    - https://blogs.ifas.ufl.edu/columbiaco/2020/05/27/threading-a-needle/
    - https://extension.sdstate.edu/sites/default/files/2026-03/S-0031-01-03-05-2026.pdf
- group: Cutting, measuring and marking
  craft: sewing
  items:
  - name: Fabric shears
    kind: hand
    what: Long, sharp scissors for cutting fabric. Bent-handle shears let the fabric stay flat on the table while you cut.
    tip: Keep them for fabric and thread only. Paper and cardboard dull the blades fast, so keep a cheap pair of paper scissors for patterns.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
    - https://extension.sdstate.edu/sites/default/files/2026-03/S-0031-01-03-05-2026.pdf
  - name: Small scissors or thread snips
    kind: hand
    what: Small clippers for snipping thread ends. Keep them right beside you while you sew.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
  - name: Pinking shears
    kind: hand
    what: Shears with saw-tooth blades that cut a zigzag edge. A zigzag edge frays less than a straight cut.
    src:
    - https://digitalcommons.usu.edu/cgi/viewcontent.cgi?article=1085&context=extension_curall
    - https://ir.library.oregonstate.edu/downloads/6d56zw74c
  - name: Seam ripper
    kind: hand
    what: A small tool with a sharp point and a curved blade. It slips under stitches and cuts them, so you can unpick a mistake.
    tip: Put the cap back on when you're done to protect the point.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
  - name: Tape measure
    kind: hand
    what: A flexible 60-inch tape for measuring bodies and fabric.
    tip: Pick one that doesn't stretch.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
  - name: Seam gauge (hem gauge)
    kind: hand
    what: A 6-inch metal ruler with a sliding marker. It helps you measure hems, seam allowances and button spacing quickly and evenly.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
  - name: Tailor's chalk or washable marker
    kind: hand
    what: Marks lines and dots on fabric that brush or wash away later.
    tip: Test it on a scrap of your fabric first to make sure it comes out.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
- group: Pressing
  craft: sewing
  items:
  - name: Iron and ironing board
    kind: electric
    what: Sewers press as they go. You lift the iron and set it down instead of sliding it, so seams lie flat and fabric doesn't stretch.
    tip: Set the heat for the fabric, and for blends use the lowest setting any of its fibers needs. Test on a scrap first.
    src:
    - https://ir.library.oregonstate.edu/downloads/9p2909506
    - https://ucanr.edu/sites/default/files/2020-04/323143.pdf
  - name: Steam iron
    kind: electric
    what: An iron that puffs steam to help press seams and creases. It only makes steam on the hotter settings.
    src:
    - https://ir.library.oregonstate.edu/downloads/9p2909506
  - name: Pressing cloth
    kind: hand
    what: A piece of plain cloth, such as muslin, laid between the iron and your fabric. It stops shiny marks and protects delicate fabric. It is also a must for iron-on tape and patches.
    tip: Dampen it a little when you want extra steam at a low setting.
    src:
    - https://extension.sdstate.edu/sites/default/files/2026-03/S-0031-01-03-05-2026.pdf
    - https://ir.library.oregonstate.edu/downloads/9p2909506
- group: Old-fashioned tools
  craft: sewing
  items:
  - name: Darning egg or darning mushroom
    kind: old-fashioned
    what: A smooth, hard egg or mushroom shape, made of wood, china or glass, that you slip inside a sock. It holds the hole flat and firm while you weave a darn.
    tip: Old school sewing books used a wooden ball, or even a square of cardboard, when there was no darning egg.
    src:
    - https://emuseum.tempe.gov/objects/23178/darning-egg
    - https://archive.org/details/plainneedleworkk00hale
    - https://archive.org/details/sewinghandicraft00mcgl
  - name: Emery strawberry
    kind: old-fashioned
    what: A little strawberry-shaped cushion, often hanging from a tomato pincushion, filled with gritty emery. Pushing a needle in and out of it helps clean and sharpen the point.
    src:
    - https://nyheritage.contentdm.oclc.org/digital/collection/locustgrove/id/16/
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
  - name: Treadle sewing machine
    kind: old-fashioned
    what: A sewing machine powered by your feet rocking a wide pedal (the treadle). Both hands stay free to guide the fabric. It needs no electricity, and many old ones still sew today.
    src:
    - https://www.si.edu/object/1851-isaac-singers-sewing-machine-patent-model:nmah_1071133
    - https://www.si.edu/object/singer-sewing-machine:nmah_1218597
    - https://pubs.nmsu.edu/_c/C102
  - name: Sad iron
    kind: old-fashioned
    what: A heavy solid iron that was heated on a wood or coal stove, used to press clothes before electric irons. 'Sad' is an old word for heavy. You had to put it back on the stove to reheat it again
      and again.
    src:
    - https://www.kansashistory.gov/teachers/trunks/pdfs/set_objcd_sadiron.pdf
  - name: Tracing wheel and dressmaker's carbon
    kind: old-fashioned
    what: A small spiky wheel on a handle. You roll it over a pattern line with colored dressmaker's tracing paper underneath, and it copies the line onto the fabric.
    src:
    - https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
    - https://digitalcommons.usu.edu/cgi/viewcontent.cgi?article=1085&context=extension_curall
- group: Electric and modern tools
  craft: sewing
  items:
  - name: Sewing machine
    kind: electric
    what: A machine that sews with two threads, one from a spool on top and one from a bobbin underneath. It makes even, strong stitches much faster than by hand.
    tip: Every machine threads a little differently. Keep the owner's manual handy, or look up your model online.
    parts:
    - what: Holds the spool of thread on top.
      name: Spool pin
    - what: Lead the top thread down to the needle and control how tightly it pulls.
      name: Thread guides and tension dial
    - what: Moves up and down with the needle and pulls up the slack thread. Stop sewing with it at its highest point.
      name: Take-up lever
    - what: Winds thread from the spool onto an empty bobbin.
      name: Bobbin winder
    - what: A small spool under the needle plate that holds the bottom thread.
      name: Bobbin and bobbin case
    - what: Moves up and down to make each stitch. Its eye is near the point.
      name: Needle
    - what: The foot holds the fabric flat while you sew. The lever lifts it up and lets it down.
      name: Presser foot and lifter
    - what: Little toothed bars under the foot that move the fabric along. Let them do the pulling.
      name: Feed dogs
    - what: The metal plate under the foot. Its lines show how far your fabric edge is from the needle, like 5/8 inch.
      name: Throat plate (needle plate)
    - what: The wheel on the right side. Turn it toward you to move the needle up and down slowly by hand.
      name: Hand wheel
    - what: Set how long each stitch is, and how wide a zigzag is.
      name: Stitch length and stitch width controls
    - what: Sews backward for a few stitches to lock the start and end of a seam.
      name: Reverse lever or button
    - what: Controls the speed. Press gently to go slowly.
      name: Foot pedal
    src:
    - https://ir.library.oregonstate.edu/downloads/zp38wc75k
    - https://ucanr.edu/sites/default/files/2020-04/323143.pdf
  - name: Serger (overlock machine)
    kind: electric
    what: A machine that sews a seam, trims off extra fabric and wraps the raw edge in thread, all in one go. It uses 3 to 5 threads. It's handy for knits and tidy edges, but you don't need one to start
      sewing.
    tip: Check the fit before you serge. The blade trims the seam allowance, so there's nothing left to let out.
    src:
    - https://ir.library.oregonstate.edu/downloads/zp38wc75k
  - name: Rotary cutter, mat and ruler
    kind: hand
    what: A rotary cutter is a very sharp rolling blade, a bit like a pizza cutter, for cutting fabric. It is used with a self-healing cutting mat and a see-through grid ruler. It isn't electric, but it's
      a modern tool that grown-ups should handle for young sewers.
    tip: Store the mat flat, away from heat. Hold the blade straight up as you cut.
    src:
    - https://extension.usu.edu/sewing/research/basic-sewing-supplies.pdf
    - https://www.bu.edu/eng/files/2023/04/Sewing-Machine-Basics.pdf
    - https://sandusky.osu.edu/sites/sandusky/files/imce/Exploring%20Sewing%20Pillowcases.pdf
- group: Knitting needles
  craft: knitting
  items:
  - name: Straight needles
    kind: hand
    what: The classic pair of needles, each with a point at one end and a knob at the other. They come in 10-inch and 14-inch lengths.
    tip: Shorter 10-inch needles are easier for a beginner to handle.
    src:
    - https://www.craftyarncouncil.com/getting_started.php3
    - https://www.craftyarncouncil.com/knit_guide.html
  - name: Circular needles
    kind: hand
    what: Two short needle tips joined by a flexible cord. They are used for big projects and for knitting in a seamless tube, like a hat.
    src:
    - https://www.craftyarncouncil.com/getting_started.php3
  - name: Double-pointed needles
    kind: hand
    what: Short needles with a point at both ends, sold in sets. They are used for small round things like socks and mittens.
    src:
    - https://www.craftyarncouncil.com/getting_started.php3
  - name: Needle materials
    kind: hand
    what: Needles are made of metal, plastic, wood, or bamboo. Yarn slips less on wood and bamboo, which helps beginners keep stitches on; smooth metal lets stitches slide fast.
    tip: If your stitches keep sliding off, try wood or bamboo needles.
    src:
    - https://www.craftyarncouncil.com/getting_started.php3
    - https://digitalcommons.usu.edu/extension_curall/1465
    - https://addi.de/en/story/bamboo-needles/
  - name: Needle sizes
    kind: hand
    what: Needles have a US number and a size in millimeters (mm). For example, US 8 is 5 mm and US 10 is 6 mm. A bigger number means a fatter needle and bigger stitches.
    tip: Trust the mm size. Very old books use older numbering, so an old 'No. 13 steel' sock or glove needle is thin, not a modern US 13.
    src:
    - https://www.craftyarncouncil.com/standards/hooks-and-needles
    - https://archive.org/details/knittingsewingho00nico
  - name: Point protectors
    kind: hand
    what: Little rubber caps that go on the needle tips when you put your knitting down. They keep stitches from sliding off.
    src:
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
- group: Yarn
  craft: knitting
  items:
  - name: Yarn weights
    kind: hand
    what: Yarn thickness is sorted into numbered groups from 0 (lace, the thinnest) to 7 (jumbo, the thickest). The number is often printed on the label inside a little skein symbol.
    tip: See the yarn weight table below.
    src:
    - https://www.craftyarncouncil.com/standards/yarn-weight-system
    - https://www.craftyarncouncil.com/standards/yarn-label-information
  - name: Best first yarn
    kind: hand
    what: Start with a smooth, light-colored medium (#4, worsted) yarn. Light colors make each stitch easy to see.
    tip: Skip dark, fuzzy, or bumpy novelty yarns for now. They hide your stitches and are hard to pull out.
    src:
    - https://www.craftyarncouncil.com/knit_guide.html
    - https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
  - name: Fiber types
    kind: hand
    what: Yarn can be natural, like wool or cotton, or man-made, like acrylic or nylon. Wool is warm and springy, and cotton soaks up water, which makes it great for dishcloths.
    tip: If you mix yarns in one project, pick ones with the same washing instructions.
    src:
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
    - https://extension.usu.edu/sewing/files/010FL_ST_Neeedlearts_2006-103pr.pdf
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: Reading a yarn label
    kind: hand
    what: The label (band) tells you the fiber, the weight, how much yarn is in the ball, the suggested needle size, the dye lot, and how to wash it. Many labels also give a gauge.
    tip: Buy all the yarn for one project at once, with the same dye lot number, so the color matches. Keep the label.
    src:
    - https://www.craftyarncouncil.com/getting_started.php3
    - https://ucanr.edu/media/231065
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
    - https://www.craftyarncouncil.com/standards/yarn-label-information
- group: Knitting helpers
  craft: knitting
  items:
  - name: Tapestry (yarn) needle
    kind: hand
    what: A big sewing needle with a blunt tip and a large eye. You use it to weave in yarn ends and sew pieces together.
    src:
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
    - https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  - name: Stitch markers
    kind: hand
    what: Small rings that sit on the needle between stitches. They mark a spot, like the start of a round.
    src:
    - https://www.craftyarncouncil.com/blog/check-out-some-best-knitting-accessories-you-can-buy
    - https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  - name: Row counter
    kind: hand
    what: A small counter you click after each row so you don't lose your place.
    src:
    - https://www.craftyarncouncil.com/blog/check-out-some-best-knitting-accessories-you-can-buy
    - https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  - name: Scissors
    kind: hand
    what: Small scissors for cutting yarn.
    tip: Keep them in a case or pouch when you are not using them.
    src:
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
  - name: Tape measure or ruler
    kind: hand
    what: Used to measure your knitting and check gauge. Lay the knitting flat and don't stretch it when you measure.
    src:
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
  - name: Needle gauge
    kind: hand
    what: A flat card or metal plate with holes. Push a needle through the holes to find its size when the number has worn off. Some also have an L-shaped window for counting gauge.
    src:
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
    - https://archive.org/details/knittingsewingho00nico
  - name: Crochet hook
    kind: hand
    what: A hook is the handiest tool for catching a dropped stitch and pulling it back up.
    tip: Pick a hook about the same mm size as your needles, or a little smaller.
    src:
    - https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
    - https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
    - https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
- group: Old-fashioned yarn tools
  craft: knitting
  items:
  - name: Knitting by hand
    kind: old-fashioned
    what: Hand knitting needs only needles and yarn, and it has been done for hundreds of years. During World Wars I and II, school children knitted socks, scarves, and other warm things for soldiers.
    src:
    - https://www.uidaho.edu/-/media/UIdaho-Responsive/Files/Extension/4-H/Projects/32023-knitting-guide.pdf
    - https://archive.org/details/priscillawarwork00pris
    - https://archive.org/details/knittingsewingho00nico
  - name: Knitting sheath
    kind: old-fashioned
    what: A carved wooden stick tucked into an apron string, with a hole in one end to hold the end of one needle. The one in the Victoria and Albert Museum comes from northern England and is dated 1842.
    src:
    - https://collections.vam.ac.uk/item/O108611/knitting-sheath-unknown
  - name: Niddy-noddy
    kind: old-fashioned
    what: A wooden stick frame for winding freshly spun yarn into a skein. Counting the wraps told the spinner how many yards she had made.
    src:
    - https://www.thehenryford.org/collections/explore/artifact/11765
  - name: Yarn swift
    kind: old-fashioned
    what: A wooden stand that opens like an umbrella and holds a loose skein while you wind it into a ball. It keeps both hands free.
    src:
    - https://eapl.org/forge-equipment/umbrella-yarn-swift
  - name: Drop spindle
    kind: old-fashioned
    what: 'One of the oldest tools for making yarn: a stick with a round weight called a whorl. As it spins, it twists loose fiber into yarn.'
    src:
    - https://www.nps.gov/pisp/learn/historyculture/drop-spindle.htm
  - name: Spinning wheel
    kind: old-fashioned
    what: Spinning wheels spread about 800 years ago and made yarn much faster than a spindle. Pioneer families often spun their own yarn at home.
    src:
    - https://www.nps.gov/pisp/learn/historyculture/drop-spindle.htm
  - name: Home sock-knitting machine
    kind: old-fashioned
    what: In the late 1800s, small round knitting machines were sold for home use to knit socks and other tubes.
    src:
    - https://collection.ingenium.ca/item/1985.0034.001
- group: Knitting machines and winders
  craft: knitting
  items:
  - name: Home knitting machine
    kind: hand
    what: A flat bed with about 200 hooked needles, one per stitch. You push a carriage across by hand to knit a whole row at once. Punch-card models choose color patterns with a card and need no power.
    src:
    - https://makezine.com/2017/07/27/learn-lingo-machine-knitting/
    - https://collection.sciencemuseumgroup.org.uk/objects/co44631/knitmaster-flat-bed-knitting-machine
  - name: Electronic knitting machine
    kind: electric
    what: A home knitting machine that stores the pattern in a computer or in the machine itself and controls each needle on its own. The carriage is still usually pushed by hand, though motors can be added.
    src:
    - https://makezine.com/2017/07/27/learn-lingo-machine-knitting/
  - name: Electric ball winder
    kind: electric
    what: A small motor winds a skein into a neat ball that can be pulled from the middle or the outside. Some have a foot switch and speed control.
    tip: A hand-cranked ball winder does the same job without electricity.
    src:
    - https://www.mielkesfiberarts.com/product/ashford-e-ball-winder/
    - https://eapl.org/forge-equipment/umbrella-yarn-swift
