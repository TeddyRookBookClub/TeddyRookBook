guides:
- key: thread-a-needle
  name: Thread a Needle and Tie a Knot
  icon: 🪡
  group: hand-sewing
  level: first steps
  time: 5 minutes
  need:
  - hand needle (size 7 sharp is a good start)
  - all-purpose thread
  - scissors
  - needle threader (optional)
  intro: Every hand-sewing job starts here. Cut a piece of thread that's not too long, get it through the eye, and tie a knot that won't pull through the fabric.
  steps:
  - t: Cut the thread
    how: Cut a piece about 18 inches long, roughly from your fingertips to your elbow and a bit more. Longer thread tangles, and shorter thread runs out fast.
  - t: Make a fresh, clean end
    how: Snip the end at a slant with sharp scissors. A crisp end slides through the eye much more easily than a fuzzy one.
  - t: Push it through the eye
    how: Hold the needle up to the light and poke the thread end through the eye. Pull a few inches through.
  - t: Or use a needle threader
    how: Push the threader's wire loop through the needle's eye and put the thread through the loop. Then pull the threader back out, and the thread comes with it.
  - t: Choose single or double
    how: For most sewing and hems, use a single thread with a short tail. For buttons and strong repairs, pull the thread until both ends are even and sew with it doubled.
  - t: Tie the knot
    how: Wrap the long end around your fingertip two or three times. Roll the loops off your finger with your thumb, then pull them down into a small, tight knot. For a double thread, knot both ends together.
  - t: Finish when you're done
    how: On the back, slip the needle under your last stitch and go through the loop before it closes. Do this twice, then trim the tail to about 1/4 inch.
  tips:
  - A double thread can't slip out of the needle, which helps beginners.
  - If your eyes get tired, a needle threader makes this easy every time.
  mistakes:
  - problem: The thread keeps twisting and knotting.
    fix: Use a shorter piece. Every so often, let the needle dangle so the thread can untwist.
  - problem: The knot pulls through the fabric.
    fix: Tie a second knot on top of the first to make it bigger.
  safety:
  - Keep needles in a pincushion when you're not using them, out of reach of small children.
  sources:
  - name: 'UF/IFAS Extension: Life Skills in a Minute, Threading a Needle'
    url: https://blogs.ifas.ufl.edu/columbiaco/2020/05/27/threading-a-needle/
  - name: 'Purdue Extension: Mini 4-H Sewing (knot and doubling)'
    url: https://extension.purdue.edu/county/hancock/_docs/mini-sewing.pdf
  - name: 'Oregon 4-H 320-13: Hand-Sewing Skills'
    url: https://ir.library.oregonstate.edu/downloads/12579s352
  - name: 'Univ. of North Texas: Setting Up for Hand-Sewing'
    url: https://onstead.cvad.unt.edu/files/default/files/1_1_6_sewing_setup.pdf
  - name: 'Univ. of North Texas: Finishing Knot'
    url: https://onstead.cvad.unt.edu/files/default/files/1_1_7_sewing_finishingknot.pdf
  learn:
  - id: maryfrancessewin00frye
    leaf: 32
    label: 'The Mary Frances Sewing Book: making a knot'
    year: 1913
- key: running-stitch
  name: Running Stitch and Basting
  icon: 〰️
  group: hand-sewing
  level: first steps
  time: 10 minutes
  diagram: running
  need:
  - needle and knotted thread
  - two scraps of cotton fabric
  - pins
  intro: 'The running stitch is the simplest stitch there is: in, out, in, out. Small running stitches make light seams and gathers. Long, loose ones are called basting, a temporary stitch that holds things
    in place until you sew them for real.'
  steps:
  - t: Start from the back
    how: Bring the needle up from the wrong side so the knot stays hidden.
  - t: Weave the needle
    how: Push the needle down and up through the fabric a few times along your line, so several stitches sit on the needle at once.
  - t: Pull through
    how: Pull the needle and thread all the way through, smoothly, so the fabric lies flat and doesn't bunch up.
  - t: Keep them even
    how: For sewing that should last, keep stitches small, about 1/8 to 1/4 inch long. Make the gaps the same size as the stitches.
  - t: Baste with long stitches
    how: To baste, make the stitches much longer and don't fasten off tightly. Pull the basting out once the real seam is sewn.
  - t: Fasten off
    how: Take two tiny stitches in the same spot on the back, or tie a finishing knot.
  tips:
  - Draw a line with chalk to follow at first.
  - Pull up a running stitch gently and the fabric gathers into ruffles.
  - Running stitch isn't strong. For seams that get pulled, use backstitch.
  sources:
  - name: 'Oregon 4-H 320-13: Hand-Sewing Skills'
    url: https://ir.library.oregonstate.edu/downloads/12579s352
  - name: 'Univ. of Nebraska EC71-480: 9 Stitches for the Stitch in Time (1971)'
    url: https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=5073&context=extensionhist
  - name: 'UNH Extension: Sewing for Beginners (4-H)'
    url: https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
  learn:
  - id: maryfrancessewin00frye
    leaf: 43
    label: 'The Mary Frances Sewing Book: running stitch on canvas'
    year: 1913
  - id: maryfrancessewin00frye
    leaf: 39
    label: 'The Mary Frances Sewing Book: even basting'
    year: 1913
  - id: sewingforlittegi00fost
    leaf: 27
    label: 'Sewing for Little Girls: picture of basting and hemming'
    year: 1911
- key: backstitch
  name: Backstitch
  icon: 🔙
  group: hand-sewing
  level: first steps
  time: 15 minutes
  diagram: backstitch
  need:
  - needle and knotted thread
  - two fabric scraps
  - pins
  intro: Backstitch is the strongest hand stitch. On top it looks like a neat line of machine stitching. Use it for seams, for repairs and anywhere a machine can't reach.
  steps:
  - t: Pin the layers
    how: Put two pieces right sides together and pin them. Mark the stitching line if you like.
  - t: Come up one stitch ahead
    how: Bring the needle up from the back about 1/8 inch ahead of where the seam begins.
  - t: Go back
    how: Push the needle down 1/16 to 1/8 inch behind where the thread came out, at the start of the line.
  - t: Come up ahead again
    how: Bring the needle up the same distance ahead of the last stitch.
  - t: Repeat
    how: Each time, go back into the end of the stitch you just made and come out one stitch ahead. The stitches touch end to end on top and overlap on the back.
  - t: Fasten off
    how: Take two tiny stitches on top of each other on the back, or tie a finishing knot.
  tips:
  - Small, even stitches make the strongest seam.
  - The back looks different from the front. The stitches there are longer and overlap.
  mistakes:
  - problem: There are gaps between the stitches on top.
    fix: Go back into the exact hole where the last stitch ended.
  sources:
  - name: 'Oregon 4-H 320-13: Hand-Sewing Skills'
    url: https://ir.library.oregonstate.edu/downloads/12579s352
  - name: 'Univ. of Nebraska EC71-480: 9 Stitches for the Stitch in Time (1971)'
    url: https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=5073&context=extensionhist
  - name: 'UT Extension 4-H: Repair Your Clothes'
    url: https://4h.tennessee.edu/wp-content/uploads/sites/47/2022/08/Activity-10.pdf
  learn:
  - id: maryfrancessewin00frye
    leaf: 44
    label: 'The Mary Frances Sewing Book: stitching (backstitch) on canvas'
    year: 1913
- key: whipstitch
  name: Whipstitch and Overcast Stitch
  icon: 🌀
  group: hand-sewing
  level: first steps
  time: 10 minutes
  diagram: whipstitch
  need:
  - needle and knotted thread
  - two pieces of felt or fabric
  intro: These stitches loop over and over the edge of the fabric. A whipstitch joins two edges, which is great for felt and stuffed toys. An overcast stitch wraps a single raw edge so it doesn't fray.
  steps:
  - t: Line up the edges
    how: To join, hold two edges together. To stop fraying, work on just one raw edge.
  - t: Start hidden
    how: Bring the needle out from between the layers, or from the back, about 1/8 inch in from the edge.
  - t: Loop over the edge
    how: Take the thread over the top of the edge and push the needle through from the same side again, a little farther along.
  - t: Keep going
    how: Make evenly spaced, slanted stitches over the edge, all the same depth. For an overcast edge, about 1/4 inch apart and 1/8 to 1/4 inch deep works well.
  - t: Fasten off
    how: Take a couple of tiny stitches in the same place, tie off, and trim.
  tips:
  - Don't pull too tight, or the edge will curl or pucker.
  - Felt doesn't fray, so it's perfect for practicing whipstitch.
  sources:
  - name: 'Oregon 4-H 320-13: Hand-Sewing Skills'
    url: https://ir.library.oregonstate.edu/downloads/12579s352
  - name: 'Oregon 4-H 320-19: Plain Seams and Seam Finishes'
    url: https://ir.library.oregonstate.edu/downloads/6d56zw74c
  - name: 'Univ. of Nebraska EC71-480: 9 Stitches for the Stitch in Time (1971)'
    url: https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=5073&context=extensionhist
  learn:
  - id: maryfrancessewin00frye
    leaf: 55
    label: 'The Mary Frances Sewing Book: overhanding and overcasting on canvas'
    year: 1913
- key: slip-stitch
  name: Slip Stitch (Ladder Stitch)
  icon: 🫥
  group: hand-sewing
  level: beginner
  time: 15 minutes
  diagram: slipstitch
  need:
  - needle and thread matching the fabric
  - a stuffed toy, pillow or folded edge to close
  intro: The slip stitch hides inside the folds of the fabric, so it's almost invisible. Use it to close the turning gap in a pillow or toy, or to hold a folded edge down.
  steps:
  - t: Press the folds
    how: Fold both edges of the opening under along the seam line and press them so they meet neatly.
  - t: Hide the knot
    how: Bring the needle out from inside one fold, so the knot stays tucked away.
  - t: Slide along a fold
    how: Slip the needle inside the opposite fold for about 1/8 to 1/4 inch, then bring it out.
  - t: Cross straight over
    how: Go straight across to the first fold and slide along inside it the same distance. The thread crossing between the folds looks like the rungs of a ladder.
  - t: Pull it closed
    how: Every few stitches, gently pull the thread and the opening closes, hiding the stitches.
  - t: Fasten off
    how: Take a tiny stitch and knot. Then push the needle into the toy, bring it out a little way off, and trim. The tail disappears inside.
  tips:
  - Use thread that matches the fabric closely.
  - Keep the stitches straight across, not slanted, so they stay hidden.
  sources:
  - name: 'Oregon 4-H 320-13: Hand-Sewing Skills'
    url: https://ir.library.oregonstate.edu/downloads/12579s352
  - name: 'UNH Extension: Sewing for Beginners (4-H)'
    url: https://extension.unh.edu/sites/default/files/migrated_unmanaged_files/Resource004455_Rep6349.pdf
  - name: 'Univ. of Nebraska EC71-480: 9 Stitches for the Stitch in Time (1971)'
    url: https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=5073&context=extensionhist
  learn: []
- key: blanket-stitch
  name: Blanket Stitch
  icon: 🧣
  group: hand-sewing
  level: beginner
  time: 15 minutes
  diagram: blanket
  need:
  - needle with a large eye
  - embroidery floss or yarn
  - felt or fleece
  intro: The blanket stitch makes a row of little 'L' shapes along an edge. It's both pretty and useful. It finishes the edges of blankets and felt crafts and can hold patches on.
  steps:
  - t: Hold the edge toward you
    how: Work from left to right with the fabric edge closest to you. Start with a couple of tiny hidden stitches at the edge.
  - t: Go in from the front
    how: Push the needle into the right side about 1/4 inch in from the edge.
  - t: Catch the loop
    how: Bring the needle out at the edge, passing it over the loop of thread so the thread is caught under the needle point. Pull snug.
  - t: Space it out
    how: Move along about 1/4 to 1/2 inch and repeat. Keep each stitch the same height and spacing.
  - t: Fasten off
    how: Make a tiny stitch over the last loop to hold it, then tie off on the back.
  tips:
  - Draw a light chalk line 1/4 inch from the edge to keep the stitch height even.
  - When the stitches are packed tightly together, the same stitch is used for buttonholes and thread loops.
  sources:
  - name: 'Univ. of Nebraska EC71-480: 9 Stitches for the Stitch in Time (1971)'
    url: https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=5073&context=extensionhist
  - name: 'Oregon 4-H 320-13: Hand-Sewing Skills'
    url: https://ir.library.oregonstate.edu/downloads/12579s352
  learn:
  - id: maryfrancessewin00frye
    leaf: 57
    label: 'The Mary Frances Sewing Book: blanket stitch'
    year: 1913
- key: sew-on-a-button
  name: Sew On a Button
  icon: 🔘
  group: mending
  level: first steps
  time: 10 minutes
  diagram: button
  need:
  - button
  - needle
  - all-purpose or button thread
  - scissors
  - toothpick or pin
  intro: A loose button is one of the easiest fixes there is. The secret is a little 'stem' of thread under the button, called a shank. It gives the buttonhole room to close flat.
  steps:
  - t: Thread a double strand
    how: Cut about 16 to 18 inches of thread, double it through the needle, and knot the ends together.
  - t: Find the spot
    how: Look for the old thread marks, or button the garment and mark where the button should sit.
  - t: Start from the back
    how: Push the needle up from the wrong side and through one hole of the button. The knot stays hidden underneath.
  - t: Add a spacer
    how: Lay a toothpick or pin across the top of the button, between the holes. Sew over it so the stitches stay a little loose.
  - t: Stitch about six times
    how: For a 2-hole button, go up and down through the two holes about six times. For a 4-hole button, make an X or two parallel bars.
  - t: Wrap the shank
    how: Take out the toothpick and bring the needle up between the button and the fabric. Wind the thread around the stitches under the button three or four times.
  - t: Lock it
    how: Push the needle to the back and take a few small stitches or knots there. Trim the thread.
  - t: Shank buttons
    how: If the button has a loop on the back, sew through that loop and the fabric about six times. No toothpick needed. Then knot it off on the back.
  tips:
  - Look inside the garment, at a seam or the hem, for a spare button.
  - On coats, sew a small flat button on the inside behind the main one for extra strength.
  - Fix a loose button right away, and check the others while you're at it.
  mistakes:
  - problem: The button is sewn so tight it's hard to button.
    fix: Snip it off and sew it again with a toothpick spacer and a wrapped shank.
  sources:
  - name: 'UF/IFAS Extension: Life Skills in a Minute, Sewing on a Button'
    url: https://blogs.ifas.ufl.edu/columbiaco/files/2020/05/LSIAM-Sew-on-a-Button-Fact-Sheet.pdf
  - name: 'Univ. of Kentucky CT-MMB.189: Buttons and Buttonholes'
    url: https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-189.pdf
  - name: 'Oklahoma 4-H: Sample Technique Cards (buttons)'
    url: https://4h.okstate.edu/projects/design-and-construction/site-files/files/curriculum-and-patterns/sample-technique-cards-all-30.pdf
  - name: 'UT Extension 4-H: Repair Your Clothes'
    url: https://4h.tennessee.edu/wp-content/uploads/sites/47/2022/08/Activity-10.pdf
  learn:
  - id: sewingforlittegi00fost
    leaf: 39
    label: 'Sewing for Little Girls: ''The way to sew on a button'' picture'
    year: 1911
- key: fix-a-split-seam
  name: Fix a Split Seam
  icon: 🩹
  group: mending
  level: beginner
  time: 15 minutes
  diagram: backstitch
  need:
  - needle
  - thread matching the garment
  - pins
  - scissors
  intro: When a seam comes open, the fabric usually isn't torn. Only the stitches broke. Sew it back up from the inside with a backstitch and nobody will ever know.
  steps:
  - t: Turn it inside out
    how: Find the open part of the seam and pull out any loose, broken threads.
  - t: Pin the seam
    how: Line the two edges up along the old stitching line, right sides together, and pin.
  - t: Start in the good stitching
    how: Fasten your thread about 1/2 inch before the gap, on top of the old stitches that are still holding.
  - t: Backstitch along the line
    how: Follow the old seam line with small backstitches, 1/16 to 1/8 inch long.
  - t: Overlap at the far end
    how: Sew about 1/2 inch past the gap into the old stitching, then fasten off with a couple of tiny stitches.
  - t: Press
    how: Press the seam the same way the rest of it lies, then turn the garment right side out.
  tips:
  - Ask why it split. A seam that's too tight may need a slightly narrower seam allowance to give more room.
  - For extra strength, sew a second line of stitches 1/8 inch away, inside the seam allowance.
  - On stretchy knits, use polyester thread. A machine fix should use a stretch or small zigzag stitch.
  sources:
  - name: 'UT Extension 4-H: Repair Your Clothes'
    url: https://4h.tennessee.edu/wp-content/uploads/sites/47/2022/08/Activity-10.pdf
  - name: 'Univ. of Kentucky CT-MMB.147: Clothing Repair'
    url: https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-147.pdf
  learn: []
- key: patch-a-hole
  name: Patch a Hole
  icon: 🟫
  group: mending
  level: beginner
  time: 30 minutes
  need:
  - patch fabric (or a ready-made iron-on patch)
  - scissors
  - iron and pressing cloth
  - pins
  - needle and thread
  intro: A patch covers a hole with a new piece of fabric. An iron-on patch is quickest. A sewn patch is softer and lasts longer. You can even stitch around an iron-on patch to get both.
  steps:
  - t: Wash and trim
    how: Start with a clean garment. Trim away ragged threads around the hole, and square it off if that's easy.
  - t: Choose a patch
    how: Pick fabric close to the garment in weight, color and feel. A ready-made iron-on patch works too.
  - t: 'Iron-on: cut and round'
    how: Cut the patch at least 1 inch bigger than the hole on every side, and round the corners so they don't peel.
  - t: 'Iron-on: fuse it'
    how: Place the patch glue side down, usually on the inside. Cover with a pressing cloth and press as the package says. Let it cool completely.
  - t: 'Sewn: cut and fold'
    how: Cut a patch about 2 inches bigger than the hole. Fold the edges under 1/2 inch and press.
  - t: 'Sewn: pin and stitch'
    how: Pin the patch flat and straight over the hole. Sew all around the folded edge with small backstitches, slip stitches or blanket stitches, or by machine.
  tips:
  - Stitching around an iron-on patch keeps it from lifting in the wash.
  - Fix holes and tears early. They only get bigger.
  - A bright patch on purpose can look great. Mending doesn't have to hide.
  safety:
  - An iron is very hot. Stand it on its heel between presses and keep the cord out of the way.
  sources:
  - name: 'Univ. of Kentucky CT-MMB.147: Clothing Repair (patching)'
    url: https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-147.pdf
  - name: 'UT Extension 4-H: Repair Your Clothes (patches)'
    url: https://4h.tennessee.edu/wp-content/uploads/sites/47/2022/08/Activity-10.pdf
