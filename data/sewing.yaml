# Sewing & Knitting section: tools and step-by-step guides. Built from scratchpad research (sew/sewing.yaml, sew/knitting.yaml); sources on each item.
meta:
  title: Sewing & Knitting
  intro:
  - 'A needle and thread, or two needles and a ball of yarn, are enough to make useful things and keep the clothes you love going for longer. Here are the tools, from a thimble and darning egg to an electric
    sewing machine, and short step-by-step guides for the basics: hand stitches, buttons, hems, patches and darns, the sewing machine, knitting and a first crochet.'
  - Pick any guide and go at your own pace. Each one lists what you'll need, then the steps, tips and fixes for common problems. Old sewing and knitting books from more than a hundred years ago are linked
    where they show the same thing; the instructions here come from university extension and 4-H guides and the Craft Yarn Council, listed on each page.
  grownups_sewing: 4-H programs start children on simple hand sewing early. Purdue's Mini 4-H sewing is for kindergarten to 2nd grade, and Penn State's Cloverbud program welcomes ages 5 to 7. In both, an
    adult helps and watches but lets the child do the work. Little ones can start with a large-eye needle and yarn on felt or an old sock, as in a Wisconsin Cloverbud beanbag activity. Move to a regular
    sharp needle once they can handle it. Purdue's program brings in the sewing machine around 2nd grade, with an adult threading the machine and bobbin. Grown-ups should handle the iron and rotary cutter
    for young sewers, and pins and needles should be stored where small children can't reach them.
  grownups_sewing_sources:
  - https://extension.purdue.edu/county/hancock/_docs/mini-sewing.pdf
  - https://extension.psu.edu/programs/4-h/opportunities/projects/communication-and-expressive-arts/sewing
  - https://taylor.extension.wisc.edu/files/2010/12/Cloverbud-Activity-Book-A.pdf
  - https://sandusky.osu.edu/sites/sandusky/files/imce/Exploring%20Sewing%20Pillowcases.pdf
  - https://ucanr.edu/sites/default/files/2020-04/323143.pdf
  grownups_knitting: The Craft Yarn Council says children can learn to knit from about age 6. Keep first lessons short, about 45 minutes to an hour, and sit beside the child to guide their hands. It helps
    to cast on about 25 stitches and knit a few rows ahead of time, so the child can start right away with the knit stitch and learn casting on later. 4-H beginner guides suggest worsted yarn with US 8
    to 10 (5 to 6 mm) needles. A light, smooth yarn makes stitches easy to see. Praise effort, not neatness; uneven stitches are normal at first. Some Extension offices, such as University of Illinois Extension,
    hold finger-knitting workshops for youth. Keep needles, scissors, and small items like stitch markers out of reach of babies and toddlers, and store scissors in a case.
  credit: 'Yarn weight categories and abbreviations follow the Craft Yarn Council standard. Source: Craft Yarn Council''s www.YarnStandards.com'
  disclaimer: These are free how-to guides for families. There's nothing to earn, pass or send in.
