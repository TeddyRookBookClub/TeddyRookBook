- key: hem-by-hand
  name: Hem Pants or a Skirt by Hand
  icon: 👖
  group: hemming
  level: next steps
  time: 1 hour
  diagram: catchstitch
  need:
  - pins
  - seam gauge or ruler
  - chalk
  - iron and pressing cloth
  - needle
  - matching thread
  - a helper
  intro: A hand-sewn hem barely shows from the outside, and it's easy to let down later. The trick is to catch just a thread or two of the outside fabric and keep the stitches loose.
  steps:
  - t: Take out the old hem
    how: If there's an old hem, unpick it with a seam ripper and press the old crease flat.
  - t: Mark the new length
    how: Put the garment on with the shoes you'll wear. Stand straight while a helper pins along the new fold, about every 3 inches, level with the floor.
  - t: Fold and press
    how: Turn the garment inside out. Fold up along the pins, pinning every 2 to 3 inches, and press the fold. Try it on again to check.
  - t: Trim to an even depth
    how: Measure from the fold with a seam gauge and mark an even hem depth. Use 1 to 2 inches for pants and 2 to 3 inches for skirts. Trim off the extra.
  - t: Finish the raw edge
    how: Stop fraying by zigzagging or pinking the edge, or by turning it under 1/4 inch and pressing.
  - t: Start at a seam
    how: Use a single matching thread, and hide the knot inside the hem at a side seam.
  - t: Catch stitch around
    how: Work left to right. Take a tiny stitch in the hem, then move about 1/4 inch along and take a tiny stitch of only one or two threads in the garment. The thread makes little Xs.
  - t: Keep it loose
    how: Don't pull tight. Every 12 inches or so, take two stitches in the same spot to lock the thread.
  - t: Press
    how: Take out the pins and press the hem fold, using a pressing cloth.
  tips:
  - Catch stitch is good for pants, knits and heavy fabric. A blind stitch works the same way, picking up one thread of the garment, then the hem, with stitches 1/4 to 1/2 inch apart.
  - Before trimming, leave enough fabric in the hem that you could lengthen it later.
  - Hang a brand-new garment for a day before marking, especially skirts.
  mistakes:
  - problem: Little dimples show on the outside.
    fix: Take smaller bites, just one thread of the garment, and keep the thread looser.
  - problem: The two legs are different lengths.
    fix: Measure each leg from the floor or the crotch seam before you trim, and compare.
  safety:
  - An iron is very hot. Stand it on its heel between presses and keep the cord out of the way.
  sources:
  - name: 'Oregon 4-H 320-32: Hemming Skills'
    url: https://ir.library.oregonstate.edu/downloads/td96k257w
  - name: 'NMSU Guide C-314: Making Perfect Garment Hems'
    url: https://pubs.nmsu.edu/_c/C314/
  - name: 'Univ. of Kentucky CT-MMB.147: Clothing Repair (making a new hem)'
    url: https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-147.pdf
