- key: first-project-dishcloth
  name: 'First Project: Garter-Stitch Dishcloth'
  icon: 🧽
  group: knitting
  level: beginner
  time: 4-6 hours, over a few days
  diagram: garter
  need:
  - About 2 oz (one small ball) of medium (#4, worsted) cotton yarn
  - US 8 (5 mm) needles
  - Tapestry needle
  - Scissors
  intro: 'A dishcloth is a perfect first project: it uses only the knit stitch, it is small, and it is useful. Cotton yarn soaks up water and can go in the washing machine. These numbers come from a Utah
    State University Extension dishcloth with the lace rows left out.'
  steps:
  - t: Cast on 43 stitches
    how: Use the long-tail cast-on, or any cast-on you like.
  - t: Knit every row
    how: Knit across every single row. This makes garter stitch, with bumpy ridges on both sides.
  - t: Count now and then
    how: Count your stitches every few rows. You should always have 43.
  - t: Measure
    how: Keep going until the cloth is about as long as it is wide, about 9 inches. That is roughly 75 to 80 rows, or about 38 ridges.
  - t: Bind off
    how: Bind off all stitches loosely, knitting each one.
  - t: Finish
    how: Weave in both yarn tails and trim them.
  tips:
  - Scarf instead? With medium (worsted) yarn on US 9 (5.5 mm) needles, cast on 22 stitches and knit every row until it is about 72 inches long (4-H Knitting Handbook, Utah State).
  - 'Smaller first try: the Craft Yarn Council beginner block is 28 stitches on US 8 needles with worsted yarn, knit until 9 inches long. It makes a 7-by-9-inch rectangle.'
  - In garter stitch, one ridge equals two rows, which makes counting easy.
  mistakes:
  - problem: The cloth is getting wider or narrower.
    fix: You are adding or losing stitches. Count each row. Look for a dropped stitch or a stitch split in two near the edges.
  sources:
  - name: Holes and Ridges Knitted Dishcloth (Utah State Univ. Extension, 2006)
    url: https://extension.usu.edu/sewing/files/010FL_ST_Neeedlearts_2006-103pr.pdf
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council: Learn Knit Stitch (beginner block)'
    url: https://www.craftyarncouncil.com/instructions_kn.php3
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
