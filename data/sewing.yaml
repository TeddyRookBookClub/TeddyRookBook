    leaf: 51
    label: 'The Mary Frances Sewing Book: catch stitching on canvas'
    year: 1913
  - id: maryfrancessewin00frye
    leaf: 56
    label: 'The Mary Frances Sewing Book: hemming stitch on canvas'
    year: 1913
- key: no-sew-hem
  name: No-Sew Hem with Iron-On Tape
  icon: ♨️
  group: hemming
  level: beginner
  time: 20 minutes
  need:
  - fusible hem tape (fusible web)
  - iron and ironing board
  - pressing cloth
  - pins
  - seam gauge or ruler
  - scissors
  intro: Fusible web is a thin strip of glue that melts under a hot iron and sticks the hem in place, with no needle at all. It's quick, but it's hard to change afterward. It also doesn't hold up as well
    as stitching in clothes that get washed a lot.
  steps:
  - t: Get the length right first
    how: Mark, fold and press the hem just as for a sewn hem, and try it on. Once it's fused, it's very hard to change.
  - t: Test on a scrap
    how: Read the package directions and fuse a test piece of the same fabric. Check that it sticks and that the fabric still looks right.
  - t: Cut the strips
    how: Use strips about 3/4 to 1 inch wide for light and medium fabrics, or about 2 inches for heavy ones.
  - t: Tuck the tape inside
    how: Open the hem and lay the tape between the hem and the garment, at least 1/4 inch below the cut edge so it can't reach the iron. Pin.
  - t: Fuse a bit at a time
    how: Cover with a pressing cloth. Press one section with the iron held still for the time on the package, then lift and move on. Don't slide the iron.
  - t: Let it cool
    how: Leave each part to cool before you move it, so the glue sets.
  tips:
  - Iron-on hems work best on straight hems, like pants legs. Avoid very curved hems, sheer fabrics and lace.
  - It also makes a good emergency fix for a fallen hem until you can sew it.
  safety:
  - An iron is very hot. Stand it on its heel between presses and keep the cord out of the way.
  sources:
  - name: 'Oregon 4-H 320-32: Hemming Skills (fusible web hems)'
    url: https://ir.library.oregonstate.edu/downloads/td96k257w
  - name: 'NMSU Guide C-314: Making Perfect Garment Hems'
    url: https://pubs.nmsu.edu/_c/C314/
  - name: 'Univ. of Kentucky CT-MMB.147: Clothing Repair'
    url: https://fcs.mgcafe.uky.edu/sites/fcs.mgcafe.uky.edu/files/ct-mmb-147.pdf
  learn: []
- key: machine-hem
  name: Hem with a Sewing Machine
  icon: 🧵
  group: hemming
  level: next steps
  time: 30 minutes
  need:
  - sewing machine
  - matching thread
  - iron
  - pins
  - seam gauge
  intro: A machine hem is fast and sturdy, which makes it great for kids' clothes, pajamas and things like curtains and pillowcases. The simplest kind is a double-fold hem, stitched along the top.
  steps:
  - t: Mark and press
    how: Mark the finished length and press the hem fold, the same way as for a hand hem.
  - t: Fold under the raw edge
    how: Fold the raw edge under 1/4 inch toward the wrong side and press. Use a seam gauge to keep it even.
  - t: Fold again
    how: Fold up again to your hem depth, for example 1 inch, and press. Now the raw edge is hidden inside. Pin.
  - t: Set the machine
    how: Use a straight stitch of medium length, about 8 to 12 stitches per inch.
  - t: Stitch near the inner fold
    how: With the wrong side up, sew close to the top folded edge all the way around. For a tube like a pant leg, start at a seam.
  - t: Overlap and finish
    how: When you get back to the start, sew over the first few stitches by about 1/2 inch. Clip the threads and press.
  tips:
  - Many machines have a blind-hem stitch and foot. With practice it gives a nearly invisible hem. Follow your manual and test on a scrap first.
  - On very flared hems, a narrower hem lies flatter.
  safety:
  - Keep your fingers away from the needle. Guide the fabric with your hands flat on either side of the foot.
  - Take pins out before they reach the presser foot. Hitting a pin can break the needle.
  sources:
  - name: 'NMSU Guide C-314: Making Perfect Garment Hems (machine hems)'
    url: https://pubs.nmsu.edu/_c/C314/
  - name: 'Oklahoma 4-H: Sample Technique Cards (machine hem)'
    url: https://4h.okstate.edu/projects/design-and-construction/site-files/files/curriculum-and-patterns/sample-technique-cards-all-30.pdf
  - name: 'USU Extension: Sewing Technique, Blind Machine Hem'
    url: https://digitalcommons.usu.edu/cgi/viewcontent.cgi?article=2535&context=extension_curall
  - name: 'Oregon 4-H 320-32: Hemming Skills'
    url: https://ir.library.oregonstate.edu/downloads/td96k257w
