    leaf: 5
    label: 'Priscilla War Work Book: ''To Knit'' (shown Continental style) and ''To Purl'''
    year: 1917
- key: bind-off
  name: Bind Off
  icon: ✂️
  group: knitting
  level: beginner
  time: 10 minutes
  need:
  - Your knitting
  - Scissors
  intro: Binding off (also called casting off) locks your last row so it won't unravel. You knit stitches and lift one over the other, one at a time. Keep it loose so the edge can stretch.
  steps:
  - t: Knit two
    how: Knit the first 2 stitches as usual.
  - t: Lift over
    how: Use the left needle tip to lift the first stitch on the right needle over the second one and off the needle. One stitch is left.
  - t: Knit one more
    how: Knit the next stitch, so you again have 2 on the right needle.
  - t: Repeat
    how: Lift the first over the second again. Keep going until 1 stitch is left.
  - t: Cut and pull through
    how: Cut the yarn, leaving a tail of about 6 inches. Pull the tail through the last loop and tug gently to close it.
  tips:
  - If your bind-off edge is tight, use a bigger needle in your right hand just for this row.
  - 'On ribbing, bind off in pattern: knit the knit stitches and purl the purl stitches.'
  mistakes:
  - problem: The edge pulls in and won't stretch.
    fix: Undo the bind-off and do it again more loosely, or with a larger needle.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council / Warm Up America!: Learn to Knit'
    url: https://media.craftyarncouncil.com/files/teach/WUA-PTG_Bk_web_5.pdf
  - name: Let's Learn to Knit with Knit & Purl, 4JE-01PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
