- key: purl-stitch
  name: The Purl Stitch
  icon: 🔁
  group: knitting
  level: beginner
  time: 30-45 minutes of practice
  diagram: stockinette
  need:
  - Needles with stitches on them
  - Yarn
  intro: The purl stitch is the knit stitch done backward. The yarn stays in front, and the needle goes into the front of the stitch from right to left. Once you can knit and purl, you can make almost any
    pattern.
  steps:
  - t: Yarn to the front
    how: Bring the yarn between the needles to the front of your work.
  - t: In from right to left
    how: Push the right needle into the front of the first stitch from right to left, so it sits in front of the left needle.
  - t: Wrap
    how: 'Wrap the yarn counterclockwise around the right needle tip: over the top, then down between the needles.'
  - t: Push through
    how: Move the right needle back and down through the old stitch, carrying the new loop with it.
  - t: Slide off
    how: Slide the old stitch off the left needle. Repeat across the row.
  tips:
  - Always move the yarn to the front before a purl and to the back before a knit. Move it between the needles, not over the top.
  - Knit one row and purl the next to make stockinette stitch.
  mistakes:
  - problem: A new loop appeared out of nowhere.
    fix: The yarn went over the needle when you switched between knit and purl. That makes an extra stitch. Pull it off on the next row or unknit back to it.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: Let's Learn to Knit with Knit & Purl, 4JE-01PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
  - name: 'Craft Yarn Council / Warm Up America!: Learn to Knit'
    url: https://media.craftyarncouncil.com/files/teach/WUA-PTG_Bk_web_5.pdf
  - name: Priscilla War Work Book (1917), Internet Archive
    url: https://archive.org/details/priscillawarwork00pris
