safety:
- Keep pins and needles in a pincushion or case, never in your mouth, and store them where small children can't reach.
- Pass scissors with the blades closed and the handles toward the other person.
- An iron gets very hot. Stand it on its heel when you're not pressing, and unplug it by the plug, not the cord.
- Keep fingers away from the sewing machine needle, and sew only as fast as you can control.
- Unplug the sewing machine before cleaning it or changing the needle.
- Cut away from yourself with a rotary cutter, always on a cutting mat, and close the blade after every cut.
