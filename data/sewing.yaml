- key: garter-stockinette-ribbing
  name: Garter, Stockinette, and Ribbing
  icon: 🔍
  group: knitting
  level: beginner
  time: 1-2 hours for practice swatches
  diagram: fabrics
  need:
  - Yarn and needles
  - A few practice swatches of 20 or more stitches
  intro: Knit and purl stitches mix together to make different fabrics. These three patterns are the most common. Learning to read your stitches helps you know what to do next and spot mistakes.
  steps:
  - t: Know a knit from a purl
    how: A knit stitch looks like a little V, like a V-neck sweater. A purl stitch looks like a bump across the stitch, like a turtleneck.
  - t: Garter stitch
    how: Knit every row. Both sides look the same, with bumpy ridges. Two rows make one ridge. It lies flat and doesn't curl.
  - t: Stockinette stitch
    how: Knit one row, purl the next, and repeat. The front is smooth rows of V's. The back is all bumps. The edges tend to curl.
  - t: Knit 1, purl 1 ribbing (k1, p1)
    how: Cast on an even number. Knit 1, purl 1 all across, moving the yarn between the needles each time. On the next row, knit the V's and purl the bumps.
  - t: Knit 2, purl 2 ribbing (k2, p2)
    how: Cast on a multiple of 4. Knit 2, purl 2 across. On the next rows, knit what looks like a V and purl what looks like a bump.
  - t: See why ribbing stretches
    how: Ribbing makes up-and-down columns that pull in and spring back. That's why it is used on cuffs, hat brims, and waistbands.
  tips:
  - Ribbing is often knit on needles a size or two smaller than the rest of the project.
  mistakes:
  - problem: Your ribbing turned into a seed-like bumpy pattern.
    fix: You knit a bump or purled a V. Look at each stitch before you work it.
  sources:
  - name: Let's Learn to Knit with Knit & Purl, 4JE-01PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
  - name: Let's Learn to Knit with Increase and Decrease, 4JE-02PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je02po.pdf
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  learn: []
- key: fix-mistakes
  name: Fix Mistakes
  icon: 🩹
  group: knitting
  level: beginner
  time: 15-30 minutes
  need:
  - Your knitting
  - Crochet hook about the same size as your needles (or a little smaller)
  - Stitch marker or safety pin (optional)
  intro: Every knitter makes mistakes, and most are easy to fix. Count your stitches often so you catch problems early. You can unknit a few stitches, catch a dropped stitch with a crochet hook, or pull
    out rows and try again.
  steps:
  - t: Count your stitches
    how: At the end of each row, count the stitches on the needle. If the number changed, look back for the problem.
  - t: Unknit (tink) one stitch at a time
    how: Put the left needle tip into the stitch just below the first stitch on the right needle. Slide the right needle out and gently pull the yarn free. Repeat until you are back before the mistake.
      'Tink' is 'knit' spelled backward.
  - t: Catch a dropped stitch
    how: If a stitch falls off and runs down, you'll see a ladder of loose bars. Hold the knit (V) side toward you and put the crochet hook through the loose stitch from front to back.
  - t: Climb the ladder
    how: Hook the lowest bar and pull it through the loop. Repeat with each bar, one at a time, until you reach the top.
  - t: Put it back on the needle
    how: Slip the stitch onto the left needle with its right side (leg) in front so it isn't twisted. Then keep knitting.
  - t: Rip out several rows
    how: For a mistake far down, slide the needle out and gently pull the yarn to unravel to just above the mistake. Pick the stitches back up one at a time, each with its right leg in front.
  tips:
  - A dropped stitch that hasn't run down can just be slipped back onto the needle.
  - In garter stitch the rows alternate smooth and bumpy, so you may need to hook some bars from the back. Ripping back is often easier.
  mistakes:
  - problem: A stitch looks crossed or twisted.
    fix: It went back on the needle the wrong way. Slip it off and put it back with the right leg in front, or drop it down and hook it back up.
  - problem: There's a hole in the fabric.
    fix: Unravel back to the row above the hole and knit those rows again.
  safety:
  - Keep crochet hooks, needles, and stitch markers away from babies and toddlers.
  sources:
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  - name: Let's Learn to Knit with Increase and Decrease, 4JE-02PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je02po.pdf
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: Let's Learn to Knit with Knit & Purl, 4JE-01PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
