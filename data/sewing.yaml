- key: weave-in-ends
  name: Weave In Ends
  icon: 🪡
  group: knitting
  level: beginner
  time: 10 minutes
  need:
  - Finished knitting
  - Blunt tapestry (yarn) needle
  - Scissors
  intro: Every project has loose yarn tails from the start, the end, and any new balls. Weaving them in hides them and keeps them from working loose. Do not tie knots; they can poke through or come undone.
  steps:
  - t: Thread the needle
    how: Put one yarn tail through the eye of a blunt tapestry needle.
  - t: Turn to the back
    how: Work on the wrong side, the side that won't show.
  - t: Weave one way
    how: Run the needle under the bumps of nearby stitches for about an inch. Check the front to make sure the yarn doesn't show.
  - t: Weave back
    how: Turn and weave back about an inch in the other direction. Changing direction locks the tail in place.
  - t: Trim
    how: Cut off the extra yarn close to the knitting, without cutting any stitches.
  tips:
  - Weave along an edge when you can, where it is easiest to hide.
  - Thick yarn needs a bit more weaving than an inch.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
  - name: 'Craft Yarn Council / Warm Up America!: Learn to Knit'
    url: https://media.craftyarncouncil.com/files/teach/WUA-PTG_Bk_web_5.pdf
