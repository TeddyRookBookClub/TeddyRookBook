- key: crochet-first-steps
  name: 'Crochet First Steps: Chain and Single Crochet'
  icon: 🪝
  group: crochet
  level: next steps
  time: 1-2 hours
  need:
  - Medium (#4, worsted) yarn, light color
  - Crochet hook size G-6 (4 mm) or H-8 (5 mm)
  - Tapestry needle
  - Scissors
  intro: Crochet uses one hook instead of two needles, and only one loop stays on the hook at a time. It starts with a chain, and single crochet is the first real stitch. A crochet hook is also your best
    tool for fixing knitting.
  steps:
  - t: Slip knot on the hook
    how: Make a slip knot and put it on the hook. Snug it so it slides easily.
  - t: Make a chain
    how: Wrap the yarn over the hook from back to front and pull it through the loop on the hook. That's one chain. Make 29 chains.
  - t: Start the first row
    how: Skip the chain closest to the hook. Push the hook into the next chain, wrap the yarn over, and pull up a loop. Now you have 2 loops on the hook.
  - t: Finish a single crochet
    how: Wrap the yarn over the hook again and pull it through both loops. Work one single crochet in each chain to the end (28 stitches).
  - t: Turn
    how: Chain 1 and turn your work. Single crochet into each stitch across. Repeat this row until the piece is about 9 inches long.
  - t: Fasten off
    how: Cut the yarn, leaving a 6-inch tail. Pull it through the last loop and weave it in with a tapestry needle.
  tips:
  - Count your stitches at the end of each row. Missing the last stitch is the most common beginner slip.
  - For young learners, a larger hook and thicker yarn make chains easier. Some teachers start with chains made using just a finger.
  sources:
  - name: 'Craft Yarn Council: Learn Single Crochet'
    url: https://www.craftyarncouncil.com/instructions_cr.php3
  - name: 4-H Beginner Crochet, 4JF-10PA (Univ. of Kentucky Extension, 2004)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4jf10pa.pdf
  - name: 4-H Crocheting Handbook (Haws & Proctor, Utah State Univ., 2012)
    url: https://4h.extension.wisc.edu/files/2025/05/4H1480DD_Crochet.pdf
  - name: 'Craft Yarn Council: Teach a Child to Crochet'
    url: https://www.craftyarncouncil.com/d1.html
  - name: 'Craft Yarn Council: Hook and Needle Sizes'
    url: https://www.craftyarncouncil.com/standards/hooks-and-needles
