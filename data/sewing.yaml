- key: cast-on
  name: Cast On
  icon: 🪡
  group: knitting
  level: first steps
  time: 15-20 minutes
  need:
  - Yarn
  - 2 needles (US 8 / 5 mm)
  - A slip knot on one needle
  intro: Casting on puts the first row of loops on your needle. The long-tail cast-on gives a neat, stretchy edge. If it feels tricky, start with the backward-loop or knitted cast-on below and come back
    to it later.
  steps:
  - t: Leave a long tail
    how: Make your slip knot about 1 inch of yarn per stitch from the end. For 20 stitches, leave about 20 inches plus a little extra.
  - t: Hold the yarn
    how: Hold the needle in your right hand. Put the tail over your left thumb and the ball yarn over your left pointer finger. Hold both strands in your palm with your other fingers.
  - t: Go under the thumb loop
    how: Point the needle down and slide its tip up through the loop around your thumb.
  - t: Catch the finger yarn
    how: Swing the needle tip over and around the yarn on your pointer finger.
  - t: Back through the thumb loop
    how: Bring the needle back down through the thumb loop, carrying the yarn with it.
  - t: Tighten
    how: Let the loop slip off your thumb and gently pull the tail to snug the new stitch. Repeat until you have enough stitches. The slip knot counts as stitch one.
  - t: 'Easy option: backward loop'
    how: Wrap the yarn around your pointer finger to make a loop, slip the needle into it, and pull snug. It is the easiest cast-on, but the edge is looser.
  - t: 'Easy option: knitted cast-on'
    how: Knit into the slip knot but leave it on the left needle. Put the new loop onto the left needle next to it. Repeat into the newest stitch each time.
  tips:
  - Stitches should slide easily on the needle. If they are tight, cast on over a bigger needle or over both needles held together.
  - The knitted cast-on is a good choice once you know the knit stitch.
  mistakes:
  - problem: You ran out of tail before all the stitches were on.
    fix: Pull it out and start again with a longer tail.
  - problem: The stitches are too tight to knit into.
    fix: Cast on again more loosely, or use a bigger needle just for casting on.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: 'Craft Yarn Council: Certified Knitting Instructors Program handbook'
    url: https://www.craftyarncouncil.com/files/CIP/CYC_CIP_Knit_Program.pdf
