- key: first-pillowcase
  name: 'First Machine Project: A Pillowcase'
  icon: 🛏️
  group: machine
  level: beginner
  time: 1 to 2 hours
  need:
  - 1 yard cotton fabric for the body (44 to 45 in wide)
  - 1/3 yard contrasting cotton for the band
  - matching all-purpose thread
  - sewing machine
  - pins
  - fabric shears or rotary cutter and mat
  - iron and ironing board
  intro: A pillowcase uses only straight seams, one pivot and a simple seam finish, so it's a classic first project. It comes out about 22 by 34 inches, big enough for a standard pillow. All seams are 1/2
    inch.
  steps:
  - t: Wash and press
    how: Wash, dry and press both fabrics first, the way you'll wash the pillowcase later.
  - t: Cut the pieces
    how: Cut the body 45 x 31 inches and the band 45 x 9 inches. Trim off the selvages, the tightly woven edges.
  - t: Fold the band
    how: Fold the band in half the long way, wrong sides together, so it's 4 1/2 inches wide. Press the fold.
  - t: Pin the band on
    how: Lay the body flat, wrong side up, with a 45-inch edge at the top. Lay the band along that edge with the band's raw edges even with the body's top edge. Pin all three layers every 3 to 4 inches.
  - t: Sew the band
    how: Sew 1/2 inch from the edge through all layers, backstitching at the start and end. Take out pins as you come to them.
  - t: Finish and press
    how: Zigzag along the raw edges of that seam, close to the edge but not off it. Press the band up and the seam allowance toward the darker fabric.
  - t: Fold in half
    how: Fold the whole piece in half right sides together, so the band ends match and the bottom corners match. Pin the bottom and the open side.
  - t: Sew bottom and side
    how: Sew a 1/2-inch seam up the side and across the bottom, backstitching at both ends. At the corner, stop 1/2 inch from the edge with the needle down, lift the foot, turn and continue.
  - t: Finish the seams
    how: Zigzag the raw edges of the side and bottom seams.
  - t: Turn and press
    how: Turn it right side out, push the corners out gently, and give the whole pillowcase a good press.
  tips:
  - Pick a print without a clear up and down for your first one. Then it can't come out upside down.
  - Ask a grown-up to help with the rotary cutter and the iron.
  safety:
  - Keep fingers away from the needle, and take out pins before they reach the presser foot.
  - If you use a rotary cutter, cut away from yourself on a mat and close the blade after every cut.
  - An iron is very hot. Stand it on its heel between presses and keep the cord out of the way.
  sources:
  - name: 'Ohio State Univ. Extension 4-H #1004: Exploring Sewing, Pillowcases'
    url: https://sandusky.osu.edu/sites/sandusky/files/imce/Exploring%20Sewing%20Pillowcases.pdf
  - name: 'UT Extension 4-H: Sew a Pillowcase, Using Burrito Method (alternative cuff method)'
    url: https://4h.tennessee.edu/wp-content/uploads/sites/47/2020/05/sew-a-pillowcase-burrito-method.pdf
  - name: 'USU Extension: 4-H Sewing Club Meetings (pillowcase and drawstring bag)'
    url: https://ucanr.edu/sites/default/files/2020-04/323143.pdf
