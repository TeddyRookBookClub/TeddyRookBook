- key: choose-yarn-and-needles
  name: Choose Yarn and Needles
  icon: 🧶
  group: knitting
  level: first steps
  time: 15 minutes (shopping)
  need:
  - 1 ball of smooth, light-colored medium (#4, worsted) yarn, wool or acrylic
  - 1 pair of straight needles, US 8 (5 mm), about 10 inches long
  - Blunt tapestry (yarn) needle
  - Small scissors
  intro: The right yarn and needles make learning much easier. A medium-thick, smooth, light-colored yarn shows every stitch clearly. Medium-size needles are easy to hold and not too slow.
  steps:
  - t: Look for the number 4
    how: Find a yarn labeled medium, worsted, or with a number 4 symbol. This weight is not too thin and not too thick.
  - t: Pick a light, smooth yarn
    how: Choose a light color with a smooth, plain twist. Fuzzy, bumpy, or very dark yarns hide the stitches.
  - t: Choose wool, acrylic, or cotton
    how: Wool and acrylic are springy and forgiving for practice. Cotton is great for dishcloths but stretches less.
  - t: Read the label
    how: Check the suggested needle size, the yardage, and the dye lot. If you need more than one ball, buy them all with the same dye lot.
  - t: Get US 8 (5 mm) needles
    how: A pair of US 8 needles matches worsted yarn well. Shorter 10-inch needles are easier to manage than 14-inch ones.
  - t: Pick a needle material
    how: Wood or bamboo needles hold stitches a little better. Metal needles are slick and fast.
  tips:
  - 4-H beginner guides suggest worsted yarn with US 8 to 10 needles.
  - Keep the yarn label. It tells you how to wash your finished piece.
  sources:
  - name: 'Craft Yarn Council: Knitting Teaching Guide'
    url: https://www.craftyarncouncil.com/knit_guide.html
