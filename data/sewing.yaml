- key: knit-stitch
  name: The Knit Stitch
  icon: 🧣
  group: knitting
  level: first steps
  time: 30-45 minutes of practice
  need:
  - Needles with about 20 stitches cast on
  - Yarn
  intro: 'The knit stitch is the main stitch in knitting. These steps use the English (throwing) method, where the yarn is in your right hand. Remember: in, wrap, pull through, slide off.'
  steps:
  - t: Hold the needles
    how: Hold the needle with the stitches in your left hand and the empty needle in your right. Keep the yarn at the back.
  - t: In
    how: Push the right needle tip into the first stitch from front to back, so it sits behind the left needle.
  - t: Wrap
    how: With your right hand, wrap the yarn under and over the right needle tip, counterclockwise.
  - t: Pull through
    how: Slide the right needle down and bring the wrapped loop through the old stitch toward you.
  - t: Slide off
    how: Push the old stitch off the left needle. The new stitch stays on the right needle.
  - t: Finish the row
    how: Repeat across. When the left needle is empty, swap needles so the full one is in your left hand, and start the next row.
  tips:
  - Count your stitches at the end of each row. You should have the same number you cast on.
  - 'Continental knitting is another way: hold the yarn in your left hand and scoop it with the needle tip. Some left-handed knitters find it easier. Both ways make the same stitch.'
  - Knitting every row makes garter stitch.
  mistakes:
  - problem: Your stitches barely move on the needle.
    fix: You are pulling too tight. Relax and let the yarn flow more loosely.
  - problem: You have extra stitches.
    fix: Keep the yarn at the back. If it goes over the top of the needle, it can make one stitch look like two.
  sources:
  - name: 4-H Knitting Handbook (Utah State Univ. Extension, 2012)
    url: https://extension.usu.edu/sewing/files/02knitting_booklet_v10.pdf
  - name: Let's Learn to Knit with Knit & Purl, 4JE-01PO (Univ. of Kentucky Extension)
    url: https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/4je01pa.pdf
