book:
  id: fairylandscience00buckiala
  title: The Fairy-Land of Science
  year: 1880 (eighth thousand; first published 1879)
  key: fairy-land
  short: The Fairy-Land of Science
  eyebrow: Science · For younger children · 1880
  hero: Arabella Buckley's ten lectures for children on sunbeams, the air, water and ice, sound, a primrose, a piece of coal, and bees and flowers, where the invisible
    forces of nature are the real "fairies". 29 short guides for children about 7 to 10, read aloud by a parent, cover the whole book, each with one simple thing
    to try, a drawing, and the right page of the book beside it. A gentle start before Agnes Giberne's books on the stars and the rocks.
  how:
  - <b>A little at a time.</b> Each guide is one session of 20 to 30 minutes. Read aloud the short passages the guide points to and tell the rest in your own words.
    Two or three sessions a week covers the book in about three months.
  - '<b>One thing to try.</b> Every guide has one simple demonstration with things from the kitchen or garden: a glass of water making a rainbow, a cup pushed under
    water, a saucer drying in the sun, a twanging ruler, a flower taken apart.'
  - '<b>Safety first.</b> Never look at the Sun. Steam, flames and hot water are for the adult only. Buckley''s dangerous experiments (potassium, phosphorus, strong
    acid, coal gas) are marked <b>Watch only</b>: read what happened and find a video of a teacher doing it. Watch bees from a few steps away.'
  - <b>Tell it back, then draw it.</b> After the reading, your child tells back what they heard in their own words. A science notebook of drawings, one for every
    session, makes a lovely record of the year.
  - <b>What we know now.</b> The book is from 1879. Most of it holds up, but a few ideas (the "ether", how bees buzz, the speed of sound) have changed. Short notes
    give the modern picture.
  - <b>Her fairies are forces.</b> Buckley calls heat, gravity and cohesion "fairies" to help children picture them, and says plainly they are real forces. She also
    speaks of God as Creator in places; read these as your family wishes.
  unitword: Part
  lessonword: ''
  numnote: Each guide covers part of one of Buckley's ten lectures, in the book's order, shown beside the title (for example "Lecture III, part 1").
units:
- id: 1
  name: 'Lecture I: The fairy-land of science'
  from: 1
  to: 3
  text: 'How to enter it: nature''s invisible forces are the true fairies, and imagination and open eyes are the way in.'
- id: 2
  name: 'Lecture II: Sunbeams and the work they do'
  from: 4
  to: 6
  text: Day and night, the size of the Sun, light as tiny waves, the colors in sunlight, and the light and warmth that sunbeams bring.
- id: 3
  name: 'Lecture III: The aerial ocean in which we live'
  from: 7
  to: 9
  text: 'The air we live in: what it is made of, why it stays, how it presses on everything, and what makes the wind.'
- id: 4
  name: 'Lecture IV: A drop of water on its travels'
  from: 10
  to: 12
  text: Water rising invisibly into the sky, clouds, rain, dew, crystals, snow, ice, glaciers and the salty sea.
- id: 5
  name: 'Lecture V: The two great sculptors, water and ice'
  from: 13
  to: 15
  text: How rain, rivers, waves, frost and glaciers carve the land and lay it down again somewhere else.
- id: 6
  name: 'Lecture VI: The voices of nature and how we hear them'
  from: 16
  to: 18
  text: What sound is, how it travels, echoes, the ear, notes and noises, and the sounds of brooks, thunder and birds.
- id: 7
  name: 'Lecture VII: The life of a primrose'
  from: 19
  to: 21
  text: A seed, plant cells, how a plant makes its own food, and the parts of a flower.
- id: 8
  name: 'Lecture VIII: The history of a piece of coal'
  from: 22
  to: 24
  text: The giant plants of the coal forests, how a swamp becomes coal, and what coal gives us.
- id: 9
  name: 'Lecture IX: Bees in the hive'
  from: 25
  to: 26
  text: Workers, drones and the queen, wax and six-sided cells, honey and pollen, baby bees and swarms.
- id: 10
  name: 'Lecture X: Bees and flowers'
  from: 27
  to: 29
  text: How flowers' colors, scents and shapes bring insects to carry their pollen, and the end of the journey.
lessons:
- title: Fairy tales that are true
  mins: 25
  goal: Your child can tell one of Buckley's "true fairy tales" (water caught by the frost and set free by the sun) and say that her "fairies" are the real, invisible
    forces of nature.
  materials:
  - Two ice cubes on two saucers
  - A sunny windowsill and a shady spot
  - A science notebook (or plain paper) and colored pencils
  book: 'The opening of the first lecture (pages 1 to 6). Buckley promises "true fairies" and tells three science fairy tales: water spell-bound by frost and freed
    by the sun (like the Sleeping Beauty), shells so tiny that thousands fit in a walnut-shell, and the spectroscope that can tell gases on the sun. Then she says
    the forces of nature are her fairies.'
  steps:
  - - Hook question
    - 'Say: In fairy tales, a spell can make a whole castle fall asleep. Have you ever seen water that has fallen asleep?

      Let your child guess. (Ice! A frozen puddle, icicles, frost on a window.)'
  - - Meet the author
    - 'Arabella Buckley gave these ten talks to a room full of children in London, in the spring before the book came out, and then wrote them down. She asks you
      to imagine you are sitting in her audience.

      Say: She is going to show us fairies. But they are real ones, and you can find them in your own house.'
  - - Read together
    - 'Read pages 1 to 4 aloud, up to the end of the fairy tale of the frost and the sun. Stop to look at the pictures in your head.

      ~ But I thoroughly believe myself, and hope to prove to you, that science is full of beautiful pictures, of real poetry, and of wonder-working fairies

      ~ Look out of the window some cold frosty morning in winter, at the little brook which yesterday was flowing gently past the house, and see how still it lies,
      with the stones over which it was dashing now held tightly in its icy grasp.

      Then sum up the rest of the passage in your own words: tiny sea shells, each the home of a living creature, and an instrument that can tell what the sun is
      made of.'
  - - The idea in plain words
    - 'The "frost-giant" is cold. It holds the water still as ice. The "prince" is the sun''s warmth, which sets it free again. Nothing magic happens, but it is just
      as wonderful.

      ~ There are forces around us, and among us, which I shall ask you to allow me to call fairies, and these are ten thousand times more wonderful, more magical,
      and more beautiful in their work, than those of the old fairy tales.

      Say: A force is a push or a pull, or something that makes things change. We can''t see it, but we can see what it does.'
  - - 'Try it: free the sleeping water'
    - 'Put one ice cube on a saucer in a sunny window and one in a shady corner. Guess which will wake up first. Check every five minutes while you finish the lesson.

      Ask: Which fairy freed the water? (The sun''s warmth.) Why is the shady one slower? (Less warmth reaches it.)'
  - - Tell it back
    - 'Your child tells the frost-and-sun fairy tale in their own words. Prompts:

      What did the frost do to the brook, the icicles and the window?

      Who came to set the water free?

      Why does Buckley say this is a fairy tale of nature?'
  - - Draw it
    - 'In the science notebook, draw two pictures side by side: the brook "spell-bound" in winter, and the same brook running free in the sunshine. Write "Cold" under
      one and "Warmth" under the other.'
  practice: 'Notice it this week: look for water caught by cold (ice in the freezer, frost, a frozen puddle) and water set free by warmth (an icicle dripping, butter
    softening near a warm stove).'
  tip: Buckley calls heat, cold, gravity and the rest "fairies" only as a way of picturing them. She says plainly that they are real forces. Children enjoy the game;
    just keep saying what the real thing is.
  answers: The frost held the brook still, froze the falling drops into icicles, and froze breath on the window into fern-like patterns. The sun's warmth set the
    water free. It is a fairy tale of nature because it is as wonderful as a fairy tale but really happens, made by invisible forces.
  num: 1
  roman: Lecture I, part 1
  idx: 14
  unit: 1
- title: The fairies in a rain shower
  mins: 25
  goal: Your child can name three of Buckley's invisible "fairies" at work in a rain shower (heat, cohesion and gravitation) and show that water pulls itself into
    round drops.
  materials:
  - A piece of wax paper, a plastic lid or a waxy leaf
  - A cup of water and a straw or spoon (or an eyedropper)
  - A toothpick
  - Science notebook and pencils
  book: Pages 7 to 13. Buckley asks children to go outside and watch nature, and to use their imagination to picture what they cannot see. She shows the fairies at
    work in a rain shower, a snowflake, a snowdrop growing, and a coal fire that gives back the sunbeams of long ago.
  steps:
  - - Hook question
    - 'Say: When it rains, where do the drops come from? And why do they come down as drops, not as a long string of water?

      Let your child guess. Buckley asks just the same thing.'
  - - Read together
    - 'Read pages 7 and 8, then the rain shower on pages 8 and 9.

      ~ Just go out into the country, and sit down quietly and watch nature at work.

      ~ Watch a shower of rain. Where do the drops come from? and why are they round, or rather slightly oval?

      Buckley says the one gift we need is imagination:

      ~ the power of making pictures or images in our mind, of that which is, though it is invisible to us.'
  - - The idea in plain words
    - 'Buckley''s three rain fairies:

      Heat holds tiny bits of water apart, floating unseen in the air.

      Cohesion ("sticking together") grabs the bits when the air cools and pulls them into a drop.

      Gravitation (gravity) pulls the drop down to the ground.

      Say: The same gravity that keeps the Earth going round the Sun pulls every raindrop down.'
  - - 'Try it: watch water hold itself together'
    - 'Put a few drops of water on the wax paper. Look from the side: they bunch up into little round domes. Push two drops close with the toothpick and watch them
      jump together into one bigger drop. That is cohesion at work.

      Tilt the paper: gravity makes the drops roll downhill.'
  - - More fairies
    - 'Read or tell the rest of the passage: the snowflake, a six-pointed crystal star; the snowdrop bulb using sunbeams stored last year; and the coal fire.

      ~ and little thought that you were warming yourself with the sunbeams of ages and ages ago.

      Say: We''ll find out how coal holds old sunbeams in Lecture VIII.'
  - - Tell it back and check
    - 'Your child explains a rain shower using the three fairies. Then ask:

      1. Which fairy holds water up in the air, unseen?

      2. Which fairy makes the drops round?

      3. Which fairy pulls them down?'
  - - Draw it
    - 'Draw a cloud with raindrops falling. Label: Heat, Cohesion, Gravitation, with an arrow for each one''s job.'
  practice: 'Notice it this week: drops on a window, on a leaf, on a spider''s web. Are they round? Watch two drops run together on a window pane.'
  tip: 'Buckley says it is better to hunt down an answer than to be told it: "a difficulty really hunted down is a triumph for ever." When your child asks a question
    this week, try finding the answer together by looking or testing.'
  answers: 1. Heat. 2. Cohesion. 3. Gravitation (gravity).
  num: 2
  roman: Lecture I, part 2
  idx: 20
  unit: 1
- title: Solids, liquids, gases, and how to love nature
  mins: 30
  goal: Your child can tell a solid, a liquid and a gas apart, and can show that sugar dissolved in water is still sugar.
  materials:
  - A wooden block or spoon, a cup of water, and a balloon
  - A teaspoon of sugar, a clear glass of warm water, and a saucer
  - A cold window or mirror to breathe on
  - Science notebook and pencils
  book: Pages 14 to 25. Buckley tells of her little niece Cissy breathing on a cold window, explains solids, liquids and gases, shows sugar dissolving and potassium
    fizzing on water, and then explains how to love nature and not just learn dry facts, using a piece of white coral.
  steps:
  - - 'Hook: who made the drops?'
    - 'Breathe on a cold window or mirror, then watch the mist turn into tiny drops.

      Read Cissy''s story on page 14.

      ~ "Auntie," she said, "what for it rain inside?"

      Say: Water was hiding in your breath, too small to see. The cold glass gathered it into drops.'
  - - Read together
    - 'Read the paragraph on solids, liquids and gases on pages 15 and 16.

      ~ All matter in the world is made up of minute parts or particles

      In a solid the bits are locked tight. In a liquid they slide round each other. In a gas they fly apart and spread everywhere.'
  - - 'Try it: three kinds of stuff'
    - 'Hold up the block: it keeps its shape. Pour some water onto a plate: it keeps its amount but spreads flat. Blow up the balloon a little, then let some air
      out: the air takes the shape of whatever holds it, and escapes if it can.

      Ask: Which one would fill the whole room if you let it go? (The gas.)'
  - - 'Try it: where did the sugar go?'
    - 'Stir the sugar into the glass of warm water until it disappears.

      ~ If I dissolve sugar in water, though it disappears it still remains sugar, and does not join itself to the water.

      Taste a drop: still sweet! Pour a little onto the saucer and leave it in a warm place. In a few days the water dries away and the sugar is left behind.'
  - - 'Watch only: potassium on water'
    - 'Watch only: don''t try this at home. Buckley dropped a piece of the metal potassium onto water:

      ~ See how it rolls round and round, fizzing violently, with a blue flame burning round it, and at last goes off with a pop.

      The potassium grabbed part of the water and made something new (potash) and so much heat that the gas it let out caught fire. Potassium can burn skin and explode.
      If you like, look up a video of a teacher doing it behind a safety screen.'
  - - Love nature, not just facts
    - 'Read or tell pages 19 to 23: Buckley copies a dry textbook description of coral, then tells it as the story of tiny jelly animals building stone homes in the
      sea. She says knowing your mother''s face is more than knowing she has brown eyes.

      Ask: Which description makes you want to see coral?'
  - - Tell it back and draw
    - 'Your child explains solid, liquid and gas with an example of each from the house. Then draw three boxes: bits locked tight (solid), bits sliding (liquid),
      bits flying apart (gas).'
  practice: 'Notice it this week: sort things around the house into solids, liquids and gases. Check the sugar saucer each day until the sugar shows again.'
  tip: Buckley ends this lecture by speaking of God as maker of nature's laws. Read it as your family wishes; the science is the same either way.
  answers: 'Solid: keeps its shape and its amount (block, spoon). Liquid: keeps its amount but not its shape (water, milk). Gas: keeps neither and spreads out as
    far as it can (air, steam).'
  num: 3
  roman: Lecture I, part 3
  idx: 27
  unit: 1
- title: Morning light and the giant Sun
  mins: 25
  goal: Your child can explain that morning comes because the Earth turns, and can picture how much bigger than the Earth the Sun is.
  materials:
  - A flashlight or lamp (a lamp with no shade works well)
  - A ball or orange, and a small sticker
  - A dried pea or peppercorn and a large dinner plate
  - Science notebook and pencils
  book: Pages 26 to 32. Light creeping into a dark room at dawn; the Earth turning toward the Sun (with a globe and a lamp); how far away the Sun is (an express train
    would take 171 years) and how big it is (106 Earths across its face); and how the tiny Earth catches only a little of its light, like a mustard-seed near a lamp.
  steps:
  - - Hook question
    - 'Say: Have you ever woken up while it was still dark, and watched the room slowly get light? What do you see first?

      Let your child answer. Buckley says you see shapes first, then white things, then the colors last.'
  - - Read together
    - 'Read pages 26 to 28.

      ~ Who does not love the sunbeams, and feel brighter and merrier as he watches them playing on the wall

      ~ We say that the sun is rising, but we know very well that it is not the sun which moves, but that our earth has been turning slowly round'
  - - 'Try it: make a morning'
    - 'Darken the room. Put the sticker on the ball to stand for your home. Shine the flashlight at the ball (the Sun). Turn the ball slowly from left to right so
      the sticker comes round from the dark side, through the edge of the light, into the full light.

      Say: That edge is sunrise. The Sun didn''t move. We turned.'
  - - How far, how big?
    - 'Read pages 29 and 30.

      ~ At that rate, if you wished to arrive at the sun to-day you would have been obliged to start 171 years ago.

      ~ it would take 106 such earths to stretch across the face of the sun.

      Put the pea on the plate. If the plate is the Sun''s face, the pea is about the size of the Earth. Then draw a row of little dots across a big circle in the
      notebook, the way her Fig. 4 does.'
  - - Safety
    - 'Say: The Sun is so strong that its light can hurt your eyes.

      Safety: never look straight at the Sun, not even for a moment, and never through glass, a lens or sunglasses.

      Buckley mentions a magnifying glass setting paper alight in the sun. Don''t try it: it can start a fire and hurt your eyes.'
  - - Tell it back and check
    - 'Your child tells back why it gets light in the morning. Then ask:

      1. Does the Sun move round us, or do we turn?

      2. Which is bigger, the Earth or the Sun? By a little or a lot?

      3. What would happen if the Sun went dark? (Buckley: no rain, no rivers, no plants; everything frozen.)'
  - - What we know now
    - The Sun is about 93 million miles away on average and about 109 Earths wide. Buckley's numbers were close. About a million Earths would fit inside it.
  practice: 'Notice it this week: watch the light come in one morning or fade one evening. Which colors disappear first at dusk?'
  tip: Big numbers mean little to young children. The pea and the plate say more than the figures, so let your child hold them.
  answers: '1. The Earth turns; the Sun only seems to rise. 2. The Sun, by a great deal: more than a hundred Earths would stretch across its face. 3. Everything would
    freeze: no rain, no rivers, no plants, no animals.'
  num: 4
  roman: Lecture II, part 1
  idx: 39
  unit: 2
- title: Sunbeams are waves, and a rainbow on the wall
  mins: 30
  goal: Your child can say that light travels as tiny waves and that white sunlight is a mixture of all the colors of the rainbow.
  materials:
  - A clear glass of water (or a glass prism)
  - A sunny window and a sheet of white paper
  - A bowl of water and a pebble
  - 'Optional: a white paper circle, crayons and a pencil to spin it on'
  book: Pages 33 to 41. Two ways to touch something far away (throw something, or send a wave); Newton's and Huyghens's ideas; light as tiny waves (fifty thousand
    to an inch) that take seven and a half minutes to come from the Sun; then a prism splitting sunlight into colors, and a spinning card of colors that looks white.
  steps:
  - - Hook question
    - 'Say: How could I touch you from across the room without walking over?

      Let your child try ideas. Buckley gives two: throw something at you, or shake the floor so a wave travels to you.'
  - - Read together
    - 'Read pages 33 and 34.

      ~ Thus we see there are two ways of touching anything at a distance; 1st, by throwing some thing at it and hitting it; 2nd, by sending a movement or wave across
      to it

      Drop the pebble into the bowl of water. Watch the rings travel to the edge.

      Say: Light from the Sun comes to us in waves, a bit like these ripples, only far, far smaller and faster.'
  - - How small, how fast
    - 'Read the bits on pages 38 and 39.

      ~ So very, very tiny that about fifty thousand waves are contained in a single inch of space!

      ~ Well, these tiny waves take only seven minutes and a half to come the whole 91 millions of miles.

      Say: Light is the fastest thing there is.'
  - - 'Try it: a rainbow on the wall'
    - 'Read pages 39 and 40.

      ~ Here at my left hand is the red, beyond it orange, then yellow, green, blue, indigo or deep blue, and violet, shading one into the other all along the line.

      Set the glass of water on a sunny windowsill, with the white paper on the floor or wall where the light lands. Move the paper until a little rainbow appears.
      (A prism works even better.) Name the colors in order.

      Safety: never look straight at the Sun, not even for a moment, and never through glass, a lens or sunglasses.'
  - - The idea in plain words
    - '~ What are these colours? Do they come from the glass? No; for you will remember to have seen them in the rainbow, and in the soap-bubble, and even in a drop
      of dew or the scum on the top of a pond.

      Say: Sunlight is all the colors traveling together. Water or glass bends each color a different amount, so they spread out.

      Optional: color a paper circle in slices of rainbow colors, push a pencil through the middle and spin it fast. It looks pale, almost white. Buckley warns that
      it will look a little dirty.'
  - - Tell it back and check
    - 'Your child explains where the rainbow on the wall came from. Then ask:

      1. Name the colors in order.

      2. Is the color in the glass, or in the sunlight?

      3. How do light waves get here: thrown like a ball, or passed along like a wave?'
  - - What we know now
    - 'Buckley says light waves travel in an invisible "ether" that fills space. Scientists later found there is no ether: light can travel through completely empty
      space. We also know light travels about 186,000 miles a second, and takes a little over 8 minutes to come from the Sun.'
  practice: 'Notice it this week: rainbows in soap bubbles, a sprinkler, a puddle with a little oil on it, or a CD. With the Sun behind you after a shower, look for
    a real rainbow.'
  tip: The rainbow is easiest in the morning or late afternoon, when sunlight comes in low through a window.
  answers: 1. Red, orange, yellow, green, blue, indigo, violet. 2. In the sunlight; the glass only spreads the colors apart. 3. As a wave.
  num: 5
  roman: Lecture II, part 2
  idx: 46
  unit: 2
- title: How we see colors, and the work of sunbeams
  mins: 25
  goal: Your child can explain that we see a thing because light bounces off it into our eyes, that a leaf looks green because it sends back the green light, and
    that sunbeams also bring heat.
  materials:
  - Sheets of white and black paper (or a white and a black T-shirt)
  - A green leaf, a red thing, and a mirror
  - A sunny spot
  - 'Optional: sun-print (cyanotype) paper and some lace or a leaf'
  book: Pages 42 to 49. How light waves bounce off things into our eyes; why glass is hard to see and a spoon shines; why a leaf looks green; the invisible heat waves
    in sunlight that lift water, make winds and warm us; and how sunbeams print a picture of lace on special paper.
  steps:
  - - Hook question
    - 'Turn off the light in a room with the curtains closed.

      Say: Why can''t we see the chair now? It is still there.

      Let your child think. (No light is coming from it to our eyes.)'
  - - Read together
    - 'Read pages 42 and 43, and the leaf on page 44.

      ~ So when you say a leaf is green, you mean that the leaf does not want the green waves of the sunbeam, but sends them back to you.

      ~ a white tablecloth sends back nearly the whole of the waves, and a black coat scarcely any.'
  - - 'Try it: white and black in the sun'
    - 'In a dim room, which is easier to see, the white paper or the black? (White: it sends back nearly all the light.)

      Now lay both sheets in the sunshine for ten minutes, then touch them. The black one feels warmer, because it keeps the light it takes in and turns it to heat.

      Look in the mirror: the light bounced off your face, then off the mirror, back into your eyes.'
  - - Sunbeams bring warmth
    - 'Read page 46.

      ~ Breathe upon your hand, and feel how hot your breath is; well, that heat which you feel, was once in a sunbeam

      Say: Plants catch sunlight to grow. We eat the plants (or animals that ate them). So the warmth of your body began as sunshine.'
  - - Sun pictures
    - 'Buckley made a picture of lace on paper soaked in a silver chemical. Don''t use those chemicals at home: they stain and sting skin.

      If you have sun-print paper (sold for children), lay a leaf or some lace on it in the sun for a few minutes, then rinse it in water as the packet says.'
  - - Tell it back and check
    - 'Your child explains why a leaf looks green. Then ask:

      1. Why can''t we see in the dark?

      2. Why is a white thing easier to see in dim light than a black one?

      3. Which got warmer in the sun, black or white? Why?'
  - - What we know now
    - Leaves soak up red and blue light most and use it to make their food; much of the green is bounced back, which is why leaves look green. Buckley ends by saying
      the old Greeks worshipped the Sun, and that "We are grateful for the sun instead of to him." Today we know the Sun is a huge ball of very hot gas that shines
      because of the energy made deep inside it.
  practice: 'Notice it this week: on a sunny day, touch a dark car and a light car (carefully: a dark car can be hot!), or dark and light clothes on a line. Which
    is warmer?'
  tip: Don't hold anything hot near a child's face, though Buckley suggests feeling the heat from a warm iron. The sun on dark paper shows the same thing safely.
  answers: 1. In the dark no light comes from things into our eyes. 2. White sends back nearly all the light that falls on it; black sends back very little. 3. The
    black paper, because it takes in the light and turns it into heat instead of sending it back.
  num: 6
  roman: Lecture II, part 3
  idx: 55
  unit: 2
- title: We live at the bottom of an ocean of air
  mins: 25
  goal: Your child can show that air is real stuff that takes up space, and can say that air is mostly nitrogen with oxygen mixed in, and that we breathe the oxygen.
  materials:
  - A clear bowl or sink of water
  - A clear plastic cup and a paper towel or tissue
  - A balloon
  - Science notebook and pencils
  book: Pages 50 to 55. Buckley watching fish in the Thames as a child; we live at the bottom of an "aerial ocean" like fish in water; an experiment burning phosphorus
    under a glass jar shows air is two gases, oxygen and nitrogen; why stuffy rooms are bad; and why we need lazy nitrogen as well as busy oxygen.
  steps:
  - - Hook question
    - 'Say: Fish live in water. What do we live in?

      Let your child think. Buckley wondered this as a child, sitting by a river watching the fish.'
  - - Read together
    - 'Read pages 50 and 51.

      ~ The something in which we live is air, and the reason that we do not perceive it, is that we are in it, and that it is a gas, and invisible to us

      ~ So he would call us all deep-air creatures, just as we talk of deep-sea animals'
  - - 'Try it: air takes up space'
    - 'Stuff the paper towel into the bottom of the cup so it stays put. Turn the cup upside down and push it straight down into the water. Lift it straight up. The
      towel is dry!

      Say: The cup was full of air, and the air kept the water out.

      Then blow up the balloon.

      Say: You just filled it with air from your body. Air is real stuff, even though we can''t see it.'
  - - 'Watch only: what is air made of?'
    - 'Watch only: don''t try this at home. Buckley burned a piece of phosphorus on a little plate floating under a glass jar standing in water.

      ~ See! as the phosphorus burns white fumes fill the jar.

      The burning used up the oxygen, the water rose in the jar to take its place, and a lighted taper let down into the gas left over went out. Phosphorus catches
      fire by itself and makes harmful fumes. Look for a video of a teacher doing a safe version instead.'
  - - The idea in plain words
    - '~ When this experiment is made very accurately, we find that for every pint of oxygen in air there are four pints of nitrogen

      Say: Oxygen is the busy part: we breathe it in and fires use it. Nitrogen is the lazy part that keeps the oxygen spread out. If air were all oxygen, fires would
      burn wildly.

      Buckley says plants take back the stale gas (carbon dioxide) we breathe out and give us fresh oxygen.'
  - - Tell it back and check
    - 'Your child tells back why we are "deep-air creatures." Then ask:

      1. How did the dry towel show that air is real?

      2. What two gases make up most of the air?

      3. Which one do we need to breathe?'
  - - What we know now
    - Air is about four-fifths nitrogen and one-fifth oxygen, just as Buckley says, with a little argon (found later, in 1894), carbon dioxide and water vapor. Please
      don't put an animal under a jar, as the book mentions; it would suffocate.
  practice: 'Notice it this week: things that show air is there: wind in the trees, a kite, bubbles coming up when you push an empty bottle under the bath water.'
  tip: Push the cup straight down and lift it straight up. If you tip it, bubbles escape and water gets in, which is a good second lesson in itself.
  answers: 1. The air in the cup kept the water from reaching the towel. 2. Nitrogen and oxygen. 3. Oxygen.
