- title: Taking a flower apart
  mins: 30
  goal: Your child can take a flower apart and name its parts (sepals, petals, stamens with pollen, and the pistil with its sticky top and seed-box), and say why
    insects visit flowers.
  materials:
  - 'A flower to take apart: a potted primrose from a garden center if you can find one; otherwise a lily, tulip, alstroemeria or any large simple flower'
  - A sheet of white paper, a magnifying glass and a toothpick
  - Clear tape
  - Science notebook and pencils
  book: Pages 162 to 170. Annual plants die after making seed, but the primrose stores food underground for next year; the parts of the primrose flower; the two kinds
    of primrose (stamens at the top of the tube, or the knob at the top); pollen growing down to the ovules to make seeds; why seeds are stronger when insects bring
    pollen from another flower; and the summary of the primrose's life.
  steps:
  - - Hook question
    - 'Say: Why does a primrose bother to be yellow? Green would protect its seeds just as well.

      Buckley calls this "a secret well worth knowing." Keep the question in mind.'
  - - Read together
    - 'Read pages 163 and 164.

      ~ Remember that the seed is the one important thing, and then notice how the flower protects it.

      The green outer cup (calyx) wraps the bud. The colored crown (corolla) opens next. Inside are little yellow bags full of dust:

      ~ the same as the powder which sticks to your nose when you put it into a lily'
  - - 'Try it: take a flower apart'
    - 'On the white paper, gently pull the flower apart from the outside in, laying each part in a row:

      1. The green sepals (the calyx).

      2. The colored petals (the corolla).

      3. The stamens: stalks with pollen bags on top. Tap one on the paper to see the pollen dust.

      4. The pistil in the middle: a sticky top (stigma), a stalk, and a fat seed-box at the bottom. Cut the seed-box open with a fingernail and look for the tiny
      ovules with the magnifying glass.

      Tape a sample of each part into the notebook and label it.

      Safety: lily pollen stains clothes, and lilies are poisonous to cats; wash hands afterward.'
  - - The two kinds of primrose
    - 'If you have a primrose, look down the tube: do you see the yellow pollen bags at the top, or a round green knob? Look at Fig. 43 on page 163. Some primroses
      have one kind, some the other. Buckley explains (pages 166 to 168) that a bee visiting both kinds carries pollen exactly from the right place in one to the
      right place in the other.

      ~ The seeds are much stronger and better if the dust or pollen of one flower is carried away and left on the knob or stigma of another flower'
  - - The secret of the golden crown
    - 'Read page 168.

      ~ And so we see that the pretty sweet-scented corolla is not only delightful for us to look at and to smell, but it is really very useful in helping the primrose
      to make strong healthy seeds

      Buckley says the tube tastes sweet with honey. Never eat or taste wild flowers, leaves or berries. Just look for the sweet spot at the bottom of the tube with
      the magnifying glass.'
  - - Tell it back and check
    - 'Your child tells the primrose''s life story from seed to seed. Then ask:

      1. What is the most important thing a flower makes?

      2. Where is the pollen?

      3. Why do flowers have bright colors and sweet smells?'
  - - What we know now
    - 'The two kinds of primrose are called "pin" (the knob at the top) and "thrum" (the pollen bags at the top). Charles Darwin studied them, just as Buckley says.
      Buckley ends by suggesting you burn dry leaves to see the stored sunbeams come back as flame; please don''t. And she says plant life is a mystery from the "Great
      Father": read that as your family wishes.'
  practice: 'Notice it this week: look into flowers in a yard or park for the pollen bags and the sticky middle. Is there an insect visiting?'
  tip: 'A tulip or lily is the easiest flower for small fingers: every part is big and clear. Save the primrose comparison for a day you can buy one.'
  answers: 1. Seeds. 2. In the little bags (anthers) on top of the stamens. 3. To bring insects, which carry pollen from flower to flower so the seeds grow strong.
  num: 21
  roman: Lecture VII, part 3
  idx: 177
