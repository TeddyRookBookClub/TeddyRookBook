- title: Dew, frost, and growing crystals
  mins: 25
  goal: Your child can explain how dew forms on cold grass, and can grow salt crystals by letting salty water dry slowly.
  materials:
  - A glass of ice water
  - A dish towel
  - Two tablespoons of salt dissolved in half a cup of warm water
  - A dark-colored saucer or plate
  - A magnifying glass
  - Science notebook and pencils
  book: Pages 81 to 88. Rain soaked up by plant roots; the invisible vapor in the air that shields us from the sun by day and keeps warmth in at night; how dew forms
    on cold grass but not under a cloth, under cobwebs or on gravel; hail and snow; and crystals of salt, sugar-candy and gems, with little bar magnets to show how
    the bits might line up.
  steps:
  - - Hook question
    - 'Say: On a summer morning the grass is wet, but it didn''t rain. Where did the water come from?

      Let your child guess.'
  - - 'Try it: make dew'
    - 'Wipe the outside of the glass of ice water dry and set it on the towel. Wait five minutes. The outside gets misty, then wet.

      Read page 84.

      ~ I have here a bottle of ice which has been kept outside the window. When I bring it into the warm room a mist forms rapidly outside the bottle.

      Say: The water came out of the air, not through the glass. The cold glass chilled the air next to it, and the invisible vapor turned to drops.'
  - - Dew on the grass
    - 'Read pages 83 to 85. On a clear night the thin grass blades lose their warmth fast and get cold, like our glass. Under a cloth spread on sticks there is hardly
      any dew, and there''s none on a gravel path.

      ~ you will see plenty of drops on the cobwebs themselves sparkling like diamonds

      Buckley also says the vapor in the air is a blanket that keeps the Earth from freezing at night.'
  - - 'Try it: grow salt crystals'
    - 'Read page 86.

      ~ If you melt salt in water and then let all the water evaporate slowly, you will get salt-crystals

      Pour a thin layer of your salty water onto the dark saucer and set it somewhere warm and still. Over the next few days, little square crystals will appear.
      Look at them with the magnifying glass. Look at some sugar and table salt, too.'
  - - Crystals everywhere
    - 'Read or tell page 87: cave icicles of lime, diamonds, quartz and many gems are all crystals. The tiny bits inside line up in a regular pattern. Buckley used
      small magnets to show how bits with two different ends might line up neatly. (She also grows crystals of nitre under a microscope; plain salt or sugar is the
      safe choice at home.)'
  - - Tell it back and check
    - 'Your child tells back how dew forms. Then ask:

      1. Where did the water on the outside of the cold glass come from?

      2. Why is there less dew on a cloudy night?

      3. What shape are salt crystals?'
  - - Draw it
    - Draw the cold glass with drops on it, and a blade of grass with dew drops. Later in the week, draw your salt crystals as you see them through the magnifying
      glass.
  practice: 'Notice it this week: go out early one clear morning and look for dew on grass, cars and spider webs. Is there any on the sidewalk? Check the salt saucer
    every day.'
  tip: Salt crystals grow best when the saucer is left completely alone. Put it on top of the fridge or a high shelf.
  answers: '1. Out of the air: the cold glass chilled the air, and the invisible vapor in it turned into drops. 2. The clouds send warmth back down, so the grass
    doesn''t get cold enough. 3. Little cubes (squares).'
  num: 11
  roman: Lecture IV, part 2
  idx: 94
  unit: 4
- title: Snowflakes, ice, glaciers, and the salty sea
  mins: 30
  goal: Your child can say that snowflakes are six-pointed crystals, that water swells when it freezes, that icebergs float mostly under water, and why the sea is
    salty.
  materials:
  - A small plastic cup of water and a marker
  - A freezer
  - A clear glass of water and an ice cube
  - Black paper or a dark cloth (if it is snowing)
  - Paper and scissors for a paper snowflake
  - Science notebook and pencils
  book: Pages 89 to 98. Snowflakes as six-pointed crystal stars; looking at melting ice with a magnifying glass; why ice takes more room than water and bursts pipes;
    snow pressed into glaciers and icebergs; hard water; why the sea is salt; and the end of the drop's travels.
  steps:
  - - Hook question
    - 'Say: Every snowflake is different. But they all share one thing. Can you guess what?

      Then read page 89.

      ~ you will see that the snow-flakes are not mere lumps of frozen water, but beautiful six-pointed crystal stars'
  - - 'Try it: ice needs more room'
    - 'Fill the plastic cup about half full of water and mark the level. Put it in the freezer. Tomorrow, look: the ice is higher than the mark.

      ~ And this leads us to notice that ice always takes up more room than water, and that this is the reason why our water-pipes burst in severe frosts

      Now drop the ice cube into the glass of water. It floats, with most of it under the water.

      Say: That''s why icebergs are so dangerous to ships. Most of the iceberg is hidden.'
  - - Make a six-pointed snowflake
    - Fold and cut a paper snowflake with six points. (Fold a circle in half, then fold it into thirds, then cut shapes.) If it is snowing, catch flakes on black
      paper and look closely with a magnifying glass before they melt.
  - - Rivers of ice
    - 'Read or tell pages 92 to 94. Snow on high mountains piles up and gets squeezed into clear ice that creeps slowly downhill.

      ~ Then we have what is called a "glacier," or river of ice

      In Greenland the glaciers reach the sea and pieces snap off as icebergs.'
  - - Why is the sea salty?
    - 'Read or tell pages 95 to 97. Rivers carry tiny bits of salt and lime from the land, too small to see. The sun lifts only pure water out of the sea, so the
      salt is left behind.

      If you like, leave a saucer of salty water in the sun for a few days (instead of boiling sea water on the stove, as Buckley suggests).'
  - - Tell it back and check
    - 'Your child tells the whole journey of the drop from Lecture IV: sea, vapor, cloud, rain or snow, river or glacier, back to the sea.

      ~ Ever onwards it goes, up and down, and round and round the world, taking many forms, and performing many wonderful feats.

      Then ask:

      1. How many points does a snowflake have?

      2. Why do water pipes burst in a hard frost?

      3. Why is the sea salty but rain is not?'
  - - What we know now
    - 'Buckley guessed that the tiny bits of water have two different ends, like her magnets, and line up into crystals. She was close: each water molecule has a
      slightly positive side and a slightly negative side, and these pull water into its six-sided pattern when it freezes.'
  practice: 'Notice it this week: check the cup in the freezer, ice cubes floating in drinks, and (in winter) frost patterns and snowflakes.'
  tip: An ice cube floats with about nine-tenths of itself under water. Look at it from the side of the glass to see.
  answers: 1. Six. 2. Water takes up more room when it freezes, so the ice pushes the pipe until it cracks. 3. Rivers carry salt into the sea, and the sun lifts out
    only pure water, so the salt stays behind; rain is made from that pure water.
  num: 12
  roman: Lecture IV, part 3
  idx: 102
  unit: 4
- title: 'Water the sculptor: rain and rivers carve the land'
  mins: 30
  goal: Your child can explain that rain and rivers slowly carry soil away and carve the land, and can make "earth pillars" with a watering can.
  materials:
  - A baking tray with a mound of damp sand or garden soil
  - A few coins, bottle caps or flat pebbles
  - A watering can or a cup with holes poked in the bottom
  - A clear jar of muddy water (soil stirred into water)
  - Science notebook and pencils
  book: Pages 99 to 105. A sculptor chips a statue out of stone; water and ice carve the hills and valleys the same way. Rain makes earth-pillars in the Tyrol and
    landslips on the Isle of Wight; little rills join into streams and rivers; and a glass of river water left to stand shows the mud the river carries away.
  steps:
  - - Hook question
    - 'Say: Who made the valleys and the hills?

      Let your child answer. Buckley''s answer is a surprise: mostly water, very slowly.'
  - - Read together
    - 'Read pages 99 to 101. A sculptor cuts a statue out of a rough block, a chip at a time.

      ~ Day by day and year by year, while everything seems to us to remain the same, this industrious sculptor is chipping away, a few grains here, a corner there,
      a large mass in another place'
  - - 'Try it: make earth pillars'
    - 'Look at the picture of earth-pillars on page 102. Lay coins and flat pebbles on top of your mound of damp sand. Sprinkle "rain" gently over it from the watering
      can for a few minutes. The sand washes away except under the coins, leaving little pillars with caps, just like the ones in the picture.

      Do this outside or in the bathtub.'
  - - Rills to rivers
    - 'Read page 104.

      ~ Look out some day into the road or the garden where the ground slopes a little, and watch what happens during a shower of rain.

      Drops collect in hollows, then run in little rills, which join into bigger streams, and so on to a river and the sea. Buckley says the Thames drains rain from
      about a seventh of England.'
  - - 'Try it: what the river carries'
    - '~ If you will only take a glass of water out of any river, and let it stand for some hours, you will soon answer this question for yourself.

      Shake up the jar of muddy water and set it where it won''t be moved. Look again at the end of the lesson and tomorrow: a layer of mud has settled at the bottom.
      A river carries land away like that, every day.'
  - - Tell it back and check
    - 'Your child tells back how the earth pillars got their caps. Then ask:

      1. Why does Buckley call water a sculptor?

      2. Where does a river''s water come from?

      3. What did the jar of river water show?'
  - - What we know now
    - Buckley says mountains were first pushed up by earthquakes and the Earth shrinking. Today we know the Earth's outer shell is broken into huge plates that move
      very slowly; where they push together, mountains rise. Then water and ice carve them, as she says.
  practice: 'Notice it this week: after rain, look for little rills of water on a slope, muddy puddles, soil washed onto a sidewalk, or pebbles left standing on a
    washed patch of dirt.'
  tip: Damp (not wet) sand holds its shape best for the earth pillars. Sprinkle gently; a hard pour just washes everything flat.
  answers: 1. Because, like a sculptor's chisel, it slowly cuts away the land, a little at a time, and shapes the hills and valleys. 2. From rain (and melting snow)
    that runs down slopes in little rills that join together. 3. That even clear-looking river water carries mud, which settles out when the water stands still.
  num: 13
  roman: Lecture V, part 1
  idx: 112
  unit: 5
- title: Ravines, waterfalls, canyons and deltas
  mins: 30
  goal: Your child can explain how a stream cuts a ravine and a waterfall eats back its cliff, and can show that heavy stones sink first and fine mud last.
  materials:
  - A clear jar with a lid
  - A handful each of small stones, sand and garden soil
  - Water
  - A world map or globe (a free online one is fine)
  - Science notebook and pencils
  book: Pages 106 to 114. A ravine growing from a furrow; pebbles rounded in a stream; waterfalls and pot-holes; Niagara Falls eating back its cliff; the Great Canon
    (Grand Canyon) of the Colorado River, with a full-page picture; gravel and sand sinking in water; and the Nile delta made of river mud.
  steps:
  - - Hook question
    - 'Show a smooth, round pebble if you have one.

      Say: Rocks break off cliffs with sharp corners. So how do pebbles get round?

      Let your child guess. (Rolling and grinding in a stream.)'
  - - Read together
    - 'Read page 107 (the ravine) and page 109 (pot-holes).

      Water runs down a little groove, frost cracks the sides, and the stream rolls the pieces over and over until they are round pebbles. In a pot-hole, swirling
      water spins pebbles round and round,

      ~ just as you grind round a pestle in a mortar.'
  - - Famous carvings
    - 'Find Niagara Falls and the Grand Canyon on the map.

      ~ These falls are not nearly so high as many people imagine, being only 165 feet

      The falls have cut a gorge seven miles long by wearing back their cliff, little by little. Look at the picture of the Great Canon facing page 111.

      ~ For more than three hundred miles the River Colorado, coming down from the Rocky Mountains, has eaten its way through a country made of granite and hard beds
      of limestone and sandstone'
  - - 'Try it: what sinks first'
    - 'Read page 112.

      ~ If you take a handful of gravel and throw it into a glass full of water, you will notice that the stones in it will fall to the bottom at once, the grit and
      coarse sand will take longer in sinking, and lastly, the fine sand will be an hour or two in settling down, so that the water becomes clear.

      Put the stones, sand and soil in the jar, fill it with water, close the lid tightly and shake. Set it down and watch. Check again tomorrow. Draw the layers.'
  - - New land from mud
    - Read or tell pages 113 and 114. When a river slows down at the sea, it drops its mud and makes new land called a delta. Find the Nile and the Mississippi on
      the map. Whole towns are built on old river mud.
  - - Tell it back and check
    - 'Your child tells back how a stream makes a ravine. Then ask:

      1. Why are stream pebbles round?

      2. In your jar, what reached the bottom first? What took longest?

      3. What is a delta made of?'
  - - What we know now
    - Today Niagara Falls wears back more slowly than in Buckley's time, because much of its water is sent through power stations. The Grand Canyon is still one of
      the best places on Earth to see what a river can carve.
  practice: 'Notice it this week: look at stones in a creek or gravel path: round or sharp? After rain, look where muddy water slows down and leaves its sand.'
  tip: Use a jar with a tight lid, and let your child do the shaking. Leave the jar out for a day; the finest mud settles very slowly, just as Buckley says.
  answers: 1. The stream rolls them over and over and grinds them against each other until the corners wear off. 2. The stones first, then the sand; the fine mud
    took longest. 3. Mud and sand that a river drops where it slows down at the sea.
  num: 14
  roman: Lecture V, part 2
  idx: 119
  unit: 5
- title: Caves, cliffs, frost and glaciers
  mins: 30
  goal: Your child can explain how stalactites grow, how waves wear away cliffs, and how glaciers carry stones and scratch the rocks beneath them.
  materials:
  - An ice cube made with sand and small pebbles frozen into it (freeze it the night before)
  - A lump of play dough or modeling clay
  - Science notebook and pencils
  book: Pages 115 to 123. Water dripping in caves builds stalactites and stalagmites; storm waves hurl stones at cliffs and hollow out caves; frost breaks up soil
    for the farmer; glaciers bend, carry lines of stones (moraines), and scratch and round the rocks with stones frozen into their bottoms; and huge "erratic blocks"
    left all over northern Europe by the ice of long ago.
  steps:
  - - Hook question
    - 'Say: In some caves there are stone icicles hanging from the roof. How could stone drip?

      Let your child guess, then read page 115.

      ~ These rods are called stalactites'
  - - The idea in plain words
    - 'Water trickling through the rock carries a little dissolved lime. Each drip leaves a tiny bit behind, and a stone icicle slowly grows down from the roof. Where
      the drops land, a pillar (a stalagmite) grows up. Sometimes they meet.

      Then read or tell pages 116 to 118: storm waves throw stones against cliffs and hollow out caves.'
  - - Frost and ice
    - 'Read page 118.

      ~ The farmers know this, and always plough after a frost, because the moisture, freezing in the ground, has broken up the clods, and done half their work for
      them.

      Look at the frontispiece, the picture at the very front of the book: a glacier carrying long lines of stones down the valley.'
  - - 'Try it: a glacier in your hand'
    - 'Flatten the play dough into a smooth slab. Rub the plain top of your sandy ice cube across it: hardly a mark. Now turn it over and rub the side with stones
      frozen in it. Scratches!

      Say: Glaciers carry stones frozen into their bottoms, like the blade of a carpenter''s plane. As the ice creeps along, the stones scratch and grind the rock.'
  - - Clues the ice left behind
    - 'Read page 121.

      ~ These rounded rocks are called "roches moutonnees," because at the distance they look like sheep lying down.

      Read or tell page 122: huge blocks "as big as cottages" were carried hundreds of miles by ice and left behind when it melted. In 1840 the scientist Agassiz
      showed that ice had carried them.'
  - - Tell it back and check
    - 'Your child tells back how a stalactite grows, or how a glacier scratches rock. Then ask:

      1. What does a stalactite grow from?

      2. Why do farmers like a frost before ploughing?

      3. What made the scratches in your play dough?'
  - - What we know now
    - The last Ice Age ended about 12,000 years ago. Thick ice then covered much of northern Europe and North America, and its scratched rocks and big boulders can
      still be found in many places, including the northern United States.
  practice: 'Notice it this week: icicles growing drip by drip, cracked sidewalks where water froze in the cracks, or big lone boulders in a field or park.'
  tip: Make the sandy ice cube by putting a spoonful of sand and a few tiny pebbles in an ice-cube tray or paper cup of water. Most will sink to the bottom, which
    is just where a glacier carries its stones.
  answers: 1. From drips of water that leave behind a tiny bit of the lime they carried through the rock. 2. The water in the ground freezes, swells and breaks up
    the clods for them. 3. The sand and pebbles frozen into the ice, just like the stones in the bottom of a glacier.
