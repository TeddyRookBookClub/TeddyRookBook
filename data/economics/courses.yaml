# Economics Ladder courses, bottom rung to top rung (the order of this list is the ladder).
# Contract: /tmp/briefs/ladders_spec.md section 2 and /tmp/briefs/mathladder_spec.md section 3.
# Skill maps live in data/economics/topics/<key>.json.
- key: micro
  slug: microeconomics
  title: "Microeconomics"
  short: "Micro"
  band: "High school"
  grade: "12"
  icon: "🛒"
  color: "#2f8f5b"
  blurb: "How people and firms choose when resources are scarce: supply and demand, elasticity, costs, competition and monopoly, labor markets, and when markets fall short."
  after: [alg1]
- key: macro
  slug: macroeconomics
  title: "Macroeconomics"
  short: "Macro"
  band: "High school"
  grade: "12"
  icon: "🏦"
  color: "#1f7a8c"
  blurb: "The whole economy: GDP, unemployment and inflation, money and banks, the business cycle, fiscal and monetary policy, growth and trade."
  after: [micro]
- key: imicro
  slug: intermediate-microeconomics
  title: "Intermediate Microeconomics"
  short: "Int. Micro"
  band: "College"
  grade: "College"
  icon: "🧠"
  color: "#5a5fb0"
  blurb: "Microeconomics with calculus: utility maximization and demand, production and cost, markets, game theory, uncertainty and information."
  after: [micro, calc1]
