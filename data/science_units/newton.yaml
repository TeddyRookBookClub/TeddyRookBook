key: newton
slug: newtons-laws
title: "Newton’s Laws of Motion"
short: "Newton’s Laws"
icon: "🍎"
card: "Six chapters on how everything moves, with simulations, missions, quizzes and Newton’s own words."
chapters:
  - key: first-law
    num: 1
    icon: "🏒"
    title: "The First Law: Inertia"
    short: "Roll a ball between Galileo’s ramps and coast a probe through space: moving things keep moving until a force changes that."
  - key: second-law
    num: 2
    icon: "🛒"
    title: "The Second Law: F = ma"
    short: "Push a cart, watch its motion graphs, and drop a hammer and a feather on the Moon: F = ma."
  - key: third-law
    num: 3
    icon: "⛸️"
    title: "The Third Law: Action and Reaction"
    short: "Push two skaters apart and solve the horse-and-cart puzzle: every force has an equal and opposite partner."
  - key: forces
    num: 4
    icon: "🧗"
    title: "Forces at Work: Free-Body Diagrams"
    short: "Tilt a ramp till it slips, ride an elevator on a scale, race weights over a pulley, and draw free-body diagrams."
  - key: momentum
    num: 5
    icon: "🎱"
    title: "Momentum and Collisions"
    short: "Crash gliders, drop eggs on pillows and split pool balls at 90°: momentum always survives, energy doesn’t."
  - key: circles-and-gravity
    num: 6
    icon: "🌙"
    title: "Circles and Gravity: The Apple and the Moon"
    short: "Cut a whirling string, take a banked curve, and check with Newton that the Moon falls like an apple."
