key: econ
slug: econometrics
section: business
section_title: Business
title: "Econometrics: From Data to Cause and Effect"
short: "Econometrics"
icon: "📈"
card: "Seventeen chapters from a cloud of points to Nobel-prize methods: live regressions, Monte Carlo labs and practice with answers."
chapters:
  - {key: what-is-econometrics, num: 1, icon: "🔍", title: "What Econometrics Is: Data, Models and Cause", short: "A beach town where ice cream seems to cause rescues, until you hold the weather fixed, and why a coin flip beats self-selection."}
  - {key: probability, num: 2, icon: "🎲", title: "Probability and Distributions", short: "Shape seven distributions, sample thousands of draws, and watch averages of lopsided data pile into a bell."}
  - {key: estimation-and-inference, num: 3, icon: "🎯", title: "Estimation and Inference", short: "A machine that builds 100 confidence intervals at a time, a dartboard of estimators, and p-values you can see."}
  - {key: simple-regression, num: 4, icon: "📏", title: "Simple Regression: Fitting a Line", short: "Drag points and watch least squares refit with every residual drawn as a square, then meet Galton’s regression to the mean."}
  - {key: regression-inference, num: 5, icon: "📐", title: "Inference in Regression", short: "Draw 20,000 samples, then break the assumptions one by one to see which cause bias and which only fool the standard errors."}
  - {key: multiple-regression, num: 6, icon: "🧮", title: "Multiple Regression and Omitted Variables", short: "Leave ability out of a wage regression and watch the bias match the omitted-variable formula, then turn a 3-D regression plane."}
  - {key: functional-form, num: 7, icon: "〽️", title: "Logs, Dummies and Interactions", short: "Fit four log and level models to one data set, read each slope in plain English, find a career’s peak and split lines with dummies."}
  - {key: heteroskedasticity, num: 8, icon: "📊", title: "Heteroskedasticity and Robust Standard Errors", short: "Fan out the noise and run 2,000 samples: classic 95% intervals fall short while robust ones hold."}
  - {key: specification, num: 9, icon: "🔧", title: "Specification, Measurement Error and Outliers", short: "Blur a variable and watch the slope shrink, drag an outlier until it bends the line, and overfit a polynomial."}
  - {key: instrumental-variables, num: 10, icon: "🎻", title: "Instrumental Variables and 2SLS", short: "Use college proximity to untangle schooling from ability, then weaken and break the instrument to see 2SLS fail."}
  - {key: panel-data, num: 11, icon: "🗂️", title: "Panel Data: Fixed and Random Effects", short: "Follow cities over time: pooled OLS gets police and crime backward until fixed effects compares each city with itself."}
  - {key: difference-in-differences, num: 12, icon: "↔️", title: "Difference-in-Differences and Event Studies", short: "Break parallel trends, read event studies, and watch two-way fixed effects get the sign wrong."}
  - {key: regression-discontinuity, num: 13, icon: "✂️", title: "Regression Discontinuity", short: "Measure the jump at a cutoff, balance bias against noise, and catch people gaming the line."}
  - {key: binary-outcomes, num: 14, icon: "🔘", title: "Binary Outcomes: Logit, Probit and Maximum Likelihood", short: "Straight lines vs S-curves for yes-or-no data, and maximum likelihood climbed by hand."}
  - {key: time-series, num: 15, icon: "⏱️", title: "Time Series: Trends, Autocorrelation and Forecasting", short: "From white noise to random walks: memory, spurious regressions, forecasts and cointegration."}
  - {key: macro-tools, num: 16, icon: "🌐", title: "VARs and GMM", short: "Shock a small economy, read impulse responses, and catch a bad instrument with GMM."}
  - {key: modern-causal-inference, num: 17, icon: "🧠", title: "Modern Causal Inference", short: "Causal diagrams, matching, synthetic twins and double machine learning."}
