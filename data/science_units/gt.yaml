title: "Game Theory: The Science of Strategy"
short: "Game Theory"
icon: "♟️"
card: "A fourteen-chapter course in strategy, from the prisoner’s dilemma to auctions, signaling and mechanism design, with a game in every chapter."
chapters:
  - {key: games-and-payoffs, num: 1, icon: "🎲", title: "Games, Players and Payoffs", short: "Guess two thirds of the average against a crowd of level-k thinkers, then build games and play bots with personalities."}
  - {key: dominance, num: 2, icon: "⛓️", title: "Dominance and the Prisoner’s Dilemma", short: "Cross out dominated actions until a game solves itself, fall into the prisoner’s dilemma, and watch a public-goods game unravel."}
  - {key: nash-equilibrium, num: 3, icon: "🤝", title: "Nash Equilibrium", short: "Underline best responses to find Nash equilibria in coordination, chicken and the stag hunt, and test your feel for focal points."}
  - {key: mixed-strategies, num: 4, icon: "✊", title: "Mixed Strategies and Zero-Sum Games", short: "Play rock-paper-scissors against a bot that reads you, solve any 2×2 game by indifference, and take penalties at minimax."}
  - {key: competition, num: 5, icon: "🏪", title: "Competition: Cournot, Bertrand and Hotelling", short: "Watch Cournot firms settle into equilibrium, start a Bertrand price war, and walk ice-cream sellers to the median."}
  - {key: sequential-games, num: 6, icon: "🌳", title: "Sequential Games and Backward Induction", short: "Build and solve game trees, unmask empty threats, deter entry with commitment, and lead a Stackelberg market."}
  - {key: repeated-games, num: 7, icon: "🔁", title: "Repeated Games and Cooperation", short: "Run an Axelrod tournament with your own strategy, add noise and evolution, and find the δ that makes cooperation pay."}
  - {key: incomplete-information, num: 8, icon: "🙈", title: "Incomplete Information and Bayesian Games", short: "Run a used-car market where only sellers know the lemons, watch it unravel, and fix it with warranties and inspections."}
  - {key: auctions, num: 9, icon: "🔨", title: "Auctions", short: "Bid against computer rivals in four auction formats, test revenue equivalence, and fall for the winner’s curse."}
  - {key: signaling, num: 10, icon: "🎓", title: "Signaling and Screening", short: "Set what the good job requires and watch job seekers signal, then measure cheap talk and design a menu that sorts customers."}
  - {key: bargaining, num: 11, icon: "🤲", title: "Bargaining", short: "Haggle over a $100 pie with bots that differ only in patience, then find Nash’s solution as the biggest rectangle."}
  - {key: mechanism-design, num: 12, icon: "⚙️", title: "Mechanism Design and Matching", short: "Run the matching algorithm behind the medical residency match, try to cheat it, and see a tax that makes honesty pay."}
  - {key: cooperative-games, num: 13, icon: "🧩", title: "Coalitions, the Core and the Shapley Value", short: "Pay each player what they add, find splits no group would reject, and discover who really holds power in a vote."}
  - {key: evolutionary-games, num: 14, icon: "🦅", title: "Evolutionary Game Theory", short: "Watch hawks and doves find a balance, cooperators build kaleidoscopes on a grid, and lizards cycle like rock–paper–scissors."}
