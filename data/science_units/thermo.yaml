# The Laws of Thermodynamics: a Science Lab unit at /science-lab/thermodynamics/.
# Each chapter is content/science-lab/thermodynamics/<key>.md with layout thermo-<key> (layouts/science-lab/thermo-<key>.html)
# and its files in static/science-lab/thermodynamics/<key>/.
key: thermo
slug: thermodynamics
title: "The Laws of Thermodynamics"
short: "Thermodynamics"
icon: "🔥"
card: "Five chapters of simulations on heat, energy, entropy, engines and absolute zero: the four laws of thermodynamics, played with."
chapters:
  - key: zeroth-law
    num: 1
    icon: "🌡️"
    title: "Temperature and the Zeroth Law"
    short: "Press copper, iron, granite, water and wood together and watch heat flow until they share one temperature."
  - key: first-law
    num: 2
    icon: "⚙️"
    title: "Energy and the First Law"
    short: "Heat, squeeze and stretch a gas, trace its P–V path, and watch ΔU = Q − W balance to the joule."
  - key: second-law
    num: 3
    icon: "🎲"
    title: "Entropy and the Second Law"
    short: "Run a gas backward and watch it un-spread, nudge one atom by a billionth and watch the trick fail, and play Maxwell’s demon."
  - key: engines
    num: 4
    icon: "🚂"
    title: "Engines, Refrigerators and Heat Pumps"
    short: "Run Carnot’s ideal engine with heat and work drawn to scale, then run it backward as a heat pump, and watch a Stirling engine run on coffee."
  - key: third-law
    num: 5
    icon: "❄️"
    title: "Absolute Zero and the Third Law"
    short: "Climb down a cooling ladder that never reaches the bottom, evaporate atoms into a Bose–Einstein condensate, and zoom a thermometer from picokelvins to fusion plasma."
