# Reading Paths (/books/paths/). Each step names a book in content/books/ by its file name.
# free: true adds a "find a free copy" link (old enough to be in the public domain in a free translation).
# extra: links to related things on the site: [label, url]
- id: greeks
  title: "Start with the Greeks"
  icon: "🏛️"
  blurb: "From fables to philosophy in seven books, roughly in the order they were written."
  steps:
    - book: aesops-fables
      free: true
      note: "Short and easy, and a gentle first taste of the Greek way of telling a story with a point."
    - book: the-iliad
      free: true
      note: "A few weeks in the tenth year of the Trojan War, and the anger of Achilles. Everything later in Greek literature looks back to it."
    - book: the-odyssey
      free: true
      note: "Odysseus's long voyage home, and the most readable of the ancient epics."
    - book: anabasis
      free: true
      note: "A true adventure: ten thousand Greek soldiers stranded in Persia, told by one of their generals."
    - book: the-republic
      free: true
      note: "Socrates asks what justice is, and builds an ideal city to find out."
    - book: nicomachean-ethics
      free: true
      note: "Aristotle on happiness, virtue and friendship. Slower going, but it repays the effort."
    - book: plutarchs-lives
      free: true
      note: "Dip in anywhere: lives of famous Greeks and Romans, side by side."
  extra:
    - ["Timeline: Classical Greece", "/timeline/#era-classical"]
    - ["Infographic: The Iliad, What Followed", "/infographics/iliad-what-followed/"]
    - ["Read Aesop in Greek", "/languages/readings/"]
- id: romans
  title: "Rome in Its Own Words"
  icon: "🦅"
  blurb: "Soldiers, statesmen, poets and philosophers: Rome from the late Republic to its fall."
  steps:
    - book: the-gallic-war
      free: true
      note: "Caesar's own report of his conquest of Gaul, in clear, plain prose."
    - book: on-duties
      free: true
      note: "One of Cicero's last books, written for his son in the year Caesar was killed: how to live honourably."
    - book: the-early-history-of-rome
      free: true
      note: "Livy's story of Rome's beginnings, from Romulus to the Gauls, full of the legends Romans told about themselves."
    - book: the-aeneid
      free: true
      note: "Virgil's epic of Aeneas, the Trojan who fled to Italy, and Rome's answer to Homer."
    - book: metamorphoses
      free: true
      note: "Ovid's book of transformations, and the source of most of the myths we know."
    - book: moral-letters-to-lucilius
      free: true
      note: "Seneca's letters on how to live and how to face death, short enough to read one a day."
    - book: meditations
      free: true
      note: "An emperor's private notes to himself. Best read slowly, a few pages at a time."
    - book: city-of-god
      free: true
      note: "Augustine's answer to the sack of Rome in 410. Long, so many readers choose selections."
    - book: the-decline-and-fall-of-the-roman-empire
      free: true
      note: "Gibbon's great history of how it all came apart, in famously elegant English."
  extra:
    - ["Timeline: the Roman Republic and Empire", "/timeline/?show=rome"]
    - ["Infographic: City of God on One Page", "/infographics/city-of-god-one-page/"]
    - ["Sentences from Caesar and Cicero", "/languages/sentences/"]
- id: myths
  title: "Myths and Legends"
  icon: "🐉"
  blurb: "Gods and heroes from Greece to the North, then on into the legends of King Arthur."
  steps:
    - book: a-treasury-of-greek-mythology
      note: "Start with the Greek myths themselves, retold for easy reading."
    - book: metamorphoses
      free: true
      note: "Then read many of the same stories as Ovid told them."
    - book: a-treasury-of-norse-mythology
      note: "Odin, Thor, Loki and the end of the world."
    - book: irish-mythology-and-fairy-tales
      note: "The heroes and the fairy folk of Ireland."
    - book: beowulf
      free: true
      note: "The Old English poem of a hero, a monster, the monster's mother and a dragon."
    - book: the-story-of-king-arthur-and-his-knights
      free: true
      note: "Howard Pyle's lively retelling, a good way into the Arthurian world."
    - book: the-song-of-roland
      free: true
      note: "Charlemagne's rearguard holds the pass at Roncevaux: the great epic of medieval France."
    - book: sir-gawain-and-the-green-knight
      note: "The finest of the medieval Arthurian poems, here in Tolkien's translation."
    - book: idylls-of-the-king
      free: true
      note: "Tennyson's Victorian Arthur, in verse."
  extra:
    - ["Infographic: Four Doors into Camelot", "/infographics/four-doors-into-camelot/"]
    - ["Infographic: The Fairy Tale Shelf", "/infographics/fairy-tale-shelf/"]
- id: faith
  title: "Faith and Reason"
  icon: "✝️"
  blurb: "Christian thought from Augustine to C. S. Lewis, with the great poems along the way."
  steps:
    - book: the-holy-bible
      free: true
      note: "Where everything else on this path begins. The Gospels are a good place to start."
    - book: confessions
      free: true
      note: "Augustine's own story of his search for God: the first great autobiography."
    - book: city-of-god
      free: true
      note: "Augustine on the two cities, the earthly and the heavenly."
    - book: the-consolation-of-philosophy
      free: true
      note: "Written in a prison cell: Lady Philosophy teaches Boethius why fortune cannot touch what matters most."
    - book: the-divine-comedy
      free: true
      note: "Dante's journey through Hell and Purgatory to Paradise."
    - book: paradise-lost
      free: true
      note: "Milton's epic of the fall of Satan and of Adam and Eve."
    - book: the-pilgrims-progress
      free: true
      note: "Bunyan's allegory of the Christian life as a journey."
    - book: orthodoxy
      free: true
      note: "Chesterton explains, with great good humour, how he came to believe."
    - book: the-everlasting-man
      note: "Chesterton again, on human history and the place of Christ in it."
    - book: mere-christianity
      note: "C. S. Lewis's wartime radio talks on what Christians have always believed."
    - book: the-screwtape-letters
      note: "Letters from a senior devil to his nephew: Lewis's sharpest and funniest book."
    - book: out-of-the-silent-planet
      note: "The first of Lewis's Space Trilogy, followed by Perelandra and That Hideous Strength: the same ideas, told as science fiction."
  extra:
    - ["Infographic: Faith and Works", "/infographics/faith-and-works/"]
    - ["Infographic: Four Bets on the Afterlife", "/infographics/four-bets-afterlife/"]
    - ["Gospel reader in Greek and Latin", "/languages/reader/"]
- id: latin
  title: "Learning Latin"
  icon: "📜"
  blurb: "From your first noun to reading real Latin, with the site's own tools alongside."
  steps:
    - book: wheelocks-latin
      note: "The standard course: forty chapters, each with readings from real Roman authors."
    - book: workbook-for-wheelocks-latin
      note: "Exercises to go with each chapter."
    - book: allen-and-greenoughs-new-latin-grammar
      free: true
      note: "The reference grammar to keep beside you."
    - book: cassells-latin-dictionary
      note: "A good desk dictionary, Latin to English and English to Latin."
    - book: wheelocks-latin-reader
      note: "Your first longer passages of real Latin, with notes."
    - book: winnie-ille-pu
      note: "A treat: Winnie-the-Pooh in Latin."
  extra:
    - ["Flashcards", "/languages/flashcards/"]
    - ["Sentence practice", "/languages/sentences/"]
    - ["Read Phaedrus's fables in Latin", "/languages/readings/"]
    - ["Daily Word Puzzle", "/games/daily/"]
- id: gothic
  title: "Gothic and Strange"
  icon: "🦇"
  blurb: "Monsters, doubles and haunted minds, from Mary Shelley to Oscar Wilde."
  steps:
    - book: frankenstein
      free: true
      note: "Often called the first science-fiction novel, begun when Mary Shelley was eighteen."
    - book: complete-tales-and-poems-of-edgar-allan-poe
      free: true
      note: "Start with The Tell-Tale Heart and The Fall of the House of Usher."
    - book: dr-jekyll-and-mr-hyde
      free: true
      note: "Short enough to read in an evening, and better if you can forget you know the twist."
    - book: the-picture-of-dorian-gray
      free: true
      note: "A portrait that ages so its owner does not."
    - book: dracula
      free: true
      note: "Told in letters and diaries, which makes it feel surprisingly modern."
  extra:
    - ["Infographic: Frankenstein and Dracula", "/infographics/frankenstein-dracula/"]
- id: russians
  title: "The Russian Giants"
  icon: "❄️"
  blurb: "The great nineteenth-century novels, then the Soviet century that followed."
  steps:
    - book: crime-and-punishment
      free: true
      note: "A murder, and what it does to the murderer. The best first Dostoevsky."
    - book: notes-from-underground
      free: true
      note: "Short, bitter and funny: the voice of the underground man opens the door to all of Dostoevsky's great novels."
    - book: anna-karenina
      free: true
      note: "Tolstoy's novel of love, marriage and society."
    - book: chekhov-plays
      free: true
      note: "The great plays, from The Seagull to The Cherry Orchard."
    - book: the-death-of-ivan-ilyich
      free: true
      note: "A judge faces death and asks whether he has lived well. Tolstoy's most perfect short work."
    - book: the-idiot
      free: true
      note: "A truly good man, Prince Myshkin, among the greedy and the passionate of St Petersburg."
    - book: demons
      free: true
      note: "A comic and terrifying novel about a small town taken over by revolutionaries."
    - book: the-brothers-karamazov
      free: true
      note: "Dostoevsky's last and greatest novel: three brothers, a murdered father, and the question of God."
    - book: war-and-peace
      free: true
      note: "Napoleon's invasion of Russia and five families caught up in it. Keep the who's who handy."
    - book: the-master-and-margarita
      note: "The Devil visits Soviet Moscow, in a comic novel that could not be published in Bulgakov's lifetime."
    - book: the-gulag-archipelago
      note: "Solzhenitsyn's history of the Soviet prison camps, from the inside."
  extra:
    - ["Infographic: The Brothers Karamazov, Who's Who", "/infographics/karamazov-whos-who/"]
    - ["Infographic: War and Peace, Who's Who", "/infographics/war-and-peace-whos-who/"]
