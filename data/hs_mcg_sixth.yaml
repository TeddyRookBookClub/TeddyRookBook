  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: experiment, heretofore. Read the note at the end, which sends you back to Rule V in the elocution section.'
  - - About the author
    - The book says Charles James Fox (1749-1806) was a famous English orator and statesman, son of Henry Fox, educated at Westminster, Eton and Oxford, and in Parliament before he was twenty. He favored the American colonies in the Revolution and was a friend of Burke, who called him "the most brilliant and successful debater the world ever saw."
  - - Read it aloud
    - 'Your student reads the speech aloud with growing force. Two lines to find:

