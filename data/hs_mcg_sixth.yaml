book:
  id: mcguffeyseclecti06mcgu_0
  title: McGuffey's Sixth Eclectic Reader, Revised Edition
  year: 1879 (revised edition)
  key: mcg-sixth
  short: Sixth Reader
  eyebrow: McGuffey's Readers · Sixth Reader · revised edition
  hero: 'The last and fullest McGuffey reader: an opening course in elocution, then 138 selections by great English and American writers, with author notes, definitions and notes, for students about 13 and up. Every lesson has a guide you can follow step by step, with the right page of the book beside it.'
  how:
  - '<b>One selection a sitting.</b> Plan on 30 to 45 minutes. A long selection can be split over two days: read and talk the first day, tell back and copy the second.'
  - <b>Read it aloud, twice.</b> The book was made for reading aloud. Let your student read once to understand, then again to make the meaning clear to a listener.
  - <b>Use the book's notes.</b> Each selection has a short note about the author, and many end with definitions and notes. Read them together before or after the selection.
  - <b>Talk, then tell back.</b> Ask a few questions about meaning and craft, then have your student narrate the selection aloud or write a short summary.
  - <b>Keep a commonplace book.</b> Copy one fine passage from each lesson into a notebook, and learn some of them by heart. By the end of the year it is a small anthology.
  - <b>The elocution section is optional.</b> The opening "Principles of Elocution" pages teach how to read aloud well. Use them as short warm-ups, or come back to them as needed.
  unitword: Part
units:
- id: 1
  name: Principles of Elocution
  from: 1
  to: 6
  text: 'The book''s opening course in reading aloud: articulation, inflection, accent and emphasis, reading verse, the voice and gesture. Optional, and good as short warm-ups.'
- id: 2
  name: 'Lessons I-XII: Storms, dawns and old tales'
  from: 7
  to: 18
  text: A comic anecdote, descriptions of dawn and storm, Johnson on putting off our plans, a story of Durer's pupil, and the first poems and short selections.
- id: 3
  name: 'Lessons XIII-XXIV: Dickens, Gray and Patrick Henry'
  from: 19
  to: 30
  text: The death of Little Nell, Gray's Elegy, "give me liberty, or give me death," and essays on tact, debt and the memory of the founders.
- id: 4
  name: 'Lessons XXV-XXXVI: Orators and soldiers'
  from: 31
  to: 42
  text: Napoleon, war and peace, the great parliamentary debates of Walpole and Pitt, Scott and Shakespeare, and Paul on Mars Hill.
- id: 5
  name: 'Lessons XXXVII-XLVIII: Faith, ambition and character'
  from: 43
  to: 54
  text: Wolsey's fall, Marmion and Douglas, the Covenanters at worship, Irving on Columbus, psalms and poems of faith, and a comic Virginia parson.
- id: 6
  name: 'Lessons XLIX-LX: Sieges, patriots and pilgrims'
  from: 55
  to: 66
  text: Ivanhoe's siege, the Greek patriots of Halleck and Byron, Lochiel, Goldsmith and Mackenzie, Rienzi, the Pilgrims and the Puritans, and a ride on a snow-plow.
- id: 7
  name: 'Lessons LXI-LXX: Brutus and Cassius to Hayne'
  from: 67
  to: 76
  text: Shakespeare's quarrel scene, a comic quack, Rip Van Winkle's return, Holmes and Irving, Jefferson on toleration, and Hayne's speech for South Carolina.
- id: 8
  name: Webster, Evangeline and the poets of death and toil
  from: 77
  to: 87
  text: Webster's great reply, Longfellow, Hood, Bryant's Thanatopsis, Hazlitt, Antony's funeral speech, Prescott, Howells and Addison.
- id: 9
  name: Comedy, Milton, Whittier and Shakespeare's taverns
  from: 88
  to: 98
  text: Jupiter and Ten, a comic scene, Cowper and Milton, an evening surprise, The Barefoot Boy, Leigh Hunt, Othello and Henry IV, Starved Rock and Bacon's Studies.
- id: 10
  name: Granada, Hamlet and the Union
  from: 99
  to: 109
  text: The fall of Granada, Hamlet's soliloquy, Ginevra, Calhoun, Enoch Arden, Lochinvar, Webster's two great speeches, a new Colorado town and Tyndall on the sun.
- id: 11
  name: Franklin, the sea, India and The Raven
  from: 110
  to: 120
  text: Franklin's talk, Clarence's dream, Dana at sea, Macaulay and Burke on India, The Raven, Rome's Colosseum, The Bridge, science, Poland and labor.
- id: 12
  name: Herculaneum, Waterloo and A Psalm of Life
  from: 121
  to: 132
  text: A buried city, Holmes, Byron's storm and Waterloo, Blackstone, Opie's brains, a New England pastor, Absalom, the Dark Day, Yosemite, Longfellow and young Franklin.
- id: 13
  name: Washington, Wordsworth and Mont Blanc
  from: 133
  to: 144
  text: Bryant's water-fowl, Thackeray, Cato, two portraits of Washington, The Solitary Reaper, Emerson, Pope, Marion, Timrod, a reading plan and Coleridge's hymn.
lessons:
- title: 'Principles of Elocution: Articulation'
  mins: 30
  goal: Your student knows what articulation means and can say the vowel and consonant sounds of English clearly and with force.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A mirror is handy, and a phone to record your student reading (optional)
  book: The opening page names the six parts of elocution (articulation, inflection, accent and emphasis, reading verse, the voice, and gesture) and begins Articulation. Tables of vowel sounds ("vocals") and consonant sounds ("subvocals and aspirates") follow, with words and sentences to practice.
  steps:
  - - What this section is for
    - 'The Sixth Reader opens with a short course in elocution: the art of reading and speaking aloud well. It is optional, but a few minutes of it before each reading lesson makes a real difference.

      Read the opening list of six parts together.

      Say: The book will teach articulation, inflection, accent and emphasis, reading verse, the voice, and gesture. Today is the first: articulation.'
  - - Read the definition
    - 'Have your student read the definition aloud:

      ~ Articulation is the utterance of the elementary sounds of a language, and of their combinations.

      The book says the first goal is to say these sounds "with distinctness," and that this comes only by careful practice.'
  - - Work through the table of vocals
    - 'Open the Table of Vocals (the vowel sounds). Read each key word slowly, then say the vowel sound alone. Your student copies you, then reads the table alone.

      Listen for lazy, swallowed sounds. A mirror helps: the mouth should open and move.'
  - - Subvocals and aspirates
    - 'Next come the consonant sounds. Read a few lines of the table together, saying each sound sharply, with force, and then the whole word.

      Say: Say the last sound of each word as clearly as the first. Most mumbling happens at the ends of words.'
  - - Practice sentences
    - 'The book gives practice words and sentences. Choose four or five and have your student say each one three times: slowly, then at normal speed, then a little faster, without losing a single sound.'
  - - Talk about it
    - 'Say: Why would a reader in 1879 need a whole section on saying sounds clearly?

      Say: Think of someone you like to listen to. What makes them easy to understand?

      Say: Which sounds were hardest for you today?'
  - - Make it a habit
    - Record your student reading three practice sentences now, and again in a month. Hearing the difference is the best encouragement.
  practice: Spend two or three minutes on the articulation tables before each reading lesson this week.
  tip: Do not rush this section. Clear sounds matter more than speed, and they carry over into every lesson that follows.
  optional: true
  roman: Elocution
  idx: 18
  num: 1
  unit: 1
- title: 'Principles of Elocution: Inflection'
  mins: 30
  goal: Your student can hear and make the rising and falling slides of the voice, and knows how the book marks them.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A mirror is handy, and a phone to record your student reading (optional)
  book: The section on Inflection explains the rising and falling inflections, the circumflex and the monotone, with example sentences and the marks the book uses for each, followed by rules and exercises.
  steps:
  - - Read the definition
    - 'Read together:

      ~ Inflection is a bending or sliding of the voice either upward or downward.

      The book marks the rising slide with the acute accent and the falling slide with the grave accent. Point these marks out on the page.'
  - - Hear the rising slide
    - 'Ask the book''s short questions and let your student copy you:

      ~ Did you call?

      ~ Is he sick?

      Say: Your voice goes up at the end. That is the rising inflection.'
  - - Hear the falling slide
    - 'Now the falling examples from the book:

      ~ Where is London?

      ~ Where have you been?

      Say: These questions cannot be answered yes or no, so the voice falls. Can you hear the difference?'
  - - The circumflex and the monotone
    - 'The book says sometimes both slides are given to one sound; this is the circumflex. Try one of its examples:

      ~ If you said yes, I said no.

      The monotone is a run of syllables with no slide at all, used for solemn passages. Find the book''s monotone example and read it slowly and evenly.'
  - - Rules and exercises
    - 'Read two or three of the book''s rules for inflection with their examples. Your student reads each example twice: once with the marked inflections, once deliberately wrong. The wrong reading shows why the rule exists.'
  - - Talk about it
    - 'Say: How can the same words mean different things just by the slide of the voice?

      Say: When you ask a yes-or-no question, which way does your voice go?

      Say: Why might a speaker use a monotone on purpose?'
  practice: Over the next few lessons, ask your student to mark the inflection of two or three sentences in the selection with a pencil before reading aloud.
  tip: Many later lessons have notes that point back to these rules (for example, "See Rule V"). Keep this section handy.
  optional: true
  roman: Elocution
  idx: 25
  num: 2
  unit: 1
- title: 'Principles of Elocution: Accent and Emphasis'
  mins: 30
  goal: Your student can place word accent correctly and use absolute and relative emphasis, and the emphatic pause, to bring out meaning.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A mirror is handy, and a phone to record your student reading (optional)
  book: Accent (the stressed syllable in a word, and words whose accent changes their meaning), then Emphasis, absolute and relative, with many examples, and the emphatic pause.
  steps:
  - - Accent
    - 'Read the book''s definition of accent: the syllable "uttered more forcibly than the others." The book adds:

      ~ Common usage alone determines upon what syllable the accent should be placed.

      Try the book''s word pairs where the accent changes the meaning, such as subject (a noun) and subject (a verb), and present and present. Your student makes up a sentence with each.'
  - - Absolute emphasis
    - The book calls emphasis absolute when a word is stressed for its own force, not in contrast with another word. Read two of its examples with strong, natural force.
  - - Relative emphasis
    - 'Emphasis is relative when there is a contrast, stated or implied. Read the book''s examples, stressing the two contrasted words:

      ~ We can do nothing against the truth, but for the truth.

      ~ Hunting men, and not beasts, shall be his game.'
  - - The emphatic pause
    - The book says a short pause is often made before or after an emphatic word. Read one of the examples with the pause and once without. Ask which sounds better.
  - - Talk about it
    - 'Say: In "against the truth, but for the truth," why must against and for get the stress?

      Say: What happens when a reader stresses every word?

      Say: Choose a sentence from yesterday''s reading. Where does the emphasis belong, and why?'
  - - Try it
    - Take one sentence, for example "I did not say he took it." Read it six times, stressing a different word each time. Talk about how the meaning changes.
  tip: Emphasis comes from understanding. If your student stresses the wrong word, ask what the sentence means before correcting the voice.
  optional: true
  roman: Elocution
  idx: 40
  num: 3
  unit: 1
- title: 'Principles of Elocution: Reading Verse'
  mins: 25
  goal: Your student reads poetry with natural inflection and accent, keeping its flow without falling into a singsong.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A mirror is handy, and a phone to record your student reading (optional)
  book: 'Instructions for Reading Verse: inflections in poetry, the danger of a chanting delivery, accent and emphasis in verse, and short exercises from well-known poems.'
  steps:
  - - The main rule
    - 'Read the book''s rule together:

      ~ In reading verse, every syllable must have the same accent, and every word the same emphasis as in prose.

      Say: The poem''s rhythm should never make you say a word wrongly.'
  - - Avoid the singsong
    - 'The book says the greatest difficulty is to give verse a measured flow without chanting. Its cure: if unsure, the reader should

      ~ reduce the passage to earnest conversation, and pronounce it in the most familiar and prosaic manner

      then read it again as verse, keeping that natural sense.'
  - - Practice
    - 'Use the exercises on the page. One begins:

      ~ Here rests his head upon the lap of earth

      Read it first as plain talk, then as verse. Your student does the same with one more exercise.'
  - - Talk about it
    - 'Say: Why do people often read poems in a singsong voice?

      Say: What does the book say to do when the rhythm of a line and the right accent of a word disagree?

      Say: How should a reader show the end of a line that runs on into the next?'
  - - Make it a habit
    - Before each poem in the book, have your student read one stanza "as conversation" first. It quickly becomes natural.
  optional: true
  roman: Elocution
  idx: 46
  num: 4
  unit: 1
- title: 'Principles of Elocution: The Voice'
  mins: 30
  goal: Your student understands pitch, compass, quantity, quality and movement of the voice, and practices exercises to strengthen it.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A mirror is handy, and a phone to record your student reading (optional)
  book: 'The section on the Voice: pitch and compass with exercises for strengthening the voice, quantity and quality, and movement (the speed of reading), each with examples to practice.'
  steps:
  - - Pitch and compass
    - 'Read together:

      ~ The natural pitch of the voice is its key-note, or governing note.

      The compass is the range above and below it. The book says the voice should rise above or fall below this key-note to avoid monotony, as the sense requires.'
  - - Strengthen the voice
    - 'Try the book''s exercise: say a short sentence at the lowest pitch your student can manage comfortably, then one note higher, and so on to the top, then back down.

      If you can, go outside. The book recommends speaking "in the open air, at the very top of the voice."'
  - - High pitch examples
    - 'Read the high-pitch examples with energy:

      ~ Charge Chester, charge! On Stanley, on!

      ~ A horse! a horse! my kingdom for a horse!

      The book notes that high pitch is not the same as loudness. Try the line high and soft, then low and loud.'
  - - Quantity, quality, movement
    - Skim the sections on quantity, quality and movement together. Movement, the book says, is the rapidity with which the voice moves in reading and speaking. Read one quiet, solemn example slowly and one lively example quickly.
  - - Talk about it
    - 'Say: What is your natural key-note? Hum it.

      Say: Why does a whole speech at one pitch put listeners to sleep?

      Say: What kind of passage should be read slowly? What kind quickly?'
  practice: Use the pitch exercise as a one-minute warm-up before reading aloud.
  optional: true
  roman: Elocution
  idx: 53
  num: 5
  unit: 1
- title: 'Principles of Elocution: Gesture'
  mins: 25
  goal: Your student can stand well to speak and knows the book's directions for posture and natural movement.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A mirror is handy, and a phone to record your student reading (optional)
  book: 'The section on Gesture: the speaker''s attitude, how the body is held and how the limbs move, with general directions for standing and moving and further rules and examples.'
  steps:
  - - Read the definition
    - 'Read together:

      ~ Gesture is that part of the speaker''s manner which pertains to his attitude

      The book notes that beginners often feel awkward and do not know what to do with their hands, and that this passes when the speaker thinks wholly about the subject.'
  - - Stand well
    - 'The first direction: the speaker

      ~ should stand erect and firm

      with an open chest for breathing. Have your student stand this way and read a short passage.'
  - - Weight on one leg
    - 'The second direction: the body''s weight rests on one leg, the other free to step forward or back. The book warns against resting a foot on a stool or leaning on the desk. Practice shifting easily while reading.'
  - - Movement
    - Read the rest of the section on movements of the arms and hands. Choose one passage from the book with strong feeling and let your student try one or two simple, natural gestures.
  - - Talk about it
    - 'Say: Why does the book say the awkwardness passes when you think only of the subject?

      Say: Which is worse, too many gestures or none at all? Why?

      Say: Watch someone speak well this week. What do they do with their hands?'
  - - Recite
    - If your student has learned a passage by heart in an earlier lesson, let them recite it standing, using today's directions.
  optional: true
  roman: Elocution
  idx: 62
  num: 6
  unit: 1
- title: Anecdote of the Duke of Newcastle (Blackwood's Magazine)
  mins: 35
  goal: Your student reads a comic anecdote aloud with good timing and explains what makes it funny.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: 'The first selection: a humorous story from Blackwood''s Magazine about the Duke of Newcastle and a Cornish friend who was promised a post when the King of Spain died. An illustration and notes on the people and places follow.'
  steps:
  - - Words and meanings
    - 'Read the book''s notes at the end of the lesson first. They explain the Duke of Newcastle (a chief minister under George II of England), Cornwall (a county in the southwest of England), the King of Spain, and the title His Catholic Majesty.

      Before reading, find these words in the selection and look up any your student does not know: administration, casting vote, courier, exciseman.'
  - - Read it aloud
    - 'Read the opening sentence together:

      ~ A laughable story was circulated during the administration of the old Duke of Newcastle,

      Then your student reads the whole story aloud. Comic stories need timing: a small pause before the surprise at the end.'
  - - Talk about it
    - 'Say: Why had the Duke made such a large promise to the gentleman from Cornwall?

      Say: Why does the gentleman come to the Duke at that hour, and why is the Duke waiting for a courier from Madrid?

      Say: How does the Duke react, first and then a moment later?

      Say: The story ends with a joke about the post the man finally received. Why is that ending funny?'
  - - Tell it back
    - Your student tells the story aloud in their own words, in order, keeping the surprise for the end.
  - - Copywork and memory
    - Copy the story's opening sentence into a commonplace book (a notebook of good passages kept all year).
  - - Write (optional)
    - Write a short anecdote (half a page) about a promise someone made too easily, ending with a twist.
  tip: 'This is the first selection in the book. Set the routine now: words and notes, read, talk, tell back, copy.'
  roman: I
  idx: 70
  num: 7
  unit: 2
- title: The Needle (Samuel Woodworth)
  mins: 30
  goal: Your student reads a light poem with good rhythm and explains the contrast it draws.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: A one-page poem that sets the showy accomplishments of fashionable young ladies against the homely virtue of a woman who sews and loves her home.
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: belles, cotillon, quadrille, whist, vauntingly. Cotillon and quadrille were dances; whist is a card game.'
  - - Read it aloud
    - 'Read the opening lines together:

      ~ The gay belles of fashion may boast of excelling

      ~ In waltz or cotillon, at whist or quadrille;

      Your student reads the whole poem aloud, keeping the bouncing rhythm without a singsong.'
  - - Talk about it
    - 'Say: What do the "belles of fashion" boast of?

      Say: What does the poet praise instead?

      Say: Do you think the poet is fair to the young ladies of fashion? Why or why not?

      Say: What would a poem like this praise today instead of sewing?'
  - - Tell it back
    - Your student explains, in three or four sentences, the contrast the poem makes and which side the poet takes.
  - - Copywork and memory
    - Copy the first two lines of the poem.
  - - Write (optional)
    - Write a short paragraph or a few lines of verse praising a quiet, useful skill you admire.
  roman: II
  idx: 76
  num: 8
  unit: 2
- title: Dawn (Edward Everett)
  mins: 40
  goal: Your student reads a descriptive passage aloud and notices how careful word choice and figures of speech make a scene vivid.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Everett's description of a summer dawn seen from an early train from Providence to Boston, from an address on the "Uses of Astronomy," with an author note, a teaching note and notes on the stars named.
  steps:
  - - Words and meanings
    - 'The book explains some of the names in the passage, for example:

      ~ Pointers, two stars of the group called the Dipper, in the Great Bear.

      Read its other notes too: Lyra and Andromeda, the Blue Hills, Jupiter, the Pleiades and the Magians.'
  - - About the author
    - The book says Edward Everett (1794-1865) was born in Dorchester, Massachusetts, graduated from Harvard at seventeen, became a Boston pastor and then Professor of Greek at Harvard, edited the North American Review, served ten years in Congress, and was Governor of Massachusetts, Minister to England, President of Harvard and Secretary of State. It calls him an elegant writer and orator.
  - - Read it aloud
    - 'Read the opening together:

      ~ I had occasion, a few weeks since, to take the early train from Providence to Boston;

      Your student reads on, slowly, letting the descriptions breathe. Another line to enjoy:

      ~ It was a mild, serene, midsummer''s night, — the sky was without a cloud, the winds were whist.'
  - - Talk about it
    - 'Say: The book says: "Note the careful use of words, and the strong figures in the third and fourth paragraphs." Find one strong figure of speech there. What is compared to what?

      Say: How does the light change, step by step, from darkness to full sunrise?

      Say: Everett gave this speech to open an observatory. Why might a description of dawn belong in a speech about astronomy?

      Say: Near the end he is "filled with amazement" at something. What surprises him, and do you agree?'
  - - Tell it back
    - Your student describes the dawn in their own words, in the order Everett gives it.
  - - Copywork and memory
    - 'Copy and learn:

      ~ It was a mild, serene, midsummer''s night, — the sky was without a cloud, the winds were whist.'
  - - Write (optional)
    - Get up early once this week and watch the dawn. Write a paragraph describing it, in order, using at least one comparison.
  roman: III
  idx: 77
  num: 9
  unit: 2
- title: Description of a Storm (Benjamin Disraeli)
  mins: 35
  goal: Your student reads a dramatic description with rising force and explains how the writer builds suspense.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: 'A storm in the mountains, from a novel by Disraeli: wind, flood and lightning, a sudden silence, and then a mountain that falls on a castle, a village and a bridge. An author note comes first.'
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: desolation, shivered, eddies, crevices, cataracts, firmament, lowering.'
  - - About the author
    - The book says Benjamin Disraeli (1805-1881) was born in London and educated by his father, the literary man Isaac Disraeli. His first novel, Vivian Grey, appeared when he was twenty-one. He entered Parliament, led the Conservative party and was twice prime minister, and was made Earl of Beaconsfield, writing novels all the while.
  - - Read it aloud
    - 'Read the opening together:

      ~ They looked round on every side, and hope gave way before the scene of desolation.

      Your student reads the rest, building force toward the end:

      ~ It shook! — it fell! and buried in its ruins the castle, the village, and the bridge!'
  - - Talk about it
    - 'Say: What does the storm do to the trees, the birds and the animals?

      Say: Find the very short sentence "Shelter was nowhere." Why is it so short?

      Say: Just before the mountain falls there is a sudden silence. Why does the writer put it there?

      Say: How should the last sentence be read aloud? Try it with pauses at the dashes.'
  - - Tell it back
    - Your student tells what happens in the storm, step by step, in their own words.
  - - Copywork and memory
    - 'Copy:

      ~ Cataracts poured down from the lowering firmament.'
  - - Write (optional)
    - Describe a storm you remember in one paragraph. End with one short sentence.
  roman: IV
  idx: 79
  num: 10
  unit: 2
- title: After the Thunder-Storm (James Thomson)
  mins: 30
  goal: Your student reads blank verse aloud smoothly and explains the poet's question to mankind.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: 'A passage of blank verse from Thomson''s The Seasons: the sky clears after a storm, nature rejoices, and the poet asks whether man alone will forget to give thanks. An author note comes first.'
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: tumultuous, interminable, sublimer, azure, serenes (here a verb: makes calm).'
  - - About the author
    - The book says James Thomson (1700-1748) was a Scottish poet, a clergyman's son, who studied at Edinburgh and went to London in 1724. His best-known work is The Seasons. It adds that he was thought heavy in appearance and indolent in habits, but his writing is always moral in tone.
  - - Read it aloud
    - 'Read the opening together. It is one long sentence across four lines:

      ~ As from the face of heaven the shattered clouds

      ~ Tumultuous rove, the interminable sky

      ~ Sublimer swells, and o''er the world expands

      ~ A purer azure.

      Your student reads the whole passage, pausing only where the sense pauses, not at every line end.'
  - - Talk about it
    - 'Say: What changes in the sky and the fields after the storm?

      Say: Thomson asks a question near the end. What is he asking, and what answer does he expect?

      Say: What does the poet mean by "the Hand that hushed the thunder"?

      Say: Blank verse has no rhyme. How did you know where the pauses belong?'
  - - Tell it back
    - 'Your student explains the passage in plain prose: first the scene, then the poet''s question.'
  - - Copywork and memory
    - 'Copy and learn:

      ~ Shall man, so soon forgetful of the Hand

      ~ That hushed the thunder, and serenes the sky,'
  - - Write (optional)
    - Write a few sentences about how the world looks and sounds just after a storm.
  roman: V
  idx: 81
  num: 11
  unit: 2
- title: House-Cleaning (Francis Hopkinson)
  mins: 40
  goal: Your student recognizes satire and humor and reads a comic essay with the right tone.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Hopkinson's humorous letter on the yearly spring cleaning (his "Essay on Whitewashing"), seen through the eyes of a suffering husband, with notes and a teaching note.
  steps:
  - - Words and meanings
    - Read the book's notes on Lear and on Goshen (the part of Egypt spared from the plague of flies). The teaching note asks students to find words that sound old-fashioned and words that show changes in household customs, such as testers, joint stools, wainscots and house-raising. Look these up together.
  - - About the author
    - The book says Francis Hopkinson (1737-1791) was born in Philadelphia, represented New Jersey in the Congress of 1776 and signed the Declaration of Independence. He wrote witty pieces and serious ones, and his "Essay on Whitewashing" was once thought to be by Benjamin Franklin.
  - - Read it aloud
    - 'Read together:

