  - A dictionary
  book: 'Five short poems: The Cloud (John Wilson), My Mind (the book gives William Byrd), A Good Name (Shakespeare, from Othello), Sunrise (James Thomson) and Old Age and Death (Edmund Waller), with a note on Waller.'
  steps:
  - - About the author
    - The book's note on Edmund Waller (1605-1687) says he was an English poet, educated at Eton and Cambridge, who sat in Parliament, took part in the civil war, lived in exile in France, and was in favor at court after the Restoration.
