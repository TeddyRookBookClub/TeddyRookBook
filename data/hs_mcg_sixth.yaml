- title: '"He Giveth His Beloved Sleep" (Elizabeth B. Browning)'
  mins: 30
  goal: Your student reads a reflective poem on a Bible verse and explains its main thought.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: An author note on Elizabeth Barrett Browning, then her poem on the verse "He giveth his beloved sleep" (Psalm 127:2).
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: psalmist, inward, surpassing.'
  - - About the author
    - The book says Elizabeth Barrett Browning (1809-1861) was born in London, married the poet Robert Browning in 1846, lived mostly in Italy and died in Florence. It names her "Essay on Mind," written at sixteen, "Lady Geraldine's Courtship" and "Aurora Leigh," calls her one of the ablest women poets, and notes her deep sympathy with suffering.
  - - Read it aloud
    - 'Read the opening together:

      ~ Of all the thoughts of God that are

      ~ Borne inward unto souls afar,

      ~ Along the Psalmist''s music deep,

      ~ Now tell me if that any is,

      Your student reads the whole poem slowly. It ends:

      ~ ''He giveth his beloved, sleep.'''
  - - Talk about it
    - 'Say: Which "thought of God" does the poet think is the tenderest of all?

      Say: What things do people strive for, that the poem sets beside the gift of sleep?

      Say: Why might sleep be a fitting picture for God''s care, and for death?

      Say: Which stanza did you like best?'
  - - Tell it back
    - Your student explains the poem's main thought in a few sentences.
  - - Copywork and memory
    - Copy and learn the first four lines.
  - - Write (optional)
    - Write a paragraph on a simple gift (sleep, bread, a friend) that we forget to be thankful for.
