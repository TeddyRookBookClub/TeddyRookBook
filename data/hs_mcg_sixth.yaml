    - 'Say: Why does Porter say we should read with a definite aim?

      Say: What purposes for reading does he mention?

      Say: What happens to people who read without any aim?

      Say: Think about this year''s reading in this book. Which lesson stayed with you most?'
  - - Narration
    - Your student explains Porter's advice in their own words.
  - - Make a plan
    - 'Together, write a short reading plan for the next three months: one aim, and three books that serve it.'
