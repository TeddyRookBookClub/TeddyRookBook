  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: standard, azure, baldric, dyes.'
  - - About the author
    - The book says Joseph Rodman Drake (1795-1820) was born in New York City, grew up poor after his father died, and took a degree in medicine at about twenty. Most of his poems were written in less than two years. He is best known for "The Culprit Fay" and "The American Flag." His friend Fitz-Greene Halleck remembered him as gentle and kind.
  - - Read it aloud
    - 'Read the opening together:

      ~ When Freedom, from her mountain-height,

