  - - About the author
    - The book says Hood was born in London in 1798 and died in 1845, the son of a London bookseller. He trained as an engraver, left it for literature, and in 1821 became sub-editor of the London Magazine. His last years were marked by poverty and ill health. The book says he is best known as a joker, but also wrote serious and tender poems, and that this one first appeared in Punch.
