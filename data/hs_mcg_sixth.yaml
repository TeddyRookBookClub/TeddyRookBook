- title: The Present (Adelaide Anne Procter)
  mins: 25
  goal: Your student reads a short poem and explains its advice about past and present.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: A poem urging the reader not to worship the dead Past, but to serve the living Present. An author note comes first.
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: reverence, monarch.'
  - - About the author
    - The book says Adelaide Anne Procter (1825-1864) was the daughter of Bryan Waller Procter ("Barry Cornwall"). She wrote several volumes of poetry and wrote for London magazines such as Good Words and All the Year Round.
  - - Read it aloud
    - 'Read the opening together:

      ~ Do not crouch to-day, and worship

      ~ The dead Past, whose life is fled:

      Your student reads the whole poem. It ends:

      ~ Bids us cast our lives before her,

      ~ Bids us serve the great To-day.'
  - - Talk about it
    - 'Say: The Past and the Present are spoken of as kings. Which is dead, and which reigns?

      Say: What does the poet want us to do with what the Past has left us?

      Say: Is it wrong to love the past? What is the difference between honoring and worshiping it?

      Say: What does "serve the great To-day" mean in your life this week?'
  - - Tell it back
    - Your student explains the poem's advice in their own words.
  - - Copywork and memory
    - 'Copy and learn:

      ~ For the Present reigns, our monarch,

      ~ With an added weight of hours;'
  - - Write (optional)
    - 'Write a paragraph: one thing from the past worth keeping, and one thing to do today.'
