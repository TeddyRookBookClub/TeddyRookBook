- title: Speech of Paul on Mars Hill (The Bible)
  mins: 30
  goal: Your student reads Paul's speech to the Athenians and explains how he begins from what his listeners already know.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Paul's address to the men of Athens (from the Book of Acts), with notes on Mars Hill, the date and Dionysius.
  steps:
  - - Words and meanings
    - 'Read the book''s notes: the speech was given about 50 A.D., when Athens was still the center of the refined world; Mars Hill, or the Areopagus, was a hill in Athens where the court of that name met; and Dionysius the Areopagite, converted by Paul, became the first bishop of Athens.'
  - - Read it aloud
    - 'Read the opening together:

      ~ Then Paul stood in the midst of Mars Hill, and said, Ye men of Athens!

      ~ I perceive that in all things ye are too superstitious.

      ~ For as I passed by, and beheld your devotions, I found an altar with this inscription, To The Unknown God.

      Your student reads the whole speech with dignity.'
  - - Talk about it
    - 'Say: Why does Paul start with the altar "To The Unknown God"?

      Say: What does he say about temples made with hands, and about images of gold and silver?

      Say: Read: "And the times of this ignorance God winked at; but now commandeth all men every-where to repent:" What does "winked at" mean here?

      Say: The book''s note says Dionysius the Areopagite was converted by Paul. What does that tell you about the speech?'
  - - Tell it back
    - Your student gives Paul's argument in four steps.
  - - Copywork and memory
    - 'Copy:

      ~ For as I passed by, and beheld your devotions, I found an altar with this inscription, To The Unknown God.'
  - - Write (optional)
    - Read Acts 17 in a Bible. Write a paragraph about how Paul adapts his message to his audience.
