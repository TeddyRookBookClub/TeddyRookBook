- title: La Fayette and Robert Raikes (Thomas S. Grimke)
  mins: 40
  goal: Your student follows an address that compares two kinds of greatness and explains its conclusion.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Part of an address at a Sunday-school celebration, comparing La Fayette's return visit to America with the quiet work of Robert Raikes, followed by notes on the people named.
  steps:
  - - Words and meanings
    - 'Read the book''s notes: the Marquis de La Fayette (1757-1834), a French major-general in the American Revolution, who revisited America in 1824; Robert Raikes (1735-1811), an English printer and philanthropist, the founder of Sunday-schools; John Howard (1726-1790), the English philanthropist who worked to reform prisons; and Francis I of France.

      Before reading, find these words in the selection and look up any your student does not know: pageant, venerable, philanthropist.'
  - - About the author
    - The book says Thomas S. Grimke (1786-1834) was an eminent lawyer and scholar, born in Charleston, South Carolina, a graduate of Yale, who died of cholera near Columbus, Ohio. He was best known as an advocate of peace, of Sunday-schools and of the Bible.
  - - Read it aloud
    - 'Read the opening together:

      ~ It is but a few years since we beheld the most singular and memorable pageant in the annals of time.

      Your student reads on. A sentence to find:

      ~ But La Fayette returned to the land of the dead, rather than of the living.'
  - - Talk about it
    - 'Say: What was the "pageant" Grimke describes?

      Say: Why does he say La Fayette returned "to the land of the dead"?

      Say: Who was Robert Raikes, and why does Grimke set him beside La Fayette?

      Say: Which kind of greatness does Grimke think will last longer? Do you agree?'
  - - Tell it back
    - Your student explains the comparison between the two men.
  - - Copywork and memory
    - 'Copy:

      ~ But La Fayette returned to the land of the dead, rather than of the living.'
  - - Write (optional)
    - Write a paragraph about someone whose quiet work did great good.
  tip: One page of this lesson could not be checked closely when this guide was written. Read the whole selection before teaching.
