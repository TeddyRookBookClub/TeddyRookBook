- title: Death of Little Nell (Charles Dickens)
  mins: 40
  goal: Your student reads a famous passage of pathos with control and discusses how Dickens creates feeling.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: A long author note on Dickens, then the death and burial of Little Nell, from The Old Curiosity Shop (1840).
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: pathos, couch, fatigues, solemn.'
  - - About the author
    - The book says Charles Dickens (1812-1870) was born in Portsmouth and lived nearly all his life in London. His family was poor, and his early years were hard. He worked as a reporter, published sketches as "Boz," and became famous with The Pickwick Papers. The note praises his humor and pathos, his lifelike characters and his pictures of childhood and of the suffering of the poor.
  - - Read it aloud
    - 'Read the opening slowly:

      ~ She was dead.

      ~ No sleep so beautiful and calm, so free from trace of pain, so fair to look upon.

