- title: God's Goodness to Such as Fear Him (The Bible)
  mins: 25
  goal: Your student reads a psalm aloud with good phrasing and explains its contrast between the wicked and the righteous.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: 'Verses from Psalm 37, set out as poetry: do not fret because of evil-doers; trust in the Lord.'
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: fret, iniquity, herb.'
  - - Read it aloud
    - 'Read the opening together:

      ~ Fret not thyself because of evil-doers,

      ~ Neither be thou envious against the workers of iniquity;

      ~ For they shall soon be cut down like the grass,

      ~ And wither as the green herb.

      Your student reads the whole passage. Notice how each idea is said twice in different words (Hebrew parallelism).'
  - - Talk about it
    - 'Say: Why should we not envy the wicked, according to the psalm?

      Say: Find two pairs of lines that say the same thing in different words.

      Say: What does the psalm promise to those who trust and do good?

      Say: Which verse would you like to remember?'
  - - Tell it back
    - Your student explains the psalm's message in a few sentences.
  - - Copywork and memory
    - Copy and learn the first four lines.
  - - Write (optional)
    - Read all of Psalm 37 in a Bible. Choose one verse and write why it matters to you.
