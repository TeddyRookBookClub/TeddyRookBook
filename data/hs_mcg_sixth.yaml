- title: Marco Bozzaris (Fitz-Greene Halleck)
  mins: 40
  goal: Your student reads a stirring narrative poem with force and tells the story of Bozzaris's last battle.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Halleck's poem about the Greek patriot Marco Bozzaris, who led a night attack on the Turkish camp and fell in the hour of victory. An author note comes first and notes on Bozzaris, Plataea and the Moslems follow.
  steps:
  - - Words and meanings
    - 'Read the book''s notes: Marco Bozzaris (about 1790-1823) was a famous Greek patriot of the Suliote people, bitter enemies of the Turks, who died in a night attack near Carpenisi; the poem has been translated into modern Greek. Plataea was the scene of a great Greek victory over the Persians in 479 B.C.

      Before reading, find these words in the selection and look up any your student does not know: suppliance, Suliote, sires.'
  - - About the author
    - The book says Fitz-Greene Halleck (1790-1867) was born in Guilford, Connecticut, and for many years worked as a bookkeeper and assistant to John Jacob Astor in New York. Most of his poems were written before he was forty, several with his friend Joseph Rodman Drake. His verse is carefully finished and musical, and "Marco Bozzaris" is his best-known poem.
  - - Read it aloud
    - 'Read the opening together:

      ~ At midnight, in his guarded tent,

      ~ The Turk was dreaming of the hour

      ~ When Greece, her knee in suppliance bent,

      ~ Should tremble at his power:

      Your student reads the whole poem, building to the battle cry:

      ~ Strike — till the last armed foe expires;

      ~ Strike — for your altars and your fires;

      ~ Strike — for the green graves of your sires;'
  - - Talk about it
    - 'Say: What is the Turk dreaming of at the start? How is the dream broken?

      Say: Why does Bozzaris tell his men to strike "for the green graves of your sires"?

      Say: Read: "They conquered — but Bozzaris fell," How should that line be read aloud?

      Say: The last part of the poem speaks of death and fame. Is Bozzaris''s death a defeat or a victory?'
  - - Tell it back
    - Your student tells the story of the night attack in their own words.
  - - Copywork and memory
