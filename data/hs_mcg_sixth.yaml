- title: Observance of the Sabbath (Gardiner Spring)
  mins: 35
  goal: Your student follows a persuasive argument and states its chain of reasoning.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: An author note on Gardiner Spring, then his argument that the Sabbath is the foundation of morality in a nation. Notes on Blackstone and Sir Matthew Hale follow.
  steps:
  - - Words and meanings
    - 'Read the book''s notes on Sir William Blackstone (1723-1780), author of the Commentaries on the Laws of England, and Sir Matthew Hale, Lord Chief Justice of England.

      Before reading, find these words in the selection and look up any your student does not know: morality, principle, perjury, avarice.'
  - - About the author
    - The book says Gardiner Spring (1785-1873) graduated from Yale in 1805, taught in Bermuda, practiced law briefly and studied theology at Andover. From 1810 until his death he was pastor of the Brick Church in New York City. He refused the presidencies of Dartmouth and Hamilton colleges, and was known as an eloquent preacher.
  - - Read it aloud
    - 'Read the opening together:

      ~ The Sabbath lies at the foundation of all true morality.

      ~ Morality flows from principle.

      Your student reads the rest of the argument.'
  - - Talk about it
    - 'Say: Spring builds a chain: Sabbath, principle, morality. Explain each link.

      Say: What does he say happens to a people who lose these principles?

      Say: Read: "One of the principal occupations of this day is to illustrate and enforce the great principles of sound morality." What does he mean?

      Say: Why might he quote lawyers like Blackstone and Hale, not only ministers?'
  - - Tell it back
    - Your student sums up the argument in four sentences.
  - - Copywork and memory
    - 'Copy:

      ~ The Sabbath lies at the foundation of all true morality.'
  - - Write (optional)
    - Write a paragraph on the value of a weekly day of rest, in your family or in the nation.
