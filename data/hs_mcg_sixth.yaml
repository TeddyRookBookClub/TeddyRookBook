- title: God is Every-where (Joseph Hutton)
  mins: 25
  goal: Your student reads a question-and-answer poem and explains its answer.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: A poem that begins with a child's question, where is God, and answers by pointing to the sky, the stars, the mountains, the sea and the storm.
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: immensity, sovereign, quell.'
  - - Read it aloud
    - 'Read the opening together:

      ~ Oh! show me where is He,

      ~ The high and holy One,

      ~ To whom thou bend''st the knee,

      ~ And prayest, ''Thy will be done!''

      Your student reads the rest. Each answer comes back to the same words, "my God is there."'
  - - Talk about it
    - 'Say: Who seems to be asking the question, and to whom?

      Say: Where does the answer say God can be found? List the places.

      Say: Why does the poem repeat "my God is there"?

      Say: Which of the pictures in the poem is strongest for you?'
  - - Tell it back
    - Your student explains the question and the answer in a few sentences.
  - - Copywork and memory
    - Copy and learn the first stanza.
