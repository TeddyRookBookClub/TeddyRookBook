- title: Character of Columbus (Washington Irving)
  mins: 40
  goal: Your student reads a balanced character portrait and lists the qualities Irving praises and the faults he admits.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: A full author note on Washington Irving, then his portrait of Columbus, with a note on Columbus's early life.
  steps:
  - - Words and meanings
    - 'Read the book''s note on Columbus (1436-1506): the son of a wool-comber of Genoa, a sailor from fifteen, who studied navigation and struggled for almost ten years before a sovereign would back his voyage.

      Before reading, find these words in the selection and look up any your student does not know: magnanimity, irascible, impetuous, dissolute.'
  - - About the author
    - The book says Washington Irving (1783-1859) was born in New York, began studying law at sixteen and writing at nineteen, lived in Europe for seventeen years, and was Minister to Spain from 1842 to 1846. His works include The Sketch Book, Bracebridge Hall, the Life and Voyages of Columbus, and the Life of Washington, finished the year he died.
  - - Read it aloud
    - 'Your student reads the selection aloud. Sentences to find:

      ~ His conduct was characterized by the grandeur of his views and the magnanimity of his spirit.

      ~ He was naturally irascible and impetuous, and keenly sensible to injury and injustice.'
  - - Talk about it
    - 'Say: List three qualities Irving praises in Columbus.

      Say: What fault does he admit, and how did Columbus control it?

      Say: Irving says Columbus looked on new lands "with the eyes of a legislator." What does he mean?

      Say: Is this a fair portrait? What might a critic of Columbus add?'
  - - Tell it back
    - Your student describes Columbus's character as Irving sees it.
  - - Copywork and memory
    - 'Copy:

      ~ Whenever he made any great discovery he devoutly returned thanks to God.'
  - - Write (optional)
    - 'Write a balanced character sketch of a historical person: three strengths and one weakness.'
