- title: The Philosopher (John P. Kennedy)
  mins: 40
  goal: Your student enjoys a gently comic character sketch and explains how the writer creates humor.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: 'From Swallow Barn, sketches of early Virginia: Parson Chub, the plump old schoolmaster and "philosopher," and the arrival of his library.'
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: embowered, meandering, rivulets, abstruse.'
  - - About the author
    - The book says John P. Kennedy (1795-1870) was born in Baltimore. He served in the state legislature and three terms in Congress, and was Secretary of the Navy under President Fillmore. He wrote novels and political papers, and "His writings are marked by ease and freshness." This extract is from Swallow Barn.
  - - Read it aloud
    - 'Your student reads the selection aloud. A line to enjoy:

