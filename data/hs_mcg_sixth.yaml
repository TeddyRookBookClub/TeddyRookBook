- title: Fall of Cardinal Wolsey (William Shakespeare)
  mins: 35
  goal: Your student reads Wolsey's famous farewell with feeling and explains its comparison of a man's life to a plant.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Wolsey's speech on his fall from power and his advice to Cromwell, from Shakespeare's Henry VIII, with notes on Wolsey and Cromwell.
  steps:
  - - Words and meanings
    - 'Read the book''s notes: Cardinal Thomas Wolsey (1471-1530), favorite minister of Henry VIII, who gained great wealth and power and was disgraced and arrested in 1529; and Thomas Cromwell (1490-1540), his servant, who later became Henry''s secretary.

      Before reading, find these words in the selection and look up any your student does not know: pomp, ambition, blossoms.'
  - - Read it aloud
    - 'Read the opening together:

      ~ Farewell! a long farewell, to all my greatness!

      ~ This is the state of man: to-day he puts forth

      ~ The tender leaves of hopes; to-morrow blossoms,

      ~ And bears his blushing honors thick upon him;

      Your student reads the whole speech slowly, as a broken man.'
  - - Talk about it
    - 'Say: Follow the plant comparison: leaves, blossoms, and then what happens?

      Say: Read: "Is that poor man that hangs on princes'' favors!" What has Wolsey learned?

      Say: What advice does he give Cromwell about ambition?

      Say: Is Wolsey truly sorry, or only sorry he fell? What do you think?'
  - - Tell it back
    - Your student explains Wolsey's thoughts in plain words, in order.
  - - Copywork and memory
    - 'Copy and learn:

      ~ Cromwell, I charge thee, fling away ambition:

      ~ By that sin fell the angels;'
  - - Write (optional)
    - Write a paragraph on Wolsey's words about ambition. Is all ambition bad?
  roman: XXXIX
  idx: 178
