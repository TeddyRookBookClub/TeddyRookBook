      Say: The book says Hood was best known as a joker. Why might a funny writer write a poem this sad?'
  - - Narration
    - Your student explains in their own words what the poem is about and what Hood wanted his readers to feel and do.
  - - Memorize or copy
    - Choose the first stanza of the poem and copy it exactly, then read it aloud from your copy.
  - - Writing (optional)
    - Write a short paragraph about a kind of hard work you have seen or read about, and what would make it easier.
