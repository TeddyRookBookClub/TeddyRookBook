      Say: What do the family think he and Frank Meriwether do in the library every evening? What does Ned Hazard find?

      Say: Is Kennedy making fun of Chub unkindly, or affectionately?'
  - - Tell it back
    - Your student tells the story of the library from beginning to end.
  - - Copywork and memory
    - 'Copy:

      ~ He is a plump, rosy old gentleman, rather short and thickset, with the blood-vessels meandering over his face like rivulets.'
  - - Write (optional)
    - Write a gently funny sketch (a paragraph) of someone with a hobby they take very seriously.
