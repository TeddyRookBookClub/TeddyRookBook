- title: Elegy in a Country Church-Yard (Thomas Gray)
  mins: 45
  goal: Your student reads one of the most famous poems in English with feeling and understands its main thought.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: Gray's Elegy, complete, with an author note and a full-page illustration. The poet, at evening in a village churchyard, thinks about the humble people buried there.
  steps:
  - - Words and meanings
    - 'Before reading, find these words in the selection and look up any your student does not know: curfew, knell, lea, heraldry, unfathomed. Older words like these come thick in this poem; keep the dictionary open.'
  - - About the author
    - The book says Thomas Gray (1716-1771) was born in London and educated at Eton and Cambridge. He was a shy, refined scholar who declined to be poet laureate and became Professor of History at Cambridge in 1769. His best-known work is the Elegy, finished in 1749 after seven years.
  - - Read it aloud
    - 'Read the first stanza together, slowly:

      ~ The curfew tolls the knell of parting day,

      ~ The lowing herd winds slowly o''er the lea,

      ~ The plowman homeward plods his weary way,

      ~ And leaves the world to darkness and to me.

