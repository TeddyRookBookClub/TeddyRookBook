- title: Marmion and Douglas (Sir Walter Scott)
  mins: 40
  goal: Your student reads a dramatic scene in verse with spirit and explains the quarrel between the two men.
  materials:
  - The book, or the scan beside this guide
  - A notebook and pen
  - A dictionary
  book: 'From Scott''s Marmion: the English lord Marmion takes leave of the old Scottish earl Douglas, the quarrel flares, and Marmion escapes the closing gate. A full-page illustration and a note on the story follow.'
  steps:
  - - Words and meanings
    - 'Read the book''s note: Marmion was sent by Henry VIII of England to James IV of Scotland; Douglas treated him with the respect due his office, but despised his private character.

      Before reading, find these words in the selection and look up any your student does not know: safe conduct, swarthy, portcullis, gauntlet.'
  - - Read it aloud
    - 'Read the opening together:

      ~ Not far advanced was morning day,

      ~ When Marmion did his troop array

      ~ To Surrey''s camp to ride;

      Your student reads the whole scene, giving Marmion and Douglas different voices. The high point:

      ~ And dar''st thou then

      ~ To beard the lion in his den,

      ~ The Douglas in his hall?'
  - - Talk about it
    - 'Say: Why does Douglas refuse to shake Marmion''s hand? Find "The hand of Douglas is his own."

      Say: What does Marmion say that makes Douglas so angry?

      Say: How does Marmion escape? Read that part with speed.

      Say: Whom do you admire more in this scene? Why?'
  - - Tell it back
    - Your student tells the scene as a short story, in order.
  - - Copywork and memory
    - 'Copy and learn:

      ~ And dar''st thou then

      ~ To beard the lion in his den,

      ~ The Douglas in his hall?'
  - - Write (optional)
    - Write the scene from Douglas's point of view, in a paragraph.
