  - - capiō
    - 'A few verbs end in -iō but belong to the third conjugation; the infinitive shows it (capere, not capīre). Section 160:

      ~ capiō, capis, capit, capimus, capitis, capiunt

      It follows audiō wherever two vowels come together, and regō everywhere else. Like it: faciō (make, do), fugiō (flee), iaciō (hurl), rapiō (seize).'
  - - Commands
    - 'Section 161. The imperative gives an order to "you". The singular is usually the present stem; the plural adds -te:

      ~ amā, amāte

      ~ monē, monēte

      ~ rege, regite

      ~ audī, audīte

      The imperative of sum is es, este ("be!"). dīcō, dūcō and faciō have short forms: dīc, dūc, fac.'
