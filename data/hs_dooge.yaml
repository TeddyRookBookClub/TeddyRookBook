    - Chant the present of sum.
  - - Four conjugations
    - 'Regular verbs fall into four groups, called conjugations. You find the group from the infinitive (the "to" form): amāre, to love (first); monēre, to advise (second); regere, to rule (third); audīre, to hear (fourth). Drop the -re to get the present stem: amā-, monē-.'
  - - The present tense
    - 'Add the personal endings to the stem:

      ~ amō, amās, amat, amāmus, amātis, amant

      ~ moneō, monēs, monet, monēmus, monētis, monent

      The long vowel of the stem goes short before -t and -nt, and before another vowel.'
