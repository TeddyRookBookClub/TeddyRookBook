  goal: Your child makes adverbs from adjectives (cārē, fortiter), compares them, and knows the irregular ones such as bene, melius, optimē.
  materials: *id003
  book: How adverbs are formed and compared from first- and second-declension adjectives (§ 320) and from third-declension adjectives (§ 321), case forms used as adverbs (§ 322), irregular comparisons (§ 323), a practice list (§ 324), the rule (§ 325), and nine Latin and seven English sentences (§ 326). Vocabulary on page 297.
  steps:
  - - Warm up
    - Your child compares bonus and magnus. Today's irregular adverbs come from those.
  - - The new idea
    - 'From a first- or second-declension adjective, add -ē to the base: cārus gives cārē (dearly). From a third-declension adjective, add -iter (or -ter): fortis gives fortiter (bravely), audāx gives audācter.

      The comparative adverb is the neuter comparative adjective (cārius, fortius). The superlative adverb ends in -ē (cārissimē, fortissimē).'
  - - Irregular adverbs
    - 'Read § 323 aloud as a chant:

      ~ bene, melius, optimē

      ~ diū, diūtius, diūtissimē

      ~ magnopere, magis, maximē

      ~ saepe, saepius, saepissimē'
  - - Vocabulary
    - 'Page 297. Some of the words:

      ~ aequus, -a, -um, even, level; equal

      ~ fossa, -ae, f., ditch (fosse)

      ~ gēns, gentis (-ium), f., race, tribe, nation (Gentile)

      Also simul atque, as soon as, and plūrimum valēre, to be most powerful.'
  - - Latin to English
    - 'Translate the nine sentences about Marius and the Germans. Two of them:

