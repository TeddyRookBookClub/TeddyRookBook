  mins: 35
  goal: Your child compares the six adjectives in -lis (facilis, facillimus) and translates a comparative followed by an ablative instead of quam.
  materials: *id003
  book: Six adjectives in -lis that take -limus in the superlative (§ 307), the ablative with comparatives (§§ 308 and 309), and twelve Latin and eight English sentences (§ 310). Vocabulary on page 296.
  steps:
  - - Warm up
    - Your child compares clārus, ācer and fortis aloud.
  - - Six special adjectives
    - 'facilis, difficilis, similis, dissimilis, gracilis and humilis form the comparative normally but add -limus for the superlative:

      ~ facilis, -e, easy

      facilior, facillimus. Say all six in a row, positive, comparative, superlative.'
  - - No quam
    - 'Instead of quam, Latin can put the second thing in the ablative:

      ~ Nihil est clārius quam sōl

      ~ Nihil est clārius sōle

      Both mean ''Nothing is brighter than the sun.'' The rule:

      ~ The comparative degree, if quam is omitted, is followed by the separative ablative.'
  - - Vocabulary
    - 'Page 296. Some of the words:

      ~ celeritās, -ātis, f., speed (celerity)

      ~ clāmor, clāmōris, m., shout, clamor

      ~ statim, adv., immediately, at once

      ~ subitō, adv., suddenly

      ~ tardus, -a, -um, slow (tardy)'
  - - Latin to English
    - 'Translate the twelve sentences. Two of them:

      ~ Multa flūmina sunt lēniōra Rhēnō.

      ~ Nihil pulchrius urbe Rōmā vīdī.'
  - - English to Latin
