  goal: Your child uses ordinal numbers (first, second) and the accusative to say how long something lasted or how far it went.
  materials: *id003
  book: Ordinal numbers (§ 333, with the list in § 478), distributives such as singulī, bīnī, ternī (§ 334), the accusative of extent with its rule (§§ 335 and 336), the reading Caesar in Gaul, and seven English sentences. Vocabulary on page 298.
  steps:
  - - Warm up
    - 'Count to twenty in Latin. Then ask: how do you say ''on the first day''? (prīmō diē, ablative of time.)'
  - - Ordinals
    - 'Ordinal numbers (first, second, third) decline like bonus. Learn the first twenty from § 478; your child already knows prīmus and secundus. Distributives mean ''one each, two each'': singulī, bīnī, ternī.'
  - - How long, how far
    - '~ Duration of time and extent of space are expressed by the accusative.

      ~ Vir tōtum diem cucurrit

      The man ran the whole day.

      ~ Caesar mūrum decem pedēs mōvit

      Caesar moved the wall ten feet. The book warns: ''how long'' is accusative, but ''when'' or ''within which'' is ablative.'
  - - Vocabulary
    - 'Page 298. Some of the words:

      ~ agmen, agminis, n., line of march, column; prīmum agmen, the van; novissimum agmen, the rear

      ~ passus, passūs, m., a pace, five Roman feet; mīlle passuum, a thousand (of) paces, a Roman mile

      ~ premō, premere, pressī, pressus, press hard, harass

      ~ vexō, vexāre, vexāvī, vexātus, annoy, ravage (vex)'
  - - Latin to English
    - 'Read Caesar in Gaul. Two of its sentences:

      ~ Caesar bellum in Galliā septem annōs gessit.

      ~ Tōtum diem ācriter pugnātum est.

      For each time phrase, ask: how long (accusative) or when (ablative)?'
  - - English to Latin
    - 'Write the seven sentences. They include miles, feet and hours: decide each time between accusative and ablative.'
  - - Wrap-up
    - 'Ask: ''for three hours'', ''in three hours'', ''ten miles''. Memorize the rule and the new words.'
  answers: 'Caesar in Gaul (sentences not numbered in the book):

    Caesar waged war in Gaul for seven years. In the first year he conquered the Helvetii, and in the same year many tribes of the Germans surrendered to him. For many years the Germans had been harassing the Gauls, and the German leaders had often been leading their forces across the Rhine. They did not come one at a time, but many thousands of men were hurrying into Gaul. For this reason the chiefs of Gaul called a council and decided to send envoys to Caesar. Caesar, as soon as he heard this report, gathered his forces without delay. At daybreak he bravely joined battle with the Germans. The whole day there was fierce fighting. Caesar himself led the line of battle on the right wing. A great part of the German army fell. After great slaughter a few fled many miles to the river.'
- num: 60
  roman: LX
  idx: 167
  unit: 12
  title: Deponent verbs; prepositions with the accusative
  mins: 40
  goal: Your child recognizes deponent verbs (passive forms, active meanings) and translates them correctly.
  materials: *id003
  book: 'Deponent verbs (§ 338) and the principal parts of a model verb from each conjugation (§ 339), a list of prepositions with the accusative, eleven Latin and seven English sentences, and a pointer to the Seventh Review (Lessons LIII to LX, §§ 524 to 526). Vocabulary on page 298: the last new vocabulary in the book.'
  steps:
  - - Warm up
    - 'Your child conjugates the present passive of portō: portor, portāris, portātur, and so on.'
  - - The new idea
    - 'A deponent verb has passive endings but an active meaning. The book says they are passive in form but active in meaning. hortor means ''I encourage'', not ''I am encouraged''. The models from § 339:

      ~ hortor, hortārī, hortātus sum, encourage

      ~ vereor, verērī, veritus sum, fear

      ~ sequor, sequī, secūtus sum, follow

      Also patior (suffer, allow) and partior (share). Learn their synopses from § 493.'
  - - Prepositions
    - Read the list of prepositions that take the accusative. Most are old friends; mark the new ones and learn those.
  - - Vocabulary
    - 'Page 298. Some of the words:

      ~ cōnor, cōnārī, cōnātus sum, attempt, try

      ~ moror, morārī, morātus sum, delay

      ~ proficīscor, proficīscī, profectus sum, set out

      ~ undique, adv., from all sides'
  - - Latin to English
    - 'Translate the eleven sentences. Two of them:

      ~ Quis eōs hortātus est?

      ~ Fortissimae gentēs Galliae ex Germānīs oriēbantur.

      Translate every deponent as active.'
  - - English to Latin
    - 'Write the seven sentences. A footnote asks: will this be a deponent or an active form?'
  - - Wrap-up
    - Your child gives the principal parts of hortor and sequor. Memorize the deponents and the new words. Spend the next day on the Seventh Review at the back of the book.
  practice: This is the last new vocabulary in the book. Before Part III, spend a day or two on the Seventh Review and on old word cards.
  answers: 'Some numbered items are a question and its answer.

    1. Three of the lieutenants, contrary to Caesar''s expectation, were afraid to march through the enemy''s territory.

    2. Who encouraged them? The general encouraged them and tried to persuade them, but he could not.

    3. What terrified the lieutenants? Either fear of the enemy, who were pressing on all sides, or the length of the road terrified them.

    4. Nevertheless almost all feared Caesar much more than the enemy.

    5. The bravest tribes of Gaul were descended from the Germans.

    6. Why were they so brave? Because they did not allow wine or other things which destroy courage to be brought to them.

    7. Caesar inquired of the traders about the island of Britain, but could learn nothing.

    8. And so he himself decided to go to this land, and about the middle of summer he set out with many warships.

    9. He completed the voyage with great speed and landed in a very favorable place.

    10. The barbarians tried with all their might to keep him from the island.

    11. But he pursued the barbarians many miles; yet without cavalry he could not overtake them.'
- num: 61
  roman: LXI
  idx: 172
  unit: 13
  title: 'The subjunctive mood: the present subjunctive'
  mins: 40
  goal: Your child conjugates the present subjunctive, active and passive, in all four conjugations and of sum, and can say what the subjunctive is for.
  materials: &id004
  - The book (the lesson pages)
  - A notebook and pencil
  - Index cards from earlier lessons
  book: Part III, Constructions, opens here. The subjunctive as a fourth mood (§§ 342 and 343), the present subjunctive of all conjugations active and passive (§ 344) and of sum (§ 345), and a table comparing indicative and subjunctive sentences, with a short English exercise.
  steps:
  - - Warm up
    - 'Ask: which moods do we know? Indicative (statements and questions), imperative (commands), infinitive. Today adds the fourth.'
  - - The new idea
    - 'The indicative states facts. The subjunctive expresses wishes, purposes, possibilities and expectations. Read the book''s comparison table in pairs:

      ~ Fortis est

      ~ Fortis sit

      ''He is brave'' versus ''May he be brave''.

      ~ Statim proficīscimur

      ~ Statim proficīscāmur

      ''We set out at once'' versus ''Let us set out at once''.'
  - - How it is formed
    - 'The present subjunctive is made from the present stem. The sign is -e- in the first conjugation and -a- in the others. The personal endings are the ones your child already knows:

      ~ amem, amēs, amet, amēmus, amētis, ament

      ~ moneam, moneās, moneat, moneāmus, moneātis, moneant

      ~ regam, regās, regat, regāmus, regātis, regant

      ~ audiam, audiās, audiat, audiāmus, audiātis, audiant'
  - - Passive and sum
    - 'The passive uses passive endings: amer, amēris, amētur, and so on. Then sum:

      ~ sim, sīs, sit, sīmus, sītis, sint'
  - - Say the forms aloud
    - 'Read every paradigm in § 344 aloud together, then your child alone. Then conjugate the book''s practice verbs: cūrō, iubeō, sūmō, iaciō, mūniō.'
  - - The English exercise
    - 'Read the book''s short English passage. For each verb, ask: is this a plain fact (indicative) or a wish, purpose or possibility (subjunctive)?'
  - - Wrap-up
    - Your child conjugates the present subjunctive of regō and of sum from memory. Part III has no new vocabulary lists. Spend five minutes on old word cards instead.
  practice: 'Over two days: forms the first day, the comparison table and exercise the second. The book''s teacher notes suggest memorizing the model sentences.'
  tip: 'A simple trick for the vowel: first conjugation swaps a to e (amet); the others put in an a (moneat, regat, audiat).'
- num: 62
  roman: LXII
  idx: 174
  unit: 13
  title: The subjunctive of purpose
  mins: 35
  goal: Your child translates and writes purpose clauses with ut, nē and quō plus the subjunctive.
  materials: *id004
  book: The subjunctive of purpose (§§ 348 and 349), the words that introduce purpose clauses (§ 350), a warning that Latin prose never uses the infinitive for purpose (§ 352), four drill sets and five English sentences.
  steps:
  - - Warm up
    - Your child conjugates the present subjunctive of dūcō and videō.
  - - The new idea
    - 'English often says purpose with ''to'': ''They come to see.'' Latin never does that in prose. It uses ut (in order that) or nē (in order that not, lest) with the subjunctive.

      ~ The subjunctive is used in a dependent clause to express the purpose of the action in the principal clause.

      ~ Pācem petunt ut domum revertantur

      ~ Fugiunt nē vulnerentur

      They ask for peace so that they may return home. They flee so that they may not be wounded. With a comparative, quō is used: quō facilius, so that more easily.'
  - - Drill 1 and 2
    - 'Do the book''s drill sets aloud. Each starts a sentence and lists verbs to finish it: ''Veniunt ut dūcant, mittant, videant…'' (They come to lead, to send, to see…). Then ''Fugimus nē capiāmur…'' (We flee so as not to be captured…).'
  - - Drill 3 and 4
    - 'Do the last two sets: ''Mittit nūntiōs quī…'' (He sends messengers to…), where quī with the subjunctive also shows purpose, and ''Castra mūniunt quō facilius…'' (They fortify the camp so that more easily…).'
  - - English to Latin
    - Write the five English sentences. Footnotes mark where an English 'to' must not become an infinitive.
  - - Wrap-up
    - 'Ask: what are the three words that introduce purpose clauses? (ut, nē, quō, plus quī.) Memorize the rule in § 349.'
  tip: 'Whenever an English sentence says ''to'' or ''in order to'', stop and ask: is this purpose? If so, Latin needs ut and the subjunctive.'
  answers: 'Drill answers (meanings):

    1. They come to lead, to send, to see, to hear; to be led, to be sent, to be seen, to be heard.

    2. We flee so as not to be captured, handed over, killed or seized; so as not to see; so as not to resist.

    3. He sends messengers to say, to hear, to come, to tell, to be heard, to sit in the council.

    4. They fortify the camp so that they may more easily defend themselves, withstand the attack, conquer the enemy, seek safety.'
- num: 63
  roman: LXIII
  idx: 176
  unit: 13
  title: The imperfect subjunctive; the sequence of tenses
  mins: 40
  goal: Your child forms the imperfect subjunctive and chooses present or imperfect subjunctive according to the main verb.
  materials: *id004
  book: How the imperfect subjunctive is formed (§ 354) with full paradigms, the imperfect subjunctive of sum (§ 355), primary and secondary tenses (§ 356), a table for the sequence of tenses (§ 357), the rule (§ 358), examples (§ 359), and Latin drills and five English sentences (§ 360).
  steps:
  - - Warm up
    - Your child says the rule for purpose clauses and gives one example.
  - - The new form
    - 'This one is easy: add the personal endings to the present infinitive.

      ~ The imperfect subjunctive may be formed by adding the personal endings to the present active infinitive.

      So amāre gives:

      ~ amārem, amārēs, amāret, amārēmus, amārētis, amārent

      And esse gives:

      ~ essem, essēs, esset, essēmus, essētis, essent'
  - - Say the forms aloud
    - Read the § 354 paradigms aloud, active and passive (amārer, amārēris…). Then let your child make the imperfect subjunctive of any verb by starting from its infinitive.
  - - Sequence of tenses
    - 'Tenses for present or future time are primary; tenses for past time are secondary. The dependent subjunctive follows the main verb:

      ~ Primary tenses are followed by primary tenses and secondary by secondary.

      So: Mittit nūntiōs ut… plus present subjunctive. Mīsit nūntiōs ut… plus imperfect subjunctive. Copy the § 357 table into the notebook.'
  - - Latin drills
    - Do the § 360 drills aloud. They repeat the last lesson's drills with past main verbs, so every subjunctive becomes imperfect.
  - - English to Latin
    - Write the five English sentences. First decide whether the main verb is primary or secondary.
  - - Wrap-up
    - Your child says the rule of sequence and gives the imperfect subjunctive of sum. Part III has no new vocabulary lists. Spend five minutes on old word cards instead.
  practice: 'Two days: forms the first day, sequence of tenses and exercises the second. The book''s teacher notes say the sequence table underlies all later subjunctive work.'
  tip: Keep the sequence table on a card on the table during the next several lessons.
- num: 64
  roman: LXIV
  idx: 179
  unit: 13
  title: Perfect and pluperfect subjunctive; commands and requests
  mins: 40
  goal: Your child forms the perfect and pluperfect subjunctive and translates verbs of commanding, asking and persuading followed by ut or nē.
  materials: *id004
  book: The perfect and pluperfect subjunctive, active and passive, and of sum (§§ 361 to 364), substantive clauses (§ 365), the rule for substantive clauses of purpose (§ 366), a list of verbs that take them (§ 367), then eight Latin and five English sentences.
  steps:
  - - Warm up
    - Your child conjugates the imperfect subjunctive of moneō and says the sequence-of-tenses rule.
  - - The new forms
    - 'Both come from the perfect stem. The perfect is like the future perfect indicative but with -m in the first person. The pluperfect adds -issem.

      ~ amāverim, amāveris, amāverit, amāverimus, amāveritis, amāverint

      ~ amāvissem, amāvissēs, amāvisset, amāvissēmus, amāvissētis, amāvissent

      The passive uses the participle with sim or essem:

      ~ amātus sim

      ~ amātus essem

      And sum: fuerim, fuissem. (The book''s paradigms also show stress marks; you can ignore those.)'
  - - Commands and requests
    - 'After verbs of commanding, urging, asking, persuading or advising, English uses ''to'': ''He urged them to resist.'' Latin uses ut or nē with the subjunctive, as the object of the verb.

      ~ Monet ut domī maneāmus

      He advises us to remain at home. One exception:

      ~ iubeō, order, takes the infinitive as in English'
  - - Learn the verbs
    - 'Read the § 367 list: hortor, imperō, moneō, petō, quaerō, rogō, persuādeō, postulō, suādeō. Note that imperō and persuādeō take the dative of the person.'
  - - Latin to English
    - 'Translate the eight sentences. Two of them:

      ~ Caesar Helvētiīs imperāvit nē per prōvinciam iter facerent.

      ~ Iīs persuādēre nōn potuī ut domī manērent.

      Compare sentences 2 and 3: imperō with nē, then iubeō with the infinitive.'
  - - English to Latin and wrap-up
    - Write the five sentences; the first is to be written twice, with imperō and with iubeō. Memorize the new subjunctive forms and the § 367 verbs.
  practice: 'Two days: forms the first day, the substantive clauses and exercises the second.'
  answers: '1. He asks and urges him to speak himself.

    2. Caesar commanded the Helvetii not to march through the province.

    3. Caesar did not order the Helvetii to march through the province.

    4. He persuaded the citizens to leave their territory.

    5. Caesar will advise the chiefs not to join battle.

    6. He demanded that they should not wage war with the Helvetii or with their allies.

    7. I asked them not to set out.

    8. I could not persuade them to remain at home.'
- num: 65
  roman: LXV
  idx: 183
  unit: 13
  title: The subjunctive of possum; verbs of fearing
  mins: 35
  goal: Your child conjugates possum in the subjunctive and translates fear clauses, where nē means 'that' and ut means 'that not'.
  materials: *id004
  book: The subjunctive of possum (§ 369, with the full verb in § 495), verbs of fearing (§§ 370 and 371) with the rule (§ 372), and seven Latin and six English sentences (§ 373, on the next page).
  steps:
  - - Warm up
    - 'Your child gives the present subjunctive of sum: sim, sīs, sit, sīmus, sītis, sint.'
  - - possum
    - 'possum is pot- plus sum, so its subjunctive is easy: possim, possīs, possit, possīmus, possītis, possint. Read its other subjunctive tenses in § 495 together.'
  - - Verbs of fearing
    - 'This one seems backwards. If you fear something will happen, you don''t want it: Latin uses nē. If you fear it won''t happen, you do want it: Latin uses ut.

      Timeō nē veniat: I fear that he will come.

      Timeō ut veniat: I fear that he will not come.

      So after a verb of fearing, nē means ''that'' or ''lest'' and ut means ''that not''.'
  - - Latin to English
    - 'Translate the seven sentences. Two of them:

      ~ Vereor ut hostium impetum sustinēre possim.

      ~ Caesar numquam timuit nē legiōnēs vincerentur.

      Ask each time: what is feared, that it will happen, or that it won''t?'
  - - English to Latin
    - 'Write the six sentences. The first four are a set: that they are not coming, lest they are coming, that they had come, that they had not come. The last uses an infinitive: being afraid to do something is not the same as fearing that something will happen.'
  - - Wrap-up
    - Ask your child to explain why nē means 'that' after timeō. Memorize the rule in § 372 and the subjunctive of possum.
  answers: '1. Caesar feared that the punishment of the captives would not please the Gauls.

    2. The Romans themselves greatly feared that the Helvetii would march through the province.

    3. They feared that enough grain could not be sent.

    4. I fear that I cannot withstand the attack of the enemy.

    5. He feared that the baggage had been captured by the enemy.

    6. Caesar never feared that the legions would be conquered.

    7. The legions did not fear to fight.'
- num: 66
  roman: LXVI
  idx: 184
  unit: 14
  title: Participles
  mins: 40
  goal: Your child forms the four participles of a verb and translates them naturally, often with 'when', 'while', 'who' or 'after'.
  materials: *id004
  book: The four participles and how each is formed (§ 374), the participles of deponent verbs (§ 375), what time each participle shows (§ 376), model sentences on translating them (§ 377), and nine Latin and six English sentences (§ 378). The lesson begins partway down the page.
  steps:
  - - Warm up
    - Your child gives the perfect passive participle of three verbs (amātus, monitus, captus). They have used these since Lesson XXXV.
  - - The four participles
    - 'A participle is a verb used as an adjective. Latin has four:

      ~ amāns, amātūrus, amātus, amandus

      loving, about to love, loved (having been loved), to be loved. The present adds -ns to the present stem; the future active adds -ūrus to the participle stem; the future passive (also called the gerundive) adds -ndus to the present stem.'
  - - Declining amāns
    - 'The present participle declines like a third-declension adjective: amāns, amantis, amantī, amantem, amantī or -e. The others decline like bonus. Deponent verbs have all four, and their perfect participle is active in meaning:

      ~ hortāns, hortātūrus, hortātus, hortandus'
  - - Translate naturally
    - 'The book insists on natural English. Read the model sentences:

      ~ Mīlitēs currentēs erant dēfessī

      The soldiers who were running were tired.

      ~ Oppidum captum vīdimus

      We saw the captured town. A participle often becomes a clause with when, while, after, since or who.'
  - - Latin to English
    - 'Translate the § 378 sentences. Two of them:

      ~ Puer timēns nē capiātur fugit.

      ~ Sōl oriēns multōs interfectōs vīdit.

      Find the participle, the noun it agrees with, and the best English clause.'
  - - English to Latin
    - Write the six sentences, using participles for the 'when' and 'while' clauses as the book asks.
  - - Wrap-up
    - Your child gives all four participles of moneō and of hortor. Memorize § 374 and § 376.
  practice: 'Two days. On day two, have your child give the participles of the book''s practice verbs: cūrō, iubeō, sūmō, iaciō, mūniō, then cōnor, vereor, sequor, patior, partior.'
  answers: 'The book prints the number 8 twice; the second is given here as 9.

    1. The boy, fearing that he may be captured, runs away.

    2. The eagle, moved by anger, had tried to kill the other birds.

    3. The soldiers, hard pressed by the enemy, could not throw their weapons.

    4. Caesar, intending to praise the tenth legion, went forward to the front of the column.

    5. The general, having urged the horsemen to fight bravely, gave the signal for battle.

    6. The soldiers, having pursued the enemy eight miles, returned to camp with many captives.

    7. The rising sun saw many dead.

    8. The Romans, suspecting a bold plan, did not trust themselves to the barbarians.

    9. The ship, having gone out of the harbor, was in no danger.'
- num: 67
  roman: LXVII
  idx: 187
  unit: 14
  title: volō, nōlō, mālō; the ablative absolute
  mins: 40
  goal: Your child conjugates volō, nōlō and mālō and translates the ablative absolute with a natural English clause.
  materials: *id004
  book: The irregular verbs volō, nōlō and mālō (§ 379, with full forms in § 497), the ablative absolute with examples (§ 380) and the rule with three notes (§ 381), then a drill on the new verbs, Latin sentences and eight English sentences.
  steps:
  - - Warm up
    - Your child gives the four participles of capiō.
  - - Three irregular verbs
    - 'volō (I wish), nōlō (I am unwilling, from nē plus volō) and mālō (I prefer, from magis plus volō). Learn them from § 497. A few forms: volō, vīs, vult; volumus, vultis, volunt. The command nōlī (plural nōlīte) with an infinitive means ''don''t''.'
  - - The ablative absolute
    - 'A noun and a participle in the ablative, loosely attached to the sentence, tell the circumstances:

      ~ Proeliō commissō multī vulnerātī sunt

      Literally ''the battle having been joined, many were wounded'', but say: ''When the battle began, many were wounded.''

      ~ Hīs rēbus cognitīs mīlitēs fūgērunt

      ''When these things were learned, the soldiers fled.'' Choose when, after, since, although or if to fit.'
  - - Two cautions
    - Read the § 381 notes. sum has no present participle, so two nouns can stand alone, as in Caesare duce, 'under Caesar's leadership'. And if the noun is the subject or object of the main verb, don't use the ablative absolute.
  - - Drill
    - 'Do the drill on volō, nōlō and mālō aloud: for each form, say person, tense and meaning (māvīs, you prefer; nōlumus, we are unwilling).'
  - - Latin to English
    - 'Translate the sentences. Two of them:

      ~ Sōle oriente, avēs cantāre incēpērunt.

      ~ Conciliō convocātō, prīncipēs ita respondērunt.

      Never leave an ablative absolute in its literal form.'
  - - English to Latin and wrap-up
    - Write the English sentences; several give the literal Latin pattern in parentheses. Memorize volō, nōlō and mālō and the rule in § 381.
  practice: 'Two days: verbs and drill, then the ablative absolute and exercises.'
  tip: 'The book''s teacher notes say it plainly: the ablative absolute should never be translated literally in the final answer.'
  answers: 'The Latin sentences, in order (the drill items are not included):

    When the sun was rising, the birds began to sing.

    When the shouts were heard, the barbarians refused to advance.

    After Caesar had encouraged the legions, the soldiers fought a little more bravely.

    When these things were learned, the Helvetii persuaded their neighbors to march with them.

    When the labors were finished, the soldiers asked Caesar to give them rewards.

    When the council had been called together, the chiefs answered as follows.

    The leader, staying several days in the territory of the Helvetii, burned many villages.

    When the size of the Germans was learned, some of the Romans were afraid.

    Although the traders were questioned, Caesar could find out nothing more.'
- num: 68
  roman: LXVIII
  idx: 190
  unit: 14
  title: The verb fīō; the subjunctive of result
  mins: 40
  goal: Your child conjugates fīō and translates result clauses ('so … that') and tells them apart from purpose clauses.
  materials: *id004
  book: fīō as the passive of faciō (§ 383, with full forms in § 500), result clauses with examples and notes (§ 384), the rules (§§ 385 and 386), how purpose and result clauses differ (§ 387), and Latin drills, sentences and nine English sentences (§ 388, on the next page).
  steps:
  - - Warm up
    - Your child gives a purpose clause in Latin with ut and one with nē.
  - - fīō
    - 'fīō, fierī, factus sum means ''become, happen, be made''. It is the passive of faciō in the present system. The ī is long except before -er and in fit. Read its forms in § 500 aloud: fīō, fīs, fit; fīmus, fītis, fīunt.'
  - - Result clauses
    - '''So brave that they win'' is a result. Latin uses ut (negative ut nōn) with the subjunctive, but it is translated like a plain fact:

      ~ Terror erat tantus ut omnēs fugerent

      The terror was so great that all fled. A warning word like tam, tantus, ita or eius modī usually comes first. After verbs of ''bringing about'', the ut clause is the object:

      ~ Terror fēcit ut omnēs fugerent'
  - - Purpose or result?
    - 'Purpose: in order that, negative nē. Result: so that, negative ut nōn, usually with tam or tantus in front. Compare the book''s pair: Tam graviter vulnerātus est ut caperētur (he was so badly wounded that he was captured) and Graviter vulnerātus est ut caperētur (he was badly wounded so that he might be captured).'
  - - Latin to English
    - 'Do the fīō drills, then the sentences. Two of them:

      ~ Hominēs erant tam audācēs ut nūllō modō continērī possent.

      ~ Sōl facit ut omnia sint pulchra.

      Ask each time: purpose or result?'
  - - English to Latin
    - 'Write the nine sentences. Sentences 4 to 7 come in pairs: one result, one purpose.'
  - - Wrap-up
    - Your child explains how to tell purpose from result. Memorize fīō and the rules in §§ 385 and 386.
  practice: 'Two days: fīō and result clauses, then the comparison with purpose and the exercises.'
