    5. Men of the greatest courage pursued the enemy ten miles.

    6. Caesar persuaded the Roman people to elect him consul.

    7. The victory of the army was always most pleasing to the general.

    8. They marched for three days and arrived at Geneva, a town of the enemy.

    9. Caesar heard that the Germans had made war upon the Gauls.

    10. It was of great use to Caesar''s soldiers that they had trained themselves in earlier battles.'
- num: 78
  roman: LXXVIII
  idx: 214
  unit: 16
  title: Review of the ablative
  mins: 40
  goal: Your child names the uses of the ablative under three headings, 'with or by', 'from' and 'in or at', and spots them in sentences.
  materials: *id004
  book: A review of the ablative (§ 453), grouped as the ablative rendered 'with (or by)', 'from (or by)' and 'in (or at)', with references back to earlier lessons, then thirteen Latin and eight English sentences (§ 454).
  steps:
  - - Warm up
    - Ask your child to name as many uses of the ablative as they can remember.
  - - Three families
    - 'Read § 453 together. The book sorts every use of the ablative under three English headings: ''with (or by)'', ''from (or by)'' and ''in (or at)''. Go through each use it lists, say it in your own words, and look up any forgotten one by its § reference.'
  - - Latin to English
    - 'Translate the thirteen sentences. Two of them:

      ~ Gallī timōre servitūtis commōtī bellum parābant.

      ~ Bellum ācerrimum ā Caesare in Gallōs gestum est.

      For every ablative, name its family and its exact use.'
  - - English to Latin
    - 'Write the eight sentences. Each tests a different ablative: number 4 needs the ablative of degree of difference, and number 8 an ablative absolute.'
  - - Wrap-up
    - Make a three-column chart of the ablative uses with one Latin example each, and keep it for the last lesson.
  practice: 'Spend two days if needed: one on the sentences, one on the chart and English sentences.'
  answers: '1. The Gauls, having seized the higher places, are trying to keep the army from its march.

    2. All the townspeople went out of the town and began to seek safety in flight.

    3. Caesar shows that he holds the life of his soldiers much dearer than his own safety.

    4. When he had arrived sooner than anyone expected, the enemy sent him hostages.

    5. The village, situated in a valley, is shut in on all sides by very high mountains.

    6. This tribe was the most powerful among the Gauls, both in courage and in number of men.

    7. In the second watch they went out of the camp in no fixed order and under no command.

    8. Leaving two legions at Geneva, on the next day he set out for home with the rest.

    9. There were two routes by which the Helvetii could go out from home.

    10. The king was a man of the greatest boldness and of great power among the people.

    11. The Gauls, moved by fear of slavery, were preparing war.

    12. Caesar advises the lieutenants to restrain the soldiers, so that they may not advance too far through eagerness for fighting or hope of booty.

    13. A very fierce war was waged by Caesar against the Gauls.'
- num: 79
  roman: LXXIX
  idx: 215
  unit: 16
  title: 'Review of the verb: gerund, infinitive, subjunctive'
  mins: 40
  goal: Your child reviews every use of the gerund, gerundive, infinitive and subjunctive in the book, and can name the construction in any sentence.
  materials: *id004
  book: 'The last lesson: the gerund (§ 455), the gerundive (§ 456), the uses of the infinitive including indirect statement (§ 457), and the uses of the subjunctive: purpose, result, characteristic, cum clauses and indirect questions (§ 458). Then ten Latin and eight English sentences. The reading matter begins on the following leaves.'
  steps:
  - - Warm up
    - Ask your child to list every use of the subjunctive they know. Write the list down.
  - - Gerund and gerundive
    - 'Read §§ 455 and 456. Ask: what is the difference between the gerund and the gerundive? When must the gerundive be used?'
  - - The infinitive
    - 'Read § 457: as subject, as a completing infinitive (possum īre), as object with a subject accusative after verbs of wishing and commanding, and in indirect statement.'
  - - The subjunctive
    - 'Read § 458 and check it against your child''s list: purpose, result, characteristic, cum clauses, indirect questions. Add fear clauses and substantive clauses after verbs of asking and commanding from earlier lessons.'
  - - Latin to English
    - 'Translate the ten sentences, naming every construction. Two of them:

      ~ Nēmō relinquēbātur quī arma ferre posset.

      ~ Tam ācriter ab utrāque parte pugnābātur ut multa mīlia hominum occīderentur.'
  - - English to Latin
    - 'Write the eight sentences. The footnotes help: number 6 uses quaerere ab, number 7 must not use an infinitive, and number 8 uses the gerundive with ad.'
  - - Wrap-up
    - 'Celebrate: the grammar of the book is done. Talk about what comes next: the reading selections at the back, starting with the Labors of Hercules.'
  practice: Spend two or three days on this review. Then move on to the reading matter, which the book links to the lessons.
  answers: '1. Caesar, when he had arrived, urged the soldiers not to give up the plan of taking the town.

    2. The king, having pitched camp near the town, sent scouts to find out where the Roman army was.

    3. No one was left who could bear arms.

    4. The messengers saw that a huge quantity of arms had been thrown from the wall into the ditch.

    5. The leader ordered his men to cross the river. But to cross this river was very difficult.

    6. Although the Romans were annoyed at this disaster, nevertheless they refused to turn their backs.

    7. When this rumor was heard, such terror seized the minds of all that not even the bravest were willing to join battle.

    8. There were some who thought that the season of the year was not suitable for making a march.

    9. There was such fierce fighting on both sides that many thousands of men were killed.

    10. What do you fear? I fear that the Romans intend to conquer all Gaul and to inflict wrongs upon us.'
