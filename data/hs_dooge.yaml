- title: The passive perfects; perfect passive and future active infinitives
  mins: 40
  goal: Your child forms the perfect, pluperfect and future perfect passive with the participle and sum, and the infinitives that go with them.
  materials: *id001
  book: The fourth principal part (the perfect passive participle), the passive perfect tenses made with sum, how the participle agrees with the subject, and two more infinitives. Eight Latin sentences and five sets of English forms.
  steps:
  - - Review
    - Give the active synopsis of videō in the first person.
  - - The fourth principal part
    - 'Section 201 gives the model verbs in full:

      ~ amō, amāre, amāvī, amātus

      ~ moneō, monēre, monuī, monitus

      The fourth part is the perfect passive participle ("loved", "advised").'
  - - Passive perfects
    - 'English says "I have been loved". Latin uses the participle with sum:

      ~ amātus sum, I have been or was loved

      ~ amātus eram, I had been loved

      ~ amātus erō, I shall have been loved'
  - - The participle agrees
    - 'The participle works like an adjective (bonus, bona, bonum) and agrees with the subject: Vir laudātus est, Puella laudāta est, Virī laudātī sunt.'
  - - Two more infinitives
    - 'Section 205: amātus esse, "to have been loved". Section 206: amātūrus esse, "to be about to love". Now the active infinitive has three tenses: amāre, amāvisse, amātūrus esse.'
  - - Exercises
    - 'Section 207, Exercise I. Two of the sentences:

      ~ Fābula Andromedae nārrāta est.

      ~ Multae fābulae ā magistrō nārrātae sunt.

      Then Exercise II.'
  practice: 'Two days: forms on day one, infinitives and exercises on day two.'
