  goal: Your child conjugates eō (go) and its compounds and turns 'He says that…' sentences into Latin with an accusative and an infinitive.
  materials: *id004
  book: The irregular verb eō (§ 412, full forms in § 499) and its compounds (§ 413), direct and indirect statements (§§ 414 to 416), tenses of the infinitive (§§ 417 and 418), verbs that introduce indirect statements (§§ 419 and 420), four set phrases, and fourteen Latin and five English sentences. The lesson starts partway down the page.
  steps:
  - - Warm up
    - Your child gives the present, perfect and future infinitives of moneō (monēre, monuisse, monitūrus esse).
  - - eō
    - 'eō means ''go''. Learn it from § 499: eō, īs, it; īmus, ītis, eunt; infinitive īre. Its compounds work the same way: adeō (go to, visit), exeō (go out), ineō (enter upon, begin), redeō (go back), trānseō (go across).'
  - - Indirect statement
    - '''He says that the Gauls are brave.'' Latin has no word for ''that'' here. The verb becomes an infinitive and its subject goes into the accusative:

      ~ Dīcit Gallōs esse fortīs

      Literally ''He says the Gauls to be brave.'' The adjective agrees with Gallōs, so it is accusative too.'
  - - Which infinitive?
    - 'The infinitive keeps the tense of the original statement: present infinitive for what is happening, perfect for what happened, future for what will happen. Unlike English, it does not change after ''said'': Dīxit Gallōs esse fortīs is ''He said that the Gauls were brave''.'
  - - Verbs that start it
    - 'Read the § 420 lists: saying (dīcō, negō, nūntiō, respondeō), knowing (cognōscō, sciō), thinking (arbitror, exīstimō, iūdicō, putō, spērō), perceiving (audiō, sentiō, videō, intellegō). Learn any that are new.'
  - - Latin to English
    - 'Do the forms of eō in items 1 to 4, then the sentences. Two of them:

      ~ Arbitrāmur potentiam rēgīnae esse maiōrem quam cīvium.

      ~ Helvētiī sciunt Rōmānōs priōrēs victōriās memoriā tenēre.'
  - - English to Latin and wrap-up
    - 'Write the five sentences. Before each, ask: what were the speaker''s exact words? Memorize eō, the rules in §§ 416 and 418, and the § 420 verbs.'
