- title: Principal parts review; prepositions; yes-or-no questions
  mins: 40
  goal: Your child knows the four principal parts of the verbs so far, which prepositions take which case, and the three kinds of yes-or-no questions.
  materials: *id002
  book: A long list of principal parts to review, a summary of the prepositions learned, and three ways to ask a yes-or-no question (-ne, nōnne, num). Ten Latin and five English exercises. A note after the lesson points to the fourth review (Lessons XXVII–XXXVI).
  steps:
  - - Principal parts
    - Section 208 lists all four principal parts of the verbs you have had. The book says the fourth part is the only new one. Work through it in small groups over the two days.
  - - Prepositions
    - 'Section 209: with the ablative, ā or ab, ē or ex, cum, dē, prō, sine. With the accusative, ad, apud, per. in takes the ablative when it means "in, on", and the accusative when it means "into, to, against".'
  - - Yes-or-no questions
    - 'Section 210:

      ~ Venitne? is he coming?

      ~ Nōnne venit? is he not coming?

      ~ Num venit? he isn''t coming, is he?

      -ne just asks. nōnne expects "yes". num expects "no".'
  - - Vocabulary
    - 'From the special vocabulary for Lesson XXXVI:

      ~ dexter, dextra, dextrum, right

      ~ sinister, sinistra, sinistrum, left

      ~ frūstrā, in vain

      and the verbs gerō, occupō, postulō, recūsō, stō, temptō and teneō, with all their principal parts. The book also explains that ubi can mean "when" as well as "where".'
  - - Exercises
    - 'Section 211, Exercise I. Two of them:

      ~ Ea victōria nōn dubia erat.

      ~ Nōnne habēbat Cornēlia ōrnāmenta aurī? Habēbat.

      Then Exercise II.'
  - - Wrap up
    - 'Ask your child three questions about the day in Latin style: one with -ne, one with nōnne, one with num. They answer.'
  practice: Two days, then a review day with the fourth review at the back of the book (sections 513–516), if you like.
  answers: 'Exercise I:

    1. Did not Cornelia have ornaments of gold? She did.

    2. Sextus the lieutenant was not carrying his shield on his right arm, was he? Sextus was carrying his shield not on his right arm but on his left.

    3. Many wars had been waged by the Gauls in vain.

    4. When the town had been seized by the treacherous Sextus, the wretched townspeople were killed with the sword.

    5. That town was full of grain.

    6. Did not Sextus demand grain from the townspeople? Yes, but they refused to give grain.

    7. Why was the town destroyed by Sextus? Because the grain was refused.

    8. That victory was not doubtful.

    9. The townspeople were worn out and lacked arms.

    10. They did not attempt flight, did they? Not at all.'
