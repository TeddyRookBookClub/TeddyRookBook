  - - Two accusatives
    - '''The Romans made Caesar consul'': Caesarem is the object, and cōnsulem is a second accusative naming the same person. In the passive both become nominative: Caesar cōnsul factus est. Verbs that do this (§ 393): creō (choose), appellō, nōminō, vocō (call), faciō (make).'
