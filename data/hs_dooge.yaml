  - - Wrap-up
    - Your child makes adverbs from three adjectives you name. Memorize § 323 and the new words.
  answers: '1. Nothing was done better than that battle in which Marius with a much smaller army put much larger forces of the Germans to flight.

    2. The enemy boldly made attacks on the cohorts of the Romans; but Marius withstood all these most bravely.

    3. The barbarians were no braver than the Romans.

    4. At first the barbarians seemed to be superior, then the Romans fought more fiercely.

    5. Finally, when the battle had been fought for a very long time on almost even terms, the barbarians took to flight.

    6. Certain tribes of the Germans, as soon as they heard the report of that disaster, hid themselves in the farthest regions of their territory.

    7. The Romans conquered more often than the enemy, because they had better arms.

    8. Among all the nations the Romans were the most powerful.

    9. As soon as these cohorts had withdrawn into more level ground, they pitched camp without any difficulty.'
