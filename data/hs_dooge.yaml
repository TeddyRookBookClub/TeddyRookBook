  goal: Your child translates cum clauses as 'when', 'since' or 'although', and the ablative that tells 'in what respect'.
  materials: *id004
  book: The meanings of cum and when it takes the subjunctive (§§ 395 and 396), the ablative of specification (§§ 397 and 398), four set phrases, and ten Latin and five English sentences.
  steps:
  - - Warm up
    - Your child translates one sentence with an ablative absolute from Lesson LXVII.
  - - The new idea
    - 'The conjunction cum can mean when, since or although. If it just fixes the time (''at the time when''), it takes the indicative. If it describes the circumstances, it takes the subjunctive, and that is much more common.

      ~ Caesarem vīdī tum cum in Galliā eram

      I saw Caesar at the time when I was in Gaul.

      ~ Caesar in eōs impetum fēcit cum pācem peterent

      Caesar attacked them although they were asking for peace. A tamen (nevertheless) in the main clause is a strong sign of ''although''.'
  - - In what respect
    - '~ The ablative is used to denote in what respect something is true.

      ~ Homō erat corpore īnfīrmus sed validus animō

      The man was weak in body but strong in mind.'
  - - Set phrases
    - 'Learn the four phrases: aliquem certiōrem facere, to inform someone; certiōrem fierī, to be informed; iter dare, to allow to pass; obsidēs inter sē dare, to exchange hostages.'
  - - Latin to English
    - 'Translate the ten sentences. Two of them:

      ~ Cum Caesar in Galliam vēnit, Helvētiī aliōs agrōs petēbant.

      ~ Caesar neque corpore neque animō īnfīrmus erat.

      For each cum clause, try when, since and although, and pick the one that makes sense.'
  - - English to Latin and wrap-up
    - Write the five sentences. Memorize the rules in §§ 396 and 398 and the four phrases.
  answers: '1. The Helvetii, when they had set out from home in the time of our fathers, had put the army of the consul to flight.

    2. When Caesar came into Gaul, the Helvetii were seeking other lands.

    3. Although Caesar was in Hither Gaul, nevertheless he was informed about the plans of the Helvetii.

    4. Since the Helvetii were very famous in war, Caesar refused to let them pass through the province.

    5. When the lieutenant had heard this, he informed Caesar.

    6. When the chiefs were exchanging hostages, the Romans prepared for war.

    7. Caesar, when this had been announced, hurries to set out from the city.

    8. Not even in courage were the Gauls equal to the Germans.

    9. Caesar was weak neither in body nor in mind.

    10. That war began at the time when Caesar was consul.'
