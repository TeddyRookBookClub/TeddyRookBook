lessons:
- title: 'First principles: subject, verb and object'
  mins: 30
  goal: Your child can find the subject, the verb and the object in a short Latin sentence, and knows that Latin has no word for "the" or "a".
  materials: &id001
  - The book, open to this lesson
  - A notebook for Latin, and a pencil
  book: The first lesson of "Words and Forms". It explains subject and predicate, the object of a verb, and the verb "to be", then gives eight short Latin sentences to read aloud and take apart.
  steps:
  - - Start with English
    - 'Write: The farmer loves his daughter.

      Say: Who is this sentence about? The farmer. That is the subject. What does he do? Loves. That is the verb. Whom does he love? His daughter. That is the object.

      Try two more English sentences of your own the same way.'
  - - Read the new idea
    - Read sections 19 to 21 together. The book says a sentence has a subject (what we talk about) and a predicate (what we say about it). Some verbs take an object, some do not. The verb "is" just links the subject to a word that describes it.
  - - Meet the first Latin sentences
    - 'Turn to the eight sentences in section 22. Here are two:

      ~ Agricola fīliam amat.

      ~ Iūlia aquam portat.

      The book gives the English word for word, in Latin order: "(The) farmer (his) daughter loves." Point out that the verb comes last.'
  - - Say them aloud
    - 'Say each word slowly after you. The book uses the Roman pronunciation: c is always hard like k, g is always hard as in get, v sounds like w, and a bar over a vowel (a long mark) means hold that vowel a little longer. Read all eight sentences together, twice.'
  - - Take the sentences apart
    - For each sentence, your child points to the subject, the verb and (if there is one) the object. Use the English the book prints underneath to help.
  - - Notice two things
    - Latin has no word for "the" or "a". Latin often leaves out "he", "she" or "his" when the meaning is clear. So "Rosam in comīs habet" is just "(She) has (a) rose in (her) hair."
  - - Wrap up
    - 'Your child tells you in their own words: what is a subject, a verb and an object? Read the eight sentences one last time.'
  practice: Read the eight sentences aloud each day until they come smoothly.
  tip: There is nothing to memorize yet. The goal is to get used to the sound of Latin and to the idea that the verb often comes last.
  answers: '1. America is my fatherland.

    2. The farmer loves his daughter.

    3. His daughter is Julia.

    4. Julia and the farmer are on the island.

    5. Julia carries water.

    6. She has a rose in her hair.

    7. Julia is a pretty girl.

    8. The lady has a beautiful daughter.'
  num: 1
  roman: I
  idx: 31
  unit: 1
- title: Singular and plural; verbs ending in -t and -nt
  mins: 30
  goal: Your child can make a first-declension noun plural (-a to -ae) and match the verb ending (-t for one, -nt for more than one).
  materials:
  - The book, open to this lesson
  - A notebook for Latin, and a pencil
  - Index cards for the new words (optional)
  book: Explains inflection (changing the ending of a word), singular and plural, the rule that nouns in -a make their plural in -ae, and the verb endings -t and -nt. Thirteen nouns and five verbs to learn, then short exercises both ways.
  steps:
  - - Review
    - Read two sentences from Lesson I aloud. Ask your child to point to the subject and the verb.
  - - 'The new idea: endings change'
    - 'In English we add -s to make a plural (girl, girls). Latin changes the ending instead. Nouns ending in -a change to -ae for the plural.

      ~ puella, puellae

      Verbs change too: -t means one person or thing is doing it; -nt means more than one.

      ~ amat, amant'
  - - Say the words
    - 'Say each word slowly after you. The book uses the Roman pronunciation: c is always hard like k, g is always hard as in get, v sounds like w, and a bar over a vowel (a long mark) means hold that vowel a little longer. Then read the noun list and the verb list in the lesson aloud together.'
  - - Learn the words
    - 'The book gives these nouns (with an English word that comes from each in parentheses):

      ~ agricola, farmer

      ~ aqua, water

      ~ nauta, sailor

      ~ puella, girl

      ~ silva, forest

      ~ terra, land

      and these verbs:

      ~ amat, he (she, it) loves

      ~ labōrat, labors

      ~ nūntiat, announces

      ~ portat, carries

      ~ pugnat, fights

      Make a card for each word: Latin on one side, English on the other. Learn the rest of the list the same way.'
  - - Latin to English
    - 'Do the Latin sentences in section 31. They go like this:

      ~ Nauta pugnat, nautae pugnant.

      ~ Fīlia labōrat, fīliae labōrant.

      Your child reads each one aloud, then says it in English: "The sailor fights, the sailors fight."'
  - - English to Latin
    - 'Now the English sentences in section 31 ("The daughter loves, the daughters love" and so on). Your child writes the Latin. Check: did the noun get -ae for the plural, and did the verb get -nt?'
  - - Wrap up
    - 'Quick drill: you say a singular, your child says the plural. Puella? Puellae. Amat? Amant.'
  practice: Five minutes a day with the word cards until all 18 words are easy.
  tip: Latin words in this book often have an English "cousin" in parentheses, like nauta (nautical). Point these out; they make the words stick.
  answers: 'Latin to English:

    1. The sailor fights, the sailors fight.

    2. The girl loves, the girls love.

    3. The farmer carries, the farmers carry.

    4. The daughter labors, the daughters labor.

    5. The sailor announces, the sailors announce.

    6. The ladies love, the lady loves.'
  num: 2
  roman: II
  idx: 33
  unit: 1
- title: The five cases
  mins: 35
  goal: Your child can name the five Latin cases and say what each one usually means in English.
  materials: *id001
  book: Explains that Latin shows how a noun is used by its ending, not by word order. A table sets English "who, whose, whom" beside the Latin domina in all its cases, singular and plural, with the case names. An exercise asks for the number and case of 27 forms.
  steps:
  - - Review
    - Drill the Lesson II words with the cards. Ask for a few plurals.
  - - 'The new idea: endings do the work'
    - In English, "The lady loves the daughter" and "The daughter loves the lady" mean different things because of word order. In Latin the ending tells you who does what, so the words can go in any order. Each form of a noun is called a case.
  - - Read the table
    - 'Look at the table in section 33. The Latin side gives the singular of domina:

      ~ domina, dominae, dominae, dominam, dominā

      and the plural:

      ~ dominae, dominārum, dominīs, dominās, dominīs

      The cases, in the book''s order, are nominative (the subject), genitive (of, ''s), dative (to or for), accusative (the object) and ablative (from, with, by, in).'
  - - Say it aloud
    - Say the whole declension of domina together, down the singular, then down the plural, five times. Make it a chant. Hold the long ā at the end of the ablative dominā a little longer.
  - - Match case to meaning
    - 'Point to a form and ask what it means: dominārum? "of the ladies". dominīs? "to or for the ladies", or "from, with, by, in the ladies".'
  - - The exercise
    - Do section 34 together. For each form, your child says singular or plural, and which case. Some forms can be more than one case (dominae can be genitive or dative singular, or nominative plural). Saying all the possibilities is the right answer.
  - - Wrap up
    - Your child says the domina chant from memory, singular and plural.
  practice: Say the domina chant every day this week. It is the pattern for every word in this lesson group.
  tip: Take two days if your child needs it. Knowing these five cases well makes the rest of the book much easier.
  num: 3
  roman: III
  idx: 35
  unit: 1
- title: Nominative subject, accusative object, genitive owner
  mins: 35
  goal: Your child uses the nominative for the subject, the accusative for the object and the genitive for the owner in short Latin sentences.
  materials: &id002
  - The book, open to this lesson
  - The special vocabulary page for this lesson (near the back of the book; the lesson tells you the page)
  - A notebook for Latin, and a pencil
  - Index cards for new words (optional)
  book: Three rules with an example sentence, then eleven Latin sentences about Diana and Latona, eight English sentences to put into Latin, and six questions to answer in Latin.
  steps:
  - - Review
    - Chant the declension of domina from Lesson III.
  - - The new idea
    - 'Look at the example in section 35:

      ~ Fīlia agricolae nautam amat.

      fīlia is the subject (nominative). nautam is the object (accusative, ending -am). agricolae says whose daughter (genitive, "of the farmer"). The book gives three rules: subject in the nominative, direct object in the accusative, owner in the genitive.'
  - - Vocabulary
    - 'Turn to the special vocabulary for Lesson IV near the back of the book. Some of the words:

      ~ dea, goddess

      ~ fera, a wild beast

      ~ sagitta, arrow

      ~ est, he (she, it) is; sunt, they are

      ~ necat, he (she, it) kills

      ~ quis, who?

      Say each word aloud. Make cards for the new ones.'
  - - Latin to English
    - 'Do the sentences in Exercise I. Two of them:

      ~ Diāna est dea lūnae.

      ~ Lātōna Diānam amat.

      For each word ending, your child asks: subject, object or owner? Then translates.'
  - - English to Latin
    - 'Exercise II. Your child writes each English sentence in Latin. Remind them: subject in -a, object in -am (or -ās if plural), owner in -ae (or -ārum if plural).'
  - - Questions in Latin
    - Section 40 asks questions in Latin, such as "Quis est Diāna?" Your child answers in Latin, using the sentences from Exercise I.
  - - Wrap up
    - Ask your child to make up one Latin sentence of their own with a subject, an object and an owner.
  practice: Review the Lesson II and IV word cards together for a few minutes each day.
  tip: Diana was the Roman goddess of the moon and the hunt, and Latona was her mother. A minute of the story makes the sentences more fun.
  answers: 'Exercise I:

    1. Diana is a goddess.

    2. Latona is a goddess.

    3. Diana and Latona are goddesses.

    4. Diana is the goddess of the moon.

    5. Diana is the daughter of Latona.

    6. Latona loves Diana.

    7. Diana is the goddess of the forests.

    8. Diana loves the forest.

    9. Diana carries arrows.

    10. Diana kills the wild beasts of the forest.

    11. The wild beasts of the lands fight.'
  num: 4
  roman: IV
  idx: 37
  unit: 1
- title: 'The dative: the indirect object'
  mins: 35
  goal: Your child recognizes and uses the dative (to or for someone) for the indirect object.
  materials: *id002
  book: Explains the dative case, its endings (-ae singular, -īs plural), and the indirect object. Then eleven Latin sentences, many of them questions and answers, and seven English sentences.
  steps:
  - - Review
    - 'Quick drill: in "Fīlia agricolae nautam amat", which word is the subject, the object, the owner?'
  - - The new idea
    - 'In "The girl gives Diana a wreath", the wreath is what is given (the direct object) and Diana is the one it is given to (the indirect object). Latin puts the indirect object in the dative: -ae in the singular, -īs in the plural. Read the rule in section 45 aloud.'
  - - Vocabulary
    - 'From the special vocabulary for Lesson V:

      ~ fābula, story (fable)

      ~ pecūnia, money

      ~ pugna, battle

      ~ victōria, victory

      ~ dat, he (she, it) gives

      ~ nārrat, he (she, it) tells

      ~ quia or quod, because

      The book adds cui, "to whom? for whom?", pronounced as one syllable, like "kwee".'
  - - Latin to English
    - 'Do Exercise I. Two of the sentences:

      ~ Quis nautīs pecūniam dat?

      ~ Puella Diānae corōnam dat quia Diānam amat.

      For each one, find the dative first, then put the sentence together.'
  - - English to Latin
    - Exercise II. Your child writes the Latin. Before writing each sentence, they say which word will be dative.
  - - Wrap up
    - Say the domina chant again and point to the two dative forms (dominae and dominīs).
  practice: Keep going with the word cards. Mix in the old words with the new.
  tip: Questions with quis and cui are followed by their answers in the next sentence. Read them as a little conversation, with you asking and your child answering.
  answers: 'Exercise I:

    1. Who gives money to the sailors?

    2. The daughters of the farmer give money to the sailors.

    3. Who announces the outcome (fortune) of the battle?

    4. Galba announces the outcome of the battle to the farmers.

    5. To whom does the lady tell a story?

    6. The lady tells a story to the farmer''s daughter.

    7. Who gives a wreath to Diana?

    8. The girl gives a wreath to Diana because she loves Diana.

    9. The goddess of the moon carries arrows and kills the wild beasts of the forests.

    10. Whose victory does Galba announce?

    11. Galba announces the sailor''s victory.'
  num: 5
  roman: V
  idx: 38
  unit: 1
- title: The ablative, prepositions and adjectives
  mins: 40
  goal: Your child knows the ablative endings, uses five prepositions with the ablative, and makes an adjective agree with its noun.
  materials: *id002
  book: Explains the ablative (from, with, by, in), the prepositions ā or ab, dē, ē or ex, cum, and in, and how adjectives agree with their nouns. Ends with a dialogue between Julia and Galba about Diana.
  steps:
  - - Review
    - 'Chant domina. Ask: which forms are dative?'
  - - The ablative
    - The ablative ends in -ā in the singular and -īs in the plural. The book points out that the ablative -ā is long, while the nominative -a is short. It covers ideas English says with "from", "with", "by", "in" or "at".
  - - Prepositions
    - 'Section 53 lists the prepositions that take the ablative:

      ~ ā or ab, from, away from

      ~ dē, from, down from

      ~ ē or ex, from, out of

      ~ cum, with

      ~ in, in, on

      Do the short list of phrases after it ("In the water, on the land, down from the forest..."), saying each in Latin.'
  - - Adjectives agree
    - An adjective describes a noun and takes the same number and case. So "a good girl" is puella bona, and "of good girls" is puellārum bonārum.
  - - Vocabulary
    - 'From the special vocabulary for Lesson VI:

      ~ bona, good

      ~ magna, large, great

      ~ mala, bad, wicked

      ~ parva, small, little

      ~ pulchra, beautiful, pretty

      ~ cūr, why

      ~ nōn, not

      The book also teaches -ne, the question sign added to the first word of a question.'
  - - Read the dialogue
    - 'Read the dialogue "Julia and Galba" in section 56 together, each taking a part. It begins:

      ~ Quis, Galba, est Diāna?

      ~ Diāna, Iūlia, est pulchra dea lūnae et silvārum.

      Translate it line by line.'
  - - Wrap up
    - Your child picks three adjectives and puts each with a noun in the nominative and the ablative.
  practice: 'This is a big lesson. It is fine to split it: grammar and phrases on day one, vocabulary and dialogue on day two.'
  tip: Reading the dialogue in two voices is the best practice there is. Do it again tomorrow without looking at the English.
  answers: 'The dialogue, line by line:

    J. Who, Galba, is Diana?

    G. Diana, Julia, is the beautiful goddess of the moon and of the forests.

    J. Whose daughter, Galba, is Diana?

    G. Diana, Julia, is the daughter of Latona.

    J. What does Diana carry?

    G. Diana carries arrows.

    J. Why does Diana carry arrows?

    G. Diana carries arrows, Julia, because she kills the bad wild beasts of the great forest.

    J. Does Latona love her daughter?

    G. She does, and the daughter loves Latona.

    J. What is your little daughter carrying?

    G. My little daughter is carrying pretty wreaths.

    J. To whom does your daughter give the pretty wreaths?

    G. She gives wreaths to Diana.

    J. Who is with your daughter? Is she alone?

    G. She is not alone; my little daughter is with my maid.'
  num: 6
  roman: VI
  idx: 41
  unit: 1
- title: The first declension; gender
  mins: 35
  goal: Your child declines any noun in -a, separates the base from the ending, and knows that first-declension nouns are feminine unless they name a male.
  materials: *id002
  book: The full first declension with domina, base and ending, and the three Latin genders. Then nine Latin sentences about a farmer and his daughter, seven English sentences, and questions to answer in Latin.
  steps:
  - - Review
    - Say the five prepositions from Lesson VI and their meanings.
  - - The first declension
    - 'Section 57: all nouns whose nominative singular ends in -a belong to the first declension. The table is the domina table you already know. The base is the part that does not change (domin-); the endings are added to it.'
  - - Gender
    - Latin nouns are masculine, feminine or neuter. First-declension nouns are feminine, except those that name males, like agricola (farmer) and nauta (sailor), which are masculine.
  - - Vocabulary
    - 'From the special vocabulary for Lesson VII:

      ~ casa, cottage

      ~ cēna, dinner

      ~ gallīna, hen, chicken

      ~ īnsula, island

      ~ ubi, where

      ~ ad, to

      ~ habitat, he (she, it) lives

      ~ laudat, praises

      ~ parat, prepares

      ~ vocat, calls, invites'
  - - Latin to English
    - 'Exercise I. Two of the sentences:

      ~ Agricola cum fīliā in casā habitat.

      ~ Bona fīlia agricolae cēnam parat.

      Your child reads each aloud before translating.'
  - - English to Latin
    - Exercise II, about where the farmer lives and his daughter's good dinner. Then answer the questions in section 63 in Latin.
  - - Wrap up
    - Your child declines casa and īnsula aloud, singular and plural.
  practice: Decline one new noun from the vocabulary each day, aloud and in writing.
  answers: 'Exercise I:

    1. The farmer lives in a cottage with his daughter.

    2. The farmer''s good daughter prepares dinner.

    3. The dinner is pleasing to the farmer, and the farmer praises his good daughter.

    4. Then the farmer''s daughter calls the chickens to dinner.

    5. The chickens love the farmer''s daughter.

    6. Bad daughters do not prepare good dinners.

    7. The farmer''s daughter is pleasing to the lady.

    8. The lady lives on a large island.

    9. The lady gives money to the good little girl.'
  num: 7
  roman: VII
  idx: 44
  unit: 2
- title: Adjectives agree in gender; Latin word order
  mins: 35
  goal: Your child makes adjectives agree in gender, number and case, and knows the usual order of words in a Latin sentence.
  materials: *id002
  book: Adjectives agree in gender too. A table sets domina beside bona, and another declines dea bona, with the special forms deābus and fīliābus. Then the normal order of words, and ten Latin sentences. A note after the lesson points to the first review (sections 502–505 at the back).
  steps:
  - - Review
    - Decline casa aloud. Ask which genders Latin has.
  - - Agreement
    - 'Section 65: adjectives agree with their nouns in gender, number and case. Look at the table of domina and bona side by side: the endings match.'
  - - Two special words
    - 'dea (goddess) and fīlia (daughter) use -ābus in the dative and ablative plural, so they are not mixed up with the words for gods and sons:

      ~ deābus bonīs'
  - - Word order
    - 'Read section 68 together. The usual order is: subject, words that go with the subject, indirect object, direct object, adverb, verb. A word moved to the front is being stressed.'
  - - Vocabulary
    - 'From the special vocabulary for Lesson VIII:

      ~ via, way, road, street

      ~ alta, high, deep

      ~ clāra, clear, bright; famous

      ~ lāta, wide

      ~ longa, long

      ~ nova, new'
  - - Latin to English
    - 'Do the sentences in section 69. Two of them:

      ~ Nautae altās et lātās amant aquās.

      ~ Clāra est īnsula Sicilia.

      In each, ask: which word has been moved for emphasis?'
  - - Wrap up
    - Your child declines dea bona aloud, singular and plural.
  practice: Before Lesson IX, look over the first review at the back of the book (sections 502–505), if you like. It lists the words and forms from Lessons I–VIII.
  answers: '1. Your roads are not long.

    2. Are the new trumpets in my cottage? They are not.

    3. Who lives in the wide forest? Diana, the beautiful goddess of the bright moon, lives in the wide forest.

    4. Sailors love the deep and wide waters.

    5. What is your maid carrying? My maid is carrying a new trumpet.

    6. Where are Lesbia and Julia? Lesbia is in your cottage, and Julia is in mine.

    7. Is Italy a wide land? Italy is long, not wide.

    8. To whom does Galba the farmer tell a new story? He tells a new story to the daughters of the famous lady.

    9. The island of Sicily is famous.

    10. Whom does Latona praise? Latona praises her daughter.'
  num: 8
  roman: VIII
  idx: 47
  unit: 2
- title: 'The second declension: dominus and pīlum'
  mins: 40
  goal: Your child declines a masculine noun in -us and a neuter noun in -um, and uses a predicate noun after "is".
  materials: *id002
  book: Introduces the five declensions and the second declension, with the model nouns dominus (master) and pīlum (spear). Rules that hold in every declension, the predicate noun, and a dialogue between Galba and Marcus.
  steps:
  - - Review
    - Decline dea bona.
  - - Five declensions
    - 'Latin nouns fall into five groups called declensions. The genitive singular tells you which one: -ae for the first, -ī for the second.'
  - - The second declension
    - 'Nouns in -us are usually masculine; nouns in -um are neuter. The singular of dominus:

      ~ dominus, dominī, dominō, dominum, dominō

      and of pīlum:

      ~ pīlum, pīlī, pīlō, pīlum, pīlō

      The vocative (calling someone) of dominus is domine.'
  - - Rules for every declension
    - 'Read section 74 together. Two are easy to remember: neuter nouns have the same form in the nominative and accusative, and in the plural these end in -a.'
  - - Say the forms
