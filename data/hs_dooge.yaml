book:
  id: latinforbeginner00doogrich
  title: Latin for Beginners
  year: '1909'
  key: dooge
  short: Latin for Beginners
  eyebrow: Latin · D'Ooge · Lessons for beginners
  hero: 'D''Ooge''s first-year Latin course, starting from nothing: sounds, cases, declensions and verbs, with sentences and short stories in every lesson. Every lesson has a guide you can follow step by step even if you have never studied Latin, with the right page of the book beside it.'
  how:
  - <b>A little, often.</b> About 30 to 40 minutes a day, four or five days a week. Many lessons take two days; the guide says so.
  - <b>You can learn alongside.</b> You do not need to know Latin. The guides explain each idea in plain English, and the book gives the meaning of every word.
  - '<b>Out loud.</b> Say every form and sentence aloud. The book uses the Roman pronunciation: c and g are always hard, v sounds like w, and a long mark over a vowel means hold it a little longer. The pronunciation section at the front of the book has the details.'
  - <b>Cards for words.</b> Each lesson sends you to a special vocabulary near the back of the book. Put each word on an index card and review a few minutes a day. From Lesson XXXI on, learn all the principal parts of every verb.
  - <b>Chant the tables.</b> Declensions and conjugations stick best when chanted, the same way, every day, until they come without thinking.
  - <b>Use the reviews.</b> After Lessons VIII, XVII, XXVI and XXXVI the book points to review sections at the back. Take a review day there whenever you like.
  unitword: Part
