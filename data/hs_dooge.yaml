- title: Present tense of amō and moneō
  mins: 35
  goal: Your child conjugates first- and second-conjugation verbs in the present tense and translates each form three ways.
  materials: *id001
  book: The four conjugations, the present stem (found by dropping -re from the infinitive), and the present tense of amō and moneō. A list of 21 verbs to learn, then forms to translate both ways.
