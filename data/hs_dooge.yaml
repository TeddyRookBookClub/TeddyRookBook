  - - Pluperfect
    - 'Perfect stem + -eram, -erās, -erat, and so on, just like the pluperfect of sum:

      ~ amāveram, I had loved

      ~ monueram, I had advised'
  - - Future perfect
    - 'Perfect stem + -erō, -eris, -erit, -erimus, -eritis, -erint:

      ~ amāverō, I shall have loved

