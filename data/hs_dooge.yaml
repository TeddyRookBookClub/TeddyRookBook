  - - Wrap-up
    - Your child gives the superlative of all six -lis adjectives. Memorize them and the new words.
  answers: '1. No one has seen soldiers more eager than the Romans.

    2. Immediately the general ordered the swiftest possible messengers to carry a letter to Rome.

    3. Many rivers are gentler than the Rhine.

    4. Among the Romans who was more famous than Caesar?

    5. I have seen nothing more beautiful than the city of Rome.

    6. Suddenly the very bold multitude with a great shout joined battle more fiercely.

    7. Your horse is not slow, is it? Not slow indeed, but swifter than an eagle.

    8. When I was at Rome, no one was more friendly to me than Sextus.

    9. Certain women wished to give food to the soldiers.

    10. The king forbade the citizens to leave the city by night.

    11. That boy is more slender than this woman.

    12. The scout pointed out two roads, the one easy, the other more difficult.'
