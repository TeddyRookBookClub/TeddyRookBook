  book: The intensive ipse and how it differs from the reflexive suī (§§ 285 and 286), the declension of īdem (§ 287), twelve Latin and six English sentences, and the start of the reading How Horatius held the Bridge (§ 289). Vocabulary on page 295.
  steps:
  - - Warm up
    - Your child declines suī and says 'The boy sees himself' in Latin.
  - - ipse
    - 'ipse means ''-self'' too, but it only adds emphasis: ''the general himself'', ''the very danger''. It is an adjective that agrees with its noun, while suī is a pronoun pointing back to the subject. ipse declines like the nine irregular adjectives such as ūnus and tōtus (genitive -īus, dative -ī); learn it from § 481.

      ~ ipse, ipsa, ipsum, intensive pronoun, self; even, very'
  - - īdem
    - 'īdem, ''the same'', is is, ea, id with -dem added. Where an m meets the d, it becomes n: eum plus dem gives eundem.

      ~ īdem, eadem, idem, demonstrative pronoun, the same (identity)

      Read the full table in § 287 aloud.'
  - - Vocabulary
    - 'Page 295. Some of the words:

      ~ corpus, corporis, n., body (corporal)

      ~ ōlim, adv., formerly, once upon a time

