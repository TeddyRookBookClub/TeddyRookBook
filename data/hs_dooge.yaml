  goal: Your child gives a synopsis of a verb, and uses the ablative of place from which, of separation and of the personal agent.
  materials: *id002
  book: 'How to give a synopsis (one form of a verb in every tense, active and passive). Then three uses of the ablative meaning "from": place from which, separation, and the person by whom something is done. Nine Latin and six English sentences.'
  steps:
  - - Review
    - Give the present infinitive active and passive of amō, regō and audiō.
  - - Synopses
    - 'A synopsis runs one person of a verb through all its tenses. Section 177 gives the first person of each conjugation, for example:

      ~ amō, amābam, amābō

      ~ amor, amābar, amābor

      The book says to practice other persons too, especially the third singular and plural.'
  - - Place from which
    - 'Section 179: use ā or ab, dē, ē or ex with the ablative.

      ~ Agricolae ex agrīs veniunt

      "the farmers come from the fields". ab means from near a place, ex out of it, dē down from it.'
  - - Separation and the agent
    - 'Section 180: words meaning "free from", "lack" or "keep from" take an ablative (with a preposition only if something actually moves). Section 181: the person by whom a thing is done goes in the ablative with ā or ab:

