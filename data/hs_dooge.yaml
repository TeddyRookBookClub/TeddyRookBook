  - - Wrap-up
    - Your child declines īdem in the singular. Memorize ipse, īdem and the new words.
  practice: 'Two days: pronouns and sentences, then the Horatius reading.'
  tip: A footnote points out that Latin says 'I and you' (ego et tū), not 'you and I'.
  answers: '1. You and I live in the same city.

    2. We do not fear the journey itself but the wild beasts which are said to be in the dense forest.

    3. Once we ourselves made the same journey.

    4. At that time we saw many wild beasts.

    5. But they did not harm us.

    6. Caesar himself snatched a shield from the hands of a soldier and hurried into the very line of battle.

    7. And so the soldiers with the greatest courage hurled their weapons at the bodies of the enemy.

    8. The Romans also received severe wounds.

    9. Finally the enemy turned their backs and fled in all directions.

    10. In the same hour a letter was sent to Rome by the general himself.

    11. In the same month the captives also were sent into Italy.

    12. But many, because of their wounds, refused to make the difficult journey across the mountains, and were said to be at Geneva.'
