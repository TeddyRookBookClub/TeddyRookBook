- num: 43
  roman: XLIII
  idx: 129
  unit: 8
  title: 'Third declension: i-stem nouns'
  mins: 40
  goal: Your child can tell which third-declension nouns are i-stems and decline hostis, urbs and animal correctly.
  materials: *id003
  book: The rules for recognizing i-stems (§ 241) and how their endings differ (§ 242), the paradigms of caedēs, hostis, urbs, cliēns (§ 243) and īnsigne, animal, calcar (§ 244), then eleven Latin and five English exercises. Vocabulary on page 292.
  steps:
  - - Warm up
    - Your child declines one consonant-stem noun, such as rēx, and one neuter, such as flūmen.
  - - The new idea
    - 'Some third-declension nouns have a hidden i in their stem. It shows up in a few places only. For masculine and feminine nouns: genitive plural -ium, and accusative plural -īs or -ēs. For neuters: ablative singular -ī, and an i in every plural form.

      How to spot them (§ 241): nouns in -is or -ēs with the same number of syllables in the nominative and genitive, nouns in -ns and -rs, one-syllable nouns ending in -s or -x after a consonant, and neuters in -e, -al, -ar.'
  - - Say the forms aloud
    - 'Read hostis aloud together:

      ~ hostis, hostis, hostī, hostem, hoste

      ~ hostēs, hostium, hostibus, hostīs, -ēs, hostibus

      Then the neuter animal:

      ~ animal, animālis, animālī, animal, animālī

      ~ animālia, animālium, animālibus, animālia, animālibus'
  - - Vocabulary
    - 'Page 292 at the back. Some of the words:

      ~ cīvis, cīvis (-ium), m. and f., citizen (civic)

      ~ hostis, hostis (-ium), m. and f., enemy in war (hostile)

      ~ mare, maris (-ium), n., sea (marine)

      ~ nāvis, nāvis (-ium), f., ship (naval)

      ~ urbs, urbis (-ium), f., city (suburb)

      The (-ium) is the book''s signal that the noun is an i-stem.'
  - - Latin to English
    - 'Translate the eleven sentences aloud. Two of them:

      ~ Urbs quam vidētis est Rōma.

      ~ Alia animālia terram, alia mare amant.'
  - - English to Latin
    - 'Write the five English sentences in Latin. Check each genitive plural: is the noun an i-stem (-ium) or not (-um)?'
  - - Wrap-up
    - 'Ask: what are the i-stem signs in the endings? Memorize hostis and animal, and the i-stem rules in § 241.'
  practice: 'This lesson usually takes two days: forms and words the first day, the exercises the second.'
  tip: Keep a list titled 'i-stems' on a card. Each time a new noun shows (-ium) in a vocabulary, add it.
  answers: 'Some numbered items have two sentences (a question and its answer).

    1. What city do we see? The city which you see is Rome.

    2. The Roman citizens had fortified their city with high towers and long walls.

    3. The winds were keeping the warships from approaching the territory of the enemy.

    4. The general received from his retainers spurs of gold and other decorations.

    5. The Roman soldiers waged fierce wars with the enemy and overcame them with great slaughter.

    6. Some animals love the land, others the sea.

    7. The warships which were carrying help to the general were destroyed by fire by the enemy.

    8. On that sea we saw many birds which had flown far from land.

    9. Did you not see the warships of the enemy and the fires by which our city was being laid waste? Certainly, but we saw neither the slaughter of the citizens nor the flight of the retainers.

    10. The birds and other animals, when they saw the fire, quickly began to seek safety in flight.

    11. The judge was not standing in the ranks of the foot soldiers, was he? No, the judge was among the horsemen, and his horse wore a beautiful decoration.'
- num: 44
  roman: XLIV
  idx: 132
  unit: 8
  title: vīs and iter; gender in the third declension
  mins: 40
  goal: Your child declines the irregular nouns vīs and iter, uses the gender rules of the third declension, and reads the story of Caesar's bridge over the Rhine.
  materials: *id003
  book: The declensions of vīs (force) and iter (march), the rules for gender in the third declension (§ 247) with a practice list (§ 248), the reading The First Bridge over the Rhine, and seven English sentences. Vocabulary on page 292.
  steps:
  - - Warm up
    - Your child declines hostis and animal from the last lesson.
  - - Two odd nouns
    - 'vīs (force) is irregular, and its plural means strength. iter (march, journey) uses a longer base, itiner-, in every case except the nominative and accusative singular.

      ~ iter, itineris, itinerī, iter, itinere

      ~ vīrēs, vīrium, vīribus, vīrīs, or -ēs, vīribus

      Say both aloud a few times.'
  - - Gender rules
    - 'Third-declension nouns can be any gender, so the book gives rules (§ 247). Read them together:

      ~ Masculine are nouns in -or, -ōs, -er, -ĕs (gen. -itis).

      ~ Neuters are nouns in -e, -al, -ar, -n, -ur, -ŭs, and caput.

      Rule 2 gives the feminines, such as nouns ending in -s after a consonant or after any long vowel but ō; the book lists exceptions, such as the masculine mōns and pōns. Then do the § 248 list: give each noun''s gender and the rule.'
  - - Vocabulary
    - 'Page 292. Some of the words:

      ~ arbor, arboris, f., tree (arbor)

      ~ iter, itineris, n., march, journey, route (itinerary)

      ~ mōns, montis (-ium), m., mountain; summus mōns, top of the mountain

      ~ numquam, adv., never

      ~ trāns, prep. with acc., across (transatlantic)'
  - - Read the story
    - 'Read The First Bridge over the Rhine one sentence at a time. Two of its sentences:

      ~ Mox ad rīpās magnī flūminis vēnērunt.

      ~ Numquam anteā pōns in Rhēnō vīsus erat.

      Use the footnotes; one explains that Romans ''make a bridge on'' a river where we ''build a bridge over'' it.'
  - - English to Latin
    - Write the seven English sentences. For each noun, decide its gender before choosing the adjective ending.
  - - Wrap-up
    - Your child recites the gender rules and declines iter. Memorize the rules in § 247 and the new words.
  practice: Over the week, ask the gender of three third-declension nouns a day, with the rule that decides it.
  tip: Gender rules have exceptions, as the book admits in its own footnote. Learn the main rules first and the exceptions one at a time.
  answers: 'The story''s sentences are not numbered in the book; these follow its order.

    The safety of the allies was always dear to the Romans. Once the Gauls, friends of the Romans, had received many injuries from the Germans who lived across the river Rhine. When envoys came from them to Caesar, the Roman general, and asked for help, the Romans hurried by forced marches to the enemy''s territory. Soon they came to the banks of a great river. The general was eager to lead his forces across the river, but he could not do it by any means. He had no ships. The water was deep. But the general, a famous man, never shaken by bad fortune, formed a new plan. He ordered his men to make a bridge on the broad river. Never before had a bridge been seen on the Rhine. When the enemy saw the bridge which the Romans had made, moved by the greatest terror, they began without delay to prepare for flight.'
- num: 45
  roman: XLV
  idx: 134
  unit: 9
  title: Adjectives of the third declension
  mins: 40
  goal: Your child declines third-declension adjectives of three, two and one endings (ācer, omnis, pār) and makes them agree with nouns.
  materials: *id003
  book: Three classes of third-declension adjectives (§§ 250 to 253), with the paradigms of ācer, ācris, ācre (§ 254), omnis, omne (§ 255) and pār (§ 256), then the reading The Romans invade the Enemy's Country and six English sentences. Vocabulary on page 293.
  steps:
  - - Warm up
    - Your child declines the i-stem noun hostis. Point out the -ī, -ium and -īs endings.
  - - The new idea
    - 'Third-declension adjectives are almost all i-stems, so they decline like hostis and animal, with one difference: the ablative singular is -ī. They come in three kinds, by how many nominative forms they have:

      ~ ācer, ācris, ācre

      ~ omnis, omne

      ~ pār

      Three endings (one per gender), two endings (masculine and feminine share one), and one ending (all genders alike).'
  - - Say the forms aloud
    - 'Decline omnis together: omnis, omnis, omnī, omnem, omnī; plural omnēs, omnium, omnibus, omnīs or -ēs, omnibus. The neuter goes omne, omnis, omnī, omne, omnī; plural omnia, omnium, omnibus, omnia, omnibus. Then try ācer and pār the same way, reading from the book.'
  - - Vocabulary
    - 'Page 293. Some of the words:

      ~ brevis, breve, short, brief

      ~ fortis, forte, brave (fortitude)

      ~ gravis, grave, heavy, severe, serious (grave)

      ~ omnis, omne, every, all (omnibus)

      ~ paucī, -ae, -a, few, only a few (paucity)'
  - - Latin to English
    - 'Read the story of the Roman attack one sentence at a time. Two of its sentences:

      ~ Summā vī omnēs properāvērunt.

      ~ Fortūna fortibus semper favet.

      The last one is a famous proverb. Ask your child what it means in everyday English.'
  - - English to Latin
    - 'Write the six English sentences. Watch adjective agreement: same gender, number and case as the noun, even if the endings don''t look alike.'
  - - Wrap-up
    - Your child declines ācer, ācris, ācre from memory. Memorize the three paradigms and the new words.
  practice: 'Plan two days. On the second, decline the book''s practice phrases: a noun with a third-declension adjective, such as vir ācer.'
  tip: A first- or second-declension noun can take a third-declension adjective (agricola fortis). Agreement means matching gender, number and case, not matching endings.
  answers: 'The story''s sentences are not numbered; these follow the book''s order.

    Once the Roman foot soldiers with swift horsemen were marching toward a city of the enemy. When they were not far away, they seized a farmer, who showed them a short and easy road. Now the Romans could see the high walls, strong towers and other works of the city. On the walls stood many chiefs. When the chiefs saw the Romans, they ordered the citizens to throw stones and other weapons from the walls. Then the brave soldiers could not be held back from battle, and the eager general ordered the signal to be given with the trumpet. All hurried with the greatest energy. The general intrusted all the baggage to Sextus, his lieutenant. Sextus placed the baggage on the top of the hill. The battle was severe and fierce, but the enemy were not equal to the Romans. Some were killed, others were captured. Among the captives were the mother and sister of the king. Few of the Romans were wounded by the enemy. The successful battle was pleasing to the Romans. Fortune always favors the brave.'
- num: 46
  roman: XLVI
  idx: 137
  unit: 9
  title: 'The fourth declension: adventus and cornū'
  mins: 35
  goal: Your child can decline the fourth-declension nouns adventus and cornū and recognize their forms in sentences.
  materials: *id003
  book: The gender rule for the fourth declension (§§ 259 and 260), the paradigms of adventus (arrival) and cornū (horn), notes on lacus and portus, then nine Latin and eight English sentences. Vocabulary on page 293.
  steps:
  - - Warm up
    - 'Your child declines omnis, omne. Then ask: how many declensions have we learned so far? (Three.)'
  - - The new idea
    - 'The fourth declension has nouns ending in -us (mostly masculine) and -ū (neuter). The genitive singular ends in -ūs, so it is easy to tell apart from the second declension''s -ī.

      ~ adventus, adventūs

      ~ cornū, cornūs

      The book adds two notes: manus and domus are feminine, and

      ~ cornū is the only neuter that is in common use.'
  - - Say the forms aloud
    - 'Read adventus across the page together: adventus, adventūs, adventuī, adventum, adventū; plural adventūs, adventuum, adventibus, adventūs, adventibus. Then the neuter plural:

      ~ cornua, cornuum, cornibus

      Point out that -ūs appears three times (genitive singular, nominative and accusative plural), so the rest of the sentence decides which one it is.'
  - - Vocabulary
    - 'Page 293. Some of the words:

      ~ adventus, -ūs, m., approach, arrival (advent)

      ~ exercitus, -ūs, m., army

      ~ equitātus, -ūs, m., cavalry

      ~ manus, -ūs, f., hand; band, force (manual)

      ~ portus, -ūs, m., harbor (port)

      Also: ante (before) and post (behind, after), both with the accusative.'
  - - Latin to English
    - 'Translate the nine sentences. Two of them:

      ~ Continēre exercitum ā proeliō nōn facile erat.

      ~ Post adventum suum Caesar iussit legiōnēs ex castrīs dūcī.'
  - - English to Latin
    - Write the eight English sentences. One uses the idiom impetum facere in, to make an attack on.
  - - Wrap-up
    - Your child declines exercitus from memory. Memorize adventus, cornū and the new words.
  practice: Over the next days, also review the first three declensions orally; the book's teacher notes suggest this here.
  tip: 'When your child sees -ūs, have them ask: genitive singular, or nominative or accusative plural? Then let the verb and the meaning decide.'
  answers: '1. Before Caesar''s arrival the swift horsemen of the enemy made a fierce attack on the camp.

    2. It was not easy to hold the army back from battle.

    3. After his arrival Caesar ordered the legions to be led out of the camp.

    4. In front of the camp there was fighting with the enemy''s cavalry.

    5. After a short time the cavalry fled across the river where the enemy''s camp had been pitched.

    6. Then the victorious general laid waste the fields and burned the villages of the enemy.

    7. But he did not attack the camp, because the soldiers were tired and the place difficult.

    8. The enemy did not stop throwing weapons, which harmed few.

    9. After the unsuccessful battle the chiefs of the Gauls were eager to send envoys to Caesar, but they could not persuade the people.'
- num: 47
  roman: XLVII
  idx: 138
  unit: 9
  title: Place to, from and in; the locative; domus
  mins: 40
  goal: Your child can say 'to Rome', 'from Rome' and 'at Rome' correctly, including with domus and rūs, and reads the start of the story of Daedalus.
  materials: *id003
  book: Rules for the place to which, from which and in which (§§ 262 to 265), the exception for towns, small islands, domus and rūs (§ 266), the locative case (§§ 267 and 268), and domus (§ 269). Then twelve Latin sentences, the reading Daedalus and Icarus, and seven English sentences. Vocabulary on page 293.
  steps:
  - - Warm up
    - 'Ask: how do we say ''into the forest'' and ''out of the forest'' in Latin? (in silvam, ex silvā.) That is what this lesson builds on.'
  - - The new idea
    - 'Normally Latin uses a preposition: ad or in with the accusative for ''to'', ā/ab or ē/ex with the ablative for ''from'', in with the ablative for ''in'' or ''at''. But names of towns and small islands, and the words domus (home) and rūs (country), drop the preposition.

      For ''at'' a town, Latin has a special case, the locative. For singular towns of the first and second declension it looks like the genitive:

      ~ Rōmae

      ~ Corinthī

      ~ domī

      Otherwise it uses the plain ablative, as in Athēnīs, ''at Athens''.'
  - - Say the forms aloud
    - 'Make a three-column chart: to, from, at. Fill it in for Rōma (Rōmam, Rōmā, Rōmae), Athēnae (Athēnās, Athēnīs, Athēnīs), domus (domum, domō, domī) and rūs (rūs, rūre, rūrī). Say each row aloud.'
  - - Vocabulary
    - 'Page 293. Some of the words:

      ~ Athēnae, -ārum, f., plur., Athens

      ~ domus, -ūs, locative domī, f., house, home (dome). Cf. domicilium

      ~ propter, prep. with acc., on account of, because of

      ~ vulnus, vulneris, n., wound (vulnerable)

      Look up the full declension of domus in § 468, as the book says.'
  - - Latin to English
    - 'Translate the twelve sentences. Two of them:

      ~ Caesar Genāvam exercitum magnīs itineribus dūxit.

      ~ Domī cōnsulis hominēs multī sedēbant.

      For each place word, ask: to, from, or at?'
  - - Read and write
    - 'On a second day, read the start of Daedalus and Icarus: Daedalus lives on Crete under King Minos and longs to go home. Then do the seven English sentences.'
  - - Wrap-up
    - 'Quick quiz: ''to Athens'', ''at home'', ''from the country'', ''at Rome''. Memorize the rules in §§ 263 to 268 and the new words.'
  practice: 'Two days: rules and sentences the first day, the story and English sentences the second.'
  tip: 'A simple test helps: is it a town, a small island, home or the country? If yes, no preposition.'
  answers: 'Item 3 is a question and its answer.

    1. At Corinth all the decorations of gold had been seized by the victorious leaders.

    2. Caesar led the army to Geneva by forced marches.

    3. What bridge had the enemy burned? The enemy had burned the bridge on the Rhine.

    4. At Pompeii you will be able to see many houses of the Romans.

    5. The consul hurried from Rome to the country on a swift horse.

    6. At the consul''s house many men were sitting.

    7. The general had ordered the lieutenant to sail to Athens with many warships.

    8. Before the walls of the city are rows of tall trees.

    9. Because of the tall trees we could find neither the lake nor the harbor.

    10. By frequent battles Caesar was training his legions which were in Gaul.

    11. Every day he pitched his camp in a suitable place and fortified it.'
- num: 48
  roman: XLVIII
  idx: 142
  unit: 9
  title: The fifth declension; the ablative of time
  mins: 35
  goal: Your child declines diēs and rēs and uses the ablative without a preposition to say when something happens.
  materials: *id003
  book: The gender of fifth-declension nouns (§ 272), the paradigms of diēs and rēs (§ 273), the ablative of time with its rule (§§ 274 and 275), the reading Galba the Farmer, seven English sentences, and more of Daedalus and Icarus (§ 277). Vocabulary on page 294.
  steps:
  - - Warm up
    - 'Quick quiz from the last lesson: ''at Rome'', ''to Athens'', ''at home''.'
  - - The new idea
    - 'The fifth declension is the last one. Its nouns end in -ēs and are feminine, except diēs (day) and merīdiēs (midday).

      ~ diēs, diēī, diēī, diem, diē

      ~ rēs, reī, reī, rem, rē

      Only diēs and rēs have a full plural: diēs, diērum, diēbus, diēs, diēbus.'
  - - When things happen
    - 'Latin says ''at night'', ''in winter'', ''on the first day'' with the plain ablative, no preposition.

      ~ The time when or within which anything happens is expressed by the ablative without a preposition.

      Examples to say aloud: nocte (at night), hieme (in winter), prīmā lūce (at daybreak).'
  - - Vocabulary
    - 'Page 294. Some of the words:

      ~ diēs, diēī, m., day (diary)

      ~ hōra, -ae, f., hour

      ~ nox, noctis (-ium), f., night (nocturnal)

      ~ spēs, speī, f., hope

      ~ prīmus, -a, -um, first (prime)

      Also the phrase rēs gestae, deeds.'
  - - Latin to English
    - 'Read Galba the Farmer, a short story about a farmer''s day and year. Two of its sentences:

      ~ Galba agricola rūrī vīvit.

      ~ Hieme agricola eōs in lūdum mittit.

      Each time a word answers ''when?'', point to its ablative ending.'
  - - English to Latin
    - 'Write the seven English sentences. Every one has a time phrase: put it in the ablative with no preposition.'
  - - Wrap-up
    - Your child declines rēs from memory. Memorize diēs, rēs, the rule and the new words. Read the next part of Daedalus and Icarus (§ 277) together if time allows.
  practice: If you read the Daedalus passage, give it a day of its own.
  tip: In rēs and diēs, the e is long except in -eī after a consonant and before final -m. The book points this out; say the forms carefully.
  answers: 'Galba the Farmer (sentences not numbered in the book):

    Galba the farmer lives in the country. Every day he begins to work at daybreak, and he does not stop in his work before night. At midday Julia, his daughter, calls him to dinner. At night he turns his tired feet homeward. In summer the farmer''s sons give help to their father. In winter the farmer sends them to school. There the teacher tells the boys many stories about the deeds of Caesar. In summer the farmer''s sons are trained by constant labors, and the heavy work of the field is not troublesome to them. Galba lives without any care and does not fear hard times.'
- num: 49
  roman: XLIX
  idx: 144
  unit: 10
  title: Personal and reflexive pronouns
  mins: 40
  goal: Your child can decline ego, tū, nōs and vōs and the reflexive suī, and tell 'him' from 'himself' in Latin.
  materials: *id003
  book: The classes of pronouns (§ 278), is, ea, id as the third-person pronoun (§ 279), the declension of the first- and second-person pronouns (§ 280), reflexive pronouns (§ 281), and mēcum, tēcum (§ 282). Then ten Latin and seven English sentences, and the reading Puer Īcarus (§ 284). Vocabulary on page 294.
  steps:
  - - Warm up
    - Your child declines is, ea, id, which they already know. The book now uses it as 'he, she, it'.
  - - The new idea
    - 'The words for I, you, we and you all are:

      ~ nōs, nostrum or nostrī, nōbīs, nōs, nōbīs

      ~ vōs, vestrum or vestrī, vōbīs, vōs, vōbīs

      In the singular: ego, meī, mihi, mē, mē and tū, tuī, tibi, tē, tē. The book adds:

      ~ The personal pronouns are not used in the nominative excepting for emphasis or contrast.'
  - - Reflexives
    - 'A reflexive points back to the subject: ''myself'', ''himself''. For I and you, Latin just uses mē, tē, nōs, vōs. For the third person it has a special word, suī, sibi, sē, sē (sometimes sēsē), the same in singular and plural.

      ~ Puer sē videt

      The boy sees himself. With cum, Latin attaches it to the end:

      ~ mēcum

      ~ nōbīscum'
  - - Vocabulary
    - 'Page 294. Some of the words:

      ~ amīcitia, -ae, f., friendship (amicable)

      ~ itaque, conj., and so, therefore, accordingly

      ~ nihil, indeclinable, n., nothing (nihilist)

      ~ pāx, pācis, f., peace (pacify)

      ~ rēgnum, -ī, n., reign, sovereignty, kingdom'
  - - Latin to English
    - 'Translate the ten sentences. Two of them:

      ~ Mea māter est cāra mihi et tua māter est cāra tibi.

      ~ Uter vestrum est cīvis Rōmānus? Neuter nostrum.'
  - - English to Latin
    - Write the seven sentences. The first is 'Whom do you teach? I teach myself.'
  - - Wrap-up
    - Your child declines ego and tū from memory. Memorize the pronoun tables and the new words. Read Puer Īcarus, the end of the Daedalus story, the next day.
  practice: 'Day two: read Puer Īcarus, where Icarus flies too near the sun.'
  tip: Ask 'who is it?' for each pronoun. If it is the same person as the subject, Latin uses the reflexive.
  answers: '1. My mother is dear to me and your mother is dear to you.

    2. Your letter was pleasing to us and our letter was pleasing to you.

    3. The king''s messenger who is with us will answer nothing.

    4. The messengers demanded peace and friendship for themselves and their allies.

    5. If you take up arms, I shall seize the kingdom.

    6. Which of you is a Roman citizen? Neither of us.

    7. At that time many suffered punishment because they had sought the kingship.

    8. Inflict punishment, Caesar, on the fierce enemies of the fatherland.

    9. At daybreak some, moved by fear, took to flight; but others with great courage withstood the attack of our army.

    10. The king''s sister, when she heard about the unsuccessful battle, killed herself at Pompeii.'
