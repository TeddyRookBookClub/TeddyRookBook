  goal: Your child knows the active personal endings and can say the present, imperfect and future of sum ("I am, I was, I shall be").
  materials: *id002
  book: The start of verbs. What tenses, moods and persons are, the full list of active personal endings, and the present, imperfect and future of sum. Then a dialogue between two boys, Sextus and Marcus, and nine English sentences. (The scan has a picture plate between the grammar page and the dialogue page.)
