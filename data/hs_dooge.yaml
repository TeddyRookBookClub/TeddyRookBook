  goal: Your child forms the gerund ('of doing', 'by doing') and the gerundive, and uses ad or causā with them to show purpose.
  materials:
  - The book (the lesson pages and the word lists in §§ 510 and 511)
  - A notebook and pencil
  - Index cards from earlier lessons
  book: A vocabulary review (§ 401, using the word lists in §§ 510 and 511), the gerund (§§ 402 and 403), the gerundive (§§ 404 and 405), rules for their use and for purpose with ad and causā (§§ 406 and 407), the predicate genitive (§§ 408 and 409), four set phrases, and Latin and English sentences.
  steps:
  - - Vocabulary review
    - Go through the word lists in §§ 510 and 511 at the back of the book. Your child gives the meaning of each word; mark any that are slow.
  - - The gerund
    - 'English ''overcoming'' can be a noun: ''by overcoming the Gauls''. Latin uses the infinitive for the nominative, and the gerund for the other cases:

      ~ amandī, amandō, amandum, amandō

      ~ The Gerund is a verbal noun and is used only in the genitive, dative, accusative, and ablative singular.'
  - - The gerundive
    - 'The gerundive is the future passive participle (amandus, -a, -um), used as an adjective with a noun. Instead of ''for the sake of seeking peace'' with the gerund plus object, Latin usually says ''for the sake of peace to be sought'': ad pācem petendam. The meaning in English is the same.'
  - - Purpose with ad and causā
    - 'Purpose can also be shown by ad with the accusative of the gerund or gerundive, or by the genitive with causā placed after it: audiendī causā, for the sake of hearing.'
  - - Belonging to
    - 'The predicate genitive: ''it belongs to the general to lead'' is Latin ''it is of the general''. Also learn the set phrases: novīs rēbus studēre, to be eager for a revolution; reī mīlitāris perītissimus, very skillful in the art of war.'
  - - Latin to English
    - 'Translate the Latin sentences. Two of them:

      ~ Lēgātī nōn sōlum audiendī causā sed etiam dīcendī causā vēnērunt.

      ~ Spatium neque arma capiendī neque auxilī petendī datum est.'
  - - English to Latin and wrap-up
    - Write the English sentences. Memorize the gerund forms and the rules in §§ 406 and 407.
  practice: 'Two days: vocabulary review and forms, then the exercises. The teacher notes say to work at gerund versus gerundive until your child can tell them apart at a glance.'
  answers: '1. Caesar, when he was waging war in Gaul, especially favored the soldiers of the tenth legion, because they were very skillful in the art of war.

    2. He gave the allies the task of looking after the grain supply.

    3. The envoys came not only for the sake of hearing but also for the sake of speaking.

    4. The general ordered the scouts to find a place suitable for fortifying.

    5. Recently these tribes were eager for revolution; soon I shall persuade them to surrender themselves and all their possessions to Caesar.

    6. To command belongs to the queen, and to obey belongs to the multitude.

    7. After this battle was fought, some of the enemy came to seek peace.

    8. There were some who were unwilling to hand over their arms.

    9. The enemy advanced so quickly that no time was given for throwing javelins at the enemy.

    10. Time was given neither for taking up arms nor for seeking help.'
