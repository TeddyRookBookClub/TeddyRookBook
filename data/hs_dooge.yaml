    1. The story of Andromeda has been told.

    2. Many stories have been told by the teacher.

    3. The field had been plowed by the strong farmer.

    4. The fields had been plowed by the strong farmers.

    5. The gold will have been carried to his home by the faithless slave.

    6. Our arms have been praised by the lieutenant. Who has praised your arms?

    7. We (women) have been invited to dinner by your maid.

    8. Andromeda was not given to the monster, because the monster had been killed by Perseus.'
