      ~ Duo ex meīs frātribus eundem rūmōrem audīvērunt.'
  - - English to Latin and wrap-up
    - Write the five English sentences. Then count to twenty in Latin together. Memorize the numbers and the new words.
  practice: Count to twenty in Latin every day this week, for example while setting the table.
  answers: 'The book''s numbering for these sentences was not clear in our copy, so they are listed in order.

    Caesar burned the greatest part of the buildings.

    A great part of the fortification was destroyed by the water of the river.

    The Gauls of this region had collected five thousand men.

    Two of my brothers heard the same rumor.

    Who of the Romans was more famous than Caesar?

    Five cohorts from that legion were defending the camp as bravely as possible.

    This place was the same distance from Caesar''s camp and from the camp of the Germans.

    As soon as Caesar arrived, he demanded more provisions from the allies.

    Had not the traders learned the size of the island? They had learned its length but not its width.

    A few of the enemy were holding the hill which our scouts saw.'
