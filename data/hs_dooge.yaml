  tip: Write a direct sentence and its indirect form side by side on paper, as the book's teacher notes suggest. Seeing them together makes the pattern clear.
  answers: '1. He goes, we go, go! (plural), to go.

    2. To one going, to have gone, they will go, they go.

    3. Of going, that they may go, you (plural) will go, you go.

    4. That they might not go, go!, they were going, he had gone.

    5. Caesar learned through scouts that the Gauls had crossed the river.

    6. The Romans heard that the Helvetii would go out from their territory at the beginning of summer.

    7. The envoys answered that no one before Caesar had visited that island.

    8. The chiefs of the Gauls say that they will enter upon no plan against Caesar''s authority.

    9. We think that the power of the queen is greater than that of the citizens.

    10. The Romans say that they will not take liberty away from the Gauls.

    11. When these things were learned, we perceived that the envoys had not come to seek peace.

    12. The Helvetii know that the Romans remember their former victories.

    13. The allies, since they saw that many were being wounded, decided to return to their own territory.

    14. Someone announced that Marcus had been elected consul.'
