# Formula colors: the site-wide palette for color-coded formulas (docs/formula-colors.md).
# In TeX write \role{velocity}{v} (or \role[initial velocity]{velocity}{v_0} to name that part more exactly).
# Each role: label (the plain name shown in the key and on hover), light and dark text colors, and its hue family.
#
# The colors are based on the Okabe-Ito palette (Okabe and Ito, "Color Universal Design", 2008), darkened for light
# pages and lightened for dark ones so every color has a contrast of at least 4.5:1 on the page and on the lesson boxes.
# Eight hue families are shared by all the roles. Roles that often meet in one formula (x, v, a, t; F, m, a; V, I, R;
# v, f, lambda) get families that stay apart for red-green color blindness too (checked with the Machado 2009 model).
# Color is never the only cue: the key under the formula names every part, and hovering or focusing a part shows its name.
#
# After editing, run  node scripts/math/check-roles.js --write  to copy the palette into static/math/core/tex.js.
#
# families (light / dark):
#   blue    #0068B0 / #4FAAE6     navy    #2A2F85 / #CFCBFF     green   #00785A / #2FBF8E
#   verm    #B84A00 / #FF8040     amber   #6B4500 / #F5D27A     purple  #A43F82 / #F29ACD
#   wine    #7A1E3A / #FFC2D1     gray    #59635D / #B0BDB5

