# The Science Lab: simulations and explorers, shown on /science-lab/ (Education).
# topic: physics, chemistry, astronomy or biology (an item can list more than one); kind: activity (with missions), explorer, or unit (a multi-chapter deep dive).
- url: /science-lab/magnetic-bottles/
  icon: "🧲"
  title: Magnetic Bottles for Fusion
  topic: [physics]
  kind: explorer
  text: "Turn, slice and mirror-test two exact 3-D magnetic bottles for fusion from a new 2026 paper, and see why the field lines must twist."
- url: /science-lab/newtons-laws/
  icon: "🍎"
  title: "Newton’s Laws of Motion"
  topic: [physics]
  kind: unit
  text: "A six-chapter unit: Galileo’s ramps, F = ma with live graphs, skaters pushing apart, ramps and pulleys, crashes and momentum, and the apple and the Moon."
- url: /science-lab/thermodynamics/
  icon: "🔥"
  title: "The Laws of Thermodynamics"
  topic: [physics, chemistry]
  kind: unit
  text: "A five-chapter unit: heat flowing between blocks, a piston on a P–V diagram, a gas run backward in time, Maxwell’s demon, Carnot’s engine and the road to absolute zero."
- url: /science-lab/book-cart/
  icon: "🛒"
  title: Book Cart
  topic: [physics]
  kind: activity
  text: "Swing a chain of 2 to 25 books up from a rolling cart and balance it, or stand every book dead straight: the inverted pendulum, with live forces and energy."
- url: /science-lab/orbits/
  icon: "🛰️"
  title: Orbit Lab
  topic: [physics, astronomy]
  kind: activity
  text: "Fire Newton's cannon until the ball falls all the way around the world, put satellites in orbit, fly to the Moon and slingshot past Venus, with real gravity and Kepler's laws."
- url: /science-lab/rocket/
  icon: "🚀"
  title: Rocket Builder
  topic: [physics]
  kind: activity
  text: "Build a rocket from engines, tanks and up to three stages, then fly it to space, to orbit or away from Earth, and see why orbit means going sideways fast."
- url: /science-lab/trebuchet/
  icon: "🏰"
  title: Trebuchet Workshop
  topic: [physics]
  kind: activity
  text: "Tune a counterweight trebuchet to hit a tower 100 to 300 meters away, follow the falling weight's energy, and see why air drag pulls the best angle below 45°."
- url: /science-lab/pendulums/
  icon: "🕰️"
  title: Pendulums and Resonance
  topic: [physics]
  kind: activity
  text: "Fifteen pendulums that fall out of step and line up again, two that pass a swing back and forth, and a swing that small, well-timed pushes send high."
- url: /science-lab/circuits/
  icon: "💡"
  title: Circuit Builder
  topic: [physics]
  kind: activity
  text: "Wire batteries, bulbs, switches, resistors and an LED on a breadboard and watch the current flow. Series and parallel, Ohm's law with real meters, and why an LED needs a resistor."
- url: /science-lab/optics/
  icon: "🌈"
  title: Optics Bench
  topic: [physics]
  kind: activity
  text: "Bend, bounce and focus light with lasers, mirrors, lenses and prisms, trap it in a glass rod, and find the rainbow's 42° angle in a raindrop."
- url: /science-lab/gas/
  icon: "🫧"
  title: Gas in a Box
  topic: [chemistry, physics]
  kind: activity
  text: "Squeeze a box of helium and argon atoms with a piston, heat the walls and pull out the divider: temperature is motion, pressure is collisions, and a bike pump gets warm."
- url: /science-lab/chem-lab/
  icon: "⚗️"
  title: Mixing Lab
  topic: [chemistry]
  kind: activity
  text: "Test kitchen liquids with four indicators, neutralize an acid, titrate drop by drop and speed up a reaction, on a bench where nothing can spill."
- url: /science-lab/atom/
  icon: "⚛️"
  title: Build an Atom
  topic: [chemistry, physics]
  kind: activity
  text: "Build atoms from protons, neutrons and electrons, make ions and isotopes, then watch radioactive nuclei decay and carbon-date a mystery sample."
- url: /science-lab/night-sky/
  icon: "🪐"
  title: Sky and Solar System
  topic: [astronomy]
  kind: activity
  text: "Set any date from 1800 to 2050 and see where the planets were, watch Mars loop backwards, run the Moon through its phases and find the eclipse seasons."
- url: /science-lab/ecosystem/
  icon: "🐇"
  title: Predators and Prey
  topic: [biology]
  kind: activity
  text: "Grass, rabbits and foxes rise and fall in turns. Overhunt, add a refuge, ride out a hard winter, and compare the field with the Lotka–Volterra equations."
