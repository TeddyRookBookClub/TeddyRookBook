book:
  id: mothertonguebook00arno_0
  title: 'The Mother Tongue, Book I: Lessons in Speaking, Reading and Writing English'
  year: '1900'
  key: mother-tongue
  short: The Mother Tongue, Book One
  eyebrow: Writing · Composition · 1900
  hero: 'Sarah Louise Arnold and George Lyman Kittredge''s 1900 book of 473 short numbered sections on speaking and writing English, for children about
    9 to 12 who can already read: sentences, capitals and punctuation, letters, stories, pictures and poems, and then the work which words do. 132 guides
    cover the whole book, with the right page of the scan beside each one.'
  how:
  - <b>Talk first, then write.</b> The book always has children say their thoughts aloud before they write. Every guide starts with reading and talk; the
    writing comes after.
  - <b>A little, often.</b> 20 to 35 minutes, three or four times a week. At four a week the 132 guides take about a school year; spreading them over two
    years is fine too. Guides marked optional are extra practice the book itself says can be skipped.
  - <b>Correct one or two things.</b> Each guide names the one or two things to check that day. Point to the line, let your child find and fix the mistake,
    and always name something done well. The short examples in the guides were written for this site, not taken from the book.
  - <b>One notebook, and poems by heart.</b> Keep all the writing in one dated notebook so your child can see the progress. The book has many short poems
    to learn; a minute or two a day is enough.
  - <b>An old book.</b> A few customs have changed since 1900 (addresses, "Ms.", some spellings), and the guides point them out. Some models in the book
    are printed in handwriting; read those straight from the page.
  unitword: Part
  lessonword: ''
  numnote: Each guide covers one or a few of the book's 473 numbered sections, shown beside the title.
units:
- id: 1
  name: Part First
  from: 1
  to: 72
  text: Sentences, capitals and punctuation, letters and envelopes, and stories, pictures and poems to talk about, retell and learn (Sections 1 to 253).
- id: 2
  name: Part Second
  from: 73
  to: 132
  text: 'The work which words do: subject and predicate, the eight parts of speech, modifiers and clauses, with more letters, pictures and poems (Sections
    254 to 473 and the Appendix).'
lessons:
- num: 1
  roman: Sec. 1
  idx: 12
  unit: 1
  title: Our mother tongue
  mins: 20
  goal: Your child can say what this book is for and writes a first short note, the way young Longfellow wrote to his father.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: 'Section 1, "To the Boys and Girls": a friendly talk about the English language we use all day, with the short letter Henry Wadsworth Longfellow
    wrote to his father as a boy (Portland, January, 1814).'
  steps:
  - - A minute without words
    - 'Try a little game: for one minute, neither of you may speak. Point, nod, wave. Then talk about it. What was hard? What did you want to say?

      Say: Today we start a book about something you use all day long, your own language. The book calls it our mother tongue.'
  - - Read the section together
    - 'Take turns reading Section 1 aloud, a paragraph each. It begins with things we use every day but have never studied, like air and bread.

      ~ One of the common things which serve you every day is the English language.'
  - - Talk it over
    - 'This book always talks before it writes. Ask, and let your child answer in whole sentences:

      - Do you know any words in another language? (The book gives German and French ones.)

      - Could you play tag or hide-and-seek without any words?

      - When someone is far away, how can you tell them your news?'
  - - Look at Longfellow's letter
    - 'Read the boy''s letter aloud. It is short and asks plainly for what he wants.

      ~ I wish you to buy me a drum.

      Ask: Where was he? When did he write? Whom did he write to? Show the place and date at the top and "Dear Papa" at the start.'
  - - Say it, then write it
    - 'Your child writes a short note of 3 to 5 sentences to someone in the family (real or pretend), telling one piece of news and asking for one thing,
      just as Longfellow did.

      First say the note aloud. Then write it, with the place and date at the top and "Dear ..." to begin.'
  - - Check it gently
    - 'Read the note aloud together. Look at only one thing today: does every sentence start with a capital letter and end with a period?

      Don''t mark the mistake yourself. Point to the line and say, "One sentence on this line needs a fix." Let your child find it and fix it. Then name
      one thing you liked.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      Dear Grandma,

      We planted beans in the garden today. Two have come up already. Will you send me your recipe for oatmeal cookies?

      Love, Sam

      It is short, it says one piece of news and asks one clear thing, and every sentence is complete.'
  practice: Copy the note neatly and give it to the person (or mail it). Start a notebook for this book and date every page.
  tip: The book is meant to be talked through, not just read. When in doubt, ask your child to say it aloud first.
- num: 2
  roman: Secs. 2–5
  idx: 17
  unit: 1
  title: What a sentence is
  mins: 25
  goal: Your child knows that a sentence tells one thought and writes several clear sentences about things they know.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  - An apple (or any fruit)
  book: 'Section 2, "The Story of a Lesson": Miss Brown holds up an apple and each child tells a thought about it; the book names these "sentences". Sections
    3 to 5 ask for thoughts, spoken and written, about honey, gold, animals, flowers, fruits and the child''s own family.'
  steps:
  - - Hold up an apple
    - 'Do what Miss Brown did. Hold up an apple.

      Say: Look at it. Think about it. Now tell me one thought about the apple.

      Take turns, three or four thoughts each. Every answer is one whole thought: "The apple is red."'
  - - Read the story
    - 'Read Section 2 together. Point out that Jamie, Kate, Mary, Joe and Frank each said something different about the same apple.

      ~ A Sentence tells or expresses one''s thought.'
  - - Talk it out first (Section 3)
    - 'Say one thought each about: honey, gold, pencils, horses, dogs, cats. Keep it quick, like a game.

      If your child says only a word ("Sticky!"), help them make it a sentence: "Honey is sticky."'
  - - Read the book's advice
    - 'Read the short note on page 9 together.

      ~ First know, then tell. Tell your own thoughts.

      Ask: Why should you only write about something you know?'
  - - Write (Sections 4 and 5)
    - 'Your child writes 6 to 8 sentences: three about a flower, tree or fruit they know well (Section 4), and three or four about home: a family member,
      the house, a pet, or their work (Section 5).

      Each sentence is one thought. Say each one aloud before writing it.'
  - - Check it gently
    - 'Read the sentences aloud together. Ask of each one: "Does it tell one whole thought?"

      If one is only a piece ("Big and green."), ask "What is big and green?" and let your child rewrite it. Fix just one or two today.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      Apples grow on trees. A ripe apple is crisp and sweet. My brother likes green apples best.

      My mother is a nurse. Our house has a red door. My cat sleeps on the windowsill.'
  practice: 'At meals this week, play "one thought": someone names a thing and everyone says one sentence about it.'
  tip: Don't worry about spelling today. The point is the whole thought.
- num: 3
  roman: Secs. 6–10
  idx: 20
  unit: 1
  title: Proverbs and the capital at the start
  mins: 30
  goal: Your child begins every written sentence with a capital letter and can explain a few old proverbs.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: Section 6 shows some proverbs in handwriting and gives the rule for a capital letter at the start of every sentence. Section 7 gives six printed
    proverbs to copy. Sections 8 to 10 ask for sentences about school, answers to questions about the child, and a description of a dog.
  steps:
  - - What is a proverb?
    - 'Read page 10 together. A proverb is an old saying that people kept because it was worth keeping.

      Ask: Do you know any sayings grown-ups use? ("Practice makes perfect" is one.)'
  - - Read the proverbs (Section 7)
    - 'Read the six proverbs together and talk about what each one means, one at a time.

      ~ A stitch in time saves nine.

      ~ Make hay while the sun shines.

      Let your child guess first. Then give a short meaning if needed (see Answers).'
  - - The rule
    - 'Look at the proverbs. Every one starts with a capital letter.

      ~ Every Sentence should begin with a Capital Letter.'
  - - Copy carefully
    - Your child copies the six proverbs from Section 7, slowly and neatly, with the capital at the start and the period at the end. Copying from a good
      model is how this book teaches.
  - - Write your own (choose one)
    - 'Pick one of the book''s three tasks:

      - Section 8: 5 to 7 sentences about where you do your lessons (the book says "your school").

      - Section 9: answer the six questions in whole sentences ("My name is ...").

      - Section 10: 5 sentences about a dog you know: his name, his color, what he can do, what he eats, how he is cared for.

      Talk through the answers aloud first.'
  - - Check it gently
    - 'Your child reads the sentences aloud. Then ask: "Does every sentence start with a capital?" Let them check each one with a finger and fix any that
      don''t.

      One more thing only, if you like: a period at the end of each.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      Our neighbor''s dog is named Biscuit. He is brown with one white ear. He can catch a ball in the air. He eats dog food and the crusts of our sandwiches.
      His owner walks him twice a day.'
  practice: Say one of the proverbs each day this week and ask your child to tell when it would fit.
  answers: 'Possible meanings (any sensible explanation is fine):

    A new broom sweeps clean: someone new to a job works hard and changes things at first.

    Still waters run deep: a quiet person may think and feel a great deal.

    It is never too late to mend: you can always change and do better.

    Straws show which way the wind blows: small signs show what is going on.

    Make hay while the sun shines: use a good chance while you have it.

    A stitch in time saves nine: fix a small problem now and you avoid a bigger one later.'
- num: 4
  roman: Secs. 11–12
  idx: 23
  unit: 1
  title: Hiawatha by heart, and writing names
  mins: 25
  goal: Your child learns the opening lines of a Hiawatha passage by heart and always writes names of people with capital letters.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: 'Section 11 is a passage from Longfellow''s "Song of Hiawatha" to learn by heart: little Hiawatha listening at the door on summer evenings, the
    firefly, and the rainbow. Section 12 shows names in handwriting and gives the rule for capitals in names.'
  steps:
  - - Read the poem aloud
    - 'Read the Hiawatha passage aloud to your child, slowly, enjoying the sounds. Then read it again together.

      ~ At the door on summer evenings

      ~ Sat the little Hiawatha;

      Nokomis is Hiawatha''s grandmother in the poem. Wah-wah-taysee is the firefly.'
  - - Talk about it
    - 'Ask:

      - What did Hiawatha hear? What did he see?

      - What did he ask Nokomis about the rainbow, and what did she say it was?

      - Which line do you like the sound of best?'
  - - Learn the first lines
    - Learn the first seven lines (to "Flitting through the dusk of evening") by heart today. Say them line by line, then two lines at a time, then all
      together. The rest can come over the week.
  - - Names of persons (Section 12)
    - 'Look at the handwritten names on page 14. The book asks: with what kind of letter does each name begin?

      ~ Names of Persons begin with a Capital Letter.'
  - - Write names
    - 'Your child writes:

      - their own full name

      - three people in the family or their class

      - three other people they know

      - three people they have read about

      That is ten names, each on its own line.'
  - - Check it gently
    - 'Your child checks each name with a finger: a capital at the start of every part of the name? Fix any that are missing. Spelling of a hard name can
      be looked up together.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      Maria Elena Ortiz

      Grandpa Joe Ortiz

      Benjamin Franklin

      Every part of every name begins with a capital.'
  practice: Add a few lines of the Hiawatha passage each day until your child can say it all. Then ask them to write the first seven lines from memory.
  tip: Learning poems by heart was a big part of this book. A minute or two a day is enough.
- num: 5
  roman: Secs. 13–17
  idx: 26
  unit: 1
  title: Family names and initials
  mins: 25
  goal: Your child knows where many family names came from and writes initials as capitals followed by periods.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: Section 13 explains how family names began (Thomas the Baker, John at the Wood, Peterson for the son of Peter) and lists names to puzzle out. Sections
    14 and 15 ask for written names; Section 16 explains initials, with names to shorten; Section 17 gives more practice.
  steps:
  - - Read about family names
    - 'Read Section 13 together.

      ~ Every family name once meant something.

      Ask: What is our family name? Do we know what it once meant?'
  - - Puzzle out the list
    - Look at the list of names on page 16 (Smith, Baker, Fuller, Weaver, Thomson ...). Guess together what each one first meant. The Answers give help.
      Some names are jobs, some are places, some mean "son of".
  - - Talk about initials
    - 'Read Section 16. G. A. Peabody is short for George Alfred Peabody.

      ~ When the initial stands alone, it is always a capital letter, and is always followed by a period.'
  - - Write
    - 'Your child:

      - writes the eight names on page 18 with initials for all but the family name

      - writes their own name with initials (Section 17)

      - answers three of the Section 14 questions in whole sentences ("My father''s name is ...")'
  - - Check it gently
    - 'Check just one thing: every initial is a capital with a period right after it. Your child finds and fixes any slip.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      J. J. Curtis

      M. L. Smith

      My name is Thomas Reed Hall. I can write it T. R. Hall.'
  practice: Make a list of family names among friends and neighbors and guess what they once meant.
  answers: 'Initials (Section 16): J. J. Curtis; W. W. Noyes; C. S. Sprague; A. A. Abbott; M. L. Smith; J. E. Perry; E. E. Eaton; C. L. Burnham.

    Name meanings (likely first meanings): Smith, a metal worker; Baker, one who bakes bread; Fuller, one who cleaned and thickened cloth; Weaver, one who
    weaves cloth; Thomson, son of Thomas; Carpenter, a woodworker; Mason, one who builds with stone; Miller, one who runs a mill; Cook, a cook; Ferguson,
    son of Fergus; Brooks, one who lived by a brook; Wiseman, a wise man; Stevenson, son of Steven; Wilson, son of Will; Brown, probably for brown hair,
    skin or clothes.'
- num: 6
  roman: Secs. 18–20
  idx: 30
  unit: 1
  title: Days of the week, and A Night with a Wolf
  mins: 25
  goal: Your child capitalizes the days of the week and can tell the story of Bayard Taylor's poem in their own words.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: Section 18 shows a handwritten verse with the days of the week, and the rule for capitals. Section 19 asks for one sentence about each day of last
    week. Section 20 is Bayard Taylor's poem "A Night with a Wolf", in which a father tells his child how he and a wolf sheltered together in a storm.
  steps:
  - - The days (Section 18)
    - 'Say the days of the week together. Look at the handwritten verse on page 19 and read it with your child.

      ~ The names of the days of the week always begin with Capital Letters.'
  - - One sentence a day (Section 19)
    - 'Your child writes seven sentences, one for each day of last week, each telling one thing they did. Talk through the week aloud first: "What did we
      do on Monday?"'
  - - Read the poem
    - 'Read "A Night with a Wolf" aloud to your child. It is a father talking to his little one on a stormy night.

      ~ Something rustled, two green eyes shone,

      ~ And a wolf lay down beside me.'
  - - Tell it back
    - 'The book says: read the poem over until you can tell the story in your own words without the book. Close the book and ask your child to tell it.
      Prompts:

      - Where was the father, and what was the weather?

      - Where did he hide?

      - Who came, and what did they do all night?

      - Why is the father glad to be home now?'
  - - Check the sentences
    - 'Look at the seven sentences together. Check one thing: each day''s name has a capital. Your child fixes any that don''t.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      On Monday I helped wash the car.

      On Tuesday we went to the library.

      On Wednesday I finished my puzzle.'
  practice: Each evening this week, write one sentence about the day, beginning with its name.
  tip: A wolf lying down beside a man is the poet's story. If your child asks, real wild animals should always be left alone.
- num: 7
  roman: Sec. 21
  idx: 33
  unit: 1
  title: Punctuation is a custom
  mins: 25
  goal: Your child understands why we use punctuation marks and capitals, and adds them to an unpunctuated paragraph.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: Section 21 explains that punctuation marks and capitals are customs that make writing easy to read. It prints "The Fox and the Grapes" with no punctuation
    and no capitals, and sends the reader to page 83 to see it written properly.
  steps:
  - - Talk about customs
    - 'Read the first paragraph of Section 21 together.

      ~ Custom is the way in which a thing is usually done.

      Ask your child to name customs: saying "thank you", shaking hands, where the stamp goes on an envelope. Then: what customs do we have for writing?'
  - - Read the rest
    - Read on together to the paragraph about the fox. The book says a person who leaves out the marks makes it hard for others to understand.
  - - Try the jumbled fox story
    - Ask your child to read the fox paragraph aloud, just as it is printed, with no marks. It is hard! Talk about why.
  - - Fix it
    - Your child copies the fox paragraph, adding capital letters and periods where sentences start and end, a question mark for the fox's question, and
      capitals for "I". Work sentence by sentence, reading aloud to hear where each thought ends.
  - - Compare with the book
    - 'Turn to page 83 and compare. Your child marks with a check every place they got right. Where theirs differs, ask: "Which is easier to read?" There
      may be small differences in commas; that is fine at this stage.'
  - - What a good result looks like
    - 'The start of your child''s corrected paragraph should look much like page 83:

      ~ A fox went out to walk early in the morning, one fine day in summer. By the side of the road he saw a tree.

      For the talk about customs, a good spoken or written answer looks like this.

      Example (written for this guide, not from the book):

      It is our custom to take off our boots at the door. It is customary to say "Excuse me" when you pass in front of someone.'
  answers: 'The book''s punctuated version is on page 83. The main things to find: a capital and period for each sentence ("A fox went out ... in summer."
    "By the side of the road he saw a tree." "Beside the tree grew a beautiful vine ..." "The fox saw the purple grapes ..." "He jumped and jumped ..."),
    capital I, a question mark after "What do you think I care", and capitals for "The Fox and the Grapes" in the title. Page 83 also has commas and quotation
    marks, which come later in the book.'
- num: 8
  roman: Secs. 22–25
  idx: 35
  unit: 1
  title: Asking questions
  mins: 25
  goal: Your child ends every written question with a question mark, called the interrogation point.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: 'Sections 22 to 25: questions about the fox and the grapes show the question mark; the Game of Questions (guess the object with yes-or-no questions)
    is played aloud and then in writing; the child writes questions about everyday things.'
  steps:
  - - Read the questions
    - 'Read Section 22 together. All the sentences on page 25 are questions about the fox story.

      ~ Do foxes like grapes?

      Ask: What mark is at the end of each one? What does it tell you?'
  - - A little ear
    - 'Read the last lines of Section 22 together and make a big, clear question mark in the air and on paper.

      ~ Some one has said that the question mark looks like a little ear.'
  - - Play the Game of Questions aloud
    - One of you thinks of an object in the room. The other asks only yes-or-no questions to guess it. Play two or three rounds. (The book's example ends
      with guessing the crayon.)
  - - Play it in writing (Section 24)
    - 'Now play again, but your child writes each question instead of saying it, with a question mark every time. You answer aloud.

      The book says to use the mark''s true name: interrogation point.'
  - - Write questions (Section 25)
    - 'Your child writes 6 to 8 questions about things from the book''s list: pencil, desk, book, weather, recess, vacation, baseball, marbles, dolls, kites.
      Then you answer some of them aloud.'
  - - Check it gently
    - Your child reads each question aloud. Does the voice rise at the end? Is there an interrogation point? Fix any missing ones. Check that each question
      starts with a capital.
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      Is it going to rain this afternoon?

      Who made the first kite?

      Why does my pencil need sharpening so often?'
  practice: Play the Game of Questions on a car ride or walk, out loud.
- num: 9
  roman: Secs. 26–27
  idx: 39
  unit: 1
  title: 'The Wonderful Cradle: telling a story and writing statements'
  mins: 25
  goal: Your child retells a short story in order and writes statements that end with periods.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: 'Section 26, "The Wonderful Cradle": a caterpillar on a grapevine spins a silk cradle, sleeps all winter, and comes out a butterfly in May. Section
    27 asks for a fact about each of twelve words from the story and names the kind of sentence that tells a fact: a statement.'
  steps:
  - - Read the story
    - 'Read "The Wonderful Cradle" aloud together.

      ~ Soon there was no caterpillar to be seen, — nothing but this curious silken cradle.'
  - - Tell it back
    - 'The book says: close your book and tell the story, everything in its proper order, so well that your hearers are interested. Prompts if needed:

      - What did the caterpillar eat?

      - What did he do after a very large dinner?

      - What happened to the cradle all winter?

      - What came out in May?'
  - - What we know now
    - 'A small note: caterpillars that become moths spin silk cocoons. Butterfly caterpillars usually make a hard case called a chrysalis instead, held
      on by a little silk. The story calls the case a silk cradle, which is close enough for a story.'
  - - Write statements
    - 'Your child writes one true fact about each of six or more words from the list in Section 27 (caterpillar, silk thread, green leaves, May sunshine,
      grapevine, cranny, silken cradle, velvety wings, bitter winds, butterfly).

      ~ Every written Statement should end with a Period.'
  - - Check it gently
    - Read the statements aloud together. Is each one a true fact? Does each end with a period? Your child fixes one or two at most.
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      A caterpillar eats green leaves.

      The bitter winds of winter did not rock the cradle.

      The butterfly had soft, velvety wings.'
  practice: Your child tells the story of the Wonderful Cradle to someone else in the family.
  tip: If you can, look for a caterpillar or a chrysalis outdoors. Look, don't take it home.
- num: 10
  roman: Secs. 28–29
  idx: 41
  unit: 1
  title: Describe it, and let them guess
  mins: 25
  goal: Your child writes a clear description of an object at home without naming it, so others can guess.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  book: Section 28 is a short description in handwriting, to copy; it ends by asking the reader what the object is. Section 29 asks the child to write a
    description of something at home, read it to the class, and let someone guess.
  steps:
  - - Read the model
    - 'Read the handwritten description on page 30 with your child (help with the handwriting). It describes something without naming it and ends with a
      question.

      Ask: What do you think it is? Which words helped you guess?'
  - - Copy it
    - Your child copies the description neatly, keeping its capitals and periods.
  - - Choose and talk
    - 'Your child secretly picks something at home: a lamp, a teapot, a pair of boots. Talk about it aloud first (you can''t peek at the object''s name):
      What is it made of? What shape and color? Where is it kept? What is it used for?'
  - - Write the description
    - 'Your child writes 4 to 6 sentences about it, without the name, and ends with "What is it?"

      The book''s advice:

      ~ Write plainly and describe clearly.'
  - - Guess and check
    - 'Your child reads the description aloud and you guess. If you can''t guess, ask what detail would help, and let them add one sentence.

      Then check just one thing: a capital at the start of each sentence and a period (or question mark) at the end.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      It is made of clay. It is round and has a handle and a spout. It sits on the kitchen counter. We pour tea from it on cold afternoons. What is it?'
  practice: Leave a describe-and-guess riddle for someone in the family each day this week.
- num: 11
  roman: Sec. 30, I–VII
  idx: 42
  unit: 1
  title: Gemila, the Child of the Desert (part 1)
  mins: 35
  goal: Your child can tell how Gemila's family lives in a tent in the desert and how they pack up to move.
  materials:
  - The book, open to this lesson
  - Paper and pencil (a notebook kept just for this book works well)
  - A globe or a free online map
  book: 'Section 30 is a long story by Jane Andrews about Gemila, a little girl in a desert family who live in a tent and travel with camels. Parts I to
    VII: evening outside the tent, what the tent is like, supper, the night under the stars, and packing the camels to move to a new spring.'
  steps:
  - - Set the scene
    - 'On a globe or map, find the great deserts of North Africa and Arabia.

      Say: This story is about a girl named Gemila whose family lives in a tent and moves across the desert with their camels.'
  - - A word about the story
    - The story was written long ago for American children, and the author sometimes compares Gemila's family with "us". She says we could teach them table
      manners, but they could teach us to be kind and polite to strangers. You may want to talk about how different families have different customs.
  - - Read parts I to VII
    - 'Read aloud together, taking turns. It begins:

      ~ It is almost sunset; and Abdel Hassan has come out to the door of his tent to enjoy the breeze,

      Stop after each part and ask, "What did we learn?"'
  - - Tell it back
    - 'Close the book. Your child tells what they remember. Prompts:

      - What is the tent made of, and how is it held down?

