      ~ The winds roared and the lightning flashed.'
  - - Three kinds (Section 468)
    - 'Read the three apple-tree sentences and the book''s explanation.

      ~ A sentence which contains a Dependent Clause is a Complex Sentence.

      ~ A sentence which contains two or more Independent Clauses is a Compound Sentence.

      Test: read each clause alone. Does it make sense by itself? If not, it is dependent.'
  - - Classify (Section 469)
    - Go through the fifteen sentences aloud. For each, your child says simple, complex or compound, and why.
  - - Separate the clauses (Section 470)
    - Your child writes four of the complex or compound sentences, drawing a line between the clauses.
  - - Make your own
    - Your child writes two complex sentences and two compound sentences, like the book's examples.
  - - Check it gently
    - 'Compare with the Answers. For any mistake, read each clause alone and ask: does it stand on its own?'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

