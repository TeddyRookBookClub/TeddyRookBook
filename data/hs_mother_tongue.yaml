  - - Read the list (Section 81)
    - 'Read the list of contractions together. Note: the book prints some with a space (does n''t, is n''t). That was the custom then; today we write doesn''t
      and isn''t. "Sha''n''t" is written shan''t today.'
  - - Write sentences
    - 'Your child writes 6 to 10 sentences using contractions. Then reads each aloud twice: once with the contraction, once with the full form.'
  - - Watch your speech (Section 82)
    - Read the end of Section 82. The book says to avoid "ain't", and not to say "he don't" when "he doesn't" is meant.
  - - Check it gently
