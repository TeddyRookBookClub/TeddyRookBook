      ~ And said, "O mists, make room for me."'
  - - Follow the wind
    - 'Your child tells, stanza by stanza, where the wind went and what it said to each: the mists, the ships, the land, the forest, the bird, the rooster,
      the corn, the bell, the churchyard.'
  - - Talk about the ending
    - 'Ask: Why does the wind say "Not yet! in quiet lie" to the churchyard? (Those resting there are not to be wakened yet.) Talk about it as gently as
      your child needs.'
  - - Notice personification
    - The wind talks and acts like a person. Your child finds two more things in the poem that are spoken to as persons.
  - - Learn and write (Section 458)
    - Learn the first three stanzas today. When the poem is learned, your child writes it from memory.
  - - Check it gently
    - 'Compare with the book: capitals at the start of lines, quotation marks around each thing the wind says, capital O. Your child fixes their own slips.'
  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      A copy written from memory with a capital at the start of every line, a new pair of quotation marks for each thing the wind says, and the capital
      O in "O mists" and "O bird".

      Your child can add one more stanza of their own in the same pattern:

      It rattled at the schoolhouse door,

      And said, "Wake up, and sleep no more."'
