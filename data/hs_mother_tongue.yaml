  - - What a good result looks like
    - 'Example (written for this guide, not from the book):

      We''re going to the lake tomorrow. (We are going to the lake tomorrow.)

      I can''t find my other shoe. (I cannot find my other shoe.)

      It''s raining again. (It is raining again.)'
  answers: 'Section 80: I''ll = I will; can''t = cannot; don''t = do not.

    Section 82: I''m = I am; o'' = of; man''s = man is; Ne''er = never; E''en = even; there''s = there is.'
