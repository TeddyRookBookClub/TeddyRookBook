  practice: 'Section 77: write a note asking a friend to spend a week with you, and address it properly.'
  answers: 'Section 76, possible meanings:

    1. If March starts gentle, it may end stormy (and the other way round).

    2. Windy March and rainy April help the crops grow, so May is lovely.

    3. Sometime in March, at the start or the end, there will be wild weather.

    4. Same as 2.

    5. If March is warm and showery like April, April will be cold and blustery like March.

    6. Damp, warm weather in March is bad for farmers (it starts growth too early).

    7. Dry March, wet April and cool May make a good harvest.

    8. A dry, dusty March is very valuable to farmers.'
