# Logic Ladder courses, bottom rung to top rung (the order of this list is the ladder).
# Contract: /tmp/briefs/ladders_spec.md and /tmp/briefs/mathladder_spec.md section 3; brief /tmp/briefs/logic_design.md.
# Skill maps live in data/logic/topics/<key>.json. Design notes: /tmp/work_logic/overview.md.
# Symbolic Logic overlaps Discrete Math's logic unit (data/math/topics/disc.json); it links those pages but does not need them.
- key: informal
  slug: informal-logic
  title: "Informal Logic"
  short: "Informal Logic"
  band: "Middle school"
  grade: "7–9"
  icon: "💬"
  color: "#b45f17"
  blurb: "Arguments in everyday words: premises and conclusions, deductive and inductive reasoning, validity and soundness, definitions, and the common fallacies, so you can weigh the reasons you hear."
  after: []
- key: trad
  slug: traditional-logic
  title: "Traditional Logic"
  short: "Traditional Logic"
  band: "High school"
  grade: "8–10"
  icon: "🏛️"
  color: "#9b2335"
  blurb: "The logic of Aristotle and the classical schools: terms, the four categorical propositions, the square of opposition, immediate inference, syllogisms tested by rules and Venn diagrams, and hypothetical and disjunctive reasoning."
  after: [informal]
- key: sym
  slug: symbolic-logic
  title: "Symbolic Logic"
  short: "Symbolic Logic"
  band: "High school"
  grade: "11–12"
  icon: "🔣"
  color: "#3d4a9c"
  blurb: "Logic in symbols: translation, truth tables, natural deduction with conditional and indirect proof, then predicate logic with quantifiers, relations and identity, ending with a first look at soundness and completeness."
  after: [trad]
