# "Find what's for you" (/start/): the data behind the recommendations.
# Edit freely to tune it. Each section gets points for every answer it matches; the best 6 to 10 are shown.
#
# Section fields
#   key      short id, unique
#   name     the card title
#   icon     one emoji
#   url      the section's main page
#   ages     [youngest, oldest] it suits (99 = any adult). Sections outside every chosen age are left out.
#   for      who it suits: self, child, class (leave out for everyone)
#   goals    homeschool, subject, testprep, lifeskills, greatbooks, fun, business
#   subjects keys from the subjects list below
#   mins     the shortest useful sitting, in minutes (a little lower in the list if it needs more time than chosen)
#   weight   0 to 3: a nudge up for the best starting places
#   planner  true when the lesson planner can schedule it (shows "make a plan with this")
#   why      one short sentence for the card
#   start    the first page to open, by age: the first row whose "to" is at or above the youngest chosen age wins
#   words    search words: the site search (layouts/index.json) puts this page first for these words
# Every url must be a page on the site; the build warns about any that isn't.

who:
  - {key: self, label: "Myself"}
  - {key: child, label: "My child or children"}
  - {key: class, label: "A class or co-op"}

ages:
  - {key: "3-5", label: "3 to 5", min: 3, max: 5}
  - {key: "6-8", label: "6 to 8", min: 6, max: 8}
  - {key: "9-11", label: "9 to 11", min: 9, max: 11}
  - {key: "12-14", label: "12 to 14", min: 12, max: 14}
  - {key: "15-18", label: "15 to 18", min: 15, max: 18}
  - {key: "adult", label: "Adult", min: 19, max: 99}

goals:
  - {key: homeschool, label: "A full homeschool"}
  - {key: subject, label: "One subject"}
  - {key: testprep, label: "Test prep"}
  - {key: lifeskills, label: "Life skills"}
  - {key: greatbooks, label: "Reading the great books"}
  - {key: fun, label: "Fun and games"}
  - {key: business, label: "Business and markets"}

subjects:
