# The Culinary Ladder's "Teach Yourself to Cook Like a Professional" guide (/culinary/teach-yourself/,
# content/culinary/teach-yourself.md, layouts/math/cuguide.html). Our own words. Course links are /culinary/<course slug>/.
# Career facts: BLS Occupational Outlook Handbook, Chefs and Head Cooks (page modified August 27, 2026).
intro:
  - "Professional cooks mostly learn on the job: years on a line, beside people who correct them a hundred times a night. The U.S. Bureau of Labor Statistics says most chefs and head cooks learn their skills through work experience, typically five years or more. Nothing on a website can replace that."
  - "What a website can do is teach you what kitchens expect you to already know, so that you learn faster when you get there, or so that you can cook at that level at home. This ladder covers the same ground culinary programs and kitchens cover: tools, knife work, food safety, methods, sauces, butchery, pastry, the cold kitchen, flavor, plating, service and the business of a kitchen. This page is how to use it."
honest:
  - { h: "What you can learn at home", t: "Knife cuts, every cooking method, the mother sauces, baking by weight, butchering a chicken, filleting a fish, plating, costing, food-safety rules and the language of the kitchen. With practice and honest notes, you can cook a tasting menu at home that you are proud of." }
  - { h: "What home study can't give you", t: "Speed under pressure, cooking two hundred covers in a night, working in a team that moves as one, a chef tasting your food and telling you why it's wrong, and the stamina for ten-hour shifts on your feet. Those come only from real kitchens." }
  - { h: "How to close the gap", t: "Cook for other people often and ask for honest notes. Time yourself. Stage in a real kitchen for a day. Take a class at a community college or adult school. Earn a food handler card where your state requires one. Each one moves you closer to kitchen speed and standards." }
  - { h: "Safety comes first", t: "Learn the Food Safety course before you cook for anyone outside your family, and the fire rules in Deep-Frying before you heat a pot of oil. Sharp knives, dry towels and non-slip shoes prevent most kitchen injuries." }
phases:
  - weeks: "Months 1–2"
    title: "Tools, knives and safety"
    courses: [kitchen-foundations, knife-skills, food-safety-and-sanitation]
    practice: "15 minutes of knife work most days: two onions to a ¼-inch dice, a carrot to batonnet and small dice, a bunch of parsley minced. Measure ten pieces each time. Weigh every ingredient you use for a month."
    project: "Cook five family dinners with full mise en place, everything measured and set out before the stove goes on."
    check: "You can dice an onion evenly in under two minutes, and you can name the safe temperatures and the two-stage cooling rule without looking."
  - weeks: "Months 3–4"
    title: "Heat, stocks and sauces"
    courses: [heat-and-cooking-methods, stocks-sauces-and-soups]
    practice: "One method a week (sauté, braise, roast, poach, deep-fry with the fire rules) and one stock or sauce a week. Taste and write notes."
    project: "Make chicken stock, then velouté from it, then a small sauce from that; make béchamel and hollandaise from the Meal Prep classics."
    check: "Your stock sets as jelly when cold, and you can rescue a broken hollandaise."
  - weeks: "Months 5–6"
    title: "Proteins and vegetables"
    courses: [proteins, vegetables-grains-and-pasta]
    practice: "Break down a whole chicken every week (time yourself), fillet a whole fish twice a month, make three French omelets in a row each weekend, and fresh pasta twice a month."
    project: "A three-course dinner: a soup, a braised or roasted main with a pan sauce and glazed vegetables, and a simple dessert."
    check: "You break down a chicken into eight pieces in under ten minutes and pull meat at the right carryover temperature."
  - weeks: "Months 7–8"
    title: "Baking and pastry"
    courses: [baking-and-pastry]
    practice: "Bake every week by baker's percentages: a lean loaf, an enriched dough, pie dough, choux. Temper chocolate once a month."
    project: "A plated dessert with four parts: a pastry, a custard or cream, a sauce and something crisp."
    check: "You can convert any bread recipe into baker's percentages and scale it to any dough weight."
  - weeks: "Months 9–10"
    title: "The cold kitchen, flavor and menus"
    courses: [garde-manger-and-preservation, flavor-seasoning-and-menus]
    practice: "A board of cured meats and cheeses for guests; quick pickles each week; taste-and-adjust drills with a partner who seasons things wrong on purpose."
    project: "Write and cost a five-dish menu, balanced by method, color and station."
    check: "You can price a dish from its costed recipe and a food-cost target."
  - weeks: "Months 11–12"
    title: "Plating, service and the professional kitchen"
    courses: [plating-and-service, the-professional-kitchen]
    practice: "Plate four identical portions of every dinner. Learn the calls (\"behind\", \"hot\", \"heard\"). Write prep lists and par sheets for your own kitchen."
    project: "The capstone: a five-course tasting menu for four to six people, with a timeline that starts three days ahead."
    check: "Every course leaves your kitchen on time, hot food hot and cold food cold, and you wrote down what to fix next time."
stage:
  - "A <b>stage</b> (stahzh) is a short working visit in a restaurant kitchen. It is how cooks try out new places and how chefs try out cooks. Some are a single shift; some last weeks."
  - "<b>How to ask:</b> email or visit in the quiet afternoon hours, not during service. Say what you have been practicing and that you'd like to stage. Be flexible about days. Small, busy restaurants often say yes more than famous ones."
  - "<b>What to bring:</b> closed, non-slip shoes; long pants; a clean apron and towels if asked; a sharp chef's knife and paring knife in a guard; a notebook and pen. Ask beforehand what they want you to bring."
  - "<b>On the day:</b> arrive early, say \"yes, chef\" and \"heard\", call \"behind\" and \"hot\", ask before you do something new, clean as you go, and write things down on your break. You will probably pick herbs and peel shallots. That is the job, and they are watching how you do it."
  - "<b>Rules:</b> labor laws on unpaid work differ by place, and some kitchens only stage people they might hire. Ask how they handle it, and never work with knives or hot equipment you haven't been shown."
costs_note: "Rough U.S. prices in 2026; they vary a lot by store and season. No brands and no affiliate links: buy what feels good in your hand, from a store that lets you return it. Buying used (restaurant supply auctions, thrift stores) can cut these costs in half for pans and tools."
costs:
  - tier: "Starter"
    price: "about $100 to $175"
    items: "An 8-inch chef's knife, a paring knife and a serrated knife; a large plastic or wood cutting board; an instant-read thermometer; a digital kitchen scale (grams and ounces); a 10- or 12-inch stainless or carbon steel skillet; a 3-quart saucepan; two half sheet pans; a fine-mesh strainer; a box of towels."
  - tier: "Serious home cook"
    price: "about $300 to $550 more"
    items: "A combination whetstone (about 1,000 and 6,000 grit) and a honing rod; a cast-iron skillet; an enameled Dutch oven; an 8- to 12-quart stockpot; a mandoline with its hand guard; a cut-resistant glove; a hand or stand mixer; a probe thermometer for roasts; a bench scraper, fish spatula, spider and microplane; squeeze bottles and a few ring molds for plating."
  - tier: "Professional practice"
    price: "about $800 to $1,500 more"
    items: "A stand mixer with paddle, whisk and hook; a food processor; an immersion circulator; a high-powered blender; a boning knife and a long slicer; a heavy clad or copper saucier; a chinois; a candy thermometer; offset spatulas and a set of pastry tips; a knife roll."
week:
  intro: "A sample week for someone working through the ladder in about six to eight hours, alongside a job or school."
