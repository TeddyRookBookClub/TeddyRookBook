# Physics Ladder courses, bottom rung to top rung (the order of this list is the ladder).
# Contract: /tmp/briefs/ladders_spec.md section 2 (keys, slugs, titles) and /tmp/briefs/mathladder_spec.md section 3.
# Skill maps live in data/physics/topics/<key>.json. Astronomy is a side branch: it needs Physical Science and
# Algebra 1 (and Earth Science's sky topics), not Physics 2, so a learner can take it any time after Physical Science.
- key: sciexp
  slug: science-explorers
  title: "Science Explorers (ages 9–10)"
  short: "Science Explorers"
  band: "Elementary"
  grade: "4–5"
  icon: "🔬"
  color: "#0f7f8a"
  blurb: "For ages 9 and 10, grades 4 and 5: matter, forces and simple machines, energy, electricity and magnets, light and sound, weather and rocks, plants, animals and the human body, and the Sun, Moon and planets, with a hands-on activity at home in every lesson."
  after: []
- key: physsci
  slug: physical-science
  title: "Physical Science"
  short: "Physical Science"
  band: "High school"
  grade: "9"
  icon: "🧲"
  color: "#2a7f62"
  blurb: "For grades 8 and 9: motion and forces, energy, heat, waves and light, and electricity and magnetism, with simple numbers and lots of pictures."
  after: [g8]
- key: phys1
  slug: physics-1
  title: "Physics 1: Motion, Forces and Energy"
  short: "Physics 1"
  band: "High school"
  grade: "11"
  icon: "🍎"
  color: "#1f6fb2"
  blurb: "Algebra-based mechanics, the first half of AP Physics 1: motion in one and two dimensions, Newton's laws, energy, momentum, rotation and oscillations."
  after: [physsci, alg1, geo]
- key: phys2
  slug: physics-2
  title: "Physics 2: Fluids, Heat, Electricity, Light and Atoms"
  short: "Physics 2"
  band: "High school"
  grade: "12"
  icon: "💡"
  color: "#3b5bdb"
  blurb: "Algebra-based physics after Physics 1, matching AP Physics 2: fluids, thermodynamics, electric fields and circuits, magnetism, waves and optics, and the quantum and the nucleus."
  after: [phys1, alg2]
- key: astro
  slug: astronomy
  title: "Astronomy"
  short: "Astronomy"
  band: "High school"
  grade: "12"
  icon: "🔭"
  color: "#5b3fa8"
  blurb: "The sky, the Moon and the seasons, orbits, light and telescopes, the Sun, the planets, the lives of stars, galaxies and the expanding universe, with algebra only."
  after: [earthsci, physsci, alg1]
- key: mech
  slug: mechanics
  title: "Mechanics with Calculus"
  short: "Mechanics"
  band: "College"
  grade: "College"
  icon: "⚙️"
  color: "#b5462f"
  blurb: "Mechanics again, now with derivatives and integrals, as in AP Physics C: Mechanics and university physics I: variable forces, drag, work integrals, potential energy curves, rotation of solid bodies and orbits."
  after: [phys1, calc1]
- key: em
  slug: electricity-and-magnetism
  title: "Electricity and Magnetism"
  short: "E and M"
  band: "College"
  grade: "College"
  icon: "⚡"
  color: "#c08a1e"
  blurb: "Calculus-based electricity and magnetism, as in AP Physics C: E&M and university physics II: Gauss's law, potential, capacitors, circuits with time, Ampère's and Faraday's laws, AC circuits and Maxwell's equations."
  after: [mech, phys2, calc2]
- key: modern
  slug: waves-optics-modern-physics
  title: "Waves, Optics and Modern Physics"
  short: "Modern Physics"
  band: "College"
  grade: "College"
  icon: "⚛️"
  color: "#8a3fa0"
  blurb: "University physics III: waves with calculus, wave optics and instruments, special relativity, the quantum world, atoms, nuclei and particles."
  after: [em, calc2]
- key: astrophys
  slug: astrophysics
  title: "Astrophysics"
  short: "Astrophysics"
  band: "College"
  grade: "College"
  icon: "🌌"
  color: "#22306b"
  blurb: "The physics of the cosmos with calculus: magnitudes and spectra, binary stars and exoplanets, how stars shine and die, compact objects, galaxies, dark matter and cosmology."
  after: [astro, modern]
- key: exam
  slug: exam-challenge
  title: "Exam Challenge: Multi-Step Physics Problems"
  short: "Exam Challenge"
  band: "High school"
  grade: "12"
  icon: "🎯"
  color: "#8a5a14"
  blurb: "Hard, exam-style problems once you know Physics 1 and 2: each one a short scene with a moving diagram, then two to four linked questions that build on each other, from projectiles and loops to gas cycles, lenses, fields and atoms."
  after: [phys2]
  note: "The format, a short scene with a diagram followed by linked questions, is inspired by the physics paper of Japan's University Entrance Common Test. Every problem here is our own. To see how the real papers are solved, visit [Exam Practice](/physics/exam-practice/)."
- key: rocket
  slug: rocket-boys
  title: "Rocket Boys Math and Physics"
  short: "Rocket Boys"
  band: "High school"
  grade: "11"
  icon: "🚀"
  color: "#a4452c"
  blurb: "The math and physics a high schooler needs to work with rockets, as the Rocket Boys of Coalwood did after Sputnik: Newton's laws and thrust, the rocket equation, coasting to apogee, drag and stability, measuring height with a theodolite and the tangent, and orbits."
  after: [phys1]
  note: "Each lesson opens with a moment from the true story of Homer Hickam and the Rocket Boys of Coalwood, West Virginia. Read the story in [October Sky](/october-sky/). This course is about the math and physics only: it never describes propellants or how to make a motor. To fly real rockets, use commercially made, certified motors and follow the [National Association of Rocketry's Model Rocket Safety Code](https://nar.org/ModelRocketSafetyCode)."
