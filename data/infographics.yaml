  description: "A no-spoilers sheet to keep beside Tolstoy's novel: the two stories it tells side by side, who's who in five households, the seven people you'll follow, how Russian names work and how to say them, where you are in the eight parts, six things about Russia in the 1870s that the first readers already knew, and tips for not getting lost."
