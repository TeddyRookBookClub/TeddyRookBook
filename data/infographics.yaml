# Infographics gallery. Set show: false to hide one. Reorder lines to change the order.
# Optional: books: [slug, ...] links the infographic to books in content/books/ (file name without .md).
# Optional: pdf: "file.pdf" (put the file in static/pdfs/) adds a paper link beside the infographic.
# Images live in static/img/infographics/<file>.jpg and <file>-thumb.jpg
- file: syntax-trees-cows-and-sharks
  title: "How Syntax Trees Work: \"Cows Kill More People Than Sharks\""
  tags: [Language]
  description: "One sentence with two meanings, used to teach syntax trees: the labels (TP, NP, VP, CP), building a tree in four steps, and how the words left out after \"than\" make the joke. The two readings are drawn as trees, with more sentences that work the same way."
