    - 'Read Art. 185 and do exercise 2 together:

      ~ 2. Find the cube of 2a— 3b.

      Let m = 2a and n = 3b; (m − n)³ = m³ − 3m²n + 3mn² − n³ = 8a³ − 36a²b + 54ab² − 27b³.'
  - - Independent practice
    - Exercises 4 to 8 of Art. 184 and 3 to 5 of Art. 185. After working by hand, your student can confirm one on the site's calculator with expand((m+2*n)^4).
  - - Wrap-up
    - 'Ask: Without writing it, how many terms does (a + b)¹⁰ have? What is its second term? (11; 10a⁹b.)'
  answers: The book prints the answer after each exercise.
  tip: The book credits the theorem to Isaac Newton. Pascal's triangle (1; 1 1; 1 2 1; 1 3 3 1; ...) gives the same coefficients and is fun to build alongside.
