- roman: Arts. 220–225
  idx: 219
  unit: 8
  title: Arithmetical progression
  mins: 45
  goal: Your student finds any term and the sum of an arithmetical series, and inserts means between two numbers.
  materials: *id001
  book: Series and arithmetical progression defined; the rule for any term, the rule for the sum (shown by writing the series forward and backward), the general problem, inserting means, and many exercises. Answers are printed.
  steps:
  - - Warm-up
    - 'Ask: What comes next: 1, 3, 5, 7, ...? 30, 27, 24, ...? How do you know?'
  - - Definitions
    - 'Read Arts. 220 and 221.

      ~ An Arithmetical Progression is a series of quantities which increase or decrease, by a common difference.'
  - - Any term
    - 'Read Art. 222. The nth term is l = a + (n − 1)d.

      ~ 1. For an Increasing Series.—Multiply the common difference by the number of terms less one, and add the product to the first term.

      Example 1: first term 3, difference 5: the 8th term is 3 + 7 × 5 = 38.'
  - - The sum
    - 'Read Art. 223: write 3, 5, 7, 9, 11 forward and backward; each pair adds to 14; five pairs make 70, so the sum is 35.

      ~ Multiply half the sum of the two extremes by the number of terms.'
  - - Guided practice
    - '~ 7. a=30, and d=— 2 ; required the 8th term. Ans. 16.

      ~ 1. Find the sum of the natural series of numbers 1, 2, 3, 4, .... carried to 1000 terms. Ans. 500500.'
  - - Inserting means
    - 'Read Art. 225: five means between 3 and 15. With 7 terms, d = (15 − 3) ÷ 6 = 2: 3, 5, 7, 9, 11, 13, 15.'
  - - Independent practice
    - 'Art. 222 exercises 3 to 9, Art. 223 exercises 2 to 5, and Art. 225 exercises 2, 3, 5 and 8. (Exercise 3: a clock strikes 1092 times in a week.)'
  - - Wrap-up
    - Ask your student to find the sum of the first 100 odd numbers without adding them. (10000.)
  answers: The book prints the answer after each exercise.
  tip: Writing the series forward and backward, as Ray does, is worth doing with real numbers first. Once seen, the sum rule is never forgotten.
  num: 51
- roman: Arts. 226–230
  idx: 226
  unit: 8
  title: Geometrical progression
  mins: 45
  goal: Your student finds any term and the sum of a geometrical series, the sum of an infinite decreasing series, and a mean proportional.
  materials: *id001
  book: Geometrical progression defined; the rules for any term, the sum, and the sum of an infinite decreasing series; finding the ratio from the first and last terms; and exercises with printed answers.
  steps:
  - - Warm-up
    - 'Ask: What comes next: 1, 2, 4, 8, ...? 54, 18, 6, ...?'
  - - Definition
    - 'Read Art. 226.

      ~ A Geometrical Progression is a series of terms, each of which is derived from the preceding, by multiplying it by a constant quantity, termed the ratio.'
  - - Any term
    - 'Read Art. 227.

      ~ Multiply the first term by the ratio raised to a power, whose exponent is one less than the number of terms.

      Example 1: 4 × 3⁴ = 324. Your student does:

      ~ 2. Find the 6th term of the progression 2, 8, 32, etc. Ans. 2048.'
  - - The sum
    - 'Read Art. 228 and the clever subtraction that proves it.

      ~ Multiply the last term by the ratio, from the product subtract the first term, and divide the remainder by the ratio less one.

      Your student does exercise 2: 7 terms of 1, 2, 4, ... (127).'
  - - Infinite series
    - 'Read Art. 229.

      ~ Divide the first term by one minus the ratio.

      Work together:

      ~ 7. A body moves 10 ft. the first sec, 5 the next, 2 1/2 the next, and so on forever; how many ft. would it move over? Ans. 20.'
  - - Mean proportional
    - Read Art. 230. Between 4 and 16 the middle term is 8. Your student finds a mean proportional between 8 and 32 (16).
  - - Independent practice
    - Art. 227 exercises 3 to 7, Art. 228 exercises 3 and 6, Art. 229 exercises 2 and 3, and Art. 230 exercises 1 and 4. The site's calculator (/homeschool/calculator/) can check large powers like 4 × 3⁹ after the setup is done by hand.
  - - Wrap-up
    - 'Ask: Why does 10 + 5 + 2½ + ... never pass 20?'
  answers: The book prints the answer after each exercise.
  tip: 'Fold a sheet of paper in half again and again to show a decreasing geometric series: half, a quarter, an eighth, and the pieces never exceed the whole sheet.'
  num: 52
- roman: Arts. 231–243
  idx: 231
  unit: 8
  title: Ratio and proportion
  mins: 35
  goal: Your student explains ratio as a quotient, writes and tests proportions, and names the terms of a proportion.
  materials: *id001
  book: Two ways of comparing quantities, ratio and its terms, how ratios are written and changed, ratios of equality and inequality, compound ratio, proportion and how to test it, extremes and means, and mean and third proportionals.
  steps:
  - - Warm-up
    - 'Ask: How do 2 and 6 compare? Let your student say "6 is 4 more" and "6 is 3 times as much."'
  - - Ratio
    - 'Read Arts. 231 and 232.

      ~ Ratio is the quotient which arises from dividing one quantity by another of the same kind.

      Note Ray''s choice: "the ratio of 2 to 6 is 3." Many books today would say 1/3. Read Remark 1 so your student knows both.'
  - - Changing the terms
    - 'Read Art. 236 and test each statement with 4 to 12 (ratio 3): multiply the consequent by 5, divide the antecedent by 2, multiply both by 2.'
  - - Proportion
    - 'Read Art. 240.

      ~ Proportion is an equality of ratios.

      Say: a : b :: c : d is read "a is to b as c is to d." Test 3 : 8 :: 2 : 5 the book''s way. (False.)'
  - - Terms
    - 'Read Arts. 241 to 243. Your student labels the extremes and means of 3 : 6 :: 5 : 10, and finds a mean proportional between 4 and 9 (6).'
  - - Wrap-up
    - 'Ask: Why can 2 yards and 6 dollars have no ratio? (Art. 232, Remark 2.)'
  tip: Ray's ratio is "second divided by first." When your student meets the other convention later, the idea is the same; only the order flips.
  num: 53
- roman: Arts. 244–255
  idx: 236
  unit: 8
  title: The propositions of proportion; final review
  mins: 45
  goal: Your student uses "product of means equals product of extremes" and can show the other propositions with numbers.
  materials: *id001
  book: Propositions I to XII of proportion (means and extremes, its converse, continued proportion, alternation, inversion, composition, division, powers, products and sums), each proved and illustrated with numbers, then the book's General Review.
  steps:
  - - Warm-up
    - 'Ask: Is 3 : 6 :: 5 : 10 true? Multiply 6 × 5 and 3 × 10.'
  - - Proposition I
    - 'Read Art. 244.

      ~ In every proportion, the product of the means is equal to the product of the extremes.

      Do the book''s exercise: the first three terms are ac, bd and acxy; the fourth is bd × acxy ÷ ac = bdxy.'
  - - Proposition II
    - Read Art. 245 and the table of eight proportions from 5 × 8 = 4 × 10. Your student writes three of them.
  - - Propositions III to VI
    - 'Read Arts. 246 to 249, checking each with the book''s number illustration: 4 : 6 :: 6 : 9; 2 : 7 :: 6 : 21 becomes 2 : 6 :: 7 : 21; and so on.'
  - - Propositions VII to XII
    - 'Read Arts. 250 to 255. For each, your student makes up a fresh number example and checks it. For composition: 3 : 4 :: 6 : 8 gives 7 : 4 :: 14 : 8.'
  - - Final review
    - Use the General Review on pp. 239 and 240 as a last oral quiz over the whole book. Go through it over two or three days.
  - - Wrap-up
    - Ask your student which chapter of the book they found hardest, and plan a short review of it.
  practice: Spread the closing General Review over several short sessions, revisiting any chapter that comes up weak.
  tip: Every proposition here can be checked with numbers in a few seconds. Make that the habit, as with every rule in the book.
  num: 54
