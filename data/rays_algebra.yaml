      Example: reduce x to a fraction with denominator 4 (4x/4).'
  - - Independent practice
    - The remaining exercises of Arts. 133 to 136, checked against the printed answers.
  - - Wrap-up
    - 'Ask: Why is the least common denominator better than just multiplying all the denominators?'
  answers: The book prints the answer after each exercise.
  tip: Have your student say the L.C.M. aloud before writing any numerators. Most mistakes come from rushing past it.
