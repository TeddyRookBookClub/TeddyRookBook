book:
  id: cu31924031244258
  title: Ray's New Elementary Algebra
  year: '1866'
  key: algebra
  short: Elementary Algebra
  eyebrow: Ray's Arithmetic · Algebra
  hero: 'Joseph Ray''s first algebra (Primary Elements of Algebra), for students about 12 to 15: signs and terms, the four rules, theorems and factoring, fractions, equations, powers and roots, quadratics and progressions. Each guide is one 30 to 45 minute session, with the right page of the book beside it.'
  how:
  - <b>One session, one guide.</b> Each guide covers a few of the book's numbered articles. Three or four sessions a week finishes a chapter in two or three weeks.
  - <b>Read the rule aloud.</b> Ray states every rule in words. Have your student read it, say it back in their own words, then use it.
  - <b>Pencil first.</b> Work every example by hand on paper. The site's calculator (/homeschool/calculator/) is for checking a finished answer, never for producing it.
  - '<b>Check with numbers.</b> Ray checks algebra by putting numbers in for the letters. Make it a habit: if both sides give the same number, the work is probably right.'
  - <b>Answers are in the book.</b> Ray prints the answer after almost every exercise. Cover it with a card, work the problem, then uncover and compare.
  - <b>Go back when stuck.</b> Most trouble later on comes from signs. If a lesson goes badly, spend a session on the rule for signs before moving on.
  lessonword: ''
  numnote: Each guide covers a few of the book's numbered articles, shown beside the title; guide numbers simply count the sessions in order.
  unitword: Unit
  key_id: keytoraysnewalge00rayj
units:
- id: 1
  name: 'Chapter I: Fundamental rules'
  from: 1
  to: 10
  text: Definitions and signs, then addition, subtraction, multiplication and division of algebraic quantities (Arts. 1 to 79).
- id: 2
  name: 'Chapter II: Theorems, factoring, etc.'
  from: 11
  to: 16
  text: The algebraic theorems, factoring, greatest common divisor and least common multiple (Arts. 80 to 112).
- id: 3
  name: 'Chapter III: Algebraic fractions'
  from: 17
  to: 23
  text: What fractions are, then reducing, common denominators, and the four operations with fractions (Arts. 113 to 144).
- id: 4
  name: 'Chapter IV: Simple equations'
  from: 24
  to: 32
  text: Equations of the first degree with one, two and three unknowns, and the word problems that lead to them (Arts. 145 to 163).
- id: 5
  name: 'Chapter V: Supplement to simple equations'
  from: 33
  to: 36
  text: Formulas and general rules, negative answers, the Problem of the Couriers, and indeterminate and impossible problems (Arts. 164 to 177).
- id: 6
  name: 'Chapter VI: Powers, roots and radicals'
  from: 37
  to: 44
  text: Powers and the binomial theorem, square roots of numbers and expressions, and working with radicals (Arts. 178 to 205).
- id: 7
  name: 'Chapter VII: Quadratic equations'
  from: 45
  to: 50
  text: Pure quadratics, completing the square, the Hindoo method, problems, properties of roots, and pairs of equations (Arts. 206 to 219).
- id: 8
  name: 'Chapter VIII: Progressions and proportion'
  from: 51
  to: 54
  text: Arithmetical and geometrical progressions, ratio, and the propositions of proportion (Arts. 220 to 255).
lessons:
- roman: Arts. 1–17
  idx: 10
  unit: 1
  title: What algebra is
  mins: 30
  goal: Your student can say what algebra is, tell a theorem from a problem, and tell known quantities from unknown ones.
  materials:
  - The book, open to the page
  - Pencil and plenty of paper (or a whiteboard)
  book: 'The first page of definitions: quantity, magnitude and multitude, the unit of measure, abstract and concrete numbers, theorems and problems, the definition of algebra, and known and unknown quantities. There are no written exercises yet.'
  steps:
  - - Warm-up
    - 'Ask three quick questions: How long is this table? How many people live in our house? How much does a gallon of milk cost?

      Point out that every answer is a number of some unit: feet, people, dollars.'
  - - Quantity and its unit
    - 'Read Arts. 2 to 7 together. The key line:

      ~ The value or measure of any quantity is the number of times it contains its unit of measure.

      Say: A board 6 feet long contains the unit "one foot" six times. That 6 is its numerical value.'
  - - Abstract and concrete numbers
    - 'Read Art. 10.

      ~ An Abstract Number denotes how many times a unit is to be taken.

      ~ A Concrete Number denotes the units that are taken.

      Ask: Is "5" abstract or concrete? Is "5 apples"? Have your student make up two of each.'
  - - Theorems and problems
    - 'Read Arts. 12 to 14.

      ~ There are two kinds of questions in Algebra, theorems and problems.

      Say: A theorem asks you to show something is always true. A problem asks you to find something you don''t know yet.

      Ask which kind each is: "Show that the sum of two even numbers is even." "Find a number which, added to 7, makes 12."'
  - - The definition of algebra
    - 'Read Art. 15 aloud, slowly, twice.

      ~ Algebra is a general method of solving problems and demonstrating theorems, by means of figures, letters, and signs.

      Have your student copy it into a notebook. This notebook of rules will grow all year.'
  - - Known and unknown
    - 'Read Arts. 16 and 17.

      ~ Known quantities are generally represented by the first letters of the alphabet

      Say: So a, b, c stand for things we know; x, y, z for things we are trying to find.

      Practice: in "x + 3 = 10," which is known and which is unknown?'
  - - Wrap-up
    - Your student explains, without the book, what algebra is and why it uses letters. Two or three sentences is enough.
  practice: Read Arts. 1 to 17 again before the next session and add the definition of algebra to the rule notebook.
  tip: These first pages are definitions only. Don't ask for memorizing word for word; ask for the idea in your student's own words.
  num: 1
- roman: Arts. 18–38
  idx: 12
  unit: 1
  title: Signs, coefficients, powers and roots
  mins: 40
  goal: Your student reads the signs = + − × ÷ > aloud correctly, and knows what a coefficient, an exponent and a root are.
  materials:
  - The book, open to the page
  - Pencil and plenty of paper (or a whiteboard)
  book: The principal signs of algebra one by one (equality, plus and minus, multiplication, division, inequality, infinity), then coefficients, powers and exponents, roots and the radical sign.
  steps:
  - - Warm-up
    - Write 3 + 4 = 7 and 12 ÷ 3 > 2. Ask your student to read each aloud in words.
  - - Plus, minus and like signs
    - 'Read Arts. 19 to 24.

      ~ When a quantity has no sign prefixed, it is positive.

      ~ Quantities having the same sign are said to have like signs; those having different signs, unlike signs.

      Write 5a − 3b + c. Ask: Which terms are positive? Which have like signs?'
  - - Factors and the signs of multiplying and dividing
    - 'Read Arts. 25 to 29.

      ~ Factors are quantities that are to be multiplied together.

      Say: In algebra, ab means a times b. We leave out the times sign between letters.

      Ask your student to read aloud: a × b, ab, 3ab, a ÷ b.'
  - - Coefficients
    - 'Read Arts. 30 to 32.

      ~ The Literal Coefficient of a quantity is a quantity by which it is multiplied.

      Write 5x, ax, 3ay. Ask: What is the coefficient of x in each? (5, a, 3a.) Point out that a letter with no number in front has coefficient 1.'
  - - Powers and exponents
    - 'Read Arts. 33 and 34.

      ~ The Power of a quantity is the product arising from multiplying the quantity by itself one or more times.

      Say: a³ means aaa, three a''s multiplied. The small 3 is the exponent.

      Have your student write out a², a⁴ and x³ as products, then tell the difference between 3a and a³ using a = 2. (6 and 8.)'
  - - Roots and the radical sign
    - 'Read Arts. 35 to 38.

      ~ The Root of a quantity is another quantity, some power of which equals the given quantity.

      Ask: What is the square root of 25? The cube root of 8? Show how the index sits over the radical sign for a cube root.'
  - - Check and wrap-up
    - Write 4a²b − 3x + √c. Your student names every sign, coefficient, exponent and radical in it, out loud.
  practice: 'Make flash cards: the sign on one side, how it is read on the other. Five minutes before the next session.'
  tip: The mix-up to watch for is 3a versus a³. Testing both with a number (a = 2) settles it fast.
  num: 2
- roman: Arts. 39–52
  idx: 16
  unit: 1
  title: Terms, polynomials and numerical values
  mins: 45
  goal: Your student can name monomials, binomials and trinomials, spot similar terms, find the value of an expression for given numbers, and write a word phrase in algebra.
  materials: &id001
  - The book, open to the page
  - Pencil and plenty of paper (or a whiteboard)
  - A card to cover printed answers
  book: 'Algebraic expressions, monomials and polynomials, degree, parentheses and the vinculum, similar terms and reciprocals; then two sets of examples: finding numerical values when a = 4, b = 3, c = 5, d = 10, x = 2, y = 6, and writing phrases in symbols. Answers are printed.'
  steps:
  - - Warm-up
    - 'Ask: What is the coefficient of x in 7x? What does a² mean? (Quick review of the last session.)'
  - - Names for expressions
    - 'Read Arts. 40 to 43.

      ~ A Monomial, or Term, is an algebraic expression, not united to any other by the sign + or —.

      ~ A Binomial is a polynomial composed of two terms.

      Write 3ab, a + b, x² − 2x + 1. Your student names each.'
  - - Similar terms
    - 'Read Art. 50.

      ~ Similar or Like quantities are those composed of the same letters, affected with the same exponents.

      Ask: Are 3a²b and 5a²b similar? 3a²b and 3ab²? (Yes; no: the exponents are on different letters.) This idea is the key to addition next session.'
  - - Numerical values, worked together
    - 'Read Art. 44 and the line before the Examples:

      ~ Let the numerical values be found, on the supposition that a=4, b=3, c=5, d=10, x=2, and y=6.

      Work example 9 together:

      ~ (a+b) (a—b) Ans. 7.

      Say: a + b is 7, a − b is 1, and 7 times 1 is 7. Always do what is in the parentheses first.'
  - - Guided practice
    - 'Cover the answers. Your student does these two while you watch:

      ~ 4a— x. . . . Ans. 14.

      ~ a(a+b). . . . Ans. 28.

      Then example 4 (6a²x, Ans. 192). If it comes out 2304, the 6 was squared too: the exponent belongs only to a.'
  - - Writing phrases in symbols
    - 'Read the second set of examples. Do the first two together:

      ~ Three times a, plus 6, minus four times c.

      ~ a minus b, into three times c.

      The answers are 3a + 6 − 4c and (a − b)3c. Point out that "into" means "times," so a minus b needs parentheses.'
  - - Independent practice
    - Your student works the rest of the numerical-value examples (1 to 13) and the twelve phrases, then uncovers the printed answers and checks. Redo any that disagree.
  - - Wrap-up
    - Ask your student to explain the difference between the phrases in examples 5 and 6 (a plus b, all divided by 3c; and a, plus b divided by 3c).
  answers: 'The book prints the answer after each example. With a = 4, b = 3, c = 5: example 12, 3(a+c)(a−c) + 3a² − 3c², works out to −27 + 48 − 75 = −54, as printed.'
  tip: A few of these examples use fraction bars that are hard to read in the scan. If one is unclear, skip it; the others teach the same thing.
  num: 3
- roman: Arts. 53–55
  idx: 20
  unit: 1
  title: Addition
  mins: 45
  goal: Your student adds similar terms with the same or different signs, and adds polynomials by lining up similar terms.
  materials: *id001
  book: 'The three cases of addition, each with a rule: similar terms with the same sign; similar terms with unlike signs (with a merchant''s gains and losses); and unlike or partly like terms. Each case has worked examples and exercises with printed answers.'
  steps:
  - - Warm-up
    - 'Ask: Are 4xy and −3xy similar? Are 2a and 2b? Then: 5 apples and 3 apples make how many? 5 apples and 3 pears?'
  - - 'Case I: same signs'
    - 'Read the apple example (three pockets with 3, 4 and 5 apples) and the rule:

      ~ Add together the coefficients of the several quantities;

      ~ to their sum prefix the common sign, and annex the common letter or letters.

      Say: 3a + 4a + 5a is 12a. And −3a, −4a and −5a make −12a: the sign stays.'
  - - 'Case II: unlike signs'
    - 'Read the merchant example and the rule:

      ~ TO ADD LIKE QUANTITIES WHICH HAVE UNLIKE SIGNS,

      Say: Add up the plus coefficients, add up the minus ones, subtract the smaller total from the larger, and keep the sign of the larger.

      Gains of 3a and 8a, losses of 2a and 5a: 11a − 7a = 4a.'
  - - Guided practice
    - 'Cover the answers. Your student does these while you watch:

      ~ 8. Of 2ab, 5ab, 8ab, and 11ab? Ans. 26ab.

      ~ 9. Of 6a— 4b, 3a+2b, —7a— 8b, and — a+9b? Ans. a — b.

      For the second, add the a column and the b column separately.'
  - - 'Case III: unlike terms'
    - 'Read the rule:

      ~ 1. Write the quantities to be added, placing those that are similar under each other.

      ~ 2. Add similar terms, and annex the others, with their proper signs.

      Work exercise 2 together, writing the two lines under each other: 6a − 4c + 3b and −2a − 3c − 5b. The sum is 4a − 7c − 2b.'
  - - Independent practice
    - Your student works Case I exercises 7 to 10, Case II exercises 5 to 13, and Case III exercises 3 to 9, checking each against the printed answer.
  - - Check by numbers
    - Pick one finished problem. Put a = 2, b = 1 into the question and into the answer; both should give the same number. The site's calculator (/homeschool/calculator/) can do this check too, but only after the work is done by hand.
  - - Wrap-up
    - Your student states the three cases in their own words.
  answers: The book prints the answer after each exercise.
  tip: Lining up similar terms in columns, as the rule says, prevents nearly every mistake in this lesson.
  num: 4
- roman: Arts. 56–59
  idx: 25
  unit: 1
  title: Subtraction
  mins: 45
  goal: Your student subtracts algebraic quantities by changing the signs of the subtrahend and adding.
  materials: *id001
  book: Subtraction of similar terms, of unlike terms, then the general rule (change the signs of the subtrahend and add), with forty exercises; finally how to show subtraction with a parenthesis. Answers are printed.
  steps:
  - - Warm-up
    - 'Three quick additions: 5a + (−2a), −3x + (−4x), 6b + (−9b). (3a, −7x, −3b.)'
  - - The easy cases
    - 'Read Art. 56 (Thomas gives away 2a of his 5a cents) and Art. 57.

      ~ Subtraction, in Algebra, is the process of finding the difference between two algebraic quantities.

      Say: 5a take 2a leaves 3a. But a take b can only be written a − b.'
  - - Why the signs change
    - 'Read Art. 58: subtracting 5 + 3 from 9, then 5 − 3 from 9. Work both in plain numbers.

      Say: Taking away 5 − 3 takes away 5, but then we took away 3 too many, so we must add 3 back. So 9 − (5 − 3) = 9 − 5 + 3 = 7.'
  - - The rule
    - '~ 1. Write the quantity to be subtracted under that from which it is to be taken, placing similar terms under each other.

      ~ 2. Conceive the signs of all the terms of the subtrahend to be changed, and then reduce by the rule for Addition,

      The book suggests beginners actually rewrite the subtrahend with its signs changed. Do that for now.'
  - - Guided practice
    - 'Cover the answers. Your student does these while you watch:

      ~ 16. From x+y, take x — y. Ans. 2y.

      ~ 22. From 8a, take —3a. . Ans. 11a.

      Then exercise 34: from 6a + 5 − 3b take −2a − 9b − 8. Changed signs: +2a + 9b + 8. Sum: 8a + 6b + 13.'
  - - Independent practice
    - Exercises 6 to 9, 2 to 5 of Art. 57, and 12 to 40 of Art. 58, checking each against the printed answer. Then the four short examples in Art. 59.
  - - Check
    - For one long exercise, add the answer to the subtrahend. You should get the minuend back. That is the arithmetic check, done in algebra.
  - - Wrap-up
    - 'Ask: From −9 take −16. Why is the answer positive? (Taking away a debt of 16 leaves you better off.)'
  answers: The book prints the answer after each exercise.
  tip: If this many exercises is too much for one sitting, stop at 25 and do the rest next session as a warm-up.
  num: 5
- roman: Arts. 60–64
  idx: 30
  unit: 1
  title: What plus and minus really mean
  mins: 30
  goal: Your student can explain how a "sum" can be smaller than the numbers added, and why −10 is less than −2.
  materials:
  - The book, open to the page
  - Pencil and plenty of paper (or a whiteboard)
  book: 'A short reading section with no exercises: what algebraic addition and subtraction really mean, how negative quantities are ordered, and examples with money in a drawer and a ship''s latitude.'
  steps:
  - - Warm-up
    - 'Ask: You have 5 dollars and owe 3. How much are you really worth? (2 dollars.)'
  - - Adding can make smaller
    - 'Read Arts. 60 and 61.

      ~ algebraic addition is the process of collecting two or more quantities into one.

      Say: The sum of 5 and −3 is 2. Adding a minus quantity is like adding a debt.'
  - - Which is less?
    - 'Read Art. 62.

      ~ those which are numerically the greatest are really the least.

      Draw a number line from −10 to 10. Ask: Which is less, −2 or −8? Mark them. A debt of 8 is worse than a debt of 2.'
  - - Money and latitude
    - 'Read Art. 63. Act out the money example with coins: put money in, take money out, and keep score with + and −. For the ship, north latitude is + and south is −; ask what sailing from 5° north to 3° south does to the number.'
  - - Subtraction in arithmetic and in algebra
    - 'Read Art. 64.

      ~ Subtraction, in arithmetic, shows the method of finding the excess of one quantity over another of the same kind.

      Say: In algebra, subtracting finds the difference even when the second number is bigger, or negative.'
  - - Wrap-up
    - Your student makes up one example of their own (temperature, a bank balance, floors above and below ground) and explains it with + and −.
  practice: A quick review of five subtraction exercises from the last session, chosen from the ones that went wrong.
  tip: This is a good session for a slower day. The ideas here make the rule of signs in multiplication much easier.
  num: 6
- roman: Arts. 65–71
  idx: 33
  unit: 1
  title: Multiplying monomials and polynomials
  mins: 45
  goal: Your student multiplies monomials (multiply the numbers, add the exponents) and multiplies a polynomial by a monomial or by another polynomial.
  materials: *id001
  book: Multiplication defined, the rule of the coefficients, the rule of the exponents, then multiplying a polynomial by a monomial (oranges and lemons) and one polynomial by another. All signs here are plus; signs come next session. Answers are printed.
  steps:
  - - Warm-up
    - 'Ask: What is a³ written out? What is a² × a³ written out? Count the a''s. (aaaaa, so a⁵.)'
  - - The rule of the exponents
    - 'Read Arts. 67 to 69.

      ~ The exponent of a letter in the product is equal to the sum of its exponents in the two factors.

      Then the rule for monomials:

      ~ 1. Multiply the coefficients of the two terms together.

      ~ 2. To this product, annex all the letters in both quantities.

      ~ 3. When the same letter occurs in both factors, add its exponents for the exponent of the product.'
  - - 'Guided practice: monomials'
    - 'Cover the answers. Your student does these while you watch:

      ~ 7. Multiply 2bc by mn. Ans. 2bcmn.

      ~ 8. Multiply 4ab by 5xy. Ans. 20abxy.

      Then 3a²b by 4ab: 12a³b². Remind: write the letters in the order of the alphabet.'
  - - Polynomial times monomial
    - 'Read the oranges and lemons example in Art. 70 (5 oranges and 2 lemons at 4 cents: 20 + 8 = 28 cents) and the rule:

      ~ Multiply each term of the multiplicand by the multiplier.

      Work exercise 3 together: 4x + 5y times 3a is 12ax + 15ay.'
  - - Polynomial times polynomial
    - 'Read Art. 71.

      ~ Multiply each term of the multiplicand by each term of the multiplier, and add the products together.

      Work exercise 10 together, set up like long multiplication:

      ~ 10. 3x+2y by 2x+3y. . . Ans. 6x²+13xy+6y².

      The two middle products, 9xy and 4xy, sit under each other and add to 13xy.'
  - - Independent practice
    - Art. 69 exercises 3 to 13, Art. 70 exercises 2 to 8, and Art. 71 exercises 4 to 15. Check each against the printed answer.
  - - Check
    - For one product, put x = 2 and y = 1 into the factors and into the answer; they must agree. Afterwards your student can confirm one answer on the site's calculator with expand((3*x+2*y)*(2*x+3*y)).
  - - Wrap-up
    - Your student explains why a² times a³ is a⁵ and not a⁶.
  answers: The book prints the answer after each exercise.
  tip: The most common slip is multiplying exponents instead of adding them. Writing the letters out once (aa × aaa) fixes it.
  num: 7
- roman: Art. 72
  idx: 38
  unit: 1
  title: Signs in multiplication
  mins: 45
  goal: Your student uses the rule of signs (like signs give plus, unlike give minus) and multiplies any two polynomials.
  materials: *id001
  book: Why minus times minus gives plus, shown first with plain numbers like (8 − 3) × 5, then the rule for the signs, the general rule, and thirty exercises, the last few with three or four factors. Answers are printed.
  steps:
  - - Warm-up
    - Multiply 3a²b by 4ab, and 2x + 3y by 4x. (12a³b², 8x² + 12xy.)
  - - See it in numbers
    - 'Work the first numerical exercises together:

      ~ 1. Multiply 8—3 by 5 Ans. 40—15=25.

      Then 9 − 5 by 8 − 2: 72 − 18 − 40 + 10 = 24, and 4 × 6 is 24. Say: The minus times minus product, +10, had to be plus to make it come out right.'
  - - The rule for the signs
    - '~ Plus multiplied by plus, or minus by minus, gives plus.

      ~ Plus multiplied by minus, or minus by plus, gives minus.

      Have your student copy it into the rule notebook.'
  - - Work an example together
    - 'Exercise 9:

      ~ 9. Multiply m+n by m — n Ans. m²—n².

      Write the four products: m², −mn, +mn, −n². The middle two cancel. Say: Remember this one; it comes back as a theorem.'
  - - Guided practice
    - 'Your student does these while you watch:

      ~ 17. Multiply 3a+5b by 3a— 5b. . . Ans. 9a²—25b².

      ~ 26. (x— 3) (x— 3) (x— 3). . . Ans. x³— 9x²+27x— 27.

      For the three factors, multiply the first two, then multiply that result by the third.'
  - - Independent practice
    - The rest of the exercises in Art. 72, from 1 to 30. For a 45-minute session, do 7 to 20 today and 21 to 30 next time.
  - - Check
    - 'After working exercise 27, (x − 4)(x − 5)(x + 4)(x + 5), by hand, your student may confirm it on the site''s calculator: expand((x-4)*(x-5)*(x+4)*(x+5)) gives x⁴ − 41x² + 400.'
  - - Wrap-up
    - 'Ask: What sign does −2a × −3b × −c have? (Minus: two minuses make plus, and one more minus makes minus.)'
  answers: The book prints the answer after each exercise.
  tip: Have your student write every partial product with its sign before combining anything. Skipped signs cause most wrong answers.
  num: 8
- roman: Arts. 73–78
  idx: 42
  unit: 1
  title: Dividing monomials, and a polynomial by a monomial
  mins: 40
  goal: Your student divides one monomial by another (divide the numbers, subtract the exponents, use the rule of signs) and divides each term of a polynomial by a monomial.
  materials: *id001
  book: Division defined, the rule for dividing monomials with its rule of signs, the cases where exact division is impossible, and dividing a polynomial by a monomial. Answers are printed.
  steps:
  - - Warm-up
    - 'Ask: 3a times what makes 12a²? (4a.) Say: Division undoes multiplication; that is the whole idea of today.'
  - - Division defined
    - 'Read Arts. 73 and 74.

      ~ Division, in Algebra, is the process of finding how many times one algebraic quantity is contained in another.

      Do the first oral questions together:

      ~ How many times is a contained in 6a?

      ~ Is 2 contained in 4a?

      (6 times; 2a times.)'
  - - The rule for monomials
    - 'Read Art. 75.

      ~ Like signs give plus, and unlike signs give minus.

      ~ Divide the coefficient of the dividend by that of the divisor

      Say: Then subtract the exponent of each letter in the divisor from its exponent in the dividend. a⁵ ÷ a² = a³, because a³ × a² = a⁵.'
  - - Guided practice
    - 'Cover the answers. Your student works these while you watch:

      ~ 13. Divide —18a²x by —6ax.

      Then −12a³b by 4ab (−3a²). Check each by multiplying back.'
  - - When it can't be done exactly
    - 'Read Art. 76. Ask: Can 3a be divided exactly by b? (No; we can only write 3a/b.)'
  - - Polynomial by monomial
    - 'Read Art. 78.

      ~ Divide each term of the dividend by the divisor, according to the rule for the division of monomials.

      Work together:

      ~ 1. Divide 6x+12y by 3

      ~ 3. Divide 21a+35b by —7. . . .

      (2x + 4y; −3a − 5b.)'
  - - Independent practice
    - Art. 74 and 75 exercises 1 to 18 and Art. 78 exercises 1 to 8 (the optional ones too, if time allows). Check each against the printed answer, and check two by multiplying back.
  - - Wrap-up
    - Your student explains why a² ÷ a² is 1 and a² ÷ a is a.
  answers: The book prints the answer after each exercise.
  tip: Multiplying back (quotient × divisor = dividend) is the best check in this lesson. Make it automatic.
  num: 9
- roman: Art. 79
  idx: 45
  unit: 1
  title: Dividing one polynomial by another
  mins: 45
  goal: 'Your student does long division of polynomials: arrange, divide the first terms, multiply, subtract, repeat.'
  materials: *id001
  book: Dividing one polynomial by another, explained first by building the product and taking it apart, then the rule and five worked examples, then exercises 6 to 11. Answers are printed.
  steps:
  - - Warm-up
    - Multiply 2a − 3x by 3a − 2x. (6a² − 13ax + 6x².) Keep the answer; you will divide it back in a moment.
  - - The rule
    - 'Read Art. 79 and its rule:

      ~ Arrange the dividend and divisor with reference to the leading letter, and place the divisor on the right of the dividend.

      ~ Divide the first term of the dividend by the first term of the divisor, for the first term of the quotient.

      Say: Then multiply the whole divisor by that term, subtract, and repeat with what is left.'
  - - Work the book's first example together
    - '~ 1. Divide 6a²—13ax+6x² by 2a— 3x.

      6a² ÷ 2a = 3a. Multiply: 3a(2a − 3x) = 6a² − 9ax. Subtract: −4ax + 6x².

      −4ax ÷ 2a = −2x. Multiply: −2x(2a − 3x) = −4ax + 6x². Subtract: 0.

      Quotient: 3a − 2x, exactly the warm-up factor.'
  - - Look at examples 2 to 5
    - 'Read the other worked examples. Point out example 3: a³ + x³ divided by a + x, where the missing powers of a get room left for them in the work.'
  - - Guided practice
    - 'Cover the answers. Your student does these while you watch:

      ~ 7. Divide 2x²+7xy+6y² by x+2y.

      ~ 11. Divide ac+bc — ad — bd by a+b. . . Ans. c — d.

      (The first comes out 2x + 3y.)'
  - - Independent practice
    - Exercises 6, 8, 9 and 10. Check each by multiplying the quotient by the divisor.
  - - Check
    - After working one by hand, your student can confirm it on the site's calculator by expanding quotient times divisor, for example expand((x+2*y)*(2*x+3*y)).
  - - Wrap-up
    - 'Ask: How do you know when to stop? (When the remainder is 0, or when its first term can no longer be divided by the first term of the divisor.)'
  answers: The book prints the answer after each exercise.
  tip: 'Keep the columns neat: every power of the leading letter in its own column. Untidy layout is the main cause of errors here.'
  num: 10
- roman: Arts. 80–86
  idx: 49
  unit: 2
  title: The first algebraic theorems
  mins: 45
  goal: Your student squares a sum or a difference and multiplies a sum by a difference at sight, and knows what negative and zero exponents mean.
  materials: *id001
  book: Theorems I to III (square of a sum, square of a difference, sum times difference), each with six examples written out; Theorems IV and V on negative and zero exponents; and Theorems VI to VIII (top of p. 50) on dividing differences and sums of powers.
  steps:
  - - Warm-up
    - Multiply a + b by a + b the long way. (a² + 2ab + b².)
  - - Theorem I
    - 'Read Art. 80.

      ~ The square of the sum of two quantities is equal to the square of the first, plus twice the product

      ~ of the first by the second, plus the square of the second.

      Work the number example: (2 + 3)² = 4 + 12 + 9 = 25. Then (2a + b)² = 4a² + 4ab + b².'
  - - Theorems II and III
    - 'Read Arts. 81 and 82.

      ~ The product of the sum and difference of two quantities is equal to the difference of their squares.

      Do the number examples: (5 − 4)² = 25 − 40 + 16 = 1, and (5 + 3)(5 − 3) = 25 − 9 = 16.'
  - - Guided practice
    - 'Cover the right-hand sides. Your student writes the answers at sight, saying the theorem aloud each time:

      ~ 3. (2x+3y)²=4x²+12xy+9y².

      ~ 4. (5a+4b)(5a— 4b)=25a²— 16b².

      Then (3x − 2y)², which is 9x² − 12xy + 4y².'
  - - Negative and zero exponents
    - 'Read Arts. 83 and 84.

      ~ The reciprocal of a quantity is equal to the same quantity with the sign of its exponent changed.

      Say: a⁻² means 1 over a². And a⁰ is 1, because a³ ÷ a³ is 1 and by the exponent rule it is also a⁰.'
  - - Differences and sums of powers
    - 'Read Arts. 85 and 86 (Theorems VI and VII) and Theorem VIII at the top of p. 50. Show them with numbers: 5² − 3² = 16, which divides by 5 − 3 = 2 and by 5 + 3 = 8; 5³ − 3³ = 98, which divides by 2; and 5³ + 3³ = 152, which divides by 8.'
  - - Independent practice
    - Cover and redo all six examples under each of Theorems I, II and III. Your student can confirm one afterwards on the site's calculator, for example expand((2*x+3*y)^2), but the point is to write these at sight.
  - - Wrap-up
    - Your student states Theorems I, II and III from memory, with a + b and a − b.
  answers: The book writes out the answer to each example under Theorems I to III.
  tip: These three theorems are used constantly in factoring, which comes next. A few minutes of drill at the start of the next several sessions pays off.
  num: 11
- roman: Arts. 87–93
  idx: 53
  unit: 2
  title: Divisors, prime factors and common monomial factors
  mins: 40
  goal: Your student breaks numbers and monomials into prime factors and takes out the largest monomial factor of a polynomial.
  materials: *id001
  book: Divisors, prime and composite numbers, the rule for prime factors of a number, prime and composite quantities, prime factors of a monomial, and separating a polynomial into a monomial times a polynomial. Answers are printed.
  steps:
  - - Warm-up
    - 'Ask: What numbers divide 12 exactly? (1, 2, 3, 4, 6, 12.) Which of them are prime?'
  - - Divisors and primes
    - 'Read Arts. 87 and 88.

      ~ A Divisor or Measure of a quantity is any quantity that divides it without a remainder.

      ~ A Prime Number is one which has no divisors except itself and unity.

      Note that Ray counts 1 among the primes ("The prime numbers are 1, 2, 3, 5, 7, ..."). Most books today do not; just mention it.'
  - - Prime factors of a number
    - 'Read the rule:

      ~ 1. Divide by any prime number that will exactly divide it; divide the quotient again in the same manner, and so continue.

      ~ 2. The last quotient and the several divisors will be the prime factors.

      Work together:

      ~ 1. What are the prime factors of 105 ? Ans. 3, 5, 7.

      Then your student does 210 and 4290 (exercises 2 and 3).'
  - - Monomials
    - 'Read Arts. 89 to 92.

      ~ Resolve the coefficient into its prime factors. To these annex the literal factors.

      Show: 15a²bc = 3 × 5 × a × a × b × c. Your student does the other two exercises.'
  - - Taking out a common factor
    - 'Read Art. 93.

      ~ Divide the given quantity by the greatest monomial that will exactly divide each of its terms; the divisor will be one factor and the quotient the other.

      Guided practice:

      ~ 1. x+ax Ans. x(1+a).

      ~ 4. 4x²+6xy Ans. 2x(2x+3y).'
  - - Independent practice
    - Art. 93 exercises 2, 3, 5, 6 and 7. Check each by multiplying the factors back together.
  - - Check
    - Your student can confirm one afterwards on the site's calculator (/homeschool/calculator/) with factor(4*x^2+6*x*y), after doing it by hand.
  - - Wrap-up
    - 'Ask: Why is 2x the greatest common monomial factor of 4x² + 6xy, and not just 2 or just x?'
  answers: The book prints the answer after each exercise.
  tip: Always multiply back. It takes ten seconds and catches nearly every slip.
  num: 12
- roman: Arts. 94–96
  idx: 55
  unit: 2
  title: Factoring with the theorems; quadratic trinomials
  mins: 45
  goal: Your student factors perfect squares, differences of squares, sums and differences of cubes, and trinomials like x² − 5x + 6.
  materials: *id001
  book: Factoring by reversing the theorems of Arts. 80 to 86, with twelve exercises whose answers are printed together below them; then quadratic trinomials split into two binomials by inspection, and the use of factoring to shorten work by canceling.
  steps:
  - - Warm-up
    - Ask your student to say Theorems I, II and III from memory, with a and b.
  - - Reverse the theorems
    - 'Read Art. 94.

      ~ No general rule can be given for this case.

      Read the five hints (1st to 5th). Write the examples: a² + 2ab + b² = (a + b)(a + b), a² − b² = (a + b)(a − b), a³ − b³ = (a − b)(a² + ab + b²).'
  - - Guided practice
    - 'Cover the answers. Your student factors exercises 1, 7 and 10 while you watch: x² + 2xy + y², 9m² − 16n², and x³ − 1. (The book gives (x + y)(x + y), (3m + 4n)(3m − 4n), and (x − 1)(x² + x + 1).)'
  - - Quadratic trinomials
    - 'Read Art. 95.

      ~ Such quantities may be resolved into two binomial factors by inspection.

      Say: For x² − 5x + 6, find two numbers that multiply to 6 and add to −5: −2 and −3. So (x − 2)(x − 3).

      Work together:

      ~ 1. x²+5x+6 Ans. (x+2)(x+3).

      ~ 8. x²— x— 30 Ans. (x— 6)(x+5).'
  - - Common factor first
    - 'Read the note before exercise 9: 5ax² − 10ax − 40a = 5a(x² − 2x − 8) = 5a(x − 4)(x + 2). Your student does exercise 9, 3x² + 12x − 15. (3(x + 5)(x − 1).)'
  - - Canceling
    - 'Read Art. 96.

      ~ The principal use of factoring is to shorten algebraic operations by canceling common factors.

      Do exercise 2 together: (x − 3)(x² − 1) ÷ (x − 1) = (x − 3)(x + 1)(x − 1) ÷ (x − 1) = (x − 3)(x + 1) = x² − 2x − 3.'
  - - Independent practice
    - Art. 94 exercises 2 to 12 (except those done), Art. 95 exercises 2 to 11, and Art. 96 exercises 3 and 4. Afterwards, check two on the site's calculator with factor(x^2-13*x+40) and similar.
  - - Wrap-up
    - 'Ask: Why can''t x² + 4 be split like x² − 4?'
  answers: The book prints the answer after each exercise.
  tip: For trinomials, write the factor pairs of the last number in a little list. Guessing without the list wastes time.
