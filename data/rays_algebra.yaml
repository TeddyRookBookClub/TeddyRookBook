    - 'Coefficients: 1; 1 × 6 ÷ 1 = 6; 6 × 5 ÷ 2 = 15; 15 × 4 ÷ 3 = 20; then they repeat: 15, 6, 1. So (a + b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶.'
  - - Guided practice
    - Your student writes (x − y)⁴ and (m + n)⁵ (exercises 2 and 3) while you watch. For the minus sign, the even-numbered terms are negative.
