- roman: Arts. 133–136
  idx: 77
  unit: 3
  title: Common and least common denominators
  mins: 40
  goal: Your student rewrites fractions with a common denominator, and with the least common denominator.
  materials: *id001
  book: 'Case IV: the rule for a common denominator (multiply each fraction by all the other denominators), then the least common denominator using the L.C.M., and how to write an entire quantity or a fraction over a given denominator. Answers are printed.'
