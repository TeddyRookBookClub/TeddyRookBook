  - - Watch the pattern
    - 'Read Art. 183 and look at the powers of a + b up to the fifth. Ask: What do you notice about the number of terms, the exponents, the coefficients?'
  - - The four laws
    - 'Read Art. 184.

      ~ The number of terms in any power of a binomial is one greater than the exponent of the power.

      Then the law of coefficients:

      ~ If the coefficient of any term be multiplied by the exponent of the leading letter, and the product be divided by the number of that term from the left, the quotient will be the coefficient of the next term.'
