- roman: Arts. 97–102
  idx: 58
  unit: 2
  title: Greatest common divisor of monomials and numbers
  mins: 35
  goal: Your student finds the G.C.D. of monomials by prime factors, and of two numbers by repeated division.
  materials: *id001
  book: Common divisor and greatest common divisor defined, the rule for monomials with worked examples and exercises 3 to 6, three propositions about measures, and a worked explanation of finding the G.C.D. of 116 and 36 by division.
  steps:
  - - Warm-up
    - 'Ask: What is the largest number that divides both 8 and 12? (4.)'
  - - Definitions
    - 'Read Arts. 97 and 98.

      ~ A Common Divisor, or Common Measure, is any quantity that will exactly divide two or more quantities.

      Say: G.C.D. means greatest common divisor. It is the biggest thing that goes into all of them.'
  - - The rule for monomials
    - 'Read Art. 100 and its rule:

      ~ 1. Resolve the quantities into their prime factors.

      ~ 2. Take the product of those factors that are common to each of the terms for the greatest common divisor.

      Work the book''s first example: 6ab = 2 × 3ab and 15a²c = 3 × 5aac; the common factors are 3 and a, so the G.C.D. is 3a.'
  - - Guided practice
    - 'Work example 2 together (4a²x³, 6a³x² and 10a⁴x, G.C.D. 2a²x). Point out the note: for letters, take the lowest power that appears in all. Then your student does exercises 3 to 6, covering the answers.'
  - - The three propositions
    - 'Read Art. 101. Test each with numbers: 3 measures 6, so it measures 12 and 18; 3 measures 27 and 18, so it measures 45 and 9.'
  - - Division method for numbers
    - 'Read Art. 102 and work it on paper: 116 ÷ 36 = 3 remainder 8; 36 ÷ 8 = 4 remainder 4; 8 ÷ 4 = 2 remainder 0. The G.C.D. is 4. Your student then finds the G.C.D. of 84 and 120 the same way. (12.)'
  - - Wrap-up
    - 'Ask: Why must the G.C.D. of 116 and 36 also divide the remainder 8? (Proposition III: it measures their difference.)'
  answers: 'The book prints the answers to exercises 3 to 6. For the extra practice in the guide: the G.C.D. of 84 and 120 is 12.'
  tip: This is a shorter lesson. If time is left, review factoring trinomials from last session.
  num: 14
- roman: Arts. 103–106
  idx: 60
  unit: 2
  title: Greatest common divisor of polynomials
  mins: 45
  goal: Your student finds the G.C.D. of two polynomials, by factoring when possible and by repeated division when not.
  materials: *id001
  book: The division method for two polynomials, rules for canceling or multiplying factors along the way, four worked examples, the rule with seven notes, and exercises 5 to 13. Answers are printed.
  steps:
  - - Warm-up
    - 'Factor x² + 2x − 3 and x² + 5x + 6. ((x + 3)(x − 1) and (x + 2)(x + 3).) Ask: What factor do they share?'
  - - 'The easy way: factor first'
    - 'Read note 7 of the rule:

      ~ 7. Since the G.C.D. of two or more quantities contains all the factors common to these quantities, it may often be found most easily by separating the quantities into factors.

      So the warm-up pair has G.C.D. x + 3. That is exercise 8.'
  - - The division method
    - 'Read the rule:

      ~ 1. Divide the greater polynomial by the less, and if there is no remainder, the less quantity will be the divisor sought.

      ~ 2. If there is a remainder, divide the first divisor by it, and continue to divide the last divisor by the last remainder, until a divisor is obtained which leaves no remainder; this will be the greatest common divisor of the two given polynomials.

      Say: It is the same as the 116 and 36 example, but with polynomials.'
  - - Look at the worked examples
    - 'Read examples 1 to 3 on pp. 59 and 60. Point out the two tricks (Arts. 104 and 105): a factor in only one quantity may be canceled, and the dividend may be multiplied by a number to avoid fractions.'
  - - Guided practice
    - 'Your student does these while you watch, trying factoring first:

      ~ 8. x²+2x— 3 and x²+5x+6 Ans. x+3.

      Then exercise 5: 5a² + 5ax and a² − x². (5a(a + x) and (a + x)(a − x), so a + x.)'
  - - Independent practice
    - Exercises 6, 9, 10 and 13. Use factoring where it works; use division for the others.
  - - Check
    - Divide each original quantity by the G.C.D. found. Both must come out exactly.
  - - Wrap-up
    - 'Ask: How do you find the G.C.D. of three quantities? (Note 6: find it for two, then for that result and the third.)'
  answers: The book prints the answer after each exercise.
  tip: The long division method is hard work. If your student is struggling, spend the time on factoring; most of the exercises yield to it.
  num: 15
