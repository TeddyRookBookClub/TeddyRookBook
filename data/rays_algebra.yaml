- roman: Arts. 128–129
  idx: 72
  unit: 3
  title: Reducing fractions to lowest terms
  mins: 40
  goal: Your student reduces algebraic fractions by canceling common factors, including polynomial factors.
  materials: *id001
  book: 'Case I: the rule for lowest terms, with exercises where the common factor is a monomial and then where it is a polynomial, and division exercises whose quotients are fractions. Answers are printed (the fraction exercises are hard to read in the scan, so use the page image).'
  steps:
  - - Warm-up
    - Reduce 12/18 and 15/25. (2/3 and 3/5.)
  - - The rule
    - 'Read Art. 128.

      ~ Divide both terms by their greatest common divisor.

      ~ Or, Resolve the numerator and denominator into their prime factors, and then cancel those factors common to both terms.

      The book says the second way is generally most convenient.'
  - - Work the book's example
    - Example 1 writes the top and bottom as products, sets the common factor apart, and cancels it. Follow it on the page step by step, saying which factor is canceled.
  - - Polynomial factors
    - 'Read example 9 (3a³ − 3ab² over 5ab + 5b²): factor the top as 3a(a + b)(a − b) and the bottom as 5b(a + b), cancel a + b, leaving 3a(a − b)/5b.'
  - - Guided practice
    - Your student does exercises 2 and 3, then 11 and 13, factoring top and bottom before canceling anything. Compare with the printed answers.
  - - Division giving a fraction
    - 'Read Art. 129. Do exercise 5 together: x² + 2x − 3 divided by x² + 5x + 6 is (x + 3)(x − 1) over (x + 3)(x + 2), which is (x − 1)/(x + 2).'
  - - Independent practice
    - The remaining exercises of Arts. 128 and 129. Check two by putting x = 2 (or a = 2, b = 1) into the original and the answer.
  - - Wrap-up
    - 'Ask: Why can''t you cancel the x in (x + 3)/x? (Only factors can be canceled, not terms.)'
  answers: The book prints the answer after each exercise.
  tip: 'The big mistake here is canceling terms instead of factors. If you see it, go back to plain numbers: (2 + 3)/2 is not 3.'
