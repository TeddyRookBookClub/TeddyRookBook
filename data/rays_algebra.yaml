- roman: Arts. 130–132
  idx: 73
  unit: 3
  title: Mixed quantities and the signs of fractions
  mins: 40
  goal: Your student changes improper fractions to mixed quantities and back, and handles the minus sign before a fraction.
  materials: *id001
  book: Case II (fraction to entire or mixed quantity, exercises 1 to 7), Case III (mixed quantity to fraction), then the signs of fractions, with exercises 1 to 12 on p. 73. Answers are printed.
  steps:
