    - 'Read the rule:

      ~ Divide the numerator by the denominator for the entire part; and, if there be a remainder, place it over the denominator for the fractional part.

      Do exercise 1 together: (3ax + b²)/a = 3x + b²/a.'
  - - Case III
    - 'Read Art. 131 ("In 2 1/3, there are how many thirds?") and the rule:

      ~ Multiply the entire part by the denominator of the fraction. Add the numerator of the fractional part to this product, or subtract it, as the sign may direct, and place the result over the denominator.'
  - - Signs of fractions
    - 'Read Art. 132.

      ~ The signs prefixed to the terms of a fraction affect only those terms; but the sign placed before the dividing line of a fraction, affects its whole value.

      Say: When a minus sign stands before a fraction, it changes the sign of EVERY term in the numerator when you write it out.'
  - - Work an example together
    - 'Example 2 on p. 73: 4a − (a − b)/3c. Write 4a as 12ac/3c. Then 12ac − (a − b) = 12ac − a + b, over 3c. The + b is the point of the lesson.'
  - - Independent practice
    - Case II exercises 2 to 7 and the exercises on p. 73. Check against the printed answers.
  - - Wrap-up
    - 'Ask: Is −a/b the same as a/(−b)? As (−a)/(−b)? Test with a = 6, b = 2.'
  answers: The book prints the answer after each exercise.
  tip: Put parentheses around a numerator before subtracting it. That one habit prevents most sign errors in this chapter.
