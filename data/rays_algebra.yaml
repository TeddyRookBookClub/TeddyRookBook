      Example 1: a/b and c/d become ad/bd and bc/bd.'
  - - The least common denominator
    - 'Read Art. 134 and the rule:

      ~ 1. Find the least common multiple of all the denominators; this will be the common denominator.

      ~ 2. Divide the least common multiple by the first of the given denominators, and multiply the quotient by the first of the given numerators; the product will be the first of the required numerators.

