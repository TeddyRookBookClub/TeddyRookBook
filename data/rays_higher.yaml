    - '~ Find the 20th term of the arithmetical series 1, 4, 7, 10, etc.

      The difference 3 is added 19 times: 1 + 19 × 3 = 58. Formula: l = a + (n − 1)d. Try:

      ~ Find the 12th term of the series 3, 7, 11, etc.'
  - - Case II
    - '~ What is the sum of 9 terms of the series 1, 4, 7, 10, etc.?

      The book writes the series forward and backward. Each pair adds to 26, and there are 9 pairs, so twice the sum is 234 and the sum is 117.

      ~ Multiply the sum of the extremes by the number of terms, and divide by 2.'
  - - Guided practice
    - Find the sum of the whole numbers 1 to 10000, as one of the book's examples asks. Talk through why the trick works.
  - - Exercises in analysis
    - 'Read:

      ~ The following are presented as exercises in analysis

      Try together:

      ~ Find the common difference of a series whose extremes are 8 and 28, and number of terms, 6.

      ~ Insert one arithmetical mean between 8 and 54.'
  - - Independent practice and wrap-up
    - 'Your student works more of the exercises and checks the printed answers. Ask: How many terms are there from 10 to 500 counting by 5s?'
  practice: 'Two sittings: Cases I and II, then the exercises in analysis.'
