  goal: Your student finds any term and the sum of a geometrical series, including an endless one, and links it to compound interest and annuities.
  materials: *id003
  book: 'Geometrical progression: definition and five quantities, Case I (find an extreme), Case II (find the sum) with two rules, notes connecting compound interest and annuities, examples, finding the ratio and inserting means, and the topical outline of Series. Most answers are printed.'
  steps:
  - - Warm-up
    - 'Ask: What comes next: 1, 3, 9, 27, ...? What is happening each time?'
  - - The idea
    - 'Read:

      ~ A Geometrical Progression is a series in which any term after the first is the product of the preceding term by a fixed number.

      ~ Thus, 1, 3, 9, 27, is an ascending progression'
  - - Case I
    - '~ Find the 8th term of the series 1, 2, 4, 8, etc.

      1 × 2⁷ = 128.

      ~ Consider the given extreme as the first term, and multiply it by that power of the ratio whose degree is denoted by the number of terms less one.'
  - - Case II
    - '~ The first term is 3, the ratio 4, the number of terms 5; required the sum of the series.

      S = 3 + 12 + 48 + 192 + 768. Then 4S = 12 + 48 + 192 + 768 + 3072. Subtract: 3S = 3072 − 3, so S = 1023.

      ~ Find the last term and multiply it by the ratio; then find the difference between this product and the first term, and divide by the difference between the ratio and unity.'
  - - Endless series
    - 'Try:

      ~ Of 1, ½, ¼, etc.

      The terms shrink toward 0, so the sum comes as close as you like to 2.'
  - - Back to money
    - 'Read the book''s note: the amount of a debt at compound interest is the last term of a geometrical progression whose ratio is 1 + the rate. Work:

      ~ Find the amount of an annuity of $50, the time being 53 yr., the rate per cent 10.'
  - - Independent practice and wrap-up
    - 'Your student works a few more, including Example 12:

      ~ Calculate a table of amounts of an annuity of $1, for any number of years from 1 to 6, at 8%.

      Ask: Why does the sum of 1 + ½ + ¼ + ... never pass 2?'
  answers: 'Ex. 12 (no printed answer): amounts of $1 a year at 8%, for 1 to 6 years: $1; $2.08; $3.2464; $4.506112; $5.866601; $7.335929 (each year''s amount × 1.08, plus $1). Ex. 11 asks for a proof, not a number.'
- num: 119
  roman: Arts. 397–403
  idx: 383
  unit: 28
  title: Lines, angles, surfaces and polygons
  mins: 35
  goal: Your student uses the book's names for lines, angles, plane figures, triangles and quadrilaterals.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  - A ruler
  book: 'Chapter XXII, Mensuration: geometry and mensuration, kinds of lines, angles, surfaces and planes, polygons with pictures of regular polygons, kinds of triangles, and quadrilaterals and parallelograms.'
  steps:
  - - Warm-up
    - Ask your student to find a straight line, a curve, a right angle and a rectangle in the room.
  - - The idea
    - 'Read:

      ~ Geometry is that branch of mathematics which treats of quantity having extension and form.

      ~ Mensuration is the application of Arithmetic to Geometry

      ~ A line is that which has length only.

      ~ A straight line is the shortest distance between two points.'
  - - Surfaces and polygons
    - 'Read:

      ~ A Plane is a surface such that any two points in it can be joined by a straight line which lies wholly in the surface.

      ~ The application of a straight-edge is the test of a plane.

      ~ A polygon is a portion of a plane inclosed by straight lines; the perimeter of a polygon is the whole boundary.

      ~ A polygon is regular when it has all its sides equal, and all its angles equal.'
  - - Triangles
    - 'Read:

      ~ A triangle is scalene when it has no equal sides; isosceles, when it has two equal sides; and equilateral, when its three sides are equal.

      Have your student draw one of each.'
  - - Quadrilaterals
    - 'Read:

      ~ A Trapezoid is a quadrilateral having two and only two sides parallel.

      ~ A Parallelogram is a quadrilateral having two pairs of parallel sides.

      ~ A Rhombus is a parallelogram whose four sides are equal.

      Note that in this book a trapezium has no parallel sides at all.'
  - - Wrap-up
    - 'Play a naming game: you describe a shape ("four equal sides, no right angle"), and your student names it (a rhombus).'
- num: 120
