      So for √1764: the tens are 4 (1600). The 164 left over is (80 + units) × units. Try 2: 82 × 2 = 164. The root is 42.'
  - - The rule
    - 'Read the first steps:

      ~ Point off the number into periods of two figures each, commencing with units.

      ~ Find the greatest square in the first period on the left; place its root on the right, like a quotient in division.

      ~ Double the root already found, as if it were units, and write it on the left for a trial divisor.

      Work √11881 together, following the rule step by step.'
  - - Notes
    - 'Read:

      ~ If any product be found too large, the last figure of the root is too large.

      ~ The number of decimal places in the power must be even.

      Say: For decimals, pair off from the decimal point both ways, adding a zero if needed.'
  - - Practice
    - Your student works several of the examples, such as √1444, √3444736 and √57600, then √3 to seven decimal places.
  - - Products and fractions
    - 'Read:

      ~ The square root of a common fraction is equal to the square root of the numerator, divided by the square root of the denominator.

      ~ It is advantageous to multiply both terms by what will render the denominator a square.

      Try one fraction example from the book.'
  - - Check and wrap-up
    - 'Check the printed answers by squaring each root. Ask: How do you know √3 can never come out exactly?'
