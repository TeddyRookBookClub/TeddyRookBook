    - 'Read:

      ~ The base is equal to the amount divided by 1 plus the rate

      Work the book''s examples: A rents a house for $377, an advance of 16% on last year: $377 ÷ 1.16 = $325. John has $136, which is 20% less than Joseph''s: $136 ÷ .80 = $170.'
  - - A common trap
    - 'Ask: If a price rises 20% and then falls 20%, is it back where it started? (No: 100 → 120 → 96.) This is why Case IV divides instead of subtracting.'
  - - Independent practice
    - 'Your student works a selection, including:

      ~ 2576 bu. is 60% less than what?

      (6440 bu.)'
  - - Formulas and applications
    - 'Read:

      ~ By definition, A = B + P ; also, D = B — P.

      The book then divides the applications of percentage into those where time does not matter (profit and loss, stocks, commission, insurance, taxes...) and those where it does (interest, discount...).'
  - - Wrap-up
    - 'Look over the topical outline. Ask: Which of these applications have you seen in real life?'
  practice: 'Two sittings: Case III one day, Case IV and the extra examples the next.'
