- num: 62
  title: Compound proportion
  roman: Arts. 232–233
  idx: 189
  unit: 13
  mins: 45
  goal: Your student solves problems with several conditions by compound proportion or by cause and effect.
  materials: *id001
  book: Compound proportion defined, the rule, the example of men mowing acres, the method of cause and effect with its rule and the fence example, and examples for practice with printed answers (the use of money, travelers, bricks and tiles, pipes filling a cistern).
  steps:
  - - Warm-up
    - 'Ask: If 2 men dig a ditch in 6 days, how long for 4 men? (3 days.) And if the ditch were twice as long?'
