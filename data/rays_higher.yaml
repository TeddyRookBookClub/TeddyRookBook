    - 'Answers are printed; the scan of the addition answers is faint, so add the numbers back in a different order to check. Read the book''s remark:

      ~ The proof of each fundamental operation in Compound Numbers is the same as in Simple Numbers.'
  - - Wrap-up
    - 'Ask: When you borrow from the feet column to the inches column, how many do you add? (12.)'
  practice: 'Two sittings: addition one day, subtraction the next.'
