  - - How business ran
    - In the 1880s a farmer or factory far from a big city shipped goods to an agent in Cincinnati, New York or New Orleans. The agent sold them, took a commission, paid freight and storage, and sent back the net proceeds. The examples (flour, pork, sugar in hogsheads, "hhd.") come from that trade.
