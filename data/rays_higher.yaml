      Work the book''s example: At the rate of 53 miles an hour, how far will a railroad car run in four hours? (212 miles.)'
  - - Guided practice
    - 'Together:

      ~ 1. 195 X 3.

      ~ 10. If 4 men can perform a certain piece of work in 15 days, how long will it require 1 man?

      (585; 60 days.)'
  - - Independent practice
    - Your student works the 14 examples under Case I. The book prints all the answers.
  - - Wrap-up
    - 'Ask: Why does 1 man need longer than 4 men? (He does all the work alone, so 4 times as many days.)'
