- num: 39
  title: 'Decimal fractions: notation'
  roman: Arts. 147–156
  idx: 104
  unit: 9
  mins: 40
  goal: Your student explains what a decimal is, names the decimal places to billionths, and reads and writes decimals.
  materials: *id001
  book: Decimal fraction defined, decimal places, the decimal point, pure, mixed and complex decimals, three principles about moving the point and annexing ciphers, the table of decimal orders, rules for reading and writing decimals, examples to read, and seven examples to write (no answers printed).
  steps:
  - - Warm-up
    - 'Ask: How do you write 3 dimes as part of a dollar? ($.30.) 7 cents? ($.07.)'
  - - The idea
    - 'Read:

      ~ A Decimal Fraction is a fraction whose denominator is 10, or some product of 10

      ~ The orders of integers decrease from left to right in a tenfold ratio

      ~ The places at the right of units are called decimal places'
  - - Kinds and principles
    - 'Read:

      ~ A pure decimal consists of decimal places only

      ~ A mixed decimal consists of a whole number and a decimal written together

      ~ Decimal ciphers may be annexed to, or omitted from, the right of any number without altering its value.

      Show: .5 = .50 = .500. Moving the point one place right multiplies by 10: .032 becomes .32.'
  - - Reading
    - 'Read the rule:

      ~ Read the number expressed in the decimal places as the numerator

      then give it the name of the last place. Work the book''s example: .0325 is three hundred and twenty-five ten-thousandths. Your student reads the examples on the page.'
  - - Writing
    - 'Read:

      ~ Write the numerator as a whole number; then place the decimal point so that the right-hand figure

      stands in the place named. The book''s example: eighty-three thousand and one billionths = .000083001.'
  - - Independent practice
    - 'Your student writes the seven Examples to be Written, beginning:

      ~ Five tenths.

      ~ Twenty-two hundredths.

      Answers are below; the book prints none.'
  - - Wrap-up
    - 'Ask: Is .5 bigger than .45? (Yes: .50 against .45.)'
  answers: 'Examples to be written: 1) .5  2) .22  3) .104  4) 2.01  5) .1605  6) .00087  7) .0000029½'
- num: 40
  title: Changing decimals and common fractions
  roman: Arts. 157–159
  idx: 108
  unit: 9
  mins: 35
  goal: Your student changes decimals to common fractions in lowest terms, and common fractions to decimals.
  materials: *id001
  book: 'Reduction of decimals: Case I, a decimal to a common fraction (examples .24 and .12½), and Case II, a common fraction to a decimal (7/8 = .875), with a note on fractions that never end, and examples with printed answers.'
  steps:
  - - Warm-up
    - 'Mental: .5 as a fraction; 1/4 as a decimal.'
  - - The idea
    - 'Read:

      ~ Reduction of decimals is changing their form without altering their value.'
  - - Decimal to fraction
    - 'Read:

      ~ Write the decimal as a common fraction; then reduce the fraction to its lowest terms.

      Work the book''s examples: .24 = 24/100 = 6/25. And .12½ = 12½/100 = 25/200 = 1/8.'
  - - Fraction to decimal
    - 'Read:

      ~ Annex ciphers to the numerator and divide it by the denominator.

      ~ Then point off as many decimal places in the quotient as there are ciphers annexed.

      Work 7/8: 7.000 ÷ 8 = .875.'
  - - When it never ends
    - 'The book notes that a fraction in lowest terms whose denominator has a prime factor other than 2 or 5

      ~ can not be reduced exactly to a decimal.

      Try 1/3 and 1/6 and watch the figures repeat. (Circulating decimals come in a later chapter.)'
  - - Independent practice
    - Your student works the examples under both cases.
  - - Check
    - Answers are printed; some are hard to read in the scan, so check fraction-to-decimal answers by dividing again.
  - - Wrap-up
    - 'Ask: Will 3/40 make an ending decimal? (Yes: 40 = 2 × 2 × 2 × 5. It is .075.)'
- num: 41
  title: Adding and subtracting decimals
  roman: Arts. 160–161
  idx: 110
  unit: 9
  mins: 40
  goal: Your student adds and subtracts decimals, lining up the points and annexing ciphers where needed.
  materials: *id001
  book: Addition of decimals (definition, a worked example with complex decimals, the rule, and 14 examples) and subtraction of decimals (definition, the example 6.8 − 2.057, the rule, notes, and 16 examples). Answers are printed.
  steps:
  - - Warm-up
    - 'Mental: $2.50 + $1.75; $5 − $1.35.'
  - - Adding
    - 'Read:

      ~ Addition of Decimals is finding the sum of two or more decimals.

      ~ Write the numbers so that figures of the same order shall stand in the same column.

      The point in the sum goes right under the other points. Try one of the book''s:

      ~ Of 4 units, 4 tenths, 4 hundredths.

      (4.44.)'
  - - Subtracting
    - 'Read:

      ~ Subtraction of Decimals is finding the difference between two decimals.

      ~ If the minuend has not as many decimal places as the subtrahend, annex decimal ciphers to it.

      Work the book''s example: From 6.8 subtract 2.057. Write 6.800 − 2.057 = 4.743.'
  - - Guided practice
    - 'Together:

      ~ Subtract 8.00717 from 19.54

      ~ 3 thousandths from 3000.

      (11.53283; 2999.997.)'
  - - Independent practice
    - Your student works a selection of both sets of examples.
  - - Check
    - 'Read:

      ~ The proof of each fundamental operation in decimals is the same as in simple numbers.

      Check subtraction by adding back. Answers are printed.'
  - - Wrap-up
    - 'Ask: Why line up the points instead of the right-hand figures? (So tenths stand under tenths, the same rule as for whole numbers.)'
- num: 42
  title: Multiplying decimals
  roman: Arts. 162–163
  idx: 113
  unit: 9
  mins: 40
  goal: Your student multiplies decimals and places the point, and knows the idea of a shortened product kept to a set number of places.
  materials: *id001
  book: Multiplication of decimals (definition, the example 2.56 × .184, rule, remarks, examples) and Oughtred's method for keeping only a set number of decimal places (example 3.8640372 × 1.2479603 to seven places), with examples. Answers are printed.
  steps:
  - - Warm-up
    - 'Mental: .5 × 6; .3 × .3; 2.5 × 4.'
  - - The idea
    - 'Read:

      ~ Multiplication of Decimals is finding the product when either or when each of the factors is a decimal.

      ~ Point off as many decimal places in the product as there are decimal places in the two factors.'
  - - Work the book's example
    - '2.56 × .184: as whole numbers 256 × 184 = 47104. Two places plus three places is five: .47104. The book shows why: 256/100 × 184/1000 = 47104/100000.'
  - - Guided practice
    - 'Together:

      ~ 64.01 X .32

      ~ .0001 X 1.006

      (20.4832; .0001006, where ciphers are prefixed to fill the places.)'
  - - Contracted multiplication
    - 'Read Oughtred''s method:

      ~ may be used when the product of two decimals is required for a definite number of decimal places less than is found in both factors.

      Walk through the book''s worked example slowly. It is mostly of historical interest now; one example is enough.'
  - - Independent practice
    - Your student works a selection of the ordinary examples.
  - - Check
    - Answers are printed.
  - - Wrap-up
    - 'Ask: Why is .3 × .3 = .09 and not .9? (Tenths of tenths are hundredths.)'
  tip: Contracted multiplication was a time-saver before calculators. Treat it as optional enrichment.
- num: 43
  title: Dividing decimals
  roman: Arts. 164–166
  idx: 116
  unit: 9
  mins: 40
  goal: Your student divides decimals, places the point in the quotient, and annexes ciphers to carry the division further.
  materials: *id001
  book: 'Division of decimals: definition, two principles (the worked example .50312 ÷ .19), the rule and note on annexing ciphers (examples .36 ÷ .008 and .002475 ÷ .066), examples, then Oughtred''s shortened division (84.27 ÷ 1.27395807 to four places) with more examples. Answers are printed.'
  steps:
  - - Warm-up
    - 'Mental: 6 ÷ .5; 1.2 ÷ 4; .36 ÷ .6.'
  - - The idea
    - 'Read:

      ~ Division of Decimals is the process of finding the quotient when either or when each term is a decimal.

      ~ The dividend must contain as many decimal places as the divisor.

      The quotient gets the difference: dividend places minus divisor places.'
  - - Work the book's examples
    - '.50312 ÷ .19: 50312 ÷ 19 = 2648; 5 places − 2 places = 3, so 2.648. Next, .36 ÷ .008: annex a cipher so the dividend has three places, .360; 360 ÷ 8 = 45.'
  - - Going on
    - 'Read:

      ~ When the division is not exact, annex ciphers to the dividend, and carry the work as far as may be necessary.'
  - - Guided practice
    - 'Together, the first two examples:

      ~ 63 ÷ 4000

      ~ 3.15 ÷ 375

      (.01575; .0084.)'
  - - Independent practice
    - Your student works a selection of the examples. Try one of the contracted division examples if there's time.
  - - Check
    - Answers are printed. Check one by multiplying quotient × divisor.
  - - Wrap-up
    - 'Ask: Why does dividing by .5 make a number bigger? (There are two halves in every unit.)'
- num: 44
  title: 'Circulating decimals: what they are'
  roman: Arts. 167–171
  idx: 120
  unit: 10
  mins: 35
  goal: Your student explains why some fractions make repeating decimals, finds the repetend, and uses the words circulate, repetend, pure and mixed.
  materials: *id001
  book: Why some decimals never end (two principles), the example 1/7 = .142857 repeating, the definitions of circulate and repetend (pure, mixed, simple, compound, similar, perfect), and remarks on extending repetends and making them similar.
  steps:
  - - Warm-up
    - Divide 1 by 3, then 1 by 7, as far as your student likes. What happens?
  - - Why they repeat
    - 'Read:

      ~ In reducing common fractions to decimals, the process, in some cases, does not terminate.

      The book explains: every remainder is less than the divisor, so sooner or later a remainder comes back, and then the figures repeat. Follow the division of 1/7 on the page: .142857, then 1 again.'
  - - The words
    - 'Read:

      ~ A Circulate or Circulating Decimal has one or more figures constantly repeated in the same order.

      ~ A Repetend is the figure or set of figures repeated

      The book marks the repetend with dots over its first and last figures.'
  - - Making repetends alike
    - 'Read:

      ~ Dissimilar repetends can be made similar, by carrying the dots forward

      Show: .3 repeating can be written .33 repeating, and a repetend can start later: 5.1836 (with 836 repeating) = 5.183683 (with 683 repeating).'
  - - Practice
    - Your student turns 1/11, 2/3, 5/6 and 3/13 into circulates and marks each repetend.
  - - Wrap-up
    - 'Read:

      ~ Circulating decimals may be added, subtracted, multiplied, and divided as other fractions.'
  tip: Circulating decimals are now a side topic. One or two sessions are plenty; the main idea is that every fraction makes either an ending or a repeating decimal.
  answers: 'Practice: 1/11 = .09 repeating (09); 2/3 = .6 repeating; 5/6 = .83 with 3 repeating; 3/13 = .230769 repeating (230769).'
- num: 45
  title: Working with circulates
  roman: Arts. 172–177
  idx: 123
  unit: 10
  mins: 40
  goal: Your student changes a pure circulate to a common fraction and knows how circulates are added, subtracted, multiplied and divided.
  materials: *id001
  book: Case I, a pure circulate to a fraction (.53 repeating = 53/99), Case II, a mixed circulate, then addition, subtraction, multiplication and division of circulates, each with a rule and examples. Pages 119, 121 and 124 were not checked for this guide; many answers are hard to read in the scan.
  steps:
  - - Warm-up
    - 'Ask: What fraction is .333... ? (1/3.) And .999... ? (Discuss: it equals 1.)'
  - - Pure circulate to a fraction
    - 'Read:

      ~ Write the repetend for the numerator, omitting the decimal point and the dots

      and for the denominator as many 9s as there are figures in the repetend. The book''s reason: 100 × .5353... − .5353... = 53, so 99 times the number is 53. Answer 53/99.'
  - - Adding
    - 'Read:

      ~ Make the repetends similar, if they be not so; add, and point off as in ordinary decimals.

      The book also says to carry into the last column whatever would come from the next repetition.'
  - - Multiplying and dividing
    - 'Read:

      ~ If the multiplier contain a repetend, change it to a common fraction.

      ~ Change the terms to common fractions; then divide as in division of fractions, and reduce the result to a repetend.

      The book calls fractions the easiest method for division.'
  - - Guided practice
    - 'Change to fractions: .27 repeating (27/99 = 3/11); .142857 repeating (1/7). Then add 1/3 + 3/11 as fractions and turn the sum back into a circulate.'
  - - Independent practice
    - 'Your student tries a few of the book''s subtraction examples (answers printed), such as:

      ~ Subtract .0074 from .26'
  - - Wrap-up
    - 'Ask: Which is easier, working with circulates directly or changing them to fractions first? Most people choose fractions, as the book does.'
  answers: 'Guided practice: 1/3 + 3/11 = 20/33 = .60 repeating (60).'
- num: 46
  title: Measures, value and United States money
  roman: Arts. 178–181
  idx: 130
  unit: 11
  mins: 35
  goal: Your student explains what a measure and a compound number are, the kinds of value, and reads and writes U. S. money in dollars, cents and mills.
  materials: *id001
  book: Compound denominate numbers defined; measures of value (intrinsic, commercial, nominal; money and currency); United States money with its table (mills, cents, dimes, dollars, eagles), history notes, a table of the coins of 1880 and their metals and weights, and how to read sums of money.
  steps:
  - - Warm-up
    - 'Ask: How many cents in $3.07? How many dimes in a dollar?'
  - - Measures
    - 'Read:

      ~ A Measure is a standard unit used in estimating quantity.

      ~ A quantity is measured by finding how many times it contains the unit.

      ~ A Compound Denominate Number is one expression of a quantity by different denominations under one kind of measure

      Example: 3 ft. 7 in. is a compound number; 43 in. is not.'
  - - Value and money
    - 'Read:

      ~ Value is the worth of one thing as compared with another.

      ~ Money is a standard of value, and is the medium of exchange.

      Ask: What''s the difference between what a thing cost to make and what it would sell for? (The book''s intrinsic and commercial value.)'
  - - U. S. money
    - 'Read:

      ~ United States Money is the legal currency of the United States.

      The table: 10 mills = 1 cent, 10 cents = 1 dime, 10 dimes = 1 dollar, 10 dollars = 1 eagle.

      ~ The mill is not coined.

      ~ It is used only in calculations.'
  - - Old coins
    - 'Look at the coin table together: in 1880 there were 3-cent pieces, gold dollars, quarter eagles ($2.50), three-dollar pieces, half eagles, eagles and double eagles. Gold and silver coins were 9 parts precious metal to 1 part copper.'
  - - Practice
    - The book reads $9.124 as "9 dollars 12 ct. 4 mills". Your student reads $14.065, $0.375 and $100.009 the same way, and writes 6 eagles 3 dollars 4 dimes 5 cents as dollars.
  - - Wrap-up
    - 'Ask: Why is U. S. money easy to calculate with? (It is decimal: every step is ten.)'
  answers: 'Practice: $14.065 = 14 dollars 6 ct. 5 mills; $0.375 = 37 ct. 5 mills; $100.009 = 100 dollars 9 mills. 6 eagles 3 dollars 4 dimes 5 cents = $63.45.'
- num: 47
  title: English, French and German money
  roman: Arts. 182–184
  idx: 133
  unit: 11
  mins: 30
  goal: Your student reads the old English money table (pounds, shillings, pence, farthings) and knows the franc and mark of 1880 and their values in U. S. money.
  materials: *id001
  book: English or sterling money with its table and Latin abbreviations, French money (francs and centimes) and German money (marks and pfennige), each with its 1880 value in U. S. money.
  steps:
  - - Warm-up
    - 'Ask: How many pennies make a pound in Britain today? (100.) In 1880 it was 240.'
  - - Sterling
    - 'Read:

      ~ The pound sterling (worth $4.8665 in U. S. money) is the unit.

      The table: 4 farthings = 1 penny, 12 pence = 1 shilling, 20 shillings = 1 pound. The signs £, s., d. come from the Latin words for pound, shilling and penny. This system lasted until 1971.'
  - - Francs and marks
    - 'Read:

      ~ The franc (worth 19.3 cents in U. S. money) is the unit.

      ~ The mark, or reichsmark (worth 23.8 cents in U. S. money), is the unit.

      Both were decimal: 100 centimes to the franc, 100 pfennige to the mark.'
  - - Practice
    - 'Your student works out: How many pence in £2 5s.? How many farthings in 1 shilling? What was 10 francs worth in U. S. money? What was £1 worth in marks, to the nearest mark?'
  - - Talk about it
    - 'Ask: Which of the three systems is easiest to calculate with, and why? (The decimal ones.)'
  - - Wrap-up
    - Your student writes the English money table from memory.
  tip: These exchange values are the book's 1880 figures, not today's.
  answers: 'Practice: £2 5s. = 540 pence; 1 shilling = 48 farthings; 10 francs = $1.93; £1 = $4.8665 ÷ $0.238 ≈ 20.4, about 20 marks.'
- num: 48
  title: Measures of weight
  roman: Arts. 185–190
  idx: 135
  unit: 11
  mins: 35
  goal: Your student knows which things were weighed by troy, apothecaries' and avoirdupois weight, and uses each table.
  materials: *id001
  book: Weight defined; troy weight (grains, pennyweights, ounces, pounds), apothecaries' weight (grains, scruples, drams, ounces, pounds), avoirdupois weight (ounces, pounds, hundredweights, tons), a comparison of the three, old British weights, and diamond weight.
  steps:
  - - Warm-up
    - 'Ask: Which is heavier, a pound of feathers or a pound of gold? (In the old system, the pound of feathers! Keep reading.)'
  - - Weight
    - 'Read:

      ~ Weight is the measure of the force called gravity, which draws bodies toward the center of the earth.

      ~ Three kinds of weight are in use'
  - - Troy and apothecaries'
    - 'Read:

      ~ Troy Weight is used in weighing gold, silver, platinum, and jewels.

      Table: 24 grains = 1 pennyweight, 20 pwt. = 1 ounce, 12 oz. = 1 pound.

      ~ Apothecaries'' Weight is used by physicians and apothecaries in prescribing and mixing dry medicines.

      It uses the same grain, ounce and pound, with scruples and drams in between.'
  - - Avoirdupois
    - 'Read:

      ~ Avoirdupois or Commercial Weight is used for weighing all ordinary articles.

      Table: 16 oz. = 1 lb., 100 lb. = 1 cwt. (hundredweight), 20 cwt. = 1 ton.'
  - - Comparison
    - 'Read:

      ~ The pound Avoirdupois weighs 7,000 grains Troy

      The troy pound is 5760 grains. So a pound of feathers (avoirdupois) is heavier than a pound of gold (troy). But an ounce of gold (480 grains) is heavier than an ounce of feathers (437½ grains).'
  - - Practice
    - 'Your student finds: grains in 2 lb. troy; pounds in 3½ tons; how many troy ounces are in an avoirdupois pound.'
  - - Wrap-up
    - 'The book also notes the British long ton of 2240 lb. used for coal and iron. Ask: Which ton is used in the U. S. table? (2000 lb.)'
  tip: Troy ounces are still used for gold and silver prices today.
  answers: 'Practice: 2 lb. troy = 11520 grains; 3½ tons = 7000 lb.; 1 lb. avoirdupois = 7000 ÷ 480 = 14 7/12 troy ounces.'
- num: 49
  title: Measures of length and surface
  roman: Arts. 191–198
  idx: 138
  unit: 11
  mins: 40
  goal: Your student uses the tables of long measure, chain measure, mariners' measure and square and surveyors' measure, including acres and sections.
  materials: *id001
  book: Extension defined; long or linear measure (inches to miles, with rods), chain measure (links and chains), mariners' measure (fathoms, cable-lengths), the old cloth measure, square measure, and surveyors' measure for land (acres, sections, townships).
  steps:
  - - Warm-up
    - 'Ask: How many feet in a mile? (5280.) How many inches in a yard?'
  - - Length
    - 'Read:

      ~ Extension is that property of matter by which it occupies space.

      ~ Linear Measure is used in measuring distances, or length, in any direction.

      Table: 12 in. = 1 ft., 3 ft. = 1 yd., 5½ yd. = 1 rod, 320 rd. = 1 mile.'
  - - Surveyors and sailors
    - 'Read:

      ~ Chain Measure is used by surveyors in measuring land, laying out roads, establishing boundaries, etc.

      (7.92 inches = 1 link, 100 links = 1 chain, 80 chains = 1 mile)

      ~ Mariners'' Measure is used in measuring the depth of the sea, and also distances on its surface.

      (6 feet = 1 fathom)'
  - - Surface
    - 'Read:

      ~ Superficial Measure is used in estimating the numerical value of surfaces

      Table: 144 sq. in. = 1 sq. ft., 9 sq. ft. = 1 sq. yd., 30¼ sq. yd. = 1 sq. rd., 160 sq. rd. = 1 acre.'
  - - Land
    - 'Read:

      ~ Surveyors'' Measure is a kind of superficial measure, which is used chiefly in government surveys.

      640 acres = 1 square mile (a section); 36 square miles = 1 township. Much of the American Midwest was surveyed this way, which is why so many roads run in a grid a mile apart.'
  - - Practice
    - 'Your student finds: rods in a mile and a half; square feet in an acre (43560, as the table shows); acres in a quarter section.'
  - - Wrap-up
    - 'Ask: Why is a square rod 30¼ square yards? (5½ × 5½.)'
  answers: 'Practice: 1½ miles = 480 rods; 1 acre = 43560 sq. ft.; a quarter section = 160 acres.'
- num: 50
  title: Solids, capacity and angles
  roman: Arts. 199–204
  idx: 143
  unit: 11
  mins: 40
  goal: Your student uses cubic measure, the cord, liquid and dry measure, and the table of angular measure.
  materials: *id001
  book: Solid or cubic measure (cubic inches, feet, yards; the cord of wood and perch of stone), measures of capacity (liquid measure, apothecaries' fluid measure, dry measure with the Winchester bushel), a comparison of the gallon and bushel in cubic inches, and angular or circular measure (seconds, minutes, degrees).
  steps:
  - - Warm-up
    - 'Ask: How many small cubes 1 inch on a side fit in a box 12 inches each way? (1728.)'
  - - Solids
    - 'Read:

      ~ A Solid has length, breadth, and thickness.

      ~ A Cube is a solid, bounded by six equal squares, called faces.

      Table: 1728 cu. in. = 1 cu. ft., 27 cu. ft. = 1 cu. yd. A cord of firewood is 128 cubic feet (a pile 8 ft. long, 4 ft. wide, 4 ft. high).'
  - - Capacity
    - 'Read:

      ~ Capacity means room for things.

      Liquid measure: 4 gills = 1 pint, 2 pt. = 1 quart, 4 qt. = 1 gallon, and a gallon holds 231 cubic inches.

      ~ Dry Measure is used for measuring grain, fruit, vegetables, coal, salt, etc.

      2 pt. = 1 qt., 8 qt. = 1 peck, 4 pk. = 1 bushel.'
  - - Medicine
    - 'Read:

      ~ Apothecaries'' Fluid Measure is used for measuring all liquids that enter into the composition of medical prescriptions.

      60 minims = 1 fluid drachm, 8 fluid drachms = 1 fluid ounce. Just look; no need to learn it.'
  - - Angles
    - 'Read:

      ~ A plane angle is the difference of direction of two straight lines which meet at a point.

      ~ Every circumference contains 360 degrees.

      Table: 60" = 1'', 60'' = 1°, 360° = 1 circumference. A right angle is 90°.'
  - - Practice
    - 'Your student finds: cubic feet in a wood pile 16 ft. long, 4 ft. wide, 4 ft. high, and how many cords that is; pints in 3 bushels; minutes in a right angle.'
  - - Wrap-up
    - 'Ask: Is a liquid quart the same as a dry quart? (No; the book''s comparison table shows the dry quart is larger.)'
  answers: 'Practice: 16 × 4 × 4 = 256 cu. ft. = 2 cords; 3 bu. = 192 pints; a right angle = 5400 minutes.'
- num: 51
  title: Time, longitude and other tables
  roman: Arts. 205–208
  idx: 148
  unit: 11
  mins: 40
  goal: Your student uses the table of time, applies the leap-year rule, knows that 15° of longitude make 1 hour, and reads the paper and counting tables.
  materials: *id001
  book: Measure of time (solar, mean solar, civil and astronomical days; the table; the length of the solar year), the rule for leap years with a note on the Julian and Gregorian calendars, the comparison of time and longitude, and miscellaneous tables (books and paper, counting, barrels and other units).
  steps:
  - - Warm-up
    - 'Ask: How many seconds in a day? (86400.)'
  - - Days
    - 'Read:

      ~ Time is a measured portion of duration.

      ~ The Solar Day is the interval of time between two successive passages of the sun over the same meridian.

      ~ The Civil Day, used for ordinary purposes, commences at midnight and closes at the next midnight.

      The book gives the solar year as 365 da. 5 hr. 48 min. 46.05 sec., or about 365¼ days.'
  - - Leap years
    - 'Read:

      ~ Every year that is divisible by 4 is a leap year, unless it ends with two ciphers

      and a year ending in two ciphers is a leap year only if it divides by 400. The book''s note: Pope Gregory XIII corrected the calendar in 1582, and England adopted it in 1752. Ask: Were 1900 and 2000 leap years? (1900 no; 2000 yes.)'
  - - Time and longitude
    - 'Read:

      ~ The longitude of a place is its distance in degrees, minutes, and seconds, east or west of an established meridian.

      The earth turns 360° in 24 hours, so 15° of longitude = 1 hour of time, 15'' = 1 minute, 15" = 1 second.'
  - - Other tables
    - 'Read:

      ~ The words folio, quarto, octavo, etc., used in speaking of books, show how many leaves a sheet of paper makes.

      Also: 24 sheets = 1 quire, 20 quires = 1 ream; 12 = 1 dozen, 144 = 1 gross, 20 = 1 score.'
  - - Practice
    - 'Your student finds: minutes in a week; which of 1800, 1880, 1896 and 2100 are leap years; how many sheets in a ream.'
  - - Wrap-up
    - 'Ask: If the sun is overhead here, where on earth is it overhead one hour later? (15° farther west.)'
  answers: 'Practice: 1 week = 10080 minutes; leap years: 1880 and 1896 (1800 and 2100 are not); 1 ream = 480 sheets.'
- num: 52
  title: The metric system
  roman: Arts. 209–217
  idx: 152
  unit: 11
  mins: 40
  goal: Your student names the metric units and prefixes, converts within the metric system by moving the point, and uses the book's table of metric and U. S. values.
  materials: *id001
  book: 'The metric system: its history, the units (meter, ar, liter, gram, and others), the prefixes milli, centi, deci, deka, hekto, kilo and myria, tables of length, surface, capacity and weight, and a table of legal and approximate U. S. values. A topical outline of the measures closes the section.'
  steps:
  - - Warm-up
    - 'Ask: How many centimeters in a meter? Millimeters in a meter?'
  - - The idea
    - 'Read:

      ~ The Metric System is an outgrowth of the French Revolution of 1789.

      ~ The Metric System is a decimal system of weights and measures.

      The book''s spelling is a little different from ours: ar for are, hektometer for hectometer.'
  - - Prefixes
    - 'Read the list: milli .001, centi .01, deci .1; deka 10, hekto 100, kilo 1000, myria 10000. Your student makes a chart from the smallest to the largest.'
  - - Units
    - 'Read:

      ~ The Meter is the unit of Length, and is the denomination used in all ordinary measurements.

      ~ The Ar (pro. ar) is the unit of Land Measure; it is a square, each side of which is 10 meters

      ~ The Liter (pro. le''ter) is the unit of Capacity.

      ~ The Gram (pro. gram) is the unit of Weight.'
  - - U. S. values
    - 'Read:

      ~ The following table presents the legal and approximate values of those denominations

