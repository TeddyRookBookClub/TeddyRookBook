- num: 36
  title: Dividing fractions and complex fractions
  roman: Arts. 143–144
  idx: 95
  unit: 8
  mins: 40
  goal: Your student divides with fractions by inverting the divisor, and simplifies complex fractions.
  materials: *id001
  book: Division of fractions in three cases, the rule (multiply by the divisor inverted), the reason for inverting, 25 examples with answers, then reducing complex fractions to simple ones (Art. 144) with 10 examples.
  steps:
  - - Warm-up
    - 'Mental: How many halves in 3? How many quarters in 3/4?'
  - - The idea
    - 'Read:

      ~ Division of Fractions is finding the quotient when the dividend or divisor is fractional, or when both are fractional.

      ~ Multiply the dividend by the divisor with its terms inverted.'
  - - Why invert
    - 'The book''s first method brings both fractions to a common denominator and divides the numerators: 3/4 ÷ 2/3 = 9/12 ÷ 8/12 = 9 ÷ 8 = 9/8. Then:

      ~ The same result is obtained by multiplying the dividend by the divisor, with its terms inverted.'
  - - Mixed numbers
    - 'Read:

      ~ Mixed numbers must be reduced to improper fractions. Use cancellation when applicable.'
  - - Complex fractions
    - 'A complex fraction has a fraction in one or both terms. Read:

      ~ Divide the numerator by the denominator, as in division of fractions.

      Work (2½)/(3¾) = 5/2 ÷ 15/4 = 5/2 × 4/15 = 2/3.'
  - - Independent practice
    - Your student works a selection of the 25 division examples and the complex fraction examples.
  - - Check
    - Answers are printed.
  - - Wrap-up
    - 'Ask: Is 6 ÷ 1/2 bigger or smaller than 6? (Bigger: 12. There are 12 halves in 6.)'
  tip: The scan's small printed fractions are often hard to read. Keep the paper book or a clear copy of the page open when your student works the examples.
- num: 37
  title: G. C. D. and L. C. M. of fractions
  roman: Arts. 145–146
  idx: 97
  unit: 8
  mins: 40
  goal: Your student finds the greatest common divisor and least common multiple of fractions and solves practical problems with them.
  materials: *id001
  book: The greatest common divisor of fractions (definition, principle, rule, 8 examples, including the largest sacks for shipping grain and fence rails) and the least common multiple of fractions (definition, rule, 4 examples, including walkers who meet again). Answers are printed.
  steps:
  - - Warm-up
    - 'Mental: G. C. D. of 12 and 18; L. C. M. of 4 and 6.'
  - - G. C. D.
    - 'Read:

      ~ The greatest common divisor of two or more fractions is the greatest fraction that will exactly divide each of them.

      ~ Find the G. C. D. of the numerators of the fractions, and divide it by the L. C. M. of their denominators.

      Try 3/4 and 9/10: G. C. D. of 3 and 9 is 3; L. C. M. of 4 and 10 is 20. Answer 3/20. Check: 3/4 ÷ 3/20 = 5, and 9/10 ÷ 3/20 = 6.'
  - - L. C. M.
    - 'Read:

      ~ The least common multiple of two or more fractions is the least number that each of them will divide exactly.

      ~ Divide the L. C. M. of the numerators by the G. C. D. of the denominators.

      And the note:

      ~ The G. C. D. of several fractions must be a fraction, but the L. C. M. of several fractions may be an integer or a fraction.'
  - - Guided practice
    - 'Try 3/4 and 9/10 again for the L. C. M.: L. C. M. of 3 and 9 is 9; G. C. D. of 4 and 10 is 2. Answer 9/2 = 4½. Check: 4½ ÷ 3/4 = 6 and 4½ ÷ 9/10 = 5.'
  - - Independent practice
    - 'Your student works the examples, including the fence-rail problem:

      ~ how many rails of the greatest length possible will be needed to fence it in straight lines'
  - - Check
    - Answers are printed.
  - - Wrap-up
    - 'Ask: In a word problem, how can you tell G. C. D. from L. C. M.? (Greatest piece that fits evenly into each: G. C. D. First time things line up again: L. C. M.)'
  tip: The scan's small printed fractions are often hard to read. Keep the paper book or a clear copy of the page open when your student works the examples.
