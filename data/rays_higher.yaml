  - - 'Case IV: from market value to par'
    - 'Read the heading:

      ~ Given the market value and the rate, to find the par value.

      Par value = market value ÷ (1 + rate of premium), or ÷ (1 − rate of discount). Work:

      ~ Invested $1591 in stocks, at 26% discount: how many shares ($50 each) did I buy?

      $1591 ÷ .74 = $2150 of par value; $2150 ÷ $50 = 43 shares.'
