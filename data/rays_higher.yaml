  title: General principles of multiplication and division
  roman: Art. 87
  idx: 57
  unit: 6
  mins: 30
  goal: Your student predicts how a product or quotient changes when one of its terms is multiplied or divided.
  materials: *id001
  book: Six general principles of multiplication and division, each with a small example, then exercises in combining signs (answers not clearly printed; the scan is hard to read).
  steps:
  - - Warm-up
    - 'Mental: 6 × 4; 12 × 4; 6 × 8. What do you notice?'
  - - Products
    - 'Read:

      ~ Multiplying either factor of a product, multiplies the product by the same number.

      ~ Dividing either factor of a product, divides the product by the same number.

      ~ Multiplying one factor of a product, and dividing the other factor by the same number, does not alter the product.

      Try: 25 × 16 = 50 × 8 = 100 × 4 = 400.'
  - - Quotients
    - 'Read:

      ~ Multiplying the dividend, or dividing the divisor, by any number, multiplies the quotient by that number.

      The book''s example: 24 ÷ 6 = 4, but 48 ÷ 6 = 8 and 24 ÷ 3 = 8.'
  - - The other two
    - 'Read Principles V and VI on the next page:

      ~ Dividing the dividend, or multiplying the divisor, by any number, divides the quotient by that number.

      ~ Multiplying or dividing both dividend and divisor by the same number, does not change the quotient.'
  - - Practice
    - 'Your student uses the principles to do these in the head: 35 × 18 (= 70 × 9); 4500 ÷ 25 (= 18000 ÷ 100); 240 ÷ 16 (= 60 ÷ 4).'
  - - Wrap-up
    - 'Ask: Which principle lets us cancel in fractions later? (VI: dividing both terms by the same number doesn''t change the quotient.)'
  answers: 'Practice: 35 × 18 = 630; 4500 ÷ 25 = 180; 240 ÷ 16 = 15.'
