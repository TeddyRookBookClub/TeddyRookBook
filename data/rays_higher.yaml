    - 'Mental: 40 minutes + 35 minutes as hours and minutes. 1 ft. − 5 in.'
  - - The idea
    - 'Read:

      ~ Compound Numbers may be added, subtracted, multiplied, and divided.

      The only difference from simple numbers: you carry and borrow by 12, 16, 60 or whatever the table says, not always by 10.'
  - - Adding
    - 'Read:

      ~ Addition of Compound Numbers is the process of finding the sum of two or more similar Compound Numbers.

      ~ Write the remainder under the column added, and carry the quotient to the next column.

      Work: 5 hr. 40 min. + 3 hr. 35 min. = 8 hr. 75 min. = 9 hr. 15 min.'
  - - Subtracting
    - 'Read:

      ~ Place the subtrahend under the minuend, so that numbers of the same denomination stand in the same column.

      Work the book''s example: From 9 yd. 1 ft. 6½ in. take 1 yd. 2.45 ft. The answer is 7 yd. 2 ft. 1.1 in. Follow the book''s working to see how it borrows.'
