    - 'Read:

      ~ Given the cost and the profit or loss, to find the rate.

      The book''s example: a mine bought for $45000 and sold for $165000 gains $120000, which is 266⅔% of the cost. Then:

      ~ If I buy at $1 and sell at $4, how many per cent do I gain?

      (300%.)'
  - - Independent practice
    - Your student works the rest of the Case I and Case II examples.
