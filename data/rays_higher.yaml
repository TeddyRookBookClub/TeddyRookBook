lessons:
- num: 1
  title: What arithmetic is about
  roman: Arts. 1–8
  idx: 14
  unit: 1
  mins: 30
  goal: Your student can explain in their own words what quantity, science, art and mathematics mean, and where arithmetic fits.
  materials: &id001
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: 'The opening definitions: definition, quantity, science, principles, art, mathematics, its three elementary branches, and arithmetic as both a science and an art.'
  steps:
  - - Warm-up
    - 'Ask: Name three things you could measure, and three things you could count. Is a feeling a quantity? Why or why not?

      There is no wrong answer yet; the book will give a test in a minute.'
  - - The idea
    - 'Ray starts a serious book with careful definitions. Read the first two together:

      ~ A definition is a concise description of any object of thought

      ~ Quantity is any thing which can be increased or diminished; it embraces number and magnitude.

      Say: Number answers "how many?" and magnitude answers "how much?"'
  - - Science and art
    - 'Read:

      ~ Science is knowledge properly classified.

      ~ The primary truths of a science are called Principles.

      ~ Art is the practical application of a principle or the principles of science.

      Ask your student to give a science-and-art pair from daily life (for example, knowing why bread rises, and actually baking bread).'
  - - Where arithmetic fits
    - 'Read:

      ~ Mathematics is the science of quantity.

      ~ The elementary branches of mathematics are Arithmetic, Algebra, and Geometry.

      ~ Arithmetic is the introductory branch of the science of numbers.

      The book adds that arithmetic is also an art: it shows how to use numbers for practical purposes.'
  - - Check understanding
    - 'Sort these as number or magnitude: the pupils in a room, the length of a road, the eggs in a basket, the weight of a sack of flour, the coins in a purse, the time of a train trip.'
  - - Notebook
    - Start a definitions page. Your student copies the definitions of quantity, science, art and mathematics in their own words, with one example each.
  - - Wrap-up
    - 'Ask: Why does a math book begin with definitions? (So every later rule means exactly the same thing to everyone.)'
  tip: These pages are short but dense. Read slowly, and let your student argue about the examples; that is the point of a definition.
- num: 2
  title: Propositions, rules and numbers
  roman: Arts. 9–21
  idx: 15
  unit: 1
  mins: 30
  goal: Your student can tell an axiom from a theorem and a problem, and knows what a rule, a formula, a unit and a number are.
  materials: *id001
  book: Definitions of proposition, axiom, theorem, problem, demonstration, solution, operation, rule and formula, then unit and number, abstract and concrete.
  steps:
  - - Warm-up
    - 'Review last time: What is quantity? What is the difference between a science and an art?'
  - - Kinds of statements
    - 'Read:

      ~ A Proposition is the statement of a principle, or of something proposed to be done.

      ~ An Axiom is a self-evident truth.

      ~ A Theorem is a truth to be proved.

      ~ A Problem is a question proposed for solution.

      Give an example of each: "The whole is greater than its part" (axiom); "The sum is the same in whatever order you add" (theorem, needs a reason); "What do 7 pencils cost at 3 cents each?" (problem).'
  - - Rules and formulas
    - 'Read:

      ~ A Rule is a general direction for solving all problems of a particular kind.

      ~ A Formula is the expression of a general rule or principle in algebraic language

      Show a tiny formula: cost = price × number. Ask your student to say the same thing as a rule in words.'
  - - Units and numbers
    - 'Read:

      ~ A Unit is one thing, or one.

      ~ Number is the expression of a definite quantity.

      The book divides numbers into abstract (just 5) and concrete (5 apples). Concrete numbers are also called denominate numbers; the word comes back in the chapter on measures.'
  - - Practice
    - 'Your student labels each as abstract or concrete: 12; 12 miles; 3 dozen eggs; 7; $40; 365 days. Then writes one axiom, one theorem and one problem of their own.'
  - - Wrap-up
    - 'Ask: Is "Find 15% of 80" an axiom, a theorem or a problem? (A problem.)'
- num: 3
  title: The signs of arithmetic
  roman: Arts. 22–39
  idx: 16
  unit: 1
  mins: 40
  goal: Your student reads and uses the signs +, −, ×, ÷, √, =, :, ::, parentheses and ∴, and knows the order of the fundamental operations.
  materials: *id001
  book: Integer, fraction and mixed number; the signs of addition, subtraction, multiplication, division, root, equality, ratio and proportion, with short notes on who first used some of them; signs of aggregation; the primary proposition; and the fundamental operations. A topical outline of the Introduction follows.
  steps:
  - - Warm-up
    - 'Ask your student to write, with signs: seven plus five equals twelve; twenty divided by four equals five.'
  - - Kinds of number
    - 'Read:

      ~ An Integral number, or Integer, is a whole number

      The book also names fractional numbers and mixed numbers (a whole number and a fraction together). Ask for one example of each.'
  - - The signs
    - 'Read:

      ~ A Sign is a character used to show a relation among numbers, or that an operation is to be performed.

      ~ The sign of Addition is [+], and is called plus.

      ~ Plus means more; minus means less.

      Go through ×, ÷ and the radical sign on the page. The book notes that the radical''s small index figure tells which root is wanted: √36 = 6, and the cube root of 125 is 5.'
  - - Equality, ratio and proportion
    - 'Read:

      ~ Ratio is the relation which one number bears to another of the same kind.

      ~ Proportion is an equality of ratios.

      The ratio sign is the colon (a division sign with its line left out). Look at the book''s example 3 : 6 :: 4 : 8 and ask: why are those equal? (3 is half of 6, and 4 is half of 8.)'
  - - Grouping signs
    - Parentheses and the vinculum (a bar over numbers) make several numbers count as one. Work 24 − (8 + 7) = 9 together, then 24 − 8 + 7 = 23, and talk about why they differ.
  - - The primary proposition
    - 'Read:

      ~ Arithmetic depends upon this primary proposition: that any number may be increased or diminished.

      The fundamental operations follow in this order:

      ~ Numeration and Notation, Addition, Subtraction, Multiplication, and Division.'
  - - Wrap-up
    - Look over the book's topical outline of the Introduction together. Your student points to each heading and says one sentence about it.
  tip: Ray's historical notes (Steifel, Oughtred, Pell) are fun but optional. Don't quiz on dates.
- num: 4
  title: Orders and periods
  roman: Arts. 40–47
  idx: 20
  unit: 2
  mins: 30
  goal: Your student names the place of each figure in a number of up to fifteen figures and groups figures into periods of three.
  materials: *id001
  book: Numeration and notation defined, the nine figures and the cipher, orders (units, tens, hundreds...), a table of the first fifteen orders, and periods of three orders each.
  steps:
  - - Warm-up
    - Write 3,333 and ask what each 3 is worth. (3 thousands, 3 hundreds, 3 tens, 3 units.)
  - - The idea
    - 'Read:

      ~ Numeration is the method of reading numbers.

      ~ Notation is the method of writing numbers.

      ~ The Order of a figure is the place it occupies in a number.

      Say: The same figure is worth ten times more for each place it moves to the left.'
  - - The table of orders
    - Open the book to the table of fifteen orders. Read the names together from units up to hundreds of trillions.
  - - Periods
    - 'Read:

      ~ orders are divided into groups of three each, and each group is called a period.

      Each period has its own units, tens and hundreds: units, thousands, millions, billions, trillions.'
  - - Guided practice
    - Write 407,019,300,056 on the slate. Your student marks off the periods, names each period, then reads the whole number aloud.
  - - Independent practice
    - Your student writes three numbers of 10 to 12 figures, marks the periods, and reads them to you. Then you read two long numbers aloud and your student writes them.
  - - Wrap-up
    - 'Ask: In 5,000,000,000, which order holds the 5? (Units of billions, the tenth order.)'
- num: 5
  title: Reading and writing large numbers
  roman: Art. 48
  idx: 23
  unit: 2
  mins: 35
  goal: Your student reads any number by periods (the French method) and writes numbers given in words, filling empty places with ciphers.
  materials: *id001
  book: The list of periods up to vigintillions, the rule for numeration, examples to read, the rule for notation with a worked example, and 21 numbers to write in figures. No answers are printed for these.
  steps:
  - - Warm-up
    - 'Read aloud: 3,040,506. Then 70,000,007.'
  - - The rule for reading
    - 'Read:

      ~ Begin at the right, and point the number into periods of three figures each.

      ~ Commence at the left, and read in succession each period with its name.

      Look at the book''s list of period names. Millions, billions, trillions and quadrillions are the ones used in real life.'
  - - The rule for writing
    - 'Read:

      ~ Begin at the left, and write each period in its proper place

      and fill empty places with ciphers. The book''s note says:

      ~ Every period, except the highest, must have three figures

      Work the book''s example together: four million twenty thousand three hundred and seven is 4,020,307.'
  - - Read the book's examples
    - Your student reads aloud the numbers under Examples in Numeration, pointing off periods first. Some are very long; that is fine.
  - - Guided practice
    - 'Write these two together:

      ~ Two hundred and seven thousand four hundred and one.

      ~ One million four hundred and twenty-one thousand six hundred and eighty-five.

      (207401 and 1421685.)'
  - - Independent practice
    - Your student writes the Examples in Notation, 1 to 21, in the notebook. Check with the answers below; numbers 17, 19, 20 and 21 are long, so check them by reading them back aloud.
  - - Wrap-up
    - 'Ask: Why can''t you just write "seven million and seventy" as 770? (The empty periods need ciphers: 7,000,070.)'
  answers: 'Examples in Notation: 1) 75  2) 134  3) 204  4) 370  5) 1234  6) 9007  7) 40563  8) 90009  9) 207401  10) 640040  11) 700007  12) 1421685  13) 7000070  14) 10100010  15) 60705000  16) 807040031  18) 19020500000000000. For 17 and 19 to 21, have your student read the written number back by periods to check it.'
- num: 6
  title: The English method and Roman notation
  roman: Arts. 49–50
  idx: 25
  unit: 2
  mins: 30
  goal: Your student knows that the old English method counted six figures to a period, and reads and writes Roman numerals with the book's five principles.
  materials: *id001
  book: 'The English method of numeration (six figures to a period), with a comparison to the French reading; then Roman notation: seven letters, five principles, and a table of Roman numerals. A topical outline closes the chapter.'
  steps:
  - - Warm-up
    - 'Ask: What year is it in Roman numerals? Leave the answer open and come back to it.'
  - - The English method
    - 'Read:

      ~ In the English Method of Numeration six figures make a period.

      So in the old English way a billion meant a million millions. Today Americans and the British both use the French method that the book teaches first. Just notice the difference; no drill needed.'
  - - Roman letters
    - 'Read:

      ~ In the Roman Notation, numbers are represented by seven letters.

      I, V, X, L, C, D, M stand for 1, 5, 10, 50, 100, 500, 1000.'
  - - The principles
    - 'Read each and try an example:

      ~ Every time a letter is repeated, its value is repeated.

      ~ Where a letter of less value is placed before one of greater value, the less is taken from the greater.

      ~ Where a letter of less value is placed after one of greater value, the less is added to the greater.

      ~ Where a letter of less value stands between two letters of greater value, it is taken from the following letter.

      ~ A bar [—] placed over a letter increases its value a thousand times.'
  - - Guided practice
    - Use the book's Roman Table. Cover the right side and have your student read XIV, XIX, XC, CM, MDCCCLXXX. Then cover the left side and write 49, 94, 444, 1880.
  - - Independent practice
    - Your student writes this year, their birth year and the year the book was published (about 1880) in Roman numerals.
  - - Wrap-up
    - 'Ask: Why is XIV fourteen and not sixteen? (The I stands between two larger letters, so it is taken from the V.)'
  answers: 'Guided practice: XIV = 14, XIX = 19, XC = 90, CM = 900, MDCCCLXXX = 1880; 49 = XLIX, 94 = XCIV, 444 = CDXLIV, 1880 = MDCCCLXXX.'
- num: 7
  title: 'Addition: definition and principles'
  roman: Arts. 51–52
  idx: 28
  unit: 3
  mins: 30
  goal: Your student states what addition is and why only like numbers can be added, and adds a column of numbers carrying correctly.
  materials: *id001
  book: Addition defined, the five principles of addition, and the worked example 639 + 82 + 543, explained order by order.
  steps:
  - - Warm-up
    - 'Mental: 47 + 38, 125 + 75, 999 + 1.'
  - - The idea
    - 'Read:

      ~ Addition is the process of uniting two or more like numbers into one equivalent number.

      Then the principles:

      ~ Only like numbers can be added.

      ~ The sum is the same in whatever succession the numbers are added.

      Ask: Can you add 2 apples and 3 peaches into one number? (Only by calling them both "fruit": that makes them like numbers.)'
  - - Work the book's example
    - 'Read the example aloud: What is the sum of 639, 82, and 543? Set the numbers in columns. Add the units: 14 units = 1 ten and 4 units. Write 4, carry 1. Continue with tens and hundreds. The sum is 1264.'
  - - Why we carry
    - Ask your student to explain carrying using the principle that units of the same order, and only such, can be added directly.
  - - Guided practice
    - 'Add together: 875 + 46 + 3092 + 18. (4031.)'
  - - Wrap-up
    - 'Ask: Which principle lets us check a sum by adding the column the other way? (The sum is the same in whatever succession the numbers are added.)'
- num: 8
  title: 'Adding: the rule, proofs and problems'
  roman: Art. 52, Examples 1–19
  idx: 29
  unit: 3
  mins: 45
  goal: Your student adds long columns accurately, checks by adding downward, and solves the book's practical addition problems.
  materials: *id001
  book: The rule for adding simple numbers, three methods of proof, then 19 examples for practice with answers, including sums of consecutive numbers and short business problems, and the book's suggestions about accuracy and speed.
  steps:
  - - Warm-up
    - 'Mental: add 25, 25, 50 and 100. Then 19 + 21 + 30.'
  - - The rule
    - 'Read:

      ~ Write the numbers to be added, so that figures of the same order may stand in the same column

      ~ Begin at the right and add each column separately

      ~ Carry one for every ten, since ten units of each order make one unit of the order next higher'
  - - Proof
    - 'Read the first method of proof:

      ~ Add the figures downward instead of upward.

      The book''s other methods: split the numbers into groups and add the group totals, or add from the left. (Casting out nines comes later, in Art. 105.)'
  - - Guided practice
    - 'Do the first two together:

      ~ Of 76767; 7654; 50121; 775.

      ~ Of 97674; 686; 7676; 9017.

      Check each by adding downward. (135317 and 115053, as the book prints.)'
  - - Independent practice
    - Your student works Examples 3 to 19. Numbers 5 to 8 are written in words first; 9 to 15 ask for the sum of consecutive numbers (write them all out, or look for a shortcut); 16 to 19 are short business problems.
  - - Check
    - The book prints every answer. Cover them while working, then compare. Rework any miss without looking at the answer again.
  - - Wrap-up
    - 'Read the book''s suggestion together:

      ~ Two things are of the greatest importance in arithmetical operations, — absolute accuracy and rapidity.

      Ask: Which one comes first? (Accuracy.)'
  practice: 'If Examples 9 to 15 were slow, show the pairing trick: 119 + 131, 120 + 130... each pair makes 250.'
  tip: Neat columns prevent most addition errors. Squared paper helps.
- num: 9
  title: Subtraction
  roman: Arts. 53–54
  idx: 32
  unit: 4
  mins: 35
  goal: Your student uses the words minuend, subtrahend and difference, subtracts large numbers with borrowing, and proves the work by adding.
  materials: *id001
  book: Subtraction defined, its terms and five principles, the worked example 827 − 534, the rule, the proof, and 13 examples for practice (answers printed for all but the first).
  steps:
  - - Warm-up
    - 'Mental: 100 − 37; 1000 − 1; 64 − 29.'
  - - The idea
    - 'Read:

      ~ Subtraction is the process of finding the difference between two numbers of the same kind.

      ~ A number can be subtracted only from another of the same kind.

      The larger number is the minuend, the smaller the subtrahend, and what is left the difference or remainder. The book''s example: 2 cents can''t be taken from 5 apples.'
  - - Work the book's example
    - 'From 827 dollars take 534 dollars. Units: 7 − 4 = 3. Tens: 3 tens can''t come from 2 tens, so take 1 of the 8 hundreds as 10 tens: 12 − 3 = 9. Hundreds: 7 − 5 = 2. Answer $293.'
  - - Rule and proof
    - 'Read:

      ~ Write the less number under the greater, placing units under units, tens under tens, etc.

      ~ Add the remainder to the less number. If the work be correct, the sum will be equal to the greater.'
  - - Guided practice
    - 'Together:

      ~ From 79685 take 30253.

      ~ From 2900000 take 777888.

      Prove each by adding. (49432 and 2122112.)'
  - - Independent practice
    - Your student works all 13 examples, proving each by addition. Number 7 asks how many years from 1492 to 1776.
  - - Check
    - Answers are printed for Examples 2 to 13. Example 1 is in the answers below.
  - - Wrap-up
    - 'Ask: If you know the difference and the subtrahend, how do you find the minuend? (Add them.)'
  tip: Lots of ciphers in the minuend (like 2900000) is where borrowing goes wrong. Go slowly there.
  answers: 'Example 1: 30020037 − 50009 = 29970028.'
- num: 10
  title: 'Business terms: accounts and balances'
  roman: Arts. 55–58
  idx: 34
  unit: 4
  mins: 30
  goal: Your student knows what an account, debit and credit are, and finds the balance of a simple account by subtraction.
  materials: *id001
  book: 'A first look at book-keeping: accounts, debits (Dr.) and credits (Cr.), and balancing; then two practical exercises with ledger accounts to balance (James Craig and Thomas Baldwin). No answers are printed; the scan of the second account is hard to read. A topical outline of subtraction follows.'
  steps:
  - - Warm-up
    - 'Ask: If you earned $12, spent $5 and earned $8 more, how much do you have? Write it as two lists, money in and money out.'
  - - The idea
    - 'Read:

      ~ Book-keeping is the science and art of recording business transactions.

      ~ Each account has two sides: Dr. — Debits, and Cr. — Credits.

      Say: Dr. is what someone owes or has received from you; Cr. is what they have paid or given. The balance is the difference between the two sides.'
  - - Old business words
    - In 1880 a merchant wrote "To Merchandise" for goods sold to a customer and "By Cash" for money received. "Bills payable" were written promises to pay. These are still the bones of modern bookkeeping.
  - - Work an account together
    - 'Turn to the James Craig account. Add the debit column, add the credit column, then subtract the smaller total from the larger. Say which side is bigger: that tells you who owes whom.'
  - - Independent practice
    - Your student balances the Thomas Baldwin account the same way. If the scan is hard to read in places, use the clearest entries and make up the rest.
  - - Check
    - 'The book prints no answers here. Check by adding the balance to the smaller side: it must equal the larger side.'
  - - Wrap-up
    - Ask your student to set up a two-column account of their own money for a week, debits on the left, credits on the right.
  practice: Keep the weekly account going and balance it each Saturday.
  tip: 'This page is the book''s first brush with business. Keep it practical: a real allowance or a small household budget works best.'
- num: 11
  title: 'Multiplication: terms and the short multiplier'
  roman: Arts. 59–62
  idx: 36
  unit: 5
  mins: 35
  goal: Your student names the parts of a multiplication, states its principles, and multiplies by numbers up to 12 in one line.
  materials: *id001
  book: Multiplication defined two ways, the terms (multiplicand, multiplier, product, factors), six principles, the two cases, and Case I (multiplier not over 12) with a rule and 14 examples with answers.
  steps:
  - - Warm-up
    - 'Quick tables: 7 × 8, 9 × 12, 11 × 11, 6 × 7.'
  - - The idea
    - 'Read:

      ~ Multiplication is taking one number as many times as there are units in another.

      The book adds that it is a short way of adding equal numbers. Work the book''s example: How many trees in 3 rows of 42? 42 + 42 + 42 = 126, or 3 × 42 = 126.'
  - - The principles
    - 'Read these three and talk about each:

      ~ The multiplier must always be an abstract number.

      ~ The product is the same in kind as the multiplicand.

      ~ The product is the same, whichever factor is taken as the multiplier.

