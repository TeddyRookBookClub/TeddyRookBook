book:
  id: raysnewhigherari00rayjrich
  title: Ray's New Higher Arithmetic
  year: about 1880
  key: higher
  short: Higher
  eyebrow: Ray's Arithmetic · Book 4
  hero: 'The last and fullest book of Ray''s arithmetic series, for students about 12 and up: number theory, fractions and decimals, the old and metric measures, ratio and proportion, percentage and its business uses, with definitions, rules, worked examples and thousands of problems. Every session has a guide you can follow step by step, with the right page of the book beside it.'
  how:
  - <b>One guide, one sitting.</b> Each guide covers a few of the book's numbered articles and takes 30 to 45 minutes. A few long problem sets are split over two or three days; the guide says so.
  - <b>Read the definitions aloud.</b> Ray states every idea as a definition, principle or rule. Read it together, put it in plain words, then let the worked example show what it means.
  - <b>Work the book's example first.</b> Each guide walks through the example the book solves, then two real problems together, then a set your student works alone.
  - <b>The book prints most answers.</b> Cover them with a card while working, then check. Where the book prints none, or the scan is unreadable, the guide gives the answer.
  - <b>Keep a notebook.</b> A page of definitions and rules in your student's own words, and neat worked problems, make the best review.
  - <b>Old money and measures.</b> Mills, farthings, rods, pecks and troy ounces fill many problems. The guides explain them briefly; the arithmetic is what matters.
  lessonword: ''
  numnote: The book is divided into numbered articles, not lessons. Each guide covers a few articles, shown beside its title; guide numbers simply count the sessions in order.
  unitword: Unit
