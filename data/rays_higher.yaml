    - 'Mental: 10 is 10% of what? 5 is 50% of what?'
  - - Case III
    - 'Read:

      ~ The base bears the same ratio to the percentage that 100% does to the rate.

      ~ Divide the percentage by the rate expressed decimally; the quotient is the base.

      Work the book''s example: 95 is 5% of what number? 95 ÷ .05 = 1900.'
  - - Guided practice
    - 'Together:

      ~ $3.80 is 5% of what sum?

      ~ $189.80 is 104% of what?

      ($76; $182.50.)'
