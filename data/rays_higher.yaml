  title: 'Division: terms and principles'
  roman: Arts. 72–78
  idx: 48
  unit: 6
  mins: 35
  goal: Your student defines division three ways, uses the words dividend, divisor, quotient and remainder, and knows the principles connecting them.
  materials: *id001
  book: Division defined, its terms, how it relates to multiplication, three ways of writing it, four principles, the two classes of division problems, and long and short division introduced with 820 ÷ 5.
  steps:
