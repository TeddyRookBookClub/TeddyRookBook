- num: 59
  title: Ratio
  roman: Arts. 227–229
  idx: 180
  unit: 12
  mins: 35
  goal: Your student finds the ratio of two like numbers, names antecedent and consequent, and knows how changing a term changes the ratio.
  materials: *id001
  book: Ratio defined, how to find it, the sign, terms, simple and compound ratios, reciprocal and inverse ratios, the value of a ratio, then general principles, a rule, and examples on ratios of compound numbers (answers printed, though faint in the scan).
  steps:
  - - Warm-up
    - 'Ask: How many times larger is 12 than 4? Than 3? What part of 12 is 4?'
  - - The idea
    - 'Read:

      ~ A Ratio is found by dividing the first number by the second.

      ~ The Sign of Ratio is the colon (:).

      ~ The first term of a ratio is the antecedent.

      The second is the consequent. The book''s example: the ratio of 8 to 4 is 2.'
  - - Kinds
    - 'Read:

      ~ A Simple Ratio is a single ratio consisting of two terms.

      ~ The Reciprocal of a Ratio is 1 divided by the ratio.

      ~ Inverse Ratio is the quotient of the consequent divided by the antecedent.

      A compound ratio is the product of two or more simple ratios.'
  - - Principles
    - 'Read:

      ~ Antecedent = Consequent X Ratio.

      ~ The Ratio is not changed by multiplying or dividing both terms by the same number.

      Work the book''s example: 15 : 36 = 15/36 = 5/12.'
  - - Compound numbers
    - 'Ratios only work between like numbers. To find the ratio of 2 ft. 6 in. to 1 yd., reduce both to inches: 30 : 36 = 5/6.'
  - - Independent practice
    - Your student works the book's four examples on ratios of compound numbers, reducing both terms to the same denomination first.
  - - Wrap-up
    - 'Ask: What is the ratio of 1 mile to 1 rod? (320.) Of 1 rod to 1 mile? (1/320.)'
- num: 60
  title: Proportion and the rule of three
  roman: Arts. 230–231
  idx: 182
  unit: 13
  mins: 35
  goal: Your student tests a proportion by its means and extremes, and sets out and solves a simple proportion.
  materials: *id001
  book: 'Proportion defined, its sign, couplets, antecedents and consequents, extremes and means, mean proportionals, simple and compound proportion, three principles, then simple proportion: the statement, the rule, and two worked examples (horses and men).'
  steps:
  - - Warm-up
    - 'Ask: If 3 pencils cost 12 cents, what do 5 cost?'
  - - The idea
    - 'Read:

      ~ Proportion is an equality of ratios.

      ~ The Sign of Proportion is the double colon ( : : ).

      The book''s example: 4 : 6 :: 8 : 12, read "4 is to 6 as 8 is to 12."'
  - - Means and extremes
    - 'Read:

      ~ The first and last terms of a proportion are called the extremes.

      The middle terms are the means. The test:

      ~ the product of the means is equal to the product of the extremes.

      Check: 6 × 8 = 48 and 4 × 12 = 48.'
  - - Simple proportion
    - 'Read:

      ~ employed when three terms are given and we wish to find the fourth.

      ~ The Statement is the proper arrangement of the terms of the proportion.

      ~ For the third term, write that number which is of the same denomination as the number required.

      Then put the larger of the other two second if the answer should be larger, and:

      ~ Divide the product of the second and third terms by the first'
  - - Work the book's example
    - 'If 6 horses cost $300, what will 15 horses cost? 6 horses : 15 horses :: $300 : answer. 15 × 300 ÷ 6 = $750. Proof: 750 × 6 = 300 × 15.'
  - - Inverse case
    - 'The book''s second example: 15 men do a piece of work in a number of days (9⅗ by the book''s working; the fraction is faint in the scan); how long will 36 men take? More men need fewer days, so the answer must be smaller. Days go third; the smaller of the other two (15 men) goes second: 36 men : 15 men :: 9⅗ days : answer. 15 × 9⅗ ÷ 36 = 4 days.'
  - - Wrap-up
    - 'Ask: How do you know which number goes third? (It''s the one like the answer.)'
  tip: 'Have your student always ask first: should the answer be bigger or smaller? That one question sets up every proportion.'
