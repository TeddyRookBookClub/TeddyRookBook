  - - With dates
    - 'Work the book''s dated example: invoices of Jan. 7, 11, 13, 20 and 28. Count days from Jan. 7, multiply, add, and divide. The answer is about 12 days after Jan. 7, so the note is dated Jan. 19.'
  - - Accounts with both sides
    - 'Read:

      ~ If the account has credits as well as debits, it is called a compound equation, and may be averaged on the same principle as the simple equation.

