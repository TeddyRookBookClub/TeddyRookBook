    - 'Ask: You owe $100 due in 1 month and $100 due in 3 months. If you pay $200 all at once, what day is fair? (In 2 months.)'
  - - The idea
    - 'Read:

      ~ Equation of Payments is the process of finding the time when two or more debts, due at different times, may be paid without loss to either debtor or creditor.

      ~ The time of payment is called the Equated Time.

      ~ The Term of Credit is the time to elapse before a debt is due.'
  - - Work the book's example
