    - 'Compound proportion is

      ~ an expression of equality between two ratios

      when one or both ratios are compound. Work the book''s example: If 3 men mow 8 A. in 4 da., how long would 10 men take to mow 36 A.? More acres need more days (8 : 36); more men need fewer (10 : 3). Days = 4 × 36 × 3 ÷ (8 × 10) = 5⅖ days.'
  - - Cause and effect
    - 'Read:

      ~ Separate all the quantities contained in the question into two causes and their effects.

      ~ The two causes must be exactly alike in the number and kind of their terms

      First cause : second cause :: first effect : second effect.'
  - - Work the fence example
    - '6 men, working 10 days of 9 hours, build 25 rods of fence. How many hours a day must 8 men work to build 48 rods in 12 days? 6 × 10 × 9 : 8 × 12 × (hours) :: 25 : 48. The page leaves the answer blank; work it out together (below).'
