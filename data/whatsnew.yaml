  text: "A read-along of the Greek New Testament and the Latin Vulgate with Saint Jerome: 124 passages in Bible order, each read in Greek, Latin and English and then taken apart word by word, meeting the 345 most common words of each New Testament along the way. Nearly four hours, with chapters for every book. It's on the Videos page, the Languages page, the Gospel Reader and flashcards, and the homeschool Greek and Latin pages."
