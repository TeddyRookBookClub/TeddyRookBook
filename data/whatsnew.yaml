  kind: Game
  title: "New game: Book Cart"
  url: /science-lab/book-cart/
  text: "A chain of 2 to 25 books hangs from a rolling shopping cart. Roll the cart in rhythm to swing the books up, then catch them at the top and keep them balanced above the cart. Slide your finger or hold the arrow keys. Every book follows real physics, time slows down near the top so you can react, and a live panel shows the forces, the swing energy, the energy check and how fast the stack would fall. There are 24 levels, a Lab where you can change gravity, wind, stiffness and a counterweight, watch chaos, or hand over to the autopilot, and a new physics lesson, Why Things Fall Over, with things to try at home."
