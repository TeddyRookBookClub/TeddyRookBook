  text: "The free book that goes with the video Greek and Latin with Jerome, to read online or download as a 439-page PDF. Part One sets out how Koine Greek and Latin work side by side. Part Two has all 124 passages with pronunciation under every word, an English translation, a note on every word and a link to the moment in the video. The 345 most common Greek and 345 most common Latin words of the New Testament each have a page with every form, and every part ends with a practice set you can check as you go, with answers."
