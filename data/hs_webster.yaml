lessons:
- title: How the book marks long and short vowels
  mins: 15
  goal: Your child knows that each vowel has a long sound and a short sound, and can tell the book's long mark (a straight line over the letter) from its short mark (a little curve).
  materials: &id001
  - The book, open to this table
  - A slate, small whiteboard, or paper and pencil
  book: 'The "Analysis of Sounds in the English Language" explains vowels, consonants and diphthongs, then shows how the book marks each vowel sound: a straight line over a letter for its long sound, a curve over it for its short sound, and a few other marks for the "occasional" sounds.'
  steps:
  - - Why the marks matter
    - 'Webster''s speller does not just list words. Over many of the vowels it prints a small mark that tells you exactly how to say that vowel. Once your child knows the marks, the book teaches pronunciation by itself.

      You do not need to read these front pages aloud to a young child. Read them yourself first, then teach the marks a few at a time with real words.'
  - - Long and short
    - 'Say: Every vowel has a long sound, where it says its own name, and a short sound.

      Say pairs and let your child copy: "ā as in cake, ă as in cat. ē as in me, ĕ as in met. ī as in bind, ĭ as in bin. ō as in note, ŏ as in not. ū as in tube, ŭ as in tub."'
  - - The two main marks
    - 'Write a on the slate with a straight line over it (ā). Say: This line means the long sound.

      Write a with a little curve over it (ă). Say: This curve means the short sound.

      Do the same with e, i, o and u. The book uses these same two marks for every vowel.'
  - - Find the marks in the book
    - 'Look together at the examples the book gives on these pages, such as the short e in

      ~ met

      and the long and short i in

      ~ bind, bin

      Let your child point to each mark and say the sound it stands for.'
  - - A quick game
    - 'Write five short words with the long or short mark over the vowel (for example: ā in cake, ă in hat, ō in rope, ŏ in hot, ĭ in pin). Your child reads each one, using the mark to decide the sound.'
  - - Wrap up
    - 'Ask: What does a straight line over a vowel mean? What does a curve mean? That is all for today. The other marks come next time.'
  practice: For a few days, write three marked words on the slate each morning for your child to read.
  tip: Teach the marks by ear first. A child who can hear the difference between "cake" and "cat" learns the marks in a day or two.
  num: 1
  roman: Analysis of Sounds
  idx: 7
  unit: 1
- title: The other vowel marks
  mins: 15
  goal: 'Your child knows the book''s marks for the "occasional" vowel sounds: a as in bar and ball, o as in son, u as in full, i as in marine.'
  materials: *id001
  book: 'This part of the Analysis explains the vowel sounds that are not simply long or short: a with two dots over it (bar, father), a with two dots under it (ball), o with one dot over it sounding like short u (son, dove), u with a dot under it sounding like short oo (full, pull), i with two dots over it sounding like long e. It also notes which digraphs (two vowels together) say long e.'
  steps:
  - - Review
    - Write ā, ă, ō, ŏ on the slate. Your child says the sound for each mark.
  - - a has more than two sounds
    - 'Say: "bar", "father". The a here is open and wide. The book puts two dots over it.

      Say: "ball", "stall". This a sounds like "aw". The book puts two dots under it.

      The book''s examples:

      ~ bar, father

      ~ ball, stall'
  - - o that sounds like u
    - 'Say: "son", "dove". The o sounds like the u in "sun". The book puts one dot over it.

      ~ dove, son'
  - - u that sounds like oo
    - 'Say: "full", "pull". The u is short and soft, like the oo in "book". The book puts one dot under it.

      ~ full, pull'
  - - i that sounds like e
    - In a few words, such as "marine", i sounds like long e. The book marks it with two dots over it. The page also says that ea, ee, ei and ie, when not marked, have in this book the sound of long e.
  - - Wrap up
    - 'Write five words with their marks: bar, ball, son, pull, marine. Your child reads each one and tells you what the mark is telling them.'
  tip: Don't expect all of these to stick at once. The key line at the top of every page in the book repeats them, so your child will meet them again and again.
  num: 2
  roman: Analysis of Sounds
  idx: 8
  unit: 1
- title: The key line at the top of every page
  mins: 15
  goal: Your child can read the key words printed across the top of the pages and knows that they show how each marked vowel sounds.
  materials: *id001
  book: 'The "Key to the Pronunciation" lists every marked sound with example words: the regular long and short vowels, the occasional sounds, the diphthongs oi, oy, ou, ow, and the consonants that can be read two ways (c, g, s, ch, th). The same key words run across the top of every page of the book, which is where children use them most.'
  steps:
  - - Look at the top of any page
    - 'Turn to any page of tables. Across the top is a line of short key words. One page carries a line like this:

      ~ bar, last, care, fall, what; her, prey, there; get; bird, marine; link

      and the facing page a line like this:

      ~ move, son, wolf, foot, moon, or; rule, pull; exist; c=k; g=j; s=z; ch=sh'
  - - What the key is for
    - 'Say: Each of these words has a marked letter in it. When you see that same mark in a table, it makes the same sound as in the key word.

      Point to "bar" and "fall" and remind your child of last time: two dots over a in bar, two dots under a in fall.'
  - - Read the key line
    - Read the key words aloud together, slowly. For each one, point to the marked letter and say just that sound, then the whole word.
  - - Consonants that change
    - 'The end of the key line shows letters that can borrow another letter''s sound. In the book, a c marked this way sounds like k, a marked g like j, a marked s like z, and a marked ch like sh. Say a word for each: cat, gem, is, machine.'
  - - Practice finding a sound
    - Open to a later page. Find a word with a mark you have learned. Your child checks the key line at the top to see how it sounds, then reads the word.
  - - Wrap up
    - 'Ask your child to "teach" you the key line: they point and read, you listen.'
  tip: Come back to the key line whenever a mark is forgotten. Teaching your child to look up a sound in the key is more useful than telling them the answer.
  num: 3
  roman: Key to the Pronunciation
  idx: 12
  unit: 1
- title: The alphabet and the names of the letters
  mins: 15
  goal: Your child knows all twenty-six letters, capital and small, in print and italic, and can say each letter's name.
  materials: *id001
  book: A chart of the alphabet in Roman capitals and small letters and in italics, with the name of each letter, followed by the double letters (ff, fi, fl, ffi, ffl) and the sign &, which the book says "is not a letter, but a character standing for and."
  steps:
  - - Sing or say it
    - Say the alphabet together in order. If your child knows a tune for it, use the tune first, then say it plainly.
  - - Read the chart
    - Go down the chart. For each row, your child points to the capital, the small letter and the italic letter, and says the letter's name. The italic letters look different (italic a and g especially). Point them out.
  - - Out of order
    - Point to letters at random, capital and small. Your child names each one. Make a short list of any that are slow.
  - - The double letters and &
    - 'Show the double letters (ff, fi, fl) and explain that old printers joined these letters together. Then read the note:

      ~ This is not a letter, but a character standing for and.'
  - - Write them
    - Your child writes the small letters a to z on the slate. Help with any that are reversed (b and d, p and q are common).
  - - Wrap up
    - 'Play "I spy" with letters on the page: "I spy a capital R." Your child finds it.'
  practice: Say the alphabet daily, and name ten letters out of order, until every letter is instant. Do not start the tables until the letters are known.
  tip: Webster expected children to know every letter by sight and name before spelling. A few minutes a day for a week or two is usually enough.
  num: 4
  roman: Alphabet
  idx: 14
  unit: 1
- title: 'First syllables: ba, be, bi, bo, bu, by'
  mins: 15
  goal: Your child reads and spells simple two-letter syllables made of a consonant and a vowel.
  materials: *id001
  book: Table No. 1 sets out syllables of one consonant and one vowel, row by row through the alphabet (ba, be, bi, bo, bu, by, then da, de and so on). No. 2 continues with h, j, k, l and more. Above No. 1 is a specimen of Old English script letters.
  steps:
  - - The pattern
    - 'These are not words yet, just syllables: one consonant and one vowel. In each syllable the vowel says its long sound, its name: ba (bay), be (bee), bi (bye), bo (bow), bu (byoo), by (bye).

      The y at the end of a row sounds just like i.'
  - - Read the table aloud
    - 'Read across the rows with your child. Keep it brisk and cheerful. The rows go like this:

      ~ be, bi, bo, bu

      ~ de, di, do, du

      ~ fe, fi, fo, fu

      Then try No. 2, which goes on with other letters:

      ~ ha, he, hi, ho

      ~ ja, je, ji, jo, ju

      ~ la, le, li, lo, lu'
  - - Spell aloud
    - 'Webster''s children spelled every syllable aloud before saying it. Point to a syllable; your child names the letters, then says the syllable.

      Say: b, a, ba. b, e, be.

      Go across the rows this way. Then you say a syllable and your child spells it without looking.'
  - - Change one letter
    - 'On the slate write "ba". Change the b to d: "da". Change it to f: "fa". Your child reads each new syllable. Then keep the b and change the vowel: be, bi, bo, bu.'
  - - Dictation
    - 'Say a syllable; your child writes it. Try: ba, de, fi, go, hu, ly. Check each one together.'
  - - Wrap up
    - Your child picks a row and reads it to you as fast as they can, without mistakes.
  practice: Read a few rows of Nos. 1 and 2 each day until they are easy. Short and daily works far better than long and rare.
  tip: If your child is not yet sure of all the letters, go back to the alphabet for a few days first.
  num: 5
  roman: Nos. 1–2
  idx: 15
  unit: 2
- title: 'More syllables, then the vowel first: ab, eb, ib'
  mins: 15
  goal: Your child reads syllables that begin with a vowel (ab, ed, ig) and reads the first tiny sentences in the book.
  materials: *id001
  book: 'No. 3 finishes the consonant-and-vowel syllables (pa, pe, pi; ra, re, ri; sa, se, si). No. 4 turns them around so the vowel comes first: ab, eb, ib, ob, ub; ad, ed, id. Little sentences of two-letter words, such as "is it on?", come with them.'
  steps:
  - - Review
    - Read a row or two of No. 1 or No. 2 together.
  - - The pattern
    - 'No. 3 is just like the last tables. No. 4 is new: the vowel comes first and the consonant closes the syllable. When a consonant closes a syllable, the vowel is short: ab, eb, ib, ob, ub.'
  - - Read the table aloud
    - 'Read No. 3 across the rows:

      ~ pa, pe, pi, po, pu, py

      ~ ra, re, ri, ro, ru, ry

      Then No. 4, slowly, listening for the short vowels:

      ~ ab, eb, ib, ob, ub

      ~ ad, ed, id, od, ud'
  - - Spell aloud
    - 'Your child spells each syllable of No. 4 and says it.

      Say: a, b, ab. e, b, eb.

      Then you say one and your child spells it from memory.'
  - - Read the sentences
    - 'Now the first sentences in the book. Every word is a tiny one. Read them slowly together:

      ~ is it on? he is in.

      ~ is it by us? we go to it.'
  - - Dictation
    - 'Your child writes these from your voice: ab, ed, ig, ob, ud. Then two real words: it, is.'
  - - Wrap up
    - Your child reads one of the little sentences to someone else in the family.
  practice: Read a row from Nos. 1 to 4 every day this week, and one of the little sentences.
  num: 6
  roman: Nos. 3–4
  idx: 16
  unit: 2
- title: 'Short-vowel syllables: aj, ak, al, ar, ok, ul'
  mins: 15
  goal: Your child reads and spells syllables where a short vowel is closed by a consonant, and reads short sentences made of two-letter words.
  materials: *id001
  book: 'Nos. 5, 6 and 7 continue the pattern of No. 4: a vowel followed by a consonant (aj, ej, ij; ar, er, ir; ok, uk, ol, ul), with little sentences such as "I am to go in."'
  steps:
  - - Review
    - 'Spell and say five syllables from No. 4: ab, ed, ig, ob, ud.'
  - - The pattern
    - 'Same idea as No. 4: the vowel first, then a consonant to close it, so the vowel is short. Only the closing consonants are new. Note that ar, er and ir have their own sounds when r closes the syllable.'
  - - Read the table aloud
    - 'Read across the rows of all three tables. They go like this:

      ~ aj, ej, ij, ak, ek, ik

      ~ ar, er, ir, as, es, is

      ~ ok, uk, ol, ul, om, um'
  - - Spell aloud
    - 'Point to a syllable; your child spells it and says it: "a, k, ak". Then the reverse: you say "ul", your child spells "u, l".'
  - - Read the sentences
    - 'Read the little sentences together. They use only two-letter words, so your child can read them alone:

      ~ I am to go in.

      ~ Is he to be by me?'
  - - Dictation
    - 'Your child writes: am, in, is, it, us, up, on. These are all real words built the same way as the syllables.'
  - - Wrap up
    - Ask your child to find three real words hiding in the tables (am, in, is, up, us, on...).
  num: 7
  roman: Nos. 5–7
  idx: 17
  unit: 2
- title: 'Two consonants together: bla, fla, pra, tra, cha, sha'
  mins: 15
  goal: Your child reads syllables that start with two consonants blended together (bl, fl, pr, tr) or with ch, sh, wr.
  materials: *id001
  book: No. 8 has blends with l and r (bla, ble, bli; fla, fle, fli; gla; pla; bra), and No. 9 goes on with more (pra, tra, wra, cha, sha, ska). Short sentences follow on the next page.
  steps:
  - - The pattern
    - 'Now two consonants come together at the start. Say both sounds quickly so they blend: b-l, bla. Some pairs make one new sound: ch as in chin, sh as in ship. In wr the w is silent: wra sounds like "ra".'
  - - Read the table aloud
    - 'Read across No. 8:

      ~ bla, ble, bli

      ~ fla, fle, fli, flo, flu, fly

      ~ gla, gle, gli, glo

      Then No. 9:

      ~ pra, pre, pri, pro, pru, pry

      ~ tra, tre, tri, tro, tru, try

      ~ cha, che, chi, cho, chu

      ~ sha, she, shi, sho, shu, shy'
  - - Spell aloud
    - 'Your child spells and says: "b, l, a, bla". "s, h, a, sha". Then you say a syllable and your child spells it.'
  - - Hear the blend
    - 'Say "pla" slowly: "p...la". Then fast: "pla". Your child does the same with "tri", "flo" and "bra". If two sounds come out as one, slow down.'
  - - Dictation
    - 'Your child writes: bla, fli, pro, tru, sha, chi.'
  - - Wrap up
    - Your child reads the row they like best, as fast as they can.
  num: 8
  roman: Nos. 8–9
  idx: 17
  unit: 2
- title: 'More blends: pha, qua, spa, sta, spla, stra'
  mins: 15
  goal: Your child reads syllables beginning with ph, qu, sp, st, sc, sw and the three-letter blends spl, spr, str, shr.
  materials: *id001
  book: 'No. 10 has pha, qua, spa, sta, sca and swa rows. No. 11 finishes swo, swu, then three consonants together: spla, spra, stra, shra. Short sentences follow, such as "She fed the old hen."'
  steps:
  - - The pattern
    - More consonant pairs, and then three together. ph sounds like f. qu sounds like kw. In spl, spr and str all three sounds are said quickly, one after another.
  - - Read the table aloud
    - 'Read No. 10:

      ~ pha, phe, phi, pho

      ~ qua, que, qui, quo

      ~ spa, spe, spi, spo, spu, spy

      ~ sta, ste, sti, sto, stu, sty

      Then No. 11:

      ~ spla, sple, spli, splo

      ~ spra, spre, spri, spro

      ~ stra, stre, stri, stro'
  - - Spell aloud
    - 'Your child spells and says each syllable: "s, t, r, a, stra." Then you say one and your child spells it from memory.'
  - - Read the sentences
    - 'Read the sentences on this page together. Many of the words are already easy now. Two of them:

      ~ She fed the old hen.

      ~ Did you get my hat?'
  - - Dictation
    - 'Your child writes: pha, qui, spo, sty, spla, stri.'
  - - Wrap up
    - 'Celebrate: the syllable tables are finished. From the next table on, everything is a real word.'
  tip: A child who can read Nos. 1 to 11 quickly has the sounds needed for most short English words.
  num: 9
  roman: Nos. 10–11
  idx: 18
  unit: 2
- title: 'Real words: cab, fib, hob, log, mud'
  mins: 15
  goal: Your child reads, spells and writes three-letter words with a short vowel.
  materials: *id001
  book: 'No. 12 is a list of short words such as cab, fib, hob, cub, lad, bid, rip. No. 13 has more: log, cud, tag, pig, dug, dog, mud, fig, hug, rug. Sentences follow: "He has got a new tub." "I can do as I am bid."'
  steps:
  - - The pattern
    - 'From here on, every table is real words. These all have three letters: consonant, short vowel, consonant. The vowel is short because a consonant closes the word.'
  - - Read the table aloud
    - 'Read No. 12 aloud, a column at a time. Then No. 13. Some of the words:

      ~ cab, fib, hob, cub

      ~ sap, lad, bid, god

      ~ dab, jib, job, dub, rip

      ~ log, cud, tag, pig, dug

      ~ dog, mud, rag, fig, hug, rug'
  - - Spell aloud
    - 'Now the old way: your child looks at a word, then spells it aloud and says it.

      Say: c, a, b, cab.

      Go down a column like this. Then cover the column, say a word, and have your child spell it aloud without looking.

      If a word is new to your child (hob, jib, cud), give a quick meaning, but don''t stop for long.'
  - - Read the sentences
    - 'Read the sentences with these tables. Two of them:

      ~ He has got a new tub.

      ~ I can do as I am bid.'
  - - Dictation
    - 'Say each word, use it in a short sentence of your own, and say it again. Your child writes it. Try these: cab, lad, rip, log, pig, mud, hug, rug.

      Check together against the book. Any word that came out wrong goes on a card for tomorrow.'
  - - Wrap up
    - 'Make new words by changing one letter: pig, dig, dog, log, leg. Your child reads each one.'
  practice: Every day, read one column aloud and spell five words from memory.
  num: 10
  roman: Nos. 12–13
  idx: 19
  unit: 3
- title: 'Short-vowel words: hem, gum, men, fin, lap, rip'
  mins: 15
  goal: Your child reads and spells more short-vowel words and reads easy sentences.
  materials: *id001
  book: 'Nos. 14 to 16 are more three-letter words with short vowels: hem, gum, men, fin, win; rum, pan, fen, pin, bun; lap, rip, nip, mat, bat, pat, met, bit. Sentences follow: "It is in my lap. She has a new fan." "A cat can eat a rat."'
  steps:
  - - Review
    - Spell aloud five words from Nos. 12 and 13 (cab, lad, pig, mud, rug).
  - - The pattern
    - Still three-letter words with a short vowel. Many of these end in m, n, p or t.
  - - Read the table aloud
    - 'Read the table aloud together, a column at a time. You say a word, your child says it back while pointing to it. Then your child reads a column alone. Some of the words:

      ~ hem, gum, men, fin, win

      ~ rum, pan, fen, pin, bun

      ~ lap, rip, nip, bat, pat, met, bit'
  - - Spell aloud
    - 'Now the old way: your child looks at a word, then spells it aloud and says it.

      Say: m, e, n, men.

      Go down a column like this. Then cover the column, say a word, and have your child spell it aloud without looking.'
  - - Read the sentences
    - 'Read the sentences under these tables:

      ~ It is in my lap.

      ~ She has a new fan.

      ~ A cat can eat a rat.'
  - - Dictation
    - 'Say each word, use it in a short sentence of your own, and say it again. Your child writes it. Try these: gum, men, win, pan, pin, lap, bat, met.

      Check together against the book. Any word that came out wrong goes on a card for tomorrow.'
  - - Wrap up
    - Your child reads a whole column without help. Praise it.
  num: 11
  roman: Nos. 14–16
  idx: 20
  unit: 3
- title: 'Silent e makes the vowel long: babe, hide, cake'
  mins: 15
  goal: Your child knows that an e at the end of a short word is silent and makes the vowel before it say its name.
  materials: *id001
  book: 'No. 17 and No. 18 are words that end in a silent e: babe, hide, mode, ace, lake, dice, page, make; bake, cake, dike, yoke, dale, mile, hole, like, duke.'
  steps:
  - - The pattern
    - 'Write "hid" on the slate. Your child reads it. Add an e: "hide". Say: The e at the end says nothing, but it makes the i say its name.

      Try: mad, made; cut, cute; hop, hope. In the book the long vowel has a straight line over it, and the final e is left unmarked.'
  - - Read the table aloud
    - 'Read the table aloud together, a column at a time. You say a word, your child says it back while pointing to it. Then your child reads a column alone. Some of the words:

      ~ babe, hide, mode, ace

      ~ lake, dice, page, make

      ~ bake, cake, dike, yoke

      ~ dale, mile, hole, like, duke'
  - - Spell aloud
    - 'Now the old way: your child looks at a word, then spells it aloud and says it.

      Say: c, a, k, e, cake.

      Go down a column like this. Then cover the column, say a word, and have your child spell it aloud without looking.

      Make sure the silent e is spelled even though it is not heard.'
