    - 'A prefix is a small part put in front of a word to change its meaning. Read the book''s rules: fore means before (foretell: tell before), dis often means not (disagree), counter means against (counteract). Some of the words:

      ~ fore-tell, fore-noon

      ~ dis-agree, dis-able

      ~ be-friend, co-exist'
  - - Take words apart
    - 'Your child splits five words into prefix and root and says what each means: disagree, foretell, befriend, coexist, debase.'
  - - Dictation
    - 'Dictate: careful, peaceful, artist, disagree, foretell, befriend.'
