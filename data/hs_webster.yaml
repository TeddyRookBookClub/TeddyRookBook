- title: 'Ei and ie with the sound of long e: receive, believe'
  mins: 15
  goal: Your child spells common words with ei and ie that say long e.
  materials: *id001
  book: 'A short essay, "Ei and ie with the sound of e long", explains that these letters are easy to confuse, and the author has "arranged the principal words of these classes in two distinct tables": words in which e stands before i (ceil, receive, ceiling, either, receipt, conceit) and words in which i stands before e (achieve, grieve, liege, retrieve, grievance).'
  steps:
  - - The problem
    - 'Read the opening of the essay:

      ~ The letters ei and ie occur in several words with the same sound, that of long e

      Say: Both say long e, so we have to know which way each word goes.'
  - - Two tables
    - 'Look at the two lists. Some words:

      ~ ceiling, receive, receipt, conceit

      ~ achieve, grieve, retrieve, grievance

      Point out that most of the ei words have a c before them: ceiling, receive, conceit.'
  - - The rhyme
    - 'Teach the old rhyme: "i before e, except after c." It fits most of these words. (It is not in this book, but it helps.)'
  - - Spell aloud
    - 'Your child spells by syllables: re-ceive, ceil-ing, a-chieve, re-trieve, griev-ance.'
  - - Dictation
    - 'Dictate: receive, ceiling, receipt, achieve, grieve, believe.'
  - - Wrap up
    - Your child sorts six words into the two tables without looking.
