- title: Words difficult to spell, part 1
  mins: 15
  goal: Your child learns to spell a set of common words that are often misspelled.
  materials: *id002
  book: 'The first page of No. 152, "Words Difficult to Spell": abeyance, acquiesce, aeronaut, aisle, amateur, bazaar, beacon, biscuit, borough, chivalry, cousin, crumb, cuckoo, eagle, elephant, encyclopedia, and many more.'
  steps:
  - - The idea
    - No. 152, "Words Difficult to Spell", is the book's last table, four pages of words that trip up even grown-ups. Don't try to learn a whole page. Choose about ten useful words each time.
  - - Read the table aloud
    - 'Read down the columns together. Your child reads, you help with any odd ones. Some of the words:

      ~ abeyance, acquiesce, aisle, amateur

      ~ bazaar, beacon, biscuit, borough

      ~ chivalry, cousin, crumb, cuckoo

      ~ eagle, elephant, encyclopedia'
  - - Find the trap
    - 'For each chosen word, your child finds the "trap": a silent letter, a double letter, a strange vowel. Underline it with a finger.'
  - - Spell aloud by syllables
    - Your child spells each chosen word aloud by syllables, then with eyes closed.
  - - Dictation
    - 'Say each word, use it in a short sentence of your own, and say it again. Your child writes it. Try these: aisle, biscuit, cousin, crumb, elephant, eagle.

      Check together against the book. Any word that came out wrong goes on a card for tomorrow.'
  - - Review
    - Missed words go on cards. Review the cards from earlier parts of No. 152 before starting the next part.
