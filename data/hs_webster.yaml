- title: 'Endings -ful and -ist, and prefixes: ante, be, dis, fore'
  mins: 15
  goal: Your child knows the meaning of common beginnings and endings and uses them to read and spell new words.
  materials: *id001
  book: 'Words made with -ful, then -ly and -ness (artful, painful, careful, graceful, peaceful); words in -ist meaning a person who does something (artist, organist, humorist); and prefixes with their meanings: ante (before), anti (against), be, con or co (with), counter (against), de (down from), dis (apart, or not), fore (before), in or im (in, or not), each with a list (antedate, befriend, coexist, counteract, debase, disagree, foretell, forenoon, immaterial).'
  steps:
  - - Review
    - Your child writes happiness and careless and shows the parts.
  - - -ful words
    - 'care + ful = careful; then careful + ly = carefully, careful + ness = carefulness. Read the book''s list across: artful, painful, careful, graceful, peaceful.'
  - - -ist words
    - 'An -ist is a person who does something: an artist does art, an organist plays the organ.'
