book:
  id: elementaryspelliwebs
  title: The Elementary Spelling Book, being an Improvement on the American Spelling Book
  year: '1880'
  key: webster
  short: Webster's Speller
  eyebrow: Spelling and Grammar · Webster's Elementary Spelling Book
  hero: Noah Webster's "blue-backed speller", from the key to the sounds and the first syllables (ba, be, bi) to words of eight syllables, with the fables and the rules for spelling. 142 short guides cover the whole book, for children about 5 to 10, each with the right page of the book beside it.
  how:
  - <b>A little, every day.</b> About 10 to 15 minutes a day is plenty. Some guides take two or three days; the guide says so.
  - '<b>Out loud.</b> Webster''s method is to read every word aloud and spell it aloud, a syllable at a time: "b, a, ba; k, e, r, ker; baker." The guides keep that habit.'
  - <b>Use the key.</b> The book marks vowel sounds with small signs, and the line of key words across the top of every page shows what each sign means. The first guides teach it.
  - <b>Cards for hard words.</b> Any word missed in dictation goes on a card. Review the cards for a minute or two each day, and retire a card after three right days in a row.
  - <b>Move on when it's easy.</b> Repeat a table until your child reads and spells it without stumbling, then go on. Young children can skip the hardest words in the long tables and come back later.
  unitword: Part
  lessonword: ''
  numnote: Each guide covers one or a few of the book's numbered tables (No. 1, No. 2...) or one of its reading lessons, shown beside the title.
