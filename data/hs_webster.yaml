      ~ three, III, third

      ~ twelve, XII, twelfth'
  - - Roman letters
    - 'Explain: I is 1, V is 5, X is 10, L is 50, C is 100, M is 1000. A smaller letter before a bigger one means take away: IV is 4, IX is 9, XC is 90. The table numbers in this very book use Roman letters too (No. 12 is printed XII).'
  - - Spell the hard ones
    - 'Your child spells aloud: four, fourth; eight, eighth; nine, ninth; twelve, twelfth; forty; hundred.'
  - - Dictation
    - 'Dictate: first, second, third, fourth, fifth, eighth, twelfth, twentieth. Then write three numbers in Roman letters.'
  - - Wrap up
