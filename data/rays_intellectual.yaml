  materials: *id001
  book: About twenty-seven chains, starting with the model “3 minus 2 plus 1 equals 2”, up to long ones like 9 − 7 + 8 − 5 + 6 − 3 + 4 − 2 + 1.
  steps:
  - - Warm up
    - Ask three or four problems from the last lesson again, out of order. Your child answers and says why.
  - - Show the reasoning
    - 'Say: 3 minus 2 is 1; plus 1 is 2. So 3 − 2 + 1 = 2.

      Go left to right, saying each running total. Have your child point along the line with a finger.'
  - - Work the problems aloud
    - 'Read each problem on the page aloud. Your child answers, then explains in a full sentence, the way the book''s model solutions do. The problems go like this:

      ~ 8 − 4 + 6 − 5 = ?

      ~ 1 + 2 + 3 − 4 + 5 − 6 + 7 − 5 + 9 = ?

      ~ 9 − 7 + 8 − 5 + 6 − 3 + 4 − 2 + 1 = ?'
