  title: Multiplying in stories
  goal: Your child uses multiplication in stories about prices, distances, rows and work.
  mins: 20
  materials: *id001
  book: Twenty-five problems with several model solutions, such as “7 oranges will cost 7 times 2 cents, which are 14 cents”, and a note that $6 is read “6 dollars”.
  steps:
  - - Warm up
    - Ask three or four problems from the last lesson again, out of order. Your child answers and says why.
  - - Show the reasoning
    - 'Say: A man travels 7 miles an hour. In 8 hours he travels 8 times 7 miles, which are 56 miles.

      Look out for the one problem that goes the other way: if 2 men take 3 days, 1 man takes 2 times 3 days, which are 6 days.'
