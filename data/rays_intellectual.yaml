book:
  id: raysnewintellect00rayjrich
  title: Ray's New Intellectual Arithmetic
  year: 1877
  key: intellectual
  short: Intellectual
  eyebrow: Ray's Arithmetic · Book 2 · 1877
  hero: 80 lessons of mental arithmetic, from adding in your head to fractions, ratio, percentage and interest, for children about 7 to 10. Every problem is solved aloud and explained, and each lesson has a guide.
  key_id: keytoraysnewarit00rayj
  how:
  - <b>Out loud, in the head.</b> “Intellectual” means mental. Children answer aloud and then say why, following the model solutions printed in the book. Paper is only for jotting.
  - <b>A little each day.</b> About 20 minutes a day. Most lessons have 20 to 40 problems; spread them over two or three days.
  - <b>Where to start.</b> After Ray's New Primary Arithmetic, the book says you may begin at Lesson IV.
  - <b>Answers.</b> Each guide gives the answers that could be read clearly from the scan. Ray's own <i>Key</i> has them all, with worked solutions (see the book list).
  - <b>Reasoning is the goal.</b> Many later problems are puzzles. Let your child struggle a little, then model the first half of the explanation together.
units:
- id: 1
  name: Adding and subtracting in your head
  from: 1
  to: 11
  text: Addition and subtraction to about 100, said aloud, with the reason for every answer.
- id: 2
  name: Multiplying and dividing
  from: 12
  to: 19
  text: 'The tables to 12 × 12, then reasoning problems: from one thing to many, and from many to one.'
- id: 3
  name: What fractions are
  from: 20
  to: 29
  text: Halves, thirds and fourths of real things, writing fractions, and changing them from one form to another.
- id: 4
  name: Working with fractions
  from: 30
  to: 44
  text: Adding, subtracting, multiplying and dividing fractions, all in the head, with story problems.
- id: 5
  name: Review
  from: 45
  to: 46
  text: Two long mixed reviews before the book turns to measures and harder reasoning.
- id: 6
  name: Money, weights and measures
  from: 47
  to: 54
  text: The tables of money, measure, weight, length and time, and problems that use them.
- id: 7
  name: Reasoning puzzles, ratio and proportion
  from: 55
  to: 63
  text: 'Classic puzzles: parts of a number, ages, work done together, ratio, proportion and partnership.'
- id: 8
  name: Percentage and interest
  from: 64
  to: 79
  text: Per cent, gain and loss, discounts, commission, insurance, and simple interest every way round.
- id: 9
  name: Miscellaneous
  from: 80
  to: 80
  text: The book ends with sixty-one mixed problems. Spread them over several weeks.
lessons:
- num: 1
  roman: I
  idx: 11
  title: Adding small numbers, and saying why
  goal: 'Your child adds small numbers in story problems and explains each answer: “Because 3 and 2 are 5.”'
  mins: 20
  materials: &id001
  - The book page (press “📖 Book page”, or use a printed copy)
  - Paper for jotting, though the work is meant to be done in the head
  book: Twenty-six short addition stories about apples, cents and marbles. The first answers are modelled as “Ans. 2. Why? Because 1 and 1 are 2.” The lesson ends with the definitions of addition, sum, + (plus) and = (equals).
  steps:
  - - Warm up
    - 'Ask a few facts to 10 aloud: 4 and 3, 5 and 5, 6 and 2.'
  - - Show the reasoning
    - 'Read the first problem aloud and answer it the book''s way.

      Say: James had 1 apple and his brother gave him 1 more. He had 2 apples. Why? Because 1 and 1 are 2.

      This question-answer-reason pattern is the heart of the whole book. Practise it on the first three problems together.'
  - - Work the problems aloud
    - 'Read each problem on the page aloud. Your child answers, then explains in a full sentence, the way the book''s model solutions do. The problems go like this:

      ~ James had 1 apple, and his brother gave him 1 more: how many did he then have?

      ~ Ida had 4 cents; her mother gave her 3 cents, then 1 cent more: how many had she?

      ~ A lady paid 1 dollar for gloves, 3 for a shawl and 3 for a dress: how much did she spend?'
  - - Ask “Why?”
    - After each answer ask “Why?” or “How do you know?” Ray's wants the reasoning said aloud, not just the number. If your child stalls, go back to the model and say the first half of the explanation together.
  - - Wrap up
    - Pick the two problems that were hardest today. Tomorrow, start with those as the warm-up.
  practice: Do the rest of the lesson's problems over the next day or two, a few at a time. Move on when your child can explain them without help.
  answers: 1) 2. 2) 3. 3) 4. 4) 5. 5) 4. 6) 5. 7) 6. 8) 6. 9) 6. 10) 7. 12) 8. 13) 8. 14) 9. 15) 8. 16) 10. 17) 10. 18) $9. 19) 10. 20) $7. 21) 11. 22) 10 lb. 23) 10. 24) 7. 25) 10. 26) 8.
  tip: If your child has finished Ray's New Primary Arithmetic, the book says you may start at Lesson IV. Lessons I to III are still a gentle way to learn the “Why? Because…” habit.
  unit: 1
