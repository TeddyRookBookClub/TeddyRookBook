- key: phonics-pre-reading
  slug: pre-reading-workbook
  short: Pre-Reading Workbook
  icon: 🐚
  ages: 2–8
  kind: file
  title: Crystal and Shell Pre-Reading Workbook
  blurb: A themed workbook of letter names and letter sounds, in print and cursive, for children who are getting ready to read. One large PDF.
  how:
  - Download the workbook once and print the pages you need; it is a very large file (about 232 MB), so use Wi-Fi and give it a few minutes.
  - Do a page or two a day alongside plenty of reading aloud.
  - When your child knows the letters and their sounds, move on to <b>Teach Your Child to Read in 120 Lessons</b>.
  level: Getting ready
  source: https://www.hannahwardeducation.com/prereading
  buy: https://actualreading.com/products/digital-great-big-pre-reading-workbook-and-activity-bundle-letter-matching-and-phonics-grade-pre-k-2nd-age-2-6
  file: https://www.hannahwardeducation.com/_files/ugd/e8cfd4_859f2e77464d4d3dbc15286ce54c676f.pdf
  size: about 232 MB
- key: little-house-prek
  slug: little-house-pre-k
  short: Little House Pre-K
  icon: 🏡
  ages: 3–5
  kind: lessons
  title: Little House Pre-Kindergarten
  blurb: 'A full year of open-and-go preschool: 180 daily lessons, each a short math page and an English language arts page, with health, science, social studies and art folded in.'
  how:
  - 'One lesson a day: a math page and an English page. Print the day’s PDF, or show it on a tablet.'
  - Have crayons ready; some days suggest a hands-on activity with a tray of sand or salt, sticks, or play dough.
  - Read aloud to your child every day as well. <a href="../hannahs-book-lists/">Hannah’s book lists</a> are a good place to find books.
  level: Full year · Pre-K
  source: https://www.hannahwardeducation.com/littlehouseprekindergarten
  buy: https://actualreading.com/products/digital-little-house-pre-kindergarten-full-year-bundle
