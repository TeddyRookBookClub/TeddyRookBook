  title: American Pioneer Curriculum, Level 1 (English)
  blurb: A literature-rich English course rebuilt from the readers of the one-room schoolhouse, chiefly the Elson Readers, lightly updated for modern spelling. Lessons mix read-aloud poems and stories,
    talking about pictures, and early reading practice. Six books of 18 lessons.
  how:
  - 'First get Hannah’s free teacher guide (below): it explains the lesson symbols, a daily schedule, the reading guide and where to place your child.'
  - Each lesson has <b>Listen</b> (you read a poem or story aloud), <b>Discuss</b> (a vintage picture with questions) and <b>Read</b> (words and sentences for your child).
  - Every day, also do a read-aloud and some independent reading from the lists below.
