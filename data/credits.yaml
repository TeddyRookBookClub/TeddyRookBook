  # ---- Connections: The Rhythm of Numbers. Our own instruments; the page lists its sources in "Notes and sources".
  - prefix: /connections/rhythm-of-numbers/
    title: The Rhythm of Numbers
    own: true
    items:
      - name: Godfried Toussaint, "The Euclidean Algorithm Generates Traditional Musical Rhythms," Bridges 2005
        url: https://cgm.cs.mcgill.ca/~godfried/publications/banff.pdf
        what: the names of the world rhythms in the Euclidean drum machine
      - name: Robert J. Lemke Oliver and Kannan Soundararajan, "Unexpected biases in the distribution of consecutive primes," PNAS 113 (2016)
        what: the remainder bias among consecutive primes (our counts are our own)
      - name: S. Torquato, G. Zhang and M. de Courcy-Ireland, "Uncovering multiscale order in the prime numbers via scattering," J. Stat. Mech. (2018)
        what: the primes as an "effectively limit-periodic" pattern
      - name: M. A. Morrison and J. Brillhart (1975); D. H. Lehmer and R. E. Powers (1931)
        what: factoring with continued fractions
      - name: mpmath and SymPy
        url: https://mpmath.org/
        what: the checks behind every number on the page (continued fractions, zeta zeros, primes)
        licence: BSD License
      - name: L. R. Ford, "Fractions," American Mathematical Monthly 45 (1938); R. L. Devaney, "The Mandelbrot Set, the Farey Tree, and the Fibonacci Sequence," American Mathematical Monthly 106 (1999)
        what: Ford circles and the Farey order of the Mandelbrot bulbs (Chapter VII, fractals; our pictures are our own)
      - name: M. H. Jensen, P. Bak and T. Bohr, Physical Review Letters 50 (1983); O. Jenkinson and M. Pollicott (2001 and arXiv 1611.09276)
        what: the devil's staircase dimension and the dimension of the 1-and-2 dust (our dimension table is computed for the page)
      - name: A. Monnerot-Dumaine, "The Fibonacci Word fractal" (2009)
        url: https://hal.archives-ouvertes.fr/hal-00367972/
        what: the drawing rule for the Fibonacci word fractal
