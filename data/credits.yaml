        what: the Harvard Classics print and e-book exports; by B. Jackowski, J. M. Nowacki, P. Pianowski and P. Strzelczyk, converted to TrueType outlines for this site
        licence: GUST Font License
      - name: GFS Porson (as "HC Book Greek")
        url: https://www.greekfontsociety.org/
        what: Greek in the Harvard Classics exports; by the Greek Font Society, converted to TrueType outlines for this site
