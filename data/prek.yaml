# Pre-K at home (/homeschool/pre-k/): the "week of ideas" pools. layouts/homeschool/pre-k/list.html prints the
# first five of each pool as the starting week; static/homeschool/prek/week.js deals out a new week on request.
# Each idea is one short sentence a grown-up can do with everyday things. Keep them gentle and away from the screen.
week:
- key: story
  icon: 📖
  name: Story
  ideas:
  - Read a picture book together. Let your child turn the pages.
  - Read a nursery rhyme twice. The second time, stop and let your child say the last word.
  - Look at a picture book with no words, and tell the story together.
  - Read a favorite book again. Before you turn a page, ask, “What happens next?”
  - Read one of Aesop's fables aloud and talk about what happened.
  - Act out The Three Bears with toys or stuffed animals.
  - Visit the library and let your child choose a book.
  - Tell a story about your child's own day, starting with “Once upon a time…”
  - Read a book about animals and make each animal's sound.
  - Read a short Winnie-the-Pooh story in two sittings.
  - Point to the pictures and name everything you see on one page.
  - Read at bedtime, then talk about the best part.
- key: song
  icon: 🎵
  name: Song or music
  ideas:
  - Sing “Twinkle, Twinkle, Little Star,” then play it on the piano page.
  - March around the room to music, and freeze when it stops.
  - Sing “Old MacDonald Had a Farm” and let your child pick each animal.
  - Tap a wooden spoon on a pot like a drum while you sing.
  - Sing a counting song, like “Five Little Ducks,” using fingers.
  - Clap along to a song, first fast, then slow.
  - Clap loudly, then softly, then very softly.
  - Sing “Mary Had a Little Lamb” together.
  - Hum a song you both know and see if your child can guess it.
  - Sing “Hot Cross Buns” and find its three notes on the piano page.
  - Dance to music, then sway slowly to a quiet song.
  - Sing “The Wheels on the Bus” with the hand motions.
- key: count
  icon: 🔢
  name: Counting
  ideas:
  - Count the steps as you go up the stairs.
  - Count spoons as you set the table.
  - Count crackers at snack time. Eat one, then count again.
  - Put out five blocks. Hide some under a cup. How many are hiding?
  - Count the buttons on a coat.
  - Build a tower of blocks and count how tall it is.
  - Count cars or trucks on a walk.
  - Line up three toys from smallest to biggest.
  - Look for numbers on doors, clocks and signs.
  - Find things shaped like circles in the kitchen.
  - Match socks from the laundry and count them.
  - Share snacks between two plates. Does each plate have the same?
- key: outdoor
  icon: 🌳
  name: Outdoor time
  ideas:
  - Go on a walk and collect five leaves. Which one is biggest?
  - Look for birds and listen for their songs.
  - Draw with chalk on the sidewalk.
  - Lie on the grass and watch the clouds. What shapes do you see?
  - Hop, crawl and waddle like different animals.
  - Water a plant or a garden together.
  - Play catch with a soft ball.
  - Look under a log or a stone for little creatures, then put it back gently.
  - Make a shape or a letter on the ground with sticks.
  - Jump in puddles after the rain, in boots.
  - Look for the moon in the evening sky.
  - Visit a park and talk about what you see and hear.
- key: art
  icon: 🖍️
  name: Art
  ideas:
  - Draw with crayons on a big sheet of paper.
  - Roll play dough into snakes, balls and pancakes.
  - Tear paper scraps and glue them into a picture.
  - Paint with water on a fence or the sidewalk.
  - Make leaf rubbings with crayons and thin paper.
  - Draw your family and tell who is who.
  - Dip a sponge in paint and press it on paper to make prints.
  - Fold a sheet of paper and make a card for someone.
  - Build something with blocks, then draw it.
  - Try a lesson from Drawing for Young Artists together.
  - Make a picture from circles, squares and triangles cut from paper.
  - Color a page from the hand-skills printables.
- key: practice
  icon: ✏️
  name: A little practice
  ideas:
  - One Little House Pre-K lesson by Hannah Ward.
  - One Math Ladder Pre-K lesson, then count real things.
  - "Pre-reading game: Big and small letters."
  - A tracing sheet from the hand-skills printables.
  - "Pre-reading game: Rhyme time."
  - A maze from the hand-skills printables.
  - "Pre-reading game: Clap the parts."
  - A dot-to-dot to 10.
  - "Pre-reading game: Same start."
  - Cutting practice with child-sized scissors.
  - A color-by-shape sheet.
  - Write your child's name in big letters for them to trace.
