- title: Water from a candle, and water's changes
  mins: 35
  goal: Your child can show that a burning candle makes water, and explain that water is the same substance whether it is ice, liquid or steam.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - A small metal bowl with ice and a little water in it
  - An oven mitt
  - A plastic cup, a marker, and a freezer
  - Ice cubes and a glass of water
  - Science notebook
  book: 'Faraday collects a drop of water under a dish of ice and salt held over a candle, tests it with potassium, and shows bottles of water made by burning gas,
    oil and wax. Then he shows water as ice and steam: iron bottles burst by freezing, a flask of steam rattling its lid, and a tin flask crushed as steam condenses.'
  steps:
  - - Hook question
    - 'Say: Last time the cold spoon went misty. Can we prove the mist is really water, and where it came from?'
  - - Read together
    - 'Read pages 68 to 81 (you can read the part about steam and ice more quickly).

      ~ we find that that part of the product is just water — nothing but water.'
  - - Catch water from a candle
    - 'This is Faraday''s own set-up, made safe. Wearing the oven mitt, the adult holds the metal bowl of ice water a few inches above the flame for half a minute.
      Look under the bowl: drops of water collect there, with a little soot. Faraday said:

      ~ The head of a poker is a very good thing to try with, and if it remains cold long enough over the candle, you may get water condensed in drops on it

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.'
  - - How Faraday tested the drop
    - 'Watch only: don''t try this at home.

      Faraday dropped a bit of potassium, a soft metal, into a basin of water: it lit up and floated about, burning with a violent flame. Then he put potassium on
      the drop collected from the candle, and it took fire the same way. That proved the drop was water. Potassium is far too dangerous to handle outside a laboratory.
      If you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.

      He also said:

      ~ A pint of oil, when burnt fairly and properly, produces rather more than a pint of water.'
  - - Ice and steam
    - 'Water expands when it freezes. Faraday froze water in thick iron bottles screwed shut until they burst. Try it the safe way: fill a plastic cup halfway with
      water, mark the level, and freeze it overnight. Check the new level in the morning. (Never freeze water in glass or in anything sealed.)

      Drop an ice cube in a glass of water:

      ~ Why does the ice float? — think of that, and philosophise.

      Faraday''s tin flask, crushed when cold water made its steam condense, is watch only: hot steam burns badly.'
  - - Say it back and check
    - 'Narration prompts: How did Faraday prove the drop was water? What happened to the iron bottles? Why does ice float?

      Check questions:

      1. Is water made by a candle different from river water?

      2. Faraday says a cubic inch of water makes about a cubic foot of steam. How many times bigger is that?

      3. Why does ice float?'
  - - What we know now
    - 'Water does expand by about one-tenth when it freezes, which is why ice floats and frozen pipes burst. Faraday''s cubic inch to cubic foot is very close to
      today''s figure: water swells about 1,700 times when it turns to steam at boiling point.'
  practice: 'Notice it this week: water appearing where something cold meets warm, damp air: a cold drink "sweating," a misty bathroom mirror, a window on a cold
    morning.'
  tip: Faraday mentions frozen pipes in his own house the week before ("the sad catastrophe"). It was a very cold winter in London.
  answers: '1. No. Faraday says it is exactly the same: "Water is one individual thing — it never changes." 2. A cubic foot is 12 × 12 × 12 = 1,728 cubic inches,
    so about 1,728 times bigger. 3. Ice takes up more room than the water that made it, so it is lighter for its size, and floats.'
  num: 7
  roman: Lecture III, part 1
  idx: 69
  unit: 3
- title: Iron, steam, and a gas that burns
  mins: 30
  goal: Your child can explain that the water from a candle comes partly from the candle and partly from the air, and describe how iron took something out of steam.
  materials:
  - A plain iron nail or a pad of plain steel wool (no soap)
  - A saucer with a little water
  - Science notebook
  book: Faraday asks where the candle's water comes from. He shows potassium, iron and zinc acting on water, passes steam over red-hot iron in a gun-barrel, collects
    a gas that burns, pours it upward from jar to jar, and makes the same gas with zinc and acid.
  steps:
  - - Hook question
    - 'Say: The water from the candle has to come from somewhere. Is it hiding inside the wax? Is it in the air?'
  - - Read together
    - 'Read pages 81 to 90, stopping at "This is hydrogen."

      ~ Water is the same everywhere, whether produced from the ocean or from the flame of the candle.'
  - - Faraday's answer
    - '~ It is neither in one nor the other, but it comes from their conjoint action, a part from the candle, a part from the air

      Say: Something from the wax and something from the air join together in the flame and make brand-new water.'
  - - 'Start a slow experiment: iron and water'
    - Faraday says iron filings in water "become rusty" and act on the water slowly, much more gently than potassium does. Put the nail or a little steel wool on
      a saucer with a few spoonfuls of water. Look at it every day this week and note the rust in the notebook.
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      Faraday packed an iron tube with iron turnings, made it red-hot in a furnace, and passed steam through it. What came out was not steam: it did not turn back
      into water when cooled, and it burned with a little noise.

      ~ Steam puts out a fire — it does not burn; but you saw that what I had in that jar burnt.

      The iron came out heavier, because it had taken something out of the steam. The new gas was so light that he could pour it upward from one upside-down jar into
      another. He also made it from zinc and acid. Red-hot furnaces, acids and burnable gas are laboratory work. If you want to see it, search online for a video
      of a chemistry teacher doing this demonstration and watch it together.'
  - - Say it back and check
    - 'Narration prompts: What did the steam do to the hot iron? How could Faraday tell the gas was not steam? How did he pour a gas upward?

      Check questions:

      1. Where does the water from a candle come from?

      2. Why did the iron get heavier?

      3. Why do you think Faraday held the jars upside down?'
  - - What we know now
    - Rust is iron joined with oxygen (with water helping). In Faraday's hot tube, the iron took the oxygen out of the steam and let the hydrogen go, which is why
      the iron got heavier.
  practice: 'Notice it this week: check the nail or steel wool each day. Rust is iron slowly doing what the red-hot iron did quickly.'
  tip: You will meet the name of the light gas at the start of the next lesson. If your child guesses it, wonderful.
  answers: '1. Partly from the candle and partly from the air; it is made by the two acting together in the flame. 2. It took something out of the steam (we now know
    it was oxygen) and kept it. 3. Because the gas is very light: it rises, so an upside-down jar keeps it in.'
  num: 8
  roman: Lecture III, part 2
  idx: 82
  unit: 3
- title: Hydrogen, the water-maker
  mins: 30
  goal: Your child can describe hydrogen (very light, burns with a hot pale flame, makes only water when it burns) and explain why it is not a home experiment.
  materials:
  - A party balloon blown up with breath
  - A helium party balloon, if you can get one (optional)
  - Science notebook
  book: Faraday names hydrogen, makes it with zinc and acid in a "philosopher's candle," burns it to make water, blows soap bubbles and balloons with it, gives its
    weight against water, and ends with the flash of a large voltaic battery.
  steps:
  - - Hook question
    - 'Say: What do you think is the lightest gas in the world?'
  - - Read together
    - 'Read pages 90 to 98, to the end of Lecture III.

      ~ This is hydrogen — a body classed among those things which in Chemistry we call elements, because we can get nothing else out of them.

      ~ And this gas has been so named hydrogen, because it is that element which, in association with another, generates water.'
  - - Why we watch only
    - 'Faraday wanted his audience to make hydrogen at home with zinc and acid, and he gave a careful warning:

      ~ I am not afraid to shew you, for I wish you to make experiments, if you will only make them with care and attention, and the assent of those around you.

      Watch only: don''t try this at home. Hydrogen mixed with air explodes when lit, and the acids are dangerous. Faraday himself fills his little bottle nearly
      full of liquid for exactly that reason. If you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - What hydrogen does
    - 'Faraday lit a jet of hydrogen:

      ~ It is a foolish feeble sort of a flame, you may say; but it is so hot that scarcely any common flame gives out so much heat.

      A cold glass held over it was soon wet: burning hydrogen makes water, and nothing else.

      ~ It is important to remember that this hydrogen is the only thing in nature which furnishes water as the sole product of combustion.'
  - - Light gas, heavy water
    - 'Soap bubbles blown with hydrogen rose to the roof of the theater. Compare: let go of a breath-filled balloon (it sinks) and a helium balloon (it rises). Helium
      is the safe light gas we use today.

      Faraday''s numbers: a pint of hydrogen weighs three-quarters of a grain; a pint of water weighs 8,750 grains. Ask your child to work out about how many times
      heavier the water is (8,750 ÷ ¾).'
  - - The battery
    - 'Watch only: don''t try this at home. Faraday ended with a huge battery of forty zinc plates, making a brilliant flash and burning an iron file. He said that,
      used wrongly on himself, it "would destroy me in an instant." Never experiment with electricity from wall sockets.'
  - - Say it back and check
    - 'Narration prompts: What is hydrogen''s flame like? What does hydrogen make when it burns? How did Faraday show it is light?

      Check questions:

      1. What does the name hydrogen mean?

      2. Why did Faraday fill the bottle nearly full before lighting the gas at the tube?

      3. Where is the hydrogen in a candle?'
  - - What we know now
    - Hydrogen is the lightest element of all (symbol H). Balloons and airships were once filled with it, but it burns so easily that they were dangerous; helium,
      which does not burn, is used instead. Hydrogen and oxygen are still burned together as a rocket fuel.
  practice: 'Notice it this week: keep checking the rusting nail. Also look at the ingredients on a candle or lamp-oil label; these fuels are made mostly of carbon
    and hydrogen.'
  tip: Let your child do the division with paper or a calculator; the answer is not meant to be exact, just enormous.
  answers: '1. "Water-maker" (from the Greek words for water and to generate, as the book''s footnote shows). 2. Hydrogen mixed with air explodes; the air had to
    be swept out of the bottle first. 3. It is part of the wax; when the candle burns, its hydrogen joins with something from the air to make water. Arithmetic: 8,750
    ÷ 0.75 ≈ 11,667, so a pint of water is roughly 11,700 times heavier than a pint of hydrogen.'
  num: 9
  roman: Lecture III, part 3
  idx: 91
  unit: 3
- title: Pulling water apart with electricity
  mins: 30
  goal: Your child can explain how Faraday used a battery to split water into gas, and then turned the gas back into water.
  materials:
  - Science notebook and colored pencils
  book: 'Faraday shows what his battery can do: it pulls something brown out of a salt solution on paper (he writes the word "juvenile" with it), moves copper from
    one plate to the other, and turns water into a gas that explodes with a spark and becomes water again.'
  steps:
  - - Hook question
    - 'Say: Hydrogen comes out of water. If something else is in water too, how could we pull it out and see it?'
  - - Read together
    - 'Read pages 99 to 110, stopping at "Just now you saw that one end of this battery."

      ~ I see you are not tired of the candle yet, or I am sure you would not be interested in the subject in the way you are.'
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      First he dissolved copper in nitric acid, making red fumes and a blue liquid. With the battery wires he pulled a brown substance out of a salt solution on wet
      paper, and wrote the word "juvenile" with it. He dipped two platinum plates in the blue liquid and the battery coated one plate with copper; when he swapped
      sides, the copper moved over.

      Strong acids, toxic fumes and a large battery are laboratory work. If you want to see it, search online for a video of a chemistry teacher doing this demonstration
      and watch it together.'
  - - Water into gas, and back again
    - 'Faraday passed the battery''s electricity through water with a little acid in it. It bubbled as if boiling, but the gas did not turn back into water when cool:
      it was a permanent gas. It burned with a bang. Then he put some in a strong closed glass vessel and set it off with an electric spark. The gas vanished, and
      drops of water ran down the inside.

      ~ The water of the candle had the atmosphere helping to produce it; but in this way it can be produced independently of the air.

      Explosions in closed glass vessels are strictly for the laboratory.'
  - - The idea in plain words
    - 'Say: The battery split water into gas. The spark joined the gas back into water. So water must hold hydrogen and some second thing that a candle normally takes
      from the air.'
  - - Draw it
    - 'Have your child draw the story as a loop: water → (battery) → gas → (spark) → water. Label what Faraday did at each arrow.'
  - - Say it back and check
    - 'Narration prompts: How did Faraday test whether the bubbles were steam? What happened when he sparked the gas? How was this water different from the candle''s
      water?

      Check questions:

      1. How did Faraday know the gas from the water was not steam?

      2. What did the copper experiment show the battery could do?

      3. What must water contain besides hydrogen?'
  practice: 'Notice it this week: copper-colored coins, wires or pipes; Faraday moved copper from place to place with electricity, and the same idea is used to coat
    metal objects today.'
  tip: 'Faraday calls the battery''s flash a "telegram" from Mr. Anderson: a joke about the new telegraph of his day.'
  answers: 1. It stayed in the jar as a gas and did not condense into water, as steam would when cooled. 2. It could pull a substance out of a solution and move it
    from one plate to the other. 3. The substance that a candle takes from the air and joins to hydrogen to make water (named oxygen in the next lesson).
  num: 10
  roman: Lecture IV, part 1
  idx: 100
  unit: 4
- title: 'Two gases from water: oxygen gets its name'
  mins: 30
  goal: Your child can explain that water splits into two volumes of hydrogen and one of oxygen, and describe the test for each gas.
  materials:
  - Modeling clay or play dough in two colors (or marshmallows and toothpicks)
  - Science notebook
  book: Faraday collects the two gases from water in separate jars, one filling twice as fast; tests one as hydrogen and finds the other makes a splinter burn brightly;
    names it oxygen; gives the weights of water's parts; and makes oxygen from black oxide of manganese and chlorate of potash.
  steps:
  - - Hook question
    - 'Say: If we split water and keep the two parts in separate jars, which jar do you think will fill faster?'
  - - Read together
    - 'Read pages 110 to 119, stopping at "Now, as regards this very property of oxygen supporting combustion."

      ~ The gas itself will not burn, but it will make the splinter of wood burn.'
  - - Naming oxygen
    - '~ What shall we call it, A, B, or C? Let us call it O — call it "Oxygen:" it is a very good distinct-sounding name.

      Faraday is teasing: the name oxygen was already well known by 1860. But he wants the children to feel they found it themselves.'
  - - Two to one
    - '~ we get two volumes of hydrogen, and one of the body that burns it.

      Faraday''s table shows that by weight, water is 88.9 parts oxygen and 11.1 parts hydrogen out of 100. So oxygen is the heavy part. He gives the weights: a pint
      of hydrogen weighs three-quarters of a grain, and a pint of oxygen nearly twelve grains.

      Ask: How many times heavier is oxygen than hydrogen, pint for pint? (12 ÷ ¾)'
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      Faraday made oxygen by heating black oxide of manganese red-hot in an iron bottle, and by heating chlorate of potash with it in a glass retort. A glowing or
      burning splinter blazes up brightly in oxygen. These chemicals and hot glass are not for home. If you want to see it, search online for a video of a chemistry
      teacher doing this demonstration and watch it together.'
  - - Make a model of water
    - 'Use clay to make one large ball (oxygen) and two small balls (hydrogen), and stick them together. That is one tiny piece of water. Make several, and count:
      twice as many hydrogens as oxygens, just as Faraday''s jar filled twice as fast.'
  - - Say it back and check
    - 'Narration prompts: How did Faraday test each jar? Why did one jar fill twice as fast?

      Check questions:

      1. What is the test for hydrogen? For oxygen?

      2. Twice as much hydrogen by volume: does that mean twice as much by weight?

      3. Where does the candle get its oxygen?'
  - - What we know now
    - 'We write water as H₂O: two hydrogen atoms joined to one oxygen atom. An oxygen atom is about sixteen times as heavy as a hydrogen atom, which matches Faraday''s
      pint weights.'
  practice: 'Notice it this week: the formula H₂O on bottled-water ads or science posters. Now you know what the 2 means.'
  tip: Keep the clay models. You will add carbon to them later in the course.
  answers: 1. Hydrogen burns with a pale flame at the mouth of the upside-down jar; oxygen does not burn itself but makes a burning splinter burn much more brightly.
    2. No. Oxygen is much heavier, so by weight water is mostly oxygen (88.9 parts in 100). 12 ÷ 0.75 = 16 times heavier, pint for pint. 3. From the air.
  num: 11
  roman: Lecture IV, part 2
  idx: 111
  unit: 4
- title: Burning in oxygen
  mins: 30
  goal: Your child can explain that things burn far more fiercely in pure oxygen than in air, and that burning in oxygen still makes the same products.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - Three glass jars of clearly different sizes
  - A timer
  - Science notebook (for a small chart)
  book: A candle, a lamp, iron wire, sulfur and phosphorus burning in oxygen; soap bubbles of hydrogen and oxygen exploded on Faraday's hand; and potassium burning
    on water and on ice.
  steps:
  - - Hook question
    - 'Say: Air is only part oxygen. What would happen if a candle had pure oxygen to burn in?'
  - - Read together
    - 'Read pages 119 to 126, to the end of Lecture IV.

      ~ whatever can burn in air, can burn with a far greater intensity in oxygen, leading you to think that perhaps the atmosphere itself owes all its power of combustion
      to this gas.'
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      In jars of oxygen, a candle blazed like the battery''s spark, iron wire caught fire and burned brilliantly ("if it were a bar as thick as my wrist, it would
      burn the same"), sulfur burned fiercely, and phosphorus gave a glorious light:

      ~ I can do it better for you here than you can do it at home.

      He even blew soap bubbles of mixed hydrogen and oxygen and exploded them on the palm of his hand. Never copy that. If you want to see it, search online for
      a video of a chemistry teacher doing this demonstration and watch it together.'
  - - The same products
    - 'Even in oxygen, the candle made nothing new: the same water and the same products as in air, only faster. Faraday explains the potassium trick too: potassium
      grabs the oxygen in water and sets the hydrogen free, and the hydrogen burns. It even works on ice, "a sort of volcanic action."'
  - - A jar race at home
    - 'The more air (and so the more oxygen) a flame has, the longer it can burn. Light a tea light, cover it with the smallest jar and time how long it burns. Air
      out the jar and repeat with the middle and the largest jar. Make a small chart: jar size and seconds.

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby. The adult lifts the warm jars.'
  - - Say it back and check
    - 'Narration prompts: What happened to the iron wire in oxygen? Why does potassium set water on fire?

      Check questions:

      1. Does a candle burning in oxygen make anything different from a candle burning in air?

      2. Which jar kept the candle burning longest, and why?

      3. What does Faraday promise at the end of the lecture about candles, gas and our fireplaces?'
  - - What we know now
    - Pure oxygen is used in hospitals and by divers and pilots. Because almost anything burns fiercely in it, there must be no flames, sparks or smoking anywhere
      near an oxygen tank.
  practice: 'Notice it this week: why do people blow on or fan a campfire or barbecue? (More air, more oxygen.) Watch with an adult.'
  tip: Faraday closes by promising that none of these strange effects happen with an ordinary candle or fire "so long as we confine ourselves within the laws that
    Nature has made for our guidance." A nice line to end on.
  answers: '1. No: the same water and the same products, only much faster and brighter. 2. The largest jar, because it holds the most air, so the flame takes longer
    to use up the fresh air. 3. That none of these strange and harmful actions happen with an ordinary candle, gas lamp or fire, as long as we keep within the laws
    of Nature.'
  num: 12
  roman: Lecture IV, part 3
  idx: 120
  unit: 4
- title: 'What air is made of: oxygen and nitrogen'
  mins: 30
  goal: Your child can explain that air is mostly nitrogen with about one part in five oxygen, and why the nitrogen matters.
  materials:
  - 100 dried beans or buttons in two colors (or graph paper and colored pencils)
  - Science notebook
  book: 'Faraday asks why a candle burns more gently in air than in oxygen. He tests for oxygen with a gas that turns red, finds a gas left over that will not burn
    or support burning, and gives a table of the air: 20 parts oxygen to 80 of nitrogen by bulk.'
  steps:
  - - Hook question
    - '~ But then you have a right to ask me, "How is it that the air and the oxygen do not equally well burn the candle?"

      Let your child guess before reading on.'
  - - Read together
    - 'Read pages 127 to 134, stopping at the table of the atmosphere.

      ~ oxygen, which burns our candles, our phosphorus, or anything else; and this other substance — nitrogen — which will not burn them.'
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      Faraday used a "test-gas" that turns red when it meets oxygen. He kept adding it to a jar of air and shaking it with water until no more red appeared. Some
      gas was left over that the test could not touch. That leftover gas was nitrogen. The test-gas is poisonous. If you want to see it, search online for a video
      of a chemistry teacher doing this demonstration and watch it together.'
  - - A "boring" gas that does a great job
    - '~ It has no smell; it is not sour; it does not dissolve in water; it is neither an acid nor an alkali

      But Faraday says imagine an atmosphere of pure oxygen:

      ~ When you see a fire in an iron grate, imagine where the grate would go to if the whole of the atmosphere were oxygen.

      ~ The nitrogen lowers it down and makes it moderate and useful for us'
  - - Model the air
    - '~ we find that 5 pints of the atmosphere contain only 1 pint of oxygen, and 4 pints, or 4 parts, of nitrogen by bulk.

      Count out 100 beans: 20 of one color for oxygen and 80 of another for nitrogen (Faraday''s figures). Mix them in a bowl. That is a handful of air.'
  - - Say it back and check
    - 'Narration prompts: How did Faraday find the nitrogen? What would happen to a fire grate in pure oxygen?

      Check questions:

      1. Why does a candle burn more gently in air than in pure oxygen?

      2. Name three things nitrogen does not do.

      3. What else does nitrogen do, according to Faraday, besides calming the oxygen?'
  - - What we know now
    - 'Measured carefully, dry air is about 78 parts nitrogen, 21 parts oxygen and about 1 part argon, with a tiny amount of carbon dioxide. Argon was discovered
      in 1894, after Faraday''s time; he counted it with the nitrogen. To show today''s numbers, change two nitrogen beans: one into oxygen (21) and one into a third
      color for argon (1), leaving 78 nitrogen.

      The book''s note calls Faraday''s test-gas "nitrous oxide." Today it is called nitric oxide, and the red gas it makes is nitrogen dioxide.'
  practice: 'Notice it this week: every breath you take is about four-fifths nitrogen, which goes in and comes back out unchanged.'
  tip: If your child likes numbers, have them turn 20 out of 100 into "one in five" and check it against Faraday's 5 pints.
  answers: '1. Air is only about one-fifth oxygen; the nitrogen dilutes it and moderates the burning. 2. Any three: it will not burn, will not let a taper burn, has
    no smell, is not sour, does not dissolve in water, is neither acid nor alkali. 3. It carries away the fumes from burning and spreads them through the air to places
    where they help plants grow.'
  num: 13
  roman: Lecture V, part 1
  idx: 128
  unit: 5
- title: Air has weight and pushes hard
  mins: 35
  goal: Your child can show with simple experiments that air has weight and presses on everything, and that it can be squeezed and springs back.
  materials:
  - A small glass or plastic cup of water and a flat piece of card (work over the sink)
  - Two rubber suction cups, if you have them
  - A hard-boiled egg (cooled) and two egg cups
  - A raw potato slice about half an inch thick and a sturdy drinking straw
  - Science notebook
  book: Faraday's table of the air, how he weighs gases with a copper bottle and a balance, the air in a box (a pound) and in the theater (over a ton), an air-pump
    holding his hand, a bladder bursting, brass hemispheres, the boys' sucker, the card on a glass of water, a potato popgun and an egg blown from cup to cup.
  steps:
  - - Hook question
    - 'Say: Does air weigh anything? How could you possibly weigh it?'
  - - Read together
    - 'Read pages 134 to 146, stopping at "We will now turn to another very important part of our subject."

      ~ I have calculated the weight of the air in this room, — you would hardly imagine it, but it is above a ton.'
  - - How Faraday weighed air
    - 'He balanced a light copper bottle, pumped in extra air, and it sank on the scale. Then he let the extra air out into a jar of water so everyone could see how
      much it was, and the bottle balanced again. Say: Same bottle, more air squeezed in, more weight. So air has weight.'
  - - The weight of air above us
    - 'Watch only: don''t try this at home. Faraday used an air-pump: his hand was held down on it, and a skin stretched over a jar burst with a loud report. He said
      every square inch carries:

      ~ fifteen pounds by weight, or nearly so

      If you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together. (Search for "Magdeburg hemispheres"
      too.)'
  - - Philosophy into toys (try these)
    - '~ We young ones have a perfect right to take toys, and make them into philosophy, inasmuch as now-a-days we are turning philosophy into toys.

      Suction cups: press one on a smooth table and try to lift it straight up.

      Card and glass, over the sink: fill the cup to the brim, slide the card on, hold it, turn it upside down, and let go of the card.

      ~ Take a wine-glass, either quite full or half-full of water, and put a flat card on the top, turn it upside-down, and then see what becomes of the card and
      of the water.

      Potato popgun: push the straw through the potato slice at both ends to make a plug at each end, then push one plug with a pencil. Point it away from faces.
      The squeezed air pops the far plug out.'
  - - The egg trick
    - 'Faraday blew an egg from one egg cup into the next. His own safety advice:

      ~ If you want to make the experiment, you had better boil the egg quite hard first, and then you may very safely try to blow it from one cup to the other, with
      a little care.

      Set the two egg cups touching, the hard-boiled egg in one, and blow sharply down the near edge of the egg. It may take a few tries.'
  - - Say it back and check
    - 'Narration prompts: How did Faraday weigh air? What held the card on the glass? Why did the potato plug pop out?

      Check questions:

      1. Why was Faraday''s hand held fast on the air-pump?

      2. What does "elasticity" of the air mean?

      3. What does the stack of five cubes help explain?'
  - - What we know now
    - Air pressure at sea level is about 14.7 pounds on every square inch, so Faraday's "fifteen pounds, or nearly so" is right. We don't feel it because it pushes
      equally from every side, and the air inside our bodies pushes back.
  practice: 'Notice it this week: drinking through a straw, a suction-cup hook, a squeezed and released bottle. Each one is the push of the air at work.'
  tip: Do the card trick over the sink the first time. A slightly damp card makes a better seal.
  answers: 1. The air was pumped out from under his hand, so the weight of the air above pressed it down, with nothing beneath to push back. 2. That air can be squeezed
    into less room, and springs back out (expands) when the pressure is taken away. 3. That the air above rests on the air below, like stacked cubes; take away the
    air underneath and the air above presses down.
