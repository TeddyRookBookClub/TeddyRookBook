- title: Platinum ore, Russian coins, and Deville's plan
  mins: 30
  goal: Your child can read Faraday's table of platinum ore, explain why Russia's platinum coins failed, and name the three points of Deville's method.
  materials:
  - A few coins of different metals
  - Science notebook
  book: The make-up of platinum ore from the Urals; Russian platinum coins; Deville's three points (intense heat, the blowpipe, and driving off metals as vapor);
    platinum melted by the battery; and how lead and platinum combine.
  steps:
  - - Hook question
    - 'Say: If you dug up a nugget of platinum ore, would it be all platinum?'
  - - Read together
    - 'Read pages 200 to 209, stopping at "His first object is to get rid of the lead."

      Look closely at the table of ore on page 200.'
  - - Read the table
    - 'Faraday''s Ural ore: platinum 76.4, iridium 4.3, rhodium 0.3, palladium 1.4, gold 0.4, copper 4.1, iron 11.7, osmide of iridium 0.5, sand 1.4. The printed
      total is 100.5.

      Ask: Which is the biggest part after platinum? (Iron.) Add up the numbers to check the total.'
  - - Platinum coins
    - 'Russia made coins of platinum. A twelve-rouble coin was worth thirty-six shillings, since a rouble was worth three shillings. But it caused trouble:

      ~ but when you have three precious metals (for you may call platinum a precious metal) worked into coin, they will be sure to run counter to one another.

      People found it worth while to buy platinum abroad, make coins of it, and bring them into Russia, so the government stopped issuing them. Look at your coins:
      what are they made of?'
  - - Deville's three points
    - 'Deville''s method depends on intense heat, blowpipe action, and the fact that some metals (like gold and palladium) can be boiled off as vapor, leaving platinum
      behind.

      Watch only: don''t try this at home. Faraday melted platinum wire and then a piece of platinum with his huge battery, wearing spectacles:

      ~ and it is neither policy nor bravery to subject any organ to unnecessary danger

      He also showed that a little lead melts a hole right through platinum foil, and that rolled-up platinum, tin and lead foils flash and explode under the blowpipe.
      Hot metals and strong electricity are not for home.'
  - - Say it back and check
    - 'Narration prompts: What is in platinum ore besides platinum? Why did the platinum coins fail? Why did Faraday wear spectacles?

      Check questions:

      1. What are Deville''s three points?

      2. What happens when lead is heated on platinum foil?

      3. Why is iron a nuisance in the ore?'
  - - Safety lesson
    - 'Faraday''s spectacles remark is worth keeping. Ask: When should a scientist (or a cook, or a woodworker) protect their eyes? Make a short list together.'
  practice: 'Notice it this week: safety glasses or goggles wherever you see them: workshops, labs, sports, a dentist''s office.'
  tip: You can skim the details of the lead process. The two stories, the coins and the spectacles, are the parts children remember.
  answers: '1. Intense heat, the action of the blowpipe, and the volatility (boiling off) of certain metals. 2. The lead and platinum combine and melt together at
    once, making a hole in the foil. 3. It does not boil off as vapor, and while it sticks to the platinum, the platinum will not flow easily. Arithmetic: the ore
    table adds to 100.5, as printed; 12 roubles × 3 shillings = 36 shillings.'
  num: 20
  roman: Platinum, part 2
  idx: 201
  unit: 7
  optional: true
- title: Fierce heat, a furnace of lime, and Faraday's farewell
  mins: 30
  goal: Your child can explain what a blowpipe does, why lime makes a good furnace, and that even metals like gold and silver can be turned to vapor.
  materials:
  - A metal spoon and a wooden spoon
  - A mug of hot (not boiling) tap water
  - Science notebook
  book: The blowpipe of oxygen and coal-gas that melts platinum like wax; the lime-light again; a candle that melts a very fine platinum wire; iron burning in sparks;
    Deville's furnace of lime; mercury, lead, gold and silver driven off as vapor; and Faraday's closing words.
  steps:
  - - Hook question
    - 'Say: A candle flame is very hot. Why can''t it melt a piece of metal?'
  - - Read together
    - 'Read pages 209 to 222, to the end of the lecture.

      ~ (Having made use of your friend, you get rid of him as quickly as you can.)

      He means the lead: it was useful for cleaning the platinum, and then it had to go.'
  - - Heat enough, but not enough supply
    - 'Faraday melted a platinum wire thinner than a hair in an ordinary candle, but he could not melt a lump of antimony there.

      ~ You see we have, therefore, heat enough in the candle, as in the voltaic battery, or in the highly-exalted combustion of the blowpipe, but we do not supply
      a continuous source of heat.

      Say: A thin wire heats up fast. A big lump loses heat as fast as the flame gives it. A blowpipe drives a steady blast of hot gas against the metal, so the heat
      keeps coming.'
  - - A furnace of lime
    - 'Deville built his furnace from two blocks of lime. Lime does not melt in the fiercest flame, and it holds the heat in:

      ~ While the front part of the lime which you saw here was so highly ignited, I could at any moment touch the back of it without feeling any annoyance from the
      heat.

      Try it gently: put a metal spoon and a wooden spoon in the mug of hot tap water for a minute. Touch the handles. Metal carries heat well; wood, like lime, does
      not.'
  - - Metals that boil away
    - 'Watch only: don''t try this at home.

      Faraday boiled mercury with the battery, made lead give off fumes, left a purple patch of gold vapor on limestone, and boiled silver in a green glow that Dr.
      Tyndall threw onto a screen. Mercury and lead fumes are poisonous. If you want to see it, search online for a video of a chemistry teacher doing this demonstration
      and watch it together.'
  - - Faraday's farewell
    - 'Faraday ends by saying his memory is failing, and that he has wanted to retire:

      ~ I have desired to retire, as I think every man ought to do before his faculties become impaired; but I must confess that the affection I have for this place,
      and for those who frequent this place, is such, that I hardly know when the proper time has arrived.

      Ask: How do you think he felt? What does it tell you about him?'
  - - Say it back and check
    - 'Narration prompts: What is a blowpipe for? Why did Deville use lime? What happened to the gold under the blowpipe?

      Check questions:

      1. Why could a candle melt the fine wire but not the antimony?

      2. Why was lime a good material for the furnace?

      3. Which two metals did Deville keep in the platinum on purpose?'
