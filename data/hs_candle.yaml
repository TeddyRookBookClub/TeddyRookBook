book:
  id: chemicalhistoryo00faraiala
  title: The Chemical History of a Candle
  year: 1908 (new impression of the edition edited by William Crookes)
  key: candle
  short: The Chemical History of a Candle
  eyebrow: Science · Chemistry · Faraday's lectures
  hero: Michael Faraday's six famous Christmas lectures for young people (1860–61), where one candle leads to flame, air, water, hydrogen, oxygen, carbon dioxide
    and our own breathing. For children about 11 to 14 with a parent, with a step-by-step guide for every session and the right page of the book beside it.
  how:
  - <b>Read aloud, then talk.</b> These were spoken lectures. Take turns reading, and stop whenever Faraday asks a question so your child can answer it.
  - '<b>Safety comes first.</b> Faraday used potassium, explosive gases, strong acids and gunpowder. Those are marked "Watch only": read what happened, then find
    a video of a teacher doing it. Every flame activity has a safety line: an adult present, hair tied back, a fireproof surface and water nearby.'
  - <b>Keep a candle kit.</b> Plain candles and tea lights, a large plate or baking tray, matches or a long lighter for the adult, a few glass jars, a metal spoon,
    baking soda and vinegar.
  - <b>Old names, new names.</b> Faraday's "carbonic acid" is carbon dioxide and "shew" is show. Each guide adds a short "What we know now" note where science has
    moved on.
  - <b>Two or three sessions a lecture.</b> About 30 to 40 minutes each, two or three times a week, takes about two months. Keep a science notebook for drawings and
    narrations.
  unitword: Part
  lessonword: ''
  numnote: Each guide covers part of one of Faraday's lectures, shown beside the title (for example "Lecture II, part 1"); the last three guides cover the extra Lecture
    on Platinum and are optional.
units:
- id: 1
  name: 'Lecture I: A candle and its flame'
  from: 1
  to: 3
  text: What candles are made of, how the melted fuel climbs the wick, and the vapor that really burns.
- id: 2
  name: 'Lecture II: Inside the flame'
  from: 4
  to: 6
  text: The vapor in the middle, the ring of heat, why flames need fresh air, why they shine, and the first sign of water.
- id: 3
  name: 'Lecture III: Water and hydrogen'
  from: 7
  to: 9
  text: Water caught from a candle, water as ice and steam, and the light, hot-burning gas hidden in water.
- id: 4
  name: 'Lecture IV: Oxygen'
  from: 10
  to: 12
  text: Water split by electricity into hydrogen and oxygen, and how fiercely things burn in oxygen.
- id: 5
  name: 'Lecture V: The air and carbonic acid'
  from: 13
  to: 15
  text: Air is oxygen and nitrogen, air has weight, and the invisible heavy gas that goes up from every candle.
- id: 6
  name: 'Lecture VI: Carbon, breathing and the conclusion'
  from: 16
  to: 18
  text: Carbon burning with a spark, breathing as a living candle, plants taking the carbon back, and Faraday's closing wish.
- id: 7
  name: The extra Lecture on Platinum (optional)
  from: 19
  to: 21
  text: 'An evening lecture for grown-ups, printed at the end of the book: platinum, its family of metals, and the fierce heat needed to melt it.'
lessons:
- title: What candles are made of
  mins: 30
  goal: Your child can name the materials candles were made from in Faraday's day and explain the three things every candle has to provide.
  materials:
  - Two or three different candles from around the house (unlit), with any labels
  - A science notebook and pencil
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  book: The start of the first lecture. Faraday greets the "boys and girls," shows candle-wood from the Irish bogs, dips, miners' candles and a candle from a sunken
    ship, then explains how tallow, stearin, spermaceti, wax and paraffin candles are made, and why fancy fluted candles burn badly.
  steps:
  - - Meet Faraday
    - 'Michael Faraday (1791–1867) started work as a bookbinder''s apprentice and became one of the most famous scientists in Britain. He gave these six talks to
      young people at the Royal Institution in London over the Christmas holidays of 1860–61. The chemist William Crookes edited them into this book, so we read them
      almost word for word as Faraday spoke.

      The Royal Institution still holds Christmas Lectures for young people every year.

      Say: For the next weeks, one ordinary candle is going to teach us chemistry.'
  - - A starting list
    - Ask your child to write down everything they think happens when a candle burns. Where does the wax go? What is the flame? Keep this list. You will look at it
      again at the very end of the course.
  - - Read together
    - 'Read pages 13 to 21 aloud, taking turns. Faraday''s old spellings ("shew" for show, "honour") are fine to read as they are.

      ~ There is no better, there is no more open door by which you can enter into the study of natural philosophy, than by considering the physical phenomena of
      a candle.

      "Natural philosophy" was the old name for science.'
  - - The idea in plain words
    - 'Faraday starts with a piece of wood from an Irish bog that burns like a candle. He says it has everything a candle needs:

      ~ The fuel provided, the means of bringing that fuel to the place of chemical action, the regular and gradual supply of air to that place of action — heat and
      light — all produced by a little piece of wood of this kind, forming, in fact, a natural candle.

      So every candle needs three things: fuel, a way to bring the fuel up to the flame, and a steady supply of air. Watch for all three in every lesson.'
  - - Look at real candles
    - 'Lay your candles on the table, unlit. Read any labels: paraffin, beeswax, soy? Find the wick. Is the candle narrower at the top? Faraday says moulded candles
      are made as cones so that they slide out of the mould, but wax candles are made differently:

      ~ A wax candle can never be cast.

      Now light one plain candle on its plate and just watch it quietly for two minutes. Don''t explain anything yet; you will study it next time.

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.'
  - - Say it back
    - 'Your child tells back, in their own words, how Faraday says candles are made. Prompts:

      What is a "dip," and how is it made?

      What did the candle from the sunken ship show?

      Why are fluted candles bad candles?'
  - - What we know now
    - Most candles today are made of paraffin wax that comes from petroleum. Faraday's paraffin came from Irish bogs. Spermaceti came from whales; whales are protected
      now, and no one makes candles from them.
  practice: 'Notice it this week: every time you see a candle, a lamp or a fire, ask "where is the fuel, how does it reach the flame, and where does the air come
    in?"'
  tip: Faraday mentions people and places of his day (Mr. Field of Lambeth, the Royal George). There is no need to look them all up; keep the story moving.
  answers: 'The three things: fuel; a way of bringing the fuel to the flame; a steady supply of air. A dip is a length of cotton dipped again and again in melted
    tallow until enough tallow builds up. The Royal George candle had lain in salt water for many years and still burned regularly when lit. Fluted candles are bad
    because their uneven shape spoils the even cup of melted fuel (he explains this fully in the next part).'
  num: 1
  roman: Lecture I, part 1
  idx: 14
  unit: 1
- title: The cup of melted wax and the climbing fuel
  mins: 35
  goal: Your child can explain why a burning candle makes a neat cup of melted wax, and how the melted fuel climbs the wick by capillary action.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - A paper towel and two drinking glasses
  - Water with a few drops of food coloring
  - A sugar cube on a saucer
  - Science notebook
  book: Faraday asks how a solid with no container can feed a flame. He shows the cup of melted fuel, explains guttering, and then capillary attraction, with a column
    of salt, a towel over a basin, wire gauze and a piece of cane.
  steps:
  - - Hook question
    - 'Say: An oil lamp has a bowl to hold the oil. A candle has no bowl at all. So how does solid wax get up into the flame?

      Let your child guess before you read.'
  - - Read together
    - 'Read pages 22 to 31, down to the line about the candle turned upside down.

      ~ You see, then, in the first instance, that a beautiful cup is formed.'
  - - Watch the cup form
    - 'Light the plain candle on its plate in a still room. After a few minutes a little pool of melted wax forms around the wick, with a firm rim. Look at it from
      the side. The rising warm air cools the outside, so the rim stays solid while the middle melts.

      Faraday says the pool stays level because of gravity:

      ~ for the same force of gravity which holds worlds together holds this fluid in a horizontal position

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.'
  - - Why fancy candles drip
    - 'If air comes from one side, the cup is lopsided and wax runs over: that is "guttering." Faraday draws a lesson from it:

      ~ It is not the best looking thing, but the best acting thing, which is the most advantageous to us.

      And another one, worth copying into the notebook:

      ~ I hope you will always remember that whenever a result happens, especially if it be new, you should say, "What is the cause? Why does it occur?" and you will
      in the course of time find out the reason.'
  - - Climbing water (capillary action)
    - '~ "Capillary attraction!" you say, — "the attraction of hairs." Well, never mind the name: it was given in old times, before we had a good understanding of
      what the real power was.

      Try it two ways. (1) Pour a little colored water on the saucer next to the sugar cube and watch the color creep up the cube, just like Faraday''s blue liquid
      creeping up his column of salt. (2) Fill one glass with colored water, set an empty glass beside it, and hang a twisted strip of paper towel from one into the
      other. Check it in an hour. This is Faraday''s story of the towel left over the side of the basin that emptied the water onto the floor.

      Say: The wick works the same way. The melted wax climbs the cotton, the way the water climbs the paper.'
  - - Why the flame stays at the top
    - 'Faraday explains that the melted fuel itself puts the flame out lower down:

      ~ Now, the only reason why the candle does not burn all down the side of the wick is, that the melted tallow extinguishes the flame.

      Ask: What would happen if you turned a burning candle upside down? (The melted fuel would run onto the wick and put it out. Don''t try it.)'
  - - Say it back and check
    - 'Your child explains, in their own words, the path of the wax: solid, melted in the cup, up the wick, into the flame.

      Check questions:

      1. Why does the rim of the cup stay solid?

      2. What is capillary attraction? Give an example from your house.

      3. Why are the fluted candles "bad burning" candles?'
  - - What we know now
    - Today we call it capillary action. It happens because the liquid is attracted to the fibers of the wick (or paper) more than it holds itself together, so it
      creeps up through the tiny gaps.
  practice: 'Notice it this week: capillary action in a paper towel wiping up a spill, a sponge, tea creeping up a sugar cube, or water rising in a cut flower stem.'
  tip: The paper towel between two glasses is slow. Set it up at the start of the lesson and check it at the end.
  answers: '1. Rising air, drawn up by the heat of the flame, cools the outside of the candle, so the edge stays cooler and does not melt. 2. The pull that makes
    a liquid creep up into thin spaces, as water climbs a towel or melted wax climbs the wick; examples: paper towel, sponge, sugar cube. 3. Their uneven shape lets
    the air stream play on them unevenly, so they cannot form a good, even cup, and the wax gutters.'
  num: 2
  roman: Lecture I, part 2
  idx: 23
  unit: 1
- title: Wax vapor, the shape of a flame, and snapdragon
  mins: 35
  goal: Your child can explain that a candle burns as a vapor, not as a solid, and describe the parts and the shape of a candle flame.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - A sheet of white card or a white wall
  - A bright flashlight (or a sunny window)
  - Science notebook and colored pencils
  book: 'The end of Lecture I: the vapor seen when a candle is blown out, the shape and brightness of the flame, Hooker''s drawing, the shadow of a flame, a flame
    blown downward, and the tongues of flame in the Christmas game of snapdragon.'
  steps:
  - - Hook question
    - 'Say: Does the wax itself burn, or does something happen to it first?

      Keep the answer in mind while you read.'
  - - Read together
    - 'Read pages 31 to 42, to the end of the first lecture.

      ~ If you blow a candle out cleverly, you will see the vapour rise from it.'
  - - The smoke trail that relights the candle (adult only)
    - 'Faraday held a lighted taper in the vapor of a candle he had just blown out:

      ~ if I hold a lighted taper two or three inches from the wick, you will observe a train of fire going through the air till it reaches the candle.

      The adult does this one. Let the candle burn for a few minutes. Blow it out gently, then at once hold a lit match or long lighter in the rising white smoke,
      a couple of inches above the wick. The flame jumps down the smoke and relights the wick. Your child watches from a short distance.

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.

      Say: The flame traveled down the vapor. So it is wax vapor that burns, not solid wax.'
  - - Draw the flame
    - 'Light the candle again and let it settle in still air. Look closely (not too close) and draw it in color. Faraday describes it as a bright oblong, brighter
      at the top, with the wick in the middle and darker parts near the bottom. Can you also see a little blue near the base?

      ~ What diamond can shine like flame?

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.'
  - - The shadow of a flame
    - 'Faraday used sunlight, then a bright electric lamp, to throw the shadow of a candle flame on a screen. Try it with a sunny window or a bright flashlight in
      a dim room. Keep the candle well away from the card or wall, at least a foot. Look for the wavy shadow of hot air streaming up above the flame.

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.'
  - - Snapdragon
    - 'Watch only: don''t try this at home.

      ~ Am I right in supposing that anybody here has played at snapdragon?

      Snapdragon was a Victorian Christmas game: raisins in a dish of burning brandy, snatched out by daring players. Faraday lit one to show the many "tongues" of
      flame that form when air flows in unevenly. It is a real fire hazard, so it is for reading about only.

      ~ Indeed, I might say, you have here a multitude of independent candles.'
  - - Say it back and check
    - 'Narration prompts: What happened when Faraday held a light in the smoke? What does the shadow show? Why does a big flame break into tongues?

      Check questions:

      1. Why do flames usually point upward?

      2. Why must Faraday be "quick and ready" when he relights the vapor?

      3. Is a big flickering flame really the shape you see at any one moment?'
  practice: 'Notice it this week: watch a candle or a gas-stove flame with an adult. Which parts are blue, which yellow? Which way does the flame lean when someone
    walks past?'
  tip: 'Faraday ends by laughing at himself for spending so long on snapdragon. It is a good place to stop: the lecture ends in the middle of the fun, just as it
    did for his audience.'
  answers: 1. The heat makes a current of air rise, and that rising current draws the flame upward. 2. If the vapor cools it condenses into liquid or solid wax, or
    the stream gets disturbed, and then it will not carry the flame. 3. No. A large flame is made of many shapes following each other so fast that the eye sees them
    all at once.
  num: 3
  roman: Lecture I, part 3
  idx: 32
  unit: 1
- title: 'Inside the flame: wax vapor and the ring of heat'
  mins: 30
  goal: Your child can describe the dark middle of the flame as unburned wax vapor, and explain that the heat is in a ring where the vapor meets the air.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - Science notebook and colored pencils
  book: Faraday draws vapor out of the dark middle of the flame through a bent glass tube, heats wax in a flask, lights the vapor at the far end of a tube, and shows
    with a strip of paper that the heat of the flame is in a ring.
  steps:
  - - Hook question
    - 'Say: Faraday says a candle disappears, if burned properly, without leaving any dirt in the candlestick. Where does it all go?

      That question carries us through the rest of the book.'
  - - Read together
    - 'Read pages 43 to 49, stopping at "Air is absolutely necessary for combustion."

      ~ (You must learn the difference between a gas and a vapour: a gas remains permanent, a vapour is something that will condense.)'
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      Faraday put one end of a bent glass tube into the dark middle of the flame. A heavy white vapor flowed out of the other end and sank to the bottom of a flask.
      When he brought a light to it, it burned. Then he lit the vapor right at the far end of the tube:

      ~ Talk about laying on gas — why, we can actually lay on a candle!

      He also heated wax in a glass flask until it gave off vapor, poured the vapor out and set it on fire. Hot glass and burning wax vapor are not home experiments.
      If you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - The idea in plain words
    - 'There are two jobs going on in a flame: first the heat turns the wax into vapor, then the vapor burns where it meets the air. The dark middle is vapor that
      has not burned yet. The burning happens on the outside, where vapor and air come together.

      Faraday showed this with a strip of paper pushed quickly across the flame: it was scorched in a ring, not in the middle.

      ~ It is in a ring, exactly in the place where I told you the chemical action was'
  - - A note on the paper ring
    - 'Faraday called the paper ring "a good experiment for you to make at home." We are skipping it: paper held in a flame catches fire very easily. Many science-demonstration
      videos show the scorched ring, if you want to see it.'
  - - Look and draw
    - 'Light the candle in still air and look at the flame from the side. Find the dark zone right around the wick. Draw a large flame in the notebook and label:
      wick, dark middle (wax vapor), bright part, blue at the base, and "the ring where vapor meets air."

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.'
  - - Say it back and check
    - 'Your child explains how Faraday "laid on a candle" through a tube.

      Check questions:

      1. What is the difference between a gas and a vapor, in Faraday''s words?

      2. What is in the dark middle of the flame?

      3. Where is the flame hottest, and why there?'
  practice: 'Notice it this week: the smell when a candle is blown out. Faraday says that bad smell comes from the wax vapor condensing.'
  tip: Keep the flame drawing. You will add to it in the next two lessons.
  answers: 1. A gas stays a gas; a vapor will condense back into a liquid or solid when it cools. 2. Wax vapor that has not burned yet. 3. In a ring on the outside,
    where the wax vapor and the air meet and the chemical action happens.
  num: 4
  roman: Lecture II, part 1
  idx: 44
  unit: 2
- title: Fresh air, smoke, and two kinds of burning
  mins: 35
  goal: Your child can show that a flame needs fresh air, explain why a starved flame smokes, and tell the difference between burning with and without flame.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - Two or three clean glass jars of different sizes (tall enough to cover the candle with room to spare)
  - A watch or phone with a timer
  - Science notebook
  book: A jar over a candle; the Argand lamp with air let into the middle of the flame; a large smoky flame of turpentine; gunpowder burning with iron filings; and
    a puff of lycopodium powder.
  steps:
  - - Hook question
    - 'Say: If we put a jar over a candle, the jar is still full of air. So why should the candle go out?'
  - - Read together
    - 'Read pages 49 to 55.

      ~ Air is absolutely necessary for combustion; and, what is more, I must have you understand that fresh air is necessary'
  - - The jar over the candle
    - 'Stand a tea light on the plate and light it. Lower a glass jar over it, mouth down, and start the timer. Watch the flame stretch, fade and go out. Lift the
      jar away, let it air out, then try a bigger jar. Record the times in the notebook.

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby. The jar gets warm, so the adult lifts it off.

      Faraday''s explanation:

      ~ Not because it wants air merely, for the jar is as full now as it was before; but it wants pure, fresh air.'
  - - Starved flames smoke
    - 'Faraday showed a lamp burning poorly when air was kept from the middle of the flame, and brightly when Argand''s clever design let air in. Then he burned turpentine
      on a big ball of cotton, which sent a stream of black soot into the air, because a big flame cannot get enough air.

      Watch only: don''t try this at home. Burning turpentine is dangerous.

      Say: Less air means imperfect burning, and imperfect burning means soot.'
  - - Burning with and without flame
    - 'Watch only: don''t try this at home.

      Faraday mixed gunpowder with iron filings and lit it. The gunpowder burned with a flame; the iron filings were thrown up and burned as sparks, with no flame.
      Then he puffed lycopodium powder (a fine plant powder) through a flame to make a sudden cloud of fire:

      ~ This is the lightning of the pantomimes, and a very good imitation.

      He warned his audience himself:

      ~ Before I go into these experiments, let me hope that none of you, by trying to repeat them, for fun''s sake, will do any harm.

      If you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - Say it back and check
    - 'Narration prompts: What happened to the candle under the jar, and why? What did the iron filings do that the gunpowder did not?

      Check questions:

      1. Why did the candle go out in a jar that was still full of air?

      2. Why does a very large wick make smoke?

      3. What two kinds of burning did the gunpowder and iron show?'
  - - What we know now
    - 'The candle under the jar goes out long before all the oxygen is used up. The air in the jar becomes "partly changed," as Faraday says: it has less oxygen and
      more of the gases the flame gives off, until there is too little oxygen to keep the flame going.'
  practice: 'Notice it this week: a fire or a camping stove that smokes when it is starved of air and burns cleanly when air can reach it.'
  tip: Faraday says the starved flame, the smoky flame and the well-fed flame are all worth understanding. Let your child predict each time before you show or read
    the result.
  answers: 1. It needs fresh air; the air in the jar has been partly changed by the burning, and there is not enough fresh air left to keep it burning. 2. A larger
    flame needs a larger supply of air; without enough air it burns imperfectly and throws off soot. 3. Burning with a flame (the gunpowder) and burning without a
    flame, as glowing sparks (the iron filings).
  num: 5
  roman: Lecture II, part 2
  idx: 50
  unit: 2
- title: Why a flame is bright, and what goes up
  mins: 35
  goal: Your child can explain that a candle flame shines because of tiny glowing bits of carbon, and show that a burning candle gives off water.
  materials:
  - A plain candle (a short, thick one is best) and a few tea lights
  - A large plate or metal baking tray to stand them on
  - Matches or a long lighter (for the adult only)
  - A glass of water nearby
  - A metal spoon, chilled in the freezer for a few minutes
  - An oven mitt or pot holder
  - Science notebook
  book: The black smoke drawn from the bright part of the flame; why solid particles make a flame bright; platinum, lime-light, phosphorus and zinc; the pale blue
    gas flame; a fire-balloon filled by a flame; and the dimming of a cold jar or spoon over a candle.
  steps:
  - - Hook question
    - 'Say: A gas-stove flame is blue and gives little light. A candle flame is yellow and bright. What makes the difference?'
  - - Read together
    - 'Read pages 55 to 67, to the end of Lecture II.

      ~ You would hardly think that all those substances which fly about London, in the form of soots and blacks, are the very beauty and life of the flame'
  - - The cold spoon test
    - 'Faraday gave this one as homework:

      ~ If you go home and take a spoon that has been in the cold air, and hold it over a candle — not so as to soot it — you will find that it becomes dim, just
      as that jar is dim.

      Wearing the oven mitt, the adult holds the cold spoon a few inches above the flame for a few seconds. Look at the back of the spoon: a mist of tiny water drops.
      Then lower the spoon briefly into the tip of the flame: now it collects black soot. Let the spoon cool before anyone touches it.

      Safety: an adult lights the flame and stays right there; tie back long hair and roll up sleeves; set the candle on a plate on a fireproof surface, away from
      paper and curtains; keep a glass of water nearby.

      ~ let me tell you that it is water which causes the dimness'
  - - Why the flame shines
    - 'The soot on the spoon is carbon. In the flame, the heat breaks up the wax vapor and sets tiny bits of carbon free. They glow brightly while they are hot, and
      then they burn away.

      ~ it is to this presence of solid particles in the candle-flame that it owes its brilliancy.

      When air is mixed with the gas before it burns, as in a gas stove, the carbon burns before it can glow, and the flame is pale blue.'
  - - What Faraday showed
    - 'Watch only: don''t try this at home.

      To prove that solid things glow brightly in a flame, Faraday heated platinum wire, then a piece of lime in a hydrogen and oxygen flame:

      ~ This is the glorious lime-light, which rivals the voltaic-light, and which is almost equal to sunlight.

      He also burned phosphorus, set off a mixture with a drop of sulfuric acid, and burned zinc in a red-hot crucible (he said children could do it at home; they
      should not). Finally he filled a paper fire-balloon with the hot gases from a flame and let it rise. These all involve dangerous chemicals or open fire. If
      you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - Say it back and check
    - 'Narration prompts: What was on the cold spoon? What makes a candle flame bright? What made the balloon rise?

      Check questions:

      1. What is the black smoke from the bright part of the flame?

      2. Why does a gas flame turn blue when air is mixed into it first?

      3. What causes the dimness on a cold jar or spoon held over a candle?'
  - - What we know now
    - 'Lime-light really was used to light theaters in the 1800s; that is where the saying "in the limelight" comes from. Faraday''s explanation of a bright flame
      still stands: glowing specks of soot give a candle its yellow light.'
  practice: 'Notice it this week: breathe on a cold window or mirror and see the mist. Faraday will soon show that breathing and burning have a lot in common.'
  tip: The spoon gets hot quickly. Keep the oven mitt on and put the spoon on the plate to cool.
  answers: '1. Carbon: the same carbon that is in the candle, set free but not yet burned. 2. The air reaches the carbon and burns it before it can be set free and
    heated to glowing, so there are no glowing solid particles. 3. Water, which the burning candle produces.'
  num: 6
