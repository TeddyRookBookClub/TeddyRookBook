- title: 'We burn like candles: breathing'
  mins: 35
  goal: 'Your child can explain how breathing is like a burning candle: both use oxygen and give out water and carbon dioxide, and food is our fuel.'
  materials:
  - A small mirror (put it in the fridge for ten minutes first)
  - A timer
  - Science notebook
  book: 'Faraday''s board with a groove and glass tubes: his breath puts a candle out without blowing; one breath spoils a jar of air; breathed-out air turns lime-water
    milky; how food is "burned" in the body; and sugar turned to black carbon.'
  steps:
  - - Hook question
    - 'Say: Is there anything burning inside you right now?'
  - - Read together
    - 'Read pages 173 to 182, stopping at "And if I make arrangements so as to oxidize the carbon of sugar."

      ~ In every one of us there is a living process of combustion going on very similar to that of a candle'
  - - What Faraday did
    - 'Watch only: don''t try this at home.

      He let a candle burn in a tube fed by a channel of air. Then he put his mouth over the opening and let only his breathed-out air go in, without blowing:

      ~ I did not blow the candle out.

      The flame went out for want of oxygen. He breathed one breath in and out of a jar, and a taper went out in it. He breathed out through lime-water, and it turned
      milky.

      ~ Even one inspiration, you see, has completely spoiled this air, so that it is no use my trying to breathe it a second time.

      If you want to see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - Your breath is like candle smoke
    - 'Breathe on the cold mirror: water mist, just like the cold spoon over the candle. Candle: wax + oxygen → water + carbonic acid + heat. You: food + oxygen →
      water + carbonic acid + warmth.

      ~ we may thus look upon the food as fuel.'
  - - More fuel, more breathing
    - 'Count your child''s breaths for one minute while sitting still. Then do jumping jacks for a minute and count again. Write both numbers down. Say: Working muscles
      burn more fuel, so they need more oxygen, and you breathe faster.'
  - - Sugar is full of carbon
    - 'Faraday''s sugar table: 72 parts carbon, 11 hydrogen, 88 oxygen. He points out the hydrogen and oxygen are in the proportion for water, so:

      ~ sugar may be said to be compounded of 72 parts of carbon and 99 parts of water

      He poured oil of vitriol (strong sulfuric acid) on syrup and it turned into a solid lump of black carbon. Watch only: don''t try this at home. If you want to
      see it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - Say it back and check
    - 'Narration prompts: How did Faraday put out a candle with his breath without blowing? How is breathing like burning?

      Check questions:

      1. Why did the candle go out in Faraday''s breath?

      2. What did breathed-out air do to lime-water, and what did that prove?

      3. What is our "fuel"?'
  - - What we know now
    - Faraday thought the food's carbon met the air in the lungs. We now know the lungs pass oxygen into the blood, and the "burning" happens slowly in the cells
      all through the body; the blood then carries the carbon dioxide back to the lungs to be breathed out. Breathed-out air still has some oxygen in it, just not
      enough to keep a candle going.
  practice: 'Notice it this week: warm, misty breath on a cold day, and how much faster you breathe climbing stairs or running.'
  tip: Faraday remarks on stuffy, badly aired homes of his time. It is a good moment to open a window and talk about why fresh air matters.
  answers: '1. His lungs had taken oxygen out of the air, so there was not enough left to feed the flame. 2. It turned it milky, showing that breathed-out air carries
    carbonic acid (carbon dioxide), as a candle''s gases do. 3. Food, such as sugar, which contains carbon. Arithmetic check: 72 + 11 + 88 = 171, and 11 + 88 = 99.'
  num: 17
  roman: Lecture VI, part 2
  idx: 174
  unit: 6
- title: Plants, carbon that waits, and a candle's wish
  mins: 40
  goal: Your child can explain how animals and plants depend on each other through carbon dioxide, and can tell the whole chemical history of a candle from start
    to finish.
  materials:
  - A houseplant or a tree outside
  - The "what happens when a candle burns" list from Lesson 1
  - Science notebook and colored pencils
  book: How much carbon people, cows and horses breathe out; where it goes; fish and plants; carbon that "waits" (ink at Herculaneum, a coal-gas jet, gunpowder and
    gun-cotton); and Faraday's closing wish that his listeners may be like candles.
  steps:
  - - Hook question
    - 'Say: If every person, animal and fire is pouring carbon dioxide into the air, why don''t we run out of fresh air?'
  - - Read together
    - 'Read pages 183 to 190, to the end of the six lectures.

      ~ A man in twenty-four hours converts as much as seven ounces of carbon into carbonic acid; a milch cow will convert seventy ounces, and a horse seventy-nine
      ounces, solely by the act of respiration.'
  - - Plants take it back
    - 'Faraday says the gas that is bad for us is food for plants: their leaves take carbon from the air and grow.

      ~ what is disease to the one being health to the other.

      ~ So are we made dependent, not merely upon our fellow-creatures, but upon our fellow-existers, all Nature being tied together by the laws that make one part
      conduce to the good of another.

      Go and look at a plant or tree. Say: Much of this leaf was built from carbon that came out of the air.'
  - - Carbon waits
    - 'Faraday points out that carbon does not burst into flame the moment air touches it. It waits until it is heated. Ink made of carbon lasted about 1,800 years
      on the scrolls of Herculaneum, and a candle sits for years without changing.

      ~ the matter which is appointed to serve the purpose of fuel waits in its action

      He touched gun-cotton and gunpowder with a hot wire to show they "wait" for different amounts of heat. Watch only: don''t try this at home. If you want to see
      it, search online for a video of a chemistry teacher doing this demonstration and watch it together.'
  - - The whole story
    - 'Ask your child to draw the chemical history of a candle as a big flow chart, from memory first: candle wax → melted in the cup → climbs the wick → turned to
      vapor → meets the air in a ring of flame (glowing carbon makes the light) → water + carbonic acid go up → plants take in the carbon. Then add a branch: food
      → breathing → water + carbonic acid.

      Now get out the list from Lesson 1. What did your child know then, and what do they know now?'
  - - Faraday's wish
    - 'Read the last sentence aloud slowly:

      ~ all I can say to you at the end of these lectures (for we must come to an end at one time or other) is to express a wish that you may, in your generation,
      be fit to compare to a candle; that you may, like it, shine as lights to those about you; that, in all your actions, you may justify the beauty of the taper
      by making your deeds honourable and effectual in the discharge of your duty to your fellow-men.

      Ask: What do you think he meant? What would it look like to be "a light to those about you"?'
  - - What we know now
    - Plants use the energy of sunlight to make sugar from carbon dioxide and water, and they give off oxygen as they do it (photosynthesis). Today scientists also
      measure how burning coal, oil and gas adds extra carbon dioxide to the air, which is warming the Earth's climate. Faraday's big idea, that every part of nature
      is tied to every other, matters more than ever.
  practice: Copy Faraday's closing wish into the science notebook as the last page of the course, with the flow chart beside it.
  tip: If your child enjoyed the course, the Royal Institution still gives Christmas Lectures for young people every year, and recordings of recent ones can be found
    online.
  answers: 'Faraday''s figures: a person about 7 ounces of carbon a day, a cow 70, a horse 79 (a horse breathes out about eleven times as much carbon as a person,
    79 ÷ 7 ≈ 11). We don''t run out of fresh air because plants take in the carbonic acid and use its carbon to grow. "Carbon waits" means it does not burn until
    it is heated enough, so fuel can be stored safely.'
  num: 18
  roman: Lecture VI, part 3
  idx: 184
  unit: 6
- title: Platinum and its family of metals
  mins: 30
  goal: Your child can describe platinum and the five metals always found with it, and explain how platinum was made into solid bars by welding.
  materials:
  - A periodic table (a free one online, or printed)
  - A few small objects of the same size but different materials (a marble, a metal nut or bolt, a wooden bead)
  - Science notebook
  book: The extra lecture, given to the Royal Institution on Friday, February 22, 1861. Faraday explains that his friend Deville could not come to melt platinum,
    describes platinum and the metals found with it, the old way of purifying it with acids, and welds two platinum wires with a blowpipe and a hammer.
  steps:
  - - About this lecture
    - 'This was not one of the Christmas talks for children. It was an evening lecture for grown-ups, printed at the end of the book. It is harder, so these guides
      are optional.

      Faraday had promised that his friend Deville of Paris would melt thirty or forty pounds of platinum in front of the audience. Deville couldn''t come, so Faraday
      explained the process himself.'
  - - Read together
    - 'Read pages 191 to 200, stopping at "The treatment which Deville proposes to carry out."

      ~ The metal platinum, of which you see some very fine specimens on the table, has been known to us about a hundred years.'
  - - A family of six metals
    - 'Platinum is found as grains of metal in river soils in Brazil, Mexico, California and the Ural Mountains of Russia, always with five other metals: palladium,
      rhodium, iridium, osmium and ruthenium.

      ~ Osmium has a specific gravity of 21.4, and is the heaviest body in nature

      Find all six on the periodic table. They sit close together, which is part of why they behave alike.'
  - - Heavy for its size
    - 'Specific gravity means how heavy something is compared with the same amount of water. Platinum is about 21 times as heavy as water. Pick up your same-size
      objects one at a time and put them in order from lightest to heaviest. Now imagine a marble of platinum: about twenty-one times the weight of a marble of water.'
  - - Making a bar without melting
    - 'Platinum was too hard to melt in ordinary furnaces. So it was dissolved in acids, turned into a fine "sponge," then pressed, heated and hammered until the
      grains stuck together: welding, like a blacksmith joining iron.

      ~ He does not know the philosophy he calls into play when he sprinkles a little sand over the oxide of iron, but he has a fine philosophy there

      Faraday heated two crossed platinum wires with a blowpipe, tapped them with a hammer, and they became one piece. When he pulled, the wire broke somewhere else,
      not at the weld. Watch only: don''t try this at home. Search for a video of a blacksmith "forge welding" to see the iron version.'
  - - Say it back and check
    - 'Narration prompts: Why did Faraday give this lecture himself? Where does platinum come from? How was it made into bars?

      Check questions:

      1. Name the five metals found with platinum.

      2. What did Faraday say was the heaviest substance in nature?

      3. How did Faraday prove his weld was strong?'
  - - What we know now
    - Osmium and iridium are so close in density that careful measurements were needed to show osmium is very slightly the denser. Platinum is used today in car exhaust
      cleaners (catalytic converters), jewelry and laboratory equipment.
  practice: 'Notice it this week: look for the word "platinum" on jewelry, spark plugs or labels.'
  tip: Faraday was 69 when he gave this lecture. If your child finds it heavy going, read the stories (the missing friend, the welded wire) and skim the lists.
  answers: '1. Palladium, rhodium, iridium, osmium and ruthenium. 2. Osmium, with a specific gravity of 21.4. 3. He pulled the welded wire apart: it broke where the
    pincers gripped it, not at the weld.'
  num: 19
  roman: Platinum, part 1
  idx: 192
  unit: 7
