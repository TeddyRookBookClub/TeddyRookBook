      ~ Add 21.611; 6888.32; 3.4167.

      For the second, check that the answer (6913.3477) has four decimal places, as many as the longest number.'
  - - Word problems
    - 'Problems 3 and 7–12 are written in words, like "43 and 31 hundredths". Have your child write each one in figures first and check it with you before adding. The hard part is the place: "19 thousandths" is .019, not .19.'
  - - Independent practice and check
    - Your child works the rest of the problems on pages 178–179. The book prints the answer at the end of each problem line. Have your child cover the answers with a strip of paper, work the problem, then slide the strip down to check.
  - - Mental-math wrap-up
    - 'Add aloud: .5 + .25; 1.2 + .08; .75 + .75; 2.5 + 3.75.'
