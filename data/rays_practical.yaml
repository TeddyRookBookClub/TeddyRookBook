- title: Adding decimals
  mins: 35
  goal: Your child adds decimals by lining up the decimal points, and can write decimals given in words.
  materials:
  - Paper and pencil, or a slate or small whiteboard
  book: Page 178 defines Addition of Decimals (Art. 143), works one example with the rule, and starts the problems. Page 179 continues to problem 12, some written in words ("4 and 8 tenths"). All answers are printed.
  steps:
  - - Warm-up
    - Ask your child to add $3.25 and $0.80 in their head. Then talk about why the cents had to be lined up with the cents.
  - - The idea
    - 'Read:

      ~ Addition of Decimals is the process of finding the sum of two or more decimal numbers.

      The rule has three steps: write the numbers so the decimal points and figures of the same order stand in the same column; add as in simple numbers; put the decimal point in the sum under the column of points.'
  - - Work the book's example
    - '~ Add 375.83; 49.627; 5842.1963; 813.9762.

      Write them in a column with the points in a straight line. Fill empty places with zeros if that helps. The sum is 7081.6295.'
