      Show: 24 ÷ 6 = 4. Double the dividend: 48 ÷ 6 = 8. Halve the divisor: 24 ÷ 3 = 8. Both doubled the quotient.'
  - - Principle II
    - 'Read:

      ~ If the dividend be divided, or the divisor be multiplied, the quotient will be divided.

      Show: 12 ÷ 6 = 2, and 24 ÷ 12 = 2. Both halved the quotient.'
  - - Principle III
    - 'Read:

      ~ If both dividend and divisor be multiplied or divided by the same number, the quotient will not be changed.

      Show: 48 ÷ 12 = 4 and 12 ÷ 3 = 4, same as 24 ÷ 6.'
