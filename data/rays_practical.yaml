    - Your child works the rest of the problems on pages 186–187. The book prints the answer at the end of each problem line. Have your child cover the answers with a strip of paper, work the problem, then slide the strip down to check.
  - - Mental-math wrap-up
    - 'Aloud: .5 gal. = ? qt.; .25 bu. = ? pk.; .5 ft. = ? in.; 6 in. = what decimal of a foot?'
  tip: 'Old measures note: the book uses the U.S. measures of its day, plus troy weight (pounds of 12 ounces, used for precious metals). Keep a small table of these on the table while working.'
