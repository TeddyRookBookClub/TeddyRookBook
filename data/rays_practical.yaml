    - 'A cubic foot is 12 inches long, 12 wide and 12 high. 12 × 12 = 144 in one layer, and 12 layers: 144 × 12 = 1728 cubic inches. In the same way a cubic yard is 3 × 3 × 3 = 27 cubic feet.'
