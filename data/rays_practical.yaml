lessons:
- num: 1
  roman: Arts. 1–5
  idx: 14
  unit: 1
  title: Units, numbers and the ten figures
  mins: 35
  goal: Your child can say what a unit and a number are, name the ten figures, and write any number up to 99 as tens and units.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: The opening definitions (unit, number, arithmetic, notation), the ten Arabic figures, and how a figure's place makes it units or tens, with numbers to write and read.
  steps:
  - - Warm-up
    - 'Count by tens to 100 together, then backward from 100.

      Say: How many tens are in 70? How many units are in 3 tens and 4?'
  - - What is a unit?
    - 'Read the first definitions together.

      ~ A Unit is a single thing of any kind;

      Say: One apple is a unit. One dollar is a unit. A number is just one or more units.

      Ask your child to name three different units in the room.'
  - - The ten figures
    - 'Read Article 2.

      ~ To express numbers, the Arabic Notation employs ten characters, called figures; namely, 1, 2, 3, 4, 5, 6, 7, 8, 9, 0.

      Point out that 0, naught, stands for nothing. Its job is to hold an empty place.'
  - - Place makes the value
    - 'Read the definition of an order.

      ~ The Order of a figure is the place it occupies in a number.

      Write 37. Say: The 7 is in units'' place, the first order. The 3 is in tens'' place, the second order. So 37 is 3 tens and 7 units.

      ~ Units of the second order are called tens; and the place they occupy is called the tens'' place.'
  - - Write and read together
    - 'Do the first few items of "Numbers to be written" together. The first ones are:

      ~ Twenty-three; twenty-four; twenty-five.

      Then read the first few items of "Numbers to be read" aloud.'
  - - On their own
    - Your child writes the rest of the first list in figures and reads the second list aloud to you. Listen for teen numbers and for numbers ending in 0.
  - - Wrap-up
    - 'Say: I''m thinking of a number with 6 tens and 0 units. (60.) With 9 tens and 9 units? (99.) Which is bigger, 4 tens or 39 units? (4 tens.)'
  practice: Read a few prices or page numbers aloud each day and say how many tens and units each has.
  tip: If tens and units are shaky, bundle 10 sticks or straws with a rubber band and build numbers with bundles and loose sticks.
  answers: The number lists are for writing and reading aloud; check them against the words. Each number is just the tens figure followed by the units figure, for example twenty-three is 23.
- num: 2
  roman: Arts. 6–8
  idx: 17
  unit: 1
  title: Hundreds and higher orders
  mins: 35
  goal: Your child can write and read numbers to 999, and knows that ten units of any order make one unit of the next higher order.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: Hundreds, numbers made of hundreds, tens and units with lists to write and read, then the higher orders beyond hundreds.
  steps:
  - - Warm-up
    - 'Ask quickly: 10 tens make how many? (100.) 4 tens and 3 units? (43.) What figure holds an empty place? (0.)'
  - - Hundreds
    - 'Read the definition.

      ~ Units of the third order are called hundreds; and the place they occupy is called the hundreds'' place.

      Write 345 and point: 3 hundreds, 4 tens, 5 units.'
  - - Zeros that hold a place
    - 'Write 305 and 350. Say: Both have a 3 and a 5, but they''re different numbers. The 0 holds an empty place.

      Have your child say each one as hundreds, tens and units.'
  - - Write and read together
    - 'Do the first items of "Numbers to be written" for Article 7 together:

      ~ One hundred and thirty; one hundred and forty; one hundred and fifty.

      Then read a few from "Numbers to be read" aloud.'
  - - The big idea
    - 'Read Article 8.

      ~ Invariably, ten units of any order make a unit of the next higher order,

      Say: 10 units make a ten, 10 tens make a hundred, 10 hundreds make a thousand, and it keeps going the same way forever.'
  - - On their own
    - 'Your child finishes both lists for Article 7: writes the first list in figures and reads the second aloud.'
  - - Wrap-up
    - 'Say: How many tens are in 300? (30.) How many hundreds in 1000? (10.) What number is 1 more than 399? (400.)'
  practice: Read three-figure numbers from house numbers, receipts or a calendar each day.
  answers: Check written numbers against the words; for example, one hundred and thirty is 130.
- num: 3
  roman: Arts. 9–10
  idx: 20
  unit: 1
  title: Place value and periods
  mins: 35
  goal: Your child explains why a figure's value depends on its place, tells odd from even, and groups the orders into periods of three.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: 'Article 9 lists nine definitions and principles about figures and their values. Article 10 groups the orders into periods: units, thousands, millions, and so on.'
  steps:
  - - Warm-up
    - 'Ask: Is 47 odd or even? 50? 83? Then: What is ten times 6? Ten times 60?'
  - - Even and odd
    - 'Read these two lines of Article 9.

      ~ The numbers that end with 2, 4, 6, 8, or 0 are called even numbers.

      ~ The numbers that end with 1, 3, 5, 7, or 9 are called odd numbers.'
  - - Local value
    - 'Read:

      ~ The value of a figure is always local; that is, it depends upon the place it occupies in a number.

      ~ The value of a figure is increased tenfold by removing it one place to the left.

      Write 5, then 50, then 500. Say: Each move to the left makes the 5 worth ten times as much.'
  - - Periods of three
    - 'Read Article 10.

      ~ For convenience in writing and reading numbers, the different orders are grouped into periods of three orders each.

      Write 4 250 873 with small gaps. Name the periods from the right: units, thousands, millions.'
  - - Try it together
    - Write 7 numbers of four to nine figures. Your child marks the periods with commas, counting three figures at a time from the right.
  - - Wrap-up
    - 'Say: Which is worth more, the 3 in 300 or the 3 in 3000? How many times more? (Ten.)'
  tip: Commas in big numbers are just period markers.
- num: 4
  roman: Art. 11
  idx: 22
  unit: 1
  title: Writing large numbers
  mins: 35
  goal: Your child writes numbers in the millions from words, filling empty orders with ciphers.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: How to write numbers in the Arabic system, period by period, then a long list of numbers to be written, from thousands up to many periods.
  steps:
  - - Warm-up
    - 'Name the periods in order from the right: units, thousands, millions, billions. Ask: How many figures in each period? (Three.)'
  - - The rule
    - 'Read the rule together.

      ~ Begin at the left, and write each period as a number composed of hundreds, tens, and units

      Say: Every period except the first one on the left gets all three figures, even if some are zeros.'
  - - Work an example
    - 'Say aloud: four million, thirty thousand, five. Write it together, period by period: 4 | 030 | 005, so 4030005.

      Point to the zeros: they fill the empty orders.'
  - - Guided practice
    - 'Do the first items of the list together:

      ~ Two thousand; thirty thousand; four hundred thousand.

      Ask after each: Which period is this number in? Are all the empty orders filled?'
  - - Independent practice
    - Your child writes the next several items of "Numbers to be written" in the notebook. Stop after about 10 items if they're tiring; finish the rest another day.
  - - Check
    - Read each written number back aloud, period by period. If it doesn't match the words, look for a missing zero.
  - - Wrap-up
    - 'Say: How do you write one thousand and one? (1001.) Ten thousand and ten? (10010.)'
  practice: Finish the list over the next few days, a handful at a time.
- num: 5
  roman: Art. 12
  idx: 24
  unit: 1
  title: Reading large numbers
  mins: 35
  goal: Your child points off any number into periods and reads it aloud correctly.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: 'Numeration, the reading of numbers: point off the periods from the right, then read each period from the left and name it. Then a list of numbers to be read.'
  steps:
  - - Warm-up
    - Write 3, 30, 300, 3000, 30000, 300000, 3000000. Your child reads them aloud.
  - - The definition
    - 'Read:

      ~ Numeration is the reading of numbers when expressed according to a system of notation.

      Say: First we mark the periods from the right. Then we read from the left, saying each period''s name.'
  - - Work an example
    - 'Write 763491. Point off: 763,491. Read: seven hundred sixty-three thousand, four hundred ninety-one.

      Note that the units period''s name is not said aloud.'
  - - Guided practice
    - 'Read the first numbers of the list together:

      ~ 41582; 763491; 2519834.

      Your child points off the periods with a pencil before reading.'
  - - Independent practice
    - Your child reads the rest of the list aloud. Write down any that cause trouble and try them again at the end.
  - - Wrap-up
    - Write a number your child chooses, as long as they like, and have them read it. Then you read one they write.
  tip: Zeros in the middle of a period are where mistakes happen. Have your child say each period as a three-figure number first (030 is "thirty").
- num: 6
  roman: Art. 13
  idx: 25
  unit: 1
  title: Roman numerals
  mins: 35
  goal: Your child reads and writes Roman numerals using I, V, X, L, C, D and M.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: 'The Roman system of notation: seven letters and their values, numbers made by repeating letters, by putting a smaller letter before a larger one, and by putting it after. Then lists to write in Roman numerals.'
  steps:
  - - Warm-up
    - 'Ask if your child has seen Roman numerals: on a clock, a building, or a book''s chapters.'
  - - The seven letters
    - 'Read:

      ~ To express numbers, the Roman Notation employs seven letters; namely, I, V, X, L, C, D, M.

      ~ I, one; V, five; X, ten; L, fifty; C, one hundred; D, five hundred; M, one thousand.

      Write them on the slate with their values.'
  - - Before and after
    - 'Read:

      ~ Four numbers are expressed by a subtractive combination, as follows: IV, four; IX, nine; XL, forty; XC, ninety.

      Say: A smaller letter after a bigger one adds (VI is 6). A smaller letter before a bigger one subtracts (IV is 4).'
  - - Write together
    - 'Do the first list together:

      ~ The numbers from one to twenty,

      Go slowly through IV, IX, XIV and XIX.'
  - - On their own
    - 'Your child writes the next lists: the numbers from twenty to thirty, and then 30, 40, 50 and so on to 90.'
  - - Wrap-up
    - 'Write the current year in Roman numerals together, one period at a time: thousands, hundreds, tens, units.'
  answers: '1 to 20: I, II, III, IV, V, VI, VII, VIII, IX, X, XI, XII, XIII, XIV, XV, XVI, XVII, XVIII, XIX, XX.

    20 to 30: XX, XXI, XXII, XXIII, XXIV, XXV, XXVI, XXVII, XXVIII, XXIX, XXX.

    30 to 90 by tens: XXX, XL, L, LX, LXX, LXXX, XC.

    For the later lists, build each number from thousands, hundreds, tens and units: for example 1877 is M + DCCC + LXX + VII = MDCCCLXXVII.'
- num: 7
  roman: Arts. 14–17
  idx: 26
  unit: 2
  title: Adding without carrying
  mins: 35
  goal: Your child knows the words sum, plus and equals and adds numbers whose columns don't carry.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: Definitions for the fundamental rules, a few mental addition problems, the definition of addition and its signs, then adding numbers whose columns each total 9 or less.
  steps:
  - - Warm-up
    - 'Do the book''s mental problems aloud:

      ~ If you have 2 cents and find 3 cents, how many will you then have?

      ~ I spent 12 cents for a slate, and 5 cents for a copy-book: how many cents did I spend?

      Answers are printed after each one.'
  - - The idea
    - 'Read the definition.

      ~ Addition is the process of uniting two or more numbers into one number.

      ~ The number obtained by addition is the Sum or Amount,

      Show the signs: + is plus, = is equals. Write 4 + 3 = 7 and read it aloud.'
  - - Line up the columns
    - 'Say: Units go under units, tens under tens, hundreds under hundreds.

      ~ When the sum of the figures in a column does not exceed 9, it is written under the column.'
  - - Work an example together
    - 'Work the book''s example:

      ~ I owe one man $210, another $142, and another $35: what is the sum of my debts?

      Write the numbers in columns, add units (0 + 2 + 5 = 7), tens (1 + 4 + 3 = 8), hundreds (2 + 1 = 3). The sum is $387.'
  - - Guided practice
    - 'Do the next two together:

      ~ Find the sum of 4321, 1254, 3120.

      ~ Find the sum of 50230, 3105, 423.

      Check against the printed answers (8695 and 53758).'
  - - Wrap-up
    - 'Mental: 20 + 30 + 40? (90.) 300 + 200 + 100? (600.) 41 + 25? (66.)'
- num: 8
  roman: Arts. 18–19
  idx: 29
  unit: 2
  title: Carrying, the rule and the proof
  mins: 35
  goal: Your child adds long columns with carrying and checks the sum by adding the other way.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: Why we carry when a column passes 9, the rule for addition, the proof, and a page of column examples with answers.
  steps:
  - - Warm-up
    - 'Ask: 8 + 7? 9 + 6? 7 + 5 + 4? Say each answer as tens and units: 15 is 1 ten and 5 units.'
  - - Why carry?
    - 'Read:

      ~ When the sum of the figures in a column exceeds 9, two or more figures are required to express it.

      Say: When the units column makes 15, we write the 5 and carry the 1 ten to the tens column. Carrying is just adding tens to tens.'
  - - The rule
    - 'Read the rule together.

      ~ Write the numbers to be added, so that figures of the same order may stand in the same column.

      ~ Begin at the right hand, and add each column separately.'
  - - Work an example together
    - 'Work this one on the slate:

      ~ Add the numbers 3415, 503, 1870, and 922.

      Units: 5 + 3 + 0 + 2 = 10, write 0, carry 1. Tens: 1 + 1 + 0 + 7 + 2 = 11, write 1, carry 1. Hundreds: 1 + 4 + 5 + 8 + 9 = 27, write 7, carry 2. Thousands: 2 + 3 + 1 = 6. Sum: 6710.'
  - - The proof
    - 'Read the proof:

      ~ Add the columns downward, commencing with the column of units.

      Say: If adding down gives the same sum as adding up, the work is right.'
  - - Guided and independent practice
    - Do the first column example together. Your child does the next four or five alone and proves each one.
  - - Check and wrap-up
    - 'Answers are printed under the examples; compare after proving. Mental finish: 25 + 25? 48 + 6? 99 + 7?'
  practice: One or two column examples a day until carrying is automatic.
- num: 9
  roman: Art. 19 (problems)
  idx: 32
  unit: 2
  title: Addition story problems
  mins: 35
  goal: Your child sets up and solves addition story problems and writes the answer with its unit (dollars, yards, years).
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: 'Numbered problems: short sums written across the line, then story problems about land, money, goods and dates. Answers are printed after nearly all.'
  steps:
  - - Warm-up
    - 'Do the first two across the line aloud or on the slate:

      ~ 11 + 22 + 33 + 44 + 55 = how many?

      Answer: 165.'
  - - Reading a story problem
    - 'Say: Find what we know, what we want, and which numbers to add. Write them in columns.

      Read together:

      ~ General Washington was born A. D. 1732, and lived 67 years: in what year did he die?

      Add 1732 + 67 = 1799.'
  - - Another together
    - 'Read:

      ~ I bought 4 pieces of muslin: the first contained 50 yards...

      Write the four lengths in a column and add. The printed answer is 246 yd.'
  - - Independent practice
    - Assign about ten of the remaining numbered problems. Your child writes each answer with its unit.
  - - Check
    - The answers are printed. Your child checks each one; for any wrong answer, re-add and find the mistake rather than just copying the right number.
  - - Wrap-up
    - 'Mental story: You have 35 cents and earn 25 more. How much now? (60 cents.)'
  tip: 'Problem 38, about carpet for the rooms of a house, is a good one to act out: each room''s yards first, then the total.'
- num: 10
  roman: Art. 20
  idx: 34
  unit: 2
  title: Adding two columns at once
  mins: 35
  goal: Your child adds two-figure numbers in one step to speed up column addition.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: A method for adding two columns at a time, followed by a page of column examples.
  steps:
  - - Warm-up
    - 'Mental: 47 + 30? 77 + 6? 83 + 40? 123 + 9?'
  - - The idea
    - 'Read:

      ~ An excellent practice, in order to secure readiness and accuracy, is to add two columns at once.

      Say: Instead of adding units and then tens, we add whole two-figure numbers: first the tens, then the units.'
  - - Work the book example
    - 'Follow the book''s worked example:

      ~ Beginning with 47, add the 3 tens above, which equal 77.

      Keep going up the column the same way: add tens, then units, saying only the running totals.'
  - - Guided practice
    - Do the first example on the page together, saying the running totals aloud.
  - - Independent practice
    - Your child does three or four more of the examples on the page.
  - - Check
    - Answers are printed under many of the examples. For any without a clear answer, check by adding one column at a time.
  - - Wrap-up
    - 'Mental: 56 + 27? (83.) 64 + 38? (102.)'
  tip: This is a skill for speed. If it frustrates your child, go back to one column at a time and return to this later.
- num: 11
  roman: Arts. 21–25
  idx: 35
  unit: 3
  title: Subtraction and borrowing
  mins: 35
  goal: Your child uses the words minuend, subtrahend and difference, and subtracts with and without borrowing.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: Short mental problems, the definitions and the minus sign, subtraction when no lower figure is larger, then how to borrow when it is.
  steps:
  - - Warm-up
    - 'Do the book''s mental problems aloud:

      ~ If you have 9 apples, and give 4 away, how many will you have left?

      ~ Frank had 15 cents; after spending 7, how many were left?'
  - - The words
    - 'Read:

      ~ The larger number is called the Minuend; the less, the Subtrahend;

      The number left is the difference or remainder. The sign − is called minus, meaning less.'
  - - No borrowing
    - 'Work the example together:

      ~ A man having $135, spent $112: how much had he left?

      Write 112 under 135. Units 5 − 2 = 3, tens 3 − 1 = 2, hundreds 1 − 1 = 0. He had $23 left.'
  - - Borrowing
    - 'Read:

      ~ When the lower figure in any order is greater than the upper, a difficulty arises, which we will now explain.

      Work the book''s example: From 73 subtract 45. We can''t take 5 from 3, so we take 1 ten from the 7 tens and make 13 units. 13 − 5 = 8, then 6 − 4 = 2. The difference is 28.'
  - - Guided practice
    - 'Do the book''s problems for Article 24 together, starting with:

      ~ A farmer having 245 sheep, sold 123: how many sheep had he left?

      Check: 122.'
  - - Wrap-up
    - 'Mental: 50 − 18? (32.) 100 − 35? (65.) 72 − 9? (63.)'
  tip: 'Use bundled sticks or coins: change a dime for ten pennies to show what borrowing really means.'
- num: 12
  roman: Art. 26
  idx: 40
  unit: 3
  title: The rule for subtraction and its proof
  mins: 35
  goal: Your child subtracts long numbers using the rule and proves each answer by adding.
  materials:
  - The book
  - A slate, small whiteboard or scrap paper
  - A notebook and pencil
  book: The rule for subtraction, the proof, a set of minuends and subtrahends, and story problems. Answers are printed for nearly all.
  steps:
  - - Warm-up
    - 'Mental: 13 − 8? 15 − 9? 11 − 4? 16 − 7?'
  - - The rule
    - 'Read:

      ~ Write the less number under the greater, placing figures of the same order in the same column.

      ~ Beginning at the right hand, subtract each figure from the one directly over it, and write the remainder beneath.'
  - - The proof
    - 'Read:

      ~ Add the remainder to the subtrahend; if the sum is equal to the minuend, the work is correct.

      Work the first example together: 7640 − 1234 = 6406. Prove it: 6406 + 1234 = 7640.'
  - - Guided practice
    - 'Do two of the story problems together:

      ~ A carriage cost $137, and a horse $65: how much more than the horse did the carriage cost?

      ~ A tree 75 feet high was broken; the part that fell was 37 feet long: how high was the stump?

      (Answers printed: $72 and 38 ft.)'
  - - Independent practice
