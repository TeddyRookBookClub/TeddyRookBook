  steps:
  - - Warm-up
    - 'Ask: Is 2/4 the same as 1/2? What did we do to 2/4 to get 1/2?'
  - - The idea
    - '~ The terms of a ratio correspond to the terms of a fraction, the antecedent to the numerator, the consequent to the denominator.

      So the fraction rules carry over:

      ~ III. A ratio is not changed 1st. By multiplying both terms by the same number. 2d. By dividing both terms by the same number.'
  - - Lowest terms
    - '~ Reduce 16 : 24 to its lowest terms.

      The greatest common divisor of 16 and 24 is 8, so 16 : 24 becomes 2 : 3.

      ~ Divide both terms of the ratio by their greatest common divisor.'
  - - Clearing fractions
    - 'The book''s example is 1½ : 2⅓. The least common multiple of the denominators 2 and 3 is 6. Multiply both terms by 6: 9 : 14.

      ~ Multiply both terms of the ratio by the least common multiple of the denominators of the fractions.'
