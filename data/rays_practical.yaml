    - 'Read:

      ~ In a mixed number, the decimal point is placed after the units order of the integer (Ex. 4).

      Notice the book''s trick in problems 33 and 34: "Two hundred and twenty-five thousandths" is .225, while "Two hundred units and twenty-five thousandths" is 200.025. The word "units" marks where the whole number ends.'
  - - Reading
    - 'Read:

      ~ Disregarding the decimal point, read the number as an integer.

      ~ Give the name of the right hand order.

      Your child reads the first numbers of the reading list on p. 175 aloud.'
  - - Independent practice
    - Your child writes problems 5 to 40 in figures (spread over two days if needed).
  - - Check and wrap-up
    - 'The writing list has no printed answers; see below. Mental: write 4 and 5 hundredths (4.05).'
