    - Your child does problems 6 to 12 (word problems), some of the drill problems, and the "what part" problems.
  - - Check and wrap-up
    - 'Answers are printed for the word and miscellaneous problems. Mental: 2 ÷ 1/3? (6.) 1/2 ÷ 2? (1/4.)'
