    - 'Read:

      ~ To find the prime factors common to two or more numbers.

      Work the book''s example: What prime factors are common to 30 and 42? Divide both by 2 (15 and 21), then by 3 (5 and 7). 5 and 7 share nothing, so 2 and 3 are the common factors.'
