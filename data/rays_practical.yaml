    - Your child does problems 5 to 16, writing dividend factors above a line and divisor factors below.
  - - Check and wrap-up
    - 'Answers are printed. Mental: (12 × 10) ÷ (4 × 5)? (6.)'
  tip: Cancellation is the same idea your child will use constantly with fractions in the next unit.
