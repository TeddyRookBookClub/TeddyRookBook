      ~ An improper fraction is one whose value is equal to or greater than 1.

      ~ A mixed number is a whole number and a fraction.

      ~ A compound fraction is a fraction of a fraction.'
  - - Sort them
    - Write 2/3, 7/4, 3 1/2, 5/5, 1/2 of 3/4 on cards. Your child sorts them by kind.
  - - Four principles
    - 'Read:

