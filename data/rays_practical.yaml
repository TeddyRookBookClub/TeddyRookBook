- title: Decimal compound numbers (measures)
  mins: 35
  goal: Your child changes a decimal of one measure to a lower measure by multiplying, to a higher measure by dividing, and finds the value of a decimal "in integers" (for example .3125 bu. = 1 pk. 2 qt.).
  materials:
  - Paper and pencil, or a slate or small whiteboard
  book: 'Page 186 starts Decimal Compound Numbers: Art. 151 (to a lower denomination) and Art. 152 (value in integers), each with a worked example. Page 187 has Art. 153 (to a higher denomination) and its problems. Answers are printed.'
  steps:
  - - Warm-up
    - 'Review the old tables the book uses here: 2 pints = 1 quart, 4 quarts = 1 gallon, 8 quarts = 1 peck, 4 pecks = 1 bushel, 3 ft. = 1 yd., 16½ ft. = 1 rod, 160 sq. rd. = 1 acre.'
  - - The idea
    - 'Two rules mirror each other:

      ~ A decimal is reduced to a lower denomination by multiplication

      ~ A decimal is reduced to a higher denomination by division

      Say: Going to smaller units, you get more of them, so multiply. Going to bigger units, divide.'
  - - Work the book's examples
    - '~ Reduce .05 gal. to the decimal of a pint.

      .05 × 4 = .2 qt.; .2 × 2 = .4 pt.

      ~ Find the value of .3125 bu. in integers.

      .3125 × 4 = 1.25 pk. Keep the 1 pk.; .25 × 8 = 2 qt. Answer 1 pk. 2 qt.

      ~ Reduce .64 pt. to the decimal of a gallon.

      .64 ÷ 2 = .32 qt.; .32 ÷ 4 = .08 gal.'
  - - Guided practice
    - 'Do one from each article together: .035 pk. to the decimal of a pint (page 186); .75 yd. in integers (page 186).'
