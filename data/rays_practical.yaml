    - 'Mental: Read aloud .5, .25, .125. Which is largest?'
  - - Naming a decimal
    - 'Read:

      ~ The numerator of a decimal is the number it expresses disregarding the decimal point.

      ~ The name of the right hand order is the name of the decimal.'
  - - Writing
    - 'Read the rule:

      ~ Write the numerator as an integer.

      ~ Place the decimal point so that the name of the right-hand order shall be the same as the name of the decimal.

      Work the book''s examples:

      ~ Write two hundred and sixty-five thousandths.

      ~ Write two hundred and sixty-five millionths.

      (.265 and .000265: ciphers fill the empty places.)'
