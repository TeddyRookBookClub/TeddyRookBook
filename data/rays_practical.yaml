    - Your child picks a division fact, changes the dividend or divisor, and predicts the new quotient before working it.
  - - Wrap-up
    - 'Ask: How does Principle III help with 3600 ÷ 400? (Divide both by 100: 36 ÷ 4 = 9.)'
