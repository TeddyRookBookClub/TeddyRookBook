  - - The idea
    - '~ The cost is the price paid for goods.

      ~ The selling price is the price received for goods.

      ~ The cost is the base; the profit or the loss is the percentage; and the selling price is the sum or the difference of the base and percentage.'
  - - Work the book's examples
    - '~ A merchant''s profit on a piece of cloth which cost $40 is 10%: for how much does he sell it?

      $40 + 10% of $40 = $44.

      ~ Prints that cost 6 ct. a yard are sold for 5 ct. a yard: what is the per cent of loss?

      The loss is 1 ct. on a cost of 6 ct.: 1/6 = 16⅔%.'
