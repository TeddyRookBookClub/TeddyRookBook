- title: Square root by factoring; right triangles; side of a square
  mins: 40
  goal: Your child finds square roots by prime factors, uses the rule of the right-angled triangle to find a missing side, and finds the side of a square from its area.
  materials:
  - Paper and pencil, or a slate or small whiteboard
