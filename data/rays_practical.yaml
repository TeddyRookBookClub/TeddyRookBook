    - Your child factors about 15 of the 43 numbers (mix small and large, such as 36, 48, 105, 154, 2310), then does common-factor problems 2 to 8.
  - - Check and wrap-up
    - 'Answers are printed. Mental: prime factors of 12? of 18? What do they share? (2 and 3.)'
