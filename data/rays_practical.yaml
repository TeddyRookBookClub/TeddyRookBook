    - Your child works two or three more notes from pages 245–246. The book prints the answer at the end of each problem line. Have your child cover the answers with a strip of paper, work the problem, then slide the strip down to check.
  - - Mental-math wrap-up
    - 'Aloud: $500 at 6% for 1 year, then $30 paid. New principal?'
  tip: 'These problems are long. One note per day is plenty. Lay the work out in a table: date, time, interest, payment, new principal.'
