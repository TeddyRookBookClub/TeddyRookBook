  book: Page 306 begins square root by factoring (Art. 239), with problems on page 307. Page 307 starts right-angled triangles (Art. 240), and page 308 shows the 3-4-5 triangle and gives two rules with problems. Page 309 has more triangle problems and the side of a square (Art. 241). Answers are printed.
  steps:
  - - Warm-up
    - 'Ask: What is 3² + 4²? What is 5²? Notice anything?'
  - - By factoring
    - 'Ray''s example: 441 = 3 × 3 × 7 × 7, so √441 = 3 × 7 = 21.

      ~ Resolve the number into its prime factors, and find the product of one of each two equal factors.'
  - - Right-angled triangles
    - '~ The side opposite the right-angle is called the hypotenuse; the other two sides, the base and the perpendicular.

      The key fact:

      ~ The square described on the hypotenuse of a right-angled triangle is equal to the sum of the squares described on the other two sides.

      Draw Ray''s triangle with sides 3 in. and 4 in. on grid paper, with a square on each side. Count: 9 + 16 = 25.'
  - - The two rules
    - '~ 1st. To the square of the base add the square of the perpendicular, and extract the square root of the sum.

      ~ 2d. From the square of the hypotenuse subtract the square of the other given side, and extract the square root of the difference.'
  - - Guided practice
    - 'Do these together:

