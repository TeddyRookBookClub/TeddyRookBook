      Say: The steps are always the same: divide, multiply, subtract, bring down.'
  - - Work the book example
    - 'Read:

      ~ Divide 3465 dollars equally among 15 men.

      15 into 34: 2 times. 2 × 15 = 30. 34 − 30 = 4. Bring down 6: 46. 15 into 46: 3 times, 45, remainder 1. Bring down 5: 15. 15 into 15: 1 time. Each man gets $231.'
  - - Avoiding mistakes
    - 'Read two of the remarks:

      ~ The product must never be greater than the partial dividend from which it is to be subtracted;

      ~ After subtracting, the remainder must always be less than the divisor;

      Say: If either one happens, the quotient figure was too big or too small.'
  - - Guided practice
    - 'Do the next worked example together, writing each step:

      ~ Divide 78994 by 319.

      Prove it by multiplying back.'
