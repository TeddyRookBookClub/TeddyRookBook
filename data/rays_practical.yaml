      ~ In a pile of wood 40 feet long, 12 feet wide, and 8 feet high, how many cords?

      (160 cu. ft.; 3840 ÷ 128 = 30 cords.)'
  - - Independent practice
    - Your child does problems 1 to 5 and 7 to 11.
  - - Check and wrap-up
    - Answers are printed. Measure a real box and find how many cubic inches it holds.
