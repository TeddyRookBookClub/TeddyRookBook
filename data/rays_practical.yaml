  book: Page 179 defines Subtraction of Decimals (Art. 144) and works one example. Page 180 gives the rule and problems 2–14, each with its answer printed.
  steps:
  - - Warm-up
    - 'Ask: If you have $5 and spend $1.25, how much is left? Talk through borrowing a dollar as 100 cents.'
  - - The idea
    - '~ Subtraction of Decimals is the process of finding the difference between two decimal numbers.

      The rule works like addition: line up the points, then

      ~ 2. Subtract as in simple numbers.

      and put the point in the remainder under the column of points.'
  - - Work the book's example
