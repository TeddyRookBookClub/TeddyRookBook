book:
  id: raysnewpractical00rayjrich
  title: Ray's New Practical Arithmetic
  year: '1877'
  key: practical
  short: Practical
  eyebrow: Ray's Arithmetic · Book 3 · 1877
  hero: 'Written arithmetic for children about 9 to 12: place value, the four operations, money and measures, fractions, decimals and percentage, with rules, worked examples and hundreds of problems. Every session has a guide you can follow step by step, with the right page of the book beside it.'
  how:
  - <b>One guide, one sitting.</b> Each guide covers a few of the book's articles and takes 30 to 40 minutes. Three or four a week gets through the book in about two school years.
  - <b>Slate first, then paper.</b> Have a slate, small whiteboard or scrap paper for working, and a notebook for finished problems.
  - <b>Say the rule, then use it.</b> Ray gives a short rule for each process. Read it together, then let the problems teach it. Don't make your child memorize rules word for word unless that helps.
  - <b>The book prints most answers.</b> Answers follow most problems, so your child can check work right away. Cover them with a card while working. Where the book gives no answer, the guide does.
  - <b>Mental math every day.</b> Each guide starts and ends with a few minutes of figuring in the head.
  - <b>Old money and measures.</b> Some problems use mills, old coins and old prices. The guides point these out briefly; the arithmetic is the same.
  lessonword: ''
  numnote: The book is divided into numbered articles, not lessons. Each guide covers a few articles, shown beside its title.
  unitword: Unit
