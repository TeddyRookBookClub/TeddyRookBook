  - - Old money note
    - '~ The unit of English money is the pound sterling.

      4 farthings = 1 penny (d.), 12 pence = 1 shilling (s.), 20 shillings = 1 pound (£). Britain used this system until 1971.

      The franc was divided into 100 centimes.

      ~ The unit of German money is the mark, which is divided into 100 pennies (pfennige).

