# Sections of a wide header menu panel (layouts/_partials/header.html, assets/css/site-shell.css "Wide panel").
# Each group listed here opens as a wide, grouped panel instead of a plain dropdown.
# Entries are matched by their menu URL in hugo.toml and appear in the order given here.
# A menu entry of that group that is in no section lands in a "More" section at the end, so new entries always show.
Education:
  - name: Ladders
    urls: [/math/, /physics/, /chemistry/, /biology/, /earth-and-space/, /american-history/, /geography/, /writing/, /vocabulary/, /logic/, /economics/, /art/, /etiquette/, /egyptology/, /ancient-scripts/, /memory/, /great-books/, /robotics/]
  - name: Homeschool & family
    urls: [/homeschool/, /progress/, /new/, /resources/]
  - name: Science & math to explore
    urls: [/science-lab/, /october-sky/, /connections/, /business/econometrics/, /business/game-theory/]
  - name: Languages & reading
    urls: [/languages/, /asl/, /harvard-classics/, /books/, /books/paths/, /free-books/]
  - name: Music, speaking & tests
    urls: [/music/, /debate/, /test-prep/]
  - name: History, pictures & video
    urls: ['/history/', /egypt/, /timeline/, /infographics/, /videos/]
