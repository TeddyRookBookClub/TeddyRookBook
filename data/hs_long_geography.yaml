    showers" means the spring rains fed it and made it grow, the way a nurse cares for a baby. "I flirted with the flowers" means it wound and played among
    the flowers on its banks. In the last verse the river reaches the ocean; there it stops being a river, so it calls the ocean its grave. Its water, of
    course, goes on, as the waterdrop's story showed.
