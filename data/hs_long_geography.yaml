  answers: The waterdrop's home was the sea. The sun warmed it and it rose as vapor, became part of a cloud, was carried by wind to a mountain, grew cold
    and heavy, and fell as rain. It sank into the ground, came out again in a pool, ran down the mountain, fell over a waterfall, turned a mill-wheel, passed
    towns and cities, and returned to the sea. Water rises from the sea as vapor, forms clouds, falls as rain or snow, and flows back in rivers to the sea.
