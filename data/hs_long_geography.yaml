  practice: On a free online map or globe, find Florida (a peninsula), the Isthmus of Panama, the Gulf of Mexico and the Chesapeake Bay. Look for more in
    magazines and books at home, as the book suggests.
  answers: A peninsula is land that has water on all sides but one. To change a peninsula into an island, cut through the narrow neck (isthmus) so water
    flows all round it. An island has water all round; a peninsula is joined to other land at one place. An isthmus is a neck of land joining two larger
    bodies of land. A bay (or a long, narrow one, a gulf) is part of a body of water that reaches into the land. A strait is a narrow passage of water joining
    two larger bodies of water.
