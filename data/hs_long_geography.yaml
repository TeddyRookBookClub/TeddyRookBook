book:
  id: homegeographyfor00longrich
  title: Home Geography for Primary Grades
  year: '1894'
  key: home-geography
  short: Home Geography
  eyebrow: Geography · Home Geography · 1894
  hero: 'C. C. Long''s beginning geography for children about 7 to 9 starts at the child''s own door: finding north by the sun and stars, measuring and
    drawing plans of a room and yard, then hills, rivers, rain, plants, animals, rocks and the work people do. All 45 lessons have a guide you can follow
    step by step, with the right page of the book beside it.'
  how:
  - '<b>Start at your own door.</b> Long wanted children to learn geography by looking at what is near them first. Most guides send you outside: to point
    north, pace the yard, follow a stream or climb a hill.'
  - <b>A little, often.</b> One lesson a day, two or three days a week, covers the book in a school year. The poem lessons are short; a few long lessons
    can be spread over two days.
  - <b>Model, draw, then tell.</b> The book asks children to show what they learn by modeling it, then drawing it, then telling or writing about it. Keep
    a sand tray (a baking pan of damp sand) and a geography notebook for the whole year.
  - <b>Writing to fit the child.</b> The book often says "write the following." A 7-year-old can copy one sentence or tell you the answer while you write;
    an older child can write a few sentences alone.
  - <b>Then and now.</b> Long wrote in 1894, when coal, wagons and slates were everyday things. Short "What we know now" notes help where facts have changed,
    and old words for peoples are gently updated.
  - <b>Safety outdoors.</b> An adult stays close by streams, ponds and lakes. Never look straight at the sun. Steam and boiling water are for adults; children
    watch from a distance.
  unitword: Unit
  lessonword: Lesson
  numnote: Guide numbers match the book's 45 numbered lessons, shown in Roman numerals beside each title.
units:
- id: 1
  name: Finding direction
  from: 1
  to: 6
  text: Right and left, then north, south, east and west by the sun, the stars and the compass, with shadows and winds.
- id: 2
  name: Distance, pictures and plans
  from: 7
  to: 9
  text: Measuring in inches, feet, yards and miles, and drawing plans of a table, a room and the yard to scale.
- id: 3
  name: The shape of the land
  from: 10
  to: 12
  text: Plains, prairies, deserts and oases, then hills, mountains and valleys, modeled in a sand tray.
- id: 4
  name: Water, air and weather
  from: 13
  to: 17
  text: Rain, wind and snow, how water turns to vapor and back, and dew, frost, clouds, fog, hail and snow.
- id: 5
  name: Rivers
  from: 18
  to: 23
  text: How springs, rills and brooks make rivers, what rivers do to the land, and the water cycle, with three river poems.
- id: 6
  name: Maps and forms of land and water
  from: 24
  to: 27
  text: Reading a map, then lakes, islands, peninsulas, isthmuses, bays and straits, reviewed on a trip up a hill.
- id: 7
  name: Plants
  from: 28
  to: 36
  text: Vegetables, grains, fruits, cotton, flax and sugar, forest trees and flowers, and what plants need to grow.
- id: 8
  name: Animals and the seasons
  from: 37
  to: 40
  text: How animals' parts and coverings fit their lives, how animals serve people, and the signs of the seasons.
- id: 9
  name: Things found in the earth
  from: 41
  to: 42
  text: Coal, salt and metals, then building stones, brick and glass.
- id: 10
  name: How people live and work
  from: 43
  to: 45
  text: Homes around the world, farming, mining, lumbering, fishing, factories and trade, and a review of work in your own town.
lessons:
- num: 1
  roman: I
  idx: 14
  unit: 1
  title: Right, left, front and back
  mins: 15
  goal: Your child names right, left, front and back, and sees that these words change every time we turn around.
  materials:
  - A table or desk your child can sit at
  - Two or three family members or stuffed animals to sit around the room
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'Lesson I is a short talk about position: hands on the desk, the back and front of the desk, and who sits on your right, left, front and back, then
    turning round and asking again. A note to the teacher says these words are of little use for telling where places are.'
  steps:
  - - Hands on the table
    - 'Have your child sit at a table and lay both hands on it, side by side.

      ~ Lay your hands upon your desk, side by side.

      ~ Which side shall we call the right side?

      Ask which hand is the right and which is the left. If your child is unsure, the hand they write or eat with is a useful clue.'
  - - Front and back
    - Ask your child to put their hands on the back of the table (the side farthest away), then on the front (the side nearest them).
  - - Who is where?
    - 'Seat a few people or stuffed animals around your child: one on the right, one on the left, one in front, one behind.

      Say: Who is on your right? On your left? In front of you? Behind you?'
  - - Turn round
    - 'Now your child stands and turns to face the other way. Ask the same four questions again. Then turn a quarter turn and ask once more.

      Say: Did the people move? No! But your right and left changed when you turned.'
  - - Why we need something better
    - 'This is the point of the lesson, from the book''s note to the teacher.

      Say: Right and left change every time we turn. If I told Grandma "the park is on the right," it would depend on which way she was facing. So people
      use words that never change. Tomorrow we will learn them from the sun.'
  - - Say it back
    - Ask your child to tell you, in their own words, why "right" and "left" are not good for telling someone where a place is.
  practice: Play "Simon says" with right hand, left foot, step forward, step back, and turn around.
  tip: Children of 7 often still mix up right and left. That is normal. A small sticker or ribbon on the right wrist for a week helps.
  answers: After turning round, the person who was on the right is now on the left, the one in front is now behind, and so on. Right, left, front and back
    depend on which way we face, so they cannot tell anyone where a place is.
- num: 2
  roman: II
  idx: 15
  unit: 1
  title: How the sun shows direction
  mins: 25
  goal: Your child finds east from where the sun rises, west from where it sets, then stands with arms out to find north and south.
  materials:
  - A sunny morning or late afternoon, and a spot outside
  - Four sheets of paper and a marker to make N, S, E, W signs
  - Tape
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: The book explains that "the way to a place is called direction," that the sun seems to rise in the east and set in the west, and shows how to stretch
    out your arms to find north and south. Two sentences to copy and a set of oral questions about the schoolroom and neighborhood follow.
  steps:
  - - Which way is home?
    - 'Read the opening aloud.

      ~ The way to a place is called direction.

      Say: Direction means which way. We have four special names for directions that never change: north, south, east and west.'
  - - Where does the sun rise?
    - 'Go outside (or to a window) and ask your child to point to where they have seen the sun come up in the morning.

      ~ The direction in which the sun seems to rise is called the east.

      Then ask where it goes down in the evening. That is west, the opposite way. Never look straight at the sun; just point toward that side of the sky.'
  - - Arms out
    - 'Stand together outside. Your child stretches the right arm toward the east (sunrise side) and the left arm toward the west.

      Say: Now you are facing north. Behind you is south.

      Have your child say all four directions while turning to face each one.'
  - - Label the house
    - Back inside, work out together which wall of the main room faces each direction. Make four signs, N, S, E and W, and tape them up. Leave them up for
      the next lessons.
  - - Copy the sentences
    - 'Your child copies the book''s two sentences into the geography notebook, or copies the first and you write the second while they watch.

      ~ The sun seems to rise toward the east, and set toward the west.

      For a younger writer, one sentence is plenty.'
  - - Oral questions about home
    - 'Ask some of the book''s questions, changed to fit your home: Which side of the house is the north side? Who sits to the north of you at the table?
      In what direction is the street from the house? In what direction is the nearest church, store or park? In what direction is Grandma''s house?'
  - - The fireplace puzzle
    - 'Ask the book''s puzzle: if a room has a fireplace in the middle of the east side, which side of the room faces the fire? If the wind blows from the
      north, which way will the smoke go?'
  practice: Every morning this week, ask "Where is the sun?" and "Which way is north?" until it comes without thinking.
  tip: The sun rises exactly in the east only around late March and late September. In summer it comes up a little toward the northeast, in winter toward
    the southeast. For finding the four directions roughly, "sunrise side is east" works fine.
  answers: 'The sun seems to rise in the east in the morning and set in the west in the evening. Fireplace puzzle: the west side of the room faces a fire
    on the east wall. A north wind blows the smoke toward the south. If we walk with the morning sun in our faces we are going east, and west is behind
    us. Questions about your own home, street and town have no fixed answer; check them together outside.'
- num: 3
  roman: III
  idx: 19
  unit: 1
  title: How the stars show direction
  mins: 20
  goal: Your child finds the Big Dipper and the North Star on a clear night and uses them to point north.
  materials:
  - A clear evening after dark, outside with a parent
  - A warm jacket and a flashlight (cover it with red cellophane or a red sock if you have one)
  - 'Optional: a free star-map app or a printed star chart'
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: A short lesson on the seven bright stars of the Dipper, part of a larger group called the Great Bear, and how the two stars at the end of the Dipper
    point to the North Star. One sentence to copy about sailors.
  steps:
  - - At night?
    - 'Ask: We can find directions by the sun, but how could we find north at night?

      Read the lesson together, looking at the picture of the Great Bear.'
  - - Seven stars
    - 'Explain in plain words: seven bright stars make a shape like a big pan with a handle. In America we call it the Big Dipper. The book says some people
      thought it looked like a wagon and three horses, or a plow.

      ~ These seven stars are called the Dipper.'
  - - The pointer stars
    - 'On the picture, find the two stars at the end of the Dipper farthest from the handle. Run a finger along them and keep going: they point to the North
      Star.

      ~ That star is always in the north; so by it, on a clear night, you can tell the other directions at once.'
  - - Go and look
    - 'On a clear night, go outside together. Look to the northern sky (use the N sign you made last lesson to know which way). Find the Dipper, then follow
      the pointers to the North Star. It is not the brightest star in the sky, but it is the one that stays in place.

      Once you find it, your child faces it and says: "North is in front of me, south is behind, east is on my right, west is on my left."'
  - - Copy the sentence
    - 'Your child copies the book''s sentence:

      ~ Sailors out on the sea at night often find direction by looking at the North Star.'
  - - Say it back
    - Ask your child to tell you how to find the North Star, as if explaining it to a friend.
  practice: Look for the Dipper on a few more clear nights. Notice that it is in a different position at different times of night and in different seasons,
    but the North Star stays put.
  tip: The Dipper is easiest in spring and summer evenings, high in the north. In autumn it sits low near the northern horizon, so look from an open spot.
    Give your eyes ten minutes to get used to the dark.
  answers: Find the seven stars of the Dipper. The two stars at the end of the bowl, farthest from the handle, point to the North Star. Facing the North
    Star, you face north; east is on your right, west on your left and south behind you.
- num: 4
  roman: IV
  idx: 20
  unit: 1
  title: How the compass shows direction
  mins: 25
  goal: Your child knows that a compass needle points north, names the four chief points and the four in-between directions, and reads a real or homemade
    compass.
  materials:
  - A compass if you have one (a phone compass app also works)
  - 'Or, for a homemade one: a sewing needle, a fridge or bar magnet, a small slice of cork or a bottle cap, and a bowl of water'
  - Paper and pencil for a compass rose
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: The lesson asks how to find direction when it is cloudy, describes a compass as a box with a needle swinging on a pin that points north, and names
    the chief points (north, south, east, west) and the in-between points (northeast, northwest, southeast, southwest). Three sentences to copy.
  steps:
  - - A cloudy-day question
    - 'Ask: If it is cloudy and you cannot see the sun or the stars, how could you tell which way is north?

      Read the lesson together.

      ~ It is a box in which is a little needle swinging on the top of a pin.'
  - - Look at a compass
    - 'If you have a compass, let your child hold it flat and still and watch the needle settle. Turn slowly in a circle: the needle keeps pointing the
      same way. Check it against your N sign from Lesson II.'
  - - Or make one
    - 'With an adult: stroke a sewing needle along a magnet about 30 times, always in the same direction. Lay it on a slice of cork or a bottle cap floating
      in a bowl of water. It slowly turns to point north and south.

      Safety: the adult handles the needle; put it away afterward.'
  - - Eight directions
    - 'Draw a compass rose: a cross with N at the top, S at the bottom, E on the right, W on the left. Then add NE, SE, SW and NW halfway between.

      Say: Northeast is halfway between north and east.

      Have your child point to each direction in the room.'
  - - Copy the sentences
    - 'Your child copies one or two of the book''s sentences:

      ~ The chief points of the compass are north, south, east, and west.

      ~ Sailors find their way over the ocean by the help of the compass.'
  - - Quick quiz
    - 'Name a direction and have your child point: northeast, south, west, southeast. Then switch: you point and your child names the direction.'
  practice: Keep the compass rose on the fridge. Each day ask which direction one window, door or room is from where you stand.
  tip: Keep the compass away from the fridge door, steel tables and phones while you read it, as metal and magnets pull the needle off.
  answers: A compass needle at rest points north, so even on a cloudy day or a dark night you can find north and then the other directions. The chief points
    are north, south, east and west; between them are northeast, southeast, southwest and northwest.
- num: 5
  roman: V
  idx: 22
  unit: 1
  title: 'Questions on direction: shadows, birds and wind'
  mins: 30
  goal: Your child answers questions about direction by watching shadows, smoke and the sky, and knows that a north wind is one that blows from the north.
  materials:
  - A sunny day
  - Chalk or a few stones to mark shadows on the ground
  - A ribbon or strip of tissue paper on a stick for watching the wind
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'A page of questions for the child to find out for themselves: how to find north by day, night, rain or shine; which way birds fly in winter; where
    your shadow falls at sunrise, noon and sunset; what smoke and a weather vane tell us; and what weather each wind brings.'
  steps:
  - - Find it out yourself
    - 'Read the opening aloud:

      ~ She could tell you, but it is better to find them out for yourself.

      Say: Today you are the explorer. Let''s answer these questions by going and looking.'
  - - Quick review
    - 'Ask the first questions: How can I find north on a sunny day? On a starlit night? On a rainy day? How does a sailor find north? Your child answers
      from Lessons II to IV.'
  - - Shadow watch
    - 'Go outside in the morning. Your child stands still while you trace around their feet with chalk and mark the end of their shadow. Which way does
      it point? Come back around the middle of the day and again in the late afternoon, standing in the same chalk feet. When is the shadow shortest? Which
      way does it point then?

      Never look straight at the sun.'
  - - Birds and snow
    - 'Ask: When winter comes, many birds fly to a warmer country. Which way will they fly? Point to where ice and snow have their home. What direction
      is that?'
  - - Which way is the wind blowing?
    - 'Hold up your ribbon on a stick, or watch smoke from a chimney, a flag or tree tops.

      Say: A north wind is a wind that comes FROM the north. Which way is today''s wind coming from?

      If there is a weather vane nearby, look at it: the arrow points into the wind.'
  - - Moss on trees
    - 'The book suggests checking for moss on the north side of trees. Look at a few trees together and see what you find.

      What we know now: moss grows wherever bark stays shady and damp, which is often but not always the north side. It is fun to check but not safe to
      trust if lost; the sun, the North Star or a compass is better.'
  - - Talk it over
    - 'Ask what weather each wind brings where you live. Keep a little chart this week: the wind''s direction each day and whether it was warm, cold, wet
      or fair.'
  practice: 'Keep the wind-and-weather chart for a week. At the end, ask: which wind brought the coldest day? The rainiest?'
  tip: In summer, the shortest shadow often comes closer to 1 o'clock than 12, because clocks are set forward for daylight saving time. That is a good surprise
    to discover.
  answers: By day, find north with the sun (sunrise is east, so north is to your left as you face the sunrise); at night, with the North Star; on rainy
    or cloudy days, with a compass. Sailors use the compass and the North Star. If lost and home is north, walk toward the North Star, or keep the morning
    sun on your right. In winter birds fly south, toward warm lands; ice and snow have their home in the north. Your shadow falls toward the west at sunrise,
    toward the east at sunset, and toward the north at noon (in the United States); it is shortest at noon, when the sun is highest in the sky. Smoke and
    a vane show which way the wind blows. A north wind blows from the north. Across most of the United States north winds bring cold weather and south winds
    warm weather; the book's poem in the next lesson says east winds bring chilly rain and west winds bring pleasant weather.
- num: 6
  roman: VI
  idx: 25
  unit: 1
  title: What the winds bring (poem)
  mins: 15
  goal: Your child enjoys the poem, tells what each wind brings, and writes a few sentences about the wind.
  materials:
  - The book open to the poem
  - Colored pencils
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'A poem by Lillian Cox about the north, east, south and west winds and the gifts each brings, then a short verse ("Whichever way the wind doth blow"),
    and a writing task: write all you can tell about the wind, with three questions.'
  steps:
  - - Read the poem aloud
    - 'Read the whole poem to your child slowly, then read it again while your child follows along. It begins:

      ~ Comes the north wind, snowflakes bringing

      ~ Robes the fields in purest white,'
  - - Four winds, four gifts
    - 'Go stanza by stanza and ask: What does the north wind bring? (snow, frost pictures on the window) The east wind? (chilly, driving rain) The south
      wind? (heat that ripens apples, pears and grapes) The west wind? (flowers, butterflies and bees)'
  - - The little verse
    - 'Read the short verse at the end together.

      ~ Whichever way the wind doth blow,

      ~ Some heart is glad to have it so;

      Ask: Who might be glad of a north wind? (children with sleds) Of a south wind? (a farmer with ripening fruit)'
  - - Draw the four winds
    - Your child folds a page into four boxes, labels them N, E, S, W, and draws what each wind brings in the poem.
  - - Write about the wind
    - 'The book says:

      ~ Write all that you can tell about the wind.

      Ask your child to write three or four sentences. A 7-year-old might dictate and then copy one sentence. Gently fix spelling by writing the word correctly
      underneath, not by crossing out.'
  - - Questions
    - 'Ask the book''s questions: What was the direction of the wind during the last snowstorm? Why is the north wind cold? Why is the south wind warm?'
  practice: Read the poem again on a windy day and decide together which wind is blowing.
  answers: 'The north wind is cold because it comes from the cold lands of the north, where ice and snow have their home. The south wind is warm because
    it comes from warm lands to the south. The direction of the last snowstorm''s wind depends on where you live; often it is from the north or northeast.
    A good written piece might say: "The wind is moving air. We cannot see it, but we can see it move the trees and feel it on our faces. The north wind
    is cold. The south wind is warm."'
- num: 7
  roman: VII
  idx: 26
  unit: 2
  title: How to tell distance
  mins: 30
  goal: Your child measures things in inches, feet and yards, guesses distances before measuring, and has a feel for how far a mile is.
  materials:
  - A 12-inch ruler and a yardstick or tape measure
  - 'Optional: a phone or car trip meter for measuring a mile'
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: The lesson says that to find a place we need its direction and its distance, then teaches the inch, foot, yard and mile, with oral exercises measuring
    the slate, desk, room, windows, doors and street, and estimating heights and distances in the town. A note says to guess by eye first and then check
    by measuring.
  steps:
  - - Direction is not enough
    - 'Read the first lines together.

      ~ To tell where a place is, we must know its direction.

      Say: If I say "the store is east," you still don''t know if it is next door or a hundred miles away. We also need to know how far. That is called
      distance.'
  - - Inch, foot, yard
    - 'Show the inch line in the book and on the ruler. Count the 12 inches in a foot. Lay the ruler three times along the yardstick.

      ~ A yard stick is three feet long.'
  - - Guess, then measure
    - 'Follow the book''s note: first guess, then measure. How many inches long is this book? How long is the table? How many feet long is the room? How
      wide is the door? The window? Write each guess and each real answer in two columns in the notebook.'
  - - How tall?
    - 'Ask your child to guess the height of the room, the house, a tall tree nearby. Measure what you safely can (the room); for the others, compare: "The
      house is about as tall as how many of Dad stacked up?"'
  - - What is a mile?
    - 'Say: A mile is much longer than a yard. It is 1,760 yards, or 5,280 feet.

      Think of a place about a mile from home. If you can, walk it together, or drive it and watch the trip meter. A child walks a mile in about 20 to 30
      minutes.'
  - - The neighborhood
    - 'Ask the book''s town questions, fitted to your home: Name the nearest river or creek. In what direction is it from home? Which way does the water
      run? In what direction, and about how far, is the nearest church or store?'
  - - Wrap up
    - 'Ask the book''s last question: What must you know to go to any place? (Its direction and its distance.)'
  practice: On walks this week, guess how many steps it is to the next corner, then count. Guess in yards, then check with a tape measure on the sidewalk.
  tip: Children get better at guessing very quickly. The book says to keep practicing "until the work becomes quite accurate."
  answers: There are 12 inches in a foot, 3 feet in a yard, and 1,760 yards (5,280 feet) in a mile. To go to any place you must know its direction and its
    distance. Measurements of your own book, table, room and street will be your own; the number of blocks in a mile depends on your town (you can find
    out by walking or driving a mile and counting).
- num: 8
  roman: VIII
  idx: 28
  unit: 2
  title: Pictures and plans
  mins: 30
  goal: Your child knows the difference between a picture and a plan, and draws a plan of a table or room to scale with N, S, E and W marked.
  materials:
  - Building blocks, books or small boxes
  - A large sheet of paper and pencil
  - A tape measure and ruler
  - A small table (or the top of a toy box) to make a plan of
  book: A story about a boy who traced around blocks to show his cousin a plan of his house, then a picture of a schoolroom beside a plan of the same room.
    The lesson explains how to draw the plan using one inch for one foot, how to show doors, windows, desks, a globe and the teacher's table, and how to
    mark north, south, east and west.
  steps:
  - - Picture or plan?
    - 'Look at the picture of the schoolroom and then at the plan of it in the book.

      ~ The picture shows the objects as we see them before us. The plan shows where the objects are, and their direction from one another.

      Ask: What can you see in the picture that you cannot see in the plan? (the front of the desks, the clock) What does the plan show better? (where everything
      is)'
  - - Trace a house
    - 'Do what the little boy in the book did: lay blocks in the shape of a house on a large sheet of paper, trace around them, then lift them away. There
      is the plan.'
  - - A bird's-eye view
    - 'Say: A plan is what a bird would see looking straight down.

      Hold a cup above the paper and look down: the plan of a cup is a circle. Trace around the bottom of a cup, a book and a box.'
  - - Scale
    - 'Read how the book makes the plan smaller than the room.

      ~ Make one inch in the plan stand for one foot in the room.

      Ask: The book''s room is 40 feet long. How long is the line in the plan? (40 inches) If the door is 3 feet wide? (3 inches)'
  - - Plan of a small table
    - 'Measure a small table together. Draw its plan using one inch for every foot (or for every 6 inches if the table is small). Put a few objects on it
      and draw their plans in the right places: a circle for a cup, an oblong for a book.'
  - - Mark the directions
    - 'Using your N, S, E, W signs, write N, S, E and W on the four sides of the plan.

      Say: Now we can tell the direction of one thing from another on the plan.

      Ask: Which object is farthest north?'
  practice: 'Draw plans of other flat-topped things: a bookshelf top, a dinner table set for supper, a sandbox.'
  answers: A picture shows how things look from where we stand; a plan shows where things are and their direction from one another, as if looking straight
    down. With one inch for one foot, the 40-foot sides of the book's room become 40-inch lines, the 30-foot sides become 30-inch lines, and a 3-foot door
    becomes 3 inches wide.
- num: 9
  roman: IX
  idx: 32
  unit: 2
  title: 'Written exercise: plans of your room, house and yard'
  mins: 35
  goal: Your child writes full-sentence answers about where their home (or school) is, and draws a scale plan of their own room and of the house and yard.
  materials:
  - Tape measure
  - Graph paper or plain paper, ruler and pencil
  - Your N, S, E, W signs or a compass
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'Questions to answer in full sentences about the school''s name, street, the way it faces, its rooms, and how far it is from home, with a plan of
    school grounds. Then drawing exercises: a plan of the schoolroom using one inch for ten feet, a plan of the teacher''s table, a plan of the house and
    grounds, and a plan of your own room at home. A note warns that the top of a map is not always north.'
  steps:
  - - Questions about home
    - 'The book asks about the school. For a homeschool, ask the same about home, and have your child write the answers in full sentences: What is our address?
      On what street or road is our house? Which side of the street? Between what streets? In which direction does the front door face? How many rooms does
      it have?'
  - - A full sentence
    - Show your child how to turn a short answer into a sentence. "Maple Street" becomes "Our house is on Maple Street." For a younger child, write two
      or three answers together and let them copy one.
  - - Plan of your own room
    - 'The book says:

      ~ Draw a plan of your own room at home, showing the table, bed, chairs, and other objects in it.

