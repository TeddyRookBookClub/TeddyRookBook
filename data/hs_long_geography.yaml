  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: Pictures and small maps of a peninsula ("almost an island"), an isthmus (a neck of land), a bay (named from "bow," like a bay window), a gulf, and
    a strait (a narrow passage joining two larger bodies of water). The child makes them after a rain, looks for pictures, and copies definitions.
  steps:
  - - Almost an island
    - 'Read about the peninsula and look at the picture and map.

      ~ The word peninsula means almost an island.

      In the sand tray, build a strip of land that pokes out into the water, joined at one end.'
  - - The neck
    - 'Read about the isthmus.

      Say: Just as your neck joins your head to your body, an isthmus is a narrow neck of land that joins a peninsula to the other land.

      Ask the book''s question: How would you change this peninsula into an island? Let your child cut through the isthmus with a finger.'
  - - A bay
    - 'Look at the picture of the bay. If you have a bay window, look at it.

      Say: Bay means bow, a bend. A bay is where the water bends into the land.

      Push a curved bite into the shore in the sand tray. A long, deep one can be called a gulf.'
  - - A strait
    - 'Read about the strait.

      ~ A strait is a narrow passage of water that joins two larger bodies of water.

      In the tray, make two "seas" joined by a narrow channel.

      Say: An isthmus joins two pieces of land. A strait joins two bodies of water.'
  - - Outside after rain
    - 'The book says:

      ~ After a rain make little lakes, rivers, bays, etc.

      After the next rain, go outside and look for puddle bays and mud peninsulas, or make them.'
  - - Write
    - 'Your child copies one or two definitions from the book, for example:

