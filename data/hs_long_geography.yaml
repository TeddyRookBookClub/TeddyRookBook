  practice: 'Look on a free online map for the stream or river nearest your home. Follow it with a finger to see where it goes: into a bigger river, a lake
    or the ocean?'
  answers: Rain falls on hills and mountains. Some runs off down the slopes; some sinks into the ground and comes out again as a spring. A tiny stream from
    the spring is a rill; rills join to make a brook or creek; brooks join to make a river, which flows at last into the ocean (or into a lake or another
    river). The source is where a river begins, the mouth is where it flows into another body of water, the bed is the land it flows over, and the banks
