      nothing.)'
  - - The ship of the desert
    - 'Read about the caravan.

      ~ It is sometimes called the ship of the desert.

      Ask: Why do travelers use camels to cross the desert, not horses? Use toy animals to make a caravan cross the tray to the oasis.'
