  practice: Your child may learn the verse for the present season by heart.
- num: 41
  roman: XLI
  idx: 121
  unit: 9
  title: 'Things found in the earth: coal, salt and metals'
  mins: 35
  goal: Your child names things we dig from the earth, tells a mineral from a metal, and knows a use for coal, iron, steel, gold, silver, tin, lead, copper,
    zinc and brass.
  materials:
  - A magnet
  - 'A collection of small metal things: a steel paper clip, an iron nail, an aluminum foil ball, a copper-colored coin, a brass key or button, a tin can
    (smooth edge only), a piece of jewelry'
  - A little table salt
  - A pencil (to look at its "lead")
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'The earth holds coal, iron, gold, silver, tin, lead, copper, salt, oil, diamonds and building stone. Minerals are dug from mines. Coal does much
    of our work (soft or bituminous coal, and hard anthracite). Salt comes from mines and wells. Some minerals are metals: a rhyme lists the uses of iron,
    then steel, gold, silver, tin-plate, lead and shot, the pencil''s graphite, copper, zinc and brass. Writing tasks on tin, coal and other metals.'
  steps:
  - - Hidden treasures
    - 'Read the opening paragraphs. Ask: What things come out of the earth? List them together.

      ~ Coal, iron, gold, silver, lead, tin, copper, mercury, and salt are called minerals.

      Say: The hole dug in the earth to get them out is called a mine.'
  - - Coal
    - 'Read about coal. Ask: What work does coal do for us?

      Say: In 1894 coal heated houses and ran trains, ships and factories. Today much of it is burned to make electricity.

      What we know now: the book says "some day you will be able to understand how coal was made." Coal formed from plants of ancient swampy forests, buried
      and pressed underground for millions of years.'
  - - Salt
    - 'Taste a pinch of salt. Ask: Does all salt come out of mines? (No; some comes from salt wells, and some is made by letting sea water dry up.) Read
      about the salt mine rooms that glitter like a fairy palace.'
  - - The iron rhyme
    - 'Read the rhyme about iron.

      ~ Iron vessels cross the ocean,

      ~ Iron everything we use.

      Say: Steel is iron made very hard. Hunt around the kitchen for things made of steel: knives, spoons, pots, scissors.'
  - - Magnet test
    - Hold the magnet to each metal object. Which ones stick? Iron and steel do; copper, brass, gold, silver and aluminum do not. Sort them into two piles.
  - - Gold, silver, tin, lead, copper
    - 'Read about each metal and ask the book''s questions: Why are gold coins and rings not pure gold? What does "lustrous" mean? Why is a tin cup really
      iron? Look at a pencil tip: is it made of lead?

      Safety: lead and mercury are poisonous. Never touch mercury from an old thermometer or play with lead.'
  - - Write
    - 'The book asks the child to write five lines about coal, five about tin, and what they know of iron, gold, silver, copper and lead. Pick one: your
      child writes three to five sentences about coal or iron.'
  practice: 'Start a "things from the earth" box: a lump of coal if you can find one, salt, a nail, a copper penny, a pencil, a rock.'
  tip: 'What we know now: the book says pencil "lead" is graphite, "a kind of coal." Graphite is a form of carbon, the same stuff coal is mostly made of,
    but it is not coal. Pencil leads are graphite mixed with clay. Lead pipes, lead paint and lead shot are no longer used in homes because lead is poisonous.'
  answers: 'Things from the earth: coal, iron, gold, silver, tin, lead, copper, mercury, salt, oil, diamonds and building stone. Coal heats homes and runs
    engines in mills, factories, ships and trains (and today makes much of our electricity). Soft (bituminous) coal burns with much flame and smoke; hard
    (anthracite) coal burns with little blaze but great heat. Gas was made from soft coal. Salt comes from mines, from salt wells, and from sea water dried
    by the sun. Steel is iron made very hard; knives, axes, needles, pins and scissors are made of it. Gold for money and jewelry is mixed with a harder
    metal so it does not wear away, because pure gold is very soft; the man who makes gold watches, chains and rings is a goldsmith or jeweler. Lustrous
    means bright and shining; silver is the most lustrous metal, and iron is not very lustrous. Tin-plate is thin iron dipped in melted tin, so a tin cup
    is really made of iron. Lead is heavy and soft. A pencil "lead" is graphite, not lead. Copper does not rust and is used for cooking pots and wire. Brass
    is copper and zinc mixed, used for keys, doorknobs, buttons and band instruments.'
- num: 42
  roman: XLII
  idx: 128
  unit: 9
  title: 'More about things found in the earth: stone, brick and glass'
  mins: 30
  goal: Your child names the common building stones (granite, sandstone, limestone, marble, slate), knows a quarry, and knows that brick, mortar and glass
    are made from clay, lime and sand.
  materials:
  - 'A few rocks or stone things to look at: a piece of granite (a countertop sample or gravel), sandstone, a piece of chalk, a slate or roof tile, marble
    (a tile or coaster)'
  - A brick if you have one
  - A little white vinegar and an eyedropper
  - A magnifying glass
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: Building stones come from quarries. Granite is hard and enduring and used for steps, paving and curbs; sandstone (including brownstone) is made
    of grains of sand and crumbles more easily; limestone is burned in a lime-kiln to make lime; marble is beautiful when polished; chalk is a soft limestone;
    slate splits into thin plates for writing and roofs. Brick is made of clay, mortar of lime, and glass of sand. Visit mines and quarries if possible.
  steps:
  - - A quarry
    - 'Read the opening and look at the pictures of the granite and marble quarries.

      ~ The place from which stones are taken for building is called a quarry.'
  - - Granite and sandstone
    - 'Look at granite and sandstone with the magnifying glass. Granite shows speckles of different crystals; sandstone shows tiny grains of sand. Rub each
      with a coin: which crumbles? (sandstone)

      Ask the book''s questions: What does "enduring" mean? What does "crumble" mean?'
  - - Limestone, chalk and marble
    - 'Drip a little vinegar on chalk, a piece of limestone or marble, or a seashell. Look for tiny bubbles.

      Say: Limestone, chalk and marble are all made of the same thing as seashells, and vinegar makes them fizz. Granite does not fizz.

      Ask: Is chalk harder or softer than other stone? Could you build a house of it?'
  - - Slate
    - 'Look at a slate or slate tile. Ask: What is slate used for? (writing slates, roofs, floors) Why is it good for these? (it splits into thin, flat,
      smooth plates)'
  - - Brick, mortar and glass
    - 'Read the last part. Ask: Is brick found in the earth? (No, but it is made of clay, which is.) What is mortar made of? (lime, from limestone) What
      is glass made from? (sand)'
  - - Stones in town
    - 'Take a walk and look for stone: granite curbs and steps, brick walls, slate roofs, marble on old buildings or in a cemetery. Ask: Which is the best
      building stone, and why?'
  practice: Start a small rock collection, as the book's preface suggests, in an egg carton with each stone labeled with where it was found.
  tip: 'Visiting a quarry: look from a public overlook only. Quarry edges and quarry ponds are dangerous. The book''s lime-kiln is for watching only, too:
    quicklime burns skin.'
  answers: A quarry is a place from which stone for building is taken. Granite is used for steps, paving and curbs, and sometimes for buildings, because
    it is easily shaped, strong and enduring. "Enduring" means lasting a long time; "crumble" means to break into small bits. Sandstone (brownstone is one
    kind) crumbles more easily than granite. Lime is made by burning limestone in a lime-kiln. Marble is used for statues, table tops, mantelpieces, steps
    and buildings because it is beautiful when polished and lasts long. The book says marble and granite are the most beautiful and enduring building stones.
    Chalk is a soft limestone, too soft for building. Slate is used for writing slates and for roofs because it splits into thin, smooth, firm plates. Bricks
    are made of clay and are used for walls, houses, chimneys and paths; the man who builds with them is a bricklayer or mason. Mortar is made chiefly of
    lime. Glass is made from sand.
- num: 43
  roman: XLIII
  idx: 132
  unit: 10
  title: 'How people live and what they are doing: homes, farming, mining, lumbering and fishing'
  mins: 35
  goal: Your child knows that people everywhere need food, clothing and shelter, and names the work of farmers, stock-raisers, miners, lumbermen and fishermen
    and where each kind of work is done.
  materials:
  - Pictures of different kinds of homes (from books or magazines)
  - A grocery bag of food and a few clothes to trace back to plants and animals
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'A long lesson. Houses are made of things from the earth; people around the world live in tents, wigwams, huts, snow houses and bamboo houses. We
    need food, clothes and houses, and to supply them people do many kinds of work: farming (plants for food and clothing), stock-raising (animals for meat,
    milk, wool, leather), mining (coal and iron in the mountains), lumbering (in the winter forests), and fishing in the sea.'
  steps:
  - - Many kinds of homes
    - 'Read the opening. Ask: Can you think of anything used in building houses that does not come from the earth?

      Look at the pictures of homes. Ask: What is a tent? A wigwam? Did you ever hear of people who live in snow houses?

      Say: People build homes from what is around them: snow in the far north, bamboo where bamboo grows, wood where there are forests.'
  - - What do we need?
    - 'Read:

      ~ We could not live without food.

      Ask: What else do we need? (clothes, houses, and, the book adds, schools, books and churches) Who makes all these things? People doing many kinds
      of work.'
  - - Farming
    - 'Unpack the grocery bag. For each item, ask: Is it from a plant or an animal? Which part of the plant?

      ~ This occupation we call agriculture or farming;'
  - - Stock-raising
    - 'Read about stock-raising. Ask the book''s questions: What is a pasture? A meadow? What does grazing mean? Does a dog graze? A cow?'
  - - Mining and lumbering
    - 'Read about mines and the lumbermen. Ask: What would it be like to work in a mine? Why do lumbermen work in the woods in winter? How do the logs get
      to the saw-mill?'
  - - Fishing
    - 'Read about fishing. Ask: Have you ever seen the ocean, or eaten its fish? Name some fish from fresh water. Are there any fish in waters near us?'
  - - Tell it back
    - Your child tells back, for each job (farmer, stock-raiser, miner, lumberman, fisherman), what they do and where they work. It is fine to spread this
      lesson over two days.
  practice: On a drive or walk, look for farms, pastures, a lumber yard, a quarry or a fishing boat, and name the work done there.
  tip: The book uses words of its time ("wigwam," "huts," "snow houses"). You might add that wigwams were homes of several Native American nations, and
    snow houses (igloos) were built by Inuit hunters for winter travel. People in every place have found clever ways to build with what they had.
  answers: 'Wood (and straw) for houses comes from plants, not from the earth like stone, brick, lime, iron and glass. A tent is a shelter of cloth or skins
    on poles; a wigwam is a dome-shaped home of poles covered with bark or mats, made by several Native American nations; snow houses (igloos) were built
    by the Inuit of the far north. Farming (agriculture) is raising grain, vegetables and other plants; stock-raising is raising cows, sheep and other animals.
    A pasture is grassy land where animals graze; a meadow is grassy land, often cut for hay. Grazing means feeding on grass: a cow grazes, a dog does not.
    Mining is digging coal, iron and other minerals out of the earth; its dangers include falling rock, explosions of gas, bad air and flooding. Lumbermen
    cut trees in winter and haul the logs over the snow to the frozen streams; in spring the logs float down to the saw-mills. Fishermen near the ocean
    catch cod, mackerel, herring and sardines; fresh-water fish include trout, bass, catfish and perch.'
- num: 44
  roman: XLIV
  idx: 142
  unit: 10
  title: 'More about what people are doing: factories and trade'
  mins: 25
  goal: Your child knows what manufacturing and trade (commerce) are, and explains why the work people do depends on where they live.
  materials:
  - 'A few manufactured things from home: a shoe, a fork, a toy, a cotton shirt'
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'In cities, people work in mills and factories that turn wheat into flour, cotton into cloth, leather into shoes, iron into stoves and lumber into
    furniture. Exchanging goods is trade or commerce; goods travel by boat, wagon and pack animals. Make a list of occupations. The work people do depends
    on where they live: farms on rich level land, mines in the mountains, fishing and trade by the sea, factories and stores in the city.'
  steps:
  - - Mills and factories
    - 'Read the opening.

      ~ These are mills or factories, full of machines in motion doing their work almost like human beings.

      Ask: What did the factories in the book make? (flour, thread and cloth, shoes, plows, stoves, cutlery, furniture, toys)'
  - - Made from what?
    - 'Hold up each thing from home. Ask: What was this made from? (a shoe from leather, a fork from steel, a shirt from cotton) Where did that come from?'
  - - Trade
    - 'Read about exchanging goods.

      Say: Nobody makes everything they need. We buy and sell, or trade. That is called trade, or commerce.

      Ask: How are goods carried from place to place? (boats, trains, trucks, airplanes today; wagons and animals in the book)'
  - - A list of jobs
    - 'The book says:

      ~ Make a list of all the occupations you can think of.

      Your child lists as many jobs as possible. Ask: Is dressmaking a job? Teaching? Which job would you like? Why?'
  - - Why different work?
    - 'Read the part about why people do different work. Ask: What work do people do where the land is rich and level? In the mountains? By the sea? In
      the city?'
  practice: 'Visit a local maker if you can: a bakery, a mill, a workshop, a factory tour.'
  tip: The last paragraph says some people have no churches, schools, books or factories, and asks how they live. You can talk about it as a question of
    how people in other places live differently, with respect for their ways.
  answers: Mills and factories turn wheat into flour, cotton into thread and cloth, leather into boots and shoes, iron and steel into plows, stoves and
    cutlery, and lumber into wagons and furniture. Cutlery means knives, forks, scissors and other cutting tools. Trade or commerce is exchanging goods,
    or buying and selling them for money. Goods are carried on boats along rivers and lakes, and where there are no rivers by railroads, wagons and pack
    animals (today also trucks and airplanes). Dressmaking and teaching are occupations. Where the land is rich and level, people farm; in the mountains
    they mine or keep cows and sheep on the hillside pastures; by the sea they fish or trade on the water; in cities they work in factories and stores.
- num: 45
  roman: XLV
  idx: 146
  unit: 10
  title: 'A review lesson: work in our own town'
  mins: 30
  goal: Your child describes the work people do in their own town, where things in the stores come from, and completes the book's fill-in sentences.
  materials:
  - A walk or drive through your town's main street or shopping area
  - A grocery receipt or a few labeled products from the pantry
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: 'The last lesson asks about the child''s own town: whether people are farmers or work in shops, mills and factories, what is made nearby, what manufactured
    things are at school and home, what is sold in grocery, dry-goods and shoe stores and where it came from, and what railroads, canals and boats carry.
    It ends with fill-in sentences about farmers, miners, quarrymen, shoemakers, blacksmiths and merchants.'
  steps:
  - - Our town
    - 'Ask the book''s questions about where you live: What kind of work do people here do? Are they farmers? Do they work in shops, mills, offices or factories?
      Name a factory or business near us. What is made there?'
  - - Manufactured things at home
    - 'Ask: What manufactured things are in our home? (almost everything) Walk around one room and name five, and what each is made from.'
  - - Store visit
    - 'Visit a grocery store or look at pantry labels. Ask: Where did these things come from? Which were made or grown near us? Which came from far away?
      Find one from another country.'
  - - Transport
    - 'Ask: What railroads, highways, ports or airports are near us? What do the trucks or trains take away from our town? What do they bring in?'
  - - Fill in the sentences
    - 'Your child copies and completes the book''s sentences:

      ~ Farmers raise (write the names of all the things you can think of).

      ~ Miners dig out of the earth.

      ~ A shoemaker makes

      Also: Quarrymen dig from the quarries ... A blacksmith makes ... Merchants buy and sell ...'
  - - Look back
    - 'Page through the geography notebook together: the compass rose, the room plan, the water cycle, the sand-tray photos, the lists. Ask your child which
      lesson they liked best and why.'
  practice: Draw a map of your town's main street, showing the stores and what each one sells.
  answers: 'Model fill-ins: Farmers raise wheat, corn, oats, vegetables, fruit, cotton, cows, sheep, pigs and chickens. Miners dig coal, iron, copper, gold,
    silver, lead and salt out of the earth. Quarrymen dig granite, marble, limestone, sandstone and slate from the quarries. A shoemaker makes boots and
    shoes. A blacksmith makes horseshoes, nails, chains and tools, and shoes horses. Merchants buy and sell food, clothing, shoes and many other goods.
    A grocery store sells food; a dry-goods store sells cloth, thread and clothing; a shoe store sells shoes. A farmer makes his living by selling what
    he raises in town and buys sugar, tea and other things at the stores there. Questions about your own town will have your own answers.'
