    little or no rain falls is a desert. An oasis is a fertile spot in a desert, with water, grass and palm trees. Fertile land grows plants well; barren
    land grows little; a desert is land too dry to grow much. Travelers use camels because a camel can go a long time without drinking and can carry a heavy
    load a long way; horses need much more water.
