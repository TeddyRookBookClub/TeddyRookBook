  - Colored pencils
  - A geography notebook (any notebook kept just for these lessons) and a pencil
  book: The lesson asks about nearby brooks and rivers, then explains that rain on mountains runs off or sinks in and comes out again as a spring, the beginning
    of a river. From the spring flows a rill, rills join to make a brook or creek, and brooks join to make a river that flows to the ocean. Source, mouth,
    bed and banks are defined. Questions about a river near home, a picture to draw, and sentences to copy.
  steps:
  - - Our own stream
    - 'Ask the book''s first questions: Have you ever seen a brook or creek? A river? Is there one near here? Where does it begin? Where does its water
      come from? Where does it go?'
  - - Rain on the mountain
    - 'Read about rain falling on mountains. Pile damp sand into a mountain in the tray, then gently "rain" on it with a watering can.

      Say: Some water runs down the slopes. Some sinks into the ground.

      ~ The spring is the beginning of a river.'
  - - Rill, brook, river
    - Read about the rill, the brook and the river. Look at the book's picture of a river from its source to its mouth. Watch the little streams in the
      sand tray join into bigger ones.
  - - New words
    - 'Go through the words, pointing to each in the sand tray: source (where it begins), mouth (where it flows into other water), bed (the land it flows
      over), banks (its two sides). As you face downstream, the right bank is on your right hand.'
  - - Visit a stream
    - 'With an adult, walk to a nearby brook, creek or river. Ask the book''s questions there: Which way does it flow? Why that way? Does it wind about?
      Does it flow into another river? What grows on its banks? Which bank are we on?

      Safety: an adult stays right beside children near water, and nobody wades in fast or deep water.'
  - - Draw
    - 'The book says:

