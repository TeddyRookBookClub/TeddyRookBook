    - 'Read the poem with two voices: you are the child asking, your child reads (or repeats) the river''s answers.

      ~ "Oh, tell me, pretty river,

      ~ Whence do thy waters flow?'
  - - Old words
    - 'Explain: "whence" means "from where," "whither" means "to where," and "o''er-curtained" means covered over. A rill is a tiny stream; a madcap is
      a wild, playful one.'
  - - The river's life
    - 'Read the river''s answer.

      ~ My birthplace was the mountain,

      ~ My nurse the April showers;

      Ask the book''s questions: Are rivers born? What is meant by "My nurse the April showers"? What does "I flirted with the flowers" mean?'
  - - The last verse
    - 'Read the last verse. Ask: Where does the river''s journey end? Why does it say "my grave"?'
  - - A river near us
    - 'Ask: Where have you seen a river like the one in the poem? Your child writes one sentence about it.'
