- roman: Ch. XXI
  idx: 228
  unit: 3
  title: The age of man
  mins: 30
  goal: Your child can explain the Stone, Bronze and Iron Ages, and why the book is careful about bones found together in caves.
  materials:
  - The book, open to this chapter
  - A stone, something made of bronze or brass (an old key, a coin or a bell), and something of iron or steel (a nail)
  - A notebook for a "rock journal" and a pencil
  book: Chapter XXI comes to the remains of people at the top of the rock layers. It warns that rough flint tools are easily confused with naturally chipped
    stones, explains the Stone, Bronze and Iron Ages and that they came at different times in different lands, and describes human bones found alongside
    extinct animals in caves. It mentions the dodo as an animal that died out within history.
  steps:
  - - A question to start
    - 'Say: If you had no metal at all, what would you make a knife or an axe from?'
  - - Read the chapter together
    - 'Read Chapter XXI (pages 195 to 202).

      Note for you: on pages 196 and 197 the book uses 1880s words and attitudes about some peoples of the Pacific islands and Africa. You may skip that
      paragraph or talk about how people wrote then.'
  - - Be careful with tools
    - '~ The roughest and earliest flint tools of human workmanship approach so closely to the roughly chipped flints of Nature''s workmanship, which exist
      by tens of thousands, that the one may often be mistaken for the other ;

      Ask: How might you tell a stone chipped by a person from one chipped by nature? (Look for many careful chips, a useful shape, many alike in one place.)'
  - - Three ages
    - '~ the life of Man upon earth has been by common consent divided into three ages — The Stone-Age, the Bronze-Age, and the Iron-Age.

      Lay out your three objects in order: stone, bronze, iron. Explain: bronze is a mixture of copper and tin, softer and easier to melt than iron; iron
      needs a much hotter fire.'
  - - Not everywhere at once
    - '~ It must not be supposed that at any one time a Stone-Age was over all the earth,

      Ask: Why might one land reach the Iron Age long before another?'
  - - History and before
    - The book compares going back in English history to walking from daylight into twilight and then night, where written records stop and geology must
      take over. Ask your child to retell this picture.
  - - Tell it back
    - 'Ask: Why might bones of people and bones of extinct animals end up together in a cave without having lived at the same time? (A flood may have washed
      them in and mixed them up.)'
  - - What we know now
    - 'Modern humans appeared in Africa about 300,000 years ago, and stone tools made by earlier human relatives are much older still. People did live alongside
      mammoths, woolly rhinoceroses and cave bears: cave paintings in France show mammoths, drawn by people who saw them. The dodo, which the book mentions,
      died out in the late 1600s.'
  practice: 'Notice it this week: look for things in your home made of stone, of bronze or brass, and of iron or steel. Which is most common?'
  answers: A floodwater may have washed bones in from outside and mixed them, so finding them together does not prove they lived at the same time. Different
    peoples found out how to work metals at different times, so one land could be in its Iron Age while another was still in its Stone Age.
  num: 23
- roman: Ch. XXII, part 1
  idx: 236
  unit: 3
  title: The two records
  mins: 25
  goal: Your child can tell back the author's view of how the Bible record and the rock record relate, in her own terms.
  materials:
  - The book, open to this chapter
  - Paper and pencil for copywork
  book: The first part of Chapter XXII (pages 203 to 208) is Giberne's discussion of the first chapter of Genesis and the rock record. She says the two
    cannot truly disagree because they come from the same Author, lists several ways readers have tried to explain how they fit, and advises holding these
    ideas freely and waiting for fuller knowledge.
  steps:
  - - About this chapter
    - Like Chapter IX, this is the author's own view as a Christian. Read it as written; this guide does not add comment either way, so families can discuss
      it in their own way.
  - - Read together
    - 'Read pages 203 to 208, up to the paragraph that begins "A more easy task lies before us". She opens:

      ~ This is not, indeed, a religious work, but no volume on the subject of Geology can be fairly and honestly written without frequent reference to
      the Divine Architect of the great Earth-crust Building.'
  - - Her main points
    - 'Help your child list them:

      1. She believes the story in Genesis and the story in the rocks come from the same Author, so they cannot really be at odds.

      2. If a discovery shows that a common reading of some Bible words is wrong, she says that reading may be given up.

      3. She warns against accepting new theories too quickly.

      4. She lists several ideas people had suggested, such as the "Days" meaning long periods.

      5. She advises waiting for fuller knowledge.'
  - - Her "we do not know" list
    - 'Find the paragraphs that begin "We do not know". Count how many there are, and read one aloud, for example:

      ~ We do not know how far his language is literal and how far it is figurative.'
  - - Tell it back
    - Ask your child to explain the author's view in their own words, beginning "Giberne thinks that...".
  - - Copywork
    - Your child copies one sentence from the chapter that sums up her advice, for example the one that begins "We shall be wise to hold our thoughts free".
      Talk about what it means.
  answers: 'Model narration: Giberne thinks that the Bible and the rocks both come from God, so they cannot really disagree; that people''s readings of
    either can be mistaken; that new theories should be accepted carefully; and that we should wait patiently for fuller knowledge.'
