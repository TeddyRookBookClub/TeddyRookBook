- roman: Ch. XXX, part 1
  idx: 334
  unit: 5
  title: 'Coral: polyps, reefs and atolls'
  mins: 30
  goal: Your child can explain how coral polyps build reefs, why a coral island rises above the water, and what an atoll is.
  materials:
  - The book, open to this chapter
  - A piece of coral or a sea-shell, and some sand
  - White vinegar
  - Strips of paper and tape (or dandelion stalks in season)
  - A globe, atlas or free online map
  - A notebook for a "rock journal" and a pencil
  book: The first part of Chapter XXX (pages 291 to 298) describes the soft coral polyp and its hard lime skeleton, explains that reef-building corals live
    only from low tide down to about 120 feet, and shows how waves heap broken coral into islands, which plants, insects and birds then reach. It describes
    the ring-shaped atoll with its lagoon, and the Maldive Islands, made of atolls of atolls.
  steps:
  - - A question to start
    - 'Say: Can tiny soft animals, too small to see well, build an island?'
  - - Read together
    - 'Read pages 291 to 298, up to the paragraph that begins "In addition to atolls". Look at the picture of the coral island. Stop on:

      ~ An Atoll is simply a ring of land — or rather of coral — surrounded by the deep ocean, with a lake or '' lagoon '' of shallow salt water in the
      middle.'
  - - Polyp and skeleton
    - 'In plain words: the coral polyp is a soft, jelly-like animal that takes lime from the sea water and builds a hard skeleton under and around itself.
      If you have coral, look at its tiny holes with a magnifying glass: each held a polyp.'
  - - The polyps stop, the waves go on
    - 'Polyps cannot live above water, so they build only up to low tide. Then the waves take over, breaking off coral and heaping it up into an island,
      and grinding it into white sand.

      ~ Our yellow sand is flinty in nature, but the sand of a coral-island is made chiefly of lime.

      Test your sand and a shell with vinegar. Which fizzes? (Lime fizzes; most yellow sand does not.)'
  - - Life arrives
    - Read the paragraph about how seeds, tree-trunks with insects and lizards, and birds come to a new coral island. Ask your child to list them in order.
  - - Atolls of atolls
    - 'The book explains the Maldives with a picture:

      ~ A child''s chain of dandelion stalks would best illustrate this.

      Make small paper rings, link them into a chain, and join the chain into one big ring. Each small ring is an atoll with its own lagoon; the big ring
      encloses a great lagoon. Find the Maldives in the Indian Ocean on a map.'
  - - Tell it back
    - Ask your child to tell the life story of a coral island, from the first polyps to the first coconut tree.
  - - What we know now
    - Reef-building corals have tiny algae living inside them that need sunlight to make food for the coral. That is why reef corals grow only in shallow,
      clear, sunny water, just the depths the book gives.
  practice: 'Notice it this week: test any sand you can find (sandbox, beach, aquarium gravel) with vinegar. Is it flint sand or lime sand?'
  answers: The polyps build their lime skeletons up to low-tide level; the waves then break off coral and pile it higher, and grind it to sand; seeds, insects,
    lizards and birds arrive, and plants grow. An atoll is a ring of coral land around a shallow lagoon, with deep ocean outside.
  num: 34
- roman: Ch. XXX, part 2
  idx: 343
  unit: 5
  title: 'Coral: barrier reefs and the sinking sea floor'
  mins: 30
  goal: Your child can explain fringing reefs, barrier reefs and atolls, and how a slowly sinking island could turn one into the next.
  materials:
  - The book, open to this chapter
  - A bowl, a lump of modeling clay for the island, and a strip of a different-colored clay for the reef
  - A pitcher of water
  - Paper and pencils
  - A notebook for a "rock journal" and a pencil
  book: The second part of Chapter XXX (pages 298 to 304) describes fringing reefs close to shore and barrier reefs farther out, including the great reef
    off Australia, with coral reaching thousands of feet deep. It explains the theory of a slowly sinking Pacific sea floor, which turns a fringing reef
    into a barrier reef and then an atoll, and discusses how fast coral grows.
  steps:
  - - A question to start
    - 'Say: Reef corals can only live in shallow water. So how can coral rock go down thousands of feet?

      That is the puzzle of this lesson.'
  - - Read together
    - 'Read pages 298 to 304, to the end of the chapter. Stop on:

      ~ All islands in mid-ocean are in reality hill-tops or mountain-summits.'
  - - Three kinds of reef
    - 'Fringing reef: joined to the shore. Barrier reef: farther out, with a channel of water between it and the land. Atoll: a ring with no island left
      in the middle. Draw all three as seen from above.'
  - - Sink the island
    - 'Make a clay mountain in the bowl, with its top poking up as an island. Press a thin ring of the other clay around its shore: a fringing reef.

      Now pour in a little water: the "island sinks". Build the reef ring a little higher, so it stays at the surface. Pour again, build again. Soon the
      reef stands apart from the shrinking island (barrier reef), and at last the island is under water and only the ring is left: an atoll.'
  - - Slow and fast coral
    - 'Read the two examples: a ship''s anchor only thinly crusted after fifty years, and an islet in the Maldives covered by new reef within a few years.
      The book also says coral grew three feet in six months in an experiment in Madagascar. Ask: What does this tell us about measuring how old a reef
      is?'
  - - Tell it back
    - Ask your child to explain the sinking-island theory using the clay model, and why it solves the puzzle of deep coral.
  - - What we know now
    - This theory, which the book does not name, was first put forward by Charles Darwin. It was proved in 1952, when drillers on Enewetak Atoll in the
      Pacific bored down through more than 4,000 feet of coral rock before reaching the old volcano underneath. The sea floor sinks because old ocean crust
      cools and settles as it moves away from where it was formed. The Great Barrier Reef off Australia stretches about 1,400 miles.
  practice: 'Notice it this week: look at a satellite map of the Pacific with an adult and find a ring-shaped atoll.'
  answers: The island slowly sank while the polyps kept building upward to stay near the surface; the dead coral below became limestone, so coral rock now
    reaches thousands of feet down though living reef coral grows only in shallow water. Growth speed varies so much (an anchor barely crusted in fifty
    years, three feet in six months elsewhere) that a reef's thickness cannot tell its age.
  num: 35
- roman: Ch. XXXI
  idx: 350
  unit: 5
  title: Stalactite, and the end of the book
  mins: 35
  goal: Your child can explain how stalactites and stalagmites form, why their growth cannot be used as a clock, and sum up what the book has taught.
  materials:
  - The book, open to this chapter
  - Two jars, a saucer and a piece of thick wool yarn about 18 inches long
  - Epsom salts or baking soda, and warm tap water
  - Your rock box and rock journal
  book: Chapter XXXI touches on peat bogs and landslips (such as the Rossberg slide of 1806), then describes limestone caves dug out by water, with stalactites
    hanging from the roof and stalagmite covering the floor. It shows by examples that stalagmite grows at very different speeds, so it cannot tell us exactly
    how long bones under it have lain there, and ends the book with the author's closing words.
  steps:
  - - A question to start
    - 'Say: In some caves, stone icicles hang from the roof. How could stone drip?'
  - - Read the chapter together
    - 'Read Chapter XXXI (pages 305 to 315). Look at the picture of the stalactite cavern. Two definitions:

      ~ The downward hanging forms are called Stalactites, and very beautiful they often are.

      ~ The same description of lime-formation, left by trickling water, often covers the whole cavern-floor, and it is then called Stalagmite.

      A memory hook: stalaCtites hang from the Ceiling, stalaGmites rise from the Ground.'
  - - Grow a stalactite
    - 'Stir as much Epsom salt as will dissolve into two jars of warm tap water. Set them a few inches apart with the saucer between. Dip the yarn in, then
      lay one end in each jar so it sags over the saucer.

      Over a week, the liquid creeps along the yarn, drips from the low point and leaves crystals behind: a small stalactite above and a stalagmite on the
      saucer. Check it each day.'
  - - How caves are made
    - 'In plain words: water with a little acid in it slowly dissolves limestone, digging out caves. Later, water dripping through the roof carries dissolved
      lime and leaves it behind as it drips. That is the same lime that fizzed in our vinegar tests.'
  - - Not a reliable clock
    - 'Read:

      ~ An iron nail was left in a forsaken lead-mine, where it caught a stalactite drip. In seventy-five years a quarter of an inch was formed upon it.

      Compare: the book says a gas-pipe near Buxton got an eighth of an inch in just six months. Ask: If growth can be that different, can we tell how long
      a bone has lain under the stalagmite floor just by measuring it?'
  - - The author's last words
    - 'Read the closing paragraphs aloud. Her summary of geology:

      ~ We are but spelling out the broken sentences of the rock-volume, written, as it is, in a strange language, with many missing paragraphs. What marvel
      if we make some mistakes ?

      Ask your child to connect this to the torn-up book from Lesson 1.'
  - - Look back over the whole book
    - 'Lay out the rock box and rock journal. Ask your child to give a short talk to the family: the three parts of the book, three kinds of rock, two ways
      fossils are made, and one thing that has changed since 1881.'
  - - What we know now
    - Scientists can now date many cave formations directly, by measuring tiny amounts of uranium in the stone, which slowly changes into another element
      at a known rate. So stalagmites, which Giberne rightly warned were unreliable clocks by their thickness alone, have become one of the best records
      of past climates.
  practice: 'Keep the stalactite jars going for a week and draw them each day. Finish your rock collection with a label for every rock: its name or best
    guess, where it was found, and what the vinegar and scratch tests showed.'
  tip: If you can, visit a show cave on a guided tour. Never go into a wild cave or old mine without trained adults.
  answers: Water carrying dissolved lime drips from the cave roof and leaves a little lime behind each time, building stalactites downward and stalagmite
    on the floor. Because the speed varies so much (a quarter inch in seventy-five years on the nail, an eighth of an inch in six months on the gas-pipe),
    the thickness cannot tell us exactly how long a bone has lain there.
  num: 36
