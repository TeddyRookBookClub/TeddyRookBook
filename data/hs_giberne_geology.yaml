- roman: Ch. XIX
  idx: 204
  unit: 3
  title: More about the age of mammals
  mins: 30
  goal: Your child can explain what makes a mammal, and describe the animals and plants the book says lived in Europe and America in the New-Life Period.
  materials:
  - The book, open to this chapter
  - A globe, atlas or free online map
  - Paper and colored pencils
  - A notebook for a "rock journal" and a pencil
  book: 'Chapter XIX describes the warm New-Life world: fig, cinnamon and palms near London, parrots and flamingoes in France, tapir-like beasts, a whale-like
    animal in American seas, early horses as small as a fox with toes, and forests in Greenland and Spitzbergen. Near its end the climate grows colder.'
  steps:
  - - A question to start
    - 'Say: Coconuts near London? Forests of oak and walnut in Greenland? What would that tell you about the climate long ago?'
  - - Read the chapter together
    - 'Read Chapter XIX (pages 175 to 182). The book''s definition of mammals:

      ~ They have a back-bone and skeleton ; so have fishes. They breathe air; so do reptiles. They are warm-blooded ; so are birds. They suckle their young
      ; and so do not any other living creatures.'
  - - How do we know?
    - 'Giberne explains that we know these plants grew there because their fossil leaves, fruits and seeds are found, some very finely kept:

      ~ A fossil butterfly was found in Croatia, the very pattern of the wing being exactly depicted on the stone.'
  - - A warm map
    - 'Find on a map: the Isle of Wight and London (figs, cinnamon, coconut), France (parrots and flamingoes), Greenland and Spitzbergen (oaks, beeches,
      walnuts). Ask: Which of these places would be too cold for such plants now?'
  - - The little horse
    - 'Read:

      ~ Also, there were horses, somewhat like those of modern days, only one kind was as small as a fox ;

      The book says early horses had toes instead of one hoof. Draw a fox-sized horse with toes. Then: a modern horse stands on one big toe, its hoof. Can
      your child stand on tiptoe to feel what that is like?'
  - - Whales are mammals
    - 'The book explains that whales and porpoises are mammals, not fishes: warm-blooded, air-breathing, feeding their young on milk. It describes a huge
      ancient whale-like animal in American seas. Quiz: whale, shark, dolphin, seal: mammal or fish?'
  - - Tell it back
    - Ask your child to describe a walk through England or France in the middle of the New-Life Period, naming five plants or animals from the chapter.
  - - What we know now
    - The book's Zeuglodon is now called Basilosaurus and is known to be an early whale. Early horses, like the one the book describes, were small, with
      several toes on each foot; over millions of years horses grew larger and came to stand on a single hoofed toe. The early part of this time was very
      warm, and fossil forests have even been found far north in the Arctic.
  practice: 'Notice it this week: check five animals you see (a dog, a bird, a fish, a spider, a person) against the book''s four marks of a mammal.'
  answers: A mammal has a backbone and skeleton, breathes air, is warm-blooded, and feeds its young on milk. Whales, dolphins and seals are mammals; sharks
    are fishes.
  num: 21
- roman: Ch. XX
  idx: 212
  unit: 3
  title: The age of ice
  mins: 35
  goal: Your child can describe the great Ice Age as the book tells it, explain river terraces, and describe the frozen mammoth.
  materials:
  - The book, open to this chapter
  - A bowl of ice water
  - A plastic bag and a wool sock or mitten
  - Paper and pencils
  - A notebook for a "rock journal" and a pencil
  book: 'Chapter XX describes the Post-Tertiary Age and the great Ice Age, when glaciers seem to have covered Canada, much of the United States, Scotland,
    Switzerland and parts of France and England. It discusses why elephants and rhinoceroses lived in cold England, the floods and river terraces that followed,
    and the huge beasts of the time: the mammoth found frozen in Siberia, the woolly rhinoceros, the mastodon and the giant sloth.'
  steps:
  - - A question to start
    - 'Say: Elephants live in hot countries. Why would elephant bones be found in England, Siberia and North America?'
  - - Read the chapter together
    - 'Read Chapter XX (pages 183 to 194). It begins with a good idea: the nearer the time, the harder it is to tell its story, because there are more details.

      ~ If you are looking at some object in the far distance, its outline is simple.'
  - - The Ice Age
    - 'Help your child sum up: after a long warm time, an age of intense cold came; glaciers covered huge areas; the signs are the till, scratched rocks
      and erratic blocks from Chapter VIII. The book says no one knew how long ago or why.'
  - - The woolly coat test
    - 'The book suggests the great beasts had warm coats. Test it: your child puts one bare hand in the ice water for a few seconds and takes it out. Then
      they put the other hand in the plastic bag, pull the wool sock over it, and dip it in. Which hand stays warm? (Keep both dips short, under 30 seconds.)

      Read:

      ~ It was covered with thick black bristles, about fourteen inches long, with thick hair four inches long, and with wool about one inch long.'
  - - The frozen mammoth
    - '~ A whole frozen mammoth was found in Siberia — a rare geological specimen !

      The book says it was nine feet high and sixteen feet long, without the tusks. Measure nine feet up a wall (or two adults'' heights) to see.'
  - - River terraces
    - '~ The highest terrace or shelf is the oldest level, the next lower the next oldest, and so on.

      Draw a river valley with three steps on each bank and number them oldest to newest. Ask why the highest step is the oldest. (The river has been cutting
      down, so it ran highest long ago.)'
  - - Tell it back
    - Ask your child to describe England after the Ice Age as the book does, naming at least five of its animals.
  - - What we know now
    - There were many cold spells, not one. The last great ice sheets were at their largest about 20,000 years ago, when ice up to two miles thick covered
      most of Canada; by about 7,000 years ago nearly all of it had melted. Huge floods did follow in some places; the land in eastern Washington State
      was carved by enormous floods when an ice dam broke. Woolly mammoths were about the size of today's African elephants, and the last of them lived
      on an island off Siberia until about 4,000 years ago. The giant sloth (Megatherium) was a ground sloth as big as an elephant.
  practice: 'Notice it this week: look at any river or stream bank for steps or old flat shelves above the water.'
  answers: 'The book gives three ideas: they wandered from warmer places, they migrated with the seasons (which it thinks unlikely), or they had warm woolly
    coats, as the frozen mammoth shows. The highest terrace is the oldest because the river has slowly cut its way down, leaving its old levels behind as
    shelves.'
