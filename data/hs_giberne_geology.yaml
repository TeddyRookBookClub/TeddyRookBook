  steps:
  - - A question to start
    - 'Say: Why do some volcanoes explode while others just pour out rivers of lava?'
  - - Read together
    - 'Read pages 264 to 269, to the end of the chapter. Stop on:

      ~ The first known eruption was the famous one of 79, wherein the towns of Herculaneum and Pompeii were buried beneath showers of ashes.'
  - - Thick and runny
    - 'Put a spoonful of honey at the top of a tilted plate and a spoonful of water beside it. The water races down and spreads far; the honey piles up
      and creeps.

      Say: Hawaii''s lava is runny like the water, so it flows out in long rivers. Vesuvius throws out much solid stuff, cinders, stones and ash, so it
      builds a steep cone and can explode.'
  - - The lava-lake
    - 'Read:

      ~ You have seen the bubbles which break out upon the surface of water boiling in a pot.

      The book says Kilauea''s lava-lake was a thousand feet across with fire-fountains thirty or forty feet high. If you are cooking a thick porridge or
      soup, watch the bubbles burst from a safe distance; this is an adult''s job, as hot porridge spits.'
  - - Building an island
    - 'Read the traveler''s words the author quotes:

      ~ We see a clothed and finished earth ; they see the building of an island, layer on layer, hill on hill,

      Ask: What does she mean, that in Hawaii you can watch new land being made?'
  - - Find them
    - On a map, find Naples, Vesuvius and Pompeii in Italy, and the Hawaiian Islands (the book calls them the Sandwich Islands) in the middle of the Pacific.
  - - Tell it back
    - Ask your child to compare the two kinds of volcano in a few sentences, using the honey and water.
  - - What we know now
    - The Hawaiian volcanoes sit over a "hot spot" deep beneath the Pacific plate. As the plate slides slowly northwest, new volcanoes form over the hot
      spot and older islands are carried away and worn down, which is why the islands form a chain. The book's Mount Loa and Mount Kea are now written Mauna
      Loa and Mauna Kea. Vesuvius last erupted in 1944.
  practice: 'Notice it this week: look at photos of Pompeii with an adult, and of a Hawaiian lava flow. Which looks like "honey" and which like "water"?'
  tip: 'Watch only, don''t try: never heat thick liquids to make them bubble as a "lava" experiment; boiling syrup and porridge cause bad burns. Look up
    a video of Kilauea''s lava lake filmed by scientists instead.'
  answers: Vesuvius throws out a great deal of solid material (stones, cinders, ash) and can explode, building a steep cone; Hawaii's volcanoes hold very
    runny lava that pours out through the crater rim or cracks in the side and flows far over the land.
