book:
  id: worldsfoundation00giberich
  title: The World's Foundations; or, Geology for Beginners
  year: '1883'
  key: worlds-foundations
  short: The World's Foundations
  eyebrow: Science · Geology · 1883
  hero: 'Agnes Giberne''s friendly first book of geology, for children about 10 to 13: rocks and fossils, the long story written in the earth''s layers,
    and rivers, glaciers, volcanoes, coral and caves at work today. 36 guides cover the whole book, each with a safe hands-on activity and the right page
    of the book beside it.'
  how:
  - <b>One chapter, one session.</b> Most guides cover one chapter in 25 to 40 minutes; a few long chapters are split in two. Once or twice a week covers
    the book in a school year.
  - <b>Read, do, tell back.</b> Read the chapter aloud together, do the activity, then let your child tell it back in their own words. The guides give prompts
    and short model answers.
  - <b>Start a rock box.</b> An egg carton, a notebook "rock journal", a magnifying glass, vinegar, a coin and a steel nail are used again and again. Collect
    only where it is allowed, and keep away from cliff edges and the foot of cliffs.
  - <b>Then and now.</b> Giberne wrote in 1881, before anyone knew the continents move or could measure the age of rocks. Short "What we know now" notes
    give today's view where her account differs.
  - '<b>The author''s faith.</b> Giberne writes as a Christian: each chapter opens with a Bible verse, and Chapters IX and XXII discuss geology and the
    Bible. The guides present her words as she wrote them, without adding comment either way.'
  - <b>Safety first.</b> Every activity is meant for a child with an adult nearby. Where the book describes something dangerous (geysers, lava, wild caves),
    the guide says to watch a video instead.
  unitword: Unit
  lessonword: ''
  numnote: The book is divided into 31 chapters in three Parts. Each guide covers one chapter (a few long chapters are split into two parts), shown beside
    the title; guide numbers simply count the sessions in order.
units:
- id: 1
  name: 'Part I: How to read the record'
  from: 1
  to: 10
  text: What the crust is made of, how water and fire build rocks, fossils, layers, folds and faults, and the work of ice (Chapters I to IX).
- id: 2
  name: 'Part II: Ancient seas and coal forests'
  from: 11
  to: 16
  text: 'How living things are grouped, the earliest ages, and the Ancient-Life Period: lower animals, fishes and the coal forests (Chapters X to XV).'
- id: 3
  name: 'Part II: Reptiles, chalk, mammals, ice and people'
  from: 17
  to: 25
  text: The age of great reptiles and chalk, the age of mammals, the Ice Age, the first people, and the author's chapter on the two records (Chapters XVI
    to XXII).
- id: 4
  name: 'Part III: Water at work today'
  from: 26
  to: 29
  text: Rivers, rain, springs and waves, deltas and glaciers, seen as clues to the past (Chapters XXIII to XXVI).
- id: 5
  name: 'Part III: Fire, coral and caves'
  from: 30
  to: 36
  text: Volcanoes, earthquakes, hot springs and geysers, coral reefs, and limestone caves, with the author's closing words (Chapters XXVII to XXXI).
lessons:
- roman: Ch. I
  idx: 20
  unit: 1
  title: What the earth's crust is made of
  mins: 30
  goal: Your child can say what the word geology means, what the earth's crust is, and why reading the rocks is like reading a torn-up book.
  materials:
  - The book, open to this chapter
  - A ball or globe and a sheet of thin paper
  - An old magazine page or comic strip you can tear up
  - A notebook for a "rock journal" and a pencil
  - An egg carton or small box to start a rock collection
  book: Chapter I asks what the earth is made of, explains the word geology, and pictures the crust as a sheet of brown paper on a school globe. It says
    that sand, clay, pebbles and even garden soil all count as rock, defines a theory, and ends with the geologist as a reader of a chopped-up book.
  steps:
  - - A question to start
    - 'Say: If you could dig straight down under our house, what do you think you would find? How far down could you get?

      Let your child guess freely. Then explain that nobody has ever dug or drilled more than a few miles down, and that this book is about how people learn
      about the earth anyway.'
  - - Read the chapter together
    - 'Read Chapter I aloud (pages 3 to 9), or take turns by paragraph. It begins:

      ~ WHAT is the earth made of— this round earth upon which we human beings live and move ?

      Like every chapter, it opens with a Bible verse, and the author writes about God preparing the earth. Read it as she wrote it.'
  - - The word and the crust
    - 'Geology comes from two Greek words, ge (the earth) and logos (a word or teaching). It is the study of the earth''s crust, its outside layer.

      Giberne says that if the earth were a large school globe, the part geologists study would be no thicker than brown paper wrapped around it. Wrap your
      paper around the ball to see how thin that is.'
  - - What counts as rock
    - 'Read this sentence again:

      ~ The cliffs above our beaches are rock ; the sand upon our seashore is rock ; the clay used in brickmaking is rock ;

      Say: To a geologist, sand and garden soil are rock too. Can you find three kinds of "rock" around our house or yard?

      Look for gravel, sand, soil, a brick, a stone step. Put one small sample of each in the rock box.'
  - - A theory is not yet a truth
    - 'Read the author''s definition:

      ~ A ''theory'' is a possible explanation of a mystery, put forward as the best which can be offered, until something more shall be known about the
      matter.

      Ask: What is the difference between a theory and something that has been proved? Giberne comes back to this idea all through the book.'
  - - The chopped-up book
    - 'The chapter ends by comparing the rocks to a big book that has been cut up, mixed, partly crushed and partly thrown away. Try it: tear a magazine
      page or comic strip into 10 or 12 pieces, quietly hide two or three, mix the rest, and ask your child to put it back together.

      Say: What was hard? How did you work out where the missing pieces went? That is what geologists do with layers of rock.'
  - - Tell it back
    - 'Ask your child to tell you, in their own words, what this chapter said. Prompts if needed:

      What does "geology" mean?

      Why can''t we know for sure what is deep inside the earth?

      Why is a geologist like someone reading a torn-up book?'
  - - What we know now
    - 'Giberne wrote that "nobody really knows" what the inside of the earth is like, and in 1881 that was true. Today we know the earth has layers: a thin
      rocky crust (about 3 to 6 miles thick under the oceans and about 20 to 45 miles thick under the continents), a thick mantle of hot rock that is solid
      but creeps very slowly, a liquid metal outer core, and a solid metal inner core. Scientists worked this out by timing earthquake waves as they travel
      through the earth.'
  practice: Start a rock journal. This week, pick up one small stone on each walk and write where you found it and one thing you notice about it (color,
    weight, rough or smooth).
  tip: 'Rock-collecting safety: stay away from cliff edges and from the bottom of cliffs, where stones can fall. Ask before collecting on private land,
    and remember that collecting is not allowed in national parks.'
  answers: 'Geology: teaching about the earth (Greek ge, earth, and logos, word). We cannot see far inside because we can only dig or drill a little way
    down. The geologist is like a reader of a torn-up book because the rock layers are broken, mixed up and partly missing, and have to be pieced together.'
  num: 1
- roman: Ch. II
  idx: 27
  unit: 1
  title: Water-built rocks
  mins: 35
  goal: Your child can explain how running water wears land away, carries it off and drops it in layers, and why those layers are called stratified or sedimentary
    rocks.
  materials:
  - The book, open to this chapter
  - A clear jar with a lid (a pint or quart jar)
  - Garden soil with some small pebbles and sand mixed in
  - Water
  - A notebook for a "rock journal" and a pencil
  book: Chapter II divides rocks into stratified and unstratified, explains crystals (with ice as an example), and describes the sea and rivers always wearing
    land away. Using a shaken medicine bottle, it shows how mud and sand settle as sediment, and how settled sediment becomes the layered rocks under our
    feet.
  steps:
  - - A question to start
    - 'Say: When a stream turns brown after a storm, what makes it brown? Where does that mud go?

      Listen to the guess, then read to find out.'
  - - Read the chapter together
    - 'Read Chapter II (pages 10 to 19). Two sentences to stop on:

      ~ The earth-crust is a scene of perpetual change, of perpetual struggle, of perpetual building up, of perpetual wearing away.

      ~ For the land''s loss here is the ocean''s gain.'
  - - Two kinds of rock
    - 'Explain in plain words: Unstratified rocks were once melted by great heat and then cooled and hardened, forming crystals, like water freezing into
      ice. Stratified rocks were built up slowly, grain by grain, in layers ("strata"), like the pages of a book or bricks in a wall.

      Giberne even calls ice a rock. If it is cold enough this week, look at the needle-like crystals on a freezing puddle, as she suggests.'
  - - Make a sediment jar
    - 'This is the book''s own medicine-bottle idea. Fill the jar about one-third full of soil with pebbles and sand. Add water almost to the top, put the
      lid on tightly, and shake hard for a minute. Set it down and watch.

      Within seconds the pebbles drop, then the sand. Fine mud settles over the next hour, and the water may stay cloudy until tomorrow. Draw the layers
      in the rock journal now and again tomorrow.'
  - - Why the order?
    - 'Read the line the jar just showed:

      ~ The finer this sediment, the slower it is in settling.

      Then reread the part about the mountain torrent: fast water carries stones, slower water drops gravel, then sand, and only the slowest water lets
      the fine mud sink. The jar did the same thing in a minute.'
  - - New words
    - 'Detritus: worn-off bits of rock carried by water. Sediment: what settles to the bottom. Sedimentary rocks: rocks made of sediment pressed hard over
      long ages. Have your child write the three words with a one-line meaning each.'
  - - Tell it back
    - 'Ask your child to explain the sediment jar to someone else in the family, using the words stratified and sediment.

      Check questions: Why can a fast stream carry bigger stones than a slow one? What is another name for stratified rocks, and why?'
  - - What we know now
    - Geologists today call Giberne's unstratified rocks igneous rocks (from the Latin for fire) and her stratified rocks sedimentary rocks. Her account
      of how rivers sort and drop sediment is still how it is explained today.
  practice: 'Leave the jar standing for a few days and see whether a thin layer of very fine clay forms on top. Notice it this week: look at a puddle, gutter
    or stream after rain. Is the water muddy? Where has sand been dropped?'
  answers: Faster water pushes harder, so it can hold up and roll heavier stones; when it slows down it drops the heaviest things first. Stratified rocks
    are also called sedimentary rocks, because they were made from sediment that settled on the sea bottom and hardened.
  num: 2
- roman: Ch. III
  idx: 37
  unit: 1
  title: Fossils in the rocks
  mins: 40
  goal: Your child can explain what a fossil is, name three ways fossils are made, and explain why sea-shell fossils are found on mountains.
  materials:
  - The book, open to this chapter
  - Modeling clay or salt dough (two lumps)
  - A shell, leaf, or small toy with a clear shape
  - Five or six notebooks or thin books of different colors
  - A notebook for a "rock journal" and a pencil
  book: Chapter III asks how rocks made under the sea came to be on land, and answers that land has slowly sunk and risen again, as the coasts of Sweden
    and Greenland were doing. It explains fossils and three ways they form, and uses a pile of copy-books to show how tilted layers bring old rocks up to
    the surface.
  steps:
  - - A question to start
    - 'Say: Sea-shells have been found on the tops of mountains, thousands of feet high. How could they get there?

      Collect the guesses; the chapter gives Giberne''s answer.'
  - - Read the chapter together
    - 'Read Chapter III (pages 20 to 31). Giberne adds a short paragraph saying that she is not writing here about the Flood of Noah; read it as written
      and go on.

      Stop on this definition:

      ~ Fossils are the hardened remains of animals and vegetables found in rocks.'
  - - Land goes down and up
    - 'In plain words: the sea did not rise up to the mountain tops. Instead, pieces of land sank slowly under the sea, layers of mud and shells built up
      on them, and later the land rose again, carrying the shells with it. Giberne gives proof that land moves: some coasts were rising and others sinking
      in her own day.'
  - - Make your own fossils
    - 'The book names three kinds of fossil. Make two of them:

      1. Press the shell or leaf firmly into a smooth lump of clay, then lift it out. The print left behind is an impression, or "mould".

      2. Press a second lump of clay into the print and peel it off. That copy of the outside is a "cast".

      The third kind is when the shell or bone itself slowly turns to stone, like the fossil wood the book describes.'
  - - Tilted layers
    - 'Try the book''s copy-book idea. Stack the notebooks flat. Push the bottom one up at one side so the whole pile tilts, and look at the row of edges.

      Say: Which one was put down first? Is it still at the bottom? (Yes.) But now you can see its edge without digging.'
  - - The rule of layers
    - 'Read:

      ~ We might indeed feel sure, as we do now, that the lowest layers were the oldest and the top layers the newest,

      Point to the bottom notebook: oldest. Top: newest. Fossils in lower layers lived earlier than fossils in higher ones.'
  - - Tell it back
    - 'Ask your child to tell the story of one shell: how it lived in the sea, was buried in mud, became a fossil, and ended up on a mountain. Then: What
      are the three kinds of fossil? Why are there more sea fossils than land fossils?'
  - - What we know now
    - 'Land really does rise and sink, as Giberne says. We now know the biggest cause: the earth''s crust is broken into huge plates that move a few inches
      a year, and where plates push together, sea-floor rock is lifted into mountains. The top of Mount Everest is made of limestone with fossils of sea
      creatures in it. Sea level also changes all over the world at once: in the last Ice Age, when much water was locked up in ice, the sea was about 400
      feet lower than today.'
  practice: 'Let the clay mould and cast dry and label them in the rock box. Notice it this week: look for layers in a road cut, a stone wall, a quarry
    photo or a riverbank.'
  tip: If a museum near you has fossils, this is a good week to visit and look for the three kinds.
  answers: 'Three kinds of fossil: the shell or bone changed into stone; an impression (mould) pressed into soft mud; and a cast, where mud filled a shell
    and hardened. Sea animals are preserved whenever the sea floor buries them, but land animals only when they are drowned, caught in bogs or swept out
    to sea, so sea fossils are far more common.'
  num: 3
- roman: Ch. IV
  idx: 49
  unit: 1
  title: Fire-built rocks
  mins: 30
  goal: Your child can name the book's kinds of fire-made rock (volcanic, plutonic, metamorphic) and explain why rocks that cool slowly have bigger crystals.
  materials:
  - The book, open to this chapter
  - A magnifying glass
  - Any rocks you have collected
  - 'If you can: a granite countertop, gravestone or building stone to look at'
  - A notebook for a "rock journal" and a pencil
  book: 'Chapter IV describes unstratified or igneous rocks: volcanic rocks like lava, plutonic rocks like granite, and metamorphic rocks changed by heat,
    like some marble. It compares Fire and Water to two workmen rebuilding a house, lists great eruptions and earthquakes, and weighs two theories about
    the heat inside the earth.'
  steps:
  - - A question to start
    - 'Say: Some rocks were once so hot they were liquid, like melted butter. Where could rock get that hot?

      Let your child guess (volcanoes, deep underground), then read.'
  - - Read the chapter together
    - 'Read Chapter IV (pages 32 to 41). The key definitions:

      ~ Secondly — Plutonic Rocks, such as granite. These have been cooled deep down in the earth, under heavy pressure.

      ~ The word '' metamorphic '' simply means ''transformed.'''
  - - Three kinds, in plain words
    - 'Volcanic rock (like lava) cooled quickly at or near the surface. Plutonic rock (like granite) cooled slowly, deep down. Metamorphic rock was once
      a different rock, then was changed by great heat and pressure; marble was once limestone.

      Aqueous means made by water (Latin aqua); igneous means made by fire (Latin ignis).'
  - - Look closely
    - 'With the magnifying glass, look at granite if you can find some (kitchen counters, gravestones and old buildings are often granite). You will see
      separate crystals of different colors fitted together.

      Explain: granite cooled slowly underground, so its crystals had time to grow big. Lava cools fast, so its crystals are tiny or it is glassy, sometimes
      full of gas bubbles.'
  - - Sort your rocks
    - 'Spread out the rocks you have. Make three piles: "I can see crystals", "I can see layers or grains of sand", and "not sure". Don''t worry about being
      right; this is how a geologist starts. Record the piles in the rock journal.'
  - - Fire and Water
    - 'Giberne compares the two great workers to workmen rebuilding a house: Water works on the upper floors, Fire works in the cellars, and both work at
      once. Her surprising calculation: one great Chilean earthquake lifted as much land in a moment as the River Ganges carries to the sea in about four
      hundred years. Ask: Which worker is fast? Which is slow?'
  - - Tell it back
    - 'Ask your child to explain the three kinds of fire-made rock as if teaching a younger child. Then: Why does granite have bigger crystals than lava?'
  - - What we know now
    - 'Giberne describes two ideas: a melted inside under a thin crust, or a solid earth with lakes of melted rock here and there. We now know the mantle
      under the crust is solid rock, but so hot that it flows very slowly over millions of years. Melted rock (magma) forms in particular places, mostly
      where the earth''s plates are pulling apart or where one plate is sliding down beneath another.'
  practice: 'Notice it this week: look at stone used in buildings, steps, walls and countertops. Which ones show crystals? Which show layers?'
  answers: Volcanic rocks cooled at or near the surface (lava); plutonic rocks cooled deep underground under pressure (granite); metamorphic rocks were
    changed by heat (some marble). Granite cooled slowly, so its crystals had time to grow; lava cooled quickly, so its crystals are tiny.
  num: 4
- roman: Ch. V
  idx: 59
  unit: 1
  title: What rocks are made of
  mins: 40
  goal: Your child can name the three groups of water-made rock (flint, clay and lime rocks), test rocks for lime with vinegar, and do a simple scratch
    test for hardness.
  materials:
  - The book, open to this chapter
  - White vinegar and a dropper or spoon
  - A sea-shell or piece of eggshell, and if you have them a piece of limestone, marble or natural chalk
  - A few other rocks, including sand or a quartz pebble if you have one
  - 'For the scratch test: a coin and a steel nail'
  - A notebook for a "rock journal" and a pencil
  book: Chapter V explains that about half the earth's crust is oxygen and a quarter silicon. It describes flint (quartz) rocks, clay rocks and lime rocks,
    how chalk is built from tiny shells, how coral makes limestone, the tiny flint-shelled diatoms, and how coal comes from buried forests.
  steps:
  - - A question to start
    - 'Say: The air we breathe has a gas called oxygen in it. Would you believe that about half of solid rock is made of oxygen too?

      That is the surprise this chapter opens with.'
  - - Read the chapter together
    - 'Read Chapter V (pages 42 to 52). Two numbers to stop on:

      ~ Yet one cubic inch of chalk is calculated to hold the remains of more than one million rhizopods.

      Show a cubic inch with your fingers. Then read the coal passage:

      ~ Coal is a vegetable substance. The wide coal-fields of Britain and other lands are the fossil remains of vast forests.'
  - - Three families of rock
    - 'Flint rocks are made mostly of quartz (silicon joined to oxygen): flint, sandstone, beach sand, agate and amethyst. Clay rocks are made mostly of
      alumina. Lime rocks (limestone and chalk) are made of carbonate of lime, very often from shells, coral and tiny sea creatures.'
  - - The fizz test
    - 'Put a few drops of vinegar on the shell or eggshell. Watch closely: tiny bubbles mean lime. Try the limestone, marble or chalk if you have them,
      then a quartz pebble or sand.

      Lime rocks fizz; flint rocks do not. Record each result in the rock journal. (Keep vinegar away from eyes, and rinse the rocks afterward.)'
  - - The scratch test
    - 'Hardness is another clue. Try to scratch each rock: first with a fingernail, then a coin, then the steel nail. Lime rocks are soft enough to scratch
      with the nail. Quartz and flint are so hard they scratch steel instead.

      Safety: lay the rock flat on a table, hold it by the edges, and scratch away from your body, with an adult nearby. Rub the mark with a wet finger
      to check it is a real scratch, not a streak of metal.'
  - - Tiny builders
    - 'Talk about the book''s tiny creatures: rhizopods with shells of lime (the chalk-makers), coral polyps (limestone-makers) and diatoms with shields
      of flint. Giberne says the white cliffs of England were built up from their shells on the sea floor and then lifted up.'
  - - Tell it back
    - 'Ask: What are the three families of water-made rock? How did the fizz test tell them apart? Where did coal come from, according to the book?'
  - - What we know now
    - 'Giberne''s numbers hold up well: today''s figures say oxygen is about 46 percent and silicon about 28 percent of the crust by weight. Her rhizopods
      (foraminifera) are now counted as single-celled living things rather than animals, and diatoms as tiny algae. Coal is still understood as the remains
      of ancient swamp forests.'
  practice: Test every rock in your collection with vinegar and the scratch test, and label each "fizzes / doesn't fizz" and "nail scratches it / it scratches
    the nail".
  tip: Modern sidewalk chalk is often made of a different mineral and may not fizz. A sea-shell or eggshell always works.
  answers: Flint (silicious) rocks, clay (argillaceous) rocks, and lime (calcareous) rocks. Lime rocks fizz with vinegar; flint rocks do not. Coal, says
    the book, is the remains of ancient forests that grew in bogs and swamps, were buried under sand and mud, and slowly hardened.
  num: 5
- roman: Ch. VI
  idx: 70
  unit: 1
  title: Rock-layers
  mins: 35
  goal: Your child can explain how fossils help geologists match rock layers in different countries, and can read the book's table of strata from oldest
    to newest.
  materials:
  - The book, open to this chapter
  - About 12 index cards or paper strips in four colors
  - Colored pencils
  - A notebook for a "rock journal" and a pencil
  book: Chapter VI warns that geology must be read with a "perhaps". It explains that rock layers always follow the same order, that fossils change as you
    go down through the layers, and that the same fossils in England and America show rocks of the same age. It ends with the book's Table of Strata.
  steps:
  - - A question to start
    - 'Say: A cliff in England is made of sandstone, and a cliff in America is made of limestone. How could anyone tell whether they were made at the same
      time?

      Keep the question in mind while reading.'
  - - Read the chapter together
    - 'Read Chapter VI (pages 53 to 60). Two sentences to stop on:

      ~ It is very needful, therefore, to hold the conclusions of geologists with a light grasp, guarding each with a " perhaps " or a " may-be."

      ~ Descend through layer after layer till we come to rocks built in earliest ages, and not one fossil shall we find precisely the same as one animal
      living now.'
  - - Fossils tell the time
    - 'In plain words: the deeper the layer, the stranger the fossils. Certain fossils are found only in certain layers, all over the world. So if two rocks
      hold the very same kinds of fossils, they were probably made in the same age, even if the rocks themselves are different.'
  - - Match two cliffs
    - 'Make two "cliffs" of four cards each. On each card in the first cliff write a rock name (sand, clay, lime, coal) and draw a simple fossil (a snail,
      a fish, a fern, a three-lobed bug). Make the second cliff with different rock names but the same four fossils in the same order.

      Shuffle each pile, then ask your child to stack both cliffs and line up layers of the same age by their fossils.'
  - - Read the table
    - 'Turn to the Table of Strata at the end of the chapter. It has three great divisions:

      ~ PRIMARY, OR PALEOZOIC, OR ANCIENT-LIFE ROCKS.

      ~ SECONDARY, OR MESOZOIC, OR MIDDLE-LIFE ROCKS.

      ~ TERTIARY, OR CAINOZOIC, OR NEW-LIFE ROCKS.

      Read the names under each from the bottom (oldest) up. The book says to look back at this list often in Part II.'
  - - The order never flips
    - 'Read:

      ~ The Devonian may be absent, but if present, you will never find it under the Silurian, or above the Carboniferous.

      Ask: Could a layer be missing? (Yes.) Could the order be swapped? (Not in the usual way of things.)'
  - - A memory hook
    - 'Have your child make up a silly sentence to remember the book''s order: Cambrian, Silurian, Devonian, Carboniferous, Permian, Triassic, Jurassic,
      Cretaceous. Write it in the rock journal.'
  - - What we know now
    - 'Fossils are still used exactly this way to match rocks. Today''s list has one more period, the Ordovician, between the Cambrian and the Silurian
      (it was named in 1879, and the book does not use it). Giberne''s Laurentian rocks are now part of the Precambrian, which covers most of the earth''s
      history. Geologists can now also put dates on the table: the Cambrian began about 539 million years ago.'
  practice: Say the order of the ages each day this week until it comes easily. Copy the Table of Strata into the rock journal as a tall column, oldest
    at the bottom.
  answers: Two rocks with the same kinds of fossils, different from the layers above and below, probably belong to the same age. The oldest layers lie lowest;
    the order of the layers is the same everywhere, though some layers may be missing.
  num: 6
- roman: Ch. VII
  idx: 78
  unit: 1
  title: Rock-bendings
  mins: 30
  goal: Your child can explain the difference between a layer, a stratum and a formation, and show with cloth or paper how rock layers fold and slip into
    faults.
  materials:
  - The book, open to this chapter
  - Colored paper (three or four colors, a few sheets of each)
  - Three or four bath towels or pieces of cloth, different colors if possible
  - Modeling clay in two or three colors and a butter knife (optional)
  - A notebook for a "rock journal" and a pencil
  book: Chapter VII says the stratified rocks, if all piled up at their thickest, would be about twenty miles deep, and that the record is a chain with
    many missing links. It explains layer, stratum and formation with a pile of colored paper, describes bent, crumpled and folded rocks, and ends with
    faults that make coal-seams suddenly stop.
  steps:
  - - A question to start
    - 'Say: Rock is hard. Can rock bend?

      Hear the answer, then read.'
  - - Read the chapter together
    - 'Read Chapter VII (pages 61 to 69). Look at the Chart of Strata near the start of the chapter: the drawing shows the layers in order.'
  - - Layer and stratum
    - 'Read the book''s own example:

      ~ Suppose you had a great pile of paper, first a number of blue sheets, over them a number of white sheets, then a few pink sheets,

      ~ Each sheet would picture a '' layer,'' but each supply of one colour lying close together would picture a '' stratum.''

      Build the pile with your colored paper. Point to a layer, then a stratum. A formation is the set of strata from one age.'
  - - Fold the layers
    - 'Again from the book:

      ~ Take half-a-dozen pieces of thick cloth, and fold them backwards and forwards into several massive plaits, to make the matter more clear.

      Lay the towels flat on top of each other. Push slowly from both ends. The humps are like mountain folds; each towel still runs up and down through
      them, as a rock layer does.'
  - - Faults
    - 'Read:

      ~ These slips are called faults, both by geologists and by miners.

      If you have clay, press three thin colored slabs into a block, cut it in two with the butter knife at a slant, and slide one half down. The layers
      no longer line up. Ask: If you were a miner following the coal layer, what would happen at the fault?'
  - - Rocks that bend
    - Giberne says that under huge pressure even hard rock yields like clay, and gives an example of crumpled cliffs on the Lake of Lucerne in Switzerland.
      Find Lucerne on a map if you like.
  - - Tell it back
    - 'Ask your child to show and tell, with the paper or towels: what is a layer, a stratum, a fold and a fault?'
  - - What we know now
    - Giberne could not say what squeezed the rocks. We now know the force comes from the earth's moving plates. The Alps, including the folded rocks near
      Lucerne, were crumpled as the African plate pushed slowly north against Europe. Earthquakes happen when rocks suddenly slip along faults.
  practice: 'Notice it this week: look at photos of folded rock layers (search for "folded rock strata" with an adult), or look for slanting layers in road
    cuts as you travel.'
  answers: A layer is one sheet of rock; a stratum is a whole band of one kind of rock, made of many layers; a formation is all the strata from one age.
    A fault is a place where rock has cracked and one side has slipped up or down, so the layers no longer line up; a miner following a coal seam would
    find it suddenly stop and would have to look higher or lower for it.
  num: 7
- roman: Ch. VIII, part 1
  idx: 89
  unit: 1
  title: 'Ice-work: rain-prints, ripples and wandering stones'
  mins: 30
  goal: Your child can explain what fossil rain-prints and ripple marks tell us, and describe the puzzle of the scratched stones and erratic boulders.
  materials:
  - The book, open to this chapter
  - A shallow tray or baking pan of damp sand or mud
  - A cup of water
  - A notebook for a "rock journal" and a pencil
  book: The first half of Chapter VIII (pages 70 to 76) describes rain-drop pits and ripple marks hardened in sandstone, then the strange scratched stones,
    the stony clay called till or drift, and huge "erratic" blocks carried far from their home rocks. It explains why a flood of water could not have done
    this work.
  steps:
  - - A question to start
    - 'Say: Could a rain shower from millions of years ago leave a mark we can still see today?

      Let your child think about it, then read.'
  - - Read together
    - 'Read pages 70 to 76, from the start of Chapter VIII up to where the author turns to the snow on high mountains. A question from the book:

      ~ Did you never note how the retreating tide leaves often upon the sand tiny ridges and hollows side by side, which the next tide smooths away only
      that fresh ones may be formed ?'
  - - Make rain-prints and ripples
    - 'Smooth the damp sand in the tray. Flick drops of water onto one end with wet fingers: little pits, just like the book''s rain-prints.

      At the other end, pour in a little water and gently rock the tray back and forth many times. Ridges form, like ripple marks on a beach. Leave the
      tray in the sun to dry and harden a little.'
  - - Why they last
    - 'Explain: usually the next tide or shower smooths these marks away. But sometimes the sand dried, was gently covered by more sand, and hardened into
      rock. Then the marks were kept for us to find.'
  - - The puzzle of the wandering stones
    - 'In Scotland and other northern lands there is a stiff clay full of jumbled stones, called till or boulder-clay. Many of its stones are scratched
      in neat lines along their length. And huge blocks, some as big as a cottage, sit on mountains far from any rock like them.

      Say: What could carry a stone as big as a house fifty miles and up a mountain, scratching it as it went?

      Write your child''s best guess in the rock journal. The book gives its answer in the next lesson.'
  - - Water could not do it
    - 'Giberne mentions that some people once thought a great flood did it, and that Noah''s Flood comes to mind. She then explains why she thinks water
      alone could not: water rounds and rubs stones, but does not scratch neat lines on them, and cannot lift huge blocks up mountains.'
  - - Tell it back
    - 'Ask your child to explain how a ripple mark could end up inside a rock. Then: What is an erratic? Why did the author think water could not have carried
      them?'
  practice: 'Notice it this week: look for ripples on a beach, a sandbox after rain, or the bottom of a shallow stream. Look at large boulders in parks
    or fields: do they match the rock around them?'
  answers: The marks were made in soft sand, which dried and was covered by more sand before it could be washed smooth, and in time hardened into rock.
    An erratic is a large block of stone found far from the rock it came from. Water rounds stones but does not scratch them in neat lines, and it cannot
    carry huge blocks uphill.
  num: 8
- roman: Ch. VIII, part 2
  idx: 97
  unit: 1
  title: 'Ice-work: glaciers'
  mins: 35
  goal: Your child can explain how snow becomes a glacier, what moraines are, and why the book thinks glaciers once covered much of Britain and North America.
  materials:
  - The book, open to this chapter
  - A plastic tub or yogurt cup, water, sand and small gravel (freeze it the night before)
  - A lump of modeling clay or a bar of soap
  - An old towel
  - A notebook for a "rock journal" and a pencil
  book: The second half of Chapter VIII (pages 76 to 82) explains how mountain snow is pressed into ice that creeps downhill as a glacier, with crevasses
    and moraines, scratching the rocks beneath. It argues that great glaciers once covered Scotland, northern Europe and North America, and says no one
    yet knows how or when the Glacial Age came about.
  steps:
  - - Get ready the night before
    - Put a layer of sand and small gravel in the bottom of the tub, add water, and freeze it overnight. This will be your glacier.
  - - Read together
    - 'Read from the paragraph that begins "In the higher mountains of earth" (page 76) to the end of the chapter (page 82). The key sentences:

      ~ It is, in fact, a frozen stream — a river of ice.

      ~ Yet the real wonder is, not that these great masses of solid ice should move slowly, but that they should move at all.'
  - - From snow to ice
    - 'In plain words: on high mountains more snow falls each year than melts. Its weight squeezes the snow at the bottom into ice, and the ice is slowly
      pushed out and down the valley. If you have snow, squeeze a handful very hard: it turns icy.

      How fast? The book says only a few inches a day:

      ~ One mile in fifteen years is a very good pace for glacier ice.'
  - - Make glacier scratches
    - 'Pop the ice block out of the tub. Flatten the clay (or use the soap). Press the gritty side of the ice down and push it slowly across the clay a
      few times. Look: scratches and grooves, all running the same way.

      Say: This is just what the book says glaciers do to the stones and rocks under them.'
  - - Moraines
    - 'Rocks fall from the cliffs onto the edges of the glacier and ride along on it in long lines called moraines. Where the ice melts, it drops them in
      a heap: the terminal moraine. Look at the picture of a glacier in the book if your copy shows it.'
  - - Solving the puzzle
    - 'Go back to last lesson''s guess. The book''s answer: long ago, huge glaciers covered Scotland, much of Europe and North America, carrying giant blocks
      and scratching stones. Giberne adds that she cannot say how or when this cold time came:

      ~ For in truth we simply do not and cannot yet know, either how or when there came about this great period of extreme cold'
  - - Tell it back
    - 'Ask your child to explain, using the ice block, how a glacier can scratch rocks and carry boulders. Then: What is a moraine? Why did some people
      first think icebergs did the work?'
  - - What we know now
    - 'We now know there was not just one Ice Age. Over roughly the last two and a half million years, great ice sheets have grown and melted back many
      times. The last ice age ended about 12,000 years ago, and the great ice sheets over North America and northern Europe had melted away within a few
      thousand years after that. The main pacemaker is small, regular changes in the earth''s orbit and tilt. Some glaciers also move much faster than the
      book knew: a few in Greenland move more than 100 feet a day.'
  practice: 'Notice it this week: if you live in the northern United States, Canada or northern Europe, the ground around you may hold glacial till and
    erratic boulders. Look for large lone boulders in fields and parks.'
  tip: Melting ice is slippery and cold; do the scratching on a towel and let your child wear a mitten to hold the ice.
  answers: Heavy snow presses its lower layers into ice, and the weight pushes the ice slowly downhill as a glacier. A moraine is a line or heap of rocks
    carried by a glacier and dropped where it melts. Icebergs do carry and drop rocks, but they could not finely scratch thousands of small stones, so the
    book prefers the glacier explanation.
  num: 9
- roman: Ch. IX
  idx: 106
  unit: 1
  title: The two books, and a look back at Part I
  mins: 25
  goal: Your child can tell back the author's view of the "two Books", and can explain the main words from Part I.
  materials:
  - The book, open to this chapter
  - Your rock journal from Part I
  - Index cards for a quick word review
  book: Chapter IX closes Part I. Giberne writes that the rocks seem to show long ages before people lived, that no one can say how long they lasted, and
    that the Bible says "Day" without saying how long. She calls the Bible and Nature two Books by the same Author, which she says cannot truly contradict
    each other, and urges readers to wait and reserve judgment.
  steps:
  - - About this chapter
    - This short chapter is the author's own view, as a Christian, of how geology and the Bible fit together. Read it as her view. Families can talk it
      over in their own way; this guide does not add comment either way.
  - - Read the chapter together
    - 'Read Chapter IX (pages 83 to 88). Some of her key sentences:

      ~ How long? Men have rashly sought to answer that question,

      ~ We must remember always that we have more Books than one given us by the same Divine Writer.

      ~ But our safety is in a willingness to wait, and to reserve judgment,'
  - - Her main points
    - 'Help your child list them in plain words:

      1. The rocks seem to tell of very long ages before people.

      2. She says no one can say how long those ages were.

      3. She points out that the Bible says "Day" and does not give a date for "the Beginning".

      4. She calls the Bible and Nature two Books by one Author, which she believes cannot really disagree.

      5. She advises patience: wait for fuller knowledge.'
  - - Tell it back
    - Ask your child to tell back the "two Books" idea in their own words, as Giberne explains it.
  - - Look back at Part I
    - 'Write these words on cards and quiz each other, taking turns: stratified, sediment, fossil, igneous, metamorphic, stratum, fault, glacier, moraine,
      erratic. Your child gives a one-sentence meaning for each and, if possible, shows an example from the rock box or rock journal.'
  - - What we know now
    - Giberne asks "How long?" and says no one can tell. Since her time, scientists have learned to measure the ages of rocks using radioactive elements
      in them, which change into other elements at a steady, known rate, rather like sand running through an hourglass. By this method, the earth is found
      to be about 4.5 billion years old.
  practice: Before Part II, re-read the Table of Strata (end of Chapter VI) and say the order of the ages once a day.
  answers: 'Model answers for the review words: stratified, built in layers; sediment, what settles out of water; fossil, hardened remains of a plant or
    animal in rock; igneous, made by heat or fire; metamorphic, changed by heat; stratum, a band of one kind of rock; fault, a crack where rock slipped;
    glacier, a river of ice; moraine, rocks carried and dropped by a glacier; erratic, a big stone carried far from its home rock.'
  num: 10
- roman: Ch. X
  idx: 114
  unit: 2
  title: Two kingdoms
  mins: 35
  goal: 'Your child can sort living things using the book''s groups: animals with and without a backbone, and flowering and non-flowering plants.'
  materials:
  - The book, open to this chapter
  - 'About 12 pictures or real objects: a shell, a feather, a pine cone, a leaf, a fern frond, a picture of a mushroom, a fish, a frog, a snail, a beetle
    or spider, a starfish, a dog or cat'
  - A notebook for a "rock journal" and a pencil
  book: Chapter X explains the Animal and Vegetable Kingdoms, says that groups shade into one another "as the tints of a rainbow", and defines an organ.
    It lists the book's four classes of boneless animals and four classes of backboned animals, and its groups of plants, in tables at the end.
  steps:
  - - A question to start
    - 'Say: How would you sort every living thing in the world into groups?

      Let your child suggest a few ways (by size, by color, by where they live). Then read how the book does it.'
  - - Read the chapter together
    - 'Read Chapter X (pages 91 to 100), including the tables. Stop on:

      ~ Each class or kind of animals or vegetables, instead of being sharply cut off from the next by a wall or moat, passes into it by delicate shades,
      much as the tints of a rainbow melt softly into one another.'
  - - Backbone or not
    - 'The book''s first big split: animals without a backbone (tiny one-celled creatures, starfish and jellyfish, oysters and snails, crabs and insects)
      and animals with a backbone (fishes, reptiles, birds, mammals).

      Read the mark of a mammal:

      ~ The great distinguishing mark of the Mammals is that they suckle their young.'
  - - Sort the pile
    - 'Spread out your pictures and objects. First sort into animals and plants. Then sort the animals into "backbone" and "no backbone", and the plants
      into "flowers and seeds" and "no flowers" (ferns, mosses, seaweeds).

      Use the tables on pages 98 to 100 to check.'
  - - The in-betweens
    - 'The book points out that some creatures sit between groups. The frog breathes in water when young and in air when grown, so it sits between fish
      and reptiles: an amphibian. Ask your child to find the frog in the pile and decide where it goes.'
  - - Why this matters for geology
    - Giberne says that naturalists made these groups without looking at rocks, and yet the rocks seem to show life appearing in much the same order, from
      simple to complex. Part II follows that story age by age.
  - - Tell it back
    - 'Ask: What is an organ? What are the four classes of animals with a backbone? What makes a mammal a mammal?'
  - - What we know now
    - Scientists today sort living things by how they are related, and some of the book's groups have been rearranged. Mushrooms are now in a kingdom of
      their own (fungi), not with plants. Tiny one-celled creatures like rhizopods and diatoms are put in other groups, not with animals and plants. Starfish
      and jellyfish are no longer grouped together, and worms are not grouped with insects and crabs.
  practice: 'Notice it this week: on a walk, name each creature you see as "backbone" or "no backbone", and each plant as flowering or not.'
  answers: An organ is a part of a living body made to do a particular job, like the eye for seeing. The four backboned classes in the book are fishes,
    reptiles, birds and mammals. Mammals feed their young on milk.
  num: 11
- roman: Ch. XI
  idx: 124
  unit: 2
  title: Earliest ages
  mins: 30
  goal: Your child can describe the book's picture of the very early earth and explain why the author calls it a possible explanation, not a certainty.
  materials:
  - The book, open to this chapter
  - A grape and a raisin (or a fresh and a dried apple slice)
  - Paper and colored pencils
  book: 'Chapter XI says geology cannot tell us about the first creation of the world, then describes one idea borrowed from astronomy: a ball of fiery
    gas cooling to a liquid, then to a solid crust that wrinkled, with a boiling ocean forming from the steam. It gives the opposite view too, and ends
    with a word-picture of the bare early earth.'
  steps:
  - - A question to start
    - 'Say: Imagine the earth before there were any trees, animals, rivers or mountains. What do you think it looked like?

      Listen, then read.'
  - - Read the chapter together
    - 'Read Chapter XI (pages 101 to 106). The author is careful from the first line:

      ~ GEOLOGY can tell us nothing about the first creation of the world.'
  - - The three stages
    - 'In plain words, the idea she describes: first a ball of fiery gas; then, as it cooled, a glowing liquid ball; then a hard crust on the outside. As
      the inside kept cooling and shrinking, the crust wrinkled.

      ~ The crust would, therefore, rise and sink in vast ridges and hollows, somewhat like the wrinkling skin of a drying orange.

      Compare the grape and the raisin: as the inside dried and shrank, the skin wrinkled.'
  - - The first ocean
    - Steam in the hot air above cooled and fell as rain, until the whole earth was covered by a hot ocean. The water gathered in the low places, low lands
      rose, and the first simple plants and animals appeared.
  - - Two sides
    - 'Giberne gives another view too: some people thought the earth was always solid and cool, and that geologists should stick to the crust. Her conclusion:

      ~ We can but hear opposite ideas, and wait for fuller knowledge.'
  - - Draw the early earth
    - 'Read her word-picture aloud slowly, beginning:

      ~ Can you picture to yourself our beautiful earth in those early days ? A wide waste of ocean, over which no ship was ever seen to sail ;

      Your child draws it from her description: dim light, low bare rocks, wide ocean, perhaps a little seaweed, no animals to be seen.'
  - - Tell it back
    - Ask your child to tell the story of the early earth in the order the book gives it, then say which part the author says we cannot know for certain.
  - - What we know now
    - Scientists now think the earth formed about 4.5 billion years ago from dust and rock circling the young Sun, and that it was at first extremely hot
      and largely molten, so Giberne's first idea is close in spirit. As it cooled, a crust and oceans formed. The oldest known mineral grains are about
      4.4 billion years old, and the oldest signs of life, from tiny one-celled living things, are about 3.5 billion years old. Mountains, though, are not
      wrinkles from shrinking; they are pushed up by the earth's moving plates.
  practice: 'Notice it this week: look at a full moon with binoculars, or at a photo of the Moon. Its bare, cratered face gives an idea of a world with
    no air, water or life.'
  answers: 'The book''s order: fiery gas, then a liquid ball with a burning atmosphere, then a cooled crust that wrinkled, then a hot ocean from the steam,
    then low lands and the first simple life. The author says we cannot know for certain how the earth was first made; geology cannot tell us.'
  num: 12
- roman: Ch. XII
  idx: 130
  unit: 2
  title: The age of lower animals
  mins: 35
  goal: Your child can describe the seas of the Age of Lower Animals, explain why the limestone shows a shallow, warm sea, and describe a trilobite.
  materials:
  - The book, open to this chapter
  - Modeling clay or paper and pencils
  - A magnifying glass (if you have a real fossil)
  - A notebook for a "rock journal" and a pencil
  book: Chapter XII begins the Primary or Ancient-Life Period with the Age of Lower Animals, when limestone was being built in shallow seas over much of
    today's land. It describes ripple marks and worm-borings, the many-lobed trilobite with its large eyes, and the sudden appearance of the first fishes
    near the end of the age.
  steps:
  - - A question to start
    - 'Say: If you found coral in a rock in Scotland, near the cold North Sea, what would that tell you?

      Keep the question for later.'
  - - Read the chapter together
    - 'Read Chapter XII (pages 107 to 117). Two sentences to stop on:

      ~ Even in the heaviest storms, the bottom of the deep sea is always quite calm.

      ~ When a piece of rock has such marks, you may be sure that they were made upon the beach between high and low water-line.'
  - - Reading the clues
    - 'Help your child follow the author''s reasoning: limestone made of ground-up shells needs waves to grind them, so the sea was shallow. Corals grow
      only in warm water, and coral is found far north, so the sea was warm. Ripple marks and worm-borings show old beaches.'
  - - The trilobite
    - 'Read:

      ~ The name '' Trilobite '' has been given to it, from the shape ; but no man has ever seen the living creature, for nothing like it is in the earth
      now.

      Tri-lobe means three lobes. Draw or model one: a head shield, a jointed body and a tail, divided lengthwise into three lobes (left, middle, right),
      with two big eyes on the head. The book says some were a foot long.'
  - - What the eyes tell
    - 'Giberne makes a neat deduction: the trilobite had large eyes, so there must have been light in those early seas. Ask your child to explain her reasoning
      in their own words.'
  - - The fishes arrive
    - Near the end of this age, fishes appear. The book describes a "bone-bed" in Scotland, about a hundred miles long, crowded with fish bones, teeth and
      scales. Giberne sees in the fossils a sudden appearance of a new, higher kind of animal.
  - - Tell it back
    - 'Ask your child to describe a day in the shallow sea of this age: what lived there, and what did not yet exist?'
  - - What we know now
    - 'This time is now dated to the Cambrian and the periods after it, beginning about 539 million years ago. Trilobites lived for about 270 million years
      before dying out. Their eyes were made of clear crystals of calcite, one of the earliest kinds of eye known. Fossils of small jawless fishes have
      since been found in older rocks, so fishes appeared earlier and more gradually than it seemed in 1881. And the coral in northern rocks has another
      explanation too: the land that is now Britain lay much farther south then, in warmer waters, because continents move.'
  practice: 'If a museum near you has trilobites, go and find one. Notice it this week: look at stone walls, steps and building stones for tiny fossil shells,
    which are common in limestone.'
  answers: The waves must have been able to reach the bottom to grind shells into limestone, so the water was shallow; coral grows only in warm, fairly
    shallow seas. A trilobite had a head shield, jointed body and tail, divided lengthwise into three lobes, and large eyes. Its eyes show that there was
    light in the sea.
  num: 13
- roman: Ch. XIII
  idx: 141
  unit: 2
  title: The age of fishes
  mins: 30
  goal: Your child can describe the Age of Fishes (the Old Red Sandstone) and explain why bird fossils are rare.
  materials:
  - The book, open to this chapter
  - A bowl of water, a feather and a small pebble
  - A notebook for a "rock journal" and a pencil
  book: Chapter XIII describes the Age of Fishes, with its Old Red Sandstone and coral limestones. The first forests of ferns, tree-ferns and pine-like
    trees grow, the earliest known insects appear, and the seas teem with fishes, many with shining scales, and with huge lobster-like creatures.
  steps:
  - - A question to start
    - 'Say: If you were a fish in this age, what would you meet?

      Read to find out.'
  - - Read the chapter together
    - 'Read Chapter XIII (pages 118 to 124). Sentences to stop on:

      ~ The bare rocks had a green clothing at last.

      ~ One of these insect-fossils is of a huge May-fly, no less than five inches across from tip to tip of its wings.

      Show five inches with a ruler.'
  - - The building so far
    - 'Giberne uses her house picture again: the lowest rocks are the cellars, the first water-built rocks the basement, and now the ground floor is being
      built. Ask your child which "floor" we are on in this chapter.'
  - - Why so few bird fossils
    - 'Read:

      ~ Now a bird is of very light make — so light that if he dies and falls into the sea, his body will probably float until it decays or is devoured.

      Test it: drop the feather and the pebble into the bowl of water. Which sinks and might be buried in mud? Which floats away?'
  - - Giant sea creatures
    - 'The book describes lobster-like animals four to six feet long:

      ~ These last would be somewhat unpleasant to meet upon the seashore.

      Measure six feet against a wall or door and compare with your child''s height.'
  - - Time is counted in layers
    - 'Point out the author''s rule: in geology, "time" means the order of the rock layers, not years, because the rocks have no dates written on them.'
  - - Tell it back
    - Ask your child to describe a forest and a sea of the Age of Fishes, using at least four things from the chapter.
  - - What we know now
    - This age is now called the Devonian, about 419 to 359 million years ago. Near its end, the first four-legged animals began to crawl out of the water.
      The giant "lobsters" were probably sea scorpions, relatives of spiders and horseshoe crabs; the biggest known grew to about 8 feet long.
  practice: 'Notice it this week: look at reddish sandstone in buildings or gravel. Ask your child to say what color the Old Red Sandstone was and why it
    got its name.'
  answers: Fishes of many kinds (some with shining scales, some sharks), corals, sponges, trilobites and huge lobster-like creatures; on land, ferns, tree-ferns,
    pine-like trees and insects, but no reptiles or four-footed beasts yet. Birds are light and float when they die, so they rot or are eaten before mud
    can bury them.
  num: 14
- roman: Ch. XIV
  idx: 148
  unit: 2
  title: The age of coal
  mins: 35
  goal: Your child can explain, step by step, how the book says coal seams were made, and why there is a layer of clay under each seam.
  materials:
  - The book, open to this chapter
  - A tall clear cup or jar
  - Leaves or grass clippings and some sand
  - Paper and colored pencils
  book: Chapter XIV takes the reader in imagination to a hill above the steamy swamp forests of the Coal Age, with giant club-mosses, horse-tails, tree-ferns
    and a large salamander-like creature. It explains how forests grew, sank under the sea, were covered with sand and rose again many times, why fire-clay
    lies under each coal seam, and why upright fossil trunks are dangerous in mines.
  steps:
  - - A question to start
    - 'Say: Coal is black and hard and burns. Would you believe it was once a forest?

      Read to see how.'
  - - Read the chapter together
    - 'Read Chapter XIV (pages 125 to 134). Look at the picture of the Coal-Age forest. Sentences to stop on:

      ~ Only a gleam of light, not sunshine, for little or no sunshine can creep through the misty atmosphere.

      ~ the air is positively reeking with damp oppressive warmth, like the air of a hot-house.'
  - - Draw the scene
    - 'Re-read the paragraph about standing on the hill. Your child draws what the author describes: a slow stream and shallow lakes, swampy forests of
      giant club-mosses, horse-tails, tree-ferns and pines, misty air, and the large scaly creature creeping by the water.'
  - - Build coal layers
    - 'Make a model of the book''s cycle in the cup: a layer of leaves (a forest grows and dies), then a layer of sand (the land sinks and the sea covers
      it), then leaves again (the land rises and a new forest grows), then sand. Do it three times and press down firmly.

      Say: Each leaf layer stands for one coal seam, with rock between.'
  - - The clay underneath
    - 'Read:

      ~ It is now believed that the clays were once the soils of the ground, upon which the forests grew,

      The "Stigmaria" once thought to be a water-plant turned out to be the roots of the Sigillaria tree, still in its soil.'
  - - Seams thick and thin
    - '~ Some are scarcely thicker than a piece of paper, while others are as much as thirty or forty feet in thickness.

      Ask: If it takes a huge pile of plants to make one foot of coal, what does a forty-foot seam tell you?'
  - - Tell it back
    - 'Ask your child to explain the coal cycle in order using the cup: forest, sinking, sand, rising, new forest. Then: Why are upright fossil tree-trunks
      dangerous to miners?'
  - - What we know now
    - 'This age is now called the Carboniferous ("coal-bearing"), about 359 to 299 million years ago. The air then held more oxygen than today, and some
      insects grew huge: a dragonfly-like insect called Meganeura had wings over two feet across. The clays under coal seams are still understood as old
      forest soils.'
  practice: 'Notice it this week: look for horse-tails (also called scouring rush) or club-mosses in damp places; they are small living relatives of the
    Coal-Age giants.'
  answers: The forest grew in a swamp and its dead plants piled up; the land sank and the sea covered it with sand or mud; later the land rose and a new
    forest grew; this happened again and again, and the buried plants slowly hardened into coal. The trunks were filled with sandstone inside a thin coal
    bark, which cannot hold the weight when the mine takes away support, so they fall from the roof.
  num: 15
- roman: Ch. XV
  idx: 160
  unit: 2
  title: More about the age of coal
  mins: 30
  goal: Your child can explain what alternating layers of coal, limestone and sandstone tell us, and can read a fossil footprint trail.
  materials:
  - The book, open to this chapter
  - A strip of damp sand outdoors, or a long sheet of dark paper and a little flour or water for footprints
  - A notebook for a "rock journal" and a pencil
  book: Chapter XV says that coal is only a small part of the coal-rocks (in South Wales, about 120 feet of coal in 10,000 feet of rock), describes the
    warm, misty climate and the giant plants, and introduces the amphibians, with a slab of footprints from America. It ends with the upheaval of the Alleghany
    Mountains and the close of the Ancient-Life Period.
  steps:
  - - A question to start
    - 'Say: If you saw a fossil footprint trail, how could you tell whether the animal was walking or running?

      Keep the question for the activity.'
  - - Read the chapter together
    - 'Read Chapter XV (pages 135 to 142). Sentences to stop on:

      ~ In any piece of coal you may see the thin even layers. They show distinctly, but do not separate easily.

      ~ Club-mosses, which now are never seen more than four or five feet high, then grew to a stature of sixty or seventy feet.'
  - - Reading alternating layers
    - 'The book gives a key: coal tells of forests on land; limestone tells of the sea; sandstone may tell of either. So a pile of coal, limestone and sandstone
      layers tells of land that was dry, then under the sea, then dry again. Ask: Near Swansea there are sixteen coal seams. How many forests is that?'
  - - Amphibians
    - 'Read:

      ~ A crocodile and a snake are True Reptiles, cold-blooded and air-breathing.

      The frog and salamander breathe in water for part of their lives: amphibians. The book describes large, scaly salamander-like animals of the Coal
      Age.'
  - - Make a footprint trail
    - 'The book tells of a slab from America with six footprints. Make a trail of your own: your child walks, then runs, across damp sand (or across dark
      paper with damp feet or floury socks). Compare the two trails. Running steps are farther apart and deeper at the toe.

      Then you make a mystery trail and let your child read it: walking or running? Which way? Did you stop or turn?'
  - - Mountains and a fault
    - At the end of the Ancient-Life Period, says the book, the Alleghany Mountains were pushed up and the coal beds tilted and faulted. One fault is twenty
      miles long and twenty thousand feet deep, but so narrow a person can stand astride it.
  - - Tell it back
    - 'Ask: What three things together tell the story of land rising and sinking? What is an amphibian? What happened at the close of the Ancient-Life Period?'
  - - What we know now
    - The Alleghany (Appalachian) Mountains were pushed up when the continents slowly crashed together into one giant continent, now called Pangaea. The
      close of this Ancient-Life (Paleozoic) Period, about 252 million years ago, brought the largest dying-out of life known, when most kinds of sea creatures
      disappeared, the last trilobites among them.
  practice: 'Notice it this week: look for animal or bird tracks in mud, sand or snow and try to read them: which way was it going? Was it walking or running?'
  answers: Coal layers mean forest on land; limestone means sea; sandstone may mean either. When they alternate, the land rose and sank again and again.
    An amphibian (like a frog) lives part of its life breathing in water and part breathing air. At the close of the period, mountains such as the Alleghanies
    were raised, the rocks were bent and faulted, and the old kinds of animals gave way to new ones.
  num: 16
- roman: Ch. XVI
  idx: 170
  unit: 3
  title: The age of reptiles
  mins: 40
  goal: Your child can name and describe several great reptiles of the Middle-Life Period and explain the difference between a mammal and a quadruped.
  materials:
  - The book, open to this chapter
  - A long tape measure (or a 25-foot tape) and chalk or sticks to mark distances
  - A large sheet of paper and a ruler
  - A notebook for a "rock journal" and a pencil
  book: 'Chapter XVI describes the Middle-Life or Secondary Period, when great reptiles ruled land, sea and air: huge crocodiles, swimming saurians, a long-necked
    sea reptile, flying "dragons", giant turtles and the bird-like dinosaur. It tells of thousands of footprints in the Connecticut Valley, a fossil bird
    with feathers from Bavaria, and the first small mammals.'
  steps:
  - - A question to start
    - 'Say: Dragons only live in fairy tales. Or did something like them once really live?

      Read what the author says.'
  - - Read the chapter together
    - 'Read Chapter XVI (pages 143 to 153). It opens:

      ~ It is no fairy-tale which I have to relate ;

      Note for you: on pages 145 and 146 Giberne wonders whether a few great reptiles might have lived on into the time of people and started the old dragon
      stories. She says plainly that this is only her guess.'
  - - Meet the reptiles
    - 'Make a list in the rock journal with the book''s footnote names: Ichthyosaur (fish-lizard with paddles), Plesiosaur (long neck, small head), Mosasaur
      (long sea "snake"), Pterodactyl (flying reptile with bat-like wings), Dinosaur (crocodile-like and bird-like, sometimes walking on its hind legs).
      Read:

      ~ By a '' saurian '' is meant simply a '' scale-covered reptile.'''
  - - Measure them out
    - 'Go outside or to a long hallway. Mark out the book''s sizes: a river crocodile "forty feet and more", a flying reptile sixteen feet across the wings,
      a turtle fifteen feet between its flippers. Stand your child at one end. Then draw one of the book''s footprints, "twenty inches long", on the big
      paper and let your child stand in it.'
  - - The bird with feathers
    - 'Read:

      ~ So well had it been preserved, that some of the feathers were there with the bones.

      The book also notes that three-toed footprints were at first all thought to be bird tracks, and that dinosaur bones are hollow like a bird''s.'
  - - Mammal or quadruped?
    - '~ Crocodiles have four feet, but they are not mammals. Whales and seals and human beings have not four feet, yet they are all included in the Mammal
      Class.

      Quiz: dog (both), crocodile (quadruped only), whale (mammal only), lizard (quadruped only), person (mammal only), horse (both).'
  - - Tell it back
    - 'Ask: In which "three elements" did reptiles rule, according to the book? (Land, water, air.) Which reptile would you least like to meet, and why?'
  - - What we know now
    - 'The great dinosaurs died out about 66 million years ago, and no dinosaur bones have ever been found in rocks younger than that, so people never lived
      alongside them. But birds are living relatives of the dinosaurs: the feathered fossil from Bavaria, named Archaeopteryx, was an early clue. Many dinosaurs
      were probably warm-blooded, as some already suspected in Giberne''s day. Ichthyosaurs, plesiosaurs, pterosaurs and mosasaurs were reptiles but not
      dinosaurs; mosasaurs were giant sea lizards with flippers, not snakes.'
  practice: 'Notice it this week: watch a bird walk and look at its feet and scaly legs. Compare its three forward toes with the dinosaur footprints in
    the book.'
  answers: Land, water and air. A quadruped is any four-footed animal; a mammal is one that feeds its young on milk. Some animals are both (dog, horse),
    some are only quadrupeds (crocodile, lizard), and some are only mammals (whale, seal, people).
