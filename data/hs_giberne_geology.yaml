- roman: Ch. XVII, part 2
  idx: 188
  unit: 3
  title: 'The age of chalk: new trees and a great ending'
  mins: 35
  goal: Your child can describe how the Chalk Age changed plant life and explain what the book says happened at its close.
  materials:
  - The book, open to this chapter
  - A snail shell or a picture of a nautilus or ammonite
  - Modeling clay (for an ammonite fossil)
  - A notebook for a "rock journal" and a pencil
  book: The second part of Chapter XVII (pages 161 to 168) describes the geography of the age, with Europe a collection of islands and the great mountain
    ranges still under the sea. Oak, beech, maple, fig, magnolia and other modern trees suddenly appear, the great reptiles and the ammonites come to their
    end, and a great break in life marks the close of the Middle-Life Period. It ends with a poem about the Nautilus and the Ammonite.
  steps:
  - - A question to start
    - 'Say: Which trees grow near our home? Do you think they were here when the great reptiles lived?

      Read to find out what the book says.'
  - - Read together
    - 'Read from the paragraph that begins "In America, although there is the so-called Chalk-formation" (page 161) to the end of the chapter (page 168).
      Sentences to stop on:

      ~ At the close of the Chalk Age, which is also the close of the Secondary Period, a great and remarkable destruction of life seems to have taken place.

      ~ Whether this destruction was sudden or gradual is a question about which opinions differ — the simple fact being that nobody knows.'
  - - Europe as islands
    - 'In plain words: during the Chalk Age, says the book, much of Europe was under the sea, more like a scattering of islands. The Alps, Pyrenees, Himalayas,
      Rocky Mountains and Andes were still under water or only just poking out.'
  - - New trees
    - 'Look at the book''s list of trees found at Aix-la-Chapelle: oak, beech, sycamore, poplar, willow, walnut, myrtle, fig, maple, magnolia, holly, hickory
      and more. Have your child tick off the ones growing near your home.'
  - - The ammonite
    - Show the snail shell or picture. Ammonites were coiled shells, from an inch to a yard across, and they died out at the end of this age. Press the
      snail shell (or a coil of clay rope) into a flat lump of clay to make an "ammonite" fossil.
  - - The poem
    - 'Read the poem by G. F. Richardson at the end of the chapter aloud. Its refrain echoes Chapter XII:

      ~ The Almighty''s breath spake out in death,

      ~ And the Ammonite lived no more.

      Ask which line your child likes best.'
  - - Tell it back
    - 'Ask your child to explain the two ideas in the book about the "break" between the Middle-Life and New-Life rocks: a sudden destruction of life, or
      missing layers. Which does the author think would be just as remarkable?'
  - - What we know now
    - 'Scientists now know what caused the great dying at the end of the Chalk Age, about 66 million years ago: a giant asteroid, about 6 miles wide, struck
      the earth where Mexico is today, and huge volcanic eruptions in India added to the harm. The change was sudden. The great mountain ranges rose later
      as the earth''s plates collided; the Himalayas were pushed up when India crashed into Asia.'
  practice: 'Notice it this week: find a magnolia, maple, holly or oak and remember that its family goes back to the Chalk Age. Let the clay ammonite dry
    and add it to the rock box.'
  answers: One idea is that many animals died out suddenly; the other is that the change only looks sudden because layers from the time between have been
    washed away. The author says that such a huge, worldwide washing-away of layers would be at least as remarkable as a sudden destruction of life.
  num: 19
- roman: Ch. XVIII
  idx: 196
  unit: 3
  title: The age of mammals
  mins: 25
  goal: Your child can name the three great periods in three different ways, explain the names Eocene to Pleistocene, and describe nummulites.
  materials:
  - The book, open to this chapter
  - A few coins
  - A globe, atlas or free online map
  - A notebook for a "rock journal" and a pencil
  book: Chapter XVIII begins the Tertiary or New-Life Period. It explains the names given to its ages by the share of shells that are like living kinds,
    describes the coin-shaped nummulites found high in the Alps and Himalayas, and says the climate was mild, the great mountains were still rising, and
    Britain was at times joined to the Continent.
  steps:
  - - A question to start
    - 'Say: If you found a fossil the size and shape of a coin on top of a high mountain, what would you think?'
  - - Read the chapter together
    - Read Chapter XVIII (pages 169 to 174). Look at the plate of fossils (footprints of a bird, mud-cracks, trilobite, ripple marks, ammonite, fish). Can
      your child name each from earlier lessons?
  - - Three ways to say it
    - 'The book gives the three great periods several names. Make a chart in the rock journal:

      Primary / Ancient-Life / Lower Animals and Fishes / Ancient History

      Secondary / Middle-Life / Reptiles / Mediaeval History

      Tertiary / New-Life / Mammals / Modern History'
  - - Dawn-New to Most-New
    - 'The ages of the New-Life Period are named by how many of their shells are like living kinds: Eocene ("dawn of recent"), Miocene (less than half recent),
      Pliocene (more than half), Pleistocene (most). By the end, the book says, about ninety-five shells in every hundred are the same as living kinds.'
  - - Coin-stones on mountains
    - 'Read:

      ~ They are called Nummulites, from two words, one Latin and the other Greek, meaning '' coin '' and '' stone.''

      ~ The summit of the Dent du Midi, for instance, over ten thousand feet high, is formed of nummulite rock.

      Put a coin on the table and imagine a whole mountaintop made of such fossils. Find the Alps, Pyrenees and Himalayas on a map.'
  - - Britain joined and parted
    - 'The book says Britain was sometimes part of the Continent and sometimes cut off by the sea. Find the Strait of Dover on the map. Ask: How could elephants
      and other big European beasts have reached England?'
  - - Tell it back
    - 'Ask: What does the nummulite rock on the Alps tell us about when the Alps became mountains?'
  - - What we know now
    - Nummulites were giant single-celled creatures, and the Great Pyramids of Egypt are built of limestone full of them. The Alps rose as Africa pushed
      north into Europe. Britain was last joined to Europe by low land, now under the North Sea, until about 8,000 years ago. Today the Pleistocene is counted
      in a separate, later period called the Quaternary.
  practice: Practice the Eocene-to-Pleistocene names with their meanings until they are easy.
  answers: The nummulites lived in the sea, so the rock at the top of the Alps was once under the sea; the Alps must have been lifted up after these creatures
    lived, in the New-Life Period.
