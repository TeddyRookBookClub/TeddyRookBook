  title: Puffballs
  mins: 25
  goal: Your child can explain that the puffball's "smoke" is spores and can show how an earth-star opens and closes.
  materials:
  - A puffball or earth-star, collected by an adult with gloves
  - White paper
  - A hand lens (magnifying glass)
  - Disposable gloves
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a short method, and seven observations on where puffballs grow, their size, their "smoke" of spores, the giant puffball and the earth-star.
  steps:
  - - Safety first
    - 'Safety first: we never eat a wild mushroom or any other wild fungus, not even a taste, and we never put fingers in our mouths after touching one. Some deadly kinds look plain and harmless, and even
      experts are fooled. Wear gloves or wash hands well with soap afterward, and keep specimens away from little children and pets.

      Two more puffball rules. A young deadly mushroom still in its "egg" can look just like a small white puffball from the outside. And don''t breathe in the "smoke": puff it outdoors, at arm''s length,
      away from faces. The book asks about frying giant puffballs; we skip that question.'
  - - When and where
    - Late summer and fall, on lawns, pastures, roadsides and rotting logs. White puffballs are young; brown ones that puff are ripe.
  - - The leading thought
    - ~ The puffballs are the fruiting organs, and "smoke" which issues from them is largely made up of spores, which are carried off by the wind and sown and planted.
  - - Look closely
    - '~ Where did you find the puffball? On what was it growing? Were there many growing in company?

      ~ What is the size and shape of the puffball? Is its surface smooth or warty?

      Look where it stood with the lens for the matted fungus threads.'
  - - The smoke
    - 'Outdoors, at arm''s length, tap a ripe puffball over white paper.

      ~ Does the smoke come out through the broken covering of the puffball, or are there one or more special openings to allow it to escape?

      ~ What do you think this dust is? Of what use is it to the puffball?'
  - - The earth-star trick
    - 'If you find an earth-star, a puffball sitting in a star-shaped saucer, try this:

      ~ Let this star saucer become very dry; how does it act?

      ~ Wet it; and how does it behave then?

      Earth-stars can be kept dry for a long time and wetted again and again.'
  - - Nature notebook
    - 'Draw the puffball whole and, if you found one, the earth-star dry and wet. Write how many spores you think one puffball holds: a lot or a few? Wash hands when done.'
  answers: The smoke is spores, which the wind carries to new places. Many puffballs have a hole at the top; raindrops striking the skin puff the spores out. A dry earth-star curls its rays closed over
    the ball; wet, it spreads them flat and lifts the ball up.
- num: 181
  roman: CLXXXI
  idx: 739
  unit: 27
  title: Bracket fungi
  mins: 30
  goal: Your child can describe a shelf fungus, find the pores where its spores form, and explain how it enters a tree through a wound.
  materials:
  - A shelf fungus on a tree or a fallen one from a dead log
  - A hand lens (magnifying glass)
  - A pin or toothpick
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson calls for studying a tree with shelf fungus as a lesson on the care of trees, then ten observations on the bracket, its rings, its pore surface and the wound it came in by.
  steps:
  - - When and where
    - Any time of year. Walk in a woods or old orchard and look for shelf-like growths on trunks, stumps and logs. Find one on a living tree and one on dead wood if you can. No climbing.
  - - Safety
    - We don't eat any fungus, and we wash hands after touching one. If you want to take one home, choose one that has already fallen.
  - - The leading thought
    - ~ The fungi which we see growing shelflike from trees, are deadly enemies to the trees. Their spores germinate and penetrate at some open wound and the growing fungus weakens the wood.
  - - Look at the tree
    - '~ On what kind of a tree is the bracket fungus growing? Is it alive or dead? If living, does it look vigorous or is it decaying?

      ~ Look at the place where the bracket joined the tree. Does it seem to be a part of the wood?'
  - - The bracket itself
    - '~ What color is the fungus on its upper surface? How large is it? How thick near the tree? How thick at the edge? Can you detect concentric layers or rings?

      ~ Look at the lower surface. How does it appear to the naked eye? If you scratch it with a pin or knife does the bruise show?

      The big "artist''s conk" turns brown wherever it is scratched, so you can draw on it with a toothpick.'
  - - How it got in
    - '~ There must have been an open wound in the tree where the fungus entered; see whether you can find this wound.

      ~ What treatment must we give trees to keep them free from this enemy?'
  - - What we know now
    - 'Fungi are not plants; scientists put them in a kingdom of their own. And bracket fungi are not only enemies: most of them grow on dead wood and slowly turn it back into soil. Without fungi, the forest
      floor would be piled high with fallen logs.'
  - - Nature notebook
    - Draw the bracket from the side and from below, and draw a few pores as they look through the lens. If you scratched a picture on an artist's conk, sketch it too.
  answers: The spores are made inside the tiny tubes whose openings are the pores. The hidden threads in the wood feed the fungus (like roots); the bracket is its fruiting part. Careful pruning, cutting
    broken limbs cleanly and not wounding bark help keep fungi out.
- num: 182
  roman: CLXXXII
  idx: 740
  unit: 27
  title: Hedgehog fungi
  mins: 20
  goal: Your child can describe the coral-like or fountain-like hedgehog fungi and explain that their hanging spines bear the spores.
  materials:
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  - Colored pencils
  book: 'This short lesson is mostly a story: the author remembers finding these white "fairy grotto" fungi as a child. It names the bear''s head fungus and the coral kind and ends with five short facts
    to observe.'
  steps:
  - - When and where
    - Late summer or early fall, on dead logs, stumps and dead limbs in the woods. They are creamy white and easy to spot. Look but don't pick unless an adult wears gloves, and never taste.
  - - Read the story
    - 'Read the first paragraph on the book page aloud. The author felt as if she had found something magical:

      ~ The writer remembers as a child that the finding of these woodland treasures made her feel as if she were in the presence of the supernatural, as if she had discovered a fairy grotto or a kobold
      cave.'
  - - Check the five facts
    - 'The book lists five things to see. Turn each into a question and check it on your fungus (or in the photo):

      ~ These fungi come from a stem which extends into the wood.

      ~ From these branchlets there hang long fleshy fringes like miniature icicles.

      ~ These fringes always hang downward when the fungus is in natural position.

      ~ These fringes bear the spores.'
  - - Why point down?
    - 'Ask: Why might the spines always hang toward the ground? (So the spores can fall free into the air.) Mushroom gills hang down for the same reason.'
  - - Nature notebook
    - Draw the fungus like a frozen white fountain or a branch of coral. Write the date, the place and what it was growing on. Wash hands if you touched it.
