- title: The bluebird
  mins: 30
  goal: Your child can describe the bluebird's colors, song and nesting places, and say how people can help bluebirds with nesting boxes.
  materials:
  - Binoculars
  - Colored pencils (sky blue and rusty red)
  - A bird book or app with bluebird pictures and song
  - Nature notebook
  book: The leading thought and method (individual field observation, then reading and a talk on nesting boxes), with thirteen questions comparing the bluebird with the robin and covering song, colors,
    feeding, nest, eggs, young, food, protection, winter home and enemies. A poem by Thomas Bailey Aldrich follows.
  steps:
  - - When and where
    - 'Early spring through summer, in open country: farm fields, fence lines, golf courses, orchards and parks with scattered trees. Bluebirds often perch on wires and fence posts and drop to the ground
      for insects. Look for nesting boxes on posts; many parks put up bluebird trails. In the South they can be seen all year. Comstock says these observations must be made in the field.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The bluebird is related to the robins and thrushes and is as beneficial as it is beautiful. We should study its habits and learn how to make nesting boxes for it, and protect it in all ways.'
  - - Find a bluebird
    - 'Walk slowly along a field edge and scan the wires and posts.

      ~ Where were the bluebirds you saw? What were they doing? If feeding, how did they act?

      ~ Can you see the color of the bluebird as plainly when it is in a tree as when it is flying? If not, why?'
  - - Colors and song
    - '~ Describe the colors of the bluebird as follows: The head, back, breast, under parts, wings, tail. How does the male bluebird differ from his mate in colors?

      ~ Describe the bluebirds'' song. Do they sing all summer?'
  - - Robin and bluebird
    - '~ Which comes North earlier in spring the robin or the bluebird?

      ~ How do the two resemble each other and differ from each other?'
  - - Nest and helping
    - '~ Where do the bluebirds build their nests? Of what material are the nests made?

      ~ What can we do to induce the bluebirds to live near our houses? How can we protect them?

      If you see a nest box, watch from a distance. Don''t open it. Building a bluebird box is a good family project; an adult should do the sawing and drilling.'
  - - Put it into words
    - Ask your child to tell you how a bluebird is like a robin and how it is different. Then share the leading thought.
  - - Nature notebook
    - 'This is Comstock''s own question 12: "Make a colored picture of a bluebird." Draw the male, and the female beside him if you saw her.'
  practice: Keep watching the same field or nest box through spring. Note the date you first see young bluebirds.
  tip: Comstock asks how to tell a bluebird from the indigo bunting. The bunting is blue all over; the bluebird has a rusty breast.
  num: 11
  roman: XI
  idx: 85
  unit: 2
- title: The nuthatch
  mins: 30
  goal: Your child can pick out a nuthatch at the feeder by how it creeps head-first down a tree, and tell it from a chickadee and a woodpecker.
  materials:
  - A suet feeder or a lump of suet tied to a tree trunk you can see from a window
  - Binoculars (optional)
  - Colored pencils (blue-gray, black, white, rust)
  - Nature notebook
  book: The leading thought and method (watch the nuthatch at the suet with the chickadees and downy) and ten questions about where it alights, how it climbs head down, its toes, colors, cap and bib, beak,
    food, note, its use to trees, and its nest.
  steps:
  - - When and where
    - Fall and winter are best, when nuthatches come to suet feeders with chickadees and downy woodpeckers. In summer, look on the trunks of big trees in woods and parks. Listen for a nasal "ank, ank."
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The nuthatch is often a companion of the chickadees and woodpeckers. It has no black bib, like the chickadee, and it alights on a tree trunk head downward, which distinguishes it from woodpeckers.'
  - - Set the table
    - Comstock says the nuthatch "gladly shares the suet banquet we prepare for them." Hang a store-bought suet cake, or let an adult tie a piece of beef suet in a mesh bag to a tree trunk you can see from
      a window. Take it down in hot weather, when suet goes soft and rancid.
  - - Watch it climb
    - '~ Does a nuthatch usually alight on the ends of the branches of a tree or on the trunk and larger limbs? Does it usually alight head down or up?

      ~ When it runs down the tree, does it go head first or does it back down?

      ~ Does it use its tail for a brace when climbing, as does the downy?'
  - - Colors and cap
    - '~ What is the general color of the nuthatch above and below?

      ~ Does the black cap come down to the eyes on the nuthatch as on the chickadee? Has the nuthatch a black bib?'
  - - Beak, food and voice
    - '~ Observe the way it strikes its beak into the suet, why does it strike so hard?

      ~ How would you spell this bird''s note? Have you heard it give more than one note?

      ~ Why do we see the nuthatches oftener in winter than in summer?'
  - - Put it into words
    - 'Ask your child: How can you tell a nuthatch from a chickadee? From a woodpecker? Then share the leading thought.'
  - - Nature notebook
    - Draw a nuthatch head-down on a tree trunk. Write how your child spells its call.
  practice: Watch the feeder for a few minutes each day this week and tally nuthatches, chickadees and woodpeckers.
  tip: Comstock's teacher's story calls the nuthatch the "tree mouse" because it runs about the trunk so quickly.
  num: 12
  roman: XII
  idx: 87
  unit: 2
- title: The chickadee
  mins: 30
  goal: Your child can recognize the chickadee by its black cap and bib and its call, and describe how it hunts on twigs in winter.
  materials:
  - A suet feeder or a lump of suet on a tree near a window
  - Binoculars (optional)
  - Nature notebook and pencil
  book: The leading thought, the method (put beef fat on trees near the schoolhouse in December) and nine questions about where the chickadees are seen, their songs (including "fee-bee"), colors and size,
    bill and winter food, where they alight, how to tell them from nuthatches, their cheer in snow, their nest and their use to trees. A little musical score of the chickadee's notes is printed below.
  steps:
  - - When and where
    - Winter is chickadee season. Comstock started her feeding in December and kept it up all winter. Chickadees come to almost any feeder near trees, in towns and in the country. (In the South, look for
      the Carolina chickadee; in the West, the mountain chickadee.)
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The chickadee is as useful as it is delightful; it remains in the North during winter, working hard to clear our trees of insect eggs and singing cheerily all day.'
  - - Set out the suet
    - '~ Put beef fat on the trees near the schoolhouse in December and replenish it afresh about every two or three weeks.

      A store-bought suet cake in a cage works the same way. Take it down in warm weather.'
  - - Listen
    - '~ What is the common song of the chickadee? What other notes has it?

      ~ Have you heard it sing "fee-bee, fee-bee." How does this song differ from that of the phoebe-bird?

      The chickadee says its own name: "chick-a-dee-dee-dee." On sunny late-winter days, listen for a clear whistled "fee-bee."'
  - - Look
    - '~ What is the color of the chickadee: Top and sides of head, back, wings, tail, throat, breast, under parts?

      ~ Does the chickadee usually alight on the ends of the branches or on the larger portions near the trunk of the tree?

      ~ How can you distinguish the chickadees from their companions, the nuthatches?'
  - - Brave little bird
    - '~ Does the chickadee ever seem discouraged by the snow and cold weather?

      On a cold day, watch how puffed-up its feathers are. That is its winter coat, like the hen''s down in Lesson I.'
  - - Put it into words
    - Ask your child to tell you how to know a chickadee by sight and by sound. Then share the leading thought.
  - - Nature notebook
    - Draw a chickadee hanging upside down from a twig, with its black cap and bib. Write its song the way your child hears it.
  practice: Keep the feeder going and count chickadees each day for a week. Try whistling "fee-bee" and see if one answers.
  tip: If you sit very still near a feeder with sunflower seeds on an open palm, chickadees sometimes land on your hand. It takes great patience.
  num: 13
  roman: XIII
  idx: 91
  unit: 2
- title: The downy woodpecker
  mins: 30
  goal: Your child can identify the downy woodpecker, tell a male from a female, and explain how its beak, tongue, feet and tail help it climb and find food.
  materials:
  - A suet feeder or a lump of beef fat on a tree trunk you can see from a window
  - Binoculars (optional)
  - Colored pencils (black, white, red)
  - Nature notebook
  book: The leading thought, the method (fasten beef fat to a tree that can be seen from the schoolroom) and ten questions about its colors and red patch, its notes and drumming, how it climbs and uses
    its tail and toes, its food and tongue, why it stays in winter, and its use to us. A long passage from John Burroughs about a downy drumming follows.
  steps:
  - - When and where
    - 'All year, but winter at a suet feeder is easiest. Listen in early spring for drumming: a fast rattle of taps on a dead branch. Downies live in town yards, parks and woods.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The downy woodpecker remains with us all winter, feeding upon insects that are wintering in crevices and beneath the bark of our trees.'
  - - Who has the red patch?
    - '~ What is the general color of the downy above and below?

      ~ Do all downy woodpeckers have the red patch at the back of the head? If not, why?

      Only the male has it. Count how many of each come to the feeder.'
  - - Watch it climb
    - '~ How does the downy climb a tree trunk? How does it descend? How do its actions differ from those of the nuthatch?

      ~ How does the downy use its tail to assist it in climbing? What is the shape of the tail and how is it adapted to assist?'
  - - Toes and tongue
    - '~ How are the woodpecker''s toes arranged to help it climb a tree trunk?

      ~ What does the downy eat and where does it find its food? Describe how it gets at its food.

      Look at a picture of a woodpecker''s foot: two toes forward and two back. Comstock''s story explains that its long tongue spears grubs under the bark.'
  - - Drumming
    - '~ What is the note of the downy? Does it make any other sound? Have you ever seen one drumming? At what time of the year? On what did it drum?

      If you have time, read aloud a little of the John Burroughs passage on the page, about a downy that "literally drummed up a mate".'
  - - Put it into words
    - 'Ask: Why does the downy not need to fly south for winter? Then share the leading thought.'
  - - Nature notebook
    - Draw a downy on a tree trunk, propped on its stiff tail, with the red patch if it was a male. Write the date and whether it was a male or female.
  practice: 'Comstock''s last question is a writing one: "How the downy builds its nest and rears its young." An older child can read about it and write a short paragraph.'
  tip: The hairy woodpecker looks almost the same but is bigger, with a much longer beak. If you see both at the feeder, compare beak length.
  num: 14
  roman: XIV
  idx: 94
  unit: 2
- title: The sapsucker
  mins: 25
  goal: Your child can find the neat rows of sapsucker holes on a tree and tell this woodpecker from the downy and hairy.
  materials:
  - 'A walk among trees: birches, maples, apple trees and pines are favorites'
  - Binoculars (optional)
  - A bird book or app with a picture of the yellow-bellied sapsucker
  - Nature notebook
  book: The leading thought, the method (begin with trees the sapsucker has attacked) and six questions about the rows of holes, whether they reach the wood, which trees are punctured, how to tell the sapsucker
    from other woodpeckers, its colors, and where it nests. A passage from John Burroughs about a sapsucker tapping a maple follows.
  steps:
  - - When and where
    - The holes can be found in any season. The yellow-bellied sapsucker nests in the North and in the mountains and passes through much of the eastern United States in spring and fall; in the West there
      are red-breasted and red-naped sapsuckers.
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The sapsucker has a red cap, a red bib and a yellow breast; it is our only woodpecker that does injury to trees.

      Today''s bird guides say sapsuckers usually do little lasting harm, though heavy drilling can hurt or kill a tree.'
  - - Look for holes
    - 'Comstock begins with the trees, not the bird.

      ~ Have you seen the work of the sapsucker? Are the holes drilled in rows completely around the tree? If there are two rows or more, are the holes set evenly one below another?

      ~ Do the holes sink into the wood, or are they simply through the bark?'
  - - Which trees?
    - '~ How many kinds of trees can you find punctured by these holes? Are they likely to be young trees?

      Keep a list. Feel the holes gently with a fingertip.'
  - - The bird itself
    - '~ How can you distinguish the sapsucker from the other woodpeckers?

      ~ What is the color of the sapsucker as follows: Forehead, sides of head, back, wings, throat, upper and lower breast

      Compare a picture of the sapsucker with your drawing of the downy.'
  - - The sap wells
    - 'Read aloud a little of the Burroughs passage: a sapsucker that tapped a maple "in fifty-six places" and came back on sunny days to sip. Ask: Why does the bird want the sap? What else might come to
      sip at the holes? (Hummingbirds and insects do.)'
  - - Put it into words
    - Ask your child to tell how they would know a sapsucker has visited a tree. Then share the leading thought.
  - - Nature notebook
    - Draw a section of tree bark with the rows of holes, life size if you can. Write the kind of tree and where it was.
  practice: Look for sapsucker holes on every walk this month and add each new tree to the list.
  tip: Don't pick at the bark around the holes. The wells are the bird's, and sticky sap can bring stinging insects in warm weather; look from a step back.
  num: 15
  roman: XV
  idx: 97
  unit: 2
- title: The red-headed woodpecker
  mins: 25
  goal: Your child can tell the red-headed woodpecker from the downy by its all-red head, and describe how it catches insects and stores food.
  materials:
  - Binoculars
  - A bird book or app with a picture and the call of the red-headed woodpecker
  - Colored pencils (red, black, white)
  - Nature notebook
  book: The leading thought, the method (questions on the blackboard and a prize for the first note on where the red-head stores his winter food) and four questions about its colors, nest and eggs, food
    and food stores, and its note and drumming. A long passage by John Burroughs about woodpeckers drumming in spring follows.
  steps:
  - - When and where
    - 'Spring through fall, in open country with scattered big trees: farm edges, open woods, parks, golf courses. In fall and winter look in oak woods, where they store acorns. Red-headed woodpeckers are
      scarcer than in Comstock''s day, so if you don''t find one, use a bird book or app and look for any woodpecker drumming.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The red-headed woodpecker has very different habits from the downy and is not so useful to us. It lives upon nuts and fruit and such insects as it can catch upon the wing.'
  - - Find it, or picture it
    - '~ Can you tell the red-head from the other woodpeckers? What colors especially mark his plumage?

      The whole head is red, the back is dark, and there are big white patches on the wings. Compare it with your downy drawing from Lesson XIV.'
  - - What does it eat?
    - '~ What have you observed the red-head eating? Have you noticed it storing nuts and acorns for the winter? Have you noticed it flying off with cherries or other fruit?

      Comstock offered a prize to the first child who found where a red-head hid its winter food. Make it a family challenge.'
  - - Drumming
    - '~ What is the note of the red-head? Have you ever seen one drumming? What did he use for a drum? Did he come back often to this place to make his music?

      Read aloud a little of the Burroughs passage, where he says the downy "is rapping at the door of spring."'
  - - Nest
    - '~ Where does the red-head nest? Describe eggs and nest?

      Comstock''s teacher''s story says it digs a hole in a tree, a stump or even a telegraph pole. Watch nests only from a distance, never touch or take a nest or eggs (that is against the law for most
      wild birds in the United States), and back away if the parents scold.'
  - - Put it into words
    - Ask your child how the red-head lives differently from the downy. Then share the leading thought.
  - - Nature notebook
    - Draw a red-headed woodpecker beside a downy, both in color. Label one difference in looks and one difference in habits.
  practice: On still spring mornings, listen for drumming and try to find the drummer.
  tip: Comstock calls this bird less useful than the downy. Bird lovers today value every native woodpecker, and the red-head is one many people work to protect.
