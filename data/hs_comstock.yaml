- title: The trillium
  mins: 30
  goal: Your child counts the threes in a trillium (leaves, sepals, petals), compares two kinds if possible, and learns why we never pick them.
  materials:
  - Nature notebook, pencil and colored pencils
  - A hand lens (magnifying glass)
  - Colored pencils
  book: 'A Teacher''s Story about trilliums, the “wood lilies” or wake-robins, with a photograph of the purple trillium, and the lesson: Leading thought, Method and seven questions.'
  steps:
  - - When and where
    - 'Trilliums bloom from about April to early June in rich, shady woods. White and purple (red) trilliums are the most common in the East.

      Before you go, make sure your child can spot poison ivy: three leaflets on each leaf ("leaves of three, let it be"), often climbing as a hairy vine or growing as a low patch.'
  - - The leading thought
    - ~ The trilliums are lilies, and are often called wood lilies, because of their favorite haunts. There are several species, but they are all alike in that they have three sepals, three petals and three
      leaves.
  - - Look, don't pick
    - 'Comstock''s method has children bring trilliums to school. Please don''t pick them: a trillium''s leaves feed the root for next year, and a picked plant may not bloom again for years. In some places
      they are protected. Study them where they grow.'
  - - Count the threes
    - '~ How many leaves has the trillium? How are they arranged? Draw a leaf showing its shape and veins.

      ~ Does the flower stand upright or droop?

      Count the sepals (green), the petals (white or purple) and the leaves. Then look in the middle with the lens: are there 6 stamens? 3 stigmas?'
  - - Insects and colors
    - '~ What insects do you find visiting the trilliums?

      ~ How does the color of the white trillium change as the blossom matures?

      ~ Do the flowers remain open during cloudy days and nights?

      The white trillium often turns pink as it ages. If you find a purple one, notice its smell (gently): Comstock asks how the purple and white differ in odor.'
  - - Nature notebook
    - Draw a trillium from above to show the pattern of threes. Label leaf, sepal and petal. Wash hands when you come in.
  practice: Return in late summer to see the berry. Comstock asks what color and shape the fruit of each kind is. Look only; never taste any part of a wild plant, berry or seed.
  tip: After a walk through woods or tall plants, check everyone for ticks.
  answers: Three leaves, three sepals, three petals. The white trillium turns pinkish as it ages.
