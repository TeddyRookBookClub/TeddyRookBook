- title: The canary and the goldfinch
  mins: 35
  goal: Your child can compare a pet canary with the wild goldfinch, its close relative, in color, beak, song and habits.
  materials:
  - A canary to watch (a friend's pet or a pet store), or good pictures and a recording of its song
  - A thistle or nyjer seed feeder, or a patch of thistles, sunflowers or coneflowers where goldfinches feed
  - Binoculars (optional)
  - Colored pencils (yellow and black!)
  - Nature notebook
  book: The leading thought and method, then seventeen questions about canaries (temper, song, colors, seeds and beak, cuttlebone, drinking, eyes, feet, sleep and bath, nesting) and a second short lesson
    on the goldfinch, with six questions on its feeding, colors, song, flight, winter coat and late summer nest.
  steps:
  - - When and where
    - 'Goldfinches are easiest to see from midsummer into early fall, in flocks wherever thistles and sunflowers go to seed. A feeder of nyjer seed brings them most of the year. A canary can be watched
      at a pet store or a friend''s house in any season. Comstock''s goldfinch lesson is meant for summer: she gave the questions in June and collected answers in the fall.'
  - - Keep the big idea in mind
    - 'Read these to yourself:

      ~ The canary is a very close relative of the common wild goldfinch. If we compare the habits of the two we can understand how a canary might live if it were free.

      ~ Goldfinches are seen at their best in late summer or September when they appear in flocks wherever the thistle seeds are found in abundance.'
  - - Watch the canary
    - '~ Which one is the singer? Does the other one ever attempt to sing? What other notes do the canaries make besides singing?

      ~ Does the singer have more than one song? How does he act while singing?

      ~ What does the canary do to the seeds before eating them? What tools does he use to take off the shells?'
  - - Beak and feet
    - '~ Notice the shape of the canary''s beak. Is it long and strong like a robin''s? Is it wide and sharp so that it can shell seeds?

      ~ Note the arrangement of the toes when the bird is on its perch. Is the hind toe longer and stronger? If so, why?'
  - - Find the goldfinches
    - 'Go to the feeder or the seed heads and watch quietly.

      ~ Where do you find the goldfinches feeding? How can you distinguish the father from the mother birds and from the young ones in color?

      ~ Describe the peculiar flight of the goldfinches. Do they fly high in the air? Do you see them singly or in flocks usually?

      Goldfinches fly in deep dips, up and down, like a roller coaster.'
  - - Song and season
    - '~ Do you know the song of the goldfinch? Is it like the song of the canary? What other notes has the goldfinch?

      ~ At what time of year do the goldfinches build their nests? Why do they build these so much later than other birds?

      Goldfinches nest in mid to late summer, when thistle down and seeds are ready. Look but don''t go near a nest.'
  - - Put it into words
    - Ask your child how a canary and a goldfinch are alike and how they are different. Then share the leading thought.
  - - Nature notebook
    - Draw a male goldfinch in color, with his black cap, black wings and bright yellow body. If you saw a canary, draw it beside him. Add the date and where you saw the goldfinch.
  practice: 'If you put up a nyjer feeder, watch the male goldfinch''s color through fall and winter. Comstock asks: "What change takes place in the coat of the male during the winter?"'
  tip: Comstock's canary questions are many. Choose a few for a pet-store visit and save the nesting ones; they only work for families who keep canaries.
  num: 9
  roman: IX
  idx: 74
  unit: 1
- title: The robin
  mins: 40
  goal: 'Your child keeps a spring robin diary: first robin, colors, song, how it hunts worms, and (from a distance) the building of a nest and the growth of the young.'
  materials:
  - A notebook set aside as a "robin book"
  - Binoculars (helpful for nest watching)
  - Colored pencils (brick red, gray, black, yellow)
  - A lawn, park or schoolyard where robins hunt
  book: 'The leading thought and a long method (a chart for little ones, a robin note-book for older children), then seven series of questions, a to g, given from March to summer: the first robin, colors,
    songs and calls, worm hunting, nest building, eggs and nestlings, fledglings, and summer habits.'
  steps:
  - - When and where
    - 'This is a whole-spring project. Comstock gives a new series of questions every week or two: series a in March, b and c in early April, d by the middle of April, e and f as eggs hatch, and g over
      the summer. Robins hunt on lawns and in parks almost everywhere. Use today''s session to start the robin book and do series a to c; come back for the rest.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ To understand all we can about the life and ways of the robin.

      Comstock wanted older children to keep their own robin note-book with a colored picture of a robin on the cover.'
  - - 'Series a: first robin'
    - '~ At what date did you see the first robin this year?

      ~ Where did the robin spend the winter; did it build a nest or sing when in its winter quarters?

      Write the date of your first robin on the first page of the robin book. (In some places robins stay all winter; they move about in flocks eating berries.)'
  - - 'Series b: colors'
    - 'Watch a robin on the lawn.

      ~ How large is the robin compared with the English sparrow?

      ~ What is the color of the beak? The eye? Around and above the eye?

      ~ What is the color of the tail feathers? Where is the white on them?'
  - - 'Series c: song and hunting'
    - '~ At what time of day does the robin sing? Is it likely to sing before a rain?

      ~ Does a robin run or walk or hop?

      ~ Describe how a robin acts as it pulls a big earthworm out of the ground.

      The best robin singing is very early in the morning.'
  - - 'Series d to f: the nest, from a distance'
    - 'When robins start building, find a nest you can see from a window or from well back.

      ~ At what date did your pair of robins begin to build their nest?

      ~ Where is the mud obtained and how carried to the nest?

      ~ What is the number and color of the eggs in the nest?

      Safety and kindness: never touch or climb to a nest, and stay far enough back that the parents keep feeding. Taking nests or eggs of wild birds is against the law in the United States. If the parents
      scold you, you are too close.'
  - - 'Series g: summer'
    - '~ Do the robins sing all summer? Why?

      ~ How does the robin help us?

      ~ Do you think the same robins come back to us each year?'
  - - Nature notebook
    - Color a robin for the cover of the robin book. After each visit, write the date and one or two answers. By summer your child will have the whole story of a robin family.
  practice: Give one series of questions every week or two through April, May and June, as Comstock did.
  tip: If a fledgling robin is hopping on the ground in early summer, leave it. Its parents are nearby and still feeding it.
