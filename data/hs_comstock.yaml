- title: Geese
  mins: 30
  goal: Your child can compare a goose with a duck (beak, neck, feet, walk) and describe how geese guard and lead their goslings.
  materials:
  - 'A place with geese: a farm with domestic geese, or a park pond with Canada geese'
  - Nature notebook and pencil
  book: 'The leading thought, the method (only where geese can be observed; a few questions at a time) and fourteen questions in two parts: the goose''s beak, neck, plumage, wings, legs and feet and the
    domestic breeds; then habits of geese: food, mating for life, nest and goslings, fighting, preening, goose language, intelligence, and a theme on the Canada goose.'
  steps:
  - - When and where
    - 'Any season. Comstock says not to give this lesson unless there are geese the child can watch. Canada geese live on park ponds across the country, with goslings in spring. A farm or fair with domestic
      geese works too.

      Safety: geese, especially parents with goslings, hiss and bite. Stay well back, never get between a goose and its young, and don''t feed them bread.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ Geese are the most intelligent of the domesticated birds, and they have many interesting habits.'
  - - Goose and duck
    - '~ What is the chief difference between the appearance of a goose and a duck? How does the beak of the goose differ from that of the duck in shape and in texture?

      ~ What is the difference in shape between the neck of the goose and that of the duck?'
  - - Feet and walk
    - '~ Does the goose waddle when walking or running as a duck does? Why? Does a goose toe-in when walking? Why?

      ~ When the goose is swimming forward where are her feet?

      Look for goose tracks in the mud and compare them with the duck tracks from Lesson VI.'
  - - Family life
    - '~ What care do the parents give to their goslings? Describe how the parents take their family afield.

      ~ At what time of year do geese mate? Does a pair usually remain mated for life?'
  - - Goose language
    - '~ How much of goose language do you understand? What is the note of alarm? How is defiance and distrust expressed? How does a goose look when hissing?

      If a goose lowers its head and hisses, that is a warning: back away.'
  - - Put it into words
    - Ask your child how a goose family stays safe. Then share the leading thought.
  - - Nature notebook
    - Draw a goose and a duck side by side, showing the different necks, beaks and feet. Add goslings if you saw them.
  practice: 'For an older child, Comstock suggests a theme: "The Canada Goose, its appearance, nesting habits, and migrations." Listen in fall and spring for V-shaped flocks honking overhead.'
  tip: 'Safety: poultry can carry germs even when they look clean and healthy. Wash hands with soap and water after touching a bird or anything in its pen.'
