- title: The brook trout
  mins: 30
  goal: Your child can describe the brook trout's colors and markings, the cold clean water it needs, and why fishing laws protect it.
  materials:
  - A visit to a state fish hatchery, nature center or public aquarium with trout; or a cold, clear stream
  - Polarized sunglasses
  - Colored pencils (olive, red, blue, cream)
  - Nature notebook
  book: The leading thought (trout have been lost from streams because game laws were not kept), the method (a trout in a running-water aquarium; a lesson in its protection) and ten questions about where
    trout live, how they hide, bait and food, colors and markings, fins including the little fin behind the dorsal, eyes, nests and eggs, why trout have vanished from local streams, the game laws, and a
    story to write.
  steps:
  - - When and where
    - 'Any season at a fish hatchery; many states have hatcheries open to visitors where you can see trout of every size. In the wild, brook trout live in cold, clean, shaded streams. Watch from the bank
      quietly. Safety: an adult stays within arm''s reach near any water. Stay off steep or slippery banks and never wade in fast water.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The brook trout have been exterminated in our streams largely because the game laws have not been observed. The trout is the most cunning and beautiful of our common fishes

      Comstock says the object is "not only the study of the habits of the fish, but also a lesson in its preservation."'
  - - Where trout live
    - '~ In what streams are the brook trout found? Must the water be warm or cold? Can the trout live in impure water?

      ~ Do the trout swim about in schools or do they live solitary? Where do they like to hide?

      Look for undercut banks, logs and deep shady pools.'
  - - Colors
    - '~ What is the color of the trout above? What colors along its sides? What markings make the fish so beautiful?

      Brook trout have wavy pale marks on the back and red spots with blue rings on the sides.'
  - - Fins
    - '~ Describe the little fin behind the dorsal. Why is it unlike the other fins?

      ~ What colors on the ventral fins

      Look for white front edges on the lower fins.'
  - - Laws and care
    - '~ What are the game laws concerning trout fishing? When is the open season? How long must the trout be to be taken legally? If you are a good citizen what do you do about the game laws?

      Look up your state''s fishing rules together. Ask: Why might a law say small trout must be put back?'
  - - Put it into words
    - Ask your child what a trout needs to live, and what people can do to help. Then share the leading thought.
  - - Nature notebook
    - Draw a brook trout in color with its spots and its white-edged fins. Under it, write one thing trout need to live.
  practice: Comstock's last question asks children to write a story about the trout's "wariness, cunning and strength." An older child can write a short one.
  tip: If you fish with your child, follow the season and size rules and learn to release fish gently with wet hands.
