    - '~ How many seeds in each chamber in the cotton boll? Where on the seed does the cotton grow?

      ~ Of what use to the wild cotton plant are seeds covered with cotton?

      Pull the fiber gently off one seed. Look at the seed with the lens. Comstock also asks children to taste the sweet nectar in little pits on the leaves; skip that and just watch which insects come
      to them.'
  - - History
    - '~ “How the cotton plant has affected American history.”

      For an older child: before 1865, most Southern cotton was grown and picked by enslaved people, and the spread of cotton farming went hand in hand with the spread of slavery that divided the country
      before the Civil War. Find the cotton-growing states on the map.'
  - - Nature notebook
    - Draw an open boll with its fluffy locks, and one seed with fibers attached. Twist a few fibers between your fingers to make a tiny thread and tape it on the page.
  answers: The cotton grows as hairs from the seed coat. In the wild, the fluff helps the seeds float on the wind or water to new places.
