  goal: Your child discovers how a weak-stemmed vine climbs, which way it twines, and what happens to the plant it climbs on.
  materials:
  - Nature notebook, pencil and colored pencils
  - A hand lens (magnifying glass)
  - A twist tie or yarn
  - A small stake or stick to push into the ground
  book: 'A Teacher''s Story with a drawing of hedge bindweed and the lesson: Leading thought, Method and ten questions.'
  steps:
  - - When and where
    - Hedge bindweed blooms through summer on fences, hedges and tall weeds, with white or pink trumpet flowers like a morning-glory.
  - - The leading thought
    - ~ There are some plants which have such weak stems that they are obliged to cling to objects for support. The bindweed is one of these, and the way that it takes hold of objects and grows upon them
      is an interesting story.
  - - How does it climb?
    - '~ How does the bindweed get support, so that its leaves and its flowers may spread out in the sunshine? Why does its own stem not support it?

      ~ How does it climb upon other plants? Does its stem always wind or twist in the same direction?

      Have your child trace a coil with a finger. Does it go around like a clock''s hands, or the other way? Check several vines.'
  - - A twining experiment
    - 'Push a stick into the ground next to a loose bindweed tip and lean the tip against it. Mark the spot with a twist tie. Check every day for a few days: how long until it wraps around? Which way does
      it go?'
  - - Leaves and flower
    - '~ Look at the leaves. Sketch one, to be sure that you see its beautiful form and veins.

      ~ Examine the flower in blossom. What is its shape? Describe its colors.

      ~ What insects do you find visiting bindweed flowers? Do the flowers remain open at night or on dark days?'
  - - The plant underneath
    - '~ Make a study of the plant on which the bindweed is climbing, and tell what has happened to it.

      ~ Compare the bindweed with the morning-glory, and notice the differences and resemblances.'
  - - Nature notebook
    - Draw the vine coiling up its support with an arrow showing the direction of twist, and one arrow-shaped leaf. Bindweed and morning-glory seeds are poisonous; never taste any part of a wild plant,
      berry or seed.
  practice: Look for other twining plants (pole beans, morning-glories, hops). Do they all twist the same way?
