- num: 186
  roman: CLXXXVI
  idx: 745
  unit: 27
  title: Molds
  mins: 30
  goal: Your child sets up a safe sealed mold experiment and finds out which conditions mold likes best.
  materials:
  - 4 squares of bread (bakery or homemade bread molds fastest)
  - Zip-top sandwich bags and tape
  - A permanent marker
  - A few drops of water
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson describes an experiment with bread squares kept moist or dry, in a warm dark place or a sunny dry place, and fruit juice with and without dust, then eight observations on when and how
    the mold grows.
  steps:
  - - The leading thought
    - ~ The spores of mold are everywhere and help to make what we call dust. These spores will grow on any substance which gives them nourishment, if the temperature is warm, the air moist and the sunlight
      is excluded.
  - - Set up the experiment
    - 'Follow the book''s plan, but seal each piece in its own zip bag instead of covering it with a tumbler:

      ~ Use four pieces of bread cut in about two-inch squares, each placed on a saucer; moisten two and leave the other two dry.

      Touch each piece lightly with a fingertip of dust from a shelf. Seal and label each bag. Put one moist and one dry piece in a warm, dark cupboard, and one of each on a sunny windowsill.'
  - - Safety rules for mold
    - The bags stay closed for the whole experiment, and in the end they go into the trash still sealed. We don't open them or sniff them, because mold spores can make people sick or set off asthma and
      allergies. If anyone in the family has those, keep the bags well away from them.
  - - Check every two or three days
    - 'Look through the bag with the hand lens.

      ~ When does the mold begin to appear? Which piece of bread showed it first? Describe the first changes you noticed. What is the color of the mold at first?

      ~ Did the mold fail to appear on any of the pieces of bread? If so, where were these placed? Were they moist? Were they exposed to the sunlight?'
  - - Colors and kinds
    - ~ Did more than one kind of mold appear on the bread? If so, how do you know that they are different kinds? Are there any pink or yellow patches on the bread? If so, these are made by bacteria and
      not by mold.
  - - Sum it up
    - '~ From the results of the experiments, describe in what temperature mold grows best. In what conditions of dryness or moisture? Does it flourish in the sunlight or in the dark?

      ~ Where does the mold come from? What harm does it do? What should we do to prevent the growth of mold?'
  - - What we know now
    - 'Molds are fungi, not plants. Some molds are useful: one of them gave us penicillin, the first great germ-fighting medicine. Store-bought bread often has ingredients added to slow mold, so it may
      take longer.'
  - - Nature notebook
    - Make a chart with a row for each bag and a column for each day you check. Draw what you see. At the end, write one sentence on what mold likes.
  practice: Check the bags every two or three days for about two weeks, then throw them away sealed.
  answers: Mold grows best on the moist bread in the warm, dark place; it grows little or not at all on dry bread and in sunlight. Its spores float in the air and dust everywhere. Keep food cool, dry and
    covered, and eat it before it spoils.
- num: 187
  roman: CLXXXVII
  idx: 747
  unit: 27
  title: Bacteria
  mins: 35
  goal: Your child sees for themselves that washing hands with soap removes germs, and can explain the book's everyday rules for cleanliness.
  materials:
  - 1 packet of plain, unflavored gelatin and 2 clean small plates or shallow dishes
  - Plastic wrap and tape
  - A slice of boiled potato in a zip bag
  - A permanent marker
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson gives three experiments (bacteria from moldy bread grown in boiled milk, a soiled and a washed finger on gelatin plates, and a slice of potato left open to dust), then thirteen questions
    about cleanliness and health.
  steps:
  - - The leading thought
    - ~ Bacteria are such small plants that we cannot see them without the aid of a microscope, but they can be planted and will grow. The object of this lesson is to enforce cleanliness.
  - - A safety change
    - 'The book''s Experiment A grows bacteria from colored spots on moldy bread in bottles of milk. We skip it: we don''t know what those bacteria are, and growing millions of them at home isn''t safe.
      We do the other two experiments, sealed, and throw them away without opening.'
  - - The finger test (Experiment B)
    - 'An adult makes the gelatin with boiling water as the box says, unsweetened, and pours a thin layer into two clean dishes. When cool and set:

      ~ let one of the children touch lightly the gelatin in one saucer for a few seconds with his soiled finger.

      ~ Ask him to wash his hands thoroughly with soap and then apply a finger to the surface of the gelatin in the other plate.

      Cover each dish tightly with plastic wrap, tape it, label it and keep both in a dark cupboard.'
  - - The potato (Experiment C)
    - Leave a slice of boiled potato on a plate uncovered for an hour, then seal it in a zip bag with the date. Keep it in a cool, darkish place.
  - - Look each day
    - '~ Can you see that the gelatin is becoming clouded where the soiled finger touched it? This is a growth of the bacteria which were on the soiled finger.

      ~ What change has taken place in the appearance of the slice of potato? Are there any spots growing upon it?

      Look through the plastic only. After a week, throw everything away sealed.'
  - - Talk it over
    - 'Ask a few of the book''s questions and let your child explain each from what they saw:

      ~ Why should the hands always be washed before eating?

      ~ Why should the finger nails be kept clean?

      ~ Why should wounds be carefully cleansed and dressed at once?

      ~ Why is a damp cloth better than a feather duster for removing dust?'
  - - What we know now
    - Bacteria are not plants; they are tiny one-celled living things in a group of their own. Most bacteria are harmless, and many are helpful, like the ones that make yogurt and cheese and the ones living
      in our own bodies. Only some cause sickness, and soap and water wash most of them away.
  - - Nature notebook
    - Draw the two gelatin dishes on day 1 and day 4, labeled "dirty finger" and "washed finger." Write the rule you learned in your own words.
  answers: The gelatin touched by the unwashed finger grows cloudy spots of bacteria; the washed finger leaves few or none. Hands carry germs to the mouth, so we wash before eating; dirty nails hide germs;
    wounds are cleaned so germs can't grow in them; a damp cloth picks dust up instead of throwing it into the air.
- num: 188
  roman: CLXXXVIII
  idx: 755
  unit: 28
  title: 'Tree study: adopting a tree for a year'
  mins: 40
  goal: Your child adopts one tree, describes it carefully, and measures its girth, its thickness and its height by its shadow.
  materials:
  - A tape measure (a cloth sewing tape is fine)
  - A yardstick or a stick exactly 3 1/2 feet long
  - A nature notebook and a pencil (colored pencils if you have them)
  - Crayons or watercolors
  - A calculator if you like
  book: 'This lesson is a set of questions for following one tree through the year: Autumn Work, Winter Study and Spring Work, ending with how to measure a tree''s height by its shadow and its thickness
    from its girth.'
  steps:
  - - Choose your tree
    - 'Begin in autumn. Walk around and let your child pick one tree to visit all year: in the yard, on the street or in a park. Give it a name in the notebook, and its kind if you know it.'
  - - Autumn questions
    - '~ What is the color of the tree in its autumn foliage? Sketch it in water colors or crayons, showing the shape of the head, the relative proportions of head and trunk.

      ~ What is the color of the bark? Is the bark smooth or rough? Are the ridges fine or coarse? Are the furrows between the ridges deep or shallow? Of what use is the bark to the tree?

      ~ As the leaves begin to fall, can you find two which are exactly the same in size and shape?'
  - - How thick is it?
    - 'Measure around the trunk three feet from the ground. The book says:

      ~ To find the thickness of the trunk, divide the circumference just found by 3.15.

      Today we use 3.14 (the number pi), but the answer comes out almost the same. Work it out together.'
  - - How tall is it?
    - 'On a sunny morning, push the 3 1/2-foot stick into the ground so 3 feet stand up. Right away, measure the stick''s shadow and the tree''s shadow. The book''s example:

      ~ Supposing that the shadow from the stick is 4 feet long and the shadow from your tree is 80 feet long, then your example will be: 4 ft.:3 ft.:: 80 ft.:? Which will make the tree 60 feet high.

      In plain words: the tree is as many times taller than the stick as its shadow is longer than the stick''s shadow.'
  - - Plans for winter
    - 'Read a few winter questions to look forward to:

      ~ If we place a nail in a tree three feet from the ground this winter, will it be any higher from the ground ten years from now?

      (Just think about it; don''t hammer a nail into your tree.) In February you will bring in a twig, put it in water, and watch the buds open.'
  - - Plans for spring
    - '~ At what date do the young leaves appear upon your tree? What color are they?

      ~ What birds do you find visiting it? What insects? What animals seek its shade?'
  - - Nature notebook
    - 'Start a "My Tree" page: a sketch of the whole tree, a leaf or a leaf rubbing, a bark rubbing (paper on the bark, rub with the side of a crayon), the date, the girth, the thickness and the height.'
  practice: Visit the tree once a month. Each season, add a new sketch and answer that season's questions from the book page.
  tip: Making a leaf print or rubbing of the two leaves that differ most is a quick way to see how much leaves on one tree can vary.
  answers: 'Book example: 4 : 3 = 80 : 60, so the tree is 60 feet tall. Thickness = girth divided by 3.14; for example, a 63-inch girth means a trunk about 20 inches through. A nail will not move higher:
    trees grow taller only at the tips of their twigs, and grow thicker by adding a ring of wood each year.'
- num: 189
  roman: CLXXXIX
  idx: 757
  unit: 28
  title: How to make leaf prints
  mins: 35
  goal: Your child makes clear, labeled leaf prints and starts a portfolio of the trees in the neighborhood.
  materials:
  - Water-washable block-printing ink (in place of the book's printer's ink)
  - Two small rubber rollers (brayers)
  - A smooth baking sheet or plastic cutting board to roll ink on
  - Smooth paper
  - Fresh leaves from several trees
  - Old newspapers and paper towels
  book: This is a how-to lesson rather than an observation lesson. It lists the materials, explains how to ink a leaf and print both sides at once, and how to soften dry leaves.
  steps:
  - - Why make prints?
    - 'Read the book''s reason:

      ~ Although the process is mechanical, yet the fact that every print must be correctly labeled makes for useful knowledge.'
  - - A safety change
    - The book thins its ink with kerosene and cleans up with benzine, which can catch fire easily. We use water-washable printing ink (or thick poster paint) and clean up with soap and water instead.
  - - Ink the leaf
    - '~ To make a print, place a few drops of ink upon the glass or slate, and spread it about with the roller until there is a thin coat of ink upon the roller and a smooth patch in the center of the
      glass or slate.

      Lay the leaf on the inky patch and roll over it until the veins are filled.'
  - - Print both sides at once
    - 'Put the inked leaf between two sheets of paper and roll once with the clean roller, pressing hard.

      ~ Two prints are made at each rolling, one of the upper, and one of the under side of the leaf.

      Roll only once. The book warns that a second pass blurs the print.'
  - - Label every print
    - Write on each print the tree's name, the place, the date, and "upper side" or "under side." If you don't know the tree's name, write a description and look it up together later.
  - - Dry leaves
    - If a leaf is dry and curled, soak it in water, blot it between paper towels, and then ink it, as the book suggests.
  - - Nature notebook
    - Choose your two best prints and put them in the notebook. Ask your child which is clearer, the upper or the under side, and why. (The veins usually stand out more on the under side.)
  practice: Add a print each time you meet a new kind of tree. By next summer you will have a portfolio of the trees of your neighborhood.
  tip: Thin ink makes clear prints. If the veins blur, use less ink.
- num: 190
  roman: CXC
  idx: 764
  unit: 28
  title: The sugar maple
  mins: 35
  goal: Your child can describe the sugar maple's shape, leaves, keys and colors, and explain when and why the sap runs.
  materials:
  - A maple tree to visit
  - Some maple keys (seeds)
  - A tape measure
  - A nature notebook and a pencil (colored pencils if you have them)
  - Crayons or watercolors
  book: 'The lesson has a leading thought and fourteen observations arranged as Fall Work, Winter Work and Spring Study: the tree''s shape, its keys, its leaves, autumn colors, buds and bark, sap and sugar-making,
    flowers and wood.'
  steps:
  - - When and where
    - Begin in the fall and come back in winter and spring. The book says to study the tree out of doors and bring leaves, flowers and keys inside. Sugar maples line many streets and farm lanes.
  - - The leading thought
    - ~ The sugar maple grows very rapidly, and is therefore a useful shade tree. Its wood is used for many purposes, and from its sap is made a delicious sugar.
  - - The tree
    - '~ Where is the maple you are studying? Is it near other trees? What is the shape of the head?

      ~ Can you tell by the shape of the tree from which direction the wind blows most often?'
  - - Maple keys
    - '~ Can you find seeds on your tree? Each pair of seeds is called a key. Sketch a key, showing the way the seeds are joined and the direction of the wings.

      ~ How far will a maple key fly on its wings? Plant a maple seed where you can watch it grow next year.

      Drop keys from a height (a stair landing, or held up high) and watch them spin. Measure how far they drift on a windy day.'
  - - Autumn colors
    - '~ Does your maple get its autumn colors all at once, or on one or two branches first?

      ~ If it is yellow this year do you think it will be red next year? Watch and see.'
  - - Sap and sugar (late winter)
    - '~ What kind of weather is the best for causing sap flow?

      ~ Why do we not make maple-sugar all summer?

      Visit a sugarbush or sugarhouse in March if one is near you. Tapping a tree is a job for an adult, on your own large maple only.'
  - - Nature notebook
    - Draw a key and a leaf (or make a leaf print). Write the date the first autumn color appears and the date the tree stands bare.
  practice: Come back in winter (bark, buds, shape) and in spring (flowers, new leaves), using the questions on the book page.
  tip: Sugar maple leaves have smooth, U-shaped notches between the lobes; red and silver maples have saw-toothed edges.
  answers: Sap runs best in late winter when nights freeze and days thaw. Once the buds open and the leaves come, the sap turns cloudy and less sweet, so sugar-making stops; the tree has not run out of
    sap.
- num: 191
  roman: CXCI
  idx: 770
  unit: 28
  title: The elm
  mins: 30
  goal: Your child can recognize an elm by its vase shape and its rough, lopsided leaves.
  materials:
  - An elm to visit, or elm leaves
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method that runs from autumn to spring, and eight observations on the elm's shape, leaves, color, roots and wood, other kinds of elms, birds, and its early flowers
    and seeds.
  steps:
  - - When and where
    - Begin in fall, when the tree is in autumn color, and sketch it again bare in winter. The book says the blossoms come in March and April and the seeds in May. Elms like moist ground.
  - - The leading thought
    - ~ The elm has a peculiarly graceful form, which makes it of value as a shade tree. It grows best in moist locations. Its wood is very tough.
  - - The shape
    - '~ What is the usual shape of the elm? How does the trunk divide into branches to make this shape possible?

      An old American elm looks like a vase or a fountain: the trunk splits into several big limbs that rise and arch outward.'
  - - The leaf
    - '~ Are the leaves rough above whichever way you stroke them? If a leaf is folded lengthwise are the two halves exactly alike?

      Look at the base of the leaf: one side starts lower on the stem than the other.'
  - - Birds and seeds
