- title: The shiner
  mins: 30
  goal: Your child can describe the shiner's shape, colors, lateral line and fins, and tell where shiners live in a stream.
  materials:
  - A small stream or pond edge with minnows
  - A small net and a clear container or white dishpan
  - A hand lens
  - Nature notebook
  book: The leading thought, the method (shiners and other small fish in the aquarium where pupils can see them often) and ten questions about how the shiner differs from minnow, chub and dace, its shape,
    colors, scales and lateral line, fins, eyes, nostrils, mouth and yawning, and where it lives. A poem by Keats about minnows follows.
  steps:
  - - When and where
    - 'Late spring through early fall, in clear, shallow streams and pond edges. Look for small silvery fish flashing in schools. Safety: an adult stays within arm''s reach near any water. Stay off steep
      or slippery banks and never wade in fast water.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The shiners are among the most common of the little fish in our small streams. They are beautiful in form and play an important part in the life of our streams.

      Comstock''s teacher''s story says shiners, chubs, dace and minnows are all one family, so this lesson works for any of them.'
  - - Watch in the stream
    - 'Stand still on the bank for a few minutes.

      ~ Where do you find the shiners living? Do they haunt the middle of the stream or the edges? Do you ever see them in flocks or schools?'
  - - A quick close look
    - 'If you catch a fish to look at, use a small net, keep it in a clear container of water from the same stream, in the shade, for no more than 10 to 15 minutes, then let it go exactly where you caught
      it. Wet your hands before touching a fish, or better, don''t touch it at all. Check your state''s rules first; some places need a fishing license even to net small fish.

      ~ What is the shape of the shiner''s body when seen from above? When seen from the side? Do you think that its shape fits it for moving rapidly through the water?'
  - - Colors and scales
    - '~ What is the coloring above? On the sides? Below?

      ~ Are the scales large and distinct, or very small? Can you see the lateral line?

      Use the hand lens to find the row of tiny dots along the side.'
  - - Fins and mouth
    - '~ Describe the use and movements of each of the fins when the fish is swimming.

      ~ Does the mouth open upwards, downwards or forwards? Have you ever seen the shiner yawn?'
  - - Let it go and tell back
    - Pour the fish gently back where you found it. Then ask your child to tell you what makes a shiner good at its life in the stream. Share the leading thought.
  - - Nature notebook
    - 'Comstock asks: "Describe or sketch the fish, showing position, relative size and shape of all the fins and the tail." Draw it, and color the silver sides and the darker back.'
  practice: Read the Keats poem on the page aloud together. Then go back to the stream and see if the minnows really do scatter when you hold out your hand.
  tip: A white dishpan with an inch of stream water makes small fish much easier to see than a jar.
