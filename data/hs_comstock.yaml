- title: Dutchman's breeches and squirrel corn
  mins: 30
  goal: Your child finds Dutchman's breeches in the spring woods, explains how its odd petals hide the nectar, and compares it with squirrel corn.
  materials:
  - Nature notebook, pencil and colored pencils
  - A hand lens (magnifying glass)
  book: 'A Teacher''s Story with a photograph of Dutchman''s breeches, or “boys and girls,” and a picture of squirrel corn, then the lesson: Leading thought, Method and nine questions.'
  steps:
  - - When and where
    - 'Comstock says Dutchman''s breeches blooms in April and May and squirrel corn in May and June. Both grow in rich woods, often on slopes, before the trees are fully in leaf.

      Before you go, make sure your child can spot poison ivy: three leaflets on each leaf ("leaves of three, let it be"), often climbing as a hairy vine or growing as a low patch.'
  - - The leading thought
    - ~ The Dutchman's breeches, or “boys and girls,” as it is often called, is one of the earliest flowers of rich woodlands. There are interesting differences between this flower and its close relative,
      squirrel corn.
  - - Find the breeches
    - '~ Where do you find Dutchman''s breeches? Which do you prefer to call these flowers, Dutchman''s breeches or boys and girls? Are there leaves on the trees when these flowers are in bloom?

      Have your child turn a flower gently (still on the plant) to see the two puffed-out “legs.” Those are two petals that hold the nectar at their tips.'
  - - Who gets the nectar?
    - '~ What insects visit these flowers? Describe how they get the nectar.

      The nectar is far up inside the legs. Only bees with long tongues reach it the proper way. Watch quietly for a few minutes.'
  - - The leaves
    - '~ Study the leaf. How many main parts are there to it? How are these parts divided?

      The leaves are lacy and blue-green, almost fern-like.'
  - - Compare with squirrel corn
    - '~ Which blossoms earlier in the season, Dutchman''s breeches or squirrel corn? How do the flowers of the two differ in shape?

      ~ Have you ever seen squirrels harvesting squirrel corn?

      Squirrel corn''s flowers are heart-shaped, not two-legged, and under the ground it has little yellow tubers like grains of corn. Look at Comstock''s drawing instead of digging.'
  - - Nature notebook
    - Draw one flower of Dutchman's breeches upside-down like a pair of pants on a clothesline, and a leaf beside it. If you found squirrel corn, draw it too. Both plants are poisonous to eat. Wash hands
      when you come in.
  practice: 'Come back in early summer: the leaves vanish by then. Comstock asks how these plants make enough food so early and get ready for next spring.'
  tip: These flowers are close relatives of the garden bleeding heart (Lesson CLIV); the bleeding heart is easier to study up close.
