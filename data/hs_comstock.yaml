  roman: VII
  idx: 67
  unit: 1
- title: Pigeons
  mins: 30
  goal: Your child can describe a pigeon's colors, walk, drinking and flight, and tell something about its nest and young.
  materials:
  - Pigeons to watch (a town square, park, train station or barn)
  - Binoculars (optional)
  - Colored pencils
  - Nature notebook
  book: The leading thought, the method (watch pigeons out of doors; begin with a story) and thirteen questions about colors, food, drinking, walking, flight, cooing, nest and eggs, how the parents share
    the work and feed the young, enemies, pigeon houses and breeds.
  steps:
  - - When and where
    - Any season. Pigeons live in almost every town and city. A park bench where they gather is perfect.
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The pigeons differ in appearance from other birds and also in their actions. Their nesting habits are very interesting and there are many things that may be done to make the pigeons comfortable.
      They were, in ancient days, used as letter carriers.

      Comstock suggests starting with a story. Tell your child that people once sent messages tied to a homing pigeon''s leg.'
  - - Name the colors
    - 'This is Comstock''s quick color drill, good training for watching wild birds:

      ~ let the pupils observe the pigeon and tell the colors of the beak, eyes, top of the head, back, breast, wings, tail, feet and claws.

      Do it fast, one part at a time, before the bird walks off.'
  - - Walking and drinking
    - '~ Describe the peculiar movement of the pigeon when walking.

      ~ Describe how a pigeon drinks. How does it differ in this respect from other birds?

      If you can, watch one at a puddle. A pigeon sucks water up without tipping its head back.'
  - - Flight and voice
    - '~ Describe the pigeon''s flight. Is it rapid, high in the air, do the wings flap constantly, etc?

      ~ Listen to the cooing of a pigeon and see if you can understand the different notes.'
  - - Nest and young
    - '~ Describe the pigeon''s nest. How many eggs are laid at a time?

      ~ How do the parents feed their young and on what material?

      You may see a nest on a ledge or under a bridge. Watch from a distance, and look it up in a bird book together if you can''t see one.'
  - - Put it into words
    - Ask your child to tell you three ways a pigeon is different from other birds. Then share the leading thought.
  - - Nature notebook
    - Draw a pigeon in color, using the colors your child named. Write one line about how it walked.
  practice: Watch a flock of pigeons take off together this week. Do they wheel and turn as one?
  tip: Pigeons are fine to watch but not to handle, and their droppings carry germs. Wash hands after sitting on park benches where pigeons gather.
