- title: The cat-tail
  mins: 30
  goal: Your child explains where cat-tails grow, how their leaves stand up to the wind, and how wind and water carry their pollen and seeds.
  materials:
  - Nature notebook, pencil and colored pencils
  - A hand lens (magnifying glass)
  - Rubber boots
  - A ruler
  book: 'A Teacher''s Story with a photograph of cat-tails in blossom and the lesson: Leading thought, Method and nine questions, with a photograph of cat-tails sending off their seed balloons.'
  steps:
  - - When and where
    - 'Cat-tails grow in marshes and along the edges of ponds and ditches, where the soil is wet. Comstock says to study the flowers in the last half of June and the seeds in fall or winter.

      Water safety: an adult stays right beside children at any pond or stream. Stay on the bank, a dock or solid ground; pond bottoms are soft and can be deeper than they look.'
  - - The leading thought
    - ~ The cat-tail is adapted to places where the soil is wet but not under water; its pollen is scattered by the wind, and its seeds are scattered by wind and water. Its leaves and stalks are not injured
