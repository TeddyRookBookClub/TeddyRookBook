  title: The fruiting of the fern
  mins: 35
  goal: Your child finds the spore dots on a fern, makes a spore print, and can tell a few ferns apart by the way they cover their spores.
  materials:
  - A fern frond with brown dots on its back (June to September)
  - A sheet of white paper
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  - A heavy book and newspaper, for pressing a frond
  book: 'The Teacher''s Story on the fern ends just before the lesson. The lesson gives the leading thought, a method for July or for June and September, and seven observations: a spore print, spore-cases
    under the lens, and a key to ferns by the shape of the spore "blanket."'
  steps:
  - - When and where
    - 'Go in summer. The book says July is best, or begin in June when the fruit dots are green and finish in September. Look in shady woods, along damp ravines and at the edges of wet meadows.

      Turn fern fronds over gently. You are looking for brown or green dots, lines or cups on the back. Pick only one or two fronds, from a place with plenty of ferns.'
  - - The leading thought
    - 'Read it aloud, or tell it in your own words:

      ~ Ferns do not have flowers, but they produce spores. Spores are not seeds; but they grow into something which may be compared to a true seed, and this in turn develops into young ferns.'
  - - Make a spore print
    - 'Start this first, because it takes a day or two. The book says:

      ~ Take a fern that is in fruit; lay it on a sheet of white paper and leave it thus for a day or two, where it will not be disturbed and where there is no draught; then take it up carefully; the form
      of the fern will be outlined in dust. What is this dust?

      Set it on a shelf away from fans and open windows.'
  - - Look through the lens
    - 'Hold a fruit dot under the hand lens. Ask:

      ~ Can you see with a lens many little, brown globules?

      ~ Can you see that some of them are torn open? These are the spore-cases, called sporangia, each globule being packed with spores.

      ~ Can you see how the sporangia are fastened to the leaf by little stems?'
  - - Who is this fern? The blanket key
    - 'Young spore-cases are covered by a tiny "spore-blanket," the indusium. The book uses its shape as a key. Read these and see which one matches your fern:

      ~ if it is cup-shaped, it is a boulder fern; if it breaks open and lays back in star shape, it is a woodsia; if the edge of the fern leaf is folded over all along its margin to protect the spore-cases,
      it is a bracken; if the tips of the scallops of the leaf be delicately folded over to make a spore blanket, it is the maidenhair.

      The full key on the book page also has the Christmas fern, the wood ferns, chain ferns, spleenworts and bladder ferns.'
  - - Ferns that change their leaves
    - 'Some ferns grow special fronds just for spores. If you find a sensitive, cinnamon, ostrich or interrupted fern, put a spore frond beside a green one.

      ~ compare carefully the fruiting with the sterile fronds, and note in each case the resemblance in branching and in pinnules

      Ask your child: Do they branch the same way, even though one looks withered?'
  - - What we know now
    - The book hints that a spore grows into "something which may be compared to a true seed." Today we know the spore grows into a tiny, flat, green heart-shaped plant, smaller than a fingernail, on damp
      soil. That little plant makes egg and sperm cells, and a new fern grows from it. Look for pictures of a "fern prothallus."
  - - Nature notebook
    - Draw one frond and, beside it, one fruit dot as it looks through the lens. When the spore print is ready, add it to the page (an adult can spray it lightly with hairspray so it does not smear), and
      write the date and place.
  practice: Press a fruiting frond under a heavy book between newspapers for a week, then mount it in the notebook with its name.
  tip: Fronds that are just turning brown give the best spore prints. Green dots are not ripe yet.
  answers: The dust is spores. Spores need dampness, some shade and soil to grow; they grow into tiny heart-shaped green plants, and the young fern grows from those.
