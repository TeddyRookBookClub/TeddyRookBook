- title: The cardinal grosbeak
  mins: 30
  goal: Your child can describe the red male and brownish female cardinal, their crest and heavy beak, and imitate the cardinal's whistled song.
  materials:
  - A seed feeder with sunflower seeds near shrubs, or a shrubby park
  - Binoculars (optional)
  - Red, brown and orange colored pencils
  - Nature notebook
  book: The leading thought, the method (field observation and discussion, to stir interest in protecting the bird; outline pictures to color) and seventeen questions about its names, size and shape, colors,
    other red birds, crest, beak, its mate, its song (and hers), nest and eggs, the father's care, fledglings, where it lives, food, and laws protecting it. A poem by W. S. Gallagher follows.
  steps:
  - - When and where
    - All year in the eastern and southern United States and the Southwest, and spreading north. Cardinals come to sunflower-seed feeders and live in thickets, hedges and gardens. Winter, when the red shows
      against snow and bare branches, is a good time.
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The cardinal is the most brilliantly colored of all our birds and because of its color and song, it has been destroyed by thousands as cage birds. We should seek to preserve it as a beautiful ornament
      to our groves and grounds.'
  - - Meet the cardinal
    - '~ Do you know the cardinal? Why is it so called?

      ~ How many names do you know for this bird?

      ~ Is the cardinal as large as the robin? Is it graceful in shape or stout?

      ~ Is there any color except red upon it? If so, where?'
  - - Crest and beak
    - '~ Describe the cardinal''s crest and how it looks when lifted. Why do you think it lifts it?

      ~ Describe its beak as to color, shape and size. What work is such a heavy beak made for?

      Watch it crack a sunflower seed.'
  - - His mate
    - ~ Is the cardinal's mate the same color as he? Describe the color of her head, back, wings, tail, breast.
  - - The song
    - '~ Can you imitate the cardinal''s song? What words do you think he seems to sing? Does his mate sing also? Is it usual for mother birds to sing?

      Many people hear "cheer, cheer, cheer" or "birdie, birdie, birdie." Female cardinals do sing, which is unusual.'
  - - Put it into words
    - Ask your child what is special about cardinals. Then share the leading thought.
  - - Nature notebook
    - 'Comstock had children color outline pictures of the cardinal. Draw and color your own: the male bright red with a black face, the female warm brown with red touches, both with crests and orange-red
      beaks.'
  practice: 'Comstock''s last question: "What do you know about the laws protecting the redbirds?" Today it is illegal to catch or keep a cardinal in the United States. Talk about why such laws were made.'
  tip: Cardinals visit feeders early in the morning and at dusk. That is the best time to watch.
