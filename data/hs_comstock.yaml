- title: The maize, or Indian corn
  mins: 40
  goal: 'Your child explains how a corn plant is built to stand up to the wind, and studies an ear of corn: husk, silk, cob and kernels.'
  materials:
  - Nature notebook, pencil and colored pencils
  - Two or three ears of fresh corn with husks (from a store, farm stand or garden)
  - A ruler
  - A cornstalk if you can get one
  book: 'A photograph of Seneca women husking corn, a Teacher''s Story about maize, and a long lesson: Leading thought, Method, twenty questions on the plant, the ear and its growth, and four experiments.'
  steps:
  - - When and where
    - Comstock says the study may begin when corn is planted in spring and continue through summer, or be done in autumn with a grown plant. Visit a cornfield only with the farmer's permission, or use a
