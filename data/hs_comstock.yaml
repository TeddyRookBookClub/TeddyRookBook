  title: The scarlet saucer
  mins: 20
  goal: Your child can find a scarlet cup fungus in early spring, describe it and try to catch its spores.
  materials:
  - A scarlet cup on its stick, if you find one
  - White paper
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'A short lesson: a lovely description of the little scarlet cups found on rotting sticks in early spring woods, then five observations.'
  steps:
  - - When and where
    - Early spring, about the time the first wildflowers (hepaticas) bloom and snow still lies on north slopes. Look on fallen, rotting sticks half buried in old leaves. Several may grow on one stick.
  - - Read the description
    - ~ The inside of the saucer is the most exquisite scarlet shading to crimson. This crimson lining bears the spores in little sacs all over its surface.
  - - Observe
    - '~ Where did you find the fungus?

      ~ What is the shape of the saucer? How large is it? Is it regular and beautiful or irregular and distorted?

      ~ What is the color inside?

      ~ What is the color outside?'
  - - A spore harvest
    - 'If you bring one home on its stick:

      ~ Turn the one you bring in bottom side up—that is, scarlet side down—on a piece of white paper, and see whether you can get a spore harvest.

      Afterward, put the stick back in the woods.'
  - - Nature notebook
    - 'Paint or color the saucer in its true red. Write the date: it tells you when spring has truly begun in your woods. Wash hands; fungi are not for tasting.'
- num: 184
  roman: CLXXXIV
  idx: 742
  unit: 27
  title: The morels
  mins: 20
  goal: Your child can describe a morel's honeycomb cap and hollow stem, and knows why we never eat a morel or any other wild fungus.
  materials:
  - A morel, if you find one (an adult picks it with gloves)
  - White paper
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'A short lesson on morels, found in May or June in orchards and damp fence corners, with four observations: the stem, the cap, the colors and a spore print.'
  steps:
  - - Safety and what we know now
    - The book says the morel family has no poisonous members, and tells when they may be eaten. That is not safe advice. "False morels" look much like morels and can be deadly, and even true morels make
      people sick when not cooked properly. In our house, we look, draw and print spores, and never eat.
  - - When and where
    - May or June, in open, damp places such as old orchards, moist fence corners and woods edges.
  - - Observe
    - '~ Where did you find the morels?

      ~ Describe the stem. Is it solid or hollow? Is it smooth or rough?

      Ask: What is the shape of the cap? What color is the outer edge of the network, and what color within the meshes?'
  - - Spore color
    - '~ Take one of these fungi, lay it on a sheet of white paper, and note the color of the spores.

      Cover it with a bowl overnight.'
  - - Nature notebook
    - Draw the cap's honeycomb pattern and a lengthwise view of the hollow stem (an adult can cut one in half). Wash hands well.
  answers: The spores are borne in the pits of the honeycomb. A true morel is hollow from cap to stem in one open chamber; this is one way experts tell it from false morels, but it is not a reason to eat
    one.
