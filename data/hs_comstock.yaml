    - 'Draw the four kinds of floret in a row and label them. Then start a week of daily notes on your whole sunflower: how far has the blooming ring moved today?'
  practice: Leave a ripe head outside in fall and keep a list of the birds that come to it. Goldfinches and chickadees are common visitors.
