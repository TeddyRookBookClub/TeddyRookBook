  steps:
  - - When and where
    - Begin in autumn when the cones are ripe, and come back in May when the tree blooms. Norway spruces are planted in yards, parks and windbreaks; look for long hanging cones and drooping twigs.
  - - The leading thought
    - ~ It grows naturally in high places and in northern countries where there is much snow; its drooping twigs cannot hold a great burden of snow, and thus it escapes being crushed.
  - - Shape and snow
    - '~ Do the lower branches rest upon the ground? What advantage would this be to the tree in winter?

      ~ Do the twigs stand out, or droop from the branches? Of what advantage is this in case of heavy snow?'
  - - Feel the needles
    - '~ Brush your hand along a branch toward the tip. Do the leaves prick? Brush from the tip backward. Is the result the same?

      Roll one needle between your finger and thumb. A spruce needle has four sides and rolls easily; a fir needle is flat and won''t roll.'
  - - The cone's spiral
    - '~ Note that the scales are set in a spiral around the center of the cone. Wind a string around a cone following the same row of scales.

      ~ Hang a closed cone in a dry place and note what happens.'
  - - Nature notebook
    - Draw a twig with its needles and a cone with one spiral row colored in. Write what happened to the hanging cone after a few days.
  answers: The lower branches spread on the snow and the drooping twigs let snow slide off. The needles point forward, so they don't prick when you brush toward the tip but do when you brush backward. The
    hanging cone dries and opens its scales, letting the winged seeds fall. The Norway spruce came from Europe.
- num: 204
  roman: CCIV
  idx: 825
  unit: 30
  title: The hemlock
  mins: 30
  goal: Your child can recognize a hemlock by its flat, short-stalked needles with two white lines beneath, and its tiny cones.
  materials:
  - A hemlock twig with cones
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought and seven observations on where the hemlock grows, its shape and bark, its leaves and their little stalks, its small cones and seeds, the birds it shelters and the
    uses of its bark and wood.
  steps:
  - - When and where
    - Any season. Hemlocks grow on cool, shady slopes and ravines, often near streams, and are planted as hedges. The drooping top leader is a good clue from a distance.
  - - Not poison hemlock
    - The hemlock tree is not the poison hemlock of old stories. That is a weedy plant in the carrot family, a different plant entirely. Still, we never eat wild plants.
  - - The leading thought
    - ~ This is one of the most common and useful and beautiful of our evergreen trees. Its fine foliage makes it an efficient winter shelter for birds
  - - The leaves
    - '~ How are the leaves arranged on the twigs? Are all the leaves of about the same size? What is the position of the smaller leaves?

      ~ Break off a leaf and describe its shape; its petiole. Does the leaf of any other evergreen have a petiole? What is the color and marking of the hemlock leaf above? Below?'
  - - The cones
    - '~ Are the hemlock cones borne on the tip of the twigs or along the side?

      ~ How many scales has it? Where are the seeds borne?'
  - - What we know now
    - In much of the eastern United States, hemlocks are being harmed by a tiny insect from Asia, the hemlock woolly adelgid. Look under the twigs for small white woolly tufts at the bases of the needles.
      If you find them, you have seen it.
  - - Nature notebook
    - 'Make the book''s drawings:

      ~ The hemlock twig, showing the arrangement of the leaves; single leaf, enlarged; cone; cone scale; seed.'
  answers: The flat needles spread in two rows along the twig, with a row of small ones lying on top. Each needle has a tiny stalk (petiole) and two white lines underneath. The cones are only about three-quarters
    of an inch long and hang from the twig tips. Its bark was once used for tanning leather.
- num: 205
  roman: CCV
  idx: 828
  unit: 31
  title: The dogwood
  mins: 25
  goal: Your child can show that the dogwood's "petals" are really bracts around a cluster of tiny true flowers.
  materials:
  - A dogwood branch in flower, with some unopened buds
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'The lesson has a leading thought and seven observations: the tiny flowers at the center, the four big white bracts with notched tips, how they are arranged, the young leaves, and the fruit and
    autumn color.'
  steps:
  - - When and where
    - Late April or May, when dogwoods bloom at the edges of woods and in yards. Bring in one branch that still has some unopened flower heads. Ask before cutting.
  - - The leading thought
    - ~ The petals are not the only means of attracting insects to the flowers. Sometimes other parts of the plant are made into banners to show insects where the nectar is to be found.
  - - The true flowers
    - '~ What is there at the center of the dogwood flower? How do the parts at the center look? Are they of the same shape? Are some opened and others not?

      Pick out one tiny flower with your fingernails or tweezers and look with the lens. Count its petals and stamens.'
  - - The banners
    - ~ How many of these flowers are there at the center of the dogwood "blossom?" What color are they? Would they show off much if it were not for the great white banners around them?
  - - The notch
    - '~ What is there peculiar about each one of these white bracts. Why should this notch be there?

      Look at an unopened head. What covers it?'
  - - Nature notebook
    - Draw the "blossom" with its four bracts and tiny flowers in the middle, then one tiny flower large. In the fall, come back to draw the red berries (for birds, not people).
  answers: The center holds a cluster of about twenty tiny greenish-yellow flowers, each with four petals, four stamens and a pistil. The four white "petals" are bracts. In winter they were the scales wrapping
    the flower bud, and the brown notch at each tip is the end that was exposed all winter.
- num: 206
  roman: CCVI
  idx: 831
  unit: 31
  title: The staghorn sumac
  mins: 30
  goal: Your child can recognize staghorn sumac by its velvet twigs, long leaves of many leaflets and red fruit "bobs," and can tell it from poison sumac.
  materials:
  - A staghorn sumac to visit
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  - Watercolors or crayons
  book: 'The lesson has a leading thought and ten observations: the velvet on the stems, the leaves and leaflets, the fruit "bob" and its seeds, winter branching, the two kinds of flowers in June, and how
    to tell this sumac from the smooth and the poison sumacs.'
  steps:
  - - Safety first, and when to go
    - 'Learn poison sumac (and poison ivy) before you go. Poison sumac grows in swamps and wet ground, has smooth-edged leaflets and loose, drooping clusters of whitish berries, and gives a bad rash. Staghorn
      sumac grows in dry, open places and has upright, fuzzy red clusters. The book asks children to taste a seed; we skip that.

      Begin in October when the leaves turn scarlet. Come back in winter to sketch the bare branches and red bobs, and in June for the flowers. Look along roadsides, fencerows and dry field edges.'
  - - The leading thought
    - ~ The sumac is a beautiful shrub in summer because of its fern-like leaves; it is picturesque in winter, and its colors in autumn are most brilliant. Its dark red fruit clusters remain upon it during
      the entire winter.
  - - The velvet
    - ~ Why is this called the velvet sumac? Why is it called the staghorn sumac? Look at the stems with a lens and describe the velvet. Can you tell this year's wood by the velvet?
  - - Leaves
    - '~ How many leaflets are there on the longest leaf which you can find? How many on the shortest?

      ~ Draw an entire leaf, and color it as exactly as possible.'
  - - The bob and the branching
    - '~ Study the fruit. Pick one of the bobs and note its general shape. Is it smooth or bunchy?

      ~ Study the sumac after the leaves have fallen and sketch it. What is there peculiar in its branching?'
  - - Tell them apart
    - ~ How can you tell the velvet or staghorn sumac from the smooth sumac? How can you tell both of these from the poison sumac?
  - - Nature notebook
    - Paint one autumn leaf in its true colors and sketch a bare winter branch with its bob, like a deer's antler in velvet.
  answers: The young twigs are covered with soft hairs like the velvet on a deer's new antlers, and the branches fork like antlers. Smooth sumac looks similar but its twigs have no hairs. Poison sumac grows
    in wet places, has smooth-edged leaflets and hanging clusters of whitish berries; staghorn and smooth sumacs have toothed leaflets and upright red clusters.
- num: 207
  roman: CCVII
  idx: 835
  unit: 31
  title: The witch-hazel
  mins: 30
  goal: Your child can describe the witch-hazel's autumn flowers and watch its nuts shoot their seeds.
  materials:
  - Witch-hazel twigs with closed brown nuts (fall)
  - A box or tray with sides
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method for the youngest children (twigs brought in to pop their seeds) and for older ones (the flowers), and ten observations on the shrub, its leaves and galls,
    its flowers, and its nuts and seeds.
  steps:
  - - When and where
    - October and November, when the yellow ribbon-like flowers open just as the leaves fall. Witch-hazel grows as a shrub or small tree at woods edges and along streams.
  - - The leading thought
    - ~ The witch-hazel blossoms during the autumn, and thus adds beauty to the landscape. It has an interesting mechanism by which it can shoot its seeds for a distance of many feet.
  - - Bring the nuts in
    - 'Gather a few twigs with closed nuts and lay them in a box with sides. Leave them indoors where it is warm and dry. The book promises: "Soon the seeds will be popping." Keep faces back from the nuts;
      the seeds fly hard.'
  - - The shrub and its leaves
    - '~ Is the witch-hazel a shrub or a tree?

      ~ Are the leaves regular in form, or larger on one side than the other?

      ~ Are there many queer-shaped little swellings on the leaf above and below? See how many of these you can find? Tell what you think they are.'
  - - The flowers
    - '~ What is the shape and color of the petals, and how many of them are there in each blossom?

      ~ With a lens observe the way the two little doors to the anther fly open'
  - - The seed gun
    - '~ Can you see that the shell, when partially open, ready to throw out the seeds resembles a queer little face?

      ~ How far have you known the witch-hazel to throw its seeds? Study the nut and try to discover how it throws the seeds so far.

      Measure from the box to where the seeds landed.'
  - - Nature notebook
    - Draw a flower with its four ribbon petals, and a nut open like a little face with its two black seeds. Record the longest seed throw.
  answers: Each flower has four long, narrow, yellow petals. The swellings are galls made by tiny insects. As the woody nut dries, its walls squeeze the slippery seeds until they shoot out, like a wet seed
    pinched between your fingers; they can fly many feet.
- num: 208
  roman: CCVIII
  idx: 837
  unit: 31
  title: The mountain laurel
  mins: 25
  goal: Your child can show how a laurel flower's spring-loaded stamens fling pollen onto a visiting bee.
  materials:
  - A laurel branch with buds and open flowers
  - A pencil
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought and ten observations on the leaves, the bud, the open flower with its ten pockets, the springing stamens, the pollen, the pistil and the fruit, ending with Theron
    Brown's poem "The Mountain Laurel."
  steps:
  - - Safety first
    - All parts of mountain laurel are poisonous if eaten. Look and touch only with a pencil, and wash hands after handling a branch. Ask before cutting one.
  - - When and where
    - Late May and June, in rocky woods and on hillsides. The book says any kind of laurel will do. You need buds and open flowers on the same branch.
  - - The leading thought
    - ~ The laurel blossom is set with ten springs, and each spring acts as a sling in throwing pollen upon visiting insects, thus making sure that the visitor will carry pollen to other waiting flowers.
  - - The bud and the flower
    - '~ Take a blossom bud. What is its shape? How many sides to the pyramid-like tip?

      ~ In the open blossom, what do you see of the ten ridges, or keels, which you noticed in the bud? How does each one of these grooves end? What does the laurel blossom keep in these ten pockets?'
  - - Spring the trap
    - '~ Touch one of the ten filaments with a pencil and note what happens.

      ~ Touch the filaments with a pencil and see how far they will sling the pollen.'
  - - Why?
    - '~ What is the use to the flower of this arrangement for throwing pollen? What insects set free the stamen-springs?

      ~ Would they be likely to throw their pollen on the stigma of their own flower?'
  - - Nature notebook
    - Draw an open flower from above showing the ten bent stamens tucked into their pockets. Then draw one stamen after it has sprung.
  answers: Each of the ten stamens has its anther tucked in a little pocket in the cup, and its stalk is bent like a bow. When a bee lands and jostles it, the stamen springs up and flings sticky threads
    of pollen onto the bee, which carries it to another flower. The stigma stands well above the anthers, so a flower seldom pollinates itself.
- num: 209
  roman: CCIX
  idx: 842
  unit: 32
  title: The brook
  mins: 40
  goal: Your child can follow a brook toward its source and explain how running water carries soil away and wears its banks.
  materials:
  - A brook you can reach safely with an adult
  - A clear glass jar with a lid
  - A watch or timer and a tape measure
  - A cork or a stick to float
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Part IV, Earth and Sky, opens with this lesson. It has a leading thought and sixteen observations on the brook's source, banks and bends, where it flows, its color in flood, the soil it carries
    (with a jar experiment), how fast it runs, a map, and the life along it, ending with a "brook puzzle."
  steps:
  - - Safety first, and when to go
    - 'Stay out of a brook that is flooded, fast or muddy, and away from steep or undercut banks, which can give way. The book suggests reaching into a flooded brook and wading in it to feel the pebbles;
      we don''t do that. Watch from a firm bank, and wade only in a shallow, calm brook at its normal level, with an adult and water shoes. Wash hands afterward.

      The book says the best time is after a rain, and October or May is a good time to begin. Come back through the year to see how the brook changes.'
  - - The leading thought
    - ~ The water from the little brook near our schoolhouse is flowing toward the ocean, and is meanwhile digging out and carrying along with it the soil through which it flows.
  - - Where does it start? Where does it go?
    - '~ Does the brook have its source in a spring or a swamp, or does it receive its water as drainage from surrounding hills?

      ~ If you should launch a toy boat upon the waters of this brook, and it should keep afloat, through what streams would it pass to reach the ocean?

      Trace the route together on a paper map or an online map.'
  - - Banks and bends
    - '~ Is the course of the brook more crooked on a hillside or when flowing through a level area?

      ~ Can you find the places where the water is cutting the banks most, when the brook is flooded? Why does it cut the banks at these particular points?'
  - - What is it carrying?
    - 'After a rain, when the water is muddy, an adult dips the jar from the edge of the brook.

      ~ Place it on a window-sill and do not disturb it until the water is clear. How much sediment has settled at the bottom of the jar? Where was this sediment when you dipped up the water?'
  - - How fast?
    - '~ To test the rapidity of the current, put something afloat on it and measure how far it will go in a minute.

      Toss the cork in upstream and walk beside it along the bank.'
  - - The brook puzzle
    - 'Read the book''s puzzle aloud and let your child think about it:

      ~ How is it that in the case of a brook just opposite is true? The faster the brook runs, the more it can carry; and the heavier it becomes the faster it runs; and the faster it runs the more work
      it can do.'
  - - Nature notebook
    - Draw a map of your stretch of brook showing its bends, pools and the swiftest current. Add the jar of settled mud as a little picture, and the speed you measured.
  practice: Visit after a big rain and on a dry day; compare the color, the sound and the speed.
  answers: 'The brook cuts hardest on the outside of its bends, where the swift current strikes the bank; that cutting makes the bends bigger. Bare banks give more soil than banks held by roots. The puzzle:
    a brook is not carried along by legs; gravity pulls the water downhill, and more water and a steeper slope make it flow faster, and fast water has the force to lift and roll a heavier load.'
- num: 210
  roman: CCX
  idx: 846
  unit: 32
  title: How a brook drops its load
  mins: 30
  goal: Your child can show with a jar that pebbles settle first, then sand, then mud, and can explain how deltas are built.
  materials:
  - A large clear jar with a tight lid
  - Water, a handful each of small pebbles, sand and mud
  - A brook to visit (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a jar experiment with gravel, sand and mud from the brook, and ten observations on where the current is swiftest, soft and stony bottoms, a little dam, pools and
    stream deltas. A passage from L. H. Bailey about a boyhood brook follows.
  steps:
  - - The leading thought
    - ~ The brook carries its load only when it is flowing rapidly. As soon as the current is checked, it drops the larger stones and gravel first and then the finer sediment. It is thus that deltas are
      built up where streams empty into lakes and ponds.
  - - The jar experiment
    - 'Fill the jar most of the way with water, add pebbles, sand and mud, put the lid on tight and shake hard. Set it down and watch.

      ~ Does the mud begin to settle while the water is in motion; that is, while it is being shaken?

      ~ Which settles first—the pebbles, the sand or the mud? Which settles on top—that is, which settles last?'
  - - Stir it a little
    - 'The next day, rock the jar gently.

      ~ if the water is disturbed even a little it becomes roily again, which means that as soon as the water is in motion it takes up its load.'
  - - At the brook (with an adult)
    - 'Look from the bank, or wade in a shallow, calm stretch at normal water level only:

      ~ Where is the current swiftest, in the middle or at the side of the stream?

      ~ Can you find a still pool in your brook that has not a soft, muddy bottom? Why is this?'
  - - A little dam
    - '~ Place a dam across your brook where the bottom is stony, and note how soon it will have a soft mud bottom. Why is this?

      Build a small dam of a few stones in a tiny side trickle or a rain rill, not across the whole brook, and take it apart when you leave.'
  - - Deltas
    - ~ What becomes of the soil dropped by the brook as it enters a pond or lake? Do you know of any points of land extending out into a lake or pond where the stream enters it? What is a stream delta?
  - - Nature notebook
    - Draw the jar with its layers labeled pebbles, sand and mud. Draw a stream entering a pond with a fan-shaped delta.
  answers: Pebbles settle first, then sand, and the fine mud last, on top. The current is swiftest in the middle; the sides are slower, so mud settles there and the bottom is softer. Behind a dam the water
    slows and drops its mud. A pool in the swift current may stay stony because the water never slows enough there. A delta is the fan of soil a stream drops where it slows down entering still water.
- num: 211
  roman: CCXI
  idx: 849
  unit: 33
  title: Crystal growth
  mins: 30
  goal: Your child grows crystals on a string and sees that each substance makes crystals of its own shape.
  materials:
  - Alum (from the spice aisle), table salt and sugar
  - Three clean glass jars
  - Cotton string, pencils or craft sticks, small washers or paper clips for weights
  - Hot water from the kettle (an adult pours)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method with three solutions (blue vitriol, potassium bichromate and alum) grown on strings in vials on the window sill, and six observations on the colors and
    shapes of the crystals, ending with rock candy.
  steps:
  - - 'Watch only: the book''s chemicals'
    - 'The book uses blue vitriol (copper sulfate) and potassium bichromate. Both are poisonous, and potassium bichromate can burn the skin and cause cancer. Don''t try these at home. The book itself warns:

      ~ Care should be taken to prevent the children from trying to eat these beautiful crystals, by telling them that the red and blue crystals are poisonous.

      If you want to see copper sulfate''s deep blue crystals, look up a video of a teacher growing them. We use three safe kitchen substances instead.'
  - - The leading thought
    - ~ Different substances when dissolved in water will re-form as crystals; each substance forms crystals of its own peculiar color and shape.
  - - Make the solutions
    - 'An adult pours very hot water into each jar (hot water dissolves more). Stir in alum in one, salt in another and sugar in the third, a spoonful at a time, until no more will dissolve. Label the jars.
      Hot water can scald: children stir only after the adult has poured.'
  - - Hang the strings
    - '~ Suspend from the mouth of each test tube or vial, a piece of white twine, the upper end tied to a tooth pick, which is placed across the mouth of the vial; the other end should reach the bottom
      of the vial.

      Use a pencil across the jar, and a paper clip on the bottom of the string. Set the jars where they won''t be bumped.'
  - - Watch them grow
    - 'Check each day for a week.

      ~ In which bottle did the crystals form first? Which string is the heaviest with the crystals?

      ~ Do you think that vitriol and potassium bichromate and alum will, under favorable circumstances, always form each its own shape of crystal wherever it occurs in the world?'
  - - Rock candy
    - '~ What is rock candy? Do you think you could make a string of rock candy if you dissolved sugar in water and placed a string in it?

      Your sugar jar is the answer. (Sugar crystals are slow; give them a week or two.)'
  - - Nature notebook
    - 'Draw one crystal from each jar as it looks under the lens. Label: alum (eight-sided, like two pyramids base to base), salt (cubes), sugar (long slanted blocks).'
  practice: Check the jars daily. Pull the strings out after one to two weeks and dry the crystals on a paper towel. Keep the alum crystals out of reach of little children; they are not for eating.
  answers: 'Each substance always grows crystals of its own shape: alum makes eight-sided crystals, salt makes cubes, sugar makes slanted blocks. Crystals can also form without water, for example when melted
    rock cools slowly, which is how the crystals in granite formed.'
- num: 212
  roman: CCXII
  idx: 851
  unit: 33
  title: Salt
  mins: 25
  goal: Your child dissolves salt, lets the water evaporate in different places, and finds that slow drying makes bigger cube-shaped crystals.
  materials:
  - Table salt
  - Three saucers and three small squares of dark paper
  - A teaspoon and water
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method with saucers of salt water set in warm, cool and drafty places, and seven observations on dissolving, evaporation and salt crystals, and on where salt
    comes from.
  steps:
  - - The leading thought
    - ~ Salt dissolves in water, and as the water evaporates the salt appears in beautiful crystals.
  - - Set it up
    - '~ Let each pupil take five teaspoonfuls of water and add to this two spoonfuls of salt, stirring the mixture until dissolved.

      Make three saucers. Write your name and the date on each square of paper and press it under the water. Put one saucer in a warm place, one in a cool place and one in a draft.'
  - - As you stir
    - ~ When you pour the salt into the water, what becomes of it? How do you know when the water will hold no more salt?
  - - Check every day
    - '~ From which saucers did the water evaporate fastest—those in the warm places, or those in the cold? In which did the crystals form first?

      ~ Which saucers contained the largest crystals—those from which the water evaporated first, or those from which it evaporated more slowly?'
  - - Look through the lens
    - '~ What is the shape of the perfect salt crystal? Do the smallest crystals have the same shape as the largest ones?

      Look for "hopper" crystals: hollow, stepped cubes like tiny pyramids upside down.'
  - - Where salt comes from
    - '~ How is dairy salt and table salt obtained? What is rock salt?

      ~ Why is the ocean called "the briny deep?"'
  - - Nature notebook
    - 'Draw the three saucers and the biggest crystal from each. Write one rule: fast drying makes ___ crystals; slow drying makes ___ crystals.'
  practice: Check the saucers each day until they are dry, usually three days to a week.
  answers: Salt disappears into the water (dissolves); when grains stay on the bottom however long you stir, the water holds all it can. Warm and drafty saucers dry first. Slow drying makes the largest
    crystals. Salt crystals are cubes, the same shape large or small. Salt comes from evaporating sea water or brine and from mines of rock salt left by ancient seas. Lakes with no outlet, like the Great
    Salt Lake, grow salty because water leaves only by evaporating, leaving its salt behind.
- num: 213
  roman: CCXIII
  idx: 851
  unit: 33
  title: How to study minerals
  mins: 30
  goal: Your child can test a mineral for form, color, luster and hardness, and starts a labeled rock collection.
  materials:
  - A few rocks and minerals (a beginner's set from a museum shop or rock shop, plus pebbles from your yard)
  - An egg carton for sorting
  - A steel nail and an old plain glass bottle or small glass tile (for an adult to help with)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'This lesson is a teacher''s introduction to the next five. The author tells of two small children who could pick out stones carried by glaciers, advises limiting the study to the minerals of granite
    and common rocks, and lists the four signs used to identify minerals: form, color, luster and hardness.'
  steps:
  - - A story to start
    - 'Read the opening story aloud. The author told two little children how certain stones near Ithaca had been carried by ice:

      ~ these stones were torn away from the mountains in Canada and brought down by ice and dropped in Ithaca.

      Ask: Could some of the pebbles near us have traveled a long way too?'
  - - Gather a collection
    - Collect pebbles from your yard, a creek bed or a gravel driveway (ask first). If you can, get a small labeled set; the book says a teacher should have at least one. Sort them in the egg carton.
  - - Form and color
    - 'The book''s first test:

      ~ This may be crystalline, which shows the shape of the crystals definitely; granular, like marble, the grains having the internal structure, but not the external form, of crystals; compact, which
      is without crystalline form, as limestone or flint.'
  - - Luster
    - '~ Luster or shine, which may be glassy like quartz, pearly like the inside of a shell; silky like asbestos; dull; or metallic like gold.

      Sort your stones by shine. (Asbestos is harmful to breathe; a silky luster can also be seen in satin spar.)'
  - - Hardness
    - '~ Easily scratched with the finger nail; cannot be scratched by the finger nail; easily scratched with steel; with difficulty scratched with steel; not to be scratched by steel.

      Try the fingernail first, then the steel nail. An adult helps with the nail and any glass. If you ever break rocks with a hammer, wear safety glasses, wrap the rock in a cloth, and never hit rock
      on rock.'
  - - What we know now
    - 'Today rock hounds use the Mohs scale, numbered 1 (talc) to 10 (diamond). A fingernail is about 2 1/2, a steel nail or knife about 5 1/2, glass about 5 1/2, and quartz is 7. Another easy test is the
      streak: rub the mineral on the back of a white tile and look at the color of the powder.'
  - - Nature notebook
    - 'Start a mineral chart with columns for name (or "unknown #1"), form, color, luster and hardness. Fill in a row for three of your stones.'
  practice: Number each stone in the egg carton and fill in its row in the chart. The next five lessons will help you name many of them.
- num: 214
  roman: CCXIV
  idx: 853
  unit: 33
  title: Quartz
  mins: 25
  goal: Your child can recognize quartz by its six-sided crystals, glassy luster and hardness, and knows some of its kinds.
  materials:
  - 'Quartz: a clear crystal if possible, plus any of amethyst, rose quartz, smoky quartz, agate or flint'
  - A steel nail
  - A small piece of plain glass with smoothed edges (a glass tile) set on a folded towel
  - Safety glasses
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method asking for several kinds of quartz, and five observations on the crystal's shape, its luster, its hardness against a knife and glass, its kinds and uses,
    and petrified wood.
  steps:
  - - The leading thought
    - ~ Quartz is one of the most common of minerals. It occurs in many forms. As a crystal it is six-sided, and the ends terminate in a six-sided pyramid. It is very hard and will scratch and cut glass.
  - - The crystal
    - ~ What is the shape of quartz crystals? Are the sides all of the same size? Has the pyramid-shaped end the same number of plane surfaces as the sides?
  - - The luster
    - ~ What is the luster of quartz? Is this luster the same in all the different colored kinds of quartz?
  - - Hardness
    - '~ Can you scratch quartz with the point of a knife? Can you scratch glass with a corner or piece of the quartz?

      Use a steel nail instead of a knife. For the glass test, an adult holds the glass tile flat on a towel while your child draws one short line with a quartz point. Wear safety glasses, and rub away
      any glass dust with a damp paper towel.'
  - - Kinds of quartz
    - '~ Describe the following kinds of quartz and their uses: amethyst, agate, flint.

      ~ What has quartz to do with the petrified forests of Arizona?'
  - - Look for it
    - Look through your pebble collection and at sand with the lens. Glassy, white or clear grains that the nail can't scratch are probably quartz.
  - - Nature notebook
    - 'Draw a quartz crystal: six sides and a six-sided point. Add a row for quartz in your mineral chart.'
  answers: Six sides with a six-faced pyramid point; the sides are often unequal in width. Glassy luster in all its colors. A knife or nail cannot scratch quartz, but quartz scratches glass (hardness 7).
    Amethyst is purple quartz, used as a gem; agate is banded quartz, used for jewelry and polished stones; flint breaks with sharp edges and was used for tools and to strike sparks. In the petrified forests,
    quartz slowly filled and replaced the wood of buried logs, turning them to stone.
- num: 215
  roman: CCXV
  idx: 854
  unit: 33
  title: Feldspar
  mins: 25
  goal: Your child can tell feldspar from quartz by its smooth, flat break and slightly lower hardness.
  materials:
  - Feldspar pieces (pink or white; from a rock shop, or found in coarse granite)
  - Quartz to compare
  - A steel nail
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method listing three kinds of feldspar, and nine observations on its crystal, colors, luster, hardness, streak and cleavage, how to tell it from quartz, and why
    sand holds so much more quartz.
  steps:
  - - The leading thought
    - ~ Feldspar is about five times as common as quartz. The crystal is obliquely brick-shaped, and when broken splits in two directions at right angles to each other. It is next in hardness to quartz,
      and will scratch glass but will not cut it.
  - - Look at it
    - '~ What colors are your specimens of feldspar? How many kinds have you?

      ~ What is the luster of feldspar?'
  - - Hardness
    - '~ Can you scratch feldspar with the point of a knife? Can you scratch it with quartz?

      Use the steel nail, then a quartz point.'
  - - How it breaks
    - '~ If feldspar is broken, does it break along certain lines, leaving smooth faces? At what angles do these smooth faces stand to each other?

      Tilt it in the light: the smooth faces flash like little mirrors. Quartz never does this.'
  - - Compare
    - ~ How can you tell feldspar from quartz? Write a comparison of feldspar and quartz, giving clearly the characteristics of both.
  - - A thinking question
    - ~ When there is so much more feldspar than quartz in the earth's crust, why is there so much more quartz than feldspar in sand?
  - - Nature notebook
    - Make a two-column chart, Quartz and Feldspar, comparing shape, color, luster, hardness and how it breaks. Add a feldspar row to your mineral chart.
  answers: Feldspar is often pink, white or gray, with a glassy to pearly luster. A nail scratches it only with difficulty or not at all, and quartz scratches it. It breaks along smooth flat faces nearly
    at right angles, while quartz breaks unevenly like glass. Sand holds more quartz because feldspar slowly weathers into clay, while hard quartz does not break down chemically and survives as grains.
- num: 216
  roman: CCXVI
  idx: 855
  unit: 33
  title: Mica
  mins: 20
  goal: Your child can split mica into thin sheets and describe how it bends, its luster and its uses.
  materials:
  - A piece of mica (from a rock shop, or flakes found in granite or sand)
  - A butter knife or a thumbnail
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a short method, and four observations on splitting mica, how it looks and bends, its hardness and streak, and its uses.
  steps:
  - - The leading thought
    - ~ Mica is a crystal which flakes off in thin scales parallel with the base of the crystal. We rarely see a complete mica crystal but simply the thin plates which have split off.
  - - Split it
    - '~ Describe your piece of mica. Pull off a layer with the point of your knife. See if you can separate this layer into two layers or more.

      A butter knife or a fingernail works well. How thin can you go?'
  - - Test it
    - '~ Can you see through mica? Can you bend it? Does it break easily? What is the color of your specimen? What is its luster?

      ~ Can you scratch it with the thumb nail?'
  - - Uses
    - '~ What are some of the uses of mica? How is it especially fitted for some uses?

      Clue: it is clear, it bends, and it does not burn.'
  - - Find it in rocks
    - 'Look at granite or sparkly sand with the lens. The tiny flakes that glitter like mirrors are mica: light silvery ones, or black ones.'
  - - Nature notebook
    - Tape a thin sheet of mica into the notebook and write one sentence about it. Add a mica row to your mineral chart.
  answers: Mica splits into very thin sheets that you can see through; they bend and spring back. It has a glassy to pearly luster and is soft enough to scratch with a thumbnail. Because it is clear and
    does not burn, it was used for windows in stoves and lanterns; it is also used in electrical parts and to add sparkle to paints and makeup.
- num: 217
  roman: CCXVII
  idx: 857
  unit: 33
  title: Granite
  mins: 25
  goal: Your child can find quartz, feldspar and mica in a piece of granite and explain how granite weathers into sand.
  materials:
  - A piece of coarse granite (a landscaping or rock-shop piece)
  - A steel nail
  - A spoonful of sand
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method, and six observations on the minerals in granite, granite buildings and monuments, weathering, sand, and Cleopatra's Needle in Central Park.
  steps:
  - - The leading thought
    - ~ Granite is composed of feldspar, quartz and mica, and often contains hornblende.
  - - Find the minerals
    - '~ What minerals do you find in granite? How can you tell what these minerals are? Look at the granite with a lens. How can you tell the quartz from feldspar?

      Glassy gray grains are quartz; pink or white blocky grains with flat shiny faces are feldspar; tiny flakes like mirrors are mica; black, stubby grains are often hornblende.'
  - - Scratch test
    - '~ Take a knife and scratch the two. Can you tell them apart in that way?

      Use the steel nail.'
  - - Granite in your town
    - '~ What buildings have you seen made of granite? What monuments have you seen made from it?

      Look at curbstones, steps, bridges, monuments and old gravestones on your next walk.'
  - - Weathering
    - '~ Which mineral in granite is especially affected by water? Which remains unharmed the longest?

      ~ Examine some sand with a lens. What mineral do you find present in it in the greatest quantity?'
  - - Nature notebook
    - Draw a magnified circle of your granite, coloring each mineral grain and labeling it. Add a granite row to your chart.
  answers: 'Feldspar is the mineral most affected by water: it slowly turns to clay, loosening the grains. Quartz lasts longest, so sand is mostly quartz. Rough granite weathers sooner than polished granite
    because water and frost can get into its many tiny cracks.'
- num: 218
  roman: CCXVIII
  idx: 859
  unit: 33
  title: Calcite, marble and limestone
  mins: 30
  goal: Your child tests rocks and shells with vinegar and explains that calcite, limestone, marble, chalk and shells are all made of the same stuff.
  materials:
  - Household vinegar and a dropper or spoon
  - Pieces of limestone, marble (a tile scrap works), calcite if you have it, a seashell and some chalk
  - A steel nail
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought about calcite and its forms, a method calling for specimens and dilute hydrochloric acid (or strong vinegar), and eleven observations on calcite, marble, limestone,
    caves, lime, chalk and shells, followed by a passage by Thomas Huxley on chalk.
  steps:
  - - Safety change
    - 'The book suggests dilute hydrochloric acid and says strong vinegar will do instead. We use only household vinegar. It works more slowly: look closely with the hand lens for tiny bubbles.'
  - - The leading thought
    - ~ Limestone is a solid form of calcite. Marble is granular limestone which shows the broken crystals of calcite. Chalk is very fine, pulverized calcite.
  - - Calcite
    - '~ What is the form of the calcite crystal? What is the luster of the crystal? Is it the same as the inside of sea-shells? Will calcite scratch glass? Can you scratch it with a knife?

      Use the steel nail. Then put a drop of vinegar on it and watch.'
  - - Marble and limestone
    - '~ Is marble made up of crystals? Examine it with a lens to see.

      ~ Test a piece of limestone for hardness. Can you scratch it with a knife? Is it as soft as marble? Put on it a drop of acid. Does it effervesce?

      "Effervesce" means fizz. Use vinegar for the acid.'
  - - Shells
    - ~ Test a shell with acid; test a piece of coral with acid. How does it happen that these, which were once a part of living creatures, are now limestone?
  - - Caves
    - ~ Why are limestone regions likely to have caves within the rocks? How are stalactites and stalagmites formed in caves?
  - - A line from Huxley
    - 'For older children, read the start of the quotation printed after the lesson:

      ~ A great chapter in the history of the world is written in the chalk.

      Test your chalk with vinegar. Some modern chalk is made of gypsum and hardly fizzes at all, which makes a good puzzle.'
  - - Nature notebook
    - 'Make a fizz chart: each sample, "fizzes" or "no fizz," and whether the nail scratches it. Add these to your mineral chart.'
  answers: Calcite can be scratched by a knife or nail and will not scratch glass; it fizzes in acid (slowly in vinegar). Marble shows sparkling crystals under the lens; limestone and marble fizz too. Shells
    and coral fizz because sea creatures build them of the same mineral, and their remains pile up on the sea floor and become limestone. Rainwater, a weak acid, slowly dissolves limestone and hollows out
    caves; dripping water leaves the mineral behind as stalactites (hanging) and stalagmites (standing).
- num: 219
  roman: CCXIX
  idx: 862
  unit: 34
  title: The magnet
  mins: 40
  goal: Your child finds out what magnets attract, where they are strongest, how like and unlike poles act, and makes a working compass from a needle.
  materials:
  - A bar magnet and a horseshoe magnet (ordinary toy-strength magnets)
  - Iron nails, paper clips, steel pins, brass tacks or coins, and a few non-metal things
  - A long sewing needle, a slice of cork and a shallow bowl of water
  - A small compass
  - Iron filings in a sealed zip bag (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'The lesson has a leading thought, a method listing magnets, compass, lodestone, nails, filings and tacks, and eighteen observations: where magnets are strongest, chains of tacks, like and unlike
    poles, magnetizing a needle, floating needles on corks, the compass, the pattern of iron filings, and lodestone.'
  steps:
  - - Safety first
    - 'Use ordinary magnets. Small, very strong magnets (and magnet toys with tiny pieces) are dangerous around young children: two swallowed magnets can pinch the intestines together. Keep magnets away
      from phones, computers and bank cards. Needles and pins are sharp; an adult hands them out. Keep iron filings sealed in a bag so they can''t get in eyes.'
  - - The leading thought
    - ~ Any substance that will attract iron is called a magnet, and the force which enables it to attract iron is called magnetism. This force resides chiefly at the ends of magnets, called the poles.
  - - What does it pick up?
    - 'Let your child test everything, as the book says, "during play time."

      ~ Of what substance are the objects made which the magnets can pick up? Does a magnet pick up as many iron filings at its middle as at its ends? What does this show?'
  - - Chains, pushes and pulls
    - '~ Pick up a tack with a magnet. Hang another tack to this one end to end. How many tacks will it thus hold?

      ~ Pull off the tack which is next to the magnet. Do the other tacks continue to hold together? Why?

      Use small nails or paper clips.

      ~ Bring two ends of two bar magnets together; do they hold fast to each other? Change ends with one, now do the two magnets cling more or less closely than before?'
  - - Make a compass
    - '~ Magnetize a knitting needle or a long sewing needle by rubbing one end of a magnet along its length twelve times, always in the same direction, and not back and forth.

      Push the needle through a slice of cork (an adult does this) and float it in the bowl of water.

      ~ When it finally rests does it point north and south or east and west?

      Check with the real compass.'
  - - Pictures of force
    - '~ Place fine iron filings on a pane of glass or on a stiff paper. Pass a magnet underneath; what forms do the filings assume?

      Use the sealed bag of filings over the magnet. It shows the same pattern with no mess.'
  - - What we know now
    - Comstock is right that the Earth is a giant magnet, and that the pole near the North Pole is, by magnet rules, a south pole, since it pulls the north end of a compass. Today we know that pole is not
      at the North Pole itself and slowly wanders; a compass points to it, so maps give a small correction for each place.
  - - Nature notebook
    - 'Draw the bar magnet with the filing pattern around it. Make a two-column list: "magnet picks up" and "magnet doesn''t pick up."'
  answers: Magnets pick up iron and steel (and nickel), not brass, copper, aluminum, paper or wood; the filings cluster at the ends, so the force is strongest at the poles. A tack touching a magnet becomes
    a magnet itself, so it can hold another; pull the first away and the chain falls apart. Like poles push apart; unlike poles pull together. The floating needle settles pointing north and south. The filings
    make curved lines running from one pole around to the other.
- num: 220
  roman: CCXX
  idx: 868
  unit: 35
  title: The soil
  mins: 40
  goal: Your child can describe soil as rock flour and humus and shows by experiment which soils let water through, hold it, and lift it from below.
  materials:
  - Three clear plastic bottles with the bottoms cut off (an adult cuts), cheesecloth or old cloth and rubber bands
  - Three cups or jars to stand them in
  - Sand, clay and garden loam, about 2 cups each
  - Some dark woodland soil from under the leaves
  - A watch or timer
  - Safety glasses, a small rock and a cloth bag (optional)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'The lesson has a leading thought, a method for bringing in and comparing soils, nine observations on how rock becomes soil, and six experiments with hints for the teacher: how water passes through
    sand, loam and clay, the film of water on each grain, how soil lifts water from below, mulch, acid soil, and treating clay.'
  steps:
  - - When and where
    - Spring or fall, when the ground isn't frozen. Collect soil from a garden, a sandy spot, a clay bank and under the leaves in the woods. Wash hands after digging.
  - - The leading thought
    - ~ The soil is composed of rock flour and humus. Soil, to support life, must be porous, so that the roots of the plants may receive through it both water and air.
  - - Feel and look
    - 'Rub a little wet soil of each kind between your fingers. Clay feels like putty and can be rolled into a marble; sand falls apart. Look with the lens:

      ~ Look at any kind of soil with a lens, and tell why you think it is made up of small pieces of stone and rock.

      If you like, make your own "rock flour": put a small soft rock in a cloth bag and pound it with a hammer while wearing safety glasses.

      Then look at the dark soil from under the woodland leaves:

      ~ Go to the woods, scrape off the leaves and get some of the black earth beneath them. Of what is this soil composed? Is it rock flour? What makes it so black?'
  - - Which lets water through? (Experiment 1)
    - 'Tie cloth over the necks of the three bottles, turn them neck-down in the cups, and fill one with loam, one with clay and one with sand, the same amount in each. Pour the same amount of water slowly
      into each and time it.

      ~ Which soil takes the water most rapidly? Which lets it through first? Which lets through the most?'
  - - Does soil drink from below? (Experiment 3)
    - 'Fill the bottles again with dry soil and stand them in a pan with an inch of water.

      ~ In which soil does the water rise most rapidly? In which does it rise the highest?'
  - - A blanket for the soil (Experiment 4)
    - 'Wet two bottles of loam the same. Cover one with an inch of dry, loose soil. Check each day.

      ~ Which dries out first?

      Today gardeners usually mulch with straw, shredded leaves or wood chips, which do the same job and protect the soil from blowing away.'
  - - What we know now
    - Soil is also alive. A single spoonful of good soil holds millions of tiny living things (bacteria, fungi, mites), besides the worms and insects you can see, and they help turn dead leaves into the
      dark humus.
  - - Nature notebook
    - Draw the three bottles and write how long the water took to drip through each. Write which soil would be best for a garden, and why.
  practice: Leave Experiments 3 and 4 standing for several days and record what you see each day. The book also has tests for acid soil and for clay; look at them on the page if you are curious.
  tip: The book's Experiment 2, with marbles in a glass of water, shows the thin film of water that clings to every grain of soil. It is quick and easy to add.
  answers: 'Book''s hints: water runs through sand in about a minute, through loam in several minutes, and takes hours to come through clay; sand lets through the most. Water climbs fastest in sand but,
    given time, climbs highest in clay. The covered (mulched) soil stays moist much longer. Loam, a mix of sand, clay and humus, is best for gardens. Woodland earth is black with humus from rotted leaves.'
- num: 221
  roman: CCXXI
  idx: 877
  unit: 36
  title: 'Water forms: vapor, dew, frost and snow'
  mins: 40
  goal: Your child can explain evaporation and condensation with everyday examples, and can catch and look at snow crystals.
  materials:
  - Two saucers of water and a box to cover one
  - A glass of ice water
  - A plastic bottle with a cap (for freezing)
  - A piece of dark cloth (wool or flannel) kept cold outdoors
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method (demonstrations indoors; snow crystals outdoors; frost and dew in autumn or spring), and thirteen observations on evaporation, steam and mist, clouds,
    dew, frost, ice, frosted windows, snow crystals, hail and sleet. Photographs of snow crystals by W. A. Bentley are on these pages. Wilford M. Wilson's long chapter "The Weather" follows the lesson.
  steps:
  - - When to do it
    - Parts of this lesson belong to different seasons. Do the saucers and the cold glass any day. Look for dew and frost on autumn or spring mornings. Save the snow crystals for a snowy winter day, best
      when the flakes are small and hard. Never go out while there is thunder or lightning.
  - - The leading thought
    - ~ Water occurs as an invisible vapor in the air and also as mist and rain; and when subjected to freezing, it crystallizes into ice and frost and snow.
  - - Where does the water go?
    - '~ Place a saucer filled with water near a stove or radiator; do not cover it nor disturb it. Place another saucer filled with water near this but cover it with a tight box. From which saucer does
      the water evaporate most rapidly? Why?

      ~ Will they dry more rapidly during a clear or during a damp day? Why? Will they dry more rapidly during a still or during a windy day? Why?'
  - - Water out of the air
    - 'Fill a glass with ice water and watch the outside.

      ~ Why does the ice pitcher, on a warm day, become covered on the outside with drops of water? Would this happen on a cold day? Why not?

      At the kettle, the adult stays close and the child looks from a safe distance (steam burns):

      ~ Notice that near its spout there is no mist, but what we call steam is formed beyond this. Why is this so?'
  - - Dew and frost
    - 'On a still, clear morning, go out early.

      ~ What causes dew to form? When the grass is covered with dew, are the leaves of the higher trees likewise covered? Why not?

      ~ How many forms of frost crystals can you find on the grass on a frosty morning?'
  - - Ice
    - 'Fill a plastic bottle to the top, cap it, and leave it outdoors on a freezing night (or in the freezer) inside a bag. The book uses a glass bottle, which can shatter, so we use plastic.

      ~ How does the ice appear in it at first? What happens later? Why does the bottle break?'
  - - Snow crystals
    - ~ When there is a fine, dry snow falling, take a piece of dark flannel and catch some flakes upon it. Examine them with a lens, being careful not to breathe upon them. How many forms of snow crystals
      can you find? How many rays are there in the star-shaped snow crystals?
  - - Nature notebook
    - Draw three different snow crystals or frost patterns. Then write the words evaporate (water goes into the air) and condense (water comes out of the air), each with an example from today.
  practice: Over the coming weeks, look for dew, frost, fog and frosted windows, and add a drawing each time.
  tip: 'For older children, read from the weather chapter that follows: the Temple of the Winds at Athens, and how Benjamin Franklin found out that storms travel.'
  answers: The uncovered saucer dries fastest because its vapor can escape into the air. Clothes dry fastest on clear, windy, warm days. Water vapor is invisible; the white "steam" is tiny droplets formed
    when the vapor cools, so there is a clear gap at the spout. Cold surfaces cool the air next to them and the vapor condenses into drops, which is how dew forms on clear, still nights when the ground
    cools. Water expands about one-ninth when it freezes, which bursts bottles and splits rocks. Snow crystals have six rays or six sides.
- num: 222
  roman: CCXXII
  idx: 900
  unit: 36
  title: Experiments to show air pressure
  mins: 25
  goal: Your child shows with a glass of water and a suction cup that air presses in every direction.
  materials:
  - A drinking glass with a smooth rim
  - A square of stiff paper or an index card
  - A sink or a large bowl to work over
  - A rubber suction cup (a hook or a toy one)
  - A smooth tile or hardcover book
  book: The lesson has a leading thought, two experiments (a paper over an upturned glass of water, and a leather "sucker"), and hints to the teacher explaining them. Before it comes Wilford M. Wilson's
    chapter "The Weather," on the history of weather study, the atmosphere, the winds of the world, storms and the Weather Bureau.
  steps:
  - - A story from the weather chapter
    - 'Tell the story from the chapter before this lesson in your own words. Benjamin Franklin planned to watch an eclipse of the Moon, but a northeast storm hid it in Philadelphia. A friend in Boston saw
      the eclipse, and the storm reached Boston only the next morning. Franklin collected reports from many towns and found that storms travel across the land. Ask: How could knowing that help people?'
  - - The leading thought
    - ~ The air presses equally in all directions.
  - - The upside-down glass
    - 'Work over the sink.

      ~ Fill a tumbler which has an unbroken edge as full of water as possible. Take a piece of writing paper and cover the tumbler, pressing the paper down firmly upon the edge of the glass. Turn the glass
      bottom side up and ask why the water does not flow out.

      ~ Turn the glass filled with water and covered with paper sidewise; does the water flow out? If not, why?'
  - - Let a little air in
    - '~ Allow a little air to enter; what happens? Why?

      Lift one corner of the paper and watch.'
  - - The sucker
    - 'The book''s boys made a "sucker" of wet leather and string. A rubber suction cup works the same way. Wet it, press it on the tile or book, and lift gently. Lift only light things a few inches above
      a table, not heavy stones.

      ~ If a little air is allowed to get between the sucker and the stone, what happens? Why?'
  - - The teacher's hint
    - 'Read the explanation from the book:

      ~ The reason why we cannot pull it off is that the air is pressing down upon it with the force of about fifteen pounds to the square inch.

      Ask: How much does the air push on a square the size of a postage stamp? (About fifteen pounds.)'
  - - What we know now
    - 'The weather chapter says the air is about two hundred miles deep. Today we know it has no sharp top: it just gets thinner and thinner. Half of all the air lies below about three and a half miles,
      lower than the highest mountains, which is why climbers there need extra oxygen.'
  - - Nature notebook
    - Draw the upside-down glass with arrows showing the air pushing up on the paper. Write the leading thought under it.
  answers: The air pushes up on the paper harder than the water pushes down, so the water stays in, even sideways, because air presses in every direction. When air gets in above the water, it pushes down
    too, and the water falls out. The suction cup holds because there is almost no air under it, so the outside air presses it down; let air in and it lets go. At sea level air presses about fifteen (14.7)
    pounds on each square inch.
- num: 223
  roman: CCXXIII
  idx: 901
  unit: 36
  title: The barometer
  mins: 30
  goal: Your child can explain that a barometer measures the weight of the air, and builds a simple jar barometer to watch it change.
  materials:
  - A wide-mouthed jar
  - A balloon, cut open and stretched over the jar mouth, and a rubber band
  - A drinking straw and tape
  - An index card taped upright behind the straw
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method for making a mercury barometer from a 36-inch glass tube, and three observations on how high the column stands, whether it changes from day to day, and
    how it would be on a mountain.
  steps:
  - - 'Watch only: the mercury barometer'
    - 'The book has the class pour mercury into a long glass tube and turn it upside down into a dish of mercury. Don''t try this at home: mercury is poisonous, and its invisible vapor harms the brain and
      kidneys. Look up a video of a teacher demonstrating a Torricelli (mercury) barometer instead.'
  - - The leading thought
    - ~ The weight of our atmosphere balances a column of mercury about thirty inches high, and is equal to about fifteen pounds to the square inch. This pressure varies from day to day, and becomes less
      as the height of the place increases.
  - - What the book's barometer shows
    - 'Read the three questions and talk them through:

      ~ How high is the column of mercury in the tube?

      ~ What keeps the mercury in the tube?

      ~ Would the mercury column be as high in the tube if it were placed on top of a mountain as it would at the foot? Why?'
  - - Build a jar barometer
    - Stretch the cut balloon tightly over the jar mouth and hold it with the rubber band. Tape one end of the straw to the middle of the balloon so the straw lies flat and sticks out past the edge. Stand
      the card behind the straw's tip and mark where it points.
  - - How it works
    - When the air outside presses harder, it pushes the balloon down and the straw's tip goes up. When the pressure falls, the tip goes down. Keep the jar indoors, out of the sun and away from heaters,
      because warming the jar also moves the straw.
  - - Watch it for a week
    - Mark the straw's position each morning and evening, and write the weather beside each mark. Does falling pressure come before clouds and rain? Does rising pressure come before clearing?
  - - Nature notebook
    - 'Draw your barometer and make a little chart: date, time, straw up or down, weather.'
  practice: Read the jar barometer twice a day for a week and compare with the weather.
  answers: At sea level the mercury stands about 30 inches (29.92 on an average day). The weight of the air pressing on the mercury in the dish holds the column up. On a mountain the column is lower, because
    there is less air above pressing down (about an inch lower for every thousand feet of climb, near sea level). A water barometer would need a tube about 34 feet tall.
- num: 224
  roman: CCXXIV
  idx: 907
  unit: 36
  title: How to read weather maps
  mins: 40
  goal: Your child can find the highs, lows and isobars on a weather map, follow a storm across three days, and keep a daily weather record.
  materials:
  - Weather maps for three days in a row (printed or saved from your national weather service's website)
  - Red and blue pencils and a ruler
  - An outdoor thermometer
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method using maps for three successive days, sixteen observations on isobars, highs and lows, winds, isotherms and storms, a second set on tracking the highs
    and lows, and directions and a chart for keeping a daily school weather record.
  steps:
  - - Get your maps
    - Save or print the surface weather map for the same hour on three days in a row. The book's maps came by telegraph; yours come from the internet, but they show the same things.
  - - The leading thought
    - ~ Weather maps are made with great care by the Weather Bureau experts. Each map is the result of many telegraphic communications from all parts of the country.
  - - Highs and lows
    - 'Isobars are the curving lines that join places with the same air pressure.

      ~ Where is the greatest air pressure on your map? How high does the barometer stand there? How are the isobars arranged with reference to this region? What word is printed in the center of this series
      of isobars?

      ~ Find a center marked low. How high does the barometer stand there?

      ~ Do the winds blow toward this center or away from it?

      ~ What must the weather in the region just east of the low be? Why?'
  - - Follow the storm
    - '~ On the first map of the series of three given, put an X in red pencil or crayon at the center of the high and a blue one at the center of the low

      Mark the same centers on the next two maps, and join the marks with lines.

      ~ What do you find to be the general direction of the movement of the highs and lows?'
  - - How fast?
    - ~ With your ruler find out how many miles one area of high or low has moved in twenty-four hours; in three days. Divide the distance which the area has moved in three days by three and this will give
      the average velocity for one day.
  - - What we know now
    - 'Today''s maps show pressure in millibars (1013 millibars is about 29.92 inches), and they add fronts: a blue line with triangles is a cold front, a red line with half-circles is a warm front. Forecasts
      now use weather satellites, radar, weather balloons sent up twice a day all over the world, and computers. They are good for about a week ahead.'
  - - Keep a weather record
    - The book says to read the weather at the same hours every day. Hang the thermometer at eye level on the north side of a post, not on a building, as the book advises. Each day write the date, hour,
      temperature, wind direction, clouds and any rain, snow, frost or fog. Stay indoors during thunder and lightning; record the storm from a window.
  - - Nature notebook
    - 'Make a weather chart page with columns like the book''s: Date, Hour, Temp., Wind, Cloudiness, Rain or Snow, Remarks.'
  practice: Keep the weather record every day for a month (the book hopes for six months) and compare it with the maps once a week.
  answers: '"High" is printed in the center of the ring of isobars with the highest pressure; "Low" in the center of the lowest. Winds blow out from a high and in toward a low (in the Northern Hemisphere
    they turn clockwise around a high and counterclockwise around a low). Highs usually bring fair weather; the area east of a low usually has clouds and rain or snow, because air rising into the low cools
    and its vapor condenses. Across the United States, highs and lows generally travel from west to east, taking several days to cross.'
- num: 225
  roman: CCXXV
  idx: 914
  unit: 37
  title: The two Dippers and the Pole-star
  mins: 30
  goal: Your child can find the Big Dipper, use the pointers to find the Pole-star, find the Little Dipper, and see that the Dipper circles the Pole-star.
  materials:
  - A clear, moonless evening
  - A red-covered flashlight
  - A blanket and warm clothes
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method (begin when the Moon is in its last quarter, and draw the Dipper on the blackboard first), twenty-four observations and thinking questions about the Big
    Dipper, the Little Dipper and Polaris, and topics for writing.
  steps:
  - - When and where
    - 'Any clear evening of the year, when the Moon is not up in the early evening (the book says start when it is in its last quarter). Go out about an hour after sunset. Face north. Stargaze with an adult,
      in a dark spot away from roads, such as a back yard or a field you have permission to use. Dress warmly, bring a blanket, and cover a flashlight with red cellophane or a red balloon so your eyes stay
      used to the dark.

      Before going out, draw the Big Dipper on paper with a line through its two end stars, the "pointers," to the Pole-star, as the book shows on its chart.'
  - - The leading thought
    - ~ The North Star or Pole-star may always be found by the stars known as the pointers in the Big Dipper; the stars of the Big Dipper seem to revolve around the Pole-star once in twenty-four hours.
  - - Find the Big Dipper
    - '~ Can you find the Big Dipper among the stars

      ~ Which stars are the "pointers" in the dipper, and why are they called so?

      ~ How many stars make the bowl of the Dipper?

      ~ How many stars in the handle?'
  - - Does it move?
    - '~ Does the Big Dipper remain in the same direction from the Pole-star all night? Look at it at seven o''clock and again at nine o''clock and see if it has changed position?

      ~ How could you tell the time of night by the Big Dipper and the Pole-star?'
  - - The Little Dipper
    - 'The end of the Little Dipper''s handle is the Pole-star itself. Its stars are faint, so you need a dark sky.

      ~ Is the Little Dipper nearer or farther from the Pole-star than the Big Dipper?

      ~ How many stars make the bowl of the Little Dipper? Which of these stars are the brightest?'
  - - Thinking questions
    - 'Ask indoors, afterward:

      ~ If you could stand at the North Pole, where would the Pole-star seem to be?

      ~ How does the North Star help the sailors to navigate the seas and why?'
  - - What we know now
    - The Dipper turns once in a little less than 24 hours (23 hours 56 minutes), because the Earth turns. Polaris is not exactly at the pole, but within about one degree of it. The Earth's axis wobbles
      very slowly, so thousands of years from now another star, such as Vega, will be the pole star.
  - - Nature notebook
    - Draw the Big Dipper, the pointers and the Pole-star as you saw them at a set hour. Go out again two hours later and draw them again on the same page.
  practice: Check the Dipper at the same hour once a month. Its position at 8 p.m. changes with the seasons, which the book asks you to record from January to April.
  answers: Four stars in the bowl and three in the handle; the handle is curved. The pointers point to the Pole-star. The Dipper circles the Pole-star counterclockwise (when you face north) about once a
    day, so it can be read like the hand of a clock. In the northern United States and Canada it never sets. At the North Pole, the Pole-star would be straight overhead, and the stars would circle around
    without rising or setting. The Pole-star cannot be seen from far south of the equator. A light-year is the distance light travels in a year, about six trillion miles.
- num: 226
  roman: CCXXVI
  idx: 917
  unit: 37
  title: Cassiopeia's Chair, Cepheus and the Dragon
  mins: 25
  goal: Your child can find Cassiopeia's W, Cepheus and the Dragon, and sees that they circle the Pole-star with the Dippers.
  materials:
  - A clear evening
  - A red-covered flashlight
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method that adds the constellations to the blackboard one at a time, eight observations, and topics for stories about Cassiopeia, Cepheus, Andromeda and the Dragon.
    A chart of the winter stars follows.
  steps:
  - - When and where
    - Any clear evening; autumn and winter evenings put Cassiopeia high. Look early and again later in the same evening. Stargaze with an adult, in a dark spot away from roads, such as a back yard or a
      field you have permission to use. Dress warmly, bring a blanket, and cover a flashlight with red cellophane or a red balloon so your eyes stay used to the dark.
  - - The leading thought
    - ~ To learn to know and to map the constellations which are so near the Pole-star that they never rise or set in our latitude, but seem to swing around the North Star once in twenty-four hours.
  - - Cassiopeia's Chair
    - 'Start at the Big Dipper, go to the Pole-star, and keep going about the same distance beyond. You will meet a bright W (or M).

      ~ How many stars form Cassiopeia''s Chair? Make a drawing showing them and their relation to the Pole-star.

      ~ Is the Queen''s Chair on the same side of the Pole-star as the Big Dipper?'
  - - Cepheus
    - '~ How many stars mark the constellation of Cepheus?

      ~ Make a sketch of these stars and show the two which are pointers toward the North Star.

      Cepheus looks like a child''s drawing of a house, standing next to Cassiopeia.'
  - - The Dragon
    - '~ Describe where the Dragon lies, and where are his tail and his head in relation to the two Dippers.

      It is long and faint. Its tail lies between the two Dippers and its head is a small group of four stars.'
  - - Why do they turn?
    - ~ Why do all the polar constellations seem to move around the Pole-star every twenty-four hours, and why do they seem to go in a direction opposite the movement of the hands of a clock?
  - - The old stories
    - The book suggests writing about Queen Cassiopeia, King Cepheus and their daughter Andromeda. These are stories the ancient Greeks told. Read one from a book of myths and let your child tell it back.
  - - Nature notebook
    - Draw the Pole-star in the middle of the page with the Big Dipper, Cassiopeia and Cepheus around it, as you saw them tonight. Write the time.
  answers: Five bright stars make the W. Cassiopeia is on the opposite side of the Pole-star from the Big Dipper. Cepheus has five main stars. All these "polar" constellations seem to circle the Pole-star
    because the Earth turns under them, once a day, from west to east; seen facing north, they go around counterclockwise.
- num: 227
  roman: CCXXVII
  idx: 919
  unit: 37
  title: Orion
  mins: 25
  goal: Your child can find Orion's belt and sword, Betelgeuse and Rigel, and can say what a star's color tells us.
  materials:
  - A clear winter evening
  - A red-covered flashlight
  - Binoculars (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method, and seven observations on Orion's place in the sky, its belt and sword, red Betelgeuse and white Rigel, the four-sided figure around them, and the story
    of Orion the hunter.
  steps:
  - - When and where
    - Winter evenings, from December to March, about 8 or 9 p.m. Face south. Orion rises in the east in early winter evenings and is high in the south by February. Stargaze with an adult, in a dark spot
      away from roads, such as a back yard or a field you have permission to use. Dress warmly, bring a blanket, and cover a flashlight with red cellophane or a red balloon so your eyes stay used to the
      dark.
  - - The leading thought
    - ~ Orion is one of the most beautiful constellations in the heavens. It is especially marked by the three stars which form Orion's belt, and the line of stars below the belt which form the sword.
  - - Belt and sword
    - '~ How many stars in the belt of Orion? How many stars in the sword?

      One "star" in the sword looks fuzzy. Look at it with binoculars if you have them.'
  - - Two great stars
    - '~ Notice above the belt, about three times its length, a bright star; this is Betelgeuse. What is the color of this star?

      ~ Look below the belt and observe another bright star at about the same distance below that Betelgeuse is above. What is the color of this star?'
  - - Draw the hunter
    - ~ If we connect these four stars by lines we shall make an irregular four-sided figure, fencing in the belt and sword.
  - - What we know now
    - 'The book asks what a red color tells about a star''s age. In 1911 many astronomers thought red stars were old and fading. Today we know color shows a star''s surface heat: red stars are cooler and
      blue-white stars are hotter. Betelgeuse is a giant red star near the end of its life, but it is much younger than our Sun; big stars live fast. The fuzzy spot in the sword is the Orion Nebula, a great
      cloud of gas where new stars are being born.'
  - - The story
    - Orion was a great hunter in stories the ancient Greeks told. Read one version and have your child tell it back.
  - - Nature notebook
    - 'Draw Orion: the four corner stars, the belt and the sword. Color Betelgeuse orange-red and Rigel blue-white, and label them.'
  answers: Three stars in the belt; three in the sword (the middle one is the fuzzy nebula). Orion is south of the Pole-star, on the opposite side of the sky. Betelgeuse is orange-red; Rigel is blue-white.
    Betelgeuse rises first in the evening (it is the top of the figure).
- num: 228
  roman: CCXXVIII
  idx: 921
  unit: 37
  title: Aldebaran and the Pleiades
  mins: 25
  goal: Your child can star-hop from Orion to Aldebaran, the V of the Hyades and the little cluster of the Pleiades, and count the Pleiades.
  materials:
  - A clear winter evening
  - A red-covered flashlight
  - Binoculars (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method with a chart of Orion, Aldebaran and the Pleiades, and nine observations on finding Aldebaran, the V-shaped Hyades and the Pleiades, and on what astronomers
    know about them.
  steps:
  - - When and where
    - Clear evenings from November to March. Find Orion first. Stargaze with an adult, in a dark spot away from roads, such as a back yard or a field you have permission to use. Dress warmly, bring a blanket,
      and cover a flashlight with red cellophane or a red balloon so your eyes stay used to the dark.
  - - The leading thought
    - ~ The Pleiades seem to be a little misty group of six stars, but instead there are in it three thousand stars. Half way between the Pleiades and Orion's belt is Aldebaran, an ageing ruddy star.
  - - Find Aldebaran
    - 'Follow Orion''s belt up and to the right (westward) to a bright orange star.

      ~ Can you see the figure V formed by Aldebaran and four fainter stars? Sketch the V and show where in it Aldebaran belongs. This V-shaped constellation is called the Hyades.'
  - - Find the Pleiades
    - ~ Imagine a line drawn from Orion's belt to Aldebaran and extend it to not quite an equal length beyond it, and it will end near a "fuzzy little bunch" of stars which are called the Pleiades.
  - - Count them
    - '~ How many stars can you see in the Pleiades?

      ~ Why are they called the seven sisters?

      Each person counts alone and whispers the number. Then look with binoculars.'
  - - What we know now
    - The Pleiades are a real family of stars that formed together and travel together through space, as the book suggests. Astronomers now count about a thousand stars in the cluster, rather than three
      thousand; it is about 440 light-years away. Aldebaran is an orange giant star much closer to us, and it only happens to line up with the Hyades.
  - - Nature notebook
    - 'Make a star chart: Orion''s belt, Aldebaran in its V, and the Pleiades, with the lines you followed. Draw the Pleiades as many dots as you could count.'
  answers: Most people see six stars in the Pleiades; very sharp eyes on a dark night may see more. In stories the Greeks told, they were seven sisters, daughters of Atlas. Astronomers think the Pleiades
    are a true cluster because their stars all move together across the sky and are about the same distance from us.
- num: 229
  roman: CCXXIX
  idx: 922
  unit: 37
  title: The two Dog Stars
  mins: 25
  goal: Your child can find Sirius from Orion's belt, find Procyon, and knows Sirius is the brightest star in the night sky.
  materials:
  - A clear winter evening
  - A red-covered flashlight
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method showing how to find Sirius along Orion's belt and Procyon to make a kite shape, and six observations about the two Dog Stars.
  steps:
  - - When and where
    - Clear evenings from January to March, after Orion is well up, about 8 or 9 p.m. Face south and southeast. Stargaze with an adult, in a dark spot away from roads, such as a back yard or a field you
      have permission to use. Dress warmly, bring a blanket, and cover a flashlight with red cellophane or a red balloon so your eyes stay used to the dark.
  - - The leading thought
    - ~ The Great Dog Star, Sirius, is the most famous of all stars in the literature of the ages. The Two Dog Stars were supposed by the ancients to be following the great hunter, Orion.
  - - Find Sirius
    - '~ a straight line drawn through Orion''s belt and dropping down toward the eastern horizon ends in a beautiful white star, which is Sirius.

      ~ How do you find Sirius? Which rises first, Orion or Sirius?'
  - - Find Procyon
    - 'Follow the book: draw a line from Betelgeuse to Rigel, from Rigel to Sirius, and then complete a kite shape. The fourth corner is Procyon, the Little Dog Star.

      ~ Which is the brighter, the Great Dog Star or the Little Dog Star? Can you see any fainter star near Procyon?'
  - - Twinkle
    - 'Watch Sirius low in the sky. It often flashes many colors. Ask: Is the star changing, or is something between us and the star? (The air, which bends its light this way and that.)'
  - - What we know now
    - The book asks what Sirius's color tells about its stage of life. Today we know its white color means it is hotter than our Sun. Sirius is about twice as heavy as the Sun, gives about 25 times as much
      light, and is one of our nearest neighbors, about 8.6 light-years away. That nearness is why it is the brightest star in our night sky.
  - - Nature notebook
    - ~ Make a chart showing Orion and the two Dog Stars.
  answers: Orion rises first; Sirius follows, like a dog after the hunter. Sirius is brighter than Procyon. Procyon is nearer to the North Star than Sirius. Procyon has a fainter star near it (the book
    calls it a twin).
- num: 230
  roman: CCXXX
  idx: 923
  unit: 37
  title: Capella and the Heavenly Twins
  mins: 25
  goal: Your child can find Capella and the Twins, Castor and Pollux, high overhead on winter evenings.
  materials:
  - A clear winter evening
  - A red-covered flashlight
  - A nature notebook and a pencil (colored pencils if you have them)
  book: The lesson has a leading thought, a method for finding Capella with lines drawn from the Big Dipper and the Pole-star, and seven observations on Capella, its constellation and the Heavenly Twins.
    A short introduction to the stars of summer follows.
  steps:
  - - When and where
    - Evenings in January and February, about 8 or 9 p.m. Look almost straight up; lying on a blanket helps. Stargaze with an adult, in a dark spot away from roads, such as a back yard or a field you have
      permission to use. Dress warmly, bring a blanket, and cover a flashlight with red cellophane or a red balloon so your eyes stay used to the dark.
  - - The leading thought
    - ~ There are, during the evenings of January and February, three brilliant stars almost directly overhead. One of these is Capella, the other two are the Heavenly Twins.
  - - Find Capella
    - 'Draw a line from the Dipper''s pointers to the Pole-star. From the Pole-star, turn a right angle away from the Dipper''s handle. That line passes through a big, bright yellow star: Capella.

      ~ What color is Capella, and how does its color compare with that of our sun?

      ~ Can you see the shield-like constellation of which Capella is a part? Do you know the name of this constellation?'
  - - The Twins
    - '~ Why are these stars called the Heavenly Twins? What is their Latin name? What are the names of the two stars? Are these twins set nearer together than the pointers of the Big Dipper?

      ~ How can you tell the Heavenly Twins from the Little Dog Star and its companion?'
  - - What we know now
    - 'The book invites you to find out whether the Twins are really as near together as they seem. They are not: Pollux is about 34 light-years from us and Castor about 51, so they only look side by side.
      Castor is itself a family of six stars, and Capella is a pair of big yellow giant stars circling each other, too close together to see apart even with a telescope.'
  - - Nature notebook
    - Draw the Big Dipper, the Pole-star, Capella and the Twins with the lines you used to find them.
  answers: Capella is yellow, like our Sun. Its constellation is Auriga, the Charioteer. North of about 44 degrees latitude Capella never sets. The Twins are Gemini; the two bright stars are Castor and
    Pollux. They are farther apart than the Dipper's pointers. Ancient sailors thought of the Twins as protectors of ships.
- num: 231
  roman: CCXXXI
  idx: 925
  unit: 37
  title: The bright stars of summer
  mins: 40
  goal: Your child can find Arcturus, Spica, Regulus, Vega, Deneb, Altair and Antares by star-hopping, and can name the Summer Triangle.
  materials:
  - Clear evenings from late May to July
  - A blanket to lie on
  - A red-covered flashlight
  - A planisphere or a star chart (a free star-chart app works too)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'An introduction to the stars of summer comes first, with a chart. The lesson then gives a leading thought, a method, and directions with a short description of each star: Regulus and the Sickle,
    Arcturus and the Crown, Spica, Vega, Antares, Deneb and the Northern Cross, and Altair and the Dolphin.'
  steps:
  - - When and where
    - From the middle of May through July. Summer nights come late, so go out about an hour after sunset (around 9:30 or 10 p.m. with daylight saving time). The book suggests lying on your back on the grass,
      with a star map and an "intermittently lighted candle"; we use a red flashlight instead. Stargaze with an adult, in a dark spot away from roads, such as a back yard or a field you have permission
      to use. Dress warmly, bring a blanket, and cover a flashlight with red cellophane or a red balloon so your eyes stay used to the dark.
  - - The leading thought
    - ~ The stars which we see shining during summer evenings are not the same ones that we see during the winter evenings, except those in the polar constellations.
  - - Arcturus and Spica
    - '~ Extend the handle of the Big Dipper following its own curve for about twice its length and it will end in a beautiful, yellow star, the only very bright one in that region.

      That is Arcturus. Keep curving on to a white star low in the south: Spica. (A rhyme: "Arc to Arcturus, speed on to Spica.")'
  - - Regulus and the Sickle
    - Run the line through the Dipper's pointers backward, away from the Pole-star, into the western sky. There is a backward question mark of stars, the Sickle, with Regulus at the bottom of the handle.
      It sets early, so look in late May.
  - - Vega and the Summer Triangle
    - '~ Vega is the most brilliant summer star that we see in the northern hemisphere.

      Look high in the east for bright blue-white Vega. Then find Deneb, at the head of the Northern Cross, and Altair, with a small star on each side of it. The book points out:

      ~ Altair, Deneb and Vega form a triangle with the most acute angle at Altair.'
  - - Antares
    - Low in the south in late June and July is a glowing red star, Antares, in the Scorpion. Compare its color with Vega's.
  - - What we know now
    - 'Distances are much better measured now. The book says light takes 29 years to reach us from Vega (today: about 25), 100 from Arcturus (about 37), 160 from Regulus (about 79) and 15 from Altair (about
      17). Spica, which the book says was never measured, is about 250 light-years away, and Deneb is so far away (well over a thousand light-years) that it must be one of the brightest stars we can see.
      The meteor shower from the Lion that the book mentions for November 13 now comes around November 17. And Antares'' "bright green" companion is really a hot blue-white star that only looks green beside
      the red one.'
  - - Nature notebook
    - Draw the Summer Triangle and the curve from the Dipper's handle to Arcturus and Spica. Write the date and time beside each star the first night you find it.
  practice: Learn one or two stars a night over several evenings, as the book does, rather than all at once.
  tip: The book teaches the stars by imaginary lines drawn from one star to another. Have your child point along each line with an outstretched arm.
- num: 232
  roman: CCXXXII
  idx: 937
  unit: 38
  title: The Sun and the Earth
  mins: 30
  goal: Your child can show with a shadow stick that the Sun's path is higher in summer than in winter, and can explain that this brings the seasons.
  materials:
  - A board and a peg or pencil 2 or 3 inches tall stuck upright in clay
  - A sunny south window or a sunny spot outdoors
  - A pencil or chalk and a ruler
  - A nature notebook and a pencil (colored pencils if you have them)
  book: A chapter on the Sun comes first. The lesson has a leading thought and fourteen observations on the Sun's heat, sunrise and sunset, the shortest and longest days, where the Sun rises and sets through
    the year, gravity on the Sun, and a shadow stick, with topics for writing.
  steps:
  - - Safety first
    - 'Never look at the Sun, not even for a moment, and not through sunglasses, binoculars or a telescope. In this lesson we study the Sun only by its shadows. To see the Sun itself, make a pinhole projector:
      a pinhole in a card lets a small image of the Sun fall on a sheet of paper while your back is to the Sun.'
  - - The leading thought
    - ~ The sun which is the source of all our light and heat and, therefore, of all life on our globe travels a path that is higher across the sky in June than the path which it follows in December, and
      hence we experience changes of seasons.
  - - Talk about it
    - '~ What does the sun do for us?

      ~ Is the sun equally hot all day? Why does it seem hotter to us at one time of the day than at another?'
  - - The shadow stick
    - '~ Place a peg two or three inches high upright in a board and place the board lengthwise on the sill of a south window or where it will get the south light.

      Every hour of a sunny day, mark the tip of the shadow and write the time. Join the dots.

      ~ Make a similar outline a month later and again a month later and note whether the shadow traces the same line during each of these days of observation. Note especially the length of the shadow at
      noon.'
  - - Sunrise and sunset
    - '~ Standing in a certain place, mark by some building, tree or other object just where the sun rises in the east and sets in the west on the first of February.

      Look at the horizon near sunrise or sunset, not at the Sun, and note the landmark. Do it again on the first of each month.'
  - - Long and short days
    - '~ Which is the shortest day of the year, and how long is it?

      ~ Which is the longest day of the year, and how many hours and minutes are there in it?

      Find sunrise and sunset times for your town in a newspaper or weather website and work out the day''s length.'
  - - A weighty question
    - '~ The sun is so much larger than the earth that its force of gravity is twenty-seven and two-thirds times that of the earth.

      ~ How much would you yourself weigh if you were there?

      Work it out with your child''s weight.'
  - - Nature notebook
    - Draw the shadow-stick board with the day's curve of dots. Next month, add the new curve in another color. Write the noon shadow length each time.
  practice: Repeat the shadow stick on the same date each month, and note the sunrise or sunset landmark on the first of each month.
  answers: 'We get the least heat soon after sunrise and the most in the early afternoon. The Sun feels hotter at midday because its light comes down more directly. In the Northern Hemisphere the shortest
    day is about December 21 and the longest about June 21 (their lengths depend on your latitude). The noon Sun is highest about June 21 and lowest about December 21. The Sun rises due east and sets due
    west about March 20 and September 22. Noon shadows are longest in December and shortest in June. Weight on the Sun: a 60-pound child would weigh 60 x 27 2/3 = 1,660 pounds (today''s figure is about
    28 times). What we know now: the seasons come from the tilt of the Earth''s axis, which makes the Sun''s path higher and the days longer in summer.'
- num: 233
  roman: CCXXXIII
  idx: 938
  unit: 38
  title: How to make a sundial
  mins: 40
  goal: Your child builds a simple sundial with its gnomon set at your latitude, aims it north, and marks the hours.
  materials:
  - Stiff cardboard or foam board (or the book's painted boards, cut by an adult)
  - A protractor, ruler and pencil
  - Your town's latitude (from a map or atlas)
  - A compass, or the noon shadow method below
  - Glue or tape
  - A clock
  book: The lesson gives a method and materials, then step-by-step directions with diagrams for making the gnomon (cut at the angle of your latitude), drawing the dial face with its half-circles, and setting
    the dial up and marking the hours with the help of a watch.
  steps:
  - - Safety first
    - Never look at the Sun; watch the shadow. If you use the book's wooden boards, an adult does all the sawing and drilling.
  - - What is a gnomon?
    - '~ The word gnomon is from a Greek word meaning "one who knows."

      It is the triangle that stands up on a sundial and casts the shadow.'
  - - Cut the gnomon
    - 'The book cuts a square board along a slanting line:

      ~ draw the line vw making the angle at x the same as the degree of latitude where the sundial is to be placed. At Ithaca the latitude is 42°, 27'' and the angle at x measures 42° 27''.

      Look up your own latitude, draw that angle with the protractor on cardboard, and cut out the triangle.'
  - - Make the dial
    - Draw a large half-circle on a square of cardboard. Glue the gnomon upright along the middle line, with its low point at the center of the half-circle and its sloping edge rising toward the curved
      side. (The book's page shows the full drawing with several half-circles; older children can follow it exactly.)
  - - Point it north
    - 'Set the dial on something level, with the gnomon''s sloping edge rising toward the north. The book gives a way without a compass:

      ~ wait until noon and set the dial so that the shadow from W will fall exactly between the points A, B, and this will mean that the dial is set exactly right.'
  - - Mark the hours
    - '~ Then with a good watch note the points on the arc E, K'', on which the shadow falls at one, two, three, four, and five o''clock

      Do it on one sunny day: mark the shadow every hour by the clock, morning and afternoon, and draw lines out from the gnomon''s foot.'
  - - What we know now
    - A sundial shows sun time, which is not quite clock time. Clocks run on time zones, so your town's sun time may be off by up to half an hour or more; daylight saving time moves the clock an hour more
      in summer; and because the Earth's orbit is oval and its axis tilted, sun time runs up to about 16 minutes fast or slow through the year. If your dial is set by the clock one day, expect it to drift
      a little in other months.
  - - Nature notebook
    - Draw your sundial and write your latitude. On a sunny day next week, compare the sundial with the clock at three different hours.
  tip: The sloping edge of the gnomon, set at your latitude and aimed north, points straight at the Pole-star. Check it on a clear night.
- num: 234
  roman: CCXXXIV
  idx: 944
  unit: 38
  title: The Moon
  mins: 40
  goal: Your child can explain the Moon's phases with a lamp and a ball, keeps a month of Moon drawings, and can describe what a visit to the Moon would be like.
  materials:
  - A lamp without a shade (the "Sun")
  - A small ball or an apple on a pencil (the "Moon")
  - A dark room
  - A nature notebook and a pencil (colored pencils if you have them)
  - A calendar for a month of Moon-watching
  book: The lesson has a leading thought, a method (watch the Moon for a month, starting at full moon), an experiment with a lamp and two apples to show the phases and eclipses, sixteen observations, and
    thirteen thinking questions about "the physical geography of the Moon." The book's list of reference books follows.
  steps:
  - - Safety
    - 'A bare light bulb gets hot: don''t touch it, and keep paper away. An adult pushes the pencil or skewer into the apple (the book uses a hat pin). Never look at the Sun, even during an eclipse, except
      through proper eclipse glasses or by a pinhole projector.'
  - - The leading thought
    - ~ The moon always has the same side turned toward us so we do not know what is on the other side. The moon shines by reflected light from the sun, and is always half in light and half in shadow.
  - - Phases with a lamp
    - 'Darken the room, turn on the lamp, and let your child be the Earth. Hold the "Moon" at arm''s length, a little above your head, and turn slowly in a circle, watching the Moon.

      ~ When just opposite the lamp, it shows its whole face lighted turned toward the earth.

      ~ Note that the moon always keeps one face toward the earth.

      Point out new moon (between you and the lamp), crescent, first quarter, full, third quarter, and the old crescent.'
  - - Eclipses
    - ~ Make an eclipse of the moon by letting the shadow of the earth fall upon it, and an eclipse of the sun by revolving the moon apple between the sun and the earth.
  - - Watch the real Moon
    - 'Start at full moon and look whenever you can for a month.

      ~ Describe how the moon looks when it is full.

      ~ What do you think you see in the moon?

      ~ Does the moon rise earlier or later on succeeding nights?

      The old moon is seen in the early morning; look for it in the east before school.'
  - - Thinking questions
    - '~ Supposing you could do without air or water and should be able to visit the moon, what would you find to be the color of the sky there?

      ~ Would the stars appear to twinkle? Could you see the stars in the daytime?

      ~ If you could shout on the moon, how would it sound?

      ~ If a man can carry seventy-five pounds on his back here, how much could he carry on the moon?'
  - - What we know now
    - Since this book was written, a spacecraft photographed the far side of the Moon (1959), and twelve astronauts walked on it between 1969 and 1972. They found a black sky even in daytime, no sound,
      no wind, and footprints that will last for ages. The Moon's sunny ground reaches about 250 degrees Fahrenheit and its night drops to about 200 below zero. And while there is no water to drink or swim
      in, scientists have found ice hidden in cold, dark craters near the Moon's poles.
  - - Nature notebook
    - 'Make a Moon calendar: a circle for each night, shaded to match what you saw, with the date and time. Leave a blank circle for cloudy nights.'
  practice: Keep the Moon calendar for a whole month, from full moon to full moon.
  answers: 'Phases: the Moon is always half lit by the Sun; we see more or less of the lit half as it goes around us. The new crescent is seen in the west after sunset; the full moon rises in the east about
    sunset and sets about sunrise; the old crescent rises before the Sun and is seen in the east in early morning. Moonrise is about 50 minutes later each night. We always see the same side because the
    Moon turns once on its axis for each trip around the Earth. New moon to new moon takes about 29 1/2 days, so a day on the Moon lasts about two weeks and a night about two weeks. In a year the Moon goes
    around the Earth a little over 13 times, and we see about 12 1/3 rounds of phases. The old moon disappears because its lit side turns away from us; in an eclipse the Earth''s shadow falls on a full
    moon. On the Moon the sky is black, stars do not twinkle and can be seen by day, and there is no sound because there is no air. At one-sixth the gravity: 75 x 6 = 450 pounds; a 100-yard throw becomes
    600 yards; a 135-foot kick becomes 810 feet (in the book''s simple reckoning).'
