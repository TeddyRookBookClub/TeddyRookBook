book:
  id: cu31924090281373
  title: Handbook of Nature-Study
  year: 1918 (eighth edition)
  key: comstock
  short: Handbook of Nature-Study
  eyebrow: Nature study · Anna Botsford Comstock
  hero: Anna Botsford Comstock's classic guide to looking closely at birds, animals, insects, plants, rocks and sky, for children about 6 to 12 with a parent. Each of her 234 lessons has a guide you can
    follow step by step, with the right page of the book beside it.
  how:
  - '<b>Short and outdoors.</b> Comstock wanted the lesson "short and sharp": ten minutes to half an hour, with only a few things to notice. She says a good field trip can fit into a 10 or 15 minute recess
    if you plan what to look for before you go.'
  - <b>In season, not in order.</b> She never expected anyone to teach every lesson. Pick the bird, animal or plant you can actually see this week; each guide says when and where to look.
  - <b>Let your child discover.</b> Her "leading thought" is for you, not to be read to the child at the start; the guides save it for the end. Her questions are suggestions, not a quiz. Ask a few, and
    in her words, "Do not tire the child with questions; lead him to question you, instead."
  - <b>Learn alongside.</b> You don't need to know the answers. Comstock tells teachers to say "I do not know; let us see if we cannot together find out," and to trust their own eyes over any book, hers
    included.
  - '<b>A nature notebook.</b> A small notebook and pencil that go on every walk. Her rules: it belongs to the child, drawings are better than long descriptions, and spelling and handwriting are never corrected
    in it.'
  - '<b>Look, don''t take.</b> In 1911 classes kept snakes, mice and wild birds'' nests for study. The guides keep her questions but change the method: watch wild animals where they live, never handle wild
    mammals or snakes, leave nests and eggs alone, let fish and tadpoles go where you found them, and wash hands after touching animals, soil or pond water.'
  lessonword: Lesson
  unitword: Topic
  numnote: Guide numbers match Comstock's own lesson numbers; she meant them to be taken in season, not in order, so pick what you can see this week.
units:
- id: 1
  name: 'Bird study: how a bird is made'
  from: 1
  to: 9
  text: 'Comstock starts bird study with the hen, then pigeons and the canary: feathers, flight, eyes, beaks, feet and bird talk, close up.'
- id: 2
  name: 'Bird study: birds to know'
  from: 10
  to: 35
  text: Twenty-six common birds of yard, field, marsh and farm, from the robin to the turkey, ending with a winter hunt for empty nests.
- id: 3
  name: Fish study
  from: 36
  to: 43
  text: The goldfish and seven fish of brooks and ponds, watched from the bank or in a dishpan for a few minutes and let go.
- id: 4
  name: 'Batrachian study: toads, frogs and newts'
  from: 44
  to: 48
  text: Raising a few tadpoles, the toad, the tree-frog, the frog and the red eft, which Comstock calls batrachians and we call amphibians.
- id: 5
  name: Reptile study
  from: 49
  to: 52
  text: Three common snakes and the turtle, studied at a safe distance, with Comstock's corrections of old snake stories.
- id: 6
  name: Mammal study
  from: 53
  to: 58
  text: The cottontail, muskrat, house mouse, woodchuck, red squirrel and chipmunk, through tracks, burrows and patient watching.
- id: 7
  name: 'Wild mammals: bat, skunk, raccoon and fox'
  from: 59
  to: 62
  text: Four night-time neighbors studied safely, through tracks, evening watching and Comstock's stories, never by handling.
- id: 8
  name: Domestic animals
  from: 63
  to: 69
  text: Dogs, cats, goats, sheep, horses, cattle and pigs, and what their wild ancestors' lives explain about them.
- id: 9
  name: Butterflies and moths
  from: 70
  to: 76
  text: Caterpillar, chrysalis or cocoon, and winged adult, from the swallowtail and monarch to the giant silk moths and the codling moth.
- id: 10
  name: Insects that live in leaves
  from: 77
  to: 79
  text: 'Leaf-miners, leaf-rollers and gall-makers: tiny insects that make their homes inside or out of leaves and stems.'
- id: 11
  name: Grasshoppers, crickets and cockroaches
  from: 80
  to: 83
  text: Jumpers and singers of the fields, and their flat, quick cousin the cockroach.
- id: 12
  name: The aquarium and pond insects
  from: 84
  to: 86
  text: Set up a pond-water aquarium, then meet dragon-fly nymphs and caddis-worms that grow up underwater.
- id: 13
  name: Aphids and the insects that hunt them
  from: 87
  to: 89
  text: 'Plant-lice and two hunters: the pit-digging ant-lion, and the aphis-lion, young of the golden-eyed lace-wing.'
- id: 14
  name: Mosquitoes, flies and beetles
  from: 90
  to: 94
  text: 'Insects that matter to our health and gardens: mosquito, house-fly, potato-beetle, ladybird and firefly.'
- id: 15
  name: Ants
  from: 95
  to: 97
  text: A summer of watching ants outdoors, then an observation nest to see them care for their young.
- id: 16
  name: Wasps and bees
  from: 98
  to: 105
  text: Mud-dauber, yellow-jacket, leaf-cutter, carpenter-bee and bumblebee, then the honey-bee, its comb and the work of the hive, all watched from a safe distance.
- id: 17
  name: Snail, earthworm and crayfish
  from: 106
  to: 108
  text: 'The start of Comstock''s "Other Invertebrate-Animal Study": three creatures of garden, soil and stream.'
- id: 18
  name: Daddy-longlegs and spiders
  from: 109
  to: 116
  text: 'Eight-legged builders: the harvestman, then cobwebs, funnel webs, orb-webs, domes, balloons, crab-spiders and egg-sacs.'
- id: 19
  name: Spring wildflowers of the woods
  from: 117
  to: 126
  text: 'Hepatica to lady''s slipper: the first flowers of the spring woods, studied where they grow and never picked or dug.'
- id: 20
  name: Summer wildflowers, climbers and water plants
  from: 127
  to: 134
  text: Buttercups, evening primrose, a twining vine, a parasite, milkweed, and the plants of ponds and marshes.
- id: 21
  name: 'Flower families: the composites'
  from: 135
  to: 139
  text: Comstock's outline for daisy-family flowers, then goldenrod, asters, the white daisy and the black-eyed Susan.
- id: 22
  name: Weeds and wayside plants
  from: 140
  to: 149
  text: Thistle, burdock, dandelion, mullein, wild carrot and other tough plants of fields and roadsides, ending with an outline for studying any weed.
- id: 23
  name: Spring garden flowers
  from: 150
  to: 154
  text: 'The start of Comstock''s Cultivated-Plant Study: crocus, daffodils, tulips, pansies and the bleeding heart.'
- id: 24
  name: Summer and fall garden flowers
  from: 155
  to: 165
  text: Poppies, nasturtiums, larkspur, iris, sunflower and other garden flowers, each with its own trick for getting insects to carry pollen.
- id: 25
  name: Farm and garden crops
  from: 166
  to: 172
  text: 'Clovers, corn, cotton, strawberries and pumpkins: how crop plants grow, feed the soil and depend on insects and wind.'
- id: 26
  name: Ferns, horsetails and mosses
  from: 173
  to: 178
  text: 'How flowerless plants make spores: fern fruit dots, the two stalks of the horsetail, and the hair-cap moss.'
- id: 27
  name: Mushrooms, molds and bacteria
  from: 179
  to: 187
  text: Mushrooms, puffballs, shelf fungi and other fungi studied by eye and spore print only, then sealed experiments with mold and germs.
- id: 28
  name: Tree study
  from: 188
  to: 198
  text: Adopt a tree for a year, make leaf prints, and meet the maple, elm, oaks, hickory, chestnut, horse-chestnut, willows, cottonwood and ash.
- id: 29
  name: The apple tree
  from: 199
  to: 201
  text: The apple tree and grafting, the apple blossom becoming fruit, and the apple inside and out.
- id: 30
  name: Evergreens
  from: 202
  to: 204
  text: 'Pine, Norway spruce and hemlock: needles, cones, seeds and how evergreens handle snow.'
- id: 31
  name: Flowering shrubs and small trees
  from: 205
  to: 208
  text: Dogwood, staghorn sumac, witch-hazel and mountain laurel, each with a clever trick for flowers or seeds.
- id: 32
  name: The brook
  from: 209
  to: 210
  text: 'Part IV, Earth and Sky, begins: how a brook carries soil, cuts its banks and drops its load.'
- id: 33
  name: Crystals, minerals and rocks
  from: 211
  to: 218
  text: Growing crystals, salt, how to test a mineral, and quartz, feldspar, mica, granite, calcite, marble and limestone.
- id: 34
  name: The magnet
  from: 219
  to: 219
  text: What magnets attract, their poles, and a homemade floating compass.
- id: 35
  name: The soil
  from: 220
  to: 220
  text: Soil as rock flour and humus, with experiments on how sand, loam and clay take in and hold water.
- id: 36
  name: Water and weather
  from: 221
  to: 224
  text: Vapor, dew, frost and snow; air pressure and the barometer; reading weather maps and keeping a weather record.
- id: 37
  name: The stars
  from: 225
  to: 231
  text: 'Evening lessons outdoors: the Dippers and Pole-star, the polar constellations, the winter stars around Orion, and the bright stars of summer.'
- id: 38
  name: The Sun and the Moon
  from: 232
  to: 234
  text: The Sun's changing path and the seasons, a homemade sundial, and a month of watching the Moon.
lessons:
- title: Feathers as clothing
  mins: 30
  goal: Your child can show how a hen's feathers overlap like shingles to shed rain, and tell a smooth outer feather from the fluffy down underneath.
  materials:
  - A hen to watch up close (a friend's backyard flock, a farm, a petting farm or a fair)
  - Two or three chicken or duck feathers (from the coop floor or a craft store)
  - A hand lens if you have one
  - Nature notebook and pencil
  - A little water in a cup
  book: The leading thought, a short method, and eleven questions about how the hen's feathers are laid on, the difference between back and breast feathers, down and pin-feathers, and how she oils her feathers.
    A short poem follows.
  steps:
  - - When and where
    - 'Any season works, so long as you can stand close to a hen. A backyard flock, a farm stand with chickens, a petting farm or the poultry barn at a county fair are all good. Ask the owner before you
      go in.

      Safety: chickens and ducks can carry germs even when they look clean and healthy. Wash hands with soap and water after touching a bird, a feather or anything in the coop, and keep hands away from
      faces until then.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is for you, the parent. She asks that it not be read to the child at the start, so the child can find it out by looking. Read it to yourself now:

      ~ Feathers grow from the skin of a bird and protect the bird from rain, snow, wind and cold. Some of the feathers act as cloaks or mackintoshes and others as underclothing.

      A mackintosh is an old word for a raincoat.'
  - - Watch the hen
    - 'Stand quietly by the hen for a few minutes. Look at her back, her breast and the underside of her body. Then ask Comstock''s first questions:

      ~ How are the feathers arranged on the back of the hen? Are they like shingles on the roof? If so, what for?

      ~ How does a hen look when standing in the rain?

      If it is not raining, let your child guess, then try the next step.'
  - - Feathers up close
    - 'Lay a back feather and a fluffy breast feather side by side. Look with the hand lens if you have one.

      ~ Compare a feather from the back and one from the breast and note the difference.

      ~ Are both ends of these feathers alike? If not, what is the difference?

      ~ Is the fluffy part of the feather on the outside or next to the bird''s skin? What is its use?

      Drip a drop of water on the smooth part of a feather and watch it roll.'
  - - Down and pin-feathers
    - '~ Some feathers are all fluff and are called "down." At what age was the fowl all covered with down?

      ~ What is a pin-feather? What makes you think so?

      A pin-feather is a new feather still wrapped in its sheath, like a little rolled-up brush. If the owner can show you one on a bird, look but don''t pull it.'
  - - Oiling the raincoat
    - 'Watch the hen preen. She reaches back toward the base of her tail, where there is an oil gland, and draws feathers through her beak.

      ~ How do hens keep their feathers oily and glossy so they will shed water?

      ~ Where does the hen get the oil? Describe how she oils her feathers and which ones does she oil most? Does she oil her feathers before a rain?'
  - - Put it into words
    - Ask your child to tell you what the feathers do for the hen. Now you can share Comstock's leading thought and see how much of it your child found alone.
  - - Nature notebook
    - Draw one back feather and one fluffy breast feather side by side, and label the smooth web and the fluff. Add the date and where you saw the hen.
  practice: Over the next week, look at any bird in the rain or just after it. Do its feathers look sleek or ruffled?
  tip: In the United States it is against the law to keep feathers of most wild birds, even ones you find on the ground. Use chicken, duck or craft-store feathers for this lesson, and look at wild bird
    feathers where they lie.
  num: 1
  roman: I
  idx: 52
  unit: 1
- title: Feathers as ornament
  mins: 30
  goal: Your child can describe how a rooster's or drake's plumage differs from the hen's, and give Comstock's reason why the mother bird is often plainer.
  materials:
  - A chance to see a hen and rooster, or a duck and drake (a farm, park pond or fair)
  - A peacock feather or a good picture of a peacock (optional)
  - A bird book or pictures of the Baltimore oriole, goldfinch, scarlet tanager and cardinal
  - Colored pencils
  - Nature notebook
  book: The leading thought and method, then eleven questions comparing hen and rooster, turkey hen and gobbler, duck and drake, and the oriole pair, and ending with a peacock feather. A poem by Robert
    Greene closes the lesson.
  steps:
  - - When and where
    - 'Any season. Mallard ducks on a park pond are the easiest male and female pair to compare: the drake has the shining green head. A farm or fair with a rooster or a turkey gobbler is even better. Spring
      is a good time to see wild male birds in their brightest colors.'
  - - Keep the big idea in mind
    - 'Read this to yourself; let your child discover it:

      ~ The color of feathers and often their shape are for the purpose of making birds more beautiful; while in others, the color of the feathers protects them from the observation of their enemies.'
  - - Compare the pair
    - 'Look at a hen and rooster, or a duck and drake.

      ~ Note difference in shape and color of the tail feathers of hen and rooster.

      ~ Do the graceful curved tail feathers of the rooster help him in flying? Are they stiff enough to act as a rudder?

      ~ Which do you think the more beautiful the hen or the rooster?

      On the pond:

      ~ Is the drake more beautiful than the duck?'
  - - The showing-off bird
    - 'If you can see a turkey gobbler, watch him strut.

      ~ Note how he turns his spread tail this way and that so the sunshine will bring out the beautiful changeable colors. Do you think he does this so you can see and admire him?

      If not, look at a picture of a peacock with his tail spread.'
  - - Why is the mother plain?
    - 'Ask Comstock''s big question:

      ~ What advantage is it for these fowls to have the father bird more beautiful and bright in color than the mother bird?

      Let your child think about who sits on the nest, and who would be easier for a hawk or a fox to see.'
  - - The peacock feather
    - 'If you have a peacock feather or a picture:

      ~ Study a peacock''s feather. What color is the eye-spot? What color around that? What color around that?

      Count the rings of color together.'
  - - Put it into words
    - 'Ask: Why might a father bird be bright and a mother bird plain? Then share the leading thought.

      Comstock wrote that the mother bird chooses the brightest mate. Scientists today still agree that females choosing mates is a big reason males of many birds are so colorful.'
  - - Nature notebook
    - 'Draw the male and female of one kind of bird side by side in color: a rooster and hen, a drake and duck, or a cardinal pair from the bird book. Label which is which.'
  practice: Keep a list this week of bird pairs you can tell apart, male from female.
  tip: Stay a good step back from roosters, ganders and turkey gobblers. They can peck and flap hard when they guard their flock.
  num: 2
  roman: II
  idx: 54
  unit: 1
- title: How birds fly
  mins: 30
  goal: Your child can explain that a bird flies by pressing down on the air with its wings, and that the tail steers like a rudder.
  materials:
  - A paper fan or a stiff piece of cardboard
  - An umbrella (for a windy day or a quick test indoors)
  - A wing feather and a tail feather (chicken, duck or craft-store)
  - A chance to watch a hen or other birds take off and land
  - Nature notebook
  book: The leading thought, the method (open the hen's wing, use a dried fowl's wing) and seventeen questions about fans, vaulting poles, umbrellas, the shape of wing feathers, the up and down strokes,
    and the tail as rudder.
  steps:
  - - When and where
    - 'Any season, any place with birds: pigeons in a park, ducks on a pond, chickens in a yard. Windy days are especially good for this lesson.

      Safety: chickens and ducks can carry germs even when they look clean and healthy. Wash hands with soap and water after touching a bird, a feather or anything in the coop, and keep hands away from
      faces until then.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ A bird flies by pressing down upon the air with its wings, which are made especially for this purpose. The bird''s tail acts as a rudder during flight.

      Comstock suggested the teacher open the hen''s wings for the children. Only do this if the owner handles the bird; otherwise just watch the hens flap.'
  - - Can you push the air?
    - 'Hand your child the fan.

      ~ Can you press against the air with a fan?

      ~ Do you think a bird''s wings correspond to our arms? If so why?

      Let your child flap the fan up and down and feel the push.'
  - - The umbrella test
    - '~ If you carry an umbrella on a windy morning, which catches more wind, the under or the top side? Why is this? Does the curved surface of the wing act in the same way?

      Open the umbrella and pull it quickly down toward the ground, then lift it up. Which way is harder? (Stay away from strong gusts, and don''t jump off anything holding an umbrella.)'
  - - Look at a wing feather
    - '~ Take a wing feather. Are the barbs as long on one side of the quill as on the other? Do they lie at the same angle from the quill on both sides? If not why?

      ~ Is the quill of the feather curved?

      ~ Compare a tail feather with a wing feather and describe the difference.'
  - - Watch them fly
    - 'Watch birds take off and land.

      ~ Why do birds flap their wings when they start to fly?

      ~ Do you think a bird could sail through the air without something to steer with? What is the bird''s rudder?

      ~ Does the hen when she flies keep the tail closed or open like a fan?'
  - - Put it into words
    - Ask your child to explain to you how a bird gets up into the air. Then share the leading thought.
  - - Nature notebook
    - Draw a wing feather and a tail feather side by side. Mark the narrow side and the wide side of the wing feather. Add a quick sketch of a bird in flight with its tail spread.
  practice: 'Watch for young birds in late spring and early summer. Comstock asks: "Have you ever seen a young bird whose tail is not yet grown, try to fly? If so, how did it act?"'
  tip: Comstock's "what is the bird's rudder" questions work best if you let your child guess wrong first and then watch real birds.
  num: 3
  roman: III
  idx: 57
  unit: 1
- title: Eyes and ears of birds
  mins: 25
  goal: Your child can describe a hen's eye (pupil, iris, film lid) and find where her ears are.
  materials:
  - A hen or rooster to watch closely
  - Binoculars (optional)
  - Nature notebook and colored pencils
  book: The leading thought, the method (watch the hen and rooster in the yard or schoolroom) and six questions about how the hen looks at you, the colors of her eye, her eyelids and film lid, and where
    her ears are.
  steps:
  - - When and where
    - 'Any season, wherever you can stand close to a calm hen or rooster. Hens are often quiet and still when they rest or sit in the sun.

      Safety: chickens and ducks can carry germs even when they look clean and healthy. Wash hands with soap and water after touching a bird, a feather or anything in the coop, and keep hands away from
      faces until then.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The eyes and ears of birds are peculiar and very efficient.'
  - - How does she look at you?
    - 'Stand still near the hen and watch her head.

      ~ Why does the hen turn her head first this side and that as she looks at you? Can she see an object with both eyes at once? Can she see well?

      Try it: close one eye, then the other, while looking at a toy. A hen''s eyes are on the sides of her head, so each eye sees a different picture.'
  - - The colors of the eye
    - '~ How many colors are there in a hen''s eye? Describe the pupil and the iris.

      The pupil is the black hole in the middle; the iris is the colored ring around it.'
  - - Eyelids and the film lid
    - '~ Does the hen wink as we do? Has she any eyelids?

      ~ Can you see the film lid? Does it come from above or below or the inner or outer corner? When do you see this film lid?

      A drowsy hen is the best place to see the thin film lid slide across her eye. Look in the mirror at the little pink fold in the inner corner of your own eye; Comstock says it is what is left of our
      film lid.'
  - - Find the ears
    - '~ Where are the hen''s ears? How do they look? How can you tell where the rooster''s ears are?

      ~ Do you think the hen can see and hear well?

      Look just behind and below the eye. Many hens and roosters have a bare patch of skin, the ear lobe, there.'
  - - Put it into words
    - Ask your child to tell you three things about a hen's eyes and ears. Then share the leading thought.
  - - Nature notebook
    - Draw a large hen's eye in color, with the black pupil and the colored iris. Mark where the film lid comes from. Add the ear lobe if you saw one.
  practice: 'Notice how other birds look at things this week: does a robin tip its head to one side?'
  tip: Comstock's teacher's story says a hawk high in the air can see a mouse on the ground. Children love to test how far away they can see a small toy.
  num: 4
  roman: IV
  idx: 59
  unit: 1
- title: The beak of a bird
  mins: 25
  goal: Your child can explain how a hen's sharp beak and a duck's wide, flat bill each fit the food the bird eats.
  materials:
  - A chance to watch a hen and a duck feed (a farm, or a hen yard plus a park pond)
  - A pair of tweezers and a small kitchen strainer
  - A few seeds and a bowl of water with bits of leaf floating in it
  - Nature notebook
  book: 'The leading thought, the method (the hen or chick, then the duckling or gosling) and five questions comparing the hen''s beak with the duck''s bill: food, hardness, the saw teeth that strain water,
    other uses, and nostrils.'
  steps:
  - - When and where
    - Any season. You need a hen to watch pecking and a duck to watch dabbling, so a farm with both, or a hen yard and a park pond. Please don't feed bread to park ducks; it is bad for them.
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ Each kind of bird has a beak especially adapted for getting its food. The beak and feet of a bird are its chief weapons and implements.'
  - - Watch the hen
    - '~ What kind of food does the hen eat and where and how does she find it in the field or garden? How is her beak adapted to get this food?

      ~ Has the hen any teeth? Does she need any?'
  - - Watch the duck
    - '~ Compare the bill of the hen with that of the duck? What are the differences in shape? Which is the harder?

      ~ Note the saw teeth along the edge of the duck''s bill. Are these for chewing? Do they act as a strainer? Why does the duck need to strain its food?'
  - - Try being a bird
    - 'Scatter a few seeds and have your child pick them up with tweezers: that is the hen''s beak. Then float bits of leaf in a bowl of water and scoop them out with the strainer: that is the duck''s bill.

      ~ Could a duck pick up a hen''s food from the earth or the hen strain out a duck''s food from the water?'
  - - Other uses and nostrils
    - '~ For what other things than getting food do these fowls use their bills?

      ~ Can you see the nostrils in the bill of a hen? Do they show plainer in the duck?'
  - - Put it into words
    - Ask your child to tell you why a hen's beak and a duck's bill are different shapes. Then share the leading thought.
  - - Nature notebook
    - Draw a hen's head and a duck's head side by side, the beaks large and clear. Under each, write what the bird eats.
  practice: Each day this week, look closely at one bird's beak and guess what it eats from the shape.
  tip: 'Comstock''s teacher''s story suggests a game: try to put away books and pencils with hands held behind the back. It shows how a bird''s beak does the work of hands.'
  num: 5
  roman: V
  idx: 60
  unit: 1
- title: The feet of birds
  mins: 25
  goal: Your child can compare a hen's scratching feet with a duck's webbed feet and say how each fits the bird's life.
  materials:
  - A chance to watch a hen walk and scratch and a duck walk and swim
  - Mud or damp sand to look for tracks
  - Nature notebook and pencil
  book: The leading thought, the method (watch the hen and the duck moving, and the duck swimming) and ten questions about the hen's toes and claws, scratching, tracks, how the toes are numbered, the duck's
    web, where the legs are set, and how each bird perches or sleeps.
  steps:
  - - When and where
    - 'Any season. A farm with hens and ducks, or a hen yard and a park pond. Muddy days are best, because you can find tracks.

      Safety: chickens and ducks can carry germs even when they look clean and healthy. Wash hands with soap and water after touching a bird, a feather or anything in the coop, and keep hands away from
      faces until then.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The feet of birds are shaped so as to assist the bird in getting its food as well as for locomotion.

      Locomotion means moving from place to place.'
  - - The hen's feet
    - '~ Are the toes of the hen long and strong? Have they long, sharp claws at their tips?

      ~ How are the legs and feet of the hen covered and protected?

      ~ How are the hen''s feet and legs fitted for scratching the earth, and why does she wish to scratch the earth?'
  - - Tracks
    - '~ Can a hen run rapidly? What sort of a track does she make?

      Look for tracks in mud or sand. Count the toes in a track.

      ~ You number your fingers with the thumb as number one and the little finger as five. How do you think the hen''s toes are numbered?'
  - - The duck's feet
    - '~ Has the duck as many toes as the hen? What is the chief difference between the feet of the duck and the hen?

      ~ Which of the duck''s toes are connected by a web? Does the web extend to the tips of the toes? What is the web for and how does it help the duck?'
  - - Running and swimming
    - '~ Can a duck run as well as a hen? Can the hen swim at all?

      Watch the duck waddle, then watch it paddle. Ask: Why are the duck''s legs set so far back?'
  - - Put it into words
    - Ask your child to tell you how the hen's feet and the duck's feet each help the bird. Then share the leading thought.
  - - Nature notebook
    - Draw a hen's foot and a duck's foot side by side, or draw the tracks you found. Number the toes the way Comstock suggests.
  practice: Look for bird tracks in snow, mud or wet sand this week. Can you tell a duck track from a pigeon or crow track?
  tip: Comstock also asks where the hen sleeps and how she holds her perch. If you can visit at dusk, watch the hens go to roost.
