- title: The song sparrow
  mins: 30
  goal: Your child can recognize the song sparrow by its streaky breast with a dark central spot and by its bright early-spring song.
  materials:
  - Binoculars (optional)
  - A brushy place near water, a garden edge or a hedge
  - A recording of the song sparrow's song
  - Nature notebook
  book: The leading thought, the method (all in the field; poetry about the bird to read or memorize) and nine questions about the song and its "Little Maid" words, where it sings, colors and size, how
    to tell it from other sparrows, nest and eggs, how late it stays, and its protection and food. A poem, "The Sing-away Bird", follows.
  steps:
  - - When and where
    - Early spring, before the robins are back in full song, is Comstock's time. Song sparrows sing from shrubs and fence posts near streams, hedges, gardens and brushy fields. In many places they stay
      all year.
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The beautiful song of this sparrow is heard earlier in the spring than the notes of bluebird or robin. The dark blotch in the center of its speckled breast distinguishes this sparrow from all others;
      it is very beneficial and should be protected from cats.'
  - - Listen for the song
    - '~ Have you noticed a little brown bird singing a very sweet song in the early spring? Did the song sound as if set to the words "Little Maid! Little Maid! Little Maid! Put on the teakettle, teakettle-ettle
      ettle?"

      Say the words together, then listen for them outside.'
  - - Find the singer
    - '~ Where was this bird when you heard him singing? How high was he perched above the ground?

      Walk toward the sound slowly and look at the top of a shrub.'
  - - Look closely
    - '~ Describe the colors and markings of the song sparrow on head, back, throat, breast, wings and tail. Is this bird as large as the English sparrow? What makes it look more slim?

      Find the dark spot in the middle of the streaky breast.'
  - - How it moves
    - ~ How can you distinguish the song sparrow from the other sparrows? When disturbed does it fly up or down? How does it gesture with its tail as it disappears in the bushes?
  - - Put it into words
    - Ask your child how to know a song sparrow by ear and by eye. Then share the leading thought.
  - - Nature notebook
    - Draw the song sparrow singing on a twig, with its streaked breast and center spot. Write "Little Maid, Little Maid" underneath, or your child's own words for the song.
  practice: Comstock suggests reading or memorizing a poem about the song sparrow. Read "The Sing-away Bird" from the page together this week.
  tip: Comstock asks how we can protect these birds. Keeping pet cats indoors is one of the biggest things a family can do for songbirds.
