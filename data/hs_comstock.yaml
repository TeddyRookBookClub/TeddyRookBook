  unit: 16
  title: The industries of the hive
  mins: 30
  goal: 'Your child can describe the jobs done inside a hive: building comb, storing honey and bee-bread, feeding the young, cleaning, fanning and sealing cracks.'
  materials:
  - A visit to an observation hive (some nature centers, museums, libraries and farms have one), or a beekeeper's frame of comb
  - A section of comb honey
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the hive: the brood chamber and the supers, frames, the bees'' habit of keeping brood below and honey above, and wax-making. Lesson CV gives the leading thought, a method that
    is a demonstration and informal talk, directions for a schoolroom observation hive with glass sides (and 1911 prices), and twenty-two questions.'
  steps:
  - - When and where
    - Spring through early fall, when bees are busy. Comstock says this lesson "should be in the nature of a demonstration" and "an informal talk between teacher and pupils." Look up a nature center or
      museum near you with a glass observation hive, or ask a beekeeper to show you a frame.
  - - Safety first
    - 'At an outdoor hive, follow the beekeeper''s rules and wear a veil. Sting safety: watch bees and wasps from a few steps away, move slowly, and never swat at them. If anyone in the family is allergic
      to stings, keep well back and have their medicine with you.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ In the hive are carried on the industries of wax-making, building of honey-comb, storing of honey and bee-bread, caring for the young, keeping the hive clean and ventilated and calking all crevices
      with bee glue.'
  - - The house
    - '~ What is the hive, and what do wild bees use instead of the hive?

      Comstock''s story says wild bees usually live in hollow trees or in caves.'
  - - Watch the workers
    - 'At the glass, pick one bee and follow her.

      ~ How does the bee act when storing honey in a cell?

      ~ How does a bee place pollen in a cell and pack it into bee-bread?

      ~ Describe how the nurse bees feed the young, and how the young look when eating.'
  - - Keeping house
    - '~ How do the bee workers keep their house clean?

      ~ Describe the actions of the bees when they are ventilating the hive.

      On a hot day, look at the hive entrance for bees standing still and fanning their wings hard.'
  - - Put it into words
    - Ask your child to list every job they saw a bee do. Then read the leading thought aloud and check it against the list.
  - - Nature notebook
    - 'Draw a frame of comb and color the parts: capped honey near the top, cells of colored pollen (bee-bread), and capped brood. Label one bee doing each job you saw.'
  tip: 'What we know now: bees also "dance" on the comb to tell each other the direction and distance of good flowers. A scientist named Karl von Frisch worked out the meaning of the dance after Comstock''s
    book was written. Watch for it in an observation hive.'
- num: 106
  roman: CVI
  idx: 483
  unit: 17
  title: The garden snail
  mins: 30
  goal: Your child can describe how a snail moves on its one foot, where its eyes and feelers are, and how its shell grows.
  materials:
  - A snail or two from the garden (after rain, under boards or leaves)
  - A clear jar or plastic box with damp soil, moss and a lettuce leaf, and a cloth cover
  - A piece of clear glass or plastic
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Section VII of the book, "Other Invertebrate-Animal Study", opens with Comstock''s story of the snail: its wonderful single foot, its slime track, its eyes on stalks, its rasping tongue, its breathing
    hole and its spiral shell. Then Lesson CVI''s leading thought, a method with directions for a snailery, eleven questions, and a poem.'
  steps:
  - - When and where
    - Spring to fall, on damp mornings and evenings or after rain. Look under boards, stones, flowerpots and leaves in gardens.
  - - Safety first
    - Snails and slugs can carry germs and parasites. Wash hands with soap and water after handling them, never put fingers in mouths, and never eat a wild snail. Keep them for a few days at most and put
      them back where you found them.
  - - A snailery
    - 'Comstock''s directions: a glass jar "with a little soil and some moss or leaves at the bottom, and a shallow dish of water at one side. The moss and soil should be kept moist." Give fresh leaves
      or bits of fruit, and cover the top with cloth and a rubber band.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The snail carries his dwelling with him, and retires within it in time of danger. He can climb on any smooth surface.'
  - - One foot
    - 'Let a snail crawl onto the clear glass and look at it from underneath.

      ~ How does a snail walk? Describe its "foot." How can it move with only one foot? Describe how it climbs the side of the glass jar. How does it cling?

      ~ What sort of a track does a snail leave behind it? What is the use of this mucus?

      Look for ripples moving along the underside of the foot.'
  - - Eyes and feelers
    - '~ Where are the snail''s eyes? Why is this arrangement convenient? If we touch one of the eyes what happens?

      Touch an eye-stalk only very lightly, with the tip of a soft grass blade.

      ~ Look below the eyes for a pair of feelers. What happens to these if you touch them?'
  - - The shell
    - '~ What is the use of its shell to a snail? What does the snail do if startled?

      ~ How many spiral turns are there in the full-grown shell? Are there as many in the shell of a young snail? Can you see the little ridges on the shell? Do you think that these show the way the shell
      grew?

      Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the snail from the side with its eyes on their long stalks and the short feelers below, and draw the shell from above with its spiral. Count and write the number of turns.
  practice: 'Listen closely when a snail eats a lettuce leaf: you may hear its rasping tongue. Comstock asks: "Describe the way it eats. Can you see the horny upper jaw?"'
- num: 107
  roman: CVII
  idx: 487
  unit: 17
  title: The earthworm
  mins: 30
  goal: Your child can describe how an earthworm moves, feels and feeds, and explain how worms plow and enrich the soil.
  materials:
  - A garden spade and a patch of garden soil
  - A tray, damp paper towels and a spray bottle
  - A flashlight
  - A ruler
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the earthworm as a farmer: long before people tilled the soil, worms were plowing, harrowing and fertilizing it, drawing leaves into their burrows and leaving their "casts"
    on the surface. Then Lesson CVII''s leading thought, method and questions.'
  steps:
  - - When and where
    - 'Spring and fall, when the soil is moist. Dig in the garden, or look on paths after a rain. Comstock''s method: "They are nocturnal workers and may be observed by lantern light." A flashlight walk
      on a damp night works well.'
  - - Be kind to worms
    - Wet your hands before you pick up a worm, keep worms on damp paper towels out of the sun, and put them back in the soil after fifteen minutes or so. Wash hands with soap and water afterward.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The earthworm is a creature of the soil and is of much economic importance.

      Economic importance means it matters to farmers and gardeners.'
  - - How it moves
    - 'Put a worm on the damp tray.

      ~ How does the earthworm crawl? How does it turn over? Has it legs? Compare its movement with that of a snake, another legless animal. What special provision for locomotion has the earthworm?

      ~ Compare the lengths of the contracted and extended body.

      Stroke it very gently from tail to head with a fingertip, then from head to tail: you may feel the tiny bristles that grip the soil.'
  - - Its body and senses
    - '~ Describe the body—its shape and color, above and below. Examine the segments. Do all the worms have the same number? Compare the head end with the tail end of the body. Has every worm a "saddle,"
      or clitellum?

      ~ Does the earthworm hear easily? Has it eyes? Is it sensible to smell or to touch? What sense is most strongly developed?

      Shade half the tray with your hand and see which way the worm goes.'
  - - The night's work
    - 'Try Comstock''s experiment:

      ~ To form some estimate of the work done in a single night, remove the "casts" from a square yard of earth one day, and examine that piece of earth the next.

      ~ What is the food of the earthworm? How does it get its food?

      Look for leaves pulled partly down into burrows.'
  - - Nature notebook
    - Draw an earthworm, label the head end, the saddle and the tail, and write how long it was stretched out and pulled in. Record how many casts appeared on your square yard overnight. Read the leading
      thought aloud.
  tip: 'What we know now: many of the earthworms in North American gardens came from Europe long ago. In some northern forests that had no earthworms, they are changing the forest floor, so never dump leftover
    fishing worms in the woods.'
- num: 108
  roman: CVIII
  idx: 493
  unit: 17
  title: The crayfish
  mins: 35
  goal: Your child can describe the crayfish's claws, legs, eyes and tail, and explain how it walks, swims backward and hides.
  materials:
  - A shallow, clear stream with stones (or a pond)
  - A dip-net or a large plastic cup
  - A white tub or dish pan of stream water with some gravel
  - Rubber boots or old sneakers
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the crayfish, so "rich in organs": its great nippers, walking legs, jaw-feet, swimmerets and fan-shaped tail, and how it walks forward and darts backward. Then Lesson CVIII''s
    leading thought, method and seventeen questions.'
  steps:
  - - When and where
    - Late spring to early fall, in shallow streams with stones. Turn over stones slowly and watch the water just downstream. In wet meadows you may find their mud chimneys.
  - - Safety first
    - 'Water safety: an adult stays within arm''s reach of young children at the water''s edge. Keep back from steep or slippery banks, and wash hands after handling pond water, mud or water creatures.

      Crayfish pinch. Scoop one up with the net or cup and look at it in the tub; if an adult picks one up, it is by the back just behind the big claws. Look for a little while, then let it go in the same
      stream. Never move crayfish to a different pond or stream.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The crayfish, or crawfish, as it is sometimes called, has one pair of legs developed into great pincers for seizing and tearing its food and for defending itself from enemies. It can live in mud
      or water. It belongs to the same animal group as do the insects, and it is a near cousin of the lobster.'
  - - Claws and legs
    - '~ What is there peculiar about the crayfish which makes it difficult to pick it up?

      ~ How many legs, in all, has the crayfish? What are the short legs near the mouth used for? What are the great nippers used for? How many legs does the crayfish use when walking?'
  - - Eyes and feelers
    - '~ Look carefully at the eyes. Describe how they are set. Can they be pushed out or pulled in? Can they be moved in all directions? Of what advantage is this to the crayfish?

      ~ How many antennæ has the crayfish? Describe the long ones and tell how they are used.'
  - - The tail
    - 'Watch it dart away in the tub.

      ~ How does the crayfish swim? With what does it make the stroke?

      ~ Of how many pieces is the tail made? Make a sketch of it.'
  - - Hiding
    - 'Add a few stones to the tub and watch.

      ~ Where do they like to hide? Do they go headfirst into their hiding place, or do they back in? Do they stand ready to defend their retreat?

      ~ When you look down into the brook, are the crayfishes usually seen until they move? Why is this?

      Then let it go and read the leading thought aloud.'
  - - Nature notebook
    - Draw the crayfish from above, label the nippers, walking legs, eyes on stalks, long antennæ and the fan-shaped tail, and count its legs.
  practice: 'Comstock asks: "If the crayfish loses one of its legs or antennæ, does it grow out again? How does the crayfish grow?" Look along the stream for a cast-off crayfish shell, left when it molted.'
- num: 109
  roman: CIX
  idx: 497
  unit: 18
  title: The daddy-longlegs
  mins: 25
  goal: Your child can explain why a daddy-longlegs is not an insect, and describe its legs, eyes and how it cleans itself.
  materials:
  - A daddy-longlegs (on walls, tree trunks, fences and garden plants in summer and fall)
  - A clear jar with a few drops of sugar water or a bit of soft fruit
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of "Grandfather Greybeard", whom country children asked where the cows were: his seven-jointed legs, his eyes on a little turret, how he cleans each leg through his jaws, and
    his food. Then Lesson CIX''s leading thought, method and seven questions.'
  steps:
  - - When and where
    - Summer and fall, on house walls, porches, fences, tree trunks and garden plants.
  - - Handle gently
    - 'A daddy-longlegs is harmless: it has no venom and does not bite people. But its legs come off very easily, so never pick it up by a leg. Let it walk onto a leaf or into the jar on its own. When you
      have finished looking, put every creature back where you found it.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ These long-legged creatures have one pair of legs too many to allow them to be classed with the insects. They are more nearly related to the spiders, who also have eight legs. They are pretty creatures
      when examined closely, and they do many interesting things.'
  - - Legs
    - '~ Where did you find the harvestman? What did it do as soon as it was disturbed? How many names do you know for this little creature?

      ~ Which is the longest pair of legs? The next? The next? The shortest?'
  - - Stilts and eyes
    - '~ If you had such long stilts as he has, they would be about forty feet long. Would you lift yourself that high in the air? Does the "daddy" lift his body high or swing it near the ground?

      ~ Can you see a black dot on top of the front end of the body? If you should see this dot through a microscope it would prove to be two bright black eyes.'
  - - Mealtime and washing
    - 'Comstock''s method: put a few drops of sweetened water at one side of the jar, "the children will surely have an opportunity to see this amusing creature clean his legs."

      ~ Note what care he takes of his legs. How does he clean them? Which does he clean the oftenest? Do you think the very long second pair of legs is used as much for feeling as for walking?'
  - - Nature notebook
    - 'Draw a daddy-longlegs from above: one round body (no waist, unlike a spider) and eight long legs, with the second pair longest. Then read the leading thought aloud and let it go.'
- num: 110
  roman: CX
  idx: 499
  unit: 18
  title: Cobwebs
  mins: 25
  goal: Your child can describe a tangled cobweb and how the house spider uses it, and count a spider's legs and body parts.
  materials:
  - A cobweb in a corner of a room, preferably with a spider
  - A flashlight
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's introduction to spiders as "the civil engineers among the small inhabitants of our fields and woods," builders of bridges, nets and balloons, and useful insect-eaters. Then Lesson CX's
    leading thought, method and six questions, and a poem.
  steps:
  - - When and where
    - 'Any season, indoors. Comstock''s method: "The pupils should have under observation a cobweb in a corner of a room, preferably with a spider in it." Choose a web you can see clearly in a well-lit
      room.'
  - - Safety first
    - 'Spider safety: never pick up a spider you don''t know. Look with a hand lens from a few inches away, touch webs only with a grass stem or a pencil, and never reach into a dark corner, woodpile or
      shed where you can''t see.

      The black widow is also a cobweb spider: shiny black, often with a red hourglass underneath. It lives in garages, sheds, woodpiles and outdoor furniture. Look only at webs in clear, open corners of
      the house.

      Comstock asks children to put a spider under a tumbler. Instead, look at it with the lens where it sits, or use the book''s pictures.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The cobwebs which are found in the corners of ceilings and in other dark places in our houses, are made by the house spider which spins its web in these situations for the purpose of catching insects.'
  - - The web
    - 'Shine the flashlight across the web from the side so the threads show.

      ~ Is the web in a sheet or is it a mass of crisscrossed, tangled threads? How are the threads held in place?

      ~ What is the purpose of this web? Where does the spider hide?'
  - - The spider at work
    - '~ If a fly becomes tangled in a web, describe the action of the spider.

      ~ If the spider is frightened, what does it do? Where does the silken thread come from, and how does its source differ from the source of the silken thread spun by caterpillars?

      A spider spins from the tip of its abdomen; a caterpillar spins from near its mouth.'
  - - Count and compare
    - '~ How many legs has it? How does the spider differ from insects in this respect? How many sections are there to the body?

      ~ Can you see the palpi on each side of the jaws? Where are the spider''s eyes? How many pairs has it?

      Then read the leading thought aloud.'
  - - Nature notebook
    - 'Draw a spider and an insect side by side: the spider with two body parts and eight legs, the insect with three body parts, six legs and antennæ. Label the differences.'
- num: 111
  roman: CXI
  idx: 501
  unit: 18
  title: The funnel web
  mins: 20
  goal: Your child can find a grass spider's funnel web on a dewy morning and explain how the funnel works as a hiding place and a back door.
  materials:
  - A lawn, hedge or low shrubs on a dewy late-summer morning
  - A spray bottle of water (for dry mornings)
  - A long grass stem
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the funnel web, with a line about "dew-bright webs" in roadside fields: a broad sheet with a narrow tube at one side, where the spider hides and from which it escapes by a
    rear exit. Then Lesson CXI''s leading thought, method and six questions.'
  steps:
  - - When and where
    - Late summer and early fall, early in the morning when dew makes the webs shine. Look on lawns, along hedges and in low shrubs. If it is dry, mist a web gently with the spray bottle.
  - - Safety first
    - 'Spider safety: never pick up a spider you don''t know. Look with a hand lens from a few inches away, touch webs only with a grass stem or a pencil, and never reach into a dark corner, woodpile or
      shed where you can''t see.

      Grass spiders are harmless to people, but never poke a finger into the funnel.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The grass spider spins funnel-shaped webs in the grass to entrap the insects of the field. This web has a back door.'
  - - The shape
    - '~ What is the general shape of the web? Is there a tunnel leading down from it? Why is it called a funnel web?

      ~ Of what use is the funnel tube, and what is its shape? Where does it lead, and of what use is it to the spider?'
  - - How it's built
    - '~ How is the web made? Is there any regularity in the position of the threads that make it? How is it stayed in place?

      ~ What insects become entangled in this web?'
  - - A gentle test
    - '~ Touch the web lightly, and note how the spider acts? Jar the web roughly, and what does the spider do?

      Use the tip of the grass stem, and touch only the edge of the sheet.'
  - - Nature notebook
    - Draw the web from the side, like a trumpet lying down, with the spider in the narrow end and the back door marked. Read the leading thought aloud.
  practice: 'Comstock''s last question: "Compare this web with similar funnel webs found in corners of cellars, sheds or piazzas, and see if you think the same kind of spider made both." Look, but don''t
    reach in.'
- num: 112
  roman: CXII
  idx: 503
  unit: 18
  title: The orb-web
  mins: 35
  goal: Your child can describe the parts of an orb-web (frame, spokes, sticky spiral), test which threads are sticky, and watch a spider build.
  materials:
  - An orb-web with its spider, in a garden or meadow in late summer
  - A pencil
  - A spray bottle of water (optional)
  - A watch or timer
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the orb-web, "the most intricate and beautiful in design" of all the work of small creatures: the frame and guy-lines, the spokes, the temporary spiral and the sticky spiral,
    and how the black and yellow garden spider builds it. Then Lesson CXII''s leading thought, method, eleven questions, and a second set of ten questions on how an orb-web is made, with a diagram.'
  steps:
  - - When and where
    - Late summer and fall, in gardens, tall weeds and along porches. Comstock says spiders "may be seen making their webs in the early morning or in the evening." In grass and woods, wear long pants tucked
      into socks, and check everyone for ticks when you get home.
  - - Safety first
    - 'Spider safety: never pick up a spider you don''t know. Look with a hand lens from a few inches away, touch webs only with a grass stem or a pencil, and never reach into a dark corner, woodpile or
      shed where you can''t see.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ No structure made by a creature lower than man is so exquisitely perfect as the orb-web of the spider.'
  - - Frame and spokes
    - '~ Is the orb-web usually hung horizontally or vertically?

      ~ Observe the radii, or "spokes," of the web. How many are there? How are they fastened to surrounding objects?

      ~ Observe the silken thread laid around the spokes. Is it a spiral line or is each circle complete?'
  - - The pencil test
    - '~ Touch any of the "spokes" lightly with the point of a pencil. Does it adhere to the pencil and stretch out as you pull the pencil away? Touch one of the circling lines with a pencil point, and
      see if it adheres to the point and is elastic.

      ~ How does the spider manage to run about its web without becoming entangled in the sticky thread?'
  - - Where is the spider?
    - '~ Where does the spider stay, at the center of the web or in a little retreat at one side?

      ~ If an insect becomes entangled in the web, how does the spider discover the fact and act?'
  - - Watch one build
    - 'At dusk or just after dawn, find a spider starting a new web and time it.

      ~ How does the spider manage to place the supporting line between two points?

      ~ How many minutes did it take the spider to complete the web?

      Then read the leading thought aloud.'
  - - Nature notebook
    - 'Draw the orb-web: frame lines, spokes and the spiral, with the zigzag band at the center if it has one. Write how many spokes you counted and how long the building took.'
- num: 113
  roman: CXIII
  idx: 506
  unit: 18
  title: The filmy dome
  mins: 20
  goal: Your child can find a filmy dome web and describe how the little spider hangs beneath it and catches insects.
  materials:
  - A woodland path on a sunny day in late summer or early fall
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of the filmy dome, "like bubbles cut in half," shining with rainbow colors, held by guy-lines with a tangle of threads above, and the little spider hanging back downward beneath
    its top. Then Lesson CXIII's leading thought, method and five questions, and lines from "The Prisoner of Chillon."
  steps:
  - - When and where
    - 'Comstock''s method says it best:

      ~ On a sunny day in late summer or early autumn, while walking along woodland paths, the careful observer is sure to see suspended among the bushes or in the tops of weeds, or among dead branches
      of young hemlocks, the filmy dome webs.

      Walk with the sun ahead of you or to one side: the domes shine only when the light hits them. In grass and woods, wear long pants tucked into socks, and check everyone for ticks when you get home.'
  - - Safety first
    - 'Spider safety: never pick up a spider you don''t know. Look with a hand lens from a few inches away, touch webs only with a grass stem or a pencil, and never reach into a dark corner, woodpile or
      shed where you can''t see.

      Before you go, learn to recognize poison ivy ("leaves of three, let it be"), and poison oak or poison sumac where they grow. We never eat any wild berry, leaf or plant.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ One little spider spins a filmy dome, beneath the apex of which it hangs, back downward, awaiting its prey.'
  - - Find a dome
    - '~ Where did you discover the filmy dome? What is the size of the dome? Does it open above or below? How is it held in place?

      ~ Are there many crisscrossed threads extending above the dome? If so, what do you think they are for?'
  - - The spider
    - '~ Where does the spider stay? Is the spider large and heavy, or small and delicate?

      ~ What does the spider do if an insect becomes entangled in its web?'
  - - A small test
    - '~ Throw a bit of stick or leaf upon a filmy dome web, and note what becomes of it.

      Use a very small bit. Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the dome like an upside-down bowl, with the tangle of threads above it and the tiny spider hanging under the top. Color the rainbow shine if you saw it.
- num: 114
  roman: CXIV
  idx: 508
  unit: 18
  title: Ballooning spiders
  mins: 20
  goal: Your child can find the silk threads that cover a field in fall and describe how young spiders travel by floating on silk.
  materials:
  - A grassy field or lawn on a warm, sunny October morning or evening
  - A low wall, fence post or tall grass to watch
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of ballooning spiders: fields carpeted with glistening single threads in autumn, and young spiders that climb to a high point, spin out silk and float away on the breeze like
    thistle seeds. Then Lesson CXIV''s leading thought, method and four questions.'
  steps:
  - - When and where
    - 'Comstock''s method: "These observations should be made out of doors during some warm sunny day in October." Early morning or late afternoon is best, when the sun is low.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The young of many species of spiders scatter themselves like thistle seeds in balloons which they make of silk.'
  - - A field of silk
    - 'Stand so the low sun is ahead of you and a little to one side. Never look straight at the sun.

      ~ Look across the grass some warm sunny morning or evening of early fall, and note the threads of spider silk gleaming everywhere, not regular webs, but single threads spun from grass stalk to grass
      stalk, or from one object to another, until the ground seems glistening with silk threads.'
  - - Watch a balloonist
    - '~ Find a small spider on a bush, fence post, or at the top of some tall grass stalk; watch it until it begins to spin out its thread.

      ~ What happens to the thread as it is spun out?

      ~ If the thread does not become entangled in any surrounding object what happens? If the thread does become entangled, what happens?

      Be patient: a spider may tilt up its abdomen and wait for just the right breeze.'
  - - Why travel?
    - '~ How far do you suppose a spider can travel on this silken aeroplane? Why should the young spider wish to travel?

      Talk about what would happen if hundreds of spiderlings stayed where they hatched. Then read the leading thought aloud.'
  - - Nature notebook
    - Draw a tiny spider on a grass tip, tipped up, with long threads streaming into the air. Add the date and the weather.
  tip: 'What we know now: ballooning spiders have been caught high in the sky and found on ships far out at sea, so Comstock''s "How far?" can mean hundreds of miles.'
- num: 115
  roman: CXV
  idx: 509
  unit: 18
  title: The white crab-spider
  mins: 20
  goal: Your child can find a crab-spider hiding in a flower and explain how its color helps it catch insects.
  materials:
  - 'Flowers in bloom: white and yellow ones are best (daisies, goldenrod, trilliums in spring)'
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the crab-spiders, which walk sidewise or backward and spin no webs, and of the white crab-spider, which takes on the color of the flower it hides in: greenish white in the
    white trillium, yellow in goldenrod. Then Lesson CXV''s leading thought, method and four questions, with a photograph of crab-spiders on goldenrod.'
  steps:
  - - When and where
    - 'Late spring through fall, in the middle of flowers where insects come for nectar. Comstock mentions white trilliums in spring and goldenrod in late summer. Look for a flower with a bee or fly sitting
      oddly still: it may be a crab-spider''s catch.'
  - - Look, don't pick
    - 'Comstock''s method asks children to bring a spider to school in its flower. Look at it in the garden or field instead. Don''t pick wildflowers like trilliums: they grow back very slowly and are protected
      in some states. Spider safety: never pick up a spider you don''t know. Look with a hand lens from a few inches away, touch webs only with a grass stem or a pencil, and never reach into a dark corner,
      woodpile or shed where you can''t see.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The white crab spider has markings upon its body of the same color as the flower in which it rests and is thus enabled to hide in ambush out of the sight of its victims—the insects which come to
      the flower for nectar.'
  - - Find one
    - '~ What is the shape of the body of the crab-spider? Which of the legs are the longest? Are these legs directed forward or backward?

      Watch how it walks if it moves: sideways, like a crab.'
  - - Hidden colors
    - '~ How is the body marked? What colors do you find upon it? Are the colors the same in the spiders found in the trilliums, as those in other flowers? Why is this? Do you think that the color of the
      spider keeps it from being seen?

      ~ Do the crab-spiders make webs? How do they trap their prey?

      Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the flower with the spider hidden in it, colored so it almost disappears, and its long front legs held open like arms. Then draw it again on a flower of a different color to show how it would
      stand out.
  tip: Comstock asks children to move a white spider into a yellow daffodil to see if it changes color. Scientists have since found that this kind of spider can change between white and yellow, but it takes
    days, not minutes.
- num: 116
  roman: CXVI
  idx: 510
  unit: 18
  title: The nests of spiders
  mins: 25
  goal: Your child can find spider egg-sacs, describe how they are made and placed to protect the eggs, and follow one through the winter.
  materials:
  - A field with goldenrod and tall weeds in fall, or the sides of stones
  - A bit of bright yarn to mark a spot
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of how spider mothers protect their eggs: silk sacs of many shapes, a silvery disk on a stone that looks like a lichen, waterproof outer coats and soft linings. Lesson CXVI gives
    the leading thought, method and three questions, with a photograph of the garden spider''s egg-sac on goldenrod. This is the last lesson on animals; Part III, Plant Life, begins on the next page.'
  steps:
  - - When and where
    - 'Comstock: "This is a good lesson for September and October." The easiest sac to find and recognize is the black and yellow garden spider''s: a brown, papery, jug-shaped sac about an inch long, hung
      among goldenrod or tall weeds. Look on the sides of stones in fields for small flat silvery disks too. In grass and woods, wear long pants tucked into socks, and check everyone for ticks when you
      get home.'
  - - A change from the book
    - 'Comstock''s method asks children to collect egg-sacs and open some to count the eggs. We leave them closed: opening a sac kills the eggs.

      Don''t collect sacs from dark corners, sheds or woodpiles, where they may belong to a black widow. Spider safety: never pick up a spider you don''t know. Look with a hand lens from a few inches away,
      touch webs only with a grass stem or a pencil, and never reach into a dark corner, woodpile or shed where you can''t see.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The spider mothers have many interesting ways of protecting their eggs, which they envelop in silken sacs and place in safety.'
  - - Where is it?
    - ~ In what situation did you find the nest? How was it protected from rain and snow? To what was it attached?
  - - What is it made of?
    - 'Look closely with the lens; touch only the outside, gently.

      ~ Of what texture is the outside of the sac? Is the outside made of waterproof silk? What is the texture of the lining?

      Read Comstock''s description of the silvery disk on a stone, with its smooth waterproof top and soft, downy nest below.'
  - - Mark it and wait
    - 'Tie the yarn to a stem near the sac (not to the sac itself). Visit it in winter and again in spring.

      ~ When do the spiderlings hatch? Do as many spiders come out of the sac as there were eggs? Why is this?

      Then read the leading thought aloud.'
  - - Nature notebook
    - Draw each kind of egg-sac you found, life size, with where it was. Leave space on the page to add the date the spiderlings come out in spring.
  practice: This lesson ends the Animal Life part of the book. Look back through the nature notebook together and let your child choose a favorite page to show someone.
- title: The hepatica
  mins: 35
  goal: Your child finds hepaticas in the early spring woods, tells their furry buds and old purple leaves from the new ones, and starts watching one plant through the year.
  materials:
  - Nature notebook, pencil and colored pencils
  - A hand lens (magnifying glass)
  - A piece of colored yarn to mark a plant
  - Boots for wet woods
  book: This is the first numbered lesson of Part III, Plant Life, under “Wild-Flower Study.” A Teacher's Story describes the hepatica in the melting-snow woods; the lesson gives a Leading thought, a Method
    and nine questions.
  steps:
  - - When and where
    - 'Hepaticas are among the very first flowers of spring, often in March or April while snow still lies on the north side of things. Look in rich, moist woods of trees that drop their leaves, on slopes
      and under the leaf litter.

      Comstock''s short essays just before this lesson (on how to begin plant study) say the right way to begin plant study with young children is by awakening their interest. These guides do that by going
      out to look first.

      Before you go, make sure your child can spot poison ivy: three leaflets on each leaf ("leaves of three, let it be"), often climbing as a hairy vine or growing as a low patch.'
  - - The leading thought
    - 'Read it aloud before you set out:

      ~ The hepatica flower buds are developed in the fall, so as to be ready to blossom early in the spring. This plant lives only in moist and shady woods.

      Say: These flowers were already made last fall and waited under the snow. Let''s see if we can find one.'
  - - Find them
    - 'Walk slowly and look for a bit of pale blue, pink or white among the brown leaves. Ask Comstock''s first questions where you stand:

      ~ Where do you find the hepaticas? Do you ever find them in the open fields? Do you ever find them in the pine woods?'
  - - Old leaves and new
    - 'Kneel by a plant. The leaves that lived through the winter are leathery and purple-brown; new leaves come later, soft and furry.

      ~ How do the leaves look in early spring? Sketch in color one of these old leaves.

      If you find a plant not yet in bloom, look at its center without digging:

      ~ Find a hepatica plant before it begins to blossom. Look, if possible, at its very center. Describe these little flower buds. When were they formed?'
  - - Look closely at a flower
    - 'Use the hand lens on a flower that is still on its plant. Don''t pick it.

      ~ Are the hepaticas in your woods all pink, or blue, or white? Do those which are at first pink or blue fade to white later?

      ~ How many petals has your hepatica? Can you see that the outer ones are sepals, although they look just like the petals?

      ~ What insects do you find visiting the hepaticas?

      Point out the three green, furry bracts a little way down the stem, below the flower.'
  - - Mark a plant to visit
    - 'Comstock''s last question turns this into a year-long study:

      ~ Describe a hepatica plant in the woods; mark it so that you will know it, and visit it occasionally during the summer and autumn, noting what happens to it.

      Tie loose yarn on a nearby twig (not on the plant) and note the spot. Hepaticas die if dug up and moved to sunny places, so leave them where they grow.'
  - - Nature notebook
    - 'Back home, your child draws one old purple-brown leaf in color and one flower, with the date and place. Add one sentence: what surprised you?'
  practice: Visit the marked plant every few weeks through summer and fall and add a dated note each time. In the fall, look for the new buds forming at the center.
  tip: 'Pick no wildflowers in this unit: look, draw and photograph instead. Many spring woodland flowers grow slowly and some are protected. After a walk through woods or tall plants, check everyone for
    ticks.'
  answers: The flower buds were formed the autumn before. The outer three of the colored parts are sepals; the three green bracts below the flower are not part of the flower at all.
  num: 117
  roman: CXVII
  idx: 521
