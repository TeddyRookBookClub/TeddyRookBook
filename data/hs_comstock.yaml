  title: The skunk
  mins: 25
  goal: Your child can describe the skunk's colors and slow, fearless walk, tell what it eats, and recognize its track.
  materials:
  - Fresh snow, or soft mud along a field edge or stream, for tracks
  - The book's drawing of skunk tracks
  - A ruler
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the skunk: its size and black-and-white fur, its burrow and winter sleep, the young born in May, its scent as a defense and why it never hurries, its food of insects and mice,
    and its double line of tracks. Then Lesson LX''s leading thought, method and six groups of questions. A note by Thoreau on a young skunk and a passage on the skunk''s voice follow.'
  steps:
  - - When and where
    - 'Skunks are about at night from early spring to late fall, and sleep in their dens through the coldest weather. You are more likely to find signs than skunks: tracks in snow or mud, small holes dug
      in lawns where they hunted grubs, or a whiff of their smell on a summer night.'
  - - Safety first
    - 'Safety first: never touch, feed or try to catch a wild mammal, even one that looks tame, sleepy or hurt. Bats, skunks, raccoons and foxes can carry rabies. If one acts strangely, or is out in daylight
      acting sick, move away and tell an adult, who can call the local animal control or wildlife office.

      If you meet a skunk, back away slowly and quietly. A skunk stamps its front feet and raises its tail as a warning before it sprays.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The skunk has depended so long upon protecting itself from its enemies by its disagreeable odor, that it has become stupid in this respect, and seems never to be able to learn to keep off of railroad
      tracks. It is a very beneficial animal to the farmer because its food consists so largely of injurious insects and rodents.

      Comstock''s method is to let children answer the questions "from personal observations or inquiries." So it is fine to ask grandparents or neighbors what they have seen.'
  - - What does a skunk look like?
    - 'Look at the photograph in the book and ask:

      ~ How large is a skunk? Describe its fur. Where does the black and white occur in the fur? Of what use is the white to the skunk?

      Comstock''s answer: the white is a warning at night that "here is an animal which had best be left alone."'
  - - Fearless and slow
    - '~ Does it hunt for its food during the day or the night? Does the skunk ever hurry? Is it afraid? How does it protect itself from its enemies?

      Talk about why an animal that nothing dares attack never needs to learn to be quick or careful.'
  - - Read the tracks
    - 'Look at the book''s drawing of skunk tracks, then at any tracks you find.

      ~ Describe the skunk''s track as follows: How many toes show in the track? Does the palm or heel show? Are the tracks near together? Do they form a single or a double line?

      Comstock explains that the skunk walks on its palms and heels as well as its toes, as a bear or a person does. Measure a track with the ruler.'
  - - A good neighbor?
    - '~ How does the skunk benefit farmers? Does it ever do them any injury? Do you think that it does more good than harm?

      Then read the leading thought aloud. Comstock''s word "stupid" is hers; ask your child whether "fearless" might be a kinder word.'
  - - Nature notebook
    - Draw a skunk from the photograph, showing exactly where the white stripes run. Beside it, copy the double line of tracks. Add any signs you found and the date.
  tip: Comstock mentions a scientist who kept young skunks as pets. Wild animals should stay wild, and in many places it is against the law to keep one.
- num: 61
  roman: LXI
  idx: 275
  unit: 7
  title: The raccoon
  mins: 30
  goal: Your child can describe the raccoon's masked face, ringed tail and hand-like feet, and find and describe raccoon tracks near water.
  materials:
  - A walk along a stream, pond or lake shore with soft mud
  - A ruler
  - The book's photographs of raccoons
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the raccoon: its mischievous masked face, its life in hollow trees near streams, its night hunting, its handling of food, and pet coons. Then Lesson LXI: leading thought, a
    method with writing topics, and ten groups of questions. An unnumbered section on the wolf follows the lesson.'
  steps:
  - - When and where
    - Raccoons are active at night from spring to fall and stay in their dens in the coldest weeks. The best place to look is soft mud at the edge of a stream or pond, where they come to hunt for crayfish
      and frogs. Their tracks look like small handprints.
  - - Safety first
    - 'Safety first: never touch, feed or try to catch a wild mammal, even one that looks tame, sleepy or hurt. Bats, skunks, raccoons and foxes can carry rabies. If one acts strangely, or is out in daylight
      acting sick, move away and tell an adult, who can call the local animal control or wildlife office.

      Don''t touch raccoon droppings: they can carry a worm that is dangerous to people. Never feed raccoons, and keep trash cans closed.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The raccoon lives in hollow trees or caves along the banks of streams. It sleeps during the day and seeks its food at night. It sleeps during the winter.

      Comstock''s "ideal method" was a pet coon. Today we use tracks, the book''s pictures, and her story instead.'
  - - Hunt for tracks
    - 'Walk slowly along the muddy edge and look for prints with five long toes.

      ~ Where have you found raccoon tracks? How do they differ from those of fox or dog? How far are the footprints apart? Can you see the heel and toe prints?

      ~ What is the size of the track, the length, the breadth?

      Measure one track and the distance between two of them.'
  - - Hands like ours
    - '~ Describe the coon''s feet. How many toes on the front feet? How many on the hind feet? How does this differ from the cat and dog? How do the front and hind feet differ in appearance? Can both be
      used as hands?

      ~ Why do raccoons like to live near the water? What do they find of interest there?'
  - - The masked face
    - 'Look at the photographs in the book.

      ~ Describe the coon''s face. How is it marked? What is its expression?

      ~ How do coons arrange themselves for a nap in a tree? How do they cover the head? How is the tail used?'
  - - Put it into words
    - 'Ask your child to tell you where a raccoon spends its day and its night. Then read the leading thought aloud.

      For a writing day, Comstock suggests this topic: "The Autobiography of a Coon One Year Old."'
  - - Nature notebook
    - Draw a front track and a hind track side by side, life size if you measured them, and label the toes. Add a sketch of the masked face and ringed tail, and where and when you found the tracks.
  tip: 'What we know now: Comstock asks how raccoons "prepare their meat before eating it." People long believed raccoons wash their food. Scientists now think that when a raccoon dabbles its food in water
    it is mostly feeling it with its very sensitive hands.'
- num: 62
  roman: LXII
  idx: 282
  unit: 7
  title: The fox
  mins: 30
  goal: Your child can tell a fox track from a dog track, describe the red fox, and tell some of the ways it outwits dogs and people.
  materials:
  - Fresh snow (best) or soft mud
  - The book's photographs and drawings of foxes and their tracks
  - A ruler
  - Binoculars (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Before the fox comes an unnumbered section on the wolf, which Comstock says should be studied first, mostly through stories and reading. Then her story of the red fox (its track in the snow, its
    den and cubs, its food and its tricks) and Lesson LXII with its leading thought, method and seven questions.
  steps:
  - - When and where
    - 'Winter, the morning after a fresh snow, is the best time: Comstock says the lesson "may well be given when there are fox tracks for observation." Look along field edges, fence lines and woodland
      paths. In spring, foxes raise their cubs in dens; if you know of one, watch only from far away with binoculars.'
  - - Safety first
    - 'Safety first: never touch, feed or try to catch a wild mammal, even one that looks tame, sleepy or hurt. Bats, skunks, raccoons and foxes can carry rabies. If one acts strangely, or is out in daylight
      acting sick, move away and tell an adult, who can call the local animal control or wildlife office.

      Never go close to a den.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The red fox is so clever that it has been able, in many parts of our country, to maintain itself despite dogs and men.'
  - - Fox track or dog track?
    - 'Follow a line of tracks in the snow.

      ~ Describe the fox''s track. How does it differ from the track of a small dog?

      Comstock''s story helps: when the fox lopes along, three of its prints fall in a line, one ahead of another, with the fourth a little to one side. She says the fox has longer legs than most dogs of
      its weight. If a dog has walked nearby, compare the two lines and measure a print of each.'
  - - What does a fox look like?
    - 'Look at the photographs in the book.

      ~ Describe the red fox, its color and form as completely as you can. What is the expression of its face? What is there peculiar about its tail? What is the use of this great bushy tail in the winter?'
  - - Clever fox
    - 'Read Comstock''s paragraphs on the fox''s tricks, or ask a neighbor who has watched foxes, then ask:

      ~ When chased by dogs, in what direction does the fox run? Describe all of the tricks which you know by which the fox throws the dog off the scent.

      ~ Have you ever heard the fox bark? Did it sound like the bark of a dog?'
  - - Fox family
    - '~ When are the young foxes born? How many in a litter? What color are they? How do they play with each other? How do they learn to hunt?

      Then read the leading thought aloud and ask your child what "clever" means for a fox.'
  - - Nature notebook
    - Draw a short line of fox tracks and, beside it, a dog's tracks, so the difference shows. Add a sketch of the fox with its bushy tail curled around it as it sleeps in the snow.
  practice: For a reading day, Comstock's wolf section suggests stories such as "Lobo" in Ernest Thompson Seton's Wild Animals I Have Known. Your child can retell the story and say what it shows about how
    wolves live.
- num: 63
  roman: LXIII
  idx: 288
  unit: 8
  title: Dogs
  mins: 35
  goal: Your child can compare a dog's feet, ears, nose and teeth with a cat's, and explain how a dog's body suits a hunter that runs its prey down.
  materials:
  - A calm, friendly dog (your own or a neighbor's, with the owner there)
  - A sheet of paper to roll into a tube
  - A patch of damp sand, mud or snow for paw prints (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the dog: its long friendship with people, its wolf-like ancestors, how it hunts by scent and runs its prey down, and the many breeds. Then Lesson LXIII''s leading thought,
    method and thirteen questions on legs, feet, eyes, ears, nose, teeth, moods and breeds.'
  steps:
  - - When, where and safety
    - 'Any season, with a dog your child knows. Comstock asks for "a well-disposed dog which would not object to being handled."

      Ask the owner before touching any dog. Let the dog sniff the back of your hand first, stroke its back or side, and never bother a dog that is eating, sleeping or chewing a toy. Keep faces away from
      the dog''s face. Let the owner lift the lips or paws if you look at teeth or claws.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The dog is a domesticated descendant of wolf-like animals and has retained certain of the habits and characteristics of his ancestors.'
  - - Feet and claws
    - '~ Compare the feet of the cat with those of the dog and note which has the heavier pads.

      ~ Can the dog retract his claws so that they are not visible, as does the cat? Of what use is this arrangement to the dog? Are the front feet just like the hind feet? How many toe impressions show
      in the track of the dog?

      If you can, let the dog walk across damp sand or snow and look at the prints: you will see the claw marks.'
  - - Ears and a paper tube
    - 'Watch the dog''s ears when it hears a sound.

      ~ How is this flap used when the dog is listening?

      Now try Comstock''s experiment:

      ~ Roll a sheet of paper into a flaring tube and place the small end upon your own ear, and note if it helps you to hear better the sounds in the direction toward which the tube opens?

      Hold the tube gently against the outside of the ear; never push anything into an ear.'
  - - The nose knows
    - '~ Does the dog recognize his friends or become acquainted with strangers by means of his sight or of his powers of smelling?

      Hide a treat (with the owner''s OK) under one of three cups and watch how the dog finds it: eyes or nose?'
  - - How a dog talks
    - '~ How by action, voice, and especially by the movement of the tail does the dog express the following emotions: Delight, friendliness, affection, attention, anger, fear, shame, excitement?

      Ask your child to act out two or three of these with their own "tail" and let you guess.'
  - - Put it into words
    - 'Ask: What does a dog still do that its wild ancestors did? Then read the leading thought aloud.

      What we know now: scientists today agree that dogs come from wolves tamed long ago.'
  - - Nature notebook
    - 'Draw a dog''s paw print and a cat''s paw print side by side (from the book or real prints) and show which has claw marks. Comstock''s question 11 makes a good writing task too:

      ~ Tell or write a story of some dog which you know by experience or hearsay.'
  practice: List all the dog breeds your child can name this week, and for one of them find out what job it was first bred to do (Comstock's question 13).
- num: 64
  roman: LXIV
  idx: 295
  unit: 8
  title: The cat
  mins: 30
  goal: Your child can describe how a cat's paws, eyes, whiskers and teeth fit it for hunting by springing from hiding, and read a cat's moods from its voice and tail.
  materials:
  - A calm, friendly cat (your own or a neighbor's)
  - A bit of string or a feather toy
  - A dim room and a bright window (for the pupils)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the cat, which begins with the family cat that tried to mother her as a baby, then tells how cats hunt, see, wash and raise kittens. Then Lesson LXIV: the leading thought,
    a method for young and older children, fourteen groups of questions, and a list of story topics about wild cats.'
  steps:
  - - When and where
    - Any season, any day, with a cat at home or a neighbor's. Comstock's method for young children is to give "a few questions at a time" and let them watch their own kitten.
  - - Gentle with the cat
    - 'Let the cat come to you. Watch rather than hold: don''t pull the paws to see the claws or open the mouth to see the teeth. Wait for a stretch, a scratch or a yawn instead. Wash hands after play,
      and wash any scratch with soap and water.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The cat was made a domestic animal before man wrote histories. It gets prey by springing from ambush and is fitted by form of body and teeth to do this. It naturally hunts at night and has eyes
      fitted to see in the dark.'
  - - Cat talk
    - '~ How much of Pussy''s language do you understand? What does she say when she wishes you to open the door for her? How does she ask for something to eat?

      ~ When she carries her tail straight up in the air is she in a pleasant mood? When her tail "bristles up" how does she feel? What is it a sign of, when she lashes her tail back and forth?'
  - - The hunter at play
    - 'Drag the string slowly past the cat and watch her crouch and pounce.

      ~ Describe how she lies in ambush. How does she hold the mouse as she pounces upon it?

      ~ Which walks the more silently, a dog or a cat? Why? Describe the cat''s foot, including the toe-pads.'
  - - Eyes and whiskers
    - 'Look at the cat''s eyes near the bright window, then in the dim room.

      ~ What is the shape of the pupil in daylight? In the dark?

      ~ How many whiskers has she? How long are they? What is their use?'
  - - Washing up
    - '~ Describe how the cat washes her face. How does she clean her fur? How does her rough tongue help in this?

      Then ask your child to tell you why a cat is built for hiding and pouncing, and read the leading thought aloud.'
  - - Nature notebook
    - 'Draw the cat''s eye twice: once with a narrow slit pupil (bright light) and once with a round, wide pupil (dark). Add a sketch of the cat crouched to pounce, and the date.'
  practice: Older children can take one of Comstock's story topics from question 14 (the lion, the tiger, the lynx, the history of house cats) and write a page about it.
  tip: 'What we know now: Comstock asks how cats should be trained not to touch birds. Pet cats that roam outdoors catch a great many wild birds, so many families now keep cats indoors or let them out only
    in a screened space.'
- num: 65
  roman: LXV
  idx: 303
  unit: 8
  title: The goat
  mins: 30
  goal: Your child can explain how a goat's feet, teeth and keen senses suit a climbing animal of the mountains, and name some things people get from goats.
  materials:
  - 'A visit to goats: a farm, petting farm, fair or zoo'
  - A piece of cheese made from goat's milk (optional)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of goats and people since ancient times (milk, cheese, hair cloth, water bags of goat skin), goat ways and breeds. Then Lesson LXV's leading thought, method with writing topics,
    and seven groups of questions.
  steps:
  - - When and where
    - Any season, but spring brings young kids. Comstock says this lesson "should not be given unless the pupils have an opportunity for making direct observations on the animal's appearance and habits."
      A petting farm, a 4-H barn at a county fair, or a neighbor's goats are all good.
  - - Safety first
    - 'Farm safety: ask the owner before you go near the animals, stay outside the fence unless you are invited in, and wash hands with soap and water after touching animals or their pens. No eating or
      drinking in the animal area.

      Goats butt and nibble clothing. Stand to the side rather than straight in front of a goat with horns, and feed only what the owner gives you, from a flat palm.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ Goats are among our most interesting domesticated animals, and their history is closely interwoven with the history of the development of civilization. In Europe, their milk is made into cheese
      that has a world-wide fame; and from the hair of some of the species, beautiful fabrics are woven. The goat is naturally an animal of the high mountains.'
  - - Climbers
    - 'Watch the goats climb on rocks, stumps or ramps.

      ~ Do you think that goats like to climb to high points? Are they fitted to climb steep, inaccessible places? Can they jump off steep places in safety? How does it happen the goat is sure-footed?

      Look at the split hoof with its two toes.'
  - - Eating
    - '~ What does the goat eat? Where does it find its natural food on mountains? How are the teeth arranged for cutting its food? Does a goat chew its cud like a cow?

      Watch a resting goat''s jaw: you may see it bring up a cud and chew.'
  - - Horns, beard and voice
    - '~ Describe the horns. Do they differ from the horns of the sheep? How does a goat fight? Does he strike head on, like the sheep, or sidewise?

      ~ What noises does a goat make? Do you understand what they mean?

      Look closely at a goat''s eye, too: the pupil is a sideways bar.'
  - - Put it into words
    - Ask your child to tell you three things a goat's body is good for, and three things people get from goats. Then read the leading thought aloud. If you have goat cheese, have a taste.
  - - Nature notebook
    - Draw a goat's head with its horns, beard and bar-shaped pupil, and a goat's two-toed hoof. Write the date and where you met the goats.
  practice: For a writing day, Comstock suggests topics such as "The Milch Goat of Switzerland" and "The Angora Goat". Milch is an old word for milk-giving.
- num: 66
  roman: LXVI
  idx: 307
  unit: 8
  title: The sheep
  mins: 30
  goal: Your child can tell wool from hair, explain why sheep follow a leader, and describe how a sheep eats, chews its cud and talks to its flock.
  materials:
  - 'A visit to sheep: a farm, fair or petting farm'
  - A tuft of raw wool or wool roving (craft store) and a hand lens
  - A wool sweater or sock
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock opens with a passage about the "flock mind" of sheep, then tells of wild mountain sheep, their enemies, wool, lambs and breeds. Lesson LXVI follows with its leading thought, method and
    ten groups of questions.
  steps:
  - - When and where
    - 'Any season; spring is lambing time, when lambs play in the pasture. Comstock''s method: "the observations should be made upon the sheep in pasture or stable."'
  - - Safety first
    - 'Farm safety: ask the owner before you go near the animals, stay outside the fence unless you are invited in, and wash hands with soap and water after touching animals or their pens. No eating or
      drinking in the animal area.

      Rams can butt hard. Never step into a pen with a ram.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ Sheep live naturally in high altitudes. When attacked by enemies, they follow their leader over difficult and dangerous mountain places.'
  - - Wool and hair
    - 'Look at the tuft of wool with the hand lens, then at one of your child''s hairs.

      ~ What is the chief character that separates sheep from other animals? What is the difference between wool and hair? Why is wool of special use to sheep in their native haunts?

      Wool fibers are crimped (wavy) and catch on each other; that is why they can be spun into yarn. Find the same crimp in the wool sweater.'
  - - Follow the leader
    - 'Watch how the flock moves when one sheep walks off.

      ~ We say of certain men that they "follow like a flock of sheep." Why do we make this comparison? What has this habit of following the leader to do with the escape of sheep from wolves and bears?'
  - - Ears, cud and voice
    - '~ What is the position of the sheep''s ears when it is peaceful? When there is danger?

      ~ Does the sheep chew its cud like the cow? Describe the action as performed by the sheep.

      ~ How much of sheep language do you understand? What is the use to the wild flock of the constant bleating?'
  - - Lambs
    - '~ Describe a young lamb. Why has it such long legs? How does it use its tail to express joy? What happens to this tail later? What games have you seen lambs play?

      Then ask your child to tell why a flock that follows a leader is safer in the mountains. Read the leading thought aloud.'
  - - Nature notebook
    - Tape a few wool fibers into the notebook and draw one under the lens beside a hair. Add a quick sketch of a sheep or lamb, and the date.
  practice: For a writing day, Comstock suggests "The Methods by which Wool is Made into Cloth." Look at the label on a wool garment and trace the steps from sheep to sweater.
- num: 67
  roman: LXVII
  idx: 314
  unit: 8
  title: The horse
  mins: 35
  goal: Your child can explain how a horse's long legs, one-toed hoof, eyes and ears suit an animal that escaped its enemies by speed, and describe its gaits.
  materials:
  - 'A visit to horses: a stable, riding center, farm, or a fair'
  - A measuring tape
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the horse, which opens with a poem about little Eohippus and tells of the horse''s ancestors, wild horses, and how the horse is built for speed. Then Lesson LXVII: leading
    thought, a method that begins with wild-horse stories, and fifteen groups of questions, including the care of horses.'
  steps:
  - - When and where
    - Any season. Comstock suggests observations "to be made incidentally in the street or in the stable." Today, try a riding stable, a farm, a fair or a parade, with the owner's permission.
  - - Safety first
    - 'Never walk behind a horse: it may kick if startled. Approach from the side where it can see you, speak quietly, and let the owner tell you where to stand and whether you may touch or feed it. Offer
      any treat on a flat palm, fingers together.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The horse as a wild animal depended largely upon its strength and fleetness to escape its enemies, and these two qualities have made it of greatest use to man.

      Fleetness means speed.'
  - - Legs and one toe
    - 'Look at a horse''s leg from the side.

      ~ The horse walks on one toe. Which toe do you think it is? What do we call the toe-nail of the horse?

      ~ Make a sketch of the horse''s front and hind leg and label those places which correspond to our wrist, elbow, shoulder, hand, heel, knee and hip.

      Hint: the joint people call a horse''s "knee" on the front leg is really its wrist.'
  - - Ears and eyes
    - '~ What do the following different positions of the horse''s ears indicate: When lifted and pointing forward? When thrown back?

      ~ What advantage does the position of the eyes on the head give to the wild horse? Why do we put blinders on a horse?

      ~ When taking sugar from the hand, does the horse use teeth or lips?'
  - - Gaits and size
    - 'Watch a horse being ridden or led.

      ~ How many gaits has the horse? Describe as well as you can all of these gaits.

      ~ When we say a horse is fourteen hands high what do we mean?

      If the owner allows, measure a horse at the top of the shoulders and work out how many hands high it is.'
  - - Put it into words
    - Ask your child to tell you how speed helped wild horses survive, and how it helps people. Then read the leading thought aloud.
  - - Nature notebook
    - Draw the horse's leg sketch from step 4 neatly, with labels, and a picture of a hoof seen from below. Write the horse's name and height if you learned them.
  practice: 'Comstock''s long question 14 is about caring for horses: feed, water, blankets in cold weather. If you visit a stable, ask the owner to show your child one part of a horse''s daily care.'
  answers: A hand is 4 inches, measured from the ground to the top of the shoulders (the withers). Fourteen hands high means 14 x 4 = 56 inches. The horse walks on its middle toe; the hoof is its toe-nail.
- num: 68
  roman: LXVIII
  idx: 324
  unit: 8
  title: The cow
  mins: 30
  goal: Your child can explain how a cow's two-toed feet, tail, cud-chewing and herd life suited wild cattle, and name things we get from cattle.
  materials:
  - 'A visit to cattle: a dairy farm, farm stand, fair or pasture fence'
  - A few kitchen items that come from cows (milk, butter, cheese, a leather shoe)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of cattle: wild cattle that formed a ring against wolves, the cow''s horns, feet, cud-chewing and herd leaders, and the breeds for milk and beef. Then Lesson LXVIII''s leading
    thought, method with writing topics, and nineteen questions, the later ones about dairy farming.'
  steps:
  - - When and where
    - Any season. A pasture fence on a country road is fine; a dairy farm or the cattle barn at a fair is better.
  - - Safety first
    - 'Farm safety: ask the owner before you go near the animals, stay outside the fence unless you are invited in, and wash hands with soap and water after touching animals or their pens. No eating or
      drinking in the animal area.

      Never go into a field with a bull. Don''t touch fences on a farm: some carry an electric current.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ Certain characteristics which enable the cow to live successfully as a wild animal, have rendered her of great use to us as a domestic animal.'
  - - Look at a cow
    - '~ Describe her horns, ears, eyes, nose and mouth. Do you think she can hear well? What is the attitude of her ears when she is listening?

      ~ The cow walks on two toes. Can you see any other toes which she does not walk on? Why is the cow''s foot better adapted than that of the horse, to walk in mud and marshes?'
  - - Tail and herd
    - '~ For what use was the cow''s tail evidently intended?

      ~ Is there always a leader in a herd of cows? Do certain cows of the herd always go first and others last?

      If cows are walking to the barn or the water trough, watch their order.'
  - - Chewing the cud
    - '~ At what time of day do cattle feed in the pasture? When and where do they chew the cud? Do they stand or lie to do this? Describe how a cow lies down and gets up.

      If you studied the horse, ask: does a cow get up front end first or back end first?'
  - - From the cow to us
    - '~ How many industries are dependent upon cattle?

      Lay out your kitchen items and see how many more your child can name. Then ask what about a wild cow''s body helps it live, and read the leading thought aloud.'
  - - Nature notebook
    - Draw a cow's two-toed hoof beside a horse's one-toed hoof. Add a list headed "From cattle" with everything your child named.
  practice: 'Comstock''s later questions (10 to 16) are about running a dairy: good milk cows, feed, clean barns and milk. On a farm visit, ask the farmer one of them.'
- num: 69
  roman: LXIX
  idx: 329
  unit: 8
  title: The pig
  mins: 25
  goal: Your child can describe how a pig uses its snout, why it wallows, and what about the pig shows it is clever and naturally clean.
  materials:
  - 'A visit to pigs: a farm, fair or petting farm'
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of the pig and its wild ancestor, the wild boar of Europe, with a rhyme by James Whitcomb Riley. Then Lesson LXIX's leading thought, method and twelve questions, and a nonsense
    rhyme. The Insect Study part of the book begins right after.
  steps:
  - - When and where
    - Any season, on a farm or at a fair. Comstock says children who can visit pigs should make the observations and report them to the class.
  - - Safety first
    - 'Farm safety: ask the owner before you go near the animals, stay outside the fence unless you are invited in, and wash hands with soap and water after touching animals or their pens. No eating or
      drinking in the animal area.

      Pigs can bite, and a mother pig guards her piglets fiercely. Stay outside the pen.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The pig is something more than a source of pork. It is a sagacious animal and naturally cleanly in its habits when not made prisoner by man.

      Sagacious means wise or clever.'
  - - The snout
    - '~ How does the pig''s nose differ from that of other animals? What is it used for besides for smelling? Do you think the pig''s sense of smell is very keen? Why do pigs root?

      Watch a pig turn over soil or straw with the flat disk of its snout.'
  - - Mud and cleanliness
    - '~ Why does the pig wallow in the mud? Is it because the animal is dirty by nature or because it is trying to keep clean?

      The answer surprises children: pigs can hardly sweat, so a mud bath cools them on hot days and protects their skin from sunburn and insects.'
  - - Toes, ears and voice
    - '~ On how many toes does the pig walk? Are there other toes on which it does not walk?

      ~ What cries and noises do the pigs make which we can understand?

      Then ask your child for a story that shows a pig is clever (question 11), and read the leading thought aloud.'
  - - Nature notebook
    - Draw a pig's face from the front, showing the flat snout with its two nostrils, and a pig's foot with its two big toes and two small ones. Add the date and where you saw the pigs.
- num: 70
  roman: LXX
  idx: 340
  unit: 9
  title: The black swallowtail butterfly
  mins: 35
  goal: Your child can describe the black swallowtail caterpillar and how it defends itself, and follow it through chrysalis to butterfly.
  materials:
  - Garden parsley, dill, fennel or carrot plants to search
  - A large clear jar or mesh box with a lid of netting, and fresh leaves of the same plant
  - A blade of grass
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Insect Study opens with Comstock''s introduction to how insects grow: eggs, larvae, molting, pupae and adults. Then her story of the black swallowtail and Lesson LXX, with a leading thought, method,
    ten questions on the caterpillar and chrysalis and three on the butterfly, and a child''s memory of the "caraway worms".'
  steps:
  - - When and where
    - 'Mid to late summer, into September. Search garden parsley, dill, fennel or carrot tops for a fat green caterpillar banded with black and spotted with yellow. Comstock''s method: bring in a plant
      with these caterpillars, give them fresh food day by day, and let the children watch.'
  - - Safety first
    - 'Use garden plants only. Some wild plants of the carrot family, such as poison hemlock and wild parsnip, are poisonous or burn the skin. Wash hands with soap and water afterward.

      If you keep a caterpillar, give it fresh leaves every day, keep the jar out of direct sun, and let the butterfly go outdoors on the day it comes out.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The caterpillars of the swallow-tail butterflies have scent organs near the head which they thrust forth when attacked, thus giving off a disagreeable odor which is nauseating to birds.'
  - - The surprise horns
    - 'Find a caterpillar on its plant.

      ~ Touch the caterpillar on the head with a bit of grass. What does it do? What color are the horns? Where do they come from? Are there two separate horns or two branches of one horn? What odor comes
      from these horns? How does this protect the caterpillar?

      The forked orange horns pop out and smell bad, then slip back in.'
  - - A good look
    - '~ What is its ground color? How is it striped? How many black stripes? How many yellow spots in each black stripe?

      ~ Observe the caterpillar eating a leaf. How does it manage so as not to waste any?'
  - - The chrysalis
    - 'If you keep a caterpillar, watch daily when it stops eating and wanders.

      ~ When a caterpillar is full grown, how does it hang itself up to change to a chrysalis? How does it make the silk button? How does it weave the loop or halter?

      ~ Describe the chrysalis. What is its general shape? What is its color? Is it easily seen?'
  - - The butterfly
    - 'When the butterfly comes out, or in the garden on a sunny day:

      ~ Why is this butterfly called the black swallow-tail? What is the ground color of the wings? How many rows of yellow spots on the front wings?

      ~ Watch the butterfly getting nectar from the petunia blossom and describe the tongue. Where is the tongue when not in use?

      Then ask your child how the caterpillar protects itself, and read the leading thought aloud.'
  - - Nature notebook
    - 'Draw the life story in a circle: egg, small caterpillar, big caterpillar with horns out, chrysalis with its silk loop, butterfly with its "swallow-tails". Date each stage you saw.'
  tip: 'The horns have a name: an osmeterium. Children love the word, and the smell is harmless.'
- num: 71
  roman: LXXI
  idx: 347
  unit: 9
  title: The monarch butterfly
  mins: 35
  goal: Your child can tell a monarch from other butterflies, find its caterpillar on milkweed, and explain why birds leave it alone.
  materials:
  - A patch of milkweed (roadsides, meadows, gardens)
  - A clear jar or mesh box and fresh milkweed leaves (optional)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the monarch: its slow, gleaming flight, its northward spread with the milkweed each year, its bad taste to birds, the viceroy that imitates it, and its beautiful green-and-gold
    chrysalis. Then Lesson LXXI with questions on the butterfly, the caterpillar and the chrysalis, and the poem "A Butterfly at Sea".'
  steps:
  - - When and where
    - 'Late summer and September, on milkweed. Comstock''s method: give the lesson in September, "while yet the caterpillars of the monarch may be found feeding upon milkweed." Look on the undersides of
      leaves for black, yellow and white striped caterpillars.'
  - - Safety first
    - Milkweed's white sap is sticky and stings if it gets in the eyes. Don't rub eyes, and wash hands after touching the plant. If you keep a caterpillar, give fresh leaves daily and let the butterfly
      go on the day it comes out.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The monarch butterfly migrates northward, every spring and summer, moving up as fast as milkweed appears, so as to give food to its caterpillar; and it has often been noticed migrating back southward
      in the autumn in large swarms. This insect is distasteful to birds in all its stages. Its chrysalis is one of the most beautiful objects in all nature.'
  - - The butterfly
    - '~ How can you tell the monarch butterfly from all others? What part of the wings is red? What portions are black? What portions are white?

      ~ Is the flight of the monarch rapid or slow and leisurely? Is it a very showy insect when flying? Are its colors more brilliant in the sunshine when it is flying than at any other time? Why is it
      not afraid of birds?

      ~ Is there on the butterfly you are studying, a black spot near one of the veins on each hind wing?

      That spot shows it is a male; females don''t have it.'
  - - The caterpillar
    - '~ Where did you find the Monarch caterpillar? Was it feeding below or above on the leaves? Describe how it eats the milkweed leaf.

      ~ How many whip-lash shaped filaments do you find on the caterpillar? On which segments are they situated? Do these move when the caterpillar walks or when it is disturbed?'
  - - The chrysalis
    - 'If you keep a caterpillar, or find a chrysalis on a plant or fence:

      ~ Describe the chrysalis. What is its color? How and where is it ornamented?

      ~ After three or four days, how does the chrysalis change in color?

      Look for the tiny gold dots with the hand lens.'
  - - Put it into words
    - Ask why a monarch can fly slowly in the open when other butterflies dodge and hide. Then read the leading thought aloud.
  - - Nature notebook
    - Paint or color a monarch with the wings open, showing the black veins and white dots, and beside it the green chrysalis with its gold dots. Add the date and the plant where you found the caterpillar.
  practice: 'Comstock asks: "Do you know of any other butterfly which imitates it and thus gains an advantage?" Look for the viceroy, which looks like a smaller monarch with an extra black line across each
    hind wing.'
  tip: 'What we know now: in the 1970s scientists found where the eastern monarchs go: in fall they fly all the way to mountain forests in central Mexico, where millions spend the winter together. Scientists
    have also found that viceroys taste bad to birds too, so the two butterflies warn birds together.'
- num: 72
  roman: LXXII
  idx: 351
  unit: 9
  title: The woolly bear
  mins: 30
  goal: Your child can describe the woolly bear caterpillar, tell what it is hurrying to do in the fall, and know that it becomes the Isabella tiger moth.
  materials:
  - A woolly bear caterpillar (common on roads and paths in fall)
  - A box or jar with grass or clover (for a short stay)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the woolly bear, with Christina Rossetti''s poem: why it hurries in autumn, how it rolls up, sleeps through winter, spins a cocoon of its own hairs in spring, and comes out
    a yellowish moth. Then Lesson LXXII with questions on the caterpillar, the cocoon and the moth.'
  steps:
  - - When and where
    - 'September and October, when woolly bears hurry across roads, paths and driveways in the sun. Comstock''s method: "Have the children bring in woolly bears as they find them" and keep them on grass
      or clover.'
  - - Safety first
    - 'The woolly bear is safe to hold, though its bristles make some people''s skin itch, so wash hands afterward. Don''t pick up other fuzzy or spiny caterpillars you don''t know: a few kinds sting. Keep
      a woolly bear for a day or two at most, then let it go where you found it, so it can find its own winter hiding place.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ When we see the woolly bear hurrying along in the fall, it is hunting for some cozy place in which to pass the winter. It makes its cocoon of silk woven with its own hair. In May, it comes forth
      a yellowish moth with black dots on its wings.'
  - - Count the bands
    - '~ How can you tell the woolly bear from all other caterpillars? Are they all colored alike? How many segments of the body are black at the front end? How many are red? How many segments are black
      at the rear end of the body?

      If you find more than one, compare them: are the bands the same?'
  - - Up close
    - 'Use the hand lens.

      ~ Look closely at the hairs of the woolly bear. Are they set separately or in rosettes?

      ~ Can you see little openings along each side of all the segments of the body, except the second and third? What are they?

      Those little holes are where it breathes.'
  - - Hurrying and rolling up
    - 'Put it down on a path and watch.

      ~ When the woolly bear is hurrying along, does it lift its head and the front end of its body now and then? Why does it do this?

      ~ What does the woolly bear do when you try to pick it up? Do you find you can pick it up easily? Do you think that these stiff hairs protect woolly bear from its enemies?'
  - - The moth
    - 'Show the moth in the book.

      ~ What is the color of the moth and how is it marked? Are the front and hind wings the same color?

      ~ What do you think that the Mother Isabella will do, if you give her liberty?

      Read the leading thought aloud, then let the caterpillar go.'
  - - Nature notebook
    - Draw the woolly bear with its bands colored exactly as you counted them, and the yellowish moth beside it. Write the date and the place you found it.
  tip: 'What we know now: an old saying claims the width of the brown band tells how hard the winter will be. Scientists say the band changes with the caterpillar''s age and how well it has eaten, not with
    the coming weather. Comstock''s own question, "Are they all colored alike?", is a good way to test it.'
- num: 73
  roman: LXXIII
  idx: 357
  unit: 9
  title: The cecropia moth
  mins: 30
  goal: Your child can find a cecropia cocoon in winter, explain how it protects the pupa, and describe the giant moth that comes out in spring.
  materials:
  - A winter walk among bare shrubs and small trees
  - A screened box kept outdoors in shade (optional, for one cocoon)
  - The book's photographs of the cocoon, the caterpillar and the moth
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of America''s native giant silkworms compared with the Chinese silkworm, and the life of the cecropia: the moth''s eggs, the big green caterpillar with blue, yellow and orange
    knobs, its molts, and its cocoon. Photographs show a cocoon cut open and a moth just out. Lesson LXXIII has questions on the cocoon, pupa, moth and caterpillar.'
  steps:
  - - When and where
    - 'Late fall and winter, after the leaves drop. Comstock''s method: "It is best to begin with the cocoons, for these are easily found after the leaves have fallen." Look for a big, baggy, brown cocoon,
      about three inches long, fastened along a twig of a shrub or small tree. The moths come out in late spring.'
  - - A change from the book
    - 'Comstock asks children to cut open a cocoon and take the pupa out. We don''t do that: it can kill the pupa. Use her photograph of a cut-open cocoon instead.

      If you bring one cocoon home, leave it on its twig and keep it outdoors in a screened box in the shade, as Comstock also advises, so the moth comes out at the right time. Let the moth go outdoors
      the evening it comes out.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The cecropia moth passes the winter as a pupa in a cocoon which the caterpillar builds out of silk for the purpose. In the spring the moth issues and lays her eggs on some tree, the leaves of which
      the caterpillar relishes. The caterpillars are large and green with beautiful blue and orange tubercles.'
  - - The cocoon
    - '~ How does the cocoon look on the outside? What is its general shape? To what is it fastened? Is it fastened to the lower or the upper side of a twig? Are there any dried leaves attached to it?

      ~ Where do you find cecropia cocoons? How do they look on the tree? Are they conspicuous?'
  - - The way out
    - '~ Are both ends of the cocoon alike? Do you find one end where the silk is not woven across but is placed lengthwise? Why is this so? Do you think that the moth can push out at this end better than
      at the other?

      Look at the book''s cut-open cocoon: an outer wall, loose silk in between, and a snug inner case.'
  - - The moth
    - 'If your moth comes out, or using the photographs:

      ~ Describe how the crumpled wings spread out and dry.

      ~ Do the moths eat anything? Why do they not need to eat?

      The grown moth has no working mouth. It lives only a week or two, long enough to find a mate and lay eggs. Then read the leading thought aloud.'
  - - Nature notebook
    - 'Comstock suggests: "Make a water-color drawing or describe in detail the fully expanded moth, showing the color and markings of wings, body and antennæ." Paint it from life or from the book, and
      draw the cocoon on its twig beside it.'
- num: 74
  roman: LXXIV
  idx: 362
  unit: 9
  title: The promethea moth
  mins: 25
  goal: Your child can find a promethea cocoon hidden in a hanging leaf in winter, and tell the male moth from the female.
  materials:
  - A winter walk among lilac, wild cherry or ash
  - A screened box kept outdoors in shade (optional, for one cocoon)
  - Paints or colored pencils
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the promethea, the most common of our giant silkworms: its caterpillars on wild cherry, lilac, ash and sassafras, its cocoon wrapped in a leaf whose stem is tied to the twig
    with silk, and its very different father and mother moths. Then Lesson LXXIV with questions on the cocoon, the moth and the caterpillar.'
  steps:
  - - When and where
    - 'Late fall and winter. Comstock''s method: begin "when the children bring in these cocoons which they find dangling on the lilac bushes or wild cherry trees." Look for single dead leaves hanging straight
      down from bare twigs that don''t let go when the wind blows.'
  - - A change from the book
    - Comstock asks children to tear off the leaf and cut open a cocoon. We leave the cocoon whole, so the moth can come out. If you bring one home, keep it on its twig outdoors in a screened box in the
      shade, and let the moths go in late spring.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The promethea caterpillar fastens a leaf to a twig with silk and then makes its cocoon within this leaf. The male and female moths are very different in appearance.'
  - - A clever disguise
    - '~ On what tree did you find it? Does it look like a cocoon? Does it not look like a dried leaf still clinging to the tree? Do you think that this disguise keeps the birds from attacking it?

      ~ How is the leaf fastened to the twig? Could you pull it off readily? What fastened the leaf to the twig?

      Look at the leaf stem with the hand lens if you have one: it is wrapped in silk.'
  - - Two kinds of moths
    - 'Use the book''s pictures, or your own moths in spring.

      ~ Are there two kinds of moths that come from the promethea cocoons? Does one of them look something like the cecropia? This is the mother promethea.

      ~ Are any of the moths almost black in color with wings bordered with gray and with graceful prolonged tips to the front wings? This is the father moth.'
  - - Put it into words
    - Ask your child to explain why the caterpillar ties its leaf to the twig before it spins. Then read the leading thought aloud.
  - - Nature notebook
    - 'Comstock''s own notebook task:

      ~ Make water color drawings of promethea moths, male and female.

      Add the hanging leaf with its silk-wrapped stem.'
- num: 75
  roman: LXXV
  idx: 367
  unit: 9
  title: The hummingbird, or sphinx, moths
  mins: 30
  goal: Your child can recognize a sphinx caterpillar by its horn, and describe the swift sphinx moth that hovers at flowers at dusk.
  materials:
  - Tomato or potato plants (for hornworms), or Virginia creeper
  - Petunias, honeysuckle, phlox or four o'clocks to watch at dusk
  - A flashlight
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the sphinx moths: their whirring flight at twilight, the caterpillar with "a horn on the wrong end of the body" that rears up when disturbed, the pupa with its "jug handle"
    tongue case, and caterpillars covered with the cocoons of tiny parasites. Then Lesson LXXV with questions on the caterpillar and the moth. Some of the questions are printed in two columns and the scan''s
    text is jumbled there.'
  steps:
  - - When and where
    - Late summer and September. The big green caterpillars (hornworms) feed on tomato and potato plants; others feed on Virginia creeper. The moths hover at petunias and other long, tube-shaped flowers
      at dusk, and some kinds visit flowers by day.
  - - Safety first
    - 'The horn looks fierce but cannot sting or hurt anyone. Handle the caterpillar gently and put it back on its plant. Don''t eat tomato or potato leaves. Wash hands with soap and water afterward.

      Comstock suggests catching moths with a net. Watching at the flowers is enough; if you do net one, look for a minute and let it go.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The sphinx caterpillars have a slender horn or eye-spot on the last segment of the body. When disturbed or when resting they rear the front part of the body in a threatening attitude. They spin
      no cocoons but change to pupæ in the ground. The adults are called humming-bird moths, because of their swift and purring flight. Many flowers depend upon the sphinx moths for carrying their pollen.'
  - - Find a hornworm
    - 'Look for chewed leaves and dark droppings on the ground under them, then look along the stems.

      ~ On what plant is it feeding? What is its general color? Is it striped? What colors in the stripes? Are they oblique or lengthwise stripes?

      ~ Note the horn on the end of the caterpillar. What color is it?

      Touch it gently near the head and see whether it rears up like the Egyptian Sphinx.'
  - - Little white cocoons
    - '~ Have you ever found the sphinx caterpillar covered with whitish, oval objects? What are these?

      They are the cocoons of tiny wasps whose young grew inside the caterpillar. Leave such a caterpillar in the garden: the wasps that come out will help keep hornworms down.'
  - - The moth at dusk
    - 'Sit near the flowers as it gets dark, with the flashlight off until you need it.

      ~ Where did you find this moth? How did its swift moving wings sound?

      ~ From what flowers do the sphinx moths get nectar? How does the moth support itself when probing for nectar?

      Many people think they have seen a hummingbird at night; ask your child why.'
  - - Put it into words
    - 'Ask your child to tell you the whole life story: caterpillar with a horn, pupa in the ground, moth at the flowers. Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the hornworm with its slanted stripes and tail horn, and the moth hovering at a flower with its long tongue reaching in. Date both.
  tip: Comstock warns that "It is useless for the amateur to try to rear the adults from the pupæ in breeding cages." Watch the caterpillars on the plant and the moths at the flowers instead.
- num: 76
  roman: LXXVI
  idx: 372
  unit: 9
  title: The codling moth
  mins: 30
  goal: 'Your child can read the story of a wormy apple: where the caterpillar went in, what it ate, and where it went to spend the winter.'
  materials:
  - Several apples from an old tree or orchard, some of them wormy (windfalls are fine for looking, not eating)
  - A cutting board and knife (for the adult)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the codling moth: its pinkish caterpillar in the apple, its tunnel to the core, its cocoon under loose bark, the small bronze-marked moth, and the birds that eat it. Then Lesson
    LXXVI with a long method, fall and spring observations, photographs of young apples at spraying time, and a list of government bulletins.'
  steps:
  - - When and where
    - 'Fall, when apples ripen and fall: Comstock''s method is to begin "with a study of wormy apples, preferably in the fall when the worms are still within their burrows." In March or early April, look
      under loose bark on old apple trees for the silk cocoons.'
  - - Safety first
    - An adult does the cutting. Don't eat apples picked up from the ground. Spraying the trees, which Comstock asks about in question 6, is a job for adults with the right gear; the sprays used in her
      day contained arsenic and are no longer used.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The codling moth is a tiny brown moth with bronze markings which lays its egg on the apple. The larva hatching from the egg enters the blossom end and feeds upon the pulp of the apple, injuring
      it greatly.'
  - - Outside the apple
    - '~ Look at a wormy apple. How can you tell it is wormy from the outside? Can you see where the worm entered the apple?

      Look at the blossom end (the end opposite the stem) with the hand lens.'
  - - Inside the apple
    - 'Cut a wormy apple in half from stem to blossom end.

      ~ Find an apple with a codling moth larva in it. How large is the worm? How does it act when disturbed?

      ~ Make a sketch or describe the evidence of the caterpillar''s progress through the apple. Do you find a web of silk in the wormy part? Why is this? Does the worm eat the seeds as well as the pulp
      of the apple?'
  - - Count them
    - '~ Take a dozen rotting apples, how many of them are wormy? Do the parts of the apple injured by the worm begin to rot first?

      Have your child make a tally and say what fraction were wormy.'
  - - Bird helpers
    - '~ How do the nuthatches, downy woodpeckers and chickadees help us in getting rid of the codling moth?

      These birds search bark all winter for hidden cocoons. Then ask your child to tell the life story of the moth, and read the leading thought aloud.'
  - - Nature notebook
    - Draw the cut apple, showing the tunnel from the blossom end to the core and out the side. Label where the egg was laid, where the caterpillar ate, and where it left.
  practice: In early spring, peel back a little loose bark on an old apple tree (with an adult) and look for small white silk cocoons. Put the bark back.
- num: 77
  roman: LXXVII
  idx: 378
  unit: 10
  title: Leaf-miners
  mins: 25
  goal: Your child can find leaf mines, name the three kinds Comstock describes, and explain how a tiny insect lives between the top and bottom of a leaf.
  materials:
  - Leaves with pale winding trails or blotches (columbine, nasturtium, lamb's quarters, dock, burdock, beet, spinach)
  - A hand lens (magnifying glass)
  - A sunny window
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of leaf-miners, beginning with Lowell''s line about a leaf being "some happy creature''s palace": how a leaf has living cells between its upper and lower skins, and how tiny larvae
    eat their way between them. Then Lesson LXXVII''s leading thought, method and ten questions.'
  steps:
  - - When and where
    - 'Summer into early fall. Comstock suggests the nasturtium leaf-miner "in early September", but any garden or weedy lot will have mined leaves: look for pale winding lines and brown blisters.'
  - - Safety first
    - 'Before you go, learn to recognize poison ivy ("leaves of three, let it be"), and poison oak or poison sumac where they grow. We never eat any wild berry, leaf or plant.

      Don''t nibble the leaves you are studying, even garden ones. Wash hands with soap and water afterward.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The serpent-like markings and the blister-like blotches which we often see on leaves are made by the larvæ of insects which complete their growth by feeding upon the inner living substance of the
      leaf.'
  - - Three kinds of mines
    - 'Read Comstock''s sorting rule aloud:

      ~ There are three general types of mines: Those that are long, curving lines called serpentine mines; those that begin small and flare out, called trumpet mines; and those that are blister-like called
      blotch mines.

      Sort your leaves into three piles.'
  - - Look through the leaf
    - 'Hold a mined leaf up to the window.

      ~ Hold the leaf up to the light, can you see the insect within the mine? What is it doing? Are there more than one insect in the mine?

      ~ Study a serpentine mine. Note that where the little insect began to eat, the mine is small. Why does it widen from this point?'
  - - A safe house
    - '~ Why does an insect mine in a leaf? What does it find to eat? How is it protected from the birds or insects of prey while it is getting its growth?

      Then read the leading thought aloud.'
  - - Nature notebook
    - 'Comstock''s first question is the notebook task:

      ~ Sketch the leaf with the mine in it, showing the shape of the mine. What is the name of the plant on which the leaf grew?

      Draw one of each kind of mine if you found them.'
  practice: Comstock's question 10 says not to pick a leaf with a miner at work, but to cover it on the plant with a little bag of thin cloth. Tie a mesh produce bag over one mined leaf and check it every
    few days to see what comes out.
- num: 78
  roman: LXXVIII
  idx: 382
  unit: 10
  title: The leaf-rollers
  mins: 25
  goal: Your child can find rolled leaves, show how silk ropes hold them, and explain why the caterpillar lives inside.
  materials:
  - Rolled or tied leaves from shrubs and trees (staghorn sumac, basswood, witch-hazel and many others)
  - A hand lens (magnifying glass)
  - A soft paintbrush
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of leaf-rollers: sumac leaflets rolled into little cornucopias, basswood leaves cut and rolled, the witch-hazel as "a veritable insect tenement", and silk cables fastened like
    tent ropes. Then Lesson LXXVIII''s leading thought, method and nine questions.'
  steps:
  - - When and where
    - 'Early autumn, and July or early August to find caterpillars still inside. Comstock: "The rolls are found plentifully on sumac, basswood and witch-hazel."'
  - - Safety first
    - 'Comstock''s sumac is the harmless staghorn or smooth sumac of dry, sunny roadsides, with fuzzy red berry clusters standing up. Poison sumac is different: it grows in wet, swampy places and has drooping
      clusters of whitish berries. Learn to tell them apart before you go, and if you are not sure, don''t touch. Before you go, learn to recognize poison ivy ("leaves of three, let it be"), and poison
      oak or poison sumac where they grow. We never eat any wild berry, leaf or plant.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ There are many kinds of insects which roll the leaves of trees and plants into tents, in which they dwell and feed during their early stages.'
  - - How is it made?
    - '~ What is the name of the trees and shrubs from which these rolled leaves which you have collected were taken?

      ~ Is the leaf rolled crosswise or lengthwise? How large is the tube thus made?

      ~ How is the roll made fast? Examine the little silken ropes with a lens and describe one of them. Is it wider where it is attached to the leaf than at the middle? Why?'
  - - Unroll it
    - 'Unroll one leaf slowly.

      ~ As you unroll the leaves what do you see at the center? Has the leaf been eaten? Can you discover the reason why the caterpillar made this roll?'
  - - Watch one roll a leaf
    - 'In summer, try Comstock''s question 9:

      ~ In July or early August get some of the rolls with the caterpillars in them, unroll a nest, take the caterpillar out and put it on a fresh leaf of the same kind of tree or shrub on which you found
      it, and watch it make its roll.

      Move the caterpillar with the soft paintbrush, and put the leaf back on the same plant afterward.'
  - - Nature notebook
    - Draw a rolled leaf with its silk "tent ropes" drawn in, and a close-up of one rope under the lens. Then read the leading thought aloud and add it as a caption in your child's own words.
- num: 79
  roman: LXXIX
  idx: 386
  unit: 10
  title: The gall-dwellers
  mins: 30
  goal: Your child can find several kinds of galls, open one to see who lives inside, and explain how the gall is both house and food.
  materials:
  - 'Galls: oak apples, goldenrod ball and spindle galls, willow cone-galls, witch-hazel galls'
  - A small knife (for the adult)
  - A jar with a cloth cover held by a rubber band
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of galls, which opens with Aladdin''s palace: the oak apple and its tiny wasp, the willow cone-gall, the goldenrod ball gall made by a fly and the spindle gall made by a moth
    caterpillar that cuts its own door, and witch-hazel galls. Then Lesson LXXIX''s leading thought, method and nine questions, and a poem by a gall-dweller. The scan''s left margin is cut off at the start
    of this lesson, so the leading thought and the start of the method are only partly readable.'
  steps:
  - - When and where
    - 'Fall and winter are easiest: round balls on dead goldenrod stems stand out in snowy fields, and oak apples lie under oak trees. In summer, look on oak and witch-hazel leaves and at willow twig tips.
      In grass and woods, wear long pants tucked into socks, and check everyone for ticks when you get home.'
  - - Safety first
    - 'Before you go, learn to recognize poison ivy ("leaves of three, let it be"), and poison oak or poison sumac where they grow. We never eat any wild berry, leaf or plant.

      An adult does any cutting, on a board, cutting away from the hands.'
  - - The big idea
    - 'The scan cuts off the edge of Comstock''s leading thought, so here it is in plain words: a gall is a growth on a plant that protects a little insect living inside, and each kind of insect makes its
      own kind of gall on its own kind of plant, though no one fully understands how.'
  - - Collect and compare
    - '~ On what plant or tree did this gall grow? Were there many like it? Did they grow upon the root, stem, leaf, flower, or fruit?

      ~ What is the shape of the little house? What is its color? Its size? Is it smooth or wrinkled on the outside? Is it covered with fuzz or with spines?'
  - - Open one
    - 'Have the adult cut one gall of each kind in half. Keep the rest whole.

      ~ Open the gall; is there an insect within it? If so, where is it and how does it look? What is the appearance of the inside of the gall?

      ~ Is there a cell for the insect at the very center of the gall, or are there many such cells?

      ~ Has the house an open door?'
  - - House and pantry
    - '~ Of what use are these houses to their little inmates? How do they protect them from enemies? How do they furnish them with food?

      Comstock compares the oak-apple grub to a boy living in the middle of a giant sponge cake. Ask your child to explain why.'
  - - Wait and see
    - 'The readable part of Comstock''s method says:

      ~ Place each kind of gall in a tumbler or jar covered with cheese-cloth and place where they may be under observation for perhaps several months; note what sort of winged insect comes from each.

      Keep the jar somewhere cool, and let anything that comes out go outdoors.'
  - - Nature notebook
    - Draw each kind of gall whole and cut in half, with the plant's name. Copy a line or two of the gall-dweller's poem from the book page, such as "A house grown by magic".
  practice: 'Comstock''s last question: "How many kinds of galls can you find upon oaks? Upon goldenrod? Upon witch-hazel? Upon willow?" Keep a running list this season.'
- num: 80
  roman: LXXX
  idx: 391
  unit: 11
  title: The red-legged grasshopper
  mins: 30
  goal: Your child can explain how a grasshopper is built for jumping, eating grass and hiding, and find its eyes, ears and breathing holes.
  materials:
  - A grassy field or roadside in late summer
  - A clear jar or plastic cup with a lid with air holes, and a sprig of fresh grass
  - A hand lens (magnifying glass)
  - A measuring tape
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of the grasshopper as a jumper, with a labeled drawing of its body and one of its mouth-parts. Then Lesson LXXX's leading thought, method and twelve questions on legs, feet, eyes,
    jaws, wings, breathing, ears, winter and the long-horned grasshoppers.
  steps:
  - - When and where
    - Late summer and early fall, in sunny fields, meadows and roadsides. Comstock asks you to "encourage the pupils to study these insects in the field." In grass and woods, wear long pants tucked into
      socks, and check everyone for ticks when you get home.
  - - Handle gently
    - Catch a grasshopper by cupping it in your hands or with the jar, and keep it only for this lesson. It may kick (the spines on its legs can prickle) and spit a brown drop; both are harmless. When you
      have finished looking, put every creature back where you found it.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The grasshopper feeds upon grass and other herbage and is especially fitted for living in grassy fields. Its color protects it from being seen by its enemies the birds. If attacked, it escapes by
      long jumps and by flight. It can make long journeys on the wing.'
  - - Built to jump
    - '~ Which pair of legs is the longest? Which the shortest?

      ~ Watch the grasshopper prepare to jump and describe the process. How do you think it manages to throw itself so far? If a man were as good a jumper as a grasshopper in comparison to his size, he
      could jump 300 feet high or 500 feet in distance.

      Back in the field, mark where a grasshopper takes off and lands, and measure the jump. How many of its own body lengths is that?'
  - - Face to face
    - 'With the grasshopper in the jar, use the hand lens.

      ~ Look the grasshopper in the face. Where are the compound eyes situated? Can you see the tiny simple eyes like mere dots?

      ~ How does a grasshopper eat? Do the jaws move up and down or sidewise?

      Push a fresh grass blade in and watch.'
  - - Wings, breathing and ears
    - '~ How many pairs of wings has it? Does it use the first pair of wings to fly with?

      ~ Describe the movement of the abdomen as the insect breathes. Can you see the spiracles or breathing pores?

      Comstock says the ear is on the side of the first segment of the abdomen, under the wings. Look for a small round patch there.'
  - - Put it into words
    - Let the grasshopper go. Ask your child to tell how it is made for grass, for hiding and for escaping. Then read the leading thought aloud.
  - - Nature notebook
    - 'Draw a grasshopper from the side and label: compound eye, antenna, jaws, front wing, hind leg with its big thigh, breathing holes, ear. Write how far the one you measured jumped.'
  practice: 'Comstock''s question 12: look for long-horned grasshoppers too, with antennæ longer than their bodies. They lead into the next lesson, the katydid.'
- num: 81
  roman: LXXXI
  idx: 395
  unit: 11
  title: The katydid
  mins: 25
  goal: Your child can recognize the katydid's song at night, find one, and compare it with the grasshopper and the cricket.
  materials:
  - A late-summer evening near trees
  - A flashlight
  - A clear jar with leaves (for a short look)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the katydid, with a poem by Oliver Wendell Holmes: how the male makes his music with one file and one scraper on his wing-covers, and how the females answer. Lesson LXXXI is
    short: a leading thought and a method that sends you back to the grasshopper and cricket lessons for the questions. The essay on the black crickets follows.'
  steps:
  - - When and where
    - Late summer and early fall, after dark, in yards and woods with trees. Listen for the rasping "katy-did, katy-didn't" from the treetops.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The katydids resemble the long-horned grasshoppers and the crickets. They live in trees, and the male sings "katy-did" by means of a musical instrument similar to that of the cricket.'
  - - A listening walk
    - 'Go out after dark and stand still for two minutes.

      Say: How many different insect songs can you hear? Which one sounds like "katy-did"?

      Try to walk toward one singer. Katydids are hard to find because they stop when you come near.'
  - - Find one
    - 'Katydids are green and leaf-shaped. Look on leaves near a porch light or on low branches with the flashlight. If you find one, let it climb onto a leaf and put it in the jar for a short look.

      Comstock''s method for this lesson says:

      ~ In studying this insect, use the lesson on the red-legged grasshopper and also that on the cricket.'
  - - Compare
    - 'Ask the grasshopper questions you remember: Which legs are longest? Where are the eyes? How long are the antennæ?

      Then compare: the grasshopper''s antennæ are short, but the katydid''s are longer than its body. The katydid''s ears are on its front legs, near the "elbow" (Comstock''s drawing in the grasshopper
      lesson shows one).

      Let it go on the same branch.'
  - - Put it into words
    - 'Ask your child: How is a katydid like a grasshopper? How is it different? Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the katydid on a leaf, showing how its wings look like a leaf, with its long antennæ. Write the date, the time, and how many katydids you heard.
  optional: true
- num: 82
  roman: LXXXII
  idx: 398
  unit: 11
  title: The black cricket
  mins: 30
  goal: Your child can describe the field cricket, find its ears and the mother's egg-laying tube, and explain how the male makes music.
  materials:
  - A field, lawn edge or garden with stones or boards to lift
  - A clear jar or a glass lamp chimney, a flowerpot of grass, and netting
  - A slice of apple or melon rind
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s essay on the black crickets as musicians of the hearth and field, then Lesson LXXXII: leading thought, a method with directions for a cricket cage made from a flowerpot and a lamp chimney,
    and eight questions. A poem follows, then a short story of the snowy tree-cricket.'
  steps:
  - - When and where
    - Late summer and fall, when field crickets sing. Look under stones, boards and logs at the edge of fields and gardens. Lift a stone by its far edge, tipping it toward you, so anything underneath runs
      away from you, and put it back gently.
  - - A cricket home for a few days
    - 'Comstock''s cage: a flowerpot with grass or clover planted in it, a lamp chimney pressed into the soil, and netting over the top. A large clear jar with soil, grass and a cloth cover works too.

      Add a slice of apple and keep it out of hot sun. After a few days, let the crickets go where you found them.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The crickets are among the most famous of the insect musicians. They live in the fields under stones and in burrows, and feed upon grass and clover. As with the song birds, the male only makes music;
      he has his wing-covers developed into a mandolin or violin, which he plays to attract his mate and also for his own pleasure.'
  - - Shiny black
    - '~ Is the covering of the cricket shining, like black patent leather, or is it dull? What portions are dull? Of what use do you think it is to the cricket to be so smoothly polished?

      ~ Where did you find the crickets? When you tried to catch them, how did they act? Did they fly like grasshoppers or did they run and leap?'
  - - The music
    - '~ Note the cricket when he is playing his wing mandolin to attract his mate. How does he make the noise? Can you see the wings vibrate?

      ~ Do the black crickets chirp in the day-time or after dark? Do they chirp in cold or windy weather, or only when the sun shines?'
  - - Mothers and ears
    - 'The mother has a long, thin tube at the tip of her body.

      ~ Why does the mother cricket need such a long ovipositor? Where does she put her eggs in the fall to keep them safe until spring?

      ~ Look in the tibia, or elbow, of the front leg for a little white spot. What do you suppose this is?

      It is the cricket''s ear. Then read the leading thought aloud.'
  - - Nature notebook
    - 'Draw a father cricket and a mother cricket side by side: label the wings, the long antennæ, the ear on the front leg, and her ovipositor.'
  practice: 'Right after this lesson the book describes the pale green snowy tree-cricket and says its lesson "may be adapted from that on the black cricket." On a warm night, count a snowy tree-cricket''s
    chirps for 14 seconds and add 40: the answer is close to the temperature in degrees Fahrenheit.'
- num: 83
  roman: LXXXIII
  idx: 402
  unit: 11
  title: The cockroach
  mins: 20
  goal: Your child can explain how a cockroach's flat, shiny body and long antennæ suit a life in cracks, and how it keeps itself clean.
  materials:
  - A log, board or loose bark in the woods to look under
  - A clear container with a lid (if you find one indoors)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the cockroach: how its flat, slippery, polished body slides under things and into cracks, its long feelers, and the native kinds that live in woods. Then Lesson LXXXIII''s
    leading thought, method and seven questions.'
  steps:
  - - When and where
    - Warm months. Native wood cockroaches live under logs, loose bark and stones in the woods; Comstock says American species "only occasionally venture into dwellings." Roll a log toward you and put it
      back.
  - - Safety first
    - 'Comstock passes a cockroach around in a vial. Indoor cockroaches carry germs, so don''t touch them: look at one through a closed clear container, or use the book''s picture. Wash hands with soap
      and water afterward.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The cockroach is adapted for living in crevices, and although its haunts may be anything but clean, the cockroach keeps itself quite clean. The American species live in fields and woods and under
      stones and sticks and only occasionally venture into dwellings. The species that infest our kitchens and water-pipes are European.'
  - - Flat and shiny
    - '~ What is the general shape of the cockroach? Why is this an advantage? What is the texture of its covering? Why is this an advantage?

      ~ Describe the antennæ and the way they are used.'
  - - A closer look
    - '~ Note the eyes. Are they as large and prominent as those of the bees or butterflies?

      ~ Note two little organs at the end of the body? These are the cerci, like those of the crickets.

      ~ Note how the cockroach cleans itself and how completely and carefully this act is performed.'
  - - Put it into words
    - 'Ask your child why a cockroach is hard to catch and good at hiding. Then read the leading thought aloud.

      Comstock''s last question asks how to get rid of cockroaches in the kitchen. Talk about keeping food sealed and crumbs swept up; sprays are a job for adults.'
  - - Nature notebook
    - Draw a cockroach from above, showing its flat oval shape, long antennæ and the two cerci at the tail end.
  tip: 'What we know now: Comstock calls the kitchen cockroaches European. Scientists now think the common house cockroaches came originally from Africa and Asia and were carried around the world on ships.'
  optional: true
- num: 84
  roman: LXXXIV
  idx: 403
  unit: 12
  title: How to make an aquarium
  mins: 40
  goal: Your child can set up a small pond-water aquarium and care for it, ready for the water insects in the next lessons.
  materials:
  - A large clear glass or plastic jar or tank
  - Clean sand and small gravel
  - A bucket and a kitchen strainer or dip-net
  - Water plants and water from a pond or slow stream
  - Rubber boots
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Lesson LXXXIV is a set of numbered directions rather than questions: which jars to use, a layer of sand, water plants and a layer of gravel, pouring in pond water gently, a window out of direct
    sun, a dip-net, and ten rules for collecting. Then six rules for the care of the aquarium and a list of references.'
  steps:
  - - When and where
    - Spring (April and May) is the best collecting time; late summer works too. Any pond or slow, weedy stream will do. Ask first if it is private land.
  - - Safety first
    - 'Water safety: an adult stays within arm''s reach of young children at the water''s edge. Keep back from steep or slippery banks, and wash hands after handling pond water, mud or water creatures.

      Never drink pond water. An adult carries anything made of glass.'
  - - Set up the jar
    - 'Follow Comstock''s first steps:

      ~ Place in the jar a layer of sand an inch or more in depth.

      ~ In this sand plant the water plants which you find growing under water in a pond or stream;

      ~ Place on top a layer of small stones or gravel; this is to hold the plants in place.

      ~ Tip the jar a little and pour in very gently at one side water taken from a pond or stream.

      Then let it settle.'
  - - Go dipping
    - '~ Dip deep into the edges of the pond and be sure to bring up some of the leaves and mud, for it is in these that the little water animals live.

      Empty each scoop into the bucket of pond water and look for anything that moves: snails, beetles, wrigglers, little "sticks" that walk (caddis-worms), dragon-fly nymphs.

      ~ In introducing the water animals into the aquarium it is well to put but a few in each jar.'
  - - Where to keep it
    - Comstock says a north window is best, or to one side of another window, so it doesn't get too much sun and warm up. She liked the water cool.
  - - Taking care
    - 'Read her care rules together:

      ~ If any insects or animals die in the aquarium they should be removed at once, as the decomposing bodies render the water foul.

      ~ As the water evaporates it should be replaced with water from the pond.

      Ask your child why the plants matter. Comstock says they give off oxygen that the animals breathe and take up the gas the animals breathe out.'
  - - Nature notebook
    - Draw the aquarium and label each layer and each plant. Start a page called "Who lives here" and add each creature you find, with the date.
  practice: Look at the aquarium for a few minutes each day this week and add to the "Who lives here" page.
  tip: 'When the study is done, return the animals and plants to the same pond they came from. Never let aquarium animals or plants go in a different pond or stream: that can spread creatures that harm
    the life already there.'
- num: 85
  roman: LXXXV
  idx: 407
  unit: 12
  title: Dragon-flies and damsel-flies
  mins: 35
  goal: Your child can tell a dragon-fly from a damsel-fly, describe how both hunt, and know that their young grow up underwater.
  materials:
  - A sunny pond or slow stream at midday
  - Binoculars (close-focusing ones are best, optional)
  - A dip-net or kitchen strainer and a white tray or dish
  - A sheet of writing paper
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of dragon-flies and damsel-flies: the silly old names and beliefs about them, their swift hunting flight, their huge eyes, and their underwater nymphs with a folding lower lip
    for catching prey. Then Lesson LXXXV with its leading thought, a method for nymphs in spring and adults in late summer, questions on the nymphs and the adults, and an outline for field notes.'
  steps:
  - - When and where
    - 'Adults: sunny days from late spring to early fall, best at midday over ponds and slow streams. Nymphs: Comstock says "April and May are the best months for securing them," in the bottoms of reedy
      ponds.'
  - - Safety first
    - 'Water safety: an adult stays within arm''s reach of young children at the water''s edge. Keep back from steep or slippery banks, and wash hands after handling pond water, mud or water creatures.

      Comstock asks children to catch a dragon-fly and put it under a tumbler. Their wings tear easily, so we watch them perched instead. A large nymph can give a small nip; tip it into the tray rather
      than holding it.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The dragon-flies are among the swiftest of all winged creatures and their rapid, darting flight enables them to hawk their prey, which consists of other flying insects. Their first stages are passed
      in the bottoms of ponds where they feed voraciously on aquatic creatures.'
  - - Watch them hunt
    - '~ Do you see dragon-flies darting over the pond? Describe their flight. They are hunting flies and mosquitoes and other insects on the wing; note how they do it.

      ~ In looking over a pond where there are many dragon-flies darting about, do the larger species fly higher than the smaller ones?'
  - - Dragon or damsel?
    - 'Find some that are resting on reeds or sticks.

      ~ Note the way the dragon-flies hold their wings when they are resting. Do they rest with their wings folded together over the abdomen or are they extended out at an angle to the abdomen?

      ~ The damsel-flies are those which hold their wings folded above the back when resting. Are these as large and strong-bodied as the dragon-flies? Are their bodies more brilliantly colored?'
  - - Strong, light wings
    - 'Try Comstock''s paper experiment:

      ~ Take a piece of writing paper and see how easily it bends; fold it two or three times like a fan and note how much stiffer it is. Is it this principle which strengthens the dragon-fly''s wings?'
  - - The young in the pond
    - 'In spring, sweep the net through the mud and weeds and tip it into the tray of water.

      ~ Where did you find these insects? Were they at the bottom of the pond or along the edges among the water weeds?

      ~ Look on the rushes and reeds along the pond margin, and see if you can find the empty nymph skins from which the adults emerged.

      Put the nymphs back in the pond when you''re done.'
  - - Nature notebook
    - Draw a dragon-fly and a damsel-fly at rest, side by side, so the different wing positions show. Then read the leading thought aloud and add the date and the pond's name.
  tip: Comstock says dragon-flies are entirely harmless to people, despite old names like "devil's darning needles." They eat a great many mosquitoes, both as nymphs and as adults.
- num: 86
  roman: LXXXVI
  idx: 413
  unit: 12
  title: Caddis-worms and caddis-flies
  mins: 30
  goal: Your child can find caddis-worms in their little houses of sticks or stones, describe how they build and move, and recognize the adult caddis-fly.
  materials:
  - A clear stream or pond
  - A dip-net or kitchen strainer and a white tray or dish of water
  - The aquarium from Lesson LXXXIV (optional)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of lying face down by a brook and watching the bottom, where bits of rubbish turn out to be caddis-worms in their cases; the many kinds of cases, how the larva builds and breathes,
    and the moth-like caddis-fly. Then Lesson LXXXVI's leading thought, method and fourteen questions.
  steps:
  - - When and where
    - 'Spring through summer. In clear streams, pick up stones and look on the bottom side for little tubes of sand grains or tiny pebbles. In ponds, look for moving bundles of bits of stick and leaf. Comstock''s
      method: the caddis-worms "may be captured and then may be placed in the school aquarium."'
  - - Safety first
    - 'Water safety: an adult stays within arm''s reach of young children at the water''s edge. Keep back from steep or slippery banks, and wash hands after handling pond water, mud or water creatures.

      Put each stone back the way it was. When you have finished looking, put every creature back where you found it.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The caddis-worms build around themselves little houses out of bits of sticks, leaves or stones. They crawl about on the bottom of the pond or stream, protected from sight, and able to withdraw into
      their houses when attacked. The adult of the caddis-worm is a winged moth-like creature which comes in numbers to the light at night.'
  - - Find the houses
    - '~ Where do you find the caddis-worms? Can you see them easily on the bottom of the stream or pond? Why?

      ~ Of what are the caddis-worm houses made? How many kinds have you ever found? How many kinds of materials can you find on one case?'
  - - Watch one walk
    - 'Put a few in the tray of water and wait until they come out.

      ~ What does the caddis-worm do when it wishes to walk around?

      ~ What are the caddis-worm''s enemies? How does it escape them? Touch one when it is walking, what does it do?

      Touch it with a grass stem, not a finger.'
  - - The builder
    - 'If you keep some in the aquarium for a few days:

      ~ How does the caddis-worm build its case? Watch one when it makes an addition to its case, and describe all that you can see.

      Comstock also asks children to pull a caddis-worm out of its case. We skip that: it can hurt the larva, and an empty case found on the bottom shows the inside just as well.'
  - - Put it into words
    - Ask your child to tell you how a caddis-worm is like a hermit crab or a snail, and how it is different. Then read the leading thought aloud.
  - - Nature notebook
    - Draw two or three different cases, life size, and label what each is made of. Add a picture of the grown caddis-fly from the book, with its wings folded like a tent.
  practice: 'On a summer night, look at the insects around a porch light near water. Comstock''s last question asks: "Can you tell the caddis-flies from other insects?"'
  tip: Most caddis-worms need clean water, so people who check the health of streams count them. Finding many kinds is a good sign.
- num: 87
  roman: LXXXVII
  idx: 417
  unit: 13
  title: Aphids, or plant-lice
  mins: 25
  goal: Your child can describe aphids and how they feed, explain what honey-dew is, and name some of their enemies.
  materials:
  - A plant with aphids (rose buds, milkweed, nasturtium, garden vegetables)
  - A jar of water to stand the stem in
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of aphids, "the most helpless and amiable little ninnies in the whole insect world": their beaks thrust into plants, their colors, cast skins, winged and wingless forms, honey-dew,
    and the ants that tend them. Then Lesson LXXXVII''s leading thought, method and eight questions, and an old naturalist''s account of an ant milking aphids.'
  steps:
  - - When and where
    - 'Late spring to fall, on the tips of rose shoots, milkweed (bright orange aphids), nasturtiums and many garden plants. Comstock''s method: "Bring into the schoolroom a plant infested with aphids,
      place the stem in water and let the pupils examine the insects through the lens."'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ Aphids have the mouth in the form of a sucking tube which is thrust into the stems and leaves of plants; through it the plant juices are drawn for nourishment. Aphids are the source of honey-dew
      of which ants are fond.'
  - - A colony under the lens
    - '~ How are the aphids settled on the leaf? Are their heads in the same direction? What are they doing?

      ~ Describe an aphid, including its eyes, antennæ, legs and tubes upon the back. Does its color protect it from observation?'
  - - Make one move
    - 'Nudge one gently with a grass stem.

      ~ What does it do in order to leave its place? What does it do with its sucking tube as it walks off? On what part of the plant was it feeding?

      Comstock''s question 2 ends by asking why Paris green does not kill aphids. Paris green was an arsenic poison sprayed on crops in her day and is no longer used; you can skip that part.'
  - - Skins and wings
    - '~ Can you see cast skins of aphids on the plant? Why does an aphid have to shed its skin?

      ~ Are all the aphids on a plant wingless? When a plant becomes dry are there, after several days, more winged aphids? Why do the aphids need wings?'
  - - Honey-dew
    - '~ Do you know what honey-dew is? Have you ever seen it upon the leaf? How is honey-dew made by the aphids?

      ~ What insects feed upon this honey-dew?

      Look for shiny, sticky leaves under the colony, and for ants walking among the aphids. Then read the leading thought aloud.'
  - - Nature notebook
    - 'Draw one aphid large, from the side, with its beak in the stem and the two little tubes on its back. Then answer Comstock''s question 7 in a list: "What enemies have the aphids?" The next two lessons
      are about two of them.'
  tip: Most of the aphids you see in summer are mothers that give birth to live young without any father, which is why a colony grows so fast.
- num: 88
  roman: LXXXVIII
  idx: 419
  unit: 13
  title: The ant-lion
  mins: 30
  goal: Your child can find ant-lion pits, explain how the pit traps ants, and describe the doodle-bug that lives at the bottom.
  materials:
  - Dry, sandy soil sheltered from rain (under eaves, overhangs, sheds or porches)
  - A spoon or trowel
  - A shallow dish of dry sand
  - A ruler
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the ant-lion as an ogre in its den: how it digs its funnel pit, throws sand at a slipping ant, sucks its prey through hollow jaws, and later spins a round cocoon and becomes
    a lace-winged insect. Then Lesson LXXXVIII''s leading thought, method and eight questions.'
  steps:
  - - When and where
    - 'Summer, in dry, fine sand or dust where rain doesn''t reach: under the edge of a porch, beside a shed, under overhanging rocks, along sandy paths. Look for groups of neat little funnels.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The ant-lion, or "doodle-bug" makes a little pit in the sand with very steep sides, and hidden at the bottom of it, waits for ants to tumble in to be seized by its waiting jaws. Later the ant-lion
      changes to a beautiful insect with gauzy wings, resembling a small dragon-fly.'
  - - Where are the pits?
    - '~ Where were the ant-lion pits out of doors? Were they in a windy place? Were they in a place protected from storms? In what kind of soil were they made?

      ~ Measure one of the pits. How broad across, and how deep? Are all the pits of the same size? Why?'
  - - The trap
    - '~ What can you see as you look down into the ant-lion''s pit? Roll a tiny pebble in and see what happens?

      ~ Watch until an ant comes hurrying along and slips into the pit. What happens then? As she struggles to get out how is she knocked back in?

      Be patient; this may take a while.'
  - - Meet the doodle-bug
    - 'Scoop under one pit with the spoon and tip the sand into your palm or onto the dish.

      ~ Take a trowel and dig out the doodle-bug. What is the shape of its body? What part of the insect did you see at the bottom of the pit?

      ~ Can you see that the ant-lion moves backward more easily than forward?

      It is harmless to hold, though its jaws may pinch a little.'
  - - Watch it dig
    - '~ Take a doodle-bug to the schoolroom, place it in a dish of sand, covered with glass, and watch it build its pit.

      Leave the dish in a quiet place for an afternoon; it digs by walking backward in circles and flicking sand with its head. Then put it back in the sand where you found it. Comstock warns that it is
      not worth trying to raise one, because it may take two or three years to grow up.'
  - - Nature notebook
    - Draw the pit from the side, like a funnel cut in half, with the ant-lion buried at the bottom and only its jaws showing. Add a close-up of the doodle-bug. Read the leading thought aloud.
- num: 89
  roman: LXXXIX
  idx: 422
  unit: 13
  title: The lace-wing and the aphis-lion
  mins: 25
  goal: Your child can find lace-wing eggs on their silk stalks and describe the aphis-lion that hatches from them and eats aphids.
  materials:
  - A plant with aphids, July until frost
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the green, golden-eyed lace-wing: how she lays each egg on top of a stiff silk stalk, and how her young, the aphis-lion, sucks aphids dry with hollow jaws and spins a tiny
    round cocoon. Then Lesson LXXXIX''s leading thought, method and six questions.'
  steps:
  - - When and where
    - 'Comstock''s method: "Through July and until frost, the aphis-lions may be found on almost any plant infested with plant-lice; and the lace-wing''s eggs or egg-shells on the long stalks are also readily
      found." Adult lace-wings often come to porch lights at night.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The lace-wing fly or golden-eyes, as she is called, is the mother of the aphis-lion. She lays her eggs on the top of stiff, silken stalks. The young aphis-lions when hatched, clamber down upon the
      leaf and feed upon plant-lice, sucking their blood through their tubular jaws.'
  - - Eggs on stalks
    - 'Look on leaves near the aphids for what looks like a fuzz of white mold.

      ~ When you see a leaf with some white mold upon it, examine it with a lens; the mold is likely to be the eggs of the lace-wing. Is the egg as large as a pin head? What is its shape? What is its color?
      How long is the stalk on which it is placed?

      ~ Why do you suppose the lace-wing mother lays her eggs on the tips of stalks?'
  - - The aphis-lion hunts
    - 'Look among the aphids for a small, flat, tapering larva with curved jaws, often carrying bits of trash on its back.

      ~ Watch an aphis-lion among the plant-lice. How does it act? Do the aphids seem afraid? Does the aphis-lion move rapidly? How does it act when eating an aphid?

      Look without touching: it can give a tiny nip.'
  - - Two hunters
    - '~ How does the aphis-lion differ in appearance from the ladybird larva?

      If you can''t find both, compare with the pictures in this lesson and in the ladybird lesson.'
  - - The golden-eyed mother
    - '~ Describe the little lace-wing fly that comes from the cocoon. Why is she called, golden-eyes? Why lace-wing? Does she fly rapidly?

      Comstock warns in her story that a lace-wing smells unpleasant if you pick her up. Then read the leading thought aloud.'
  - - Nature notebook
    - Draw a leaf with three lace-wing eggs on their stalks, an aphis-lion among aphids, and the green lace-wing with its gold eyes.
  practice: 'Comstock asks why the mother doesn''t lay her eggs flat on the leaf. Let your child work out the answer: the first aphis-lion to hatch would eat its brothers and sisters.'
- num: 90
  roman: XC
  idx: 426
  unit: 14
  title: The mosquito
  mins: 30
  goal: Your child can find mosquito wrigglers, describe how they breathe at the surface, and explain how emptying standing water stops mosquitoes.
  materials:
  - A rain barrel, bucket, flowerpot saucer or birdbath with standing water
  - A clear jar with a tight lid of fine cloth held by a rubber band
  - A spoon or turkey baster
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the mosquito: the boat-shaped egg rafts floating in rain barrels, the wrigglers that hang from the surface by a breathing tube, the pupae that rest with the other end up, and
    the harmless and the dangerous kinds of adults. Then Lesson XC with questions on the larva, the pupa and the adult.'
  steps:
  - - When, where and safety
    - 'Summer into September. Look in any standing water that has sat for a week: rain barrels, buckets, old tires, saucers under flowerpots, clogged gutters, birdbaths. Comstock suggests looking for the
      floating egg rafts too.

      Safety: keep the wrigglers in a jar with a tight cloth cover, and look at them for a day or two only. Then pour the water onto dry ground or pavement before any of them can turn into biting adults.
      Mosquitoes can spread illness.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The wrigglers, or wigglers, which we find in rain-barrels and stagnant water are the larvæ of mosquitoes. We should study their life history carefully if we would know how to get rid of mosquitoes.'
  - - Wrigglers at rest
    - 'Scoop a few wrigglers into the jar with plenty of their water and let them settle.

      ~ Where do they rest when undisturbed? Do they rest head up or down? Is there any part of their body that comes to the surface of the water?

      ~ Observe one resting at the top. At what angle does it hold itself to the surface of the water? Observe its head. Can you see the jaw brushes revolving rapidly? What is the purpose of this?'
  - - Wrigglers on the move
    - 'Tap the jar gently.

      ~ When disturbed what do they do? When they swim, do they go head or tail first? When they float do they go upward or downward?

      The breathing tube at the tail end is why they must keep coming back to the top.'
  - - The tumbler
    - 'Look for wrigglers with a big rounded front end. These are the pupae.

      ~ What is the most noticeable difference in appearance between the larva and pupa?

      ~ When the pupa rests at the surface of the water, is it the same end up as the wriggler?'
  - - Grown-up mosquitoes
    - 'Use the book''s pictures, or a mosquito resting on a wall.

      ~ When at rest, is it shortened and humpbacked or does it stand straight out with perhaps its hind legs in the air?

      ~ Which sex of the mosquito does the biting and the singing?

      Only the mothers bite: they need a meal of blood to make their eggs. The males, with feathery antennæ, drink plant juices.'
  - - Put it into words
    - 'Read the leading thought aloud and ask: Now that we know where wrigglers live, how can we get rid of mosquitoes around our house? (Tip out standing water once a week.) Then go and do it, and pour
      out the jar.'
  - - Nature notebook
    - Draw a wriggler hanging from the surface by its tail tube, a pupa with its two breathing "ears", and an adult mosquito. Draw arrows to show the order.
  tip: 'What we know now: Comstock teaches children to tell the malaria mosquito (Anopheles) from the common kind. Malaria was wiped out in the United States by the early 1950s, but mosquitoes still spread
    other illnesses, such as West Nile virus. She also asks why kerosene oil on the water kills wrigglers; people did that then, but today we tip out the water instead, which doesn''t harm other pond life.'
- num: 91
  roman: XCI
  idx: 431
  unit: 14
  title: The house-fly
  mins: 30
  goal: Your child can describe a fly's eyes, wings, feet and tongue, explain how flies carry germs, and work Comstock's arithmetic problem about how fast flies multiply.
  materials:
  - A fly resting on a window pane (or a dead fly from a windowsill and tweezers)
  - A hand lens (magnifying glass)
  - Paper and pencil for the arithmetic
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the house-fly as a thief at every table on earth and a carrier of disease: its breeding in manure, its eyes, tongue and feet, and how it passes the winter. Then Lesson XCI''s
    leading thought, method and twelve questions, including an arithmetic problem and an experiment with a plate of gelatin.'
  steps:
  - - When and where
    - Summer and early fall, at a window, porch or barn. A fly sitting on the inside of a window pane can be studied with the lens from very close.
  - - Safety first
    - 'Don''t touch live flies. If you use a dead fly, pick it up with tweezers. Wash hands with soap and water afterward.

      Comstock''s question 12 has children let a fly walk on a plate of gelatin and then watch germs grow. Growing germs at home isn''t safe, so skip it, or look for pictures of that experiment online.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The house-fly has conquered the world and is found everywhere. It breeds in filth and especially in horse manure.

      ~ These are a menace to health because they carry germs of disease from sputa and excrementitious matter to our tables, leaving them upon our food.

      In plain words: flies walk on dirt and droppings, then on our food.'
  - - Eyes
    - '~ Look at a fly, using a lens if you have one. Describe its eyes. Do you see that they have a honeycomb arrangement of little eyes?

      ~ After seeing a fly''s eyes, do you wonder that you have so much difficulty in hitting it or catching it?'
  - - Wings and balancers
    - ~ How many wings has the fly? How does it differ from the bee in this respect? Can you see two little white objects, one just behind the base of each wing? These are called poisers, or balancers,
      and all flies have them in some form.
  - - Fly toilet
    - 'Watch a live fly on the window for a while.

      ~ Describe how a fly makes its toilet as follows: How does it clean its front feet? Its head? Its middle feet? Its hind feet? Its wings?

      ~ What must you do to prevent flies from bringing disease to your family?'
  - - Lesson in arithmetic
    - 'Read Comstock''s problem aloud:

      ~ Supposing the fly which wintered behind the window curtain in your home last winter, flew out to the stables about May 1st and laid 120 eggs in the sweepings from the horse stable, all of which
      hatched and matured. Supposing one-half of these were mother flies and each of them, in turn, laid 120 eggs, and so on for five generations, all eggs laid developing into flies, and one-half of the
      flies of each generation being mother flies. How many flies would the fly that wintered behind your curtain have produced by September?

      Work it together, one generation at a time: 120 flies; half of them, 60 mothers, lay 120 eggs each; and so on. A calculator is fine for the big steps.'
  - - Nature notebook
    - Draw a fly from above, large, with its big eyes, two wings and the two little balancers. Write the answer to the arithmetic problem underneath, and read the leading thought aloud.
  answers: 'Generation 1: 120 flies. Generation 2: 60 mothers x 120 = 7,200. Generation 3: 3,600 x 120 = 432,000. Generation 4: 216,000 x 120 = 25,920,000. Generation 5: 12,960,000 x 120 = 1,555,200,000.
    All five generations together: 1,581,559,320 flies (about a billion and a half). If your child counts only the fifth generation, 1,555,200,000 is right too.'
- num: 92
  roman: XCII
  idx: 434
  unit: 14
  title: The Colorado potato-beetle
  mins: 25
  goal: Your child can describe the potato-beetle and its larva, tell how it protects itself, and follow its life story on a potato plant.
  materials:
  - A potato patch (or eggplant plants) in summer
  - A clear jar with a cloth cover and a little soil (optional)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the potato-beetle as a lesson in warning colors: it plays possum, then gives off a bad-smelling orange liquid, so birds won''t eat it. Then Lesson XCII''s leading thought,
    a method that ties it to gardening, and eleven questions on the beetle, its eggs, larva and pupa.'
  steps:
  - - When and where
    - Late spring through summer, on potato plants, and also on eggplant. Look under the leaves for clusters of orange-yellow eggs, and for plump, reddish, black-spotted larvae chewing the leaves.
  - - Safety first
    - 'Potato leaves, stems and green potatoes are poisonous to eat. Comstock asks what happens if you squeeze the beetle: just hold it gently in an open hand, because a light touch is enough for it to
      show its tricks. Wash hands with soap and water afterward.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The Colorado potato-beetle is a very important insect, since it affects the price of potatoes each year. It is disagreeable as a food for birds, because of an acrid juice which it secretes. We should
      learn its life-history and thus be able to deal with it intelligently in preventing its ravages.'
  - - The beetle
    - '~ What is the shape of the potato-beetle? Describe the markings on its head. What color are its eyes? Describe its antennæ.

      ~ Why is this insect called the ten-lined potato beetle?

      Count the lines on the wing-covers to check.'
  - - Playing possum
    - '~ Take a beetle in your hand. What does it do? Of what advantage is it to the insect to pretend that it is dead?

      ~ Why will birds not eat the potato-beetle?'
  - - Eggs and larvae
    - '~ Where does the mother beetle lay her eggs? Are they laid singly or in clusters? What color are the eggs?

      ~ Describe the young larva when it first hatches. What color is it at first? Does it change color later? Describe the colors and markings of a full grown larva.

      ~ Does it remain in sight while it is feeding? Does it act as if it were afraid of birds?'
  - - Put it into words
    - Ask your child why a bright, easy-to-see insect is not eaten by birds. Then read the leading thought aloud. Gardeners still pick these beetles off by hand into a can of soapy water; your child can
      help.
  - - Nature notebook
    - Draw the beetle with its ten stripes, a cluster of eggs on the underside of a leaf, and a larva. Date them, and note which plant they were on.
  tip: Comstock suggests putting other plants in the cage "to prove that these insects will only eat the potato." In fact they also eat eggplant and a few other plants of the potato family, so your child
    may get a surprise.
- num: 93
  roman: XCIII
  idx: 437
  unit: 14
  title: The ladybird
  mins: 25
  goal: Your child can describe the ladybird beetle and its very different-looking larva, and explain why gardeners are glad to see both.
  materials:
  - Plants with aphids (where ladybirds hunt)
  - A small clear jar (for a short look)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the ladybird, beginning with the old rhyme "Ladybird, Ladybird, fly away home": her energetic indecision, her spots, her hidden wings, and her warty larva that eats plant-lice.
    Then Lesson XCIII''s leading thought, method and questions on the beetle and the larva.'
  steps:
  - - When and where
    - 'Spring through fall. Comstock''s method: "These little beetles are very common in autumn," and their larvae "may be found on almost any plant infested with plant-lice."'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The ladybird is a beetle. Its young are very different from the adult in appearance, and feed upon plant-lice.'
  - - The beetle
    - 'Let a ladybird walk onto your child''s finger.

      ~ How large is the ladybird? What is its shape? Would two of them make a little globe if they were put flat sides together?

      ~ What color are the wing-covers? Are there any spots upon them? How many? Does the ladybird use its wing-covers when it flies?

      Watch it fly: the hard covers lift and the thin wings unfold from underneath.'
  - - Playing possum
    - '~ If you disturb the ladybird how does she "play possum?" Describe how she makes her toilet.

      She may leave a yellow drop on your skin; it smells bad to birds and is harmless, but wash your hands afterward.'
  - - The larva
    - 'Look among aphids for a small, spiky, dark gray larva with orange spots, like a tiny alligator.

      ~ Describe the ladybird larva. Does it look like its mother? What is its form? Is it warty and velvety or shiny?

      ~ Describe the actions of the ladybird larva in attacking and eating the plant-lice.'
  - - The pupa
    - '~ Watch a larva until it changes to a pupa. How does the pupa look? Can you see the shed skin? Where is it? To what is the pupa attached?

      Look for small round humps stuck to leaves near the aphids.'
  - - Nature notebook
    - 'Draw the life story: a yellow egg cluster, the spiky larva, the pupa on a leaf, and the beetle with its spots counted exactly. Then answer Comstock''s question in a sentence: "Why is the ladybird
      of great use to us?"'
  tip: The number of spots does not tell a ladybird's age, as some children believe; different kinds have different numbers of spots. Many of the ladybirds that crowd into houses in fall today are a kind
    brought from Asia.
- num: 94
  roman: XCIV
  idx: 440
  unit: 14
  title: The firefly
  mins: 30
  goal: Your child can describe when and how fireflies flash, find the light organ on the beetle, and explain that the flashes are signals.
  materials:
  - A warm, damp summer evening in a yard or field
  - A clear jar with a damp paper towel and a cloth cover
  - A small flashlight
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of fireflies "sown upon the night": which nights they fly, how high different kinds fly, how the light is made, and the glowing young. Then Lesson XCIV''s leading thought, method
    and eight questions, with a verse by Lowell and a photograph of a beetle in flight.'
  steps:
  - - When and where
    - Warm, still, damp evenings from June into August, at dusk, over lawns, meadows and the edges of woods.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ When the firefly wishes to make a light, it can produce one that, if we knew how to make, would greatly reduce the price of artificial light; for the light made by fireflies and other creatures,
      requires less energy than any other light known.'
  - - Watch the evening
    - '~ Do they begin to lighten before it is dark? Do you see them high in the air or near the ground? Is the flash they give short, or long enough to make a streak of light? Do you see them on cold and
      windy nights or on warm, still, damp evenings?

      ~ Make a note of the hour when you see the first one flash in an evening.'
  - - A closer look
    - 'Catch two or three gently in your cupped hands and put them in the jar with the damp towel.

      ~ Can you see the light when they are not flashing? What color is it? When they make the flash can you see the outline of the "firefly lamp?"

      ~ Watch closely and see if you think the flashing is a matter of will on the part of the firefly. Do you think the firefly is signaling to his mate when he flashes?'
  - - Fly or beetle?
    - '~ Is it a fly or is it a beetle?

      ~ Turn the beetle on its back. Can you see the part of the body that flashes? What color is it?

      Look through the side of the jar instead of turning it over yourself. Then let the fireflies go where you caught them, the same night.'
  - - Talk back
    - 'Fireflies really are signaling: each kind has its own pattern of flashes, and the females answer from the grass. Count the seconds between one firefly''s flashes, then try answering with a quick
      blink of the flashlight held low.'
  - - Nature notebook
    - Draw a firefly from below with its glowing tip colored in, and a dark night scene with the flash paths as dots or streaks. Write the date and time of the first flash. Read the leading thought aloud.
  practice: 'Comstock asks: "Do you know the life history of the firefly? What is it like in its earlier stages?" Look for glowworms, the young, glowing in damp grass and leaf litter on late-summer nights.'
  tip: Fireflies are fewer in many places than they used to be. Leaving a corner of the yard unmowed and turning off outdoor lights on summer nights helps them.
- num: 95
  roman: XCV
  idx: 445
  unit: 15
  title: Field observations on ants
  mins: 30
  goal: Your child can find ants' nests, describe how ants carry food and care for their young, and watch ants tending aphids.
  materials:
  - A field, yard or park with flat stones
  - A few cracker crumbs
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s essay "The Ways of the Ant": nests under stones and in mounds, the young in their stages, ants of different sizes, food processions, the winged kings and queens, ants that keep aphids
    as herds, and ants that raid other nests and take their young. Then Lesson XCV''s leading thought, method and fourteen questions for a summer of watching.'
  steps:
  - - When and where
    - 'Comstock''s method: write out the questions in May or June and answer them by watching through the summer. Look under flat stones in sunny fields, along sidewalk cracks, and on plants with aphids.'
  - - Safety first
    - 'Ants bite, and some sting. In the South, fire ants build loose mounds of soil and sting fiercely: never disturb a mound, and keep shoes on. Lift a stone by tipping its far edge up toward you, look
      quickly, and put it back gently the way it was.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ However aimless to us may seem the course of the ant as we see her running about, undoubtedly if we understood her well enough, we should find that there is rational ant-sense in her performances.'
  - - Find the nests
    - '~ Where do you find ants'' nests? Describe all the different kinds you have found. In what sort of soil do they make their nests? Describe the entrance to the nest.

      Lift one flat stone.

      ~ When the nest is disturbed, how do the ants act? Do they usually try to save themselves alone? Do they seek to save their young at the risk of their own lives?'
  - - Big ones and little ones
    - '~ Make notes on the difference in appearance of eggs, larvæ and pupæ in any ants'' nest.

      ~ How many sizes of ants do you find living in the same nest?

      Then put the stone back.'
  - - Carrying the load
    - 'Drop a few crumbs near a busy ant trail and wait.

      ~ What objects do you find ants carrying to their nests? Are these for food? How does an ant manage to carry an object larger than herself? Do you ever see two ants working together carrying the same
      load?

      ~ If you find a procession of ants carrying food to their nest, note if they follow the same path coming and going.'
  - - Ants and their herds
    - 'Find a plant with aphids and ants on it.

      ~ Watch carefully to see how the ant touches the aphid when she wishes the honey-dew.

      ~ If you disturb aphids which have ants tending them, note whether the ants attempt to defend or rescue their herds.'
  - - Nature notebook
    - Draw an ant carrying something bigger than herself, and a little map of the ant trail from the crumbs to the nest. Read the leading thought aloud and ask your child what "ant-sense" they saw today.
  practice: Keep the questions in the notebook all summer and add an answer whenever you see something. Watch especially for a swarm of winged ants on a warm day (question 9).
- num: 96
  roman: XCVI
  idx: 446
  unit: 15
  title: How to make the Lubbock ant-nest
  mins: 40
  goal: With an adult, your child can make or set up a simple observation nest and move a small group of ants into it for watching.
  materials:
  - A ready-made ant observation habitat, or two clear plastic sheets (picture-frame plastic), thin wood strips and a shallow tray
  - A pan or tray of water to stand it in (Comstock's moat)
  - A trowel and a large jar with a lid
  - A dark cloth or card to cover the nest
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Lesson XCVI is a building project, not a set of questions: a list of materials, directions for making Lubbock''s nest of two panes of glass with a thin layer of earth between them, standing on
    a plank with a water-filled moat, and directions for digging up a small colony with a fruit jar and trowel and moving it in. A second design, the Fielde nest, follows.'
  steps:
  - - Read the plan
    - 'Read Comstock''s directions on the book page together. The key ideas are simple:

      ~ This furrow is to be filled with water, as a moat, to keep the ants imprisoned.

      ~ Cover the glass with a thin layer of fine earth.

      A thin layer between two clear sheets means the ants can''t hide: every tunnel is against the glass.'
  - - 'Safety: the adult''s part'
    - Comstock's nest needs cut window glass, tin and a plank with a cut furrow. Cutting glass and tin is adult work, and many families use clear plastic or buy a ready-made ant habitat instead. If you
      build it, sand any cut edges smooth.
  - - Build a simple version
    - 'Lay one clear sheet on the tray. Glue thin wood strips around its edges, a little taller than an ant, leaving one corner open as a door. Spread a thin layer of fine, slightly damp soil. Lay the second
      sheet on top. Stand the tray in a wider pan of water: that is the moat. Make a cover of dark cloth or card.'
  - - Find a colony
    - '~ Armed with these, visit some pasture or meadow near by, and find under some stone, a small colony of ants which have plenty of eggs and larvæ.

      Use a common small black or brown ant, never fire ants or any ant that stings. Scoop a small handful of ants, young and soil into the jar, and leave most of the colony where it is.'
  - - Move them in
    - 'Tip the jar out on top of the cover, near the door.

      ~ The ants will soon find the way into the nest through the cut corner of the upper pane of glass, and will transfer their larvæ to it because it is dark.

      ~ But, since light disturbs the little prisoners, the cover should be removed only for short periods.'
  - - Nature notebook
    - Draw the nest from above and from the side, and label the glass, the soil, the door, the cover and the moat. Write the day the ants moved in.
  practice: Keep the soil a little damp (Comstock uses a wet sponge or blotter between the panes) and give the ants a drop of sugar water and a crumb every few days. When your observations are done, in
    a few weeks, return the ants to the same stone.
  optional: true
- num: 97
  roman: XCVII
  idx: 451
  unit: 15
  title: Ants in an artificial nest
  mins: 30
  goal: Your child can describe an ant's body and antennæ, and watch how worker ants feed each other and care for the eggs, larvæ and pupæ.
  materials:
  - The ant nest from Lesson XCVI (or a natural nest under a stone)
  - A drop of sugar water or honey on a scrap of card
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of ant anatomy and ant life in the nest: the slender waist, the busy antennæ, how she timed an ant walking along her ruler, and how nurses care for the young. Then Lesson XCVII''s
    leading thought, method and twelve questions.'
  steps:
  - - When and where
    - Any time you have an ant nest set up indoors, or in summer at a natural nest. Take the cover off the nest for a few minutes at a time only.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The ants are very devoted to their young and perhaps the care of them is the most interesting feature in the study of the artificial nest.'
  - - An ant's body
    - 'Look through the glass with the hand lens.

      ~ What is there peculiar about the shape of the ant''s body? Can you see which section bears the legs? Are the ants'' legs long compared with her body? Can she run rapidly?

      ~ Note how the ant keeps her antennæ in motion. Note how she gropes with them as a blind person with his hands. Note how she uses them in conversing with her companions.'
  - - Mealtime
    - 'Put the card with sugar water near the door.

      ~ See how an ant eats syrup. How do ants feed each other?

      Watch for two ants face to face, one passing a drop to the other.'
  - - The nursery
    - '~ Note the way the ants feed their young. How do they keep them clean?

      ~ Describe an egg, a larva and a pupa of the ant and tell how they differ. Do you know which ant is the mother of the larvæ in the nest?

      ~ Do you find larvæ of different sizes all together in your nest?'
  - - Put it into words
    - Ask your child to tell you, like a reporter, what one ant did for five minutes. Then read the leading thought aloud.
  - - Nature notebook
    - Draw an ant large from the side (head, thorax with six legs, slender waist, abdomen), and below it an egg, a larva and a pupa in a row.
  practice: Watch for a new worker coming out of her pupa skin. Comstock's question 10 asks how the nurses help this "callow" ant.
- num: 98
  roman: XCVIII
  idx: 454
  unit: 16
  title: The mud-dauber
  mins: 30
  goal: Your child can describe the mud-dauber's nest of mud tubes, tell what the mother puts inside, and describe the slim-waisted wasp.
  materials:
  - An old, empty mud-dauber nest (look under eaves, porch ceilings, in barns and sheds)
  - A puddle edge on a summer day for watching
  - Binoculars (optional)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of the black mud-dauber, a nervous little cement worker with a thread-like waist, which builds tubes of mud, stocks each with spiders and lays an egg. Then Lesson XCVIII's leading
    thought, method and nine questions.
  steps:
  - - When and where
    - 'Nests can be found all year under eaves, porch roofs, bridges and in barns. The wasps are busy in summer: Comstock says they are "very common in June and also in September," gathering mud at the
      edges of puddles.'
  - - A change from the book
    - 'Comstock says these wasps "do not sting severely when handled." We never handle wasps: any wasp can sting, and some people are badly allergic. Watch them from a few steps away. Collect only an old
      nest in late fall or winter, with an adult, after checking that each tube has a round exit hole (the wasps have left). Sting safety: watch bees and wasps from a few steps away, move slowly, and never
      swat at them. If anyone in the family is allergic to stings, keep well back and have their medicine with you.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ There are certain wasps which gather mud and mix it into mortar with which to build nests for their young. Within these nests, the mother wasp places spiders or insects which are disabled by her
      sting, for the food of the young wasps.'
  - - The nest
    - '~ Where did you find the mud-dauber''s nest? How was it protected from the rain? Was it easily removed?

      ~ What is the shape of the nest? How does it look inside? Of how many tubes does it consist? How long is each tube?

      Have an adult break one tube open outdoors. You may find a papery cocoon, or bits of old spiders.'
  - - The builder
    - '~ Of what material was the nest made? Is it not much harder than mud? How did the wasp change the mud to cement? Where did she get the mud? How did she carry it? With what tools did she plaster it?

      In summer, sit near a muddy puddle and watch for wasps rolling little balls of mud and flying off with them.'
  - - The wasp
    - 'From a safe distance, or with binoculars:

      ~ Describe the mud-dauber wasp. How large is she? What is the color of her body? Of her wings?

      ~ Where did you find the wasp? How did she act?'
  - - Nature notebook
    - 'Comstock''s question 5 is the notebook task:

      ~ Write a little story about all that happens in one of these tubes, including the following points: What did the mother wasp place in the tube? How and why did she close it? What hatched from the
      egg she placed within it?

      Draw a tube cut open beside the story. Read the leading thought aloud.'
- num: 99
  roman: XCIX
  idx: 458
  unit: 16
  title: The yellow-jacket
  mins: 30
  goal: Your child can explain how wasps make paper from wood, describe the inside of an empty paper nest, and tell what happens to a wasp colony in winter.
  materials:
  - An empty paper wasp nest, collected by an adult in winter (or a nature center's nest, or good pictures)
  - Scissors (for the adult)
  - A weathered wooden fence or porch rail
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the yellow-jackets that shared her family''s meals at their summer camp: their nervous ways, how they chew wood into paper, build their nests in layers, care for their young,
    and die off in fall except the young queens. Then Lesson XCIX''s leading thought, method and eleven questions.'
  steps:
  - - When and where
    - Study a nest in winter, after several hard freezes, when the colony has died and only an empty nest is left. In summer, watch yellow-jackets only where they already come, from a few steps away, and
      keep well away from any nest, including holes in the ground with wasps going in and out.
  - - Safety first
    - 'Only an adult takes down an old nest, and only in winter. Never poke, mow near or throw things at a nest in summer. Sting safety: watch bees and wasps from a few steps away, move slowly, and never
      swat at them. If anyone in the family is allergic to stings, keep well back and have their medicine with you.

      Comstock suggests putting out a dish of sweetened fruit to bring yellow-jackets close. Skip that if anyone is allergic; it is not needed for this lesson.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The wasps were the original paper makers, using wood pulp for the purpose. Some species construct their houses of paper in the trees or bushes while others build in the ground.'
  - - Paper from wood
    - '~ Of what is the nest made? Where did the wasp get the material? How do the wasps make wood into paper?

      ~ Is the covering of the nest all of the same color? Do these differences in color give you any idea of how the wasps build the paper into the nest? Does the paper tear more easily one way than another?

      Feel a weathered wooden fence: wasps scrape it with their jaws, leaving pale lines.'
  - - Inside the nest
    - 'Have the adult cut away one side of the covering with scissors, as Comstock''s method says.

      ~ How many combs or stories are there in the wasp house? How are they fastened together and how suspended?

      ~ Do the cells open upward or downward? For what purpose are the combs in the wasp-nest used? Are all the cells of the same size?'
  - - Winter
    - '~ Do wasps store food to sustain them during the winter? What happens to them during winter? Is the same nest used year after year.

      Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the nest cut open, showing the paper layers of the covering and the combs hanging one below another. Tape in a tiny piece of the nest's paper if it crumbles off.
  answers: 'Wasps chew bits of dry wood and mix them with saliva into a pulp, which dries as paper. The colony does not store food for winter: the workers and the old queen die in the fall, and only the
    young queens survive, hidden under bark or logs. Each spring a queen starts a new nest; the old nest is not used again.'
- num: 100
  roman: C
  idx: 461
  unit: 16
  title: The leaf-cutter bee
  mins: 25
  goal: Your child can find the neat round and oblong holes the leaf-cutter bee cuts from leaves, and explain how she uses the pieces to build cups for her young.
  materials:
  - A rose bush or other garden shrub with smooth leaves
  - Leaves chewed by caterpillars, for comparison
  - A nature notebook and a pencil (colored pencils if you have them)
  book: Comstock's story of watching a leaf-cutter bee cut a circle from a rose leaf "quicker'n a wink" and fly off with it, and of finding the nest of rose-leaf cups in a tunnel. Then Lesson C's leading
    thought, method and seven questions, with a photograph of a cut rose leaf and the nest cups.
  steps:
  - - When and where
    - 'Comstock''s method: "It is very easy to find in June or autumn the leaves from which the leaf-cutter bee has cut the bedding for her young." Look on roses, lilacs, redbud and other smooth-leaved
      shrubs.'
  - - Safety first
    - 'Watch the bees; don''t try to catch them. Mind the rose thorns. Sting safety: watch bees and wasps from a few steps away, move slowly, and never swat at them. If anyone in the family is allergic
      to stings, keep well back and have their medicine with you.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ When we see the edges of rose leaves with holes of regular pattern in them, some of the holes being oblong and some circular, we know the leaf-cutter bee has cut them to make her cradle cups.'
  - - Find the cut leaves
    - '~ Do you find rose leaves with round holes cut in their edges? Do you find on the same bush some leaflets with oblong holes in them?

      ~ Are the circular holes of the same size? Are the long holes about equal in size and shape? Do you find any other plants with holes like these cut in them?'
  - - Who did it?
    - 'Put a cut leaf next to a leaf chewed by a caterpillar.

      ~ What do you think made these holes? If an insect was taking a leaf for food would the holes be as regular?

      ~ Have you ever seen the little black bee carrying pieces of rose leaves between her front feet?'
  - - The cups
    - 'Look at the book''s photograph of the nest cups. Comstock says the oblong pieces line the sides of each cup and the round pieces make the lids. Ask:

      ~ If the mother bee made each little nest cup and put in the bee-bread, and honey for her young, which cup contains the oldest of the family? Which the youngest?'
  - - Nature notebook
    - 'Comstock''s first task:

      ~ Sketch or describe the rose leaf thus cut, noting exactly the shape of the holes.

      Trace around a real cut leaf if you can. Then read the leading thought aloud.'
  tip: 'Leaf-cutter bees will nest in "bee hotels": a block of wood with holes drilled in it, or a bundle of paper tubes, hung on a sunny wall in spring. Watch for green leaf plugs in the holes.'
- num: 101
  roman: CI
  idx: 464
  unit: 16
  title: The little carpenter-bee
  mins: 30
  goal: Your child can find a tiny bee's tunnel in the pith of a dead twig and explain how the cells along it hold a whole family, oldest at the bottom.
  materials:
  - Dead, dry twigs of elder, raspberry or staghorn sumac (broken stems with pith)
  - Garden gloves
  - A sharp knife (for the adult)
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the little carpenter-bee and the twig "apartment house": a tunnel in the pith of sumac or elder, divided into cells by partitions of tiny chips (a bee) or mud (a wasp), one
    young bee in each. Then Lesson CI''s leading thought, method and six questions.'
  steps:
  - - When and where
    - 'Comstock''s method: "This lesson may be given in June or in October." In June the family is at home; in autumn you find empty tunnels with bits of partition still inside, and sometimes a whole family
      stowed away for the winter.'
  - - Safety first
    - 'Comstock''s sumac is the harmless staghorn or smooth sumac of dry, sunny places. Poison sumac grows in wet places and has whitish, drooping berries: learn it first and don''t touch it. Before you
      go, learn to recognize poison ivy ("leaves of three, let it be"), and poison oak or poison sumac where they grow. We never eat any wild berry, leaf or plant.

      Wear gloves for raspberry canes. An adult splits the twigs with the knife, on a board, cutting away from the hands.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ Not all bees live in colonies like the honey-bees and bumblebees. One tiny bee rears her brood within a tunnel which she makes in the pith of sumac, elder or raspberry.'
  - - Split the twigs
    - '~ Collect dead twigs of sumac or elder and cut them in half, lengthwise. Do you find any with the pith tunneled out?

      Look for broken-off stems with a small hole in the cut end. Split a dozen; one or two may have tunnels.'
  - - Read the tunnel
    - '~ How long is the tunnel? Are its sides smooth? Can you see the partitions which divide the long narrow tunnel into cells?

      ~ Look at the partitions with a lens, if necessary, to determine whether they are made of tiny bits of wood or of mud. If made of mud, what insect made them?

      ~ Are there any insects in the cells? If so, describe them. Is there bee-bread in the cells?'
  - - The family story
    - '~ Write the story of the oldest of the bee family which lived in this tunnel. Why did it hatch first? On what did it feed? When it became a full fledged bee, what did it do? How did it finally get
      out?

      Hint: the mother filled the deepest cell first. Then read the leading thought aloud.'
  - - Nature notebook
    - Draw the split twig with the tunnel and its cells numbered from the oldest to the youngest. Add the story from step 6.
  practice: Comstock suggests hanging glass tubes wrapped in black paper among bushes in May and checking them each week. Paper drinking straws or a bundle of hollow stems tied together work just as well
    and are safer than glass.
- num: 102
  roman: CII
  idx: 467
  unit: 16
  title: The bumblebee
  mins: 30
  goal: Your child can watch a bumblebee at work in flowers, describe how she collects and carries pollen, and explain why bumblebees should be protected.
  materials:
  - A garden, meadow or roadside with clover or other flowers in bloom
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of the bumblebee, with Emerson''s lines: the foolish old war between farm boys and bumblebees, the queen who starts a nest alone in spring, the colony in an old mouse nest, and
    the bumblebee as the pollen carrier for clover and wild flowers. Then Lesson CII''s leading thought, method and questions.'
  steps:
  - - When and where
    - May, for the big queens flying low over the ground looking for nest sites; June to September for workers in flowers. Clover, bee balm, sunflowers, squash blossoms and many garden flowers are good
      places to watch.
  - - Safety first
    - 'Comstock suggests catching a bumblebee in a glass for a short look. We don''t: a bumblebee can sting if trapped. Stand quietly a little way off and watch her work. Comstock also says plainly that
      the nest should not be disturbed:

      ~ It is not advisable to study the nest, which is not only a dangerous proceeding for the pupil, but it also means the destruction of a colony of these very useful insects.

      Sting safety: watch bees and wasps from a few steps away, move slowly, and never swat at them. If anyone in the family is allergic to stings, keep well back and have their medicine with you.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The bumblebees are the chief pollen carriers for most of our wild flowers as well as for the clovers and other farm plants. They should, therefore, be kindly treated everywhere; and we should be
      careful not to hurt the big queen bumblebee which we see often in May.'
  - - Watch her work
    - '~ In how many flowers do you find the bumblebee? Watch her closely and see how she gets the nectar. Notice how she "bumbles around" in a flower and becomes dusted with pollen.

      ~ Watch her and note how she gets the pollen off her fur and packs it in her pollen baskets. On which legs are her pollen baskets? How does the pollen look when packed in them?'
  - - Her fur coat
    - '~ What is the bumblebee''s covering? What is the color of her plush? Is she furry above and below?

      ~ Will a bumblebee sting a person unless she is first attacked?'
  - - The queen in spring
    - '~ Have you seen the very large queen bumblebee in the spring, flying near the ground hunting for a place to build a nest?

      Then read the leading thought aloud.'
  - - Nature notebook
    - Draw a bumblebee on a flower with her pollen baskets full, and color the pollen as you saw it. Keep a list of every flower you saw bumblebees visit.
  tip: 'What we know now: several kinds of bumblebees have become much rarer since Comstock''s day. Planting flowers that bloom from spring to fall and avoiding garden poisons both help them.'
- num: 103
  roman: CIII
  idx: 472
  unit: 16
  title: The honey-bee
  mins: 35
  goal: Your child can name the three kinds of bees in a hive (queen, drones and workers), tell them apart, and point out the worker's pollen basket.
  materials:
  - A visit to a beekeeper, or dead bees from a beekeeper (drones in September)
  - Tweezers
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s long story of the honey-bee colony, "a republic that has many kings and only one queen": the queen, the drones and the workers, and the work each does. Then Lesson CIII''s leading thought,
    method, and questions on the worker, the queen and the drone, with topics for written work.'
  steps:
  - - When and where
    - 'Summer and early fall. Comstock''s method: "In almost every country or village community there is an apiary, or at least someone who keeps a few colonies of bees." Many beekeepers are glad to show
      children their hives. She also notes that "Any apiary during September will give enough dead drones for a class to observe."'
  - - Safety first
    - 'At a hive, follow the beekeeper''s rules exactly, wear the veil they give you, and move slowly. Sting safety: watch bees and wasps from a few steps away, move slowly, and never swat at them. If anyone
      in the family is allergic to stings, keep well back and have their medicine with you.

      Pick up dead bees with tweezers: a dead worker''s sting can still prick.'
  - - For which ages
    - Comstock says this lesson "should not be given below the fifth grade; and it is better adapted to eighth grade work." With younger children, just watch bees coming home to the hive with colored pollen
      on their legs, and skip to the notebook.
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ In a colony of honey-bees there are three different forms of bees, the queens, the drones, and the workers. All of these have their own special work to do for the community.'
  - - The worker
    - 'Look at a worker with the lens.

      ~ How many divisions of the body are there?

      ~ Are there small, simple eyes between the large compound ones?

      ~ Note that this segment of the hind leg is much wider. Note its form and describe how it forms the pollen basket.

      ~ Compare the front and hind wing as to shape and size.'
  - - Queen and drone
    - 'Use the beekeeper''s help or the book''s pictures for the queen.

      ~ How does the queen differ in size and shape from the worker?

      ~ How does the drone differ in size and form of body from the worker?

      Drones are the males. They have no sting and very big eyes that meet on top of the head.'
  - - Put it into words
    - Ask your child to tell you each bee's job. Then read the leading thought aloud.
  - - Nature notebook
    - 'Draw a queen, a drone and a worker side by side at the same scale, and label the worker''s pollen basket. Older children can write Comstock''s theme from question 18: the life of a worker bee from
      the day she comes out of her cell.'
- num: 104
  roman: CIV
  idx: 475
  unit: 16
  title: The honey-comb
  mins: 25
  goal: Your child can describe the six-sided cells of honey-comb and explain why that shape saves room and wax.
  materials:
  - A piece of comb honey (from a store, farmers' market or beekeeper)
  - A plate and a knife
  - Pennies or other round counters
  - A hexagonal pencil
  - A hand lens (magnifying glass)
  - A nature notebook and a pencil (colored pencils if you have them)
  book: 'Comstock''s story of honey-comb, which mathematicians have long admired: how the six-sided cells meet back to back in a double row, how the bottom of each cell is a little three-sided pyramid,
    and how the comb is the strongest and thriftiest way to store a liquid. Then Lesson CIV''s leading thought, list of materials and nine questions.'
  steps:
  - - When and where
    - 'Any time of year, at the kitchen table. Comstock''s materials: "A section filled with honey and also a bit of empty comb and a bit of commercial foundation comb which may be obtained in any apiary."
      Comb honey alone is enough.'
  - - Keep the big idea in mind
    - 'Comstock''s "leading thought" is the one idea the lesson is meant to lead to. Read it to yourself now, and save it to share at the end, after your child has looked and answered:

      ~ The cells of honey-comb are six-sided and in double rows and are very perfectly arranged for the storing of honey, so as to save room.'
  - - Look at the cells
    - '~ Look at a bit of empty honey-comb; what is the shape of the cell as you look down into it?

      ~ What is the shape of the bottom of the cell?

      Count the sides of one cell with a toothpick, and count how many cells touch it.'
  - - Why six sides?
    - 'Lay pennies in rows, touching. Point to the little gaps between them: wasted space. Now look at the end of the hexagonal pencil, and at the comb again: six-sided shapes fit with no gaps at all.

      ~ Explain how honey-comb economizes space as storage for honey, and why an economy of space is of use to bees in the wild state.'
  - - Honey in the comb
    - '~ Observe honey-comb containing honey; how is the honey retained in the cells?

      ~ In the hive is the honey-comb placed so that the length of the cells are horizontal or up and down?

      Then cut a small piece and have a taste.'
  - - Nature notebook
    - 'Draw a patch of seven cells: one in the middle and six around it. Beside it, draw circles in rows with the gaps shaded. Read the leading thought aloud and write it under your drawing in your child''s
      own words.'
  tip: Never give honey to a baby under one year old.
  answers: The cells are six-sided (hexagons); six-sided cells fit together with no gaps, so no space and no wax is wasted. Each cell's bottom is a shallow three-sided pyramid that fits against the bottoms
    of three cells on the other side of the comb. In the hive the cells lie nearly flat (horizontal), tipped up a little at the open end, and the honey is held in by surface stickiness and then sealed with
    wax caps.
- num: 105
  roman: CV
