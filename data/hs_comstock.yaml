      distance and don''t swat.'
  - - The leading thought
    - '~ The sunflower is not a single flower, but is a large family of flowers living together; and each little flower, or floret, as it is called, has its own work to do for the family welfare.

      This is the lesson Comstock wanted children to do first, before the composite outline in Lesson CXXXV.'
  - - Four florets
    - 'Following Comstock''s method: an adult cuts a partly bloomed head in half. With tweezers, take out a bud from the center, an open floret with its dark tube, one with two curled yellow stigmas, and
      a banner-flower.

      ~ Study first the bud. Of how many parts is it composed? What will the lower, white part develop into?

      ~ Take an open floret with the long, dark brown tube projecting from it.'
  - - Banner-flowers
    - ~ Of what use is the banner-flower to the sunflower family? Do you think that we would plant sunflowers in our gardens for their beauty if they had no banner-flowers?
  - - The pattern
    - '~ Note the beautiful pattern in which the buds are arranged.

      Look for two sets of spirals, one curving each way. Try counting the spirals in one direction.'
  - - Does it follow the sun?
    - '~ Some people declare that it twists its stem so as to face the sun all day. Do you think this is true?

      What we know now: young sunflower plants do turn from east to west during the day and back at night. Once the big head opens, most stop turning and face east.'
  - - Seeds
    - '~ What birds are especially fond of sunflower seeds? Of what use are the seeds commercially?

      Comstock kept one cut sunflower fourteen days:

      ~ it blossomed cheerfully from its rim to its very center'
