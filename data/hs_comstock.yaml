- title: The sunfish
  mins: 30
  goal: Your child can describe the pumpkinseed's round, flat shape, its spiny fin and bright colors, and the nest the male guards in spring.
  materials:
  - A pond or lake shore with a dock or clear shallows
  - Polarized sunglasses
  - Colored pencils
  - Nature notebook
  book: The leading thought, the method (a pumpkin seed in a jar aquarium; stories from children who have fished for them) and eight questions about where sunfish live and bite, their shape, the spiny and
    soft dorsal fin, the eye, mouth, gill-cover spot and colors, the nest, and their many names. A passage about the sunfish "strutting like turkey-cocks" follows.
  steps:
  - - When and where
    - 'Late spring and early summer is best, when males make round, clean nests in the shallows and guard them. Look from a dock or along a sunny pond edge. In clear water you may see a whole row of saucer-shaped
      hollows. Safety: an adult stays within arm''s reach near any water. Stay off steep or slippery banks and never wade in fast water.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The pumpkin seeds are very gamey little fishes which seize the hook with much fierceness. They live in the still waters of our streams or in ponds and build nests in the spring, in which the eggs
      are laid and which they defend valiantly.'
  - - Shape
    - ~ What is the general shape of the sunfish's body as seen from above? As seen from the side? Why is it called pumpkin seed?
  - - The spiny fin
    - '~ Describe the dorsal fin. How many spines has it? How many soft rays? What is the difference in appearance between the front and hind dorsal fin?

      Comstock''s teacher''s story says that when the fin is raised it looks like a chief''s headdress. The spines are sharp; don''t grab a sunfish.'
  - - Colors and the ear spot
    - '~ What is the color of the upper portion of the gill opening or operculum? What is the general color of the sunfish?

      The pumpkinseed has a black "ear" flap with a red or orange spot at its tip.'
  - - The nest
    - '~ Where does the sunfish make its nest? Does the father or mother sunfish make the nest? Do one or both protect it? Describe the nest.

      Watch a guarding male chase off other fish.'
  - - Put it into words
    - Ask your child how many names they can remember for this fish. Then share the leading thought.
  - - Nature notebook
    - Draw a pumpkinseed from the side in color, its spiny fin raised. Draw a nest hollow on the pond bottom below it.
  practice: 'Comstock''s teacher''s story lists names: pumpkin seed, tobacco box, sunfish, bream, pondfish. Ask friends and relatives what they call it.'
  tip: If your family fishes, a sunfish is a good first catch and release. An adult should handle it, smoothing the spiny fin down from front to back.
