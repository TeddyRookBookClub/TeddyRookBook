- title: The water snake
  mins: 25
  goal: Your child can describe where water snakes live, what they eat, and how they swim and bask, from a safe distance.
  materials:
  - Binoculars
  - A pond, stream, dam or dock where snakes bask on rocks or branches
  - A field guide or app for your area's snakes
  - Nature notebook
  book: The leading thought (it lives by streams because its food lives in and about water), the method (better to watch it in its native surroundings, since it uses the same place year after year) and
    six questions about where it is found and its size, its food and hunting, swimming and diving, colors and the young, its favorite sunning place, and winter. A passage from Thoreau's journal about a
    big water adder follows.
  steps:
  - - When and where
    - 'Late spring through early fall, on sunny rocks, logs, dams and branches over water. Comstock''s teacher''s story says a water snake usually has a favorite basking place and returns to it year after
      year, so once you find one, you can come back.

      Safety: never pick up or touch a wild snake, even one you think is harmless; watch from at least two big steps away and let it go on its way. Before you go out, learn which venomous snakes live where
      you live (rattlesnakes, copperheads, cottonmouths or coral snakes in parts of the United States), and look before you put hands or feet under logs, rocks or into tall grass. Water snakes bite readily
      if bothered. In the Southeast they are easily confused with the venomous cottonmouth, so keep well back from every snake near water. An adult stays close by near the water too.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The water snake haunts the banks of streams because its food consists of creatures that live in and about water.

      Comstock agrees that "it will be better nature-study to get the children to observe it in its native surroundings."'
  - - Find a basking spot
    - 'Scan the rocks and low branches with binoculars.

      ~ Where is the water snake found? How large is the largest one you ever saw?

      ~ Does each water snake have a favorite place for sunning itself?'
  - - Food
    - '~ Why does the water snake live near water? What is its food? How does it catch its prey?

      Comstock''s teacher''s story says it eats mostly frogs, salamanders and fish, catching them by chasing.'
  - - Swimming
    - ~ Describe how the water snake swims. How far does its head project above the water when swimming?
  - - Colors
    - '~ Describe the markings and colors of the water snake. How do these colors protect it from observation?

      Thoreau noticed the bands showed clearly in the water but looked almost plain brown out of it.'
  - - Put it into words
    - Ask your child why this snake lives where it does. Then share the leading thought.
  - - Nature notebook
    - Draw the water snake on its basking rock, with the water line. Mark the place on a little map so you can check it again.
  practice: Visit the same basking spot on a few sunny days. Is the snake there? At what time?
  tip: Comstock hoped boys would see the water snake as "a more interesting creature for study, than as an object to pelt with stones." Talk about leaving snakes in peace.
  num: 51
  roman: LI
  idx: 230
  unit: 5
- title: The turtle
  mins: 30
  goal: Your child can describe how a turtle's shell protects it, compare the upper and lower shells, and tell how land and water turtles differ.
  materials:
  - A pond with basking turtles, or a nature center, zoo or friend's pet turtle
  - Binoculars
  - Paper and pencil for shell drawings
  - Nature notebook
  book: The leading thought, the method (a turtle of any kind is all that is needed) and twelve questions about how much of the turtle shows, the upper and lower shells and their plates, the shell's border,
    head, eyes and eyelid, nose, mouth and throat, legs, claws and webbed feet, swimming, the tail, skin, enemies and sounds, food and kinds of turtles, and eggs. A photograph of a snapping turtle is on
    the page.
  steps:
  - - When and where
    - 'Late spring through early fall. Painted turtles and sliders bask in rows on logs in ponds on sunny mornings. Box turtles wander in woods and fields after summer rains. A nature center or a family''s
      pet turtle is good for a close look.

      Safety: turtles often carry salmonella germs. Wash hands with soap after touching any turtle, its water or its tank. Never touch a snapping turtle: it bites hard and has a long neck. Don''t take wild
      turtles home; box turtles in particular live their whole lives in one small area, and many states protect them.'
  - - Keep the big idea in mind
    - 'Read this to yourself:

      ~ The turtle''s shell is for the purpose of protecting its owner from the attack of enemies. Some turtles live upon land and others in water.'
  - - How much shows?
    - '~ How much can you see of the turtle when it is walking? If you disturb it what does it do? How much of it can you see then?

      At a pond, count how many basking turtles slide into the water as you walk closer.'
  - - Two shells
    - '~ Compare the upper shell with the lower as follows: How are they shaped differently? What is their difference in color?

      ~ Would it be a disadvantage to the turtle if the upper shell were as light colored as the lower? Why?

      Comstock asks for a drawing of both shells showing the shapes of the plates.'
  - - Head and eyes
    - '~ How far does the turtle''s head project from the front of the shell? What is the shape of the head? With what colors and pattern is it marked?

      ~ Describe the mouth. Are there any teeth? With what does it bite off its food?'
  - - Feet and swimming
    - '~ How many claws on the front feet? Are any of the toes webbed? On which feet are the webbed toes? Why should they be webbed?

      ~ Describe the way a turtle swims. Which feet are used for oars?'
  - - Eggs and enemies
    - '~ What are the turtle''s enemies? How does it escape from them?

      ~ How do turtle eggs look? Where are they laid? How are they hidden?

      In late spring, mother turtles may cross roads and lawns to dig nests in sandy soil. Leave nests alone.'
  - - Nature notebook
    - Draw the top and bottom shell side by side, every plate outlined, as Comstock asks. Write whether your turtle lives on land or in water and how you can tell from its feet. Then ask your child to say
      the leading thought in their own words.
  practice: Comstock's question 11 asks children to "write an account of all the species of turtles that you know." Keep a list of every kind you see this year.
  tip: If you see a turtle crossing a road, an adult may help it across in the direction it was heading, if it is safe to stop, but never pick up a snapping turtle.
