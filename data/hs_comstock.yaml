- title: Jack-in-the-pulpit
  mins: 35
  goal: Your child finds Jack-in-the-pulpit, explains that the striped “pulpit” is not the flower, and finds where the real flowers are.
  materials:
  - Nature notebook, pencil and colored pencils
  - A hand lens (magnifying glass)
  - Colored pencils (green and purple-brown)
  book: 'A Teacher''s Story about “Jack” and his pulpit and the lesson: Leading thought, Method and eleven questions, ending with a writing topic.'
  steps:
  - - When and where
    - 'Jack-in-the-pulpit grows in damp, rich woods and blooms in May and June. The bright red berries ripen in late summer.

      Before you go, make sure your child can spot poison ivy: three leaflets on each leaf ("leaves of three, let it be"), often climbing as a hairy vine or growing as a low patch.

      Safety: every part of this plant, including the root and berries, contains tiny crystals that burn the mouth badly. Look and draw, never taste.'
  - - The leading thought
    - '~ The real flowers of Jack-in-the-pulpit are hidden by the striped spathe which is usually spoken of as the flower.

      Comstock adds that the root was eaten by Native Americans. They knew how to prepare it so it would not burn. We skip her question about how the root tastes.'
  - - The pulpit
    - '~ Where do you find Jack-in-the-pulpit? Is the soil dry or damp? Do you ever find it in the fields?

      ~ Why is the spathe called a pulpit? What are the colors of the spathe? Are all the spathes of the same colors?

      A pulpit is the raised stand a preacher speaks from. The spadix inside, standing up, is “Jack.”'
  - - The leaves
    - '~ Describe or sketch the leaves of Jack-in-the-pulpit. How do they rise above and protect the flower? How many leaflets has each leaf?

      ~ Can you find any of the plants with only one leaf?'
  - - Where are the real flowers?
    - 'Gently lift the hood and look down inside with the lens. Don''t tear the spathe. The tiny flowers are crowded at the bottom of Jack''s “one leg.”

      ~ Are all the blossoms alike? Describe, if you can, those flowers which will produce the seed and those which produce the pollen.'
  - - Compare and imagine
    - '~ Compare the Jack-in-the-pulpit with the calla lily.

      Both have a spathe wrapped around a spadix. For a writing day, Comstock''s last question:

      ~ Write an English theme on “The Sermon that Jack Preached from His Pulpit.”'
  - - Nature notebook
    - Draw Jack in his pulpit with the hood over his head, then a small sketch of the three-part leaf. Wash hands when you come in.
  practice: 'Visit again in June and August. Comstock asks:

    ~ Do you know how its seeds look in June? How do they look in August?'
  tip: Some children find it fun to write Jack's sermon as a speech to the other woodland plants. Keep it to a few sentences.
