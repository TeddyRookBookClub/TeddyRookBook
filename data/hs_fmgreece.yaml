  practice: 'Your child compares Lycurgus and Cleomenes: what was the same about what they wanted?'
  tip: The chapter includes the murder of Agis, Cleomenes killing the ephors, and, in the last lines, Cleomenes taking his own life. Preview pages 256–261;
