- title: Aristotle, Zeno, Diogenes and Apelles
  mins: 30
  goal: Your child can tell one story about each of the four men and explain the words stoic, epicure and cynic.
  materials:
  - A notebook or paper and colored pencils
  book: Aristotle, Alexander's tutor, opens a school in Athens and writes about almost everything; his writings are hidden underground and found again.
    Zeno teaches in a porch (the Stoics) and Epicurus founds a school. Diogenes lives in a tub, looks for "a man" with a lantern, and tells Alexander to
    get out of his sunshine. Apelles paints a horse that real horses neigh at.
  steps:
  - - Warm up
    - 'Ask: Who was Alexander''s teacher? (Aristotle, from last week.)'
  - - Read the chapter together
    - Read pages 237–244 aloud, or let your child read and help with the hard names. Four short stories in three parts.
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - Why did Aristotle leave Athens?

      - What happened to his writings after his death?

      - What did Diogenes say when someone asked about his lantern?

      - What did Diogenes ask Alexander to do?

      - How did Apelles prove his horse was the best?'
  - - Words from philosophers
    - 'Write three words and talk about each:

      Stoic (from Zeno''s porch, the Stoa): someone who bears pain without complaining.

      Epicure (from Epicurus): someone who loves fine food. The book says Epicurus really meant peace of mind.

      Cynic (from the Greek word for dog): the book calls them "growlers."'
  - - Talk it over
    - 'Ask:

      1. Why did Alexander say, "If I were not Alexander, I should wish to be Diogenes"?

      2. What did Apelles mean by "Never a day without a line"? How could you use that motto?'
  - - Remember it
    - '~ "Nothing, but get out of my sunshine," replied Diogenes.

      ~ "Never a day without a line."'
  practice: 'Take up Apelles''s motto for a week: one small drawing every day in a sketchbook, even just a line or two.'
  answers: 'Narration hints: his enemies said he had no respect for the gods, and he left "to keep the Athenians from sinning against philosophy"; his writings
    were buried underground for about 200 years; "I am looking for a man"; "get out of my sunshine"; real horses neighed at his painted horse.

    Talk it over: 1. Diogenes wanted almost nothing; the book says he had the power to "conquer self." 2. Practice a little every single day.'
