lessons:
- title: 'The Gods of Greece (I–II): Jupiter and his brothers and sisters'
  mins: 25
  goal: Your child can name the king of the gods and tell which part of the world each of his brothers and sisters ruled.
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  - Index cards for a "gods of Greece" card set
  book: 'Sections I and II of the Introduction: Cronos and the swallowed children, baby Jupiter hidden in a cave, the war with the Titans, and how Jupiter
    shared out the world: the sky, the sea, the underworld, the grain and the hearth. Ends with the story of Proserpine and the seasons.'
  steps:
  - - Set the scene
    - 'Find Greece on a map or globe: a small, rocky country at the south of Europe, with sea on three sides and hundreds of islands.

      Say: The people who lived here long ago told wonderful stories about gods and goddesses. This book starts with those stories, because every Greek
      child knew them. They are myths: stories people believed long ago, not history.'
  - - Read the chapter together
    - 'Read pages 9–15 aloud, or let your child read and help with the hard names. Stop after the part about Vesta and the sacred fire (the end of section
      II).

      The book gives two names for most gods: the Greek name, and the Roman name "we call" them. It uses the Roman names most of the time.

      ~ In the southern part of Europe is a little country called Greece.'
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - How did Rhea save baby Jupiter?

      - Who helped Jupiter win the war against the Titans?

      - What did Jupiter give to Neptune, to Pluto, to Ceres and to Vesta?

      - Why do we have spring and winter, in the story of Proserpine?'
  - - Talk it over
    - 'Ask:

      1. Why did Cronos swallow his children?

      2. Which god or goddess had the hardest job? Which one had the nicest kingdom?

      3. How did the Greeks explain the seasons?

      See the answers below for what a good answer includes.'
  - - Make god cards
    - 'Start a card set. On each card write a god''s Roman name, the Greek name, and what they ruled, with a small drawing: Jupiter (sky), Juno (queen,
      clouds), Neptune (ocean, trident), Pluto (underworld), Ceres (grain and flowers), Vesta (hearth and home fire). You will add more cards next time.'
  - - Remember it
    - 'Say: Jupiter took the sky, Neptune the sea, Pluto the underworld.

      ~ When she made her yearly visits, the flowers that she loved so dearly bloomed for her, the grass grew green, and it was spring.'
  practice: 'Shuffle the cards and play "Who rules this?": you say a place (the sea, the hearth, the land of the dead), your child names the god.'
  tip: 'Cronos swallowing his children can sound scary. Keep it light: it is a very old story, and all the children come back at the end.'
  answers: '1. His mother told him one of his children would take his kingdom, and he wanted to stop that.

    2. Any answer with a reason is fine (Pluto''s gloomy kingdom; Ceres with so much to grow).

    3. Proserpine lives with Pluto part of the year (winter, when flowers die) and comes back to the land of light for part of the year (spring).'
  num: 1
  roman: Intro, part 1
  idx: 14
  unit: 1
- title: 'The Gods of Greece (III–IV): the children of Jupiter'
  mins: 25
  goal: Your child can name the main sons and daughters of Jupiter and what each was the god or goddess of.
  materials:
  - A notebook or paper and colored pencils
  - The god cards from last time, plus blank cards
  book: 'Sections III and IV of the Introduction: Mercury the messenger, Vulcan the blacksmith, Mars, Apollo and Diana, Minerva born from Jupiter''s head,
    Venus and Cupid, Iris, the Graces, the Furies, the Fates, and the gods'' home on Mount Olympus.'
  steps:
  - - Warm up
    - Use last time's cards. Ask your child to name the six gods and what each ruled.
  - - Read the chapter together
    - 'Read pages 15–19 aloud, or let your child read and help with the hard names. Stop at "made their home there," just before the heading "Deucalion
      and the Flood".

      The book uses Roman names: Mercury (Greek Hermes), Vulcan (Hephaestus), Mars (Ares), Diana (Artemis), Minerva (Athene), Venus (Aphrodite), Cupid (Eros).'
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - How was Minerva born?

      - Why was Vulcan lame?

      - What did each of the three Fates do?

      - Where did the gods go to live at the end?'
  - - Talk it over
    - 'Ask:

      1. What do Mercury''s winged sandals tell you about his job?

      2. What do people mean when they say a man "is an Apollo"?

      3. Could Jupiter change what the Fates decided?'
  - - Words we still use
    - Some of these names are still around us. The planets Mercury, Venus, Mars and Jupiter are named after Roman gods. A cereal is food made from grain,
      from Ceres. Ask your child if they can think of other places they have heard these names.
  - - Add to your cards
    - 'Make cards for Mercury, Vulcan, Mars, Apollo, Diana, Minerva and Venus, each with a symbol: winged sandals, hammer, sword, sun and lyre, moon and
      bow, armor or owl (your choice), and so on.

      ~ Not even Jupiter could change the plans of the Fates.'
  practice: 'Play a quick matching game with all the cards: show a symbol, your child names the god.'
  tip: 'The book says Diana was goddess of the moon and Apollo of the sun. Children love the twins idea: sun and moon, each with a silver bow.'
  answers: '1. He was the messenger of the gods and needed to travel fast.

    2. That he is very handsome in face and form.

    3. No. Whatever the Fates said must happen always happened.'
  num: 2
  roman: Intro, part 2
  idx: 20
  unit: 1
- title: Deucalion and the Flood
  mins: 25
  goal: Your child can retell the Greek story of the great flood and explain the riddle of "the bones of your mother."
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  - A few small stones (from the garden or a walk)
  book: The gods feast on Olympus and teach men the useful arts. Jupiter sends a flood; Deucalion and Pyrrha ride it out in an ark, land on Mount Parnassus,
    and hear an oracle. The stones they throw become people. Their son Hellen gives the Greeks their name.
  steps:
  - - Set the scene
    - 'Find Mount Olympus (in the north of Greece) and Mount Parnassus (a little north of the Gulf of Corinth) on a map. Both are real mountains.

      Say: Today we hear the Greek story of how their people began.'
  - - Read the chapter together
    - 'Read pages 20–24 aloud, or let your child read and help with the hard names. The book marks how to say the names: Pro-me''the-us (which means Forethought),
      Deu-ca''li-on and Pyr''rha. The mark comes after the part you say loudest.'
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - What did the gods teach the early Greeks?

      - Who warned Deucalion?

      - Where did the ark come to rest?

      - What happened to the stones they threw?'
  - - Solve the riddle
    - 'Read the oracle again and let your child puzzle over it before you read Deucalion''s answer.

      ~ "Cast behind you the bones of your mother!"

      ~ "Pyrrha, the earth is our mother."

      Say: An oracle was a message the Greeks believed came from the gods. Oracles were often puzzles.'
  - - Talk it over
    - 'Ask:

      1. What is an oracle?

      2. Why were Deucalion and Pyrrha afraid when they came down the mountain?

      3. Where does the name "Hellas" come from?

      If your child notices this is like other flood stories they know, talk about it. Many peoples told flood stories.'
  - - Remember it
    - 'Greeks called themselves Hellenes and their country Hellas.

      ~ Their country, which, as you have learned, we call Greece, they called Hel''las.'
  - - Something extra
    - 'Lay out a few stones and tell the story with them: throw them gently "behind you" and say what they turned into. Or draw the ark on top of Mount
      Parnassus.'
  practice: 'Keep a "Greek words" page. Add: oracle, Hellas, Hellenes.'
  answers: '1. Something told by the gods to men; advice about things that were going to happen.

    2. They were the only people left, and the land was empty and lonely.

    3. From Hellen, one of the sons of Deucalion.'
  num: 3
  roman: Ch. I
  idx: 25
  unit: 1
- title: Cadmus and the Dragon's Teeth
  mins: 25
  goal: Your child can retell how Cadmus founded Thebes, and say what the Greeks believed he taught them.
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  book: Europa is carried off by a white bull to the land later called Europe. Her brother Cadmus follows a cow, kills a dragon, sows its teeth, and with
    the five warriors left builds Thebes. He teaches his people to read and write.
  steps:
  - - Set the scene
    - Find Phoenicia (the coast of today's Lebanon, at the east end of the Mediterranean Sea), then Thebes in Greece, north of Athens. Trace Europa's ride
      west over the sea to Europe.
  - - Read the chapter together
    - Read pages 26–30 aloud, or let your child read and help with the hard names. Watch for two things the voice in the air tells Cadmus to do.
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - What happened to Europa?

      - What did the oracle tell Cadmus?

      - How did the dragon''s teeth turn into men?

      - What did Cadmus teach the people of Thebes?'
  - - Talk it over
    - 'Ask:

      1. Why do you think Cadmus shouted "Building is better than killing"?

      2. How was the wall of Thebes built?

      3. Why did Cadmus want to teach his people to read?'
  - - A true thread in the story
    - 'Say: The Greeks said Cadmus brought letters from Phoenicia. That part has some truth in it: the Greek alphabet really did grow out of the letters
      the Phoenicians used. Our own A-B-C came, much later, from the Greek letters.

      If you like, look up the Greek letters alpha and beta together and notice how the word "alphabet" is made.'
  - - Remember it
    - '~ "Follow the cow; and build a city where she lies down."

      ~ "Building is better than killing."'
  practice: Your child copies "Building is better than killing" in their best handwriting and draws Cadmus's city.
  answers: '1. He wanted the fighting to stop so they could make something together.

    2. Amphion played such sweet music on his lyre that the stones danced into their places.

    3. He had been taught as a boy in Phoenicia, and now that there was peace he wanted his people to learn too; the book calls his school the first in
    Europe where people were taught to read.'
  num: 4
  roman: Ch. II
  idx: 31
  unit: 1
- title: Perseus
  mins: 30
  goal: Your child can retell how Perseus got the Gorgon's head and saved Andromeda, naming the magic gifts that helped him.
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  - A shiny spoon or a small mirror
  book: Danae and baby Perseus are cast adrift in a chest. Grown up, Perseus promises Polydectes the head of Medusa. With help from Mercury and Minerva,
    the Gray Sisters and the Hesperides, he wins it, saves Andromeda from a sea monster, and in the end fulfills the old oracle by accident.
  steps:
  - - Set the scene
    - Find Argos in southern Greece and the island of Seriphos in the Aegean Sea. The book says Perseus flew along the coast of Africa, so find that too.
  - - Read the chapter together
    - Read pages 31–40 aloud, or let your child read and help with the hard names. This is a long story in three parts. You can stop after part I (Medusa)
      and take a short break.
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - Why did Polydectes ask for the Gorgon''s head?

      - How did Perseus make the Gray Sisters tell him the way?

      - What three treasures did the Hesperides lend him, and what was each for?

      - How did the old oracle come true in the end?'
  - - Try the shield trick
    - 'Hand your child a shiny spoon or mirror. Have them look at something behind them using only the reflection.

      Say: That is how Perseus looked at Medusa without being turned to stone.'
  - - Talk it over
    - 'Ask:

      1. Who helped Perseus? Could he have done it alone?

      2. Why did Andromeda''s mother get her into trouble?

      3. What do the Greeks mean by "What had been fated came to pass"?'
  - - Remember it
    - '~ "See! I have brought that which you desired."

      Perseus''s gifts: winged sandals, the magic wallet, the cap of darkness, Minerva''s shield and Mercury''s sword of light.'
  - - Something extra
    - The book says Perseus, Andromeda, Cepheus and Cassiopeia can be seen as stars. On a clear night, look for Cassiopeia, a bright "W" (or "M") of stars
      in the northern sky. A free star map app can help you find it.
  practice: Draw Perseus with all five of his magic gifts and label each one.
  answers: '1. Mercury and Minerva, the Gray Sisters (unwillingly) and the Hesperides. He could not have done it alone.

    2. She boasted that Andromeda was more beautiful than the nymphs in Neptune''s palace, which made Neptune angry.

    3. That what the oracle foretold happened even though people tried to stop it: Perseus killed his grandfather by accident with a quoit.'
  num: 5
  roman: Ch. III
  idx: 36
  unit: 1
- title: Hercules and His Labors (labors 1–9)
  mins: 25
  goal: Your child can tell who made Hercules work and describe several of his first nine labors.
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  - A large sheet of paper for a "Twelve Labors" chart
  book: 'Hercules strangles two serpents in his cradle and becomes the slave of his cousin Eurystheus. Sections I and II tell the first nine labors: the
    Nemean lion, the hydra, the golden-horned stag, the boar, the Augean stables, the Stymphalian birds, the bull of Crete, the horses of Diomedes and the
    Amazon queen''s girdle.'
  steps:
  - - Set the scene
    - Find Thebes (where Hercules was born) and Mycenae in southern Greece, where Eurystheus was king. Then find Crete, Thrace (north of Greece) and the
      Black Sea; the labors take Hercules to all of them.
  - - Read the chapter together
    - Read pages 41–45 aloud, or let your child read and help with the hard names. Stop where Hercules carries the girdle to Eurystheus, before section
      III. The book gives his Greek name, He'ra-kles, too.
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - What happened when Hercules was a baby?

      - Why was he a slave to Eurystheus?

      - How did he clean the Augean stables in one day?

      - Why did the Amazon queen''s girdle end in a battle?'
  - - Start the labors chart
    - 'Draw twelve boxes, numbered. Fill in the first nine with a word and a quick sketch: lion, hydra, stag, boar, stables, birds, bull, horses, girdle.
      Leave three empty boxes for next time.'
  - - Talk it over
    - 'Ask:

      1. Which labor needed cleverness more than strength?

      2. Who helped Hercules with the hydra?

      3. Why do you think Eurystheus kept giving him harder tasks?'
  - - Remember it
    - '~ "Clean the Augean stables."

      Say: Today, a very hard job is called a "Herculean" task.'
  practice: Your child tells one labor to someone else in the family, acting it out.
  answers: '1. The Augean stables (turning two rivers), and the horses of Diomedes.

    2. A friend who burned each neck with a firebrand so new heads could not grow.

    3. He hoped to find a task that would prove too much for the hero.'
  num: 6
  roman: Ch. IV, part 1
  idx: 46
  unit: 2
- title: Hercules and His Labors (labors 10–12 and the end)
  mins: 25
  goal: Your child can finish the list of the twelve labors and retell how the Greeks said Hercules's life ended.
  materials:
  - A notebook or paper and colored pencils
  - The labors chart from last time
  book: 'Sections III and IV: the oxen of Geryon, the golden apples (Atlas holds up the sky), Cerberus; then Alcestis, Hercules as Omphale''s slave, Nessus
    the centaur, the poisoned robe, and Hercules taken up to the gods.'
  steps:
  - - Warm up
    - Point to the first nine boxes on the chart and let your child name each labor.
  - - Read the chapter together
    - Read pages 45–51 aloud, or let your child read and help with the hard names. Start at section III, "Bring me the oxen of Geryon." The last part, section
      IV, has some sad moments; read it calmly.
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - How did Hercules reach Geryon''s island?

      - What bargain did he make with Atlas?

      - How did he bring Cerberus up from the underworld?

      - How did the centaur''s blood harm Hercules?'
  - - Finish the chart
    - 'Fill in boxes 10 to 12: oxen, apples, Cerberus. Now say all twelve in order, looking at the pictures, then try it with the chart turned over.'
  - - Talk it over
    - 'Ask:

      1. Who was Atlas, and what was his job?

      2. Hercules did good things and some bad things. Can you name one of each?

      3. How did the story end for Hercules?'
  - - Remember it
    - '~ "I will get you some of the apples," said Atlas in answer to Hercules, "if you will hold up the sky for me while I am getting them."

      Say: A book of maps is called an atlas, after this giant.'
  practice: Hang the finished chart on the wall. Each day this week, your child names the twelve labors from memory.
  tip: Section IV mentions that Hercules once became insane and killed a friend, and that his wife's mistake led to his death. Preview it; with a younger
    child you can tell those parts briefly in your own words.
  answers: '1. A giant in Africa whose duty was to hold up the sky, with the sun, moon and stars.

    2. Good: he brought Alcestis back to her husband. Bad: he tried to carry off Apollo''s tripod at Delphi, or killed a friend when he was insane.

    3. He lay on a funeral pyre, his spirit was carried to the skies, and Jupiter made him one of the gods.'
  num: 7
  roman: Ch. IV, part 2
  idx: 50
  unit: 2
- title: Jason and the Golden Fleece
  mins: 30
  goal: Your child can retell the voyage of the Argo and the three tasks Jason had to do to win the golden fleece.
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  book: Jason, raised by Chiron the centaur, loses a sandal helping an old woman (really Juno) and comes to Iolcus. Pelias sends him for the golden fleece.
    With the Argonauts, Orpheus's music and Medea's magic, he yokes the fire-breathing bulls, defeats the dragon-tooth warriors and takes the fleece.
  steps:
  - - Set the scene
    - Find Iolcus on the east coast of Greece (near today's city of Volos), then the narrow strait into the Black Sea, then Colchis at the far east end
      of the Black Sea. That was a very long trip in a rowing ship.
  - - Read the chapter together
    - 'Read pages 52–61 aloud, or let your child read and help with the hard names. Notice that this story connects to two earlier ones: Hercules sails
      on the Argo, and Jason must sow the teeth of the dragon that Cadmus killed.'
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - Why was Pelias afraid of a man with one sandal?

      - How did Jason lose his sandal?

      - How did the Argo get into the water?

      - What three things did King Aeetes make Jason do?

      - How did the Argonauts get past the Sirens?'
  - - Talk it over
    - 'Ask:

      1. Why did Juno help Jason all his life?

      2. Where does the name "Hellespont" come from? What is it called on our maps?

      3. Could Jason have won the fleece without Medea?'
  - - Remember it
    - '~ "Beware of the man who wears but one sandal."

      ~ "Build a fifty-oared ship. Take as companions the greatest heroes of Greece."'
  - - Something extra
    - 'Draw the Argo with its fifty oars, or make a crew list: Jason, Orpheus, Hercules, Castor and Pollux, and Lynceus, with what each was good at.'
  practice: 'Ask: what does it mean to be kind to a stranger? Jason''s kindness to an old woman changed his whole life.'
  tip: The last paragraph mentions murder and revenge in one or two lines. You can stop at "What became of it afterward nobody knows" if you prefer.
  answers: '1. Because Jason carried her, as an old woman, across a swollen stream; she wanted to find out if there was real kindness among men, and she
    never forgot it.

    2. From Helle, who fell from the ram''s back and drowned there; the name means the Sea of Helle. On our maps it is the Dardanelles.

    3. Probably not: her ointment saved him from the bulls'' fire and her potion put the dragon to sleep.'
  num: 8
  roman: Ch. V
  idx: 57
  unit: 2
- title: Theseus
  mins: 30
  goal: Your child can retell how Athens got its name and how Theseus killed the Minotaur, and explain how the Aegean Sea got its name.
  materials:
  - A map or globe (a free online map works well)
  - A notebook or paper and colored pencils
  - A ball of yarn or string
  book: Neptune and Minerva compete to be guardian of a new city; Minerva's olive tree wins and the city is named Athens. Theseus lifts the stone, defeats
    robbers on the road, sails to Crete, and with Ariadne's thread kills the Minotaur in the Labyrinth. He forgets the white sail, and his father Aegeus
    falls into the sea.
  steps:
  - - Set the scene
    - Find Athens, then the island of Crete to the south, and Naxos in between. The sea between Greece and Turkey is the Aegean Sea; today's story tells
      how it got its name.
  - - Read the chapter together
    - 'Read pages 62–70 aloud, or let your child read and help with the hard names. There are three parts: the gift for Athens, Theseus''s road to Athens,
      and the Minotaur.'
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - What gifts did Neptune and Minerva give the city? Which won, and why?

      - What did Theseus find under the stone?

      - What did Procrustes do to travelers?

      - How did Ariadne help Theseus?

      - Why did Aegeus fall into the sea?'
  - - Try the thread
    - Make a little "labyrinth" with chairs or through a few rooms. Your child holds the end of the yarn, you unwind it as they go in, and they follow it
      back out.
  - - Talk it over
    - 'Ask:

      1. Why did Jupiter decide an olive tree was more useful than a war horse?

      2. Why did Theseus ask to go as one of the victims?

      3. How did the Athenians treat Theseus at the end? Were they fair to him?'
  - - Remember it
    - '~ "If you are a man, lift that stone."

