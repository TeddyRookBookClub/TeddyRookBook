- title: Demosthenes
  mins: 30
  goal: Your child can tell how Demosthenes overcame his weak voice to become the greatest speaker of Athens, and why he opposed Philip.
  materials:
  - A notebook or paper and colored pencils
  - Your timeline (a long strip of paper on the wall, or a notebook page)
  book: A delicate boy robbed by his guardians, Demosthenes hears a great speech in court and decides to become a speaker. His first speech fails; with
    an actor's help and hard practice he becomes the greatest orator of Athens. He warns against Philip in the "Philippics," wins the crown, tells the fable
    of the wolf and the sheep, and dies rather than be captured.
  steps:
  - - Hook
    - 'Ask: Is there something that was hard for you at first that you can do well now? How did you get better?'
  - - Read the chapter together
    - 'Read pages 227–236 aloud, or let your child read and help with the hard names. '
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - What made Demosthenes decide to become a speaker?

      - What went wrong in his first speech?

      - Name three things he did to improve.

      - What were the Philippics?

      - What was the story of the wolf and the sheep about?'
  - - Talk it over
    - 'Ask:

      1. Why did Demosthenes say Philip was really weak?

      2. In the speech "On the Crown," he said Athens should have fought even if it knew it would lose. Do you agree?

      3. Who were the "watchdogs" in the wolf story?'
  - - Practice like Demosthenes
    - 'Your child picks a short passage, like the wolf fable on page 233, and reads it aloud three times: once quietly, once in a clear, strong voice, and
      once standing tall with a gesture. Listen and praise the improvement.

      Safety: don''t try the pebbles in the mouth; they are a choking hazard.'
  - - Remember it
    - '~ "You can learn to speak just as well as I do," said the actor, "if you are willing to work patiently. Do not be discouraged, but conquer your difficulties."

      ~ "I will," said Demosthenes. And he did.

      Say: Today a bitter speech against someone is called a "philippic."'
  practice: Your child memorizes and recites the wolf fable for the family by the end of the week.
  tip: The last page tells how Demosthenes took poison from his pen rather than be caught. Preview it; with a younger child you may say, "He died in the
    temple rather than be taken prisoner."
  answers: '1. Because he was selfish and unjust; he was strong only because he was energetic.

    2. Any reasoned answer; Demosthenes meant it is our duty to fight for what is right even if we cannot win.

    3. Demosthenes and the other orators; the Athenians kept them safely at home.'
