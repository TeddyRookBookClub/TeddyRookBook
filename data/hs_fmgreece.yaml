book:
  id: famousmengreece00polagoog
  title: Famous Men of Greece
  year: 1904
  key: fm-greece
  short: Famous Men of Greece
  eyebrow: History · Greece · 1904
  hero: John H. Haaren and A. B. Poland's short life stories of the famous men of Greece, from the gods of Olympus and the Trojan War to Alexander and the
    Roman conquest, for children about 8 to 11. 37 guides cover every chapter, with the right page of the book beside each one.
  how:
  - <b>One story a session.</b> About 25 to 35 minutes, two or three times a week, covers the book in a school year. Read aloud together, or let a strong
    reader read and then tell it back to you.
  - <b>Narration is the heart of it.</b> After each reading, your child tells the story back in their own words. Listen without correcting; the prompts
    in each guide help if they get stuck.
  - <b>Keep a map open.</b> Every guide starts by finding the places on a map or globe. A free online map works well, and the same few places (Athens, Sparta,
    Thebes, Troy, Persia) come up again and again.
  - <b>Build a timeline.</b> Add a date or a name after each chapter on a long strip of paper on the wall. By the end your child will see the whole story
    of Greece at a glance.
  - <b>Myths first, then history.</b> The first chapters are Greek myths, told as the Greeks told them; the guides say so gently. Later chapters are history,
    with a few legends mixed in.
  - <b>Preview the hard parts.</b> Like all ancient history, the book has battles, cruelty and some deaths told plainly. Where a passage may upset a younger
    child, the guide's tip tells you which page, so you can read ahead.
  unitword: Unit
  lessonword: ''
  numnote: Each guide covers one chapter of the book, shown beside the title; the Introduction and the long chapters on Hercules, Ulysses and Alexander
    are split into two or three guides.
