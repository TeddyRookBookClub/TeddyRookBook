  - A notebook or paper and colored pencils
  - Play dough or clay rolled flat on a tray, and a pencil or stick
  book: About a hundred years after Alexander, young Cleomenes is called home by a note on a wax tablet to marry Agiatis, widow of good King Agis, whom
    Cleomenes's father had put to death. Agiatis tells him Agis's hopes. As king he divides the land again as Lycurgus had, and Sparta grows strong, until
