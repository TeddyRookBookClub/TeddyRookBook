  steps:
  - - Warm up
    - 'Ask: What were the laws of Lycurgus? (Land shared out fairly, simple food at public tables, hard training.) Today''s king wanted them back.'
  - - Read the chapter together
    - 'Read pages 254–260 aloud, or let your child read and help with the hard names. '
  - - Narration
    - 'Close the book. Ask your child to tell the story back in their own words, from the beginning. Don''t correct as they go; just listen. If they get
      stuck, use a prompt:

      - How did Cleomenes find out he was to be married?

      - Why did he think Agiatis would never love him?

      - What had King Agis wanted to do for Sparta?

      - What changes did Cleomenes make as king?

      - What ended his hopes?'
  - - Make a wax tablet
    - 'Greeks wrote quick notes on tablets coated with wax, using a pointed stick. Flatten play dough on a tray and write the king''s message with a pencil
