book:
  id: mcguffeysfirstec00mcgu2
  title: McGuffey's First Eclectic Reader, Revised Edition
  year: 1879 (revised edition)
  key: mcg-first
  short: First Reader
  eyebrow: McGuffey's Readers · First Reader · revised edition
  hero: 63 short reading lessons, from "The dog ran." to the last lesson of the book, for children about 6 and 7 who are just starting to read. Every lesson has a guide you can follow step by step, with the right page of the book beside it.
  how:
  - <b>A little, often.</b> About 15 to 20 minutes a day. Early lessons may take one day each; later, longer lessons can be split over two days.
  - <b>Words first.</b> Each lesson begins with a list of new words. Read them together before the story, and the story will go smoothly.
  - <b>Reread yesterday.</b> Start each day by rereading a few lines of the last lesson. Easy rereading builds speed and confidence.
  - <b>Slate work.</b> Some lessons have sentences printed in script (handwriting) to copy. Have a slate, small whiteboard or lined paper and a pencil ready every day.
  - <b>Talk and tell back.</b> Ask a few questions about the story and the picture, then let your child tell the story in their own words. That is how McGuffey children learned to understand what they read.
  - <b>Reviews are a gift.</b> The review lessons use only words your child has met. If they go easily, celebrate. If not, slow down and reread earlier lessons.
  unitword: Part
