      Help with "What happened first? Then what?" if your child gets stuck.'
  practice: Reread this lesson aloud on the next day before starting a new one. Read the new words from the list in any order until they come quickly.
  tip: Point out the question mark. Show your child how a question sounds different from a telling sentence.
