      Then let your child read the page once more, as smoothly as they can.'
  practice: Reread this lesson aloud on the next day before starting a new one. Read the new words from the list in any order until they come quickly.
  tip: Script letters look different from print. Read the script lines to your child first, and point to each word as you go.
