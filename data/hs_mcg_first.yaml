lessons:
- num: 1
  roman: I
  idx: 10
  unit: 1
  title: The dog ran
  mins: 15
  goal: Your child reads the words dog, the and ran, and reads "The dog ran." alone.
  materials:
  - The book, open to this lesson
  - A slate, small whiteboard or lined paper and a pencil
  book: 'The first lesson: three new words (dog, the, ran) with some letters for their sounds, a picture of a dog, and two tiny sentences.'
  steps:
  - - Get ready
    - 'Sit side by side with the book open to Lesson I. Show your child the picture and the words at the top of the page.

      Say: Today you will read your very first story. It is only three words long!'
  - - New words
    - 'Point to the new words at the top of the page:

      ~ dog   the   ran

      Say each word and have your child say it after you. Sound out the short ones together, then point to words in any order and let your child read them.

      The letters printed beside the words show their sounds. Point to each one and say its sound together.'
  - - Read the lesson aloud
    - 'Look at the picture together first, and ask what your child sees. Then your child reads the lesson aloud, one sentence at a time. Help with any word by pointing to it in the word list.

      Here are two lines from it:

      ~ The dog.

      ~ The dog ran.

      Read it a second time, more smoothly.'
  - - Talk about it
    - 'Say: What is the dog doing?

      Say: Where do you think the dog is running?

      Let your child look back at the page to find answers.'
  - - Copywork
    - 'Write this line from the lesson for your child to copy, or let them copy it straight from the book:

      ~ The dog ran.

      Check for a capital letter at the start and the mark at the end.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it on the slate: dog, ran, the.

      Check together and fix any mistakes right away.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me the story in your own words.

      Help with "What happened first? Then what?" if your child gets stuck.'
  practice: Reread this page each day until it is easy. Write "dog" and "ran" on cards and mix them up.
  tip: Keep this first lesson short and happy. If your child reads "The dog ran." with a finger under each word, that is a big success.
