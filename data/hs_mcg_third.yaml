lessons:
- num: 1
  roman: I
  idx: 16
  unit: 1
  title: The Shepherd Boy
  mins: 20
  goal: Your child reads a story-poem smoothly, notices that Roy's farm is pretend, and tells what happened to it.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'The first lesson: a list of words, then a poem about little Roy, whose cows and sheep and pasture are really make-believe, and what his brother Walter did to them.'
  steps:
  - - Warm up
    - 'Ask your child about a pretend game they love: a shop, a house, a farm made of blocks or toys.

      Say: Today''s poem is about a boy who had a whole farm, but it was all pretend.'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ either   trickle   fancied   murmur   reflected   glossy   entered   shepherd   chestnuts   command

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Talk about a few of them in your own words: a shepherd takes care of sheep; to trickle is to run in a thin little stream; fancied means imagined.'
  - - Read it aloud
    - 'This is the first lesson in a new book, so read the first stanza yourself while your child follows, then let your child read the rest, one stanza at a time.

      Here are two of its lines:

      ~ Little Roy led his sheep down to pasture,

      ~ And his cows, by the side of the brook;

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: What were Roy''s cows and sheep really made of? Look back in the poem to find out.

      Say: What happened to Roy''s farm while he was asleep?

      Say: How do you think Roy felt when he woke up?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me about Roy''s farm, and what happened to it.

      Help with "What was the pasture? What were the cows?" if your child gets stuck.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ Little Roy led his sheep down to pasture,

      ~ And his cows, by the side of the brook;

      Show how each line of a poem starts with a capital letter.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: shepherd, either, murmur, glossy, command.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the poem on the next day or two; try to say one stanza by heart.
  tip: The Third Reader starts gently. If a word list looks long, read it together twice and don't worry about every meaning on the first day.
- num: 2
  roman: II
  idx: 18
  unit: 1
  title: Johnny's First Snow-Storm
  mins: 20
  goal: Your child reads a short story aloud with expression and tells what Johnny learned about snow.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A list of words and a story about Johnny Reed, who came from a warm country and saw snow for the first time when he was six.
  steps:
  - - Warm up
    - 'Say: Do you remember the first time you saw snow, or rain on a window? What did you think?

      If you live where it never snows, talk about what snow might feel like.'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ country   groves   lisping   sugar   freezes

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain in your own words: a grove is a small group of trees; lisping means speaking like a very little child.'
  - - Read it aloud
    - 'Your child reads. Model Johnny''s excited speeches yourself first, with real delight in your voice, then let your child try them.

      Here is a line from it:

      ~ Johnny Reed was a little boy who never had seen a snow-storm till he was six years old.

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: Where did Johnny live before, and why had he never seen snow?

      Say: What did Johnny think the snow was at first?

      Say: How did his mother help him look closely at a snowflake?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Pretend you are Johnny. Tell me about the day you first saw snow.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ Johnny Reed was a little boy who never had seen a snow-storm till he was six years old.

      Point out the capital letters for the name Johnny Reed.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: country, sugar, freezes, snow.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
  tip: If it is winter, catch a snowflake on a dark cloth and look at it with a magnifying glass, as Johnny's mother did.
- num: 3
  roman: III
  idx: 21
  unit: 1
  title: Let It Rain
  mins: 20
  goal: Your child reads a conversation in two voices and explains why Rose changed her mind about the rain.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A list of words and a talk between Rose and her father on a rainy day. Each speech is marked with the speaker's name.
  steps:
  - - Warm up
    - 'Look out the window together.

      Say: What do you like to do on a rainy day? Is rain good or bad?'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ daughter   quench   wreath   water   thirsty

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain in your own words: to quench thirst is to stop being thirsty by drinking.'
  - - Read it aloud
    - 'This lesson is a conversation. You read the father''s part and your child reads Rose''s part, then swap.

      Here is a line from it:

      ~ See how it rains! Oh dear, dear, dear! how dull it is!

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: Why was Rose unhappy at the start?

      Say: What questions did her father ask her about the animals and the plants?

      Say: How did Rose feel about the rain at the end, and why?

      Then talk about the lesson of the reading:

      Rose learns that the rain she grumbled about does a great deal of good.

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me why Rose''s father was glad of the rain. Give me two good things the rain does.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ Well, are you sorry when you see the horses, cows, or sheep drinking at the brook to quench their thirst?

      Notice the commas between horses, cows and sheep, and the question mark at the end.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: daughter, water, thirsty, rain.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
  tip: Reading in parts is a good way to practice expression. Let your child choose which part to read the second time.
- num: 4
  roman: IV
  idx: 23
  unit: 1
  title: Castle-Building
  mins: 20
  goal: Your child reads the first half of a two-part story and talks about losing your temper.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'A long list of words, then the first part of a story: Herbert''s block castle falls when the cat rubs against it, and he loses his temper.'
  steps:
  - - Warm up
    - 'Say: Have you ever built something and had it knocked down? What did you do?'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ anger   castle   foundation   rattling   tower   dismay   sofa   interested   passion   pile   mimic   nodded   exclaimed   already   spilled

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain a few in your own words: dismay is a sudden upset feeling; mimic here means pretend or make-believe; a passion is a burst of angry feeling.'
  - - Read it aloud
    - 'Your child reads. Model Herbert''s cry at the start, then papa''s calm voice.

      Here is a line from it:

      ~ "O pussy!" cried Herbert, in a voice of anger and dismay, as the block-house he was building fell in sudden ruin.

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: What made Herbert''s castle fall?

      Say: What did Herbert do when he was angry?

      Say: What did papa think was a better way?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what happened to Herbert''s castle, and what he did next.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ "There is a better way than this, my boy," said papa.

      Show the quotation marks around papa''s words, and the comma before the closing marks.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: anger, castle, tower, sofa, spilled.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
  tip: This story ends in the next lesson. Stop here and let your child guess what papa's better way will be.
- num: 5
  roman: V
  idx: 25
  unit: 1
  title: Castle-Building (Concluded)
  mins: 20
  goal: Your child finishes the story and explains what "crying over spilled milk" means.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'A list of words and the end of the story: Herbert builds again, and the family talks about crying over things that can''t be helped.'
  steps:
  - - Warm up
    - Ask your child to tell what happened in the first part of the story yesterday.
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ string   paper   eagerly   dashed   case   crash   dishes   retorted   sentence   tray

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain in your own words: eagerly means wanting very much to do something; retorted means answered back quickly.'
  - - Read it aloud
    - 'Your child reads. Help with the talk between the children and papa by reading one voice yourself.

      Here are two lines from it:

      ~ Soon, Herbert was as much interested in castle-building as he had been a little while before.

      ~ He began to sing over his work.

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: How was Herbert different in this part of the story?

      Say: What does "crying over spilled milk" mean?

      Say: What did papa say to do when your castles get knocked down?

      Then talk about the lesson of the reading:

      Papa''s lesson: "If your castles get knocked down, build them up again."

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me the whole story of Herbert and his castle, from the cat to the end.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ If your castles get knocked down, build them up again.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: paper, string, dishes, crash, tray.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
  tip: 'When something goes wrong this week, remind each other gently: "Build it up again."'
- num: 6
  roman: VI
  idx: 28
  unit: 1
  title: Lend a Hand
  mins: 20
  goal: Your child reads a lesson printed in handwriting (script) and copies it neatly.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A list of words, then a short lesson printed in script (handwriting) instead of type. Children read it and copied it.
  steps:
  - - Warm up
    - 'Show your child the page.

      Say: This lesson is printed in script, the joined-up handwriting children used to learn. Let''s see if we can read it.'
  - - Words and meanings
    - 'Point to the words at the top of the lesson:

      ~ tear   daily   honor   tongues   suspicion   envy   forced   prompt   malicious   to-morrow

      Read them together. Talk about a few: envy is wanting what someone else has; malicious means wanting to hurt; prompt means quick and on time.'
  - - Read the script
    - Read the script lesson together slowly. When your child is stuck on a letter shape, compare it with the same letter in print. Then your child reads it alone, a second time, more smoothly.
  - - Talk about it
    - 'Say: What is this lesson telling us?

      Say: Which line do you like best? Why?'
  - - Copywork
    - Your child copies the lesson, or its first few lines, in their best handwriting, looking closely at the script letters as a model. Check capitals and end marks together.
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: tear, daily, honor, prompt, envy.

      Check together and fix any mistakes right away.'
  practice: Reread the script page tomorrow and copy one more line in your best hand.
  tip: The script page has no machine-readable text in the scans we used, so read it from the book page itself.
- num: 7
  roman: VII
  idx: 30
  unit: 1
  title: The Truant
  mins: 25
  goal: Your child reads a longer story and explains what a truant is and what James learned.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A list of words and a story about James Brown, who skipped school, deceived his parents, and got into danger.
  steps:
  - - Warm up
    - 'Say: The title of today''s lesson is "The Truant." A truant is a child who stays away from school without leave. What might go wrong?'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ falsely   guilty   attend   truant   conduct   therefore   haste   regular   struggled   ignorant

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain in your own words: guilty means you did the wrong thing; ignorant means not knowing.'
  - - Read it aloud
    - 'Your child reads. This is a longer story, so you may take turns by paragraph.

      Here are two lines from it:

      ~ James Brown was ten years old when his parents sent him to school.

      ~ But, instead of going to school, he was in the habit of playing truant.

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: Where did James go instead of school, and who did he meet there?

      Say: What danger did James get into?

      Say: How did James change at the end of the story?

      Then talk about the lesson of the reading:

      James learns to attend to his books and obey his parents.

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me the story of James Brown in your own words.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ James Brown was ten years old when his parents sent him to school.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: guilty, attend, truant, haste, regular.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
- num: 8
  roman: VIII
  idx: 32
  unit: 1
  title: The White Kitten
  mins: 20
  goal: Your child reads a poem with rhythm and explains its lesson about being careful where you play.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A short list of words and a poem about a little white kitten who goes out to play and comes home with streaks on her white coat.
  steps:
  - - Warm up
    - 'Say: If a white kitten went out to play in a coal shed or a muddy yard, what would she look like when she came home?'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ stroke   beggar   streaks   needful   counsel

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain in your own words: counsel means advice; needful means needed.'
  - - Read it aloud
    - 'Read the first stanza aloud with a gentle, swinging rhythm. Then your child reads the poem.

      Here are two of its lines:

      ~ My little white kitten''s asleep on my knee;

      ~ As white as the snow or the lilies is she;

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: What did the kitten look like when she came home?

      Say: What is the poem really teaching children, not just kittens?

      Then talk about the lesson of the reading:

      The poem says children, like kittens, should be careful in choosing their places to play.

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what happened to the white kitten, and what the poem teaches.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ My little white kitten''s asleep on my knee;

      ~ As white as the snow or the lilies is she;

      Notice the apostrophe in kitten''s. It is short for kitten is.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: stroke, streaks, kitten, white.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the poem on the next day or two; try to say one stanza by heart.
- num: 9
  roman: IX
  idx: 34
  unit: 1
  title: The Beaver
  mins: 25
  goal: Your child reads a lesson of facts and tells three things about how beavers live and build.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: 'A long list of words and a lesson about the beaver: its size and fur, its houses and dams, and a man who would not harm young beavers at play.'
  steps:
  - - Warm up
    - 'Say: What do you know about beavers? What do they build?

      If you can, look at a picture of a beaver and a beaver dam.'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ prefer   trapper   forward   material   disturbing   dumb   chiefly   gnawing   American   cautiously   height   obtain   curious   inhuman   including   constructed   purpose   tighter   reminded   frequently

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain a few: chiefly means mostly; gnawing is biting again and again; constructed means built.'
  - - Read it aloud
    - 'Your child reads. Facts lessons have long words; read hard sentences first yourself, then let your child reread them.

      Here is a line from it:

      ~ The beaver is found chiefly in North America.

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: How long is a beaver, and what is its tail like?

      Say: Where do beavers build their huts, and what do they use?

      Say: Why do you think the man left the young beavers alone?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me three things you learned about beavers.

      An older child can write the three facts in sentences.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ The beaver is found chiefly in North America.

      North America is a place name, so both words start with capitals.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: beaver, trapper, height, purpose, curious.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
  tip: Find North America on a map or globe.
- num: 10
  roman: X
  idx: 37
  unit: 1
  title: The Young Teacher
  mins: 25
  goal: Your child reads a story aloud and explains how Charles used his free hour.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A list of words and a story about Charles Rose, who used his free hour each day to teach a poor fisherman's boy.
  steps:
  - - Warm up
    - 'Say: If you had one free hour every day to do anything you liked, what would you do?'
  - - Words and meanings
    - 'Point to the list of words at the top of the lesson:

      ~ sign   chalk   marks   parcels   drawing   venture   inquire   confused   ruling   pictures

      Read them together a few at a time. Clap the syllables of the long ones. The book prints these words without meanings.

      Explain in your own words: to inquire is to ask; to venture is to dare to do something.'
  - - Read it aloud
    - 'Your child reads. Take turns by paragraph if the story feels long.

      Here are two lines from it:

      ~ Charles Rose lived in the country with his father, who taught him to read and to write.

      ~ There was a river near by.

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: What did Charles''s father allow him to do after morning lessons?

      Say: What did Charles do with his free hour?

      Say: How did his father feel when he found out?

      Then talk about the lesson of the reading:

      Charles used his free time to help someone else learn.

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me how Charles became a young teacher.'
  - - Copywork
    - 'Your child copies this from the book in their best handwriting:

      ~ Charles Rose lived in the country with his father, who taught him to read and to write.

      Check capitals and marks together.'
  - - Spelling
    - 'Say each word, use it in a sentence, and have your child spell it aloud, then write it: chalk, drawing, pictures, inquire, sign.

      Check together and fix any mistakes right away. Keep missed words for tomorrow''s warm-up.'
  practice: Reread the lesson aloud tomorrow before starting the next one, and review any missed spelling words.
  tip: 'Let your child be the teacher for five minutes today: teach a younger child, or you, a letter or a word.'
- num: 11
  roman: XI
  idx: 41
  unit: 2
  title: The Blacksmith
  mins: 20
  goal: Your child reads a lively work poem with a strong beat and talks about honest work.
  materials:
  - The book, open to this lesson
  - A notebook or lined paper and a pencil
  book: A poem about blacksmiths who hammer at the forge from morning until night. There is no word list for this lesson.
  steps:
  - - Warm up
    - 'Say: A blacksmith heats iron in a fire until it glows, then hammers it into shape. What things might a blacksmith make?'
  - - Words and meanings
    - There is no word list today. Before reading, talk about forge (the blacksmith's fire), anvil and soot.
  - - Read it aloud
    - 'Read the first stanza yourself, tapping the beat on the table like a hammer. Then your child reads with the same beat.

      Here are two of its lines:

      ~ Clink, clink, clinkerty clink!

      ~ We begin to hammer at morning''s blink,

      Then let your child reread a favorite part, more smoothly.'
  - - Talk about it
    - 'Say: How long do the blacksmiths work each day?

      Say: Their faces are black with soot. What does the poem say about their hearts?

