book:
  id: mcguffeyseclecti03mcgu
  title: McGuffey's Third Eclectic Reader, Revised Edition
  year: 1879 (revised edition)
  key: mcg-third
  short: Third Reader
  eyebrow: McGuffey's Readers · Third Reader · revised edition
  hero: 79 reading lessons of stories, fables, poems and plain facts, for children about 8 to 10 who read on their own and are ready for longer pieces. Every lesson has a guide you can follow step by step, with the right page of the book beside it.
  how:
  - <b>One lesson a day.</b> About 20 to 25 minutes, four or five days a week. Long lessons can be split over two days; that covers the book in about a school year.
  - <b>Words first.</b> In the first half of the book, each lesson opens with a list of words but no meanings, so talk the meanings over yourself. From Lesson XL on, the book prints short definitions at the end of each lesson. Read a few before the story.
  - <b>Your child reads, you model.</b> Your child does most of the reading aloud. When a passage is hard or full of feeling, read it first yourself, then let your child read it again.
  - <b>Talk, then tell it back.</b> Ask a few questions, then let your child tell the whole lesson in their own words. In the later parts, an older child can write two or three sentences instead.
  - <b>A little writing every day.</b> Copy a sentence or two lines of poetry from the lesson, and later take short dictations. Then spell four or five words from the lesson.
  - <b>Old-fashioned on purpose.</b> Many lessons end with a plain moral, and some are prayers or hymns. Talk them over in your family's own way. The two hymn lessons are marked optional.
  unitword: Part
