  title: 'Drill 33: small l and the loop letters'
  mins: 15
  goal: Your child writes small l four spaces tall with a well-curved up stroke, and knows that b, f, h and k grow from it.
  materials:
  - Wide-ruled lined paper (several sheets)
  - A sharp pencil or a smooth gel pen
  - The book open at today's page
  - A watch, clock or phone timer that shows seconds (only for the optional speed check)
  book: 'Lesson 32 explains the loop letters: their heights, the movement used, and cautions. Drill 33 is rows of small l. The book adds l to the daily
    opening.'
  steps:
  - - Warm up
    - 'Three to five minutes: compact ovals (drill 3), a line of small o (drill 11) and a line of small m (drill 14). This is the book''s daily opening
      from now on.'
  - - The loop family
    - '~ The basis of the extended loop letters, b, f, h, and k, is small l.

      Small l is four spaces tall: one-quarter of an inch. That leaves a little room under the ruled line above.'
  - - Look at the model
    - Open the book page. Look at drill 33. For loops above the line, the fingers relax and stretch a little as the arm slides forward. Loops below the
      line are made with the arm alone.
  - - Rows of l
    - 'Five lines of connected l in groups of five, counting 1, 2, 3, 4, 5.

      Optional speed target: one hundred to one hundred and twenty-five a minute.'
  - - Watch for
    - 'The first difficulty is getting enough curve on the up stroke. Keep the paper tilted so the down strokes come straight toward the middle of the body.

      ~ Above all, preserve unity in height, in slant and in spacing. Do not shade.'
  - - Gentle check and finish
    - 'Hold a ruler along the tops of the loops: are they level? Finish by writing "all", "tell" or "little".'
  practice: Add a line of small l to the daily warm-up from now on.
  tip: '"Do not shade" meant: don''t press harder on the down strokes. With a pencil, keep the pressure light and even.'
