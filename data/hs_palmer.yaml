  materials:
  - Wide-ruled lined paper (several sheets)
  - A sharp pencil or a smooth gel pen
  - The book open at today's page
  book: Lesson 113 has drill 135 (capital V and the word "Vining"), a "Caution to teachers and pupils" listing six things good writing depends on, and on
    the next page drill 136, the sentence "I am pining for a pin to use in pinning".
  steps:
  - - Warm up
    - 'Two or three minutes of your usual movement drills: compact ovals, then a line each of small o, m and l.'
  - - Look at the model
    - 'Open the book page. Look at drill 135.

      ~ An otherwise good capital V will be spoiled if the finishing line is too long.

      Two lines of V, then two lines of "Vining."'
  - - The six conditions
    - 'The caution lists six things good writing depends on: clothing that leaves the writing arm free, a solid table of the right height, a good position,
      relaxed muscles, the wrist and side of the hand off the paper, and concentration and repeated effort. Check all six with your child right now.

      ~ Home students, not having the advantage of the directing counsel of good teachers, should frequently review the beginning lessons.'
  - - Drill 136 in sections
    - 'The sentence is "I am pining for a pin to use in pinning." Practice it in sections: capital I until it is good at speed, then several lines of "am,"
      then each word in turn.'
  - - The whole sentence
    - 'Then write the whole sentence, a few lines or a page, and look at it critically together.

      ~ As simple as it looks, there is material for several hours'' practice in this copy.'
  - - Gentle check and finish
    - Look at spacing, height and slant, one at a time. Finish by writing the sentence once more, slowly and well.
  practice: Keep coming back to drill 136 for a few minutes a day; the book expects several hours of practice on it in all.
