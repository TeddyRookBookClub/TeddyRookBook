slug: books-of-the-bible
title: "Books of the Bible (66-book Protestant canon)"
group: scripture
ages: "6+"
count_note: "66 books: 39 in the Old Testament and 27 in the New. Catholic Bibles have 73 books (see the companion list): they add seven books, called the deuterocanonical books (Tobit, Judith, 1 and 2 Maccabees, Wisdom, Sirach and Baruch), and longer forms of Esther and Daniel. Many Protestant Bibles print these, when they include them, in a separate section called the Apocrypha. The Orthodox churches' canons include a few more. The New Testament's 27 books are the same in all three."
intro: "Knowing the books in order makes it quick to find a passage, and it shows how the Bible is laid out: law, history, poetry, prophets, then the Gospels and letters. Families have learned this list by heart for generations, often as a song."
technique: "Sixty-six names is a long list, so chunk it by section. The sections are the meaningful units: five books of Law, twelve of History, five of Poetry and wisdom, five Major prophets, twelve Minor prophets, then the New Testament. Long sections are split into groups of about five. A tune helps too: sing each section to a melody you already know, and the rhythm carries the order."
order_matters: true
main: book
