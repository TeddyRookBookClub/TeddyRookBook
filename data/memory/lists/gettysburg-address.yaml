  - { name: "Library of Congress, Abraham Lincoln Papers: Alexander Bliss to John G. Nicolay, March 7, 1864 (autograph copy of the Gettysburg Address)", url: "https://www.loc.gov/item/mal4277200" }
  - { name: "American Battlefield Trust: Versions of the Gettysburg Address", url: "https://www.battlefields.org/learn/articles/versions-gettysburg-address" }
