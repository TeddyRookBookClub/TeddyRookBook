slug: us-states
title: "The 50 states: capitals and statehood, in order"
group: geography
ages: "8+"
count_note: "50 states, in the order they joined the Union. For the original thirteen, the date is the day each ratified the Constitution. North and South Dakota were admitted on the same day (November 2, 1889); by custom North Dakota is counted 39th and South Dakota 40th, in alphabetical order. Washington, D.C. is not a state, so it is not on the list."
intro: "Fifty states, each with a capital and a birthday. Learned in order of statehood, the list tells the story of how the country grew: thirteen states on the Atlantic coast, then a march west across the continent, then Alaska and Hawaii in 1959."
technique: "Chunk by era. The order of statehood has natural breaks: the original thirteen; the states of the early republic (1791 to 1821); the westward growth before and during the Civil War (1836 to 1867); the West (1876 to 1912); and the last two in 1959. Learn one era in groups of about five, then close the book and recall it. For the capitals, link a picture to each pair (Baton Rouge, a red stick, standing in a bayou), and use a map as a memory palace, tracing the order of statehood with your finger. Come back on day 1, 3, 7 and 21."
order_matters: true
main: state
fields:
  - { key: n, label: "No." }
  - { key: state, label: "State" }
  - { key: capital, label: "Capital" }
  - { key: year, label: "Statehood" }
show: [n, state, capital, year]
prompts:
  - { ask: capital, from: [state] }
  - { ask: state, from: [capital] }
  - { ask: state, from: [n] }
  - { ask: n, from: [state] }
  - { ask: year, from: [state] }
