slug: "elements-55-86"
title: "Elements 55-86: period 6, with the lanthanides"
group: "science"
ages: "13+"
count_note: "32 elements, all in period 6. Ce to Lu sit in the f-block, which has no group number. Most tables put lanthanum (57) and actinium (89) in group 3, as ours does; some put lutetium (71) and lawrencium (103) there instead. IUPAC has not settled the question."
intro: "Row six holds gold, platinum, mercury and lead, and the fifteen lanthanides that are tucked below the main table. Every element in this list is in period 6."
technique: "This row is long (32 elements), so the chunks matter. Learn the two s-block metals, then the lanthanides in three chunks of five, then the transition metals, then the p-block. A story chain helps with the lanthanides: link each name to the next in one silly scene. Au (aurum), Hg (hydrargyros, liquid silver), Pb (plumbum) and W (wolfram) are the odd symbols to drill."
order_matters: true
main: "name"
fields:
  - { key: z, label: "Atomic number" }
  - { key: symbol, label: "Symbol" }
  - { key: name, label: "Element" }
  - { key: group, label: "Group" }
show: [z, symbol, name, group]
prompts:
  - { ask: symbol, from: [name] }
  - { ask: name, from: [symbol] }
  - { ask: name, from: [z] }
  - { ask: z, from: [name] }
  - { ask: group, from: [name] }
items:
  - { z: 55, symbol: "Cs", name: "Cesium", group: "1", chunk: "s-block: groups 1-2", hook: "From the Latin caesius, sky blue, for its two blue spectral lines.", accept: { name: ["Caesium"] } }
  - { z: 56, symbol: "Ba", name: "Barium", group: "2", chunk: "s-block: groups 1-2", hook: "From the Greek barys, heavy, because its mineral barite is unusually dense." }
