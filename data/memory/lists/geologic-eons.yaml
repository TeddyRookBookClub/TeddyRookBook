items:
  - { n: 1, name: "Hadean", ma: "4567", meaning: "From Hades, the Greek underworld: a hot, young Earth with no lasting rocks.", events: "Earth forms; the Moon forms from a giant impact; few rocks survive from this time.", accept: { ma: ["4567", "4600", "4.6 billion"] } }
  - { n: 2, name: "Archean", ma: "4031", meaning: "From the Greek for \"beginning\" or \"ancient.\"", events: "The oldest rocks; the first simple, single-celled life.", accept: { ma: ["4031", "4000", "4 billion"] } }
  - { n: 3, name: "Proterozoic", ma: "2500", meaning: "Greek for \"earlier life.\"", events: "Oxygen builds up in the air; cells with a nucleus appear; the first many-celled life near the end.", accept: { ma: ["2500", "2.5 billion"] } }
  - { n: 4, name: "Phanerozoic", ma: "538.8", meaning: "Greek for \"visible life.\"", events: "Animals with shells and skeletons spread, then fish, land plants, dinosaurs, mammals and people.", accept: { ma: ["538.8", "539", "541"] } }
