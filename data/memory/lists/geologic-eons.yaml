slug: "geologic-eons"
title: "The four eons of Earth's history"
group: "science"
ages: "10+"
count_note: "Four eons. Start dates are from the International Commission on Stratigraphy chart, version 2024/12, in millions of years ago (Ma). Older charts and textbooks give slightly different numbers, because the dates are refined as rocks are re-dated. The Hadean has no formal lower boundary; 4,567 Ma is about the age of the solar system. The first three eons together are often called the Precambrian, an informal name."
intro: "Earth is about 4.5 billion years old, and geologists split that long story into four huge chapters called eons. Knowing them gives you a frame for everything else: fossils, mountains, and how short human history is."
technique: "Four items fit in working memory at once, so learn them as one chunk. The names tell the story if you know their Greek roots: Hades (fiery start), archaios (ancient), proteros + zoe (earlier life), phaneros + zoe (visible life). Make it a four-panel comic: a fiery ball, a rock with a speck of life, green slime and bubbles of oxygen, then a busy sea of creatures."
order_matters: true
main: "name"
fields:
  - { key: n, label: "Order" }
  - { key: name, label: "Eon" }
  - { key: ma, label: "Began (million years ago)" }
