  - { country: "Saint Vincent and the Grenadines", capital: "Kingstown", region: "Caribbean", chunk: "Caribbean", hook: "Kingstown, with a \"town\": the long country name gets the long capital name (Kingston is Jamaica).", accept: {country: ["St. Vincent and the Grenadines", "St Vincent and the Grenadines"]} }
  - { country: "Trinidad and Tobago", capital: "Port of Spain", region: "Caribbean", chunk: "Caribbean", hook: "Port of Spain: the island of Trinidad was a Spanish colony before it was British.", accept: {country: ["Trinidad & Tobago"], capital: ["Port-of-Spain"]} }
