# Memory challenge list. Generated by /tmp/work_memlists_hum/gen_geo.py from the Geography Ladder model
# (static/geog/viz/geog.js) plus hand-written hooks; edit with care and run node scripts/memory/check-lists.js.
# Item extras: accept = other spellings per field; noquiz = fields shown in Study but never asked (disputed capitals).
slug: countries-north-america
title: "Countries of North America and their capitals"
group: geography
ages: "9+"
count_note: "23 countries: Canada, the United States and Mexico, the seven of Central America and the thirteen island nations of the Caribbean."
intro: "These are our neighbors: two big countries to the north and south, the narrow land bridge of Central America and a ring of islands in the Caribbean. Knowing the capitals turns a map into places with names."
technique: "Chunk by region. A whole continent is too much to hold at once, so the list is learned a region at a time, in groups of about five. Use picture plus words: say each pair out loud while you point to the country on a map (the Geography Ladder has maps). The map works like a memory palace, so walk it in the same direction each time. Where a capital has a story or a meaning, picture it; the hooks give some to start with. Then close the book and recall, and come back on day 1, 3, 7 and 21."
order_matters: false
main: country
fields:
  - { key: country, label: "Country" }
  - { key: capital, label: "Capital" }
  - { key: region, label: "Region" }
show: [country, capital, region]
prompts:
  - { ask: capital, from: [country] }
  - { ask: country, from: [capital] }
  - { ask: region, from: [country] }
items:
  - { country: "United States", capital: "Washington, D.C.", region: "Northern America", chunk: "Northern America", hook: "Washington is named for the first president; D.C. stands for District of Columbia, a district that belongs to no state.", accept: {country: ["United States of America", "USA", "U.S.", "US", "America"], capital: ["Washington", "Washington DC", "Washington D.C."]} }
  - { country: "Canada", capital: "Ottawa", region: "Northern America", chunk: "Northern America", hook: "Ottawa sits on the Ottawa River, right on the line between Ontario and Quebec." }
  - { country: "Mexico", capital: "Mexico City", region: "Central America", chunk: "Central America", hook: "Three countries in this list name their capital \"country + City\": Mexico, Guatemala and Panama.", accept: {capital: ["Ciudad de México", "Ciudad de Mexico"]} }
  - { country: "Belize", capital: "Belmopan", region: "Central America", chunk: "Central America", hook: "Belmopan was built inland after a hurricane struck the old capital, Belize City, in 1961." }
  - { country: "Guatemala", capital: "Guatemala City", region: "Central America", chunk: "Central America", hook: "Country + City, like Mexico City and Panama City.", accept: {capital: ["Ciudad de Guatemala"]} }
  - { country: "Honduras", capital: "Tegucigalpa", region: "Central America", chunk: "Central America" }
  - { country: "El Salvador", capital: "San Salvador", region: "Central America", chunk: "Central America", hook: "The country is El Salvador, \"the Savior\"; the capital is San Salvador, \"Holy Savior\". One name inside the other." }
  - { country: "Nicaragua", capital: "Managua", region: "Central America", chunk: "Central America" }
  - { country: "Costa Rica", capital: "San José", region: "Central America", chunk: "Central America", accept: {capital: ["San Jose"]} }
  - { country: "Panama", capital: "Panama City", region: "Central America", chunk: "Central America", hook: "Country + City, like Mexico City and Guatemala City.", accept: {capital: ["Ciudad de Panamá"]} }
  - { country: "Antigua and Barbuda", capital: "St. John's", region: "Caribbean", chunk: "Caribbean", accept: {country: ["Antigua & Barbuda"], capital: ["Saint John's", "St Johns"]} }
  - { country: "Bahamas", capital: "Nassau", region: "Caribbean", chunk: "Caribbean", accept: {country: ["The Bahamas"]} }
  - { country: "Barbados", capital: "Bridgetown", region: "Caribbean", chunk: "Caribbean" }
  - { country: "Cuba", capital: "Havana", region: "Caribbean", chunk: "Caribbean", hook: "Picture a cigar box with \"Havana\" stamped on the lid.", accept: {capital: ["La Habana"]} }
  - { country: "Dominica", capital: "Roseau", region: "Caribbean", chunk: "Caribbean", hook: "Not the Dominican Republic: Dominica is a small island nation, and Roseau is French for \"reed\"." }
  - { country: "Dominican Republic", capital: "Santo Domingo", region: "Caribbean", chunk: "Caribbean", hook: "Domingo goes with Dominican." }
  - { country: "Grenada", capital: "St. George's", region: "Caribbean", chunk: "Caribbean", accept: {capital: ["Saint George's", "St Georges"]} }
  - { country: "Haiti", capital: "Port-au-Prince", region: "Caribbean", chunk: "Caribbean", hook: "Port-au-Prince is French for \"Port of the Prince\"; Haiti's languages are French and Haitian Creole.", accept: {capital: ["Port au Prince"]} }
  - { country: "Jamaica", capital: "Kingston", region: "Caribbean", chunk: "Caribbean", hook: "Kingston, Jamaica, and Kingstown, Saint Vincent: the longer country name gets the longer capital name." }
  - { country: "Saint Kitts and Nevis", capital: "Basseterre", region: "Caribbean", chunk: "Caribbean", accept: {country: ["St. Kitts and Nevis", "St Kitts and Nevis", "Saint Kitts & Nevis"]} }
