# Memory challenge list (format: /memory/challenges/ engine; checked by scripts/memory/check-lists.js)
slug: constitution-amendments
title: "The 27 amendments to the U.S. Constitution"
group: civics
ages: "10+"
count_note: "27 amendments. The first ten, the Bill of Rights, were ratified together in 1791. The years are the years each was ratified; the 27th was proposed in 1789 with the Bill of Rights but not ratified until 1992. The summaries are short and in plain words; the full text is at the National Archives."
intro: "The amendments are the changes and additions the country has made to its Constitution since 1787. Knowing them by number makes news, history and civics lessons easier to follow, since people often name a right by its amendment."
technique: "Chunk by era. The ten amendments of the Bill of Rights come first, learned five at a time. Then come the early fixes (11 and 12), the three Reconstruction amendments after the Civil War (13, 14 and 15), the four of the Progressive Era (16 to 19), and the rest in small groups. Use a number-shape or number-rhyme peg for each: one is a lone speaker at a microphone, three is a crowded house, five is a hand raised to say no. Recall the number from the summary and the summary from the number, then come back on day 1, 3, 7 and 21."
order_matters: true
main: name
fields:
  - { key: n, label: "No." }
  - { key: name, label: "Amendment" }
  - { key: summary, label: "In plain words" }
  - { key: year, label: "Ratified" }
show: [n, name, summary, year]
prompts:
  - { ask: name, from: [n] }
  - { ask: n, from: [name] }
  - { ask: n, from: [summary] }
  - { ask: year, from: [n] }
  - { ask: name, from: [summary] }
items:
  - { n: 1, name: "Freedom of religion, speech, press, assembly and petition", summary: "Congress may not set up an official religion or stop people from practicing their faith, and may not limit freedom of speech or of the press, the right to gather peacefully, or the right to petition the government.", year: 1791, chunk: "Bill of Rights, 1 to 5", hook: "Five freedoms in the first amendment: religion, speech, press, assembly, petition.", accept: { name: ["Freedom of speech", "Freedom of religion", "Free speech", "Religion, speech, press, assembly, petition"] } }
  - { n: 2, name: "Right to keep and bear arms", summary: "Begins by naming a well-regulated militia as necessary to a free state, and says the right of the people to keep and bear arms shall not be infringed.", year: 1791, chunk: "Bill of Rights, 1 to 5", accept: { name: ["Right to bear arms", "Bear arms"] } }
  - { n: 3, name: "No quartering of soldiers", summary: "In peacetime, soldiers may not be housed in a home without the owner's consent; in wartime, only as the law directs.", year: 1791, chunk: "Bill of Rights, 1 to 5", hook: "Three is a crowd: no soldiers moving into your house.", accept: { name: ["Quartering of soldiers", "Quartering"] } }
  - { n: 4, name: "No unreasonable searches and seizures", summary: "People, homes, papers and belongings are protected from unreasonable searches and seizures; a warrant needs probable cause and must describe what is to be searched.", year: 1791, chunk: "Bill of Rights, 1 to 5", hook: "Four walls of a home, protected from unreasonable searches.", accept: { name: ["Searches and seizures", "Search and seizure", "Unreasonable search and seizure"] } }
  - { n: 5, name: "Rights of people accused of crimes", summary: "A grand jury for serious federal charges; no trial twice for the same crime; no one forced to be a witness against themselves; due process of law; fair payment when the government takes property.", year: 1791, chunk: "Bill of Rights, 1 to 5", hook: "\"Pleading the Fifth\" means using its right not to be a witness against yourself.", accept: { name: ["Rights of the accused", "Due process", "Self-incrimination"] } }
  - { n: 6, name: "Rights in criminal trials", summary: "A speedy and public trial by an impartial jury, the right to be told the charges, to face and call witnesses, and to have a lawyer.", year: 1791, chunk: "Bill of Rights, 6 to 10", hook: "Six things a criminal trial must have, starting with speedy and public.", accept: { name: ["Right to a speedy trial", "Speedy trial", "Criminal trials"] } }
  - { n: 7, name: "Jury trials in civil cases", summary: "A jury in federal civil lawsuits over more than twenty dollars, and facts found by a jury are not re-examined except under the rules of common law.", year: 1791, chunk: "Bill of Rights, 6 to 10", accept: { name: ["Civil jury trials", "Civil trials", "Jury in civil cases"] } }
  - { n: 8, name: "No excessive bail or cruel and unusual punishment", summary: "No excessive bail, no excessive fines, and no cruel and unusual punishments.", year: 1791, chunk: "Bill of Rights, 6 to 10", accept: { name: ["Cruel and unusual punishment", "Bail, fines, punishment", "Excessive bail"] } }
  - { n: 9, name: "Rights kept by the people", summary: "Listing some rights in the Constitution does not mean the people have no others.", year: 1791, chunk: "Bill of Rights, 6 to 10", hook: "Nine and Ten close the Bill of Rights: what is not listed still belongs to the people (9) or to the states and the people (10).", accept: { name: ["Rights retained by the people", "Other rights"] } }
  - { n: 10, name: "Powers kept by the states and the people", summary: "Powers the Constitution does not give to the federal government, and does not forbid to the states, belong to the states or to the people.", year: 1791, chunk: "Bill of Rights, 6 to 10", accept: { name: ["Powers reserved to the states", "States' rights", "Reserved powers"] } }
  - { n: 11, name: "Lawsuits against states", summary: "Federal courts may not hear lawsuits against a state brought by citizens of another state or of a foreign country.", year: 1795, chunk: "11 to 15", accept: { name: ["Suits against states"] } }
  - { n: 12, name: "Separate electoral votes for President and Vice President", summary: "Members of the Electoral College cast one vote for President and a separate vote for Vice President.", year: 1804, chunk: "11 to 15", hook: "Twelve fixed the election of 1800, when the old rules produced a tie between running mates.", accept: { name: ["Election of President and Vice President", "Electoral College"] } }
  - { n: 13, name: "Abolition of slavery", summary: "Slavery and forced labor are abolished, except as punishment for a crime.", year: 1865, chunk: "11 to 15", hook: "The three Reconstruction amendments after the Civil War: 13 freedom, 14 citizenship, 15 the vote.", accept: { name: ["Abolishing slavery", "End of slavery", "Slavery abolished"] } }
  - { n: 14, name: "Citizenship, due process and equal protection", summary: "All people born or naturalized in the United States are citizens; no state may deny any person due process of law or the equal protection of the laws. It also changed how House seats are counted.", year: 1868, chunk: "11 to 15", accept: { name: ["Equal protection", "Citizenship", "Citizenship and equal protection"] } }
  - { n: 15, name: "Voting rights regardless of race", summary: "The right to vote may not be denied because of race, color or having once been enslaved.", year: 1870, chunk: "11 to 15", accept: { name: ["Race and voting", "Right to vote regardless of race"] } }
  - { n: 16, name: "Federal income tax", summary: "Congress may tax incomes without dividing the tax among the states by population.", year: 1913, chunk: "16 to 19", accept: { name: ["Income tax"] } }
  - { n: 17, name: "Direct election of senators", summary: "Senators are elected by the voters of each state, not chosen by state legislatures.", year: 1913, chunk: "16 to 19", hook: "Sixteen and Seventeen both came in 1913.", accept: { name: ["Election of senators", "Senators elected by the people"] } }
  - { n: 18, name: "Prohibition of alcohol", summary: "Banned making, selling and transporting alcoholic drinks. Repealed by the 21st Amendment.", year: 1919, chunk: "16 to 19", hook: "Eighteen began Prohibition; twenty-one ended it. Picture an 18-wheeler truck of bottles stopped at a gate that opens again at 21.", accept: { name: ["Prohibition"] } }
  - { n: 19, name: "Women's right to vote", summary: "The right to vote may not be denied because of sex.", year: 1920, chunk: "16 to 19", hook: "Women won the vote nationwide in 1920, a round year to remember.", accept: { name: ["Women's suffrage", "Womens suffrage", "Women's voting rights"] } }
  - { n: 20, name: "Start dates of terms; the \"Lame Duck\" amendment", summary: "The terms of the President and Vice President begin on January 20, and those of Congress on January 3; it also says what happens if a President-elect dies.", year: 1933, chunk: "20 to 23", hook: "Twenty sets the date January 20.", accept: { name: ["Lame Duck Amendment", "Terms of office", "Terms and succession"] } }
  - { n: 21, name: "Repeal of Prohibition", summary: "Repealed the 18th Amendment. It is the only amendment ratified by state conventions instead of state legislatures.", year: 1933, chunk: "20 to 23", accept: { name: ["End of Prohibition", "Repeal of the 18th Amendment"] } }
  - { n: 22, name: "Two-term limit for the President", summary: "No one may be elected President more than twice.", year: 1951, chunk: "20 to 23", hook: "Twenty-two: two terms.", accept: { name: ["Presidential term limits", "Term limits", "Two-term limit"] } }
  - { n: 23, name: "Electoral votes for Washington, D.C.", summary: "The District of Columbia gets electors in presidential elections, no more than the least populous state (three).", year: 1961, chunk: "20 to 23", accept: { name: ["Electors for D.C.", "Electoral votes for D.C.", "D.C. electors"] } }
  - { n: 24, name: "No poll taxes", summary: "No one may be required to pay a poll tax or any other tax to vote in a federal election.", year: 1964, chunk: "24 to 27", accept: { name: ["Abolition of poll taxes", "Poll tax"] } }
  - { n: 25, name: "Presidential disability and succession", summary: "The Vice President becomes President if the President dies, resigns or is removed; how to fill a vacancy in the vice presidency; and how the Vice President can act as President when the President is unable to serve.", year: 1967, chunk: "24 to 27", accept: { name: ["Presidential succession", "Succession", "Presidential disability"] } }
  - { n: 26, name: "Voting age of 18", summary: "Citizens 18 years old or older may not be denied the vote because of age.", year: 1971, chunk: "24 to 27", hook: "Twenty-six lowered the voting age to eighteen; it was ratified in about 100 days, the fastest of all.", accept: { name: ["Voting age", "Right to vote at 18", "18-year-old vote"] } }
  - { n: 27, name: "Congressional pay changes", summary: "A law changing the pay of members of Congress takes effect only after the next House election.", year: 1992, chunk: "24 to 27", hook: "Proposed in 1789 with the Bill of Rights, ratified in 1992: more than 200 years later.", accept: { name: ["Congressional pay", "Pay of Congress", "Congressional compensation"] } }
