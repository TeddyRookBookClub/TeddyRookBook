slug: "elements-87-118"
title: "Elements 87-118: period 7, with the actinides"
group: "science"
ages: "13+"
count_note: "32 elements, all in period 7. Th to Lr sit in the f-block, which has no group number. Most tables put lanthanum (57) and actinium (89) in group 3, as ours does; some put lutetium (71) and lawrencium (103) there instead. IUPAC has not settled the question. Elements beyond about 100 have been made only a few atoms at a time."
intro: "Row seven finishes the table: radium and uranium, the actinides, and the heavy elements made in laboratories, the last of them named in 2016. Every element in this list is in period 7."
technique: "Many of these names honor places and people (americium, californium, einsteinium, curium, nobelium), so build a picture for each: a map pin, a portrait, a city skyline. The actinides run in the same order as the lanthanides above them, so learn them side by side. Chunks of five, reviewed on the 1-3-7-21 schedule, keep the long tail from slipping."
order_matters: true
main: "name"
fields:
  - { key: z, label: "Atomic number" }
  - { key: symbol, label: "Symbol" }
  - { key: name, label: "Element" }
  - { key: group, label: "Group" }
show: [z, symbol, name, group]
prompts:
  - { ask: symbol, from: [name] }
  - { ask: name, from: [symbol] }
  - { ask: name, from: [z] }
  - { ask: z, from: [name] }
  - { ask: group, from: [name] }
