slug: "cloud-types"
title: "The ten main cloud types"
group: "science"
ages: "8+"
count_note: "The ten genera of the WMO International Cloud Atlas. Heights are for the middle latitudes: clouds sit lower near the poles and higher in the tropics. Nimbostratus is a middle cloud that usually spreads into the levels above and below; cumulus and cumulonimbus have low bases but can tower into the middle and high levels. Some weather services draw the lines a little differently (Australia's Bureau of Meteorology uses about 2.5 km and 6 km)."
intro: "Every cloud in the sky belongs to one of ten families, and their names are built from just four Latin words. Learn the ten and a glance upward tells you something about the weather on the way."
technique: "Build from the parts first: cirrus (curl of hair, high and icy), cumulus (heap), stratus (spread out, a layer) and nimbus (rain cloud), plus alto for the middle level. Then each name is a small sum you can work out, which is far easier than ten separate facts. Chunk by level (three high, three middle, four low), and pair each name with a quick sketch: picture plus words is dual coding. Best of all, step outside and name the clouds you see."
order_matters: false
main: "name"
fields:
  - { key: name, label: "Cloud" }
  - { key: abbr, label: "Symbol" }
