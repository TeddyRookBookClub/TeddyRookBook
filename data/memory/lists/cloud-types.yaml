items:
  - { name: "Cirrus", abbr: "Ci", level: "High", height: "About 5-13 km (16,500-45,000 ft)", looks: "Thin white wisps, strands or hooks of ice crystals, like brush strokes across the sky.", chunk: "High clouds", hook: "Latin cirrus means a curl or lock of hair: picture the sky with wispy white hair." }
  - { name: "Cirrocumulus", abbr: "Cc", level: "High", height: "About 5-13 km (16,500-45,000 ft)", looks: "Tiny white grains or ripples in rows, with no shading; each bit looks smaller than your little finger held at arm's length.", chunk: "High clouds", hook: "Cirro (hair-high) + cumulus (heap): tiny heaps up where the cirrus lives, like fish scales." }
  - { name: "Cirrostratus", abbr: "Cs", level: "High", height: "About 5-13 km (16,500-45,000 ft)", looks: "A thin, milky veil over much of the sky that often makes a ring of light (a halo) around the Sun or Moon.", chunk: "High clouds", hook: "Cirro + stratus (spread out): a thin icy sheet spread high up, wearing a halo." }
  - { name: "Altocumulus", abbr: "Ac", level: "Middle", height: "About 2-7 km (6,500-23,000 ft)", looks: "White or gray patches, rolls or rows with some shading; each piece about one to three fingers wide at arm's length.", chunk: "Middle clouds", hook: "Alto (from Latin altus, high) + cumulus: heaps in the middle of the sky, like a flock of sheep." }
  - { name: "Altostratus", abbr: "As", level: "Middle", height: "About 2-7 km (6,500-23,000 ft)", looks: "A gray or bluish sheet; the Sun shows dimly, as if through frosted glass, with no halo.", chunk: "Middle clouds", hook: "Alto + stratus: a middle-level sheet that turns the Sun into a dim, blurry coin." }
  - { name: "Nimbostratus", abbr: "Ns", level: "Middle", height: "About 2-7 km (6,500-23,000 ft)", looks: "A thick, dark gray layer that hides the Sun and brings steady rain or snow.", chunk: "Middle clouds", hook: "Latin nimbus means rain cloud: a rain-sheet that settles in for the whole day." }
  - { name: "Stratocumulus", abbr: "Sc", level: "Low", height: "Surface to about 2 km (6,500 ft)", looks: "Low gray or white lumps and rolls with darker parts, each wider than three fingers at arm's length, often with gaps of blue.", chunk: "Low clouds", hook: "Strato + cumulus: lumpy heaps spread into a low blanket, like a quilt with patches." }
  - { name: "Stratus", abbr: "St", level: "Low", height: "Surface to about 2 km (6,500 ft)", looks: "A flat, even gray layer, like fog that has lifted off the ground; it may bring drizzle.", chunk: "Low clouds", hook: "Stratus (spread out): a flat gray lid on the sky. Fog is stratus at ground level." }
  - { name: "Cumulus", abbr: "Cu", level: "Low", height: "Surface to about 2 km (6,500 ft)", looks: "Puffy, separate heaps with flat bases and bright, rounded tops, like cotton balls or cauliflower.", chunk: "Low clouds", hook: "Latin cumulus means heap (as in \"accumulate\"): fair-weather heaps of cotton." }
  - { name: "Cumulonimbus", abbr: "Cb", level: "Low", height: "Surface to about 2 km (6,500 ft)", looks: "A huge, towering storm cloud, often with a flat anvil-shaped top, bringing thunder, lightning, heavy showers and sometimes hail.", chunk: "Low clouds", hook: "Cumulus + nimbus: a heap that grew into a rain-and-thunder tower." }
