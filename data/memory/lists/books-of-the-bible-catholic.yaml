slug: books-of-the-bible-catholic
title: "Books of the Bible (73-book Catholic canon)"
group: scripture
ages: "6+"
count_note: "73 books: 46 in the Old Testament and 27 in the New, in the order and with the names used by the United States Conference of Catholic Bishops. Protestant Bibles have 66 books (see the companion list), and the Orthodox churches' canons include a few more (such as 1 Esdras, 3 Maccabees, the Prayer of Manasseh and Psalm 151). The seven books found here but not in Protestant Bibles, called the deuterocanonical books, are Tobit, Judith, 1 and 2 Maccabees, Wisdom, Sirach and Baruch; Esther and Daniel are also longer. Each is marked in the study table."
intro: "Knowing the books in order makes it quick to find a passage, and it shows how the Bible is laid out: the Pentateuch, the historical books, the wisdom books and the prophets, then the Gospels and letters."
technique: "Seventy-three names is a long list, so chunk it by section: the Pentateuch, the historical books, the wisdom books, the prophets, then the New Testament. Long sections are split into groups of about five. Sing each section to a tune you know; the rhythm carries the order, and the sections give you a map when a name slips."
order_matters: true
main: book
fields:
  - { key: n, label: "No." }
  - { key: book, label: "Book" }
  - { key: testament, label: "Testament" }
  - { key: section, label: "Section" }
