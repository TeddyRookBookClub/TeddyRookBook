slug: "elements-37-54"
title: "Elements 37-54: period 5"
group: "science"
ages: "12+"
count_note: "18 elements, all in period 5."
intro: "Row five brings silver, tin and iodine, and some metals you may know from jewelry and electronics. Every element in this list is in period 5."
technique: "The same three chunks as row four: two s-block metals, ten transition metals, six p-block elements. Link each element to the one above it in row four (silver under copper, cadmium under zinc), since elements in a group act alike. Ag (argentum), Sn (stannum) and Sb (stibium) come from Latin, so give each a picture: a silver coin, a tin can, an old eye-makeup pot for stibium."
order_matters: true
main: "name"
fields:
  - { key: z, label: "Atomic number" }
  - { key: symbol, label: "Symbol" }
  - { key: name, label: "Element" }
  - { key: group, label: "Group" }
show: [z, symbol, name, group]
prompts:
  - { ask: symbol, from: [name] }
  - { ask: name, from: [symbol] }
  - { ask: name, from: [z] }
  - { ask: z, from: [name] }
  - { ask: group, from: [name] }
  - { ask: name, from: [group] }
items:
