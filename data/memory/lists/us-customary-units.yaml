slug: "us-customary-units"
title: "U.S. customary units: how many in one?"
group: "everyday"
ages: "8+"
count_note: "15 facts, all exact by definition (NIST Handbook 44). Ounces here are avoirdupois weight ounces and U.S. fluid ounces of volume, which are different units. The mile and the gallon each appear twice, in two different units. The U.S. ton is the short ton; the British long ton is 2,240 pounds."
intro: "Recipes, road signs, lumber and gas pumps in the United States all use these units. Knowing how they nest inside each other lets you double a recipe, measure a room or read a map without reaching for a calculator."
technique: "Learn each family as one chain, since the units nest: teaspoon, tablespoon, fluid ounce, cup, pint, quart, gallon (3, 2, 8, 2, 2, 4). Draw it once as nesting boxes, a big G with four Qs inside, two Ps in each Q and two Cs in each P: picture plus words. Then length (12, 3, 5,280), weight (16, 2,000) and area (43,560, 640). Say each fact as a sentence, \"one gallon is four quarts,\" and quiz yourself both ways."
order_matters: false
main: "unit"
fields:
  - { key: unit, label: "One..." }
  - { key: count, label: "equals" }
  - { key: small, label: "of these" }
  - { key: kind, label: "Kind" }
show: [unit, count, small, kind]
prompts:
