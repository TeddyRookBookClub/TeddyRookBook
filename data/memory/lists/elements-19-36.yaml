slug: "elements-19-36"
title: "Elements 19-36: period 4"
group: "science"
ages: "11+"
count_note: "18 elements, all in period 4."
intro: "Row four holds the first transition metals, the everyday metals of tools, coins and wires: iron, copper, zinc, nickel. Every element in this list is in period 4."
technique: "Learn the row in three chunks that match the table's shape: the two s-block metals (K, Ca), the ten transition metals (Sc to Zn), then the six p-block elements (Ga to Kr). For the ten metals, a memory palace works well: ten spots along a workbench, each with its metal doing a job. Watch the odd symbols: K is potassium (Latin kalium) and Fe is iron (Latin ferrum)."
order_matters: true
main: "name"
fields:
  - { key: z, label: "Atomic number" }
  - { key: symbol, label: "Symbol" }
  - { key: name, label: "Element" }
  - { key: group, label: "Group" }
show: [z, symbol, name, group]
prompts:
  - { ask: symbol, from: [name] }
  - { ask: name, from: [symbol] }
  - { ask: name, from: [z] }
  - { ask: z, from: [name] }
  - { ask: group, from: [name] }
  - { ask: name, from: [group] }
items:
