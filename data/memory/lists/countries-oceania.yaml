# Memory challenge list. Generated by /tmp/work_memlists_hum/gen_geo.py from the Geography Ladder model
# (static/geog/viz/geog.js) plus hand-written hooks; edit with care and run node scripts/memory/check-lists.js.
# Item extras: accept = other spellings per field; noquiz = fields shown in Study but never asked (disputed capitals).
slug: countries-oceania
title: "Countries of Oceania and their capitals"
group: geography
ages: "9+"
count_note: "14 countries: Australia, New Zealand and the island nations of Melanesia, Micronesia and Polynesia."
intro: "Oceania is mostly ocean: Australia and New Zealand, then island nations spread across the Pacific. Some capitals are big cities; some are small towns on coral atolls."
technique: "Chunk by region. A whole continent is too much to hold at once, so the list is learned a region at a time, in groups of about five. Use picture plus words: say each pair out loud while you point to the country on a map (the Geography Ladder has maps). The map works like a memory palace, so walk it in the same direction each time. Where a capital has a story or a meaning, picture it; the hooks give some to start with. Then close the book and recall, and come back on day 1, 3, 7 and 21."
order_matters: false
main: country
fields:
  - { key: country, label: "Country" }
  - { key: capital, label: "Capital" }
  - { key: region, label: "Region" }
show: [country, capital, region]
prompts:
  - { ask: capital, from: [country] }
  - { ask: country, from: [capital] }
  - { ask: region, from: [country] }
