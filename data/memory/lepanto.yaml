# Lepanto by G. K. Chesterton, for /memory/challenges/lepanto/ (layouts/memchal/lepanto.html, static/memory/challenges/lepanto.js).
# The text is the 1915 John Lane printing (Poems, New York, pp. 21-28) as transcribed and validated on Wikisource; the one change is
# "WHITE" -> "White" in line 1 (a printer's drop capital). Check it with: python3 scripts/memory/check-lepanto.py
# scenes are the poem's eight stanzas (verse paragraphs); chunks are the pieces learned at a time (every line in exactly one).
title: "Lepanto"
author: "G. K. Chesterton"
words: 1353
source:
  printing: "G. K. Chesterton, Poems (New York: John Lane Company, 1915), pages 21–28"
  url: "https://en.wikisource.org/wiki/Poems_(Chesterton,_1915)/Lepanto"
  scan: "https://archive.org/details/poems191500chesuoft"
scenes:
  - { from: 1, to: 14, title: "The Sultan's court" }
  - { from: 15, to: 35, title: "Don John rides out" }
  - { from: 36, to: 47, title: "Mahound in his paradise" }
  - { from: 48, to: 73, title: "The spirits gather" }
  - { from: 74, to: 91, title: "St. Michael in the North" }
  - { from: 92, to: 107, title: "King Philip's closet" }
  - { from: 108, to: 137, title: "The Pope's vision and the battle" }
  - { from: 138, to: 143, title: "Cervantes" }
lines:
  - "White founts falling in the Courts of the sun,"
  - "And the Soldan of Byzantium is smiling as they run;"
  - "There is laughter like the fountains in that face of all men feared,"
  - "It stirs the forest darkness, the darkness of his beard,"
  - "It curls the blood-red crescent, the crescent of his lips,"
  - "For the inmost sea of all the earth is shaken with his ships."
  - "They have dared the white republics up the capes of Italy,"
  - "They have dashed the Adriatic round the Lion of the Sea,"
  - "And the Pope has cast his arms abroad for agony and loss,"
  - "And called the kings of Christendom for swords about the Cross."
  - "The cold queen of England is looking in the glass;"
  - "The shadow of the Valois is yawning at the Mass;"
  - "From evening isles fantastical rings faint the Spanish gun,"
  - "And the Lord upon the Golden Horn is laughing in the sun."
  - "Dim drums throbbing, in the hills half heard,"
  - "Where only on a nameless throne a crownless prince has stirred,"
  - "Where, risen from a doubtful seat and half attainted stall,"
  - "The last knight of Europe takes weapons from the wall,"
  - "The last and lingering troubadour to whom the bird has sung,"
  - "That once went singing southward when all the world was young."
  - "In that enormous silence, tiny and unafraid,"
  - "Comes up along a winding road the noise of the Crusade."
  - "Strong gongs groaning as the guns boom far,"
  - "Don John of Austria is going to the war,"
  - "Stiff flags straining in the night-blasts cold"
  - "In the gloom black-purple, in the glint old-gold,"
  - "Torchlight crimson on the copper kettle-drums,"
  - "Then the tuckets, then the trumpets, then the cannon, and he comes."
  - "Don John laughing in the brave beard curled,"
  - "Spurning of his stirrups like the thrones of all the world,"
  - "Holding his head up for a flag of all the free."
  - "Love-light of Spain—hurrah!"
  - "Death-light of Africa!"
  - "Don John of Austria"
  - "Is riding to the sea."
  - "Mahound is in his paradise above the evening star,"
  - "(Don John of Austria is going to the war.)"
  - "He moves a mighty turban on the timeless houri's knees,"
  - "His turban that is woven of the sunsets and the seas."
  - "He shakes the peacock gardens as he rises from his ease,"
  - "And he strides among the tree-tops and is taller than the trees,"
  - "And his voice through all the garden is a thunder sent to bring"
  - "Black Azrael and Ariel and Ammon on the wing."
  - "Giants and the Genii,"
  - "Multiplex of wing and eye,"
  - "Whose strong obedience broke the sky"
  - "When Solomon was king."
  - "They rush in red and purple from the red clouds of the morn,"
  - "From temples where the yellow gods shut up their eyes in scorn;"
  - "They rise in green robes roaring from the green hells of the sea"
  - "Where fallen skies and evil hues and eyeless creatures be;"
  - "On them the sea-valves cluster and the grey sea-forests curl,"
  - "Splashed with a splendid sickness, the sickness of the pearl;"
  - "They swell in sapphire smoke out of the blue cracks of the ground,—"
  - "They gather and they wonder and give worship to Mahound."
  - "And he saith, \"Break up the mountains where the hermit-folk can hide,"
  - "And sift the red and silver sands lest bone of saint abide,"
  - "And chase the Giaours flying night and day, not giving rest,"
  - "For that which was our trouble comes again out of the west."
  - "We have set the seal of Solomon on all things under sun,"
  - "Of knowledge and of sorrow and endurance of things done,"
  - "But a noise is in the mountains, in the mountains, and I know"
  - "The voice that shook our palaces—four hundred years ago:"
  - "It is he that saith not 'Kismet'; it is he that knows not Fate;"
  - "It is Richard, it is Raymond, it is Godfrey in the gate!"
  - "It is he whose loss is laughter when he counts the wager worth,"
  - "Put down your feet upon him, that our peace be on the earth.\""
  - "For he heard drums groaning and he heard guns jar,"
  - "(Don John of Austria is going to the war.)"
  - "Sudden and still—hurrah!"
  - "Bolt from Iberia!"
  - "Don John of Austria"
  - "Is gone by Alcalar."
  - "St. Michael's on his Mountain in the sea-roads of the north"
  - "(Don John of Austria is girt and going forth.)"
  - "Where the grey seas glitter and the sharp tides shift"
  - "And the sea-folk labour and the red sails lift."
  - "He shakes his lance of iron and he claps his wings of stone;"
  - "The noise is gone through Normandy; the noise is gone alone;"
  - "The North is full of tangled things and texts and aching eyes"
  - "And dead is all the innocence of anger and surprise,"
  - "And Christian killeth Christian in a narrow dusty room,"
  - "And Christian dreadeth Christ that hath a newer face of doom,"
  - "And Christian hateth Mary that God kissed in Galilee,"
  - "But Don John of Austria is riding to the sea."
  - "Don John calling through the blast and the eclipse"
  - "Crying with the trumpet, with the trumpet of his lips,"
  - "Trumpet that sayeth ha!"
  - "Domino gloria!"
  - "Don John of Austria"
  - "Is shouting to the ships."
  - "King Philip's in his closet with the Fleece about his neck"
  - "(Don John of Austria is armed upon the deck.)"
  - "The walls are hung with velvet that is black and soft as sin,"
  - "And little dwarfs creep out of it and little dwarfs creep in."
  - "He holds a crystal phial that has colours like the moon,"
  - "He touches, and it tingles, and he trembles very soon,"
  - "And his face is as a fungus of a leprous white and grey"
  - "Like plants in the high houses that are shuttered from the day,"
  - "And death is in the phial and the end of noble work,"
  - "But Don John of Austria has fired upon the Turk."
  - "Don John's hunting, and his hounds have bayed—"
  - "Booms away past Italy the rumour of his raid."
  - "Gun upon gun, ha! ha!"
  - "Gun upon gun, hurrah!"
  - "Don John of Austria"
  - "Has loosed the cannonade."
  - "The Pope was in his chapel before day or battle broke,"
  - "(Don John of Austria is hidden in the smoke.)"
  - "The hidden room in man's house where God sits all the year,"
  - "The secret window whence the world looks small and very dear."
  - "He sees as in a mirror on the monstrous twilight sea"
  - "The crescent of his cruel ships whose name is mystery;"
  - "They fling great shadows foe-wards, making Cross and Castle dark,"
  - "They veil the plumèd lions on the galleys of St. Mark;"
  - "And above the ships are palaces of brown, black-bearded chiefs,"
  - "And below the ships are prisons, where with multitudinous griefs,"
  - "Christian captives sick and sunless, all a labouring race repines"
  - "Like a race in sunken cities, like a nation in the mines."
  - "They are lost like slaves that swat, and in the skies of morning hung"
  - "The stair-ways of the tallest gods when tyranny was young."
  - "They are countless, voiceless, hopeless as those fallen or fleeing on"
  - "Before the high Kings' horses in the granite of Babylon."
  - "And many a one grows witless in his quiet room in hell"
  - "Where a yellow face looks inward through the lattice of his cell,"
  - "And he finds his God forgotten, and he seeks no more a sign—"
  - "(But Don John of Austria has burst the battle-line!)"
  - "Don John pounding from the slaughter-painted poop,"
  - "Purpling all the ocean like a bloody pirate's sloop,"
  - "Scarlet running over on the silvers and the golds,"
  - "Breaking of the hatches up and bursting of the holds,"
  - "Thronging of the thousands up that labour under sea"
  - "White for bliss and blind for sun and stunned for liberty."
  - "Vivat Hispania!"
  - "Domino Gloria!"
  - "Don John of Austria"
  - "Has set his people free!"
  - "Cervantes on his galley sets the sword back in the sheath"
  - "(Don John of Austria rides homeward with a wreath.)"
  - "And he sees across a weary land a straggling road in Spain,"
  - "Up which a lean and foolish knight for ever rides in vain,"
  - "And he smiles, but not as Sultans smile, and settles back the blade...."
  - "(But Don John of Austria rides home from the Crusade.)"
chunks:
  - { from: 1, to: 6, hook: "One face, top to bottom: fountains of laughter, a forest of beard, a crescent of lips, and ships shaking the sea." }
  - { from: 7, to: 10, hook: "Two “They have” lines, then two “And” lines: the raiders dare and dash; the Pope casts and calls." }
  - { from: 11, to: 14, hook: "Three rulers who stay home (a queen at her mirror, a king yawning, a faint gun far away), and the Sultan laughing again." }
  - { from: 15, to: 18, hook: "“Dim drums” opens the scene. Two “Where” lines, then the last knight takes his weapons down." }
  - { from: 19, to: 22, hook: "From the last knight to the last troubadour; out of a huge silence, a tiny noise comes up the road." }
  - { from: 23, to: 28, hook: "Sound and color building like a parade: gongs, flags, torchlight, then tuckets, trumpets, cannon, and he comes." }
  - { from: 29, to: 35, hook: "Laughing, spurning, holding: three -ing lines, then the first refrain, which ends “riding to the sea.”" }
  - { from: 36, to: 41, hook: "Mahound rises: star, turban, sunsets and seas, peacock gardens, taller than the trees." }
  - { from: 42, to: 47, hook: "His voice calls three names (Azrael, Ariel, Ammon), then four short lines ending with Solomon the king." }
  - { from: 48, to: 51, hook: "Spirits come in colors: red and purple from the sky, green from the sea." }
  - { from: 52, to: 55, hook: "Under the sea: shells, sea-forests, pearl, then sapphire smoke from the ground, and they all bow to Mahound." }
  - { from: 56, to: 59, hook: "Mahound's orders begin: break the mountains, sift the sands, chase the Giaours, for trouble comes from the west." }
  - { from: 60, to: 63, hook: "We sealed the world, but a noise is in the mountains: the voice from four hundred years ago." }
  - { from: 64, to: 67, hook: "“It is he” three times: the man who says not Kismet, the crusaders by name, the man who laughs at loss." }
  - { from: 68, to: 73, hook: "Drums groan and guns jar; the refrain this time: “Is gone by Alcalar.”" }
  - { from: 74, to: 77, hook: "St. Michael on his mountain in the north; grey seas, sharp tides, red sails." }
  - { from: 78, to: 81, hook: "He shakes his lance and claps his wings; the noise goes through Normandy to a North of tangled things." }
  - { from: 82, to: 85, hook: "“And Christian” three times (killeth, dreadeth, hateth), then “But Don John” riding to the sea." }
  - { from: 86, to: 91, hook: "A trumpet of lips: “Domino gloria!” The refrain ends “shouting to the ships.”" }
  - { from: 92, to: 95, hook: "King Philip in his closet, the Fleece at his neck; velvet walls, dwarfs creeping out and in." }
  - { from: 96, to: 101, hook: "The crystal phial: moonlight colors, a fungus face, plants kept from the day; “But Don John” has fired." }
  - { from: 102, to: 107, hook: "Hounds bay, the raid booms past Italy; “Gun upon gun” twice, and he has loosed the cannonade." }
  - { from: 108, to: 111, hook: "The Pope in his chapel before dawn: the hidden room, the secret window." }
  - { from: 112, to: 115, hook: "In his mirror: the crescent of ships, shadows over Cross and Castle, the lions of St. Mark." }
  - { from: 116, to: 119, hook: "Above the ships, palaces; below, prisons of captives, like a city sunk or a mine." }
  - { from: 120, to: 123, hook: "Lost like slaves, countless as the captives of ancient Babylon." }
  - { from: 124, to: 127, hook: "One captive in his cell forgets to hope, and then the bracket breaks in: Don John has burst the line." }
  - { from: 128, to: 131, hook: "Pounding, purpling, scarlet, breaking: the fight on the decks and down into the holds." }
  - { from: 132, to: 137, hook: "The rowers come up into the sun: bliss, sun, liberty. Two Latin cheers, and “set his people free!”" }
  - { from: 138, to: 143, hook: "Cervantes sheathes his sword and sees a lean knight on a Spanish road; the last refrain brings Don John home." }
glossary:
  - { term: "Soldan of Byzantium", lines: "2", text: "An old word for sultan. Here it is the Ottoman sultan, ruling from Constantinople (old Byzantium), which the Ottomans had taken in 1453 AD. In 1571 the sultan was Selim II.", url: "https://grokipedia.com/page/Selim_II" }
  - { term: "the inmost sea", lines: "6", text: "The Mediterranean, the sea in the middle of the lands around it." }
  - { term: "the white republics", lines: "7", text: "The Italian sea-trading republics, such as Venice and Genoa." }
  - { term: "the Lion of the Sea", lines: "8", text: "Venice, whose emblem is the winged lion of St. Mark. The Adriatic is the sea beside it." }
  - { term: "the Pope", lines: "9, 108", text: "Pius V, who brought Spain, Venice and other Catholic states together in the Holy League of 1571.", url: "https://grokipedia.com/page/Pope_Pius_V" }
  - { term: "the cold queen of England", lines: "11", text: "Elizabeth I. England, a Protestant country by then, did not join the League.", url: "https://grokipedia.com/page/Elizabeth_I" }
  - { term: "the shadow of the Valois", lines: "12", text: "The Valois were the royal house of France. France stayed out of the League and had long had a working alliance with the Ottomans.", url: "https://grokipedia.com/page/House_of_Valois" }
  - { term: "the Golden Horn", lines: "14", text: "The harbor inlet of Constantinople (Istanbul). “The Lord upon the Golden Horn” is the sultan.", url: "https://grokipedia.com/page/Golden_Horn" }
  - { term: "a crownless prince", lines: "16", text: "Don John was the son of Emperor Charles V, born outside marriage, so he could never inherit a crown. “A doubtful seat and half attainted stall” (line 17) points to the same thing." }
  - { term: "troubadour", lines: "19", text: "A poet-singer of the Middle Ages, especially in southern France." }
  - { term: "Don John of Austria", lines: "24 and the refrains", text: "John of Austria (1547–1578), half-brother of King Philip II of Spain. He commanded the Holy League fleet at Lepanto when he was 24.", url: "https://grokipedia.com/page/John_of_Austria" }
  - { term: "tuckets", lines: "28", text: "Flourishes on a trumpet, an old word that Shakespeare uses in his stage directions." }
  - { term: "Mahound", lines: "36, 55", text: "An old European form of the name Muhammad, used in medieval Christian writing as an insult and to picture him as an idol or a demon. The poem's Mahound, a giant in a fairy-tale garden, comes from that European legend, not from what Muslims believe.", url: "https://grokipedia.com/page/Mahound" }
  - { term: "houri", lines: "38", text: "In Islamic tradition, a companion of the blessed in paradise.", url: "https://grokipedia.com/page/Houri" }
  - { term: "Azrael, Ariel, Ammon", lines: "43", text: "Azrael is the angel of death in Islamic and Jewish folklore. Ariel is a spirit's name (Shakespeare gives it to the spirit in The Tempest). Ammon is Amun, a god of ancient Egypt. Chesterton gathers them for their sound and strangeness.", url: "https://grokipedia.com/page/Azrael" }
  - { term: "Genii", lines: "44", text: "Jinn: spirits of Arabian folklore and of Islamic belief.", url: "https://grokipedia.com/page/Jinn" }
  - { term: "Solomon; the seal of Solomon", lines: "47, 60", text: "In Jewish and Islamic legend, King Solomon ruled the spirits with a magic seal ring.", url: "https://grokipedia.com/page/Seal_of_Solomon" }
  - { term: "sea-valves", lines: "52", text: "The hinged shells of shellfish such as oysters and clams." }
  - { term: "Giaours", lines: "58", text: "A Turkish word for non-Muslims, used as an insult. Say it “JOW-ers” (rhymes with “towers”).", url: "https://grokipedia.com/page/Giaour" }
  - { term: "Kismet", lines: "64", text: "Fate, in Turkish (from Arabic). The poem means a man who won't accept that the end is already written." }
  - { term: "Richard, Raymond, Godfrey", lines: "65", text: "Leaders of the Crusades: Richard the Lionheart (Third Crusade, 1189–1192), and Raymond of Toulouse and Godfrey of Bouillon (First Crusade, 1096–1099). “Four hundred years ago” (line 63) is rounded: the First Crusade was about 470 years before Lepanto.", url: "https://grokipedia.com/page/Godfrey_of_Bouillon" }
  - { term: "Iberia", lines: "71", text: "The peninsula of Spain and Portugal." }
  - { term: "St. Michael's on his Mountain", lines: "74", text: "Mont-Saint-Michel, the island abbey off Normandy in northern France. The archangel Michael is shown with wings and a lance.", url: "https://grokipedia.com/page/Mont-Saint-Michel" }
  - { term: "girt", lines: "75", text: "With his sword belted on." }
  - { term: "Christian killeth Christian", lines: "82–84", text: "The wars of religion between Catholics and Protestants in northern Europe in the 1500s, seen here from Chesterton's side." }
  - { term: "Domino gloria", lines: "89, 135", text: "Latin: “Glory to the Lord!”" }
  - { term: "King Philip; the Fleece", lines: "92", text: "Philip II of Spain, Don John's half-brother. The Fleece is the Order of the Golden Fleece, a knightly order whose badge is a golden ram's fleece. The poem paints him as a gloomy schemer; historians give a fuller picture.", url: "https://grokipedia.com/page/Philip_II_of_Spain" }
  - { term: "phial", lines: "96, 100", text: "A small glass bottle." }
  - { term: "cannonade", lines: "107", text: "Steady cannon fire." }
  - { term: "the galleys of St. Mark; plumèd lions", lines: "115", text: "The Venetian galleys, flying the winged lion of St. Mark. The accent on plumèd means you say it in two syllables: PLOO-med." }
  - { term: "Christian captives", lines: "118–133", text: "Galleys were rowed by oarsmen, many of them captives and convicts on both sides. After the battle, thousands of Christian captives were freed from the Ottoman galleys.", url: "https://grokipedia.com/page/Battle_of_Lepanto" }
  - { term: "swat", lines: "120", text: "An old past tense of sweat: “slaves that sweated.”" }
  - { term: "Babylon", lines: "123", text: "The great city of ancient Mesopotamia, famous in the Bible for the exile of the people of Judah." }
  - { term: "poop; sloop", lines: "128, 129", text: "The poop is the raised deck at the back of a ship; a sloop is a small one-masted sailing ship." }
  - { term: "Vivat Hispania", lines: "134", text: "Latin: “Long live Spain!”" }
  - { term: "Cervantes; the lean and foolish knight", lines: "138–141", text: "Miguel de Cervantes (1547–1616) fought at Lepanto and was wounded; his left hand never worked again. Years later he wrote Don Quixote, about a lean old gentleman who rides out as a knight in vain. That is the knight he “sees” in line 141.", url: "https://grokipedia.com/page/Miguel_de_Cervantes" }
palace:
  - { locus: "Front door", from: 1, to: 14, picture: "A fountain splashes on your doorstep, and a laughing sultan with a forest of a beard sits in it, ships bobbing around his feet." }
  - { locus: "Hallway", from: 15, to: 35, picture: "Drums throb in the walls. A knight takes a sword down from the coat hooks, and a parade of gongs, flags and trumpets marches past toward the sea." }
  - { locus: "Living room", from: 36, to: 47, picture: "A giant in a turban rises from the sofa, taller than the lamps, peacocks in the curtains, calling three winged names." }
  - { locus: "Kitchen", from: 48, to: 73, picture: "Spirits pour out of the sink in red, purple and green; a pearl sits in the sapphire smoke from the oven; a voice booms orders about mountains and sand." }
  - { locus: "Stairs", from: 74, to: 91, picture: "St. Michael stands on the landing like a stone statue on a mountain, shaking an iron lance, while grey sea-water glitters on the steps." }
  - { locus: "Closet", from: 92, to: 107, picture: "Open the closet: black velvet walls, little dwarfs creeping in and out, a king holding a moon-colored bottle." }
  - { locus: "Bedroom", from: 108, to: 137, picture: "A small chapel with a mirror. In it you see the whole battle: ships, shadows, captives below deck, then Don John bursting through and the rowers climbing into the sunlight." }
  - { locus: "Back porch", from: 138, to: 143, picture: "A soldier sits down and slides his sword into its sheath, looking out at a long dusty road where a thin knight rides slowly away." }
