lessons:
- num: 1
  roman: I
  idx: 8
  unit: 1
  title: a cat, a rat
  mins: 15
  goal: Your child reads the words a, cat, rat and and, and reads the short lines on the page.
  materials:
  - The book, open to the lesson
  - A slate, small whiteboard or paper and pencil
  book: 'The first lesson: the new words a, cat, rat and and, with pictures, and a few tiny lines made only from them. The two alphabet pages just before it show the capital and small letters.'
  steps:
  - - Warm up
    - Turn back to the alphabet pages just before this lesson. Point to a few letters and say their names together, especially c, a, t and r. No need to know them all yet.
  - - Meet the new words
    - 'Point to each new word at the top of the page. Say it clearly, then your child says it back.

      ~ cat rat a and

      For short words, sound them out together, slowly, then fast. Mix up the order and ask your child to point to each word as you say it.'
  - - Read the sentences
    - 'Your child reads the sentences aloud, pointing to each word. Help by sounding out, not by telling, when you can. For example:

      ~ A cat and a rat.

      Then read the whole page once more, a little smoother.'
  - - Talk about the picture
    - 'Say: Look at the picture together. What do you see?

      Say: Which one is the cat? Which one is the rat?'
  - - Slate work
    - 'Your child copies a few of the new words onto the slate: cat, rat. If there is a line in script (handwriting) on the page, read it aloud together and copy it instead.'
  - - Spell aloud
    - 'Close the book. Say each word and your child spells it aloud: cat, rat. Then open the book and check.'
  - - Wrap up
    - Your child reads the whole lesson one last time, or just the favorite sentence. Stop while it is still fun.
  practice: Reread this page each day until your child can read it without help, then go on.
  tip: Cat and rat differ by only one letter. Cover the first letter with your finger and show that the rest, -at, is the same in both.
- num: 2
  roman: II
  idx: 9
  unit: 1
  title: The cat has a rat
  mins: 15
  goal: Your child reads the, has, ran and Ann, and reads two short sentences.
  materials:
  - The book, open to the lesson
