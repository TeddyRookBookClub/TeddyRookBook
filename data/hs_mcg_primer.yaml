- num: 5
  roman: V
  idx: 12
  unit: 1
  title: 'Review: the cat and the rat'
  mins: 15
  goal: Your child reads all the words from Lessons I to IV in new sentences, without help.
  materials:
  - The book, open to the lesson
  - A slate, small whiteboard or paper and pencil
  book: 'A review page with no new words: nine short sentences that mix up everything from Lessons I to IV, then a few lines in script (handwriting).'
  steps:
  - - Warm up
    - 'Turn back to Lesson IV. Point to the new words at the top and have your child read them:

      ~ man a cap the lad

      Any that are slow go in tomorrow''s warm-up too.'
  - - No new words today
    - 'Say: This page has no new words. You know every word on it!

      Let your child look the page over first and point to any word they are unsure of. Read those together.'
  - - Read the review
    - 'Your child reads the page aloud, one sentence at a time, pointing to each word. Help with any word by sounding it out or turning back to the lesson where it was new. Sentences like these:

      ~ Can Ann fan the lad?

      ~ Ann has a hat and a fan.'
  - - Talk about the picture
    - 'Say: Look at the picture together. What do you see?

      Say: Who in the sentences has a cap? Who has a fan?'
  - - 'Slate work: copy the script'
    - The lines at the bottom are written in script (handwriting). Read them aloud to your child and point to each word. Then copy one short script line onto the slate together, slowly.
  - - Spell a few
    - Say three short words from this page (any from earlier lessons). Your child spells each one aloud, then finds it on the page.
  - - Wrap up
    - 'Your child reads the sentence they like best, one more time, with expression. Praise the effort: this whole page is theirs now.'
  practice: Reread this review page tomorrow, then any two old lessons your child picks.
  tip: Questions start here. Show the question mark and let your child read Can Ann fan the lad? with a questioning voice.
