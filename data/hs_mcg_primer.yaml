book:
  id: mcguff1steclprimer01mcguf
  title: McGuffey's Eclectic Primer, Revised Edition
  year: 1920 printing
  key: mcg-primer
  short: Primer
  eyebrow: McGuffey's Readers · Primer · revised edition
  hero: 52 short reading lessons, from "a cat" and "a rat" to short stories and poems, for children about 5 or 6 who are just starting to read. Every lesson has a guide you can follow step by step, with the page of the book beside it.
  how:
  - <b>A little each day.</b> Ten to fifteen minutes, most days of the week. Stop while your child still wants more.
  - <b>New words first.</b> Each lesson starts with its new words at the top of the page. Learn those before reading the sentences, and the sentences come easily.
  - <b>Point to each word.</b> Your child points to every word while reading aloud. It keeps the place and stops guessing.
  - <b>Copy the script line.</b> Many pages have a line in script (handwriting). Read it aloud together, then copy it on a slate or paper. It's the book's handwriting lesson.
  - <b>Reread old lessons freely.</b> Rereading an easy page is good practice, not wasted time. Every fifth lesson is a review page for just that.
  - <b>Go at your child's pace.</b> Stay on a lesson two or three days if you need to. Move on when the new words come without help.
  unitword: Part
