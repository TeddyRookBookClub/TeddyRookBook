# The Continued-Fraction Suite (/music/continued-fraction-suite/): Teddy Rook's six pieces for piano, one number each.
# Every fact here was read from the score (static/pdfs/Continued-Fraction-Suite-score.pdf, 16 pages, engraved with
# LilyPond) and the math was checked by script (Python, mpmath). The pages are built by layouts/music/suite.html and
# layouts/music/suite-lesson.html; the accent player is static/music/suite/suite.js.
#
# Per movement:
#   slug, num (Roman), name, number (as printed), cf (as printed), key, keys (key changes, plain words), time, tempo,
#   bpm (quarter notes per minute), bars, first (first printed bar number), minutes, level, pages (score pages),
#   rate: the left-hand accent rate: an accent falls on eighth note n (counting from 0 at bar 1) when
#         floor((n+1)·rate) > floor(n·rate). rate = the number when it is under 1/2, else 1 − the number.
#         Checked against the accents printed in the opening bars of every movement.
#   eighths: eighth notes per bar;  cp: the number's key in the Rhythm of Numbers composer
#   sections: [start bar, bars, label as printed ("" = no mark), [phrase lengths]]
pdf: "/pdfs/Continued-Fraction-Suite-score.pdf"
pdf_size: "16 pages, 1.7 MB"
video: K0l47YsgopE
