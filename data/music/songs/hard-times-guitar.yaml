about: "One of the great American songs: a gentle, hymn-like tune about remembering people who are going through hard days. It has been sung around campfires and at gatherings for more than 150 years. Learn the tune first (it stays on the top three strings), then strum the chords with the folk strum. When a bar has two or three chords, change on the beat the chord line shows, and keep the hand moving."
source: "Melody and harmony checked against the Mutopia Project edition of “Hard Times Come Again No More” (voice and piano, from Foster’s Melodies, New York: Horace Waters; public domain), read twice. Moved from E-flat major to G major (down a minor sixth, in the guitar’s octave); chords simplified from Foster’s bass line."
