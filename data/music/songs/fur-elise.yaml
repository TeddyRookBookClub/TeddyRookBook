about: "This is the famous opening section, with both of its repeats. The whole piece is a rondo that keeps coming back to this music, and our version ends the way the piece ends. The hands take turns: the left hand plays a quick rising chord, then the right hand answers. Keep the E and D-sharp light, like a question."
source: "Mutopia Project edition (Stelios Samelis, from Breitkopf & Härtel, 1888; public domain), compared with this file note by note by our checking script. We stop after the second time through bars 10 to 22 and finish with the piece’s last bar. Dates and form from Wikipedia."
