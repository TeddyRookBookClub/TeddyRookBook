about: "The old English tune, played the way a lutenist or a folk guitarist would: the melody on the middle and top strings, with a bass note from the thumb on each big beat. Count two groups of three in every bar. Learn the tune alone first, slowly, then add the bass notes; most of them are open strings, so the left hand can stay with the tune."
source: "Melody as in our piano version of Greensleeves, which was checked note by note against the Mutopia Project’s “Greensleeves” hymn setting (public domain); here it sounds an octave lower. The bass notes are ours, chosen from that setting’s bass line. Our checking script compares the two melodies beat by beat."
