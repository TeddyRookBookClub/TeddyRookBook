about: "A Southern hymn that bluegrass banjo players learn early. The melody note falls on the beat, and the roll fills the space between with open strings that ring, often with the short 5th string. Play the melody notes a little louder than the roll notes. The letters under the tab are the picking fingers: T thumb, I index, M middle."
source: "The melody is the one in our piano arrangement of Amazing Grace, which was checked note by note against the Mutopia Project’s “New Britain” hymn setting (public domain); here it sounds an octave lower, as it does on the banjo, with roll notes added between the melody notes. Our checking script compares the two melodies beat by beat."
