slug: angeline-the-baker-banjo
title: "Angeline the Baker"
composer: "Traditional (American)"
work: "Old-time fiddle tune; the title comes from Stephen Foster’s song “Angelina Baker” (1850)"
arranged: "Teddy Rook Book: clawhammer in double C tuning, moved from D to C and down an octave; a few eighth notes are hammer-ons and the 5th string stands in for one high G"
instrument: banjo
tuning: doublec
capo: 0
style: "old-time"
technique: ["clawhammer"]
level: intermediate
order: 1
key: C
time: 4/4
tempo: 84
pickup: 0
skills: ["double C tuning", "strikes on the beat", "drop-thumb", "hammer-ons and a pull-off", "C and F chords"]
about: "A gentle, singing old-time tune, a favorite at jams because the melody is plain and lovely. It sits well in double C tuning (g C G C D): most notes are open strings or the 2nd fret. Every finger stroke falls on a beat; the eighth notes between come from the thumb (on the 5th string, or dropped onto the 3rd string) or from a hammer-on with the left hand. Fiddlers play it in D: put a capo at the 2nd fret (and raise the 5th string to A) to play along with them."
source: "Melody checked note by note against an ABC transcription of “Angeline the Baker” (in D) in John Chambers’s tune collection at MIT (trillian.mit.edu), moved down a step to C and an octave lower. We leave out the pickup notes and start on the downbeat. Every melody note of that version is in our tab at its time (one high G is played on the 5th string, an octave up). Chords are ours. History of the title from Wikipedia."
