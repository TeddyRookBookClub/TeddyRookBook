pickup: 1
skills: ["slowly changing left-hand chords", "a singing right hand", "chords that move by half steps", "pedal"]
about: "Chopin marked this prelude Largo: very slow. The right hand sings just a few notes, often only B and C, while the left-hand chords sink one half step at a time. Listen to how each new chord changes only one note. The music swells in the middle, then fades into silence before the last chords."
source: "Mutopia Project edition (Magnus Lewis-Smith, from the Peters edition, 1879; public domain), compared with this file note by note by our checking script. A turn and two grace notes in that edition are left out. The half-step motion is described in Wikipedia’s article on the prelude."
