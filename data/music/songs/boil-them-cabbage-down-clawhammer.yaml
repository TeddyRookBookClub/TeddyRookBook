about: "A cheerful old-time song about a simple supper, and one of the first tunes most banjo players learn. Every bar is one bum-ditty: strike the melody note with your fingernail (S), brush down across the top three strings (D), then catch the 5th string with your thumb (T). The melody lives in the strikes."
source: "Melody checked note by note against the tab printed in Wikipedia’s article “Boil Them Cabbage Down” (its fiddle and chromatic-instrument versions agree), moved to G on the banjo’s 2nd and 3rd strings. We keep one note per beat, so the repeated eighth notes of the tune become one strike and a brush. Chords are our own (G, C and D, the usual ones for this tune)."
