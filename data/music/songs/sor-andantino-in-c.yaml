slug: sor-andantino-in-c
title: "Andantino in C"
composer: "Fernando Sor (1778–1839)"
work: "Andantino, one of Sor’s short lessons for beginners, as printed in A. Eggers’s Guitar-Skole (19th century)"
arranged: "Teddy Rook Book: Sor’s notes as written. In bars 17–23 the inner G (a third voice in the edition) is written into the tune’s part with ties, so it sounds as printed. Fingerings and accents left out."
instrument: guitar
tuning: standard
capo: 0
voice: nylon
style: "classical"
technique: ["fingerpicking"]
level: beginner
order: 8
key: C
time: 4/4
tempo: 100
pickup: 0
skills: ["a tune over a held bass", "rest strokes with i and m", "first position", "the open 3rd string as an inner voice"]
about: "A calm two-part piece: a tune in quarter and half notes on the top three strings, over slow bass notes played by the thumb. Let the bass notes ring for their full length while the fingers walk on above them. In the middle section the open G string sounds between the tune and the bass, like a soft bell; in the last part the opening tune comes back with a new ending."
source: "Mutopia Project edition (from A. Eggers’s Guitar-Skole, The Royal Library, Copenhagen; CC BY-SA 3.0 typesetting, the music public domain). All three voices read twice and compared with this file note by note."
