slug: front-porch-blues
title: "Front Porch Blues"
composer: "Teddy Rook Book (original)"
work: "A twelve-bar blues in E, written for this course in the style of the early country blues"
arranged: "Teddy Rook Book: an original piece; the shuffle on two strings is the common blues accompaniment pattern, and the turnaround is our own"
instrument: guitar
tuning: standard
