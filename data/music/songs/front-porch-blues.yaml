skills: ["the twelve-bar blues", "a two-string shuffle", "swing eighths", "palm muting (optional)"]
about: "The blues shuffle every guitarist learns: two strings at a time, the low string open and the finger rocking between the 2nd and 4th frets on the string next to it. Play the eighths long-short, like a heartbeat (that’s swing). The twelve bars move from E to A and back, up to B7, and the last bar walks down the 2nd string into the B7 chord to send you around again. Pick everything with down strokes at first."
source: "Original composition by Teddy Rook Book for this course (no source needed); the twelve-bar form and the shuffle pattern are traditional."
