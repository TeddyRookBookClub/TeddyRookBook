slug: devils-dream-banjo
title: "Devil’s Dream"
composer: "Traditional (British Isles), a favorite of Southern fiddlers and bluegrass banjo players"
work: "Reel, printed in American fiddle books in the 1800s"
arranged: "Teddy Rook Book: three-finger banjo with a capo at the 2nd fret, fingered in G so it sounds in A with the fiddle; an octave below the fiddle"
instrument: banjo
tuning: openg
capo: 2
style: "bluegrass"
technique: ["three-finger rolls"]
level: intermediate
order: 8
key: A
time: 4/4
tempo: 80
pickup: 0
skills: ["playing with a capo", "every note of a fast reel", "the 5th string as a melody note", "pull-offs in a row", "the I M T M roll shape"]
about: "A busy reel whose A part rocks back and forth on one high note. Fiddlers play it in A, so banjo players put a capo at the 2nd fret (and raise the 5th string two frets, to A) and play it with G-position fingering: the tab and the chord names are counted from the capo, so they read like G, C and D. Almost every eighth note is a note of the tune. Start slowly; the roll shapes repeat, and so does the tune."
source: "Melody checked note by note against “Devil’s Dream” in Cole’s 1000 Fiddle Tunes (the 1940 reissue of Ryan’s Mammoth Collection, 1883), as transcribed in ABC by John B. Walsh at MIT’s abc collection (trillian.mit.edu). Played an octave lower; the fiddle’s sixteenth notes are our eighth notes, and the pickups are left out. Every note of that version is in our tab at its time. Chords are ours."
