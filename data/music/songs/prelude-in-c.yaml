skills: ["broken chords", "holding notes in the left hand", "steady sixteenth notes", "reading chord shapes"]
about: "Every bar is one chord, broken into the same pattern and played twice. The left hand holds its two notes while the right hand plays the rest of the chord. Find each chord shape with your hands first, then play the pattern slowly and evenly. Near the end the bass stays on a low G for eight bars before the music comes home to C."
source: "Mutopia Project edition (Tobias Erbsland; public domain), compared with this file note by note by our checking script."
