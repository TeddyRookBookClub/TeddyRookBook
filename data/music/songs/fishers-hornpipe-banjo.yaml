slug: fishers-hornpipe-banjo
title: "Fisher’s Hornpipe"
composer: "Traditional (British, 1700s), long played by Southern old-time and bluegrass musicians"
work: "Hornpipe, printed in many collections from the late 1700s on"
arranged: "Teddy Rook Book: three-finger banjo in G, moved up from the fiddle’s F and down an octave; the first half of the B part goes up the neck to the 7th fret"
instrument: banjo
tuning: openg
capo: 0
style: "old-time"
technique: ["three-finger rolls"]
level: intermediate
order: 7
key: G
time: 4/4
tempo: 80
pickup: 0
skills: ["every note of the tune with three fingers", "hammer-ons, pull-offs", "up the neck at the 7th fret", "backward roll shapes", "G, C, Am, D and D7"]
about: "A bright hornpipe that came over from the British Isles and stayed in the fiddle and banjo repertoire of the South. In this arrangement almost every eighth note is a note of the tune, picked T I M without using a finger twice in a row. In bars 9 to 12 the left hand moves up to the 7th fret, where a D chord lies across the top three strings; in bars 13 and 14 the fingers fall into C and G roll shapes."
source: "Melody checked note by note against “Fisher’s Hornpipe” in Ryan’s Mammoth Collection (Boston, 1883), as transcribed in ABC at MIT (trillian.mit.edu, contributed by John Chambers). Moved from F to G and down an octave; the fiddle’s sixteenth notes are our eighth notes, and the pickups are left out. Every note of that version is in our tab at its time, except where a bar ends with a held note. Chords are ours."
