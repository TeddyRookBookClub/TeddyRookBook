about: "Old-time and bluegrass bands slow down for a waltz at the end of the evening, and the banjo rolls along in threes. This one is our own. Each bar is six eighth notes: one roll, with the melody note on the first beat. Most bars use the forward roll from the thumb or the index finger; bar 13 uses the backward roll (M I T). Let the open strings ring, and play the first note of each bar a little louder."
source: "Original composition by Teddy Rook Book for this course (no source needed); the rolls are the standard three-finger patterns."
