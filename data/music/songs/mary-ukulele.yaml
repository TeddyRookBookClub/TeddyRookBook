about: "A first tune to pick, using only three notes at the start: E on the open 2nd string, D at the 2nd fret of the 3rd string, and C on the open 3rd string. In bar 4 the G is the open 4th string, the ukulele’s high G. To strum along, play C and G7 with four down strums in every bar; a friend can pick the tune while you strum."
source: "Melody as in our piano version of Mary Had a Little Lamb, which was checked against a note-name sheet from the University of California, Riverside (gluckprogram.ucr.edu). The chords are our own. Our checking script compares the two melodies beat by beat."
