slug: moonlight-sonata-first-movement
title: "Moonlight Sonata, first movement"
composer: "Ludwig van Beethoven"
work: "Piano Sonata No. 14 in C-sharp minor, Op. 27 No. 2 (1801): Adagio sostenuto"
level: advanced
order: 5
key: "C#m"
time: 2/2
tempo: 54
beat: 4
pickup: 0
skills: ["triplets", "melody and accompaniment in one hand", "pedal", "very soft playing"]
about: "Beethoven asked for the whole movement to be played very delicately and without dampers, which on a modern piano means keeping the pedal down and changing it with the harmony. The right hand does two jobs at once: steady triplets underneath and a slow melody on top, played by the little finger. The left hand plays deep octaves."
source: "Mutopia Project edition (Stewart Holmes, from the 1908 Berners edition edited by A. Winterberger; the typesetting is CC BY-SA 2.5, the music public domain), compared with this file note by note by our checking script. We read the source twice, from its A4 and letter files, and the notes agree. That edition writes some triplets on the lower staff; here every triplet is on the upper staff, played by the right hand. Fingering from that edition. Dates and the meaning of “senza sordino” from Wikipedia."
