about: "Many of the oldest banjo tunes from the Southern mountains are modal: they use a flat seventh, so in G you hear F instead of F♯, and the chords are just G and F. That gives tunes in the style of “Cluck Old Hen” and “Cumberland Gap” their lonesome, ringing sound. This one is our own. The first part sits on the 1st string, where the F is at the 3rd fret; the second part drops to the 4th string, where F is also at the 3rd fret. Every cell is a bum-ditty; where you see a hammer-on or pull-off, it fills the “and” after the strike."
source: "Original composition by Teddy Rook Book for this course (no source needed). It is written in the modal style of old Southern banjo tunes like “Cluck Old Hen” and “Cumberland Gap”, but the melody is our own."
