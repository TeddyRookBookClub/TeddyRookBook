skills: ["an alternating thumb bass", "pinches (thumb and finger together)", "C, A7, D7 and G7", "melody between the bass notes"]
about: "In Travis picking the thumb swings back and forth between two bass strings on every beat, like a steady train, while the index and middle fingers pick a tune in the spaces between. On the C chord the thumb plays the 5th, 4th, 6th and 4th strings (the ring finger hops to the 3rd fret of the 6th string for the third beat). Learn the thumb part of each chord until it runs by itself, then add the fingers. Where a finger note lands on the beat with the thumb, pluck them together: that’s a pinch."
source: "Original composition by Teddy Rook Book for this course (no source needed); the style and the chord circle are traditional."
