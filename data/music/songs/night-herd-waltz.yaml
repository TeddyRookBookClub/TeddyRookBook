about: "Cowboys on the old cattle trails took turns riding slowly around the herd at night, and they sang to keep the cattle calm. Many of their songs were slow waltzes like this one. Strum it with the waltz pattern: the thumb or pick plays the bass note of the chord on beat 1, then two light down strums. Then pick the tune, which never leaves the top three strings."
