slug: carulli-waltz-in-c
title: "Waltz in C"
composer: "Ferdinando Carulli (1770–1841)"
work: "Waltz, Op. 241 No. 1, from Carulli’s easy pieces for guitar, as printed in A. Eggers’s Guitar-Skole"
arranged: "Teddy Rook Book: Carulli’s notes as written, with the repeats as printed and the “D.C. al Fine” written out (bars 25–40, played once each). Fingerings and the one accent left out; dynamics are our suggestion."
