skills: ["bass and chord: thumb, then two fingers together", "3/8 time", "first position", "C, G7 and A minor shapes"]
about: "A little waltz in the old one-two-three: a bass note on the first beat, then two soft pairs of notes. The thumb (p) plays the bass on the 4th, 5th or 6th string; the index and middle fingers (i and m) pluck the two higher notes at the same moment. The middle part moves to A minor; then the first two parts come back once more. Keep the bass a little louder than the chords."
source: "Mutopia Project edition (Louie van Bommel, from A. Eggers’s Guitar-Skole, The Royal Library, Copenhagen; CC BY 4.0 typesetting, the music public domain). Both voices read twice and compared with this file note by note."
