about: "One of the best-known first pieces. It comes from Anna Magdalena Bach’s music notebook of 1725, and today it is credited to Christian Petzold. Each half is played twice. Keep the quarter notes even and the eighth notes smooth, and let the left hand move calmly underneath."
source: "Mutopia Project edition of BWV Anh. 114 (entered by Allen Garvin from the Bach-Gesellschaft edition; public domain), compared with this file note by note by our checking script. The ornaments in that edition (mordents, a trill and a grace note) are left out. Attribution from Wikipedia."
