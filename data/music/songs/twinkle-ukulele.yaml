about: "Three chords, C, F and G, and a tune you already know. Pick the tune first: it lives on the first three frets, with the open strings doing much of the work. Then strum the chords with the island strum (down, down-up, miss, up-down-up), changing chord on beat 3 when two chords share a bar."
source: "Melody as in our piano version of Twinkle, Twinkle, Little Star, which was checked against the theme of Mozart’s Variations on “Ah vous dirai-je, maman”, K. 265 (Mutopia Project, public domain). The chords follow that version’s left hand. Our checking script compares the two melodies beat by beat."
