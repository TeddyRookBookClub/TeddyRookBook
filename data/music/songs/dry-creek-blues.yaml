skills: ["a steady thumb bass (monotonic bass)", "hammer-ons", "blue notes", "a turnaround"]
about: "In the early country blues the thumb is the drummer: it plays a steady beat on the open bass string of the chord (E, A or the B on the 5th string) and never stops, while the fingers play short answering phrases on the top strings. Practice the thumb alone until it runs by itself, then add the fingers one bar at a time. The quick hammer-ons from G to G-sharp, and from G to A in the A bars, give the music its blues sound; the last bar is a turnaround that walks down the 4th string back to B7."
source: "Original composition by Teddy Rook Book for this course (no source needed); the twelve-bar form, the steady-thumb style and the turnaround idea are traditional, the licks are our own."
