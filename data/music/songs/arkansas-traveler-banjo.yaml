slug: arkansas-traveler-banjo
title: "Arkansas Traveler"
composer: "Traditional (American); credited to Sanford C. Faulkner of Arkansas"
work: "Fiddle tune, first published in 1847; played across the South ever since"
arranged: "Teddy Rook Book: three-finger (Scruggs-style) banjo in G, moved from the fiddle’s D; most of the B part is an octave lower than the fiddle plays it"
instrument: banjo
tuning: openg
capo: 0
style: "bluegrass"
technique: ["three-finger rolls"]
level: intermediate
order: 4
key: G
time: 4/4
tempo: 92
pickup: 0
skills: ["alternating-thumb roll", "melody inside rolls", "pull-offs and a hammer-on", "the 5th string as a melody note", "G, C, D and D7"]
about: "A famous old fiddle tune, tied to a comic story of a lost traveler and a backwoods fiddler. The A part uses the alternating-thumb roll (T I T M) with the melody on the thumb; the B part runs down the scale with pull-offs on the 3rd and 2nd strings. In bar 7 the open 5th string plays the high G of the melody."
source: "Melody checked note by note against “Arkansas Traveller” in Ryan’s Mammoth Collection (Boston, 1883; reissued as Cole’s 1000 Fiddle Tunes), as transcribed in ABC by John Chambers at MIT (trillian.mit.edu). Moved from D to G; the fiddle’s sixteenth notes are our eighth notes. The note on every beat matches that version (on the beat or an eighth after it); between the beats we keep most of the tune and fill the rest with roll notes. The pickup is left out. History from Wikipedia."
