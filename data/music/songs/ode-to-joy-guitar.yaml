about: "Beethoven’s famous tune, with a bass note under it, the way classical guitarists play two parts at once. The thumb (p) plays the low notes on the 5th and 6th strings and lets them ring; the index and middle fingers (i and m) take turns on the tune, on the top three strings. Learn the tune alone first, then add the bass notes on beat 1 (and beat 3 when the chord changes)."
source: "Melody and bass as in our piano version of Ode to Joy, whose melody was checked note by note against the Mutopia Project’s “Ode to Joy” hymn setting (public domain); the bass follows that setting’s chords, with the G moved down an octave to the guitar’s 6th string. Our checking script compares the two melodies beat by beat."
