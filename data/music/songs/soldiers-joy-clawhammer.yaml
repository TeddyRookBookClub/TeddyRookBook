about: "One of the oldest and best-loved fiddle tunes, played at Southern dances for well over a century. In open D tuning (f♯ D F♯ A D) the A part falls under the hand: strike the melody on the beat and let the thumb answer on the 5th string between strikes (double thumbing). The B part climbs the 1st string with hammer-ons and pull-offs, and the thumb drops to the 2nd string for a few notes."
source: "Melody checked note by note against “The Soldier’s Joy; or, Milanese Contre Dance” in Köhler’s Violin Repository, vol. 2 (Edinburgh, 1885), as transcribed in ABC by John Chambers at MIT (trillian.mit.edu); the book itself is on archive.org. Played an octave lower, starting on the downbeat. Every melody note is in our tab at its time; between the beats in the A part the 5th string plays the same note name an octave higher. History from Wikipedia and the Library of Congress’s Folklife blog."
