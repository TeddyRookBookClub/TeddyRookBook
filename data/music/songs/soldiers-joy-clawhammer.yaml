title: "Soldier’s Joy (clawhammer)"
composer: "Traditional (Scottish, then American)"
work: "Reel or country dance, printed in Britain from the late 1700s; an old-time standard in the American South"
arranged: "Teddy Rook Book: clawhammer in open D tuning, an octave below the fiddle; the 5th string’s high F♯ stands in for the low F♯ between the beats"
