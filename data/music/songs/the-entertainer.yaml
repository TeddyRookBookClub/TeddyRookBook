about: "Ragtime sets a steady, march-like left hand against a right hand that lands just off the beat. The left hand jumps: a low bass note on the beat, then a chord in the middle of the keyboard. Practice the left hand alone until the jumps feel easy. Joplin wrote “Not fast” at the top."
source: "Mutopia Project edition (Chris Sawer, from a reproduction of the original 1902 edition; public domain), compared with this file note by note by our checking script, except the last bar, where we leave out the three notes that lead into the next strain."
