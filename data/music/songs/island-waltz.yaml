about: "A waltz of our own for practicing a fingerpicking pattern. The thumb plays the root of each chord on beat 1, then the index, middle and ring fingers take the 3rd, 2nd and 1st strings and come back down, six even eighth notes per bar. The tune moves through the vamp twice, A7 to D7 to G: in G, that’s the same chord turn as D7–G7–C in C. Learn the pattern on a G chord first; then pick the tune, or have a friend pick it while you play the pattern."
source: "Our own tune, written for this course (no outside source). The A7–D7–G turn is the vamp described in our chapter on Hawaiian song style."
