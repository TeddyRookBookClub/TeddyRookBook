skills: ["triplet arpeggios: a, m, i", "a tune on the 1st string up the neck", "barre chords at the 5th and 7th frets", "shifting positions"]
about: "One of the best-loved pieces for classical guitar. Every beat is three notes: the ring finger (a) plays the tune on the 1st string, then the middle (m) and index (i) fingers play the 2nd and 3rd strings, while the thumb (p) plays a slow bass. Bring the tune out a little louder than the other two notes. The left hand travels: the tune climbs to the 12th fret in bar 5, uses a barre at the 5th fret for A minor and at the 7th fret for B7, then comes home to first position."
source: "Mutopia Project edition of “Spanish Romance” (anonymous, from a manuscript; CC BY-SA 2.5 typesetting, the music public domain). Melody, middle voice and bass read twice and compared with this file note by note; the second part (bars 17–32) is not included."
