title: "Romance (Spanish Romance)"
composer: "Anonymous"
work: "Romance, a 19th-century Spanish guitar piece of unknown authorship, also called “Romance de amor” or “Spanish Romance”: the first part, in E minor"
arranged: "Teddy Rook Book: the first part (bars 1–16) as written, without the second part in E major. Each beat is written as three notes, the tune on the first, as most guitarists read it."
