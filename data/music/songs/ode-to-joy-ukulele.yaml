about: "Beethoven’s tune moves almost entirely by step, so it’s a good first tune for low-G tuning. Most of it sits on the 2nd and 3rd strings; in bar 12 the tune drops to the low G, the open 4th string, a note a high-G ukulele doesn’t have. Pick it with your thumb or index finger, then strum C and G7 with down-up eighths, or play the tune while a friend strums."
source: "Melody as in our piano version of Ode to Joy, which was checked note by note against the Mutopia Project’s “Ode to Joy” hymn setting (public domain). The chords are our own. Our checking script compares the two melodies beat by beat."
