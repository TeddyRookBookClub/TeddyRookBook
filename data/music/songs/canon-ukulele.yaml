about: "Pachelbel’s eight chords, D A Bm F♯m G D G A, repeat every two bars from start to finish: strum them first, one down strum per chord, until they flow. The tune comes in at bar 3, the first violin’s part, slow notes and then eighth notes. Its first notes walk down the 1st string from the 9th fret; in bar 9 the hand moves up to the 9th position for a quick climb to the high A; the low B in bar 8 is the 4th fret of the low G string. Two players sound best here: one strums the chords and the other picks the tune."
source: "Melody as in our piano version of the Canon, which was checked note by note against the score of the opening on Wikipedia’s “Pachelbel’s Canon” page (first violin). The chords are the ones of Pachelbel’s bass line. Our checking script compares the two melodies beat by beat."
