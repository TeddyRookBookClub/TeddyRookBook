about: "A two-chord song in G. The tune uses the open 4th string (G) and the first string (A, B, C and D at frets 0, 2, 3 and 5), so the picking hand jumps across the strings: that’s normal on a ukulele, whose highest and lowest notes sit on the two outside strings. To strum, use down-up eighth notes; in bars 7 and 15 change from G to D7 halfway through the bar."
source: "Melody as in our piano version of Lightly Row, which was checked note by note against the “Hänschen klein” page of the German Wikibooks songbook (LilyPond). The chords follow that version’s left hand. Our checking script compares the two melodies beat by beat."
