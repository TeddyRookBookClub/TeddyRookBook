about: "The tune stays on the open strings and the first three frets, and it leans on the open E string. The strum is the folk strum: down, down-up, (miss), up-down-up. Keep the hand moving down and up even where it misses the strings, and the rhythm takes care of itself. Bar 7 changes from C to G7 halfway through."
source: "Melody as in our piano version of Jingle Bells, whose chorus was checked note by note against an ABC tune file from a University of Calgary course page (pages.cpsc.ucalgary.ca). The chords follow that version’s left hand, with G7 for G. Our checking script compares the two melodies beat by beat."
