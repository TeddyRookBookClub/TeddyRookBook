skills: ["D major", "left-hand octave jumps", "both hands playing the same notes", "sixteenth notes"]
about: "A musette is a dance named after a small bagpipe, and the left hand imitates its drone by jumping between low and high D. In bars 3 and 4 both hands play the same notes, two octaves apart. Bars 5 to 8 repeat the opening, and each half of the piece is played twice."
source: "Mutopia Project edition of BWV Anh. 126 (Allen Garvin, from the Bach-Gesellschaft edition; public domain), compared with this file note by note by our checking script. IMSLP notes that Bach’s authorship is uncertain."
