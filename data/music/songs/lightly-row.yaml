about: "This tune lives in G position: right thumb on the G above middle C, left little finger on the low G. The right hand uses only the five notes under its fingers. The first and last lines skip around the G chord (G, B, D); the middle lines move by step."
source: "Melody checked note by note against the “Hänschen klein” page of the German Wikibooks songbook (LilyPond, in D major), moved up to G. English Wikipedia’s article on “Hänschen klein” says its melody is the tune of “Lightly Row”. The left hand is our own and follows that page’s chord symbols."
