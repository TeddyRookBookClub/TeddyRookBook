composer: "Traditional American hymn tune “Foundation” (words by “K” in Rippon’s Selection, 1787)"
work: "Hymn tune first printed in Joseph Funk’s shape-note book A Compilation of Genuine Church Music (1832)"
arranged: "Teddy Rook Book: the melody in three-finger rolls on open strings and the 2nd fret, an octave below the hymnbook"
