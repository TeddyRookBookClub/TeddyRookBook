skills: ["forward and alternating-thumb rolls", "melody with the thumb", "open strings", "a C chord and a D chord", "a pinch to end"]
about: "A five-note (pentatonic) hymn tune from an early shape-note singing book made in Virginia’s Shenandoah Valley. Almost every melody note is an open string or the 2nd fret, so it is a good first tune for rolls: the thumb plays the melody on the 4th and 3rd strings, the index the 2nd string, the middle the 1st, and the roll keeps the banjo ringing through the long notes. Play the melody notes a little louder than the roll."
source: "Melody checked note by note against the Mutopia Project’s “Foundation” hymn setting (SATB, public domain tune; the soprano line), played here an octave lower. History of the tune from Wikipedia’s article “How Firm a Foundation”. Every melody note falls on its beat; the roll notes between are ours, and so are the chords."
