slug: soldiers-joy-rolls
title: "Soldier’s Joy (three-finger rolls)"
composer: "Traditional (Scottish, then American)"
work: "Reel or country dance, printed in Britain from the late 1700s; an old-time standard in the American South"
arranged: "Teddy Rook Book: three-finger banjo in open G tuning, played in D with D and A chord shapes, an octave below the fiddle"
instrument: banjo
tuning: openg
capo: 0
style: "bluegrass"
technique: ["three-finger rolls"]
level: intermediate
order: 5
key: D
time: 4/4
tempo: 84
pickup: 0
skills: ["playing in D in open G tuning", "alternating-thumb roll", "pinches", "pull-offs in the B part", "the D and A chord shapes"]
about: "Soldier’s Joy again, now in bluegrass style. You stay in open G tuning and play in D, with the D shape (0 2 3 4) and the A shape (a barre at the 2nd fret) under the left hand. The A part is an alternating-thumb roll with the thumb on the melody; the B part moves to the top strings, with pull-offs for the quick notes. Compare it with our clawhammer version in open D tuning: same tune, two ways."
source: "Melody checked against “The Soldier’s Joy; or, Milanese Contre Dance” in Köhler’s Violin Repository, vol. 2 (Edinburgh, 1885), as transcribed in ABC by John Chambers at MIT (trillian.mit.edu); the book is on archive.org. Played an octave lower, starting on the downbeat. The note on every beat matches that version (on the beat or an eighth after it); between the beats we keep many of the tune’s notes and fill the rest with roll notes."
