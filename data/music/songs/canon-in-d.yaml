slug: canon-in-d
title: "Canon in D"
composer: "Johann Pachelbel"
work: "Canon and Gigue in D major for three violins and bass (date unknown, about 1680–1706): the opening"
arranged: "Teddy Rook Book: simplified for piano, keeping the bass line and the first violin part of the opening"
level: intermediate
order: 1
key: D
time: 4/4
tempo: 60
pickup: 0
skills: ["a repeating bass line (ground bass)", "D major (key signature: two sharps)", "eighth notes", "hands together"]
about: "The left hand plays the same eight bass notes over and over, two bars at a time, just as the cello does in Pachelbel’s piece. Learn that pattern first: it never changes. Then add the right hand, which plays the first violin part: slow notes at first, then flowing eighth notes."
source: "Notes checked note by note against the score of the opening on Wikipedia’s “Pachelbel’s Canon” page (violin I and cello). We keep those two lines for bars 1 to 10 and add a final D chord."
