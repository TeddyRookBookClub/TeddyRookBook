about: "A practice tune of our own for the island strum. Its last four bars are a vamp: D7, G7, C, the little chord turn that Hawaiian musicians play to end a song or to fill the space between verses. Learn those four bars until your hand finds D7 and G7 without looking; you’ll meet the same turn in many songs. The tune itself uses only chord tones, so you can pick it while a friend strums."
source: "Our own tune, written for this course (no outside source). The chords around it are the common ones of the key of C; the D7–G7–C turn is the vamp described in our chapter on Hawaiian song style."
