about: "Pierpont published this song in 1857 as “The One Horse Open Sleigh.” The chorus everyone sings today is a later, simpler tune, and nobody knows who changed it. Keep your right hand still in C position and let the repeated E’s bounce lightly."
source: "Chorus checked note by note against an ABC tune file from a University of Calgary computer science course (pages.cpsc.ucalgary.ca), moved down an octave. History from Wikipedia: the original 1857 chorus was different, and today’s chorus was recorded by 1898. The left hand is our own."
