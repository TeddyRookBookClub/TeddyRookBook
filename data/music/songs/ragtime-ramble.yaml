about: "A practice tune of our own in the style the ukulele was famous for in the 1910s and 1920s. Its chords walk around the circle of fifths, E7, A7, D7, G7 and home to C, each pulling to the next: the chain behind many songs of that time. Play the eighth notes long-short (swung), and lean on beats 2 and 4 of the strum. The tune is made of the notes of each chord, so it also shows you where those notes are."
source: "Our own tune, written for this course (no outside source). The chord chain is the one known as the ragtime progression."
