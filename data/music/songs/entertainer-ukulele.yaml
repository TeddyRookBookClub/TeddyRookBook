about: "Joplin’s famous rag, published in 1902, more than a decade before the ukulele craze reached the mainland. Ragtime puts tune notes just ahead of the beat and ties them over it: count “1 e and a 2 e and a” and say the tied notes out loud before you play. The jumps in bars 1 and 5, from the open E string up to C at the 3rd fret of the 1st string, are easier than they look. Joplin wrote “Not fast”; we suggest a slower tempo still. To strum, play down-up eighths with a little weight on beat 2."
source: "The notes are Joplin’s, from our piano version of The Entertainer, which was checked note by note against the Mutopia Project edition (from a reproduction of the 1902 edition; public domain). We take its first strain once, ending on the chord of the second ending. Our own check compares every tab note with the piano version’s right hand at the same moment."
