about: "Four chords stepping down, A minor, G, F, E, are the sound of Andalusia in southern Spain, heard in its folk songs and guitar music for centuries. The tune leans on the step from F up to G-sharp, a wide, exotic-sounding step, and always comes to rest on E. Pick the tune first, then strum the chords: a strong accented down strum on beat 1, a muted chuck on beat 3. (Real flamenco strumming, the rasgueado, flicks the fingers out one by one; this strum is a first step toward it.)"
source: "Original composition by Teddy Rook Book for this course (no source needed); the chord pattern is traditional."
