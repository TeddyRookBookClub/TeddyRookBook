about: "Eight bars of broken chords from Carcassi’s guitar method, the kind of short prelude players used to warm up in a new key. Each half bar is one chord: the thumb (p) plays the bass note on the 4th, 5th or 6th string and lets it ring, then the index, middle and ring fingers (i, m, a) play the 3rd, 2nd and 1st strings. Hold the whole chord shape down for the half bar, so every note rings into the next."
source: "Mutopia Project edition of Carcassi’s Preludes in Progressive Keys, Op. 59 (entered by Jeffrey Olson from the 1906 Oliver Ditson edition by G. C. Santisteban; public domain). Upper and lower voices read twice and compared with this file note by note."
