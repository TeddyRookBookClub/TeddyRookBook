about: "A short breakdown in two parts, built from the licks in the chapter on licks and fill-ins. The first part stays high on the 1st and 2nd strings and opens with the slide lick, the most common move in bluegrass banjo. The second part drops to the 4th string, where the thumb carries a low melody with hammer-ons. Like most fiddle tunes, play each part twice: A A B B. Start slowly; even rolls matter more than speed."
source: "Original composition by Teddy Rook Book for this course (no source needed). It is written in the style of old breakdowns like “Cripple Creek”, but the melody is our own; the slide, hammer-on and pull-off licks are common bluegrass banjo moves."
