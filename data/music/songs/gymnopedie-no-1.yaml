skills: ["a slow, even tempo", "left-hand leaps: bass note, then chord", "long held melody notes", "pedal"]
about: "Satie marked it “Lent et douloureux”: slow and sorrowful. In every bar the left hand plays a low bass note and then a soft chord in the middle of the keyboard. The melody floats above with long held notes. The opening chords rock gently between G major 7 and D major 7."
source: "Mutopia Project edition (Evin Robertson, from the Dover edition; public domain), compared with this file note by note by our checking script. That edition prints some of the accompaniment chords on the upper staff; here they are on the lower staff, because the left hand plays them. The repeat with first and second endings is as in that edition. Harmony and date from Wikipedia."
