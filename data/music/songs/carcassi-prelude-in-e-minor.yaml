about: "A rippling study over the open low E string. Count two big beats in each bar, each split into six quick notes: thumb on the bass, then the fingers climb to the top string and come back down. Let the bass ring through the whole half bar. The last note is a harmonic: touch the 1st string lightly right over the 12th fret, pluck, and lift the finger."
source: "Mutopia Project edition of Carcassi’s Preludes in Progressive Keys, Op. 59 (entered by Jeffrey Olson from the 1906 Oliver Ditson edition by G. C. Santisteban; public domain). Upper and lower voices read twice and compared with this file note by note."
