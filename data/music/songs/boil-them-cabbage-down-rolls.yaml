about: "The same tune as the clawhammer version, now with three fingers and picks. Most of it is the forward roll started from the index finger, I M T, I M T, I M, so the melody notes on the 2nd string (B and C) come out on the beat and just after it, with the open 1st and 5th strings ringing around them. Play it twice: the first time take ending 1 back to the start, the second time skip to ending 2 and finish with a pinch."
source: "Melody checked against the tab printed in Wikipedia’s article “Boil Them Cabbage Down” (the same notes as our clawhammer version, in the same octave). The melody notes fall on the first beat of each half bar or within a beat after it, inside the rolls; the roll notes between them are ours. Chords are our own (G, C and D)."
