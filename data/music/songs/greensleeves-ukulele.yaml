about: "Count six eighth notes in each bar, in two groups of three, and feel two slow beats. The tune twice reaches down to B below middle C, which only a low-G ukulele has: the 4th fret of the low G string. Pick the tune with your thumb, keeping your hand still over the first frets. For the chords, strum down-(miss)-up, down-(miss)-up, a lilting 6/8 strum; B7 is the one new shape."
source: "Melody as in our piano version of Greensleeves, which was checked note by note against the Mutopia Project’s “Greensleeves” hymn setting (public domain). The chords follow that version’s bass line. Our checking script compares the two melodies beat by beat."
