about: "Bach wrote the Inventions to teach playing two independent lines. The whole piece grows from the short idea in bar 1 (C D E F D E C), which passes back and forth between the hands and is sometimes turned upside down. Practice each hand alone, then put them together slowly."
source: "Mutopia Project edition (Jeff Covey, from the Bach-Gesellschaft edition; the typesetting is CC BY-SA 3.0, the music public domain), compared with this file note by note by our checking script. The trills and mordents in that edition are left out."
