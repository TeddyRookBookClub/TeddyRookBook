time: 4/4
tempo: 96
pickup: 0
skills: ["hands together", "C position", "dotted quarter notes", "one small move of the thumb"]
about: "Beethoven wrote this tune for the last movement of his Ninth Symphony. It mostly moves by step and stays in C position. In bars 4, 8 and 16, hold the dotted quarter note a little longer and play the short note right after it. In bar 12 your thumb drops down to the G below middle C, then comes back."
source: "Melody checked note by note against the Mutopia Project’s “Ode to Joy” hymn setting (SATB, public domain), moved from G down to C. The left hand is our own and follows that setting’s chords."
