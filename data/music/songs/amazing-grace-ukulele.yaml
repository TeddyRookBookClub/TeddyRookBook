about: "Hymns were among the first music Hawaiian choirs sang from printed notes in the 1800s, and hymn singing shaped many later Hawaiian songs. This one is in 3/4: count 1-2-3 and strum the waltz pattern, a thumb note on beat 1 and two light strums. The tune starts on beat 3 with a single pickup note, so the first chord comes on the next downbeat."
source: "Melody as in our piano version of Amazing Grace, which was checked note by note against the Mutopia Project’s “New Britain” hymn setting (public domain). The chords are our own, chosen so that every strong beat of the tune is a note of its chord. Our checking script compares the two melodies beat by beat."
