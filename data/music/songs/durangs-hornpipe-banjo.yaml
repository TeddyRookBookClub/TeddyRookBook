slug: durangs-hornpipe-banjo
title: "Durang’s Hornpipe"
composer: "Attributed to Mr. Hoffmaster, John Durang’s violin teacher (about 1785); long since a traditional fiddle tune"
work: "Hornpipe written for the American dancer John Durang (1768–1822), first printed in 1814; an old-time favorite in the South"
arranged: "Teddy Rook Book: clawhammer in double C tuning with a capo at the 2nd fret (a D A D E), sounding in D with the fiddle; bars 7–8 and the B part an octave below the fiddle"
instrument: banjo
tuning: doublec
capo: 2
style: "old-time"
technique: ["clawhammer"]
level: intermediate
order: 6
key: D
time: 4/4
tempo: 76
pickup: 0
skills: ["double C with a capo (a D A D E)", "double thumbing", "drop-thumb on the 2nd, 3rd and 4th strings", "hammer-ons and pull-offs", "playing up to the 10th fret"]
about: "One of the oldest American fiddle tunes with a known story: Durang’s violin teacher wrote it for him around 1785, early in his career as a dancer, and it has been played for dancing ever since. With a capo at the 2nd fret, double C tuning becomes a D A D E (raise the 5th string to A, or use a spike), and the A part falls right under the clawhammer hand: strike the melody, and the 5th string answers with the tune’s own A between strikes. The tab and chord names are counted from the capo. In the B part the thumb drops to the inside strings for the notes between the beats."
source: "Melody checked note by note against “Durang’s Hornpipe” in Cole’s 1000 Fiddle Tunes (the 1940 reissue of Ryan’s Mammoth Collection, 1883), as transcribed in ABC by Bob Puckette at MIT’s abc collection (trillian.mit.edu). The fiddle’s sixteenth notes are our eighth notes; bars 7–8 and the whole B part are an octave lower than the fiddle, and the pickups are left out. Every note of that version is in our tab at its time. The tune’s story is from Wikipedia’s article on John Durang and IMSLP’s page for the tune; chords are ours."
