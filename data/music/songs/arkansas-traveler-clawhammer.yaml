slug: arkansas-traveler-clawhammer
title: "Arkansas Traveler (clawhammer)"
composer: "Traditional (American); credited to Sanford C. Faulkner of Arkansas"
work: "Fiddle tune, first published in 1847; played across the South ever since"
arranged: "Teddy Rook Book: basic clawhammer in double C tuning, one melody note on every beat (moved from D to C); bar 7 and most of the B part an octave below the fiddle"
instrument: banjo
tuning: doublec
capo: 0
style: "old-time"
technique: ["clawhammer"]
level: intermediate
order: 2
key: C
time: 4/4
tempo: 92
pickup: 0
skills: ["bum-ditty all the way through", "melody notes inside the brush", "double C tuning", "C, F and G chords"]
about: "The same tune as our three-finger Arkansas Traveler, played the old-time way. Every half bar is one bum-ditty: strike the melody note on the beat, then brush down on the next beat (the brush always contains that beat’s melody note) and catch the 5th string with your thumb. It is a good bridge from Boil Them Cabbage Down to the busier clawhammer tunes. To play in D with a fiddler, capo at the 2nd fret and raise the 5th string to A."
source: "Melody checked against “Arkansas Traveller” in Ryan’s Mammoth Collection (Boston, 1883; reissued as Cole’s 1000 Fiddle Tunes), as transcribed in ABC by John Chambers at MIT (trillian.mit.edu), moved down a step to C. We keep the note that falls on each beat (every one of them is in our tab, struck or inside the brush) and leave out the quick notes between beats. History from Wikipedia."
