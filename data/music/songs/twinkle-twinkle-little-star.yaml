slug: twinkle-twinkle-little-star
title: "Twinkle, Twinkle, Little Star"
composer: "Traditional (French tune, 1761; words by Jane Taylor, 1806)"
work: "The French song “Ah! vous dirai-je, maman” with the English poem “The Star”"
arranged: "Teddy Rook Book: the melody with a simple left hand"
level: beginner
order: 3
key: C
time: 4/4
tempo: 92
pickup: 0
skills: ["hands together", "C position with a reach to A", "bass clef: C, F and G"]
about: "The first piece for both hands. The left hand plays one slow note while the right hand sings the tune. Play each hand alone first, then put them together slowly. In the first line your right hand sits a little higher: thumb on C, finger 4 on G and finger 5 on A."
source: "Melody checked against the theme of Mozart’s Variations on “Ah vous dirai-je, maman”, K. 265 (Mutopia Project edition for two guitars, from the Porro print; public domain). The notes match. Mozart repeats the note on the long words (“star”, “are”) and adds two small decorations (bars 7 and 15); the song as sung holds a half note there instead. Dates from Wikipedia."
