"built":
- "Later Egyptians said that Menes, the first king, founded the city at the meeting point of Upper and Lower Egypt, the \"Balance of the Two Lands\". Its early name was Inbu-hedj, \"the White Walls\". The later name Mennefer (\"enduring and beautiful\") came from the pyramid town of Pepi I at nearby Saqqara, and the Greeks made it Memphis."
- "Memphis was the seat of government in the Old Kingdom and stayed one of Egypt's great cities through the New Kingdom and after, even when the kings lived elsewhere. Its largest temple was the house of Ptah. One name for that temple, ḥwt-kꜣ-ptḥ (\"the mansion of the ka of Ptah\"), is probably where the Greek name Aigyptos, \"Egypt\", comes from."
"survives":
- "Almost all of the city lies under fields, palm groves and the modern village; its mud-brick houses melted back into the floodplain, and its stone was carried off. The pyramids and tombs of Giza, Saqqara and Dahshur, on the desert edge to the west, are its cemeteries."
- "In the open-air museum at Mit Rahina lie a limestone colossus of Ramesses II, about 10 m long, and a large calcite sphinx whose king is not named (scholars debate whether it shows Amenhotep II or another 18th Dynasty ruler). A second colossus of Ramesses from the site stood in a Cairo square from 1955 and now stands in the Grand Egyptian Museum."
