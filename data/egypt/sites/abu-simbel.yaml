  - "name": "ramesses"
  "tl": "rꜥ-ms-sw"
  "en": "Ramesses (\"Ra is the one who bore him\")"
  "where": "On the colossi and throughout both temples."
  "about": "In September 1822 Champollion looked at copies of cartouches from Abu Simbel. He knew the sun disk was rꜥ in Coptic and guessed the folded cloth was s; the sign in between had to be ms, \"give birth\": Ra-mes-s, Ramesses. It showed that hieroglyphs wrote native Egyptian names with sound signs too, not only Greek ones."
  "reading": "The standard reading (Gardiner, Egyptian Grammar (3rd ed., 1957), Excursus A on the royal titulary); the Wikipedia article \"Decipherment of ancient Egyptian scripts\"."
