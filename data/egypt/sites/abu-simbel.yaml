  "en": "Usermaatre Setepenre (\"Strong is the Maat of Ra, chosen of Ra\")"
  "where": "Carved on the upper arms and chests of the colossi, and on the facade."
  "about": "The figure of Ra-Horakhty in a niche above the entrance holds a staff (wsr) and a figure of Maat, so the god himself spells out the king's throne name: a pun in stone."
