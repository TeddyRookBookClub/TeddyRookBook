"built":
- "Ramesses II had two temples cut into the sandstone cliffs on the Nile in Nubia, a land Egypt ruled at the time, where they would greet anyone coming up the river. The Great Temple is fronted by four seated colossi of the king, about 20 m high, and runs some 60 m into the rock to a sanctuary with statues of Ptah, Amun-Ra, the king himself and Ra-Horakhty. Twice a year, around 22 February and 22 October, the rising sun shines all the way in and lights the statues (all but Ptah, a god of the underworld)."
- "The Small Temple, for Hathor and Queen Nefertari, has six standing statues on its front, four of the king and two of the queen, all the same height. Inside the Great Temple, the battle of Kadesh fills one wall of the main hall."
"survives":
- "One colossus lost its head and chest in an earthquake soon after the temple was finished. Sand slowly covered the temples, and they were brought to Europe's notice by J. L. Burckhardt in 1813; Giovanni Belzoni dug his way in in 1817. On the leg of a colossus are Greek graffiti by soldiers of the pharaoh Psamtek II, who passed by in 591 BC."
- "When the Aswan High Dam was built, the rising lake would have drowned both temples. In an international campaign led by UNESCO, they were cut into more than a thousand blocks, some over 20 tons, and rebuilt between 1964 and 1968 inside an artificial hill about 65 m higher and 200 m back from the river."
