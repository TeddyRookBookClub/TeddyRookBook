"built":
- "Saqqara was the main cemetery of Memphis for three thousand years. The first kings' officials built big mud-brick mastabas along its edge. Then, in the 3rd Dynasty, King Djoser's builders, led by Imhotep, raised the Step Pyramid: six stone steps about 62 m high, inside a walled courtyard full of stone copies of shrines and buildings for the king's festival of renewal. It is the oldest large building of cut stone in the world."
- "Later kings built pyramids here too. The small pyramid of Unas (c. 2375–2345 BC), the last king of the 5th Dynasty, was the first with texts carved inside: the Pyramid Texts, spells for the king's life after death. Officials of the Old Kingdom built mastabas with the finest daily-life reliefs in Egypt (Ti, Ptahhotep, Mereruka), and in later times the sacred Apis bulls of Memphis were buried in the long underground galleries of the Serapeum, which Auguste Mariette found in 1850–51."
"survives":
- "The Step Pyramid has been restored, and its courtyard, colonnaded entrance and festival court can be walked through. Under it, a maze of galleries held stone vessels by the tens of thousands, and some rooms were lined with blue faience tiles and relief panels of the king."
- "Unas's pyramid is now a heap from outside, but its burial chamber and antechamber still carry the Pyramid Texts, cut in columns and filled with blue paint. Gaston Maspero entered it in 1881. The causeway leading to it, more than 700 m long, had painted reliefs; some survive."
