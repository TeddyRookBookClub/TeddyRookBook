"built":
- "From the early 18th Dynasty (probably beginning with Thutmose I) to the end of the 20th, the kings were buried in tombs cut deep into the rock of this valley, under a peak shaped like a pyramid, instead of under pyramids. Their memorial temples were built separately, along the edge of the farmland. The tombs were cut and painted by the workmen of Deir el-Medina, whose village lay over the hill."
- "A typical tomb is a long series of corridors and halls going down into the hill, painted with the books of the underworld that describe the sun god's journey through the night, which the king was believed to share."
"survives":
- "Almost every tomb was robbed in ancient times; at the end of the New Kingdom the priests gathered many royal mummies into caches to save them. Tutankhamun's small tomb, hidden under rubble from a later tomb, was the exception. Carter found its first step on 4 November 1922, working for Lord Carnarvon; it took ten years to empty the 5,398 objects in its stairway, corridor, antechamber, annex, burial chamber and treasury."
- "Tutankhamun's mummy is still in KV62; his treasures, including the gold mask, are in Cairo. A full-size copy of the burial chamber has been built near Howard Carter's house so that visitors can see it without harming the real one."
