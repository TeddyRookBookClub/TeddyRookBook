"built":
- "A temple of Hathor stood at Dendera from the Old Kingdom on, but the one standing today was built from about 54 BC, under Ptolemy XII, the father of Cleopatra, and decorated under the Roman emperors. It follows the standard temple plan: a great hypostyle hall whose columns have Hathor's face on all four sides, a second hall, offering halls and the sanctuary, with stairs up to the roof."
- "Each year Hathor's statue sailed south to Edfu to visit Horus for the Festival of the Beautiful Meeting. Around the temple are birth houses (mammisi), a sacred lake and, from Christian times, a church."
"survives":
- "The temple is nearly complete, with its roof, and much of its painted ceiling has been cleaned. On the outer back (south) wall, Cleopatra VII and her son by Julius Caesar, Ptolemy XV Caesarion, make offerings to the gods: one of the few large images of her."
- "A chapel on the roof had a round ceiling relief of the sky with the signs of the zodiac, a Greek idea. It was cut out in 1821 and taken to Paris; it is in the Louvre, and a cast is in its place."
