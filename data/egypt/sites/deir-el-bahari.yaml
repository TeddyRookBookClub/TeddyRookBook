"built":
- "Mentuhotep II, who reunited Egypt and began the Middle Kingdom, built his temple and tomb in this bay of cliffs. Five centuries later Hatshepsut built hers beside it, borrowing its idea of terraces: three wide levels joined by ramps, each fronted by a colonnade, rising to a sanctuary cut into the rock. It was a memorial temple for her and a station for Amun's boat in the Beautiful Festival of the Valley."
- "The reliefs tell the story of her reign: her birth as the daughter of Amun, the moving of two great obelisks from Aswan to Karnak, and an expedition by sea to the land of Punt for incense trees, ebony and animals."
"survives":
- "Late in the reign of Thutmose III, her stepson, many of Hatshepsut's images and names were cut out; why, and why so late, is still discussed. The temple was badly damaged by rockfalls and has been restored by a Polish-Egyptian mission since 1961."
- "In a tomb shaft just south of the temple (DB320), found in 1881, priests of the 21st Dynasty had hidden dozens of royal mummies, among them Seti I and Ramesses II, to save them from robbers."
