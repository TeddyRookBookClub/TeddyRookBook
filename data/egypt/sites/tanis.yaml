"built":
- "When the New Kingdom ended (c. 1069 BC), the kings of the 21st Dynasty ruled the north from Djanet, which the Greeks called Tanis and the Bible calls Zoan. Psusennes I surrounded the great temple of Amun with a huge mud-brick wall. Much of the stone in the temple came from older buildings, above all from Pi-Ramesses, the abandoned Delta capital of Ramesses II, so Tanis is full of obelisks and statues carved with his names."
- "Because of all those Ramesside monuments, early excavators thought Tanis was Pi-Ramesses itself, or even the Hyksos capital Avaris. Excavations at Qantir and Tell el-Dabʿa, about 25 km south, later showed that those cities lay there instead."
"survives":
- "The kings of Tanis were buried in stone tombs inside the temple enclosure. In 1939 and 1940 Pierre Montet found them: the burial of Psusennes I was unplundered, with a gold mask and a silver coffin, and the outer stone sarcophagus had been made for Merneptah of the 19th Dynasty and reused. The finds are in the Egyptian Museum in Cairo. Because the war began just then, the discovery got little attention compared with Tutankhamun's."
- "Today the site is a field of fallen granite blocks, obelisks and statues, with the walls of the royal tombs open to the sky."
