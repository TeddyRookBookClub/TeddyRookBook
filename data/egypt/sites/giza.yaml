"built":
- "Three kings of the 4th Dynasty built their pyramids here. Khufu's, the Great Pyramid, came first and is the largest; his son Khafre built the second, on higher ground so that it looks almost as tall; Menkaure's is much smaller. Each pyramid was the center of a complex: a temple against its east side, a covered causeway down to a valley temple at the edge of the floodplain, small pyramids for queens, and boat pits. The Great Sphinx, carved from a ridge of rock left in the quarry, lies beside Khafre's causeway and is usually credited to him."
- "Around the pyramids are streets of mastaba tombs for the royal family and officials. South of the plateau, excavators have found the town where the builders lived, with bakeries, breweries and their own cemetery. The pyramids were built by organized Egyptian crews, fed and housed by the state; how exactly the stones were raised (which ramps, which levers) is still argued over."
"survives":
- "The pyramids have lost almost all of their smooth white limestone casing, which was taken for building stone in medieval Cairo; some casing survives near the top of Khafre's pyramid and at the base of Khufu's. Inside the Great Pyramid are the descending passage, the unfinished underground chamber, the Grand Gallery and the King's Chamber with Khufu's granite sarcophagus."
- "Between the Sphinx's paws stands the Dream Stela of Thutmose IV (c. 1400–1390 BC), which tells how the Sphinx promised him the throne if he cleared away the sand: Giza was already an ancient monument then."
