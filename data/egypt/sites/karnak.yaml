"built":
- "When Theban kings ruled all Egypt, their god Amun became king of the gods, joined with the sun god as Amun-Ra, and his temple at Karnak became the richest in the land. Almost every king from the Middle Kingdom on added something: pylons (there are ten), courts, halls, obelisks, chapels and colossal statues, so that the temple grew outward from its old core along two axes, one toward the river and one south toward the temple of Mut."
- "The Great Hypostyle Hall of Seti I and Ramesses II has 134 columns, the twelve in the center about 21 m high. Thutmose III built a festival hall at the back and had the story of his wars carved on the walls around the sanctuary, including his victory at Megiddo."
"survives":
- "Karnak is the largest temple complex in Egypt. Many older buildings were taken apart and used as fill for later pylons, and some have been rebuilt from those blocks, such as the White Chapel of Senusret I, one of the oldest buildings there."
- "One of Hatshepsut's obelisks still stands, 29.5 m tall; its partner lies broken nearby. An avenue of sphinxes runs south from Karnak almost 3 km to Luxor Temple."
