"built":
- "The Ptolemies, Greek kings of Egypt, built temples in the old Egyptian style to win the support of the priests. Edfu took 180 years to finish. It follows the standard plan more cleanly than any other: a pylon about 36 m high, an open court with colonnades, two hypostyle halls, an offering hall, and the sanctuary, with corridors and chapels around it and a stone wall enclosing all."
- "Its walls are covered with texts: rituals, festival calendars, the story of Horus defeating Seth, and building inscriptions giving the dates and measurements of the temple. Ptolemaic temples use thousands of signs and playful spellings that classical Middle Egyptian did not."
"survives":
- "Because it was buried in sand and later had houses built over it, the temple came through almost complete, roof and all. Auguste Mariette cleared it in the 1860s. Soot on some ceilings dates from later centuries, when people lived in and around the temple."
- "Two granite falcons of Horus guard the entrance. In front of the temple stands its birth house (mammisi)."
