"built":
- "Kom Ombo is laid out twice side by side: two entrances, two sets of halls and two sanctuaries on parallel axes under one roof. The southern half belongs to Sobek, the crocodile god, and the northern half to Haroeris, Horus the Elder. Building began under Ptolemy VI in the 2nd century BC and went on for more than a century."
- "Sacred crocodiles were kept here, and crocodiles mummified in their honor were buried nearby; some are shown in a small museum at the site."
"survives":
- "The front of the temple has been eaten by the river and by reuse of its stone, but the inner halls keep their reliefs and much color. A relief on the back wall shows a set of instruments that is often said to be surgical tools; what they were for is debated."
- "There is also a calendar of festivals carved on the walls, and a well with steps (a nilometer) for measuring the flood."
