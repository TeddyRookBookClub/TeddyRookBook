  "tl": "ptwlmys ꜥnḫ ḏt mrj ptḥ"
  "en": "Ptolemy, living forever, beloved of Ptah"
  "where": "Several times in the hieroglyphic lines, always in a cartouche."
  "about": "This is the name Thomas Young matched with \"Ptolemaios\" in the Greek text, the first step in the decipherment. The Greek name is spelled out sound by sound: p, t, o (the lasso), l (the lion), m, y and s. The words after it are a royal epithet; Ptah, the god of Memphis, is written before the word \"beloved\" out of honor but read after it."
  "reading": "The standard reading, as in the Wikipedia article \"Rosetta Stone\" and Parkinson, Cracking Codes (1999)."
  "simplified": "The signs are the standard ones, set in one line. On the stone the cartouche is grouped more tightly, and the land sign of ḏt \"forever\" is a flatter form (Gardiner N17)."
- "id": "three-scripts"
  "title": "The decree's last line: three kinds of writing"
  "tl": "sẖ n mdw-nṯr sẖ n šꜥt sẖ n ḥꜣw-nbw"
  "en": "(to be written) in the writing of the god's words, the writing of documents, and the writing of the Greeks"
  "where": "The last line of the hieroglyphic section, just above the Demotic."
  "about": "The priests ordered the decree to be carved in three scripts: hieroglyphs (the \"god's words\"), Demotic (the everyday script of documents) and Greek, the language of the government. The stone obeys its own instructions, which is why it could unlock the other two."
  "reading": "The standard reading; the Wikipedia article \"Rosetta Stone\" gives the three names in English. ḥꜣw-nbw, an old word for the peoples of the north, meant the Greeks by this time."
  "nosigns": "Several signs in this line (the scribe's kit, the staff of mdw \"words\") are not yet in the site's hieroglyph font, so it is given in transliteration only."
