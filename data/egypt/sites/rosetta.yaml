"built":
- "Rosetta is not an ancient temple site at all. In July 1799, during Napoleon's expedition, French soldiers rebuilding an old fort near the town (they called it Fort Julien) found a dark stone built into a wall. Pierre-François Bouchard, the officer in charge, saw that it carried three kinds of writing and had it sent to the scholars in Cairo."
- "The stone itself came from somewhere else. It is a copy of a decree passed by a council of priests at Memphis in 196 BC, in honor of the young king Ptolemy V, and copies were meant to be set up in temples all over Egypt. This one probably stood in a temple in the Delta (Sais has been suggested) before it was reused as building stone."
"survives":
- "The upper part is broken away, so only the last 14 lines of the hieroglyphic text survive; the Demotic text has 32 lines and the Greek 54. Because the Greek could be read, scholars knew what the Egyptian texts said. Thomas Young showed that one oval ring (cartouche) held the name Ptolemy and read some of its signs, and in 1822 Jean-François Champollion showed how the whole system worked: sound signs and word signs together."
- "When the French surrendered in 1801, the stone passed to the British under the Treaty of Alexandria. It has been in the British Museum since 1802. Whether objects like this should go back to Egypt is debated; the Archaeology course sets out both sides."
