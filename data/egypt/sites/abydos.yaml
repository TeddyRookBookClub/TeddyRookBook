"built":
- "The kings of Dynasty 0 and the first two dynasties were buried at Umm el-Qaʿab, on the low desert behind Abydos; one of these tombs (U-j) held some of the earliest writing known. Later Egyptians took the tomb of the 1st Dynasty king Djer to be the tomb of Osiris himself, and Abydos became the god's holy city. Every year a festival carried his image from the temple to the tomb, and people from all over Egypt set up stelae and chapels so that they could share in it forever."
- "In the 19th Dynasty Seti I built a fine limestone temple here, finished by his son Ramesses II. Instead of one sanctuary it has seven, for Seti himself (as a god), Ptah, Ra-Horakhty, Amun-Ra, Osiris, Isis and Horus. Behind it lies the Osireion, a sunken hall of huge granite pillars built as a cenotaph for Osiris."
"survives":
- "Seti's temple keeps some of the most delicate painted reliefs in Egypt. In a corridor off the hypostyle hall, Seti and the young Ramesses honor 76 earlier kings, each named in a cartouche, in rows of 38: the Abydos King List. It is a list of the kings Seti chose to honor, not a full history; it leaves out the Hyksos, Hatshepsut and the Amarna kings, among others."
- "A second, more damaged list from the temple of Ramesses II at Abydos is in the British Museum."
