"built":
- "Sneferu, the first king of the 4th Dynasty, built more pyramids than any other king. At Dahshur he started the Bent Pyramid with steep sides of about 54°, but partway up the builders changed to a gentler slope of about 43°, probably because the structure was settling and cracking. He then built the Red Pyramid, named for the color of its stone, at about 43° all the way up: the first smooth-sided pyramid to be finished, and the model for his son Khufu's at Giza."
- "Six centuries later the kings of the 12th Dynasty came back to Dahshur and built pyramids of mud brick cased with stone. The Black Pyramid of Amenemhat III cracked as it sank into the soft ground, and he built another at Hawara."
"survives":
- "The Bent Pyramid keeps more of its original casing than any other pyramid. The Red Pyramid can be entered; its chambers have high corbelled roofs. Dahshur was inside a military zone for decades and opened to visitors in 1996, so it is far quieter than Giza."
- "The granite capstone (pyramidion) of the Black Pyramid, inscribed for Amenemhat III, was found in 1900 and is in the Egyptian Museum, Cairo."
