"built":
- "Each New Kingdom king built a memorial temple on the west bank, where his cult would go on after his death; the Egyptians called them \"houses of millions of years\". Ramesses II's follows the standard plan: two pylons and courts, a hypostyle hall and the inner rooms, surrounded by rows of vaulted mud-brick storerooms and workshops that show how much the temple owned and handed out."
- "His victory, as he told it, at Kadesh against the Hittites (c. 1274 BC) is carved on the pylons. In the second court lie the pieces of a seated colossus of the king in granite, which once stood about 19 m high."
"survives":
- "The temple is ruined but much of the hypostyle hall stands. Diodorus of Sicily, writing in the 1st century BC, described this temple as the \"tomb of Osymandyas\", from Ramesses's name wsr-mꜣꜥt-rꜥ, and the fallen colossus inspired Shelley's poem \"Ozymandias\" (1818)."
- "A huge granite bust of the king from the temple, the \"Younger Memnon\", was taken to London by Giovanni Belzoni in 1816–18 and is in the British Museum."
