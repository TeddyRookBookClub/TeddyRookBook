"built":
- "Ramesses III built his memorial temple on the plan of Ramesses II's Ramesseum and surrounded it with a massive mud-brick wall entered through a stone gatehouse shaped like a Near Eastern fortress. Beside it was a palace for the king's visits. Inside the wall stands an older, smaller temple of Amun begun by Hatshepsut and Thutmose III."
- "On the outer north wall, the reliefs of the king's eighth year show battles against the Sea Peoples on land and at sea, the first sea battle shown in art. Where these peoples came from is still debated."
"survives":
- "Medinet Habu is one of the best preserved temples in Egypt, and much of its paint survives on the inner walls. At the end of the New Kingdom the people of western Thebes moved inside its walls for safety, and the town of Djeme grew up there, lasting into Christian times."
- "Since 1924 the Epigraphic Survey of the University of Chicago has been drawing and publishing every scene and text."
