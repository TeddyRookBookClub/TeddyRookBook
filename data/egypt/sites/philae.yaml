"built":
- "Isis was worshipped on Philae from at least the 4th century BC, and the Ptolemies and Romans built a whole island of temples around hers: the main temple with its pylons, birth house and colonnades, the kiosk of Trajan, and shrines to other gods. Pilgrims came from Egypt and from Nubia, and the cult of Isis lasted here longer than any other in Egypt, into the Christian centuries."
- "On 24 August AD 394, a priest carved a figure of the Nubian god Mandulis and a short text in hieroglyphs on Hadrian's gateway: the last dated hieroglyphic inscription known. The last dated Demotic graffito at Philae was written in AD 452. The temple was closed under the emperor Justinian, in the 530s."
"survives":
- "After the first Aswan dam (1902), Philae was under water for much of each year. When the High Dam was built, UNESCO and Egypt took the temples apart, block by block, and rebuilt them between 1977 and 1980 on Agilkia Island nearby, landscaped to look like the old island."
- "An obelisk from Philae with a Greek inscription on its base, taken to England by William Bankes and set up at Kingston Lacy in Dorset, gave Champollion the hieroglyphic spellings of Ptolemy and Cleopatra."
