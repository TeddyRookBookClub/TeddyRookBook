  "about": "Comparing these two cartouches, Champollion saw that the sounds the names share, p, o and l, were written with the same signs, while t was written two ways (the loaf and the hand): the signs spelled sounds, and a sound could have more than one sign. This Cleopatra is not the famous Cleopatra VII, who lived about a century later."
