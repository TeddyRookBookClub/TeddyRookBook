  "tl": ""
  "en": "Before Mandulis, son of Horus, by the hand of Nesmeterakhem, son of Nesmeter, the second priest of Isis, for all time and eternity. Words spoken by Mandulis, lord of the Abaton, the great god."
  "where": "On Hadrian's gateway, beside a carved figure of Mandulis; a Demotic text next to it dates it to the birthday of Osiris, year 110 of the era of Diocletian: 24 August AD 394."
  "about": "The priest's name is also written Esmet-Akhom. His Demotic note says he carved the figure \"for all time, because he is fair of face toward me\". After this, no one is known to have carved a hieroglyphic text again; the script was forgotten until 1822."
