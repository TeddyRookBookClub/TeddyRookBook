"built":
- "Luxor Temple was built mainly by Amenhotep III: a sun court, a tall colonnade of papyrus columns and the inner rooms. Tutankhamun decorated the colonnade with scenes of the Opet festival, when the statues of Amun, Mut and Khonsu were carried by boat from Karnak to Luxor and back, a celebration of the god and of the king's power. Ramesses II added the front court and the great pylon with colossal statues and a pair of obelisks."
- "Later rulers left their mark too: Alexander the Great rebuilt the boat shrine inside, the Romans turned part of the temple into a chapel for their emperors' cult inside a military camp, and the mosque of Abu al-Haggag still sits on top of one corner."
"survives":
- "The temple is well preserved. Of Ramesses II's two obelisks, one still stands at the pylon; the other was given to France and has stood in the Place de la Concorde in Paris since 1836."
- "The avenue of sphinxes that linked Luxor to Karnak, almost 3 km long, was cleared and opened again in 2021."
