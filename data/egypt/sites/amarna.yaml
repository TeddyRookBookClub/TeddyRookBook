"built":
- "Akhenaten put one god, the Aten (the disk of the sun), above all the others, and built a city for it on empty ground where no other god had been worshipped. Akhetaten had palaces, open-air temples to the Aten with hundreds of offering tables in the sun, a main road along the river, houses for officials and workmen, and tombs for the court in the cliffs. Its edges were marked by large stelae carved in the rock, telling how the king founded the city."
- "How far Akhenaten's religion was a true monotheism is debated. After his death the court went back to Memphis and Thebes, the old gods were restored under Tutankhamun, and the city was taken apart for its stone."
"survives":
- "Because the city was lived in for only about twenty years and never built over, Amarna shows an Egyptian city's plan better than anywhere else. In 1887 local people found the Amarna letters, about 380 clay tablets in cuneiform: letters between the pharaohs and the kings of Babylon, Mitanni, the Hittites and the cities of Canaan."
- "In 1912 a German team found the painted bust of Nefertiti in the workshop of the sculptor Thutmose; it is in the Neues Museum in Berlin. Many boundary stelae still stand in the cliffs."
