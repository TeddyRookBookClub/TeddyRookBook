changes:
  slug: act-changes
  title: "How the ACT changed in 2025"
  lead: "In April 2025 ACT began giving a shorter “enhanced” ACT, with fewer questions, more time for each, and science made optional. Here is what changed, side by side, and what the evidence says about whether it got easier."
  take: "If you take the ACT now, you take the enhanced ACT. National tests switched in 2025 and school-day tests in spring 2026, so the legacy ACT isn't given anymore."
  take_src: [act-enhancements, act-studentblog-2025]
  old: "Legacy ACT, before 2025"
  new: "Enhanced ACT, 2025 on"
  groups:
    - title: "The whole test"
      rows:
        - { label: "Length", old: "215 questions in 175 minutes (English, math, reading and science)", new: "131 questions in 125 minutes (English, math and reading); science adds 40 questions in 40 minutes if you choose it", src: [act-framework-2026] }
        - { label: "Science", old: "Required, and part of the Composite", new: "Optional; not part of the Composite", src: [act-studentblog-2025, act-enhancements] }
        - { label: "Composite score", old: "Average of English, math, reading and science", new: "Average of English, math and reading", src: [act-studentblog-2025] }
        - { label: "Scores", old: "1–36", new: "1–36, on the same scale", src: [act-studentblog-2025, act-linking-2025] }
    - title: "Math"
      rows:
        - { label: "Questions and time", old: "60 questions in 60 minutes", new: "45 questions in 50 minutes (41 scored, 4 tryout questions)", src: [act-framework-2026] }
        - { label: "Pace", old: "60 seconds a question", new: "about 67 seconds a question", src: [act-framework-2026] }
        - { label: "Answer choices", old: "Five", new: "Four", src: [act-framework-2026, act-studentblog-2025] }
        - { label: "Calculator", old: "Permitted calculator allowed", new: "Permitted calculator allowed", src: [act-preparing] }
        - { label: "Content", old: "Preparing for Higher Math 57–60%, Integrating Essential Skills 40–43%", new: "Preparing for Higher Math about 80%, Integrating Essential Skills about 20%; fewer questions set in long real-world stories", src: [act-framework-2026] }
    - title: "English and reading"
      rows:
        - { label: "English", old: "75 questions in 45 minutes", new: "50 questions in 35 minutes (40 scored)", src: [act-framework-2026] }
        - { label: "Reading", old: "40 questions in 35 minutes", new: "36 questions in 40 minutes (27 scored)", src: [act-framework-2026] }
  easier:
    intro: "Some people say yes. Here is who says what."
    claims:
      - { who: "What changed for sure", text: "The enhanced ACT is shorter, gives more time per question (about nine seconds more on average; 67 instead of 60 in math), drops a fifth answer choice in math, and makes science optional. Counselors quoted in news reports expect less fatigue and stress.", src: [act-framework-2026, act-mfp-2024] }
      - { who: "Critics", text: "A longtime test-prep tutor, writing in Inside Higher Ed, predicted the ACT would become “substantially easier,” mostly because it eases the time pressure that used to separate fast and slow test takers. He also expected the effect to be minor.", src: [act-paris-2024] }
      - { who: "ACT", text: "The test maker's linking study found the difficulty of the enhanced questions similar to the legacy test in all four sections, with a slight tendency to be harder, and found that scores on the two can be used interchangeably. Its design report says fewer answer choices cut the time spent reading choices.", src: [act-linking-2025, act-framework-2026] }
    verdict: "What we can say: the enhanced ACT is shorter and less rushed, and its math has four choices instead of five. ACT's own studies say the questions are about as hard as before and that scores mean the same thing. Less time pressure may help students who used to run out of time; whether that makes a given score easier to reach is still argued, and we found no independent study that settles it."
