# AP Human Geography on the Geography Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights: the College Board's AP Students course page (read 2026-10-25). Rendered at /test-prep/ap/ap-human-geography/.
key: ap-human-geography
title: "AP Human Geography"
ladder: geog
order: 60
source: "AP Human Geography course page (College Board, AP Students), unit list and exam weights"
source_url: "https://apstudents.collegeboard.org/courses/ap-human-geography"
asof: "2026-10-25"
blurb: "A college semester of human geography: how people shape places, from population and migration to culture, politics, farming, cities and development."
units:
  - num: 1
    title: "Thinking Geographically"
    weight: "8–10%"
    topics: [humangeo.location, humangeo.site-situation, humangeo.regions, humangeo.scale-of-analysis, humangeo.distance-decay, humangeo.spatial-patterns, humangeo.geographic-data, humangeo.thematic-maps, humangeo.human-environment, worldgeo.map-scale, worldgeo.kinds-of-maps, worldgeo.gps-gis]
    note: "Map types, scale and geospatial tools (GPS, GIS, remote sensing) are taught in World Geography and linked here."
  - num: 2
    title: "Population and Migration Patterns and Processes"
    weight: "12–17%"
    topics: [humangeo.population-distribution, humangeo.density-types, humangeo.birth-death-rates, humangeo.fertility-mortality, humangeo.doubling-time, humangeo.population-pyramids, humangeo.pyramid-shapes, humangeo.dependency-ratio, humangeo.demographic-transition, humangeo.epidemiological-transition, humangeo.malthus, humangeo.population-policies, humangeo.women-fertility, humangeo.migration-types, humangeo.push-pull, humangeo.ravenstein, humangeo.refugees, humangeo.migration-effects, worldgeo.world-population, worldgeo.population-density]
    note: "Covers population distribution and density, composition (pyramids), growth and decline (demographic and epidemiological transitions, Malthus), policies, women and demographic change, and migration."
  - num: 3
    title: "Cultural Patterns and Processes"
    weight: "12–17%"
    topics: [humangeo.culture-traits, humangeo.cultural-landscape, humangeo.diffusion, humangeo.language-families, humangeo.language-branches, humangeo.lingua-franca, humangeo.religions, humangeo.religion-hearths, humangeo.cultural-change, humangeo.globalization-culture]
    note: "Religions are described by where they began and how they spread, in neutral terms."
  - num: 4
    title: "Political Patterns and Processes"
    weight: "12–17%"
    topics: [humangeo.state-nation, humangeo.multinational, humangeo.sovereignty, humangeo.boundary-types, humangeo.boundary-disputes, humangeo.law-of-the-sea, humangeo.state-shapes, humangeo.unitary-federal, humangeo.centripetal-centrifugal, humangeo.supranational, humangeo.electoral-geography, worldgeo.how-many-countries]
    note: "Disputed borders and partly recognized states are described neutrally; electoral districts are taught as mechanics, not as a judgment on any party."
  - num: 5
    title: "Agriculture and Rural Land-Use Patterns and Processes"
    weight: "12–17%"
    topics: [humangeo.agricultural-hearths, humangeo.agricultural-revolutions, humangeo.intensive-extensive, humangeo.subsistence-commercial, humangeo.farming-regions, humangeo.von-thunen, humangeo.rural-settlement, humangeo.food-debates]
    note: "Food-production debates (GMOs, organic farming, large and small farms) are presented with each side's arguments."
  - num: 6
    title: "Cities and Urban Land-Use Patterns and Processes"
    weight: "12–17%"
    topics: [humangeo.urbanization, humangeo.city-site-situation, humangeo.central-place, humangeo.rank-size, humangeo.urban-models, humangeo.global-city-models, humangeo.urban-challenges, worldgeo.largest-cities]
    note: "Urban challenges and responses (sprawl, gentrification, new urbanism) are presented with their trade-offs."
  - num: 7
    title: "Industrial and Economic Development Patterns and Processes"
    weight: "12–17%"
    topics: [humangeo.economic-sectors, humangeo.industrialization, humangeo.weber, humangeo.measuring-development, humangeo.development-theories, humangeo.trade-globalization, humangeo.sustainable-development]
    note: "Development theories are presented as theories, with their critics."
