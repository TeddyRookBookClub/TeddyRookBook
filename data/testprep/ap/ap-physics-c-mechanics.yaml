# AP Physics C: Mechanics on the Physics Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights (multiple-choice section): AP Central course page (read 2026-10-16). Topic numbers in the
# notes: the AP Physics C: Mechanics Course at a Glance (read 2026-10-16). Rendered at /test-prep/ap/ap-physics-c-mechanics/.
# Ladder topics: Mechanics with Calculus (mech) for the calculus-based ideas, and the Physics 1 (phys1) topics it builds on,
# which the course does not repeat.
key: ap-physics-c-mechanics
title: "AP Physics C: Mechanics"
ladder: physics
order: 12
source: "AP Physics C: Mechanics course page and Course at a Glance (College Board, revised course effective 2024-25), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-physics-c-mechanics/course"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-physics-c-mech-course-at-a-glance-printable-poster.pdf"
asof: "2026-10-16"
blurb: "A first semester of calculus-based college physics: kinematics, Newton's laws, energy, momentum, rotation and oscillations, with derivatives and integrals."
units:
  - num: 1
    title: "Kinematics"
    weight: "10–15%"
    topics: [phys1.motion-graph-translation, phys1.kinematic-equations, phys1.free-fall, phys1.vector-addition,
             phys1.relative-velocity, phys1.projectile-angled, mech.velocity-derivative, mech.acceleration-derivative,
             mech.motion-from-acceleration, mech.derive-kinematics, mech.acceleration-of-position, mech.motion-vectors,
             mech.projectile-optimization, mech.galilean-frames, mech.tangential-normal-acceleration]
    note: "Covers official topics 1.1–1.5."
  - num: 2
    title: "Force and Translational Dynamics"
    weight: "20–25%"
    topics: [phys1.systems-center-of-mass, mech.center-of-mass-integral, phys1.free-body-diagrams, phys1.newtons-third-law,
             phys1.equilibrium-first-law, phys1.second-law-systems, phys1.forces-at-angles, phys1.inclined-planes,
             phys1.gravitational-force, phys1.gravitational-field, mech.shell-theorem, phys1.static-friction, phys1.kinetic-friction,
             phys1.friction-on-inclines, phys1.connected-objects, phys1.pulley-systems, mech.pulley-constraints, phys1.spring-force,
             mech.time-varying-force, mech.linear-drag, mech.quadratic-drag, phys1.centripetal-force, phys1.vertical-circles,
             mech.banked-curves]
    note: "Covers official topics 2.1–2.10, including resistive forces (2.9) in mech.linear-drag and mech.quadratic-drag."
  - num: 3
    title: "Work, Energy, and Power"
    weight: "15–25%"
    topics: [mech.work-integral, mech.work-along-path, mech.work-energy-derivation, mech.conservative-forces,
             mech.potential-from-force, mech.force-from-potential, mech.energy-diagrams, phys1.energy-conservation,
             phys1.energy-bar-charts, phys1.friction-energy, phys1.gravitational-pe-universal, mech.escape-speed,
             mech.instantaneous-power]
    note: "Covers official topics 3.1–3.5."
  - num: 4
    title: "Linear Momentum"
    weight: "10–20%"
    topics: [phys1.momentum, mech.impulse-integral, phys1.momentum-conservation, phys1.inelastic-collisions,
             mech.elastic-collisions-1d, mech.collisions-2d, phys1.explosions-recoil, mech.system-of-particles,
             phys1.center-of-mass-motion, mech.rocket-equation]
    note: "Covers official topics 4.1–4.4. The rocket equation goes beyond the AP course."
  - num: 5
    title: "Torque and Rotational Dynamics"
    weight: "10–15%"
    topics: [mech.angular-calculus, phys1.linear-angular, phys1.torque, mech.torque-cross-product, mech.moment-of-inertia-integral,
             mech.parallel-axis, phys1.rotational-equilibrium, mech.statics-problems, phys1.rotational-second-law,
             phys1.rotation-translation]
    note: "Covers official topics 5.1–5.6."
  - num: 6
    title: "Energy and Momentum of Rotating Systems"
    weight: "10–15%"
    topics: [phys1.rotational-kinetic-energy, mech.rotational-work-power, phys1.angular-momentum, mech.angular-momentum-particle,
             phys1.angular-momentum-conservation, mech.rotational-collisions, phys1.rolling, mech.rolling-dynamics,
             mech.skidding-to-rolling, phys1.orbiting-satellites, mech.orbital-energy, mech.kepler-second-from-newton,
             mech.kepler-third-from-newton, mech.vis-viva, mech.precession]
    note: "Covers official topics 6.1–6.6. Gyroscopic precession goes beyond the AP course."
  - num: 7
    title: "Oscillations"
    weight: "10–15%"
    topics: [phys1.shm-intro, mech.shm-equation, mech.shm-initial-conditions, phys1.shm-energy, mech.vertical-spring,
             phys1.pendulum-period, mech.physical-pendulum, mech.damped-oscillations, mech.driven-resonance]
    note: "Covers official topics 7.1–7.5. Damped and driven oscillations go beyond the AP course."
