# AP Physics C: Electricity and Magnetism on the Physics Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights (multiple-choice section): AP Central course page (read 2026-10-16). Topic numbers in the
# notes: the AP Physics C: Electricity and Magnetism Course at a Glance (read 2026-10-16).
# Rendered at /test-prep/ap/ap-physics-c-em/. The units are numbered 8-13 by the College Board.
# Ladder topics: Electricity and Magnetism (em) for the calculus-based ideas, and the Physics 2 (phys2) topics it builds on.
key: ap-physics-c-em
title: "AP Physics C: Electricity and Magnetism"
ladder: physics
order: 13
source: "AP Physics C: Electricity and Magnetism course page and Course at a Glance (College Board, revised course effective 2024-25), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-physics-c-electricity-and-magnetism/course"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-physics-c-em-course-at-a-glance-printable-poster.pdf"
asof: "2026-10-16"
blurb: "A second semester of calculus-based college physics: electric fields and Gauss's law, potential, capacitors, circuits, magnetic fields and induction."
units:
  - num: 8
    title: "Electric Charges, Fields, and Gauss's Law"
    weight: "15–25%"
    topics: [phys2.charge-conservation, phys2.coulombs-law, phys2.coulomb-superposition, phys2.electric-field,
             phys2.field-superposition, phys2.uniform-field, em.charge-densities, em.field-of-rod, em.field-of-ring-disk,
             em.electric-flux, em.gauss-law, em.gauss-spheres, em.gauss-lines-planes]
    note: "Covers official topics 8.1–8.6."
  - num: 9
    title: "Electric Potential"
    weight: "10–20%"
    topics: [phys2.electric-potential-energy, em.energy-of-charges, phys2.electric-potential, phys2.equipotentials,
             em.potential-from-field, em.potential-of-distributions, em.field-from-potential, em.energy-conservation-charges]
    note: "Covers official topics 9.1–9.3."
  - num: 10
    title: "Conductors and Capacitors"
    weight: "10–15%"
    topics: [em.conductors, em.charge-sharing, phys2.capacitors, em.capacitance-geometry, phys2.capacitor-energy, em.field-energy,
             phys2.capacitor-combinations, em.dielectrics]
    note: "Covers official topics 10.1–10.4."
  - num: 11
    title: "Electric Circuits"
    weight: "15–25%"
    topics: [phys2.current, em.drift-velocity, phys2.resistivity, em.resistance-integral, phys2.resistor-power,
             phys2.series-resistors, phys2.parallel-resistors, phys2.combination-circuits, phys2.kirchhoff-loop,
             phys2.kirchhoff-junction, phys2.internal-resistance, em.multiloop-circuits, em.rc-charging, em.rc-discharging]
    note: "Covers official topics 11.1–11.8."
  - num: 12
    title: "Magnetic Fields and Electromagnetism"
    weight: "10–20%"
    topics: [phys2.magnetic-fields, phys2.force-on-moving-charge, em.lorentz-force, phys2.charged-particle-circles,
             em.crossed-fields, em.hall-effect, em.force-on-wire-integral, em.loop-torque, phys2.field-of-wire, em.biot-savart,
             em.loop-field, em.amperes-law, em.ampere-applications]
    note: "Covers official topics 12.1–12.4."
  - num: 13
    title: "Electromagnetic Induction"
    weight: "10–20%"
    topics: [em.changing-flux, em.faraday-calculus, phys2.lenzs-law, phys2.motional-emf, em.generators, em.induced-electric-field,
             em.magnetic-braking, em.inductance, em.rl-circuits, em.magnetic-energy, em.lc-circuits]
    note: "Covers official topics 13.1–13.6. The course's last unit (AC circuits, displacement current, Maxwell's equations and electromagnetic waves) goes beyond AP Physics C."
