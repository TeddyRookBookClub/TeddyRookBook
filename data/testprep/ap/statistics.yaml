# AP Statistics on the Math Ladder: the official units of the course as revised for 2026-27 (AP Central course page and the
# Course and Exam Description effective fall 2026, read 2026-10-16; see data/testprep/sources.yaml) and the ladder topics that
# cover each one. Rendered at /test-prep/ap/statistics/.
key: statistics
title: "AP Statistics"
ladder: math
order: 4
source: "AP Statistics course page and Course and Exam Description, effective fall 2026 (College Board), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-statistics"
asof: "2026-10-16"
blurb: "Exploring data, collecting it well, probability, and drawing conclusions with confidence intervals and tests, as revised for 2026-27."
note: "The course was revised for 2026-27: eight units became five, and the geometric distribution, combining random variables, the chi-square goodness-of-fit test and inference for slopes were removed. Math Ladder still teaches those topics in Probability and Statistics; they are left off this map."
units:
  - num: 1
    title: "Exploring One-Variable Data and Collecting Data"
    topics: [stat.variable-types, stat.categorical-displays, stat.histograms-shape, stat.center-resistance, stat.standard-deviation, stat.five-number-outliers,
             stat.compare-distributions, stat.transform-data, stat.sampling-methods, stat.sampling-bias, stat.observational-experimental,
             stat.experimental-design, stat.evaluate-reports]
    note: "The course's new topics on investigative questions are part of how our lessons frame data, not a topic of their own."
  - num: 2
    title: "Probability, Random Variables, and Probability Distributions"
    topics: [alg1.two-way-relative-frequency, stat.two-way-conditional, stat.simulation-models, stat.events-sample-spaces, stat.addition-rule,
             stat.conditional-probability, stat.independence, stat.multiplication-rule, stat.discrete-random-variables, stat.expected-value,
             stat.random-variable-spread, stat.binomial-distribution, stat.z-scores, stat.normal-curve, stat.normal-probabilities, stat.inverse-normal,
             stat.sampling-distribution-mean]
  - num: 3
    title: "Inference for Categorical Data: Proportions"
    topics: [stat.sampling-distribution-proportion, stat.confidence-interval-proportion, stat.margin-of-error, stat.significance-tests, stat.test-proportion,
             stat.errors-power, stat.two-sample-inference, stat.chi-square-tests]
    note: "Intervals and tests for a difference of two proportions are inside Two-Sample Intervals and Tests. Chi-Square Tests also includes goodness of fit, which the revised course dropped."
  - num: 4
    title: "Inference for Quantitative Data: Means"
    topics: [stat.sampling-distribution-mean, stat.confidence-interval-mean, stat.test-mean, stat.two-sample-inference]
    note: "Paired differences have no topic of their own yet."
  - num: 5
    title: "Regression Analysis"
    topics: [stat.scatterplots, stat.correlation, stat.least-squares-line, stat.interpret-regression, stat.residual-plots, stat.r-squared, stat.influential-points]
