# AP Physics 2 on the Physics Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights (multiple-choice section): AP Central course page (read 2026-10-16). Topic numbers in the
# notes: the AP Physics 2 Course at a Glance (read 2026-10-16). Rendered at /test-prep/ap/ap-physics-2/.
# Ladder topics come from Physics 2 (phys2), with a few foundations from Physical Science and the Chemistry Ladder.
key: ap-physics-2
title: "AP Physics 2: Algebra-Based"
ladder: physics
order: 11
source: "AP Physics 2 course page and Course at a Glance (College Board, revised course effective 2024-25), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-physics-2/course"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-physics-2-course-at-a-glance-printable-poster.pdf"
asof: "2026-10-16"
blurb: "A second college course in algebra-based physics: thermodynamics, electricity and circuits, magnetism, optics, waves and modern physics."
units:
  - num: 9
    title: "Thermodynamics"
    weight: "15–18%"
    topics: [chem.kinetic-molecular-theory, phys2.ideal-gas-law, phys2.kinetic-theory, chem.heat-temperature, physsci.heat-transfer,
             chem.specific-heat, chem.calorimetry, phys2.latent-heat, phys2.conduction-rate, phys2.pv-work, phys2.first-law,
             phys2.thermo-processes, phys2.thermo-cycles, phys2.heat-engines, phys2.carnot-limit, phys2.refrigerators, phys2.entropy]
    note: "Covers official topics 9.1–9.6. Heat versus temperature, specific heat and calorimetry are taught once, in the Chemistry Ladder. The ladder uses the AP sign convention ΔU = Q + W, with W the work done on the gas."
  - num: 10
    title: "Electric Force, Field, and Potential"
    weight: "15–18%"
    topics: [phys2.charge-conservation, phys2.coulombs-law, phys2.coulomb-superposition, phys2.electric-field,
             phys2.field-superposition, phys2.uniform-field, phys2.electric-potential-energy, phys2.electric-potential,
             phys2.equipotentials, phys2.capacitors, phys2.capacitor-energy]
    note: "Covers official topics 10.1–10.7. Conservation of electric energy (10.7) is part of phys2.electric-potential."
  - num: 11
    title: "Electric Circuits"
    weight: "15–18%"
    topics: [phys2.current, physsci.circuits-intro, physsci.ohms-law, phys2.resistivity, phys2.resistor-power, phys2.series-resistors,
             phys2.parallel-resistors, phys2.combination-circuits, phys2.kirchhoff-loop, phys2.kirchhoff-junction,
             phys2.internal-resistance, phys2.capacitor-combinations, phys2.rc-circuits]
    note: "Covers official topics 11.1–11.8. Simple circuits and Ohm's law are first taught in Physical Science."
  - num: 12
    title: "Magnetism and Electromagnetism"
    weight: "12–15%"
    topics: [phys2.magnetic-fields, phys2.force-on-moving-charge, phys2.charged-particle-circles, phys2.force-on-wire,
             phys2.field-of-wire, phys2.magnetic-flux, phys2.faradays-law, phys2.lenzs-law, phys2.motional-emf]
    note: "Covers official topics 12.1–12.4."
  - num: 13
    title: "Geometric Optics"
    weight: "12–15%"
    topics: [phys2.reflection, phys2.mirror-ray-diagrams, phys2.mirror-equation, phys2.index-of-refraction, phys2.snells-law,
             phys2.total-internal-reflection, phys2.lens-ray-diagrams, phys2.thin-lens-equation]
    note: "Covers official topics 13.1–13.4."
  - num: 14
    title: "Waves, Sound, and Physical Optics"
    weight: "12–15%"
    topics: [physsci.wave-speed, phys2.wave-speed-medium, phys2.wave-graphs, phys2.wave-boundaries, phys2.polarization,
             phys2.em-waves, phys2.doppler, phys2.superposition, phys2.standing-waves-strings, phys2.standing-waves-pipes,
             phys2.sound-intensity, phys2.single-slit, phys2.double-slit, phys2.diffraction-grating, phys2.thin-films]
    note: "Covers official topics 14.1–14.9."
  - num: 15
    title: "Modern Physics"
    weight: "12–15%"
    topics: [phys2.photons, phys2.matter-waves, phys2.bohr-model, phys2.spectra, phys2.thermal-radiation,
             phys2.photoelectric-effect, phys2.compton-scattering, phys2.mass-energy, chem.fission-fusion, chem.radioactive-decay,
             chem.half-life]
    note: "Covers official topics 15.1–15.8. Blackbody radiation (15.4) is taught in phys2.thermal-radiation, with Planck's explanation in modern.planck-blackbody. Fission, fusion, the types of decay and half-life are taught once, in the Chemistry Ladder; Physics 2 adds mass-energy and binding energy."
