# AP Biology on the Biology Ladder: the official units and the ladder topics that cover each one.
# Unit names: AP Central course page and AP Students course page (read 2026-10-25); exam weights: AP Students course page
# (read 2026-10-25). Rendered at /test-prep/ap/ap-biology/.
# Ladder topics come from High School Biology (hsbio) and Advanced Biology (apbio), with a few Life Science (lifesci) basics.
key: ap-biology
title: "AP Biology"
ladder: bio
order: 25
source: "AP Biology course page and Course and Exam Description (College Board, updated for 2025–26), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-biology/course"
asof: "2026-10-25"
blurb: "A year of college introductory biology: the chemistry of life, cells, cellular energetics, cell communication and the cell cycle, heredity, gene expression, natural selection and ecology, with data analysis throughout."
units:
  - num: 1
    title: "Chemistry of Life"
    weight: "8–11%"
    topics: [hsbio.elements-bonds, hsbio.water-properties, hsbio.ph, hsbio.monomers-polymers, hsbio.carbohydrates, hsbio.lipids, hsbio.proteins,
             hsbio.nucleic-acids, apbio.protein-structure, apbio.amino-acid-properties, apbio.nucleic-acid-direction]
    note: "Water and hydrogen bonding, the elements of life, and the structure and function of the four kinds of biological macromolecules, including nucleic acid direction and protein structure levels."
  - num: 2
    title: "Cells"
    weight: "10–13%"
    topics: [hsbio.prokaryotes-eukaryotes, hsbio.endomembrane, hsbio.endosymbiosis, apbio.surface-volume, hsbio.membrane-structure, hsbio.diffusion,
             hsbio.osmosis-tonicity, hsbio.channels-pumps, hsbio.bulk-transport, apbio.water-potential, apbio.membrane-potential, apbio.compartmentalization]
    note: "Cell structures, cell size, membranes and transport, tonicity and water potential, and compartmentalization with its endosymbiotic origin."
  - num: 3
    title: "Cellular Energetics"
    weight: "12–16%"
    topics: [hsbio.enzymes, hsbio.enzyme-conditions, apbio.enzyme-kinetics, apbio.enzyme-inhibition, hsbio.atp, apbio.free-energy, hsbio.photosynthesis,
             apbio.light-reactions, apbio.calvin-cycle, hsbio.photosynthesis-factors, apbio.c4-cam, hsbio.cellular-respiration, apbio.glycolysis-krebs,
             apbio.oxidative-phosphorylation, hsbio.fermentation]
    note: "Enzyme structure and kinetics, energy coupling, and photosynthesis and cellular respiration step by step. C4 and CAM plants are taught as an extension."
  - num: 4
    title: "Cell Communication and Cell Cycle"
    weight: "10–15%"
    topics: [apbio.signaling-types, apbio.signal-transduction, apbio.signal-amplification, hsbio.feedback-loops, apbio.feedback-ap, hsbio.cell-cycle,
             hsbio.mitosis, hsbio.cell-cycle-control, apbio.cell-cycle-regulation]
    note: "Signaling, reception, transduction and responses, changes in pathways, feedback, and the cell cycle and its regulation."
  - num: 5
    title: "Heredity"
    weight: "8–11%"
    topics: [hsbio.chromosomes, hsbio.meiosis, hsbio.meiosis-variation, hsbio.mitosis-vs-meiosis, hsbio.mendel, hsbio.monohybrid, hsbio.probability-rules,
             hsbio.dihybrid, apbio.chi-square, hsbio.incomplete-codominance, hsbio.multiple-alleles, hsbio.x-linked, hsbio.pedigrees, apbio.linked-genes,
             apbio.gene-maps, apbio.non-nuclear-inheritance, apbio.nondisjunction, apbio.environment-phenotype, hsbio.polygenic]
    note: "Meiosis and genetic diversity, Mendelian genetics with probability and chi-square, non-Mendelian inheritance (linkage, X-linked traits, organelle genes), environmental effects on phenotype, and nondisjunction as an error of cell division. Human chromosomal disorders are not covered."
  - num: 6
    title: "Gene Expression and Regulation"
    weight: "12–16%"
    topics: [hsbio.dna-structure, hsbio.dna-replication, apbio.replication-details, hsbio.transcription, apbio.rna-processing, hsbio.translation,
             hsbio.genetic-code, apbio.translation-details, hsbio.gene-regulation, apbio.operons, apbio.eukaryotic-regulation, apbio.differentiation,
             hsbio.mutations, apbio.mutation-effects, hsbio.pcr, hsbio.gel-electrophoresis, apbio.gel-sizing, hsbio.recombinant-dna,
             apbio.transformation-sequencing]
    note: "DNA and RNA structure, replication, transcription and RNA processing, translation, regulation and cell specialization, mutations, and biotechnology (PCR, gels, transformation and sequencing). Hands-on lab work is part of the AP course and no website replaces it."
  - num: 7
    title: "Natural Selection"
    weight: "13–20%"
    topics: [hsbio.natural-selection, hsbio.selection-patterns, hsbio.adaptation-in-action, lifesci.breeding-engineering, hsbio.hardy-weinberg,
             apbio.hardy-weinberg-problems, hsbio.mechanisms-evolution, apbio.genetic-drift, hsbio.evidence-fossils-anatomy, hsbio.molecular-evidence,
             apbio.molecular-clock, hsbio.phylogenetic-trees, hsbio.cladograms, apbio.trees-from-data, hsbio.speciation, apbio.speciation-patterns,
             apbio.origin-of-life]
    note: "Natural and artificial selection, population genetics and Hardy-Weinberg, evidence of common ancestry, phylogeny, speciation and extinction, variation in populations, and the origin of life (taught as evidence and open questions). Speciation is taught through gene flow, geography, habitat and timing; behavioral and mechanical isolating barriers are not covered."
  - num: 8
    title: "Ecology"
    weight: "10–15%"
    topics: [apbio.behavior-responses, hsbio.group-behavior, hsbio.energy-flow, apbio.energy-budgets, apbio.productivity, hsbio.population-models,
             apbio.population-equations, hsbio.density-factors, hsbio.community-interactions, hsbio.keystone-species, apbio.community-structure,
             hsbio.biodiversity-impact, apbio.diversity-index, hsbio.stability-change, apbio.ecosystem-disruptions, hsbio.matter-cycles]
    note: "Responses to the environment, energy flow, population ecology, community ecology, biodiversity and disruptions to ecosystems. Animal behavior is limited to responses, communication and group behavior."
