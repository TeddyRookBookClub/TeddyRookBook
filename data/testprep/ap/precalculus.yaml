# AP Precalculus on the Math Ladder: the official units (AP Central course page, read 2026-10-16; see data/testprep/sources.yaml)
# and the ladder topics that cover each one. Rendered at /test-prep/ap/precalculus/.
key: precalculus
title: "AP Precalculus"
ladder: math
order: 3
source: "AP Precalculus course page and Course at a Glance (College Board), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-precalculus/course"
asof: "2026-10-16"
blurb: "Functions as models of change: polynomial and rational, exponential and logarithmic, trigonometric and polar, then parameters, vectors and matrices."
note: "Units 1, 2 and 3 are on the AP Exam. Unit 4 is taught in the course but not assessed on the exam."
units:
  - num: 1
    title: "Polynomial and Rational Functions"
    topics: [alg1.average-rate-of-change, alg2.end-behavior, alg2.zeros-multiplicity, alg2.fundamental-theorem-algebra, alg2.sketch-polynomials,
             alg2.polynomial-inequalities, alg2.asymptotes-holes, alg2.graph-rational-functions, alg2.slant-asymptotes, alg2.polynomial-long-division,
             alg2.binomial-theorem, alg2.combined-transformations, alg2.even-odd-functions, alg2.rational-models]
  - num: 2
    title: "Exponential and Logarithmic Functions"
    topics: [alg1.arithmetic-sequences, alg1.geometric-sequences, alg1.linear-vs-exponential, alg2.exponential-graphs, alg1.exponential-equivalent-forms,
             alg2.exponential-log-models, alg2.choose-a-model, alg2.function-composition, alg2.inverse-functions, alg2.logarithms, alg2.log-exp-forms,
             alg2.log-graphs, alg2.log-properties, alg2.solve-exponential-equations, alg2.solve-log-equations, alg2.log-scales]
    note: "Semi-log plots come up in Logarithmic Scales; there is no separate topic on reading a semi-log plot yet."
  - num: 3
    title: "Trigonometric and Polar Functions"
    topics: [pre.symmetry-periodicity, pre.radian-measure, pre.unit-circle-sine-cosine, pre.special-angles, pre.sine-cosine-graphs, pre.amplitude-period,
             pre.phase-shift-midline, pre.sinusoidal-models, pre.tangent-reciprocal-graphs, pre.inverse-trig, pre.solve-trig-basic, pre.solve-trig-advanced,
             pre.six-trig-functions, pre.fundamental-identities, pre.sum-difference-formulas, pre.double-angle, pre.polar-coordinates, pre.polar-rectangular,
             pre.polar-graphs]
    note: "Rates of change in polar functions (whether r is growing or shrinking as θ turns) has no topic of its own yet."
  - num: 4
    title: "Functions Involving Parameters, Vectors, and Matrices"
    topics: [pre.parametric-equations, pre.projectile-motion, pre.eliminate-parameter, geo.circle-equation, pre.parabolas-conics, pre.ellipses, pre.hyperbolas,
             pre.vectors-intro, pre.vector-components, pre.vector-operations, pre.dot-product, calc3.vector-functions, pre.matrix-basics,
             pre.matrix-multiplication, pre.determinants, pre.matrix-inverse, pre.matrix-transformations, la.matrix-powers-markov]
    note: "Not on the AP Exam. Vector-valued functions and matrices that model change over time (Markov chains) come from Calculus 3 and Linear Algebra, which go further than this unit."
