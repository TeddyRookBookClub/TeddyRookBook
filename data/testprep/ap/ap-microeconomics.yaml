# AP Microeconomics on the Economics Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights: AP Central course page (read 2026-10-16). Topic numbers in the notes: the AP Microeconomics
# Course and Exam Description, Course at a Glance, effective Fall 2026 (read 2026-10-16). Rendered at /test-prep/ap/ap-microeconomics/.
key: ap-microeconomics
title: "AP Microeconomics"
ladder: economics
order: 30
source: "AP Microeconomics course page and Course and Exam Description (College Board, effective Fall 2026), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-microeconomics"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-microeconomics-course-and-exam-description.pdf"
asof: "2026-10-16"
blurb: "A college semester of microeconomics: scarcity and markets, costs and competition, factor markets, and when markets fall short."
units:
  - num: 1
    title: "Basic Economic Concepts"
    weight: "12–15%"
    topics: [micro.scarcity-resources, micro.opportunity-cost, micro.positive-normative, micro.economic-systems, micro.budget-constraint,
             micro.ppc, micro.ppc-opportunity-cost, micro.ppc-shifts, micro.comparative-advantage, micro.gains-from-trade,
             micro.marginal-analysis, micro.marginal-utility, micro.utility-maximizing-rule]
    note: "Covers official topics 1.1–1.6. Budget constraints come from the OpenStax text and lead into the PPC."
  - num: 2
    title: "Supply and Demand"
    weight: "20–25%"
    topics: [micro.law-of-demand, micro.demand-equations, micro.demand-shift-vs-movement, micro.demand-shifters, micro.substitutes-complements,
             micro.law-of-supply, micro.supply-shifters, micro.price-elasticity-demand, micro.elasticity-determinants, micro.total-revenue-test,
             micro.price-elasticity-supply, micro.income-cross-elasticity, micro.market-equilibrium, micro.consumer-producer-surplus,
             micro.deadweight-loss, micro.shortage-surplus, micro.equilibrium-changes, micro.double-shifts, micro.price-controls,
             micro.excise-tax, micro.tax-incidence, micro.subsidies, micro.world-price, micro.tariffs-quotas]
    note: "Covers official topics 2.1–2.9."
  - num: 3
    title: "Production, Cost, and the Perfect Competition Model"
    weight: "22–25%"
    topics: [micro.production-function, micro.short-run-costs, micro.cost-curves, micro.cost-shifts, micro.long-run-costs, micro.economic-profit,
             micro.price-takers, micro.profit-maximizing-output, micro.profit-and-loss, micro.shutdown-rule, micro.long-run-competition,
             micro.efficiency]
    note: "Covers official topics 3.1–3.7."
  - num: 4
    title: "Imperfect Competition"
    weight: "15–22%"
    topics: [micro.monopoly-sources, micro.monopoly-marginal-revenue, micro.monopoly-price-output, micro.monopoly-inefficiency,
             micro.natural-monopoly, micro.price-discrimination, micro.monopolistic-competition, micro.dominant-strategies,
             micro.nash-equilibrium]
    note: "Covers official topics 4.1–4.5. The introduction to imperfectly competitive markets (4.1) is taught inside the monopoly topics rather than as a topic of its own."
  - num: 5
    title: "Factor Markets"
    weight: "10–13%"
    topics: [micro.marginal-revenue-product, micro.factor-market-shifts, micro.least-cost-rule, micro.monopsony]
    note: "Covers official topics 5.1–5.4."
  - num: 6
    title: "Market Failure and the Role of Government"
    weight: "8–13%"
    topics: [micro.negative-externalities, micro.positive-externalities, micro.externality-policy, micro.types-of-goods, micro.public-goods,
             micro.cost-shifts, micro.natural-monopoly, micro.price-controls, micro.income-inequality]
    note: "Covers official topics 6.1–6.4. Topic 6.4 (government intervention in different market structures) has no single practice topic: lump-sum versus per-unit taxes are in What Shifts the Cost Curves, price regulation of a monopoly in Regulating a Natural Monopoly, and antitrust policy is described in the monopoly lessons. Measuring Income Inequality is in our course although the Fall 2026 framework does not list it."
