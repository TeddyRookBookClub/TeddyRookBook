# AP Chemistry on the Chemistry Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights: AP Central course page (read 2026-10-16). Topic numbers in the notes: the AP Chemistry
# Course and Exam Description, Course at a Glance, effective Fall 2024 (read 2026-10-16). Rendered at /test-prep/ap/ap-chemistry/.
# Ladder topics come from Chemistry (chem), General Chemistry 1 (gchem1) and General Chemistry 2 (gchem2).
key: ap-chemistry
title: "AP Chemistry"
ladder: chemistry
order: 20
source: "AP Chemistry course page and Course and Exam Description (College Board, effective Fall 2024), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-chemistry"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-chemistry-course-and-exam-description-effective-fall-2024.pdf"
asof: "2026-10-16"
blurb: "A full year of college general chemistry: atoms and bonding, the properties of substances and mixtures, reactions, rates, energy, equilibrium, acids and bases, and electrochemistry."
units:
  - num: 1
    title: "Atomic Structure and Properties"
    weight: "7–9%"
    topics: [chem.mole-concept, chem.molar-mass, chem.mass-mole-conversions, chem.isotopes, chem.average-atomic-mass, gchem1.mass-spectra,
             gchem1.mass-laws, chem.percent-composition, chem.empirical-formula, chem.molecular-formula, gchem1.combustion-analysis,
             gchem1.mixture-composition, chem.subatomic-particles, chem.electron-configuration, gchem1.orbital-diagrams,
             gchem1.coulombs-law-atoms, gchem1.photoelectron-spectroscopy, chem.atomic-radius, chem.ionization-energy, chem.electronegativity,
             gchem1.effective-nuclear-charge, gchem1.successive-ionization, gchem1.ionic-radii, chem.valence-electrons, chem.ion-charges,
             chem.ionic-formulas]
    note: "Covers official topics 1.1–1.8 (moles, mass spectra, composition of pure substances and mixtures, electron configuration, photoelectron spectroscopy, periodic trends, valence electrons and ionic compounds). Quantum numbers, hydrogen's energy levels and the exceptions to the trends are taught too, as college general chemistry does; the Course and Exam Description's exclusion statements say which of these the exam leaves out."
  - num: 2
    title: "Compound Structure and Properties"
    weight: "7–9%"
    topics: [chem.ionic-bonding, chem.covalent-bonding, chem.bond-polarity, gchem1.bond-potential-energy, gchem1.lattice-energy,
             chem.bond-types-properties, gchem1.metals-alloys, gchem1.unit-cells, chem.lewis-structures, gchem1.octet-exceptions,
             gchem1.formal-charge, gchem1.resonance, chem.vsepr-shapes, chem.molecular-polarity, gchem1.vsepr-five-six, gchem1.hybridization]
    note: "Covers official topics 2.1–2.7. Naming compounds (chem.naming-ionic, chem.polyatomic-ions, chem.naming-covalent) is assumed knowledge on the exam and is taught in Chemistry. Molecular orbital diagrams (gchem1.molecular-orbitals) are a general chemistry topic that the AP topic list does not name."
  - num: 3
    title: "Properties of Substances and Mixtures"
    weight: "18–22%"
    topics: [chem.intermolecular-forces, chem.imf-properties, gchem1.comparing-forces, chem.states-of-matter, gchem1.vapor-pressure,
             gchem1.phase-diagrams, chem.gas-pressure, chem.boyles-law, chem.charles-law, chem.combined-gas-law, chem.avogadros-law,
             chem.ideal-gas-law, gchem1.gas-density, gchem1.gas-stoichiometry, gchem1.partial-pressures, chem.kinetic-molecular-theory,
             gchem1.molecular-speeds, gchem1.speed-distributions, gchem1.real-gases, chem.dissolving, chem.molarity, chem.dilution,
             gchem1.electrolytes, gchem1.ion-concentrations, gchem1.separations, chem.solubility-curves, gchem1.dissolution-energy,
             gchem1.gas-solubility, chem.emission-spectra, gchem1.light-waves, gchem1.spectroscopy-regions, gchem1.photons,
             gchem1.hydrogen-spectrum, gchem1.beer-lambert]
    note: "Covers official topics 3.1–3.13, from intermolecular forces and gases to solutions, separations, spectroscopy, photons and the Beer–Lambert law. Particle drawings of solutions (topic 3.8) are part of the lessons for chem.dissolving and gchem1.ion-concentrations. Colligative properties and the Clausius–Clapeyron equation (gchem1.raoults-law, gchem1.freezing-boiling-points, gchem1.osmotic-pressure, gchem1.molar-mass-colligative, gchem1.clausius-clapeyron) are general chemistry topics that the AP topic list does not name."
  - num: 4
    title: "Chemical Reactions"
    weight: "7–9%"
    topics: [chem.conservation-of-mass, chem.coefficients-subscripts, chem.balancing-equations, gchem1.net-ionic-equations,
             chem.physical-chemical-changes, chem.mole-ratios, chem.mass-stoichiometry, chem.limiting-reactant, chem.percent-yield,
             gchem1.solution-stoichiometry, chem.titration, gchem1.titration-calculations, chem.reaction-types, chem.precipitation-reactions,
             chem.neutralization, chem.acid-base-definitions, chem.bronsted-lowry, gchem1.oxidation-numbers, gchem1.redox-reactions,
             gchem1.balancing-redox]
    note: "Covers official topics 4.1–4.9. Gravimetric analysis and redox titrations (gchem1.gravimetric-analysis, gchem1.redox-titrations) are extra practice in the same skills."
  - num: 5
    title: "Kinetics"
    weight: "7–9%"
    topics: [chem.collision-theory, gchem2.reaction-rates, gchem2.rate-laws, gchem2.initial-rates, gchem2.first-order, gchem2.zero-second-order,
             gchem2.graphical-order, gchem2.elementary-steps, chem.activation-energy-catalysts, gchem2.mechanisms,
             gchem2.rate-determining-step, gchem2.pre-equilibrium, gchem2.multistep-energy-profiles, gchem2.catalysis]
    note: "Covers official topics 5.1–5.11. Calculations with the Arrhenius equation (gchem2.arrhenius) are general chemistry that the AP topic list does not name; its ideas sit in topics 5.5 and 5.6."
  - num: 6
    title: "Thermochemistry"
    weight: "7–9%"
    topics: [chem.exo-endo, chem.heat-temperature, chem.specific-heat, chem.calorimetry, gchem1.reaction-calorimetry, chem.heating-curves,
             gchem1.heating-curve-calculations, gchem1.enthalpy-equations, gchem1.enthalpy-stoichiometry, chem.bond-energy,
             gchem1.enthalpy-of-formation, gchem1.hess-law]
    note: "Covers official topics 6.1–6.9. The first law with work, bomb calorimetry and Born–Haber cycles (gchem1.first-law, gchem1.pv-work, gchem1.bomb-calorimetry, gchem1.born-haber) are general chemistry topics that the AP topic list does not name."
  - num: 7
    title: "Equilibrium"
    weight: "7–9%"
    topics: [chem.dynamic-equilibrium, gchem2.equilibrium-expressions, gchem2.reaction-quotient, gchem2.calculating-k, gchem2.kp-kc,
             gchem2.k-magnitude, gchem2.manipulating-k, gchem2.equilibrium-concentrations, gchem2.small-x, chem.le-chatelier,
             gchem2.le-chatelier-quantitative, gchem2.ksp, gchem2.comparing-solubility, gchem2.precipitation-q, gchem2.common-ion]
    note: "Covers official topics 7.1–7.12. Particle drawings of equilibrium mixtures (topic 7.8) are part of the lessons for chem.dynamic-equilibrium and gchem2.calculating-k."
  - num: 8
    title: "Acids and Bases"
    weight: "11–15%"
    topics: [chem.acid-base-definitions, chem.ph-scale, chem.ph-poh, chem.strong-weak-acids, gchem2.strong-acid-ph, gchem2.ka-kb,
             gchem2.weak-acid-ph, gchem2.percent-ionization, gchem2.weak-base-ph, chem.neutralization, gchem2.salt-solutions, gchem2.buffers,
             gchem2.strong-titration-curves, gchem2.weak-titration-curves, gchem2.indicators, gchem2.polyprotic-acids,
             gchem2.acid-strength-structure, gchem2.ph-pka-species, gchem2.buffer-additions, gchem2.henderson-hasselbalch,
             gchem2.buffer-capacity, gchem2.ph-solubility]
    note: "Covers official topics 8.1–8.11. How Kw and neutral pH change with temperature (part of topic 8.1) is taught inside the lesson for gchem2.strong-acid-ph rather than as its own topic."
  - num: 9
    title: "Thermodynamics and Electrochemistry"
    weight: "7–9%"
    topics: [gchem2.entropy-microstates, gchem2.entropy-change-sign, gchem2.standard-entropy, gchem2.second-law, gchem2.gibbs-energy,
             gchem2.temperature-favorability, gchem2.kinetic-control, gchem2.free-energy-k, gchem1.dissolution-energy, gchem2.coupled-reactions,
             gchem2.galvanic-cells, gchem2.electrolytic-cells, gchem2.standard-potentials, gchem2.cell-potential-free-energy, gchem2.nernst,
             gchem2.faraday]
    note: "Covers official topics 9.1–9.11. Topic 9.6 (free energy of dissolution) joins gchem1.dissolution-energy with the entropy and free energy topics. The AP course also asks for hands-on laboratory work, which no website replaces; the Science Lab's Mixing Lab and Gas in a Box help with the ideas."
