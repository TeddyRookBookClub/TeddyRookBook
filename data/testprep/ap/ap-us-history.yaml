# AP U.S. History on the American History & Civics Ladder: the official periods and the ladder topics that cover each one.
# Period names and dates: AP Central course page (read 2026-10-25). Rendered at /test-prep/ap/ap-us-history/.
# Ladder topics come from U.S. History I (ush1) and U.S. History II (ush2). The College Board's periods overlap at their edges
# (1844–1848, 1865–1877, 1890–1898); a topic is listed under the period where the course framework centers it.
key: ap-us-history
title: "AP U.S. History"
ladder: civics
order: 50
source: "AP United States History course page (College Board), unit list: Periods 1 to 9"
source_url: "https://apcentral.collegeboard.org/courses/ap-united-states-history"
asof: "2026-10-25"
blurb: "A college-level survey of American history from 1491 to the present, organized in nine periods, with the historical thinking skills of sourcing, causation, comparison, continuity and change, and argument."
units:
  - num: 1
    title: "Period 1: 1491–1607"
    topics: [ush1.primary-secondary, ush1.sourcing-hipp, ush1.dates-and-periods, ush1.cause-and-effect, ush1.peopling-americas, ush1.native-cultures-1491, ush1.native-societies, ush1.european-exploration, ush1.columbian-exchange, ush1.spanish-empire]
    note: "Native societies before contact, European exploration, the Columbian Exchange and the Spanish empire; the historical thinking skills are taught here and used throughout."
  - num: 2
    title: "Period 2: 1607–1754"
    topics: [ush1.jamestown-virginia, ush1.new-england, ush1.middle-colonies, ush1.southern-colonies, ush1.comparing-regions, ush1.colonial-slavery, ush1.colonial-conflicts, ush1.mercantilism, ush1.awakening-enlightenment, ush1.colonial-self-government]
    note: "French and Dutch colonization appear in lessons on the colonial regions and conflicts rather than as topics of their own."
  - num: 3
    title: "Period 3: 1754–1800"
    topics: [ush1.french-and-indian-war, ush1.taxes-and-protest, ush1.road-to-revolution, ush1.war-begins, ush1.declaration-of-independence, ush1.loyalists-patriots, ush1.revolutionary-war, ush1.treaty-of-paris-1783, ush1.revolution-changes, ush1.articles-of-confederation, ush1.northwest-ordinance, ush1.shays-rebellion, ush1.constitutional-convention, ush1.ratification-debate, ush1.bill-of-rights-1791, ush1.washington-presidency, ush1.first-parties, ush1.adams-and-1800]
