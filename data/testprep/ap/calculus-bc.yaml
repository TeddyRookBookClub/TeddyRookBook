# AP Calculus BC on the Math Ladder: the official units (AP Central course page, read 2026-10-16; see data/testprep/sources.yaml)
# and the ladder topics that cover each one. Rendered at /test-prep/ap/calculus-bc/.
key: calculus-bc
title: "AP Calculus BC"
ladder: math
order: 2
source: "AP Calculus BC course page and the AP Calculus AB and BC Course at a Glance (College Board), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-calculus-bc"
asof: "2026-10-16"
blurb: "All of Calculus AB plus more integration, parametric and polar calculus, and infinite series: about two college semesters."
units:
  - num: 1
    title: "Limits and Continuity"
    weight: "5–10%"
    topics: [pre.limits-graphs-tables, calc1.limit-idea, calc1.one-sided-limits, calc1.limit-laws, calc1.limits-by-factoring, calc1.limits-by-rationalizing,
             calc1.squeeze-theorem, calc1.trig-limits, calc1.infinite-limits, calc1.limits-at-infinity, calc1.continuity, calc1.intermediate-value-theorem]
  - num: 2
    title: "Differentiation: Definition and Fundamental Properties"
    weight: "5–10%"
    topics: [calc1.instantaneous-rate, calc1.derivative-at-a-point, calc1.tangent-lines, calc1.derivative-function, calc1.differentiability,
             calc1.power-rule, calc1.product-rule, calc1.quotient-rule, calc1.trig-derivatives, calc1.exp-log-derivatives]
  - num: 3
    title: "Differentiation: Composite, Implicit, and Inverse Functions"
    weight: "5–10%"
    topics: [calc1.chain-rule, calc1.chain-rule-layers, calc1.implicit-differentiation, calc1.inverse-derivatives, calc1.higher-derivatives]
  - num: 4
    title: "Contextual Applications of Differentiation"
    weight: "5–10%"
    topics: [calc1.derivative-notation, calc1.motion, calc1.related-rates, calc1.linear-approximation, calc1.lhopital]
  - num: 5
    title: "Analytical Applications of Differentiation"
    weight: "10–15%"
    topics: [calc1.mean-value-theorem, calc1.critical-points-extrema, calc1.first-derivative-test, calc1.concavity, calc1.curve-sketching, calc1.optimization]
    note: "The behavior of implicit relations is practiced only through Implicit Differentiation for now."
  - num: 6
    title: "Integration and Accumulation of Change"
    weight: "15–20%"
    topics: [calc1.area-approximations, calc1.riemann-sums, calc1.definite-integral, calc1.integral-properties, calc1.ftc-accumulation, calc1.ftc-evaluate,
             calc1.antiderivatives, calc1.u-substitution, calc1.substitution-definite, calc1.exp-log-integrals, calc1.inverse-trig-integrals,
             calc2.integration-by-parts, calc2.partial-fractions, calc2.improper-integrals]
    note: "BC adds integration by parts, linear partial fractions and improper integrals. Long division and completing the square before integrating have no topic of their own yet."
  - num: 7
    title: "Differential Equations"
    weight: "5–10%"
    topics: [calc2.de-intro, calc2.slope-fields-euler, calc2.separable-equations, calc1.initial-value-antiderivatives, de.growth-cooling, calc2.logistic-equation]
  - num: 8
    title: "Applications of Integration"
    weight: "5–10%"
    topics: [calc1.average-value, calc1.net-change, calc2.area-between-curves, calc2.volume-slicing, calc2.disks-washers, calc2.arc-length]
  - num: 9
    title: "Parametric Equations, Polar Coordinates, and Vector-Valued Functions"
    weight: "10–15%"
    topics: [calc2.parametric-calculus, calc3.vector-functions, calc3.vector-function-calculus, calc3.motion-in-space, calc2.polar-area, calc2.polar-tangents-length]
    note: "Vector-valued functions come from Calculus 3, which works in space; motion in the plane is the special case AP uses."
  - num: 10
    title: "Infinite Sequences and Series"
    weight: "15–20%"
    topics: [calc2.sequences, calc2.series-partial-sums, calc2.geometric-telescoping, calc2.divergence-test, calc2.integral-test, calc2.comparison-tests,
             calc2.alternating-series, calc2.absolute-conditional, calc2.ratio-root-tests, calc2.series-estimates, calc2.power-series,
             calc2.functions-as-series, calc2.differentiate-integrate-series, calc2.taylor-series, calc2.taylor-error, calc2.known-series]
