# AP U.S. Government and Politics on the American History & Civics Ladder: the official units and the ladder topics that cover
# each one. Unit names: AP U.S. Government and Politics course overview (College Board, read 2026-10-25).
# Rendered at /test-prep/ap/ap-us-government/. Ladder topics come from Civics and Government (gov), with a few from Introduction to
# Law (law) and Constitutional Law (conlaw1, conlaw2) for the required cases.
key: ap-us-government
title: "AP U.S. Government and Politics"
ladder: civics
order: 51
source: "AP United States Government and Politics course overview (College Board), unit list"
source_url: "https://apcentral.collegeboard.org/media/pdf/ap-united-states-government-and-politics-course-overview.pdf"
asof: "2026-10-25"
blurb: "A college-level introduction to American government: the Constitution and its foundations, the branches and how they interact, civil liberties and civil rights, political beliefs, and how citizens take part, with required documents and Supreme Court cases."
units:
  - num: 1
    title: "Foundations of American Democracy"
    topics: [gov.purposes-of-government, gov.forms-of-government, gov.natural-rights-social-contract, gov.models-of-democracy, gov.rule-of-law, gov.english-roots, gov.declaration-ideas, gov.articles-weaknesses, gov.convention-compromises, gov.federalist-antifederalist, gov.ratification-bill-of-rights, gov.preamble, gov.article-1, gov.article-2, gov.article-3, gov.articles-4-to-7, gov.separation-of-powers, gov.checks-and-balances, gov.amending, gov.federalism-basics, gov.supremacy-necessary-proper, gov.commerce-power-civics, gov.fiscal-federalism, gov.interstate-relations]
    note: "Foundational documents: the Declaration, the Articles, the Constitution, Federalist No. 10 and No. 51 and Brutus No. 1 (see /american-history/federalist-papers/ and /american-history/anti-federalist-papers/). Required cases McCulloch v. Maryland and United States v. Lopez."
  - num: 2
    title: "Interactions Among Branches of Government"
    topics: [gov.house-and-senate, gov.apportionment-redistricting, gov.powers-of-congress, gov.congressional-leadership, gov.committees, gov.how-a-bill-becomes-law, gov.filibuster-rules, gov.budget-oversight, gov.representation, gov.president-qualifications, gov.formal-powers, gov.informal-powers, gov.bureaucracy, gov.bureaucracy-accountability, gov.impeachment, gov.war-powers, gov.federal-courts, gov.supreme-court-process, gov.judicial-review, gov.judicial-appointments, gov.judicial-philosophy, gov.checks-on-courts]
    note: "Required cases Marbury v. Madison, Baker v. Carr and Shaw v. Reno; Federalist No. 70 and No. 78 are discussed in the presidency and courts lessons."
  - num: 3
    title: "Civil Liberties and Civil Rights"
    topics: [gov.bill-of-rights-overview, gov.selective-incorporation, gov.freedom-of-religion, gov.freedom-of-speech, gov.freedom-of-press, gov.second-amendment-civics, gov.rights-of-accused, gov.privacy, gov.equal-protection-civics, gov.civil-rights-acts, gov.voting-amendments, gov.majority-minority, ush2.brown-v-board, ush2.sit-ins-freedom-rides]
    note: "Required cases Engel v. Vitale, Wisconsin v. Yoder, Tinker v. Des Moines, Schenck v. United States, New York Times v. United States, Gideon v. Wainwright, McDonald v. Chicago, Brown v. Board of Education, and the abortion cases in strictly legal terms; the Letter from Birmingham Jail is read in U.S. History II."
  - num: 4
    title: "American Political Ideologies and Beliefs"
    topics: [gov.political-socialization, gov.public-opinion, gov.voting-and-turnout]
    note: "Ideologies are described in their own adherents' terms. Ideology and economic and social policy (how liberal, conservative and libertarian views shape fiscal and monetary policy) are covered only briefly; see the Economics Ladder for monetary and fiscal policy."
  - num: 5
    title: "Political Participation"
    topics: [gov.voting-and-turnout, gov.becoming-a-citizen, gov.rights-and-responsibilities, gov.political-parties, gov.primaries-conventions, gov.electoral-college, gov.campaign-finance, gov.congressional-elections, gov.interest-groups-media]
    note: "Required case Citizens United v. FEC."
