# AP Macroeconomics on the Economics Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights: AP Central course page (read 2026-10-16). Topic numbers in the notes: the AP Macroeconomics
# Course and Exam Description, Course at a Glance, effective Fall 2026 (read 2026-10-16). Rendered at /test-prep/ap/ap-macroeconomics/.
key: ap-macroeconomics
title: "AP Macroeconomics"
ladder: economics
order: 31
source: "AP Macroeconomics course page and Course and Exam Description (College Board, effective Fall 2026), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-macroeconomics/course"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-macroeconomics-course-and-exam-description.pdf"
asof: "2026-10-16"
blurb: "A college semester of macroeconomics: measuring the economy, AD and AS, money and banking, stabilization policy, growth and the open economy."
units:
  - num: 1
    title: "Basic Economic Concepts"
    weight: "5–10%"
    topics: [micro.scarcity-resources, micro.opportunity-cost, micro.ppc, micro.ppc-opportunity-cost, micro.ppc-shifts,
             micro.comparative-advantage, micro.gains-from-trade, micro.law-of-demand, micro.demand-shift-vs-movement, micro.demand-shifters,
             micro.substitutes-complements, micro.law-of-supply, micro.supply-shifters, micro.market-equilibrium, micro.shortage-surplus,
             micro.equilibrium-changes, micro.double-shifts]
    note: "Covers official topics 1.1–1.6. These are taught once, in the Microeconomics course of this ladder; the Macroeconomics course builds on them."
  - num: 2
    title: "Economic Indicators and the Business Cycle"
    weight: "12–17%"
    topics: [macro.circular-flow, macro.gdp-definition, macro.gdp-expenditure, macro.value-added, macro.gdp-limits, macro.labor-force,
             macro.unemployment-rate, macro.types-unemployment, macro.price-index, macro.inflation-rate, macro.real-values,
             macro.costs-of-inflation, macro.real-gdp, macro.gdp-deflator, macro.business-cycle]
    note: "Covers official topics 2.1–2.7."
  - num: 3
    title: "National Income and Price Determination"
    weight: "17–27%"
    topics: [macro.aggregate-demand, macro.ad-shifters, macro.mpc-mps, macro.spending-multiplier, macro.tax-multiplier, macro.sras, macro.lras,
             macro.ad-as-equilibrium, macro.ad-as-shocks, macro.self-adjustment, macro.fiscal-policy, macro.fiscal-policy-size,
             macro.tax-structures, macro.automatic-stabilizers]
    note: "Covers official topics 3.1–3.9."
  - num: 4
    title: "Financial Sector"
    weight: "18–23%"
    topics: [macro.financial-assets, macro.real-interest-rate, macro.money-functions, macro.money-supply-measures, macro.bank-balance-sheets,
             macro.money-creation, macro.money-market, macro.fed-tools, macro.ample-reserves, macro.monetary-policy, macro.loanable-funds]
    note: "Covers official topics 4.1–4.7."
  - num: 5
    title: "Long-Run Consequences of Stabilization Policies"
    weight: "20–30%"
    topics: [macro.policy-mix, macro.short-run-phillips, macro.long-run-phillips, macro.quantity-theory, macro.deficits-debt,
             macro.crowding-out, macro.productivity, macro.rule-of-70, macro.growth-policy, macro.schools-of-thought]
    note: "Covers official topics 5.1–5.7. Schools of Macroeconomic Thought is our addition, so the long-run debates are presented fairly."
  - num: 6
    title: "Open Economy—International Trade and Finance"
    weight: "10–13%"
    topics: [macro.balance-of-payments, macro.exchange-rates, macro.forex-market, macro.forex-shifts, macro.net-exports-exchange,
             macro.capital-flows, macro.saving-investment-identity]
    note: "Covers official topics 6.1–6.6. Fixed and floating exchange-rate systems are described in lessons but have no practice topic."
