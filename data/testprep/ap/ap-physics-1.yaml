# AP Physics 1 on the Physics Ladder: the official units and the ladder topics that cover each one.
# Unit names and exam weights (multiple-choice section): AP Central course page (read 2026-10-16). Topic numbers in the
# notes: the AP Physics 1 Course at a Glance (read 2026-10-16). Rendered at /test-prep/ap/ap-physics-1/.
# Ladder topics come mostly from Physics 1 (phys1); fluids (unit 8) are taught in Physics 2 (phys2), as the ladder's course
# titles fix, and density in the Earth & Space Ladder (earthsci.density).
key: ap-physics-1
title: "AP Physics 1: Algebra-Based"
ladder: physics
order: 10
source: "AP Physics 1 course page and Course at a Glance (College Board, revised course effective 2024-25), unit list"
source_url: "https://apcentral.collegeboard.org/courses/ap-physics-1"
source_ced: "https://apcentral.collegeboard.org/media/pdf/ap-physics-1-course-at-a-glance-printable-poster.pdf"
asof: "2026-10-16"
blurb: "A first college course in algebra-based physics: motion, forces, energy, momentum, rotation, oscillations and fluids."
units:
  - num: 1
    title: "Kinematics"
    weight: "10–15%"
    topics: [phys1.position-displacement, phys1.average-velocity, phys1.position-time-graphs, phys1.instantaneous-velocity,
             phys1.acceleration, phys1.velocity-time-graphs, phys1.motion-graph-translation, phys1.kinematic-equations,
             phys1.kinematics-without-time, phys1.free-fall, phys1.vertical-launch, phys1.vector-components, phys1.vector-addition,
             phys1.relative-velocity, phys1.projectile-horizontal, phys1.projectile-angled]
    note: "Covers official topics 1.1–1.5 (scalars and vectors, displacement, velocity and acceleration, representing motion, reference frames, motion in two dimensions)."
  - num: 2
    title: "Force and Translational Dynamics"
    weight: "18–23%"
    topics: [phys1.systems-center-of-mass, phys1.free-body-diagrams, phys1.newtons-third-law, phys1.equilibrium-first-law,
             phys1.second-law-systems, phys1.normal-force, phys1.forces-at-angles, phys1.inclined-planes, phys1.gravitational-force,
             phys1.gravitational-field, phys1.kinetic-friction, phys1.static-friction, phys1.friction-on-inclines,
             phys1.connected-objects, phys1.pulley-systems, phys1.spring-force, phys1.centripetal-acceleration,
             phys1.centripetal-force, phys1.vertical-circles]
    note: "Covers official topics 2.1–2.9. Banked curves are taught with friction in Mechanics with Calculus (mech.banked-curves)."
  - num: 3
    title: "Work, Energy, and Power"
    weight: "18–23%"
    topics: [physsci.kinetic-energy, phys1.work, phys1.work-from-graphs, phys1.work-energy-theorem, phys1.potential-energy-systems,
             phys1.spring-potential-energy, phys1.gravitational-pe-universal, phys1.energy-conservation, phys1.energy-bar-charts,
             phys1.friction-energy, phys1.power]
    note: "Covers official topics 3.1–3.5. Translational kinetic energy itself (½mv²) is first taught in Physical Science."
  - num: 4
    title: "Linear Momentum"
    weight: "10–15%"
    topics: [phys1.momentum, phys1.impulse, phys1.momentum-conservation, phys1.inelastic-collisions, phys1.elastic-collisions,
             phys1.explosions-recoil, phys1.center-of-mass-motion]
    note: "Covers official topics 4.1–4.4."
  - num: 5
    title: "Torque and Rotational Dynamics"
    weight: "10–15%"
    topics: [phys1.angular-quantities, phys1.rotational-kinematics, phys1.linear-angular, phys1.torque, phys1.rotational-inertia,
             phys1.rotational-equilibrium, phys1.rotational-second-law, phys1.rotation-translation]
    note: "Covers official topics 5.1–5.6. Gap: the parallel-axis theorem is taught only in Mechanics with Calculus (mech.parallel-axis), where it builds on integration; an algebra-only version is not yet written."
  - num: 6
    title: "Energy and Momentum of Rotating Systems"
    weight: "5–8%"
    topics: [phys1.rotational-kinetic-energy, phys1.angular-momentum, phys1.angular-momentum-conservation, phys1.rolling,
             phys1.orbiting-satellites, astro.kepler-second-law]
    note: "Covers official topics 6.1–6.6. Torque and work (6.2) is part of phys1.rotational-kinetic-energy, and angular impulse (6.3) part of phys1.angular-momentum. Energy and angular momentum on elliptical orbits are treated in full in Mechanics with Calculus (mech.orbital-energy, mech.kepler-second-from-newton)."
  - num: 7
    title: "Oscillations"
    weight: "5–8%"
    topics: [phys1.shm-intro, phys1.spring-oscillator-period, phys1.pendulum-period, phys1.shm-graphs, phys1.shm-energy]
    note: "Covers official topics 7.1–7.4."
  - num: 8
    title: "Fluids"
    weight: "10–15%"
    topics: [earthsci.density, physsci.pressure, phys2.pressure-depth, phys2.pascals-principle, phys2.buoyancy,
             phys2.continuity, phys2.bernoulli]
    note: "Covers official topics 8.1–8.4. On this ladder fluids open Physics 2, so a learner preparing for AP Physics 1 takes the Fluids unit of Physics 2 as well; density is taught once, in Earth Science (earthsci.density)."
