# Test Prep: every fact the section states about a test, with the official page it came from and the date it was read.
# Pages render facts from data/testprep/<test>.yaml and data/testprep/ap/*.yaml; each fact there names a source key below.
# Only the test makers' own public pages are used. Wording on our pages is our own.
asof: "2026-10-17"
sources:
  sat-structure:
    name: "How the SAT Is Structured (College Board, SAT Suite)"
    url: "https://satsuite.collegeboard.org/sat/whats-on-the-test/structure"
    read: "2026-10-16"
    facts:
      - "The Math section has 44 questions in two equal modules; 70 minutes in all, 35 minutes per module."
      - "The test is adaptive: the first module of each section has a broad mix of easy, medium and hard questions, and how a student does on it decides whether the second module is harder or easier."
      - "Most questions are multiple choice; some math questions ask you to enter the answer."
  sat-math-overview:
    name: "The Math Section: Overview (College Board, SAT Suite)"
    url: "https://satsuite.collegeboard.org/sat/whats-on-the-test/math/overview"
    read: "2026-10-16"
    facts:
      - "Four content areas: Algebra 13–15 questions, Advanced Math 13–15, Problem-Solving and Data Analysis 5–7, Geometry and Trigonometry 5–7."
      - "Questions from all four areas appear in each module; within a module, questions run from easiest to hardest."
      - "About 30% of the Math section's questions are set in context."
      - "Two question formats: multiple choice and student-produced response."
  sat-math-skills:
    name: "SAT Suite alignment, Math: PSAT 10, PSAT/NMSQT and SAT (College Board, for K-12 educators)"
    url: "https://satsuite.collegeboard.org/k12-educators/about/alignment/math/psat-10-psat-nmsqt-sat"
    read: "2026-10-16"
    facts:
      - "Each SAT Math module has 20 operational questions and 2 pretest (unscored) questions."
      - "Domain shares: Algebra about 35%, Advanced Math about 35%, Problem-Solving and Data Analysis about 15%, Geometry and Trigonometry about 15%."
      - "Skills listed per domain (used for our area descriptions, in our own words)."
  sat-spr:
    name: "Student-Produced Response Questions (College Board, SAT Suite)"
    url: "https://satsuite.collegeboard.org/digital/whats-on-the-test/math/student-produced"
    read: "2026-10-16"
    facts:
      - "About 75% of Math questions use a 4-option multiple-choice format; the rest are student-produced responses."
      - "A student-produced response question may have more than one correct answer; you give one."
  sat-calculator:
    name: "SAT Suite of Assessments Calculator Policy (College Board)"
    url: "https://satsuite.collegeboard.org/in-school-assessments/calculator-policy"
    read: "2026-10-16"
    facts:
      - "Bluebook, the testing app, has a built-in Desmos calculator with graphing and scientific options, usable throughout the Math section."
      - "Students may bring an approved calculator; calculators are not required."
  act-enhancements:
    name: "The Enhanced ACT (ACT, Inc.)"
    url: "https://www.act.org/content/act/en/products-and-services/the-act/test-changes/enhancements.html"
    read: "2026-10-16"
    facts:
      - "Mathematics: 45 questions in 50 minutes."
      - "Math questions now have 4 answer choices instead of 5."
      - "Science and writing are optional; math is part of the core test."
      - "The enhanced ACT began with national online testing in April 2025, paper and international testing in September 2025, and school-day testing in spring 2026."
  act-preparing:
    name: "Preparing for the ACT, 2025–2026 (ACT, Inc.)"
    url: "https://www.act.org/content/dam/act/unsecured/documents/Preparing-for-the-ACT-e.pdf"
    read: "2026-10-16"
    facts:
      - "The mathematics test has 45 questions (41 scored) in 50 minutes; each question has four answer choices."
      - "A permitted calculator may be used on the mathematics test, and all of the problems can be solved without one."
      - "Reporting categories: Preparing for Higher Math (80%): Number and Quantity 10–12%, Algebra 17–20%, Functions 17–20%, Geometry 17–20%, Statistics and Probability 12–15%; Integrating Essential Skills (20%); Modeling (counted across the others)."
      - "Basic formulas are assumed known; complex formulas are not required to be recalled."
  clt-admins:
    name: "CLT overview for school administrators (Classic Learning Initiatives)"
    url: "https://info.cltexam.com/hubfs/Exam%20info/CLT%20overview%20for%20school%20admins.pdf?hsLang=en"
    read: "2026-10-16"
    facts:
      - "Quantitative Reasoning: 40 questions of logic and mathematics in 45 minutes; calculators not permitted."
      - "The CLT has three sections of 40 questions each (Verbal Reasoning 40 minutes, Grammar/Writing 35 minutes, Quantitative Reasoning 45 minutes), 120 minutes of testing in all."
      - "Wrong answers and guesses are not penalized."
  clt-faq-time:
    name: "How long does the test take? (CLT FAQ)"
    url: "https://www.cltexam.com/faqs/how-long-does-the-test-take-how-much-time-is-allotted-to-each-section/"
    read: "2026-10-16"
    facts:
      - "45 minutes for the Quantitative Reasoning section; 2 hours of testing time for the CLT and CLT10."
  clt-test-page:
    name: "The CLT (Classic Learning Test)"
    url: "https://www.cltexam.com/tests/clt/"
    read: "2026-10-16"
    facts:
      - "Three sections: Verbal Reasoning, Grammar and Writing, Quantitative Reasoning; 2 hours."
      - "Taken in school or at home with remote proctoring."
  clt-content:
    name: "Assessment Content Brief for the CLT and CLT10 (Classic Learning Initiatives)"
    url: "https://info.cltexam.com/hubfs/Exam%20info/Assessment%20Content%20Brief%20for%20CLT%20&%20CLT10.pdf"
    read: "2026-10-16"
    facts:
      - "Quantitative Reasoning covers three domains: Algebra (Arithmetic and Operations; Algebraic Expressions and Equations), Geometry (Plane Geometry; Properties of Shapes; Trigonometry, CLT only) and Mathematical Reasoning (Logic; Word Problems)."
      - "Basic formulas are given; basic trigonometric functions and identities are given."
      - "Skill lists per category (used for our area descriptions, in our own words). No question counts per area are published."
  clt-sample:
    name: "CLT Sample Test (Classic Learning Initiatives)"
    url: "https://info.cltexam.com/hubfs/Sales/Sample%20Tests/CLT%20Sample%20Test.pdf"
    read: "2026-10-16"
    facts:
      - "Directions: 40 questions in 45 minutes; calculators are not permitted in the math portion; figures are not necessarily drawn to scale; a short list of formulas is provided."
      - "Each question has four answer choices, A through D."
  ap-calc-ab:
    name: "AP Calculus AB, Course (College Board, AP Central)"
    url: "https://apcentral.collegeboard.org/courses/ap-calculus-ab"
    read: "2026-10-16"
    facts:
      - "Eight units, from Unit 1: Limits and Continuity to Unit 8: Applications of Integration, with multiple-choice weightings."
      - "Minor clarifications for 2026-27; course content has not changed; multiple-choice count and timing change with the May 2027 exam."
  ap-calc-bc:
    name: "AP Calculus BC, Course (College Board, AP Central)"
    url: "https://apcentral.collegeboard.org/courses/ap-calculus-bc"
    read: "2026-10-16"
    facts:
      - "Ten units: the eight AB units plus Unit 9: Parametric Equations, Polar Coordinates, and Vector-Valued Functions and Unit 10: Infinite Sequences and Series."
  ap-calc-glance:
    name: "AP Calculus AB and BC Course at a Glance (College Board)"
    url: "https://apcentral.collegeboard.org/media/pdf/ap-calculus-ab-bc-course-at-a-glance.pdf"
    read: "2026-10-16"
    facts:
      - "Topic titles in each unit, with BC-only topics marked (integration by parts, partial fractions, improper integrals, Euler's method, logistic models, arc length; Units 9 and 10)."
  ap-precalc:
    name: "AP Precalculus, The Course (College Board, AP Central)"
    url: "https://apcentral.collegeboard.org/courses/ap-precalculus/course"
    read: "2026-10-16"
    facts:
      - "Four units: Polynomial and Rational Functions; Exponential and Logarithmic Functions; Trigonometric and Polar Functions; Functions Involving Parameters, Vectors, and Matrices."
      - "Units 1, 2 and 3 are assessed on the AP Exam; Unit 4 is not."
  ap-precalc-glance:
    name: "AP Precalculus Course at a Glance (College Board)"
    url: "https://apcentral.collegeboard.org/media/pdf/ap-precalculus-course-at-a-glance.pdf"
    read: "2026-10-16"
    facts:
      - "Topic titles in each of the four units."
  ap-stats:
    name: "AP Statistics, Course (College Board, AP Central)"
    url: "https://apcentral.collegeboard.org/courses/ap-statistics"
    read: "2026-10-16"
    facts:
      - "Revised for the 2026-27 school year; five units: Exploring One-Variable Data and Collecting Data; Probability, Random Variables, and Probability Distributions; Inference for Categorical Data: Proportions; Inference for Quantitative Data: Means; Regression Analysis."
  ap-stats-revisions:
    name: "AP Statistics, Future Revisions (College Board, AP Central)"
    url: "https://apcentral.collegeboard.org/courses/ap-statistics/future-revisions"
    read: "2026-10-16"
    facts:
      - "Effective 2026-27: the eight earlier units were consolidated into five; removed: departures from linearity, combining random variables, the geometric distribution, the chi-square goodness-of-fit test, and inference for slopes; topics on investigative questions added."
  ap-stats-ced:
    name: "AP Statistics Course and Exam Description, effective fall 2026 (College Board)"
    url: "https://apcentral.collegeboard.org/media/pdf/ap-statistics-course-and-exam-description.pdf"
    read: "2026-10-16"
    facts:
      - "Topic titles for Units 1, 2 and 3 (for example 2.10 The Binomial Distribution, 2.11 The Normal Distribution, 2.12 Sampling Distributions and the Central Limit Theorem, 3.14 Setting Up a Chi-Square Test for Homogeneity or Independence)."
  # ---------------- how the tests changed (read 2026-10-17) ----------------
  sat-digital-news:
    name: "The Digital SAT Brings Student-Friendly Changes to the Test Experience (College Board newsroom, January 25, 2022)"
    url: "https://newsroom.collegeboard.org/digital-sat-brings-student-friendly-changes-test-experience"
    read: "2026-10-17"
    facts:
      - "The SAT moves to digital delivery: internationally in 2023, in the U.S. in 2024."
      - "About two hours instead of three, with more time per question; shorter reading passages with one question each; calculators allowed on the entire Math section; still scored on the 1600 scale."
  sat-spec-overview:
    name: "The Digital SAT Suite of Assessments: Specifications Overview (College Board, summer 2022)"
    url: "https://satsuite.collegeboard.org/media/pdf/digital-sat-test-spec-overview.pdf"
    read: "2026-10-17"
    facts:
      - "Digital SAT: Reading and Writing 54 questions in 64 minutes, Math 44 in 70, a 10-minute break: 2 hours 14 minutes in all; the paper SAT took about 3 hours."
      - "Calculator allowed on the whole Math section; the paper SAT had a no-calculator portion and a calculator portion."
      - "Reading and Writing domains: Craft and Structure about 28%, Information and Ideas about 26%, Standard English Conventions about 26%, Expression of Ideas about 20%."
      - "The digital suite aims to maintain the rigor of the paper tests; the two measure similar but not identical content; scores are on the same 400–1600 scale, linked to paper scores by studies in 2022."
  sat-rw-page:
    name: "The Reading and Writing Section (College Board, SAT Suite)"
    url: "https://satsuite.collegeboard.org/sat/whats-on-the-test/reading-writing"
    read: "2026-10-17"
    facts:
      - "Passages run from 25 to 150 words, each with a single multiple-choice question."
      - "Four content domains: Information and Ideas, Craft and Structure, Expression of Ideas, Standard English Conventions (sentence structure, usage and punctuation)."
  sat-bluebook-directions:
    name: "SAT Bluebook Test Directions, fall 2026 (College Board)"
    url: "https://satsuite.collegeboard.org/media/pdf/english-sat-test-directions-bb.pdf"
    read: "2026-10-17"
    facts:
      - "Typed (student-produced) answers: up to 5 characters for a positive answer, 6 with the negative sign; a fraction that doesn't fit is entered as a decimal; mixed numbers as improper fractions or decimals; no symbols such as % or $."
      - "A calculator is permitted for all Math questions; the reference sheet and calculator are available throughout."
  sat-passage-brief:
    name: "Do Changes in SAT Reading Passage Length Change Student Performance? (College Board research brief, July 2026)"
    url: "https://research.collegeboard.org/media/pdf/sat-passage-length-research-brief.pdf"
    read: "2026-10-17"
    facts:
      - "Digital SAT: 54 passages of 25 to 150 words, one question each. Paper SAT: nine passages of 400 to 750 words, several questions each."
      - "Conclusion: passage length does not meaningfully affect performance. In its experiment (367 students), students scored slightly higher on questions about the longer versions of the same passages."
  sat-rodriguez-2025:
    name: "The SAT Still Measures What Matters (Priscilla Rodriguez, College Board, August 6, 2025)"
    url: "https://allaccess.collegeboard.org/sat-still-measures-what-matters"
    read: "2026-10-17"
    facts:
      - "Responds to claims that the digital SAT is easier, mostly about the shorter passages; says the passages keep the same complexity."
      - "Seven percent of students scored 1400 or higher both on the paper test in 2019 and recently; relationships with GPA, PSAT and AP scores have not weakened."
  sat-torres-2025:
    name: "The SAT’s Trust Fall (Michael Torres, James G. Martin Center, June 18, 2025)"
    url: "https://jamesgmartin.center/2025/06/the-sats-trust-fall/"
    read: "2026-10-17"
    facts:
      - "Opinion by a Classic Learning Test employee: the digital SAT is less demanding; it cut long reading, allows a calculator throughout, and gives about 1.6 minutes per math question instead of 1.3."
  sat-cincinnati-2024:
    name: "Suresh and Rawat, a working paper on SAT math difficulty, 2008–2023 (University of Cincinnati, arXiv 2409.10750, 2024)"
    url: "https://arxiv.org/abs/2409.10750"
    read: "2026-10-17"
    facts:
      - "Argues that paper SAT math questions grew easier from 2008 to 2023, using a new method its authors say can't yet support causal claims. Not peer reviewed; it stops before the digital SAT."
  sat-launch-2024:
    name: "College Board declares launch of shorter, digital SAT a success (Kara Arundel, Higher Ed Dive, March 13, 2024)"
    url: "https://www.highereddive.com/news/shorter-online-sat-college-admissions-testing/710225/"
    read: "2026-10-17"
    facts:
      - "The digital SAT debuted in the U.S. on Saturday, March 9, 2024; just over two hours instead of three."
  sat-redesign-2016:
    name: "Student Reactions Following First Administration of the New SAT (College Board newsroom, March 5, 2016)"
    url: "https://newsroom.collegeboard.org/must-read-student-reactions-following-first-administration-new-satr"
    read: "2026-10-17"
    facts:
      - "The first national administration of the redesigned (paper) SAT was on March 5, 2016."
  sat-student-guide-2018:
    name: "SAT Student Guide 2018–2019 (College Board; copy hosted by Everett Public Schools)"
    url: "https://www.everettsd.org/cms/lib/WA01920133/Centricity/Domain/9/pdf_sat-student-guide.pdf"
    read: "2026-10-17"
    facts:
      - "Paper SAT: Reading 52 questions in 65 minutes; Writing and Language 44 in 35; Math 58 in 80; 180 minutes in all, plus an optional 50-minute essay."
      - "Math: 20 questions in the no-calculator portion (25 minutes) and 38 in the calculator portion (55 minutes); 45 multiple choice and 13 student-produced responses."
      - "Grid-in answers: the grid holds four characters and only positive numbers and zero; fractions or decimals; mixed numbers as improper fractions or decimals."
      - "Reading and writing questions have four choices, A to D. No points are taken off for wrong answers."
  sat-math-2019:
    name: "SAT Math That Matters Most (College Board presentation, January 2019; hosted by the Illinois State Board of Education)"
    url: "https://www.isbe.net/Documents/SAT-Math-That-Matters-Most-Jan2019.pdf"
    read: "2026-10-17"
    facts:
      - "Paper SAT Math: Heart of Algebra 19 questions, Problem Solving and Data Analysis 17, Passport to Advanced Math 16, Additional Topics in Math 6."
  act-studentblog-2025:
    name: "The Enhanced ACT Explained (ACT Student Blog, February 19, 2025)"
    url: "https://studentblog.act.org/the-new-act-test"
    read: "2026-10-17"
    facts:
      - "The test is 75 minutes shorter with 44 fewer questions, and gives more time per question. Math questions have four answer choices instead of five. Science and writing are optional. The Composite averages English, math and reading. The 1–36 scale stays."
  act-linking-2025:
    name: "The Enhanced ACT Linking Study Report (ACT Research R2515, March 2025)"
    url: "https://www.act.org/content/dam/act/unsecured/documents/R2515-The-Enhanced-ACT-Linking-Study-Report-2025-03-updated.pdf"
    read: "2026-10-17"
    facts:
      - "Legacy: English 75 questions in 45 minutes, Math 60 in 60, Reading 40 in 35, Science 40 in 35. Enhanced: English 50 in 35, Math 45 in 50, Reading 36 in 40, Science 40 in 40."
      - "The difficulty of the enhanced forms is similar to that of the legacy test in all four sections, with a tendency to be slightly more difficult. Scores on the two can be used interchangeably."
  act-framework-2026:
    name: "Design Framework for the ACT Enhancements (ACT Research R2519, February 2026)"
    url: "https://www.act.org/content/dam/act/unsecured/documents/R2519-Design-Framework-for-the-ACT-Enhancements-2026-02.pdf"
    read: "2026-10-17"
    facts:
      - "Math, legacy: 60 items, 60 minutes, 60 seconds an item, 5 answer options. Enhanced: 45 items (41 scored), 50 minutes, 67 seconds an item, 4 options."
      - "Legacy math blueprint: Preparing for Higher Math 57–60% (Number and Quantity 8–12%, Algebra 12–15%, Functions 12–15%, Geometry 12–15%, Statistics and Probability 8–12%); Integrating Essential Skills 40–43%; Modeling over 20%."
      - "Enhanced math has fewer items set in a real-world context and a smaller share of Integrating Essential Skills and of advanced topics. Four options reduce the time spent reading answer choices."
      - "Composite time 125 minutes instead of 175; about nine seconds more per item on average. Scores from the enhanced ACT can be used interchangeably with legacy scores for most purposes."
  act-legacy-content:
    name: "ACT Test Content (ACT, Inc., legacy test description)"
    url: "https://act.org/content/dam/act/unsecured/documents/act-test-content.pdf"
    read: "2026-10-17"
    facts:
      - "Legacy test: English 75 questions in 45 minutes, Mathematics 60 in 60, Reading 40 in 35, Science 40 in 35."
  act-paris-2024:
    name: "Assessing the ACT Changes (Ben Paris, opinion, Inside Higher Ed, August 5, 2024)"
    url: "https://www.insidehighered.com/index%2Ephp/node/157656"
    read: "2026-10-17"
    facts:
      - "A test-prep tutor argues that with fewer questions and more time each, the ACT will become substantially easier, mostly by easing time pressure, though he expects the effect to be minor."
  act-mfp-2024:
    name: "ACT Changes Include Fewer Questions, Shorter Passages and Optional Science Section (Mississippi Free Press, September 9, 2024)"
    url: "https://www.mississippifreepress.org/act-changes-include-fewer-questions-shorter-passages-and-optional-science-section/"
    read: "2026-10-17"
    facts:
      - "215 questions down to 171; the core test from about three hours to two; counselors expect less fatigue and stress; ACT said its research showed scores are comparable."
  act-free-prep:
    name: "Free ACT Practice Tests and Prep (ACT, Inc.)"
    url: "https://www.act.org/content/act/en/products-and-services/the-act/test-preparation/free-act-test-prep.html"
    read: "2026-10-17"
    facts:
      - "Four free full-length practice tests (online and PDF), sample questions in every subject, and short quizzes."
  sat-practice:
    name: "SAT Suite Practice and Preparation (College Board)"
    url: "https://satsuite.collegeboard.org/practice"
    read: "2026-10-17"
    facts:
      - "Free full-length adaptive practice tests in the Bluebook app, and free practice on Khan Academy."
  sat-khan:
    name: "How to Use Khan Academy (College Board)"
    url: "https://satsuite.collegeboard.org/practice/khan-academy"
    read: "2026-10-17"
    facts:
      - "Free official SAT practice on Khan Academy, made with the College Board."
  sat-paper-practice:
    name: "Full-Length SAT and PSAT Paper Practice Tests (College Board)"
    url: "https://satsuite.collegeboard.org/practice/practice-tests/paper"
    read: "2026-10-17"
    facts:
      - "The paper practice tests listed are linear versions of the digital SAT, meant for students testing on paper as an accommodation; no pre-2024 tests are listed."
  clt-practice:
    name: "Take a CLT or CLT10 Practice Exam (Classic Learning Initiatives)"
    url: "https://www.cltexam.com/tests/practice-test/"
    read: "2026-10-17"
    facts:
      - "A free practice test in your CLT account, with the same experience and structure as the real test, answer explanations and results."
  clt-vs-sat:
    name: "CLT vs. SAT (Classic Learning Initiatives, updated July 2026)"
    url: "https://www.cltexam.com/compare/clt-vs-sat/"
    read: "2026-10-17"
    facts:
      - "CLT: about 2 hours, online, scored 0–120; the essay is not offered on the remotely proctored test."
  clt-blog-2025:
    name: "What Does the CLT Actually Test? (CLT Journal, July 16, 2025)"
    url: "https://blog.cltexam.com/what-does-the-clt-actually-test/"
    read: "2026-10-17"
    facts:
      - "Verbal Reasoning asks for passage interpretation; Grammar and Writing covers style and tone as well as grammar and punctuation."
  ednext-clt-2026:
    name: "The Classic Learning Test Takes Aim at the SAT–ACT Duopoly (Jon Marcus, Education Next, March 26, 2026)"
    url: "https://www.educationnext.org/?p=49725708"
    read: "2026-10-17"
    facts:
      - "The CLT is given in person and remotely, about 15 times a year; its math covers algebra, geometry and mathematical reasoning, with no calculator. The article reports no change to the format."

