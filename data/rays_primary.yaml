- title: English money (history)
  mins: 10
  optional: true
  goal: Optional. Your child learns how old English money worked, a good link to stories and history.
  materials:
  - A slate, small whiteboard or paper and pencil
  book: 'The table: 4 farthings make 1 penny; 12 pence make 1 shilling; 20 shillings make 1 pound. Then problems on changing one to another.'
  steps:
  - - Why learn it?
    - Britain used pounds, shillings and pence until 1971. Characters in Dickens, Austen and many children's books pay in shillings and pence.
  - - The table
    - Read the table together. How many pence in a pound? (12 × 20 = 240.)
  - - A few problems
    - Do as many problems on the page as your child enjoys.
  practice: Optional. Skip if your child isn't interested.
