- title: Pounds and ounces
  mins: 15
  goal: Your child knows that 16 ounces make a pound and 2,000 pounds make a ton.
  materials:
  - A kitchen scale and some food packages
  - A slate, small whiteboard or paper and pencil
  book: 'Avoirdupois weight, the everyday kind: 16 ounces make 1 pound; 100 pounds make 1 hundredweight; 2,000 pounds make 1 ton. Then problems about rice, sugar, hay and fish.'
  steps:
  - - Weigh things
    - Read the weights on food packages. Find one that weighs a pound, and one that weighs about 8 ounces.
  - - The table
    - Read the table. The hundredweight is rarely used now; pounds and tons are.
  - - Book problems
    - 'Do the problems: 2 pounds is 32 ounces, 64 ounces is 4 pounds.'
  practice: Guess and then weigh things in the kitchen.
