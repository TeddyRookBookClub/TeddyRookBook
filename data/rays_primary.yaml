- title: 'Liquid measure: pints, quarts and gallons'
  mins: 15
  goal: Your child knows how pints, quarts and gallons relate.
  materials:
  - A pint glass, a quart jar and a gallon jug, or any measuring cups
  - Water
  - A slate, small whiteboard or paper and pencil
  book: 'The table: 4 gills make 1 pint; 2 pints make 1 quart; 4 quarts make 1 gallon. Then problems about oil, milk, molasses and syrup.'
  steps:
  - - Pour it
    - Fill a quart with two pints of water, then a gallon with four quarts. This is the best part of the lesson.
  - - The table
    - Read it. Gills are no longer used; the rest are on every milk jug.
  - - Book problems
    - Work through the page.
