book:
  id: raysnewprimarya00raygoog
  title: Ray's New Primary Arithmetic
  year: 1877
  key: primary
  short: Primary
  eyebrow: Ray's Arithmetic · Book 1 · 1877
  hero: 89 short lessons, from counting to ten to money and measures, for children about 5 to 7. Each one has a guide you can follow step by step, with the right page of the book beside it.
  how:
  - <b>A little, often.</b> About 15 minutes a day, three to five days a week. That covers the book in about a school year.
  - <b>Repeat freely.</b> Most table lessons take two or three days before the facts come easily. Move on when they do, not before.
  - <b>Real things first.</b> Have a cup of about 40 counters ready (dried beans, buttons or pennies), and a slate, small whiteboard or paper.
  - '<b>Out loud.</b> Ray''s children said every answer in a full sentence: “3 and 2 are 5.” The guides keep that habit.'
  - <b>Skip what's history.</b> A few lessons near the end teach old measures (English money, troy weight). They're marked optional.
units:
- id: 1
  name: Counting and writing numbers
  from: 1
  to: 6
  text: Count real things to 10, then read and write every number to 100.
- id: 2
  name: First number facts with counters
  from: 7
  to: 10
  text: Put small groups together and take them apart with beans or buttons, before any tables.
- id: 3
  name: Addition
  from: 11
  to: 23
  text: The addition tables, one number at a time, each with short story problems.
- id: 4
  name: Subtraction
  from: 24
  to: 37
  text: 'Taking away: the subtraction tables, then adding and subtracting together.'
- id: 5
  name: Multiplication
  from: 38
  to: 51
  text: Equal groups, then the times tables from 1 to 10, with reviews.
- id: 6
  name: Division
  from: 52
  to: 63
  text: 'Sharing and grouping: how many times one number is contained in another.'
- id: 7
  name: Signs, bigger numbers and mixed problems
  from: 64
  to: 78
  text: The signs + − × ÷ =, adding and subtracting past 20, and story problems that use every operation.
- id: 8
  name: Money, weights and measures
  from: 79
  to: 89
  text: The old tables of money, weight, length, area and time. Some are history now; each guide says which still matter.
lessons:
- title: Counting to ten and the figures 1 to 10
  mins: 15
  goal: Your child counts up to ten real objects, touching each one once, and writes the figure for each number.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles)'
  - A slate, small whiteboard or paper and pencil
  book: Ten rows of balls, from one ball to ten, with the word and the figure beside each row. The note to the teacher says the child should point to each ball while counting, then write the figure for each number.
  steps:
  - - Count real things first
    - 'Put 3 beans in a row. Touch each one as you count.

      Say: One, two, three. There are three beans.

      Now let your child do it, touching each bean once. Repeat with 5, then 2, then 7.'
  - - Watch for skipping and double counting
    - Young children often say a number without touching anything, or touch one bean twice. If that happens, slow down and move each bean to the side as it is counted.
  - - Count the balls in the book
    - Open the book page. Have your child point to each ball in a row and count aloud, row by row, from one ball to ten.
  - - Match the figure
    - 'Point to the figure at the end of each row.

      Say: This is how we write three.

      Ask your child to find the figure for 4, for 7, for 10.'
  - - Write the figures
    - Say a number from 1 to 10 and have your child write its figure. Start in order, then mix them up. Show 10 as "a one and a naught".
  - - Finish with something real
    - 'Ask your child to count something around the house: the chairs at the table, the windows in a room, the spoons in a drawer.'
  practice: Count objects to 10 every day this week, then write the figures 1 to 10 from memory.
  tip: The book says to teach one thing at a time, and teach it thoroughly. If counting is shaky, stay here for a few days before writing numbers.
  num: 1
  roman: I
  idx: 11
  unit: 1
- title: Numbers from 11 to 40
  mins: 15
  goal: Your child reads and writes the numbers from eleven to forty, and sees that twenty-one means two tens and one more.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles), at least 40 of them'
  - A slate, small whiteboard or paper and pencil
  book: A table of the number words from eleven to forty with their figures. The note says counting objects is now carried to 40, and that one column, or less, is enough for one lesson.
  steps:
  - - Review 1 to 10
    - Have your child count ten beans and write the figures 1 to 10 quickly.
  - - Make a ten
    - 'Count out ten beans and push them together into a pile, or put them in a small cup.

      Say: This is a ten.

      Put 1 more bean beside it. Say: Ten and one is eleven. We write it 1 and 1: one ten and one more.'
  - - Build the teens
    - 'Add one bean at a time beside the ten and name each number: twelve, thirteen ... up to twenty. At twenty, make a second ten.'
  - - Read the table
    - 'Open the book page. Read one column together: the word and the figure. Then let your child read it alone.'
  - - Twenty-one, thirty-one
    - 'Show two tens and one: twenty-one, written 21. Three tens and one: thirty-one, 31. Ask: How many tens in 34? How many ones?'
  - - Write a few
    - Say five numbers from the column you read and have your child write them.
  practice: Read and write the next column of the table tomorrow, until all of 11 to 40 is easy. Don't do it all in one sitting.
  tip: Eleven and twelve sound nothing like "ten-one" and "ten-two", so children find them hardest. Point that out, and practise them on their own.
  num: 2
  roman: II
  idx: 12
  unit: 1
- title: Numbers from 41 to 70
  mins: 15
  goal: Your child reads and writes the numbers from forty-one to seventy, and keeps the earlier numbers fresh.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles), or bundles of ten (sticks with a rubber band, or cups of ten beans)'
  - A slate, small whiteboard or paper and pencil
  book: The number words from forty-one to seventy with their figures, on the same page as Lesson II. The note says each lesson should include a review of the ones before it.
  steps:
  - - Quick review
    - Ask your child to read five numbers from Lesson II and write three more from your dictation.
  - - Count by tens
    - 'Line up bundles or cups of ten and count them together: ten, twenty, thirty, forty, fifty, sixty, seventy.'
  - - Build a number
    - 'Make 4 tens and 3 ones. Ask: How many tens? How many ones? So it is forty-three, written 43.

      Do the same for 56 and 68.'
  - - Read the table
    - Read the new table together, then alone. Stop now and then to ask how many tens and ones.
  - - Write from dictation
    - Say six numbers between 41 and 70 and have your child write them. Include one or two from the earlier lesson.
  practice: 'Review tomorrow: count by tens to 70, then read the table without help.'
  tip: Fifty and sixty end in "-ty" just like the others, but fifty does not sound like "five-ty". Mention it.
  num: 3
  roman: III
  idx: 12
  unit: 1
- title: Numbers from 71 to 100
  mins: 15
  goal: Your child reads and writes every number up to one hundred.
  materials:
  - Bundles or cups of ten (ten of them)
  - A slate, small whiteboard or paper and pencil
  book: The number words from seventy-one to one hundred with their figures.
  steps:
  - - Count by tens to 100
    - 'Lay out ten bundles of ten and count by tens to one hundred.

      Say: Ten tens make one hundred. We write it 100: a one and two naughts.'
  - - Read the table
    - Read the new table together, then alone.
  - - Tens and ones
    - 'Ask: How many tens in 85? How many ones? Then the other way: What number has 9 tens and 2 ones?'
  - - Write from dictation
    - Dictate six numbers between 71 and 100, then two older ones.
  practice: Count aloud from 1 to 100 over the next few days, a little each day.
  num: 4
  roman: IV
  idx: 13
  unit: 1
- title: Reading figures from 1 to 100
  mins: 10
  goal: Your child reads any number up to 100 at a glance, in any order.
  materials:
  - A slate, small whiteboard or paper and pencil
  book: A table of figures from naught to one hundred, mixed out of order, for reading aloud. The note says pupils should learn to read figures readily from 1 to 100, and that the figures should be copied on the blackboard.
  steps:
  - - Read across a row
    - Open the book page. Point to the figures one at a time and have your child read them aloud. Help with any that stick.
  - - Copy some out
    - As the book suggests, copy a few rows onto a whiteboard or paper so you can point at them, cross them out and add your own.
  - - Tricky pairs
    - Write 12 and 21, 31 and 13, 68 and 86 side by side. Ask your child to read each and say which is bigger.
  - - Speed round
    - Point to ten figures quickly. Count how many your child reads without a pause, and try to beat it next time.
  practice: A one-minute reading round each day until it is easy.
  num: 5
  roman: V
  idx: 13
  unit: 1
- title: Writing numbers from dictation
  mins: 15
  goal: Your child writes any number up to 100 when you say it.
  materials:
  - A slate, small whiteboard or paper and pencil
  book: 'Writing exercises: the teacher reads number words and the pupil writes the figures, from naught up to one hundred, at the blackboard or on a slate.'
  steps:
  - - Naught
    - 'Show 0 and call it "naught", as the book does (we usually say zero). Ask: How many beans are in an empty cup?'
  - - Pairs that sound alike
    - 'Dictate pairs from the book: one, ten; two, twenty; three, thirty; and so on to nine, ninety. Talk about how they differ.'
  - - Dictation
    - Read about ten numbers from the book's lists. Your child writes each one. Check them together.
  - - Fix mistakes kindly
    - 'If your child writes 41 for "fourteen", build it with bundles: one ten and four ones.'
  practice: Write five dictated numbers each day this week. Unit 1 is done when reading and writing to 100 are easy.
  num: 6
  roman: VI
  idx: 14
  unit: 1
- title: Putting small groups together
  mins: 15
  goal: Your child finds the total of two small groups up to 10 using counters, and begins to say the facts aloud.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles)'
  book: Questions to answer with counters or bits of card, such as "How many are 4 and 1? How many are 3 and 2?" The note says the counters should be set out in separate groups, one for each number.
  steps:
  - - Two groups
    - 'Put out 3 beans and, a little apart, 2 beans.

      Say: Here are 3 beans and here are 2. How many are 3 and 2?

      Let your child push them together and count.'
  - - Say the fact
    - 'Have your child say the whole sentence: "3 and 2 are 5." This is how Ray''s writes every fact.'
  - - Work through the book's questions
    - Read the questions from the book page one at a time. Your child sets out each group, then answers.
  - - Same answer, different way
    - 'Ask: How many are 4 and 1? How many are 1 and 4? Show that the groups are the same, just swapped.'
  practice: Do a few counter questions every day this week, using different small objects.
  num: 7
  roman: VII
  idx: 15
  unit: 2
- title: 'Facts up to 8: together, apart and in groups'
  mins: 15
  goal: Using counters, your child adds to 8, takes away from 8, and counts equal groups.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles)'
  book: Spoken questions on the numbers to 8, putting together ("How many are 5 and 3?"), taking away ("One from 6 leaves how many?") and equal groups ("How many are 2 times 3?").
  steps:
  - - Warm up
    - Ask three questions from Lesson VII with counters.
  - - Taking away
    - 'Put out 6 beans. Take 1 away and hide it in your hand.

      Say: One from 6 leaves how many?

      Let your child count what is left. Then 2 from 6, 3 from 6.'
  - - Equal groups
    - 'Make 2 piles of 3 beans.

      Say: Two times three. How many altogether?

      This is a first look at multiplying; there is no need to name it yet.'
  - - Book questions
    - Work through the questions on the book page, with counters for every one.
  practice: A few counter questions every day. Let your child make up a question for you to answer too.
  num: 8
  roman: VIII
  idx: 16
  unit: 2
- title: Facts up to 10
  mins: 15
  goal: Your child answers spoken questions on the numbers to 10, using counters only when needed.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles)'
  book: Spoken questions on all the facts to 10, such as "How many are 9 and 1? How many are 8 and 2? How many are 7 and 3?"
  steps:
  - - Make ten in every way
    - 'Put out 10 beans. Split them into two groups in different ways: 9 and 1, 8 and 2, 7 and 3, 6 and 4, 5 and 5. Say each fact aloud.'
  - - Book questions, counters first
    - Ask the questions from the book page. Let your child use counters for the first few.
  - - Hands off
    - For the rest, ask your child to answer without touching the counters, then check with them.
  - - Taking away from 10
    - 'Ask: 3 from 10 leaves how many? Use the pairs you made in the first step.'
  practice: Ask "What goes with 7 to make 10?" and similar questions in the car or at meals.
  tip: The pairs that make 10 are worth learning by heart. They make later adding much easier.
  num: 9
  roman: IX
  idx: 17
  unit: 2
- title: 'Counting the birds: adding with a picture'
  mins: 15
  goal: Your child solves short story problems by looking at a picture, then without one.
  materials:
  - The book page (it has a picture of birds)
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles)'
  book: A picture of birds on a bush and two flocks in the distance, with story questions about the birds, such as "How many birds are two birds and five birds?"
  steps:
  - - Talk about the picture
    - 'Look at the picture together. Ask: How many birds are on the bush? How many in each flock?'
  - - Story questions
    - Read the book's questions. Your child answers by counting in the picture.
  - - Without the picture
    - 'Ask a similar question with no picture: "Seven birds sat on a fence and four more came. How many birds?" Use counters if needed.'
  - - Your own story
    - Ask your child to make up a bird story for you to answer.
  practice: 'Make up one "how many" story a day from real life: ducks at the pond, cars in the drive.'
  num: 10
  roman: X
  idx: 18
  unit: 2
- title: Adding 1 (sums to 11)
  mins: 15
  goal: Your child knows by heart every fact that adds 1 to a number from 1 to 10, and uses them in story problems.
  materials:
  - 'About 20 small counters: dried beans, buttons, pennies or pebbles (the book suggests marbles, beans or pebbles)'
  - A slate, small whiteboard or paper and pencil
  book: The table of facts with 1, from "1 and 1 are 2" to "1 and 10 are 11", with the turned-around facts, then about nine short story problems. The first problem has a worked solution.
  steps:
  - - Warm up
    - Ask a few facts to 10 from Lesson IX. Note any that are slow; they go in tomorrow's warm-up.
  - - Build it with counters
    - 'Put out a group of 1. Add 1 more and ask how many. Then start again with 1 and add 2, then 3, and so on.

      Say each one as a full sentence: "1 and 1 are 2. 1 and 2 are 3."'
  - - Read the table
    - Open the book page and read the table together. Then your child reads it alone.
  - - Cover and recall
    - 'Cover the answers with a card. Ask the facts out of order. Include the turned-around ones: "3 and 1" is the same as "1 and 3".'
  - - Story problems
    - 'Read the problems on the page aloud, one at a time. They go like this:

      ~ Francis had 2 cents, and his mother gave him 1 cent more: how many had he then?

      ~ John had 1 raisin, and his sister gave him 3 raisins more: how many had he then?

      Your child answers in a full sentence, the way the worked solution does.'
  - - Write a few
    - Your child writes five facts from this table on the slate from memory.
  - - Wrap up
    - One last quick round of the three facts that were hardest today.
  practice: Two minutes on this table each day until all its facts come instantly, then move on.
  tip: Adding 1 is just saying the next number. Make that connection out loud.
  num: 11
  roman: XI
  idx: 19
  unit: 3
