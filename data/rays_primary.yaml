- title: 'Dry measure: quarts, pecks and bushels'
  mins: 15
  goal: Your child knows the dry measures and changes between them.
  materials:
  - A quart container if you have one
  - A slate, small whiteboard or paper and pencil
  book: 'The table: 2 pints make 1 quart; 8 quarts make 1 peck; 4 pecks make 1 bushel. Then problems about meal, apples, oats and berries.'
  steps:
  - - Where you see it
    - Pecks and bushels still show up at orchards and farm stands, and in the Bible ("hide your light under a bushel").
  - - The table
    - Read it. How many quarts in a bushel? (8 × 4 = 32.)
  - - Book problems
    - Work through the page.
