  book: 'The signs explained: + is read "plus", − "minus", × "multiplied by", ÷ "divided by", = "equals". Then additions such as "11 + 1" (worked: 11 plus 1 equals 12) and others with 11 to 15.'
  steps:
  - - Meet the signs
    - Write each sign and its name. Your child copies them. Point out that "−" is the "less" your child already knows, and "×" is "times".
  - - Rewrite old facts
    - 'Write facts your child knows in words, such as "5 and 3 are 8", and have your child rewrite them with signs: 5 + 3 = 8.'
  - - Book questions
    - Read and answer the questions on the page, saying "plus" and "equals".
  practice: Write three number sentences with signs each day.
  tip: 'Children sometimes think "=" means "here comes the answer". Show that 8 = 5 + 3 is also true: both sides are the same amount.'
