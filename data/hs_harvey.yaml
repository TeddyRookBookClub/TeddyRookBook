book:
  id: elementarygramma00harv
  title: Harvey's Elementary Grammar and Composition
  year: '1880'
  key: harvey-elem
  short: Elementary Grammar
  eyebrow: Spelling and Grammar · Harvey's Elementary Grammar
  hero: 'Thomas W. Harvey''s grammar for children about 9 to 12: sentences, the parts of speech, analysis and parsing, plus picture lessons, descriptions, letters and punctuation. 96 guides cover every lesson in the book, with the right page beside each one.'
  how:
  - <b>A little, often.</b> About 20 to 30 minutes a day, four or five days a week. Several short lessons share one guide, and a few long ones are split in two.
  - <b>Say it, then write it.</b> The book asks for many exercises to be given orally first, then written. Have your child answer in full sentences, worded like the book's models.
  - <b>Use the models.</b> Many lessons give a model ("Iron is the subject; it is that of which..."). Say it the same way each time; the pattern is what builds careful thinking.
  - <b>Grammar meets reading.</b> Nearly every lesson ends by asking your child to spot the new idea in their own reading. Keep a storybook or reader nearby.
  - <b>Old rules, gentle hands.</b> A few rules (shall and will, who for animals) were stricter in 1880 than today. The guides point these out so you can teach the book's rule without fussing.
  - '<b>Compositions take time.</b> The composition lessons (pictures, animals, plants, metals, letters) can stretch over two days: plan and draft one day, revise and read aloud the next.'
  unitword: Part
  lessonword: Lesson
  numnote: Guides follow the book's numbered lessons in order. The book's lesson number is shown beside each title; several short lessons share one guide and a few long ones are split.
units:
- id: 1
  name: 'Part I: The elementary course'
  from: 1
  to: 49
  text: Sentences, the parts of speech one by one, analysis, cautions about common mistakes, and picture compositions (Lessons 1 to 48).
- id: 2
  name: 'Part II: The parts of speech in full'
  from: 50
  to: 90
  text: Gender, person, number and case; parsing every part of speech; mode, tense and conjugation; syntax, letters and compositions from plans (Lessons 49 to 123).
- id: 3
  name: 'Part III: Punctuation, and the Appendix'
  from: 91
  to: 96
  text: The comma and the other marks, then the list of irregular verbs and the rules for capital letters.
lessons:
- num: 1
  roman: 1–2
  idx: 12
  unit: 1
  title: The senses, objects and words
  mins: 25
  goal: Your child can name the five senses, say what an object is, and explain that a word stands for a thought.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 1 talks about the five senses, things we perceive and things we are only conscious of, and defines an object. Lesson 2 defines a word, language, grammar and English grammar, with review questions.
  steps:
  - - Start with the senses
    - 'Hand your child something to explore, like an orange. Ask how they can tell what it is: by looking, touching, smelling, tasting, even listening as you tap it.

      Say: Grammar starts with something simple: how we know things at all.

      The book begins the same way:

      ~ We have five senses: seeing, hearing, feeling, tasting, and smelling.'
  - - Perceive or be conscious of
    - 'Read this line together:

      ~ When we see, feel, taste, or smell things, or hear sounds, we are said to perceive them.

      Then talk about things we know without the senses. The book says we are conscious of love, hatred, joy and sorrow, but cannot perceive them.

      Say: Can you see happiness? No, but you know when you feel it.'
  - - What an object is
    - 'Read the book''s definition slowly:

      ~ An Object is any thing we can perceive, or of which we may be conscious.

      Take turns naming objects. Include some you can touch (a chair) and some you can''t (a dream, a fear). Both count.'
  - - Words and language
    - 'Turn to Lesson 2 and read:

      ~ A Word is a syllable, or a combination of syllables, used in the expression of thought.

      ~ Language is the expression of thought by means of words.

      Say: Spoken language uses the voice. Written language uses letters on paper. Which one are we using now?'
  - - Grammar
    - 'Read the last two definitions:

      ~ English Grammar teaches how to speak and write the English language correctly.

      Say: That is what this book is for. We''ll learn one small idea at a time.'
  - - Answer the book's questions
    - 'Ask the review questions from the page out loud, for example: How many senses have we? Name some things that we can perceive. What is an object? What is a word?

      Let your child answer in full sentences: "We have five senses."'
  - - Use it today
    - At a meal or on a walk, ask your child to name one thing they perceive with each sense. Then ask for one thing they are conscious of but cannot see or touch.
  practice: Over the next day or two, ask your child to say the definitions of an object and a word in their own words, then in the book's words.
  tip: Older books like this one ask children to learn definitions by heart. Understanding comes first; memorizing the exact words is a bonus, not the goal.
  answers: 'Five senses: seeing, hearing, feeling, tasting and smelling. Things we can perceive: anything we can see, hear, touch, taste or smell (a bell, a rose, an apple). Things we cannot perceive but are conscious of: love, hatred, joy, sorrow, the force that pulls a dropped book down. For the definitions, see the book''s own wording on the page.'
- num: 2
  roman: 3–4
  idx: 13
  unit: 1
  title: The sentence and the declarative sentence
  mins: 30
  goal: Your child knows that a sentence is a group of words making complete sense, follows the book's directions for writing one, and can tell a statement from a question.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 3 asks questions about a piece of chalk. Lesson 4 defines a sentence and a proposition, gives the directions for writing sentences, and defines declarative and interrogative sentences, with jumbled words to arrange into sentences.
  steps:
  - - Review
    - 'Ask: What is an object? What is a word? Let your child answer in the book''s words if they can.'
  - - Talk about chalk
    - 'If you have chalk (or a crayon), hold it up. Ask the kind of questions the book asks: What color is it? Is it tough or brittle? Can you see through it?

      Each answer your child gives in full is a sentence: "Chalk is white."'
  - - The new idea
    - 'Read the definition together:

      ~ A Sentence is a group of words making complete sense.

      Say: "Chalk is white" makes complete sense. "White chalk" doesn''t. It leaves us waiting.

      Give a few more pairs and let your child say which one is a sentence.'
  - - Directions for writing
    - 'The book gives rules for writing every sentence. Read them together:

      ~ Begin each sentence with a capital letter.

      ~ Spell each word correctly.

      ~ Place an interrogation point [?] at the end of every question.

      The book also says to end statements and commands with a period, and never to split a syllable at the end of a line.'
  - - Two kinds so far
    - 'Read:

      ~ A Declarative Sentence is a sentence used in stating a fact.

      ~ An Interrogative Sentence is a sentence used in asking a question.

      Say: "The window is open" tells. "Is the window open?" asks.'
  - - Unscramble the words
    - 'The book gives groups of words to arrange into sentences. Try a few aloud first, then write them:

      ~ Iceland, very, is, in, it, cold.

      ~ Lesson, an, this, easy, is.

      ~ Lemons, where, grow, do.

      The first ones become statements, the last a question. Check the capital letter and the end mark.'
  - - Check together
    - Read each written sentence aloud. Does it make complete sense? Does it start with a capital? Does it end with the right mark?
  - - Use it today
    - In today's reading, find one sentence that tells and one that asks. Read them aloud.
  practice: On another day, finish the rest of the jumbled-word groups in Lesson 4. The book's note says to keep making up new groups until longer sentences come easily.
  tip: 'When your child writes, say the three checks out loud every time: capital, spelling, end mark. Soon they''ll do it on their own.'
  answers: 'Possible arrangements (other orders can also be right):

    Declarative: It is very cold in Iceland. This is an easy lesson. Cherries are ripe in June. Our house is under the hill. Good scholars are always happy. The boy''s little red cap fell into the river. The snow is very deep in our lane. The farmer plants corn in the spring. I like to skate when the ice is very smooth.

    Interrogative: Where do lemons grow? Is John''s brother sick to-day? Was it very cold yesterday? Does your aunt live over the river beyond the toll-gate? Is not writing a pleasant exercise? Were you not at school yesterday? May I pick this white rose?'
- num: 3
  roman: '4'
  idx: 15
  unit: 1
  title: Commands, exclamations and the four kinds of sentences
  mins: 25
  goal: 'Your child can name and recognize all four kinds of sentences: declarative, interrogative, imperative and exclamatory.'
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: 'The rest of Lesson 4: definitions of imperative and exclamatory sentences, jumbled words to arrange into commands and exclamations, and nine sentences to sort by kind.'
  steps:
  - - Review
    - 'Ask: What is a declarative sentence? An interrogative sentence? Have your child make up one of each.'
  - - Commands and requests
    - 'Read the definition:

      ~ An Imperative Sentence is a sentence used in expressing a command or an entreaty.

      Say: "Clarence, open the window" is a command. "Do forgive me!" is an entreaty, a begging request.

      Give your child a silly command and let them give you one.'
  - - Feelings
    - 'Read:

      ~ An Exclamatory Sentence is a sentence used in expressing some feeling or emotion.

      ~ An exclamation point (!) is usually placed after an exclamatory sentence.

      Say "Oh, that window is open again!" with feeling. Let your child try one.'
  - - Unscramble
    - 'Arrange some of the book''s word groups aloud, then write them:

      ~ Go, your, seats, to, boys.

      ~ Me, your, lend, book, Jane.

      ~ Clock, four, hark, strikes, the.

      ~ Pretty, is, oh, she, how.

      The first two are commands; the last two are exclamations.'
  - - Sort the sentences
    - 'The book asks your child to tell the kind of each sentence. Do them one by one aloud:

      ~ The winds bring perfume.

      ~ Where is my new book?

      ~ Go to the ant, thou sluggard!

      Ask: Does it tell, ask, command, or show feeling?'
  - - Check together
    - Go over the answers below. If your child mixed up a command and an exclamation, look at what the sentence does, not only at the end mark.
  - - Use it today
    - The book suggests telling the kinds of sentences in your reading lesson. Pick a page and find one of each kind, then change a statement into a question.
  answers: 'Arranged (other orders may be fine): Boys, go to your seats. Ponto, go home at once. Jane, lend me your book. Pupils, study the lesson ten minutes. Ha, ha, ha, I am glad of it! Hark, the clock strikes four! Oh, how pretty she is! Ugh, I don''t like it!

    Kinds of sentences: 1 declarative; 2 interrogative; 3 imperative; 4 imperative (with feeling); 5 declarative; 6 interrogative; 7 exclamatory; 8 imperative; 9 imperative and exclamatory ("Lend me your wings!" is a command; "I mount! I fly!" are exclamations).'
- num: 4
  roman: '5'
  idx: 16
  unit: 1
  title: Quotation marks
  mins: 20
  goal: Your child puts quotation marks around someone's exact words and starts the quotation with a capital letter.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 5 shows quotation marks with a man's yawning remark, gives the rules for using them, and has four sentences to write with quotation marks and capitals.
  steps:
  - - Review
    - 'Ask your child to give one sentence of each kind: declarative, interrogative, imperative and exclamatory.'
  - - Look at the example
    - 'Show the book''s example:

      ~ The man yawned, and said, "How sleepy I am!"

      Point to the marks before and after the man''s words. Read the line:

      ~ They are called Quotation Marks.'
  - - The rules
    - 'Read the book''s rules:

      ~ Quotation Marks should be used, in writing, when we quote the exact language of another.

      ~ Such a quotation should begin with a capital letter.

      The book adds that when we only tell what someone said, not in their exact words, we leave the marks out.'
  - - Oral practice
    - 'Say a sentence like: Mom said, "Dinner is ready." Then: Mom said that dinner was ready.

      Ask which one uses her exact words. Only that one gets quotation marks.'
  - - Write the book's sentences
    - 'Copy these, adding quotation marks and capitals:

      ~ Did your mother send you, said the merchant, gruffly.

      ~ Will you come into my parlor, said the spider to the fly.

      ~ The general said, be ready to start at 5 A. M.

      Find the speaker''s exact words first, then put the marks around them.'
  - - Check together
    - Compare with the answers. Look especially at the capital letter at the start of each quotation.
  - - Use it today
    - In a storybook, find a line of conversation. Point to where the quotation marks open and close.
  tip: Old books put the question mark in different places than we might. Today, the question mark goes inside the quotation marks when the quoted words are a question.
  answers: '"Did your mother send you?" said the merchant, gruffly.

    The general said, "Be ready to start at 5 A. M."

    "Will you come into my parlor?" said the spider to the fly.

    The pupils kept repeating, "Four times three are twelve, four times three are twelve," for at least three minutes.'
- num: 5
  roman: 6–7
  idx: 17
  unit: 1
  title: Parts of speech and the noun
  mins: 30
  goal: Your child knows that words are sorted into parts of speech and can tell common nouns from proper nouns.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 6 introduces parts of speech with "Scholars study." Lesson 7 is an oral lesson on nouns, defining nouns, common nouns and proper nouns, with a list of words to sort and names to write.
  steps:
  - - Review
    - Ask your child to write one sentence using quotation marks correctly.
  - - Words come in classes
    - 'Read:

      ~ Parts of Speech are the classes into which words are divided according to their meaning and use.

      Say: Like sorting laundry into piles, we sort words by what they do. Today''s pile is names.'
  - - Names are nouns
    - 'Read:

      ~ A Noun is a name; as boy, John, railroad.

      Ask your child to name ten things in the room. Every one is a noun.'
  - - Common and proper
    - 'Read both definitions:

      ~ A Common Noun is a name which may be applied to any one of a class of objects; as bird, door, lightning.

      ~ A Proper Noun is the name of some particular person, place, people, or thing; as, Susan, Rome, American, Mars.

      Say: "City" fits every city. "Chicago" fits just one. Proper nouns begin with capital letters.'
  - - Sort the book's list
    - 'Read the list on the page and sort each word aloud:

      ~ Rain. Snow. College. Augusta. Palestine.

      Ask: Is it the name of any one of a kind, or of one particular thing?'
  - - Write some names
    - 'The book asks for names: five kinds of fruit, five kinds of grain, three articles of clothing, six large cities, five large rivers, seven school-mates, and more. Pick three or four of these and write them. Check capitals: cities, rivers and people need them.'
  - - Use it today
    - In today's reading, point out three common nouns and three proper nouns.
  practice: Finish the rest of the name lists on a second day.
  answers: 'Common nouns: rain, snow, college, barn, minute, volcano, slate, organ, steeple, railroad, church, thunder, hour, lesson, temple.

    Proper nouns: Augusta, Palestine, Sarah, Black Sea, Lake Erie, April, Boston, Indianapolis, Vesuvius, Niagara Falls.

    Name lists will vary; check that names of cities, rivers, mountains and people start with capital letters.'
- num: 6
  roman: '8'
  idx: 20
  unit: 1
  title: Singular and plural
  mins: 25
  goal: Your child can say whether a noun names one thing or more than one, and forms plurals with s, es, ies and ves.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Page 15 ends the noun lesson with a model for pointing out nouns. Lesson 8 defines singular and plural number and gives the rules for forming plurals, with thirty nouns to make plural.
  steps:
  - - Review
    - 'The book gives a model sentence for pointing out nouns:

      ~ Cicero was an orator.

      Ask: Which words are nouns? Which is proper and which is common?'
  - - The new idea
    - 'Read:

      ~ The Singular Number denotes but one object.

      ~ The Plural Number denotes more than one object.

      Say: Fan, one. Fans, more than one.'
  - - The plural rules
    - 'Go over the book''s rules with examples:

      Most nouns add s. Nouns that end in a sound that won''t join with s add es: church, churches.

      Nouns ending in y after a consonant change y to i and add es. Many ending in f or fe change to ves.

      Read this one together:

      ~ A few nouns are alike in both numbers; as, sheep, deer, trout, vermin.'
  - - Oral practice
    - 'Say a singular noun and let your child say the plural: dog, box, baby, leaf, key, sheep.'
  - - Write the plurals
    - 'The book gives thirty nouns, beginning:

      ~ Ox, City, Desk, Alley, Street, School, Girl, Fish

      Write the plurals. The book''s note says the teacher should help with some of them, so do the tricky ones together.'
  - - Check together
    - Check with the answers below. Talk about any that broke the rules (ox, child, man, woman).
  - - Use it today
    - In today's reading, find three plural nouns and say the singular of each.
  answers: oxen, cities, desks, alleys, streets, schools, girls, fishes (or fish), roads, children, houses, moneys, boys, men, follies, winds, pencils, wagons, calves, roses, books, knives, vessels, women, boxes, plows, chairs, fences, potatoes, monkeys.
- num: 7
  roman: '9'
  idx: 21
  unit: 1
  title: Abbreviations
  mins: 25
  goal: Your child writes common abbreviations with a period and a capital letter, and knows what they stand for.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 9 explains abbreviations such as Dr., Gen. and Mrs., gives lists of abbreviations to write with their meanings, and sentences to shorten. It continues onto the next page.
  steps:
  - - Review
    - Ask for the plurals of baby, knife, box and child.
  - - The new idea
    - 'Show the book''s example:

      ~ Dr. Vinton is a brother of Gen. Vinton, and the father of Mrs. Noble.

      Say: Dr. is a short way of writing Doctor. That is called an abbreviation. Read the rule:

      ~ A period should be placed after an abbreviation.'
  - - Oral practice
    - Look at the book's lists (Esq., Gov., Rev., Prof., Capt., P.M., A.M., U.S., P.O., No.). Say each abbreviation and let your child say what it stands for, using the page as a key.
  - - Write it shorter
    - 'Rewrite some of the book''s sentences using abbreviations:

      ~ Major Whipple lives in Saint Louis.

      ~ Doctor Metz lives on Wood Street, next door to Colonel Clark.

      ~ Were Mister Jones and President Tappan in the city to-day?'
  - - Days, months and states
    - The book asks your child to write abbreviations for the days of the week and the months of the year. Do the days today.
  - - Check together
    - Check each abbreviation for its period and capital letter.
  - - Use it today
    - Look at an envelope, a calendar or a sign outside. Find an abbreviation and say what it stands for.
  tip: Some abbreviations in the book are old-fashioned (Ult., Prox., Admr.). Your child doesn't need to memorize those. Focus on the ones still in use.
  answers: 'Maj. Whipple lives in St. Louis. Moses Johnson, Esq., is an uncle of Prof. Collins. Lieut. Wilson is a guest of Supt. Furness. Dr. Metz lives on Wood St., next door to Col. Clark. Were Mr. Jones and Pres. Tappan in the city to-day?

    Days: Sun., Mon., Tues., Wed., Thurs., Fri., Sat. (other short forms are also used).'
- num: 8
  roman: '10'
  idx: 23
  unit: 1
  title: Contractions and the apostrophe
  mins: 20
  goal: Your child knows that an apostrophe shows missing letters and can tell which letters a contraction leaves out.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: The top of page 18 finishes the abbreviation exercises. Lesson 10 introduces the apostrophe with "don't" and gives seven sentences with contractions.
  steps:
  - - Review
    - 'Ask: What does Dr. stand for? Mr.? P.O.? Where does the period go?'
  - - The new idea
    - 'Write "do not" and "don''t" side by side. Read:

      ~ In writing or printing don''t, a mark ('') is used between n and t. It is called an Apostrophe.

      Say: The apostrophe sits where the o used to be.'
  - - Oral practice
    - 'Say a contraction and let your child say the two words: can''t, I''m, it''s, we''ll, they''re, she''s.'
  - - The book's sentences
    - 'Ask which letters are left out in each:

      ~ We''re going home.

      ~ I didn''t know that you told ''em not to go.

      ~ We came from o''er the sea.

      Your child can write the full words above each contraction.'
  - - Check together
    - Check with the answers. Notice that 'em and o'er are old or casual forms; the apostrophe still marks the missing letters.
  - - Use it today
    - Find three contractions in today's reading and say what each one stands for.
  answers: '1 We''re: a (we are). 2 We''ll: wi (we will). 3 didn''t: o (did not); ''em: th (them). 4 I''ll: wi (I will); I''ve: ha (I have). 5 o''er: v (over). 6 They''re: a (they are). 7 ''Bout: a (about).'
- num: 9
  roman: '11'
  idx: 24
  unit: 1
  title: Subject, predicate and copula
  mins: 20
  goal: Your child can find the subject, the predicate and the joining word (copula) in short sentences like "Ice is cold."
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 11 uses "Ice is cold" to define the subject, predicate and copula, then gives nine short sentences to take apart.
  steps:
  - - Review
    - Ask your child to contract "I am" and "they are", and to say what the apostrophe shows.
  - - Look at a sentence
    - 'Write: Ice is cold.

      Ask: What are we talking about? (ice) What do we say about it? (cold) What word joins them? (is)'
  - - The book's words
    - 'Read the three definitions:

      ~ The Subject of a proposition is that of which something is affirmed.

      ~ The Predicate of a proposition is that which is affirmed of the subject.

      ~ The Copula is a word, or group of words, used to join a predicate to a subject, and to make an assertion.

      Say: Affirmed just means said or claimed.'
  - - Oral practice
    - 'Make up sentences together: Grass is green. Soup is hot. For each, your child names the subject, predicate and copula.'
  - - The book's exercise
    - 'Point out the three parts in each sentence on the page:

      ~ Air is transparent.

      ~ Jane has been studious.

      ~ George should have been industrious.

      The copula can be more than one word, like "has been" or "should have been".'
  - - Check together
    - Go through the answers. Underline the subject once and the predicate twice, and circle the copula, if that helps.
  - - Use it today
    - Find a short sentence with is, are, was or were in today's reading. Name its subject, predicate and copula.
  answers: 'Subject / copula / predicate: 1 Air / is / transparent. 2 Iron / is / heavy. 3 Nero / was / cruel. 4 Jane / has been / studious. 5 Walter / will be / tardy. 6 Mary / should be / kind. 7 Ellen / is / unhappy. 8 Martha / was / cheerful. 9 George / should have been / industrious.'
- num: 10
  roman: '12'
  idx: 25
  unit: 1
  title: Quality-words and nouns as predicates
  mins: 20
  goal: Your child can make sentences by saying a quality of a subject ("Oranges are yellow") or its kind ("Eagles are birds").
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 12 calls words that express qualities quality-words, shows that nouns can be predicates, and gives three lists for building sentences, each with a model.
  steps:
  - - Review
    - 'Ask: In "Snow is white," what is the subject? The predicate? The copula?'
  - - Quality-words
    - 'Read:

      ~ Words which express qualities may be called quality-words.

      Ask your child for quality-words about a cat: soft, quick, gray. Each one could be a predicate: "The cat is soft."'
  - - Nouns as predicates
    - 'Read:

      ~ Nouns may be used as predicates. When they are thus used, they denote kind or class.

      The book''s examples include "Man is mortal" and "Horses are animals." Ask which predicate is a quality-word and which is a noun.'
  - - Say a quality
    - 'Using the book''s model

      ~ Oranges are yellow.

      say sentences aloud for Iron, Trees, Fishes and Books.'
  - - Write all three kinds
    - 'Write sentences from each list on the page. Follow the models:

      ~ Sugar is sweet.

      ~ Eagles are birds.

      For the second list, find a subject for each quality (soft, hard, wise, round). For the third, say what class each subject belongs to (Gold, Oxen, Wheat).'
  - - Check together
    - Read the sentences aloud. Is each predicate true? Does each start with a capital and end with a period?
  - - Use it today
    - Describe something at dinner with a quality-word predicate ("The soup is hot") and a noun predicate ("Carrots are vegetables").
  answers: 'Sentences will vary. Sample kind-or-class answers: Gold is a metal. Oxen are animals. Sheep are animals. Wheat is a grain. Corn is a grain (or a plant). Eagles are birds. Silver is a metal. Any true class is fine.'
- num: 11
  roman: '13'
  idx: 26
  unit: 1
  title: Elements and analysis
  mins: 25
  goal: Your child knows what an element and analysis are, and can analyze a short sentence the way the book's model does.
  materials:
  - The book, open to this lesson
  - Paper and a pencil (or a slate)
  book: Lesson 13 defines elements, principal elements and analysis, gives a model analysis of "Iron is heavy," and nine sentences to analyze.
  steps:
  - - Review
    - Ask your child to make a sentence with a quality-word predicate and one with a noun predicate.
  - - Parts are elements
    - 'Read:

      ~ An Element is one of the distinct parts of a sentence.

      ~ The Subject and the Predicate are called Principal Elements, because no sentence can be formed without them.

      The book adds that the copula is not called an element.'
  - - What analysis is
    - 'Read:

      ~ Analysis is the separation of a sentence into its elements.

      Say: Analysis means taking a sentence apart to see how it''s built, like taking apart a toy.'
  - - Learn the model
    - 'Read the book''s model for "Iron is heavy" aloud, for example:

      ~ Iron is the subject; it is that of which something is affirmed.

      Then your child says the whole model with you, then alone.'
  - - Analyze the book's sentences
    - 'Use the model for these:

      ~ Indigo is blue.

      ~ Flies are insects.

      ~ Boys will be playful.

      Your child says it aloud first, then writes two of them out in full.'
  - - Check together
    - Check the parts against the answers. The book also asks your child to point out the common and proper nouns in these sentences.
  - - Use it today
    - Pick one short sentence from today's reading and analyze it aloud using the model.
  tip: Saying the model aloud the same way every time is the point. It builds a habit of careful thinking about sentences.
