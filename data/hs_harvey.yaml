  - - Whose?
    - 'Read the book''s example: "John''s hat is torn." Ask whose hat it is.

      Read:

      ~ A Possessive is a noun or pronoun used to modify a noun different in meaning from itself.

      ~ The apostrophe ( '' ) is used to show that a noun is a possessive.'
  - - Three directions
    - 'Go over the book''s rules:

      ~ When a noun denotes but one object, the letter s follows the apostrophe; as in John''s, Moses''s.

      ~ When the noun denotes more than one object, and ends with s, the apostrophe alone is used, as in ladies''.

