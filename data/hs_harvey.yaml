    Corrections: the ox''s horn; its cage; The vessel''s sails are spread (or The vessels'' sails, if many vessels); Alice''s lesson; the boy''s coat (if one boy); the ladies'' parlor.

    Groups for possessives: the hand of the boy; the den of the lion; the owner of the vessel; the den of the fox; the flash of the lightning; the roof of the barn; the hoot of an owl.

    Possessives for groups: The horse''s head was hurt. We loitered by the river''s bank. The squirrel''s house was a hollow tree. The hunters came to a tiger''s den. The dog''s owner was much surprised.'
