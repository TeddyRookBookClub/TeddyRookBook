      ~ Alice'' lesson is learned.

      ~ We then went into the ladie''s parlor.'
  - - Swap the forms
    - 'Change some of the book''s sentences both ways: "Daniel was in the lion''s den" becomes "the den of the lion." "The owner of the dog was much surprised" becomes "The dog''s owner..."'
