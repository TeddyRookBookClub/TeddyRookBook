  - - Copywork
    - 'Write this line from the lesson for your child to copy, or let them copy it straight from the book:

      ~ Sport is a good watchdog, and a kind playfellow.

      Check capital letters, commas and the mark at the end.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: yard, crib, wagon, scold.

      Check together and fix any mistakes right away.'
  practice: Reread this lesson aloud the next day before starting a new one. Read the new words in any order until they come quickly.
  tip: Words like Newfoundland and terrier are long. Clap the parts (New-found-land) and read them in pieces.
- num: 6
  roman: VI
  idx: 22
  unit: 1
  title: Afraid in the Dark
  mins: 20
  goal: Your child reads the story, talks about being afraid, and copies two lines of the script verse.
  materials:
  - The book, open to this lesson
  - A slate, small whiteboard or lined paper and a pencil
  - A lamp or flashlight, to make shadows with your hand (optional)
  book: 'New words, then a story about Willie, who is afraid to go upstairs in the dark, and how his mamma helps him. Slate work follows: a short verse printed in script.'
  steps:
  - - Warm up
    - 'Have your child reread a few lines of Lesson V, for example:

      ~ James White has two dogs.

      Praise smooth reading and help with any word that sticks.'
  - - New words
    - 'Point to the new words at the top of the lesson:

      ~ between   bureau   stairs   needle   afraid   shadow   held   stir

      Say each word and have your child say it after you. Clap the parts of long words. Then point to words in any order and let your child read them.'
  - - Read it aloud
    - 'Look at the picture together first, if there is one. Then your child reads the lesson aloud, one paragraph at a time. Help with any word by pointing to it in the word list.

      Here are a few lines from it:

      ~ Willie, will you run upstairs, and get my needle book from the bureau?

      ~ But Willie did not stir.

      If it is long, stop at a good place and finish tomorrow.'
  - - Talk about it
    - 'Say: What did mamma ask Willie to do?

      Say: Why didn''t Willie go at first?

      Say: How did mamma show Willie what the dark really is?

      Say: What did Willie do in the end? How do you think he felt?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me how Willie stopped being afraid of the dark.

      Let your child talk without stopping them. Afterward, help with anything left out by asking "What happened next?"'
  - - Slate work
    - 'At the end of the lesson there is a short verse in script, marked for slate work. Read it together, then your child copies these lines onto the slate or paper:

      ~ Beautiful faces are they that wear

      ~ The light of a pleasant spirit there;

      Check capital letters and the marks at the ends of the lines.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: stairs, afraid, shadow, held.

      Check together and fix any mistakes right away.'
  practice: Reread this lesson aloud the next day before starting a new one. Read the new words in any order until they come quickly.
  tip: Mamma uses her hand and the lamp to show that dark is only a shadow. You can do the same thing with a flashlight.
