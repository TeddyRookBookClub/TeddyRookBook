book:
  id: mcguffeyseclecti02mcgu
  title: McGuffey's Second Eclectic Reader, Revised Edition
  year: 1879 (revised edition)
  key: mcg-second
  short: Second Reader
  eyebrow: McGuffey's Readers · Second Reader · revised edition
  hero: 71 reading lessons of stories, poems and letters, from "Evening at Home" to Tennyson's "Lullaby", for children about 7 and 8 who can read simple sentences. Every lesson has a guide you can follow step by step, with the right page of the book beside it.
  how:
  - <b>A little, often.</b> About 15 to 20 minutes a day. Many lessons here run three or four pages. It is fine to read half one day and finish the next.
  - <b>Words first.</b> Each lesson starts with a list of new words. Read them together before the story, and clap the parts of the long ones.
  - <b>Talk and tell back.</b> Ask a few questions, then let your child tell the story in their own words. This is where understanding grows.
  - <b>Poems out loud.</b> Many of the lessons are poems. Read them slowly, listen for the rhymes, and let your child learn a favorite verse by heart.
  - <b>Script lessons.</b> Several lessons are printed in handwriting (script). Read them together at first, then use them for copywork on a slate or paper.
  - <b>Old words.</b> The book is from 1879. Explain old words like thou, thee and boot-black simply, and move on.
  unitword: Part
units:
- id: 1
  name: Home, play and pets
  from: 1
  to: 10
  text: A winter evening, soap bubbles, a letter to Santa Claus, two dogs, a cat and her kittens, and a boy who works after play.
- id: 2
  name: Sunbeams and kind hearts
  from: 11
  to: 20
  text: Susie Sunbeam, Henry the boot-black, a kind brother, the brave kingbird, an evening hymn and a quarrel over a nut.
- id: 3
  name: Bees, sheep and squirrels
  from: 21
  to: 30
  text: Nature lessons on bees and sheep-shearing, poems about clouds, a sparrow and a little rill, and two stories with a lesson inside.
- id: 4
  name: Letters, tigers and a faithful dog
  from: 31
  to: 40
  text: Mary's letter in script, the tiger, a happy fireside, the two-part story of Willie and Bounce, and a tame bear in the attic.
- id: 5
  name: Leaves, hawks and wintry fun
  from: 41
  to: 51
  text: The fish-hawk, a leaf in autumn, a Christmas joke, a day at the beach, sledding, a clever fox, and Peter Pindar's dog story.
- id: 6
  name: Owls, old men and honest boys
  from: 52
  to: 61
  text: The two-part owl story, grandfather's strange fish, a good old man, the greedy girl, a place for everything, and the broken window.
- id: 7
  name: From the hour-glass to the lullaby
  from: 62
  to: 71
  text: An hourglass, a horse named Fanny, poor Davy, Alice's supper, a snowstorm, Bessie's wild-flower garden, and a closing lullaby.
lessons:
- num: 1
  roman: I
  idx: 14
  unit: 1
  title: Evening at Home
  mins: 15
  goal: Your child reads the new words and the story of the Browns' winter evening, and tells what each person in the family does.
  materials:
  - The book, open to this lesson
  - A slate, small whiteboard or lined paper and a pencil
  book: Twenty new words, then a short story in seven numbered paragraphs about the Brown family's cozy winter evening at home.
  steps:
  - - Get ready
    - 'Sit side by side with the book open to Lesson I. Look through a few pages together.

      Say: This is your new reader. The stories are longer now, and some of the lessons are poems.

      Talk about the picture on the page before you start reading.'
  - - New words
    - 'Point to the new words at the top of the lesson:

      ~ newspaper   cold   order   seem   through   stockings   chat   story   light   Harry   branches   kiss   burns   Mrs.   events   another   Mr.   stool   lamp   mends

      Say each word and have your child say it after you. Clap the parts of long words. Then point to words in any order and let your child read them.'
  - - Read it aloud
    - 'Look at the picture together first, if there is one. Then your child reads the lesson aloud, one paragraph at a time. Help with any word by pointing to it in the word list.

      Here are a few lines from it:

      ~ It is winter.

      ~ The cold wind whistles through the branches of the trees.

      Read it a second time, more smoothly.'
  - - Talk about it
    - 'Say: Who is in the Brown family?

      Say: What do Mr. and Mrs. Brown do after tea? What do Harry and Kate do?

      Say: Why do Harry and Kate feel happy tonight?

      Say: What does our family like to do on a cold evening?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me about the Browns'' evening, from the cold wind outside to bedtime.

      Let your child talk without stopping them. Afterward, help with anything left out by asking "What happened next?"'
  - - Copywork
    - 'Write this line from the lesson for your child to copy, or let them copy it straight from the book:

      ~ They learned their lessons well to-day, and both feel happy.

      Check capital letters, commas and the mark at the end.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: cold, lamp, light, story, kiss.

      Check together and fix any mistakes right away.'
  practice: Reread this lesson aloud the next day before starting a new one. Read the new words in any order until they come quickly.
  tip: This book's lessons are longer than the First Reader's. If a whole lesson is too much at first, read half today and half tomorrow.
- num: 2
  roman: II
  idx: 16
  unit: 1
  title: Bubbles
  mins: 15
  goal: Your child reads the bubble story with expression, including the boys' talk and laughter.
  materials:
  - The book, open to this lesson
  - A slate, small whiteboard or lined paper and a pencil
  - A little bubble soap and a straw or wand, for after the lesson (optional)
  book: New words, then a merry story about Robert, Willie and Harry blowing soap bubbles on the porch while the old cat sleeps.
  steps:
  - - Warm up
    - 'Have your child reread a few lines of Lesson I, for example:

      ~ It is winter.

      Praise smooth reading and help with any word that sticks.'
  - - New words
    - 'Point to the new words at the top of the lesson:

      ~ beautiful   porch   rainbow   burst   bubbling   same   biggest   sneeze   colors   mine   soap   wash   red   many

      Say each word and have your child say it after you. Clap the parts of long words. Then point to words in any order and let your child read them.'
  - - Read it aloud
    - 'Look at the picture together first, if there is one. Then your child reads the lesson aloud, one paragraph at a time. Help with any word by pointing to it in the word list.

      Here are a few lines from it:

      ~ The boys have come out on the porch to blow bubbles.

      ~ "Ha! ha!" laughs Robert, as a bubble comes down softly on the old cat''s back, and does not burst.

      Read it a second time, more smoothly.'
  - - Talk about it
    - 'Say: Who is blowing bubbles?

      Say: What happened when Willie''s bubble came down on the cat''s face?

      Say: What can Willie see in his bubble?

      Say: What does Harry say about the colors in a bubble?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what happened on the porch, and what the old cat did.

      Let your child talk without stopping them. Afterward, help with anything left out by asking "What happened next?"'
  - - Copywork
    - 'Write this line from the lesson for your child to copy, or let them copy it straight from the book:

      ~ The old cat is asleep on the mat by the door.

      Check capital letters, commas and the mark at the end.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: soap, wash, red, same, burst.

      Check together and fix any mistakes right away.'
  practice: Reread this lesson aloud the next day before starting a new one. Read the new words in any order until they come quickly.
  tip: Blow some bubbles after the lesson and look for the colors Harry talks about.
- num: 3
  roman: III
  idx: 17
  unit: 1
  title: Willie's Letter
  mins: 15
  goal: 'Your child reads a letter written in script and notices the parts of a letter: date, greeting, body and signature.'
  materials:
  - The book, open to this lesson
  - A slate, small whiteboard or lined paper and a pencil
  book: A short word list, then Willie's whole letter to Santa Claus, printed in script (handwriting).
  steps:
  - - Warm up
    - 'Have your child reread a few lines of Lesson II, for example:

      ~ The boys have come out on the porch to blow bubbles.

      Praise smooth reading and help with any word that sticks.'
  - - New words
    - 'Point to the new words at the top of the lesson:

      ~ rubber   gun   parlor   street   number   ten   o''clock   shoot

      Say each word and have your child say it after you. Clap the parts of long words. Then point to words in any order and let your child read them.'
  - - Read it aloud
    - 'This lesson is printed in script (handwriting). Read the first lines aloud while your child follows with a finger, then your child reads the whole letter aloud. Help with any letter shapes that are new.

      Here are a few lines from it:

      ~ Dear Santa Claus:

      ~ I will go to bed at eight o''clock, and shut my eyes tight.

      Read it a second time, more smoothly.'
  - - Talk about it
    - 'Say: Who wrote this letter, and who is it for?

      Say: What does Willie ask for?

      Say: What does Willie promise to do on Christmas Eve?

      Say: Where does Willie live? How would you write where you live?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what Willie wrote in his letter, in your own words.

      Let your child talk without stopping them. Afterward, help with anything left out by asking "What happened next?"'
  - - Copywork
    - 'Write this script line for your child to copy, or let them copy it straight from the book:

      ~ I live on Fourth St., number ten.

      Check capital letters, commas and the mark at the end.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: ten, gun, street, number.

      Check together and fix any mistakes right away.'
  practice: Reread this lesson aloud the next day before starting a new one. Read the new words in any order until they come quickly.
  tip: Point out the date at the top, the greeting, and how Willie signs his name at the end. Your child might write a short letter of their own to a grandparent.
- num: 4
  roman: IV
  idx: 19
  unit: 1
  title: The Little Star
  mins: 15
  goal: Your child reads the whole star poem smoothly and hears the rhymes at the ends of the lines.
  materials:
  - The book, open to this lesson
  - A slate, small whiteboard or lined paper and a pencil
  book: New words, then the poem "Twinkle, twinkle, little star" in four verses, with more verses than most people know.
  steps:
  - - Warm up
    - 'Have your child reread a few lines of Lesson III, for example:

      ~ Dear Santa Claus:

      Praise smooth reading and help with any word that sticks.'
  - - New words
    - 'Point to the new words at the top of the lesson:

      ~ above   world   dark   oft   never   spark   dew   till   diamond   twinkle   blazing

      Say each word and have your child say it after you. Clap the parts of long words. Then point to words in any order and let your child read them.'
  - - Read it aloud
    - 'Look at the page together first. Then your child reads the poem aloud, a line at a time. Pause a little at the end of each line.

      Here are a few lines from it:

      ~ Twinkle, twinkle, little star;

      ~ How I wonder what you are!

      Read it a second time, more smoothly.'
  - - Talk about it
    - 'Say: What does the child in the poem wonder about?

      Say: Where is the star? What is it like?

      Say: How does the star help people on a dark night?

      Say: Listen for rhymes: star and are. Can you find more rhyming words in the poem?

      Let your child look back at the page to find answers.'
  - - Tell it back
    - 'Close the book.

      Say: Tell me what the poem says about the little star. You can sing the first verse, too.

      Let your child talk without stopping them. Afterward, help with anything left out by asking "What happened next?"'
  - - Copywork
    - 'Write this lines from the lesson for your child to copy, or let them copy it straight from the book:

      ~ Twinkle, twinkle, little star;

      ~ How I wonder what you are!

      Check capital letters, commas and the mark at the end.'
  - - Spelling
    - 'Say each word, use it in a short sentence, and have your child spell it aloud, then write it: star, dark, never, world.

      Check together and fix any mistakes right away.'
  practice: Reread the poem aloud each day for a few days. Your child may like to learn a verse by heart.
  tip: Your child probably knows the first verse as a song. Singing it is fine, but also have them read every verse from the page.
