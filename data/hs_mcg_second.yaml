      ~ spiders   tickling   stay   neck   nose   secret   crawls   legs   beck   ope   goes   toes   speck   choose   dot   nod   shoes   spread   believe   six

      Say each word and have your child say it after you. Clap the parts of long words. Then point to words in any order and let your child read them.'
  - - Read it aloud
