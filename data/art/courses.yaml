# Art & Drawing Ladder courses, bottom rung to top rung (the order of this list is the ladder).
# Built by /tmp/work_art/build_topics.py from topics_<key>.py (edit those, then rebuild). Design notes: /tmp/work_art/overview.md.
# Drawing for Young Artists is self-contained; Drawing Basics borrows two ratio topics from the Math Ladder.
- key: ydraw
  slug: "young-artists"
  title: "Drawing for Young Artists"
  short: "Young Artists"
  band: "Elementary"
  grade: "K–3"
  icon: "🖍️"
  color: "#c2491d"
  blurb: "For ages 5 to 9, with a grown-up: lines and shapes, drawing animals and things from shapes, colors and mixing, patterns, faces and feelings, using the whole page, and looking closely."
  after: []
- key: draw
  slug: "drawing-basics"
  title: "Drawing Basics"
  short: "Drawing Basics"
  band: "Middle school"
  grade: "5–12"
  icon: "✏️"
  color: "#4f5b69"
  blurb: "For age 10 to adult: pencils and paper, contour and gesture, forms, value and shading, light and shadow, measuring, one-, two- and three-point perspective, composition, faces, hands and figures, with a drawing pad and printable practice sheets."
  after: [ydraw]
- key: design
  slug: "color-and-design"
  title: "Color and Design"
  short: "Color and Design"
  band: "High school"
  grade: "7–12"
  icon: "🎨"
  color: "#2a6db0"
  blurb: "For age 12 to adult: the elements of art and the principles of design, hue, value and saturation, the color wheel and its schemes, mixing paint versus mixing light, and how to analyze a composition."
  after: [draw]
- key: ah1
  slug: "art-history-1"
  title: "Art History I: Prehistoric to Renaissance"
  short: "Art History I"
  band: "High school"
  grade: "10–12"
  icon: "🏛️"
  color: "#8a6512"
  blurb: "A high school and college survey from the cave painters to Bruegel: how to look at a work, Egypt, Greece and Rome, Byzantine and Islamic art, Gothic cathedrals, art of Asia, Africa and the Americas, and the Renaissance."
  after: [design]
- key: ah2
  slug: "art-history-2"
  title: "Art History II: Baroque to Modern"
  short: "Art History II"
  band: "College"
  grade: "College"
  icon: "🖼️"
  color: "#a3306f"
  blurb: "From Caravaggio to mid-century modern: Baroque and Dutch painting, Neoclassicism, Romanticism and Realism, Impressionism, Japanese prints, Mughal and Ottoman art, African and Native American arts, and the modern movements."
  after: [ah1]
