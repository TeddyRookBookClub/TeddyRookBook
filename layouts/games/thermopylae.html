{{ define "main" }}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ "games/thermopylae/game.css" | relURL }}?v={{ (partialCached "fv.html" "static/games/thermopylae/game.css" "static/games/thermopylae/game.css") }}">
{{ partial "game-shell.html" . }}
<div class="gwrap"><div class="gbar"><a href="{{ "games/" | relURL }}">‹ All games</a><span>{{ .Title }}</span></div><div class="th gbox" id="th"><noscript>This game needs JavaScript.</noscript></div></div>
<p style="font-size:.8rem;color:var(--secondary);margin-top:.5rem">Mouse: aim and hold to throw. Keyboard: ← → turn, Space throws, P pauses. Phone: touch where you want to throw.</p>
<script src="{{ "js/words.js" | relURL }}?v={{ (partialCached "fv.html" "static/js/words.js" "static/js/words.js") }}"></script>
<script src="{{ "js/translit.js" | relURL }}?v={{ (partialCached "fv.html" "static/js/translit.js" "static/js/translit.js") }}"></script>
<script src="{{ "games/thermopylae/game.js" | relURL }}?v={{ (partialCached "fv.html" "static/games/thermopylae/game.js" "static/games/thermopylae/game.js") }}"></script>
{{ end }}
