{{ define "main" }}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap">
<link rel="stylesheet" href="{{ "games/board/board.css" | relURL }}?v={{ (partialCached "fv.html" "static/games/board/board.css" "static/games/board/board.css") }}">
<link rel="stylesheet" href="{{ "games/daily/daily.css" | relURL }}?v={{ (partialCached "fv.html" "static/games/daily/daily.css" "static/games/daily/daily.css") }}">
{{ partial "game-shell.html" . }}
<div class="gwrap"><div class="gbar"><a href="{{ "games/" | relURL }}">‹ All games</a><span>{{ .Title }}</span></div><div class="bg gbox" id="daily" data-src="{{ "games/daily/words.json" | relURL }}?v={{ (partialCached "fv.html" "static/games/daily/words.json" "static/games/daily/words.json") }}"><noscript>This game needs JavaScript.</noscript></div></div>
<script src="{{ "js/words.js" | relURL }}?v={{ (partialCached "fv.html" "static/js/words.js" "static/js/words.js") }}"></script>
<script src="{{ "games/daily/daily.js" | relURL }}?v={{ (partialCached "fv.html" "static/games/daily/daily.js" "static/games/daily/daily.js") }}"></script>
{{ end }}
