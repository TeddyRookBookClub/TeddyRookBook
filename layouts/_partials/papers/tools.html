<div class="pp-tools hs-noprint" role="toolbar" aria-label="Reading tools">
  <button type="button" class="hs-btn" data-pp="smaller" aria-label="Smaller text">A−</button>
  <button type="button" class="hs-btn" data-pp="larger" aria-label="Larger text">A+</button>
  <button type="button" class="hs-btn" data-pp="hl" id="pp-hl" aria-pressed="false" title="Turn on, then tap paragraphs to highlight them. Highlights stay in this browser.">Highlight</button>
  <button type="button" class="hs-btn ghost" data-pp="clear">Clear</button>
  <span class="pp-small" id="pp-hlcount" aria-live="polite"></span>
  <span class="sp"></span>
  <button type="button" class="hs-btn" data-pp="print">Print</button>
</div>
