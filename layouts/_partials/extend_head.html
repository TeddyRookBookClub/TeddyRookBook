{{- /* Text size: applied before the page paints so there is no jump. Set by the Aa button in the header. */ -}}
<script>(function(){try{var f=parseFloat(localStorage.getItem('trb-fs'));if(f>0.7&&f<1.8)document.documentElement.style.setProperty('--fs',f)}catch(e){}})();</script>
<style>
html{font-size:calc(16px * var(--fs,1))}
body{font-size:calc(18px * var(--fs,1))}
.trb-fs{position:relative;display:inline-flex;margin-left:.6rem}
.trb-fs-btn{background:none;border:0;cursor:pointer;color:var(--primary);font:700 15px/1 system-ui,sans-serif;padding:4px 6px;border-radius:6px}
.trb-fs-btn:hover{background:var(--tertiary)}
.trb-fs-pop{position:absolute;top:130%;left:50%;transform:translateX(-50%);z-index:200;background:var(--entry);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:.45rem;display:flex;align-items:center;gap:.35rem;white-space:nowrap;font:14px system-ui,sans-serif}
.trb-fs-pop[hidden]{display:none}
@media (max-width:700px){.trb-fs-pop{left:auto;right:-40px;transform:none}}
.trb-fs-pop button{border:1px solid var(--border);background:var(--theme);color:var(--primary);border-radius:8px;min-width:34px;height:32px;cursor:pointer;font:600 14px system-ui,sans-serif}
.trb-fs-pop button:hover{border-color:#004225}
.trb-fs-pop output{min-width:3.2em;text-align:center;color:var(--secondary);font-variant-numeric:tabular-nums}
</style>
<style>
/* phones: keep the whole menu on screen */
@media (max-width:520px){
  .nav{flex-wrap:wrap;line-height:1.2}
  .logo a{font-size:20px}
  #menu{overflow-x:visible;flex-wrap:wrap;white-space:normal;margin:0;row-gap:0}
  #menu li+li{margin-inline-start:12px}
  #menu a{font-size:14px;line-height:2.2}
  .logo,#menu{margin:0}
}
</style>
<style>
/* British racing green is the site's main colour: the header band everywhere, and a green-black page in dark mode. */
:root{--brg:#004225}
header.header{background:#004225}
header.header .logo a,header.header #menu a,header.header .trb-fs-btn,header.header #theme-toggle{color:#f3ead2}
header.header #menu .active{border-bottom-color:#d8b860}
header.header .trb-fs-btn:hover{background:rgba(255,255,255,.14)}
:root[data-theme="dark"]{--theme:#0b1a13;--entry:#12261b;--primary:#e6ece8;--secondary:#a9b8af;--tertiary:#1b3426;--content:#dfe7e2;--code-block-bg:#12261b;--code-bg:#1b3426;--border:#2a4636}
[data-theme="dark"] .list{background:var(--theme)}
[data-theme="dark"] header.header{background:#00331c;border-bottom:1px solid #1f4a35}
</style>
<style>
/* "More" menu */
#menu .trb-more{position:relative}
#menu .trb-more details{position:relative}
#menu .trb-more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem;color:#f3ead2;font-size:16px;line-height:var(--header-height,60px)}
#menu .trb-more summary::-webkit-details-marker{display:none}
#menu .trb-more summary .active{border-bottom:2px solid #d8b860}
#menu .trb-more details[open] summary svg{transform:rotate(180deg)}
#menu .trb-more ul{position:absolute;right:0;top:calc(100% - 6px);z-index:300;min-width:250px;margin:0;padding:.35rem;list-style:none;background:var(--entry);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:block}
#menu .trb-more ul li{margin:0 !important;display:block}
#menu .trb-more ul a{display:block;padding:.45rem .65rem;border-radius:8px;line-height:1.25 !important;color:var(--primary) !important;font-size:15px !important}
#menu .trb-more ul a:hover,#menu .trb-more ul a[aria-current]{background:var(--tertiary)}
#menu .trb-more ul b{display:block;font-weight:600}
#menu .trb-more ul small{display:block;color:var(--secondary);font-size:12.5px;margin-top:1px}
#menu{overflow:visible !important}
@media (max-width:700px){#menu{position:relative}#menu .trb-more,#menu .trb-more details{position:static}#menu .trb-more ul{left:0;right:0;top:100%;min-width:0}}
@media (max-width:520px){#menu .trb-more summary{font-size:14px;line-height:2.2}}
.trb-sbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
/* search */
.trb-sbtn{background:none;border:0;cursor:pointer;color:#f3ead2;padding:4px 6px;border-radius:6px;margin-left:.35rem;display:inline-flex;align-items:center}
.trb-sbtn:hover{background:rgba(255,255,255,.14)}
.trb-sbtn svg{width:18px;height:18px}
.trb-search{position:fixed;inset:0;z-index:900;background:rgba(5,15,10,.55);display:flex;justify-content:center;align-items:flex-start;padding:8vh 12px 12px}
.trb-search[hidden]{display:none}
.trb-sbox{width:min(680px,100%);max-height:80vh;display:flex;flex-direction:column;background:var(--theme);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.trb-sbox form{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border-bottom:1px solid var(--border)}
.trb-sbox input{flex:1;font:inherit;font-size:1.05rem;border:0;background:transparent;color:var(--primary);outline:none;padding:.35rem 0}
.trb-sbox kbd{font:12px system-ui;border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--secondary)}
.trb-sclose{background:none;border:0;font-size:1.4rem;color:var(--secondary);cursor:pointer;line-height:1}
.trb-sres{overflow:auto;padding:.3rem;margin:0;list-style:none}
.trb-sres li a{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border-radius:9px;color:var(--primary);text-decoration:none;box-shadow:none}
.trb-sres li a:hover,.trb-sres li a.sel{background:var(--tertiary)}
.trb-sres .k{flex:none;font:600 11px system-ui;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:#004225;border-radius:5px;padding:2px 6px;margin-top:3px}
.trb-sres .k.Game{background:#8c1d2c}.trb-sres .k.Languages{background:#1f5fa8}.trb-sres .k.Infographic{background:#b07a1a}.trb-sres .k.Markets{background:#4a5560}.trb-sres .k.Timeline{background:#6b4a2a}
.trb-sres b{display:block;font-weight:600;line-height:1.3}
.trb-sres small{display:block;color:var(--secondary);font-size:.83rem;line-height:1.35;margin-top:2px}
.trb-sres mark{background:#f3dfa3;color:inherit;border-radius:2px}
.trb-snote{padding:.8rem 1rem;color:var(--secondary);font-size:.9rem}
[data-theme="dark"] .trb-sres mark{background:#5a4a1a}
/* honour "reduce motion" across the site */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
