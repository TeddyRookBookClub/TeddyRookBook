{{- /* A paper revision date: shows the date, keeps the UTC commit time from data/rhythm/revisions.yaml in the datetime attribute. Pass the date string (YYYY-MM-DD). */ -}}

<time datetime="{{ $t }}">{{ $d }}</time>
