{{- /* Phonics Practice scripts: the data (one cached file built from data/phonics.json), the checker, the app. */ -}}
{{- $data := printf "window.PHONICS=%s;" (site.Data.phonics | jsonify) | resources.FromString "homeschool/phonics/data.js" | minify | fingerprint "md5" -}}
<script src="{{ $data.RelPermalink }}" defer></script>
<script src="{{ "homeschool/phonics/decode.js" | relURL }}?v={{ (partialCached "fv.html" "static/homeschool/phonics/decode.js" "static/homeschool/phonics/decode.js") }}" defer></script>
<script src="{{ "homeschool/phonics/phonics.js" | relURL }}?v={{ (partialCached "fv.html" "static/homeschool/phonics/phonics.js" "static/homeschool/phonics/phonics.js") }}" defer></script>
