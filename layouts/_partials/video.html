{{- /* A YouTube video as a click-to-play card. Context: the video id (a key in data/videos.yaml). Nothing loads from YouTube until it is pressed, and then only from youtube-nocookie.com. */ -}}
{{- $id := . }}{{ $v := index site.Data.videos $id | default dict -}}
<figure class="trb-video">
  <button type="button" class="trb-video-play" data-yt="{{ $id }}" aria-label="Play the video: {{ $v.title }}">
    <img src="https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg" alt="" loading="lazy" width="480" height="360">
    <span class="trb-video-btn" aria-hidden="true"><svg viewBox="0 0 68 48" width="68" height="48"><path d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2 0 34 0 34 0S12.8 0 7.5 1.7a8.6 8.6 0 0 0-6 6C0 13 0 24 0 24s0 11 1.5 16.3a8.6 8.6 0 0 0 6 6C12.8 48 34 48 34 48s21.2 0 26.5-1.7a8.6 8.6 0 0 0 6-6C68 35 68 24 68 24s0-11-1.5-16.3z" fill="#004225"/><path d="M27 34V14l18 10z" fill="#fff"/></svg></span>
  </button>
  <figcaption><b>▶ {{ $v.title }}</b>{{ with $v.about }} <span>{{ . }}</span>{{ end }}</figcaption>
</figure>
